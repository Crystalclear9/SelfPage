<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><rect width="1200.0" height="760" fill="white" /><title>未覆盖区域把风险识别从单点变成一个区间</title><rect width="1200" height="620" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#17324d"><text x="40" y="55" font-size="29">未覆盖区域把风险识别从单点变成一个区间</text><text x="70" y="120" font-size="23">目标总体：覆盖区域质量 0.7；未覆盖区域质量 0.3；损失限制在 [0,1]</text><line x1="120" y1="360" x2="1100" y2="360" stroke="#64748b" stroke-width="3" /><rect x="120" y="230" width="274.4" height="90" fill="#caeae7" stroke="#079b91" /><rect x="394.4" y="230" width="588" height="90" fill="#fce5d3" stroke="#ef8b3a" /><text x="255" y="280" font-size="22" text-anchor="middle">已识别贡献 0.14</text><text x="688" y="280" font-size="22" text-anchor="middle">未知贡献在 0 到 0.30 之间</text><text x="120" y="400" font-size="21" text-anchor="middle">0</text><text x="394.4" y="400" font-size="21" text-anchor="middle">0.14 下界</text><text x="982.4" y="400" font-size="21" text-anchor="middle">0.44 上界</text><text x="1100" y="435" font-size="21" text-anchor="end">总体风险（横轴范围 0 到 0.5）</text><text x="80" y="500" font-size="24">已覆盖区域条件风险 0.2 → 总体贡献 0.7×0.2=0.14</text><text x="80" y="545" font-size="23">没有额外假设，离线证据无法在这个区间内进一步区分。</text><text x="40" y="590" font-size="18" fill="#64748b">原创手算示意 · 有界损失与覆盖质量是明确假设，不是通用离线保证。</text></g></svg>

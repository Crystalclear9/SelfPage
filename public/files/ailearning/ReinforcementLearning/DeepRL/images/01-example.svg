<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">优先回放：抽样身份、校正权重与整体尺度</title>
  <desc id="desc">两条记录按0.8和0.2抽样，完整重要性权重恢复均匀期望；统一除以最大权重改变整体尺度。</desc>
  <rect width="1200" height="720" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">优先回放：抽样身份、校正权重与整体尺度</text>
    <text x="35" y="100" font-size="26" fill="#213447" font-weight="400" text-anchor="start">两条固定记录：L(A) = 1，L(B) = 4；目标是均匀平均</text>
    <text x="35" y="150" font-size="25" fill="#213447" font-weight="600" text-anchor="start">实际抽样概率</text>
    <text x="510" y="150" font-size="25" fill="#213447" font-weight="600" text-anchor="start">完整权重</text>
    <text x="810" y="150" font-size="25" fill="#213447" font-weight="600" text-anchor="start">抽样后的期望贡献</text>
    <text x="35" y="230" font-size="28" fill="#2865a0" font-weight="600" text-anchor="start">A</text>
    <rect x="90" y="205" width="240.0" height="36" fill="#2865a0" />
    <text x="410" y="232" font-size="26" fill="#2865a0" font-weight="400" text-anchor="end">0.8</text>
    <path d="M440,222 L492,222" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="575" y="232" font-size="28" fill="#cf7432" font-weight="400" text-anchor="middle">0.625</text>
    <path d="M665,222 L760,222" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="800" y="232" font-size="26" fill="#213447" font-weight="400" text-anchor="start">0.8 × 0.625 × 1 = 0.5</text>
    <text x="35" y="335" font-size="28" fill="#2865a0" font-weight="600" text-anchor="start">B</text>
    <rect x="90" y="310" width="60.0" height="36" fill="#2865a0" />
    <text x="410" y="337" font-size="26" fill="#2865a0" font-weight="400" text-anchor="end">0.2</text>
    <path d="M440,327 L492,327" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="575" y="337" font-size="28" fill="#cf7432" font-weight="400" text-anchor="middle">2.5</text>
    <path d="M665,327 L760,327" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="800" y="337" font-size="26" fill="#213447" font-weight="400" text-anchor="start">0.2 × 2.5 × 4 = 2</text>
    <line x1="35" y1="375" x2="1165" y2="375" stroke="#cad7e2" stroke-width="2" />
    <text x="35" y="421" font-size="26" fill="#213447" font-weight="600" text-anchor="start">对同一组损失，比较四种计算</text>
    <line x1="120" y1="608.0" x2="1070" y2="608.0" stroke="#cad7e2" stroke-width="1" />
    <text x="108" y="615.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0</text>
    <line x1="120" y1="554.4285714285714" x2="1070" y2="554.4285714285714" stroke="#cad7e2" stroke-width="1" />
    <text x="108" y="561.4285714285714" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">1</text>
    <line x1="120" y1="500.8571428571429" x2="1070" y2="500.8571428571429" stroke="#cad7e2" stroke-width="1" />
    <text x="108" y="507.8571428571429" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">2</text>
    <line x1="120" y1="608" x2="1070" y2="608" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="120" y1="458" x2="120" y2="608" stroke="#5a6c7d" stroke-width="1.4" />
    <rect x="179.375" y="474.07142857142856" width="118.75" height="133.92857142857144" fill="#2865a0" />
    <text x="238.75" y="464.07142857142856" font-size="26" fill="#2865a0" font-weight="400" text-anchor="middle">2.5</text>
    <text x="238.75" y="648" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">目标均值</text>
    <rect x="416.875" y="522.2857142857142" width="118.75" height="85.71428571428578" fill="#cf7432" />
    <text x="476.25" y="512.2857142857142" font-size="26" fill="#cf7432" font-weight="400" text-anchor="middle">1.6</text>
    <text x="476.25" y="648" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">不校正</text>
    <rect x="654.375" y="474.07142857142856" width="118.75" height="133.92857142857144" fill="#2865a0" />
    <text x="713.75" y="464.07142857142856" font-size="26" fill="#2865a0" font-weight="400" text-anchor="middle">2.5</text>
    <text x="713.75" y="648" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">完整校正</text>
    <rect x="891.875" y="554.4285714285714" width="118.75" height="53.571428571428555" fill="#cf7432" />
    <text x="951.25" y="544.4285714285714" font-size="26" fill="#cf7432" font-weight="400" text-anchor="middle">1</text>
    <text x="951.25" y="648" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">再除最大权重</text>
    <text x="35" y="700" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="start">最大权重 = 2.5；统一除以它保留相对权重，但改变整体尺度</text>
  </g>
</svg>

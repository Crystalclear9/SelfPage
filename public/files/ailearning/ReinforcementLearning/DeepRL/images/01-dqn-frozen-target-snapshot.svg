<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="614" viewBox="0 0 1350 614" role="img" aria-labelledby="title desc"><title id="title">自举目标来自另一份参数快照</title><desc id="desc">在线参数接收损失梯度。冻结目标参数计算下一状态动作最大值；真正终止时该项为零。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="614" fill="white" stroke="none" stroke-width="1.55"/><polygon points="73,210.5 278,210.5 311,139.5 106,139.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="192" y="184.86" fill="#196f77" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">当前状态、动作</text><line x1="326" y1="175" x2="462" y2="175" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="486.5,214 734.5,214 767.5,136 519.5,136" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="627" y="185.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">在线估值</text><line x1="786" y1="175" x2="1082" y2="260" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="73,428.5 278,428.5 311,357.5 106,357.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="192" y="402.86" fill="#655184" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">下一状态</text><line x1="326" y1="393" x2="462" y2="393" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="486.5,432 734.5,432 767.5,354 519.5,354" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="627" y="403.2" fill="#655184" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">目标网络取最大</text><line x1="786" y1="393" x2="1082" y2="296" stroke="#655184" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="1092,315 1257,315 1290,239 1125,239" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="1191" y="287.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">训练损失</text><path d="M 1190 228 Q 917 77 635 122" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-coral)"/><line x1="605" y1="229" x2="605" y2="340" stroke="#655184" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-violet)" stroke-dasharray="6 6"/><text x="629" y="286" fill="#655184" font-size="26" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">偶尔复制参数</text><text x="665" y="563" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">目标加当前奖励与折扣，终止时去掉尾值</text></svg>
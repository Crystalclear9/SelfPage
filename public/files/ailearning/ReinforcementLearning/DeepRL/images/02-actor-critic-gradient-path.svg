<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Actor 更新：固定 Critic 参数，保留动作导数</title><desc id="desc">Actor 更新：固定 Critic 参数，保留动作导数</desc><rect width="1200" height="570" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">Actor 更新：固定 Critic 参数，保留动作导数</text><rect x="35" y="150" width="165" height="72" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" /><text x="117.5" y="194.0" font-size="24" fill="#2865a0" font-weight="500" text-anchor="middle">s = 2</text><rect x="35" y="282" width="165" height="72" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" /><text x="117.5" y="326.0" font-size="24" fill="#2865a0" font-weight="500" text-anchor="middle">θ = 0.25</text><path d="M212,190 L312,221" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" /><path d="M212,319 L312,252" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" /><rect x="330" y="182" width="205" height="108" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" /><text x="432" y="222" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">Actor：θ × s</text><text x="432" y="264" font-size="28" fill="#2865a0" font-weight="600" text-anchor="middle">a = 0.5</text><path d="M550,234 L665,234" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" /><rect x="685" y="182" width="240" height="108" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" /><text x="805" y="220" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">Q(a) = −(a−1)²</text><text x="805" y="265" font-size="28" fill="#2865a0" font-weight="600" text-anchor="middle">Q = −0.25</text><rect x="982" y="91" width="190" height="64" rx="5" fill="#fff0e3" stroke="#cf7432" stroke-width="1.2" /><text x="1077.0" y="131.0" font-size="25" fill="#cf7432" font-weight="500" text-anchor="middle">φ 固定</text><line x1="1075" y1="160" x2="924" y2="210" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="5 6" /><text x="35" y="100" font-size="27" fill="#213447" font-weight="600" text-anchor="start">前向计算</text><text x="35" y="431" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">回传到 θ</text><path d="M909,421 L676,421" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" /><text x="772" y="394" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">动作导数 = 1</text><path d="M646,421 L338,421" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" /><text x="483" y="394" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">Actor 局部导数 = 2</text><text x="335" y="505" font-size="29" fill="#213447" font-weight="600" text-anchor="start">对 θ 的代理目标梯度 = 1 × 2 = 2</text></g></svg>

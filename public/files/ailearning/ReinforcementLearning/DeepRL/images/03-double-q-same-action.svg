<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="598" viewBox="0 0 1360 598" role="img" aria-labelledby="label detail"><title id="label">选择动作与评价动作分离</title><desc id="detail">在线向量 (3,2) 选动作 0。目标向量 (1,4) 读取同一动作得到 1，而不是重新取最大值 4。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="598" fill="white" stroke="none" stroke-width="1.6"/><text x="320" y="67" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">在线分支选动作</text><text x="1046" y="67" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">目标分支评估同一动作</text><polygon points="147,296 247,296 276,215 176,215" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><text x="211.5" y="269.54" fill="#196f77" font-size="39" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">3</text><text x="210" y="176" fill="#196f77" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">动作 0</text><circle cx="210" cy="345" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><polygon points="298,296 398,296 427,215 327,215" stroke="#657682" fill="url(#wash-gray)" stroke-width="1.65" stroke-linejoin="round"/><text x="362.5" y="269.54" fill="#657682" font-size="39" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">2</text><text x="361" y="176" fill="#657682" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">动作 1</text><polygon points="867,296 967,296 996,215 896,215" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.65" stroke-linejoin="round"/><text x="931.5" y="269.54" fill="#655184" font-size="39" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">1</text><text x="930" y="176" fill="#655184" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">动作 0</text><circle cx="930" cy="345" r="7" stroke="#655184" fill="#655184" stroke-width="1.75"/><polygon points="1018,296 1118,296 1147,215 1047,215" stroke="#657682" fill="url(#wash-gray)" stroke-width="1.65" stroke-linejoin="round"/><text x="1082.5" y="269.54" fill="#657682" font-size="39" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">4</text><text x="1081" y="176" fill="#657682" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">动作 1</text><line x1="232" y1="373" x2="902" y2="373" stroke="#196f77" stroke-width="2.35" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="571" y="426" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">传递动作身份 0</text><text x="1075" y="474" fill="#655184" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">读取 1，不再次取最大值</text></svg>
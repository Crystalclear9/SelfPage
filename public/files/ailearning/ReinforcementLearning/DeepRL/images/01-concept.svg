xt><line x1="788" y1="140" x2="788" y2="575" stroke="#dce7e9" stroke-width="1" stroke-dasharray="6 6"/><text x="788" y="620" font-size="24" fill="#183944" text-anchor="middle">12</text><line x1="950" y1="140" x2="950" y2="575" stroke="#dce7e9" stroke-width="1" stroke-dasharray="6 6"/><text x="950" y="620" font-size="24" fill="#183944" text-anchor="middle">15</text><line x1="1112" y1="140" x2="1112" y2="575" stroke="#dce7e9" stroke-width="1" stroke-dasharray="6 6"/><text x="1112" y="620" font-size="24" fill="#183944" text-anchor="middle">18</text><text x="1130" y="660" font-size="26" fill="#183944" text-anchor="end">已完成的在线更新数</text><line x1="90" y1="715" x2="145" y2="715" stroke="#246b82" stroke-width="5" stroke-dasharray=""/><text x="160" y="725" font-size="25" fill="#246b82" text-anchor="start">在线 q</text><line x1="380" y1="715" x2="435" y2="715" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><text x="450" y="725" font-size="25" fill="#c0673e" text-anchor="start">冻结预测 q_target</text><line x1="820" y1="715" x2="875" y2="715" stroke="#71858b" stroke-width="5" stroke-dasharray=""/><text x="890" y="725" font-size="25" fill="#71858b" text-anchor="start">回归标签 1 + 0.9 q_target</text><text x="70" y="785" font-size="27" fill="#183944" text-anchor="start">第一段：q = 0 → 0.5 → 0.75 → 0.875，始终拟合标签 1</text><text x="70" y="835" font-size="27" fill="#183944" text-anchor="start">第 3 步同步：标签从 1 跳到 1.7875，随后三步再拟合这个新标签</text><text x="70" y="900" font-size="27" fill="#183944" text-anchor="start">每三个更新的映射：q_target 新 = 0.875 + 0.9125 × q_target 旧</text><text x="70" y="950" font-size="25" fill="#183944" text-anchor="start">固定点为 10，跨轮误差缩为原来的 0.9125；目标水平段不是“价值已经正确”。</text><text x="70" y="1010" font-size="25" fill="#183944" text-anchor="start">本图由明确标量递推计算；没有随机观测、神经网络或真实训练曲线。</text></g></svg>

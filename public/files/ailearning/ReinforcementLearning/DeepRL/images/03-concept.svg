<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img"><title>逐样本保留动作身份，再处理真正终止与截断</title><rect width="1280" height="1060" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">逐样本保留动作身份，再处理真正终止与截断</text><text x="70" y="125" font-size="25" fill="#183944" text-anchor="start">γ = 0.9；蓝色选择沿在线最大动作传到目标行，橙圈标目标行的最大值</text><text x="70" y="205" font-size="27" fill="#183944" text-anchor="start">转移身份</text><text x="285" y="205" font-size="27" fill="#183944" text-anchor="start">在线下一动作值</text><text x="675" y="205" font-size="27" fill="#183944" text-anchor="start">目标下一动作值</text><text x="1090" y="205" font-size="27" fill="#183944" text-anchor="middle">最终标签 Y</text><text x="70" y="310" font-size="28" fill="#183944" text-anchor="start">普通继续</text><text x="70" y="360" font-size="25" fill="#71858b" text-anchor="start">奖励 1</text><text x="240" y="298" font-size="24" fill="#183944" text-anchor="end">a0</text><rect x="270" y="275" width="51" height="28" fill="#246b82"/><text x="331" y="299" font-size="26" fill="#246b82" text-anchor="start">3</text><rect x="660" y="275" width="17" height="28" fill="#246b82"/><text x="687" y="299" font-size="26" fill="#246b82" text-anchor="start">1</text><text x="240" y="363" font-size="24" fill="#183944" text-anchor="end">a1</text><rect x="270" y="340" width="34" height="28" fill="#c9d8dc"/><text x="314" y="364" font-size="26" fill="#71858b" text-anchor="start">2</text><rect x="660" y="340" width="68" height="28" fill="#c9d8dc"/><text x="738" y="364" font-size="26" fill="#71858b" text-anchor="start">4</text><circle cx="751" cy="353" r="23" fill="none" stroke="#c0673e" stroke-width="3"/><line x1="480" y1="289" x2="630" y2="289" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M630,289 l-14,-8 v16 z" fill="#246b82"/><text x="1090" y="305" font-size="28" fill="#246b82" text-anchor="middle">DD：1.9</text><text x="1090" y="360" font-size="28" fill="#c0673e" text-anchor="middle">DQN：4.6</text><text x="70" y="530" font-size="28" fill="#183944" text-anchor="start">真正终止</text><text x="70" y="580" font-size="25" fill="#71858b" text-anchor="start">奖励 -2</text><text x="240" y="518" font-size="24" fill="#183944" text-anchor="end">a0</text><rect x="270" y="495" width="119" height="28" fill="#c9d8dc"/><text x="399" y="519" font-size="26" fill="#71858b" text-anchor="start">7</text><rect x="660" y="495" width="153" height="28" fill="#c9d8dc"/><text x="823" y="519" font-size="26" fill="#71858b" text-anchor="start">9</text><text x="240" y="583" font-size="24" fill="#183944" text-anchor="end">a1</text><rect x="270" y="560" width="136" height="28" fill="#246b82"/><text x="416" y="584" font-size="26" fill="#246b82" text-anchor="start">8</text><rect x="660" y="560" width="170" height="28" fill="#246b82"/><text x="840" y="584" font-size="26" fill="#246b82" text-anchor="start">10</text><circle cx="853" cy="573" r="23" fill="none" stroke="#c0673e" stroke-width="3"/><line x1="480" y1="574" x2="630" y2="574" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M630,574 l-14,-8 v16 z" fill="#246b82"/><text x="1090" y="525" font-size="28" fill="#246b82" text-anchor="middle">DD：-2</text><text x="1090" y="580" font-size="28" fill="#c0673e" text-anchor="middle">DQN：-2</text><text x="70" y="750" font-size="28" fill="#183944" text-anchor="start">外部截断</text><text x="70" y="800" font-size="25" fill="#71858b" text-anchor="start">奖励 0.5</text><text x="240" y="738" font-size="24" fill="#183944" text-anchor="end">a0</text><rect x="270" y="715" width="17" height="28" fill="#c9d8dc"/><text x="297" y="739" font-size="26" fill="#71858b" text-anchor="start">1</text><rect x="660" y="715" width="102" height="28" fill="#c9d8dc"/><text x="772" y="739" font-size="26" fill="#71858b" text-anchor="start">6</text><circle cx="785" cy="728" r="23" fill="none" stroke="#c0673e" stroke-width="3"/><text x="240" y="803" font-size="24" fill="#183944" text-anchor="end">a1</text><rect x="270" y="780" width="85" height="28" fill="#246b82"/><text x="365" y="804" font-size="26" fill="#246b82" text-anchor="start">5</text><rect x="660" y="780" width="34" height="28" fill="#246b82"/><text x="704" y="804" font-size="26" fill="#246b82" text-anchor="start">2</text><line x1="480" y1="794" x2="630" y2="794" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M630,794 l-14,-8 v16 z" fill="#246b82"/><text x="1090" y="745" font-size="28" fill="#246b82" text-anchor="middle">DD：2.3</text><text x="1090" y="800" font-size="28" fill="#c0673e" text-anchor="middle">DQN：5.9</text><text x="70" y="970" font-size="27" fill="#183944" text-anchor="start">真正终止：未来乘零；外部截断：原任务仍继续，保留真实末状态的自举。</text><text x="70" y="1020" font-size="25" fill="#183944" text-anchor="start">目标整支停止梯度；当前预测仍读取回放动作，不用下一步的贪心动作替换。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc">
  <title id="title">最大值偏差：选到正噪声，再用同一噪声评价</title>
  <desc id="desc">穷举两动作的独立正负一噪声，最大值均值为0.5；独立零均值的评价器读取被选动作时，均值为零。</desc>
  <rect width="1200" height="835" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">最大值偏差：选到正噪声，再用同一噪声评价</text>
    <text x="35" y="100" font-size="25" fill="#213447" font-weight="400" text-anchor="start">两个动作真值都为 0；各自误差独立取 ±1，四种情况等概率</text>
    <text x="165" y="130" font-size="25" fill="#213447" font-weight="600" text-anchor="middle">情况 1</text>
    <line x1="80" y1="247" x2="275" y2="247" stroke="#cad7e2" stroke-width="1.5" />
    <line x1="115" y1="247" x2="115" y2="192" stroke="#2865a0" stroke-width="3" />
    <circle cx="115" cy="192" r="9" fill="#2865a0" />
    <circle cx="115" cy="192" r="17" fill="none" stroke="#cf7432" stroke-width="3" />
    <text x="115" y="167" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">+1</text>
    <text x="115" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 1</text>
    <line x1="235" y1="247" x2="235" y2="192" stroke="#2865a0" stroke-width="3" />
    <circle cx="235" cy="192" r="9" fill="#2865a0" />
    <text x="235" y="167" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">+1</text>
    <text x="235" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 2</text>
    <text x="165" y="386" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">同网读值 +1</text>
    <text x="460" y="130" font-size="25" fill="#213447" font-weight="600" text-anchor="middle">情况 2</text>
    <line x1="375" y1="247" x2="570" y2="247" stroke="#cad7e2" stroke-width="1.5" />
    <line x1="410" y1="247" x2="410" y2="192" stroke="#2865a0" stroke-width="3" />
    <circle cx="410" cy="192" r="9" fill="#2865a0" />
    <circle cx="410" cy="192" r="17" fill="none" stroke="#cf7432" stroke-width="3" />
    <text x="410" y="167" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">+1</text>
    <text x="410" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 1</text>
    <line x1="530" y1="247" x2="530" y2="302" stroke="#2865a0" stroke-width="3" />
    <circle cx="530" cy="302" r="9" fill="#2865a0" />
    <text x="530" y="277" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <text x="530" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 2</text>
    <text x="460" y="386" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">同网读值 +1</text>
    <text x="755" y="130" font-size="25" fill="#213447" font-weight="600" text-anchor="middle">情况 3</text>
    <line x1="670" y1="247" x2="865" y2="247" stroke="#cad7e2" stroke-width="1.5" />
    <line x1="705" y1="247" x2="705" y2="302" stroke="#2865a0" stroke-width="3" />
    <circle cx="705" cy="302" r="9" fill="#2865a0" />
    <text x="705" y="277" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <text x="705" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 1</text>
    <line x1="825" y1="247" x2="825" y2="192" stroke="#2865a0" stroke-width="3" />
    <circle cx="825" cy="192" r="9" fill="#2865a0" />
    <circle cx="825" cy="192" r="17" fill="none" stroke="#cf7432" stroke-width="3" />
    <text x="825" y="167" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">+1</text>
    <text x="825" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 2</text>
    <text x="755" y="386" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">同网读值 +1</text>
    <text x="1050" y="130" font-size="25" fill="#213447" font-weight="600" text-anchor="middle">情况 4</text>
    <line x1="965" y1="247" x2="1160" y2="247" stroke="#cad7e2" stroke-width="1.5" />
    <line x1="1000" y1="247" x2="1000" y2="302" stroke="#2865a0" stroke-width="3" />
    <circle cx="1000" cy="302" r="9" fill="#2865a0" />
    <circle cx="1000" cy="302" r="17" fill="none" stroke="#cf7432" stroke-width="3" />
    <text x="1000" y="277" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <text x="1000" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 1</text>
    <line x1="1120" y1="247" x2="1120" y2="302" stroke="#2865a0" stroke-width="3" />
    <circle cx="1120" cy="302" r="9" fill="#2865a0" />
    <text x="1120" y="277" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <text x="1120" y="354" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">动作 2</text>
    <text x="1050" y="386" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">同网读值 -1</text>
    <text x="35" y="438" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">橙圈：选中的动作；并列时固定选择动作 1</text>
    <line x1="35" y1="465" x2="1165" y2="465" stroke="#cad7e2" stroke-width="2" />
    <text x="60" y="510" font-size="25" fill="#213447" font-weight="600" text-anchor="start">同一估计负责选择和评价</text>
    <line x1="100" y1="715.0" x2="505" y2="715.0" stroke="#cad7e2" stroke-width="1" />
    <text x="88" y="722.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0</text>
    <line x1="100" y1="665.0" x2="505" y2="665.0" stroke="#cad7e2" stroke-width="1" />
    <text x="88" y="672.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.25</text>
    <line x1="100" y1="615.0" x2="505" y2="615.0" stroke="#cad7e2" stroke-width="1" />
    <text x="88" y="622.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.5</text>
    <line x1="100" y1="565.0" x2="505" y2="565.0" stroke="#cad7e2" stroke-width="1" />
    <text x="88" y="572.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.75</text>
    <line x1="100" y1="715" x2="505" y2="715" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="100" y1="545" x2="100" y2="715" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="175.9375" y1="715.0" x2="175.9375" y2="720.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="175.9375" y="744.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">-1</text>
    <line x1="429.0625" y1="715.0" x2="429.0625" y2="720.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="429.0625" y="744.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">1</text>
    <rect x="144.296875" y="665.0" width="63.28125" height="50.0" fill="#cf7432" />
    <text x="175.9375" y="655.0" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">0.25</text>
    <rect x="397.421875" y="565.0" width="63.28125" height="150.0" fill="#cf7432" />
    <text x="429.0625" y="555.0" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">0.75</text>
    <text x="505" y="762" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="end">读出的估计值</text>
    <text x="300" y="818" font-size="27" fill="#cf7432" font-weight="600" text-anchor="middle">期望 = 0.5</text>
    <text x="650" y="510" font-size="25" fill="#213447" font-weight="600" text-anchor="start">独立、零均值的另一估计负责评价</text>
    <line x1="690" y1="715.0" x2="1095" y2="715.0" stroke="#cad7e2" stroke-width="1" />
    <text x="678" y="722.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0</text>
    <line x1="690" y1="665.0" x2="1095" y2="665.0" stroke="#cad7e2" stroke-width="1" />
    <text x="678" y="672.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.25</text>
    <line x1="690" y1="615.0" x2="1095" y2="615.0" stroke="#cad7e2" stroke-width="1" />
    <text x="678" y="622.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.5</text>
    <line x1="690" y1="565.0" x2="1095" y2="565.0" stroke="#cad7e2" stroke-width="1" />
    <text x="678" y="572.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0.75</text>
    <line x1="690" y1="715" x2="1095" y2="715" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="690" y1="545" x2="690" y2="715" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="765.9375" y1="715.0" x2="765.9375" y2="720.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="765.9375" y="744.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">-1</text>
    <line x1="1019.0625" y1="715.0" x2="1019.0625" y2="720.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="1019.0625" y="744.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">1</text>
    <rect x="734.296875" y="615.0" width="63.28125" height="100.0" fill="#2865a0" />
    <text x="765.9375" y="605.0" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">0.5</text>
    <rect x="987.421875" y="615.0" width="63.28125" height="100.0" fill="#2865a0" />
    <text x="1019.0625" y="605.0" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">0.5</text>
    <text x="1095" y="762" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="end">读出的估计值</text>
    <text x="890" y="818" font-size="27" fill="#2865a0" font-weight="600" text-anchor="middle">期望 = 0</text>
  </g>
</svg>

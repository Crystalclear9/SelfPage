<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>一个共享参数：拟合 A，也会移动 B 的预测</title><rect width="1280" height="650" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">一个共享参数：拟合 A，也会移动 B 的预测</text><text x="80" y="120" font-size="28" fill="#233943" text-anchor="start">预测 Q(x) = θx</text><line x1="100" y1="475" x2="580" y2="475" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><line x1="100" y1="475" x2="100" y2="195" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><text x="100" y="514" font-size="24" fill="#697d87" text-anchor="middle">0</text><text x="320" y="514" font-size="24" fill="#697d87" text-anchor="middle">1</text><text x="540" y="514" font-size="24" fill="#697d87" text-anchor="middle">2</text><text x="78" y="483" font-size="24" fill="#697d87" text-anchor="end">0</text><text x="78" y="253" font-size="24" fill="#697d87" text-anchor="end">1</text><text x="340" y="562" font-size="26" fill="#697d87" text-anchor="middle">输入特征 x</text><polyline fill="none" stroke="#697d87" stroke-width="3" points="100.00,475.00 540.00,475.00"/><polyline fill="none" stroke="#276884" stroke-width="4" points="100.00,475.00 540.00,429.00"/><circle cx="320" cy="245" r="8" fill="#b25d2b"/><circle cx="540" cy="475" r="8" fill="#b25d2b"/><text x="337" y="253" font-size="26" fill="#b25d2b" text-anchor="start">A：目标 1</text><text x="540" y="372" font-size="26" fill="#b25d2b" text-anchor="end">B：目标 0</text><circle cx="320" cy="452.0" r="6" fill="#276884"/><circle cx="540" cy="429.0" r="6" fill="#276884"/><text x="175" y="407" font-size="28" fill="#276884" text-anchor="start">θ：0 → 0.1</text><text x="730" y="120" font-size="28" fill="#233943" text-anchor="start">只用 A 更新，步长 0.1</text><text x="730" y="188" font-size="29" fill="#276884" text-anchor="start">A 预测：0 → 0.1</text><text x="730" y="238" font-size="29" fill="#276884" text-anchor="start">B 预测：0 → 0.2</text><line x1="730" y1="280" x2="1190" y2="280" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="730" y="336" font-size="28" fill="#233943" text-anchor="start">A 损失：0.5 → 0.405</text><text x="730" y="388" font-size="28" fill="#b25d2b" text-anchor="start">B 损失：0 → 0.02</text><text x="730" y="479" font-size="28" fill="#233943" text-anchor="start">联合损失最小点：θ = 0.2</text><text x="730" y="535" font-size="26" fill="#697d87" text-anchor="start">A 单独最小点：θ = 1</text><text x="730" y="583" font-size="26" fill="#697d87" text-anchor="start">B 单独最小点：θ = 0</text><line x1="540" y1="383" x2="540" y2="463" stroke="#b25d2b" stroke-width="1.5" stroke-dasharray="5,5"/></g></svg>

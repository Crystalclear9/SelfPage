<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 613" role="img" aria-labelledby="title description">
<title id="title">日志缺失目标动作时重要性采样无法识别目标奖励</title>
<desc id="description">行为策略只记录 A，目标策略还以二分之一概率选择 B。两种环境在 A 上奖励相同，B 的奖励相反，日志无法区分。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="613" fill="white" stroke="none" stroke-width="1.6"/>
<text x="281" y="61" fill="#212c39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">从日志到目标策略</text>
<text x="91" y="163" fill="#212c39" font-size="30" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">行为策略</text>
<rect x="259" y="125" width="294" height="63" fill="url(#wash-t)" stroke="#176b73" stroke-width="2.2"/>
<text x="406.0" y="168" fill="#176b73" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A  1</text>
<text x="91" y="318" fill="#212c39" font-size="30" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">目标策略</text>
<rect x="259" y="280" width="147.0" height="63" fill="url(#wash-t)" stroke="#176b73" stroke-width="2.2"/>
<text x="332.5" y="323" fill="#176b73" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A  0.5</text>
<rect x="406.0" y="280" width="147.0" height="63" fill="url(#wash-r)" stroke="#a44736" stroke-width="2.2"/>
<text x="479.5" y="323" fill="#a44736" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B  0.5</text>
<path d="M480 192L480 266" stroke="#a44736" stroke-width="2.5" fill="none" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="405" y="233" fill="#a44736" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">日志无 B</text>
<text x="896" y="60" fill="#212c39" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同一日志可以来自两种环境</text>
<text x="727" y="175" fill="#212c39" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">环境甲</text>
<path d="M821 200l24 -67h254l-24 67Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="961" y="176" fill="#a44736" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B: +1</text>
<text x="894" y="244" fill="#176b73" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">目标期望</text>
<text x="1017" y="244" fill="#176b73" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">+0.5</text>
<text x="727" y="353" fill="#212c39" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">环境乙</text>
<path d="M821 378l24 -67h254l-24 67Z" stroke="#655281" stroke-width="1.9" fill="url(#wash-v)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="961" y="354" fill="#655281" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B: −1</text>
<text x="894" y="422" fill="#655281" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">目标期望</text>
<text x="1017" y="422" fill="#655281" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">−0.5</text>
<path d="M569 318L624 318" stroke="#655281" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M635 318 L621 312.5L621 323.5Z" stroke="#655281" stroke-width="1" fill="#655281" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="562" fill="#536777" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">A 的奖励都是零；B 的目标概率为正，行为概率为零</text>
</svg>

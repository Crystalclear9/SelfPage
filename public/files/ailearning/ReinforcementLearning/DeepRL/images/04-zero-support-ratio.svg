<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">离策略评价：目标动作必须有日志支持</title><desc id="desc">离策略评价：目标动作必须有日志支持</desc><rect width="1200" height="600" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">离策略评价：目标动作必须有日志支持</text><text x="35" y="112" font-size="26" fill="#213447" font-weight="600" text-anchor="start">单状态，两动作 A、B</text><text x="35" y="187" font-size="27" fill="#213447" font-weight="400" text-anchor="start">行为 β</text><rect x="170" y="150" width="430" height="70" rx="4" fill="#2865a0" /><text x="385" y="194" font-size="27" fill="white" font-weight="400" text-anchor="middle">A：概率 1</text><text x="35" y="315" font-size="27" fill="#213447" font-weight="400" text-anchor="start">目标 π</text><rect x="170" y="277" width="215" height="70" rx="4" fill="#2865a0" /><rect x="385" y="277" width="215" height="70" rx="4" fill="#cf7432" /><text x="277" y="322" font-size="27" fill="white" font-weight="400" text-anchor="middle">A：0.5</text><text x="492" y="322" font-size="27" fill="white" font-weight="400" text-anchor="middle">B：0.5</text><text x="170" y="413" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">日志中 B 的概率为 0</text><text x="170" y="458" font-size="27" fill="#cf7432" font-weight="400" text-anchor="start">B 的重要性比无法定义</text><line x1="650" y1="105" x2="650" y2="540" stroke="#cad7e2" stroke-width="2" /><text x="710" y="112" font-size="27" fill="#213447" font-weight="600" text-anchor="start">两种环境产生相同日志</text><text x="710" y="175" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">环境甲</text><text x="710" y="220" font-size="25" fill="#213447" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 1</text><text x="710" y="267" font-size="27" fill="#2865a0" font-weight="600" text-anchor="start">目标期望奖励 = 0.5</text><text x="710" y="365" font-size="26" fill="#cf7432" font-weight="600" text-anchor="start">环境乙</text><text x="710" y="410" font-size="25" fill="#213447" font-weight="400" text-anchor="start">A 奖励 0；B 奖励 -1</text><text x="710" y="457" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">目标期望奖励 = -0.5</text></g></svg>

"228" stroke="#217292" stroke-width="4" stroke-dasharray=""/><text x="599" y="185" font-size="27" fill="#217292" text-anchor="middle">A：比率 4</text><circle cx="740" cy="220" r="30" fill="#f0f6f7" stroke="#217292" stroke-width="3"/><text x="740" y="230" font-size="28" fill="#217292" text-anchor="middle">2</text><line x1="774" y1="220" x2="983" y2="220" stroke="#217292" stroke-width="4" stroke-dasharray=""/><line x1="983" y1="220" x2="969" y2="212" stroke="#217292" stroke-width="4" stroke-dasharray=""/><line x1="983" y1="220" x2="969" y2="228" stroke="#217292" stroke-width="4" stroke-dasharray=""/><text x="879" y="185" font-size="27" fill="#217292" text-anchor="middle">A：比率 4</text><circle cx="1020" cy="220" r="30" fill="#f0f6f7" stroke="#217292" stroke-width="3"/><text x="1020" y="230" font-size="28" fill="#217292" text-anchor="middle">3</text><text x="60" y="295" font-size="28" fill="#bd6c41" text-anchor="start">三次都选 A：行为质量 0.008 × 权重 64 = 目标质量 0.512</text><line x1="60" y1="330" x2="1220" y2="330" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="60" y="381" font-size="26" fill="#1c2e40" text-anchor="start">把全部 8 条动作串按 A 出现次数 K 分组；柱高是该组的概率质量</text><rect x="160" y="449.6" width="45" height="230.39999999999998" fill="#217292"/><text x="182" y="434.6" font-size="25" fill="#217292" text-anchor="middle">0.512</text><rect x="230" y="676.4" width="45" height="3.6000000000000227" fill="#bd6c41"/><text x="252" y="661.4" font-size="25" fill="#bd6c41" text-anchor="middle">0.008</text><text x="210" y="727" font-size="27" fill="#1c2e40" text-anchor="middle">K = 0</text><text x="210" y="775" font-size="26" fill="#728d97" text-anchor="middle">w = 0.015625</text><rect x="440" y="507.2" width="45" height="172.8" fill="#217292"/><text x="462" y="492.2" font-size="25" fill="#217292" text-anchor="middle">0.384</text><rect x="510" y="636.8" width="45" height="43.200000000000045" fill="#bd6c41"/><text x="532" y="621.8" font-size="25" fill="#bd6c41" text-anchor="middle">0.096</text><text x="490" y="727" font-size="27" fill="#1c2e40" text-anchor="middle">K = 1</text><text x="490" y="775" font-size="26" fill="#728d97" text-anchor="middle">w = 0.25</text><rect x="720" y="636.8" width="45" height="43.200000000000045" fill="#217292"/><text x="742" y="621.8" font-size="25" fill="#217292" text-anchor="middle">0.096</text><rect x="790" y="507.2" width="45" height="172.8" fill="#bd6c41"/><text x="812" y="492.2" font-size="25" fill="#bd6c41" text-anchor="middle">0.384</text><text x="770" y="727" font-size="27" fill="#1c2e40" text-anchor="middle">K = 2</text><text x="770" y="775" font-size="26" fill="#728d97" text-anchor="middle">w = 4</text><rect x="1000" y="676.4" width="45" height="3.6000000000000227" fill="#217292"/><text x="1022" y="661.4" font-size="25" fill="#217292" text-anchor="middle">0.008</text><rect x="1070" y="449.6" width="45" height="230.39999999999998" fill="#bd6c41"/><text x="1092" y="434.6" font-size="25" fill="#bd6c41" text-anchor="middle">0.512</text><text x="1050" y="727" font-size="27" fill="#1c2e40" text-anchor="middle">K = 3</text><text x="1050" y="775" font-size="26" fill="#728d97" text-anchor="middle">w = 64</text><line x1="105" y1="680" x2="1160" y2="680" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="105" y1="405" x2="105" y2="680" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="99" y1="590.0" x2="105" y2="590.0" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="88" y="598.0" font-size="24" fill="#728d97" text-anchor="end">0.2</text><line x1="99" y1="500.0" x2="105" y2="500.0" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="88" y="508.0" font-size="24" fill="#728d97" text-anchor="end">0.4</text><line x1="99" y1="410.0" x2="105" y2="410.0" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="88" y="418.0" font-size="24" fill="#728d97" text-anchor="end">0.6</text><rect x="170" y="818" width="28" height="14" fill="#217292"/><text x="212" y="837" font-size="26" fill="#217292" text-anchor="start">行为质量</text><rect x="490" y="818" width="28" height="14" fill="#bd6c41"/><text x="532" y="837" font-size="26" fill="#bd6c41" text-anchor="start">加权行为质量 = 目标质量</text><text x="60" y="892" font-size="26" fill="#1c2e40" text-anchor="start">Σ P行为(路径) × w(路径) = 0.008 + 0.096 + 0.384 + 0.512 = 1</text></g></svg></svg>

1="365.0" x2="600" y2="365.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="95" y="373.0" font-size="24" fill="#71858b" text-anchor="end">1.5</text><line x1="110" y1="665" x2="600" y2="665" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="140" y="710" font-size="25" fill="#183944" text-anchor="middle">第 1 步 A</text><text x="350" y="710" font-size="25" fill="#183944" text-anchor="middle">第 2 步 B</text><text x="560" y="710" font-size="25" fill="#183944" text-anchor="middle">第 3 步 A</text><path d="M140.00,465.00 L350.00,521.00 L560.00,361.32" fill="none" stroke="#246b82" stroke-width="4"/><circle cx="140" cy="465" r="7" fill="#246b82"/><circle cx="350" cy="521.0" r="7" fill="#246b82"/><circle cx="560" cy="361.32" r="7" fill="#246b82"/><path d="M140.00,465.00 L350.00,521.00 L560.00,465.00" fill="none" stroke="#c0673e" stroke-width="4"/><circle cx="140" cy="465" r="7" fill="#c0673e"/><circle cx="350" cy="521.0" r="7" fill="#c0673e"/><circle cx="560" cy="465" r="7" fill="#c0673e"/><path d="M140.00,665.00 L350.00,465.00 L560.00,521.00" fill="none" stroke="#71858b" stroke-width="4"/><circle cx="140" cy="665" r="7" fill="#71858b"/><circle cx="350" cy="465" r="7" fill="#71858b"/><circle cx="560" cy="521.0" r="7" fill="#71858b"/><text x="570" y="350" font-size="26" fill="#246b82" text-anchor="start">1.5184</text><text x="570" y="453" font-size="26" fill="#c0673e" text-anchor="start">1</text><text x="570" y="530" font-size="26" fill="#71858b" text-anchor="start">0.72</text><line x1="100" y1="762" x2="150" y2="762" stroke="#246b82" stroke-width="5" stroke-dasharray=""/><text x="170" y="770" font-size="26" fill="#246b82" text-anchor="start">累积迹 A</text><line x1="100" y1="807" x2="150" y2="807" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><text x="170" y="815" font-size="26" fill="#c0673e" text-anchor="start">替换迹 A</text><line x1="100" y1="852" x2="150" y2="852" stroke="#71858b" stroke-width="5" stroke-dasharray=""/><text x="170" y="860" 
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">资格迹在重复访问时如何更新</title>
<desc id="fig-desc">访问 A、B、A。每一步先将已有迹乘 0.72；累积迹增加一，替换迹将当前状态置一。</desc>
<rect x="0" y="0" width="1200" height="775" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">再次访问 A：累积保留历史，替换只重置当前状态</text>
<text x="363" y="136" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">第一次访问 A</text>
<path d="M463 130 L548 130" fill="none" stroke="#526976" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M548 130 L537 135 L537 125 Z" fill="#526976" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="647" y="136" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">访问 B</text>
<path d="M747 130 L832 130" fill="none" stroke="#526976" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M832 130 L821 135 L821 125 Z" fill="#526976" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="931" y="136" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">再次访问 A</text>
<text x="75" y="221" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">累积迹 e(A)</text>
<path d="M273 245 L290 190 L453 190 L436 245 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="363" y="226.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">1</text>
<path d="M557 245 L574 190 L737 190 L720 245 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="647" y="226.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">0.72</text>
<path d="M841 245 L858 190 L1021 190 L1004 245 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="931" y="226.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">1.5184</text>
<text x="931" y="278" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">历史 0.5184 + 本次 1</text>
<text x="75" y="322" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">替换迹 e(A)</text>
<path d="M273 346 L290 291 L453 291 L436 346 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="363" y="327.6" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">1</text>
<path d="M557 346 L574 291 L737 291 L720 346 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="647" y="327.6" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">0.72</text>
<path d="M841 346 L858 291 L1021 291 L1004 346 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="931" y="327.6" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">1</text>
<text x="75" y="423" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">两者的 e(B)</text>
<path d="M273 447 L290 392 L453 392 L436 447 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="363" y="428.6" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">0</text>
<path d="M557 447 L574 392 L737 392 L720 447 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="647" y="428.6" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">1</text>
<path d="M841 447 L858 392 L1021 392 L1004 447 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="931" y="428.6" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">0.72</text>
<path d="M75 481 L1125 481" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="534" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">取步长 0.1 与 TD 误差 0.5，价值增量等于当前迹乘 0.05。</text>
<rect x="520" y="593" width="202" height="53" fill="#ecf6f6" opacity="1"/>
<text x="621" y="627.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.07592</text>
<rect x="726" y="593" width="202" height="53" fill="#f1f5f6" opacity="1"/>
<text x="827" y="627.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.036</text>
<text x="504" y="627.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">累积迹</text>
<rect x="520" y="650" width="202" height="53" fill="#e8e6f2" opacity="1"/>
<text x="621" y="684.5" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.05</text>
<rect x="726" y="650" width="202" height="53" fill="#f1f5f6" opacity="1"/>
<text x="827" y="684.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.036</text>
<text x="504" y="684.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">替换迹</text>
<text x="621" y="579" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">V(A) 增量</text>
<text x="827" y="579" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">V(B) 增量</text>
<text x="75" y="739" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">B 的迹仍按 0.72 衰减，所以两种方案对 B 的更新量相同。</text>
</svg>

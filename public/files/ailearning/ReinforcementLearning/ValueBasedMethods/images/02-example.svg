 stroke-width="2" stroke-dasharray=""/><text x="60" y="842" font-size="26" fill="#71858b" text-anchor="start">区间表示给定的确定误差界，不是统计置信区间；圆点是真值。</text><text x="60" y="890" font-size="26" fill="#71858b" text-anchor="start">Δ ≤ 2e 只表示保证失效，不代表任意实际估计都会选错。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1130" viewBox="0 0 1080 1130" role="img"><title>深度探索：局部随机与跨时间相关的区别</title><desc>链长H，每步独立选左右的成功率为2的负H次；每回合公平选全右或全左计划成功率为0.5。下图对数纵轴底数为2。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="1130" rx="5" fill="white" /><rect x="24" y="94" width="1032" height="1010" rx="5" fill="white" /><text x="42" y="49" font-size="29" fill="#17364c" text-anchor="start">深度探索：局部随机与跨时间相关的区别</text><text x="50" y="135" font-size="23" fill="#17364c" text-anchor="start">A  预先生成序列的单步边际相同，联合分布不同</text><text x="55" y="210" font-size="20" fill="#17364c" text-anchor="start">每一步独立抛硬币</text><circle cx="330" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="330" y="212" font-size="16" fill="white" text-anchor="middle">R</text><path d="M346,204 L414,204" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="430" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="430" y="212" font-size="16" fill="white" text-anchor="middle">R</text><path d="M446,204 L514,204" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="530" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="530" y="212" font-size="16" fill="white" text-anchor="middle">R</text><path d="M546,204 L614,204" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="630" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="630" y="212" font-size="16" fill="white" text-anchor="middle">R</text><path d="M646,204 L714,204" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="730" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="730" y="212" font-size="16" fill="white" text-anchor="middle">R</text><path d="M746,204 L814,204" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="830" cy="204" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="830" y="212" font-size="16" fill="white" text-anchor="middle">R</text><text x="960" y="210" font-size="20" fill="#078c83" text-anchor="start">成功</text><text x="55" y="340" font-size="20" fill="#17364c" text-anchor="start">每回合只抛一次硬币</text><circle cx="330" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="330" y="342" font-size="16" fill="white" text-anchor="middle">R</text><path d="M346,334 L414,334" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="430" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="430" y="342" font-size="16" fill="white" text-anchor="middle">R</text><path d="M446,334 L514,334" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="530" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="530" y="342" font-size="16" fill="white" text-anchor="middle">R</text><path d="M546,334 L614,334" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="630" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="630" y="342" font-size="16" fill="white" text-anchor="middle">R</text><path d="M646,334 L714,334" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="730" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="730" y="342" font-size="16" fill="white" text-anchor="middle">R</text><path d="M746,334 L814,334" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="830" cy="334" r="15" fill="#078c83" stroke="white" stroke-width="2" /><text x="830" y="342" font-size="16" fill="white" text-anchor="middle">R</text><text x="960" y="340" font-size="20" fill="#078c83" text-anchor="start">成功</text><text x="330" y="263" font-size="20" fill="#dc7935" text-anchor="start">六步全 R：概率 0.015625</text><text x="330" y="393" font-size="20" fill="#078c83" text-anchor="start">选中全 R 计划：概率 0.5</text><text x="50" y="470" font-size="23" fill="#17364c" text-anchor="start">B  路径变长：独立成功率指数下降，整段计划保持 0.5</text><text x="55" y="525" font-size="19" fill="#17364c" text-anchor="start">成功概率（对数纵轴，底数 2）</text><path d="M610,521 L650,521" stroke="#dc7935" stroke-width="3" fill="none" /><text x="660" y="528" font-size="19" fill="#dc7935" text-anchor="start">每步独立</text><path d="M810,521 L850,521" stroke="#078c83" stroke-width="3" fill="none" /><text x="860" y="528" font-size="19" fill="#078c83" text-anchor="start">回合内坚持计划</text><path d="M180,580 L880,580" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="586" font-size="17" fill="#17364c" text-anchor="end">0.5</text><path d="M180,632 L880,632" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="638" font-size="17" fill="#17364c" text-anchor="end">0.25</text><path d="M180,684 L880,684" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="690" font-size="17" fill="#17364c" text-anchor="end">0.125</text><path d="M180,736 L880,736" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="742" font-size="17" fill="#17364c" text-anchor="end">0.0625</text><path d="M180,788 L880,788" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="794" font-size="17" fill="#17364c" text-anchor="end">0.03125</text><path d="M180,840 L880,840" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="846" font-size="17" fill="#17364c" text-anchor="end">0.015625</text><path d="M180,892 L880,892" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="898" font-size="17" fill="#17364c" text-anchor="end">0.0078125</text><path d="M180,944 L880,944" stroke="#dbe4ec" stroke-width="1" fill="none" /><text x="160" y="950" font-size="17" fill="#17364c" text-anchor="end">0.00390625</text><path d="M180,580 L180,944" stroke="#8298a8" stroke-width="2" fill="none" /><path d="M180,944 L880,944" stroke="#8298a8" stroke-width="2" fill="none" /><path d="M180,944 L180,953" stroke="#8298a8" stroke-width="2" fill="none" /><text x="180" y="980" font-size="20" fill="#17364c" text-anchor="middle">1</text><path d="M280,944 L280,953" stroke="#8298a8" stroke-width="2" fill="none" /><text x="280" y="980" font-size="20" fill="#17364c" text-anchor="middle">2</text><path d="M480,944 L480,953" stroke="#8298a8" stroke-width="2" fill="none" /><text x="480" y="980" font-size="20" fill="#17364c" text-anchor="middle">4</text><path d="M680,944 L680,953" stroke="#8298a8" stroke-width="2" fill="none" /><text x="680" y="980" font-size="20" fill="#17364c" text-anchor="middle">6</text><path d="M880,944 L880,953" stroke="#8298a8" stroke-width="2" fill="none" /><text x="880" y="980" font-size="20" fill="#17364c" text-anchor="middle">8</text><path d="M180,580 L880,944" stroke="#dc7935" stroke-width="3" fill="none" /><path d="M180,580 L880,580" stroke="#078c83" stroke-width="3" fill="none" /><circle cx="180" cy="580" r="7" fill="#dc7935" stroke="white" stroke-width="2" /><circle cx="180" cy="580" r="7" fill="#078c83" stroke="white" stroke-width="2" /><circle cx="280" cy="632" r="7" fill="#dc7935" stroke="white" stroke-width="2" /><circle cx="280" cy="580" r="7" fill="#078c83" stroke="white" stroke-width="2" /><circle cx="480" cy="736" r="7" fill="#dc7935" stroke="white" stroke-width="2" /><circle cx="480" cy="580" r="7" fill="#078c83" stroke="white" stroke-width="2" /><circle cx="680" cy="840" r="7" fill="#dc7935" stroke="white" stroke-width="2" /><circle cx="680" cy="580" r="7" fill="#078c83" stroke="white" stroke-width="2" /><circle cx="880" cy="944" r="7" fill="#dc7935" stroke="white" stroke-width="2" /><circle cx="880" cy="580" r="7" fill="#078c83" stroke="white" stroke-width="2" /><text x="880" y="565" font-size="20" fill="#078c83" text-anchor="end">0.5</text><text x="295" y="619" font-size="18" fill="#dc7935" text-anchor="start">0.25</text><text x="495" y="723" font-size="18" fill="#dc7935" text-anchor="start">0.0625</text><text x="695" y="827" font-size="18" fill="#dc7935" text-anchor="start">0.015625</text><text x="895" y="931" font-size="18" fill="#dc7935" text-anchor="start">0.00390625</text><text x="530" y="1020" font-size="21" fill="#17364c" text-anchor="middle">链长 H（连续正确动作数）</text><text x="50" y="1064" font-size="19" fill="#17364c" text-anchor="start">环境：任一步左动作 L 即失败；连续 H 次右动作 R 才成功。</text><text x="50" y="1093" font-size="18" fill="#526b7c" text-anchor="start">两种回合计划为全 R 与全 L，各以概率 0.5 选取；折线连接离散整数链长。</text></g></svg>

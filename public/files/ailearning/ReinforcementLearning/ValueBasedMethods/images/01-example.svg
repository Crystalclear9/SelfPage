<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" role="img" aria-labelledby="title description" width="900" height="466.500000">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 354.540000"/>

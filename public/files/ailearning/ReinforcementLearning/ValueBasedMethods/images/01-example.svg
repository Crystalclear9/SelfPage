<title id="title">同一后继状态下 SARSA 与 Q 学习使用不同目标</title>
<desc id="description">冒险到桥头奖励零，随后按行为策略以 0.9 概率得三，以 0.1 概率得负三十。SARSA 使用实际下一动作，Q 学习用贪心目标。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="622" fill="white" stroke="none" stroke-width="1.6"/>
<path d="M170 220L368 220" stroke="#176b73" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M379 220 L365 214.5L365 225.5Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<text x="275.5" y="200.0" fill="#176b73" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">冒险：奖励 0</text>
<path d="M120 251L120 331" stroke="#536777" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 342 L125.5 328L114.5 328Z" stroke="#536777" stroke-width="1" fill="#536777" stroke-linecap="round" stroke-linejoin="round"/>
<text x="188.0" y="277.0" fill="#536777" font-size="27" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">安全：奖励 1</text>
<path d="M478.929 211.17L720.743 128.667" stroke="#176b73" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M731.154 125.115 L716.128 124.43L719.68 134.841Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<text x="606.0" y="147.0" fill="#176b73" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">好动作</text>
<text x="628.0" y="198.0" fill="#176b73" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.9</text>
<path d="M479.289 228.041L720.269 302.454" stroke="#a44736" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M730.78 305.7 L719.026 296.314L715.78 306.824Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<text x="606.0" y="246.0" fill="#a44736" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">坏动作</text>
<text x="628.0" y="297.0" fill="#a44736" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.1</text>
<path d="M61 250l22 -58h94l-22 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="231" fill="#536777" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">起点</text>
<path d="M372 250l22 -58h94l-22 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="431" y="231" fill="#176b73" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">桥头</text>
<path d="M722 146l22 -58h94l-22 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="781" y="127" fill="#176b73" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text>
<path d="M722 344l22 -58h94l-22 58Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="781" y="325" fill="#a44736" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text>
<path d="M61 404l22 -58h94l-22 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="385" fill="#536777" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">终止</text>
<text x="900" y="125" fill="#176b73" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">奖励</text>
<text x="982" y="125" fill="#176b73" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<text x="900" y="323" fill="#a44736" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">奖励</text>
<text x="982" y="323" fill="#a44736" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">−30</text>
<path d="M62 432L1138 432" stroke="#dce7ea" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="483" fill="#212c39" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">SARSA：按下一实际动作</text>
<text x="329" y="532" fill="#a44736" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.9 × 3 + 0.1 × (−30) = −0.3</text>
<text x="890" y="483" fill="#212c39" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">Q 学习：取贪心动作</text>
<text x="890" y="532" fill="#176b73" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">max(3, −30) = 3</text>
<text x="600" y="591" fill="#536777" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">左侧算的是采样目标的条件均值</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1262.3537" viewBox="0 0 1440 1262.3537" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三条相同成功样本轨迹中的中间 Q 表，展示终点奖励逐次向前传播及未访问左动作的作用</title><rect width="1440" height="1262.3537" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="32" font-weight="700" fill="#142b45">三条相同成功样本轨迹中的中间 Q 表，展示终点奖励逐次向前传播及未访问左动作的作用</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1120.3537" viewBox="0 48.2317 1280 1067.0035" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="48.231707" width="1280" height="1067.003484" fill="#ffffff"/><title>同一导航轨迹连续三次访问时Q学习的精确中间表</title><rect width="1280" height="1130" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="92" fill="#617f97" font-size="26" text-anchor="start" font-weight="400">固定展示三次 3 → 4 → 5 → 6 的已发生轨迹；动作均向右、没有滑动</text><line x1="220" y1="205" x2="440" y2="205" stroke="#2472b1" stroke-width="4"/><polygon points="440,205 428.2941876694152,210.654551943446 428.2941876694152,199.345448056554" fill="#2472b1"/><text x="330" y="172" fill="#c57439" font-size="27" text-anchor="middle" font-weight="400">r = −0.02</text><circle cx="180" cy="205" r="35" fill="#2472b1"/><text x="180" y="216" fill="white" font-size="31" text-anchor="middle" font-weight="700">3</text><line x1="520" y1="205" x2="740" y2="205" stroke="#2472b1" stroke-width="4"/><polygon points="740,205 728.2941876694152,210.654551943446 728.2941876694152,199.345448056554" fill="#2472b1"/><text x="630" y="172" fill="#c57439" font-size="27" text-anchor="middle" font-weight="400">r = −0.02</text><circle cx="480" cy="205" r="35" fill="#2472b1"/><text x="480" y="216" fill="white" font-size="31" text-anchor="middle" font-weight="700">4</text><line x1="820" y1="205" x2="1040" y2="205" stroke="#2472b1" stroke-width="4"/><polygon points="1040,205 1028.2941876694151,210.654551943446 1028.2941876694151,199.345448056554" fill="#2472b1"/><text x="930" y="172" fill="#c57439" font-size="27" text-anchor="middle" font-weight="400">r = 1</text><circle cx="780" cy="205" r="35" fill="#2472b1"/><text x="780" y="216" fill="white" font-size="31" text-anchor="middle" font-weight="700">5</text><circle cx="1080" cy="205" r="35" fill="#46938e"/><text x="1080" y="216" fill="white" font-size="31" text-anchor="middle" font-weight="700">6</text><text x="40" y="300" fill="#617f97" font-size="26" text-anchor="start" font-weight="400">每条轨迹按 3、4、5 的次序更新；各格步长按访问次数递减（正文给出精确公式）</text><text x="530" y="365" fill="#617f97" font-size="27" text-anchor="middle" font-weight="400">Q(3, 右)</text><text x="815" y="365" fill="#617f97" font-size="27" text-anchor="middle" font-weight="400">Q(4, 右)</text><text x="1100" y="365" fill="#617f97" font-size="27" text-anchor="middle" font-weight="400">Q(5, 右)</text><text x="40" y="451" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">初始化</text><rect x="400" y="400" width="260" height="82" fill="#f2f5f7" rx="8"/><text x="530" y="454" fill="#617f97" font-size="29" text-anchor="middle" font-weight="700">0.000000</text><rect x="685" y="400" width="260" height="82" fill="#f2f5f7" rx="8"/><text x="815" y="454" fill="#617f97" font-size="29" text-anchor="middle" font-weight="700">0.000000</text><rect x="970" y="400" width="260" height="82" fill="#f2f5f7" rx="8"/><text x="1100" y="454" fill="#617f97" font-size="29" text-anchor="middle" font-weight="700">0.000000</text><text x="40" y="561" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">第 1 条结束</text><rect x="400" y="510" width="260" height="82" fill="#f8e7da" rx="8"/><text x="530" y="564" fill="#c57439" font-size="29" text-anchor="middle" font-weight="700">-0.020000</text><rect x="685" y="510" width="260" height="82" fill="#f8e7da" rx="8"/><text x="815" y="564" fill="#c57439" font-size="29" text-anchor="middle" font-weight="700">-0.020000</text><rect x="970" y="510" width="260" height="82" fill="#cce3d6" rx="8"/><text x="1100" y="564" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">1.000000</text><text x="40" y="671" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">第 2 条结束</text><rect x="400" y="620" width="260" height="82" fill="#f8e7da" rx="8"/><text x="530" y="674" fill="#c57439" font-size="29" text-anchor="middle" font-weight="700">-0.020000</text><rect x="685" y="620" width="260" height="82" fill="#cce3d6" rx="8"/><text x="815" y="674" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">0.585416</text><rect x="970" y="620" width="260" height="82" fill="#cce3d6" rx="8"/><text x="1100" y="674" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">1.000000</text><text x="40" y="781" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">第 3 条结束</text><rect x="400" y="730" width="260" height="82" fill="#cce3d6" rx="8"/><text x="530" y="784" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">0.252307</text><rect x="685" y="730" width="260" height="82" fill="#cce3d6" rx="8"/><text x="815" y="784" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">0.754136</text><rect x="970" y="730" width="260" height="82" fill="#cce3d6" rx="8"/><text x="1100" y="784" fill="#46938e" font-size="29" text-anchor="middle" font-weight="700">1.000000</text><line x1="40" y1="875" x2="1240" y2="875" stroke="#dce5ed" stroke-width="2"/><text x="40" y="930" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">第 2 条的 Q(4, 右)：旧 −0.02 → 目标 0.93 → 新 0.585416</text><text x="40" y="985" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">第 3 条的 Q(3, 右)：旧 −0.02 → 目标 0.536145 → 新 0.252307</text><text x="40" y="1040" fill="#617f97" font-size="26" text-anchor="start" font-weight="400">未访问的左动作仍为 0；早期负右值不会让 max 自动选中右动作。</text><text x="40" y="1090" fill="#617f97" font-size="25" text-anchor="start" font-weight="400">这是一段有条件的更新账本，不是该随机任务的收敛轨迹或平均学习曲线。</text></g></svg></svg>

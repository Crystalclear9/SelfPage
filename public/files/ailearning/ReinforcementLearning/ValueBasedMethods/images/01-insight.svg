<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">半梯度 TD：共享参数会放大自己的自举目标</title>
  <desc id="desc">只回放同一条零奖励转移，线性共享价值估计产生半梯度TD的1.08倍放大，而该确定性残差完整梯度产生0.936倍收缩。</desc>
  <rect width="1200" height="750" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">半梯度 TD：共享参数会放大自己的自举目标</text>
    <text x="35" y="98" font-size="25" fill="#213447" font-weight="400" text-anchor="start">固定只回放 s1 → s2，奖励 0；γ = 0.9，步长 α = 0.1</text>
    <circle cx="180" cy="185" r="37" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="180" y="195" font-size="28" fill="#2865a0" font-weight="600" text-anchor="middle">s1</text>
    <text x="180" y="264" font-size="27" fill="#2865a0" font-weight="400" text-anchor="middle">V = w</text>
    <circle cx="580" cy="185" r="37" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="580" y="195" font-size="28" fill="#2865a0" font-weight="600" text-anchor="middle">s2</text>
    <text x="580" y="264" font-size="27" fill="#2865a0" font-weight="400" text-anchor="middle">V = 2w</text>
    <path d="M225,185 L535,185" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="380" y="165" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="middle">奖励 0</text>
    <text x="850" y="171" font-size="27" fill="#213447" font-weight="400" text-anchor="start">δ = 0.9 × 2w − w</text>
    <text x="850" y="218" font-size="27" fill="#cf7432" font-weight="400" text-anchor="start">= 0.8w</text>
    <text x="35" y="320" font-size="25" fill="#213447" font-weight="400" text-anchor="start">起点 w0 = 1；每一步按各自规则重新计算</text>
    <line x1="105" y1="620.0" x2="795" y2="620.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="627.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">0</text>
    <line x1="105" y1="569.0" x2="795" y2="569.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="576.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">1</text>
    <line x1="105" y1="518.0" x2="795" y2="518.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="525.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">2</text>
    <line x1="105" y1="467.0" x2="795" y2="467.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="474.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">3</text>
    <line x1="105" y1="416.0" x2="795" y2="416.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="423.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">4</text>
    <line x1="105" y1="365.0" x2="795" y2="365.0" stroke="#cad7e2" stroke-width="1" />
    <text x="93" y="372.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">5</text>
    <line x1="105" y1="620" x2="795" y2="620" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="105" y1="365" x2="105" y2="620" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="105.0" y1="620.0" x2="105.0" y2="625.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="105.0" y="649.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">0</text>
    <line x1="277.5" y1="620.0" x2="277.5" y2="625.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="277.5" y="649.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">5</text>
    <line x1="450.0" y1="620.0" x2="450.0" y2="625.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="450.0" y="649.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">10</text>
    <line x1="622.5" y1="620.0" x2="622.5" y2="625.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="622.5" y="649.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">15</text>
    <line x1="795.0" y1="620.0" x2="795.0" y2="625.0" stroke="#5a6c7d" stroke-width="2" />
    <text x="795.0" y="649.0" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="middle">20</text>
    <polyline points="105.000,569.000 139.500,564.920 174.000,560.514 208.500,555.755 243.000,550.615 277.500,545.064 312.000,539.069 346.500,532.595 381.000,525.603 415.500,518.051 450.000,509.895 484.500,501.086 519.000,491.573 553.500,481.299 588.000,470.203 622.500,458.219 657.000,445.277 691.500,431.299 726.000,416.203 760.500,399.899 795.000,382.291" fill="none" stroke="#cf7432" stroke-width="4" stroke-linejoin="round" />
    <polyline points="105.000,569.000 139.500,572.264 174.000,575.319 208.500,578.179 243.000,580.855 277.500,583.361 312.000,585.705 346.500,587.900 381.000,589.955 415.500,591.878 450.000,593.677 484.500,595.362 519.000,596.939 553.500,598.415 588.000,599.796 622.500,601.089 657.000,602.300 691.500,603.432 726.000,604.493 760.500,605.485 795.000,606.414" fill="none" stroke="#2865a0" stroke-width="4" stroke-linejoin="round" />
    <text x="800" y="385" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">半梯度 TD</text>
    <text x="800" y="429" font-size="27" fill="#cf7432" font-weight="400" text-anchor="start">w ← 1.08w</text>
    <text x="800" y="502" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">该残差平方的完整梯度</text>
    <text x="800" y="546" font-size="27" fill="#2865a0" font-weight="400" text-anchor="start">w ← 0.936w</text>
    <text x="795" y="665" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="end">更新次数</text>
    <text x="35" y="720" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="start">仅此确定性回放反例；不代表完整残差梯度在一般任务都更好</text>
  </g>
</svg>

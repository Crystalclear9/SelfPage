<svg xmlns="http://www.w3.org/2000/svg" width="1328.64" height="993.71200" viewBox="-24.32 23.9207 1328.64 993.71200" role="img" aria-labelledby="plate-title"><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="edition-wash-1" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#f4f9f5"/><stop offset="100%" stop-color="#ebf4ee"/></linearGradient><linearGradient id="edition-wash-2" x1="0%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#fcf5f1"/><stop offset="100%" stop-color="#f9eee7"/></linearGradient></defs><title id="plate-title">冻结精确动作价值后的两个随机目标与加权期望，以及不为零的单样本 TD 误差</title><rect id="edition-paper" x="-24.32" y="23.9207" width="1328.64" height="1065.63" fill="#ffffff"/><svg id="scientific-layout" x="0" y="48.2407" width="1280" height="1016.99" viewBox="0 48.2407 1280 1016.9918" overflow="hidden"><rect id="offline-white-background" x="0" y="48.240656" width="1280" height="1016.991796" fill="#ffffff"/><rect width="1280" height="1080" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="92" fill="#608094" font-size="26" text-anchor="start" font-weight="400">冻结为精确 Q*，在位置 5 选择右动作；仅让环境结果随机</text><rect x="70" y="240" width="220" height="100" fill="url(#book-wash-edf4f9)" rx="12"/><text x="180" y="282" fill="#2e77a6" font-size="30" text-anchor="middle" font-weight="700">位置 5</text><text x="180" y="321" fill="#2e77a6" font-size="27" text-anchor="middle" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">选择右</text><line x1="290" y1="260" x2="570" y2="190" stroke="#498d8e" stroke-width="4"/><polygon points="570,190 560.0151242492785,198.32479766977275 557.2722636694704,187.35335535054006" fill="#498d8e"/><line x1="290" y1="325" x2="570" y2="420" stroke="#b96f41" stroke-width="4"/><polygon points="570,420 557.0980581824236,421.59370553612507 560.7316319236774,410.8842250355878" fill="#b96f41"/><text x="420" y="184" fill="#498d8e" font-size="28" text-anchor="middle" font-weight="400">0.85</text><text x="420" y="435" fill="#b96f41" font-size="28" text-anchor="middle" font-weight="400">0.15</text><rect x="580" y="140" width="620" height="115" fill="url(#edition-wash-1)" rx="10"/><text x="615" y="185" fill="#498d8e" font-size="29" text-anchor="start" font-weight="700">到 6：真正终止</text><text x="615" y="230" fill="#498d8e" font-size="29" text-anchor="start" font-weight="400">目标 = 1</text><rect x="580" y="375" width="620" height="115" fill="url(#edition-wash-2)" rx="10"/><text x="615" y="420" fill="#b96f41" font-size="29" text-anchor="start" font-weight="700">滑到 4：任务继续</text><text x="615" y="465" fill="#b96f41" font-size="29" text-anchor="start" font-weight="400">目标 = 0.812437</text><line x1="40" y1="535" x2="1240" y2="535" stroke="#e0e9ef" stroke-width="2"/><text x="40" y="590" fill="#233a4b" font-size="29" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">两个样本目标与其期望（横轴为目标值）</text><line x1="100.0" y1="760" x2="1180.0" y2="760" stroke="#233a4b" stroke-width="3"/><text x="186.4000000000001" y="801" fill="#608094" font-size="25" text-anchor="middle" font-weight="400">0.80</text><text x="402.3999999999998" y="801" fill="#608094" font-size="25" text-anchor="middle" font-weight="400">0.85</text><text x="618.4" y="801" fill="#608094" font-size="25" text-anchor="middle" font-weight="400">0.90</text><text x="834.3999999999996" y="801" fill="#608094" font-size="25" text-anchor="middle" font-weight="400">0.95</text><text x="1050.3999999999999" y="801" fill="#608094" font-size="25" text-anchor="middle" font-weight="400">1.00</text><line x1="240.1291851460976" y1="680" x2="240.1291851460976" y2="760" stroke="#b96f41" stroke-width="4"/><circle cx="240.1291851460976" cy="680" r="10" fill="#b96f41"/><text x="240.1291851460976" y="650" fill="#b96f41" font-size="27" text-anchor="middle" font-weight="700">0.812437</text><line x1="1050.3999999999999" y1="680" x2="1050.3999999999999" y2="760" stroke="#498d8e" stroke-width="4"/><circle cx="1050.3999999999999" cy="680" r="10" fill="#498d8e"/><text x="1050.3999999999999" y="650" fill="#498d8e" font-size="27" text-anchor="middle" font-weight="700">1.000000</text><line x1="928.8593777719148" y1="610" x2="928.8593777719148" y2="760" stroke="#2e77a6" stroke-width="3" stroke-dasharray="7 7"/><text x="916.8593777719148" y="857" fill="#2e77a6" font-size="29" text-anchor="end" font-weight="700">期望 0.971866</text><text x="40" y="930" fill="#233a4b" font-size="27" text-anchor="start" font-weight="700">成功样本的 TD 误差 +0.028134；滑回样本的 TD 误差 −0.159428。</text><text x="40" y="985" fill="#608094" font-size="27" text-anchor="start" font-weight="400">按 0.85 与 0.15 加权后误差均值为 0，但误差方差约 0.004485。</text></g></svg></svg>

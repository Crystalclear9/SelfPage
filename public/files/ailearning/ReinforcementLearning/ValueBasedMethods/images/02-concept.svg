<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img"><title>七位置随机导航的真实转移机制与精确最优动作价值</title><rect width="1280" height="1130" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="48" fill="#213447" font-size="34" text-anchor="start" font-weight="700">同一个导航任务：先明确转移，再看最优 Q 表</text><text x="40" y="92" fill="#627689" font-size="25" text-anchor="start" font-weight="400">位置 0 失败、位置 6 成功；滑动概率 0.15，折扣 0.95，普通一步奖励 −0.02</text><line x1="135" y1="300" x2="245" y2="300" stroke="#dce5ed" stroke-width="3"/><line x1="315" y1="300" x2="425" y2="300" stroke="#dce5ed" stroke-width="3"/><line x1="495" y1="300" x2="605" y2="300" stroke="#dce5ed" stroke-width="3"/><line x1="675" y1="300" x2="785" y2="300" stroke="#dce5ed" stroke-width="3"/><line x1="855" y1="300" x2="965" y2="300" stroke="#dce5ed" stroke-width="3"/><line x1="1035" y1="300" x2="1145" y2="300" stroke="#dce5ed" stroke-width="3"/><circle cx="100" cy="300" r="33" fill="#c87536"/><text x="100" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">0</text><circle cx="280" cy="300" r="33" fill="#2865a0"/><text x="280" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">1</text><circle cx="460" cy="300" r="33" fill="#2865a0"/><text x="460" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">2</text><circle cx="640" cy="300" r="33" fill="#2865a0"/><text x="640" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">3</text><circle cx="820" cy="300" r="33" fill="#2865a0"/><text x="820" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">4</text><circle cx="1000" cy="300" r="33" fill="#2865a0"/><text x="1000" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">5</text><circle cx="1180" cy="300" r="33" fill="#c87536"/><text x="1180" y="311" fill="white" font-size="31" text-anchor="middle" font-weight="700">6</text><line x1="652" y1="240" x2="805" y2="240" stroke="#2865a0" stroke-width="4"/><polygon points="805,240 793.2941876694152,245.654551943446 793.2941876694152,234.345448056554" fill="#2865a0"/><text x="730.0" y="210" fill="#2865a0" font-size="26" text-anchor="middle" font-weight="400">向右 0.85</text><line x1="628" y1="370" x2="475" y2="370" stroke="#c87536" stroke-width="4"/><polygon points="475,370 486.7058123305848,364.345448056554 486.7058123305848,375.654551943446" fill="#c87536"/><text x="550.0" y="420" fill="#c87536" font-size="26" text-anchor="middle" font-weight="400">滑回 0.15</text><text x="100" y="365" fill="#c87536" font-size="25" text-anchor="middle" font-weight="400">进入时 −1</text><text x="1180" y="365" fill="#c87536" font-size="25" text-anchor="middle" font-weight="400">进入时 +1</text><text x="40" y="475" fill="#627689" font-size="27" text-anchor="start" font-weight="400">在位置 3 选择右动作：意图向右，实际仍可能向左。</text><line x1="40" y1="515" x2="1240" y2="515" stroke="#dce5ed" stroke-width="2"/><text x="40" y="566" fill="#213447" font-size="29" text-anchor="start" font-weight="700">精确最优 Q：用完整转移核求解，非某次训练截图</text><text x="570" y="623" fill="#627689" font-size="27" text-anchor="middle" font-weight="400">左动作</text><text x="960" y="623" fill="#627689" font-size="27" text-anchor="middle" font-weight="400">右动作</text><text x="190" y="690" fill="#627689" font-size="27" text-anchor="start" font-weight="400">位置 1</text><rect x="390" y="648" width="360" height="61" fill="#fbece0" rx="6"/><text x="570" y="689" fill="#c87536" font-size="28" text-anchor="middle" font-weight="700">-0.758338</text><rect x="780" y="648" width="360" height="61" fill="#dcebdd" rx="6"/><text x="960" y="689" fill="#478574" font-size="28" text-anchor="middle" font-weight="700">0.369419</text><text x="1190" y="690" fill="#478574" font-size="36" text-anchor="middle" font-weight="400">→</text><text x="190" y="765" fill="#627689" font-size="27" text-anchor="start" font-weight="400">位置 2</text><rect x="390" y="723" width="360" height="61" fill="#e6eff7" rx="6"/><text x="570" y="764" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.389774</text><rect x="780" y="723" width="360" height="61" fill="#dcebdd" rx="6"/><text x="960" y="764" fill="#478574" font-size="28" text-anchor="middle" font-weight="700">0.664296</text><text x="1190" y="765" fill="#478574" font-size="36" text-anchor="middle" font-weight="400">→</text><text x="190" y="840" fill="#627689" font-size="27" text-anchor="start" font-weight="400">位置 3</text><rect x="390" y="798" width="360" height="61" fill="#e6eff7" rx="6"/><text x="570" y="839" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.641285</text><rect x="780" y="798" width="360" height="61" fill="#dcebdd" rx="6"/><text x="960" y="839" fill="#478574" font-size="28" text-anchor="middle" font-weight="700">0.782234</text><text x="1190" y="840" fill="#478574" font-size="36" text-anchor="middle" font-weight="400">→</text><text x="190" y="915" fill="#627689" font-size="27" text-anchor="start" font-weight="400">位置 4</text><rect x="390" y="873" width="360" height="61" fill="#e6eff7" rx="6"/><text x="570" y="914" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.750145</text><rect x="780" y="873" width="360" height="61" fill="#dcebdd" rx="6"/><text x="960" y="914" fill="#478574" font-size="28" text-anchor="middle" font-weight="700">0.876250</text><text x="1190" y="915" fill="#478574" font-size="36" text-anchor="middle" font-weight="400">→</text><text x="190" y="990" fill="#627689" font-size="27" text-anchor="start" font-weight="400">位置 5</text><rect x="390" y="948" width="360" height="61" fill="#e6eff7" rx="6"/><text x="570" y="989" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.840572</text><rect x="780" y="948" width="360" height="61" fill="#dcebdd" rx="6"/><text x="960" y="989" fill="#478574" font-size="28" text-anchor="middle" font-weight="700">0.971866</text><text x="1190" y="990" fill="#478574" font-size="36" text-anchor="middle" font-weight="400">→</text><text x="40" y="1085" fill="#627689" font-size="27" text-anchor="start" font-weight="400">终点后续价值为 0；奖励只在进入终点的转移上给一次。</text></g></svg>
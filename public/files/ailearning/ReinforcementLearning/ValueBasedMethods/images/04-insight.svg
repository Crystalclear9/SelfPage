<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img"><title>同一收益分布：看均值，也看最差部分的平均</title><rect width="1280" height="910" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一收益分布：看均值，也看最差部分的平均</text><text x="60" y="114" font-size="27" fill="#71858b" text-anchor="start">A 恒得 1；B 以 0.95 概率得 2、以 0.05 概率得 −10</text><line x1="135" y1="440" x2="1200" y2="440" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="170.0" y1="440" x2="170.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="170.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">-10</text><line x1="325.0" y1="440" x2="325.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="325.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">-8</text><line x1="480.0" y1="440" x2="480.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="480.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">-6</text><line x1="635.0" y1="440" x2="635.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="635.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">-4</text><line x1="790.0" y1="440" x2="790.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="790.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">-2</text><line x1="945.0" y1="440" x2="945.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="945.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">0</text><line x1="1022.5" y1="440" x2="1022.5" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1022.5" y="484" font-size="25" fill="#71858b" text-anchor="middle">1</text><line x1="1100.0" y1="440" x2="1100.0" y2="448" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1100.0" y="484" font-size="25" fill="#71858b" text-anchor="middle">2</text><line x1="1022.5" y1="440" x2="1022.5" y2="195" stroke="#246b82" stroke-width="8" stroke-dasharray=""/><circle cx="1022.5" cy="195" r="7" fill="#246b82"/><text x="1022.5" y="175" font-size="26" fill="#246b82" text-anchor="middle">1</text><line x1="170.0" y1="440" x2="170.0" y2="427.75" stroke="#c0673e" stroke-width="8" stroke-dasharray=""/><circle cx="170.0" cy="427.75" r="7" fill="#c0673e"/><text x="170.0" y="407.75" font-size="26" fill="#c0673e" text-anchor="middle">0.05</text><line x1="1100.0" y1="440" x2="1100.0" y2="207.25" stroke="#c0673e" stroke-width="8" stroke-dasharray=""/><circle cx="1100.0" cy="207.25" r="7" fill="#c0673e"/><text x="1100.0" y="187.25" font-size="26" fill="#c0673e" text-anchor="middle">0.95</text><text x="60" y="170" font-size="26" fill="#183944" text-anchor="start">概率质量（横轴按实际收益间距）</text><text x="60" y="548" font-size="28" fill="#183944" text-anchor="start">均值：A = 1；B = 0.95 × 2 + 0.05 × (−10) = 1.4</text><line x1="60" y1="581" x2="1220" y2="581" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="630" font-size="27" fill="#183944" text-anchor="start">下尾平均：取累计概率最差的 α 部分，原子可按概率拆分</text><text x="90" y="690" font-size="28" fill="#183944" text-anchor="start">α = 0.05</text><text x="490" y="690" font-size="28" fill="#246b82" text-anchor="start">A：1</text><text x="850" y="690" font-size="28" fill="#c0673e" text-anchor="start">B：−10</text><text x="90" y="744" font-size="28" fill="#183944" text-anchor="start">α = 0.10</text><text x="490" y="744" font-size="28" fill="#246b82" text-anchor="start">A：1</text><text x="850" y="744" font-size="28" fill="#c0673e" text-anchor="start">B：−4</text><text x="90" y="798" font-size="28" fill="#183944" text-anchor="start">α = 1.00</text><text x="490" y="798" font-size="28" fill="#246b82" text-anchor="start">A：1</text><text x="850" y="798" font-size="28" fill="#c0673e" text-anchor="start">B：1.4</text><text x="60" y="878" font-size="25" fill="#71858b" text-anchor="start">均值与下尾平均可以给出相反排序；有限评价还可能漏掉低概率损失。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img"><title>精确二项分布显示高ESS不能发现没有观察到的稀有奖励</title><rect width="1280" height="910" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="55" fill="#213447" font-size="34" text-anchor="start" font-weight="700">ESS 等于样本数，也可能一次奖励都没见到</text><text x="48" y="102" fill="#627689" font-size="26" text-anchor="start" font-weight="400">10 个独立单步回合；行为奖励动作概率 0.05；目标概率 0.8</text><text x="48" y="157" fill="#213447" font-size="28" text-anchor="start" font-weight="700">奖励动作出现次数 K 的精确分布</text><rect x="101" y="209.41681005133503" width="108" height="197.58318994866497" fill="#c87536" rx="3"/><text x="155" y="196.41681005133503" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">59.87%</text><text x="155" y="448" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">0</text><rect x="336" y="303.0088473954395" width="108" height="103.9911526045605" fill="#2865a0" rx="3"/><text x="390" y="290.0088473954395" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">31.51%</text><text x="390" y="448" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">1</text><rect x="571" y="382.37051648839355" width="108" height="24.62948351160644" fill="#2865a0" rx="3"/><text x="625" y="369.37051648839355" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">7.46%</text><text x="625" y="448" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">2</text><rect x="806" y="403.5432303843359" width="108" height="3.456769615664062" fill="#2865a0" rx="3"/><text x="860" y="390.5432303843359" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">1.05%</text><text x="860" y="448" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">3</text><rect x="1041" y="406.6605956804961" width="108" height="0.3394043195039063" fill="#2865a0" rx="3"/><text x="1095" y="393.6605956804961" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">0.10%</text><text x="1095" y="448" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">≥ 4</text><line x1="70" y1="407" x2="1210" y2="407" stroke="#213447" stroke-width="2"/><text x="1150" y="480" fill="#627689" font-size="25" text-anchor="start" font-weight="400">次数 K</text><line x1="48" y1="505" x2="1232" y2="505" stroke="#dce5ed" stroke-width="2"/><text x="48" y="552" fill="#213447" font-size="27" text-anchor="start" font-weight="700">两个可能的数据集：奖励从未出现时，均匀权重会给出满分 ESS</text><text x="65" y="604" fill="#c87536" font-size="28" text-anchor="start" font-weight="700">K = 0，概率约 59.87%</text><text x="690" y="604" fill="#2865a0" font-size="28" text-anchor="start" font-weight="700">K = 1，概率约 31.51%</text><circle cx="90" cy="650" r="14" fill="#c87536"/><circle cx="715" cy="650" r="14" fill="#2865a0"/><circle cx="138" cy="650" r="14" fill="#c87536"/><circle cx="763" cy="650" r="14" fill="#2865a0"/><circle cx="186" cy="650" r="14" fill="#c87536"/><circle cx="811" cy="650" r="14" fill="#2865a0"/><circle cx="234" cy="650" r="14" fill="#c87536"/><circle cx="859" cy="650" r="14" fill="#2865a0"/><circle cx="282" cy="650" r="14" fill="#c87536"/><circle cx="907" cy="650" r="14" fill="#2865a0"/><circle cx="330" cy="650" r="14" fill="#c87536"/><circle cx="955" cy="650" r="14" fill="#2865a0"/><circle cx="378" cy="650" r="14" fill="#c87536"/><circle cx="1003" cy="650" r="14" fill="#2865a0"/><circle cx="426" cy="650" r="14" fill="#c87536"/><circle cx="1051" cy="650" r="14" fill="#2865a0"/><circle cx="474" cy="650" r="14" fill="#c87536"/><circle cx="1099" cy="650" r="14" fill="#2865a0"/><circle cx="522" cy="650" r="14" fill="#c87536"/><circle cx="1147" cy="650" r="14" fill="#2865a0"/><text x="65" y="704" fill="#627689" font-size="26" text-anchor="start" font-weight="400">10 个相同小权重</text><text x="690" y="704" fill="#627689" font-size="26" text-anchor="start" font-weight="400">1 个权重 16 + 9 个小权重</text><text x="65" y="753" fill="#213447" font-size="26" text-anchor="start" font-weight="400">普通估计 = 0；加权估计 = 0</text><text x="690" y="753" fill="#213447" font-size="26" text-anchor="start" font-weight="400">普通估计 = 1.600</text><text x="65" y="801" fill="#c87536" font-size="28" text-anchor="start" font-weight="700">ESS = 10，但真值是 0.8</text><text x="690" y="801" fill="#213447" font-size="26" text-anchor="start" font-weight="400">加权估计 ≈ 0.894；ESS ≈ 1.249</text><text x="48" y="865" fill="#627689" font-size="24" text-anchor="start" font-weight="400">柱高为精确概率；每个圆点代表一个回合。</text></g></svg>
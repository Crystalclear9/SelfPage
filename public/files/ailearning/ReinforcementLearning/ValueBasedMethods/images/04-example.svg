<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1175" viewBox="0 0 960 1175" role="img" aria-labelledby="title desc">
<title id="title">多做评价，不能替代独立训练</title><desc id="desc">同样三十二回合，八个训练种子每个四回合的均值方差为 0.10625，三十二个种子各一回合的方差约为 0.06031。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img"><title>同样多评价回合，独立训练次数仍会改变均值方差</title><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同样多评价回合，独立训练次数仍会改变均值方差</text><text x="60" y="117" font-size="27" fill="#71858b" text-anchor="start">沿用实验一：种子间标准差 0.7，单回合噪声标准差 1.2</text><rect x="203" y="491.1875" width="124" height="88.8125" fill="#246b82"/><rect x="203" y="230.1875" width="124" height="261.0" fill="#c0673e"/><text x="265" y="213.1875" font-size="27" fill="#183944" text-anchor="middle">0.24125</text><text x="265" y="630" font-size="27" fill="#183944" text-anchor="middle">n=8, m=1</text><text x="265" y="677" font-size="26" fill="#71858b" text-anchor="middle">8 回合</text><rect x="488" y="491.1875" width="124" height="88.8125" fill="#246b82"/><rect x="488" y="425.9375" width="124" height="65.25" fill="#c0673e"/><text x="550" y="408.9375" font-size="27" fill="#183944" text-anchor="middle">0.10625</text><text x="550" y="630" font-size="27" fill="#183944" text-anchor="middle">n=8, m=4</text><text x="550" y="677" font-size="26" fill="#71858b" text-anchor="middle">32 回合</text><rect x="773" y="491.1875" width="124" height="88.8125" fill="#246b82"/><rect x="773" y="474.875" width="124" height="16.3125" fill="#c0673e"/><text x="835" y="457.875" font-size="27" fill="#183944" text-anchor="middle">0.07250</text><text x="835" y="630" font-size="27" fill="#183944" text-anchor="middle">n=8, m=16</text><text x="835" y="677" font-size="26" fill="#71858b" text-anchor="middle">128 回合</text><rect x="1058" y="557.796875" width="124" height="22.203125" fill="#246b82"/><rect x="1058" y="492.546875" width="124" height="65.25" fill="#c0673e"/><text x="1120" y="475.546875" font-size="27" fill="#183944" text-anchor="middle">0.06031</text><text x="1120" y="630" font-size="27" fill="#183944" text-anchor="middle">n=32, m=1</text><text x="1120" y="677" font-size="26" fill="#71858b" text-anchor="middle">32 回合</text><line x1="165" y1="580" x2="1210" y2="580" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="159" y1="580" x2="165" y2="580" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="588" font-size="24" fill="#71858b" text-anchor="end">0.00</text><line x1="159" y1="507.5" x2="165" y2="507.5" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="515.5" font-size="24" fill="#71858b" text-anchor="end">0.05</text><line x1="159" y1="435.0" x2="165" y2="435.0" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="443.0" font-size="24" fill="#71858b" text-anchor="end">0.10</text><line x1="159" y1="362.5" x2="165" y2="362.5" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="370.5" font-size="24" fill="#71858b" text-anchor="end">0.15</text><line x1="159" y1="290.0" x2="165" y2="290.0" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="298.0" font-size="24" fill="#71858b" text-anchor="end">0.20</text><line x1="159" y1="217.5" x2="165" y2="217.5" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="145" y="225.5" font-size="24" fill="#71858b" text-anchor="end">0.25</text><text x="60" y="172" font-size="26" fill="#183944" text-anchor="start">总体均值方差</text><rect x="70" y="718" width="30" height="18" fill="#246b82"/><text x="115" y="737" font-size="26" fill="#246b82" text-anchor="start">种子间项 0.49 / n</text><rect x="625" y="718" width="30" height="18" fill="#c0673e"/><text x="670" y="737" font-size="26" fill="#c0673e" text-anchor="start">回合内项 1.44 / (nm)</text><text x="60" y="781" font-size="25" fill="#71858b" text-anchor="start">两组 32 回合不等于相同总成本：32 次重新训练通常比 8 次更贵。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="798.156" viewBox="0 71.843891 1280 798.156109" role="img"><rect id="offline-white-background" x="0" y="71.843891" width="1280" height="798.156109" fill="#ffffff"/><title>同一批八个梯度项：三种归约对应三个不同问题</title><rect width="1280" height="870" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="116" font-size="27" fill="#71858b" text-anchor="start">构造标量梯度项，A 有 2 步、B 有 6 步；全部分子之和为 20</text><text x="60" y="248" font-size="28" fill="#183944" text-anchor="start">轨迹 A</text><circle cx="270" cy="240" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="270" y="250" font-size="28" fill="#246b82" text-anchor="middle">1</text><line x1="304" y1="240" x2="366" y2="240" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="400" cy="240" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="400" y="250" font-size="28" fill="#246b82" text-anchor="middle">1</text><text x="1160" y="250" font-size="27" fill="#c0673e" text-anchor="middle">和 = 2</text><text x="60" y="403" font-size="28" fill="#183944" text-anchor="start">轨迹 B</text><circle cx="270" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="270" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><line x1="304" y1="395" x2="366" y2="395" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="400" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="400" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><line x1="434" y1="395" x2="496" y2="395" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="530" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="530" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><line x1="564" y1="395" x2="626" y2="395" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="660" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="660" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><line x1="694" y1="395" x2="756" y2="395" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="790" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="790" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><line x1="824" y1="395" x2="886" y2="395" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="920" cy="395" r="31" fill="#f0f6f7" stroke="#246b82" stroke-width="3"/><text x="920" y="405" font-size="28" fill="#246b82" text-anchor="middle">3</text><text x="1160" y="405" font-size="27" fill="#c0673e" text-anchor="middle">和 = 18</text><line x1="60" y1="470" x2="1220" y2="470" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="558" font-size="28" fill="#183944" text-anchor="start">先求轨迹和，再按回合平均</text><text x="790" y="536" font-size="28" fill="#246b82" text-anchor="middle">2 + 18</text><line x1="680" y1="551" x2="900" y2="551" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="790" y="589" font-size="26" fill="#246b82" text-anchor="middle">2 个回合</text><text x="1000" y="566" font-size="32" fill="#c0673e" text-anchor="start">= 10</text><text x="60" y="685" font-size="28" fill="#183944" text-anchor="start">按全部有效时间步平均</text><text x="790" y="663" font-size="28" fill="#246b82" text-anchor="middle">2 + 18</text><line x1="680" y1="678" x2="900" y2="678" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="790" y="716" font-size="26" fill="#246b82" text-anchor="middle">8 个有效步</text><text x="1000" y="693" font-size="32" fill="#c0673e" text-anchor="start">= 2.5</text><line x1="60" y1="750" x2="1220" y2="750" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="800" font-size="27" fill="#183944" text-anchor="start">若先算每条轨迹的步均值：A 为 1、B 为 3，再等权平均得到 2。</text><text x="60" y="850" font-size="25" fill="#71858b" text-anchor="start">固定样本上是尺度差；跨批的长度若随机，分母也成为随机变量。</text></g></svg>

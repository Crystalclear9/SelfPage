<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img"><title>分母身份：比率同为 1，也可能是两种不同的错误</title><rect width="1280" height="870" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">分母身份：比率同为 1，也可能是两种不同的错误</text><text x="60" y="115" font-size="27" fill="#71858b" text-anchor="start">固定正优势 A = 1；ε = 0.2；当前 p = sigmoid(θ) = 0.8</text><text x="60" y="164" font-size="26" fill="#183944" text-anchor="start">旧行为概率应为独立保存的 0.5；下方求最大化目标对 θ 的导数</text><text x="60" y="245" font-size="28" fill="#246b82" text-anchor="start">固定旧分母</text><text x="580" y="280" font-size="27" fill="#246b82" text-anchor="middle">p(θ)</text><line x1="465" y1="296" x2="695" y2="296" stroke="#246b82" stroke-width="2" stroke-dasharray=""/><text x="580" y="332" font-size="27" fill="#246b82" text-anchor="middle">0.5</text><text x="765" y="307" font-size="29" fill="#246b82" text-anchor="start">r = 1.6</text><text x="965" y="307" font-size="29" fill="#246b82" text-anchor="start">L = 1.2</text><text x="1130" y="307" font-size="29" fill="#246b82" text-anchor="start">g = 0</text><line x1="60" y1="365" x2="1220" y2="365" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="430" font-size="28" fill="#c0673e" text-anchor="start">当前值作分母，停止分母梯度</text><text x="580" y="465" font-size="27" fill="#c0673e" text-anchor="middle">p(θ)</text><line x1="465" y1="481" x2="695" y2="481" stroke="#c0673e" stroke-width="2" stroke-dasharray=""/><text x="580" y="517" font-size="27" fill="#c0673e" text-anchor="middle">stop(p(θ))</text><text x="765" y="492" font-size="29" fill="#c0673e" text-anchor="start">r = 1</text><text x="965" y="492" font-size="29" fill="#c0673e" text-anchor="start">L = 1</text><text x="1130" y="492" font-size="29" fill="#c0673e" text-anchor="start">g = 0.2</text><line x1="60" y1="550" x2="1220" y2="550" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="615" font-size="28" fill="#71858b" text-anchor="start">分子分母都保留同一条梯度路径</text><text x="580" y="650" font-size="27" fill="#71858b" text-anchor="middle">p(θ)</text><line x1="465" y1="666" x2="695" y2="666" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="580" y="702" font-size="27" fill="#71858b" text-anchor="middle">p(θ)</text><text x="765" y="677" font-size="29" fill="#71858b" text-anchor="start">r = 1</text><text x="965" y="677" font-size="29" fill="#71858b" text-anchor="start">L = 1</text><text x="1130" y="677" font-size="29" fill="#71858b" text-anchor="start">g = 0</text><text x="60" y="775" font-size="25" fill="#183944" text-anchor="start">正确行因超过有利上界而平坦；第二行数值为 1，却仍继续推高概率。</text><text x="60" y="830" font-size="25" fill="#183944" text-anchor="start">第三行因同一路径相消而梯度为 0；“比率稳定”无法单独验收实现。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" role="img"><title>基线是控制变量：斜率改变，概率加权中心不变</title><rect width="1280" height="970" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">基线是控制变量：斜率改变，概率加权中心不变</text><text x="70" y="125" font-size="28" fill="#183944" text-anchor="start">横轴 C = A − 0.2；纵轴 X = C × R</text><line x1="130" y1="710.0" x2="1070" y2="710.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="110" y="718.0" font-size="24" fill="#71858b" text-anchor="end">-0.2</text><line x1="130" y1="610.0" x2="1070" y2="610.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="110" y="618.0" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="130" y1="530.0" x2="1070" y2="530.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="110" y="538.0" font-size="24" fill="#71858b" text-anchor="end">0.16</text><line x1="130" y1="409.99999999999994" x2="1070" y2="409.99999999999994" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="110" y="417.99999999999994" font-size="24" fill="#71858b" text-anchor="end">0.4</text><line x1="130" y1="210.0" x2="1070" y2="210.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="110" y="218.0" font-size="24" fill="#71858b" text-anchor="end">0.8</text><line x1="236.0" y1="710.0" x2="236.0" y2="160.0" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="236.0" y="760" font-size="25" fill="#183944" text-anchor="middle">-0.2</text><line x1="388.0" y1="710.0" x2="388.0" y2="160.0" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="388.0" y="760" font-size="25" fill="#183944" text-anchor="middle">0</text><line x1="692.0" y1="710.0" x2="692.0" y2="160.0" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="692.0" y="760" font-size="25" fill="#183944" text-anchor="middle">0.4</text><line x1="996.0000000000001" y1="710.0" x2="996.0000000000001" y2="160.0" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="996.0000000000001" y="760" font-size="25" fill="#183944" text-anchor="middle">0.8</text><line x1="160.0" y1="610.0" x2="1072.0" y2="610.0" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="388.0" y1="710.0" x2="388.0" y2="160.0" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><path d="M198.00,635.00 L1110.00,515.00" fill="none" stroke="#71858b" stroke-width="4"/><path d="M198.00,710.00 L1110.00,230.00" fill="none" stroke="#c0673e" stroke-width="4"/><path d="M198.00,630.00 L1110.00,150.00" fill="none" stroke="#246b82" stroke-width="4"/><circle cx="236.0" cy="610.0" r="22" fill="#246b82" opacity=".85"/><circle cx="996.0000000000001" cy="210.0" r="11" fill="#c0673e" opacity=".85"/><text x="226.0" y="570.0" font-size="26" fill="#246b82" text-anchor="start">A = 0，概率 0.8</text><text x="896.0000000000001" y="180.0" font-size="26" fill="#c0673e" text-anchor="start">A = 1，概率 0.2</text><circle cx="388.0" cy="530.0" r="7" fill="#183944"/><text x="413.0" y="512.0" font-size="25" fill="#183944" text-anchor="start">加权中心 (0, 0.16)</text><text x="1080" y="305.0" font-size="26" fill="#c0673e" text-anchor="start">b = 0.8</text><text x="970" y="550.0" font-size="26" fill="#71858b" text-anchor="start">b = 0.2</text><line x1="236.0" y1="610.0" x2="236.0" y2="690.0" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><text x="261.0" y="658.0" font-size="26" fill="#c0673e" text-anchor="start">0.16</text><line x1="996.0000000000001" y1="210.0" x2="996.0000000000001" y2="289.99999999999994" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><text x="1021.0000000000001" y="258.0" font-size="26" fill="#c0673e" text-anchor="start">0.16</text><text x="70" y="820" font-size="27" fill="#183944" text-anchor="start">橙线经过原点：X − 0.8 C 是到这条线的竖直距离</text><text x="70" y="865" font-size="27" fill="#183944" text-anchor="start">两种动作的竖直残差都为 0.16，因此梯度样本没有波动</text><text x="70" y="915" font-size="25" fill="#183944" text-anchor="start">蓝线经过两个样本点；其截距就是梯度均值 0.16。圆点面积按概率缩放。</text></g></svg>

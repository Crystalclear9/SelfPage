<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="924.915" viewBox="0 48.265000 1280 924.915000" role="img"><rect id="offline-white-background" x="0" y="48.265000" width="1280" height="924.915000" fill="#ffffff"/><title>四种批次穷举证明批均值基线偏差及留一修正</title><rect width="1280" height="985" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="92" fill="#627689" font-size="26" text-anchor="start" font-weight="400">两个独立动作；P(A = 1) = 0.2，奖励 R = A，logit 参数的真实梯度为 0.16</text><rect x="40" y="125" width="1200" height="60" fill="#edf3f8" rx="7"/><text x="55" y="165" fill="#213447" font-size="26" text-anchor="start" font-weight="700">动作批次</text><text x="400" y="165" fill="#213447" font-size="28" text-anchor="middle" font-weight="700">(0, 0)</text><text x="630" y="165" fill="#213447" font-size="28" text-anchor="middle" font-weight="700">(0, 1)</text><text x="860" y="165" fill="#213447" font-size="28" text-anchor="middle" font-weight="700">(1, 0)</text><text x="1090" y="165" fill="#213447" font-size="28" text-anchor="middle" font-weight="700">(1, 1)</text><text x="55" y="225" fill="#627689" font-size="27" text-anchor="start" font-weight="700">发生概率</text><text x="400" y="225" fill="#627689" font-size="29" text-anchor="middle" font-weight="400">0.64</text><text x="630" y="225" fill="#627689" font-size="29" text-anchor="middle" font-weight="400">0.16</text><text x="860" y="225" fill="#627689" font-size="29" text-anchor="middle" font-weight="400">0.16</text><text x="1090" y="225" fill="#627689" font-size="29" text-anchor="middle" font-weight="400">0.04</text><line x1="40" y1="245" x2="1240" y2="245" stroke="#dce5ed" stroke-width="2"/><text x="55" y="291" fill="#2865a0" font-size="27" text-anchor="start" font-weight="700">原始估计</text><text x="400" y="291" fill="#2865a0" font-size="29" text-anchor="middle" font-weight="400">0</text><text x="630" y="291" fill="#2865a0" font-size="29" text-anchor="middle" font-weight="400">0.4</text><text x="860" y="291" fill="#2865a0" font-size="29" text-anchor="middle" font-weight="400">0.4</text><text x="1090" y="291" fill="#2865a0" font-size="29" text-anchor="middle" font-weight="400">0.8</text><line x1="40" y1="311" x2="1240" y2="311" stroke="#dce5ed" stroke-width="2"/><text x="55" y="357" fill="#c87536" font-size="27" text-anchor="start" font-weight="700">批内中心化</text><text x="400" y="357" fill="#c87536" font-size="29" text-anchor="middle" font-weight="400">0</text><text x="630" y="357" fill="#c87536" font-size="29" text-anchor="middle" font-weight="400">0.25</text><text x="860" y="357" fill="#c87536" font-size="29" text-anchor="middle" font-weight="400">0.25</text><text x="1090" y="357" fill="#c87536" font-size="29" text-anchor="middle" font-weight="400">0</text><line x1="40" y1="377" x2="1240" y2="377" stroke="#dce5ed" stroke-width="2"/><text x="55" y="423" fill="#478574" font-size="27" text-anchor="start" font-weight="700">留一基线</text><text x="400" y="423" fill="#478574" font-size="29" text-anchor="middle" font-weight="400">0</text><text x="630" y="423" fill="#478574" font-size="29" text-anchor="middle" font-weight="400">0.5</text><text x="860" y="423" fill="#478574" font-size="29" text-anchor="middle" font-weight="400">0.5</text><text x="1090" y="423" fill="#478574" font-size="29" text-anchor="middle" font-weight="400">0</text><line x1="40" y1="443" x2="1240" y2="443" stroke="#dce5ed" stroke-width="2"/><text x="40" y="518" fill="#213447" font-size="29" text-anchor="start" font-weight="700">按各批次概率加权，得到精确期望</text><rect x="100" y="635.0" width="100" height="160.0" fill="#2865a0" rx="0"/><text x="150" y="615.0" fill="#2865a0" font-size="30" text-anchor="middle" font-weight="700">0.16</text><text x="150" y="835" fill="#2865a0" font-size="27" text-anchor="middle" font-weight="400">原始估计</text><rect x="510" y="715.0" width="100" height="80.0" fill="#c87536" rx="0"/><text x="560" y="695.0" fill="#c87536" font-size="30" text-anchor="middle" font-weight="700">0.08</text><text x="560" y="835" fill="#c87536" font-size="27" text-anchor="middle" font-weight="400">批内中心化</text><rect x="920" y="635.0" width="100" height="160.0" fill="#478574" rx="0"/><text x="970" y="615.0" fill="#478574" font-size="30" text-anchor="middle" font-weight="700">0.16</text><text x="970" y="835" fill="#478574" font-size="27" text-anchor="middle" font-weight="400">留一基线</text><line x1="70" y1="795" x2="1195" y2="795" stroke="#213447" stroke-width="2"/><text x="40" y="900" fill="#627689" font-size="28" text-anchor="start" font-weight="400">两条样本时：留一奖励差恰好是中心化奖励的 2 倍。</text><text x="40" y="947" fill="#627689" font-size="27" text-anchor="start" font-weight="400">无偏推导依赖独立采样；detach 不会消除统计依赖。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="928.436" viewBox="0 81.718147 1280 928.436293" role="img"><rect id="offline-white-background" x="0" y="81.718147" width="1280" height="928.436293" fill="#ffffff"/><title>同一批 PPO 数据：当前分子向前走，旧分母留在原地</title><rect width="1280" height="1020" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="70" y="125" font-size="26" fill="#183944" text-anchor="start">四个构造策略版本；每列评分的都是采样时同一状态、同一动作</text><circle cx="190" cy="230" r="45" fill="#edf4f5" stroke="#246b82" stroke-width="3"/><text x="190" y="240" font-size="30" fill="#246b82" text-anchor="middle">π0</text><text x="190" y="325" font-size="28" fill="#246b82" text-anchor="middle">p0 = 0.5</text><line x1="190" y1="345" x2="190" y2="405" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M190,405 l-8,-14 h16 z" fill="#246b82"/><text x="190" y="465" font-size="31" fill="#246b82" text-anchor="middle">r = 1</text><line x1="190" y1="620" x2="190" y2="515" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><path d="M190,515 l-8,14 h16 z" fill="#c0673e"/><text x="190" y="810" font-size="28" fill="#246b82" text-anchor="middle">L+ = 1</text><text x="190" y="870" font-size="25" fill="#c0673e" text-anchor="middle">KL = 0.0000</text><line x1="245" y1="230" x2="420" y2="230" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M420,230 l-14,-8 v16 z" fill="#71858b"/><text x="335" y="180" font-size="24" fill="#71858b" text-anchor="middle">同批更新</text><circle cx="480" cy="230" r="45" fill="#edf4f5" stroke="#246b82" stroke-width="3"/><text x="480" y="240" font-size="30" fill="#246b82" text-anchor="middle">π1</text><text x="480" y="325" font-size="28" fill="#246b82" text-anchor="middle">p1 = 0.6</text><line x1="480" y1="345" x2="480" y2="405" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M480,405 l-8,-14 h16 z" fill="#246b82"/><text x="480" y="465" font-size="31" fill="#246b82" text-anchor="middle">r = 1.2</text><line x1="480" y1="620" x2="480" y2="515" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><path d="M480,515 l-8,14 h16 z" fill="#c0673e"/><text x="480" y="810" font-size="28" fill="#246b82" text-anchor="middle">L+ = 1.2</text><text x="480" y="870" font-size="25" fill="#c0673e" text-anchor="middle">KL = 0.0204</text><line x1="535" y1="230" x2="710" y2="230" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M710,230 l-14,-8 v16 z" fill="#71858b"/><text x="625" y="180" font-size="24" fill="#71858b" text-anchor="middle">同批更新</text><circle cx="770" cy="230" r="45" fill="#edf4f5" stroke="#246b82" stroke-width="3"/><text x="770" y="240" font-size="30" fill="#246b82" text-anchor="middle">π2</text><text x="770" y="325" font-size="28" fill="#246b82" text-anchor="middle">p2 = 0.7</text><line x1="770" y1="345" x2="770" y2="405" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M770,405 l-8,-14 h16 z" fill="#246b82"/><text x="770" y="465" font-size="31" fill="#246b82" text-anchor="middle">r = 1.4</text><line x1="770" y1="620" x2="770" y2="515" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><path d="M770,515 l-8,14 h16 z" fill="#c0673e"/><text x="770" y="810" font-size="28" fill="#246b82" text-anchor="middle">L+ = 1.2</text><text x="770" y="870" font-size="25" fill="#c0673e" text-anchor="middle">KL = 0.0872</text><line x1="825" y1="230" x2="1000" y2="230" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M1000,230 l-14,-8 v16 z" fill="#71858b"/><text x="915" y="180" font-size="24" fill="#71858b" text-anchor="middle">同批更新</text><circle cx="1060" cy="230" r="45" fill="#edf4f5" stroke="#246b82" stroke-width="3"/><text x="1060" y="240" font-size="30" fill="#246b82" text-anchor="middle">π3</text><text x="1060" y="325" font-size="28" fill="#246b82" text-anchor="middle">p3 = 0.8</text><line x1="1060" y1="345" x2="1060" y2="405" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><path d="M1060,405 l-8,-14 h16 z" fill="#246b82"/><text x="1060" y="465" font-size="31" fill="#246b82" text-anchor="middle">r = 1.6</text><line x1="1060" y1="620" x2="1060" y2="515" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><path d="M1060,515 l-8,14 h16 z" fill="#c0673e"/><text x="1060" y="810" font-size="28" fill="#246b82" text-anchor="middle">L+ = 1.2</text><text x="1060" y="870" font-size="25" fill="#c0673e" text-anchor="middle">KL = 0.2231</text><line x1="130" y1="620" x2="1120" y2="620" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><text x="640" y="680" font-size="28" fill="#c0673e" text-anchor="middle">采集时保存的 p_old = 0.5：全程固定、独立复制、停止梯度</text><text x="640" y="735" font-size="25" fill="#183944" text-anchor="middle">每列比率都读取同一条旧记录，而不是读取前一列或当前网络</text><text x="70" y="940" font-size="26" fill="#183944" text-anchor="start">L+ 仅为这个正优势样本的裁剪值；KL 则用完整两动作旧分布求和。</text><text x="70" y="985" font-size="25" fill="#183944" text-anchor="start">重新采集下一批时才刷新旧策略身份。这里的版本序列不是实测学习轨迹。</text></g></svg>

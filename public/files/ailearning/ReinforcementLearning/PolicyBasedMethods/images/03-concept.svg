<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img"><title>GAE 是一个带边界的三角加权算子</title><rect width="1280" height="1030" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">GAE 是一个带边界的三角加权算子</text><text x="70" y="125" font-size="28" fill="#183944" text-anchor="start">γλ = 0.855；同一回合的残差为 (1, −0.5, 0.25)</text><circle cx="210" cy="230" r="50" fill="white" stroke="#246b82" stroke-width="3"/><text x="210" y="238" font-size="25" fill="#246b82" text-anchor="middle">δ0</text><circle cx="470" cy="230" r="50" fill="white" stroke="#c0673e" stroke-width="3"/><text x="470" y="238" font-size="25" fill="#c0673e" text-anchor="middle">δ1</text><circle cx="730" cy="230" r="50" fill="white" stroke="#246b82" stroke-width="3"/><text x="730" y="238" font-size="25" fill="#246b82" text-anchor="middle">δ2</text><circle cx="1100" cy="230" r="50" fill="white" stroke="#71858b" stroke-width="3"/><text x="1100" y="238" font-size="25" fill="#71858b" text-anchor="middle">δ3</text><line x1="270" y1="230" x2="410" y2="230" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M410,230 l-14,-8 v16 z" fill="#71858b"/><line x1="530" y1="230" x2="670" y2="230" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M670,230 l-14,-8 v16 z" fill="#71858b"/><line x1="900" y1="165" x2="900" y2="315" stroke="#c0673e" stroke-width="3" stroke-dasharray="8 8"/><text x="925" y="180" font-size="26" fill="#c0673e" text-anchor="start">重置</text><text x="1100" y="365" font-size="26" fill="#71858b" text-anchor="start">新回合</text><text x="70" y="390" font-size="29" fill="#183944" text-anchor="start">按未来位置展开：每一行是一份优势</text><text x="270" y="455" font-size="26" fill="#183944" text-anchor="middle">δ0 的贡献</text><text x="520" y="455" font-size="26" fill="#183944" text-anchor="middle">δ1 的贡献</text><text x="770" y="455" font-size="26" fill="#183944" text-anchor="middle">δ2 的贡献</text><text x="1110" y="455" font-size="26" fill="#183944" text-anchor="middle">行和</text><text x="100" y="555" font-size="29" fill="#183944" text-anchor="start">A0</text><rect x="170" y="505" width="200" height="80" fill="#246b82" opacity="0.42"/><text x="270" y="555" font-size="26" fill="#246b82" text-anchor="middle">1</text><rect x="420" y="505" width="200" height="80" fill="#c0673e" opacity="0.24825"/><text x="520" y="555" font-size="26" fill="#c0673e" text-anchor="middle">-0.4275</text><rect x="670" y="505" width="200" height="80" fill="#246b82" opacity="0.174826875"/><text x="770" y="555" font-size="26" fill="#246b82" text-anchor="middle">0.182756</text><line x1="900" y1="545" x2="990" y2="545" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M990,545 l-14,-8 v16 z" fill="#71858b"/><text x="1110" y="555" font-size="27" fill="#246b82" text-anchor="middle">0.75525625</text><text x="100" y="680" font-size="29" fill="#183944" text-anchor="start">A1</text><text x="270" y="680" font-size="28" fill="#71858b" text-anchor="middle">—</text><rect x="420" y="630" width="200" height="80" fill="#c0673e" opacity="0.27"/><text x="520" y="680" font-size="26" fill="#c0673e" text-anchor="middle">-0.5</text><rect x="670" y="630" width="200" height="80" fill="#246b82" opacity="0.18412499999999998"/><text x="770" y="680" font-size="26" fill="#246b82" text-anchor="middle">0.21375</text><line x1="900" y1="670" x2="990" y2="670" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M990,670 l-14,-8 v16 z" fill="#71858b"/><text x="1110" y="680" font-size="27" fill="#246b82" text-anchor="middle">-0.28625</text><text x="100" y="805" font-size="29" fill="#183944" text-anchor="start">A2</text><text x="270" y="805" font-size="28" fill="#71858b" text-anchor="middle">—</text><text x="520" y="805" font-size="28" fill="#71858b" text-anchor="middle">—</text><rect x="670" y="755" width="200" height="80" fill="#246b82" opacity="0.195"/><text x="770" y="805" font-size="26" fill="#246b82" text-anchor="middle">0.25</text><line x1="900" y1="795" x2="990" y2="795" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><path d="M990,795 l-14,-8 v16 z" fill="#71858b"/><text x="1110" y="805" font-size="27" fill="#246b82" text-anchor="middle">0.25</text><text x="70" y="920" font-size="26" fill="#183944" text-anchor="start">反向计算同一结果：A2 = 0.25，A1 = −0.5 + 0.855 × A2 = −0.28625</text><text x="70" y="975" font-size="26" fill="#183944" text-anchor="start">A0 = 1 + 0.855 × A1 = 0.75525625；新回合的 100 不进入这个三角块。</text><text x="210" y="310" font-size="27" fill="#183944" text-anchor="middle">1</text><text x="470" y="310" font-size="27" fill="#183944" text-anchor="middle">−0.5</text><text x="730" y="310" font-size="27" fill="#183944" text-anchor="middle">0.25</text><text x="1100" y="310" font-size="27" fill="#183944" text-anchor="middle">100</text></g></svg>

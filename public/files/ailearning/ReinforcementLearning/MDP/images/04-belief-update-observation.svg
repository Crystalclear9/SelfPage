<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="610" viewBox="0 0 1360 610" role="img" aria-labelledby="label detail"><title id="label">观察更新信念而不是直接改状态</title><desc id="detail">隐藏状态机制沿上轨演化。观察是它的证据，沿下轨更新信念。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="610" fill="white" stroke="none" stroke-width="1.6"/><text x="327" y="65" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">隐藏状态与观察</text><text x="1037" y="65" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">证据改变信念</text><circle cx="154" cy="204" r="33" stroke="#196f77" fill="url(#wash-teal)" stroke-width="2"/><text x="154" y="214.88" fill="#196f77" font-size="32" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">s</text><circle cx="438" cy="204" r="33" stroke="#196f77" fill="url(#wash-teal)" stroke-width="2"/><text x="438" y="214.88" fill="#196f77" font-size="32" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">s′</text><circle cx="687" cy="204" r="33" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="2"/><text x="687" y="214.88" fill="#a84b3b" font-size="32" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">o</text><line x1="198" y1="204" x2="393" y2="204" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="479" y1="204" x2="640" y2="204" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-coral)"/><text x="294" y="175" fill="#196f77" font-size="29" text-anchor="middle" font-
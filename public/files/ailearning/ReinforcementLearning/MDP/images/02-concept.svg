<text x="397.000" y="348.000" fill="#166d75" font-family="Cambria Math, Noto Sans Math, Microsoft YaHei, serif" font-size="28" text-anchor="start" font-weight="700">1 + 0.9 × 4 = 4.6</text>
<text x="676.000" y="169.000" fill="#166d75" font-family="Cambria Math, Noto Sans Math, Microsoft YaHei, serif" font-size="35" text-anchor="start" font-weight="400">0.5 × 2.8 = 1.4</text>
<text x="676.000" y="248.000" fill="#166d75" font-family="Cambria Math, Noto Sans Math, Microsoft YaHei, serif" font-size="35" text-anchor="start" font-weight="400">0.5 × 4.6 = 2.3</text>

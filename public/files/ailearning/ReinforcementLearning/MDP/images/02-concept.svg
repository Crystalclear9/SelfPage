<text x="397.000" y="163.000" fill="#166d75" font-family="Cambria Math, Noto Sans Math, Microsoft YaHei, serif" font-size="28" text-anchor="start" font-weight="700">1 + 0.9 × 2 = 2.8</text>
<path d="M145.000,246.000 L382.000,339.000" fill="none" stroke="#166d75" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M382.000,339.000 L374.335,331.158 L371.047,339.536 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>

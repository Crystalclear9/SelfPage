<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690.741" viewBox="0 62.794654 1200 690.741191" role="img"><rect id="offline-white-background" x="0" y="62.794654" width="1200" height="690.741191" fill="#ffffff"/><title>能选动作，不能选随机结果</title><desc>左边先从动作a与b选择。a的环境分支等概率，后继值二和四，即时奖励一，折扣0.9，一步目标2.8和4.6的平均为3.7。新增对照b确定奖励3.9并终止，应选b。图中的叶数为一步目标而非后继价值。</desc><rect width="1200" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="105" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">方形：行动选择     圆形：环境随机分支     叶端：一步目标</text><line x1="195" y1="375" x2="465" y2="245" stroke="#78878b" stroke-width="3"/><line x1="195" y1="375" x2="465" y2="540" stroke="#256b82" stroke-width="6"/><line x1="505" y1="245" x2="900" y2="180" stroke="#c0643c" stroke-width="3"/><line x1="505" y1="245" x2="900" y2="350" stroke="#c0643c" stroke-width="3"/><line x1="505" y1="540" x2="900" y2="540" stroke="#256b82" stroke-width="5"/><rect x="130" y="340" width="65" height="70" fill="white" stroke="#19333c" stroke-width="2"/><text x="162" y="385" font-size="32" fill="#19333c" text-anchor="middle" font-weight="400">s</text><circle cx="485" cy="245" r="26" fill="white" stroke="#c0643c" stroke-width="2"/><circle cx="485" cy="540" r="10" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="305" y="272" font-size="32" fill="#c0643c" text-anchor="middle" font-weight="400">a</text><text x="300" y="489" font-size="32" fill="#256b82" text-anchor="middle" font-weight="400">b</text><text x="665" y="171" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">概率 0.5</text><text x="675" y="340" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">概率 0.5</text><text x="945" y="190" font-size="34" fill="#c0643c" text-anchor="middle" font-weight="400">2.8</text><text x="1140" y="225" font-size="25" fill="#78878b" text-anchor="end" font-weight="400">1 + 0.9 × 2</text><text x="945" y="360" font-size="34" fill="#c0643c" text-anchor="middle" font-weight="400">4.6</text><text x="1140" y="399" font-size="25" fill="#78878b" text-anchor="end" font-weight="400">1 + 0.9 × 4</text><text x="945" y="552" font-size="34" fill="#256b82" text-anchor="middle" font-weight="400">3.9</text><text x="1130" y="595" font-size="25" fill="#78878b" text-anchor="end" font-weight="400">立即得到，随后终止</text><text x="420" y="430" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">先平均：a = 3.7</text><text x="45" y="675" font-size="31" fill="#256b82" text-anchor="start" font-weight="700">再比较：3.7 &lt; 3.9，选择 b</text><text x="45" y="729" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">把随机分支 4.6 当成可选结果，会错误地选择 a。</text></g></svg>

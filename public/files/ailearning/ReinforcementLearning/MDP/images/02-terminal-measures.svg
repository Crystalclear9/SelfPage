<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726.734" viewBox="0 67.409910 1200 726.734234" role="img" aria-labelledby="title desc"><rect id="offline-white-background" x="0" y="67.409910" width="1200" height="726.734234" fill="#ffffff"/><title id="title">同一回合：价值不变，访问总量取决于状态表示</title><desc id="desc">同一回合：价值不变，访问总量取决于状态表示</desc><rect width="1200" height="820" fill="white"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="110" font-size="26" fill="#213447" font-weight="600" text-anchor="start">① 完整吸收表示</text><circle cx="150" cy="245" r="43" fill="#eaf2fa" stroke="#2865a0" stroke-width="2"/><text x="150" y="255" font-size="30" fill="#2865a0" font-weight="600" text-anchor="middle">A</text><circle cx="410" cy="245" r="43" fill="#fff0e3" stroke="#cf7432" stroke-width="2"/><text x="410" y="255" font-size="30" fill="#cf7432" font-weight="600" text-anchor="middle">T</text><path d="M195,245 L362,245" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)"/><text x="230" y="220" font-size="27" fill="#213447" font-weight="400" text-anchor="start">奖励 1</text><path d="M400 201 C330 120 510 120 435 205" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)"/><text x="380" y="150" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">奖励 0</text><text x="80" y="355" font-size="28" fill="#213447" font-weight="600" text-anchor="start">v(A) = 1；v(T) = 0</text><text x="650" y="110" font-size="26" fill="#213447" font-weight="600" text-anchor="start">② 只列非终止状态</text><circle cx="780" cy="245" r="43" fill="#eaf2fa" stroke="#2865a0" stroke-width="2"/><text x="780" y="255" font-size="30" fill="#2865a0" font-weight="600" text-anchor="middle">A</text><path d="M825,245 L1080,245" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)"/><text x="925" y="220" font-size="27" fill="#213447" font-weight="400" text-anchor="start">奖励 1</text><text x="1050" y="293" font-size="26" fill="#5a6c7d" font-weight="400" text-anchor="start">结束</text><text x="690" y="355" font-size="28" fill="#213447" font-weight="600" text-anchor="start">K = [0]；v = 1</text><line x1="40" y1="410" x2="1160" y2="410" stroke="#cad7e2" stroke-width="2"/><text x="40" y="465" font-size="26" fill="#213447" font-weight="600" text-anchor="start">③ γ = 0.9：折扣访问次数，不是价值</text><text x="35" y="573" font-size="26" fill="#213447" font-weight="400" text-anchor="start">完整状态</text><rect x="230" y="535" width="88" height="58" fill="#2865a0"/><text x="274" y="574" font-size="30" fill="white" font-weight="600" text-anchor="middle">1</text><rect x="318" y="535" width="792" height="58" fill="#cf7432"/><text x="714" y="574" font-size="30" fill="white" font-weight="600" text-anchor="middle">9</text><text x="35" y="688" font-size="26" fill="#213447" font-weight="400" text-anchor="start">真实决策</text><rect x="230" y="650" width="88" height="58" fill="#2865a0"/><text x="274" y="689" font-size="30" fill="white" font-weight="600" text-anchor="middle">1</text><text x="230" y="620" font-size="25" fill="#2865a0" font-weight="400" text-anchor="start">A：一次真实决策</text><text x="610" y="620" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">T：终止后的虚拟自循环</text><text x="40" y="770" font-size="26" fill="#5a6c7d" font-weight="400" text-anchor="start">完整总量 10，终止前总量 1；虚拟访问奖励为 0，两种表示的回报均为 1。</text></g></svg>

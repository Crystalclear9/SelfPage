  <text x="1225" y="183" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">终止</text>
  <text x="1016" y="282" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">继续转移矩阵为 [0]，A 的价值 1</text>
  <text x="1016" y="401" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">折扣访问量</text>

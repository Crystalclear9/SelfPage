  <rect x="852" y="456" width="43" height="45" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.4"/>
  <text x="923" y="487" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">1</text>
  <text x="1015" y="685" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">合计 1</text>
  <polyline points="680,94 680,709" fill="none" stroke="#d4e0e4" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="680" y="758" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">右图的 1 和左图的 10 使用不同的访问范围，回报仍同为 1。</text>

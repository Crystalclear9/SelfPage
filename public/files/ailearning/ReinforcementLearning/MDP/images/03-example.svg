<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
<title id="title">原地扫描可在一轮内传播新值而同步更新不能</title>
<desc id="description">环境转移固定。同步读旧值第一轮得负零点一和一；原地先更新一再更新零，同一轮就读到新值一，得到零点八。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cae6e8"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#fff5f2"/><stop offset="1" stop-color="#f1d2ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f9f6fc"/><stop offset="1" stop-color="#e9deef"/></linearGradient>
<linearGradient id="wash-g" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f3f9f4"/><stop offset="1" stop-color="#d5e9da"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#e8edf1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="600" fill="white" stroke="none" stroke-width="1.7" rx="0"/>
<circle cx="382" cy="117" r="23" fill="url(#wash-t)" stroke="#176b74" stroke-width="2.5"/>
<text x="382" y="127" fill="#202a36" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<circle cx="604" cy="117" r="23" fill="url(#wash-t)" stroke="#176b74" stroke-width="2.5"/>
<text x="604" y="127" fill="#202a36" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<circle cx="847" cy="117" r="23" fill="url(#wash-n)" stroke="#526577" stroke-width="2.5"/>
<text x="847" y="127" fill="#202a36" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">T</text>
<text x="173" y="115" fill="#202a36" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">环境转移</text>
<path d="M411 116L564 116" stroke="#176b74" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M575 116L561 110L561 122Z" stroke="#176b74" stroke-width="1" fill="#176b74" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M633 116L805 116" stroke="#176b74" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M816 116L802 110L802 122Z" stroke="#176b74" stroke-width="1" fill="#176b74" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M587 135 Q492 201 410 145" stroke="#526577" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M427 155L409.153 143.102" stroke="#526577" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 137L408.321 149.758L414.977 139.774Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M364 134 C296 170 286 82 340 89" stroke="#526577" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M335 88L350.735 98.0704" stroke="#526577" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 104L351.443 91.3996L344.974 101.507Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<text x="489" y="98" fill="#526577" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">−0.1</text>
<text x="724" y="98" fill="#526577" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">+1</text>
<text x="495" y="185" fill="#526577" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">−0.1</text>
<text x="287" y="185" fill="#526577" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">−0.1</text>
<path d="M311 165L329 149" stroke="#526577" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 245L1140 245" stroke="#d9e5e8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="294" y="302" fill="#202a36" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">同步更新</text>
<path d="M70 441l25 -70h199l-25 70Z" stroke="#526577" stroke-width="1.7" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="182" y="416" fill="#526577" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">V(1) = 0</text>
<path d="M290 407L350 407" stroke="#526577" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M361 407L347 401L347 413Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M373 441l25 -70h185l-25 70Z" stroke="#a64635" stroke-width="1.7" fill="url(#wash-c)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="478" y="416" fill="#a64635" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">V(0) = −0.1</text>
<text x="306" y="518" fill="#526577" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">整轮读同一份旧表</text>
<text x="900" y="302" fill="#202a36" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原地先更新状态一</text>
<path d="M676 441l25 -70h199l-25 70Z" stroke="#176b74" stroke-width="1.7" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="416" fill="#176b74" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">V(1) = 1</text>
<path d="M896 407L956 407" stroke="#176b74" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M967 407L953 401L953 413Z" stroke="#176b74" stroke-width="1" fill="#176b74" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M979 441l25 -70h185l-25 70Z" stroke="#176b74" stroke-width="1.7" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1084" y="416" fill="#176b74" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">V(0) = 0.8</text>
<text x="912" y="518" fill="#526577" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">本轮立即读到新值</text>
<text x="601" y="567" fill="#526577" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">下方箭头表示读表依赖</text>
</svg>

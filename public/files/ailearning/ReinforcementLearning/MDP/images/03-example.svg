<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1107.2559" viewBox="0 0 1440 1107.2559" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">原地扫描可在一轮内传播新值而同步更新不能</title><rect width="1440" height="1107.2559" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">原地扫描可在一轮内传播新值而同步更新不能</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="965.2559" viewBox="0 70.8661 1280 919.2913" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="70.866142" width="1280" height="919.291339" fill="#ffffff"/><title>先画全模型，再看新价值能传播到哪里</title><rect width="1280" height="1000" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="27" fill="#1c2e40" text-anchor="start">同一导航任务：非终止代价 −0.1，进入终点奖励 +1，γ = 0.9</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#728d97"/></marker></defs><circle cx="210" cy="280" r="49" fill="white" stroke="#217292" stroke-width="3"/><text x="210" y="289" font-size="30" fill="#217292" text-anchor="middle">0</text><circle cx="640" cy="280" r="49" fill="white" stroke="#217292" stroke-width="3"/><text x="640" y="289" font-size="30" fill="#217292" text-anchor="middle">1</text><circle cx="1070" cy="280" r="49" fill="white" stroke="#217292" stroke-width="3"/><text x="1070" y="289" font-size="30" fill="#217292" text-anchor="middle">T</text><circle cx="1070" cy="280" r="42" fill="none" stroke="#217292" stroke-width="2"/><path d="M260,280 L590,280" fill="none" stroke="#728d97" stroke-width="3" marker-end="url(#arr)"/><text x="420" y="252" font-size="27" fill="#1c2e40" text-anchor="middle">向右，−0.1</text><path d="M690,280 L1020,280" fill="none" stroke="#728d97" stroke-width="3" marker-end="url(#arr)"/><text x="855" y="252" font-size="27" fill="#1c2e40" text-anchor="middle">向右，+1</text><path d="M610,321 C490,460 330,460 240,321" fill="none" stroke="#728d97" stroke-width="3" marker-end="url(#arr)"/><text x="430" y="455" font-size="27" fill="#1c2e40" text-anchor="middle">向左，−0.1</text><path d="M169,254 C90,140 310,140 251,254" fill="none" stroke="#728d97" stroke-width="3" marker-end="url(#arr)"/><text x="210" y="152" font-size="26" fill="#1c2e40" text-anchor="middle">向左，−0.1</text><text x="1070" y="370" font-size="26" fill="#1c2e40" text-anchor="middle">真正终止，V = 0</text><line x1="60" y1="480" x2="1220" y2="480" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="80" y="540" font-size="29" fill="#217292" text-anchor="start">同步第一轮：整轮读取旧值</text><circle cx="190" cy="635" r="49" fill="white" stroke="#217292" stroke-width="3"/><text x="190" y="644" font-size="30" fill="#217292" text-anchor="middle">0</text><text x="190" y="725" font-size="27" fill="#217292" text-anchor="middle">V = 0</text><circle cx="470" cy="635" r="49" fill="white" stroke="#217292" stroke-width="3"/><text x="470" y="644" font-size="30" fill="#217292" text-anchor="middle">1</text><text x="470" y="725" font-size="27" fill="#217292" text-anchor="middle">V = 0</text><path d="M420,630 L240,630" fill="none" stroke="#217292" stroke-width="3" marker-end="url(#arr)"/><text x="330" y="605" font-size="25" fill="#1c2e40" text-anchor="middle">读旧 V(1) = 0</text><text x="100" y="795" font-size="26" fill="#1c2e40" text-anchor="start">先后写出 V(0) = −0.1，V(1) = 1</text><text x="100" y="845" font-size="26" fill="#1c2e40" text-anchor="start">本轮 V(0) 尚未读到新终点收益</text><text x="100" y="895" font-size="28" fill="#217292" text-anchor="start">第二轮才得到 (0.8, 1)</text><text x="730" y="540" font-size="29" fill="#bd6c41" text-anchor="start">原地扫描：先写 1，再写 0</text><circle cx="830" cy="635" r="49" fill="white" stroke="#bd6c41" stroke-width="3"/><text x="830" y="644" font-size="30" fill="#bd6c41" text-anchor="middle">0</text><text x="830" y="725" font-size="27" fill="#bd6c41" text-anchor="middle">V = 0.8</text><circle cx="1110" cy="635" r="49" fill="white" stroke="#bd6c41" stroke-width="3"/><text x="1110" y="644" font-size="30" fill="#bd6c41" text-anchor="middle">1</text><text x="1110" y="725" font-size="27" fill="#bd6c41" text-anchor="middle">V = 1</text><path d="M1060,630 L880,630" fill="none" stroke="#bd6c41" stroke-width="3" marker-end="url(#arr)"/><text x="970" y="605" font-size="25" fill="#1c2e40" text-anchor="middle">读新 V(1) = 1</text><text x="740" y="795" font-size="25" fill="#1c2e40" text-anchor="start">V(0) = max(−0.1, −0.1 + 0.9 × 1)</text><text x="740" y="845" font-size="28" fill="#bd6c41" text-anchor="start">一轮内便传播出 0.8</text><text x="740" y="895" font-size="25" fill="#1c2e40" text-anchor="start">此处箭头为数据读取，非环境转移</text><text x="70" y="965" font-size="27" fill="#1c2e40" text-anchor="start">上图给出真实转移；下图比较读表语义。两种算法的最终最优值相同。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">势函数塑形：逐步抵消，以及不能漏掉的尾项</title>
  <desc id="desc">比较终端势为零和一时两步塑形奖励的折扣总和，展示截断回报中的终端尾项。</desc>
  <rect width="1200" height="760" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">势函数塑形：逐步抵消，以及不能漏掉的尾项</text>
    <text x="35" y="100" font-size="25" fill="#213447" font-weight="400" text-anchor="start">γ = 0.9；原奖励全为 0；塑形 F = γΦ(后继) − Φ(当前)</text>
    <text x="35" y="150" font-size="27" fill="#2865a0" font-weight="600" text-anchor="start">终端势为 0</text>
    <circle cx="150" cy="205" r="39" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="150" y="214" font-size="26" fill="#2865a0" font-weight="600" text-anchor="middle">Φ=2</text>
    <path d="M196,205 L490,205" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="345" y="182" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">F = 0.7</text>
    <circle cx="540" cy="205" r="39" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="540" y="214" font-size="26" fill="#2865a0" font-weight="600" text-anchor="middle">Φ=3</text>
    <path d="M586,205 L880,205" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="735" y="182" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">F = -3</text>
    <circle cx="930" cy="205" r="39" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="930" y="214" font-size="26" fill="#2865a0" font-weight="600" text-anchor="middle">Φ=0</text>
    <text x="150" y="290" font-size="25" fill="#213447" font-weight="400" text-anchor="start">折扣总和：</text>
    <text x="390" y="290" font-size="27" fill="#2865a0" font-weight="400" text-anchor="start">0.7 + 0.9 × (−3) = −2</text>
    <text x="35" y="410" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">终端势为 1</text>
    <circle cx="150" cy="465" r="39" fill="#fff0e3" stroke="#cf7432" stroke-width="2" />
    <text x="150" y="474" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">Φ=2</text>
    <path d="M196,465 L490,465" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" />
    <text x="345" y="442" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">F = 0.7</text>
    <circle cx="540" cy="465" r="39" fill="#fff0e3" stroke="#cf7432" stroke-width="2" />
    <text x="540" y="474" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">Φ=3</text>
    <path d="M586,465 L880,465" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" />
    <text x="735" y="442" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">F = -2.1</text>
    <circle cx="930" cy="465" r="39" fill="#fff0e3" stroke="#cf7432" stroke-width="2" />
    <text x="930" y="474" font-size="26" fill="#cf7432" font-weight="600" text-anchor="middle">Φ=1</text>
    <text x="150" y="550" font-size="25" fill="#213447" font-weight="400" text-anchor="start">折扣总和：</text>
    <text x="390" y="550" font-size="27" fill="#cf7432" font-weight="400" text-anchor="start">0.7 + 0.9 × (−2.1) = −1.19</text>
    <line x1="35" y1="345" x2="1165" y2="345" stroke="#cad7e2" stroke-width="2" />
    <text x="35" y="635" font-size="26" fill="#213447" font-weight="400" text-anchor="start">若收到终止奖励后立即截断，非零终端势留下 γ²Φ(终端)</text>
    <text x="35" y="694" font-size="27" fill="#cf7432" font-weight="400" text-anchor="start">本例尾项：0.81；因此 −2 变成 −1.19</text>
    <text x="35" y="740" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">若继续模拟吸收态的塑形奖励，必须把后续项也计入</text>
  </g>
</svg>

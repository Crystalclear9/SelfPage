<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img"><title>先让状态转移，再用新观察筛选，最后归一化</title><rect width="1280" height="920" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">先让状态转移，再用新观察筛选，最后归一化</text><text x="60" y="115" font-size="26" fill="#183944" text-anchor="start">蓝色：状态 0；橙色：状态 1；动作后以 0.1 概率翻转，收到报告 1</text><text x="155.0" y="190" font-size="27" fill="#183944" text-anchor="middle">旧状态先验</text><text x="465.0" y="190" font-size="27" fill="#183944" text-anchor="middle">动作后预测</text><text x="775.0" y="190" font-size="27" fill="#183944" text-anchor="middle">观测联合质量</text><text x="1085.0" y="190" font-size="27" fill="#183944" text-anchor="middle">新状态后验</text><path d="M225,255 C295,255 325,255 395,255 L395,390 C325,390 295,390 225,390 Z" fill="#246b82" opacity=".25"/><path d="M225,390 C295,390 325,412.5 395,412.5 L395,427.5 C325,427.5 295,405 225,405 Z" fill="#246b82" opacity=".25"/><path d="M225,405 C295,405 325,390 395,390 L395,412.5 C325,412.5 295,427.5 225,427.5 Z" fill="#c0673e" opacity=".25"/><path d="M225,427.5 C295,427.5 325,427.5 395,427.5 L395,630 C325,630 295,630 225,630 Z" fill="#c0673e" opacity=".25"/><path d="M535,255 C605,255 635,255 705,255 L705,286.5 C635,286.5 605,286.5 535,286.5 Z" fill="#246b82" opacity=".25"/><path d="M535,412.5 C605,412.5 635,286.5 705,286.5 L705,460.5 C635,460.5 605,586.5 535,586.5 Z" fill="#c0673e" opacity=".25"/><path d="M845,255 C915,255 945,255 1015,255 L1015,312.48175182481754 C945,312.48175182481754 915,286.5 845,286.5 Z" fill="#246b82" opacity=".25"/><path d="M845,286.5 C915,286.5 945,312.48175182481754 1015,312.48175182481754 L1015,630 C945,630 915,460.5 845,460.5 Z" fill="#c0673e" opacity=".25"/><rect x="85" y="255" width="140" height="150.0" fill="#246b82"/><text x="155.0" y="339.0" font-size="25" fill="white" text-anchor="middle">0.4</text><rect x="85" y="405.0" width="140" height="225.0" fill="#c0673e"/><text x="155.0" y="526.5" font-size="25" fill="white" text-anchor="middle">0.6</text><rect x="395" y="255" width="140" height="157.50000000000003" fill="#246b82"/><text x="465.0" y="342.75" font-size="25" fill="white" text-anchor="middle">0.42</text><rect x="395" y="412.5" width="140" height="217.50000000000003" fill="#c0673e"/><text x="465.0" y="530.25" font-size="25" fill="white" text-anchor="middle">0.58</text><rect x="705" y="255" width="140" height="31.500000000000007" fill="#246b82"/><text x="775.0" y="279.75" font-size="25" fill="white" text-anchor="middle">0.084</text><rect x="705" y="286.5" width="140" height="174.00000000000003" fill="#c0673e"/><text x="775.0" y="382.5" font-size="25" fill="white" text-anchor="middle">0.464</text><rect x="705" y="460.5" width="140" height="169.5" fill="#edf1f2"/><text x="775.0" y="553" font-size="25" fill="#71858b" text-anchor="middle">排除</text><text x="775.0" y="590" font-size="25" fill="#71858b" text-anchor="middle">0.452</text><rect x="1015" y="255" width="140" height="57.48175182481753" fill="#246b82"/><text x="1085.0" y="292.74087591240874" font-size="25" fill="white" text-anchor="middle">0.153</text><rect x="1015" y="312.48175182481754" width="140" height="317.5182481751825" fill="#c0673e"/><text x="1085.0" y="480.2408759124088" font-size="25" fill="white" text-anchor="middle">0.847</text><text x="325" y="690" font-size="26" fill="#183944" text-anchor="middle">按转移加权</text><text x="635" y="690" font-size="25" fill="#183944" text-anchor="middle">乘似然 0.2、0.8</text><text x="945" y="690" font-size="26" fill="#183944" text-anchor="middle">除以 0.548</text><text x="85" y="750" font-size="28" fill="#183944" text-anchor="start">联合质量 0.084 + 0.464 = 0.548，才是本次证据的总概率。</text><text x="85" y="802" font-size="28" fill="#183944" text-anchor="start">归一化后：状态 0 约 0.153285，状态 1 约 0.846715。</text><text x="85" y="860" font-size="26" fill="#183944" text-anchor="start">前三列同用原概率尺度；最后一列重新缩放为总质量 1。</text></g></svg>

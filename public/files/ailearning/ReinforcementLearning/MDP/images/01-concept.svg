<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img"><title>把未来算进去，动作排序会反转</title><desc>动作a的两个环境分支概率为0.3与0.7，即时奖励负一与一，后继价值零与二，折扣0.9。一份圆点代表0.1的模型概率质量，不是十次模拟。动作b即时0.5并终止。两排使用同一数轴，a的均值由0.4移至1.66。</desc><rect width="1200" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">把未来算进去，动作排序会反转</text><text x="40" y="104" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">动作 a：3 份概率到 s2，7 份到 s1     ·     每个圆点代表 0.1</text><text x="45" y="160" font-size="29" fill="#19333c" text-anchor="start" font-weight="700">只看即时奖励</text><line x1="170" y1="385" x2="1075" y2="385" stroke="#78878b" stroke-width="2"/><line x1="210" y1="385" x2="210" y2="392" stroke="#78878b" stroke-width="2"/><text x="210" y="423" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">-1</text><line x1="420" y1="385" x2="420" y2="392" stroke="#78878b" stroke-width="2"/><text x="420" y="423" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><line x1="630" y1="385" x2="630" y2="392" stroke="#78878b" stroke-width="2"/><text x="630" y="423" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><line x1="840" y1="385" x2="840" y2="392" stroke="#78878b" stroke-width="2"/><text x="840" y="423" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><line x1="1050" y1="385" x2="1050" y2="392" stroke="#78878b" stroke-width="2"/><text x="1050" y="423" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">3</text><circle cx="210" cy="358" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="210" cy="335" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="210" cy="312" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="630" cy="358" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="335" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="312" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="289" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="266" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="243" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="630" cy="220" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="210" y="275" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">s2：奖励 −1</text><text x="630" y="190" font-size="25" fill="#256b82" text-anchor="middle" font-weight="400">s1：奖励 +1</text><line x1="525.0" y1="255" x2="525.0" y2="385" stroke="#78878b" stroke-width="2" stroke-dasharray="6 7"/><text x="505.0" y="240" font-size="26" fill="#78878b" text-anchor="end" font-weight="400">b：0.5</text><path d="M504.00,373.00 L514.00,385.00 L504.00,397.00 L494.00,385.00 Z" stroke="#256b82" stroke-width="2" fill="#256b82" stroke-linejoin="round" stroke-linecap="round"/><line x1="504.0" y1="397" x2="504.0" y2="452" stroke="#256b82" stroke-width="2"/><text x="434.0" y="473" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">a 的期望 0.4</text><text x="45" y="500" font-size="29" fill="#19333c" text-anchor="start" font-weight="700">奖励 + 折扣后继价值</text><line x1="170" y1="725" x2="1075" y2="725" stroke="#78878b" stroke-width="2"/><line x1="210" y1="725" x2="210" y2="732" stroke="#78878b" stroke-width="2"/><text x="210" y="763" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">-1</text><line x1="420" y1="725" x2="420" y2="732" stroke="#78878b" stroke-width="2"/><text x="420" y="763" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><line x1="630" y1="725" x2="630" y2="732" stroke="#78878b" stroke-width="2"/><text x="630" y="763" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><line x1="840" y1="725" x2="840" y2="732" stroke="#78878b" stroke-width="2"/><text x="840" y="763" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><line x1="1050" y1="725" x2="1050" y2="732" stroke="#78878b" stroke-width="2"/><text x="1050" y="763" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">3</text><circle cx="210" cy="698" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="210" cy="675" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="210" cy="652" r="8" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><circle cx="1008.0" cy="698" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="675" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="652" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="629" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="606" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="583" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="1008.0" cy="560" r="8" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="190" y="615" font-size="24" fill="#c0643c" text-anchor="start" font-weight="400">−1 + 0.9 × 0</text><text x="1008.0" y="530" font-size="24" fill="#256b82" text-anchor="end" font-weight="400">1 + 0.9 × 2 = 2.8</text><line x1="525.0" y1="595" x2="525.0" y2="725" stroke="#78878b" stroke-width="2" stroke-dasharray="6 7"/><text x="505.0" y="580" font-size="26" fill="#78878b" text-anchor="end" font-weight="400">b：0.5</text><path d="M768.60,713.00 L778.60,725.00 L768.60,737.00 L758.60,725.00 Z" stroke="#256b82" stroke-width="2" fill="#256b82" stroke-linejoin="round" stroke-linecap="round"/><line x1="768.6" y1="737" x2="768.6" y2="792" stroke="#256b82" stroke-width="2"/><text x="838.6" y="813" font-size="28" fill="#256b82" text-anchor="middle" font-weight="400">a 的期望 1.66</text><text x="45" y="862" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">菱形是平均值；它不必等于任何一条环境分支的结果。</text></g></svg>

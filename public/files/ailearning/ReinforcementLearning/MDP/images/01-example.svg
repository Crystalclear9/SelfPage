<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>停止采样之后，任务的时间线是否继续？</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">停止采样之后，任务的时间线是否继续？</text><text x="60" y="115" font-size="27" fill="#71858b" text-anchor="start">当前奖励 1；折扣 0.9；采样器都在这次转移后停下</text><text x="60" y="195" font-size="30" fill="#246b82" text-anchor="start">真正终止</text><line x1="220" y1="255" x2="600" y2="255" stroke="#183944" stroke-width="3" stroke-dasharray=""/><circle cx="220" cy="255" r="7" fill="#246b82"/><circle cx="600" cy="255" r="7" fill="#c0673e"/><text x="220" y="305" font-size="26" fill="#183944" text-anchor="middle">当前状态</text><text x="600" y="305" font-size="26" fill="#183944" text-anchor="middle">任务终点</text><text x="410" y="230" font-size="27" fill="#183944" text-anchor="middle">动作，奖励 +1</text><line x1="600" y1="255" x2="900" y2="255" stroke="#71858b" stroke-width="3" stroke-dasharray="8 7"/><text x="940" y="250" font-size="29" fill="#246b82" text-anchor="start">后续价值 0</text><text x="940" y="303" font-size="25" fill="#183944" text-anchor="start">目标 = 1</text><text x="60" y="425" font-size="30" fill="#c0673e" text-anchor="start">外部截断</text><line x1="220" y1="485" x2="600" y2="485" stroke="#183944" stroke-width="3" stroke-dasharray=""/><circle cx="220" cy="485" r="7" fill="#246b82"/><circle cx="600" cy="485" r="7" fill="#c0673e"/><text x="220" y="535" font-size="26" fill="#183944" text-anchor="middle">当前状态</text><text x="600" y="535" font-size="26" fill="#183944" text-anchor="middle">原回合最后状态</text><text x="410" y="460" font-size="27" fill="#183944" text-anchor="middle">动作，奖励 +1</text><line x1="600" y1="485" x2="900" y2="485" stroke="#71858b" stroke-width="3" stroke-dasharray="8 7"/><text x="940" y="480" font-size="29" fill="#c0673e" text-anchor="start">估计后续价值 5</text><text x="940" y="533" font-size="25" fill="#183944" text-anchor="start">目标 = 1 + 0.9 × 5</text><text x="940" y="578" font-size="32" fill="#c0673e" text-anchor="start">= 5.5</text><line x1="60" y1="645" x2="1220" y2="645" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="699" font-size="28" fill="#183944" text-anchor="start">截断后的新回合初态属于另一条轨迹，不能替代原回合最后状态。</text><text x="60" y="745" font-size="26" fill="#71858b" text-anchor="start">补尾依赖估值精度；有限任务自身的期限到达属于真正终止。</text></g></svg>

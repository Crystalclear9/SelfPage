<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="591" viewBox="0 0 1320 591" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">终止与截断的后续价值不同</title><desc id="plate-desc">两种采样都观察当前奖励；真终止去掉尾值，外部截断仍需要任务的继续价值。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="591" fill="white" stroke="none" stroke-width="1.6"/><text x="251" y="97" fill="#a84b3b" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">真正终止</text><circle cx="164" cy="185" r="31" stroke="#202a37" stroke-width="2" fill="url(#wash-ink)"/><text x="164" y="195.85" fill="#202a37" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">s</text><line x1="203" y1="185" x2="513" y2="185" stroke="#a84b3b" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><text x="347" y="155" fill="#a84b3b" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">当前奖励</text><circle cx="555" cy="185" r="32" stroke="#a84b3b" stroke-width="2" fill="url(#wash-coral)"/><text x="555" y="195.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">s′</text><line x1="599" y1="185" x2="671" y2="185" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round"/><line x1="673" y1="170" x2="673" y2="200" stroke="#a84b3b" stroke-width="2.7" stroke-linecap="round"/><text x="896" y="194" fill="#a84b3b" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">没有后续任务回报</text><text x="251" y="324" fill="#196f77" font-size="38" font
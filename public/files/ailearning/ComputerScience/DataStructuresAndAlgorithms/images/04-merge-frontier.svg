<svg xmlns="http://www.w3.org/2000/svg" width="1123.850" height="446.352" viewBox="11.550 62.679 1123.850 446.352" role="img" aria-labelledby="merge-title merge-desc"><title id="merge-title">三路归并：弹出最小段头，只补同一段</title><desc id="merge-desc">三个有序段为 A=(1,4,7)、B=(2,5,8)、C=(3,6,9)。初始堆的段头为1、2、3；弹出A的1后，从A补入4，新的堆根是B的2。连续重复后输出1到9。 多路归并：堆中只放每段当前的最小项 每次只推进一个输入段；其余段头继续留在堆中。</desc><rect width="1123.85" height="446.352" fill="white" x="11.55" y="62.679" /><defs><marker id="merge-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="108" font-size="27" fill="#213447" text-anchor="start">三个已排序的输入段</text><text x="35" y="191" font-size="27" fill="#213447" text-anchor="start">A</text><rect x="80" y="155" width="65" height="60" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="112.5" y="194.0" font-size="27" fill="#213447" text-anchor="middle">1</text><rect x="159" y="155" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="191.5" y="194.0" font-size="27" fill="#213447" text-anchor="middle">4</text><rect x="238" y="155" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="270.5" y="194.0" font-size="27" fill="#213447" text-anchor="middle">7</text><text x="35" y="285" font-size="27" fill="#213447" text-anchor="start">B</text><rect x="80" y="249" width="65" height="60" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="112.5" y="288.0" font-size="27" fill="#213447" text-anchor="middle">2</text><rect x="159" y="249" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="191.5" y="288.0" font-size="27" fill="#213447" text-anchor="middle">5</text><rect x="238" y="249" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="270.5" y="288.0" font-size="27" fill="#213447" text-anchor="middle">8</text><text x="35" y="379" font-size="27" fill="#213447" text-anchor="start">C</text><rect x="80" y="343" width="65" height="60" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="112.5" y="382.0" font-size="27" fill="#213447" text-anchor="middle">3</text><rect x="159" y="343" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="191.5" y="382.0" font-size="27" fill="#213447" text-anchor="middle">6</text><rect x="238" y="343" width="65" height="60" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="270.5" y="382.0" font-size="27" fill="#213447" text-anchor="middle">9</text><text x="410" y="108" font-size="27" fill="#213447" text-anchor="start">初始候选堆</text><text x="820" y="108" font-size="27" fill="#213447" text-anchor="start">输出 1 后：从 A 补入 4</text><line x1="570" y1="220" x2="480" y2="305" stroke="#2865a0" stroke-width="2.5" /><line x1="570" y1="220" x2="660" y2="305" stroke="#2865a0" stroke-width="2.5" /><rect x="515" y="158" width="110" height="62" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="570.0" y="198.0" font-size="27" fill="#213447" text-anchor="middle">1 · A</text><rect x="425" y="305" width="110" height="62" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="480.0" y="345.0" font-size="27" fill="#213447" text-anchor="middle">2 · B</text><rect x="605" y="305" width="110" height="62" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="660.0" y="345.0" font-size="27" fill="#213447" text-anchor="middle">3 · C</text><line x1="950" y1="220" x2="860" y2="305" stroke="#2865a0" stroke-width="2.5" /><line x1="950" y1="220" x2="1040" y2="305" stroke="#2865a0" stroke-width="2.5" /><rect x="895" y="158" width="110" height="62" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="950.0" y="198.0" font-size="27" fill="#213447" text-anchor="middle">2 · B</text><rect x="805" y="305" width="110" height="62" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="860.0" y="345.0" font-size="27" fill="#213447" text-anchor="middle">4 · A</text><rect x="985" y="305" width="110" height="62" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="1040.0" y="345.0" font-size="27" fill="#213447" text-anchor="middle">3 · C</text><line x1="650" y1="185" x2="795" y2="185" stroke="#2865a0" stroke-width="2.5" marker-end="url(#merge-arrow)" /><text x="684" y="240" font-size="26" fill="#cf7432" text-anchor="start">弹出 1</text><text x="36" y="461" font-size="27" fill="#213447" text-anchor="start">依次输出</text><rect x="220" y="420" width="84" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="262.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">1</text><rect x="321" y="420" width="84" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" /><text x="363.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">2</text><rect x="422" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="464.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">3</text><rect x="523" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="565.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">4</text><rect x="624" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="666.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">5</text><rect x="725" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="767.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">6</text><rect x="826" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="868.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">7</text><rect x="927" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="969.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">8</text><rect x="1028" y="420" width="84" height="65" rx="6" fill="#eaf2fa" stroke="#9cb9d2" /><text x="1070.0" y="461.5" font-size="27" fill="#213447" text-anchor="middle">9</text></g></svg>

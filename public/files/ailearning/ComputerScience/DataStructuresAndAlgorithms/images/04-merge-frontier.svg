<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="659" viewBox="0 0 1200 659" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">多路归并每次只推进被取出的来源</title>
<desc id="fig-desc">三个有序序列，堆中只留每个来源当前最前面的一项。取最小者后只推进它。</desc>

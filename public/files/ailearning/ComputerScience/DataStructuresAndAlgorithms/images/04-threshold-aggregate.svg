<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title desc"><title id="title">聚合排名：局部候选不足，安全停止需要上界</title><desc id="desc">两列局部第一名是A和B，但两列总分最高是C。阈值算法利用未见实体的单调上界建立停止证书。</desc><rect width="1200" height="875" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">聚合排名：局部候选不足，安全停止需要上界</text><text x="40" y="95" font-size="26" fill="#627689" text-anchor="start">固定数据，同一批实体；两列各按分数降序，目标为两列之和</text><text x="40" y="150" font-size="28" fill="#213447" text-anchor="start">局部第一名的并集漏掉全局第一名</text><text x="45" y="210" font-size="26" fill="#213447" text-anchor="start">排名</text><text x="205" y="210" font-size="26" fill="#213447" text-anchor="start">列表 1</text><text x="365" y="210" font-size="26" fill="#213447" text-anchor="start">列表 2</text><text x="45" y="267" font-size="26" fill="#213447" text-anchor="start">1</text><text x="205" y="267" font-size="26" fill="#213447" text-anchor="start">A: 9</text><text x="365" y="267" font-size="26" fill="#213447" text-anchor="start">B: 9</text><rect x="35" y="290" width="470" height="49" fill="#2865a0" opacity="0.09" rx="3"/><text x="45" y="324" font-size="26" fill="#2865a0" text-anchor="start">2</text><text x="205" y="324" font-size="26" fill="#2865a0" text-anchor="start">C: 7</text><text x="365" y="324" font-size="26" fill="#2865a0" text-anchor="start">C: 6</text><text x="45" y="381" font-size="26" fill="#213447" text-anchor="start">3</text><text x="205" y="381" font-size="26" fill="#213447" text-anchor="start">D: 2</text><text x="365" y="381" font-size="26" fill="#213447" text-anchor="start">D: 2</text><text x="45" y="438" font-size="26" fill="#213447" text-anchor="start">4</text><text x="205" y="438" font-size="26" fill="#213447" text-anchor="start">E: 1</text><text x="365" y="438" font-size="26" fill="#213447" text-anchor="start">E: 1</text><text x="45" y="495" font-size="26" fill="#213447" text-anchor="start">5</text><text x="205" y="495" font-size="26" fill="#213447" text-anchor="start">F: 0.5</text><text x="365" y="495" font-size="26" fill="#213447" text-anchor="start">F: 0.5</text><text x="45" y="552" font-size="26" fill="#213447" text-anchor="start">6</text><text x="205" y="552" font-size="26" fill="#213447" text-anchor="start">B: 0</text><text x="365" y="552" font-size="26" fill="#213447" text-anchor="start">A: 0</text><text x="45" y="670" font-size="26" fill="#2865a0" text-anchor="start">完整总分：C=13，A=B=9，D=4</text><text x="45" y="715" font-size="27" fill="#c87536" text-anchor="start">局部只取 A、B，不能恢复 C。</text><text x="600" y="150" font-size="27" fill="#213447" text-anchor="start">扫描门槛：未见实体的总分上界</text><text x="600" y="200" font-size="26" fill="#213447" text-anchor="start">深度 1：还不能停</text><rect x="615" y="225" width="216" height="31" fill="#2865a0" opacity="0.85" rx="3"/><text x="841" y="250" font-size="25" fill="#2865a0" text-anchor="start">9</text><rect x="615" y="270" width="432" height="31" fill="#c87536" opacity="0.8" rx="3"/><text x="1057" y="295" font-size="25" fill="#c87536" text-anchor="start">18</text><text x="600" y="370" font-size="26" fill="#213447" text-anchor="start">深度 2：同分规则需另判</text><rect x="615" y="395" width="312" height="31" fill="#2865a0" opacity="0.85" rx="3"/><text x="937" y="420" font-size="25" fill="#2865a0" text-anchor="start">13</text><rect x="615" y="440" width="312" height="31" fill="#c87536" opacity="0.8" rx="3"/><text x="937" y="465" font-size="25" fill="#c87536" text-anchor="start">13</text><text x="600" y="540" font-size="26" fill="#213447" text-anchor="start">深度 3：严格超过上界，可停</text><rect x="615" y="565" width="312" height="31" fill="#2865a0" opacity="0.85" rx="3"/><text x="937" y="590" font-size="25" fill="#2865a0" text-anchor="start">13</text><rect x="615" y="610" width="96" height="31" fill="#c87536" opacity="0.8" rx="3"/><text x="721" y="635" font-size="25" fill="#c87536" text-anchor="start">4</text><text x="600" y="730" font-size="25" fill="#2865a0" text-anchor="start">蓝：已计算的最高完整分数</text><text x="600" y="775" font-size="25" fill="#c87536" text-anchor="start">橙：当前两列末尾值之和</text><text x="40" y="835" font-size="24" fill="#627689" text-anchor="start">前提：各列按各自分数降序访问；遇到实体后可查全列得分；聚合函数逐坐标单调。</text></g></svg>
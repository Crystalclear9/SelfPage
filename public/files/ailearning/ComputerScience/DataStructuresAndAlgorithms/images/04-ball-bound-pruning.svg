<svg xmlns="http://www.w3.org/2000/svg" width="1093.333" height="543.881" viewBox="27.733 57.587 1093.333 543.881" role="img" aria-labelledby="title desc"><title id="title">区域下界排除所有点，才是精确剪枝的理由</title><desc id="desc">区域下界排除所有点，才是精确剪枝的理由 </desc><rect width="1093.333" height="543.881" fill="white" x="27.733" y="57.587" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747" transform="translate(0,-80)"><text x="235" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">0</text><text x="325" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">1</text><text x="415" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">2</text><text x="505" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">3</text><text x="595" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">4</text><text x="685" y="517" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">5</text><text x="210" y="394" font-size="25" fill="#728694" text-anchor="end" font-weight="400">1</text><text x="210" y="304" font-size="25" fill="#728694" text-anchor="end" font-weight="400">2</text><text x="210" y="214" font-size="25" fill="#728694" text-anchor="end" font-weight="400">3</text><path d="M208.0 475L703.0 475" fill="none" stroke="#728694" stroke-width="2" /><path d="M235 511.0L235 169.0" fill="none" stroke="#728694" stroke-width="2" /><circle cx="235" cy="475" r="180" fill="none" stroke="#728694" stroke-width="2" stroke-dasharray="8 7" /><circle cx="595" cy="475" r="90" fill="#faeee4" stroke="#c96e32" stroke-width="2" /><circle cx="595" cy="475" r="5" fill="#c96e32" stroke="#c96e32" stroke-width="2" /><text x="595" y="367" font-size="28" fill="#c96e32" text-anchor="middle" font-weight="400">区域 A</text><circle cx="415" cy="295" r="90" fill="#edf4f9" stroke="#286da2" stroke-width="2" /><circle cx="415" cy="295" r="5" fill="#286da2" stroke="#286da2" stroke-width="2" /><text x="415" y="187" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">区域 B</text><circle cx="235" cy="475" r="7" fill="#203747" stroke="#203747" stroke-width="2" /><text x="190" y="511" font-size="28" fill="#203747" text-anchor="start" font-weight="400">q</text><circle cx="235" cy="295" r="7" fill="#203747" stroke="#203747" stroke-width="2" /><text x="255" y="280" font-size="28" fill="#203747" text-anchor="start" font-weight="400">a</text><circle cx="361.0" cy="349.0" r="8" fill="#286da2" stroke="#286da2" stroke-width="2" /><text x="293.5" y="374.2" font-size="28" fill="#286da2" text-anchor="start" font-weight="400">p</text><path d="M235 475L595 475" fill="none" stroke="#c96e32" stroke-width="3" /><path d="M235 475L415 295" fill="none" stroke="#286da2" stroke-width="3" /><text x="790" y="220" font-size="29" fill="#203747" text-anchor="start" font-weight="600">两个区域的半径均为 1</text><text x="790" y="290" font-size="28" fill="#c96e32" text-anchor="start" font-weight="400">A：中心 (4, 0)</text><text x="790" y="340" font-size="28" fill="#c96e32" text-anchor="start" font-weight="400">下界 4 − 1 = 3 &gt; 2</text><text x="790" y="385" font-size="27" fill="#203747" text-anchor="start" font-weight="400">整区都比 a 更远，可剪枝</text><text x="790" y="470" font-size="28" fill="#286da2" text-anchor="start" font-weight="400">B：中心 (2, 2)</text><text x="790" y="520" font-size="27" fill="#286da2" text-anchor="start" font-weight="400">下界 √8 − 1 ≈ 1.828 &lt; 2</text><text x="790" y="565" font-size="27" fill="#203747" text-anchor="start" font-weight="400">不能排除：还须进入搜索</text><text x="235" y="590" font-size="25" fill="#728694" text-anchor="middle">当前距离门槛 2</text></g></svg>

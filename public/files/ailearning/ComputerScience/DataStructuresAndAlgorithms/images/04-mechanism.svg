<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">分片均值：压缩之后，样本的重量不能消失</text><text xml:space="preserve" x="50" y="125" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">A 只有 1 个观测 0；B 有 3 个观测，全部为 10</text><line x1="160" y1="365" x2="1330" y2="365" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="210" y1="357" x2="210" y2="373" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="210" y="413" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><line x1="460.0" y1="357" x2="460.0" y2="373" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="460.0" y="413" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">2.5</text><line x1="710" y1="357" x2="710" y2="373" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="710" y="413" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">5</text><line x1="960.0" y1="357" x2="960.0" y2="373" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="960.0" y="413" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">7.5</text><line x1="1210" y1="357" x2="1210" y2="373" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1210" y="413" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">10</text><line x1="160" y1="690" x2="1330" y2="690" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="210" y1="682" x2="210" y2="698" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="210" y="738" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><line x1="460.0" y1="682" x2="460.0" y2="698" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="460.0" y="738" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">2.5</text><line x1="710" y1="682" x2="710" y2="698" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="710" y="738" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">5</text><line x1="960.0" y1="682" x2="960.0" y2="698" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="960.0" y="738" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">7.5</text><line x1="1210" y1="682" x2="1210" y2="698" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1210" y="738" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="50" y="210" font-size="31" fill="#2676ad" text-anchor="start" font-weight="400">按观测等权：4 个样本，质心 7.5</text><circle cx="210" cy="320" r="18" fill="#2676ad" stroke="none" stroke-width="2"/><circle cx="1210" cy="320" r="18" fill="#2676ad" stroke="none" stroke-width="2"/><circle cx="1210" cy="274" r="18" fill="#2676ad" stroke="none" stroke-width="2"/><circle cx="1210" cy="228" r="18" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="210" y="275" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">A：1 份</text><text xml:space="preserve" x="1310" y="280" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">B：3 份</text><path d="M960,347 L940,322 L980,322 Z" stroke="#c46c22" stroke-width="2" fill="#fff0df" stroke-dasharray=""/><text xml:space="preserve" x="960" y="462" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">正确：30 ÷ 4 = 7.5</text><text xml:space="preserve" x="50" y="535" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">把分片等权：只剩 2 个代表，质心变成 5</text><circle cx="210" cy="645" r="18" fill="#8a9ba6" stroke="none" stroke-width="2"/><circle cx="1210" cy="645" r="18" fill="#8a9ba6" stroke="none" stroke-width="2"/><text xml:space="preserve" x="210" y="604" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">均值 0</text><text xml:space="preserve" x="1210" y="604" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">均值 10</text><path d="M710,672 L690,647 L730,647 Z" stroke="#c46c22" stroke-width="2" fill="#fff0df" stroke-dasharray=""/><text xml:space="preserve" x="710" y="790" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">改变目标：(0 + 10) ÷ 2 = 5</text><text xml:space="preserve" x="50" y="880" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">保存 (计数, 总和)：A=(1,0)，B=(3,30)，合并为 (4,30)。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558.38" viewBox="11.00 10.00 1038.00 483.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">合并均值必须保留各分片的计数</title><desc id="desc">每个分片只交付均值时，会丢掉代表多少条样本的信息。这里一个分片只有一项，另一个有三项；完整数据均值为 7.5，而两个均值直接平均得到 5。 可合并的状态应至少包含计数与总和，或等价的计数与均值；稳定合并方差还需要二阶状态。分片大小相等只是直接平均恰好成立的一项特殊条件。 合并均值按计数加权；本例为 (0×1+10×3)÷4=7.5。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="595" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">合并均值必须保留各分片的计数</text><rect x="60.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">分片</text><rect x="330.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">样本</text><rect x="600.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">计数</text><rect x="870.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">均值</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">A</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">1</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">B</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">10,10,10</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">3</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">10</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">正确合并</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">全部四项</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">4</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">7.5</text><rect x="60.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="455" font-size="24" fill="#213447" text-anchor="start" font-weight="400">直接均值平均</text><rect x="330.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="455" font-size="24" fill="#213447" text-anchor="start" font-weight="400">两个均值</text><rect x="600.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="455" font-size="24" fill="#213447" text-anchor="start" font-weight="400">2 个分片</text><rect x="870.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="455" font-size="24" fill="#213447" text-anchor="start" font-weight="400">5：改变权重</text></g></svg>

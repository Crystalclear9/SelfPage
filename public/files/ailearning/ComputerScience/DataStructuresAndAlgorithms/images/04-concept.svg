<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title id="figure-title">Top-k：候选变化后，淘汰门槛也随之变化</title><desc id="figure-desc">在初始候选八和九上连续输入一、八点五、十；门槛依次为八、八、八点五，最终保留九和十。</desc><rect width="1200" height="680" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">Top-k：候选变化后，淘汰门槛也随之变化</text><text x="40" y="115" font-size="29" fill="#213447" text-anchor="start" font-weight="400">同一个候选堆，按顺序读取 1 → 8.5 → 10</text><text x="40" y="190" font-size="27" fill="#213447" text-anchor="start" font-weight="600">输入</text><text x="330" y="190" font-size="27" fill="#213447" text-anchor="start" font-weight="600">处理前门槛</text><text x="650" y="190" font-size="27" fill="#213447" text-anchor="start" font-weight="600">动作</text><text x="960" y="190" font-size="27" fill="#213447" text-anchor="start" font-weight="600">保留集合</text><rect x="40" y="230" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="115.0" y="274.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="330" y="230" width="180" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="420.0" y="274.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">8</text><text x="650" y="275" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">拒绝</text><rect x="950" y="230" width="210" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1055.0" y="274.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">{8,9}</text><path d="M210 265 L305 265" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M780 265 L925 265" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="40" y="345" width="150" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="115.0" y="389.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">8.5</text><rect x="330" y="345" width="180" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="420.0" y="389.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">8</text><text x="650" y="390" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">淘汰 8</text><rect x="950" y="345" width="210" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1055.0" y="389.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">{8.5,9}</text><path d="M210 380 L305 380" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M780 380 L925 380" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="40" y="460" width="150" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="115.0" y="504.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">10</text><rect x="330" y="460" width="180" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="420.0" y="504.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">8.5</text><text x="650" y="505" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">淘汰 8.5</text><rect x="950" y="460" width="210" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1055.0" y="504.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">{9,10}</text><path d="M210 495 L305 495" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M780 495 L925 495" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="625" font-size="28" fill="#213447" text-anchor="start" font-weight="400">每次读新项前重新看堆根；堆数组本身不是完整排序。</text></g></svg>

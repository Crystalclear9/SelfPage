<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：先看堆根 8 作为当前前二名的门槛</title><desc id="detail-desc">先看堆根 8 作为当前前二名的门槛。右侧三个独立输入分别是拒绝 1、以 8.5 替换 8、以 10 替换 8；小根堆便于访问最小候选，但输出有序结果仍需额外排序。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="30" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">保留最大的 2 个数：小根堆根是淘汰门槛</text><line x1="220" y1="135" x2="120" y2="270" stroke="#2865a0" stroke-width="3" /><circle cx="220" cy="135" r="35" fill="#2865a0" stroke="white" stroke-width="2" /><text x="220" y="142" font-size="22" fill="white" font-weight="700" text-anchor="middle">8</text><circle cx="120" cy="270" r="35" fill="#2865a0" stroke="white" stroke-width="2" /><text x="120" y="277" font-size="22" fill="white" font-weight="700" text-anchor="middle">9</text><text x="30" y="355" font-size="24" fill="#213447" font-weight="400" text-anchor="start">当前候选集合 {8,9}</text><rect x="450" y="85" width="180" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="540.0" y="113" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">输入 1</text><path d="M645,105 L715,105" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="745" y="113" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">不超过根：拒绝</text><rect x="450" y="190" width="180" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="540.0" y="218" font-size="22" fill="#cf7432" font-weight="600" text-anchor="middle">输入 8.5</text><path d="M645,210 L715,210" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="745" y="218" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">替换 8 → {8.5,9}</text><rect x="450" y="295" width="180" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="540.0" y="323" font-size="22" fill="#cf7432" font-weight="600" text-anchor="middle">输入 10</text><path d="M645,315 L715,315" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="745" y="323" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">替换 8 → {9,10}</text></g></svg>

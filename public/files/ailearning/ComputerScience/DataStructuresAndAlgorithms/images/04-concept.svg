<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1273.5267" viewBox="0 0 1440 1273.5267" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">Top-k 堆根保存当前门槛</title><rect width="1440" height="1273.5267" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">Top-k 堆根保存当前门槛</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1131.5267" viewBox="0 0 1440 1212.35" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>Top-k 的门槛是动态维护的堆根</title><svg width="1440" height="762.353" viewBox="21.000 0.000 1122.000 594.000" role="img" aria-labelledby="title desc"><title id="title">Top-k 的门槛是动态维护的堆根</title><desc id="desc">k为2，初始最小堆[8,9]。1被拒绝，8.5替根保持[8.5,9]；10临时替根形成[10,9]，下沉交换得到[9,10]。 </desc><rect width="1122.0" height="594.0" fill="white" x="21.0" y="0.0"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#2073ad"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c26e34"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b899d"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#21374d"><text x="45" y="45" fill="#21374d" font-size="28" text-anchor="start" font-weight="400">k = 2；保留最大两项；每个父节点 ≤ 它的孩子</text><text x="150" y="115" fill="#2073ad" font-size="26" text-anchor="middle" font-weight="600">初始最小堆</text><line x1="150" y1="205" x2="95" y2="295" stroke="#d9e3eb" stroke-width="3"/><circle cx="150" cy="175" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="150" y="185" fill="#2073ad" font-size="29" text-anchor="middle" font-weight="400">8</text><circle cx="95" cy="330" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="95" y="340" fill="#21374d" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="150" y="405" fill="#2073ad" font-size="28" text-anchor="middle" font-weight="400">[8, 9]</text><text x="465" y="115" fill="#2073ad" font-size="26" text-anchor="middle" font-weight="600">读入 8.5 后</text><line x1="465" y1="205" x2="410" y2="295" stroke="#d9e3eb" stroke-width="3"/><circle cx="465" cy="175" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="465" y="185" fill="#2073ad" font-size="29" text-anchor="middle" font-weight="400">8.5</text><circle cx="410" cy="330" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="410" y="340" fill="#21374d" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="465" y="405" fill="#2073ad" font-size="28" text-anchor="middle" font-weight="400">[8.5, 9]</text><text x="785" y="115" fill="#c26e34" font-size="26" text-anchor="middle" font-weight="600">读入 10：先替根</text><line x1="785" y1="205" x2="730" y2="295" stroke="#d9e3eb" stroke-width="3"/><circle cx="785" cy="175" r="34" fill="white" stroke="#c26e34" stroke-width="2"/><text x="785" y="185" fill="#c26e34" font-size="29" text-anchor="middle" font-weight="400">10</text><circle cx="730" cy="330" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="730" y="340" fill="#21374d" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="785" y="405" fill="#c26e34" font-size="28" text-anchor="middle" font-weight="400">[10, 9]</text><text x="1080" y="115" fill="#2073ad" font-size="26" text-anchor="middle" font-weight="600">下沉后</text><line x1="1080" y1="205" x2="1025" y2="295" stroke="#d9e3eb" stroke-width="3"/><circle cx="1080" cy="175" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="1080" y="185" fill="#2073ad" font-size="29" text-anchor="middle" font-weight="400">9</text><circle cx="1025" cy="330" r="34" fill="white" stroke="#2073ad" stroke-width="2"/><text x="1025" y="340" fill="#21374d" font-size="29" text-anchor="middle" font-weight="400">10</text><text x="1080" y="405" fill="#2073ad" font-size="28" text-anchor="middle" font-weight="400">[9, 10]</text><text x="45" y="495" fill="#7b899d" font-size="29" text-anchor="start" font-weight="400">读入 1：1 ≤ 当前根 8，拒绝；堆不变。</text><line x1="225" y1="235" x2="365" y2="235" stroke="#2073ad" stroke-width="2" marker-end="url(#b)"/><text x="292" y="210" fill="#2073ad" font-size="25" text-anchor="middle" font-weight="400">替换 8</text><line x1="555" y1="235" x2="685" y2="235" stroke="#c26e34" stroke-width="2" marker-end="url(#o)"/><text x="620" y="210" fill="#c26e34" font-size="25" text-anchor="middle" font-weight="400">替换 8.5</text><line x1="870" y1="235" x2="980" y2="235" stroke="#c26e34" stroke-width="2" marker-end="url(#o)"/><text x="925" y="210" fill="#c26e34" font-size="25" text-anchor="middle" font-weight="400">交换</text><path d="M790 225 Q880 320 790 355" stroke="#c26e34" fill="none" stroke-width="2"/><text x="815" y="315" fill="#c26e34" font-size="25" text-anchor="start" font-weight="400">10 &gt; 9</text><text x="45" y="565" fill="#21374d" font-size="29" text-anchor="start" font-weight="400">门槛：8 → 8.5 → 9；最终集合 {9, 10}，堆数组并非降序答案。</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 762.353) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">堆只保证父子关系：数组下标不是完整名次</text><rect x="65" y="150" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="211.0" y="189" font-size="28" fill="#1e7499" text-anchor="middle">8</text><rect x="365" y="150" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="511.0" y="189" font-size="28" fill="#1e7499" text-anchor="middle">10</text><rect x="665" y="150" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="811.0" y="189" font-size="28" fill="#1e7499" text-anchor="middle">9</text><text x="65" y="120" font-size="29" fill="#1e7499" text-anchor="start">合法最小堆的数组表示</text><text x="65" y="270" font-size="31" fill="#1d3145" text-anchor="start">根8 ≤ 子10、9；但数组第二项10并不是第二小。</text><rect x="65" y="330" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="211.0" y="369" font-size="28" fill="#c66d3a" text-anchor="middle">降序交付</text><rect x="365" y="330" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="511.0" y="369" font-size="28" fill="#c66d3a" text-anchor="middle">10</text><rect x="665" y="330" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="811.0" y="369" font-size="28" fill="#c66d3a" text-anchor="middle">9</text><rect x="965" y="330" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1111.0" y="369" font-size="28" fill="#c66d3a" text-anchor="middle">8</text><text x="65" y="420" font-size="27" fill="#1d3145" text-anchor="start">top-k 候选保留与最终排序分两步；相等分数若需稳定身份，还须定义次级键。</text></g></g></svg></svg>

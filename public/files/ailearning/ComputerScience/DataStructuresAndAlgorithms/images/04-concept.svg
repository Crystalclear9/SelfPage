<svg xmlns="http://www.w3.org/2000/svg" width="1122.000" height="594.000" viewBox="21.000 0.000 1122.000 594.000" role="img" aria-labelledby="title desc"><title id="title">Top-k 的门槛是动态维护的堆根</title><desc id="desc">k为2，初始最小堆[8,9]。1被拒绝，8.5替根保持[8.5,9]；10临时替根形成[10,9]，下沉交换得到[9,10]。 </desc><rect width="1122.0" height="594.0" fill="white" x="21.0" y="0.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="45" y="45" fill="#23384b" font-size="28" text-anchor="start" font-weight="400">k = 2；保留最大两项；每个父节点 ≤ 它的孩子</text><text x="150" y="115" fill="#24679c" font-size="26" text-anchor="middle" font-weight="600">初始最小堆</text><line x1="150" y1="205" x2="95" y2="295" stroke="#d9e3eb" stroke-width="3" /><circle cx="150" cy="175" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="150" y="185" fill="#24679c" font-size="29" text-anchor="middle" font-weight="400">8</text><circle cx="95" cy="330" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="95" y="340" fill="#23384b" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="150" y="405" fill="#24679c" font-size="28" text-anchor="middle" font-weight="400">[8, 9]</text><text x="465" y="115" fill="#24679c" font-size="26" text-anchor="middle" font-weight="600">读入 8.5 后</text><line x1="465" y1="205" x2="410" y2="295" stroke="#d9e3eb" stroke-width="3" /><circle cx="465" cy="175" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="465" y="185" fill="#24679c" font-size="29" text-anchor="middle" font-weight="400">8.5</text><circle cx="410" cy="330" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="410" y="340" fill="#23384b" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="465" y="405" fill="#24679c" font-size="28" text-anchor="middle" font-weight="400">[8.5, 9]</text><text x="785" y="115" fill="#c66e30" font-size="26" text-anchor="middle" font-weight="600">读入 10：先替根</text><line x1="785" y1="205" x2="730" y2="295" stroke="#d9e3eb" stroke-width="3" /><circle cx="785" cy="175" r="34" fill="white" stroke="#c66e30" stroke-width="2" /><text x="785" y="185" fill="#c66e30" font-size="29" text-anchor="middle" font-weight="400">10</text><circle cx="730" cy="330" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="730" y="340" fill="#23384b" font-size="29" text-anchor="middle" font-weight="400">9</text><text x="785" y="405" fill="#c66e30" font-size="28" text-anchor="middle" font-weight="400">[10, 9]</text><text x="1080" y="115" fill="#24679c" font-size="26" text-anchor="middle" font-weight="600">下沉后</text><line x1="1080" y1="205" x2="1025" y2="295" stroke="#d9e3eb" stroke-width="3" /><circle cx="1080" cy="175" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="1080" y="185" fill="#24679c" font-size="29" text-anchor="middle" font-weight="400">9</text><circle cx="1025" cy="330" r="34" fill="white" stroke="#24679c" stroke-width="2" /><text x="1025" y="340" fill="#23384b" font-size="29" text-anchor="middle" font-weight="400">10</text><text x="1080" y="405" fill="#24679c" font-size="28" text-anchor="middle" font-weight="400">[9, 10]</text><text x="45" y="495" fill="#7b8a96" font-size="29" text-anchor="start" font-weight="400">读入 1：1 ≤ 当前根 8，拒绝；堆不变。</text><line x1="225" y1="235" x2="365" y2="235" stroke="#24679c" stroke-width="2" marker-end="url(#b)" /><text x="292" y="210" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">替换 8</text><line x1="555" y1="235" x2="685" y2="235" stroke="#c66e30" stroke-width="2" marker-end="url(#o)" /><text x="620" y="210" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">替换 8.5</text><line x1="870" y1="235" x2="980" y2="235" stroke="#c66e30" stroke-width="2" marker-end="url(#o)" /><text x="925" y="210" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">交换</text><path d="M790 225 Q880 320 790 355" stroke="#c66e30" fill="none" stroke-width="2" /><text x="815" y="315" fill="#c66e30" font-size="25" text-anchor="start" font-weight="400">10 &gt; 9</text><text x="45" y="565" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">门槛：8 → 8.5 → 9；最终集合 {9, 10}，堆数组并非降序答案。</text></g></svg>

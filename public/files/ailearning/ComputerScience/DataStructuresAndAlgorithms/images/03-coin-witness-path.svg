<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1188.892" viewBox="0 0 1440 1188.892" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">金额状态表、最优前驱路径和局部贪心路径对照</title><rect width="1440" height="1188.892" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">金额状态表、最优前驱路径和局部贪心路径对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1046.892" viewBox="0 0 1440 1121.67" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>最少硬币：状态值与一条可恢复的选择路径</title><svg width="1440" height="671.667" viewBox="13.867 60.823 1217.067 567.683" role="img" aria-labelledby="title desc"><title id="title">最少硬币：状态值与一条可恢复的选择路径</title><desc id="desc">最少硬币：状态值与一条可恢复的选择路径 最少硬币：状态值与一条可恢复的选择路径 两枚已能组成 6，而没有面额 6；可行上界与下界相合，证明最优值为 2</desc><rect width="1217.067" height="567.683" fill="white" x="13.867" y="60.823"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="40" y="110" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">面额 1、3、4，可无限使用；目标金额 6</text><text x="40" y="170" font-size="26" fill="#748e9f" text-anchor="start" font-weight="400">金额 a</text><text x="40" y="232" font-size="26" fill="#748e9f" text-anchor="start" font-weight="400">最少枚数 D(a)</text><text x="290" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><rect x="245" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="290" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">0</text><text x="435" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="390" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="435" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">1</text><text x="580" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><rect x="535" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="580" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">2</text><text x="725" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">3</text><rect x="680" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="725" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">1</text><text x="870" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">4</text><rect x="825" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="870" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">1</text><text x="1015" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">5</text><rect x="970" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1015" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">2</text><text x="1160" y="170" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">6</text><rect x="1115" y="190" width="90" height="65" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="1160" y="234" font-size="31" fill="#2479b3" text-anchor="middle" font-weight="400">2</text><text x="40" y="315" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">D(6) 的末枚候选：1 + D(5) = 3；1 + D(3) = 2；1 + D(2) = 3</text><text x="40" y="387" font-size="28" fill="#2479b3" text-anchor="start" font-weight="600">沿最优前驱恢复</text><circle cx="355" cy="430" r="31" fill="white" stroke="#2479b3" stroke-width="2"/><circle cx="750" cy="430" r="31" fill="white" stroke="#2479b3" stroke-width="2"/><circle cx="1145" cy="430" r="31" fill="white" stroke="#2479b3" stroke-width="2"/><text x="355" y="440" font-size="29" fill="#2479b3" text-anchor="middle" font-weight="400">6</text><text x="750" y="440" font-size="29" fill="#2479b3" text-anchor="middle" font-weight="400">3</text><text x="1145" y="440" font-size="29" fill="#2479b3" text-anchor="middle" font-weight="400">0</text><path d="M405 430L700 430" fill="none" stroke="#2479b3" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="410" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">取 3</text><path d="M800 430L1095 430" fill="none" stroke="#2479b3" stroke-width="3" marker-end="url(#arrow)"/><text x="945" y="410" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">取 3</text><text x="40" y="528" font-size="28" fill="#c56f36" text-anchor="start" font-weight="600">局部贪心作对照</text><circle cx="355" cy="570" r="31" fill="white" stroke="#c56f36" stroke-width="2"/><text x="355" y="580" font-size="29" fill="#c56f36" text-anchor="middle" font-weight="400">6</text><circle cx="620" cy="570" r="31" fill="white" stroke="#c56f36" stroke-width="2"/><text x="620" y="580" font-size="29" fill="#c56f36" text-anchor="middle" font-weight="400">2</text><circle cx="885" cy="570" r="31" fill="white" stroke="#c56f36" stroke-width="2"/><text x="885" y="580" font-size="29" fill="#c56f36" text-anchor="middle" font-weight="400">1</text><circle cx="1150" cy="570" r="31" fill="white" stroke="#c56f36" stroke-width="2"/><text x="1150" y="580" font-size="29" fill="#c56f36" text-anchor="middle" font-weight="400">0</text><path d="M405 570L570 570" fill="none" stroke="#c56f36" stroke-width="3" marker-end="url(#arrow)"/><text x="487" y="550" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">取 4</text><path d="M670 570L835 570" fill="none" stroke="#c56f36" stroke-width="3" marker-end="url(#arrow)"/><text x="752" y="550" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">取 1</text><path d="M935 570L1100 570" fill="none" stroke="#c56f36" stroke-width="3" marker-end="url(#arrow)"/><text x="1017" y="550" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">取 1</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 671.667) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">同一面额与金额，换一个递推对象就会换一个答案</text><text x="65" y="125" font-size="30" fill="#1d3145" text-anchor="start">面额 {1,3,4}，金额6；库存无限</text><rect x="65" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="276.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">最小枚数</text><rect x="495" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="706.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">无序组合数</text><rect x="925" y="190" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1136.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">有序序列数</text><rect x="65" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="276.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">2：3+3</text><rect x="495" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="706.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">4 种</text><rect x="925" y="290" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1136.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">9 种</text><text x="65" y="412" font-size="27" fill="#1d3145" text-anchor="start">3+1+1+1 与 1+3+1+1：组合相同、序列不同；状态与迭代顺序先服务目标。</text></g></g></svg></svg>

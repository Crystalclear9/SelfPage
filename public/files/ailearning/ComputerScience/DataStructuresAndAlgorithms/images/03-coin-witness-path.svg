<svg xmlns="http://www.w3.org/2000/svg" width="1217.067" height="567.683" viewBox="13.867 60.823 1217.067 567.683" role="img" aria-labelledby="title desc"><title id="title">最少硬币：状态值与一条可恢复的选择路径</title><desc id="desc">最少硬币：状态值与一条可恢复的选择路径 最少硬币：状态值与一条可恢复的选择路径 两枚已能组成 6，而没有面额 6；可行上界与下界相合，证明最优值为 2</desc><rect width="1217.067" height="567.683" fill="white" x="13.867" y="60.823" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="40" y="110" font-size="28" fill="#203747" text-anchor="start" font-weight="400">面额 1、3、4，可无限使用；目标金额 6</text><text x="40" y="170" font-size="26" fill="#728694" text-anchor="start" font-weight="400">金额 a</text><text x="40" y="232" font-size="26" fill="#728694" text-anchor="start" font-weight="400">最少枚数 D(a)</text><text x="290" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">0</text><rect x="245" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="290" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">0</text><text x="435" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">1</text><rect x="390" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="435" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">1</text><text x="580" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">2</text><rect x="535" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="580" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">2</text><text x="725" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">3</text><rect x="680" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="725" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">1</text><text x="870" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">4</text><rect x="825" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="870" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">1</text><text x="1015" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">5</text><rect x="970" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="1015" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">2</text><text x="1160" y="170" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">6</text><rect x="1115" y="190" width="90" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="1160" y="234" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">2</text><text x="40" y="315" font-size="27" fill="#203747" text-anchor="start" font-weight="400">D(6) 的末枚候选：1 + D(5) = 3；1 + D(3) = 2；1 + D(2) = 3</text><text x="40" y="387" font-size="28" fill="#286da2" text-anchor="start" font-weight="600">沿最优前驱恢复</text><circle cx="355" cy="430" r="31" fill="white" stroke="#286da2" stroke-width="2" /><circle cx="750" cy="430" r="31" fill="white" stroke="#286da2" stroke-width="2" /><circle cx="1145" cy="430" r="31" fill="white" stroke="#286da2" stroke-width="2" /><text x="355" y="440" font-size="29" fill="#286da2" text-anchor="middle" font-weight="400">6</text><text x="750" y="440" font-size="29" fill="#286da2" text-anchor="middle" font-weight="400">3</text><text x="1145" y="440" font-size="29" fill="#286da2" text-anchor="middle" font-weight="400">0</text><path d="M405 430L700 430" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><text x="550" y="410" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">取 3</text><path d="M800 430L1095 430" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><text x="945" y="410" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">取 3</text><text x="40" y="528" font-size="28" fill="#c96e32" text-anchor="start" font-weight="600">局部贪心作对照</text><circle cx="355" cy="570" r="31" fill="white" stroke="#c96e32" stroke-width="2" /><text x="355" y="580" font-size="29" fill="#c96e32" text-anchor="middle" font-weight="400">6</text><circle cx="620" cy="570" r="31" fill="white" stroke="#c96e32" stroke-width="2" /><text x="620" y="580" font-size="29" fill="#c96e32" text-anchor="middle" font-weight="400">2</text><circle cx="885" cy="570" r="31" fill="white" stroke="#c96e32" stroke-width="2" /><text x="885" y="580" font-size="29" fill="#c96e32" text-anchor="middle" font-weight="400">1</text><circle cx="1150" cy="570" r="31" fill="white" stroke="#c96e32" stroke-width="2" /><text x="1150" y="580" font-size="29" fill="#c96e32" text-anchor="middle" font-weight="400">0</text><path d="M405 570L570 570" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><text x="487" y="550" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">取 4</text><path d="M670 570L835 570" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><text x="752" y="550" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">取 1</text><path d="M935 570L1100 570" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><text x="1017" y="550" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">取 1</text></g></svg>

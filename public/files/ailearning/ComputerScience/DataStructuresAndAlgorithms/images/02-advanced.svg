<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="52" font-family="Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#18354a" text-anchor="start" font-weight="700">DFS 判环：返回活动祖先，与走向已完成节点是两件事</text><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">灰色：已进入、未退出；深蓝：已退出。箭头表示有向边。</text><line x1="624" y1="148" x2="624" y2="652" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="44" y="174" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#cc661c" text-anchor="start" font-weight="400">有环：C → A 返回活动路径</text><line x1="155" y1="246" x2="422" y2="246" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><line x1="433" y1="275" x2="312" y2="436" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><path d="M 256,438 Q 90,390 128,275" stroke="#cc661c" stroke-width="4" fill="none" stroke-dasharray=""/><line x1="127" y1="289" x2="129" y2="275" stroke="#cc661c" stroke-width="4" stroke-dasharray="" marker-end="url(#arr)"/><circle cx="120" cy="246" r="35" fill="#74899a" stroke="none"/><text x="120" y="256" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">A</text><circle cx="460" cy="246" r="35" fill="#74899a" stroke="none"/><text x="460" y="256" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">B</text><circle cx="284" cy="470" r="35" fill="#74899a" stroke="none"/><text x="284" y="480" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">C</text><text x="44" y="565" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">活动栈：[A, B, C]</text><text x="44" y="618" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="start" font-weight="400">沿树边 A → B → C，再沿 C → A 闭环</text><text x="665" y="174" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2676b5" text-anchor="start" font-weight="400">无环：C → D 指向已完成分支</text><line x1="890" y1="234" x2="735" y2="348" stroke="#a7b7c3" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><line x1="923" y1="236" x2="1080" y2="349" stroke="#a7b7c3" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><line x1="735" y1="403" x2="880" y2="516" stroke="#a7b7c3" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><line x1="1080" y1="403" x2="943" y2="516" stroke="#2676b5" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><circle cx="905" cy="212" r="34" fill="#74899a" stroke="none"/><text x="905" y="222" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">A</text><circle cx="710" cy="375" r="34" fill="#193d52" stroke="none"/><text x="710" y="385" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">B</text><circle cx="1105" cy="375" r="34" fill="#74899a" stroke="none"/><text x="1105" y="385" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">C</text><circle cx="910" cy="540" r="34" fill="#193d52" stroke="none"/><text x="910" y="550" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="white" text-anchor="middle" font-weight="400">D</text><text x="665" y="618" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="start" font-weight="400">活动栈：[A, C]；D 已退出，不构成回边</text><text x="44" y="722" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">一个“访问过”标志无法区分这两个历史；需要保存活动与完成状态。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 501" role="img" aria-labelledby="title description">
<title id="title">有向 DFS 的回边与已退出顶点</title>
<desc id="description">左图当前活动栈为 A、B、C，C 到 A 是回边，构成有向环。右图 D 已退出，C 到 D 不是回边。</desc>
<defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824.08" viewBox="17.00 14.00 1063.00 730.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">有向图 DFS 的灰色回边给出环</title><desc id="desc">深度优先搜索中，灰色顶点表示已经进入却尚未退出的递归路径。若从 C 沿有向边回到仍为灰色的 A，就得到 A→B→C→A 的有向环，而不只是碰到了一个历史上见过的点。 图只描述有向图的递归栈判环。无向图必须排除父边的反向记录；黑色已完成节点与灰色祖先也不能混为一谈，非递归实现仍需保存对应状态。 灰色表示仍在递归栈；有向图边指向灰点才能据此判环。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker><marker id="tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">有向图 DFS 的灰色回边给出环</text><path d="M410,260 L730,260" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M823.714,318 L636.286,482" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M503.714,482 L316.286,318" stroke="#c87536" stroke-width="3" fill="none" marker-end="url(#tip-d67c47)" stroke-linecap="round" stroke-linejoin="round" /><rect x="90" y="202" width="320" height="116" fill="#e1edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="110" y="248" font-size="24" fill="#213447" text-anchor="start" font-weight="400">A：递归栈中</text><rect x="730" y="202" width="320" height="116" fill="#e1edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="750" y="248" font-size="24" fill="#213447" text-anchor="start" font-weight="400">B：递归栈中</text><rect x="410" y="482" width="320" height="116" fill="#fae9d9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="430" y="528" font-size="24" fill="#213447" text-anchor="start" font-weight="400">C：读到灰色 A</text><text x="140" y="705" font-size="24" fill="#627689" text-anchor="start" font-weight="400">沿有向路径返回尚未完成的对象；先确认边所表达的关系。</text></g></svg>

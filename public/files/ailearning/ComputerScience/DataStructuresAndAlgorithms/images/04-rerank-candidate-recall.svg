<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="772.1495" viewBox="0 0 1440 772.1495" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">重排只能重新排列已经进入候选的记录</title><rect width="1440" height="772.1495" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">重排只能重新排列已经进入候选的记录</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg aria-labelledby="figure-title figure-desc" width="1344" height="630.1495" viewBox="16 66 1124 527" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">重排只能重新排列已经进入候选的记录</title><desc id="figure-desc">全库四条记录按最终评分应排为 a、b、c、d，真正的前一名是 a。假设廉价第一阶段只交付 b、c、d，即使第二阶段对这三条采用完全精确的最终分数，最优返回也只能是 b。图中分数只是固定的课堂算例，不代表某个具体索引的召回率。评价时应同时检查候选召回与候选内排序；除非另有可证明的剪枝界，否则“精确重排”不等于“全库精确检索”。 重排只能重新排列已经进入候选的记录</desc><rect width="1124.0" height="527.0" fill="white" x="16.0" y="66.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="29" fill="#2472b1" text-anchor="start" font-weight="600">全库最终分数</text><text x="40" y="200" font-size="30" fill="#1f3449" text-anchor="start" font-weight="400">a</text><rect x="95" y="165" width="287.1" height="50" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="405" y="200" font-size="28" fill="#c57439" text-anchor="start" font-weight="400">0.99</text><text x="40" y="295" font-size="30" fill="#1f3449" text-anchor="start" font-weight="400">b</text><rect x="95" y="260" width="261.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="405" y="295" font-size="28" fill="#2472b1" text-anchor="start" font-weight="400">0.90</text><text x="40" y="390" font-size="30" fill="#1f3449" text-anchor="start" font-weight="400">c</text><rect x="95" y="355" width="232.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="405" y="390" font-size="28" fill="#2472b1" text-anchor="start" font-weight="400">0.80</text><text x="40" y="485" font-size="30" fill="#1f3449" text-anchor="start" font-weight="400">d</text><rect x="95" y="450" width="203.0" height="50" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="405" y="485" font-size="28" fill="#2472b1" text-anchor="start" font-weight="400">0.70</text><text x="555" y="115" font-size="29" fill="#2472b1" text-anchor="start" font-weight="600">第一阶段候选</text><rect x="560" y="175" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="652.5" y="217.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">b</text><rect x="560" y="290" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="652.5" y="332.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">c</text><rect x="560" y="405" width="185" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="652.5" y="447.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">d</text><path d="M765 320 L865 320" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><text x="900" y="205" font-size="29" fill="#c57439" text-anchor="start" font-weight="600">精确重排</text><rect x="895" y="265" width="220" height="80" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="1005.0" y="315.5" font-size="30" fill="#c57439" text-anchor="middle" font-weight="400">返回 b</text><text x="555" y="565" font-size="29" fill="#c57439" text-anchor="start" font-weight="400">a 未入候选，重排无法把它找回来。</text></g></svg></svg>

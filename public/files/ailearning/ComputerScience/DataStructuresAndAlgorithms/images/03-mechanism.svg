00">插入：1 + 1</text><text x="760" y="360" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">替换：0 + 1</text><text x="760" y="450" font-size="32" fill="#c87536" text-anchor="start" font-weight="600">取最小值：1</text></g></svg>

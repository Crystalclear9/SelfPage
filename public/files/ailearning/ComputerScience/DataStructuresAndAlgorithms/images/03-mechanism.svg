<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="626.90" viewBox="5.00 0.00 959.00 501.00" role="img"><title id="figure-title">编辑距离：每格由三个相邻状态决定</title><desc id="figure-desc">每格表示两个前缀之间的最小编辑代价。橙格对应 ab 与 ac：从上格删除或从左格插入都需代价二；从左上格把 b 替换成 c，代价为一，因此取一。行列首部为空串边界，三个箭头展示递推依赖，而非仅列出最终表值。</desc><rect x="0" y="0" width="1200" height="570" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">编辑距离：每格由三个相邻状态决定</text><text x="70" y="105" font-size="28" fill="#213447" text-anchor="start" font-weight="400">把 ab 变成 ac；插入、删除、替换代价均为 1</text><rect x="250" y="170" width="120" height="95" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="310.0" y="227.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="375" y="170" width="120" height="95" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="435.0" y="227.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="500" y="170" width="120" height="95" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="560.0" y="227.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="250" y="270" width="120" height="95" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="310.0" y="327.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="375" y="270" width="120" height="95" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="435.0" y="327.5" font-size="28" fill="#2865a0" 
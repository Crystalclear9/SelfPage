<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="figure-title">二分边界：每一轮都保留可能的答案</title><desc id="figure-desc">从半开待检查区间 [0,6) 开始，依次比较索引 3、1、0 的值：4 和 2 都不小于目标，所以收紧右边界；1 小于目标，所以左边界前进到 1。最后 lo=hi=1，返回第一个不小于 2 的索引 1。排除待检查元素不等于删除边界答案，返回值也不是元素本身。</desc><rect x="0" y="0" width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">二分边界：每一轮都保留可能的答案</text><text x="40" y="108" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">目标 x=2：寻找第一个不小于 x 的位置</text><text x="275" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><text x="380" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="485" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><text x="590" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><text x="695" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><text x="800" y="153" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">5</text><text x="40" y="223" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">[0, 6)</text><rect x="230" y="183" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="275" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="335" y="183" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="380" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="440" y="183" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="485" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="545" y="183" width="90" height="68" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="590" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">4</text><rect x="650" y="183" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="695" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">7</text><rect x="755" y="183" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="800" y="228" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">9</text><text x="895" y="223" font-size="26" fill="#213447" text-anchor="start" font-weight="400">4 ≥ 2 → hi=3</text><text x="40" y="328" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">[0, 3)</text><rect x="230" y="288" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="275" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="335" y="288" width="90" height="68" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="380" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="440" y="288" width="90" height="68" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="485" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="545" y="288" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="590" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">4</text><rect x="650" y="288" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="695" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">7</text><rect x="755" y="288" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="800" y="333" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">9</text><text x="895" y="328" font-size="26" fill="#213447" text-anchor="start" font-weight="400">2 ≥ 2 → hi=1</text><text x="40" y="433" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">[0, 1)</text><rect x="230" y="393" width="90" height="68" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="275" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="335" y="393" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="380" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="440" y="393" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="485" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="545" y="393" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="590" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">4</text><rect x="650" y="393" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="695" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">7</text><rect x="755" y="393" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="800" y="438" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">9</text><text x="895" y="433" font-size="26" fill="#213447" text-anchor="start" font-weight="400">1 &lt; 2 → lo=1</text><text x="40" y="538" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">[1, 1)</text><rect x="230" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="275" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="335" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="380" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="440" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="485" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">2</text><rect x="545" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="590" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">4</text><rect x="650" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="695" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">7</text><rect x="755" y="498" width="90" height="68" rx="6" fill="white" stroke="#cbd9e4" stroke-width="1.5" /><text x="800" y="543" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">9</text><text x="895" y="538" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">lo=hi=1 → 返回索引 1</text><text x="40" y="650" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">返回的是边界索引 1；该位置的元素值为 2。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1200" height="1010" viewBox="0 0 1200 1010" role="img"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">二分查找：保留答案边界，缩小待检查区间</title><desc id="desc">已排序数组 [1, 2, 2, 4, 7, 9]，目标 x=2；寻找第一个 ≥x 的位置。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386f9c" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="1010" fill="white" stroke="none" rx="0" /><text x="48" y="60" font-size="32" fill="#19354a" font-weight="700" text-anchor="start">二分查找：保留答案边界，缩小待检查区间</text><text x="48" y="104" font-size="21" fill="#597080" font-weight="400" text-anchor="start">已排序数组 [1, 2, 2, 4, 7, 9]，目标 x=2；寻找第一个 ≥x 的位置。</text><rect x="32" y="138" width="1136" height="720" fill="white" stroke="#d9e4eb" rx="10" /><text x="55" y="184" font-size="22" fill="#19354a" font-weight="700" text-anchor="start">轮次 / 区间</text><text x="326" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">0</text><text x="420" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">1</text><text x="514" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">2</text><text x="608" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">3</text><text x="702" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">4</text><text x="796" y="184" font-size="20" fill="#597080" font-weight="400" text-anchor="middle">5</text><text x="904" y="184" font-size="22" fill="#19354a" font-weight="700" text-anchor="start">本轮比较与更新</text><text x="58" y="248" font-size="24" fill="#19354a" font-weight="700" text-anchor="start">01   [0, 6)</text><text x="58" y="283" font-size="21" fill="#597080" font-weight="400" text-anchor="start">宽度 6</text><rect x="282" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="326" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">1</text><rect x="376" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="420" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">2</text><rect x="470" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="514" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">2</text><rect x="564" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="608" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">4</text><rect x="564" y="221" width="88" height="58" fill="none" stroke="#386f9c" rx="10" /><text x="608" y="312" font-size="20" fill="#386f9c" font-weight="700" text-anchor="middle">mid</text><rect x="658" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="702" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">7</text><rect x="752" y="221" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="796" y="259" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">9</text><text x="904" y="247" font-size="22" fill="#19354a" font-weight="400" text-anchor="start">a[3]=4 ≥ 2</text><text x="904" y="284" font-size="24" fill="#137f78" font-weight="700" text-anchor="start">hi ← 3</text><text x="58" y="394" font-size="24" fill="#19354a" font-weight="700" text-anchor="start">02   [0, 3)</text><text x="58" y="429" font-size="21" fill="#597080" font-weight="400" text-anchor="start">宽度 3</text><rect x="282" y="367" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="326" y="405" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">1</text><rect x="376" y="367" width="88" height="58" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="420" y="405" font-size="27" fill="#1935
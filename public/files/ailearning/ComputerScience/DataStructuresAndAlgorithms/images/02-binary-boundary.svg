 font-weight="400" text-anchor="middle">7</text><rect x="752" y="659" width="88" height="58" fill="#f9e9de" stroke="#d9e4eb" rx="10" /><text x="796" y="697" font-size="27" fill="#19354a" font-weight="400" text-anchor="middle">9</text><text x="904" y="685" font-size="22" fill="#19354a" font-weight="400" text-anchor="start">lo = hi = 1</text><text x="904" y="722" font-size="24" fill="#137f78" font-weight="700" text-anchor="start">返回边界 1</text><path d="M376,766 V829" fill="none" stroke="#137f78" stroke-width="2.5" /><text x="395" y="824" font-size="22" fill="#137f78" font-weight="400" text-anchor="start">答案：索引 1，而不是值 1</text><text x="54" y="907" font-size="23" fill="#19354a" font-weight="400" text-anchor="start">青绿：已证明 &lt;x    浅蓝：尚待检查    浅橙：已证明 ≥x</text><text x="54" y="948" font-size="23" fill="#597080" font-weight="400" text-anchor="start">注意：[lo,hi) 是待检查元素；答案边界仍可等于 hi，终止时返回 lo。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="571" viewBox="0 0 1310 571" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">扩容复制成本如何摊到多次追加</title><desc id="plate-desc">容量先为一，再翻倍到二和四。第三次追加先复制已有两项，再写入第三项。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1310" height="571" fill="white" stroke="none" stroke-width="1.6"/><text x="119" y="82" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">第一次追加</text><rect x="76" y="206" width="86" height="79" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7"/><text x="119" y="256" fill="#a84b3b" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><text x="119" y="344" fill="#202a37" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">容量 1</text><text x="470" y="82" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">第二次追加</text><rect x="384" y="206" width="86" height="79" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/><text x="427" y="256" fill="#196f77" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><rect x="470" y="206" width="86" height="79" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7"/><text x="513" y="256" fill="#a84b3b" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><text x="470" y="344" fill="#202a37" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">容量 2</text><text x="992" y="82" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">第三次追加</text><rect x="820" y="206" width="86" height="79" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/><text x="863" y="256" fill="#196f77" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><rect x="906" y="206" width="86" height="79" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/><text x="949" y="256" fill="#196f77" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><rect x="992" y="206" width="86" height="79" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7"/><text x="1035" y="256" fill="#a84b3b" font-size="33" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">C</text><rect x="1078" y="206" width="86" height="79" fill="white" stroke="#657682" stroke-width="1.7" stroke-dasharray="5 6"/><text x="992" y="344" fill="#202a37" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">容量 4</text><line x1="189" y1="247" x2="349" y2="247" stroke="#655184" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="596" y1="247" x2="784" y2="247" stroke="#655184" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="273" y="204" fill="#655184" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">复制 1 项</text><text x="691" y="204" fill="#655184" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">复制 2 项</text><text x="654" y="485" fill="#202a37" font-size="33" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">追加成本分散在整串操作上</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1158.000" height="779.000" viewBox="11.000 52.000 1158.000 779.000" role="img" aria-labelledby="title desc"><title id="title">排序等价的关键是库内范数是否相同</title><desc id="desc">左图库向量单位长而查询范数为2，三种排序一致。右图仅查询单位长，内积、余弦与欧氏距离分别选择不同候选。 排序等价的关键是库内范数是否相同</desc><rect width="1158.0" height="779.0" fill="white" x="11.0" y="52.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="98" font-size="26" fill="#627689" text-anchor="start">每次固定一个非零查询；比较库内候选的排序</text><text x="40" y="151" font-size="28" fill="#2865a0" text-anchor="start">库向量单位化：查询可不为单位长</text><text x="630" y="151" font-size="28" fill="#c87536" text-anchor="start">仅查询单位化：三种目标可各选其一</text><line x1="71.25" y1="370" x2="543.75" y2="370" stroke="#dce5ed" stroke-width="2" /><line x1="240" y1="437.5" x2="240" y2="194.5" stroke="#dce5ed" stroke-width="2" /><circle cx="240" cy="370" r="135" fill="none" stroke="#9baebf" stroke-width="2" /><line x1="240" y1="370" x2="348.0" y2="289.0" stroke="#2865a0" stroke-width="3" /><polygon points="348.0,289.0 343.406216385846,297.8824068870059 338.1866299765112,290.9229583412262" fill="#2865a0" /><circle cx="348.0" cy="289.0" r="5" fill="#2865a0" /><text x="363.0" y="284.0" font-size="27" fill="#2865a0" text-anchor="start">A</text><line x1="240" y1="370" x2="240" y2="235" stroke="#c87536" stroke-width="3" /><polygon points="240,235 244.3496553411123,244.00447102352678 235.6503446588877,244.00447102352678" fill="#c87536" /><circle cx="240" cy="235" r="5" fill="#c87536" /><text x="210" y="220" font-size="27" fill="#c87536" text-anchor="start">B</text><line x1="240" y1="370" x2="105" y2="370" stroke="#627689" stroke-width="3" /><polygon points="105,370 114.00447102352678,365.6503446588877 114.00447102352678,374.3496553411123" fill="#627689" /><circle cx="105" cy="370" r="5" fill="#627689" /><text x="80" y="400" font-size="27" fill="#627689" text-anchor="start">C</text><line x1="240" y1="370" x2="510" y2="370" stroke="#213447" stroke-width="3" /><polygon points="510,370 500.9955289764732,374.3496553411123 500.9955289764732,365.6503446588877" fill="#213447" /><circle cx="510" cy="370" r="5" fill="#213447" /><text x="480" y="410" font-size="27" fill="#213447" text-anchor="start">q</text><text x="55" y="475" font-size="26" fill="#213447" text-anchor="start">q = (2, 0)</text><text x="55" y="520" font-size="24" fill="#213447" text-anchor="start">A=(0.8, 0.6) · B=(0, 1) · C=(−1, 0)</text><line x1="685" y1="465" x2="1018.0" y2="465" stroke="#dce5ed" stroke-width="2" /><line x1="685" y1="465" x2="685" y2="186.0" stroke="#dce5ed" stroke-width="2" /><line x1="685" y1="465" x2="955" y2="195" stroke="#2865a0" stroke-width="3" /><polygon points="955,195 951.7085482657913,204.44279330925835 945.5572066907416,198.29145173420875" fill="#2865a0" /><circle cx="955" cy="195" r="5" fill="#2865a0" /><text x="965" y="190" font-size="27" fill="#2865a0" text-anchor="start">A</text><line x1="685" y1="465" x2="865" y2="465" stroke="#c87536" stroke-width="3" /><polygon points="865,465 855.9955289764732,469.3496553411123 855.9955289764732,460.6503446588877" fill="#c87536" /><circle cx="865" cy="465" r="5" fill="#c87536" /><text x="855" y="450" font-size="27" fill="#c87536" text-anchor="start">B</text><line x1="685" y1="465" x2="766.0" y2="460.5" stroke="#627689" stroke-width="3" /><polygon points="766.0,460.5 757.2506681485443,465.34243659257424 756.7681172142989,456.65651977615664" fill="#627689" /><circle cx="766.0" cy="460.5" r="5" fill="#627689" /><text x="731.0" y="440.5" font-size="27" fill="#627689" text-anchor="start">C</text><line x1="685" y1="465" x2="775" y2="465" stroke="#213447" stroke-width="3" /><polygon points="775,465 765.9955289764732,469.3496553411123 765.9955289764732,460.6503446588877" fill="#213447" /><circle cx="775" cy="465" r="5" fill="#213447" /><text x="785" y="500" font-size="27" fill="#213447" text-anchor="start">q</text><text x="630" y="520" font-size="24" fill="#213447" text-anchor="start">q=(1, 0) · A=(3, 3
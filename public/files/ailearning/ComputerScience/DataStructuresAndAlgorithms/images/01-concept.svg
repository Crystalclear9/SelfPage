<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500.07" viewBox="-4.35 -15.00 997.20 415.56" role="img"><title id="detail-title">机制展开：扩容行按容量 1、2、4、8 排列</title><desc id="detail-desc">扩容行按容量 1、2、4、8 排列。八次插入自身需要八次写入，扩容额外复制 1+2+4 个旧元素，总共十五次基础写操作；摊还分析统计整个序列，不把最坏单次成本当作每次成本。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="28" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">动态数组：容量翻倍时复制已有元素</text><text x="25" y="102" font-size="24" fill="#213447" font-weight="400" text-anchor="start">容量 1</text><rect x="150" y="70" width="70" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="185.0" y="102.5" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><path d="M850,92 L850,147" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="895" y="125" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">复制 1</text><text x="25" y="184" font-size="24" fill="#213447" font-weight="400" text-anchor="start">容量 2</text><rect x="150" y="152" width="70" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="185.0" y="184.5" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="225" y="152" width="70" height="50" rx="5" fill="#eaf2fa" stroke
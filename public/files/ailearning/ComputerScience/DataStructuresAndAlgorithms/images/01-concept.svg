<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1082.1096" viewBox="0 0 1440 1082.1096" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">动态数组扩容的摊还成本</title><rect width="1440" height="1082.1096" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">动态数组扩容的摊还成本</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="940.1096" viewBox="22 86.625 1606 1123.375" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e4"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1606.0" height="1123.375" fill="white" x="22.0" y="86.625"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="55" y="145" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">抽象策略：满时容量翻倍；只数复制旧元素与写入新元素</text><text xml:space="preserve" x="55" y="225" font-size="31" fill="#1f3348" text-anchor="start" font-weight="700">追加前：n=4，容量=4</text><rect x="350" y="260" width="135" height="75" rx="0" fill="url(#book-wash-edf5fa)" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="417" y="309" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="485" y="260" width="135"
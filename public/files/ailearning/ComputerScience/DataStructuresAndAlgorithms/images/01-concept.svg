="75" height="60" rx="0" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="1237" y="970" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1237" y="1100" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">7</text><rect x="1345" y="990" width="75" height="60" rx="0" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="1382" y="970" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1382" y="1100" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">8</text><line x1="270" y1="1050" x2="1520" y2="1050" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="55" y="1120" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">追加序号 →</text><text xml:space="preserve" x="55" y="1180" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">8 次新写 + (1 + 2 + 4) 次复制 = 15；最贵第 5 次单步要做 5 次写入</text></g><desc> 一次扩容很贵；整串追加的复制量仍可控制</desc></svg></svg>

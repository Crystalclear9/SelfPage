text><rect x="1025" y="475" width="135" height="75" rx="0" fill="white" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1092" y="524" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400"/><rect x="1160" y="475" width="135" height="75" rx="0" fill="white" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1227" y="524" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400"/><rect x="1295" y="475" width="135" height="75" rx="0" fill="white" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1362" y="524" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400"/><line x1="417" y1="345" x2="417" y2="460" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="552" y1="345" x2="552" y2="460" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="687" y1="345" x2="687" y2="460" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="822" y1="345" x2="822" y2="460" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1320" y="380" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">复制 4 个旧项</text><text xml:space="preserve" x="1320" y="430" font-size="30" fill="#d07736" text-anchor="middle" font-weight="400">再写入新项 5</text><line x1="55" y1="600" x2="1595" y2="600" stroke="#8e9fb9" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="55" y="670" font-size="31" fill="#1f3348" text-anchor="start" font-weight="700">前八次追加：蓝色是新写入，橙色是额外复制</text><rect x="330" y="990" width="75" height="60" rx="0" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="367" y="970" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="367" y="1100" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><rect x="475" y="990" width="7
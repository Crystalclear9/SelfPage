<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">BFS：发现时入队，队列保存尚未展开的两层</text><text xml:space="preserve" x="50" y="120" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">固定邻居次序：s 先看 a，再看 b；箭头表示有向边</text><line x1="187.23005973761389" y1="335.37390510308023" x2="390.90843727550543" y2="255.35739964176574" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="187.23005973761389" y1="364.62609489691977" x2="390.90843727550543" y2="444.6426003582343" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="467.2300597376139" y1="254.62609489691974" x2="670.9084372755054" y2="334.6426003582343" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="467.2300597376139" y1="445.37390510308023" x2="670.9084372755054" y2="365.3573996417657" stroke="#e28736" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/><circle cx="150" cy="350" r="39" fill="#eaf3f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="150" y="360" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">s</text><text xml:space="preserve" x="150" y="428" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">距离 0</text><circle cx="430" cy="240" r="39" fill="#eaf3f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="430" y="250" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">a</text><text xml:space="preserve" x="430" y="318" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">距离 1</text><circle cx="430" cy="460" r="39" fill="#eaf3f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="430" y="470" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">b</text><text xml:space="preserve" x="430" y="538" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">距离 1</text><circle cx="710" cy="350" r="39" fill="#eaf3f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="710" y="360" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">t</text><text xml:space="preserve" x="710" y="428" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">距离 2</text><text xml:space="preserve" x="50" y="620" font-size="28" fill="#2676ad" text-anchor="start" font-weight="400">蓝色：首次发现形成的父边</text><text xml:space="preserve" x="50" y="670" font-size="28" fill="#c46c22" text-anchor="start" font-weight="400">橙色：b 再遇到 t，检查但不再入队</text><line x1="810" y1="170" x2="810" y2="950" stroke="#d7e2e8" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="870" y="190" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">每行在该次展开完成后记录</text><text xml:space="preserve" x="865" y="307" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">初始化</text><rect x="1050" y="270" width="94" height="62" rx="0" fill="#eaf3f9" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1097" y="312" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">s</text><text xml:space="preserve" x="865" y="440" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">展开 s</text><rect x="1050" y="403" width="94" height="62" rx="0" fill="#eaf3f9" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1097" y="445" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">a</text><rect x="1160" y="403" width="94" height="62" rx="0" fill="#eaf3f9" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1207" y="445" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">b</text><text xml:space="preserve" x="865" y="573" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">展开 a</text><rect x="1050" y="536" width="94" height="62" rx="0" fill="#eaf3f9" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1097" y="578" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">b</text><rect x="1160" y="536" width="94" height="62" rx="0" fill="#fff0df" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1207" y="578" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">t</text><text xml:space="preserve" x="1050" y="638" font-size="25" fill="#193a4e" text-anchor="start" font-weight="400">先 b（层 1），后 t（层 2）</text><text xml:space="preserve" x="865" y="706" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">展开 b</text><rect x="1050" y="669" width="94" height="62" rx="0" fill="#fff0df" stroke="#a8becb" stroke-width="2"/><text xml:space="preserve" x="1097" y="711" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">t</text><text xml:space="preserve" x="1050" y="771" font-size="25" fill="#193a4e" text-anchor="start" font-weight="400">t 已发现；parent[t] 仍为 a</text><text xml:space="preserve" x="865" y="839" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">展开 t</text><text xml:space="preserve" x="1065" y="839" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">空</text><text xml:space="preserve" x="50" y="810" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">最短路径不是唯一：s → a → t 与 s → b → t 都长 2。</text><text xml:space="preserve" x="50" y="875" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">父指针只保存首次发现的一个选择；邻居次序会改变它。</text><text xml:space="preserve" x="50" y="940" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">队列次序与“每个顶点只入队一次”共同支撑线性复杂度。</text></g></svg>
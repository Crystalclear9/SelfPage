ite" stroke-width="2" /><text x="570" y="197" font-size="22" fill="white" font-weight="700" text-anchor="middle">t</text><text x="730" y="40" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">队列（左侧出队）</text><rect x="730" y="90" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="777.5" y="122.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">s</text><rect x="730" y="165" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="777.5" y="197.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">a</text><rect x="830" y="165" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="877.5" y="197.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">b</text><rect x="730" y="240" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="777.5" y="272.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">b</text><rect x="830" y="240" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="877.5" y="272.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">t</text><rect x="730" y="315" width="95" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="777.5" y="347.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">t</text><text x="25" y="390" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">t 首次由 a 发现：距离 2；从 b 再看到 t 时不重复入队</text></g></svg>

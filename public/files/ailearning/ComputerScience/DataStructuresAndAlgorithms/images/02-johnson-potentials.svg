<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">负边怎样安全消除，而不改变路径的优劣？</title><desc id="desc">四顶点图经最短路势函数重新赋权，所有边非负，路径代价只增加端点势差。原最短路3变成5，再减端点差还原；给每条边统一加4反而将路径排序改变。</desc><rect width="1200" height="860" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">负边怎样安全消除，而不改变路径的优劣？</text><text x="40" y="105" font-size="26" fill="#627689" text-anchor="start">w′(u,v) = w(u,v) + h(u) − h(v)；同一对端点的所有路径只差一个常数。</text><text x="285" y="167" font-size="28" fill="#213447" text-anchor="middle">原权重：允许负边，无负环</text><line x1="108.22136080134075" y1="317.1721087266633" x2="268.1371732888088" y2="244.48310305054144" stroke="#2865a0" stroke-width="3"/><polyline points="260.9307647355711,254.07829329168945 268.1371732888088,244.48310305054144 256.16945994882866,243.60342276085615" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="171.0" y="231.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="190.0" y="258.0" font-size="27" fill="#2865a0" text-anchor="middle">2</text><line x1="106.42200458810863" y1="346.2135028154303" x2="270.1687044972967" y2="446.69443230515935" stroke="#2865a0" stroke-width="3"/><polyline points="258.1839337372993,446.09005673458176 270.1687044972967,446.69443230515935 264.20186972693676,436.28304993665404" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="171.0" y="404.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="190.0" y="431.5" font-size="27" fill="#2865a0" text-anchor="middle">5</text><line x1="111.0" y1="330.0" x2="495.0" y2="330.0" stroke="#2865a0" stroke-width="3"/><polyline points="484.4690092573155,335.75310646325045 495.0,330.0 484.4690092573155,324.24689353674955" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="151" y="284.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="170" y="311.0" font-size="27" fill="#2865a0" text-anchor="middle">6</text><line x1="300.0" y1="434.0" x2="300.0" y2="265.0" stroke="#c87536" stroke-width="3"/><polyline points="305.75310646325045,275.5309907426845 300.0,265.0 294.24689353674955,275.5309907426845" fill="none" stroke="#c87536" stroke-width="3"/><rect x="311.0" y="320.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="330.0" y="347.5" font-size="27" fill="#c87536" text-anchor="middle">-4</text><line x1="328.4291717438503" y1="242.36050945384795" x2="497.9025480311368" y2="316.04458610049426" stroke="#2865a0" stroke-width="3"/><polyline points="485.9509779896957,317.12160678020604 497.9025480311368,316.04458610049426 490.53880552698604,306.5696034444382" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="396.0" y="231.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="415.0" y="258.0" font-size="27" fill="#2865a0" text-anchor="middle">2</text><line x1="326.73488929843637" y1="449.30778236830906" x2="499.8154475662815" y2="347.7170199067478" stroke="#2865a0" stroke-width="3"/><polyline points="493.645580694381,358.0093832302525 499.8154475662815,347.7170199067478 487.82112916666404,348.08624359043836" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="396.0" y="404.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="415.0" y="431.5" font-size="27" fill="#2865a0" text-anchor="middle">3</text><circle cx="80" cy="330" r="30" fill="#eaf2fa"/><text x="80" y="340" font-size="29" fill="#213447" text-anchor="middle">s</text><circle cx="300" cy="230" r="30" fill="#eaf2fa"/><text x="300" y="240" font-size="29" fill="#213447" text-anchor="middle">a</text><circle cx="300" cy="465" r="30" fill="#eaf2fa"/><text x="300" y="475" font-size="29" fill="#213447" text-anchor="middle">b</text><circle cx="530" cy="330" r="30" fill="#eaf2fa"/><text x="530" y="340" font-size="29" fill="#213447" text-anchor="middle">t</text><text x="875" y="167" font-size="28" fill="#213447" text-anchor="middle">势函数重赋权：每条边非负</text><line x1="698.2213608013408" y1="317.1721087266633" x2="858.1371732888089" y2="244.48310305054144" stroke="#2865a0" stroke-width="3"/><polyline points="850.9307647355711,254.07829329168942 858.1371732888089,244.48310305054144 846.1694599488287,243.60342276085615" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="761.0" y="231.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="780.0" y="258.0" font-size="27" fill="#2865a0" text-anchor="middle">6</text><line x1="696.4220045881086" y1="346.2135028154303" x2="860.1687044972967" y2="446.69443230515935" stroke="#2865a0" stroke-width="3"/><polyline points="848.1839337372993,446.09005673458176 860.1687044972967,446.69443230515935 854.2018697269368,436.28304993665404" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="761.0" y="404.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="780.0" y="431.5" font-size="27" fill="#2865a0" text-anchor="middle">5</text><line x1="701.0" y1="330.0" x2="1085.0" y2="330.0" stroke="#2865a0" stroke-width="3"/><polyline points="1074.4690092573155,335.75310646325045 1085.0,330.0 1074.4690092573155,324.24689353674955" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="741" y="284.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="760" y="311.0" font-size="27" fill="#2865a0" text-anchor="middle">8</text><line x1="890.0" y1="434.0" x2="890.0" y2="265.0" stroke="#2865a0" stroke-width="3"/><polyline points="895.7531064632504,275.5309907426845 890.0,265.0 884.2468935367496,275.5309907426845" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="901.0" y="320.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="920.0" y="347.5" font-size="27" fill="#2865a0" text-anchor="middle">0</text><line x1="918.4291717438502" y1="242.36050945384795" x2="1087.9025480311368" y2="316.04458610049426" stroke="#2865a0" stroke-width="3"/><polyline points="1075.9509779896957,317.12160678020604 1087.9025480311368,316.04458610049426 1080.5388055269862,306.5696034444382" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="986.0" y="231.0" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="1005.0" y="258.0" font-size="27" fill="#2865a0" text-anchor="middle">0</text><line x1="916.7348892984364" y1="449.30778236830906" x2="1089.8154475662816" y2="347.7170199067478" stroke="#2865a0" stroke-width="3"/><polyline points="1083.6455806943811,358.0093832302525 1089.8154475662816,347.7170199067478 1077.8211291666642,348.08624359043836" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="986.0" y="404.5" width="38" height="36" fill="#ffffff" opacity="1" rx="3"/><text x="1005.0" y="431.5" font-size="27" fill="#2865a0" text-anchor="middle">5</text><circle cx="670" cy="330" r="30" fill="#eaf2fa"/><text x="670" y="340" font-size="29" fill="#213447" text-anchor="middle">s</text><circle cx="890" cy="230" r="30" fill="#eaf2fa"/><text x="890" y="240" font-size="29" fill="#213447" text-anchor="middle">a</text><circle cx="890" cy="465" r="30" fill="#eaf2fa"/><text x="890" y="475" font-size="29" fill="#213447" text-anchor="middle">b</text><circle cx="1120" cy="330" r="30" fill="#eaf2fa"/><text x="1120" y="340" font-size="29" fill="#213447" text-anchor="middle">t</text><text x="40" y="570" font-size="27" fill="#213447" text-anchor="start">h(s)=0，h(a)=−4，h(b)=0，h(t)=−2</text><text x="40" y="630" font-size="27" fill="#c87536" text-anchor="start">最优路径 s → b → a → t：原代价 5 − 4 + 2 = 3</text><text x="40" y="680" font-size="26" fill="#2865a0" text-anchor="start">同一路径重赋权后：5 + 0 + 0 = 5；还原为 5 − h(s) + h(t) = 3</text><line x1="40" y1="718" x2="1160" y2="718" stroke="#dce5ed" stroke-width="2"/><text x="40" y="766" font-size="26" fill="#213447" text-anchor="start">对照：每条边统一加 4，直达变 10，原最优三边路径却变 15，排序反转。</text><text x="40" y="816" font-size="26" fill="#627689" text-anchor="start">势函数按端点相消；统一加常数按边数累积。图中箭头都表示有向边。</text></g></svg>
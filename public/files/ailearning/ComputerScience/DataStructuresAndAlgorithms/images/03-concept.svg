<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：容量为 6 而物品只有一件，最大价值应为 5</title><desc id="detail-desc">容量为 6 而物品只有一件，最大价值应为 5。逆序遍历读取旧的 f[3]=0；正序遍历读取本轮刚更新的 f[3]=5，错误生成价值 10，这条依赖线揭示重复使用的原因。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="28" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">0/1 背包：仅一件物品，重量 3，价值 5</text><text x="25" y="100" font-size="23" fill="#213447" font-weight="400" text-anchor="start">容量</text><rect x="180" y="65" width="105" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="232.5" y="97.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">0</text><rect x="290" y="65" width="105" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="342.5" y="97.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="400" y="65" width="105" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="452.5" y="97.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="510" y="65" width="105" height="50" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="562.5" y="97.5" font-size="23" fill="#213447" font-weight="500" text-a
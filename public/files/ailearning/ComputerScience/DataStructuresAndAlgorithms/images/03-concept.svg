<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="870" viewBox="0 0 1200 870" role="img"><title id="figure-title">一维动态规划：循环方向改变依赖层</title><desc id="figure-desc">初始容量0到6全为0。单件物品重量3价值5，倒序时容量6读取旧容量3的0，正序时读取本轮容量3的5并错误得到10。</desc><rect width="1200" height="870" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">一维动态规划：循环方向改变依赖层</text><text x="55" y="145" font-size="29" fill="#213447" text-anchor="start" font-weight="400">仅一件物品：重量 3，价值 5；容量上限 6</text><text x="402" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">0</text><text x="507" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">1</text><text x="612" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">2</text><text x="717" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">3</text><text x="822" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">4</text><text x="927" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">5</text><text x="1032" y="220" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">6</text><text x="55" y="220" font-size="27" fill="#213447" text-anchor="start" font-weight="400">容量 c</text><text x="55" y="296" font-size="27" fill="#213447" text-anchor="start" font-weight="400">旧层：未用物品</text><rect x="360" y="255" width="97" height="65" rx="6" fill="#fff0e3" stroke="#cbd9e4" stroke-width="1.5" /><text x="408.5" y="298.0" font-size="30" fill="#cbd9e4" text-anchor="mi
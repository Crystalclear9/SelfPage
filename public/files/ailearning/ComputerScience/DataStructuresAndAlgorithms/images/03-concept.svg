" y="585" width="97" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="933.5" y="628.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">5</text><rect x="990" y="585" width="97" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1038.5" y="628.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">10</text><path d="M717 330 L1032 400" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="735" y="376" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">c=6 读取旧 f[3]=0</text><line x1="717" y1="658" x2="717" y2="692" stroke="#c87536" stroke-width="3" /><path d="M717 692 L1032 692" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M1032 692 L1032 660" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="600" y="760" font-size="30" fill="#213447" text-anchor="middle" font-weight="400">倒序：0 + 5 = 5；正序：5 + 5 = 10</text><text x="600" y="825" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">循环方向决定读哪一层；完全背包有不同的复用规则</text></g></svg>

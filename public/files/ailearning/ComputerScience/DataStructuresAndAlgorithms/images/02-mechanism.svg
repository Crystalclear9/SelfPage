<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635.87" viewBox="11.00 10.00 1104.00 585.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">负权边使已定型的最短距离失效</title><desc id="desc">这张反例图的原始边是 s→a 权重 2、s→b 权重 5、b→a 权重 −10。若按暂定距离先把 a 的 2 定型，之后才处理 b，就会发现更短路径 s→b→a 的总权重为 −5。 三条箭头就是原始有向边，标注的是边权。反例针对把顶点距离一次定型的 Dijkstra 论证；没有负环，因而这里的最短路仍有有限值。 无负环，但存在负边；标准非负权 Dijkstra 的定型保证失效。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">负权边使已定型的最短距离失效</text><path d="M385,336.5 L800,253.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><text x="604.5" y="283" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">2</text><path d="M385,393.5 L800,476.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><text x="604.5" y="423" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">5</text><path d="M942.5,450 L942.5,280" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><text x="954.5" y="353" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">−10</text><rect x="100" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="242.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">s：起点</text><rect x="800" y="170" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="942.5" y="233" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">a：直接 2，最短 −5</text><rect x="800" y="450" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="942.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">b：距离 5</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1420.000" height="856.250" viewBox="25.000 63.750 1420.000 856.250"><title>负边破坏的是“出队即可定型”，而不只是距离计算</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#778994" /></marker></defs><rect width="1420.0" height="856.25" fill="white" x="25.0" y="63.75" /><g font-family="Microsoft YaHei, sans-serif" fill="#203747"><text x="55" y="117" font-size="28" fill="#778994" text-anchor="start">有向边 s→a 为 2，s→b 为 5，b→a 为 −10；无负环</text><path d="M302 331L848 239" fill="none" stroke="#24689a" stroke-width="3" marker-end="url(#a)" /><text x="605.0" y="265.0" font-size="32" fill="#24689a" text-anchor="start">2</text><path d="M302 353L848 487" fill="none" stroke="#24689a" stroke-width="3" marker-end="url(#a)" /><text x="605.0" y="400.0" font-size="32" fill="#24689a" text-anchor="start">5</text><path d="M900 467L900 263" fill="none" stroke="#c56b31" stroke-width="3" marker-end="url(#a)" /><text x="930.0" y="345.0" font-size="32" fill="#c56b31" text-anchor="start">-10</text><rect x="198" y="307" width="104" height="66" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="250" y="351" font-size="32" fill="#203747" text-anchor="middle">s</text><rect x="848" y="197" width="104" height="66" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="900" y="241" font-size="32" fill="#203747" text-anchor="middle">a</text><rect x="848" y="467" width="104" height="66" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="900" y="511" font-size="32" fill="#203747" text-anchor="middle">b</text><text x="55" y="610" font-size="32" fill="#203747" text-anchor="start">按最小暂定距离弹出</text><text x="600" y="610" font-size="32" fill="#203747" text-anchor="start">新信息</text><text x="1150" y="610" font-size="32" fill="#203747" text-anchor="start">已定型</text><rect x="55" y="647" width="1360" height="73" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="75" y="690" font-size="30" fill="#203747" text-anchor="start">s，距离 0</text><text x="600" y="690" font-size="30" fill="#203747" text-anchor="start">a←2，b←5</text><text x="1150" y="690" font-size="30" fill="#203747" text-anchor="start">s</text><rect x="55" y="732" width="1360" height="73" fill="white" stroke="none" stroke-width="2" /><text x="75" y="775" font-size="30" fill="#203747" text-anchor="start">a，距离 2</text><text x="600" y="775" font-size="30" fill="#203747" text-anchor="start">a 被当成最终答案</text><text x="1150" y="775" font-size="30" fill="#203747" text-anchor="start">s,a</text><rect x="55" y="817" width="1360" height="73" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="75" y="860" font-size="30" fill="#203747" text-anchor="start">b，距离 5</text><text x="600" y="860" font-size="30" fill="#c56b31" text-anchor="start">经 b 到 a 为 5−10=−5</text><text x="1150" y="860" font-size="30" fill="#203747" text-anchor="start">s,a,b</text></g><desc> 负边破坏的是“出队即可定型”，而不只是距离计算 若禁止改写已定型 a，就漏掉 −5；允许重新打开顶点，则已经放弃一次定型的证明。</desc></svg>

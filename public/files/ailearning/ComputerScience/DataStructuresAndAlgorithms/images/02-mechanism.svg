<text x="593" y="565" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">2</text>
<rect x="687" y="532" width="180" height="50" fill="#ecf6f6" opacity="1"/>
<text x="777" y="565" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">5</text>
<text x="303" y="565" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">第 1 轮</text>
<rect x="319" y="586" width="180" height="50" fill="#ecf6f6" opacity="1"/>
<text x="409" y="619" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0</text>
<rect x="503" y="586" width="180" height="50" fill="#fbede8" opacity="1"/>
<text x="593" y="619" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">−5</text>
<rect x="687" y="586" width="180" height="50" fill="#ecf6f6" opacity="1"/>
<text x="777" y="619" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">5</text>
<text x="303" y="619" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">第 2 轮</text>
<text x="409" y="464" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">s</text>

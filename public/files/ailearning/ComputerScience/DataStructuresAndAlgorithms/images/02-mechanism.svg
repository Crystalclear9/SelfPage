<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1372.4227" viewBox="0 0 1440 1372.4227" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">负权边使已定型的最短距离失效</title><rect width="1440" height="1372.4227" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">负权边使已定型的最短距离失效</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1230.4227" viewBox="0 0 1440 1318.31" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>负边破坏的是“出队即可定型”，而不只是距离计算</title><svg width="1440" height="868.31" viewBox="25.000 63.750 1420.000 856.250"><title>负边破坏的是“出队即可定型”，而不只是距离计算</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#79919f"/></marker></defs><rect width="1420.0" height="856.25" fill="white" x="25.0" y="63.75"/><g font-family="Microsoft YaHei, sans-serif" fill="#1f3348"><text x="55" y="117" font-size="28" fill="#79919f" text-anchor="start">有向边 s→a 为 2，s→b 为 5，b→a 为 −10；无负环</text><path d="M302 331L848 239" fill="none" stroke="#2073ab" stroke-width="3" marker-end="url(#a)"/><text x="605.0" y="265.0" font-size="32" fill="#2073ab" text-anchor="start">2</text><path d="M302 353L848 487" fill="none" stroke="#2073ab" stroke-width="3" marker-end="url(#a)"/><text x="605.0" y="400.0" font-size="32" fill="#2073ab" text-anchor="start">5</text><path d="M900 467L900 263" fill="none" stroke="#c16d35" stroke-width="3" marker-end="url(#a)"/><text x="930.0" y="345.0" font-size="32" fill="#c16d35" text-anchor="start">-10</text><rect x="198" y="307" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#2073ab" stroke-width="2"/><text x="250" y="351" font-size="32" fill="#1f3348" text-anchor="middle">s</text><rect x="848" y="197" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#2073ab" stroke-width="2"/><text x="900" y="241" font-size="32" fill="#1f3348" text-anchor="middle">a</text><rect x="848" y="467" width="104" height="66" fill="url(#book-wash-edf4f9)" stroke="#2073ab" stroke-width="2"/><text x="900" y="511" font-size="32" fill="#1f3348" text-anchor="middle">b</text><text x="55" y="610" font-size="32" fill="#1f3348" text-anchor="start">按最小暂定距离弹出</text><text x="600" y="610" font-size="32" fill="#1f3348" text-anchor="start">新信息</text><text x="1150" y="610" font-size="32" fill="#1f3348" text-anchor="start">已定型</text><rect x="55" y="647" width="1360" height="73" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="75" y="690" font-size="30" fill="#1f3348" text-anchor="start">s，距离 0</text><text x="600" y="690" font-size="30" fill="#1f3348" text-anchor="start">a←2，b←5</text><text x="1150" y="690" font-size="30" fill="#1f3348" text-anchor="start">s</text><rect x="55" y="732" width="1360" height="73" fill="white" stroke="none" stroke-width="2"/><text x="75" y="775" font-size="30" fill="#1f3348" text-anchor="start">a，距离 2</text><text x="600" y="775" font-size="30" fill="#1f3348" text-anchor="start">a 被当成最终答案</text><text x="1150" y="775" font-size="30" fill="#1f3348" text-anchor="start">s,a</text><rect x="55" y="817" width="1360" height="73" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="75" y="860" font-size="30" fill="#1f3348" text-anchor="start">b，距离 5</text><text x="600" y="860" font-size="30" fill="#c16d35" text-anchor="start">经 b 到 a 为 5−10=−5</text><text x="1150" y="860" font-size="30" fill="#1f3348" text-anchor="start">s,a,b</text></g><desc> 负边破坏的是“出队即可定型”，而不只是距离计算 若禁止改写已定型 a，就漏掉 −5；允许重新打开顶点，则已经放弃一次定型的证明。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 868.31) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">同步松弛轮次：第 k 轮只使用至多 k 条边的路径信息</text><rect x="65" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="271.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">轮0：s=0</text><rect x="485" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="691.0" y="184" font-size="32.17" fill="#1e7499" text-anchor="middle">a=∞</text><rect x="905" y="145" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1111.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">b=∞</text><rect x="65" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="271.0" y="284" font-size="28" fill="#1e7499" text-anchor="middle">轮1：s=0</text><rect x="485" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="691.0" y="284" font-size="28" fill="#1e7499" text-anchor="middle">a=2</text><rect x="905" y="245" width="412" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1111.0" y="284" font-size="28" fill="#1e7499" text-anchor="middle">b=5</text><rect x="65" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="271.0" y="384" font-size="28" fill="#c66d3a" text-anchor="middle">轮2：s=0</text><rect x="485" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="691.0" y="384" font-size="28" fill="#c66d3a" text-anchor="middle">a=−5</text><rect x="905" y="345" width="412" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1111.0" y="384" font-size="28" fill="#c66d3a" text-anchor="middle">b=5</text><text x="65" y="442" font-size="27" fill="#1d3145" text-anchor="start">第二轮用旧 b=5 经边 −10 改进 a；过早把 a=2 定型才是失败原因。</text></g></g></svg></svg>

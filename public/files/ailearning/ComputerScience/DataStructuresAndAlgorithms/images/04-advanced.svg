<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">蓄水池采样让后来的项仍有公平机会</title><desc id="desc">容量为二的蓄水池先接收前两项，第三项以三分之二概率进入，第四项以二分之一概率进入。进入时再均匀选择替换槽位，才能让处理完四项后每个历史项都有二分之一的保留概率。 柱图表示当次进入概率，不是最终保留概率。早期项初始进入概率较高，还会受到之后的随机替换；不能只凭柱高断言偏向早期。最终公平性需要按留存概率的连乘证明。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">蓄水池采样让后来的项仍有公平机会</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">这是当次进入概率；保留至最终时刻的概率须再乘后续存活概率。</text><path d="M140,540 L1100,540" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="547" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M140,462.5 L1100,462.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="469.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.25</text><path d="M140,385 L1100,385" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="392" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.5</text><path d="M140,307.5 L1100,307.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="314.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.75</text><path d="M140,230 L1100,230" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="237" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><text x="80" y="190" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">进入容量为 2 的蓄水池的概率</text><text x="180" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">第 2 项</text><rect x="280.0" y="230.0" width="91" height="310.0" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="325.5" y="216" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">1</text><text x="480" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">第 3 项</text><rect x="580.0" y="333.33333333333337" width="91" height="206.66666666666663" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="625.5" y="319.333" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.667</text><text x="780" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">第 4 项</text><rect x="880.0" y="385.0" width="91" height="155.0" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="925.5" y="371" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.5</text><rect x="180" y="635" width="23" height="13" fill="#268d8c" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="651" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">当次进入概率</text><text x="140" y="690" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">t≤2 时直接填满</text><text x="140" y="719" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">t&gt;2：进入概率为 2 除以 t；进入后随机替换一槽</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1269.79" viewBox="0 0 1440 1269.79" role="img"><title>01-复杂度与基础数据结构</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="819.792" viewBox="18.133 66.114 1243.733 708.057"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6" /></marker></defs><rect width="1243.733" height="708.057" fill="white" x="18.133" y="66.114" /><text x="44" y="114" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">示意函数 h(k) = k mod 4；键 2、6、10 都从位置 2 开始。</text><text x="44" y="175" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#253f52" text-anchor="start" font-weight="400">链式：桶 2 保存三个不同键，仍需逐个比较</text><rect x="54" y="205" width="120" height="70" rx="0" fill="white" stroke="#b7c7d3" /><text x="114" y="249" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">桶 0</text><rect x="184" y="205" width="120" height="70" rx="0" fill="white" stroke="#b7c7d3" /><text x="244" y="249" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">桶 1</text><rect x="314" y="205" width="120" height="70" rx="0" fill="#dcecf8" stroke="#b7c7d3" /><text x="374" y="249" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">桶 2</text><rect x="444" y="205" width="120" height="70" rx="0" fill="white" stroke="#b7c7d3" /><text x="504" y="249" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">桶 3</text><line x1="377" y1="282" x2="377" y2="325" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)" /><circle cx="377" cy="370" r="35" fill="#2676b5" stroke="none" /><text x="377" y="379" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">2</text><line x1="417" y1="370" x2="519" y2="370" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)" /><circle cx="562" cy="370" r="35" fill="#2676b5" stroke="none" /><text x="562" y="379" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">6</text><line x1="602" y1="370" x2="704" y2="370" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)" /><circle cx="747" cy="370" r="35" fill="#2676b5" stroke="none" /><text x="747" y="379" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">10</text><text x="835" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#cc661c" text-anchor="start" font-weight="400">相同哈希 ≠ 相等对象</text><text x="835" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">查找 10：排除 2、6 后命中</text><line x1="44" y1="432" x2="1236" y2="432" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" /><text x="44" y="482" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#253f52" text-anchor="start" font-weight="400">开放寻址：依次放到槽 2、3、0，再删除键 2</text><text x="44" y="577" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#cc661c" text-anchor="start" font-weight="400">错误地清为空槽</text><text x="424" y="523" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 0</text><rect x="355" y="535" width="138" height="60" rx="0" fill="#e6f2f9" stroke="#b7c7d3" /><text x="424" y="575" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">10</text><text x="579" y="523" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 1</text><rect x="510" y="535" width="138" height="60" rx="0" fill="white" stroke="#b7c7d3" /><text x="579" y="575" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">EMPTY</text><text x="734" y="523" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 2</text><rect x="665" y="535" width="138" height="60" rx="0" fill="white" stroke="#b7c7d3" /><text x="734" y="575" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">EMPTY</text><text x="889" y="523" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 3</text><rect x="820" y="535" width="138" height="60" rx="0" fill="#e6f2f9" stroke="#b7c7d3" /><text x="889" y="575" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">6</text><text x="1035" y="557" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="start" font-weight="400">查找 10</text><text x="1035" y="600" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#cc661c" text-anchor="start" font-weight="400">2 → 停止，漏查</text><text x="44" y="722" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#2676b5" text-anchor="start" font-weight="400">正确地保留墓碑</text><text x="424" y="668" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 0</text><rect x="355" y="680" width="138" height="60" rx="0" fill="#e6f2f9" stroke="#b7c7d3" /><text x="424" y="720" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">10</text><text x="579" y="668" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 1</text><rect x="510" y="680" width="138" height="60" rx="0" fill="white" stroke="#b7c7d3" /><text x="579" y="720" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">EMPTY</text><text x="734" y="668" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 2</text><rect x="665" y="680" width="138" height="60" rx="0" fill="#fff1e4" stroke="#b7c7d3" /><text x="734" y="720" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">DEL</text><text x="889" y="668" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">槽 3</text><rect x="820" y="680" width="138" height="60" rx="0" fill="#e6f2f9" stroke="#b7c7d3" /><text x="889" y="720" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="middle" font-weight="400">6</text><text x="1035" y="702" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="start" font-weight="400">查找 10</text><text x="1035" y="745" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#2676b5" text-anchor="start" font-weight="400">2 → 3 → 0，命中</text><desc> 哈希冲突不等于同一键：链与探测路径都要保留身份 墓碑表示“这里曾有键，后面可能有碰撞键”；它不是查询终止证据。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 819.792) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">墓碑可作为候选插入位置，却不能据此停止检查重复键</text><rect x="65" y="145" width="272" height="58" fill="#edf5f8" stroke="#216c89"/><text x="201.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">10</text><rect x="345" y="145" width="272" height="58" fill="#edf5f8" stroke="#216c89"/><text x="481.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">EMPTY</text><rect x="625" y="145" width="272" height="58" fill="#edf5f8" stroke="#216c89"/><text x="761.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">DEL</text><rect x="905" y="145" width="272" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1041.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">6</text><text x="65" y="265" font-size="27" fill="#203742" text-anchor="start">再次插入键10：从桶2开始 → 记住DEL → 桶3不是10 → 桶0已存在10</text><text x="65" y="335" font-size="30" fill="#c96937" text-anchor="start">正确：更新桶0；错误：立即占用桶2，制造两个相同键</text><text x="65" y="411" font-size="28" fill="#203742" text-anchor="start">若最终遇到 EMPTY 且全程未见同键，才可复用先前墓碑位置。</text></g></g></svg>

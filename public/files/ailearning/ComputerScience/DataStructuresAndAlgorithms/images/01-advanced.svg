<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="743.21" viewBox="17.00 14.00 1148.00 711.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">哈希冲突把不同键送入同一桶</title><desc id="desc">用整数模四作为示意哈希函数，键 2、6、10 都落到桶 2。链式冲突处理需要继续比较实际键，因此“找到桶”不等于“已经找到唯一元素”。 这是解释碰撞的刻意构造，不代表某种语言实际采用此哈希函数或链式结构。通常的期望常数时间需要负载与分布假设；集中碰撞会改变访问成本。 示例用模 4 分桶与链式冲突处理；同桶不表示键相等。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2865a0" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">哈希冲突把不同键送入同一桶</text><path d="M440,235 L760,501.667" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,435 L760,501.667" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,635 L760,501.667" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="200.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="235" font-size="24" fill="#213447" text-anchor="start" font-weight="400">键 2：模 4 得 2</text><rect x="60" y="400.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="435" font-size="24" fill="#213447" text-anchor="start" font-weight="400">键 6：模 4 得 2</text><rect x="60" y="600.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="635" font-size="24" fill="#213447" text-anchor="start" font-weight="400">键 10：模 4 得 2</text><rect x="770" y="200.0" width="365" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="235" font-size="24" fill="#213447" text-anchor="start" font-weight="400">桶 0：空</text><rect x="770" y="333.33333333333337" width="365" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="368.333" font-size="24" fill="#213447" text-anchor="start" font-weight="400">桶 1：空</text><rect x="770" y="466.6666666666667" width="365" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="501.667" font-size="24" fill="#213447" text-anchor="start" font-weight="400">桶 2：2 → 6 → 10</text><rect x="770" y="600.0" width="365" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="635" font-size="24" fill="#213447" text-anchor="start" font-weight="400">桶 3：空</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="595" viewBox="0 0 1350 595" role="img" aria-labelledby="label detail"><title id="label">Top-k小根堆只保留当前门槛</title><desc id="detail">容量三的小根堆保存 5、9、7。加入 6 后根变成 6；后来值 4 被丢弃。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="595" fill="white" stroke="none" stroke-width="1.6"/><text x="334" y="69" fill="#196f77" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">原小根堆</text><line x1="301.69748851" y1="232.6631639" x2="199.64655527" y2="350.09163504" stroke="#657682" stroke-width="2" stroke-linecap="round"/><line x1="346.38915667" y1="232.58760762" x2="449.26934794" y2="350.16496907" stroke="#657682" stroke-width="2" stroke-linecap="round"/><circle cx="324" cy="207" r="34" stroke="#196f77" fill="url(#wash-teal)" stroke-width="2"/><text x="324" y="217.54" fill="#196f77" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">5</text><circle cx="178" cy="375" r="34" stroke="#657682" fill="url(#wash-gray)" stroke-width="2"/><text x="178" y="385.54" fill="#657682" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">9</text><circle cx="471" cy="375" r="34" stroke="#657682" fill="url(#wash-gray)" stroke-width="2"/><text x="471" y="385.54" fill="#657682" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">7</text><text x="324" y="472" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">根是当前门槛</text><text x="1011" y="69" fill="#a84b3b" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">接纳 6 后</text><line x1="978.69748851" y1="232.6631639" x2="876.64655527" y2="350.09163504" stroke="#657682" stroke-width="2" stroke-linecap="round"/><line x1="1023.38915667" y1="232.58760762" x2="1126.26934794" y2="350.16496907" stroke="#657682" stroke-width="2" stroke-linecap="round"/><circle cx="1001" cy="207" r="34" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="2"/><text x="1001" y="217.54" fill="#a84b3b" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">6</text><circle cx="855" cy="375" r="34" stroke="#657682" fill="url(#wash-gray)" stroke-width="2"/><text x="855" y="385.54" fill="#657682" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">9</text><circle cx="1148" cy="375" r="34" stroke="#657682" fill="url(#wash-gray)" stroke-width="2"/><text x="1148" y="385.54" fill="#657682" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">7</text><text x="1001" y="472" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">根是当前门槛</text><line x1="553" y1="242" x2="718" y2="242" stroke="#655184" stroke-width="2.15" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="633" y="209" fill="#655184" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">替换根</text><text x="670" y="551" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">下一项 4 小于门槛 6，直接丢弃</text></svg>
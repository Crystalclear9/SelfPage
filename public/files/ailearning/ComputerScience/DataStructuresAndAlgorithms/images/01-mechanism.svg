<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="859.140" height="465.242" viewBox="22.020 71.746 859.140 465.242" role="img"><title id="figure-title">稀疏图：用邻接表保存真实存在的边</title><desc id="figure-desc">左侧小图与右侧邻接表一一对应：a 指向 b、c，c 指向 d，b 与 d 没有出边。图中小例用于核对结构；一般邻接表需要顶点入口和实际边记录。在 V=1000、E=2000 的例子中，邻接矩阵需要一百万个位置，而邻接表存储量级为 V+E，实际字节数还取决于表示与索引开销。 稀疏图：用邻接表保存真实存在的边</desc><rect x="22.02" y="71.746" width="859.14" height="465.242" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><path d="M332.11580551841615 347.966912709024 L179.80724237686553 391.48364503518127" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M173.86401011747097 211.4775307953966 L334.49019608132414 322.3860877704381" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M178.35627000824488 188.92365642680465 L329.6881251636003 156.49540175065707" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><circle cx="150" cy="195" r="25" fill="#2865a0" stroke="white" stroke-width="2" /><text x="150" y="205" font-size="28" fill="white" text-anchor="middle" font-weight="400">a</text><circle cx="360" cy="150" r="25" fill="#2865a0" stroke="white" stroke-width="2" /><text x="360" y="160" font-size="28" fill="white" text-anchor="middle" font-weight="400">b</text><circle cx="360" cy="340" r="25" fill="#2865a0" stroke="white" stroke-width="2" /><text x="360" y="350" font-size="28" fill="white" text-anchor="middle" font-weight="400">c</text><circle cx="150" cy="400" r="25" fill="#2865a0" stroke="white" stroke-width="2" /><text x="150" y="410" font-size="28" 
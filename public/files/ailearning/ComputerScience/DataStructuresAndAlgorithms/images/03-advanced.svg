<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608.32" viewBox="11.00 10.00 1154.00 585.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">状态若丢失约束历史，后续动作就不确定</title><desc id="desc">假设额外约束是不能选相邻两项。即使两个历史都有剩余容量 4，前一项是否被选仍会改变当前动作是否合法；只用剩余容量作为状态，会把不同后续问题错误合并。 这个反例说明状态充分性必须相对于约束证明。普通零一背包并没有该相邻约束，不需要照搬此状态；增加状态维度会增加成本，也应说明其必要性。 示例约束相邻物品不可同时选；仅剩余容量无法描述合法动作。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">状态若丢失约束历史，后续动作就不确定</text><path d="M345,317.5 L450,282.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,416.154 L450,453.846" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,235 L850,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,505 L850,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">相同剩余容量：4</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">前一项未选</text><rect x="450" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">前一项已选</text><rect x="850" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">可选当前项</text><rect x="850" y="450" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">不可选当前项</text></g></svg>

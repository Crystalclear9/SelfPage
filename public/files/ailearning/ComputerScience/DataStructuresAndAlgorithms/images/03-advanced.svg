<path d="M524 347 L545 347" fill="none" stroke="#a74d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M545 347 L534 352 L534 342 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>

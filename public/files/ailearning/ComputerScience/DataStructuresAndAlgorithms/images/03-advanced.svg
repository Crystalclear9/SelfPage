<path d="M524 161 L545 161" fill="none" stroke="#166d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M545 161 L534 166 L534 156 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M553 186 L580 137 L801 137 L774 186 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="677" y="169.9" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">可选第 3 件</text>
<path d="M806 161 L827 161" fill="none" stroke="#166d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

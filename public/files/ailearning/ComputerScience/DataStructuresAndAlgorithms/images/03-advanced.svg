<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>状态压缩之前，先看两个历史能否拥有同一条未来</title><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="38" fill="#203742" text-anchor="start">状态压缩之前，先看两个历史能否拥有同一条未来</text>
<text x="60" y="130" font-size="29" fill="#203742" text-anchor="start">三件物品：重量都为 2；价值 4、5、6；总容量 6；禁止相邻同选</text>
<text x="60" y="245" font-size="31" fill="#216c89" text-anchor="start">历史 A</text>
<circle cx="260" cy="237" r="36" fill="#216c89" stroke="#216c89" stroke-width="2"/>
<text x="260" y="248" font-size="29" fill="white" text-anchor="middle">1</text>
<text x="260" y="305" font-size="27" fill="#203742" text-anchor="middle">价值 4</text>
<circle cx="405" cy="237" r="36" fill="white" stroke="#7b8c95" stroke-width="2"/>
<text x="405" y="248" font-size="29" fill="#203742" text-anchor="middle">2</text>
<text x="405" y="305" font-size="27" fill="#203742" text-anchor="middle">价值 5</text>
<circle cx="550" cy="237" r="36" fill="white" stroke="#7b8c95" stroke-width="2"/>
<text x="550" y="248" font-size="29" fill="#203742" text-anchor="middle">3</text>
<text x="550" y="305" font-size="27" fill="#203742" text-anchor="middle">价值 6</text>
<text x="770" y="225" font-size="28" fill="#203742" text-anchor="start">同为：i=3，剩余容量 c=4</text>
<text x="770" y="275" font-size="28" fill="#216c89" text-anchor="start">前一件是否已选 b=0</text>
<text x="60" y="425" font-size="31" fill="#216c89" text-anchor="start">历史 B</text>
<circle cx="260" cy="417" r="36" fill="white" stroke="#7b8c95" stroke-width="2"/>
<text x="260" y="428" font-size="29" fill="#203742" text-anchor="middle">1</text>
<text x="260" y="485" font-size="27" fill="#203742" text-anchor="middle">价值 4</text>
<circle cx="405" cy="417" r="36" fill="#216c89" stroke="#216c89" stroke-width="2"/>
<text x="405" y="428" font-size="29" fill="white" text-anchor="middle">2</text>
<text x="405" y="485" font-size="27" fill="#203742" text-anchor="middle">价值 5</text>
<circle cx="550" cy="417" r="36" fill="white" stroke="#7b8c95" stroke-width="2"/>
<text x="550" y="428" font-size="29" fill="#203742" text-anchor="middle">3</text>
<text x="550" y="485" font-size="27" fill="#203742" text-anchor="middle">价值 6</text>
<text x="770" y="405" font-size="28" fill="#203742" text-anchor="start">同为：i=3，剩余容量 c=4</text>
<text x="770" y="455" font-size="28" fill="#c96937" text-anchor="start">前一件是否已选 b=1</text>
<line x1="60" y1="535" x2="1380" y2="535" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="590" font-size="31" fill="#203742" text-anchor="start">相同容量，两个不同的后续子问题</text>
<rect x="60" y="615" width="320" height="70" rx="3" fill="#edf5f8" stroke="#216c89" stroke-dasharray=""/>
<text x="220" y="660" font-size="30" fill="#216c89" text-anchor="middle">G(3,4,0) = 6</text>
<line x1="395" y1="650" x2="590" y2="650" stroke="#216c89" stroke-width="2" stroke-dasharray=""/>
<path d="M578.95,654.67 L590.00,650.00 L578.95,645.33" fill="none" stroke="#216c89" stroke-width="2"/>
<text x="615" y="658" font-size="29" fill="#216c89" text-anchor="start">可选第 3 件</text>
<text x="1030" y="658" font-size="30" fill="#216c89" text-anchor="start">4 + 6 = 10</text>
<rect x="60" y="725" width="320" height="70" rx="3" fill="#fff1e7" stroke="#c96937" stroke-dasharray=""/>
<text x="220" y="770" font-size="30" fill="#c96937" text-anchor="middle">G(3,4,1) = 0</text>
<line x1="395" y1="760" x2="590" y2="760" stroke="#c96937" stroke-width="2" stroke-dasharray=""/>
<path d="M578.95,764.67 L590.00,760.00 L578.95,755.33" fill="none" stroke="#c96937" stroke-width="2"/>
<text x="615" y="768" font-size="29" fill="#c96937" text-anchor="start">第 3 件被约束禁止</text>
<text x="1030" y="768" font-size="30" fill="#c96937" text-anchor="start">5 + 0 = 5</text>
<text x="60" y="865" font-size="28" fill="#c96937" text-anchor="start">若把 A 的“未来收益 6”复用给 B，就会错误选择相邻的第 2、3 件。</text>
</g></svg>

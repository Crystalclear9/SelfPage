<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：图中一百个位置对应应有的产物记录，最后两个缺失</title><desc id="detail-desc">图中一百个位置对应应有的产物记录，最后两个缺失。即使退出码为零且日志写着完成，产物验证仍应判定失败；独立验证把成功声明与实际结果分开。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="35" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">三项独立检查：退出状态、日志、实际产物</text><rect x="30" y="100" width="220" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="140.0" y="128" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">退出码 0</text><rect x="30" y="190" width="220" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="140.0" y="218" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">日志 complete</text><text x="340" y="75" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">要求 100 条记录；实际仅 98 条</text><rect x="350" y="110" width="26" height="30" rx="2" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><rect x="384" y="110" width="26" height="30" rx="2" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><rect x="418" y="110" width="26" height="30" rx="2" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><rect x="452" y="110" width="26" height="30" rx="2" fill="#eaf2fa"
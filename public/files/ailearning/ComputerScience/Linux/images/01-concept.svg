<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="442.08" viewBox="-5.29 33.84 1095.65 403.64" role="img"><title id="detail-title">机制展开：蓝线表示已有引用，橙线表示重命名发布后的路径解析</title><desc id="detail-desc">蓝线表示已有引用，橙线表示重命名发布后的路径解析。替换目录项会让随后打开路径的读者得到新对象，但不会把已打开的文件描述符自动切换到新 inode。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="60" width="260" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="60" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="85" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">发布前路径 data</text><text x="39" y="127" font-size="24" fill="#213447" font-weight="400" text-anchor="start">指向旧 inode</text><rect x="25" y="260" width="260" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="260" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="285" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">已有文件描述符 fd</text><text x="39" y="327" font-size="24" fill="#213447" font-weight="400" text-anchor="start">仍指向旧 inode</text><rect x="800" y="60" width="260" height="120" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="800" y="60" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="812" y="85" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">旧 inode</text><text x="814" y="127" font-size="24" fill="#213447" font-weight="400" text-anchor="start">内容 [1,2]</text><rect x="800" y="270" width="260" height="120" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="800" y="270" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="812" y="295" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">新 inode</text><text x="814" y="337" font-size="24" fill="#213447" font-weight="400" text-anchor="start">内容 [3,4]</text><path d="M300,100 L780,100" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M300,315 L780,160" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M300,140 L780,320" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="410" y="400" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">rename 改变路径指向</text></g></svg>

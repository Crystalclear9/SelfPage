<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>替换目录项以后：路径变了，已打开的文件没有换</title><rect width="1280" height="720" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">替换目录项以后：路径变了，已打开的文件没有换</text><text x="45" y="135" font-size="30" fill="#276884" text-anchor="start">替换之前</text><text x="45" y="230" font-size="27" fill="#233943" text-anchor="start">路径 data</text><text x="45" y="465" font-size="27" fill="#233943" text-anchor="start">已打开 fd</text><rect x="355" y="185" width="220" height="110" fill="#edf4f7" stroke="#dce5e8" stroke-width="2"/><text x="465" y="228" font-size="27" fill="#276884" text-anchor="middle">旧对象 A</text><text x="465" y="270" font-size="30" fill="#276884" text-anchor="middle">[1,2]</text><rect x="355" y="420" width="220" height="110" fill="#fff0e5" stroke="#dce5e8" stroke-width="2"/><text x="465" y="463" font-size="27" fill="#b25d2b" text-anchor="middle">新对象 B</text><text x="465" y="505" font-size="30" fill="#b25d2b" text-anchor="middle">[3,4]</text><line x1="195" y1="225" x2="345" y2="225" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="345,225 333.94726807196537,229.6730201077038 333.94726807196537,220.3269798922962" fill="#276884"/><line x1="195" y1="455" x2="345" y2="255" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="345,255 342.1067769293423,266.64599760705 334.6299447570162,261.0383734778054" fill="#276884"/><text x="45" y="575" font-size="27" fill="#276884" text-anchor="start">新 open → [1,2]</text><text x="45" y="625" font-size="27" fill="#276884" text-anchor="start">原 fd 读取 → [1,2]</text><text x="675" y="135" font-size="30" fill="#b25d2b" text-anchor="start">替换之后</text><text x="675" y="230" font-size="27" fill="#233943" text-anchor="start">路径 data</text><text x="675" y="465" font-size="27" fill="#233943" text-anchor="start">已打开 fd</text><rect x="985" y="185" width="220" height="110" fill="#edf4f7" stroke="#dce5e8" stroke-width="2"/><text x="1095" y="228" font-size="27" fill="#276884" text-anchor="middle">旧对象 A</text><text x="1095" y="270" font-size="30" fill="#276884" text-anchor="middle">[1,2]</text><rect x="985" y="420" width="220" height="110" fill="#fff0e5" stroke="#dce5e8" stroke-width="2"/><text x="1095" y="463" font-size="27" fill="#b25d2b" text-anchor="middle">新对象 B</text><text x="1095" y="505" font-size="30" fill="#b25d2b" text-anchor="middle">[3,4]</text><line x1="825" y1="225" x2="975" y2="460" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="975,460 965.1142459364897,453.1976572715137 972.9922308056621,448.1691562911909" fill="#b25d2b"/><line x1="825" y1="455" x2="975" y2="255" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="975,255 972.1067769293422,266.64599760705 964.6299447570162,261.0383734778054" fill="#276884"/><text x="675" y="575" font-size="27" fill="#b25d2b" text-anchor="start">新 open → [3,4]</text><text x="675" y="625" font-size="27" fill="#276884" text-anchor="start">原 fd 读取 → [1,2]</text><line x1="620" y1="115" x2="620" y2="640" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="45" y="690" font-size="27" fill="#233943" text-anchor="start">rename 是名称的原子切换；原句柄不会重新按路径查找内容。</text></g></svg>

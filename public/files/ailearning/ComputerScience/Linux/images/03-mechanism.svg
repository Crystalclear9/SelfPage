<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">重试不是幂等：重复追加会重复副作用</title><desc id="desc">任务超时只意味着调用方没有得到确认，不意味着副作用没有发生。盲目重试追加操作可能重复写入；用稳定任务键发布同一结果，可以让重复执行落在同一个逻辑身份上。 按键覆盖也不天然安全：不同输入若错误共用一个键，会覆盖有效结果。外部扣费或消息发送需要接收方支持的幂等协议，不能靠本地文件规则直接推广。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="530" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="355.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">重试不是幂等：重复追加会重复副作用</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">重试前次结果未知时，追加可能重复；覆盖仍需身份和原子性保证。</text><rect x="60.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">执行次数</text><rect x="420.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">追加记录策略</text><rect x="780.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">按任务键覆盖策略</text><rect x="60.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">第一次 task=k</text><rect x="420.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">产物含 k 一次</text><rect x="780.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">k → 结果</text><rect x="60.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">未知是否成功后重试</text><rect x="420.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">可能再追加 k 一次</text><rect x="780.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">仍为 k → 同一结果</text><rect x="60.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">所需保证</text><rect x="420.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">去重或事务协议</text><rect x="780.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">原子发布与身份校验</text></g></svg>

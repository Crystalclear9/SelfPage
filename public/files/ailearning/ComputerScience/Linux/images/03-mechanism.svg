<svg xmlns="http://www.w3.org/2000/svg" width="1477.333" height="934.667" viewBox="17.333 68.000 1477.333 934.667"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1477.333" height="934.667" fill="white" x="17.333" y="68.0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">两边都先成功执行，随后确认丢失；仅比较同一请求 k 的再次到达</text><text xml:space="preserve" x="100" y="220" font-size="31" fill="#c46c22" text-anchor="start" font-weight="400">普通追加：每次到达都执行</text><text xml:space="preserve" x="100" y="300" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">调用方</text><text xml:space="preserve" x="610" y="300" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">服务方</text><line x1="130" y1="340" x2="130" y2="800" stroke="#c7d8e2" stroke-width="3" stroke-dasharray="" /><line x1="610" y1="340" x2="610" y2="800" stroke="#c7d8e2" stroke-width="3" stroke-dasharray="" /><line x1="130" y1="365" x2="610" y2="415" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="240" y="360" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">请求 k</text><text xml:space="preserve" x="605" y="470" font-size="29" fill="#193a4e" text-anchor="end" font-weight="400">写入 k</text><line x1="610" y1="500" x2="130" y2="550" stroke="#aebcc5" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)" /><text xml:space="preserve" x="235" y="525" font-size="28" fill="#c46c22" text-anchor="start" font-weight="400">确认丢失</text><line x1="170" y1="525" x2="200" y2="555" stroke="#c46c22" stroke-width="4" stroke-dasharray="" /><line x1="200" y1="525" x2="170" y2="555" stroke="#c46c22" stroke-width="4" stroke-dasharray="" /><line x1="130" y1="615" x2="610" y2="665" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="240" y="610" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">仍用 k 重试</text><text xml:space="preserve" x="605" y="725" font-size="28" fill="#c46c22" text-anchor="end" font-weight="400">再写一次 k</text><text xml:space="preserve" x="100" y="860" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">实际副作用记录</text><circle cx="400" cy="850" r="34" fill="#fff0df" stroke="#9bb4c4" stroke-width="2" /><text xml:space="preserve" x="400" y="862" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">k</text><circle cx="530" cy="850" r="34" fill="#fff0df" stroke="#9bb4c4" stroke-width="2" /><text xml:space="preserve" x="530" y="862" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">k</text><text xml:space="preserve" x="100" y="945" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">2 份：调用方超时并未撤销首次写入</text><text xml:space="preserve" x="910" y="220" font-size="31" fill="#2676ad" text-anchor="start" font-weight="400">按稳定请求键去重</text><text xml:space="preserve" x="910" y="300" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">调用方</text><text xml:space="preserve" x="1420" y="300" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">服务方</text><line x1="940" y1="340" x2="940" y2="800" stroke="#c7d8e2" stroke-width="3" stroke-dasharray="" /><line x1="1420" y1="340" x2="1420" y2="800" stroke="#c7d8e2" stroke-width="3" stroke-dasharray="" /><line x1="940" y1="365" x2="1420" y2="415" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1050" y="360" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">请求 k</text><text xml:space="preserve" x="1415" y="470" font-size="29" fill="#193a4e" text-anchor="end" font-weight="400">写入 k</text><line x1="1420" y1="500" x2="940" y2="550" stroke="#aebcc5" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)" /><text xml:space="preserve" x="1045" y="525" font-size="28" fill="#c46c22" text-anchor="start" font-weight="400">确认丢失</text><line x1="980" y1="525" x2="1010" y2="555" stroke="#c46c22" stroke-width="4" stroke-dasharray="" /><line x1="1010" y1="525" x2="980" y2="555" stroke="#c46c22" stroke-width="4" stroke-dasharray="" /><line x1="940" y1="615" x2="1420" y2="665" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1050" y="610" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">仍用 k 重试</text><text xml:space="preserve" x="1415" y="725" font-size="28" fill="#2676ad" text-anchor="end" font-weight="400">已处理：复用结果</text><text xml:space="preserve" x="910" y="860" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">实际副作用记录</text><circle cx="1210" cy="850" r="34" fill="#e4f1f8" stroke="#9bb4c4" stroke-width="2" /><text xml:space="preserve" x="1210" y="862" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">k</text><text xml:space="preserve" x="910" y="945" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">1 份：同一请求的重复确认</text><line x1="785" y1="170" x2="785" y2="970" stroke="#d9e3e9" stroke-width="2" stroke-dasharray="" /></g><desc> 确认丢失后重试：重复的是请求，不必重复副作用 去重键、结果记录与业务写入需要一致提交；换新键重试将表达另一个逻辑请求。</desc></svg>

idth="42" height="48" fill="#2479b3" stroke="#dce6ed" stroke-width="2"/><rect x="675" y="515" width="42" height="48" fill="#2479b3" stroke="#dce6ed" stroke-width="2"/><rect x="725" y="515" width="42" height="48" fill="#2479b3" stroke="#dce6ed" stroke-width="2"/><text x="630" y="620" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">目录遍历计入 0 块</text><text x="630" y="665" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">文件仍占 6 块</text><text x="1040" y="180" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="600">③ 最后引用释放</text><text x="1040" y="245" font-size="27" fill="#748e9f" text-anchor="middle" font-weight="400">目录中已无此名</text><path d="M985 275L1095 310" fill="none" stroke="#748e9f" stroke-width="2"/><path d="M1095 275L985 310" fill="none" stroke="#748e9f" stroke-width="2"/><rect x="920" y="350" width="240" height="65" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="1040" y="394" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">对象可回收</text><text x="1040" y="470" font-size="27" fill="#748e9f" text-anchor="middle" font-weight="400">打开引用归零</text><rect x="885" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><rect x="935" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><rect x="985" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><rect x="1035" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><rect x="1085" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><rect x="1135" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2"/><text x="1040" y="620" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">目录遍历计入 0 块</text><text x="1040" y="665" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">这 6 块可供复用</text><text x="640" y="705" font-size="25" fill="#748e9f" text-anchor="middle">每格代表一个已分
<svg xmlns="http://www.w3.org/2000/svg" width="1165.867" height="600.152" viewBox="38.400 29.848 1165.867 600.152" role="img" aria-labelledby="title desc"><title id="title">删除名称后，打开的日志仍能占块并继续增长</title><desc id="desc">删除名称后，打开的日志仍能占块并继续增长 </desc><rect width="1165.867" height="600.152" fill="white" x="38.4" y="29.848" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747" transform="translate(0,-100)"><text x="220" y="180" font-size="29" fill="#203747" text-anchor="middle" font-weight="600">① 名称仍在，已打开</text><text x="220" y="245" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">trace.log</text><path d="M220 260L220 330" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><rect x="100" y="350" width="240" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="220" y="394" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">同一个文件对象</text><text x="220" y="485" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">进程的打开引用仍在</text><path d="M220 443L220 415" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><rect x="65" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="115" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="165" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="215" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="265" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="315" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><text x="220" y="620" font-size="26" fill="#203747" text-anchor="middle" font-weight="400">目录遍历计入 4 块</text><text x="220" y="665" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">文件仍占 4 块</text><text x="630" y="180" font-size="29" fill="#203747" text-anchor="middle" font-weight="600">② unlink 后继续写入</text><text x="630" y="245" font-size="27" fill="#728694" text-anchor="middle" font-weight="400">目录中已无此名</text><path d="M575 275L685 310" fill="none" stroke="#728694" stroke-width="2" /><path d="M685 275L575 310" fill="none" stroke="#728694" stroke-width="2" /><rect x="510" y="350" width="240" height="65" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="630" y="394" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">同一个文件对象</text><text x="630" y="485" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">进程的打开引用仍在</text><path d="M630 443L630 415" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><rect x="475" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="525" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="575" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="625" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="675" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><rect x="725" y="515" width="42" height="48" fill="#286da2" stroke="#dce6ed" stroke-width="2" /><text x="630" y="620" font-size="26" fill="#203747" text-anchor="middle" font-weight="400">目录遍历计入 0 块</text><text x="630" y="665" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">文件仍占 6 块</text><text x="1040" y="180" font-size="29" fill="#203747" text-anchor="middle" font-weight="600">③ 最后引用释放</text><text x="1040" y="245" font-size="27" fill="#728694" text-anchor="middle" font-weight="400">目录中已无此名</text><path d="M985 275L1095 310" fill="none" stroke="#728694" stroke-width="2" /><path d="M1095 275L985 310" fill="none" stroke="#728694" stroke-width="2" /><rect x="920" y="350" width="240" height="65" fill="#f5f7f9" stroke="none" stroke-width="2" /><text x="1040" y="394" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">对象可回收</text><text x="1040" y="470" font-size="27" fill="#728694" text-anchor="middle" font-weight="400">打开引用归零</text><rect x="885" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="935" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="985" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="1035" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="1085" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><rect x="1135" y="515" width="42" height="48" fill="white" stroke="#dce6ed" stroke-width="2" /><text x="1040" y="620" font-size="26" fill="#203747" text-anchor="middle" font-weight="400">目录遍历计入 0 块</text><text x="1040" y="665" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">这 6 块可供复用</text><text x="640" y="705" font-size="25" fill="#728694" text-anchor="middle">每格代表一个已分配数据块</text></g></svg>

th="1.6" stroke-linecap="round"/><text x="1217" y="498" fill="#202a37" font-size="24" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">2</text><text x="1015" y="555" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">PSS 合计 8 页</text><line x1="680" y1="84" x2="680" y2="553" stroke="#c7d5da" stroke-width="1.2" stroke-linecap="round"/><text x="678" y="620" fill="#202a37" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">各进程的 PSS 写在对应进程下方。每个 RSS 仍为 5 页。</text><text x="678" y="660" fill="#202a37" font-size="25" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">共享页 A、B、C 与三个私有页保持原映射</text></svg>
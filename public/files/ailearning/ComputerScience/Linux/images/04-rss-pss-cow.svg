<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680" role="img" aria-labelledby="title desc"><title id="title">写时复制只改变 D 的物理页映射</title><desc id="desc">写前 D 由三个进程共享。写后 P1 改映射 D′，P0 和 P2 仍指向原 D。RSS 总和仍为 15，PSS 总和从 7 页增至 8 页。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="680" fill="white" stroke="none" stroke-width="1.55"/><text x="337" y="62" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">写入之前</text><circle cx="137" cy="177" r="35" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="137" y="185.84" fill="#202a37" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">P0</text><line x1="169.3182" y1="203.8241" x2="301.6039" y2="313.6212" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="337" cy="177" r="35" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="337" y="185.84" fill="#202a37" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">P1</text><line x1="337" y1="219" x2="337" y2="297" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="537" cy="177" r="35" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="537" y="185.84" fill="#202a37" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">P2</text><line x1="504.6818" y1="203.8241" x2="372.3961" y2="313.6212" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon point
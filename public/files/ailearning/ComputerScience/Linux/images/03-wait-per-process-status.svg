<view id="textbook-detail-2-2" viewBox="567.600000 249.830000 752.400000 331.170000"/><title id="plate-title">逐个等待才能取得每个作业状态</title><desc id="plate-desc">三个作业结束状态为 0、7、0。父进程逐个等待并保存，不以最后一个状态代表全部。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="581" fill="white" stroke="none" stroke-width="1.6"/><text x="243" y="63" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">各自退出</text><text x="1037" y="63" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">父进程分别记账</text><polygon points="112,199 302,199 347,127 157,127" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="229.5" y="174.9" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">PID 1</text><line x1="365" y1="163" x2="515" y2="163" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="575" y="175" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">0</text><line x1="628" y1="163" x2="806" y2="163" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="829,199 1162,199 1207,127 874,127" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="1018" y="173.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">wait "$pid1" → 0</text><polygon points="112,335 302,335 347,263 157,263" stroke="#a84b3b" fill="url(#wash-coral)" 
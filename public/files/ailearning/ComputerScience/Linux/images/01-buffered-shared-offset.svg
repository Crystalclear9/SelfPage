<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="title desc"><title id="title">只消费了 A，为何复制的句柄下一次却读到 E？</title><desc id="desc">用户缓冲预读ABCD但只交付A，内核共享偏移已为4。dup上的直接读取得E并将偏移变为5，原缓冲仍先交付BCD再从偏移5读取F。pread不移动共享偏移，独立open创建独立游标。</desc><rect width="1200" height="935" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">只消费了 A，为何复制的句柄下一次却读到 E？</text><text x="40" y="102" font-size="26" fill="#627689" text-anchor="start">CPython 二进制缓冲区大小为 4；只读不变的普通文件 ABCDEF。</text><rect x="360" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="407" y="201" font-size="30" fill="#2865a0" text-anchor="middle">A</text><text x="407" y="260" font-size="24" fill="#627689" text-anchor="middle">0</text><rect x="470" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="517" y="201" font-size="30" fill="#2865a0" text-anchor="middle">B</text><text x="517" y="260" font-size="24" fill="#627689" text-anchor="middle">1</text><rect x="580" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="627" y="201" font-size="30" fill="#2865a0" text-anchor="middle">C</text><text x="627" y="260" font-size="24" fill="#627689" text-anchor="middle">2</text><rect x="690" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="737" y="201" font-size="30" fill="#2865a0" text-anchor="middle">D</text><text x="737" y="260" font-size="24" fill="#627689" text-anchor="middle">3</text><rect x="800" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="847" y="201" font-size="30" fill="#2865a0" text-anchor="middle">E</text><text x="847" y="260" font-size="24" fill="#627689" text-anchor="middle">4</text><rect x="910" y="155" width="94" height="70" fill="#2865a0" opacity="0.12" rx="3"/><text x="957" y="201" font-size="30" fill="#2865a0" text-anchor="middle">F</text><text x="957" y="260" font-size="24" fill="#627689" text-anchor="middle">5</text><text x="40" y="201" font-size="27" fill="#213447" text-anchor="start">文件与字节位置</text><text x="40" y="335" font-size="27" fill="#2865a0" text-anchor="start">① buffered.read(1) → A</text><line x1="350" y1="348" x2="350" y2="405" stroke="#2865a0" stroke-width="3"/><polyline points="344.7263190753538,395.3465918192059 350,405 355.2736809246462,395.3465918192059" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="390" y="308" width="375" height="80" fill="#2865a0" opacity="0.1" rx="3"/><text x="577" y="343" font-size="26" fill="#2865a0" text-anchor="middle">内部已预读 ABCD</text><text x="577" y="377" font-size="25" fill="#2865a0" text-anchor="middle">未消费 BCD 留在私有缓存</text><text x="805" y="341" font-size="26" fill="#213447" text-anchor="start">内核共享偏移 = 4</text><text x="805" y="381" font-size="26" fill="#213447" text-anchor="start">缓冲逻辑位置 = 1</text><line x1="40" y1="438" x2="1160" y2="438" stroke="#dce5ed" stroke-width="2"/><text x="40" y="500" font-size="27" fill="#c87536" text-anchor="start">② dup 句柄直接读 1 字节 → E</text><line x1="610" y1="492" x2="788" y2="492" stroke="#c87536" stroke-width="3"/><polyline points="778.3465918192059,497.2736809246462 788,492 778.3465918192059,486.7263190753538" fill="none" stroke="#c87536" stroke-width="3"/><text x="815" y="501" font-size="26" fill="#c87536" text-anchor="start">共享偏移：4 → 5</text><rect x="390" y="535" width="375" height="65" fill="#2865a0" opacity="0.1" rx="3"/><text x="577" y="578" font-size="26" fill="#2865a0" text-anchor="middle">私有缓存仍保留 BCD</text><line x1="40" y1="640" x2="1160" y2="640" stroke="#dce5ed" stroke-width="2"/><text x="40" y="699" font-size="27" fill="#2865a0" text-anchor="start">③ 原缓冲读取 → BCD，再读 → F</text><text x="40" y="752" font-size="26" fill="#213447" text-anchor="start">观察顺序 A → E → BCD → F：私有缓存不会因 dup 读取而自动同步。</text><line x1="40" y1="789" x2="1160" y2="789" stroke="#dce5ed" stroke-width="2"/><text x="40" y="841" font-size="25" fill="#213447" text-anchor="start">对照：pread(fd, 1, 5) 返回 F，但不移动共享偏移；重新 open 则各有游标。</text><text x="40" y="891" font-size="25" fill="#627689" text-anchor="start">已消费位置、预读边界和内核偏移是不同状态；图中位置均从 0 开始。</text></g></svg>
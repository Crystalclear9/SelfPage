<text x="77" y="481" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">带引号时保留 3 项：第一项的空格、空串和字面 *.txt。</text>
<text x="77" y="526" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">不带引号时空格拆分、空项消失，模式匹配当前目录的两个文件。</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="956.0867" viewBox="0 0 1440 956.0867" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">带空格的参数必须保留原有边界</title><rect width="1440" height="956.0867" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">带空格的参数必须保留原有边界</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="814.0867" viewBox="18.75 71.25 1442.5 873.75" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1442.5" height="873.75" fill="white" x="18.75" y="71.25"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">Bash 默认分词，IFS 为默认空白；当前目录只有 one.txt、two.txt</text><text xml:space="preserve" x="50" y="240" font-size="31" fill="#1f3348" text-anchor="start" font-weight="400">原位置参数</text><text xml:space="preserve" x="530" y="185" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="210" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="535" y="260" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">alpha beta</text><text xml:space="preserve" x="790" y="185" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="210" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="795" y="260" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">空串</text><text xml:space="preserve" x="1050" y="185" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="210" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="1055" y="260" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">*.txt</text><text xml:space="preserve" x="50" y="500" font-size="31" fill="#2181bf" text-anchor="start" font-weight="400">传给程序："$@"</text><text xml:space="preserve" x="530" y="445" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="470" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="535" y="520" font-size="30" fill="#2181bf" text-anchor="middle" font-weight="400">alpha beta</text><text xml:space="preserve" x="790" y="445" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="470" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="795" y="520" font-size="30" fill="#2181bf" text-anchor="middle" font-weight="400">空串</text><text xml:space="preserve" x="1050" y="445" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="470" width="230" height="78" rx="0" fill="url(#book-wash-edf5fa)" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="1055" y="520" font-size="30" fill="#2181bf" text-anchor="middle" font-weight="400">*.txt</text><text xml:space="preserve" x="50" y="790" font-size="31" fill="#bf6a27" text-anchor="start" font-weight="400">传给程序：$@</text><text xml:space="preserve" x="530" y="735" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="535" y="810" font-size="30" fill="#bf6a27" text-anchor="middle" font-weight="400">alpha</text><text xml:space="preserve" x="790" y="735" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="795" y="810" font-size="30" fill="#bf6a27" text-anchor="middle" font-weight="400">beta</text><text xml:space="preserve" x="1050" y="735" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="1055" y="810" font-size="30" fill="#bf6a27" text-anchor="middle" font-weight="400">one.txt</text><text xml:space="preserve" x="1310" y="735" font-size="27" fill="#1f3348" text-anchor="middle" font-weight="400">参数 4</text><rect x="1200" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#9fbdcf" stroke-width="2"/><text xml:space="preserve" x="1315" y="810" font-size="30" fill="#bf6a27" text-anchor="middle" font-weight="400">two.txt</text><text xml:space="preserve" x="420" y="370" font-size="28" fill="#2181bf" text-anchor="start" font-weight="400">三项原样保留：空格在第一项内部，第二项长度为 0。</text><text xml:space="preserve" x="420" y="630" font-size="28" fill="#2181bf" text-anchor="start" font-weight="400">仍是三个参数；字面 *.txt 没有匹配目录。</text><text xml:space="preserve" x="420" y="910" font-size="28" fill="#bf6a27" text-anchor="start" font-weight="400">空格拆成两项；空串消失；模式展开成两个文件名。</text></g><desc> 参数边界：空串和星号也是需要保留的输入 框表示 argv 的元素边界；“空串”是解释标签，不是传入的两个汉字。</desc></svg></svg>

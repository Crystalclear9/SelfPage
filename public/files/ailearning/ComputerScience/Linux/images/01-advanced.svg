<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">参数边界：空串和星号也是需要保留的输入</text><text xml:space="preserve" x="50" y="125" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">Bash 默认分词，IFS 为默认空白；当前目录只有 one.txt、two.txt</text><text xml:space="preserve" x="50" y="240" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">原位置参数</text><text xml:space="preserve" x="530" y="185" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="210" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="535" y="260" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">alpha beta</text><text xml:space="preserve" x="790" y="185" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="210" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="795" y="260" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">空串</text><text xml:space="preserve" x="1050" y="185" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="210" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="1055" y="260" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">*.txt</text><text xml:space="preserve" x="50" y="500" font-size="31" fill="#2676ad" text-anchor="start" font-weight="400">传给程序：&quot;$@&quot;</text><text xml:space="preserve" x="530" y="445" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="470" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="535" y="520" font-size="30" fill="#2676ad" text-anchor="middle" font-weight="400">alpha beta</text><text xml:space="preserve" x="790" y="445" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="470" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="795" y="520" font-size="30" fill="#2676ad" text-anchor="middle" font-weight="400">空串</text><text xml:space="preserve" x="1050" y="445" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="470" width="230" height="78" rx="0" fill="#edf5fa" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="1055" y="520" font-size="30" fill="#2676ad" text-anchor="middle" font-weight="400">*.txt</text><text xml:space="preserve" x="50" y="790" font-size="31" fill="#c46c22" text-anchor="start" font-weight="400">传给程序：$@</text><text xml:space="preserve" x="530" y="735" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 1</text><rect x="420" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="535" y="810" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">alpha</text><text xml:space="preserve" x="790" y="735" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 2</text><rect x="680" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="795" y="810" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">beta</text><text xml:space="preserve" x="1050" y="735" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 3</text><rect x="940" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="1055" y="810" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">one.txt</text><text xml:space="preserve" x="1310" y="735" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">参数 4</text><rect x="1200" y="760" width="230" height="78" rx="0" fill="#fff0df" stroke="#a3bccb" stroke-width="2"/><text xml:space="preserve" x="1315" y="810" font-size="30" fill="#c46c22" text-anchor="middle" font-weight="400">two.txt</text><text xml:space="preserve" x="420" y="370" font-size="28" fill="#2676ad" text-anchor="start" font-weight="400">三项原样保留：空格在第一项内部，第二项长度为 0。</text><text xml:space="preserve" x="420" y="630" font-size="28" fill="#2676ad" text-anchor="start" font-weight="400">仍是三个参数；字面 *.txt 没有匹配目录。</text><text xml:space="preserve" x="420" y="910" font-size="28" fill="#c46c22" text-anchor="start" font-weight="400">空格拆成两项；空串消失；模式展开成两个文件名。</text><text xml:space="preserve" x="50" y="1000" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">框表示 argv 的元素边界；“空串”是解释标签，不是传入的两个汉字。</text></g></svg>
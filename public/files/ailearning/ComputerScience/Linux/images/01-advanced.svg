<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="581.69" viewBox="17.00 14.00 1114.00 540.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">带空格的参数必须保留原有边界</title><desc id="desc">原本有两个参数，其中第一个内部包含空格。图把保留参数边界和错误重新分词后的结果并列：后者变成三个参数，调用方传入的信息结构已经改变。 在 Bash 中传递全部位置参数通常应理解双引号包裹的参数展开语义，而不是把一串文本重新拆分。具体分词和通配行为还取决于展开方式与 shell，不能仅凭显示字符串判断参数数组。 此处比较正确引用参数与未引用的分词；不是 shell 自动重排内容。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">带空格的参数必须保留原有边界</text><text x="65" y="169" font-size="24" fill="#627689" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="511.0" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">参数 1：a b</text><rect x="590.0" y="190" width="511.0" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="603" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">参数 2：c</text><text x="65" y="340" font-size="24" fill="#213447" text-anchor="start" font-weight="400">保持边界</text><rect x="285" y="310" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">a b</text><rect x="525" y="310" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">c</text><text x="65" y="465" font-size="24" fill="#213447" text-anchor="start" font-weight="400">失去边界</text><rect x="285" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">a</text><rect x="525" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">b</text><rect x="765" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">c</text></g></svg>

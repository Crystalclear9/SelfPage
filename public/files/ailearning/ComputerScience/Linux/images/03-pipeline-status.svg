<svg xmlns="http://www.w3.org/2000/svg" width="1233.067" height="625.908" viewBox="23.467 53.314 1233.067 625.908"><rect width="1233.067" height="625.908" fill="white" x="23.467" y="53.314" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="102" font-size="27" fill="#203449" text-anchor="start">以下按管道从左到右排列，不表示哪一个进程最早失败。</text><text x="550" y="177" font-size="29" fill="#203449" text-anchor="middle">成员 A</text><text x="760" y="177" font-size="29" fill="#203449" text-anchor="middle">成员 B</text><text x="970" y="177" font-size="29" fill="#203449" text-anchor="middle">成员 C</text><text x="50" y="245" font-size="29" fill="#203449" text-anchor="start">案例一</text><text x="550" y="245" font-size="36" fill="#b95a17" text-anchor="middle">7</text><text x="760" y="245" font-size="36" fill="#087e7c" text-anchor="middle">0</text><text x="970" y="245" font-size="36" fill="#087e7c" text-anchor="middle">0</text><text x="240" y="245" font-size="26" fill="#203449" text-anchor="start">默认 0；pipefail 7</text><text x="50" y="350" font-size="29" fill="#203449" text-anchor="start">案例二</text><text x="550" y="350" font-size="36" fill="#b95a17" text-anchor="middle">7</text><text x="760" y="350" font-size="36" fill="#087e7c" text-anchor="middle">0</text><text x="970" y="350" font-size="36" fill="#b95a17" text-anchor="middle">3</text><text x="240" y="350" font-size="26" fill="#203449" text-anchor="start">默认 3；pipefail 3</text><path d="M50 411L1230 411" stroke="#c8d6e0" stroke-width="2" /><text x="50" y="467" font-size="28" fill="#203449" text-anchor="start">案例二结束后，立即一次性保存：</text><text x="75" y="523" font-size="30" fill="#247bb5" text-anchor="start">states=("$?" "${PIPESTATUS[@]}")</text><text x="790" y="523" font-size="31" fill="#247bb5" text-anchor="start">→  [3, 7, 0, 3]</text><text x="50" y="600" font-size="27" fill="#b95a17" text-anchor="start">若先运行成功的 printf 再查看，当前 PIPESTATUS 已变为 [0]。</text><path d="M50 652L1230 652" stroke="#c8d6e0" stroke-width="2" /></g><desc> pipefail 保留一个汇总值，PIPESTATUS 才保留各成员结果 立即快照后使用 states；后续命令改变的是当前状态，不会改写已保存的数组。</desc></svg>

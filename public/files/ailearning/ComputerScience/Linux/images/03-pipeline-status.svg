x="730" y="380" font-size="30" fill="#20354a" text-anchor="middle">B</text><text x="730" y="423" font-size="30" fill="#1672a0" text-anchor="middle">0</text><line x1="825" y1="390" x2="915" y2="390" stroke="#818fa4" stroke-width="3" marker-end="url(#g)"/><rect x="930" y="335" width="180" height="110" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2" rx="4"/><text x="1020" y="380" font-size="30" fill="#20354a" text-anchor="middle">C</text><text x="1020" y="423" font-size="30" fill="#d37537" text-anchor="middle">3</text><text x="350" y="505" font-size="30" fill="#20354a" text-anchor="start">PIPESTATUS = [7, 0, 3]</text><text x="350" y="570" font-size="30" fill="#1672a0" text-anchor="start">默认 $? = 3</text><text x="880" y="570" font-size="30" fill="#d37537" text-anchor="start">pipefail：最右非零 = 3</text><line x1="50" y1="650" x2="1470" y2="650" stroke="#818fa4" stroke-width="2"/><text x="50" y="725" font-size="32" fill="#1e9195" text-anchor="start">立即保存</text><text x="350" y="725" font-size="31" fill="#20354a" text-anchor="start">states=("$?" "${PIPESTATUS[@]}")</text><text x="350" y="795" font-size="31" fill="#1e9195" text-anchor="start">第二条管道 + pipefail → [3, 7, 0, 3]</text><line x1="750" y1="820" x2="750" y2="880" stroke="#1e9195" stroke-width="3" marker-end="url(#t)"/><text x="50" y="935" font-size="32" fill="#20354a" text-anchor="start">然后再打印</text><text x="350" y="925" font-size="30" fill="#20354a" text-anchor="start">printf 成功后：$? = 0，PIPESTATUS = [0]</text><text x="350" y="990" font-size="30" fill="#1e9195" text-anchor="start">原来的管道状态只能从 states 快照读取</text></g></svg></svg>

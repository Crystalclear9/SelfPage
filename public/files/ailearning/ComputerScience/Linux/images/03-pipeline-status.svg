<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1070" viewBox="0 0 1520 1070" role="img"><title>Bash 管道成员状态与聚合状态的保存</title><rect width="1520" height="1070" fill="white"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="75" font-size="29" fill="#203b4a" text-anchor="start">成员实际退出状态</text><rect x="350" y="35" width="180" height="110" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="440" y="80" font-size="30" fill="#203b4a" text-anchor="middle">A</text><text x="440" y="123" font-size="30" fill="#d87332" text-anchor="middle">7</text><line x1="535" y1="90" x2="625" y2="90" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><rect x="640" y="35" width="180" height="110" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="730" y="80" font-size="30" fill="#203b4a" text-anchor="middle">B</text><text x="730" y="123" font-size="30" fill="#176b91" text-anchor="middle">0</text><line x1="825" y1="90" x2="915" y2="90" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><rect x="930" y="35" width="180" height="110" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="1020" y="80" font-size="30" fill="#203b4a" text-anchor="middle">C</text><text x="1020" y="123" font-size="30" fill="#176b91" text-anchor="middle">0</text><text x="350" y="205" font-size="30" fill="#203b4a" text-anchor="start">PIPESTATUS = [7, 0, 0]</text><text x="350" y="270" font-size="30" fill="#176b91" text-anchor="start">默认 $? = 0</text><text x="880" y="270" font-size="30" fill="#d87332" text-anchor="start">pipefail：最右非零 = 7</text><text x="40" y="375" font-size="29" fill="#203b4a" text-anchor="start">成员实际退出状态</text><rect x="350" y="335" width="180" height="110" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="440" y="380" font-size="30" fill="#203b4a" text-anchor="middle">A</text><text x="440" y="423" font-size="30" fill="#d87332" text-anchor="middle">7</text><line x1="535" y1="390" x2="625" y2="390" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><rect x="640" y="335" width="180" height="110" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="730" y="380" font-size="30" fill="#203b4a" text-anchor="middle">B</text><text x="730" y="423" font-size="30" fill="#176b91" text-anchor="middle">0</text><line x1="825" y1="390" x2="915" y2="390" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><rect x="930" y="335" width="180" height="110" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1020" y="380" font-size="30" fill="#203b4a" text-anchor="middle">C</text><text x="1020" y="423" font-size="30" fill="#d87332" text-anchor="middle">3</text><text x="350" y="505" font-size="30" fill="#203b4a" text-anchor="start">PIPESTATUS = [7, 0, 3]</text><text x="350" y="570" font-size="30" fill="#176b91" text-anchor="start">默认 $? = 3</text><text x="880" y="570" font-size="30" fill="#d87332" text-anchor="start">pipefail：最右非零 = 3</text><line x1="50" y1="650" x2="1470" y2="650" stroke="#80929d" stroke-width="2"/><text x="50" y="725" font-size="32" fill="#218579" text-anchor="start">立即保存</text><text x="350" y="725" font-size="31" fill="#203b4a" text-anchor="start">states=(&quot;$?&quot; &quot;${PIPESTATUS[@]}&quot;)</text><text x="350" y="795" font-size="31" fill="#218579" text-anchor="start">第二条管道 + pipefail → [3, 7, 0, 3]</text><line x1="750" y1="820" x2="750" y2="880" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><text x="50" y="935" font-size="32" fill="#203b4a" text-anchor="start">然后再打印</text><text x="350" y="925" font-size="30" fill="#203b4a" text-anchor="start">printf 成功后：$? = 0，PIPESTATUS = [0]</text><text x="350" y="990" font-size="30" fill="#218579" text-anchor="start">原来的管道状态只能从 states 快照读取</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="433.64" viewBox="-16.00 20.59 1085.53 392.28" role="img"><title id="detail-title">机制展开：上方顺序列出写入、同步文件、重命名和同步目录，下方颜色切换标出路径发布的可见性边界</title><desc id="detail-desc">上方顺序列出写入、同步文件、重命名和同步目录，下方颜色切换标出路径发布的可见性边界。读者看到新文件与系统崩溃后仍能恢复它是两个不同要求，具体保证取决于文件系统和存储栈。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><circle cx="70" cy="110" r="12" fill="#2865a0" stroke="white" stroke-width="2" /><text x="70" y="65" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">写临时文件</text><circle cx="360" cy="110" r="12" fill="#2865a0" stroke="white" stroke-width="2" /><text x="360" y="65" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">同步文件内容</text><circle cx="650" cy="110" r="12" fill="#2865a0" stroke="white" stroke-width="2" /><text x="650" y="65" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">rename 发布</text><circle cx="940" cy="110" r="12" fill="#2865a0" stroke="white" stroke-width="2" /><text x="940" y="65" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">同步目录</text><path d="M86,110 L340,110" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M376,110 L630,110" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M666,110 L920,110" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="25" y="205" font-size="25" fill="#213447" font-weight="400" text-anchor="start">路径可见性</text><line x1="220" y1="250" x2="650" y2="250" stroke="#2865a0" stroke-width="9" /><line x1="650" y1="250" x2="1040" y2="250" stroke="#cf7432" stroke-width="9" /><text x="330" y="290" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">旧对象</text><text x="820" y="290" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">新对象</text><line x1="650" y1="130" x2="650" y2="310" stroke="#cf7432" stroke-width="2" stroke-dasharray="5 5" /><text x="25" y="375" font-size="25" fill="#213447" font-weight="400" text-anchor="start">崩溃持久性：另需满足文件系统、同步调用与存储设备的保证</text></g></svg>

<text x="924" y="437.2" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">已知名字时可继续检查文件</text>
<text x="77" y="567" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">图只讨论传统权限位及普通非特权进程。</text>

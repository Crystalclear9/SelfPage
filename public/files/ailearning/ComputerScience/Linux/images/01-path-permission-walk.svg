<svg xmlns="http://www.w3.org/2000/svg" width="1212.800" height="658.494" viewBox="8.533 61.901 1212.800 658.494" role="img" aria-labelledby="title desc"><title id="title">知道文件名，仍须逐级通过目录的搜索权限</title><desc id="desc">知道文件名，仍须逐级通过目录的搜索权限 知道文件名，仍须逐级通过目录的搜索权限 EACCES</desc><rect width="1212.8" height="658.494" fill="white" x="8.533" y="61.901" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="40" y="110" font-size="27" fill="#203747" text-anchor="start" font-weight="400">普通非特权进程；只讨论传统权限位，父目录均允许搜索</text><text x="130" y="205" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">/</text><rect x="35" y="230" width="190" height="60" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="130" y="271" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">目录 x</text><text x="435" y="205" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">project</text><rect x="340" y="230" width="190" height="60" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="435" y="271" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">目录 x</text><text x="770" y="205" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">data</text><rect x="675" y="230" width="190" height="60" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="770" y="271" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">目录 x</text><text x="1100" y="205" font-size="31" fill="#203747" text-anchor="middle" font-weight="400">sample.txt</text><rect x="1005" y="230" width="190" height="60" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="1100" y="271" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">文件 r</text><path d="M235 255L325 255" fill="none" stroke="#728694" stroke-width="3" marker-end="url(#arrow)" /><path d="M540 255L660 255" fill="none" stroke="#728694" stroke-width="3" marker-end="url(#arrow)" /><path d="M875 255L990 255" fill="none" stroke="#728694" stroke-width="3" marker-end="url(#arrow)" /><text x="40" y="355" font-size="28" fill="#203747" text-anchor="start" font-weight="600">data 的权限</text><text x="50" y="420" font-size="29" fill="#c96e32" text-anchor="start" font-weight="600">r–：可列名称，不能搜索</text><path d="M690 410L965 410" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><text x="50" y="470" font-size="28" fill="#203747" text-anchor="start" font-weight="400">查找 sample.txt 时被拒绝，即使文件自身允许读</text><text x="50" y="565" font-size="29" fill="#286da2" text-anchor="start" font-weight="600">–x：可搜索，不能列名称</text><path d="M690 555L1170 555" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><text x="50" y="615" font-size="28" fill="#203747" text-anchor="start" font-weight="400">已知完整文件名时，可继续检查文件 r 并打开</text><text x="40" y="690" font-size="27" fill="#203747" text-anchor="start" font-weight="400">目录 r 用于读取名称列表；目录 x 用于通过名称查找对象，两者不是替代关系</text><path d="M985 385L985 435" stroke="#c96e32" stroke-width="6" /><text x="1020" y="420" font-size="28" fill="#c96e32">EACCES</text></g></svg>

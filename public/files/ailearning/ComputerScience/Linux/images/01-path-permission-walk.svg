<text x="77" y="212" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">前面的父目录允许搜索；sample.txt 本身允许读。</text>

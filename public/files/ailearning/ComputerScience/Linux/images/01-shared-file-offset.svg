<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1121.21" viewBox="0 0 1440 1121.21" role="img"><title>复制描述符共享游标，重新打开可有独立游标</title><svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1440" height="671.209" viewBox="15.000 61.000 1092.000 509.000" role="img"><title id="figure-title">复制描述符共享游标，重新打开可有独立游标</title><desc id="figure-desc">假定普通文件内容为四个单字节字符 ABCD，先 open 得到 fd 3，再通过 dup 得到 fd 4，它们引用同一打开文件描述 L。从 fd 3 读两字节得到 AB，L 的偏移变为 2；再从 fd 4 读一字节得到 C，偏移继续变为 3。对同一路径另一次 open 得到 fd 5，通常对应独立打开状态 M，其偏移仍为 0。这里不涉及并发读写或追加模式；文件内容身份与打开状态身份是不同层次。 复制描述符共享游标，重新打开可有独立游标</desc><rect width="1092.0" height="509.0" fill="white" x="15.0" y="61.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="110" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">同一路径的文件内容：A B C D</text><rect x="40" y="185" width="280" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="180.0" y="229.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">fd 3：首次 open</text><rect x="40" y="315" width="280" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="180.0" y="359.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">fd 4：dup(fd 3)</text><rect x="40" y="475" width="280" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="180.0" y="519.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">fd 5：再次 open</text><rect x="535" y="225" width="295" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="682.5" y="274.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">共享打开状态 L</text><rect x="535" y="465" width="295" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="682.5" y="514.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">独立打开状态 M</text><path d="M340 220 L515 250" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M340 350 L515 280" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M340 510 L515 505" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="890" y="190" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">fd 3 读 AB</text><text x="890" y="240" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">偏移：0 → 2</text><text x="890" y="310" font-size="27" fill="#c87536" text-anchor="start" font-weight="400">fd 4 再读 C</text><text x="890" y="360" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">偏移：2 → 3</text><text x="890" y="500" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">M 的偏移仍为 0</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 671.209) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">管道 EOF 由所有写端的关闭决定：子进程退出并不总是充分</text><rect x="65" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="276.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">父进程：仍持有写端</text><rect x="495" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="706.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">子进程：写完并退出</text><rect x="925" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1136.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">读者：缓冲读空</text><text x="65" y="275" font-size="30" fill="#c96937" text-anchor="start">父写端未关 → 还可能有后续数据，读取可继续阻塞</text><text x="65" y="345" font-size="30" fill="#216c89" text-anchor="start">所有写端均关闭且缓冲已空 → 下一次 read 返回 EOF</text><text x="65" y="419" font-size="27" fill="#203742" text-anchor="start">复制描述符会增加同一管道端的引用；不用的端点应在各进程中及时关闭。</text></g></g></svg>

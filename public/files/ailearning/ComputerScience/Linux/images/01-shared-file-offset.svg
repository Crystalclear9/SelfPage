<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="717" viewBox="0 0 1200 717" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 408.690000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 408.690000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 308.310000 684.000000 408.690000"/>

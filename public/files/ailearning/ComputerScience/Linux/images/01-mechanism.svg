<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title id="figure-title">重定向顺序：逐项跟踪两个描述符的最终目标</title><desc id="figure-desc">两种重定向按从左到右处理；先打开out再复制fd1会使两流同去out，先复制fd1再改变fd1会使fd2保留原目标。</desc><rect width="1200" height="700" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">重定向顺序：逐项跟踪两个描述符的最终目标</text><text x="40" y="110" font-size="28" fill="#213447" text-anchor="start" font-weight="400">初始 fd 1、fd 2 均指向原标准输出目标 T</text><text x="40" y="210" font-size="30" fill="#213447" text-anchor="start" font-weight="600">命令 &gt;out 2&gt;&amp;1</text><rect x="490" y="175" width="165" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="572.5" y="214.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">fd 1</text><rect x="490" y="270" width="165" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="572.5" y="309.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">fd 2</text><rect x="880" y="175" width="220" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="990.0" y="214.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">out</text><rect x="880" y="270" width="220" height="60" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="990.0" y="309.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">out</text><path d="M680 205 L855 205" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M680 300 L855 300" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="300" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">两条流进入 out</text><text x="40" y="450" font-size="30" fill="#213447" text-anchor="start" font-weight="600">命令 2&gt;&amp;1 &gt;out</text><rect x="490" y="415" width="165" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="572.5" y="454.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">fd 1</text><rect x="490" y="510" width="165" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="572.5" y="549.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">fd 2</text><rect x="880" y="415" width="220" height="60" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="990.0" y="454.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">out</text><rect x="880" y="510" width="220" height="60" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="990.0" y="549.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">T</text><path d="M680 445 L855 445" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M680 540 L855 540" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="540" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">stderr 仍去 T</text><text x="40" y="650" font-size="28" fill="#213447" text-anchor="start" font-weight="400">按从左到右应用重定向；2&gt;&amp;1 复制的是当时 fd 1 的目标。</text></g></svg>

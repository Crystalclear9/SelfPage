<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">重定向顺序决定标准错误最后去向</title><desc id="desc">第一条先把 stdout 指向文件，再把 stderr 复制到当前 stdout，因此两流都进文件。第二条先让 stderr 引用原 stdout，随后只改变 stdout，已经复制的 stderr 去向不随之改动。 这是一张按从左到右求值的说明图，不表示进程运行中两条流的严格时间顺序。描述符复制保存的是当时指向的打开文件对象关系，而不是一个会跟随修改的符号链接。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">重定向顺序决定标准错误最后去向</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">2&gt;&amp;1 复制当时的描述符目标，而非建立随 stdout 变化的绑定。</text><path d="M335,225 L450,225" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,225 L850,225" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,505 L450,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,505 L850,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="170" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="233" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">命令 &gt;out 2&gt;&amp;1</text><rect x="50" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">命令 2&gt;&amp;1 &gt;out</text><rect x="450" y="170" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="233" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">stdout → 文件 out</text><rect x="450" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">stderr → 原 stdout</text><rect x="850" y="170" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="233" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">第一种：两流进 out</text><rect x="850" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">第二种：两流分开</text></g></svg>

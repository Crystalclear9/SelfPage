<svg xmlns="http://www.w3.org/2000/svg" width="1159.000" height="570.000" viewBox="21.000 0.000 1159.000 570.000" role="img" aria-labelledby="title desc"><title id="title">重定向复制当时的目标，不建立动态跟随</title><desc id="desc">&gt;out 2&gt;&amp;1的两个描述符汇入同一打开输出；2&gt;&amp;1 &gt;out让fd2保留原输出T、fd1改到out。按从左到右处理。 </desc><rect width="1159.0" height="570.0" fill="white" x="21.0" y="0.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="45" y="45" fill="#23384b" font-size="28" text-anchor="start" font-weight="400">初态：fd 1、fd 2 都连接原输出 T；重定向从左到右执行</text><text x="50" y="110" fill="#23384b" font-size="31" text-anchor="start" font-weight="600">&gt;out 2&gt;&amp;1</text><text x="650" y="110" fill="#23384b" font-size="31" text-anchor="start" font-weight="600">2&gt;&amp;1 &gt;out</text><rect x="100" y="173" width="115" height="60" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="157" y="213" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">fd 1</text><rect x="100" y="313" width="115" height="60" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="157" y="353" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">fd 2</text><rect x="700" y="173" width="115" height="60" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="757" y="213" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">fd 1</text><rect x="700" y="313" width="115" height="60" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="757" y="353" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">fd 2</text><rect x="390" y="235" width="165" height="85" fill="#fff2e7" stroke="#c66e30" stroke-width="1.5" rx="3" /><text x="472" y="287" fill="#c66e30" font-size="33" text-anchor="middle" font-weight="400">out</text><line x1="215" y1="205" x2="385" y2="261" stroke="#24679c" stroke-width="3" marker-end="url(#b)" /><line x1="215" y1="345" x2="385" y2="294" stroke="#c66e30" stroke-width="3" marker-end="url(#o)" /><text x="75" y="430" fill="#24679c" font-size="27" text-anchor="start" font-weight="400">① fd 1 → out</text><text x="75" y="475" fill="#c66e30" font-size="27" text-anchor="start" font-weight="400">② fd 2 复制 fd 1 的目标</text><rect x="990" y="170" width="165" height="80" fill="#fff2e7" stroke="#c66e30" stroke-width="1.5" rx="3" /><text x="1072" y="221" fill="#c66e30" font-size="33" text-anchor="middle" font-weight="400">out</text><rect x="990" y="310" width="165" height="80" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="1072" y="361" fill="#24679c" font-size="33" text-anchor="middle" font-weight="400">T</text><line x1="815" y1="205" x2="985" y2="210" stroke="#24679c" stroke-width="3" marker-end="url(#b)" /><line x1="815" y1="345" x2="985" y2="350" stroke="#c66e30" stroke-width="3" marker-end="url(#o)" /><text x="675" y="430" fill="#c66e30" font-size="27" text-anchor="start" font-weight="400">① fd 2 → 当时的 T</text><text x="675" y="475" fill="#24679c" font-size="27" text-anchor="start" font-weight="400">② 只有 fd 1 改到 out</text><text x="45" y="545" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">2&gt;&amp;1 复制连接；之后改变 fd 1，不会让 fd 2 自动改向。</text></g></svg>

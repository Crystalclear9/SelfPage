<text x="657" y="445" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">标准输出去 out，标准错误仍去终端。</text>
<path d="M75 492 L1125 492" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="547" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">2&gt;&amp;1 复制的是此刻 fd 1 的指向，后续重定向不会让它自动改指。</text>

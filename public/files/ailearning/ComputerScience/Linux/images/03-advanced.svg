<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1027.1064" viewBox="0 0 1440 1027.1064" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">清理只能删除当前任务确实拥有的资源</title><rect width="1440" height="1027.1064" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">清理只能删除当前任务确实拥有的资源</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="885.1064" viewBox="20 70 1233.75 812.5" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1233.75" height="812.5" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">同一目录含本任务临时文件、其他任务临时文件和已发布结果</text><text xml:space="preserve" x="70" y="250" font-size="32" fill="#1f3348" text-anchor="start" font-weight="400">共享父目录</text><line x1="170" y1="285" x2="170" y2="750" stroke="#97b6c9" stroke-width="4" stroke-dasharray=""/><line x1="170" y1="350" x2="320" y2="350" stroke="#97b6c9" stroke-width="3" stroke-dasharray=""/><path d="M340,302 L550,302 L590,342 L590,398 L340,398 Z" stroke="#2181bf" stroke-width="3" fill="#f7fafc" stroke-dasharray=""/><text xml:space="preserve" x="460" y="360" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">run-17.tmp</text><text xml:space="preserve" x="660" y="360" font-size="30" fill="#2181bf" text-anchor="start" font-weight="400">本任务创建</text><line x1="170" y1="550" x2="320" y2="550" stroke="#97b6c9" stroke-width="3" stroke-dasharray=""/><path d="M340,502 L550,502 L590,542 L590,598 L340,598 Z" stroke="#bf6a27" stroke-width="3" fill="#f7fafc" stroke-dasharray=""/><text xml:space="preserve" x="460" y="560" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">run-18.tmp</text><text xml:space="preserve" x="660" y="560" font-size="30" fill="#bf6a27" text-anchor="start" font-weight="400">其他任务创建</text><line x1="170" y1="750" x2="320" y2="750" stroke="#97b6c9" stroke-width="3" stroke-dasharray=""/><path d="M340,702 L550,702 L590,742 L590,798 L340,798 Z" stroke="#67889b" stroke-width="3" fill="#f7fafc" stroke-dasharray=""/><text xml:space="preserve" x="460" y="760" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">result</text><text xml:space="preserve" x="660" y="760" font-size="30" fill="#67889b" text-anchor="start" font-weight="400">已发布的共享结果</text><path d="M960,350 L1140,350 L1140,450" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1000" y="285" font-size="28" fill="#2181bf" text-anchor="start" font-weight="400">已记录的确切资源</text><text xml:space="preserve" x="1050" y="510" font-size="28" fill="#2181bf" text-anchor="middle" font-weight="400">允许清理：run-17.tmp</text><path d="M325,300 L300,300 L300,600 L325,600" stroke="#bf6a27" stroke-width="3" fill="none" stroke-dasharray=""/><text xml:space="preserve" x="50" y="845" font-size="29" fill="#bf6a27" text-anchor="start" font-weight="400">宽泛匹配 run-*.tmp 会同时选中 17 与 18：名称模式不证明所有权。</text></g><desc> 清理集合来自资源所有权，不来自名字长得相似 最终结果即使来自本任务，也已进入发布阶段，应按保留协议管理。</desc></svg></svg>

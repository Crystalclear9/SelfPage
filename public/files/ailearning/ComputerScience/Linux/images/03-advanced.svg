<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">清理只能删除当前任务确实拥有的资源</title><desc id="desc">清理协议应记录本任务创建的确切资源，并只把这些资源放入清理集合。用宽泛的文件名模式代替所有权信息，可能把别的任务临时文件或已发布的共享结果也纳入清理。 图是资源归属说明，不执行删除。中断、重试与并发会让目录内容持续变化，任务身份、锁与发布状态需要共同参与判断，单靠文件名前缀并不能普遍证明所有权。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">清理只能删除当前任务确实拥有的资源</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">所有权不能只凭相似文件名推断；只清理任务记录的资源集合。</text><path d="M440,235 L760,235" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,435 L760,635" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,635 L760,635" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="200.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="235" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">当前任务：run-17.tmp</text><rect x="60" y="400.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="435" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">其他任务：run-18.tmp</text><rect x="60" y="600.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="635" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">共享最终结果：result</text><rect x="770" y="200.0" width="365" height="90" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="235" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">清理集合：仅 run-17.tmp</text><rect x="770" y="600.0" width="365" height="90" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="635" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">保留的资源</text></g></svg>

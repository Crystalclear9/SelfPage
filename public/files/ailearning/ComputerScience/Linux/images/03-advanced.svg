<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">清理集合来自资源所有权，不来自名字长得相似</text><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">同一目录含本任务临时文件、其他任务临时文件和已发布结果</text><text xml:space="preserve" x="70" y="250" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">共享父目录</text><line x1="170" y1="285" x2="170" y2="750" stroke="#9bb5c5" stroke-width="4" stroke-dasharray=""/><line x1="170" y1="350" x2="320" y2="350" stroke="#9bb5c5" stroke-width="3" stroke-dasharray=""/><path d="M340,302 L550,302 L590,342 L590,398 L340,398 Z" stroke="#2676ad" stroke-width="3" fill="#f7fafc" stroke-dasharray=""/><text xml:space="preserve" x="460" y="360" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">run-17.tmp</text><text xml:space="preserve" x="660" y="360" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">本任务创建</text><line x1="170" y1="550" x2="320" y2="550" stroke="#9bb5c5" stroke-width="3" stroke-dasharray=""/><path d="M340,502 L550,502 L590,542 L590,598 L340,598 Z" stroke="#c46c22" stroke-width="3" fill="#f7fafc" stroke-dasharray=""/><text xml:space="preserve" x="460" y="560" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">run-18.tmp</text><text xml:space="preserve" x="660" y="560" font-size="30" fill="#c46c22" text-anchor="start" font-weight="400">其他任务创建</text><line x1="170" y1="750" x2="320" y2="750" stroke="#9bb5c5" stroke-width="3" strok
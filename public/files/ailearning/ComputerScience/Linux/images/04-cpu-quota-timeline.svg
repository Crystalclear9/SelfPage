<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img"><title>四线程耗尽两核预算：运行位置与时间预算分开</title><desc>理想化两周期时间线，每周期一百毫秒，四线程各运行五十毫秒耗尽二百毫秒合计预算，随后节流。</desc><rect width="1400" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="54" font-size="34" fill="#23394b" text-anchor="start" font-weight="600">四个线程可以同时跑；持续预算仍只有两个 CPU</text><text x="40" y="106" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">教学模型：cpu.max = 200000 100000；无突发额度、无更紧祖先限制</text><line x1="260.0" y1="158" x2="260.0" y2="490" stroke="#63788a" stroke-width="2"/><text x="260.0" y="146" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">0</text><line x1="515.0" y1="158" x2="515.0" y2="490" stroke="#d3dee6" stroke-width="2" stroke-dasharray="6 6"/><text x="515.0" y="146" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">50</text><line x1="770.0" y1="158" x2="770.0" y2="490" stroke="#63788a" stroke-width="2"/><text x="770.0" y="146" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">100</text><line x1="1025.0" y1="158" x2="1025.0" y2="490" stroke="#d3dee6" stroke-width="2" stroke-dasharray="6 6"/><text x="1025.0" y="146" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">150</text><line x1="1280.0" y1="158" x2="1280.0" y2="490" stroke="#63788a" stroke-width="2"/><text x="1280.0" y="146" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">200</text><text x="1335" y="146" font-size="24" fill="#63788a" text-anchor="start" font-weight="400">ms</text><text x="55" y="216" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">线程 0</text><rect x="260.0" y="184" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="387.5" y="217" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="515.0" y="184" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="642.5" y="217" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><rect x="770.0" y="184" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="897.5" y="217" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="1025.0" y="184" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="1152.5" y="217" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><text x="55" y="290" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">线程 1</text><rect x="260.0" y="258" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="387.5" y="291" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="515.0" y="258" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="642.5" y="291" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><rect x="770.0" y="258" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="897.5" y="291" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="1025.0" y="258" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="1152.5" y="291" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><text x="55" y="364" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">线程 2</text><rect x="260.0" y="332" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="387.5" y="365" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="515.0" y="332" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="642.5" y="365" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><rect x="770.0" y="332" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="897.5" y="365" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="1025.0" y="332" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="1152.5" y="365" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><text x="55" y="438" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">线程 3</text><rect x="260.0" y="406" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="387.5" y="439" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="515.0" y="406" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="642.5" y="439" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><rect x="770.0" y="406" width="255" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="897.5" y="439" font-size="26" fill="white" text-anchor="middle" font-weight="400">执行 50</text><rect x="1025.0" y="406" width="255" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="1152.5" y="439" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">等待预算</text><text x="260" y="530" font-size="28" fill="#2368a2" text-anchor="start" font-weight="400">一个周期：4 × 50 = 200 ms CPU 时间</text><text x="260" y="577" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">同一周期：墙钟只前进 100 ms</text><rect x="40" y="623" width="645" height="158" rx="6" fill="#e8f1f8" stroke="none"/><text x="65" y="662" font-size="28" fill="#2368a2" text-anchor="start" font-weight="600">进程或作业：平均使用 2 个 CPU</text><text x="65" y="708" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">按单核为 100% 的口径：200%</text><text x="65" y="752" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">两个周期累计 CPU 时间：400 ms</text><rect x="710" y="623" width="650" height="158" rx="6" fill="#fff0e4" stroke="none"/><text x="735" y="662" font-size="28" fill="#c56728" text-anchor="start" font-weight="600">32 核主机：该作业贡献 6.25%</text><text x="735" y="708" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">总容量：32 × 200 = 6400 ms</text><text x="735" y="752" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">400 ms 占 6400 ms 的 6.25%</text><text x="40" y="823" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">条带是理想化预算账本；真实调度的片段、抖动和节流计数还须实测。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">进程、父子关系与进程组是不同结构</title><desc id="desc">三个进程可以有不同 PID，却属于同一个进程组。向单个 PID 发信号与按进程组发信号作用范围不同，不能因为父进程退出，就假定所有子进程已经被取消并完成清理。 图展示组成员关系，不用汇入箭头冒充父子边。进程可能建立新会话或组，信号处理也可能被延迟、捕获或忽略；实际收尾需要确认相应进程状态。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">进程、父子关系与进程组是不同结构</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">本例子进程继承同一 PGID；进程组不等于父子树。</text><path d="M440,235 L760,405" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,435 L760,405" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M440,635 L760,405" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="200.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="235" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">父进程 PID 100 / PGID 100</text><rect x="60" y="400.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="435" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">子进程 PID 101 / PGID 100</text><rect x="60" y="600.0" width="380" height="90" fill="#e5edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="635" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">子进程 PID 102 / PGID 100</text><rect x="770" y="370" width="365" height="90" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="405" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">同一个进程组 100</text></g></svg>

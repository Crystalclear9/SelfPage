<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1118.703" viewBox="0 0 1440 1118.703" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">进程、父子关系与进程组是不同结构</title><rect width="1440" height="1118.703" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">进程、父子关系与进程组是不同结构</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg aria-labelledby="figure-title figure-desc" width="1344" height="976.703" viewBox="31 101 1138 827" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">父子关系与信号边界：后代不一定留在同一进程组</title><desc id="figure-desc">100创建101，101创建102与103，102在满足条件时setsid后创建104。当前100、101、103在组100，102、104在组102。向组100发送信号不包含102及104，假定权限与进程存活。 父子关系与信号边界：后代不一定留在同一进程组 102、104 仍是后代，但已不属于原进程组</desc><rect width="1138.0" height="827.0" fill="white" x="31.0" y="101.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="150" font-size="29" fill="#1f3449" text-anchor="start" font-weight="400">创建关系 PPID</text><text x="665" y="150" font-size="29" fill="#1f3449" text-anchor="start" font-weight="400">当前进程组 PGID</text><path d="M250 267 L250 337" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M230 422 L120 507" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M270 422 L450 507" fill="none" stroke="#c57439" stroke-width="2.8" marker-end="url(#arrow-orange)"/><path d="M450 592 L450 657" fill="none" stroke="#c57439" stroke-width="2.8" marker-end="url(#arrow-orange)"/><circle cx="250" cy="225" r="43" fill="#2472b1"/><text x="250" y="236" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="400">100</text><circle cx="250" cy="380" r="43" fill="#2472b1"/><text x="250" y="391" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="400">101</text><circle cx="120" cy="550" r="43" fill="#2472b1"/><text x="120" y="561" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="400">103</text><circle cx="450" cy="550" r="43" fill="#c57439"/><text x="450" y="561" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="400">102</text><circle cx="450" cy="700" r="43" fill="#c57439"/><text x="450" y="711" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="400">104</text><text x="330" y="460" font-size="25" fill="#c57439" text-anchor="start" font-weight="400">102 建立新会话</text><rect x="660" y="215" width="480" height="200" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="900" y="262" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">PGID 100 / SID 100</text><rect x="680" y="305" width="130" height="66" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="745.0" y="348.15" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">100</text><rect x="825" y="305" width="130" height="66" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="890.0" y="348.15" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">101</text><rect x="970" y="305" width="130" height="66" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="1035.0" y="348.15" font-size="29" fill="#2472b1" text-anchor="middle" font-weight="400">103</text><rect x="660" y="505" width="480" height="200" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="900" y="552" font-size="28" fill="#c57439" text-anchor="middle" font-weight="400">PGID 102 / SID 102</text><rect x="680" y="595" width="130" height="66" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="745.0" y="638.15" font-size="29" fill="#c57439" text-anchor="middle" font-weight="400">102</text><rect x="825" y="595" width="130" height="66" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="890.0" y="638.15" font-size="29" fill="#c57439" text-anchor="middle" font-weight="400">104</text><line x1="55" y1="780" x2="1145" y2="780" stroke="#c9dae6" stroke-width="2"/><text x="55" y="840" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">向 PID 100 发送：只选中 100</text><text x="55" y="900" font-size="28" fill="#2472b1" text-anchor="start" font-weight="400">向 PGID 100 发送：选中 100、101、103</text></g></svg></svg>

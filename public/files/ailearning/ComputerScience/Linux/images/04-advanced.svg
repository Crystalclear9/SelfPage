<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1170.000" height="627.000" viewBox="15.000 64.000 1170.000 627.000" role="img"><title id="figure-title">容器内存：把需求、计费量和限制分开</title><desc id="figure-desc">同一cgroup当前计费三点八GB，新增零点四GB需求，合计四点二超过示意四GB边界；需求不等于已驻留量。排查还需区分high节流和max硬限制。 容器内存：把需求、计费量和限制分开</desc><rect width="1170.0" height="627.0" fill="white" x="15.0" y="64.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#213447" text-anchor="start" font-weight="400">十进制 GB 的示意账本；按同一 cgroup 计费范围比较</text><line x1="210" y1="170" x2="210" y2="375" stroke="#cbd9e4" stroke-width="1" /><text x="210" y="160" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="410" y1="170" x2="410" y2="375" stroke="#cbd9e4" stroke-width="1" /><text x="410" y="160" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><line x1="610" y1="170" x2="610" y2="375" stroke="#cbd9e4" stroke-width="1" /><text x="610" y="160" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="810" y1="170" x2="810" y2="375" stroke="#cbd9e4" stroke-width="1" /><text x="810" y="160" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><line x1="1010" y1="170" x2="1010" y2="375" stroke="#cbd9e4" stroke-width="1" /><text x="1010" y="160" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><text x="40" y="245" font-size="28" fill="#213447" text-anchor="start" font-weight="400">需求</text><rect x="210" y="210" width="760" height="70" fill="#2865a0" /><rect x="970.0" y="210" width="80" height="70" fill="#c87536" /><text x="590.0" y="255" font-size="29" fill="white" text-anchor="middle" font-weight="400">当前 3.8</text><text x="970.0" y="325" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">新增 0.4</text><line x1="1010" y1="185" x2="1010" y2="375" stroke="#c87536" stroke-width="2.5" stroke-dasharray="6 5" /><text x="1010" y="420" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">memory.max = 4 GB</text><text x="40" y="480" font-size="28" fill="#213447" text-anchor="start" font-weight="400">需求合计 4.2 GB：越线部分不是已成功驻留的内存。</text><rect x="40" y="530" width="330" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="205.0" y="574.1" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">核对 memory.current</text><path d="M390 565 L445 565" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="465" y="530" width="300" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="615.0" y="574.1" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">结合回收与事件计数</text><path d="M785 565 L840 565" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="860" y="530" width="300" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="574.1" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">再判断压力来源</text><text x="40" y="660" font-size="26" fill="#213447" text-anchor="start" font-weight="400">memory.high：回收与节流；memory.max：硬限制与相应处理。</text></g></svg>

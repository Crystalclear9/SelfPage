<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">容器内存限制可能先于主机容量成为边界</title><desc id="desc">若容器限额为 4 GB，当前用量约 3.8 GB，再申请 0.4 GB 就会产生约 4.2 GB 的需求。即使主机整体还有很多空闲，也不能据此排除容器边界引发的内存压力或失败。 柱高中的 4.2 GB 是申请后需求，不是声称受限容器已成功驻留这么多内存。是否触发回收、拒绝分配或 OOM，取决于具体计费、回收条件和系统配置，应结合相应范围的指标判断。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">容器内存限制可能先于主机容量成为边界</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">内存数字为示意；OOM 还取决于计费口径、回收和容器策略。</text><path d="M140,540 L1100,540" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="547" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M140,462.5 L1100,462.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="469.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1.25</text><path d="M140,385 L1100,385" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="392" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">2.5</text><path d="M140,307.5 L1100,307.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="314.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">3.75</text><path d="M140,230 L1100,230" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="237" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">5</text><text x="80" y="190" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">内存 / GB</text><text x="180" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">当前用量</text><rect x="280.0" y="304.4" width="91" height="235.60000000000002" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="325.5" y="290.4" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">3.8</text><text x="480" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">再申请后的需求</text><rect x="580.0" y="279.59999999999997" width="91" height="260.40000000000003" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="625.5" y="265.6" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">4.2</text><text x="780" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">容器限额</text><rect x="880.0" y="292.0" width="91" height="248.0" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="925.5" y="278" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">4</text><rect x="180" y="635" width="23" height="13" fill="#268d8c" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="651" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">内存 GB</text><text x="140" y="690" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">主机尚有 100 GB 空闲</text><text x="140" y="719" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">额外申请 0.4 GB 仍可能触及容器上限</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">后台作业：完成次序与等待次序是两件事</text><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">示意时长 A=3、B=1、C=2；退出状态分别为 0、7、0</text><text xml:space="preserve" x="50" y="185" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">横轴是教学时间单位，不是 Bash 在本机测得的秒数</text><text xml:space="preserve" x="60" y="345" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">任务 A</text><rect x="260" y="300" width="600" height="75" rx="0" fill="#e7f2fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="280" y="349" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">exit 0</text><circle cx="1070" cy="335" r="30" fill="#f1f5f7" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="1070" y="345" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1130" y="345" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">wait A → 0</text><text xml:space="preserve" x="60" y="515" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">任务 B</text><rect x="260" y="470" width="200" height="75" rx="0" fill="#fff0df" stroke="#c46c22" stroke-width="2"/><text xml:space="preserve" x="280" y="519" font-size="29" fill="#c46c22" text-anchor="start" font-weight="400">exit 7</text><circle cx="1070" cy="505" r="30" fill="#f1f5f7" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="1070" y="515" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1130" y="515" font-size="29" fill="#c46c22" text-anchor="start" font-weight="400">wait B → 7</text><text xml:space="preserve" x="60" y="685" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">任务 C</text><rect x="260" y="640" width="400" height="75" rx="0" fill="#e7f2fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="280" y="689" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">exit 0</text><circle cx="1070" cy="675" r="30" fill="#f1f5f7" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="1070" y="685" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1130" y="685" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">wait C → 0</text><line x1="260" y1="765" x2="920" y2="765" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="260" y1="755" x2="260" y2="775" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="260" y="820" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><line x1="460" y1="755" x2="460" y2="775" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="460" y="820" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><line x1="660" y1="755" x2="660" y2="775" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="660" y="820" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="860" y1="755" x2="860" y2="775" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="860" y="820" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1000" y="230" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">按启动次序等待</text><text xml:space="preserve" x="50" y="890" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">只等最后启动的 C 会得到 0；逐项收集后，整体才能识别 B 的失败。</text></g></svg>
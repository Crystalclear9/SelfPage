<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：三条任务从同一时间开始，B 最先结束但退出码为 7</title><desc id="detail-desc">三条任务从同一时间开始，B 最先结束但退出码为 7。若只等待最后启动的 C，就只看到成功；逐个保存并等待 PID 才能汇总全部任务的状态。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="110" font-size="24" fill="#213447" font-weight="400" text-anchor="start">任务 A</text><rect x="180" y="80" width="600" height="60" rx="3" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="195" y="118" font-size="24" fill="#213447" font-weight="400" text-anchor="start">exit 0</text><text x="820" y="118" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">wait PID_A → 0</text><text x="30" y="210" font-size="24" fill="#213447" font-weight="400" text-anchor="start">任务 B</text><rect x="180" y="180" width="200" height="60" rx="3" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="195" y="218" font-size="24" fill="#213447" font-weight="400" text-anchor="start">exit 7</text><text x="820" y="218" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">wait PID_B → 7</text><text x="30" y="310" font-size="24" fill="#213447" font-weight="400" text-anchor="start">任务 C</text><rect x="180" y="280" width="400" height="60" rx="3" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="195" y="318" font-size="24" fill="#213447" font-weight="400" text-anchor="start">exit 0</text><text x="820" y="318" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">wait PID_C → 0</text><text x="190" y="395" font-size="26" fill="#cf7432" font-weight="600" text-anchor="start">只等最后启动的 C，会漏掉 B 的失败</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">等待顺序和实际完成时间是两个维度</title>
<desc id="fig-desc">示意任务长度三、一、二。按启动顺序等待会先得到 A 的结果，但 B 实际更早结束。</desc>
<rect x="0" y="0" width="1200" height="652" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
<linearGradient id="blue" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1f8"/></linearGradient>
<linearGradient id="ochre" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
<linearGradient id="green" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4e9"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">并行作业的退出状态要逐项保存</text>
<text x="76" y="168" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">任务 A</text>
<rect x="282" y="140" width="726" height="45" fill="#ecf6f6" opacity="1"/>
<path d="M282 185 L1008 185" fill="none" stroke="#166d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1023" y="171" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">exit 0</text>
<text x="76" y="253" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">任务 B</text>
<rect x="282" y="225" width="242" height="45" fill="#fbede8" opacity="1"/>
<path d="M282 270 L524 270" fill="none" stroke="#a74d3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="539" y="256" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">exit 7</text>
<text x="76" y="338" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">任务 C</text>
<rect x="282" y="310" width="484" height="45" fill="#e8e6f2" opacity="1"/>
<path d="M282 355 L766 355" fill="none" stroke="#6e618e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="781" y="341" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">exit 0</text>
<path d="M282 400 L1075 400" fill="none" stroke="#233b4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1075 400 L1064 405 L1064 395 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M282 396 L282 406" fill="none" stroke="#233b4a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="282" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0</text>
<path d="M524 396 L524 406" fill="none" stroke="#233b4a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="524" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">1</text>
<path d="M766 396 L766 406" fill="none" stroke="#233b4a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="766" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">2</text>
<path d="M1008 396 L1008 406" fill="none" stroke="#233b4a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1008" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">3</text>
<text x="76" y="430" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">示意时间</text>
<path d="M75 461 L1125 461" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="505" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">按启动次序 wait：A 返回 0，B 返回 7，C 返回 0。</text>
<text x="76" y="557" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">Bash 不带参数的 wait 等完所有作业后返回 0。</text>
<text x="76" y="608" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">应在每个 wait 之后立即保存状态。</text>
</svg>

<rect x="220" y="288" width="807.309" height="51" fill="#f1f5f6" opacity="1"/>
<path d="M220 339 L1027.309 339" fill="none" stroke="#526976" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

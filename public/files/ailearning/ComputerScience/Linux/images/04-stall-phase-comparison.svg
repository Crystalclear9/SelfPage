<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>相同设备活动比例，不同训练停顿来源</title><desc>两个假设运行都耗时二点二秒，设备执行一百二十毫秒；一个在计算后保存两秒，另一个在计算前等待输入两点零八秒，需阶段事件才能区分。</desc><rect width="1400" height="920" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="54" font-size="34" fill="#23394b" text-anchor="start" font-weight="600">同样只计算 120 ms，停顿却发生在不同位置</text><text x="40" y="104" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">同一批、同一模型；教学轨迹均耗时 2200 ms，非设备实测</text><line x1="255.0" y1="150" x2="255.0" y2="693" stroke="#d3dee6" stroke-width="2" stroke-dasharray="5 5"/><text x="255.0" y="145" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">0</text><line x1="351.0" y1="150" x2="351.0" y2="693" stroke="#d3dee6" stroke-width="2" stroke-dasharray="5 5"/><text x="351.0" y="145" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">200</text><line x1="735.0" y1="150" x2="735.0" y2="693" stroke="#d3dee6" stroke-width="2" stroke-dasharray="5 5"/><text x="735.0" y="145" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">1000</text><line x1="975.0" y1="150" x2="975.0" y2="693" stroke="#d3dee6" stroke-width="2" stroke-dasharray="5 5"/><text x="975.0" y="145" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">1500</text><line x1="1311.0" y1="150" x2="1311.0" y2="693" stroke="#d3dee6" stroke-width="2" stroke-dasharray="5 5"/><text x="1311.0" y="145" font-size="24" fill="#63788a" text-anchor="middle" font-weight="400">2200</text><text x="1350" y="145" font-size="24" fill="#63788a" text-anchor="start" font-weight="400">ms</text><text x="40" y="202" font-size="29" fill="#23394b" text-anchor="start" font-weight="600">A：保存路径</text><text x="40" y="269" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">主机输入</text><text x="40" y="349" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">设备执行</text><text x="40" y="429" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">保存阶段</text><rect x="255.0" y="237" width="38.4" height="48" rx="6" fill="#2368a2" stroke="none"/><line x1="293.4" y1="237" x2="293.4" y2="215" stroke="#2368a2" stroke-width="2"/><text x="308.4" y="225" font-size="25" fill="#2368a2" text-anchor="start" font-weight="400">输入 80</text><rect x="293.4" y="317" width="57.599999999999994" height="48" rx="6" fill="#2368a2" stroke="none"/><text x="366.0" y="350" font-size="25" fill="#2368a2" text-anchor="start" font-weight="400">计算 120</text><rect x="351.0" y="397" width="96.0" height="48" rx="6" fill="#e8f1f8" stroke="none"/><line x1="399.0" y1="445" x2="399.0" y2="470" stroke="#d3dee6" stroke-width="2"/><text x="399.0" y="500" font-size="24" fill="#23394b" text-anchor="middle" font-weight="400">准备 200</text><rect x="447.0" y="397" width="144.0" height="48" rx="6" fill="#fff0e4" stroke="none"/><line x1="519.0" y1="445" x2="519.0" y2="470" stroke="#d3dee6" stroke-width="2"/><text x="519.0" y="535" font-size="24" fill="#23394b" text-anchor="middle" font-weight="400">序列化 300</text><rect x="591.0" y="397" width="720.0" height="48" rx="6" fill="#e8f1f8" stroke="none"/><text x="951.0" y="430" font-size="27" fill="#23394b" text-anchor="middle" font-weight="400">写入并同步 1500</text><text x="40" y="588" font-size="29" fill="#23394b" text-anchor="start" font-weight="600">B：输入路径</text><text x="40" y="633" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">主机输入</text><rect x="255.0" y="603" width="998.4" height="48" rx="6" fill="#fff0e4" stroke="none"/><text x="754.2" y="636" font-size="28" fill="#c56728" text-anchor="middle" font-weight="400">读取与解码等待 2080</text><text x="40" y="710" font-size="27" fill="#23394b" text-anchor="start" font-weight="400">设备执行</text><rect x="1253.4" y="677" width="57.599999999999994" height="48" rx="6" fill="#2368a2" stroke="none"/><line x1="1282.2" y1="725" x2="1282.2" y2="745" stroke="#2368a2" stroke-width="2"/><text x="1282.2" y="780" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">计算 120</text><rect x="40" y="814" width="1320" height="76" rx="6" fill="#e8f1f8" stroke="none"/><text x="65" y="862" font-size="29" fill="#2368a2" text-anchor="start" font-weight="400">两条轨迹的设备活动时长占比相同，阶段顺序与针对性修复完全不同。</text></g></svg>
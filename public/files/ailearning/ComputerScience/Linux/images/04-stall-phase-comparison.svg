<path d="M1029.309 339 L1074 339" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="246" y="246" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">输入 80、计算 120、准备 200、序列化 300、写入并同步 1500</text>
<text x="246" y="373" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">读取与解码等待 2080，最后计算 120</text>
<path d="M75 452 L1125 452" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="77" y="505" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">蓝绿色标出设备计算，两条轨迹都只有 120 ms。</text>
<text x="77" y="550" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">这些是教学时长，阶段分别串行发生。</text>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="604" viewBox="0 0 1330 604" role="img" aria-labelledby="title desc"><title id="title">内存压力要区分匿名页与可回收缓存</title><desc id="desc">已用内存分为进程页、干净文件页和脏文件页。干净缓存可在压力下回收，脏页可能先回写。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="604" fill="white" stroke="none" stroke-width="1.55"/><text x="668" y="70" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">内存压力下分别看三类页</text><polygon points="112.5,206 394.5,206 427.5,126 145.5,126" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="270" y="176.88" fill="#655184" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">匿名进程页</text><line x1="444" y1="166" x2="743" y2="166" stroke="#655184" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="784,206 1151,206 1184,126 817,126" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="984" y="176.88" fill="#655184" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">检查进程工作集</text><polygon points="112.5,343 394.5,343 427.5,263 145.5,263" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="270" y="313.88" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">干净文件页</text><line x1="444" y1="303" x2="743" y2="303" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="784,343 1151,343 1184,263 817,263" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="984" y="313.88" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">可回收缓存</text><polygon points="112.5,480 394.5,480 427.5,400 145.5,400" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="270" y="450.88" fill="#a84b3b" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">脏文件页</text><line x1="444" y1="440" x2="743" y2="440" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-coral)"/><polygon points="784,480 1151,480 1184,400 817,400" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="984" y="450.88" fill="#a84b3b" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">可能先回写</text><text x="665" y="573" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">空闲少需要结合时间序列与回收行为解释</text></svg>
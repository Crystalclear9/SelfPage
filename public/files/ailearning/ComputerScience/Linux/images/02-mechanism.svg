<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="619.05" viewBox="11.00 10.00 1134.00 585.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">环境继承是创建子进程时的一次传递</title><desc id="desc">创建子进程时，环境作为输入传递过去。父进程随后改变自己的环境，不会自动修改已经运行的子进程环境；这有助于区分当前终端设置与实际服务进程真正拿到的输入。 图示默认继承环境，调用方也可以显式构造或过滤子进程环境。共享配置文件、进程间通信等是另外的更新通道，不能与环境继承混为一谈。 这是进程环境的副本继承；子进程创建后不会自动跟随父环境变化。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">环境继承是创建子进程时的一次传递</text><path d="M340,230 L430,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M715,230 L830,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M197.5,285 L197.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M972.5,285 L972.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="55" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="197.5" y="238" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">父进程：MODE=A</text><rect x="430" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="572.5" y="238" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">创建子进程</text><rect x="830" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="238" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">子进程初始 MODE=A</text><rect x="55" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="197.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">父进程改为 MODE=B</text><rect x="830" y="450" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">已存在子进程仍为 A</text></g></svg>

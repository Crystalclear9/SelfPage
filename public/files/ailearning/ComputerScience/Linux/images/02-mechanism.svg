<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1396.876" viewBox="0 0 1440 1396.876" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">环境继承是创建子进程时的一次传递</title><rect width="1440" height="1396.876" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">环境继承是创建子进程时的一次传递</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1254.876" viewBox="0 0 1440 1344.51" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>02-进程日志远程与环境管理</title><svg width="1440" height="894.506" viewBox="20.000 70.000 1392.500 865.000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1392.5" height="865.0" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">父级持有独立 env 映射；子进程修改的是自己的环境</text><text xml:space="preserve" x="410" y="210" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">启动器 env</text><text xml:space="preserve" x="860" y="210" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">子进程 1</text><text xml:space="preserve" x="1320" y="210" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">子进程 2</text><line x1="410" y1="250" x2="410" y2="905" stroke="#c5dae5" stroke-width="3" stroke-dasharray=""/><line x1="860" y1="340" x2="860" y2="780" stroke="#c5dae5" stroke-width="3"/><line x1="860" y1="840" x2="860" y2="905" stroke="#c5dae5" stroke-width="3"/><line x1="1320" y1="825" x2="1320" y2="905" stroke="#c5dae5" stroke-width="3" stroke-dasharray=""/><circle cx="410" cy="300" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="410" y="312" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">A</text><circle cx="860" cy="380" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="860" y="392" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">A</text><circle cx="410" cy="480" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="410" y="492" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">B</text><circle cx="860" cy="550" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="860" y="562" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">A</text><circle cx="860" cy="700" r="36" fill="#fff0df" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="860" y="712" font-size="34" fill="#bf6a27" text-anchor="middle" font-weight="400">C</text><circle cx="410" cy="760" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="410" y="772" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">B</text><circle cx="1320" cy="860" r="36" fill="#eaf3f9" stroke="#90b2c6" stroke-width="2"/><text xml:space="preserve" x="1320" y="872" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">B</text><path d="M450,300 C620,300 640,380 820,380" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="580" y="290" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">启动 1</text><text xml:space="preserve" x="50" y="490" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">父级改为 B</text><text xml:space="preserve" x="935" y="560" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">旧进程仍是 A</text><text xml:space="preserve" x="935" y="710" font-size="28" fill="#bf6a27" text-anchor="start" font-weight="400">子进程自己改成 C</text><text xml:space="preserve" x="50" y="770" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">父级仍为 B</text><path d="M450,760 C730,760 900,860 1280,860" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="850" y="810" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">随后用 B 启动 2</text></g><desc> 环境变量：每次启动复制输入，进程之间不自动同步 更新旧任务需要显式消息、配置读取或重启；改另一个进程的值不会自动传播。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 894.506) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">Shell 变量和导出环境不同：只有环境映射默认交给新程序</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="276.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">父Shell：local_x=B</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="706.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">已导出 env_x=A</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1136.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">新外部程序</text><text x="65" y="280" font-size="30" fill="#1e7499" text-anchor="start">子程序环境中：env_x=A；没有 local_x 这一项</text><text x="65" y="350" font-size="30" fill="#c66d3a" text-anchor="start">子程序修改自己的 env_x=C，不会回写父Shell的 env_x=A</text><text x="65" y="420" font-size="27" fill="#1d3145" text-anchor="start">这里讨论启动外部程序；source 在当前 Shell 执行，具有不同状态边界。</text></g></g></svg></svg>

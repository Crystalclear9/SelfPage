<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">环境变量：每次启动复制输入，进程之间不自动同步</text><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">父级持有独立 env 映射；子进程修改的是自己的环境</text><text xml:space="preserve" x="410" y="210" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">启动器 env</text><text xml:space="preserve" x="860" y="210" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">子进程 1</text><text xml:space="preserve" x="1320" y="210" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">子进程 2</text><line x1="410" y1="250" x2="410" y2="905" stroke="#c7d9e3" stroke-width="3" stroke-dasharray=""/><line x1="860" y1="340" x2="860" y2="780" stroke="#c7d9e3" stroke-width="3"/><line x1="860" y1="840" x2="860" y2="905" stroke="#c7d9e3" stroke-width="3"/><line x1="1320" y1="825" x2="1320" y2="905" stroke="#c7d9e3" stroke-width="3" stroke-dasharray=""/><circle cx="410" cy="300" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="410" y="312" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">A</text><circle cx="860" cy="380" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="860" y="392" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">A</text><circle cx="410" cy="480" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="410" y="492" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">B</text><circle cx="860" cy="550" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="860" y="562" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">A</text><circle cx="860" cy="700" r="36" fill="#fff0df" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="860" y="712" font-size="34" fill="#c46c22" text-anchor="middle" font-weight="400">C</text><circle cx="410" cy="760" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="410" y="772" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">B</text><circle cx="1320" cy="860" r="36" fill="#eaf3f9" stroke="#94b1c2" stroke-width="2"/><text xml:space="preserve" x="1320" y="872" font-size="34" fill="#2676ad" text-anchor="middle" font-weight="400">B</text><path d="M450,300 C620,300 640,380 820,380" stroke="#2676ad" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="580" y="290" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">启动 1</text><text xml:space="preserve" x="50" y="490" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">父级改为 B</text><text xml:space="preserve" x="935" y="560" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">旧进程仍是 A</text><text xml:space="preserve" x="935" y="710" font-size="28" fill="#c46c22" text-anchor="start" font-weight="400">子进程自己改成 C</text><text xml:space="preserve" x="50" y="770" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">父级仍为 B</text><path d="M450,760 C730,760 900,860 1280,860" stroke="#2676ad" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="850" y="810" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">随后用 B 启动 2</text><text xml:space="preserve" x="50" y="990" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">更新旧任务需要显式消息、配置读取或重启；改另一个进程的值不会自动传播。</text></g></svg>
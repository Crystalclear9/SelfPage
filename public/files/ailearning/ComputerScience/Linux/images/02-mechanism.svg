<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 413.250000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 413.250000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 311.750000 684.000000 413.250000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 311.750000 684.000000 413.250000"/>
<title id="fig-title">子进程继承启动时的环境快照</title>
<desc id="fig-desc">父环境的后续变化不会改动已运行子进程。子进程修改自己的映射也不会回写父级。</desc>
<rect x="0" y="0" width="1200" height="725" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
<linearGradient id="blue" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1f8"/></linearGradient>
<linearGradient id="ochre" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
<linearGradient id="green" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4e9"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">父级与每个子进程各持有环境映射</text>
<rect x="388" y="142" width="192" height="58" fill="#ecf6f6" opacity="1"/>
<text x="484" y="179" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">A</text>
<rect x="584" y="142" width="192" height="58" fill="#ecf6f6" opacity="1"/>
<text x="680" y="179" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">A</text>
<rect x="780" y="142" width="192" height="58" fill="#f1f5f6" opacity="1"/>
<text x="876" y="179" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">未启动</text>
<text x="372" y="179" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">用 A 启动子进程 1</text>
<rect x="388" y="204" width="192" height="58" fill="#e8e6f2" opacity="1"/>
<text x="484" y="241" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">B</text>
<rect x="584" y="204" width="192" height="58" fill="#ecf6f6" opacity="1"/>
<text x="680" y="241" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">A</text>
<rect x="780" y="204" width="192" height="58" fill="#f1f5f6" opacity="1"/>
<text x="876" y="241" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">未启动</text>
<text x="372" y="241" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">父级改为 B</text>
<rect x="388" y="266" width="192" height="58" fill="#e8e6f2" opacity="1"/>
<text x="484" y="303" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">B</text>
<rect x="584" y="266" width="192" height="58" fill="#fbede8" opacity="1"/>
<text x="680" y="303" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">C</text>
<rect x="780" y="266" width="192" height="58" fill="#f1f5f6" opacity="1"/>
<text x="876" y="303" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">未启动</text>
<text x="372" y="303" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">子进程 1 改为 C</text>
<rect x="388" y="328" width="192" height="58" fill="#e8e6f2" opacity="1"/>
<text x="484" y="365" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">B</text>
<rect x="584" y="328" width="192" height="58" fill="#fbede8" opacity="1"/>
<text x="680" y="365" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">C</text>
<rect x="780" y="328" width="192" height="58" fill="#e8e6f2" opacity="1"/>
<text x="876" y="365" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">B</text>
<text x="372" y="365" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">用 B 启动子进程 2</text>
<text x="484" y="128" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">启动器</text>
<text x="680" y="128" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">子进程 1</text>
<text x="876" y="128" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">子进程 2</text>
<path d="M75 427 L1125 427" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="77" y="476" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="26" text-anchor="start" font-weight="600">Shell 局部变量与导出环境也要分开</text>
<path d="M75 565 L102 516 L557 516 L530 565 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316" y="548.2" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">父 Shell：local_x=B，已导出 env_x=A</text>
<path d="M574 540 L671 540" fill="none" stroke="#6e618e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M671 540 L660 545 L660 535 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M684 565 L711 516 L1118 516 L1091 565 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="901" y="548.2" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">外部程序：只有 env_x=A</text>
<text x="77" y="622" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">子程序改 env_x=C，父 Shell 的 env_x 仍为 A。</text>
</svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="913.0871" viewBox="0 0 1440 913.0871" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">相同PID对应不同进程生命周期时累计CPU时间不能连线求差</title><rect width="1440" height="913.0871" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">相同PID对应不同进程生命周期时累计CPU时间不能连线求差</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="771.0871" viewBox="23.467 54.419 1233.067 707.442" x="48" y="106" overflow="hidden"><rect width="1233.067" height="707.442" fill="white" x="23.467" y="54.419"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#20344a"><text x="50" y="103" font-size="27" fill="#20344a" text-anchor="start">教学计数：同一个 PID 被复用；CPU 累计时间已经换了统计对象</text><text x="55" y="165" font-size="25" fill="#20344a" text-anchor="start">CPU 累计秒</text><path d="M145 610L715 610" stroke="#e1e9ef" stroke-width="2"/><text x="125" y="618" font-size="25" fill="#20344a" text-anchor="end">0</text><path d="M145 480L715 480" stroke="#e1e9ef" stroke-width="2"/><text x="125" y="488" font-size="25" fill="#20344a" text-anchor="end">1</text><path d="M145 350L715 350" stroke="#e1e9ef" stroke-width="2"/><text x="125" y="358" font-size="25" fill="#20344a" text-anchor="end">2</text><path d="M145 220L715 220" stroke="#e1e9ef" stroke-width="2"/><text x="125" y="228" font-size="25" fill="#20344a" text-anchor="end">3</text><path d="M145 195L145 610" stroke="#c6d7e2" stroke-width="2"/><path d="M145 610L715 610" stroke="#c6d7e2" stroke-width="2"/><path d="M145 480L335 376.0" stroke="#1f86c7" stroke-width="5"/><circle cx="145" cy="480" r="8" fill="#1f86c7"/><text x="145" y="460" font-size="28" fill="#1f86c7" text-anchor="middle">1</text><circle cx="335" cy="376.0" r="8" fill="#1f86c7"/><text x="335" y="356.0" font-size="28" fill="#1f86c7" text-anchor="middle">1.8</text><path d="M525 324.0L715 246.0" stroke="#c37536" stroke-width="5"/><circle cx="525" cy="324.0" r="8" fill="#c37536"/><text x="525" y="304.0" font-size="28" fill="#c37536" text-anchor="middle">2.2</text><circle cx="715" cy="246.0" r="8" fill="#c37536"/><text x="715" y="226.0" font-size="28" fill="#c37536" text-anchor="middle">2.8</text><path d="M335 376.0L525 324.0" stroke="#9ca6b4" stroke-width="3" stroke-dasharray="7 8"/><path d="M415 335L445 365" stroke="#b05a3a" stroke-width="4"/><path d="M415 365L445 335" stroke="#b05a3a" stroke-width="4"/><text x="295" y="435" font-size="26" fill="#b05a3a" text-anchor="start">生命周期改变：此段不求差</text><text x="145" y="653" font-size="27" fill="#20344a" text-anchor="middle">0</text><text x="335" y="653" font-size="27" fill="#20344a" text-anchor="middle">1</text><text x="525" y="653" font-size="27" fill="#20344a" text-anchor="middle">2</text><text x="715" y="653" font-size="27" fill="#20344a" text-anchor="middle">3</text><text x="340" y="707" font-size="27" fill="#20344a" text-anchor="start">相对墙钟时间（秒）</text><text x="145" y="235" font-size="27" fill="#1f86c7" text-anchor="start">进程 A</text><text x="555" y="195" font-size="27" fill="#c37536" text-anchor="start">进程 B</text><path d="M790 155L790 710" stroke="#c6d7e2" stroke-width="2"/><text x="835" y="220" font-size="28" fill="#1f86c7" text-anchor="start">0 → 1 秒：同一个 A</text><text x="835" y="275" font-size="25" fill="#1f86c7" text-anchor="start">CPU 增量 0.8 秒 → 0.8 CPU</text><text x="835" y="380" font-size="28" fill="#b05a3a" text-anchor="start">1 → 2 秒：A 已被 B 替代</text><text x="835" y="435" font-size="25" fill="#b05a3a" text-anchor="start">差值为正，仍不是有效速率</text><text x="835" y="540" font-size="28" fill="#c37536" text-anchor="start">2 → 3 秒：同一个 B</text><text x="835" y="595" font-size="25" fill="#c37536" text-anchor="start">CPU 增量 0.6 秒 → 0.6 CPU</text><path d="M50 735L1230 735" stroke="#c6d7e2" stroke-width="2"/></g><desc> 计数器还在增加，也不能跨进程生命周期直接求差 先核对主机、启动周期、进程身份、单位与采样边界，再计算增量。</desc></svg></svg>

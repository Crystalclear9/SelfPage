<svg xmlns="http://www.w3.org/2000/svg" width="1233.067" height="707.442" viewBox="23.467 54.419 1233.067 707.442"><rect width="1233.067" height="707.442" fill="white" x="23.467" y="54.419" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="103" font-size="27" fill="#203449" text-anchor="start">教学计数：同一个 PID 被复用；CPU 累计时间已经换了统计对象</text><text x="55" y="165" font-size="25" fill="#203449" text-anchor="start">CPU 累计秒</text><path d="M145 610L715 610" stroke="#e1e9ef" stroke-width="2" /><text x="125" y="618" font-size="25" fill="#203449" text-anchor="end">0</text><path d="M145 480L715 480" stroke="#e1e9ef" stroke-width="2" /><text x="125" y="488" font-size="25" fill="#203449" text-anchor="end">1</text><path d="M145 350L715 350" stroke="#e1e9ef" stroke-width="2" /><text x="125" y="358" font-size="25" fill="#203449" text-anchor="end">2</text><path d="M145 220L715 220" stroke="#e1e9ef" stroke-width="2" /><text x="125" y="228" font-size="25" fill="#203449" text-anchor="end">3</text><path d="M145 195L145 610" stroke="#c8d6e0" stroke-width="2" /><path d="M145 610L715 610" stroke="#c8d6e0" stroke-width="2" /><path d="M145 480L335 376.0" stroke="#247bb5" stroke-width="5" /><circle cx="145" cy="480" r="8" fill="#247bb5" /><text x="145" y="460" font-size="28" fill="#247bb5" text-anchor="middle">1</text><circle cx="335" cy="376.0" r="8" fill="#247bb5" /><text x="335" y="356.0" font-size="28" fill="#247bb5" text-anchor="middle">1.8</text><path d="M525 324.0L715 246.0" stroke="#c77832" stroke-width="5" /><circle cx="525" cy="324.0" r="8" fill="#c77832" /><text x="525" y="304.0" font-size="28" fill="#c77832" text-anchor="middle">2.2</text><circle cx="715" cy="246.0" r="8" fill="#c77832" /><text x="715" y="226.0" font-size="28" fill="#c77832" text-anchor="middle">2.8</text><path d="M335 376.0L525 324.0" stroke="#9ba6ae" stroke-width="3" stroke-dasharray="7 8" /><path d="M415 335L445 365" stroke="#b34f37" stroke-width="4" /><path d="M415 365L445 335" stroke="#b34f37" stroke-width="4" /><text x="295" y="435" font-size="26" fill="#b34f37" text-anchor="start">生命周期改变：此段不求差</text><text x="145" y="653" font-size="27" fill="#203449" text-anchor="middle">0</text><text x="335" y="653" font-size="27" fill="#203449" text-anchor="middle">1</text><text x="525" y="653" font-size="27" fill="#203449" text-anchor="middle">2</text><text x="715" y="653" font-size="27" fill="#203449" text-anchor="middle">3</text><text x="340" y="707" font-size="27" fill="#203449" text-anchor="start">相对墙钟时间（秒）</text><text x="145" y="235" font-size="27" fill="#247bb5" text-anchor="start">进程 A</text><text x="555" y="195" font-size="27" fill="#c77832" text-anchor="start">进程 B</text><path d="M790 155L790 710" stroke="#c8d6e0" stroke-width="2" /><text x="835" y="220" font-size="28" fill="#247bb5" text-anchor="start">0 → 1 秒：同一个 A</text><text x="835" y="275" font-size="25" fill="#247bb5" text-anchor="start">CPU 增量 0.8 秒 → 0.8 CPU</text><text x="835" y="380" font-size="28" fill="#b34f37" text-anchor="start">1 → 2 秒：A 已被 B 替代</text><text x="835" y="435" font-size="25" fill="#b34f37" text-anchor="start">差值为正，仍不是有效速率</text><text x="835" y="540" font-size="28" fill="#c77832" text-anchor="start">2 → 3 秒：同一个 B</text><text x="835" y="595" font-size="25" fill="#c77832" text-anchor="start">CPU 增量 0.6 秒 → 0.6 CPU</text><path d="M50 735L1230 735" stroke="#c8d6e0" stroke-width="2" /></g><desc> 计数器还在增加，也不能跨进程生命周期直接求差 先核对主机、启动周期、进程身份、单位与采样边界，再计算增量。</desc></svg>

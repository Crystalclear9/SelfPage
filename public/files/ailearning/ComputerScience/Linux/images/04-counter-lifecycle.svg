<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 796" width="1360" height="796"><title id="plate-caption">相同PID对应不同进程生命周期时累计CPU时间不能连线求差</title><desc id="plate-alt">计数器还在增加，也不能跨进程生命周期直接求差 先核对主机、启动周期、进程身份、单位与采样边界，再计算增量。</desc><defs><clipPath id="plate-view-0"><rect x="-18.24" y="83.99335" width="996.48" height="499.0133"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="522.090219"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="609.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="573" viewBox="0 47 960 573" overflow="hidden"><rect width="960" height="620" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(7.68142 35.83893) scale(0.737997)"><g><rect width="1233.067" height="707.442" fill="#ffffff" x="23.467" y="54.419"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#233b4a"><text x="50" y="103" font-size="34.83px" fill="#233b4a" text-anchor="start">教学计数：同一个 PID 被复用；CPU 累计时间已经换了统计对象</text><text x="55" y="165" font-size="32.25px" fill="#233b4a" text-anchor="start">CPU 累计秒</text><line x1="145" y1="610" x2="715" y2="610" stroke="#657682" stroke-width="1.55" stroke-linecap="round"/><text x="125" y="618" font-size="29.75px" fill="#233b4a" text-anchor="end">0</text><line x1="145" y1="610" x2="145" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="335" y1="610" x2="335" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="525" y1="610" x2="525" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="715" y1="610" x2="715" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="140" y1="610" x2="145" y2="610" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="140" y1="480" x2="145" y2="480" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="140" y1="350" x2="145" y2="350" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="140" y1="220" x2="145" y2="220" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line stroke="#d6e2e6" stroke-width="1.3" x1="145" y1="480" x2="715" y2="480"/><text x="125" y="488" font-size="29.75px" fill="#233b4a" text-anchor="end">1</text><line stroke="#d6e2e6" stroke-width="1.3" x1="145" y1="350" x2="715" y2="350"/><text x="125" y="358" font-size="29.75px" fill="#233b4a" text-anchor="end">2</text><line stroke="#d6e2e6" stroke-width="1.3" x1="145" y1="220" x2="715" y2="220"/><text x="125" y="228" font-size="29.75px" fill="#233b4a" text-anchor="end">3</text><line stroke="#dbe8eb" stroke-width="2" x1="145" y1="195" x2="145" y2="610"/><line stroke="#1f7fac" stroke-width="5" x1="145" y1="480" x2="335" y2="376"/><circle cx="145" cy="480" r="8" fill="#1f7fac"/><text x="145" y="460" font-size="33.32px" fill="#2678a3" text-anchor="middle">1</text><circle cx="335" cy="376.0" r="8" fill="#1f7fac"/><text x="335" y="356.0" font-size="33.32px" fill="#2678a3" text-anchor="middle">1.8</text><line stroke="#aa6032" stroke-width="5" x1="525" y1="324" x2="715" y2="246"/><circle cx="525" cy="324.0" r="8" fill="#aa6032"/><text x="525" y="304.0" font-size="33.32px" fill="#995d34" text-anchor="middle">2.2</text><circle cx="715" cy="246.0" r="8" fill="#aa6032"/><text x="715" y="226.0" font-size="33.32px" fill="#995d34" text-anchor="middle">2.8</text><line stroke="#95a3b1" stroke-width="3" stroke-dasharray="7 8" x1="335" y1="376" x2="525" y2="324"/><line stroke="#9a5434" stroke-width="4" x1="415" y1="335" x2="445" y2="365"/><line stroke="#9a5434" stroke-width="4" x1="415" y1="365" x2="445" y2="335"/><text x="295" y="435" font-size="33.54px" fill="#a75c40" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">生命周期改变：此段不求差</text><text x="145" y="653" font-size="32.13px" fill="#233b4a" text-anchor="middle">0</text><text x="335" y="653" font-size="32.13px" fill="#233b4a" text-anchor="middle">1</text><text x="525" y="653" font-size="32.13px" fill="#233b4a" text-anchor="middle">2</text><text x="715" y="653" font-size="32.13px" fill="#233b4a" text-anchor="middle">3</text><text x="340" y="707" font-size="34.83px" fill="#233b4a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">相对墙钟时间（秒）</text><text x="145" y="235" font-size="34.83px" fill="#2678a3" text-anchor="start">进程 A</text><text x="555" y="195" font-size="34.83px" fill="#995d34" text-anchor="start">进程 B</text><line stroke="#dbe8eb" stroke-width="2" x1="790" y1="155" x2="790" y2="710"/><text x="835" y="220" font-size="35.907995px" fill="#2678a3" text-anchor="start">0 → 1 秒：同一个 A</text><text x="835" y="275" font-size="32.25px" fill="#2678a3" text-anchor="start">CPU 增量 0.8 秒 → 0.8 CPU</text><text x="835" y="380" font-size="35.907995px" fill="#a75c40" text-anchor="start">1 → 2 秒：A 已被 B 替代</text><text x="835" y="435" font-size="32.25px" fill="#a75c40" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">差值为正，仍不是有效速率</text><text x="835" y="540" font-size="35.907995px" fill="#995d34" text-anchor="start">2 → 3 秒：同一个 B</text><text x="835" y="595" font-size="32.25px" fill="#995d34" text-anchor="start">CPU 增量 0.6 秒 → 0.6 CPU</text><line stroke="#dbe8eb" stroke-width="2" x1="50" y1="735" x2="1230" y2="735"/></g><desc> 计数器还在增加，也不能跨进程生命周期直接求差 先核对主机、启动周期、进程身份、单位与采样边界，再计算增量。</desc></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="796" fill="white"/><g transform="translate(6.7238222 -66.431793) scale(1.3913755)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g></g></svg>

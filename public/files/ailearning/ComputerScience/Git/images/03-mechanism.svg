<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617.29" viewBox="11.00 10.00 1145.00 589.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">历史二分需要可判定且具有边界的性质</title><desc id="desc">把六个线性历史版本按时间排列，前三个通过、后三个失败。只有当待查性质在这段历史中形成这样的边界，并且每次测试可靠，二分才能稳定缩小首个失败版本的范围。 这里的柱高 0 表示通过、1 表示失败，不是性能量测。真实历史可能多次好坏交替；测试不稳定、环境变化或不可测试版本都必须显式处理，找到提交也不等于证明根因。 固定测试协议且存在通过到失败的边界；非单调历史须另查。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker><marker id="tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">历史二分需要可判定且具有边界的性质</text><path d="M208,345 L255,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="80" y="280" width="130" height="130" fill="#d9eee8" stroke="#92b1c4" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="145" y="325" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">版本 1</text><text x="145" y="375" font-size="24" fill="#2865a0" text-anchor="middle" font-weight="400">通过</text><path d="M391,345 L438,345" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="263" y="280" width="130" height="130" fill="#d9eee8" stroke="#92b1c
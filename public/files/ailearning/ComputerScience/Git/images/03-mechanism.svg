t-size="24" fill="#a9562c" text-anchor="middle" font-weight="400">失败</text><path d="M600,460 L600,515" stroke="#c87536" stroke-width="3" fill="none" marker-end="url(#tip-d67c47)" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="560" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">待定位边界：首个失败是版本 4</text></g></svg>

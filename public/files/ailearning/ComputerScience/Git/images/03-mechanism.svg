osoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">本实验真实边界由构造给定：v1–v3 输出 2，v4–v8 输出 3。</text><text x="44" y="738" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#cc661c" text-anchor="start" font-weight="400">若中间修复又回归，或同一版本判定不稳定，这条排除逻辑便需重审。</text></svg>
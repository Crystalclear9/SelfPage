<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：三张文档依次表示提交、暂存区与工作区，它们可以同时保存不同版本</title><desc id="detail-desc">三张文档依次表示提交、暂存区与工作区，它们可以同时保存不同版本。图示状态下直接执行提交会记录 x=2；只有再次暂存工作区修改，x=3 才会进入之后的提交。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="80" width="265" height="145" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="80" width="265" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="105" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">HEAD</text><text x="39" y="147" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 1</text><rect x="410" y="80" width="265" height="145" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="410" y="80" width="265" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="422" y="105" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">暂存区 index</text><text x="424" y="147" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 2</text><rect x="795" y="80" width="265" height="145" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="795" y="80" width="265" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="807" y="105" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">工作区</text><text x="809" y="147" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 3</text><path d="M780,280 L685,280" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="660" y="325" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">git add</text><path d="M395,280 L300,280" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="210" y="325" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">git commit</text><text x="40" y="390" font-size="28" fill="#cf7432" font-weight="600" text-anchor="start">此刻直接提交 → 新提交保存 x = 2</text></g></svg>

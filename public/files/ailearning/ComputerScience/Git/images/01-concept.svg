 fill="#80929d" text-anchor="middle" font-weight="400">rate=A</text><rect x="950" y="905" width="300" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1100" y="967" font-size="37" fill="#176b91" text-anchor="middle" font-weight="400">rate=B</text><rect x="1400" y="905" width="300" height="100" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1550" y="967" font-size="37" fill="#d87332" text-anchor="middle" font-weight="400">rate=C</text><text x="60" y="1192" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">普通 git commit</text><rect x="500" y="1140" width="300" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="650" y="1202" font-size="37" fill="#176b91" text-anchor="middle" font-weight="400">rate=B</text><rect x="950" y="1140" width="300" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1100" y="1202" font-size="37" fill="#176b91" text-anchor="middle" font-weight="400">rate=B</text><rect x="1400" y="1140" width="300" height="100" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1550" y="1202" font-size="37" fill="#d87332" text-anchor="middle" font-weight="400">rate=C</text><path d="M 1100 1110 C 1100 1050 650 1050 650 1120" fill="none" stroke="#176b91" stroke-width="4" marker-end="url(#b)"/></g></svg><g id="round-20261105c-teaching" transform="translate(0 1380) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">删除工作文件也有两个状态：工作区消失，索引未必消失</text><rect x="65" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="276.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">HEAD：内容A</text><rect x="495" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="706.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">索引：内容A</text><rect x="925" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1136.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">工作区：不存在</text><text x="65" y="260" font-size="30" fill="#203742" text-anchor="start">此时删除尚未暂存：普通 commit 仍可记录索引中的 A。</text><rect x="65" y="315" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="276.0" y="354" font-size="28" fill="#c96937" text-anchor="middle">HEAD：内容A</text><rect x="495" y="315" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="706.0" y="354" font-size="28" fill="#c96937" text-anchor="middle">索引：删除</text><rect x="925" y="315" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1136.0" y="354" font-size="28" fill="#c96937" text-anchor="middle">工作区：不存在</text><text x="65" y="417" font-size="27" fill="#203742" text-anchor="start">把删除加入索引后，下一次提交才记录该路径移除；暂存并不只适用于新增内容。</text></g></g></svg>

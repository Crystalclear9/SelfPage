<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1592.4" viewBox="0 0 1440 1592.4" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">工作区、索引与提交分别保存什么</title><rect width="1440" height="1592.4" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">工作区、索引与提交分别保存什么</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1450.4" viewBox="0 0 1800 1942.5" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>同一路径在暂存后继续编辑时的三份内容</title><svg width="1800" height="1380" viewBox="0 0 1800 1380" role="img"><title>同一路径在暂存后继续编辑时的三份内容</title><rect width="1800" height="1380" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1672a0" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1e9195" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="650" y="90" font-size="33" fill="#20354a" text-anchor="middle" font-weight="700">HEAD 树内文件</text><text x="1100" y="90" font-size="33" fill="#20354a" text-anchor="middle" font-weight="700">索引内文件</text><text x="1550" y="90" font-size="33" fill="#20354a" text-anchor="middle" font-weight="700">工作区文件</text><text x="60" y="252" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">初始提交</text><rect x="500" y="200" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="650" y="262" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="950" y="200" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="1100" y="262" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="1400" y="200" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="1550" y="262" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><text x="60" y="487" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">编辑成 B</text><rect x="500" y="435" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="650" y="497" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="950" y="435" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="1100" y="497" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="1400" y="435" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1550" y="497" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><text x="60" y="722" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">git add</text><rect x="500" y="670" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="650" y="732" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="950" y="670" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1100" y="732" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><rect x="1400" y="670" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1550" y="732" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><path d="M 1550 640 C 1550 580 1100 580 1100 650" fill="none" stroke="#1672a0" stroke-width="4" marker-end="url(#b)"/><text x="60" y="957" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">再编辑成 C</text><rect x="500" y="905" width="300" height="100" rx="4" fill="white" stroke="#818fa4" stroke-width="2"/><text x="650" y="967" font-size="37" fill="#818fa4" text-anchor="middle" font-weight="400">rate=A</text><rect x="950" y="905" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1100" y="967" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><rect x="1400" y="905" width="300" height="100" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="1550" y="967" font-size="37" fill="#d37537" text-anchor="middle" font-weight="400">rate=C</text><text x="60" y="1192" font-size="32" fill="#20354a" text-anchor="start" font-weight="400">普通 git commit</text><rect x="500" y="1140" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="650" y="1202" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><rect x="950" y="1140" width="300" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1100" y="1202" font-size="37" fill="#1672a0" text-anchor="middle" font-weight="400">rate=B</text><rect x="1400" y="1140" width="300" height="100" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="1550" y="1202" font-size="37" fill="#d37537" text-anchor="middle" font-weight="400">rate=C</text><path d="M 1100 1110 C 1100 1050 650 1050 650 1120" fill="none" stroke="#1672a0" stroke-width="4" marker-end="url(#b)"/></g></svg><g id="round-20261105c-teaching" transform="translate(0 1380) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">删除工作文件也有两个状态：工作区消失，索引未必消失</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="276.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">HEAD：内容A</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="706.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">索引：内容A</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1136.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">工作区：不存在</text><text x="65" y="260" font-size="30" fill="#1d3145" text-anchor="start">此时删除尚未暂存：普通 commit 仍可记录索引中的 A。</text><rect x="65" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="276.0" y="354" font-size="28" fill="#c66d3a" text-anchor="middle">HEAD：内容A</text><rect x="495" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="706.0" y="354" font-size="28" fill="#c66d3a" text-anchor="middle">索引：删除</text><rect x="925" y="315" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1136.0" y="354" font-size="28" fill="#c66d3a" text-anchor="middle">工作区：不存在</text><text x="65" y="417" font-size="27" fill="#1d3145" text-anchor="start">把删除加入索引后，下一次提交才记录该路径移除；暂存并不只适用于新增内容。</text></g></g></svg></svg>

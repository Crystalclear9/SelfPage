<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1140.000" height="835.000" viewBox="30.000 108.000 1140.000 835.000" role="img"><title id="figure-title">变基与提交身份：同一树，不同父引用</title><desc id="figure-desc">O为score0，A改为score1；N是O之后同一score0树的新基线空提交；A′以N为父，结果树与A相同，其余提交字段固定。全部SHA1按真实Git对象格式计算并由git hash-object交叉核对。 变基与提交身份：同一树，不同父引用</desc><rect width="1140.0" height="835.0" fill="white" x="30.0" y="108.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><path d="M175 292 L380 220" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M175 330 L380 417" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M490 435 L940 435" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><line x1="487" y1="220" x2="955" y2="395" stroke="#627689" stroke-width="2" stroke-dasharray="8 7" /><text x="730" y="285" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">重新应用变化</text><circle cx="125" cy="310" r="44" fill="#2865a0" /><text x="125" y="322" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="600">O</text><text x="125" y="397" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">69444eb</text><circle cx="435" cy="200" r="44" fill="#2865a0" /><text x="435" y="212" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="600">A</text><text x="435" y="287" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">d11cd05</text><circle cx="435" cy="435" r="44" fill="#c87536" /><text x="435" y="447" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="600">N</text><text x="435" y="522" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">8324a76</text><circle cx="1000" cy="435" r="44" fill="#c87536" /><text x="1000" y="447" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="600">A′</text><text x="1000" y="522" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">2976107</text><text x="55" y="155" font-size="27" fill="#213447" text-anchor="start" font-weight="400">祖先 → 后继；提交对象内部保存反向父引用</text><line x1="55" y1="560" x2="1145" y2="560" stroke="#cbd9e4" stroke-width="2" /><rect x="55" y="600" width="500" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="305.0" y="641.15" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">提交 A</text><text x="75" y="710" font-size="29" fill="#213447" text-anchor="start" font-weight="400">tree    ce4f24dbbe84</text><text x="75" y="770" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">parent  69444eb6b965</text><text x="75" y="830" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">提交 ID  d11cd05da34f</text><rect x="645" y="600" width="500" height="62" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="895.0" y="641.15" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">提交 A′</text><text x="665" y="710" font-size="29" fill="#213447" text-anchor="start" font-weight="400">tree    ce4f24dbbe84</text><text x="665" y="770" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">parent  8324a76bd428</text><text x="665" y="830" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">提交 ID  2976107cd6ed</text><text x="600" y="915" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">本例固定同一结果树；改变父引用已足以改变实际哈希</text></g></svg>

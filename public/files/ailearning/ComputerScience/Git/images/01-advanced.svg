<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="930.793" viewBox="0 0 1440 930.793" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">相同文件树不代表相同提交</title><rect width="1440" height="930.793" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">相同文件树不代表相同提交</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="788.793" viewBox="20 70 1431.25 840" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1431.25" height="840.0" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">实线箭头表示对象引用；C1、C2 的 tree 相同，parent 不同</text><circle cx="210" cy="300" r="50" fill="#e8f2f9" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="210" y="313" font-size="35" fill="#1f3348" text-anchor="middle" font-weight="400">C1</text><line x1="210" y1="352" x2="210" y2="435" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="270" y="410" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">parent</text><circle cx="210" cy="480" r="39" fill="#f4f6f7" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="210" y="492" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">P1</text><circle cx="210" cy="660" r="50" fill="#e8f2f9" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="210" y="673" font-size="35" fill="#1f3348" text-anchor="middle" font-weight="400">C2</text><line x1="210" y1="712" x2="210" y2="795" stroke="#2181bf" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="270" y="770" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">parent</text><circle cx="210" cy="840" r="39" fill="#f4f6f7" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="210" y="852" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">P2</text><path d="M262,300 C500,300 450,470 650,470" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M262,660 C500,660 450,510 650,510" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="440" y="340" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">tree</text><text xml:space="preserve" x="440" y="625" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">tree</text><circle cx="720" cy="490" r="60" fill="#e7f3ee" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="720" y="504" font-size="40" fill="#1f3348" text-anchor="middle" font-weight="400">T</text><line x1="783" y1="490" x2="940" y2="490" stroke="#8e9fb9" stroke-width="3" stroke-dasharray="10 8"/><text x="840" y="450" font-size="27">展开</text><rect x="950" y="370" width="470" height="250" rx="0" fill="#fafcfd" stroke="#b3c0d3" stroke-width="2"/><text xml:space="preserve" x="980" y="420" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">共同树 T 的文件条目</text><text xml:space="preserve" x="980" y="490" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">100644  config.txt</text><text xml:space="preserve" x="980" y="555" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">→ 同一个内容对象</text></g><desc> 相同文件树，仍然可以有不同的提交父关系 树身份只固定路径、模式与内容；不同父引用足以改变提交对象。</desc></svg></svg>

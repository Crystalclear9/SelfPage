<svg xmlns="http://www.w3.org/2000/svg" width="960" height="829" viewBox="0 0 960 829" role="img" aria-labelledby="title desc">
<title id="title">删除分支入口后，提交仍然可达</title><desc id="desc">main 直接指向 C。C 的父提交是 B，B 的父提交是 A。删除 feature 前，feature 直接指向 B。删除后，沿 main 的父链仍能找到 B。</desc>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#55728a"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="960" height="829" rx="0" fill="#ffffff" stroke="none" stroke-width="1.8"/>
<text x="44" y="63" font-size="39" fill="#172a40" font-weight="700" text-anchor="start">删除分支入口后，提交仍然可达</text>
<text x="46" y="106" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">分支名指向一个提交，提交之间按子到父追踪</text>
<rect x="44" y="144" width="42" height="41" rx="9" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="174" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">A</text>
<text x="103" y="174" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">删除前，B 可以从两个入口找到</text>
<rect x="44" y="198" width="872" height="236" rx="13" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<circle cx="220" cy="333" r="34" fill="#ffffff" stroke="#136d84" stroke-width="3.2"/>
<text x="220" y="343" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">A</text>
<circle cx="480" cy="333" r="34" fill="#e9f5f7" stroke="#136d84" stroke-width="3.2"/>
<text x="480" y="343" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">B</text>
<circle cx="740" cy="333" r="34" fill="#ffffff" stroke="#136d84" stroke-width="3.2"/>
<text x="740" y="343" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">C</text>
<line x1="701" y1="333" x2="519" y2="333" stroke="#55728a" stroke-width="3.8" stroke-dasharray="none" marker-end="url(#arrow)"/>
<line x1="441" y1="333" x2="259" y2="333" stroke="#55728a" stroke-width="3.8" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="674" y="221" width="132" height="46" rx="9" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="740" y="252" font-size="26" fill="#136d84" font-weight="700" text-anchor="middle">main</text>
<line x1="740" y1="271" x2="740" y2="293" stroke="#55728a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="414" y="221" width="132" height="46" rx="9" fill="#fff2e8" stroke="#cedae4" stroke-width="1.8"/>
<text x="480" y="252" font-size="26" fill="#a85127" font-weight="700" text-anchor="middle">feature</text>
<line x1="480" y1="271" x2="480" y2="293" stroke="#55728a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="480" y="396" font-size="26" fill="#465d72" font-weight="650" text-anchor="middle">B 是 C 的父提交</text>
<rect x="44" y="455" width="42" height="41" rx="9" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="485" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">B</text>
<text x="103" y="485" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">删除后，仍可从 main 沿父链找到 B</text>
<rect x="44" y="509" width="872" height="236" rx="13" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<circle cx="220" cy="644" r="34" fill="#ffffff" stroke="#136d84" stroke-width="3.2"/>
<text x="220" y="654" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">A</text>
<circle cx="480" cy="644" r="34" fill="#e9f5f7" stroke="#136d84" stroke-width="3.2"/>
<text x="480" y="654" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">B</text>
<circle cx="740" cy="644" r="34" fill="#ffffff" stroke="#136d84" stroke-width="3.2"/>
<text x="740" y="654" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">C</text>
<line x1="701" y1="644" x2="519" y2="644" stroke="#55728a" stroke-width="3.8" stroke-dasharray="none" marker-end="url(#arrow)"/>
<line x1="441" y1="644" x2="259" y2="644" stroke="#55728a" stroke-width="3.8" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="674" y="532" width="132" height="46" rx="9" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="740" y="563" font-size="26" fill="#136d84" font-weight="700" text-anchor="middle">main</text>
<line x1="740" y1="582" x2="740" y2="604" stroke="#55728a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="480" y="707" font-size="26" fill="#465d72" font-weight="650" text-anchor="middle">B 是 C 的父提交</text>
</g>
</svg>

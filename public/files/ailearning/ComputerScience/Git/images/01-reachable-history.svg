<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
<title id="title">删除分支入口后，提交仍然可达</title>
<desc id="description">两图提交坐标相同。删除 feature 后，main 仍指向 C，沿 C 到 B 到 A 的父链仍然到达全部三个提交。</desc>

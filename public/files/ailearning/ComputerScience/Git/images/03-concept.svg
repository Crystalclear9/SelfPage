<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：在无其他改动的简单历史中，B 把 x 从 0 改为 1，撤销提交 R 再应用反向补丁把它改回 0</title><desc id="detail-desc">在无其他改动的简单历史中，B 把 x 从 0 改为 1，撤销提交 R 再应用反向补丁把它改回 0。虽然 A 与 R 的文件内容相同，R 仍是新的提交，B 也仍在祖先链中。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="90" width="270" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="90" width="270" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="115" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">A</text><text x="39" y="157" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 0</text><rect x="410" y="90" width="270" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="410" y="90" width="270" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="422" y="115" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">B</text><text x="424" y="157" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 1</text><rect x="795" y="90" width="270" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="795" y="90" width="270" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="807" y="115" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">R：revert B</text><text x="809" y="157" font-size="22" fill="#213447" font-weight="400" text-anchor="start">x = 0</text><path d="M310,160 L395,160" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M695,160 L780,160" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="325" y="280" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">正向补丁</text><text x="710" y="280" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">反向补丁</text><text x="75" y="370" font-size="27" fill="#158476" font-weight="600" text-anchor="start">A 与 R 的内容可相同，但提交身份、父链与历史不同</text></g></svg>

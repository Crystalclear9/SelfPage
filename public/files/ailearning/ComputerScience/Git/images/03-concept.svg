<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img"><title>反向补丁改变文件内容但保留原提交祖先</title><rect width="1800" height="1050" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="250" cy="220" r="65" fill="white" stroke="#176b91" stroke-width="2"/><text x="250" y="238" font-size="44" fill="#176b91" text-anchor="middle" font-weight="400">A</text><line x1="250" y1="300" x2="250" y2="480" stroke="#d9e4ea" stroke-width="3"/><rect x="80" y="510" width="340" height="130" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="250" y="590" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">x = 0</text><circle cx="900" cy="220" r="65" fill="white" stroke="#176b91" stroke-width="2"/><text x="900" y="238" font-size="44" fill="#176b91" text-anchor="middle" font-weight="400">B</text><line x1="900" y1="300" x2="900" y2="480" stroke="#d9e4ea" stroke-width="3"/><rect x="730" y="510" width="340" height="130" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="900" y="590" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">x = 1</text><line x1="815" y1="220" x2="340" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="580" y="180" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">parent</text><circle cx="1550" cy="220" r="65" fill="white" stroke="#d87332" stroke-width="2"/><text x="1550" y="238" font-size="44" fill="#d87332" text-anchor="middle" font-weight="400">R</text><line x1="1550" y1="300" x2="1550" y2="480" stroke="#d9e4ea" stroke-width="3"/><rect x="1380" y="510" width="340" height="130" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1550" y="590" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">x = 0</text><line x1="1465" y1="220" x2="990" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="1230" y="180" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">parent</text><rect x="1320" y="55" width="460" height="70" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1550" y="102" font-size="32" fill="#d87332" text-anchor="middle" font-weight="400">main → R</text><text x="575" y="750" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">B 引入的补丁</text><text x="575" y="825" font-size="34" fill="#80929d" text-anchor="middle" font-weight="400">− x=0</text><text x="575" y="895" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">+ x=1</text><text x="1225" y="750" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">R 应用的反向补丁</text><text x="1225" y="825" font-size="34" fill="#80929d" text-anchor="middle" font-weight="400">− x=1</text><text x="1225" y="895" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">+ x=0</text><text x="900" y="1000" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">A 与 R 的文件内容相同；R → B → A 的父链仍存在</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1090.000" height="438.000" viewBox="55.000 42.000 1090.000 438.000" role="img" aria-labelledby="title desc"><title id="title">revert 恢复内容，不抹去父链</title><desc id="desc">A内容x=0，B内容x=1，R反向应用B变化后x=0。R父为B，B父为A；A和R共享结果内容但提交不同。 </desc><rect width="1090.0" height="438.0" fill="white" x="55.0" y="42.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><circle cx="180" cy="110" r="38" fill="white" stroke="#24679c" stroke-width="2" /><text x="180" y="121" fill="#23384b" font-size="32" text-anchor="middle" font-weight="400">A</text><line x1="180" y1="150" x2="180" y2="220" stroke="#d9e3eb" stroke-width="2" /><rect x="80" y="235" width="200" height="75" fill="#eef5fa" stroke="#d9e3eb" stroke-width="1.5" rx="3" /><text x="180" y="282" fill="#23384b" font-size="31" text-anchor="middle" font-weight="400">x = 0</text><circle cx="600" cy="110" r="38" fill="white" stroke="#24679c" stroke-width="2" /><text x="600" y="121" fill="#23384b" font-size="32" text-anchor="middle" font-weight="400">B</text><line x1="600" y1="150" x2="600" y2="220" stroke="#d9e3eb" stroke-width="2" /><rect x="500" y="235" width="200" height="75" fill="#eef5fa" stroke="#d9e3eb" stroke-width="1.5" rx="3" /><text x="600" y="282" fill="#23384b" font-size="31" text-anchor="middle" font-weight="400">x = 1</text><circle cx="1020" cy="110" r="38" fill="white" stroke="#c66e30" stroke-width="2" /><text x="1020" y="121" fill="#23384b" font-size="32" 
<title id="title">显式租约只接受预期的远程旧值</title>
<desc id="description">服务器引用依次指向 A、B、A。请求携带的预期一直是 A；在第二个时点不满足租约，第三个时点只说明当前相等。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cae6e8"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#fff5f2"/><stop offset="1" stop-color="#f1d2ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f9f6fc"/><stop offset="1" stop-color="#e9deef"/></linearGradient>
<linearGradient id="wash-g" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f3f9f4"/><stop offset="1" stop-color="#d5e9da"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#e8edf1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="540" fill="white" stroke="none" stroke-width="1.7" rx="0"/>
<text x="111" y="58" fill="#526577" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">远程引用</text>
<text x="299" y="62" fill="#202a36" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">最初</text>
<path d="M214 178l25 -68h145l-25 68Z" stroke="#526577" stroke-width="1.7" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="299" y="154" fill="#202a36" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<text x="596" y="62" fill="#202a36" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">被推进</text>
<path d="M511 178l25 -68h145l-25 68Z" stroke="#a64635" stroke-width="1.7" fill="url(#wash-c)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="596" y="154" fill="#202a36" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B</text>
<text x="894" y="62" fill="#202a36" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">被移回</text>
<path d="M809 178l25 -68h145l-25 68Z" stroke="#526577" stroke-width="1.7" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="894" y="154" fill="#202a36" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M394 145L481 145" stroke="#67517d" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M492 145L478 139L478 151Z" stroke="#67517d" stroke-width="1" fill="#67517d" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M691 145L779 145" stroke="#67517d" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M790 145L776 139L776 151Z" stroke="#67517d" stroke-width="1" fill="#67517d" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106" y="296" fill="#526577" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">请求预期</text>
<path d="M596 188L596 230" stroke="#526577" stroke-width="2.2" fill="none" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510 299l25 -63h145l-25 63Z" stroke="#176b74" stroke-width="1.7" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="596" y="279" fill="#176b74" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<text x="596" y="388" fill="#a64635" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">拒绝这次更新</text>
<text x="596" y="347" fill="#202a36" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B ≠ A</text>
<path d="M894 188L894 230" stroke="#526577" stroke-width="2.2" fill="none" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M808 299l25 -63h145l-25 63Z" stroke="#176b74" stroke-width="1.7" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="894" y="279" fill="#176b74" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<text x="894" y="388" fill="#176b74" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">租约比较通过</text>
<text x="894" y="347" fill="#202a36" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A = A</text>
<text x="596" y="480" fill="#526577" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">当前值相等，无法说明中间从未改变</text>
</svg>

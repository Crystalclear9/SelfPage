<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608.32" viewBox="11.00 10.00 1154.00 585.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">显式租约只接受预期的远程旧值</title><desc id="desc">显式租约把“我观察到的远程旧位置”作为更新前提。若服务器已经被别人推进到 B，而请求仍以 A 为预期，比较失败就应拒绝更新，从而保留这次未被本地观察到的变化。 租约是对引用位置的条件检查，不是锁住远程的永久保护。使用什么预期值以及何时更新该观察都很重要；本图不执行推送，也不把租约当成代码语义正确的证明。 显式租约比较预期旧 ID；匹配也不保证覆盖后的业务语义正确。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">显式租约只接受预期的远程旧值</text><path d="M345,282.5 L450,317.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,453.846 L450,416.154" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,365 L850,365" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">本地预期远程旧值 A</text><rect x="60" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">服务器当前值已为 B</text><rect x="450" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">比较：A 与 B 不相等</text><rect x="850" y="310" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">拒绝本次覆盖更新</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="52" font-family="Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#18354a" text-anchor="start" font-weight="700">显式租约比较当前旧值，不是远程变化的完整日志</text><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">同一服务器引用可能经历 A → B → A；请求始终携带明确预期 A。</text><text x="225" y="180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">t0：原状态</text><circle cx="225" cy="245" r="35" fill="#2676b5" stroke="none"/><text x="225" y="255" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">A</text><line x1="270" y1="245" x2="570" y2="245" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="615" y="180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">t1：别人推进</text><circle cx="615" cy="245" r="35" fill="#cc661c" stroke="none"/><text x="615" y="255" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">B</text><line x1="660" y1="245" x2="960" y2="245" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="1005" y="180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">t2：后来退回</text><circle cx="1005" cy="245" r="35" fill="#2676b5" stroke="none"/><text x="1005" y="255" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="400">A</text><text x="44" y="351" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">预期对象是不可变提交 A；服务器分支名仍是可移动引用。</text><rect x="44" y="398" width="230" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="159.0" y="431" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">请求时点</text><rect x="274" y="398" width="265" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="406.5" y="431" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">明确预期</text><rect x="539" y="398" width="265" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="671.5" y="431" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">服务器当前</text><rect x="804" y="398" width="415" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="1011.5" y="431" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">单看租约条件</text><rect x="44" y="447" width="230" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="159.0" y="480" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">t1</text><rect x="274" y="447" width="265" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="406.5" y="480" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="539" y="447" width="265" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="671.5" y="480" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">B</text><rect x="804" y="447" width="415" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1011.5" y="480" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">不等：拒绝该租约更新</text><rect x="44" y="496" width="230" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="159.0" y="529" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">t2</text><rect x="274" y="496" width="265" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="406.5" y="529" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="539" y="496" width="265" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="671.5" y="529" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">A</text><rect x="804" y="496" width="415" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1011.5" y="529" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#2676b5" text-anchor="middle" font-weight="400">相等：租约条件满足</text><text x="44" y="626" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#cc661c" text-anchor="start" font-weight="400">t2 无法仅靠相等比较得知 B 曾出现；租约不保证内容已审查。</text><text x="44" y="704" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">实际更新还受权限、受保护分支、服务端钩子及并发引用更新规则约束。</text></svg>
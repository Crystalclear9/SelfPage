<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">撤销合并改变内容，却不会抹去“已经合并”的历史</title><desc id="desc">八个提交展示合并M、反向提交R、主题增量D、再合并N与撤销反向提交Q。R仍有B为祖先，直接再合并B无效；合并D只引入helper而不恢复feature；Q恢复feature且保留helper。</desc><rect width="1200" height="920" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">撤销合并改变内容，却不会抹去“已经合并”的历史</text><text x="40" y="102" font-size="26" fill="#627689" text-anchor="start">上半部看祖先，箭头从父到子；下半部单独核对三个文件的存在状态。</text><line x1="110.0" y1="250.0" x2="268.0" y2="250.0" stroke="#2865a0" stroke-width="3"/><polyline points="258.3465918192059,255.27368092464624 268.0,250.0 258.3465918192059,244.72631907535376" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="104.26208252909566" y1="267.64515093025136" x2="274.120445302298" y2="391.17850567439854" stroke="#2865a0" stroke-width="3"/><polyline points="263.21155590753654,389.7656602572135 274.120445302298,391.17850567439854 269.4152156324279,381.2356281354879" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="330.0" y1="250.0" x2="488.0" y2="250.0" stroke="#2865a0" stroke-width="3"/><polyline points="478.3465918192059,255.27368092464624 488.0,250.0 478.3465918192059,244.72631907535376" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="324.26208252909566" y1="392.35484906974864" x2="494.120445302298" y2="268.82149432560146" stroke="#2865a0" stroke-width="3"/><polyline points="489.4152156324279,278.7643718645121 494.120445302298,268.82149432560146 483.21155590753654,270.2343397427865" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="550.0" y1="250.0" x2="683.0" y2="250.0" stroke="#c87536" stroke-width="3"/><polyline points="673.3465918192059,255.27368092464624 683.0,250.0 673.3465918192059,244.72631907535376" fill="none" stroke="#c87536" stroke-width="3"/><line x1="330.0" y1="410.0" x2="618.0" y2="410.0" stroke="#2865a0" stroke-width="3"/><polyline points="608.3465918192059,415.2736809246462 618.0,410.0 608.3465918192059,404.7263190753538" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="745.0" y1="250.0" x2="888.0" y2="250.0" stroke="#2865a0" stroke-width="3"/><polyline points="878.3465918192059,255.27368092464624 888.0,250.0 878.3465918192059,244.72631907535376" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="675.8087460090252" y1="394.705928290948" x2="892.4706709237064" y2="266.31367648965545" stroke="#2865a0" stroke-width="3"/><polyline points="886.8544607361276,275.7719101053438 892.4706709237064,266.31367648965545 881.477390453981,266.69810400422136" fill="none" stroke="#2865a0" stroke-width="3"/><line x1="950.0" y1="250.0" x2="1073.0" y2="250.0" stroke="#c87536" stroke-width="3"/><polyline points="1063.346591819206,255.27368092464624 1073.0,250.0 1063.346591819206,244.72631907535376" fill="none" stroke="#c87536" stroke-width="3"/><circle cx="80" cy="250" r="28" fill="#2865a0"/><text x="80" y="259" font-size="28" fill="#ffffff" text-anchor="middle">A</text><circle cx="300" cy="250" r="28" fill="#2865a0"/><text x="300" y="259" font-size="28" fill="#ffffff" text-anchor="middle">C</text><circle cx="300" cy="410" r="28" fill="#2865a0"/><text x="300" y="419" font-size="28" fill="#ffffff" text-anchor="middle">B</text><circle cx="520" cy="250" r="28" fill="#2865a0"/><text x="520" y="259" font-size="28" fill="#ffffff" text-anchor="middle">M</text><circle cx="715" cy="250" r="28" fill="#c87536"/><text x="715" y="259" font-size="28" fill="#ffffff" text-anchor="middle">R</text><circle cx="650" cy="410" r="28" fill="#2865a0"/><text x="650" y="419" font-size="28" fill="#ffffff" text-anchor="middle">D</text><circle cx="920" cy="250" r="28" fill="#2865a0"/><text x="920" y="259" font-size="28" fill="#ffffff" text-anchor="middle">N</text><circle cx="1105" cy="250" r="28" fill="#c87536"/><text x="1105" y="259" font-size="28" fill="#ffffff" text-anchor="middle">Q</text><text x="300" y="194" font-size="25" fill="#213447" text-anchor="middle">主线新增</text><text x="520" y="194" font-size="25" fill="#213447" text-anchor="middle">合并 B</text><text x="715" y="194" font-size="25" fill="#213447" text-anchor="middle">撤销 M</text><text x="920" y="194" font-size="25" fill="#213447" text-anchor="middle">再合并 D</text><text x="1105" y="194" font-size="25" fill="#213447" text-anchor="middle">撤销 R</text><text x="300" y="465" font-size="25" fill="#2865a0" text-anchor="middle">新增 feature</text><text x="650" y="465" font-size="25" fill="#2865a0" text-anchor="middle">仅新增 helper</text><text x="40" y="538" font-size="28" fill="#c87536" text-anchor="start">R 之后：B 仍是祖先；原样再合并 B，不产生新提交。</text><line x1="40" y1="568" x2="1160" y2="568" stroke="#dce5ed" stroke-width="2"/><text x="45" y="620" font-size="27" fill="#213447" text-anchor="start">文件状态</text><text x="490" y="620" font-size="28" fill="#213447" text-anchor="middle">M</text><text x="685" y="620" font-size="28" fill="#213447" text-anchor="middle">R</text><text x="895" y="620" font-size="28" fill="#213447" text-anchor="middle">N</text><text x="1100" y="620" font-size="28" fill="#213447" text-anchor="middle">Q</text><text x="45" y="678" font-size="26" fill="#213447" text-anchor="start">main.txt</text><text x="490" y="678" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="685" y="678" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="895" y="678" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="1100" y="678" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="45" y="736" font-size="26" fill="#213447" text-anchor="start">feature.txt</text><text x="490" y="736" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="685" y="736" font-size="28" fill="#c87536" text-anchor="middle">无</text><text x="895" y="736" font-size="28" fill="#c87536" text-anchor="middle">无</text><text x="1100" y="736" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="45" y="794" font-size="26" fill="#213447" text-anchor="start">helper.txt</text><text x="490" y="794" font-size="28" fill="#c87536" text-anchor="middle">无</text><text x="685" y="794" font-size="28" fill="#c87536" text-anchor="middle">无</text><text x="895" y="794" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="1100" y="794" font-size="28" fill="#2865a0" text-anchor="middle">有</text><text x="40" y="872" font-size="25" fill="#627689" text-anchor="start">N 只引入 B → D 的新增文件；Q 在此无冲突构造中恢复 feature，保留 helper。</text></g></svg>
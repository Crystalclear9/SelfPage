<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">无文本冲突仍可能拼出错误单位</title><desc id="desc">两个分支修改了不同文件：一边继续按米解释长度，另一边把输入数值转换成厘米。即使 Git 可以自动组合文本，合并后的程序也可能把 100 厘米当成 100 米，产生百倍偏差。 这是故意缺少接口迁移的语义冲突示例，不表示自动合并算法应能理解所有单位。合并验证应覆盖数据单位、字段意义与调用契约，而不只检查冲突标记或能否运行。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">无文本冲突仍可能拼出错误单位</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">自动合并只处理文本；单位契约仍需集成验证。</text><path d="M345,311.154 L450,278.846" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,409.808 L450,450.192" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,277.75 L850,312.25" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,451.562 L850,408.438" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="300" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="363" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">共同约定：米</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">分支 A：计算仍按米</text><rect x="450" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">分支 B：输入改为厘米</text><rect x="850" y="300" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="363" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">合并后数值差 100 倍</text></g></svg>

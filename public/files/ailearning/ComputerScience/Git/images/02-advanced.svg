<svg xmlns="http://www.w3.org/2000/svg" width="1216.000" height="587.733" viewBox="18.133 109.867 1216.000 587.733" role="img" aria-labelledby="title desc"><title id="title">没有文本冲突，也可能把两个正确模块接成错误程序</title><desc id="desc">没有文本冲突，也可能把两个正确模块接成错误程序 没有文本冲突，也可能把两个正确模块接成错误程序 验证新增的连接：把真实生产者输出送入真实消费者；通过旧输入不等于通过新接口。</desc><rect width="1216.0" height="587.733" fill="white" x="18.133" y="109.867" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="45" y="160" font-size="29" fill="#286da2" text-anchor="start" font-weight="600">旧样本单元测试</text><rect x="45" y="192" width="410" height="68" fill="#edf4f9" stroke="#286da2" stroke-width="2" /><text x="65" y="236" font-size="27" fill="#286da2" text-anchor="start" font-weight="400">测试自己造 {'price':3}</text><path d="M465 225L550 225" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><rect x="565" y="192" width="435" height="68" fill="#edf4f9" stroke="#286da2" stroke-width="2" /><text x="580" y="236" font-size="27" fill="#286da2" text-anchor="start" font-weight="400">double: 2 × row['price']</text><path d="M1010 225L1070 225" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)" /><text x="1090" y="237" font-size="29" fill="#286da2" text-anchor="start" font-weight="400">6：通过</text><text x="45" y="365" font-size="29" fill="#c96e32" text-anchor="start" font-weight="600">自动合并后真实调用</text><rect x="45" y="397" width="410" height="68" fill="#edf4f9" stroke="#c96e32" stroke-width="2" /><text x="65" y="441" font-size="27" fill="#c96e32" text-anchor="start" font-weight="400">make_row: {'amount':3}</text><path d="M465 430L550 430" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><rect x="565" y="397" width="435" height="68" fill="#edf4f9" stroke="#c96e32" stroke-width="2" /><text x="580" y="441" font-size="27" fill="#c96e32" text-anchor="start" font-weight="400">double: 2 × row['price']</text><path d="M1010 430L1070 430" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)" /><text x="1090" y="442" font-size="29" fill="#c96e32" text-anchor="start" font-weight="400">KeyError</text><text x="45" y="570" font-size="29" fill="#31877b" text-anchor="start" font-weight="600">修复字段迁移后</text><rect x="45" y="602" width="410" height="68" fill="#edf4f9" stroke="#31877b" stroke-width="2" /><text x="65" y="646" font-size="27" fill="#31877b" text-anchor="start" font-weight="400">make_row: {'amount':3}</text><path d="M465 635L550 635" fill="none" stroke="#31877b" stroke-width="3" marker-end="url(#arrow)" /><rect x="565" y="602" width="435" height="68" fill="#edf4f9" stroke="#31877b" stroke-width="2" /><text x="580" y="646" font-size="27" fill="#31877b" text-anchor="start" font-weight="400">double: 2 × row['amount']</text><path d="M1010 635L1070 635" fill="none" stroke="#31877b" stroke-width="3" marker-end="url(#arrow)" /><text x="1090" y="647" font-size="29" fill="#31877b" text-anchor="start" font-weight="400">6：通过</text></g></svg>

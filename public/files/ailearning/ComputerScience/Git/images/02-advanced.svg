<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="52" font-family="Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#18354a" text-anchor="start" font-weight="700">文本合并成功，为什么两个“通过”的模块仍接不上？</text><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">第 8 节实际实验：main 改生产者字段，consumer 分支新增旧字段读取。</text><rect x="44" y="170" width="360" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="224.0" y="203" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">检查对象</text><rect x="404" y="170" width="300" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="554.0" y="203" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">实际输入</text><rect x="704" y="170" width="290" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="849.0" y="203" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">消费者读取</text><rect x="994" y="170" width="205" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3"/><text x="1096.5" y="203" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">结果</text><rect x="44" y="219" width="360" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="224.0" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">消费者单测（旧样本）</text><rect x="404" y="219" width="300" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="554.0" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">{&#x27;price&#x27;: 3}</text><rect x="704" y="219" width="290" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="849.0" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">2 × row[&#x27;price&#x27;]</text><rect x="994" y="219" width="205" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1096.5" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">6</text><rect x="44" y="268" width="360" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="224.0" y="301" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">合并后真实闭环</text><rect x="404" y="268" width="300" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="554.0" y="301" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">{&#x27;amount&#x27;: 3}</text><rect x="704" y="268" width="290" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="849.0" y="301" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">2 × row[&#x27;price&#x27;]</text><rect x="994" y="268" width="205" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1096.5" y="301" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">KeyError</text><rect x="44" y="317" width="360" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="224.0" y="350" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">修复后真实闭环</text><rect x="404" y="317" width="300" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="554.0" y="350" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">{&#x27;amount&#x27;: 3}</text><rect x="704" y="317" width="290" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="849.0" y="350" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#2676b5" text-anchor="middle" font-weight="400">2 × row[&#x27;amount&#x27;]</text><rect x="994" y="317" width="205" height="49" rx="0" fill="white" stroke="#b7c7d3"/><text x="1096.5" y="350" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#2676b5" text-anchor="middle" font-weight="400">6</text><text x="44" y="460" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">Git 能组合不同文件的文本，却不会替生产者与消费者建立字段迁移协议。</text><text x="44" y="528" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">旧样本单测仍为 6，不代表真实 make_row() → double(...) 可以运行。</text><line x1="44" y1="580" x2="1236" y2="580" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="44" y="641" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#2676b5" text-anchor="start" font-weight="400">把真实生产者输出送给真实消费者，才覆盖本次新增的接口连接。</text><text x="44" y="710" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">单位、类别编号和归一化的错配可能不报异常，还要继续核对数值含义。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img"><title>反向一个提交的改动仍保留后来独立字段的变化</title><rect width="1320" height="900" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">x、y 位于不同文件；只撤销 B 对 x 的修改</text><circle cx="170" cy="180" r="40" fill="white" stroke="#176b91" stroke-width="2"/><text x="170" y="192" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">A</text><rect x="80" y="320" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="170" y="378" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">x = 1</text><rect x="80" y="455" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="170" y="513" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">y = 0</text><line x1="170" y1="225" x2="170" y2="305" stroke="#80929d" stroke-width="2"/><circle cx="490" cy="180" r="40" fill="white" stroke="#176b91" stroke-width="2"/><text x="490" y="192" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">B</text><line x1="440" y1="180" x2="225" y2="180" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="335" y="145" font-size="25" fill="#80929d" text-anchor="middle" font-weight="400">parent</text><rect x="400" y="320" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="490" y="378" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">x = 2</text><rect x="400" y="455" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="490" y="513" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">y = 0</text><line x1="490" y1="225" x2="490" y2="305" stroke="#80929d" stroke-width="2"/><circle cx="810" cy="180" r="40" fill="white" stroke="#176b91" stroke-width="2"/><text x="810" y="192" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">C</text><line x1="760" y1="180" x2="545" y2="180" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="655" y="145" font-size="25" fill="#80929d" text-anchor="middle" font-weight="400">parent</text><rect x="720" y="320" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="810" y="378" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">x = 2</text><rect x="720" y="455" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#218579" stroke-width="2"/><text x="810" y="513" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">y = 5</text><line x1="810" y1="225" x2="810" y2="305" stroke="#80929d" stroke-width="2"/><circle cx="1130" cy="180" r="40" fill="white" stroke="#d87332" stroke-width="2"/><text x="1130" y="192" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">R</text><line x1="1080" y1="180" x2="865" y2="180" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="975" y="145" font-size="25" fill="#80929d" text-anchor="middle" font-weight="400">parent</text><rect x="1040" y="320" width="180" height="90" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1130" y="378" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">x = 1</text><rect x="1040" y="455" width="180" height="90" rx="4" fill="#eaf4fa" stroke="#218579" stroke-width="2"/><text x="1130" y="513" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">y = 5</text><line x1="1130" y1="225" x2="1130" y2="305" stroke="#80929d" stroke-width="2"/><text x="165" y="640" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">初始快照</text><text x="490" y="640" font-size="28" fill="#176b91" text-anchor="middle" font-weight="400">B：只改 x</text><text x="810" y="640" font-size="28" fill="#218579" text-anchor="middle" font-weight="400">C：只改 y</text><text x="1130" y="640" font-size="28" fill="#218579" text-anchor="middle" font-weight="400">R：保留 y=5</text><rect x="230" y="720" width="860" height="90" rx="4" fill="white" stroke="#d87332" stroke-width="2"/><text x="660" y="778" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">对 B 的反向变化：x = 2 → 1；不回滚 C 的 y = 5</text></g></svg>
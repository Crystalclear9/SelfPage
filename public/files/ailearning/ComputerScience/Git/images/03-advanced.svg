<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1023.9624" viewBox="0 0 1440 1023.9624" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三种 reset 模式影响不同状态层</title><rect width="1440" height="1023.9624" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">三种 reset 模式影响不同状态层</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="881.9624" viewBox="21.25 71.25 1396.25 916.25" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1396.25" height="916.25" fill="white" x="21.25" y="71.25"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">目标提交 A；当前分支在 B，索引已暂存 C，工作区继续编辑成 D</text><text xml:space="preserve" x="50" y="185" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">四个字母表示 state.txt 的不同内容；每种模式都从同一个起点出发</text><text xml:space="preserve" x="570" y="255" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">HEAD 文件</text><text xml:space="preserve" x="960" y="255" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">索引文件</text><text xml:space="preserve" x="1310" y="255" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">工作区文件</text><text xml:space="preserve" x="55" y="360" font-size="31" fill="#1f3348" text-anchor="start" font-weight="400">共同起点</text><circle cx="570" cy="350" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="570" y="363" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">B</text><circle cx="960" cy="350" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="960" y="363" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">C</text><circle cx="1310" cy="350" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1310" y="363" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">D</text><text xml:space="preserve" x="55" y="535" font-size="31" fill="#1f3348" text-anchor="start" font-weight="400">soft → A</text><circle cx="570" cy="525" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="570" y="538" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="570" y="604" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text><circle cx="960" cy="525" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="960" y="538" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">C</text><text xml:space="preserve" x="960" y="604" font-size="27" fill="#67889b" text-anchor="middle" font-weight="400">保留原 C</text><circle cx="1310" cy="525" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1310" y="538" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">D</text><text xml:space="preserve" x="1310" y="604" font-size="27" fill="#67889b" text-anchor="middle" font-weight="400">保留原 D</text><text xml:space="preserve" x="55" y="710" font-size="31" fill="#1f3348" text-anchor="start" font-weight="400">mixed → A</text><circle cx="570" cy="700" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="570" y="713" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="570" y="779" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text><circle cx="960" cy="700" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="960" y="713" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="960" y="779" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text><circle cx="1310" cy="700" r="43" fill="#f3f5f6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1310" y="713" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">D</text><text xml:space="preserve" x="1310" y="779" font-size="27" fill="#67889b" text-anchor="middle" font-weight="400">保留原 D</text><text xml:space="preserve" x="55" y="885" font-size="31" fill="#1f3348" text-anchor="start" font-weight="400">hard → A</text><circle cx="570" cy="875" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="570" y="888" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="570" y="954" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text><circle cx="960" cy="875" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="960" y="888" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="960" y="954" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text><circle cx="1310" cy="875" r="43" fill="#ddecf6" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="1310" y="888" font-size="38" fill="#1f3348" text-anchor="middle" font-weight="400">A</text><text xml:space="preserve" x="1310" y="954" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">取目标 A</text></g><desc> reset：起点不干净时，必须分别追踪三份内容</desc></svg></svg>

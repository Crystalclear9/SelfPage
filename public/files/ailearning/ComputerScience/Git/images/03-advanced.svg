<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792.45" viewBox="17.00 14.00 1113.00 735.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">三种 reset 模式影响不同状态层</title><desc id="desc">把三个状态层并排后，可以清楚看到 soft 只移动当前分支位置，mixed 还重设索引，hard 进一步重设跟踪文件的工作区状态。应先确定想改变哪一层，再选择操作。 图针对通常附着在分支上的完整提交目标形式，省略路径形式和其他选项。hard 会丢弃相关未提交修改；这里仅作教材机制图，不执行任何仓库撤销操作。 针对受跟踪状态的示意；未跟踪文件及阻挡路径需另行处理。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">三种 reset 模式影响不同状态层</text><text x="80" y="207" font-size="24" fill="#627689" text-anchor="start" font-weight="400">reset 模式</text><text x="440" y="207" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">分支引用</text><text x="710" y="207" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">索引</text><text x="980" y="207" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">工作区</text><text x="90" y="315" font-size="27" fill="#213447" text-anchor="start" font-weight="400">soft</text><rect x="310" y="260" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="318" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><rect x="580" y="260" width="250" height="100" fill="#eef2f7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="705" y="318" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">保留</text><rect x="850" y="260" width="250" height="100" fill="#eef2f7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="975" y="318" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">保留</text><text x="90" y="445" font-size="27" fill="#213447" text-anchor="start" font-weight="400">mixed</text><rect x="310" y="390" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="448" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><rect x="580" y="390" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="705" y="448" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><rect x="850" y="390" width="250" height="100" fill="#eef2f7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="975" y="448" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">保留</text><text x="90" y="575" font-size="27" fill="#213447" text-anchor="start" font-weight="400">hard</text><rect x="310" y="520" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="578" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><rect x="580" y="520" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="705" y="578" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><rect x="850" y="520" width="250" height="100" fill="#d3eae3" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="975" y="578" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">改到目标</text><text x="125" y="710" font-size="24" fill="#627689" text-anchor="start" font-weight="400">绿色：重设到目标提交；浅灰：保留原状态。</text></g></svg>

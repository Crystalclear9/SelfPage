<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582" role="img" aria-labelledby="title description">
<title id="title">三种 reset 模式影响不同状态层</title>
<desc id="description">三种模式都从 HEAD 内容 B、索引 C、工作区 D 出发。重置到 A 时，soft 只改变 HEAD，mixed 同时改变索引，hard 还重置工作区。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="582" fill="white" stroke="none" stroke-width="1.6"/>
<text x="424" y="66" fill="#212c39" font-size="34" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">HEAD</text>
<path d="M424 88L424 499" stroke="#e0e8ec" stroke-width="1.6" fill="none" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="715" y="66" fill="#212c39" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">索引</text>
<path d="M715 88L715 499" stroke="#e0e8ec" stroke-width="1.6" fill="none" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1006" y="66" fill="#212c39" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">工作区</text>
<path d="M1006 88L1006 499" stroke="#e0e8ec" stroke-width="1.6" fill="none" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="164" fill="#212c39" font-size="32" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">共同起点</text>
<path d="M330 181l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424" y="163" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B</text>
<path d="M621 181l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="715" y="163" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">C</text>
<path d="M912 181l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1006" y="163" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">D</text>
<text x="102" y="274" fill="#212c39" font-size="32" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">soft</text>
<path d="M330 291l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424" y="273" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M621 291l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="715" y="273" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">C</text>
<path d="M912 291l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1006" y="273" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">D</text>
<text x="102" y="384" fill="#212c39" font-size="32" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">mixed</text>
<path d="M330 401l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424" y="383" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M621 401l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="715" y="383" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M912 401l26 -58h162l-26 58Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1006" y="383" fill="#536777" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">D</text>
<text x="102" y="494" fill="#212c39" font-size="32" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">hard</text>
<path d="M330 511l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424" y="493" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M621 511l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="715" y="493" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M912 511l26 -58h162l-26 58Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1006" y="493" fill="#176b73" font-size="33" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<path d="M331 557l14 -25h47l-14 25Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="406" y="553" fill="#176b73" font-size="26" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">重置到目标 A</text>
<path d="M677 557l14 -25h47l-14 25Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="750" y="553" fill="#536777" font-size="26" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">保持原内容</text>
</svg>

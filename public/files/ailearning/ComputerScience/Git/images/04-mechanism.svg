<svg xmlns="http://www.w3.org/2000/svg" width="1466.250" height="876.250" viewBox="20.000 71.250 1466.250 876.250"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1466.25" height="876.25" fill="white" x="20.0" y="71.25" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="125" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">A、B 是已有提交身份；横线表示时间推进，不表示提交父引用</text><text xml:space="preserve" x="410" y="230" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">初次同步</text><text xml:space="preserve" x="740" y="230" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">他人 push B</text><text xml:space="preserve" x="1070" y="230" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">本地 fetch</text><text xml:space="preserve" x="1400" y="230" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">快进整合</text><text xml:space="preserve" x="50" y="360" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">服务器 main</text><line x1="340" y1="350" x2="1445" y2="350" stroke="#c9d8e1" stroke-width="3" stroke-dasharray="" /><circle cx="410" cy="350" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="410" y="362" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="740" cy="350" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="740" y="362" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><circle cx="1070" cy="350" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1070" y="362" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><circle cx="1400" cy="350" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1400" y="362" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><text xml:space="preserve" x="50" y="570" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">本地 origin/main</text><line x1="340" y1="560" x2="1445" y2="560" stroke="#c9d8e1" stroke-width="3" stroke-dasharray="" /><circle cx="410" cy="560" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="410" y="572" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="740" cy="560" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="740" y="572" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="1070" cy="560" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1070" y="572" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><circle cx="1400" cy="560" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1400" y="572" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><text xml:space="preserve" x="50" y="780" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">本地 main / 文件</text><line x1="340" y1="770" x2="1445" y2="770" stroke="#c9d8e1" stroke-width="3" stroke-dasharray="" /><circle cx="410" cy="770" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="410" y="782" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="740" cy="770" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="740" y="782" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="1070" cy="770" r="39" fill="#f2f5f6" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1070" y="782" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="1400" cy="770" r="39" fill="#e3f0f9" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="1400" y="782" font-size="35" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><line x1="1070" y1="395" x2="1070" y2="430" stroke="#2676ad" stroke-width="4" /><line x1="1070" y1="490" x2="1070" y2="515" stroke="#2676ad" stroke-width="4" marker-end="url(#arrow)" /><text xml:space="preserve" x="880" y="469" font-size="25" fill="#193a4e" text-anchor="start" font-weight="400">获取对象，更新观察</text><line x1="1400" y1="605" x2="1400" y2="725" stroke="#c46c22" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1120" y="685" font-size="27" fill="#c46c22" text-anchor="start" font-weight="400">显式快进</text><text xml:space="preserve" x="50" y="910" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">fetch 完成时：origin/main=B，但 main=A，工作文件仍来自 A。</text></g><desc> fetch 更新观察；整合才推进本地分支与工作文件 只有后续整合到 B，本地 main 与文件内容才一起前进。</desc></svg>

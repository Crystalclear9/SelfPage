<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title id="figure-title">远程跟踪引用保存最近一次观察到的位置</title><desc id="figure-desc">t0 时服务器 main 与本地 origin/main 都在 A。别人推送 B 后，服务器前进，但本地跟踪引用仍为 A；到 t2 再执行 fetch，本地才记录 B。origin/main 是本地引用，不是对服务器状态的实时查询；fetch 本身也不会自动把当前工作分支整合到 B。</desc><rect x="0" y="0" width="1200" height="560" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">远程跟踪引用保存最近一次观察到的位置</text><text x="35" y="210" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">服务器 main</text><text x="35" y="370" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">本地 origin/main</text><text x="365" y="112" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">t0：已 fetch</text><rect x="365" y="165" width="190" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="460.0" y="215.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">A</text><rect x="365" y="325" width="190" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="460.0" y="375.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">A</text><path d="M565 205 L615 205" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M565 365 L615 365" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="635" y="112" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">t1：别人推送</text><rect x="635" y="165" width="190" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="730.0" y="215.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">B</text><rect x="635" y="325" width="190" height="80" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="730.0" y="375.0" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">A</text><path d="M835 205 L885 205" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M835 365 L885 365" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="905" y="112" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">t2：再次 fetch</text><rect x="905" y="165" width="190" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1000.0" y="215.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">B</text><rect x="905" y="325" width="190" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1000.0" y="375.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">B</text><path d="M1000 260 L1000 310" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="375" y="490" font-size="28" fill="#213447" text-anchor="start" font-weight="400">服务器变化后，本地跟踪引用需经 fetch 才更新。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">提交、树与内容对象承担不同角色</title><desc id="desc">两个提交各自指向一棵树，树通过目录项关联内容对象。不同快照中相同文件内容可以复用同一个 blob，因此提交不是把所有文件简单复制成一套独立字节。 箭头表示对象引用方向。这里为突出内容复用省略父提交和其他文件；树对象还记录路径名、模式等信息，相同 blob 并不意味着整个项目快照相同。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">提交、树与内容对象承担不同角色</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">树保存名称到对象的引用；相同文件内容可复用同一 blob。</text><path d="M335,230 L440,230" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,505 L440,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M725,278.703 L835,316.297" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M725,454.494 L835,415.506" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">提交 C1</text><rect x="50" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">提交 C2</text><rect x="440" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="238" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">树 T1</text><rect x="440" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">树 T2</text><rect x="835" y="310" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="977.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">相同内容 blob B</text></g></svg>

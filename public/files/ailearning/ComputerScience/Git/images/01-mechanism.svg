<svg xmlns="http://www.w3.org/2000/svg" width="1240.533" height="476.026" viewBox="21.333 66.174 1240.533 476.026" role="img"><title>文件改名：树条目变化，内容对象仍可复用</title><rect width="1240.533" height="476.026" fill="white" x="21.333" y="66.174" /><g font-family="Microsoft YaHei, sans-serif"><text x="45" y="115" font-size="27" fill="#233943" text-anchor="start">同一文件字节：score=1\n；从 alpha.txt 改名为 beta.txt</text><circle cx="140" cy="240" r="42" fill="#276884" /><text x="140" y="250" font-size="28" fill="white" text-anchor="middle">C1</text><circle cx="140" cy="470" r="42" fill="#b25d2b" /><text x="140" y="480" font-size="28" fill="white" text-anchor="middle">C2</text><line x1="140" y1="425" x2="140" y2="285" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray="" /><polygon points="140,285 144.6730201077038,296.05273192803463 135.3269798922962,296.05273192803463" fill="#b25d2b" /><text x="170" y="365" font-size="25" fill="#b25d2b" text-anchor="start">parent</text><line x1="185" y1="240" x2="335" y2="240" stroke="#276884" stroke-width="2.5" stroke-dasharray="" /><polygon points="335,240 323.94726807196537,244.6730201077038 323.94726807196537,235.3269798922962" fill="#276884" /><text x="355" y="175" font-size="28" fill="#276884" text-anchor="start">树 T1</text><rect x="355" y="200" width="430" height="85" fill="#f8fafb" stroke="#dce5e8" stroke-width="2" /><text x="375" y="252" font-size="27" fill="#276884" text-anchor="start">100644   alpha.txt → B</text><line x1="790" y1="240" x2="970" y2="355" stroke="#276884" stroke-width="2.5" stroke-dasharray="" /><polygon points="970,355 958.1700002258683,352.98726421404996 963.2018080612097,345.1113910804721" fill="#276884" /><line x1="185" y1="470" x2="335" y2="470" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray="" /><polygon points="335,470 323.94726807196537,474.6730201077038 323.94726807196537,465.3269798922962" fill="#b25d2b" /><text x="355" y="405" font-size="28" fill="#b25d2b" text-anchor="start">树 T2</text><rect x="355" y="430" width="430" height="85" fill="#f8fafb" stroke="#dce5e8" stroke-width="2" /><text x="375" y="482" font-size="27" fill="#b25d2b" text-anchor="start">100644   beta.txt → B</text><line x1="790" y1="470" x2="970" y2="355" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray="" /><polygon points="970,355 963.2018080612097,364.8886089195279 958.1700002258683,357.01273578595004" fill="#b25d2b" /><rect x="980" y="285" width="255" height="140" fill="#edf4f7" stroke="#dce5e8" stroke-width="2" /><text x="1005" y="325" font-size="29" fill="#276884" text-anchor="start">blob B</text><text x="1005" y="385" font-size="28" fill="#233943" text-anchor="start">score=1\n</text></g><desc> 文件改名：树条目变化，内容对象仍可复用 树记录名称与模式；blob 只保存字节内容，不保存文件名。</desc></svg>

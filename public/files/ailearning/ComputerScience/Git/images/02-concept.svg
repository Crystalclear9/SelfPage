xt><circle cx="700" cy="350" r="55" fill="white" stroke="#176b91" stroke-width="2"/><text x="700" y="366" font-size="40" fill="#176b91" text-anchor="middle" font-weight="400">B</text><circle cx="1350" cy="220" r="55" fill="white" stroke="#d87332" stroke-width="2"/><text x="1350" y="236" font-size="40" fill="#d87332" text-anchor="middle" font-weight="400">M</text><text x="1550" y="150" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">parent[0] = A</text><text x="1550" y="340" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">parent[1] = B</text><text x="330" y="570" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">共同祖先 O</text><rect x="110" y="620" width="440" height="110" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="330" y="688" font-size="40" fill="#176b91" text-anchor="middle" font-weight="400">x = 1</text><text x="900" y="570" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">当前侧 A</text><rect x="680" y="620" width="440" height="110" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="900" y="688" font-size="40" fill="#176b91" text-anchor="middle" font-weight="400">x = 2</text><text x="900" y="800" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">相对 O：1 → 2</text><text x="1470" y="570" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">合入侧 B</text><rect x="1250" y="620" width="440" height="110" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1470" y="688" font-size="40" fill="#176b91" text-anchor="middle" font-weight="400">x = 3</text><text x="1470" y="800" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">相对 O：1 → 3</text><text x="880" y="900" font-size="35" fill="#d87332" text-anchor="middle" font-weight="400">人工决定：x = 4</text><line x1="900" y1="940" x2="900" y2="1000" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><rect x="570" y="1030" width="660" height="120" rx="4
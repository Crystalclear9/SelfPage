<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：从共同祖先 O 同时沿两条分支前进：同一行分别被改为 x=2 和 x=3</title><desc id="detail-desc">从共同祖先 O 同时沿两条分支前进：同一行分别被改为 x=2 和 x=3。合并必须参考共同基线和双方语义；图中箭头用于展示历史演进，实际提交对象持有指向父提交的引用。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><path d="M132,200 L352,85" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M132,200 L352,315" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M422,85 L692,200" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M422,315 L692,200" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><circle cx="100" cy="200" r="33" fill="#2865a0" stroke="white" stroke-width="2" /><text x="100" y="207" font-size="22" fill="white" font-weight="700" text-anchor="middle">O</text><circle cx="390" cy="85" r="33" fill="#2865a0" stroke="white" stroke-width="2" /><text x="390" y="92" font-size="22" fill="white" font-weight="700" text-anchor="middle">A</text><circle cx="390" cy="315" r="33" fill="#2865a0" stroke="white" stroke-width="2" /><text x="390" y="322" font-size="22" fill="white" font-weight="700" text-anchor="middle">B</text><circle cx="730" cy="200" r="33" fill=
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">三方合并：先识别共同基线，再决定最终内容</text><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">提交图中的箭头指向父提交；O 是 A、B 的共同祖先</text><line x1="548.2246254323254" y1="240.1891157482133" x2="223.71841524524083" y2="319.3369718914047" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="548.2246254323254" y1="419.8108842517867" x2="223.71841524524083" y2="340.6630281085953" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="988.0692872009672" y1="320.4702925456744" x2="633.8809785106157" y2="239.97294966150358" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="988.0692872009672" y1="339.5297074543256" x2="633.8809785106157" y2="420.02705033849645" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="180" cy="330" r="42" fill="#eaf3f9" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="180" y="343" font-size="36" fill="#193a4e" text-anchor="middle" font-weight="400">O</text><circle cx="590" cy="230" r="42" fill="#eaf3f9" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="590" y="243" font-size="36" fill="#193a4e" text-anchor="middle" font-weight="400">A</text><circle cx="590" cy="430" r="42" fill="#eaf3f9" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="590" y="443" font-size="36" fill="#193a4e" text-anchor="middle" font-weight="400">B</text><circle cx="1030" cy="330" r="42" fill="#fff0df" stroke="#8ca5b4" stroke-width="2"/><text xml:space="preserve" x="1030" y="343" font-size="36" fill="#193a4e" text-anchor="middle" font-weight="400">M</text><text xml:space="preserve" x="1120" y="325" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">M 第一父为 A</text><text xml:space="preserve" x="1120" y="370" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">第二父为 B</text><text xml:space="preserve" x="80" y="565" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">共同祖先 O</text><rect x="80" y="600" width="350" height="120" rx="0" fill="#fafcfd" stroke="#b6c9d5" stroke-width="2"/><text xml:space="preserve" x="115" y="672" font-size="40" fill="#193a4e" text-anchor="start" font-weight="400">x=1</text><text xml:space="preserve" x="535" y="565" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">当前侧 A</text><rect x="535" y="600" width="350" height="120" rx="0" fill="#fafcfd" stroke="#b6c9d5" stroke-width="2"/><text xml:space="preserve" x="570" y="672" font-size="40" fill="#2676ad" text-anchor="start" font-weight="400">x=2</text><text xml:space="preserve" x="535" y="765" font-size="27" fill="#2676ad" text-anchor="start" font-weight="400">相对 O：1 → 2</text><text xml:space="preserve" x="990" y="565" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">合入侧 B</text><rect x="990" y="600" width="350" height="120" rx="0" fill="#fafcfd" stroke="#b6c9d5" stroke-width="2"/><text xml:space="preserve" x="1025" y="672" font-size="40" fill="#2676ad" text-anchor="start" font-weight="400">x=3</text><text xml:space="preserve" x="990" y="765" font-size="27" fill="#2676ad" text-anchor="start" font-weight="400">相对 O：1 → 3</text><path d="M710,810 L710,860" stroke="#c46c22" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="810" y="846" font-size="30" fill="#c46c22" text-anchor="start" font-weight="400">同一行改成不同值：需要明确决策</text><text xml:space="preserve" x="50" y="930" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">例如业务选择 x=4 后再暂存、提交；它不是 Git 从 2 与 3 自动算出的答案。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="996.48" height="691.30800" viewBox="-18.24 28.76 996.48 691.30800" role="img" aria-labelledby="artwork-title"><title id="artwork-title">合并冲突：三份输入合成为一份暂存结果</title><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="683.549028"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="770.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="734" viewBox="0 47 960 734" overflow="hidden"><rect width="960" height="781" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf1ec"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>合并冲突：三份输入合成为一份暂存结果</title><svg aria-labelledby="figure-title figure-desc" width="1440" height="631.664" viewBox="10.000 68.000 1190.000 522.000" role="img"><title id="figure-title">合并冲突：三份输入合成为一份暂存结果</title><desc id="figure-desc">图中对应本节普通 merge 实验：stage 1 保存共同祖先，stage 2 保存当前 main 一侧，stage 3 保存合入 topic 一侧。人工在工作区写入预先约定的 blue-green，再执行 git add，未合并的阶段条目被正常的 stage 0 结果替代；之后还需 commit 才记录合并历史。stage 0 不是第四个冲突候选。这个图固定为普通合并语境，变基等操作中 ours/theirs 的角色应按实际操作解释。 合并冲突：三份输入合成为一份暂存结果</desc><rect width="1190.0" height="522.0" fill="#ffffff" x="10.0" y="68.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2e77a6"/></marker><marker id="arrow-orange" markerWidth="7" markerHei
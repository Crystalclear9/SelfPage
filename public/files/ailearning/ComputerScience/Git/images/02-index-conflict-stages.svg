<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1081.66" viewBox="0 0 1440 1081.66" role="img"><title>合并冲突：三份输入合成为一份暂存结果</title><svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1440" height="631.664" viewBox="10.000 68.000 1190.000 522.000" role="img"><title id="figure-title">合并冲突：三份输入合成为一份暂存结果</title><desc id="figure-desc">图中对应本节普通 merge 实验：stage 1 保存共同祖先，stage 2 保存当前 main 一侧，stage 3 保存合入 topic 一侧。人工在工作区写入预先约定的 blue-green，再执行 git add，未合并的阶段条目被正常的 stage 0 结果替代；之后还需 commit 才记录合并历史。stage 0 不是第四个冲突候选。这个图固定为普通合并语境，变基等操作中 ours/theirs 的角色应按实际操作解释。 合并冲突：三份输入合成为一份暂存结果</desc><rect width="1190.0" height="522.0" fill="white" x="10.0" y="68.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 1：共同祖先</text><rect x="35" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="210.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=red</text><path d="M210 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="430" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 2：当前侧</text><rect x="430" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="605.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=blue</text><path d="M605 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="825" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 3：合入侧</text><rect x="825" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1000.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=green</text><path d="M1000 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="35" y="367" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">工作区：人工确定解决内容</text><rect x="465" y="320" width="370" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="650.0" y="366.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">color=blue-green</text><path d="M650 410 L650 475" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="715" y="455" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">git add</text><text x="35" y="535" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">索引 stage 0：已解决</text><rect x="465" y="490" width="370" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="650.0" y="536.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">color=blue-green</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 631.664) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">重放时的 ours / theirs 以当前操作为准，不能只凭分支名字猜</text><rect x="65" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="276.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">重放原提交 X</text><rect x="495" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="706.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">放到上游 Y 之后</text><rect x="925" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1136.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">发生冲突</text><text x="65" y="275" font-size="29" fill="#216c89" text-anchor="start">stage2 / ours：当前已检出的上游 Y 加此前重放结果</text><text x="65" y="345" font-size="29" fill="#c96937" text-anchor="start">stage3 / theirs：本次正在重放的原提交 X</text><text x="65" y="420" font-size="27" fill="#203742" text-anchor="start">这些名字不是“我的所有修改 / 别人的所有修改”的固定标签；先核对内容与操作。</text></g></g></svg>

ke="#227199" stroke-width="2.8" marker-end="url(#arrow-blue)" x1="650" y1="410" x2="650" y2="475"/><text x="715" y="455" font-size="28" fill="#2e77a6" text-anchor="start" font-weight="400">git add</text><text x="35" y="535" font-size="28" fill="#2e77a6" text-anchor="start" font-weight="400">索引 stage 0：已解决</text><rect x="465" y="490" width="370" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#227199" stroke-width="1.5"/><text x="650.0" y="536.95" font-size="27" fill="#2e77a6" text-anchor="middle" font-weight="400">color=blue-green</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 631.664) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dbe8eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start">重放时的 ours / theirs 以当前操作为准，不能只凭分支名字猜</text><rect x="65" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="276.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">重放原提交 X</text><rect x="495" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="706.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">放到上游 Y 之后</text><rect x="925" y="145" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="1136.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">发生冲突</text><text x="65" y="275" font-size="37.41px" fill="#277290" text-anchor="start">stage2 / ours：当前已检出的上游 Y 加此前重放结果</text><text x="65" y="345" font-size="37.41px" fill="#a55f3a" text-anchor="start">stage3 / theirs：本次正在重放的原提交 X</text></g></g></g></g></g></svg></svg>

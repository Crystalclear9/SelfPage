<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title id="figure-title">合并冲突：三份输入合成为一份暂存结果</title><desc id="figure-desc">图中对应本节普通 merge 实验：stage 1 保存共同祖先，stage 2 保存当前 main 一侧，stage 3 保存合入 topic 一侧。人工在工作区写入预先约定的 blue-green，再执行 git add，未合并的阶段条目被正常的 stage 0 结果替代；之后还需 commit 才记录合并历史。stage 0 不是第四个冲突候选。这个图固定为普通合并语境，变基等操作中 ours/theirs 的角色应按实际操作解释。</desc><rect width="1200" height="640" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">合并冲突：三份输入合成为一份暂存结果</text><text x="35" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 1：共同祖先</text><rect x="35" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="210.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=red</text><path d="M210 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="430" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 2：当前侧</text><rect x="430" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="605.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=blue</text><path d="M605 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="825" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">stage 3：合入侧</text><rect x="825" y="150" width="350" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1000.0" y="197.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">color=green</text><path d="M1000 240 L600 315" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="35" y="367" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">工作区：人工确定解决内容</text><rect x="465" y="320" width="370" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="650.0" y="366.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">color=blue-green</text><path d="M650 410 L650 475" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="715" y="455" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">git add</text><text x="35" y="535" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">索引 stage 0：已解决</text><rect x="465" y="490" width="370" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="650.0" y="536.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">color=blue-green</text></g></svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="758.2222" viewBox="0 0 1440 758.2222" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两个核分别写不同计数器，仍可能争用同一条缓存线</title><rect width="1440" height="758.2222" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两个核分别写不同计数器，仍可能争用同一条缓存线</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="616.2222" viewBox="18.133 60.788 1223.467 560.958" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">不同计数器，也可能争用同一条缓存线</title><desc id="desc">不同计数器，也可能争用同一条缓存线 不同计数器，也可能争用同一条缓存线</desc><rect width="1223.467" height="560.958" fill="white" x="18.133" y="60.788"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="45" y="110" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">64 字节缓存线；a、b 各占 8 字节，两核分别写自己的计数器</text><text x="45" y="157" font-size="30" fill="#1f3348" text-anchor="start" font-weight="600">同线放置</text><rect x="45" y="175" width="1170" height="64" fill="#f6f8fa" stroke="#748e9f" stroke-width="2"/><rect x="45" y="175" width="146" height="64" fill="#ddecf6" stroke="none" stroke-width="2"/><rect x="191" y="175" width="146" height="64" fill="#f9e7da" stroke="none" stroke-width="2"/><text x="118" y="217" font-size="32" fill="#2479b3" text-anchor="middle" font-weight="400">a</text><text x="264" y="217" font-size="32" fill="#c56f36" text-anchor="middle" font-weight="400">b</text><text x="740" y="217" font-size="26" fill="#748e9f" text-anchor="middle" font-weight="400">其余 48 字节</text><text x="150" y="300" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">核 0 写 a</text><text x="445" y="300" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">核 1 写 b</text><text x="740" y="300" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">核 0 写 a</text><text x="1035" y="300" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">核 1 写 b</text><path d="M235 291L350 291" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 291L645 291" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><path d="M825 291L940 291" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="352" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">可写所有权随四次交替写入迁移 3 次</text><text x="45" y="387" font-size="30" fill="#1f3348" text-anchor="start" font-weight="600">分线放置</text><rect x="45" y="405" width="540" height="64" fill="#f6f8fa" stroke="#748e9f" stroke-width="2"/><rect x="675" y="405" width="540" height="64" fill="#f6f8fa" stroke="#748e9f" stroke-width="2"/><rect x="45" y="405" width="68" height="64" fill="#ddecf6" stroke="none" stroke-width="2"/><rect x="675" y="405" width="68" height="64" fill="#f9e7da" stroke="none" stroke-width="2"/><text x="79" y="447" font-size="32" fill="#2479b3" text-anchor="middle" font-weight="400">a</text><text x="709" y="447" font-size="32" fill="#c56f36" text-anchor="middle" font-weight="400">b</text><text x="345" y="447" font-size="26" fill="#748e9f" text-anchor="middle" font-weight="400">缓存线 0</text><text x="975" y="447" font-size="26" fill="#748e9f" text-anchor="middle" font-weight="400">缓存线 1</text><text x="300" y="530" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">核 0 保持对线 0 的可写所有权</text><text x="945" y="530" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">核 1 保持对线 1 的可写所有权</text><text x="630" y="592" font-size="27" fill="#748e9f" text-anchor="middle" font-weight="400">简化模型：首次取得所有权之后，没有其他访问或驱逐</text></g></svg></svg>

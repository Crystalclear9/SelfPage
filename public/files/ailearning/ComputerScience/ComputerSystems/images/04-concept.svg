<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="520.51" viewBox="1.33 -13.49 926.20 401.75" role="img"><title id="detail-title">机制展开：两个设备上都画出了同一逻辑梯度 (3,4)</title><desc id="detail-desc">两个设备上都画出了同一逻辑梯度 (3,4)。计算全局范数时须先消除副本重复，平方和为 25；若误把副本当作分片求和，则会得到错误的平方和 50。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="32" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">复制梯度：两设备持有同一逻辑向量</text><text x="30" y="130" font-size="24" fill="#213447" font-weight="400" text-anchor="start">设备 A</text><rect x="160" y="95" width="95" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="207.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">3</text><rect x="260" y="95" width="95" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="307.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">4</text><text x="30" y="270" font-size="24" fill="#213447" font-weight="400" text-anchor="start">设备 B</text><rect x="160" y="235" width="95" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="207.5" y="274.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">3</text><rect x="260" y="235" width="95" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="307.5" y="274.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">4</text><line x1="360" y1="124" x2="470" y2="190" stroke="#2865a0" stroke-width="3" /><line x1="360" y1="264" x2="470" y2="190" stroke="#2865a0" stroke-width="3" /><path d="M470,190 L610,190" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="650" y="125" font-size="26" fill="#158476" font-weight="600" text-anchor="start">每个坐标只计一次</text><text x="650" y="200" font-size="26" fill="#213447" font-weight="400" text-anchor="start">平方和：9 + 16 = 25</text><text x="650" y="260" font-size="29" fill="#158476" font-weight="600" text-anchor="start">正确范数：5</text><text x="650" y="350" font-size="26" fill="#cf7432" font-weight="400" text-anchor="start">重复计数会得到 √50</text></g></svg>

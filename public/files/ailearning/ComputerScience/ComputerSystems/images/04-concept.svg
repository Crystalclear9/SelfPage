<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><title>复制梯度与分片梯度的范数</title><rect width="1280" height="640" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">复制梯度与分片梯度的范数</text><line x1="640" y1="110" x2="640" y2="545" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="60" y="125" font-size="29" fill="#233943" text-anchor="start">复制：同一坐标有两个副本</text><text x="60" y="232" font-size="26" fill="#233943" text-anchor="start">设备 A</text><rect x="185" y="190" width="145" height="68" fill="#f6f9fa" stroke="#276884" stroke-width="2"/><text x="257" y="234" font-size="28" fill="#276884" text-anchor="middle">g1 = 3</text><rect x="350" y="190" width="145" height="68" fill="#f6f9fa" stroke="#b25d2b" stroke-width="2"/><text x="422" y="234" font-size="28" fill="#b25d2b" text-anchor="middle">g2 = 4</text><text x="60" y="347" font-size="26" fill="#233943" text-anchor="start">设备 B</text><rect x="185" y="305" width="145" height="68" fill="#f6f9fa" stroke="#276884" stroke-width="2"/><text x="257" y="349" font-size="28" fill="#276884" text-anchor="middle">g1 = 3</text><rect x="350" y="305" width="145" height="68" fill="#f6f9fa" stroke="#b25d2b" stroke-width="2"/><text x="422" y="349" font-size="28" fill="#b25d2b" text-anchor="middle">g2 = 4</text><text x="60" y="445" font-size="29" fill="#276884" text-anchor="start">只计一份：9 + 16 = 25</text><text x="60" y="500" font-size="26" fill="#b25d2b" text-anchor="start">误加副本：25 + 25 = 50</text><text x="700" y="125" font-size="29" fill="#233943" text-anchor="start">分片：每个坐标只存放一次</text><text x="700" y="232" font-size="26" fill="#233943" text-anchor="start">设备 A</text><rect x="825" y="190" width="145" height="68" fill="#f6f9fa" stroke="#276884" stroke-width="2"/><text x="897" y="234" font-size="28" fill="#276884" text-anchor="middle">g1 = 3</text><text x="700" y="347" font-size="26" fill="#233943" text-anchor="start">设备 B</text><rect x="825" y="305" width="145" height="68" fill="#f6f9fa" stroke="#b25d2b" stroke-width="2"/><text x="897" y="349" font-size="28" fill="#b25d2b" text-anchor="middle">g2 = 4</text><text x="700" y="445" font-size="29" fill="#276884" text-anchor="start">归约分片：9 + 16 = 25</text><text x="700" y="500" font-size="26" fill="#b25d2b" text-anchor="start">局部范数相加：3 + 4 ≠ 5</text><line x1="60" y1="555" x2="1220" y2="555" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="640" y="605" font-size="28" fill="#233943" text-anchor="middle">两种布局的逻辑梯度都是 (3, 4)，全局 L2 范数都是 √25 = 5</text></g></svg>

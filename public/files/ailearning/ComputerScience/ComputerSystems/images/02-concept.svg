<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="456.99" viewBox="10.80 63.32 972.59 370.38" role="img"><title id="detail-title">机制展开：沿有向边先执行 A，再让 B、C 并行，最后执行 D</title><desc id="detail-desc">沿有向边先执行 A，再让 B、C 并行，最后执行 D。节点工作量合计为 9，而最长依赖链为 2+3+1=6；两个执行单元在图示零额外开销的条件下恰好达到这个下界。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="80" y="190" width="120" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="140.0" y="218" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">A:2</text><rect x="360" y="90" width="120" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="420.0" y="118" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">B:3</text><rect x="360" y="290" width="120" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="420.0" y="318" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">C:3</text><rect x="640" y="190" width="120" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="700.0" y="218" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">D:1</text><path d="M210,200 L345,115" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M210,220 L345,310" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M490,115 L625,200" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M490,310 L625,220" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="800" y="110" font-size="26" fill="#213447" font-weight="400" text-anchor="start">总工作量 = 9</text><text x="800" y="180" font-size="26" fill="#cf7432" font-weight="600" text-anchor="start">关键路径 = 6</text><text x="800" y="270" font-size="25" fill="#213447" font-weight="400" text-anchor="start">两执行单元</text><text x="800" y="320" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">可并行 B 与 C</text><text x="40" y="395" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">调度：A [0,2] → B、C [2,5] → D [5,6]</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1332.500" height="981.250" viewBox="25.000 63.750 1332.500 981.250"><title>把依赖图兑现成排程：更多执行单元在哪里失去收益？</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#778994" /></marker></defs><rect width="1332.5" height="981.25" fill="white" x="25.0" y="63.75" /><g font-family="Microsoft YaHei, sans-serif" fill="#203747"><text x="55" y="117" font-size="28" fill="#778994" text-anchor="start">A=2，B=C=3，D=1；依赖 A→B、A→C、B→D、C→D；无调度开销</text><path d="M285 310L555 230" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)" /><path d="M285 310L555 410" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)" /><path d="M685 230L1015 310" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)" /><path d="M685 410L1015 310" fill="none" stroke="#778994" stroke-width="2" marker-end="url(#a)" /><rect x="160" y="273" width="120" height="74" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="220" y="321" font-size="32" fill="#203747" text-anchor="middle">A:2</text><rect x="560" y="193" width="120" height="74" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="620" y="241" font-size="32" fill="#203747" text-anchor="middle">B:3</text><rect x="560" y="373" width="120" height="74" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="620" y="421" font-size="32" fill="#203747" text-anchor="middle">C:3</text><rect x="1020" y="273" width="120" height="74" fill="#edf4f9" stroke="#24689a" stroke-width="2" /><text x="1080" y="321" font-size="32" fill="#203747" text-anchor="middle">D:1</text><text x="55" y="510" font-size="30" fill="#203747" text-anchor="start">一条最长链为 A→B→D，长度 6；总工作 W=9。</text><text x="55" y="612" font-size="28" fill="#203747" text-anchor="start">1 个执行单元</text><rect x="330" y="580" width="218" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="440" y="617" font-size="30" fill="white" text-anchor="middle">A</text><rect x="550" y="580" width="328" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="715" y="617" font-size="30" fill="white" text-anchor="middle">B</text><rect x="880" y="580" width="328" height="55" fill="#c56b31" stroke="none" stroke-width="2" /><text x="1045" y="617" font-size="30" fill="white" text-anchor="middle">C</text><rect x="1210" y="580" width="108" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="1265" y="617" font-size="30" fill="white" text-anchor="middle">D</text><path d="M1320 572L1320 650" fill="none" stroke="#778994" stroke-width="2" stroke-dasharray="4 5" /><text x="55" y="722" font-size="28" fill="#203747" text-anchor="start">2 个：单元 1</text><rect x="330" y="690" width="218" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="440" y="727" font-size="30" fill="white" text-anchor="middle">A</text><rect x="550" y="690" width="328" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="715" y="727" font-size="30" fill="white" text-anchor="middle">B</text><rect x="880" y="690" width="108" height="55" fill="#24689a" stroke="none" stroke-width="2" /><text x="935" y="727" font-size="30" fill="white" text-anchor="middle">D</text><path d="M990 682L990 760" fill="none" stroke="#778994" stroke-width="2" stroke-dasharray="4 5" /><text x="55" y="832" font-size="28" fill="#203747" text-anchor="start">2 个：单元 2</text><rect x="550" y="800" width="328" height="55" fill="#c56b31" stroke="none" stroke-width="2" /><text x="715" y="837" font-size="30" fill="white" text-anchor="middle">C</text><path d="M990 792L990 870" fill="none" stroke="#778994" stroke-width="2" stroke-dasharray="4 5" /><text x="330" y="950" font-size="26" fill="#778994" text-anchor="middle">0</text><text x="440" y="950" font-size="26" fill="#778994" text-anchor="middle">1</text><text x="550" y="950" font-size="26" fill="#778994" text-anchor="middle">2</text><text x="660" y="950" font-size="26" fill="#778994" text-anchor="middle">3</text><text x="770" y="950" font-size="26" fill="#778994" text-anchor="middle">4</text><text x="880" y="950" font-size="26" fill="#778994" text-anchor="middle">5</text><text x="990" y="950" font-size="26" fill="#778994" text-anchor="middle">6</text><text x="1100" y="950" font-size="26" fill="#778994" text-anchor="middle">7</text><text x="1210" y="950" font-size="26" fill="#778994" text-anchor="middle">8</text><text x="1320" y="950" font-size="26" fill="#778994" text-anchor="middle">9</text><text x="55" y="1010" font-size="30" fill="#203747" text-anchor="start">达到 6 后，再加单元无法越过依赖链；这个实例的最大加速为 9÷6=1.5。</text></g><desc> 把依赖图兑现成排程：更多执行单元在哪里失去收益？</desc></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="610" viewBox="0 0 1320 610" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">相同虚拟地址不代表同一物理页</title><desc id="plate-desc">两个进程的 0x1000 各映射到不同页框，0x2000 显式共享 F7。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="610" fill="white" stroke="none" stroke-width="1.6"/><text x="245" y="62" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">各自的虚拟地址</text><text x="1040" y="62" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">物理页框</text><polygon points="48,185 313,185 354,115 89,115" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="201" y="160.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">P   0x1000</text><polyline points="373,150 540,150 540,152 902,152" fill="none" stroke="#196f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><polygon points="48,275 313,275 354,205 89,205" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="201" y="250.85" fill="#655184" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">P   0x2000</text><polyline points="373,240 511,240 511,292 902,292" fill="none" stroke="#655184" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"/><polygon points="48,402 313,402 354,332 89,332" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="201" y="377.85" fill="#655184" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">Q   0x2000</text><polyline points="373,367 637,367 637,324 902,324" fill="none" stroke="#655184" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"/><polygon points="48,492 313,492 354,422 89,422" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="201" y="467.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">Q   0x1000</text><polyline points="373,457 540,457 540,448 902,448" fill="none" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><polygon points="921,187 1117,187 1153,117 957,117" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="1037" y="162.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">F2</text><polygon points="921,483 1117,483 1153,413 957,413" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="1037" y="458.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">F5</text><polygon points="921,343 1117,343 1153,273 957,273" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="1037" y="318.85" fill="#655184" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">F7</text><text x="666" y="572" fill="#202a37" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">虚拟地址相同，页框未必相同</text></svg>
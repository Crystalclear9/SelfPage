<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1508.82" viewBox="0 0 1440 1508.82" role="img"><title>同一数据块沿四进程环规约与收集</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1058.82" viewBox="0 0 1360 1000" role="img"><title>同一数据块沿四进程环规约与收集</title><rect width="1360" height="1000" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="31" fill="#176b91" text-anchor="start" font-weight="400">规约分散：接收后加本地 A</text><text x="735" y="65" font-size="31" fill="#d87332" text-anchor="start" font-weight="400">全收集：复制已归约的 A</text><rect x="245" y="152" width="180" height="96" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="335" y="190" font-size="27" fill="#176b91" text-anchor="middle" font-weight="400">进程 0</text><text x="335" y="230" font-size="26" fill="#176b91" text-anchor="middle" font-weight="400">(1, 1, 1)</text><rect x="450" y="362" width="180" height="96" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="540" y="400" font-size="27" fill="#176b91" text-anchor="middle" font-weight="400">进程 1</text><text x="540" y="440" font-size="26" fill="#176b91" text-anchor="middle" font-weight="400">(3, 3, 3)</text><rect x="245" y="572" width="180" height="96" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="335" y="610" font-size="27" fill="#176b91" text-anchor="middle" font-weight="400">进程 2</text><text x="335" y="650" font-size="26" fill="#176b91" text-anchor="middle" font-weight="400">(6, 6, 6)</text><rect x="40" y="362" width="180" height="96" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="130" y="400" font-size="27" fill="#176b91" text-anchor="middle" font-weight="400">进程 3</text><text x="130" y="440" font-size="26" fill="#176b91" text-anchor="middle" font-weight="400">(10, 10, 10)</text><line x1="408.3463561027804" y1="250.09019441165495" x2="466.6536438972196" y2="359.9098055883451" stroke="#176b91" stroke-width="4" marker-end="url(#b)"/><text x="465.5" y="305.0" font-size="22" fill="#176b91" text-anchor="middle" font-weight="400">第 1 步</text><line x1="466.6536438972196" y1="460.0901944116549" x2="408.3463561027804" y2="569.9098055883451" stroke="#176b91" stroke-width="4" marker-end="url(#b)"/><text x="405.5" y="515.0" font-size="22" fill="#176b91" text-anchor="middle" font-weight="400">第 2 步</text><line x1="261.6536438972196" y1="569.9098055883451" x2="203.34635610278045" y2="460.0901944116549" stroke="#176b91" stroke-width="4" marker-end="url(#b)"/><text x="200.5" y="515.0" font-size="22" fill="#176b91" text-anchor="middle" font-weight="400">第 3 步</text><rect x="930" y="152" width="180" height="96" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1020" y="190" font-size="27" fill="#d87332" text-anchor="middle" font-weight="400">进程 0</text><text x="1020" y="230" font-size="26" fill="#d87332" text-anchor="middle" font-weight="400">(10, 10, 10)</text><rect x="1135" y="362" width="180" height="96" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1225" y="400" font-size="27" fill="#d87332" text-anchor="middle" font-weight="400">进程 1</text><text x="1225" y="440" font-size="26" fill="#d87332" text-anchor="middle" font-weight="400">(10, 10, 10)</text><rect x="930" y="572" width="180" height="96" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1020" y="610" font-size="27" fill="#d87332" text-anchor="middle" font-weight="400">进程 2</text><text x="1020" y="650" font-size="26" fill="#d87332" text-anchor="middle" font-weight="400">(10, 10, 10)</text><rect x="725" y="362" width="180" height="96" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="815" y="400" font-size="27" fill="#d87332" text-anchor="middle" font-weight="400">进程 3</text><text x="815" y="440" font-size="26" fill="#d87332" text-anchor="middle" font-weight="400">(10, 10, 10)</text><line x1="888.3463561027804" y1="359.9098055883451" x2="946.6536438972196" y2="250.09019441165495" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><text x="945.5" y="305.0" font-size="22" fill="#d87332" text-anchor="middle" font-weight="400">第 1 步</text><line x1="1093.3463561027804" y1="250.09019441165495" x2="1151.6536438972196" y2="359.9098055883451" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><text x="1150.5" y="305.0" font-size="22" fill="#d87332" text-anchor="middle" font-weight="400">第 2 步</text><line x1="1151.6536438972196" y1="460.0901944116549" x2="1093.3463561027804" y2="569.9098055883451" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><text x="1090.5" y="515.0" font-size="22" fill="#d87332" text-anchor="middle" font-weight="400">第 3 步</text><text x="335" y="425" font-size="28" fill="#176b91" text-anchor="middle" font-weight="400">只追踪 A</text><text x="1020" y="425" font-size="28" fill="#d87332" text-anchor="middle" font-weight="400">不再相加</text><line x1="60" y1="745" x2="1300" y2="745" stroke="#d9e4ea" stroke-width="2"/><text x="60" y="810" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">每块 3 个有效载荷单位；A 共走 3 + 3 次。</text><text x="60" y="880" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">完整算法四块同时推进：每进程 6 步 × 每步 3 单位 = 发送 18 单位。</text><text x="60" y="950" font-size="29" fill="#80929d" text-anchor="start" font-weight="400">图中未画其余三块；每进程接收也是 18，全网发送合计 72。</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1058.82) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">逐阶段核对环通信：发送字节与一次启动延迟是两本账</text><rect x="65" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="276.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">归约分散：3步</text><rect x="495" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="706.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">全收集：3步</text><rect x="925" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><g><text x="1055.156" y="184" font-size="28" fill="#216c89">每步发送 </text><text x="1196.141" y="167" font-size="26" fill="#216c89" text-anchor="middle">M</text><line x1="1179.438" x2="1212.844" y1="175" y2="175" stroke="#216c89" stroke-width="1.5"/><text x="1196.141" y="203" font-size="26" fill="#216c89" text-anchor="middle">4</text></g><text x="65" y="265" font-size="31" fill="#203742" text-anchor="start">4 张卡、完整张量 M=12：每卡发送 6×3 = 18</text><g><text x="65.000" y="335" font-size="30" fill="#c96937">全机发送 4×18 = 72；每卡模型时间 6α + </text><text x="676.547" y="318" font-size="28" fill="#c96937" text-anchor="middle">18</text><line x1="644.547" x2="708.547" y1="326" y2="326" stroke="#c96937" stroke-width="1.5"/><text x="676.547" y="354" font-size="28" fill="#c96937" text-anchor="middle">带宽</text></g><text x="65" y="411" font-size="27" fill="#203742" text-anchor="start">这里不重复统计接收量；小张量可能由 6 次启动主导，大张量更受传输项影响。</text></g></g></svg>

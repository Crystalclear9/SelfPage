<text x="603" y="221" fill="#ac4f3e" font-size="27" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">等待复制完成的事件</text>
<text x="633" y="452" fill="#536979" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">执行顺序与存储寿命分别管理</text>

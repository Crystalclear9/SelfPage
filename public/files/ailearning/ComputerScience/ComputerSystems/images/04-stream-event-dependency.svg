<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="847.0295" viewBox="0 0 1440 847.0295" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">异步提交之后，依赖仍要明确建立</title><rect width="1440" height="847.0295" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">异步提交之后，依赖仍要明确建立</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg aria-labelledby="figure-title figure-desc" width="1344" height="705.0295" viewBox="16 64 1119 587" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">跨流依赖：数据就绪与存储存活是两件事</title><desc id="figure-desc">事件等待建立传输后计算的执行依赖；设备输入存储还必须活过消费阶段。流间等待与缓存分配器存储复用管理不是同一种保证。 跨流依赖：数据就绪与存储存活是两件事 事件等待不会自动管理所有缓冲的生命周期。</desc><rect width="1119.0" height="587.0" fill="white" x="16.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">等待保证数据已就绪；存储存活还需另行保证</text><line x1="280" y1="150" x2="280" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="280" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">0</text><line x1="445" y1="150" x2="445" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="445" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">1</text><line x1="610" y1="150" x2="610" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="610" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">2</text><line x1="775" y1="150" x2="775" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="775" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">3</text><line x1="940" y1="150" x2="940" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="940" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">4</text><line x1="1105" y1="150" x2="1105" y2="475" stroke="#c9dae6" stroke-width="1" stroke-dasharray="4 5"/><text x="1105" y="145" font-size="25" fill="#617f97" text-anchor="middle" font-weight="400">5</text><text x="40" y="230" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">传输流</text><rect x="280" y="185" width="330" height="70" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="445.0" y="229.8" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">H2D 复制</text><text x="40" y="355" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">计算流 C</text><rect x="610" y="310" width="495" height="70" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="857.5" y="354.8" font-size="28" fill="#c57439" text-anchor="middle" font-weight="400">使用输入，执行计算</text><path d="M610 265 L610 300" fill="none" stroke="#c57439" stroke-width="2.8" marker-end="url(#arrow-orange)"/><text x="635" y="290" font-size="26" fill="#c57439" text-anchor="start" font-weight="400">等待复制完成事件</text><text x="40" y="455" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">设备输入存储</text><rect x="280" y="420" width="825" height="55" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="690" y="458" font-size="27" fill="#2472b1" text-anchor="middle" font-weight="400">覆盖复制与消费的存活期</text><text x="40" y="560" font-size="29" fill="#c57439" text-anchor="start" font-weight="400">wait_event / wait_stream：建立执行先后</text><text x="40" y="620" font-size="27" fill="#2472b1" text-anchor="start" font-weight="400">record_stream(C) 或显式管理：避免分配器过早复用存储</text></g></svg></svg>

<text x="436.0" y="170" fill="#1a7077" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">复制输入</text>
<text x="223" y="279" fill="#222d39" font-size="32" text-anchor="end" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">计算流</text>

<text x="738" y="66" fill="#536979" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<path d="M889 88 L889 386" stroke="#e0e9eb" stroke-width="1.55" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="889" y="66" fill="#536979" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">4</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1607.375" height="1069.977" viewBox="20.625 86.643 1607.375 1069.977"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1607.375" height="1069.977" fill="white" x="20.625" y="86.643" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="55" y="145" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">假设带宽 20 GB/s，算力上限 100 GFLOP/s；两种方案都算 100 GFLOP</text><line x1="311.26870307857337" y1="220" x2="311.26870307857337" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="311.26870307857337" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">0.5</text><line x1="525.0" y1="220" x2="525.0" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="525.0" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><line x1="738.7312969214267" y1="220" x2="738.7312969214267" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="738.7312969214267" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="1021.2687030785733" y1="220" x2="1021.2687030785733" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="1021.2687030785733" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">5</text><line x1="1235.0" y1="220" x2="1235.0" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="1235.0" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">10</text><line x1="1448.7312969214267" y1="220" x2="1448.7312969214267" y2="660" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="1448.7312969214267" y="710" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">20</text><line x1="170" y1="660.0" x2="1510" y2="660.0" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="145" y="670.0" font-size="27" fill="#193a4e" text-anchor="end" font-weight="400">5</text><line x1="170" y1="569.6910013008056" x2="1510" y2="569.6910013008056" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="145" y="579.6910013008056" font-size="27" fill="#193a4e" text-anchor="end" font-weight="400">10</text><line x1="170" y1="479.38200260161125" x2="1510" y2="479.38200260161125" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="145" y="489.38200260161125" font-size="27" fill="#193a4e" text-anchor="end" font-weight="400">20</text><line x1="170" y1="360.00000000000006" x2="1510" y2="360.00000000000006" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="145" y="370.00000000000006" font-size="27" fill="#193a4e" text-anchor="end" font-weight="400">50</text><line x1="170" y1="269.6910013008056" x2="1510" y2="269.6910013008056" stroke="#dce5ea" stroke-width="1" stroke-dasharray="" /><text xml:space="preserve" x="145" y="279.6910013008056" font-size="27" fill="#193a4e" text-anchor="end" font-weight="400">100</text><line x1="170" y1="660" x2="1540" y2="660" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><line x1="170" y1="660" x2="170" y2="200" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="185" y="205" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">吞吐上界 GFLOP/s</text><text xml:space="preserve" x="1500" y="765" font-size="28" fill="#193a4e" text-anchor="end" font-weight="400">算术强度 FLOP/byte（双对数刻度）</text><path d="M311.26870307857337,569.6910013008056 L1021.2687030785733,269.6910013008056 L1448.7312969214267,269.6910013008056" stroke="#2676ad" stroke-width="5" fill="none" stroke-dasharray="" /><circle cx="525.0" cy="479.38200260161125" r="10" fill="#d47732" stroke="none" stroke-width="2" /><text xml:space="preserve" x="540.0" y="534.3820026016112" font-size="30" fill="#d47732" text-anchor="start" font-weight="400">A：100 GB</text><circle cx="1235.0" cy="269.6910013008056" r="10" fill="#d47732" stroke="none" stroke-width="2" /><text xml:space="preserve" x="1250.0" y="244.69100130080562" font-size="30" fill="#d47732" text-anchor="start" font-weight="400">B：10 GB</text><path d="M550.0,459.38200260161125 Q863.7560908509603,316.1615892965285 1215.0,289.6910013008056" stroke="#d47732" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="480" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">运算量不变，流量减为十分之一</text><text xml:space="preserve" x="1000" y="540" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">强度 1 → 10；越过转折强度 5</text><line x1="55" y1="805" x2="1595" y2="805" stroke="#8ca5b4" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="55" y="870" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">两条时间下界取最大值，不能只看流量缩小十倍</text><text xml:space="preserve" x="70" y="955" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">A</text><rect x="170" y="917" width="1000" height="38" rx="0" fill="#d47732" stroke="none" stroke-width="2" /><text xml:space="preserve" x="1190" y="947" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">搬运 5 s</text><rect x="170" y="973" width="200" height="30" rx="0" fill="#2676ad" stroke="none" stroke-width="2" /><text xml:space="preserve" x="390" y="999" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">计算 1 s</text><text xml:space="preserve" x="70" y="1075" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">B</text><rect x="170" y="1037" width="100.0" height="38" rx="0" fill="#d47732" stroke="none" stroke-width="2" /><text xml:space="preserve" x="290.0" y="1067" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">搬运 0.5 s</text><rect x="170" y="1093" width="200" height="30" rx="0" fill="#2676ad" stroke="none" stroke-width="2" /><text xml:space="preserve" x="390" y="1119" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">计算 1 s</text><text xml:space="preserve" x="1390" y="970" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="700">总下界 5 s</text><text xml:space="preserve" x="1390" y="1090" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="700">总下界 1 s</text></g><desc> 减少流量怎样移动 Roofline 的约束？先把同一工作算清</desc></svg>

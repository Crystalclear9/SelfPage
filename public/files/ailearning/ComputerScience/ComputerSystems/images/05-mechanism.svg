<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">算术强度决定 Roofline 模型中的上限</title><desc id="desc">假设内存带宽为 20 GB/s、峰值算力为 100 GFLOP/s。带宽约束给出吞吐上限等于 20 乘算术强度，直到强度 5 时碰到算力上限。左侧提高数据复用可能有效，右侧则不能仅靠减少字节量突破峰值算力。 这是简化上界，不是保证达到的性能。延迟、并发不足、同步与实际带宽都可能让测量点落在折线之下，FLOP 和字节必须采用一致计数口径。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">算术强度决定 Roofline 模型中的上限</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">假设峰值 100 GFLOP/s、带宽 20 GB/s；模型给上限而非实测速率。</text><path d="M130,545 L1090,545" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,455 L1090,455" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="462" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">25</text><path d="M130,365 L1090,365" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="372" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">50</text><path d="M130,275 L1090,275" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="282" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">75</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">100</text><text x="157.17" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="270.377" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="383.585" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="496.792" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="610" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><text x="723.208" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">5</text><text x="836.415" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">6</text><text x="949.623" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">7</text><text x="1062.83" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">8</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">吞吐上限 GFLOP/s</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">算术强度 FLOP/byte</text><polyline points="157.17,545.00 270.38,473.00 383.58,401.00 496.79,329.00 610.00,257.00 723.21,185.00 836.42,185.00 949.62,185.00 1062.83,185.00" fill="none" stroke="#268d8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="545.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="270.38" cy="473.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="383.58" cy="401.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="496.79" cy="329.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610.00" cy="257.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="723.21" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="836.42" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="949.62" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">可达吞吐上限</text></g></svg>

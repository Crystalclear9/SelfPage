<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1072.4615" viewBox="0 0 1440 1072.4615" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">流水线首批延迟与稳态节拍</title><rect width="1440" height="1072.4615" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">流水线首批延迟与稳态节拍</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="930.4615" viewBox="16 56 1118 774" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">从每个批次的矩形，读出依赖、等待与稳态节拍</title><desc id="desc">与正文读取10变换20计算30毫秒相同，四批完整Gantt时刻，计算完成为60、90、120、150。首批60，稳态间隔30，总耗时150，串行240。 从每个批次的矩形，读出依赖、等待与稳态节拍 四批串行 240 ms，流水线 150 ms；首批仍是 60 ms，不能称为首批加速两倍。</desc><rect width="1118.0" height="774.0" fill="white" x="16.0" y="56.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="102" font-size="26" fill="#617f97" text-anchor="start">每批读取 10 ms、变换 20 ms、计算 30 ms；独立资源，缓冲充足。</text><line x1="220.0" y1="160" x2="220.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="220.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">0</text><line x1="394.0" y1="160" x2="394.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="394.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">30</text><line x1="568.0" y1="160" x2="568.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="568.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">60</text><line x1="742.0" y1="160" x2="742.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="742.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">90</text><line x1="916.0" y1="160" x2="916.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="916.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">120</text><line x1="1090.0" y1="160" x2="1090.0" y2="605" stroke="#dce5ed" stroke-width="2"/><text x="1090.0" y="650" font-size="24" fill="#617f97" text-anchor="middle">150</text><text x="45" y="245" font-size="29" fill="#1f3449" text-anchor="start">读取</text><rect x="220.0" y="205" width="55.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="247.5" y="246.0" font-size="25" fill="#ffffff" text-anchor="middle">B0</text><rect x="278.0" y="205" width="55.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="305.5" y="246.0" font-size="25" fill="#ffffff" text-anchor="middle">B1</text><rect x="336.0" y="205" width="55.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="363.5" y="246.0" font-size="25" fill="#ffffff" text-anchor="middle">B2</text><rect x="394.0" y="205" width="55.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="421.5" y="246.0" font-size="25" fill="#ffffff" text-anchor="middle">B3</text><text x="45" y="385" font-size="29" fill="#1f3449" text-anchor="start">变换</text><rect x="278.0" y="345" width="113.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="334.5" y="386.0" font-size="25" fill="#ffffff" text-anchor="middle">B0</text><rect x="394.0" y="345" width="113.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="450.5" y="386.0" font-size="25" fill="#ffffff" text-anchor="middle">B1</text><rect x="510.0" y="345" width="113.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="566.5" y="386.0" font-size="25" fill="#ffffff" text-anchor="middle">B2</text><rect x="626.0" y="345" width="113.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="682.5" y="386.0" font-size="25" fill="#ffffff" text-anchor="middle">B3</text><text x="45" y="525" font-size="29" fill="#1f3449" text-anchor="start">计算</text><rect x="394.0" y="485" width="171.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="479.5" y="526.0" font-size="25" fill="#ffffff" text-anchor="middle">B0</text><rect x="568.0" y="485" width="171.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="653.5" y="526.0" font-size="25" fill="#ffffff" text-anchor="middle">B1</text><rect x="742.0" y="485" width="171.0" height="64" fill="#2472b1" opacity="0.85" rx="3"/><text x="827.5" y="526.0" font-size="25" fill="#ffffff" text-anchor="middle">B2</text><rect x="916.0" y="485" width="171.0" height="64" fill="#c57439" opacity="0.85" rx="3"/><text x="1001.5" y="526.0" font-size="25" fill="#ffffff" text-anchor="middle">B3</text><circle cx="568.0" cy="565" r="6" fill="#2472b1"/><text x="568.0" y="606" font-size="24" fill="#2472b1" text-anchor="middle">B0</text><circle cx="742.0" cy="565" r="6" fill="#2472b1"/><text x="742.0" y="606" font-size="24" fill="#2472b1" text-anchor="middle">B1</text><circle cx="916.0" cy="565" r="6" fill="#2472b1"/><text x="916.0" y="606" font-size="24" fill="#2472b1" text-anchor="middle">B2</text><circle cx="1090.0" cy="565" r="6" fill="#2472b1"/><text x="1090.0" y="606" font-size="24" fill="#2472b1" text-anchor="middle">B3</text><text x="1100" y="700" font-size="25" fill="#617f97" text-anchor="end">毫秒</text><text x="40" y="750" font-size="26" fill="#1f3449" text-anchor="start">沿同一批次看依赖：B0 在 0 → 10 → 30 → 60 ms 穿过三阶段。</text><text x="40" y="802" font-size="25" fill="#1f3449" text-anchor="start">沿计算资源看节拍：完成时刻 60、90、120、150 ms，相邻间隔均 30 ms。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="512.53" viewBox="-8.13 -15.00 1048.32 447.75" role="img"><title id="detail-title">机制展开：沿每个字母看跨阶段依赖，再沿每行看阶段资源占用</title><desc id="detail-desc">沿每个字母看跨阶段依赖，再沿每行看阶段资源占用。第一批在 11 完成，之后每隔 5 个时间单位完成一批；慢阶段决定稳态吞吐，不能用阶段数直接估计加速。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="28" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">阶段耗时 2、5、4：瓶颈决定稳态间隔</text><text x="20" y="133" font-size="24" fill="#213447" font-weight="400" text-anchor="start">阶段 1</text><rect x="150.0" y="100" width="77.95238095238095" height="56" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="190.47619047619048" y="134" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">A</text><rect x="230.95238095238096" y="100" width="77.95238095238095" height="56" rx="4" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="271.42857142857144" y="134" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">B</text><rect x="311.9047619047619" y="100" width="77.95238095238095" height="56" rx="4" fill="#e4f2ed" stroke="#cbd9e4" stroke-width="1.3" /><text x="352.3809523809524" y="134" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">C</text><text x="20" y="218" font-size="24" fill="#213447" font-weight="400"
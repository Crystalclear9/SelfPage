<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="980" viewBox="0 0 1640 980" role="img"><title>不同测量排程如何把同一线性漂移分配给方案</title><rect width="1640" height="980" fill="white"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="65" font-size="31" fill="#203b4a" text-anchor="start">同一测量环境：第 k 次成本 = 10 + k；与 A、B 身份无关</text><text x="340" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=0</text><text x="340" y="210" font-size="30" fill="#203b4a" text-anchor="middle">10</text><text x="475" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=1</text><text x="475" y="210" font-size="30" fill="#203b4a" text-anchor="middle">11</text><text x="610" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=2</text><text x="610" y="210" font-size="30" fill="#203b4a" text-anchor="middle">12</text><text x="745" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=3</text><text x="745" y="210" font-size="30" fill="#203b4a" text-anchor="middle">13</text><text x="880" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=4</text><text x="880" y="210" font-size="30" fill="#203b4a" text-anchor="middle">14</text><text x="1015" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=5</text><text x="1015" y="210" font-size="30" fill="#203b4a" text-anchor="middle">15</text><text x="1150" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=6</text><text x="1150" y="210" font-size="30" fill="#203b4a" text-anchor="middle">16</text><text x="1285" y="155" font-size="28" fill="#80929d" text-anchor="middle">k=7</text><text x="1285" y="210" font-size="30" fill="#203b4a" text-anchor="middle">17</text><text x="55" y="210" font-size="28" fill="#203b4a" text-anchor="start">成本 / 时间单位</text><text x="55" y="360" font-size="31" fill="#203b4a" text-anchor="start">先 A 后 B</text><rect x="289" y="305" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="340" y="361" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="424" y="305" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="475" y="361" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="559" y="305" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="610" y="361" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="694" y="305" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="745" y="361" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="829" y="305" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="880" y="361" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="964" y="305" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1015" y="361" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="1099" y="305" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1150" y="361" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="1234" y="305" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1285" y="361" font-size="33" fill="#d87332" text-anchor="middle">B</text><text x="340" y="450" font-size="28" fill="#176b91" text-anchor="start">A：[10, 11, 12, 13] → 均值 11.5</text><text x="950" y="450" font-size="28" fill="#d87332" text-anchor="start">B：[14, 15, 16, 17] → 均值 15.5</text><text x="55" y="560" font-size="31" fill="#203b4a" text-anchor="start">交错 ABBA</text><rect x="289" y="505" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="340" y="561" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="424" y="505" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="475" y="561" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="559" y="505" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="610" y="561" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="694" y="505" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="745" y="561" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="829" y="505" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="880" y="561" font-size="33" fill="#176b91" text-anchor="middle">A</text><rect x="964" y="505" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1015" y="561" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="1099" y="505" width="102" height="88" fill="#fff1e5" stroke="#d87332" stroke-width="2" rx="4"/><text x="1150" y="561" font-size="33" fill="#d87332" text-anchor="middle">B</text><rect x="1234" y="505" width="102" height="88" fill="#eaf4fa" stroke="#176b91" stroke-width="2" rx="4"/><text x="1285" y="561" font-size="33" fill="#176b91" text-anchor="middle">A</text><text x="340" y="650" font-size="28" fill="#176b91" text-anchor="start">A：[10, 13, 14, 17] → 均值 13.5</text><text x="950" y="650" font-size="28" fill="#d87332" text-anchor="start">B：[11, 12, 15, 16] → 均值 13.5</text><line x1="55" y1="745" x2="1580" y2="745" stroke="#d9e4ea" stroke-width="2"/><text x="55" y="825" font-size="32" fill="#d87332" text-anchor="start">AAAA/BBBB：15.5 − 11.5 = 4</text><text x="850" y="825" font-size="32" fill="#218579" text-anchor="start">ABBA/ABBA：13.5 − 13.5 = 0</text><text x="55" y="930" font-size="30" fill="#203b4a" text-anchor="start">两方案真实成本相同；消除这个线性趋势，不等于消除任意环境扰动。</text></g></svg>
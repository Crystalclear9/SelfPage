<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="899.7884" viewBox="0 0 1440 899.7884" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">条件变量通知、锁竞争与队列谓词变化的交错</title><rect width="1440" height="899.7884" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">条件变量通知、锁竞争与队列谓词变化的交错</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="757.7884" viewBox="23.467 55.449 1233.067 695.241" x="48" y="106" overflow="hidden"><rect width="1233.067" height="695.241" fill="white" x="23.467" y="55.449"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#20344a"><text x="50" y="103" font-size="26" fill="#20344a" text-anchor="start">共享条件：队列非空；通知不转移锁，也不为被唤醒线程预留项目。</text><text x="240" y="175" font-size="30" fill="#20344a" text-anchor="middle">生产者 P</text><path d="M240 195L240 690" stroke="#c6d7e2" stroke-width="2" stroke-dasharray="5 7"/><text x="640" y="175" font-size="30" fill="#20344a" text-anchor="middle">消费者 C1</text><path d="M640 195L640 690" stroke="#c6d7e2" stroke-width="2" stroke-dasharray="5 7"/><text x="1040" y="175" font-size="30" fill="#20344a" text-anchor="middle">消费者 C2</text><path d="M1040 195L1040 690" stroke="#c6d7e2" stroke-width="2" stroke-dasharray="5 7"/><text x="50" y="235" font-size="24" fill="#20344a" text-anchor="start">时间向下</text><text x="50" y="320" font-size="24" fill="#20344a" text-anchor="start">加入一项</text><text x="50" y="430" font-size="24" fill="#20344a" text-anchor="start">释放锁</text><text x="50" y="535" font-size="24" fill="#20344a" text-anchor="start">C1 先取得锁</text><text x="50" y="645" font-size="24" fill="#20344a" text-anchor="start">C2 再取得锁</text><rect x="495" y="210" width="290" height="55" fill="#edf4fa"/><text x="640" y="247" font-size="26" fill="#20344a" text-anchor="middle">wait：队列为空</text><rect x="895" y="210" width="290" height="55" fill="#edf4fa"/><text x="1040" y="247" font-size="26" fill="#20344a" text-anchor="middle">wait：队列为空</text><rect x="150" y="280" width="260" height="110" fill="#e8f4f2"/><text x="280" y="318" font-size="26" fill="#127682" text-anchor="middle">持锁：q = [项目]</text><text x="280" y="364" font-size="26" fill="#127682" text-anchor="middle">notify_all()</text><path d="M410 350L640 410" stroke="#c37536" stroke-width="3"/><text x="640" y="455" font-size="25" fill="#b45b1c" text-anchor="middle">已唤醒，仍需竞争锁</text><path d="M410 350L1040 410" stroke="#c37536" stroke-width="3"/><text x="1040" y="455" font-size="25" fill="#b45b1c" text-anchor="middle">已唤醒，仍需竞争锁</text><rect x="480" y="495" width="320" height="82" fill="#e8f4f2"/><text x="640" y="527" font-size="25" fill="#127682" text-anchor="middle">检查非空，取走唯一项</text><text x="640" y="563" font-size="25" fill="#127682" text-anchor="middle">q = []，随后释放锁</text><rect x="880" y="600" width="320" height="82" fill="#fff1e6"/><text x="1040" y="632" font-size="25" fill="#b45b1c" text-anchor="middle">重新检查：队列又为空</text><text x="1040" y="668" font-size="25" fill="#b45b1c" text-anchor="middle">while → 再次 wait</text><path d="M50 724L1230 724" stroke="#c6d7e2" stroke-width="2"/></g><desc> 一次通知唤醒两个消费者，但数据只有一项 若 C2 用 if 并把“被通知”当作“可直接取项”，就会对空队列执行消费。</desc></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1233.067" height="695.241" viewBox="23.467 55.449 1233.067 695.241"><rect width="1233.067" height="695.241" fill="white" x="23.467" y="55.449" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="103" font-size="26" fill="#203449" text-anchor="start">共享条件：队列非空；通知不转移锁，也不为被唤醒线程预留项目。</text><text x="240" y="175" font-size="30" fill="#203449" text-anchor="middle">生产者 P</text><path d="M240 195L240 690" stroke="#c8d6e0" stroke-width="2" stroke-dasharray="5 7" /><text x="640" y="175" font-size="30" fill="#203449" text-anchor="middle">消费者 C1</text><path d="M640 195L640 690" stroke="#c8d6e0" stroke-width="2" stroke-dasharray="5 7" /><text x="1040" y="175" font-size="30" fill="#203449" text-anchor="middle">消费者 C2</text><path d="M1040 195L1040 690" stroke="#c8d6e0" stroke-width="2" stroke-dasharray="5 7" /><text x="50" y="235" font-size="24" fill="#203449" text-anchor="start">时间向下</text><text x="50" y="320" font-size="24" fill="#203449" text-anchor="start">加入一项</text><text x="50" y="430" font-size="24" fill="#203449" text-anchor="start">释放锁</text><text x="50" y="535" font-size="24" fill="#203449" text-anchor="start">C1 先取得锁</text><text x="50" y="645" font-size="24" fill="#203449" text-anchor="start">C2 再取得锁</text><rect x="495" y="210" width="290" height="55" fill="#edf4fa" /><text x="640" y="247" font-size="26" fill="#203449" text-anchor="middle">wait：队列为空</text><rect x="895" y="210" width="290" height="55" fill="#edf4fa" /><text x="1040" y="247" font-size="26" fill="#203449" text-anchor="middle">wait：队列为空</text><rect x="150" y="280" width="260" height="110" fill="#e8f4f2" /><text x="280" y="318" font-size="26" fill="#087e7c" text-anchor="middle">持锁：q = [项目]</text><text x="280" y="364" font-size="26" fill="#087e7c" text-anchor="middle">notify_all()</text><path d="M410 350L640 410" stroke="#c77832" stroke-width="3" /><text x="640" y="455" font-size="25" fill="#b95a17" text-anchor="middle">已唤醒，仍需竞争锁</text><path d="M410 350L1040 410" stroke="#c77832" stroke-width="3" /><text x="1040" y="455" font-size="25" fill="#b95a17" text-anchor="middle">已唤醒，仍需竞争锁</text><rect x="480" y="495" width="320" height="82" fill="#e8f4f2" /><text x="640" y="527" font-size="25" fill="#087e7c" text-anchor="middle">检查非空，取走唯一项</text><text x="640" y="563" font-size="25" fill="#087e7c" text-anchor="middle">q = []，随后释放锁</text><rect x="880" y="600" width="320" height="82" fill="#fff1e6" /><text x="1040" y="632" font-size="25" fill="#b95a17" text-anchor="middle">重新检查：队列又为空</text><text x="1040" y="668" font-size="25" fill="#b95a17" text-anchor="middle">while → 再次 wait</text><path d="M50 724L1230 724" stroke="#c8d6e0" stroke-width="2" /></g><desc> 一次通知唤醒两个消费者，但数据只有一项 若 C2 用 if 并把“被通知”当作“可直接取项”，就会对空队列执行消费。</desc></svg>

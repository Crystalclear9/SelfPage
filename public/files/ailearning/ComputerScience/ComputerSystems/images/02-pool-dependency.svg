<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940" role="img"><title>线程池的等待关系必须包含有限执行槽位</title><rect width="1360" height="940" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#d87332" text-anchor="start" font-weight="400">池内父任务等待</text><text x="760" y="65" font-size="34" fill="#176b91" text-anchor="start" font-weight="400">池外主控等待</text><rect x="60" y="120" width="555" height="430" rx="4" fill="white" stroke="#d87332" stroke-width="2"/><text x="85" y="165" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">线程池：2 个槽位</text><text x="80" y="265" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">槽 0</text><rect x="195" y="220" width="385" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="385" y="255" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">父任务 P1</text><text x="385" y="288" font-size="24" fill="#d87332" text-anchor="middle" font-weight="400">同步等 C1，不释放槽位</text><text x="80" y="405" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">槽 1</text><rect x="195" y="360" width="385" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="385" y="395" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">父任务 P2</text><text x="385" y="428" font-size="24" fill="#d87332" text-anchor="middle" font-weight="400">同步等 C2，不释放槽位</text><text x="60" y="630" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">待运行队列</text><rect x="195" y="670" width="170" height="85" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="280" y="724" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">C1</text><rect x="405" y="670" width="170" height="85" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="490" y="724" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">C2</text><path d="M190 260 L170 260 L170 595 L280 595 L280 660" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><path d="M580 400 L660 400 L660 600 L490 600 L490 660" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><path d="M195 715 L105 715 L105 570 L320 570 L320 555" fill="none" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><text x="60" y="835" font-size="28" fill="#d87332" text-anchor="start" font-weight="400">子任务需要空槽；空槽要等父任务退出。</text><rect x="760" y="120" width="540" height="430" rx="4" fill="white" stroke="#176b91" stroke-width="2"/><text x="785" y="165" font-size="30" fill="#176b91" text-anchor="start" font-weight="400">线程池：2 个槽位</text><text x="780" y="265" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">槽 0</text><rect x="895" y="220" width="250" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1020" y="272" font-size="32" fill="#176b91" text-anchor="middle" font-weight="400">执行 C1</text><line x1="1160" y1="260" x2="1250" y2="260" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="780" y="405" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">槽 1</text><rect x="895" y="360" width="250" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1020" y="412" font-size="32" fill="#176b91" text-anchor="middle" font-weight="400">执行 C2</text><line x1="1160" y1="400" x2="1250" y2="400" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="815" y="665" width="430" height="90" rx="4" fill="white" stroke="#218579" stroke-width="2"/><text x="1030" y="720" font-size="29" fill="#218579" text-anchor="middle" font-weight="400">池外主控收集两个结果</text><path d="M1250 265 L1275 265 L1275 610 L1140 610 L1140 655" fill="none" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><path d="M1250 405 L1250 585 L940 585 L940 655" fill="none" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="760" y="835" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">等待发生在池外，不占用执行槽。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1175.125" height="475.628" viewBox="14.917 57.472 1175.125 475.628" role="img"><title id="figure-title">线程池：让等待者与执行槽分开</title><desc id="figure-desc">左侧假设池只有两个工作线程，父任务在其中同步等待同池子任务，又不释放执行槽，两个子任务因而无法开始。右侧把依赖编排放到池外主控，由空闲线程执行子任务；这只消除了图示等待环，仍需检查子任务中的其他依赖。 线程池：让等待者与执行槽分开</desc><rect x="14.917" y="57.472" width="1175.125" height="475.628" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="105" font-size="28" fill="#c87536" text-anchor="start" font-weight="600">父任务在池内等待</text><text x="670" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">主控在池外等待</text><rect x="40" y="150" width="235" height="100" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="157" y="193" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">父任务 P1</text><text x="157" y="230" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">等待 C1</text><path d="M157 255 L157 310" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="40" y="325" width="235" height="65" rx="6" fill="white" stroke="#c87536" stroke-width="1.5" /><text x="157" y="367" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">C1 排队</text><rect x="305" y="150" width="235" height="100" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="422" y="193" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">父任务 P2</text><text x="422" y="230" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">等待 C2</text><path d="M422 255 L422 310" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="305" y="325" width="235" height="65" rx="6" fill="white" stroke="#c87536" stroke-width="1.5" /><text x="422" y="367" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">C2 排队</text><text x="40" y="460" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">2 个槽均被占用</text><text x="40" y="505" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">子任务无法开始</text><rect x="670" y="150" width="230" height="100" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="785" y="210" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">执行 C1</text><rect x="935" y="150" width="230" height="100" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.5" /><text x="1050" y="210" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">执行 C2</text><rect x="705" y="345" width="420" height="80" rx="6" fill="white" stroke="#2865a0" stroke-width="1.5" /><text x="915" y="394" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">池外主控：接收两个结果</text><path d="M785 265 L810 330" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M1050 265 L1020 330" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="680" y="490" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">等待不占池内槽位</text></g></svg>

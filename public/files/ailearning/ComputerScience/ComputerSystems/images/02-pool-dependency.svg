<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1200" height="1020" viewBox="0 0 1200 1020" role="img"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">线程池死锁：子任务就绪，却没有可用执行槽</title><desc id="desc">假设固定 2 个工作线程；父任务同步等待同一池中的子任务，调度器不代为执行等待对象。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386f9c" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="1020" fill="white" stroke="none" rx="0" /><text x="48" y="60" font-size="32" fill="#19354a" font-weight="700" text-anchor="start">线程池死锁：子任务就绪，却没有可用执行槽</text><text x="48" y="104" font-size="21" fill="#597080" font-weight="400" text-anchor="start">假设固定 2 个工作线程；父任务同步等待同一池中的子任务，调度器不代为执行等待对象。</text><rect x="32" y="138" width="1136" height="470" fill="white" stroke="#d9e4eb" rx="10" /><text x="56" y="185" font-size="27" fill="#19354a" font-weight="700" text-anchor="start">A  两个父任务占满执行槽</text><rect x="72" y="215" width="482" height="100" fill="#f9e9de" stroke="#d9e4eb" rx="10" /><text x="96" y="255" font-size="25" fill="#19354a" font-weight="700" text-anchor="start">工作线程 1：父任务 P1</text><text x="96" y="291" font-size="22" fill="#bd632e" font-weight="400" text-anchor="start">等待子任务结果；仍占用当前线程</text><rect x="147" y="420" width="330" height="70" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="312" y="463" font-size="24" fill="#19354a" font-weight="400" text-anchor="middle">子任务 C1（排队）</text><path d="M312,315 V412" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><text x="327" y="366" font-size="21" fill="#19354a" font-weight="400" text-anchor="start">等待完成</text><path d="M147,455 H88 V325" fill="none" stroke="#386f9c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)" /><text x="104" y="529" font-size="22" fill="#597080" font-weight="400" text-anchor="start">子任务需要空闲槽位；可用数量 = 0</text><rect x="646" y="215" width="482" height="100" fill="#f9e9de" stroke="#d9e4eb" rx="10" /><text x="670" y="255" font-size="25" fill="#19354a" font-weight="700" text-anchor="start">工作线程 2：父任务 P2</text><text x="670" y="291" font-size="22" fill="#bd632e" font-weight="400" text-anchor="start">等待子任务结果；仍占用当前线程</text><rect x="721" y="420" width="330" height="70" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="886" y="463" font-size="24" fill="#19354a" font-weight="400" text-anchor="middle">子任务 C2（排队）</text><path d="M886,315 V412" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><text x="901" y="366" font-size="21" fill="#19354a" font-weight="400" text-anchor="start">等待完成</text><path d="M721,455 H662 V325" fill="none" stroke="#386f9c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)" /><text x="678" y="529" font-size="22" fill="#597080" font-weight="400" text-anchor="start">子任务需要空闲槽位；可用数量 = 0</text><text x="56" y="580" font-size="22" fill="#bd632e" font-weight="400" text-anchor="start">等待环：父任务释放槽位依赖子任务结束；子任务开始又依赖槽位释放。</text><rect x="32" y="638" width="1136" height="328" fill="white" stroke="#d9e4eb" rx="10" /><text x="56" y="686" font-size="27" fill="#19354a" font-weight="700" text-anchor="start">B  将依赖编排移到池外的主控线程</text><rect x="64" y="729" width="312" height="91" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><text x="220" y="782" font-size="23" fill="#19354a" font-weight="400" text-anchor="middle">主控提交 C1、C2</text><rect x="444" y="729" width="312" height="91" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><text x="600" y="782" font-size="23" fill="#19354a" font-weight="400" text-anchor="middle">工作线程执行子任务</text><rect x="824" y="729" width="312" height="91" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><text x="980" y="782" font-size="23" fill="#19354a" font-weight="400" text-anchor="middle">主控收齐结果后继续</text><path d="M376,774 H436" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><path d="M756,774 H816" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><text x="56" y="866" font-size="23" fill="#137f78" font-weight="400" text-anchor="start">主控等待不占池内执行槽；有限子任务结束后，依赖可以继续。</text><text x="56" y="915" font-size="22" fill="#597080" font-weight="400" text-anchor="start">适用前提：子任务本身没有新的循环等待；单纯增大线程池不构成普遍证明。</text></g></svg>

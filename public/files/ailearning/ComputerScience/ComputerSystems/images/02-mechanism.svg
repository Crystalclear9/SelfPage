<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">读改写竞态：两个加一为何只得到一</title><desc id="desc">把加一拆成读取、计算和写回，两个线程就可能读到同一个旧值。两次写回都写入 1，最终结果丢失一次更新；问题在于复合操作没有作为一个受保护的整体执行。 表表示允许这种交错的抽象共享内存模型，不断言某一 Python 版本恰好按此字节码交错。实际并发接口需要按其原子性和同步语义分析。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="660" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="485.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">读改写竞态：两个加一为何只得到一</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">这里假设读改写分离且无同步；两个读取都发生在写回前。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">时间</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">线程 A</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">线程 B</text><rect x="870.0" y="165" width="270.0" heig
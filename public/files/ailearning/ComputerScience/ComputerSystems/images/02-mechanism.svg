<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1130" viewBox="0 0 1650 1130"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">丢失更新：两个私有旧值，最后覆盖同一个共享位置</text><text xml:space="preserve" x="55" y="145" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">时间向下；各线程都保持“先读，再写”</text><text xml:space="preserve" x="250" y="225" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="700">线程 A 的私有状态</text><line x1="250" y1="260" x2="250" y2="900" stroke="#b8cad5" stroke-width="2" stroke-dasharray="5 6"/><text xml:space="preserve" x="800" y="225" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="700">共享 x</text><line x1="800" y1="260" x2="800" y2="900" stroke="#b8cad5" stroke-width="2" stroke-dasharray="5 6"/><text xml:space="preserve" x="1350" y="225" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="700">线程 B 的私有状态</text><line x1="1350" y1="260" x2="1350" y2="900" stroke="#b8cad5" stroke-width="2" stroke-dasharray="5 6"/><text xml:space="preserve" x="65" y="340" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">1</text><circle cx="800" cy="330" r="40" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="800" y="340" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="65" y="490" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">2</text><circle cx="800" cy="480" r="40" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="800" y="490" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="65" y="670" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">3</text><circle cx="800" cy="660" r="40" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="800" y="670" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="65" y="830" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">4</text><circle cx="800" cy="820" r="40" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="800" y="830" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><line x1="755" y1="330" x2="285" y2="330" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="500" y="300" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">读取 0</text><text xml:space="preserve" x="250" y="380" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">a = 0</text><line x1="845" y1="480" x2="1315" y2="480" stroke="#d47732" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1080" y="450" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">读取 0</text><text xml:space="preserve" x="1350" y="530" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">b = 0</text><line x1="285" y1="660" x2="755" y2="660" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="500" y="625" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">写回 a + 1 = 1</text><line x1="1315" y1="820" x2="845" y2="820" stroke="#d47732" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1080" y="785" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">写回 b + 1 = 1</text><text xml:space="preserve" x="55" y="975" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">第二次写回不重新读取 x；它提交的是先前保留的旧值加一</text><text xml:space="preserve" x="55" y="1055" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">若完整读改写互斥执行：0 → 1 → 2；不能只给单次读或单次写分别加锁</text></g></svg>
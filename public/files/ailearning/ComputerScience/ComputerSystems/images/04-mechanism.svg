<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">复制参数不等于重复消费同一批数据</title><desc id="desc">数据并行在各进程保存参数副本，而本轮样本通常被分配到不同进程。各进程计算本地贡献，再通过约定的归约与缩放得到同一全局目标的梯度，最后同步更新副本。 这是等大小分片的一轮示意。填充样本、重复采样和有效 token 数不等都会改变统计分母；参数一致还要求初始化、更新顺序和优化器状态满足协议。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">复制参数不等于重复消费同一批数据</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">四个样本分片不重叠；复制模型与分配训练数据是两件事。</text><path d="M335,317.5 L440,282.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,416.154 L440,453.846" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M725,282.5 L830,317.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M725,453.846 L830,416.154" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">全局批次：四个样本</text><rect x="440" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">进程 A：样本 1、2</text><rect x="440" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">进程 B：样本 3、4</text><rect x="830" y="310" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="373" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">归约梯度并共同更新</text></g></svg>

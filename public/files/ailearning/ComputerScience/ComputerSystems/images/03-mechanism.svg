<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">队列满时，究竟是哪一个批次停在了哪里？</title><desc id="desc">七批、队列容量2、生产10消费30的阻塞后服务模型。B4在50至70、B5在80至100、B6在110至130阻塞；50ms消费者B1队列B2B3生产者持有B4，总完工220。</desc><rect width="1200" height="1000" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">队列满时，究竟是哪一个批次停在了哪里？</text><text x="40" y="103" font-size="25" fill="#627689" text-anchor="start">单生产者每批 10 ms，单消费者每批 30 ms；队列最多 2 批，不含执行中的批次。</text><line x1="170.0" y1="170" x2="170.0" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="170.0" y="525" font-size="24" fill="#627689" text-anchor="middle">0</text><line x1="340.0" y1="170" x2="340.0" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="340.0" y="525" font-size="24" fill="#627689" text-anchor="middle">40</text><line x1="467.5" y1="170" x2="467.5" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="467.5" y="525" font-size="24" fill="#627689" text-anchor="middle">70</text><line x1="595.0" y1="170" x2="595.0" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="595.0" y="525" font-size="24" fill="#627689" text-anchor="middle">100</text><line x1="722.5" y1="170" x2="722.5" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="722.5" y="525" font-size="24" fill="#627689" text-anchor="middle">130</text><line x1="850.0" y1="170" x2="850.0" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="850.0" y="525" font-size="24" fill="#627689" text-anchor="middle">160</text><line x1="977.5" y1="170" x2="977.5" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="977.5" y="525" font-size="24" fill="#627689" text-anchor="middle">190</text><line x1="1105.0" y1="170" x2="1105.0" y2="480" stroke="#dce5ed" stroke-width="2"/><text x="1105.0" y="525" font-size="24" fill="#627689" text-anchor="middle">220</text><text x="35" y="245" font-size="28" fill="#213447" text-anchor="start">生产</text><text x="35" y="410" font-size="28" fill="#213447" text-anchor="start">消费</text><rect x="170.0" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="190.25" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">0</text><rect x="212.5" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="232.75" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">1</text><rect x="255.0" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="275.25" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">2</text><rect x="297.5" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="317.75" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">3</text><rect x="340.0" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="360.25" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">4</text><rect x="382.5" y="205" width="83.0" height="57" fill="#c87536" opacity="0.32" rx="3"/><text x="425.0" y="295" font-size="24" fill="#c87536" text-anchor="middle">阻塞</text><rect x="467.5" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="487.75" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">5</text><rect x="510.0" y="205" width="83.0" height="57" fill="#c87536" opacity="0.32" rx="3"/><text x="552.5" y="295" font-size="24" fill="#c87536" text-anchor="middle">阻塞</text><rect x="595.0" y="205" width="40.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="615.25" y="242.5" font-size="25" fill="#ffffff" text-anchor="middle">6</text><rect x="637.5" y="205" width="83.0" height="57" fill="#c87536" opacity="0.32" rx="3"/><text x="680.0" y="295" font-size="24" fill="#c87536" text-anchor="middle">阻塞</text><rect x="212.5" y="370" width="125.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="275.25" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B0</text><rect x="340.0" y="370" width="125.5" height="57" fill="#c87536" opacity="0.85" rx="3"/><text x="402.75" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B1</text><rect x="467.5" y="370" width="125.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="530.25" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B2</text><rect x="595.0" y="370" width="125.5" height="57" fill="#c87536" opacity="0.85" rx="3"/><text x="657.75" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B3</text><rect x="722.5" y="370" width="125.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="785.25" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B4</text><rect x="850.0" y="370" width="125.5" height="57" fill="#c87536" opacity="0.85" rx="3"/><text x="912.75" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B5</text><rect x="977.5" y="370" width="125.5" height="57" fill="#2865a0" opacity="0.85" rx="3"/><text x="1040.25" y="407.5" font-size="25" fill="#ffffff" text-anchor="middle">B6</text><text x="1100" y="568" font-size="25" fill="#627689" text-anchor="end">毫秒</text><line x1="40" y1="603" x2="1160" y2="603" stroke="#dce5ed" stroke-width="2"/><text x="40" y="658" font-size="28" fill="#213447" text-anchor="start">在 50 ms 的同一瞬间：</text><rect x="40" y="700" width="275" height="74" fill="#2865a0" opacity="0.12" rx="3"/><text x="177.5" y="746.0" font-size="26" fill="#2865a0" text-anchor="middle">消费者：B1</text><rect x="405" y="700" width="145" height="74" fill="#2865a0" opacity="0.12" rx="3"/><text x="477.5" y="746.0" font-size="26" fill="#2865a0" text-anchor="middle">B2</text><rect x="565" y="700" width="145" height="74" fill="#2865a0" opacity="0.12" rx="3"/><text x="637.5" y="746.0" font-size="26" fill="#2865a0" text-anchor="middle">B3</text><rect x="795" y="700" width="360" height="74" fill="#c87536" opacity="0.12" rx="3"/><text x="975.0" y="746.0" font-size="26" fill="#c87536" text-anchor="middle">生产者持有 B4</text><text x="560" y="829" font-size="26" fill="#2865a0" text-anchor="middle">有界队列：2 批已满</text><text x="970" y="829" font-size="25" fill="#c87536" text-anchor="middle">等到 70 ms 才可入队</text><text x="40" y="900" font-size="25" fill="#213447" text-anchor="start">三个阻塞区间各 20 ms；总完工仍为 220 ms，等待限制积压而非增加消费能力。</text><text x="40" y="953" font-size="25" fill="#627689" text-anchor="start">图中的两批队列 + 一批消费 + 一批生产，可同时占用四份批对象。</text></g></svg>
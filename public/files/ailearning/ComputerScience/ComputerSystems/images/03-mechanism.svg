<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">背压：队列满后生产者需要等待</title><desc id="desc">生产速度持续高于消费速度时，等待队列先增长到容量 3。之后若协议选择阻塞生产者，队列不能再无限增长，输入端会感受到等待；这就是背压将下游容量约束传回上游的含义。 折线只连接离散观察值，并不提供精确事件调度。达到容量后也可能选择丢弃或失败，图示的是阻塞策略；容量不含正在处理的任务。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">背压：队列满后生产者需要等待</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">队列达到容量后等待；连线仅连接观测时刻，不表示分数个项目。</text><path d="M130,545 L1090,545" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,425 L1090,425" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="432" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><path d="M130,305 L1090,305" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="312" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">2</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">3</text><text x="157.17" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="338.302" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="519.434" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="700.566" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="881.698" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><text x="1062.83" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">5</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">等待项目数</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">观察时刻</text><polyline points="157.17,545.00 338.30,425.00 519.43,305.00 700.57,185.00 881.70,185.00 1062.83,185.00" fill="none" stroke="#268d8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="545.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="338.30" cy="425.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="519.43" cy="305.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="700.57" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="881.70" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">等待队列长度</text><polyline points="157.17,185.00 338.30,185.00 519.43,185.00 700.57,185.00 881.70,185.00 1062.83,185.00" fill="none" stroke="#d67c47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="338.30" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="519.43" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="700.57" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="881.70" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M550,653 L585,653" stroke="#d67c47" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="598" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">队列容量</text></g></svg>

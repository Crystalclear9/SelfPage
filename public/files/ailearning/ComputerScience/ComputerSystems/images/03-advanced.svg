<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1180" viewBox="0 0 1650 1180"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">路径没有变化，内容版本与解码结果已经变化</text><text xml:space="preserve" x="55" y="145" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">源对象 p：v1 的字节解码为 [1, 2]；v2 解码为 [8, 9]</text><text xml:space="preserve" x="55" y="250" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">首次访问 v1：建立缓存</text><text xml:space="preserve" x="55" y="550" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">原路径发布 v2：路径键仍命中旧项</text><text xml:space="preserve" x="55" y="875" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">把版本纳入键：新版本必须重新解码</text><rect x="120" y="300" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="160" y="347" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><rect x="200" y="300" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="240" y="347" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="200" y="420" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">源 p, v1</text><line x1="315" y1="335" x2="620" y2="335" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="470" y="305" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">解码并缓存</text><text xml:space="preserve" x="810" y="305" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">缓存条目</text><text xml:space="preserve" x="700" y="370" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">p →</text><rect x="830" y="325" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="870" y="372" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><rect x="910" y="325" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="950" y="372" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="910" y1="405" x2="910" y2="540" stroke="#8ca5b4" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="120" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="160" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">8</text><rect x="200" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="240" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">9</text><text xml:space="preserve" x="200" y="720" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">源 p, v2</text><text xml:space="preserve" x="810" y="580" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">仍保留旧结果</text><text xml:space="preserve" x="700" y="645" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">p →</text><rect x="830" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="870" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><rect x="910" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="950" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="1010" y1="635" x2="1260" y2="635" stroke="#d47732" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1135" y="605" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">命中路径 p</text><rect x="1300" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="1340" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><rect x="1380" y="600" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="1420" y="647" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1380" y="720" font-size="29" fill="#d47732" text-anchor="middle" font-weight="400">错误返回旧值</text><rect x="120" y="925" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="160" y="972" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">8</text><rect x="200" y="925" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="240" y="972" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">9</text><text xml:space="preserve" x="200" y="1045" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">源 p, v2</text><text xml:space="preserve" x="740" y="955" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">(p, v2) 不在缓存</text><line x1="320" y1="960" x2="520" y2="960" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="980" y1="960" x2="1260" y2="960" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1115" y="920" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">解码并插入新键</text><rect x="1300" y="925" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="1340" y="972" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">8</text><rect x="1380" y="925" width="80" height="70" rx="0" fill="#f1f6f9" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="1420" y="972" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">9</text><text xml:space="preserve" x="1380" y="1045" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">返回当前版本</text><line x1="55" y1="795" x2="1595" y2="795" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="55" y="1135" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">版本与字节必须来自同一快照；键正确不代表外部读取天然一致</text></g></svg>
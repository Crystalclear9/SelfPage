<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608.32" viewBox="11.00 10.00 1154.00 585.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">缓存命中不等于命中了正确的数据版本</title><desc id="desc">若缓存键只有路径字符串，文件在原路径更新后仍可能命中旧结果。此时命中率很高，却没有正确反映输入版本；缓存正确性要求键和失效规则覆盖会影响结果的依赖。 图中的错误来自刻意缺失版本条件。可采用内容摘要、可信版本号或受约束的失效协议，但还要考虑配置、代码和外部表变化；只检查修改时间也有适用边界。 缓存键必须反映输入版本与计算依赖；同路径不保证同内容。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">缓存命中不等于命中了正确的数据版本</text><path d="M335,235 L450,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,235 L850,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M273.981,450 L511.019,290" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M992.5,290 L992.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">旧输入版本 v1</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">缓存键只含路径</text><rect x="850" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">缓存结果 f(v1)</text><rect x="50" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">同路径更新为 v2</text><rect x="850" y="450" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">错误复用旧结果</text></g></svg>

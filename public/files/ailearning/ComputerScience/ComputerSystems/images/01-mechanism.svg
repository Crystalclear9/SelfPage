<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">内存峰值由对象生命周期的重叠决定</title><desc id="desc">在时刻 2 到 3 之间，三类对象同时存活，合计为 6 GB；在其他时段，对象可能已经释放或尚未分配。容量分析应找生命周期重叠的最大总量，而不是分别测量每一项后取最大值。 这些数值是教学假设，图只列出三类对象。真实分配器还可能保留内存池，报告的预留量与对象有效载荷、进程驻留量不一定相同。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">内存峰值由对象生命周期的重叠决定</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">图中三个缓冲同时存活时峰值为 6 GB；不含未画出的开销。</text><path d="M250,195 L1090,195" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><path d="M418,188 L418,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="418" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><path d="M586,188 L586,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="586" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><path d="M754,188 L754,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="754" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><path d="M922,188 L922,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="922" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M1090,188 L1090,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">5</text><text x="60" y="260" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">输入缓冲：2 GB</text><rect x="250.0" y="255" width="504.0" height="48" fill="#d4ebe6" stroke="#83b4ae" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="375" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">激活缓存：3 GB</text><rect x="418.0" y="370" width="504.0" height="48" fill="#d4ebe6" stroke="#83b4ae" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="490" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">临时空间：1 GB</text><rect x="586.0" y="485" width="168.0" height="48" fill="#f5dfcb" stroke="#83b4ae" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="650" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

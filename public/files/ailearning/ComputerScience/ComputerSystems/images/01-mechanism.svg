<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title id="figure-title">内存峰值：把存活区间变成同一时刻的总量</title><desc id="figure-desc">三类载荷的半开存活区间叠加后，五段合计依次为二、五、六、三、零GB；峰值为六GB，并不等于分配器预留量或RSS。</desc><rect width="1200" height="790" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">内存峰值：把存活区间变成同一时刻的总量</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">对象按半开区间存活：先对同一时刻的有效载荷求和</text><line x1="300" y1="160" x2="300" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="300" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="460" y1="160" x2="460" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="460" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><line x1="620" y1="160" x2="620" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="620" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="780" y1="160" x2="780" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="780" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><line x1="940" y1="160" x2="940" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="940" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="1100" y1="160" x2="1100" y2="670" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="4 5" /><text x="1100" y="155" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">5</text><text x="40" y="233" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">输入 2 GB</text><rect x="300" y="200" width="480" height="45" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="40" y="313" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">激活 3 GB</text><rect x="460" y="280" width="480" height="45" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="40" y="393" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">临时 1 GB</text><rect x="620" y="360" width="160" height="45" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="40" y="500" font-size="28" fill="#213447" text-anchor="start" font-weight="400">合计 / GB</text><line x1="300" y1="670" x2="1100" y2="670" stroke="#cbd9e4" stroke-width="1" /><text x="275" y="678" font-size="25" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="300" y1="589" x2="1100" y2="589" stroke="#cbd9e4" stroke-width="1" /><text x="275" y="597" font-size="25" fill="#627689" text-anchor="end" font-weight="400">3</text><line x1="300" y1="508" x2="1100" y2="508" stroke="#cbd9e4" stroke-width="1" /><text x="275" y="516" font-size="25" fill="#627689" text-anchor="end" font-weight="400">6</text><polyline points="300,670 300,616 460,616 460,535 620,535 620,508 780,508 780,589 940,589 940,670 1100,670" fill="none" stroke="#2865a0" stroke-width="3.5" /><text x="700.0" y="488" font-size="29" fill="#c87536" text-anchor="middle" font-weight="600">峰值 6</text><text x="40" y="735" font-size="27" fill="#213447" text-anchor="start" font-weight="400">只统计这三类有效载荷；分配器预留量、RSS 与它不必相同。</text><text x="1100" y="115" font-size="26" fill="#627689" text-anchor="end" font-weight="400">逻辑时刻</text></g></svg>

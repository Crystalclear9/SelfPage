<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：蓝色长条在优化前后保持 75 不变，橙色部分从 25 缩到 2.5</title><desc id="detail-desc">蓝色长条在优化前后保持 75 不变，橙色部分从 25 缩到 2.5。总耗时因而是 77.5，整体加速约 1.29 倍；局部加速倍数不能直接当作端到端收益。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="35" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">原耗时 = 100，只有 25 可加速</text><text x="25" y="145" font-size="23" fill="#213447" font-weight="400" text-anchor="start">优化前</text><rect x="170" y="115" width="600" height="65" rx="0" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><rect x="770" y="115" width="200" height="65" rx="0" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="470" y="156" font-size="25" fill="#2865a0" font-weight="600" text-anchor="middle">不可加速：75</text><text x="790" y="215" font-size="23" fill="#cf7432" font-weight="400" text-anchor="start">可加速部分：25</text><text x="25" y="300" font-size="23" fill="#213447" font-weight="400" text-anchor="start">优化后</text><rect x="170" y="270" width="600" height="65" rx="0" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><rect x="770" y="270" width="20.0" height="65" rx="0" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="470" y="311" font-size="25" fill="#2865a0" font-weight="600" text-anchor="middle">不可加速：75</text><text x="790" y="370" font-size="23" fill="#cf7432" font-weight="400" text-anchor="start">可加速部分：2.5</text><text x="180" y="225" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">该部分提速 10 倍</text><text x="30" y="435" font-size="27" fill="#158476" font-weight="600" text-anchor="start">整体：100 ÷ 77.5 ≈ 1.29 倍；并非 10 倍</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="55" font-size="34" fill="#203449" text-anchor="start">翻译未命中、页面不驻留、数据未命中：三个不同事件</text><text x="50" y="103" font-size="26" fill="#203449" text-anchor="start">固定同一进程；教学页大小 16 B；当前 TLB 仅缓存“页 1 → 帧 2”</text><text x="50" y="174" font-size="29" fill="#203449" text-anchor="start">虚拟地址</text><text x="300" y="174" font-size="29" fill="#203449" text-anchor="start">TLB 查询</text><text x="600" y="174" font-size="29" fill="#203449" text-anchor="start">页表状态</text><text x="960" y="174" font-size="29" fill="#203449" text-anchor="start">翻译结果</text><rect x="40" y="200" width="1190" height="90" fill="#edf4fa"/><text x="50" y="250" font-size="27" fill="#247bb5" text-anchor="start">0x13 = 页 1 + 3</text><text x="300" y="250" font-size="27" fill="#247bb5" text-anchor="start">命中：1 → 2</text><text x="600" y="250" font-size="27" fill="#247bb5" text-anchor="start">无需本次页表遍历</text><text x="960" y="250" font-size="27" fill="#247bb5" text-anchor="start">0x23</text><rect x="40" y="310" width="1190" height="90" fill="#e8f4f2"/><text x="50" y="360" font-size="27" fill="#087e7c" text-anchor="start">0x32 = 页 3 + 2</text><text x="300" y="360" font-size="27" fill="#087e7c" text-anchor="start">未命中</text><text x="600" y="360" font-size="27" fill="#087e7c" text-anchor="start">页 3 驻留于帧 5</text><text x="960" y="360" font-size="27" fill="#087e7c" text-anchor="start">0x52</text><rect x="40" y="420" width="1190" height="90" fill="#fff1e6"/><text x="50" y="470" font-size="27" fill="#b95a17" text-anchor="start">0x23 = 页 2 + 3</text><text x="300" y="470" font-size="27" fill="#b95a17" text-anchor="start">未命中</text><text x="600" y="470" font-size="27" fill="#b95a17" text-anchor="start">页 2 暂不驻留</text><text x="960" y="470" font-size="27" fill="#b95a17" text-anchor="start">转入缺页处理</text><text x="50" y="583" font-size="28" fill="#203449" text-anchor="start">前两次翻译得到物理地址后，还需访问数据缓存 / 下层存储。</text><text x="50" y="637" font-size="28" fill="#247bb5" text-anchor="start">TLB 命中只说明翻译已缓存，不能推出数据本身也命中缓存。</text><path d="M50 682L1230 682" stroke="#c8d6e0" stroke-width="2"/><text x="50" y="730" font-size="25" fill="#203449" text-anchor="start">第二行只是补做地址翻译，未发生缺页；第三行需由系统处理，不能预先给出有效物理地址。</text></g></svg>
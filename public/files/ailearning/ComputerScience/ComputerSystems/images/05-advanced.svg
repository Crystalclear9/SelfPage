<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="figure-title">P95 的差异可能来自分位数约定</title><desc id="figure-desc">95个一毫秒、5个一百毫秒的构造数据，最近秩P95为1，线性插值P95为5.95；两者使用同一排序数据而非不同实验。</desc><rect width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">P95 的差异可能来自分位数约定</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">100 个示意请求：前 95 个为 1 ms，末 5 个为 100 ms</text><text x="40" y="185" font-size="29" fill="#213447" text-anchor="start" font-weight="600">排序后的相邻名次</text><text x="94" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">92</text><rect x="40" y="270" width="108" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="94.0" y="312.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="219" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">93</text><rect x="165" y="270" width="108" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="219.0" y="312.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="344" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">94</text><rect x="290" y="270" width="108" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="344.0" y="312.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="469" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">95</text><rect x="415" y="270" width="108" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="469.0" y="312.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="594" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">96</text><rect x="540" y="270" width="108" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="594.0" y="312.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="719" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">97</text><rect x="665" y="270" width="108" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="719.0" y="312.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="844" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">98</text><rect x="790" y="270" width="108" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="844.0" y="312.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="969" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">99</text><rect x="915" y="270" width="108" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="969.0" y="312.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="1094" y="245" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">100</text><rect x="1040" y="270" width="108" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1094.0" y="312.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="40" y="415" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">最近秩：第 ceil(100×0.95)=95 项</text><text x="900" y="415" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">P95 = 1 ms</text><text x="40" y="505" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">线性插值：h=1+99×0.95=95.05</text><text x="40" y="565" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">在第 95、96 项间插值：1+0.05×(100−1)</text><text x="900" y="565" font-size="30" fill="#c87536" text-anchor="start" font-weight="400">= 5.95 ms</text><text x="40" y="655" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一数据、同一百分位，也应先说明分位数算法。</text></g></svg>

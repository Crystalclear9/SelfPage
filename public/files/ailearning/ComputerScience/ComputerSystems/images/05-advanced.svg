<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">均值与尾部延迟回答不同问题</title><desc id="desc">一百次请求中，九十五次耗时为 1，五次耗时为 100，平均耗时为 5.95。按最近秩定义，P95 为 1、P99 为 100；少数慢请求的体验无法由均值单独表达。 图画的是经验累计分布，在观测值处跳跃。分位数算法不同可能给出插值结果，因此本例明确使用最近秩；时间单位在同一次比较中必须一致。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">均值与尾部延迟回答不同问题</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">分位数用最近秩定义；插值方法可能给出不同的 P95。</text><path d="M170,570 L1070,570" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="577" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M170,390 L1070,390" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="397" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.5</text><path d="M170,228 L1070,228" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="235" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.95</text><path d="M170,210 L1070,210" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="217" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><polyline points="170,570 178.57142857142858,570 178.57142857142858,228.0 1027.142857142857,228.0 1027.142857142857,210 1070.0,210" fill="none" stroke="#268d8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="178.571" y="612" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="1027.14" y="612" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">100</text><text x="70" y="173" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">累计比例</text><text x="1070" y="650" font-size="22" fill="#5c7185" text-anchor="end" font-weight="400">请求耗时（同一单位）</text><text x="240" y="335" font-size="26" fill="#20384f" text-anchor="start" font-weight="400">95 个请求耗时 1</text><text x="240" y="369" font-size="26" fill="#20384f" text-anchor="start" font-weight="400">5 个请求耗时 100</text><text x="240" y="403" font-size="26" fill="#20384f" text-anchor="start" font-weight="400">平均值 5.95</text><text x="700" y="285" font-size="24" fill="#d67c47" text-anchor="start" font-weight="400">最近秩：P95=1，P99=100</text></g></svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="787.8919" viewBox="0 0 1440 787.8919" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">均值与尾部延迟回答不同问题</title><rect width="1440" height="787.8919" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">均值与尾部延迟回答不同问题</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="645.8919" viewBox="0 0 1184 569" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">P95：经验分布反函数与排序插值</title><desc id="desc">95个请求为1毫秒，5个为100毫秒。经验CDF在1处跳至0.95；线性排序插值在第95至96项之间得到5.95毫秒。 </desc><rect width="1184.0" height="569.0" fill="white" x="0.0" y="0.0"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#2073ad"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c26e34"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b899d"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#21374d"><text x="45" y="45" fill="#21374d" font-size="28" text-anchor="start" font-weight="400">100 个请求：95 个为 1 ms，5 个为 100 ms</text><text x="55" y="105" fill="#2073ad" font-size="28" text-anchor="start" font-weight="600">经验累积分布 Fn(t)</text><line x1="95" y1="425" x2="555" y2="425" stroke="#7b899d" stroke-width="2" marker-end="url(#g)"/><line x1="95" y1="425" x2="95" y2="125" stroke="#7b899d" stroke-width="2" marker-end="url(#g)"/><text x="80" y="433" fill="#21374d" font-size="23" text-anchor="end" font-weight="400">0</text><line x1="95" y1="425" x2="550" y2="425" stroke="#d9e3eb" stroke-width="1"/><text x="80" y="171.75" fill="#21374d" font-size="23" text-anchor="end" font-weight="400">95%</text><line x1="95" y1="163.75" x2="550" y2="163.75" stroke="#d9e3eb" stroke-width="1"/><text x="535" y="133" fill="#21374d" font-size="23" text-anchor="end" font-weight="400">100%</text><line x1="95" y1="150" x2="550" y2="150" stroke="#d9e3eb" stroke-width="1"/><path d="M95 425 H99.4 V163.75 H535.0 V150 H550" stroke="#2073ad" fill="none" stroke-width="3"/><circle cx="99.4" cy="163.75" r="7" fill="#2073ad" stroke="#2073ad" stroke-width="2"/><line x1="99.4" y1="163.75" x2="99.4" y2="425" stroke="#2073ad" stroke-width="1" stroke-dasharray="4 5"/><text x="99.4" y="458" fill="#21374d" font-size="24" text-anchor="middle" font-weight="400">1</text><text x="535.0" y="458" fill="#21374d" font-size="24" text-anchor="middle" font-weight="400">100</text><text x="555" y="490" fill="#21374d" font-size="24" text-anchor="end" font-weight="400">t / ms</text><text x="55" y="540" fill="#2073ad" font-size="27" text-anchor="start" font-weight="400">最小满足 Fn(t) ≥ 0.95 的 t：1 ms</text><text x="650" y="105" fill="#c26e34" font-size="28" text-anchor="start" font-weight="600">按排序位置做线性插值</text><line x1="670" y1="425" x2="1120" y2="425" stroke="#7b899d" stroke-width="2" marker-end="url(#g)"/><line x1="695" y1="435" x2="695" y2="135" stroke="#7b899d" stroke-width="2" marker-end="url(#g)"/><line x1="695" y1="425.0" x2="1065" y2="167.59999999999997" stroke="#c26e34" stroke-width="3"/><circle cx="695" cy="425.0" r="7" fill="#c26e34" stroke="#c26e34" stroke-width="2"/><text x="695" y="460" fill="#21374d" font-size="25" text-anchor="middle" font-weight="400">95</text><circle cx="1065" cy="167.59999999999997" r="7" fill="#c26e34" stroke="#c26e34" stroke-width="2"/><text x="1065" y="460" fill="#21374d" font-size="25" text-anchor="middle" font-weight="400">96</text><text x="1077" y="155.59999999999997" fill="#c26e34" font-size="24" text-anchor="start" font-weight="400">100 ms</text><circle cx="713.499999999999" cy="412.13" r="8" fill="#c26e34" stroke="#c26e34" stroke-width="2"/><line x1="713.499999999999" y1="412.13" x2="880" y2="350" stroke="#c26e34" stroke-width="1"/><text x="890" y="344" fill="#c26e34" font-size="29" text-anchor="start" font-weight="400">5.95 ms</text><text x="650" y="500" fill="#21374d" font-size="27" text-anchor="start" font-weight="400">h = 1 + 99 × 0.95 = 95.05</text><text x="650" y="540" fill="#c26e34" font-size="27" text-anchor="start" font-weight="400">1 + 0.05 × (100 − 1) = 5.95</text></g></svg></svg>

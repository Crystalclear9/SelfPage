<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title id="figure-title">连续访问也要核对缓存线边界</title><desc id="figure-desc">冷缓存且每线六十四字节：读取十六个float32，对齐访问涉及一条线，偏移四字节涉及两条线，每隔一线读一项涉及十六条线。</desc><rect width="1200" height="660" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">连续访问也要核对缓存线边界</text><text x="40" y="110" font-size="28" fill="#213447" text-anchor="start" font-weight="400">冷缓存模型：每线 64 B；读取 16 个 float32，共 64 B</text><text x="40" y="230" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">从线边界开始</text><rect x="390" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="422" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="454" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="486" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="518" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="550" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="582" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="614" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="646" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" /><rect x="678" y="190" width="30" height="55" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1" />
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：蓝色框围住同一条缓存线中的 16 个连续 float32</title><desc id="detail-desc">蓝色框围住同一条缓存线中的 16 个连续 float32。下方每个橙格属于不同缓存线，在冷缓存且无额外复用的设定下，为相同的 16 个数载入了 16 倍字节；这不是对实际程序加速倍数的承诺。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="30" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">读取 16 个 float32：每条缓存线 64 B</text><text x="25" y="100" font-size="24" fill="#213447" font-weight="400" text-anchor="start">连续读取</text><rect x="190" y="65" width="46" height="55" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="213.0" y="100.75" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">0</text><rect x="241" y="65" width="46" height="55" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="264.0" y="100.75" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="292" y="65" width="46" height="55" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="315.0" y="100.75" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="343" y="65" width="46" height="55" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="366.0" y="100.75" font-size="23" fill="#21344
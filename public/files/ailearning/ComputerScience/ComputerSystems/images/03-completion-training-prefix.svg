<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1149.1407" viewBox="0 0 1440 1149.1407" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同一六任务的两个worker调度、提交序与完成序及训练前三条的类别差异</title><rect width="1440" height="1149.1407" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同一六任务的两个worker调度、提交序与完成序及训练前三条的类别差异</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1007.1407" viewBox="11 56 1173 879" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">同样六条样本，快慢差异如何改变模型先看到什么？</title><desc id="desc">与正文六任务调度同一输入。worker0处理样本0和5，worker1处理1、2、3、4；完成序1、2、3、0、5、4与提交序不同，前三个正类数0对1，有序交付需重排缓冲。 同样六条样本，快慢差异如何改变模型先看到什么？ 若前三次更新后停止，调度已改变训练前缀；不丢样本不足以证明训练过程相同。</desc><rect width="1173.0" height="879.0" fill="white" x="11.0" y="56.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="102" font-size="26" fill="#617f97" text-anchor="start">固定同一批任务；橙色为类别 1、耗时 4，蓝色为类别 0、耗时 1。</text><line x1="190" y1="165" x2="190" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="190" y="448" font-size="24" fill="#617f97" text-anchor="middle">0</text><line x1="320" y1="165" x2="320" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="320" y="448" font-size="24" fill="#617f97" text-anchor="middle">1</text><line x1="450" y1="165" x2="450" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="450" y="448" font-size="24" fill="#617f97" text-anchor="middle">2</text><line x1="580" y1="165" x2="580" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="580" y="448" font-size="24" fill="#617f97" text-anchor="middle">3</text><line x1="710" y1="165" x2="710" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="710" y="448" font-size="24" fill="#617f97" text-anchor="middle">4</text><line x1="840" y1="165" x2="840" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="840" y="448" font-size="24" fill="#617f97" text-anchor="middle">5</text><line x1="970" y1="165" x2="970" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="970" y="448" font-size="24" fill="#617f97" text-anchor="middle">6</text><line x1="1100" y1="165" x2="1100" y2="410" stroke="#dce5ed" stroke-width="2"/><text x="1100" y="448" font-size="24" fill="#617f97" text-anchor="middle">7</text><text x="35" y="245" font-size="25" fill="#1f3449" text-anchor="start">worker 0</text><rect x="190" y="205" width="516" height="61" fill="#c57439" opacity="0.85" rx="3"/><text x="448.0" y="244.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 0</text><rect x="710" y="205" width="126" height="61" fill="#2472b1" opacity="0.85" rx="3"/><text x="773.0" y="244.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 5</text><text x="35" y="370" font-size="25" fill="#1f3449" text-anchor="start">worker 1</text><rect x="190" y="330" width="126" height="61" fill="#2472b1" opacity="0.85" rx="3"/><text x="253.0" y="369.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 1</text><rect x="320" y="330" width="126" height="61" fill="#2472b1" opacity="0.85" rx="3"/><text x="383.0" y="369.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 2</text><rect x="450" y="330" width="126" height="61" fill="#2472b1" opacity="0.85" rx="3"/><text x="513.0" y="369.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 3</text><rect x="580" y="330" width="516" height="61" fill="#c57439" opacity="0.85" rx="3"/><text x="838.0" y="369.5" font-size="25" fill="#ffffff" text-anchor="middle">样本 4</text><text x="1090" y="496" font-size="25" fill="#617f97" text-anchor="end">仿真时间单位</text><line x1="40" y1="533" x2="1160" y2="533" stroke="#dce5ed" stroke-width="2"/><text x="40" y="637" font-size="27" fill="#1f3449" text-anchor="start">提交顺序</text><rect x="250" y="600" width="120" height="60" fill="#c57439" opacity="0.85" rx="3"/><text x="310.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">0</text><rect x="390" y="600" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="450.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">1</text><rect x="530" y="600" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="590.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">2</text><rect x="670" y="600" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="730.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">3</text><rect x="810" y="600" width="120" height="60" fill="#c57439" opacity="0.85" rx="3"/><text x="870.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">4</text><rect x="950" y="600" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="1010.0" y="639.0" font-size="25" fill="#ffffff" text-anchor="middle">5</text><line x1="660" y1="587" x2="660" y2="678" stroke="#1f3449" stroke-width="2" stroke-dasharray="7 6"/><text x="40" y="753" font-size="27" fill="#1f3449" text-anchor="start">完成顺序</text><rect x="250" y="716" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="310.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">1</text><rect x="390" y="716" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="450.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">2</text><rect x="530" y="716" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="590.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">3</text><rect x="670" y="716" width="120" height="60" fill="#c57439" opacity="0.85" rx="3"/><text x="730.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">0</text><rect x="810" y="716" width="120" height="60" fill="#2472b1" opacity="0.85" rx="3"/><text x="870.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">5</text><rect x="950" y="716" width="120" height="60" fill="#c57439" opacity="0.85" rx="3"/><text x="1010.0" y="755.0" font-size="25" fill="#ffffff" text-anchor="middle">4</text><line x1="660" y1="703" x2="660" y2="794" stroke="#1f3449" stroke-width="2" stroke-dasharray="7 6"/><text x="40" y="846" font-size="25" fill="#1f3449" text-anchor="start">前三个：提交序有 1 个正类；完成序没有正类。完整遍历的身份集合相同。</text><text x="40" y="907" font-size="26" fill="#2472b1" text-anchor="start">有序交付要等样本 0 到时刻 4，且要缓存已完成的 1、2、3。</text></g></svg></svg>

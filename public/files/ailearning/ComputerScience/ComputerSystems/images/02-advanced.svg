<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">嵌套线程池可能造成过量并发</title><desc id="desc">假设机器提供八个执行核心，外层启动八个任务，每个任务又让原生线性代数库启动八个线程，就可能出现六十四个工作线程争用资源。图比较执行资源和潜在线程数量，说明并发层次不能简单相乘当成加速。 实际线程创建、复用与运行数量取决于库和配置。过量并发可能增加切换、缓存和内存带宽压力，但是否变慢需要受控测量，不能仅据线程数直接下结论。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">嵌套线程池可能造成过量并发</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">64 是潜在线程数；可运行、实际调度与物理核心数须区分。</text><path d="M140,540 L1100,540" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="547" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M140,462.5 L1100,462.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="469.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">17.5</text><path d="M140,385 L1100,385" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="392" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">35</text><path d="M140,307.5 L1100,307.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="314.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">52.5</text><path d="M140,230 L1100,230" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="237" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">70</text><text x="80" y="190" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">资源或执行实体数量</text><text x="180" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">物理执行资源</text><rect x="280.0" y="504.57142857142856" width="91" height="35.428571428571445" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="325.5" y="490.571" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">8</text><text x="480" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">外层任务数</text><rect x="580.0" y="504.57142857142856" width="91" height="35.428571428571445" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="625.5" y="490.571" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">8</text><text x="780" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">潜在线程数</text><rect x="880.0" y="256.57142857142856" width="91" height="283.42857142857144" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="925.5" y="242.571" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">64</text><rect x="180" y="635" width="23" height="13" fill="#268d8c" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="651" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">数量</text><text x="140" y="690" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">假设 8 个任务各启动 8 个原生线程</text><text x="140" y="719" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">64 是潜在线程数，不是 64 个物理核心</text></g></svg>

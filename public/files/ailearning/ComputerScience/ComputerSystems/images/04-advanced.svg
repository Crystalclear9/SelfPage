<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="773.99" viewBox="17.00 14.00 1138.00 734.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">重计算用额外计算换取较短的激活驻留</title><desc id="desc">激活检查点在前向只保存约定边界，反向需要时再执行部分前向计算以恢复中间值。图把较短的保存状态与额外的反向前重算放在同一时间线上，避免只看到节省内存而忽略计算代价。 这是简化的分段示意，不规定具体框架怎样划块。随机算子、状态更新和非纯函数可能影响重算一致性；参数、优化器状态及通信缓冲也不由这张图自动减少。 边界激活仍需保存，重算也需临时空间；不是释放全部激活。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">重计算用额外计算换取较短的激活驻留</text><path d="M300,195 L1100,195" stroke="#507db3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><path d="M300,195 L300,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><path d="M460,195 L460,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="620" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><path d="M620,195 L620,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">3</text><path d="M780,195 L780,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="940" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><path d="M940,195 L940,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1100" y="178" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">5</text><path d="M1100,195 L1100,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="270" font-size="24" fill="#213447" text-anchor="start" font-weight="400">常规前向</text><text x="65" y="415" font-size="24" fill="#213447" text-anchor="start" font-weight="400">保存的激活</text><text x="65" y="560" font-size="24" fill="#213447" text-anchor="start" font-weight="400">反向与重算</text><rect x="300.0" y="235" width="155.0" height="80" fill="#dcece8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="267" font-size="24" fill="#213447" text-anchor="start" font-weight="400">块 A</text><rect x="460.0" y="235" width="155.0" height="80" fill="#dcece8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="472" y="267" font-size="24" fill="#213447" text-anchor="start" font-weight="400">块 B</text><rect x="620.0" y="235" width="155.0" height="80" fill="#dcece8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="632" y="267" font-size="24" fill="#213447" text-anchor="start" font-weight="400">块 C</text><rect x="300.0" y="380" width="475.0" height="80" fill="#e1eaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="412" font-size="24" fill="#213447" text-anchor="start" font-weight="400">仅保留边界</text><rect x="780.0" y="525" width="155.0" height="80" fill="#f8e6d4" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="792" y="557" font-size="24" fill="#213447" text-anchor="start" font-weight="400">重算 B、C</text><rect x="940.0" y="525" width="155.0" height="80" fill="#f8e6d4" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="952" y="557" font-size="24" fill="#213447" text-anchor="start" font-weight="400">反向计算</text><text x="1030" y="710" font-size="24" fill="#627689" text-anchor="start" font-weight="400">逻辑时间</text></g></svg>

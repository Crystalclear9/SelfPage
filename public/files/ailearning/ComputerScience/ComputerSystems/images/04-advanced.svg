l:space="preserve" x="1300" y="565" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">保留 3 个标量</text><text xml:space="preserve" x="55" y="700" font-size="32" fill="#1f3348" text-anchor="start" font-weight="700">只检查点 f(x) = sin(x²)</text><rect x="95" y="750" width="150" height="70" rx="5" fill="url(#book-wash-edf5fa)" stroke="#2181bf" stroke-width="2"/><text xml:space="preserve" x="170" y="796" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><rect x="955" y="750" width="150" height="70" rx="5" fill="url(#book-wash-edf5fa)" stroke="#2181bf" stroke-width="2"/><text xml:space="preserve" x="1030" y="796" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">−0.7568</text><rect x="525" y="750" width="150" height="70" rx="5" fill="white" stroke="#d07736" stroke-width="2"/><text xml:space="preserve" x="600" y="796" font-size="25" fill="#d07736" text-anchor="middle" font-weight="400">不长期保存</text><text xml:space="preserve" x="1300" y="795" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">保留 2 个标量</text><path d="M245,785 C350,950 470,950 525,830" stroke="#d07736" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="420" y="980" font-size="29" fill="#d07736" text-anchor="middle" font-weight="400">反向重跑 x²：再得到 a = 4</text><text xml:space="preserve" x="55" y="1080" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">两条路径输入梯度同为 3.95743；重算增加函数执行，不减少参数或优化器状态</text></g><desc> 激活重算：省去长期保留的中间值，反向前重新算出它</desc></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="title desc"><title id="title">排序能排到最后，不代表普通比较能续读</title><desc id="desc">六条记录按空值标记、非空时间或占位零、唯一编号组成全序。显式编码使键集分页能跨入空值组。</desc><rect width="1200" height="775" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">排序能排到最后，不代表普通比较能续读</text><text x="40" y="95" font-size="26" fill="#627689" text-anchor="start">固定数据视图 · 时间升序 · 空时间排最后 · id 唯一且非空</text><rect x="215" y="130" width="275" height="55" fill="#2865a0" opacity="0.09" rx="3"/><text x="352" y="166" font-size="27" fill="#2865a0" text-anchor="middle">第 1 页</text><rect x="515" y="130" width="275" height="55" fill="#2865a0" opacity="0.09" rx="3"/><text x="652" y="166" font-size="27" fill="#2865a0" text-anchor="middle">第 2 页</text><rect x="815" y="130" width="275" height="55" fill="#2865a0" opacity="0.09" rx="3"/><text x="952" y="166" font-size="27" fill="#2865a0" text-anchor="middle">第 3 页</text><text x="40" y="230" font-size="27" fill="#213447" text-anchor="start">id</text><text x="40" y="300" font-size="27" fill="#213447" text-anchor="start">原时间 t</text><text x="40" y="370" font-size="27" fill="#213447" text-anchor="start">空值标记</text><text x="40" y="440" font-size="27" fill="#213447" text-anchor="start">数值键</text><text x="245" y="230" font-size="27" fill="#2865a0" text-anchor="middle">6</text><text x="245" y="300" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="245" y="370" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="245" y="440" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="390" y="230" font-size="27" fill="#2865a0" text-anchor="middle">1</text><text x="390" y="300" font-size="27" fill="#2865a0" text-anchor="middle">5</text><text x="390" y="370" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="390" y="440" font-size="27" fill="#2865a0" text-anchor="middle">5</text><line x1="462" y1="200" x2="462" y2="465" stroke="#dce5ed" stroke-width="3"/><text x="535" y="230" font-size="27" fill="#2865a0" text-anchor="middle">3</text><text x="535" y="300" font-size="27" fill="#2865a0" text-anchor="middle">5</text><text x="535" y="370" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="535" y="440" font-size="27" fill="#2865a0" text-anchor="middle">5</text><text x="680" y="230" font-size="27" fill="#2865a0" text-anchor="middle">5</text><text x="680" y="300" font-size="27" fill="#2865a0" text-anchor="middle">8</text><text x="680" y="370" font-size="27" fill="#2865a0" text-anchor="middle">0</text><text x="680" y="440" font-size="27" fill="#2865a0" text-anchor="middle">8</text><line x1="752" y1="200" x2="752" y2="465" stroke="#dce5ed" stroke-width="3"/><text x="825" y="230" font-size="27" fill="#c87536" text-anchor="middle">2</text><text x="825" y="300" font-size="27" fill="#c87536" text-anchor="middle">NULL</text><text x="825" y="370" font-size="27" fill="#c87536" text-anchor="middle">1</text><text x="825" y="440" font-size="27" fill="#c87536" text-anchor="middle">0</text><text x="970" y="230" font-size="27" fill="#c87536" text-anchor="middle">4</text><text x="970" y="300" font-size="27" fill="#c87536" text-anchor="middle">NULL</text><text x="970" y="370" font-size="27" fill="#c87536" text-anchor="middle">1</text><text x="970" y="440" font-size="27" fill="#c87536" text-anchor="middle">0</text><text x="40" y="505" font-size="29" fill="#213447" text-anchor="start">统一游标键：(空值标记，COALESCE(t,0)，id)</text><text x="40" y="565" font-size="26" fill="#2865a0" text-anchor="start">跨过第二页的游标 (0, 8, 5)，下一页为 (1, 0, 2)、(1, 0, 4)。</text><text x="40" y="625" font-size="26" fill="#c87536" text-anchor="start">直接比较 (NULL, id) &gt; (8, 5) 得到未知；WHERE 不会保留这些行。</text><text x="40" y="685" font-size="25" fill="#213447" text-anchor="start">0 只是被空值标记隔开的占位；真实时间 0 仍属于非空组，不会碰撞。</text><text x="40" y="735" font-size="24" fill="#627689" text-anchor="start">ORDER BY 与续页谓词必须使用完全相同的键定义；游标不能替代快照。</text></g></svg>
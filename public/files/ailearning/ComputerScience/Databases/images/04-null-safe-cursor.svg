<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="954.0255" viewBox="0 0 1440 954.0255" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">带空值标记的完整键让分页跨入NULL时间组</title><rect width="1440" height="954.0255" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">带空值标记的完整键让分页跨入NULL时间组</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="812.0255" viewBox="15 49 1099 664" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">排序能排到最后，不代表普通比较能续读</title><desc id="desc">六条记录按空值标记、非空时间或占位零、唯一编号组成全序。显式编码使键集分页能跨入空值组。 排序能排到最后，不代表普通比较能续读 ORDER BY 与续页谓词必须使用完全相同的键定义；游标不能替代快照。</desc><rect width="1099.0" height="664.0" fill="white" x="15.0" y="49.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="26" fill="#617f97" text-anchor="start">固定数据视图 · 时间升序 · 空时间排最后 · id 唯一且非空</text><rect x="215" y="130" width="275" height="55" fill="#2472b1" opacity="0.09" rx="3"/><text x="352" y="166" font-size="27" fill="#2472b1" text-anchor="middle">第 1 页</text><rect x="515" y="130" width="275" height="55" fill="#2472b1" opacity="0.09" rx="3"/><text x="652" y="166" font-size="27" fill="#2472b1" text-anchor="middle">第 2 页</text><rect x="815" y="130" width="275" height="55" fill="#2472b1" opacity="0.09" rx="3"/><text x="952" y="166" font-size="27" fill="#2472b1" text-anchor="middle">第 3 页</text><text x="40" y="230" font-size="27" fill="#1f3449" text-anchor="start">id</text><text x="40" y="300" font-size="27" fill="#1f3449" text-anchor="start">原时间 t</text><text x="40" y="370" font-size="27" fill="#1f3449" text-anchor="start">空值标记</text><text x="40" y="440" font-size="27" fill="#1f3449" text-anchor="start">数值键</text><text x="245" y="230" font-size="27" fill="#2472b1" text-anchor="middle">6</text><text x="245" y="300" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="245" y="370" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="245" y="440" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="390" y="230" font-size="27" fill="#2472b1" text-anchor="middle">1</text><text x="390" y="300" font-size="27" fill="#2472b1" text-anchor="middle">5</text><text x="390" y="370" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="390" y="440" font-size="27" fill="#2472b1" text-anchor="middle">5</text><line x1="462" y1="200" x2="462" y2="465" stroke="#dce5ed" stroke-width="3"/><text x="535" y="230" font-size="27" fill="#2472b1" text-anchor="middle">3</text><text x="535" y="300" font-size="27" fill="#2472b1" text-anchor="middle">5</text><text x="535" y="370" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="535" y="440" font-size="27" fill="#2472b1" text-anchor="middle">5</text><text x="680" y="230" font-size="27" fill="#2472b1" text-anchor="middle">5</text><text x="680" y="300" font-size="27" fill="#2472b1" text-anchor="middle">8</text><text x="680" y="370" font-size="27" fill="#2472b1" text-anchor="middle">0</text><text x="680" y="440" font-size="27" fill="#2472b1" text-anchor="middle">8</text><line x1="752" y1="200" x2="752" y2="465" stroke="#dce5ed" stroke-width="3"/><text x="825" y="230" font-size="27" fill="#c57439" text-anchor="middle">2</text><text x="825" y="300" font-size="27" fill="#c57439" text-anchor="middle">NULL</text><text x="825" y="370" font-size="27" fill="#c57439" text-anchor="middle">1</text><text x="825" y="440" font-size="27" fill="#c57439" text-anchor="middle">0</text><text x="970" y="230" font-size="27" fill="#c57439" text-anchor="middle">4</text><text x="970" y="300" font-size="27" fill="#c57439" text-anchor="middle">NULL</text><text x="970" y="370" font-size="27" fill="#c57439" text-anchor="middle">1</text><text x="970" y="440" font-size="27" fill="#c57439" text-anchor="middle">0</text><text x="40" y="505" font-size="29" fill="#1f3449" text-anchor="start">统一游标键：(空值标记，COALESCE(t,0)，id)</text><text x="40" y="565" font-size="26" fill="#2472b1" text-anchor="start">跨过第二页的游标 (0, 8, 5)，下一页为 (1, 0, 2)、(1, 0, 4)。</text><text x="40" y="625" font-size="26" fill="#c57439" text-anchor="start">直接比较 (NULL, id) &gt; (8, 5) 得到未知；WHERE 不会保留这些行。</text><text x="40" y="685" font-size="25" fill="#1f3449" text-anchor="start">0 只是被空值标记隔开的占位；真实时间 0 仍属于非空组，不会碰撞。</text></g></svg></svg>

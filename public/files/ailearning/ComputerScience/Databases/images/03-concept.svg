ns-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">E2</text><text x="1055" y="270" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">E3</text><text x="1108" y="270" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">E4</text><text x="1204" y="270" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">和</text><text x="884" y="326" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="start" font-weight="400">E1</text><rect x="923" y="290" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="976" y="290" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="1029" y="290" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="1082" y="290" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><text x="1204" y="326" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">NULL</text><text x="884" y="386" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="start" font-weight="400">E2</text><rect x="923" y="350" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="976" y="350" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="1029" y="350" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="1082" y="350" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><text x="1204" y="386" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="middle" font-weight="400">NULL</text><text x="884" y="446" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="start" font-weight="400">E3</text><rect x="923" y="410" width="51" height="51" rx="0" fill="#8dc3e6" stroke="#b7c7d3"/><rect x="976" y="410" width="51" height="51" rx="0" fill="#8dc3e6" stroke="#b7c7d3"/><rect x="1029" y="410" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><rect x="1082" y="410" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><text x="1204" y="446" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">12</text><text x="884" y="506" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="start" font-weight="400">E4</text><rect x="923" y="470" width="51" height="51" rx="0" fill="#8dc3e6" stroke="#b7c7d3"/><rect x="976" y="470" width="51" height="51" rx="0" fill="#8dc3e6" stroke="#b7c7d3"/><rect x="1029" y="470" width="51" height="51" rx="0" fill="#8dc3e6" stroke="#b7c7d3"/><rect x="1082" y="470" width="51" height="51" rx="0" fill="white" stroke="#b7c7d3"/><text x="1204" y="506" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">12</text><text x="44" y="598" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">每一行是当前事件对应的一次计算，不是把输入事件折叠成一行。</text><text x="44" y="655" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#cc661c" text-anchor="start" font-weight="400">E1 与 E2 同时发生：排除当前行 ≠ 排除当前时间组。</text><text x="44" y="718" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">E3 的金额未知，但该事件仍可在窗口内；SUM 忽略其金额而非删除身份。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="539.61" viewBox="-4.35 -15.00 1029.39 462.89" role="img"><title id="detail-title">机制展开：图中明确采用无界前置到当前的窗口框架</title><desc id="detail-desc">图中明确采用无界前置到当前的窗口框架。ROWS 按当前物理行结束，RANGE 纳入当前排序值的全部同值行，因此第一行累计可分别为 1 和 2；同值行的稳定顺序需要额外排序键。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="30" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">排序值：1、1、2（a 与 b 同序值）</text><text x="25" y="90" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">源行</text><rect x="25" y="130" width="215" height="60" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="132.5" y="169.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">a:1</text><rect x="25" y="213" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="132.5" y="252.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">b:1</text><rect x="25" y="296" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="132.5" y="335.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">c:2</text><text x="410" y="90" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">ROWS 累计</text><rect x="410" y="130" width="215" height="60" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="517.5" y="169.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="410" y="213" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="517.5" y="252.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="410" y="296" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="517.5" y="335.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">4</text><text x="780" y="90" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">RANGE 累计</text><rect x="780" y="130" width="215" height="60" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="887.5" y="169.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="780" y="213" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="887.5" y="252.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="780" y="296" width="215" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="887.5" y="335.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">4</text><path d="M260,155 L390,155" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M650,155 L760,155" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="405" y="410" font-size="24" fill="#213447" font-weight="400" text-anchor="start">当前行：a</text><text x="785" y="410" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">整个同值组：a、b</text></g></svg>

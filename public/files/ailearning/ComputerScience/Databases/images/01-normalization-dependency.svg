ei,Arial,sans-serif" font-size="28" fill="#253f52" text-anchor="start" font-weight="400">用户：每个用户的一项当前事实</text><rect x="565" y="440" width="180" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3" /><text x="655.0" y="473" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">用户（主键）</text><rect x="745" y="440" width="230" height="49" rx="0" fill="#edf4f9" stroke="#b7c7d3" /><text x="860.0" y="473" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="600">当前城市</text><rect x="565" y="489" width="180" height="49" rx="0" fill="white" stroke="#b7c7d3" /><text x="655.0" y="522" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">U1</text><rect x="745" y="489" width="230" height="49" rx="0" fill="white" stroke="#b7c7d3" /><text x="860.0" y="522" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">乙城</text><line x1="425" y1="536" x2="529" y2="536" stroke="#a8b8c6" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)" /><text x="1108" y="485" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#2676b5" text-anchor="middle" font-weight="400">按用户连接</text><text x="1108" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">每单恰好匹配一次</text><text x="1108" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">3 条订单仍为 3 条</text><text x="44" y="705" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">若需要下单时城市，应保存订单快照或地址历史；不能拿当前城市代替。</text><desc> 拆表不是少存信息：让同一事实只维护一次</desc></svg>

roke-dasharray="" marker-end="url(#arr)"/><text x="1108" y="485" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#2182c7" text-anchor="middle" font-weight="400">按用户连接</text><text x="1108" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#243b53" text-anchor="middle" font-weight="400">每单恰好匹配一次</text><text x="1108" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#243b53" text-anchor="middle" font-weight="400">3 条订单仍为 3 条</text><text x="44" y="705" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">若需要下单时城市，应保存订单快照或地址历史；不能拿当前城市代替。</text><desc> 拆表不是少存信息：让同一事实只维护一次</desc></svg></svg>

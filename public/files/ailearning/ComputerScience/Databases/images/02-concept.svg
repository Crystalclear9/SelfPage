<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1090" viewBox="0 0 1650 1090"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">左连接保留订单，却可以把一笔金额计入两次</text><text xml:space="preserve" x="55" y="145" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">连接条件只有 user_id；右表同一 U 有两个版本，尚未定义唯一版本规则</text><text xml:space="preserve" x="140" y="240" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">左：一笔订单</text><text xml:space="preserve" x="680" y="240" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">右：两个候选版本</text><text xml:space="preserve" x="1250" y="240" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">输出：两条匹配</text><circle cx="220" cy="480" r="85" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="220" y="467" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">O1 · U</text><text xml:space="preserve" x="220" y="510" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">金额 100</text><circle cx="810" cy="360" r="65" fill="#fff0e4" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="810" y="370" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">U · V1</text><path d="M305,480 C480,480 550,360 735,360" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="885" y1="360" x2="1170" y2="360" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="1220" y="325" width="200" height="70" rx="0" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="1320" y="370" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">100</text><text xml:space="preserve" x="1320" y="295" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">O1 · V1</text><circle cx="810" cy="650" r="65" fill="#fff0e4" stroke="#d47732" stroke-width="2"/><text xml:space="preserve" x="810" y="660" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">U · V2</text><path d="M305,480 C480,480 550,650 735,650" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="885" y1="650" x2="1170" y2="650" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="1220" y="615" width="200" height="70" rx="0" fill="#edf5fa" stroke="#2676ad" stroke-width="2"/><text xml:space="preserve" x="1320" y="660" font-size="33" fill="#193a4e" text-anchor="middle" font-weight="400">100</text><text xml:space="preserve" x="1320" y="585" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">O1 · V2</text><line x1="55" y1="780" x2="1595" y2="780" stroke="#8ca5b4" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="55" y="850" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">同一金额尺度：原订单净额 100，直接按连接行求和 200</text><rect x="350" y="890" width="300" height="50" rx="0" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="680" y="925" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">100</text><rect x="350" y="980" width="600" height="50" rx="0" fill="#d47732" stroke="none" stroke-width="2"/><text xml:space="preserve" x="980" y="1015" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">200：同一 O1 的两份贡献</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="423.90" viewBox="-5.29 24.37 1105.12 390.39" role="img"><title id="detail-title">机制展开：沿每条匹配边生成一条输出记录</title><desc id="detail-desc">沿每条匹配边生成一条输出记录。订单 O1 匹配右表的两个版本，所以金额 100 出现两次；LEFT JOIN 的“保留左行”不意味着“每个左行只出现一次”。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="150" width="230" height="190" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="150" width="230" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="175" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">左表订单</text><text x="39" y="217" font-size="24" fill="#213447" font-weight="400" text-anchor="start">订单 O1</text><text x="39" y="248" font-size="24" fill="#213447" font-weight="400" text-anchor="start">用户 U</text><text x="39" y="279" font-size="24" fill="#213447" font-weight="400" text-anchor="start">金额 100</text><rect x="420" y="50" width="250" height="100" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="420" y="50" width="250" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="432" y="75" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">右表：U / V1</text><text x="434" y="117" font-size="24" fill="#213447" font-weight="400" text-anchor="start">匹配同一个 U</text><path d="M270,220 L410,105" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><rect x="420" y="270" width="250" height="100" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="420" y="270" width="250" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="432" y="295" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">右表：U / V2</text><text x="434" y="337" font-size="24" fill="#213447" font-weight="400" text-anchor="start">匹配同一个 U</text><path d="M270,220 L410,325" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><rect x="840" y="50" width="230" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="840" y="50" width="230" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="852" y="75" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">输出 V1</text><text x="854" y="117" font-size="24" fill="#213447" font-weight="400" text-anchor="start">O1 / U / V1</text><text x="854" y="148" font-size="24" fill="#213447" font-weight="400" text-anchor="start">金额 100</text><path d="M680,100 L825,100" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><rect x="840" y="270" width="230" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="840" y="270" width="230" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="852" y="295" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">输出 V2</text><text x="854" y="337" font-size="24" fill="#213447" font-weight="400" text-anchor="start">O1 / U / V2</text><text x="854" y="368" font-size="24" fill="#213447" font-weight="400" text-anchor="start">金额 100</text><path d="M680,320 L825,320" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /></g></svg>

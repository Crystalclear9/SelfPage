<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">LAST_VALUE 取决于窗口终点</title><desc id="desc">当排序键唯一且窗口以当前行为终点时，LAST_VALUE 返回本行对应值；把窗口显式扩到分区最后一行后，三行才都返回 30。因此“最后”必须先回答是哪个窗口中的最后。 存在同级行时，默认 RANGE frame 还可能包括同级记录，不能把这个唯一键算例直接推广到所有默认窗口。应显式说明窗口范围，并按确定的排序语义选择想要的最后值。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">LAST_VALUE 取决于窗口终点</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">按唯一键排序；比较当前行结束与整分区结束的两个 frame。</text><rect x="95.0" y="260" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="317" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 1</text><rect x="290.0" y="260" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="387.5" y="317" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">10</text><rect x="95.0" y="360" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="417" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 2</text><rect x="290.0" y="360" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="387.5" y="417" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">20</text><rect x="95.0" y="460" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="517" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 3</text><rect x="290.0" y="460" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="387.5" y="517" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">30</text><rect x="715.0" y="260" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="812.5" y="317" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 1</text><rect x="910.0" y="260" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="1007.5" y="301" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">当前 10；全窗 </text><text x="1007.5" y="333" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">30</text><rect x="715.0" y="360" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="812.5" y="417" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 2</text><rect x="910.0" y="360" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="1007.5" y="401" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">当前 20；全窗 </text><text x="1007.5" y="433" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">30</text><rect x="715.0" y="460" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="812.5" y="517" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">行 3</text><rect x="910.0" y="460" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="1007.5" y="501" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">当前 30；全窗 </text><text x="1007.5" y="533" font-size="25" fill="#20384f" text-anchor="middle" font-weight="400">30</text><text x="95" y="190" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">按唯一键升序的值</text><text x="715" y="190" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">每格并列：当前行终点 / 整分区终点</text><path d="M515,390 L680,390" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="605" font-size="23" fill="#268d8c" text-anchor="start" font-weight="400">相同函数，不同 frame</text></g></svg>

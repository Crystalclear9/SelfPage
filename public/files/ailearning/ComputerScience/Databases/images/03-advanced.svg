<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title id="figure-title">LAST_VALUE：先选窗口，再读取末行</title><desc id="figure-desc">按唯一ID排序的三项是十、空值、三十。当前行ID二，窗口到当前行返回空值，延伸到分区末尾返回三十。LAST_VALUE不会自动跳过空值。</desc><rect width="1200" height="690" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">LAST_VALUE：先选窗口，再读取末行</text><text x="40" y="112" font-size="28" fill="#213447" text-anchor="start" font-weight="400">按唯一 id=1,2,3 排序；只观察当前 id=2 这一行</text><text x="40" y="185" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">窗口到当前行</text><rect x="430" y="215" width="125" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="492.5" y="263.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><text x="492.5" y="200" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=1</text><rect x="580" y="215" width="125" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="642.5" y="263.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">NULL</text><text x="642.5" y="200" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=2</text><rect x="730" y="215" width="125" height="75" fill="white" stroke="#cbd9e4" /><text x="792.5" y="263" font-size="30" fill="#627689" text-anchor="middle" font-weight="400">30</text><text x="792.5" y="200" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=3</text><line x1="575" y1="305" x2="700" y2="305" stroke="#2865a0" stroke-width="3" /><text x="638" y="340" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">当前行</text><path d="M890 253 L955 253" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="980" y="215" width="175" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1067.5" y="263.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">NULL</text><text x="40" y="390" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">窗口到分区末尾</text><rect x="430" y="420" width="125" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="492.5" y="468.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">10</text><text x="492.5" y="405" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=1</text><rect x="580" y="420" width="125" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="642.5" y="468.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">NULL</text><text x="642.5" y="405" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=2</text><rect x="730" y="420" width="125" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="792.5" y="468.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">30</text><text x="792.5" y="405" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">id=3</text><line x1="575" y1="510" x2="700" y2="510" stroke="#c87536" stroke-width="3" /><text x="638" y="545" font-size="25" fill="#c87536" text-anchor="middle" font-weight="400">当前行</text><path d="M890 458 L955 458" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="980" y="420" width="175" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1067.5" y="468.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">30</text><text x="40" y="635" font-size="28" fill="#213447" text-anchor="start" font-weight="400">LAST_VALUE 读取 frame 的最后一行；NULL 不会自动被跳过。</text></g></svg>

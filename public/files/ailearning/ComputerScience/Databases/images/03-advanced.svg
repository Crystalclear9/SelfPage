<svg xmlns="http://www.w3.org/2000/svg" width="1478.12" height="1607.29" viewBox="0 0 1478.12 1607.29" role="img"><title>03-窗口函数与时间特征SQL</title><svg xmlns="http://www.w3.org/2000/svg" width="1478.12" height="1145.38" viewBox="23.375 85.250 1478.125 1145.375"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1478.125" height="1145.375" fill="white" x="23.375" y="85.25" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="55" y="145" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">唯一排序键 id = 1, 2, 3；固定观察当前行 id = 2</text><text xml:space="preserve" x="55" y="250" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">LAST_VALUE：frame 到当前行</text><rect x="180" y="310" width="580" height="125" rx="0" fill="#edf5fa" stroke="none" stroke-width="2" /><line x1="180" y1="445" x2="760" y2="445" stroke="#2676ad" stroke-width="4" stroke-dasharray="" /><text xml:space="preserve" x="280" y="345" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=1</text><circle cx="280" cy="395" r="38" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="280" y="406" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="660" y="345" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=2</text><circle cx="660" cy="395" r="38" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="406" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">NULL</text><text xml:space="preserve" x="1040" y="345" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=3</text><circle cx="1040" cy="395" r="38" fill="white" stroke="#b9c8d1" stroke-width="2" /><text xml:space="preserve" x="1040" y="406" font-size="29" fill="#8ca5b4" text-anchor="middle" font-weight="400">30</text><text xml:space="preserve" x="660" y="495" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">当前行</text><line x1="660" y1="465" x2="660" y2="452" stroke="#2676ad" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M710,395 C780,550 1230,550 1310,425" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1420" y="406" font-size="36" fill="#2676ad" text-anchor="middle" font-weight="700">NULL</text><text xml:space="preserve" x="55" y="590" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">LAST_VALUE：frame 到分区末尾</text><rect x="180" y="650" width="960" height="125" rx="0" fill="#fff0e4" stroke="none" stroke-width="2" /><line x1="180" y1="785" x2="1140" y2="785" stroke="#d47732" stroke-width="4" stroke-dasharray="" /><text xml:space="preserve" x="280" y="685" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=1</text><circle cx="280" cy="735" r="38" fill="white" stroke="#d47732" stroke-width="2" /><text xml:space="preserve" x="280" y="746" font-size="29" fill="#d47732" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="660" y="685" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=2</text><circle cx="660" cy="735" r="38" fill="white" stroke="#d47732" stroke-width="2" /><text xml:space="preserve" x="660" y="746" font-size="29" fill="#d47732" text-anchor="middle" font-weight="400">NULL</text><text xml:space="preserve" x="1040" y="685" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=3</text><circle cx="1040" cy="735" r="38" fill="white" stroke="#d47732" stroke-width="2" /><text xml:space="preserve" x="1040" y="746" font-size="29" fill="#d47732" text-anchor="middle" font-weight="400">30</text><text xml:space="preserve" x="660" y="835" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">当前行</text><line x1="660" y1="805" x2="660" y2="792" stroke="#d47732" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M1090,735 C1160,890 1230,890 1310,765" stroke="#d47732" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1420" y="746" font-size="36" fill="#d47732" text-anchor="middle" font-weight="700">30</text><text xml:space="preserve" x="55" y="930" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">同一历史 frame，另求最后非空值</text><rect x="180" y="990" width="580" height="125" rx="0" fill="#edf5fa" stroke="none" stroke-width="2" /><line x1="180" y1="1125" x2="760" y2="1125" stroke="#2676ad" stroke-width="4" stroke-dasharray="" /><text xml:space="preserve" x="280" y="1025" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=1</text><circle cx="280" cy="1075" r="38" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="280" y="1086" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="660" y="1025" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=2</text><circle cx="660" cy="1075" r="38" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="1086" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">NULL</text><text xml:space="preserve" x="1040" y="1025" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">id=3</text><circle cx="1040" cy="1075" r="38" fill="white" stroke="#b9c8d1" stroke-width="2" /><text xml:space="preserve" x="1040" y="1086" font-size="29" fill="#8ca5b4" text-anchor="middle" font-weight="400">30</text><text xml:space="preserve" x="660" y="1175" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">当前行</text><line x1="660" y1="1145" x2="660" y2="1132" stroke="#2676ad" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M330,1075 C400,1230 1230,1230 1310,1105" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1420" y="1086" font-size="36" fill="#2676ad" text-anchor="middle" font-weight="700">10</text></g><desc> 窗口末值、全分区末值、最后非空值是三个问题</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 1145.38) scale(1.02648)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">当前行值为空时，扩大 frame 与跳过空值是两个不同操作</text><rect x="65" y="145" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="261.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">10</text><rect x="465" y="145" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="661.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">NULL</text><rect x="865" y="145" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1061.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">30</text><text x="65" y="265" font-size="30" fill="#c96937" text-anchor="start">当前 id=2：frame 到当前行 → LAST_VALUE 返回 NULL</text><text x="65" y="335" font-size="30" fill="#216c89" text-anchor="start">frame 到分区末：返回30；历史最后非空：返回10</text><text x="65" y="411" font-size="28" fill="#203742" text-anchor="start">30 来自未来行，10 来自允许历史；两种非空结果回答不同问题。</text></g></g></svg>

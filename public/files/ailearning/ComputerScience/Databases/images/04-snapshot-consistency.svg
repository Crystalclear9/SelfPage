<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1110.000" height="532.000" viewBox="15.000 66.000 1110.000 532.000" role="img"><title id="figure-title">稳定分页键不能替代一致的数据版本</title><desc id="figure-desc">示例只关注两个账户：一次原子转账把 T0 的 (100,100) 改为 T1 的 (60,140)，两个完整状态的合计都为 200。若第一页从旧视图读到 A=100，第二页从新视图读到 B=140，就拼出 240；这些键仍然有序且不重复，问题出在读取版本不同。右侧不是某个真实时点的完整账户状态。多条语句是否共享同一视图取决于产品与隔离协议，不能仅凭使用事务或键集分页就推断已经满足图示一致性。 稳定分页键不能替代一致的数据版本</desc><rect width="1110.0" height="532.0" fill="white" x="15.0" y="66.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">提交前 T0</text><text x="450" y="115" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">一次转账后 T1</text><text x="845" y="115" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">跨版本拼接</text><text x="55" y="215" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">A</text><rect x="110" y="175" width="180" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="200.0" y="223.35" font-size="31" fill="#2865a0" text-anchor="middle" font-weight="400">100</text><text x="55" y="350" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">B</text><rect x="110" y="310" width="180" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="200.0" y="358.35" font-size="31" fill="#2865a0" text-anchor="middle" font-weight="400">100</text><text x="55" y="485" font-size="32" fill="#2865a0" text-anchor="start" font-weight="600">合计 200</text><text x="460" y="215" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">A</text><rect x="515" y="175" width="180" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="605.0" y="223.35" font-size="31" fill="#2865a0" text-anchor="middle" font-weight="400">60</text><text x="460" y="350" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">B</text><rect x="515" y="310" width="180" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="605.0" y="358.35" font-size="31" fill="#2865a0" text-anchor="middle" font-weight="400">140</text><text x="460" y="485" font-size="32" fill="#2865a0" text-anchor="start" font-weight="600">合计 200</text><text x="865" y="215" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">A</text><rect x="920" y="175" width="180" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="223.35" font-size="31" fill="#c87536" text-anchor="middle" font-weight="400">100</text><text x="865" y="350" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">B</text><rect x="920" y="310" width="180" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="358.35" font-size="31" fill="#c87536" text-anchor="middle" font-weight="400">140</text><text x="865" y="485" font-size="32" fill="#c87536" text-anchor="start" font-weight="600">合计 240</text><path d="M320 212 L420 212" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="335" y="285" font-size="26" fill="#213447" text-anchor="start" font-weight="400">转账 40</text><path d="M300 175 Q600 85 900 175" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M700 350 L875 350" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="570" font-size="28" fill="#213447" text-anchor="start" font-weight="400">键顺序保持不变，逐页取到的值仍可能属于不同状态。</text></g></svg>

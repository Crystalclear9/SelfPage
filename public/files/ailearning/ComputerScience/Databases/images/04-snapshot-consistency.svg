  <polyline points="1104,172 1171,172" fill="none" stroke="#196f77" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="1231" y="183" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">100</text>
  <polygon points="829,326 1052.9,326 1087,264 863.1,264" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="958" y="304.24" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">新视图取 B</text>
  <polyline points="1104,295 1171,295" fill="none" stroke="#655184" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <text x="1231" y="306" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">140</text>
  <polygon points="873,491.5 1159,491.5 1195,416.5 909,416.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="1034" y="463.24" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">混合结果为 240</text>
  <text x="1029" y="558" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">两个完整版本的合计都为 200。</text>
  <text x="680" y="653" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">分页键的稳定性与读取视图的一致性是两个条件。</text>

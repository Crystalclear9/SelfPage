  <title id="plate-title">顺序正确的两页也可能来自不同版本</title>
  <desc id="plate-desc">同一提交把 A 从 100 改为 60、B 从 100 改为 140。跨版本分页会把 A=100 与 B=140 拼成不存在的状态。</desc>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="799.9824" viewBox="0 0 1440 799.9824" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">迟到的中间事件把两个已有会话合并并改变旧事件的会话归属</title><rect width="1440" height="799.9824" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">迟到的中间事件把两个已有会话合并并改变旧事件的会话归属</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="657.9824" viewBox="13.867 0 1163.733 569.729" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">迟到的一条事件，可以把两个旧会话连接起来</title><desc id="desc">迟到的一条事件，可以把两个旧会话连接起来 </desc><rect width="1163.733" height="569.729" fill="white" x="13.867" y="0.0"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348" transform="translate(0,-100)"><text x="40" y="145" font-size="28" fill="#1f3348" text-anchor="start" font-weight="400">相邻事件间隔 &gt; 5 才断开；同一用户</text><text x="40" y="190" font-size="29" fill="#1f3348" text-anchor="start" font-weight="600">可用时刻 8：只收到事件时间 0、8</text><path d="M175 285L1055 285" fill="none" stroke="#748e9f" stroke-width="2"/><circle cx="175" cy="285" r="11" fill="#2479b3" stroke="#2479b3" stroke-width="2"/><text x="175" y="330" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><text x="175" y="245" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">会话 1 · 金额 10</text><circle cx="1055" cy="285" r="11" fill="#c56f36" stroke="#c56f36" stroke-width="2"/><text x="1055" y="330" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">8</text><text x="1055" y="245" font-size="27" fill="#c56f36" text-anchor="middle" font-weight="400">会话 2 · 金额 20</text><text x="615" y="280" font-size="29" fill="#748e9f" text-anchor="middle" font-weight="400">间隔 8 &gt; 5</text><text x="40" y="420" font-size="29" fill="#1f3348" text-anchor="start" font-weight="600">可用时刻 9：补到事件时间 4、金额 5</text><path d="M175 520L1055 520" fill="none" stroke="#2479b3" stroke-width="5"/><circle cx="175" cy="520" r="12" fill="#2479b3" stroke="#2479b3" stroke-width="2"/><text x="175" y="565" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><circle cx="615" cy="520" r="12" fill="#c56f36" stroke="#c56f36" stroke-width="2"/><text x="615" y="565" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">4</text><circle cx="1055" cy="520" r="12" fill="#2479b3" stroke="#2479b3" stroke-width="2"/><text x="1055" y="565" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">8</text><text x="395" y="485" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">间隔 4 ≤ 5</text><text x="835" y="485" font-size="27" fill="#2479b3" text-anchor="middle" font-weight="400">间隔 4 ≤ 5</text><text x="640" y="640" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">合并后：10 + 5 + 20 = 35</text></g></svg></svg>

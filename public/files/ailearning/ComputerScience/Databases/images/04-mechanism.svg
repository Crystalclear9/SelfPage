<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1150.000" height="546.000" viewBox="15.000 67.000 1150.000 546.000" role="img"><title id="figure-title">复合索引：筛选范围与输出顺序分开推导</title><desc id="figure-desc">同一字典序索引中，固定用户并限制时间得到连续匹配段；只限制时间会得到散布匹配项，不能自动按全局时间输出。 复合索引：筛选范围与输出顺序分开推导 色块只标明逻辑匹配项，不代表优化器选定的扫描步骤。</desc><rect width="1150.0" height="546.0" fill="white" x="15.0" y="67.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">升序 B-tree 键：(user_id,event_time)，不含 NULL</text><text x="40" y="180" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">user_id=2 且 event_time≥3</text><rect x="40" y="235" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="110" y="280" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(1, 1)</text><rect x="200" y="235" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="270" y="280" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(1, 9)</text><rect x="360" y="235" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="430" y="280" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(2, 1)</text><rect x="520" y="235" width="140" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="590.0" y="279.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">(2, 3)</text><rect x="680" y="235" width="140" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="750.0" y="279.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">(2, 8)</text><rect x="840" y="235" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="910" y="280" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(3, 1)</text><rect x="1000" y="235" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="1070" y="280" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(3, 4)</text><text x="40" y="355" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">匹配项连续：可定位到同一用户的一个时间区间</text><text x="40" y="410" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">仅 event_time≥3</text><rect x="40" y="465" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="110" y="510" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(1, 1)</text><rect x="200" y="465" width="140" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="270.0" y="509.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">(1, 9)</text><rect x="360" y="465" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="430" y="510" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(2, 1)</text><rect x="520" y="465" width="140" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="590.0" y="509.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">(2, 3)</text><rect x="680" y="465" width="140" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="750.0" y="509.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">(2, 8)</text><rect x="840" y="465" width="140" height="70" rx="6" fill="white" stroke="#cbd9e4" /><text x="910" y="510" font-size="27" fill="#627689" text-anchor="middle" font-weight="400">(3, 1)</text><rect x="1000" y="465" width="140" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1070.0" y="509.45" font-si
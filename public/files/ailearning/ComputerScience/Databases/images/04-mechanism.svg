<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">复合索引是字典序，不是两个独立排序</title><desc id="desc">索引 (user_id,event_time) 先按用户，再在同一用户内按时间排列。因此用户 2 且时间至少为 3 的记录形成连续后缀范围；所有用户中“时间至少为 3”的记录却不一定形成单一连续区间。 表为升序且无 NULL 的最小示例，说明访问范围而非保证数据库必选此索引。实际选择还受选择性、覆盖列、排序需求与代价估计影响。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="660" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="485.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">复合索引是字典序，不是两个独立排序</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">示意 B-tree 字典序；索引能否避免额外排序还取决于查询条件。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">索引次序</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">user_id</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">event_time</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">user_id=2 且 time≥3</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">9</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">否</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">否</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">是</text><rect x="60.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">4</text><rect x="330.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="600.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">8</text><rect x="870.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">是</text><rect x="60.0" y="490" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="520" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">5</text><rect x="330.0" y="490" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="520" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3</text><rect x="600.0" y="490" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="520" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="870.0" y="490" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="520" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">否</text></g></svg>

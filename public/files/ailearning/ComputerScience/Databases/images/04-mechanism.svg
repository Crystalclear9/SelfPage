<title id="fig-title">复合索引上连续范围与离散命中</title>
<desc id="fig-desc">复合顺序先按用户再按时间。只有时间条件时，符合条件的条目分散在多个用户段。</desc>
<rect x="0" y="0" width="1200" height="614" fill="#ffffff" opacity="1"/>

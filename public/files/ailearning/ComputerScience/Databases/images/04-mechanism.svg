="28" fill="#80929d" text-anchor="middle" font-weight="400">(3, 1)</text><rect x="1415" y="1000" width="150" height="75" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1490" y="1050" font-size="28" fill="#d87332" text-anchor="middle" font-weight="400">(3, 4)</text><text x="900" y="1205" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">命中时间依次为 9、3、8、4；仍需按目标顺序处理</text></g></svg>
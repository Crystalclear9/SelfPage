29d" stroke-width="2" marker-end="url(#g)"/><line x1="900" y1="235" x2="900" y2="310" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="660" y="330" width="500" height="120" rx="4" fill="white" stroke="#80929d" stroke-width="2"/><rect x="675" y="350" width="150" height="75" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="750" y="400" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">(2, 1)</text><rect x="835" y="350" width="150" height="75" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="910" y="400" font-size="28" fill="#176b91" text-anchor="middle" font-weight="400">(2, 3)</text><rect x="995" y="350" width="150" height="75" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1070" y="400" font-size="28" fill="#176b91" text-anchor="middle" font-weight="400">(2, 8)</text><line x1="1170" y1="390" x2="1225" y2="390" stroke="#80929d" stroke-width="2" marker-end="url(#g)"/><line x1="1120" y1="235" x2="1480" y2="310" stroke="#d9e4ea" stroke-width="3"/><rect x="1240" y="330" width="500" height="120" rx="4" fill="white" stroke="#80929d" stroke-width="2"/><rect x="1255" y="350" width="150" height="75" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="1330" y="400" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">(3, 1)</text><rect x="1415" y="350" width="150" height="75" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="1490" y="400" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">(3, 4)</text><text x="900" y="555" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">定位 (2, 3)，连续读取 (2, 3)、(2, 8)</text><text x="70" y="715" font-size="34" fill="#d87332" text-anchor="start" font-weight="700">仅 event_time ≥ 3</text><rect x="600" y="780" width="600" height="90" rx="4" fill="white" stroke="#80929d" stroke-width="2"/><text x="900" y="840" font-size="33" fill="#203b4a" text-anchor="middle" font-weight="400">(2, 1)    
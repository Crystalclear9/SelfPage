<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img"><title>会话切分：比较相邻间隔，不限制总时长</title><rect width="1280" height="700" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">会话切分：比较相邻间隔，不限制总时长</text><text x="45" y="115" font-size="27" fill="#233943" text-anchor="start">同一用户；按时间排序；只有相邻间隔 &gt; 5 才开启新会话</text><line x1="100" y1="280" x2="1144" y2="280" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><text x="100" y="330" font-size="25" fill="#697d87" text-anchor="middle">0</text><text x="332" y="330" font-size="25" fill="#697d87" text-anchor="middle">4</text><text x="564" y="330" font-size="25" fill="#697d87" text-anchor="middle">8</text><text x="796" y="330" font-size="25" fill="#697d87" text-anchor="middle">12</text><text x="1028" y="330" font-size="25" fill="#697d87" text-anchor="middle">16</text><circle cx="100" cy="280" r="12" fill="#276884"/><line x1="100" y1="260" x2="100" y2="242" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><circle cx="332" cy="280" r="12" fill="#276884"/><line x1="332" y1="260" x2="332" y2="242" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><circle cx="796" cy="280" r="12" fill="#b25d2b"/><line x1="796" y1="260" x2="796" y2="242" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><circle cx="1028" cy="280" r="12" fill="#b25d2b"/><line x1="1028" y1="260" x2="1028" y2="242" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><line x1="100" y1="205" x2="332" y2="205" stroke="#276884" stroke-width="4" stroke-dasharray=""/><text x="216.0" y="180" font-size="27" fill="#276884" text-anchor="middle">间隔 4 ≤ 5</text><line x1="796" y1="205" x2="1028" y2="205" stroke="#b25d2b" stroke-width="4" stroke-dasharray=""/><text x="912.0" y="180" font-size="27" fill="#b25d2b" text-anchor="middle">间隔 4 ≤ 5</text><line x1="332" y1="380" x2="796" y2="380" stroke="#b25d2b" stroke-width="3" stroke-dasharray=""/><text x="564" y="425" font-size="28" fill="#b25d2b" text-anchor="middle">间隔 8 &gt; 5：在 12 开启会话 2</text><text x="216" y="250" font-size="25" fill="#276884" text-anchor="middle">会话 1</text><text x="912" y="250" font-size="25" fill="#b25d2b" text-anchor="middle">会话 2</text><line x1="45" y1="465" x2="1235" y2="465" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="45" y="520" font-size="28" fill="#276884" text-anchor="start">对照：0 → 4 → 8</text><circle cx="650" cy="530" r="10" fill="#276884"/><circle cx="866" cy="530" r="10" fill="#276884"/><circle cx="1082" cy="530" r="10" fill="#276884"/><line x1="650" y1="530" x2="1082" y2="530" stroke="#276884" stroke-width="3" stroke-dasharray=""/><text x="758" y="580" font-size="26" fill="#276884" text-anchor="middle">间隔 4</text><text x="974" y="580" font-size="26" fill="#276884" text-anchor="middle">间隔 4</text><text x="45" y="635" font-size="29" fill="#233943" text-anchor="start">总跨度为 8，仍是一个会话：没有任何相邻间隔超过 5。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726.20" viewBox="11.00 10.00 1122.00 679.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">会话边界来自相邻事件间隔</title><desc id="desc">假设新会话定义为与前一事件的间隔严格大于 5。事件序列为 0、4、12、16，相邻差为 4、8、4，因此 12 开始新的会话。可以先用 LAG 得间隔，再标记边界并累计生成会话编号。 横轴按实际时间距离绘制，第三行只是突出两个会话间的空隙。若规则改成大于等于，恰好等于阈值的事件归属会变化；必须先声明端点。 阈值取 5；按事件排序，间隔大于 5 时才建立新会话。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">会话边界来自相邻事件间隔</text><path d="M250,195 L1090,195" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><path d="M418,188 L418,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="418" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><path d="M586,188 L586,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="586" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">8</text><path d="M754,188 L754,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="754" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">12</text><path d="M922,188 L922,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="922" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">16</text><path d="M1090,188 L1090,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">20</text><text x="60" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">会话 1：事件 0、4</text><rect x="250.0" y="255" width="168.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="334" y="337" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">间隔 4</text><text x="60" y="375" font-size="24" fill="#213447" text-anchor="start" font-weight="400">会话 2：事件 12、</text><text x="60" y="403" font-size="24" fill="#213447" text-anchor="start" font-weight="400">16</text><rect x="754.0" y="370" width="168.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="838" y="452" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">间隔 4</text><text x="60" y="490" font-size="24" fill="#213447" text-anchor="start" font-weight="400">跨会话间隔</text><rect x="418.0" y="485" width="336.0" height="48" fill="#f5dfcb" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="586" y="567" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">8 &gt; 阈值 5</text><text x="1090" y="650" font-size="24" fill="#627689" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

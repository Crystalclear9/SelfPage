<svg xmlns="http://www.w3.org/2000/svg" width="1064.000" height="637.000" viewBox="31.000 1.000 1064.000 637.000" role="img" aria-labelledby="title desc"><title id="title">丢失更新：旧读值留在应用端</title><desc id="desc">A和B分别读100，应用各计算90和80，随后常量回写90与80。最终80不同于串行扣减所得70。 </desc><rect width="1064.0" height="637.0" fill="white" x="31.0" y="1.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="55" y="50" fill="#24679c" font-size="30" text-anchor="start" font-weight="600">应用 A：扣 10</text><text x="475" y="50" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">已提交余额</text><text x="875" y="50" fill="#c66e30" font-size="30" text-anchor="start" font-weight="600">应用 B：扣 20</text><line x1="210" y1="80" x2="210" y2="480" stroke="#d9e3eb" stroke-width="2" stroke-dasharray="5 6" /><line x1="600" y1="80" x2="600" y2="480" stroke="#d9e3eb" stroke-width="2" stroke-dasharray="5 6" /><line x1="1000" y1="80" x2="1000" y2="480" stroke="#d9e3eb" stroke-width="2" stroke-dasharray="5 6" /><circle cx="600" cy="110" r="29" fill="white" stroke="#24679c" stroke-width="2" /><text x="600" y="119" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">100</text><circle cx="600" cy="205" r="29" fill="white" stroke="#24679c" stroke-width="2" /><text x="600" y="214" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">100</text><circle cx="600" cy="315" r="29" fill="white" stroke="#24679c" stroke-width="2" /><text x="600" y="324" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">90</text><circle cx="600" cy="425" r="29" fill="white" stroke="#c66e30" stroke-width="2" /><text x="600" y="434" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">80</text><line x1="570" y1="110" x2="230" y2="110" stroke="#24679c" stroke-width="2" marker-end="url(#b)" /><text x="60" y="155" fill="#24679c" font-size="26" text-anchor="start" font-weight="400">保留读值 100 → 算出 90</text><line x1="630" y1="205" x2="980" y2="205" stroke="#c66e30" stroke-width="2" marker-end="url(#o)" /><text x="825" y="255" fill="#c66e30" font-size="26" text-anchor="start" font-weight="400">保留读值 100</text><text x="825" y="291" fill="#c66e30" font-size="26" text-anchor="start" font-weight="400">→ 算出 80</text><line x1="230" y1="315" x2="570" y2="315" stroke="#24679c" stroke-width="2" marker-end="url(#b)" /><text x="60" y="355" fill="#24679c" font-size="26" text-anchor="start" font-weight="400">写常量 90，提交</text><line x1="980" y1="425" x2="630" y2="425" stroke="#c66e30" stroke-width="2" marker-end="url(#o)" /><text x="825" y="470" fill="#c66e30" font-size="26" text-anchor="start" font-weight="400">仍写旧读值算出的 80</text><text x="55" y="550" fill="#24679c" font-size="30" text-anchor="start" font-weight="400">串行目标：100 − 10 − 20 = 70</text><text x="650" y="550" fill="#c66e30" font-size="30" text-anchor="start" font-weight="400">本次交错：100 → 90 → 80</text><text x="55" y="610" fill="#23384b" font-size="27" text-anchor="start" font-weight="400">图示允许旧值常量回写的协议；并非所有隔离级别都允许这条轨迹。</text></g></svg>

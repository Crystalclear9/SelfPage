<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">事务中的读改写也需要并发协议</title><desc id="desc">假设两个操作分别扣减 10 和 20，却都先读取旧余额 100，再分别写回计算结果。在允许这类交错且缺乏正确并发保护的模型中，最终余额可能为 80，丢失了扣减 10 的影响。 这不是对所有数据库或隔离级别的行为断言。原子更新、行锁、乐观版本检查或可串行化协议会改变允许的执行；必须按实际引擎与事务语义验证。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">事务中的读改写也需要并发协议</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">示意应用层无保护的旧值覆盖；结果取决于隔离级别和冲突协议。</text><path d="M300,195 L1100,195" stroke="#507db3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="178" font-size="21" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><path d="M300,195 L300,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="500" y="178" font-size="21" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><path d="M500,195 L500,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="700" y="178" font-size="21" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><path d="M700,195 L700,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="900" y="178" font-size="21" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><path d="M900,195 L900,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1100" y="178" font-size="21" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M1100,195 L1100,650" stroke="#e2eaf1" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="270" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">事务 A</text><text x="65" y="415" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">事务 B</text><text x="65" y="560" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">共享余额</text><rect x="300.0" y="235" width="195.0" height="80" fill="#dcece8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="267" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">读 100</text><rect x="500.0" y="380" width="195.0" height="80" fill="#e1eaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="512" y="412" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">读 100</text><rect x="700.0" y="235" width="195.0" height="80" fill="#dcece8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="712" y="267" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">写 90</text><rect x="900.0" y="380" width="195.0" height="80" fill="#e1eaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="912" y="412" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">写 80</text><rect x="300.0" y="525" width="395.0" height="80" fill="#f8e6d4" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="557" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">100</text><rect x="700.0" y="525" width="195.0" height="80" fill="#f8e6d4" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="712" y="557" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">90</text><rect x="900.0" y="525" width="195.0" height="80" fill="#f8e6d4" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="912" y="557" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">80</text><text x="1030" y="710" font-size="22" fill="#5c7185" text-anchor="start" font-weight="400">逻辑时间</text></g></svg>

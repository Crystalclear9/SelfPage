<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title id="figure-title">双时间筛选：先确定当时知道哪个版本</title><desc id="figure-desc">事件v1在时间9发生并可用，金额10；v2在可用时间12把事件时间改成4、金额100。预测13时最新版本v2不在事件窗口8到13，正确合计0；先筛事件窗口会错误保留v1并得到10。</desc><rect width="1200" height="920" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">双时间筛选：先确定当时知道哪个版本</text><text x="55" y="145" font-size="29" fill="#213447" text-anchor="start" font-weight="400">预测 t=13；事件窗口 [8,13)</text><rect x="390" y="219" width="175" height="351" fill="#eaf2fa" /><line x1="110" y1="192" x2="110" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="110" y="606" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="250" y1="192" x2="250" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="250" y="606" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="390" y1="192" x2="390" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="390" y="606" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">8</text><line x1="425" y1="192" x2="425" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="425" y="606" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">9</text><line x1="530" y1="192" x2="530" y2="570" stroke="#cbd9e4" stroke-width="2" /><line x1="565" y1="192" x2="565" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="565" y="606" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">13</text><line x1="600" y1="192" x2="600" y2="570" stroke="#cbd9e4" stroke-width="2" /><line x1="110" y1="570" x2="600" y2="570" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="578" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="110" y1="462" x2="600" y2="462" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="470" font-size="24" fill="#627689" text-anchor="end" font-weight="400">4</text><line x1="110" y1="354" x2="600" y2="354" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="362" font-size="24" fill="#627689" text-anchor="end" font-weight="400">8</text><line x1="110" y1="327" x2="600" y2="327" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="335" font-size="24" fill="#627689" text-anchor="end" font-weight="400">9</text><line x1="110" y1="246" x2="600" y2="246" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="254" font-size="24" fill="#627689" text-anchor="end" font-weight="400">12</text><line x1="110" y1="219" x2="600" y2="219" stroke="#cbd9e4" stroke-width="2" /><text x="95" y="227" font-size="24" fill="#627689" text-anchor="end" font-weight="400">13</text><line x1="110" y1="192" x2="600" y2="192" stroke="#cbd9e4" stroke-width="2" /><text x="55" y="185" font-size="25" fill="#213447" text-anchor="start" font-weight="400">可用时间</text><text x="390" y="650" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">事件时间</text><line x1="110" y1="219" x2="600" y2="219" stroke="#c87536" stroke-width="3" stroke-dasharray="7 6" /><circle cx="425" cy="327" r="11" fill="#2865a0" /><text x="485" y="377" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">v1：金额 10</text><circle cx="250" cy="246" r="11" fill="#c87536" /><text x="235" y="296" font-size="26" fill="#c87536" text-anchor="middle" font-weight="400">v2：金额 100</text><text x="665" y="215" font-size="29" fill="#213447" text-anchor="start" font-weight="400">同一事件的两次版本</text><text x="665" y="285" font-size="28" fill="#213447" text-anchor="start" font-weight="400">v1：事件 9，可用 9</text><text x="665" y="350" font-size="28" fill="#213447" text-anchor="start" font-weight="400">v2：事件 4，可用 12</text><text x="665" y="440" font-size="28" fill="#213447" text-anchor="start" font-weight="400">两者在 t=13 前已知</text><text x="665" y="505" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">最新的是 v2</text><text x="665" y="565" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">但事件 4 不在窗口内</text><line x1="55" y1="690" x2="1145" y2="690" stroke="#cbd9e4" stroke-width="2" /><text x="55" y="745" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">先选可见最新版本</text><text x="55" y="805" font-size="28" fill="#213447" text-anchor="start" font-weight="400">v2 → 检查事件时间 4</text><text x="55" y="870" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">正确窗口合计：0</text><text x="645" y="745" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">先筛事件窗口</text><text x="645" y="805" font-size="28" fill="#213447" text-anchor="start" font-weight="400">只留 v1 → 当成最新</text><text x="645" y="870" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">错误复活旧版：10</text></g></svg>
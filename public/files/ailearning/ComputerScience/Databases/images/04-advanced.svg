<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726.20" viewBox="11.00 10.00 1122.00 679.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">游标与完成范围是两种不同状态</title><desc id="desc">游标说明已经提交到哪个位置，高水位说明本轮计划覆盖到哪里。图把这两个状态分开：恢复后应继续处理游标之后、固定高水位以内的记录，而不是无条件追赶不断到来的新数据。 稳定键和高水位仍不等于一致快照；范围内的修改、删除、延迟提交和补录都可能影响完整性。需要结合快照或可验证的数据版本协议证明本轮提取了什么。 高水位仅固定键范围；任意修改下的一致性仍需快照或变更协议。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">游标与完成范围是两种不同状态</text><path d="M250,195 L1090,195" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><path d="M418,188 L418,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="418" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><path d="M586,188 L586,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="586" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><path d="M754,188 L754,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="754" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">6</text><path d="M922,188 L922,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="922" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">8</text><path d="M1090,188 L1090,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">10</text><text x="60" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">已提交分片</text><rect x="250.0" y="255" width="336.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="418" y="337" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">游标 k=4</text><text x="60" y="375" font-size="24" fill="#213447" text-anchor="start" font-weight="400">尚待提取的固定范</text><text x="60" y="403" font-size="24" fill="#213447" text-anchor="start" font-weight="400">围</text><rect x="586.0" y="370" width="336.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="754" y="452" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">本轮高水位 k=8</text><text x="60" y="490" font-size="24" fill="#213447" text-anchor="start" font-weight="400">后续新数据</text><rect x="922.0" y="485" width="168.0" height="48" fill="#f5dfcb" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="1006" y="567" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">不属于本轮范围</text><text x="1090" y="650" font-size="24" fill="#627689" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="874.7597" viewBox="0 0 1440 874.7597" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">游标与完成范围是两种不同状态</title><rect width="1440" height="874.7597" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">游标与完成范围是两种不同状态</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="732.7597" viewBox="18.133 64 1179.733 643.2" x="48" y="106" overflow="hidden"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516e86" stroke-width="1.6"/></marker></defs><rect width="1179.733" height="643.2" fill="white" x="18.133" y="64.0"/><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">蓝色：已提交输出；橙色：尚未提交写入；白色：尚未完成。</text><text x="44" y="166" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">源键固定为 1…9，每批 3 条；本轮上界为 9，不是经过了 9 秒。</text><text x="331" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">1</text><text x="403" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">2</text><text x="475" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">3</text><text x="547" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">4</text><text x="619" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">5</text><text x="691" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">6</text><text x="763" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">7</text><text x="835" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">8</text><text x="907" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">9</text><text x="1120" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="middle" font-weight="400">持久游标</text><text x="44" y="274" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">初态</text><rect x="300" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="372" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="444" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="516" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="588" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="660" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="732" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="804" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="876" y="240" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><text x="1120" y="274" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2182c7" text-anchor="middle" font-weight="400">c = 0</text><text x="44" y="352" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">首批写入后故障</text><rect x="300" y="318" width="62" height="49" rx="0" fill="#f2c7a2" stroke="#bbc6d7"/><rect x="372" y="318" width="62" height="49" rx="0" fill="#f2c7a2" stroke="#bbc6d7"/><rect x="444" y="318" width="62" height="49" rx="0" fill="#f2c7a2" stroke="#bbc6d7"/><rect x="516" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="588" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="660" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="732" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="804" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="876" y="318" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><text x="1120" y="352" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2182c7" text-anchor="middle" font-weight="400">c = 0</text><text x="44" y="430" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">回滚后重试成功</text><rect x="300" y="396" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="372" y="396" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="444" y="396" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="516" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="588" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="660" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="732" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="804" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="876" y="396" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><text x="1120" y="430" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2182c7" text-anchor="middle" font-weight="400">c = 3</text><text x="44" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">下一批成功</text><rect x="300" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="372" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="444" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="516" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="588" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="660" y="474" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="732" y="474" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="804" y="474" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><rect x="876" y="474" width="62" height="49" rx="0" fill="white" stroke="#bbc6d7"/><text x="1120" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2182c7" text-anchor="middle" font-weight="400">c = 6</text><text x="44" y="586" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">末批成功</text><rect x="300" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="372" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="444" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="516" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="588" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="660" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="732" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="804" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><rect x="876" y="552" width="62" height="49" rx="0" fill="#90c8eb" stroke="#bbc6d7"/><text x="1120" y="586" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#2182c7" text-anchor="middle" font-weight="400">c = 9</text><text x="44" y="677" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#243b53" text-anchor="start" font-weight="400">故障行的橙色写入被回滚：游标与输出都回到初态，再完整重做首批。</text><desc> 输出和游标一起提交：九条固定源记录的恢复过程 本轮完成：每个源键恰好一个平方值；若源还能修改，仍需另定快照协议。</desc></svg></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="796" viewBox="0 0 1360 796" role="img" aria-labelledby="plate-title plate-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 775.200000 453.720000"/>
<view id="textbook-detail-1-2" viewBox="584.800000 0.000000 775.200000 453.720000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 342.280000 775.200000 453.720000"/>
<view id="textbook-detail-2-2" viewBox="584.800000 342.280000 775.200000 453.720000"/>
  <title id="plate-title">筛选发生在补空之前还是之后</title>
  <desc id="plate-desc">把 done 放进 ON 会为没有合格订单的用户补空。把 done 放在 WHERE 会过滤掉补空行以及不合格订单。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="796" fill="white" stroke="none" stroke-width="0"/>
  <text x="681" y="60" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">同一份用户和订单数据</text>
  <polygon points="56.5,162.5 387.5,162.5 423.5,95.5 92.5,95.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="240" y="137.25" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">用户 1：10 完成，11 取消</text>
  <polygon points="494.5,162.5 825.5,162.5 861.5,95.5 530.5,95.5" fill="url(#wash-gray)" stroke="#657682" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="678" y="137.25" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#657682" text-anchor="middle">用户 2：无订单</text>
  <polygon points="932.5,162.5 1263.5,162.5 1299.5,95.5 968.5,95.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="1116" y="137.25" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">用户 3：12 取消</text>
  <polyline points="92,192 1279,192" fill="none" stroke="#d4e0e4" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330" y="253" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">在 ON 中限制匹配</text>
  <polygon points="144.5,346.5 337.25,346.5 367.5,291.5 174.75,291.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="256" y="328.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">(1, 10)</text>
  <text x="485" y="327" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">保留</text>
  <polygon points="144.5,436.5 337.25,436.5 367.5,381.5 174.75,381.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="256" y="418.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">(2, NULL)</text>
  <text x="485" y="417" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">补空</text>
  <polygon points="144.5,526.5 337.25,526.5 367.5,471.5 174.75,471.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="256" y="508.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">(3, NULL)</text>
  <text x="485" y="507" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">补空</text>
  <text x="332" y="705" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">三位用户各留一行</text>
  <text x="1010" y="253" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">先左连接，再在 WHERE 中筛选</text>
  <polygon points="824.5,346.5 1017.25,346.5 1047.5,291.5 854.75,291.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="936" y="328.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">(1, 10)</text>
  <text x="1165" y="327" font-size="27" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">TRUE</text>
  <polygon points="824.5,436.5 1017.25,436.5 1047.5,381.5 854.75,381.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="936" y="418.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">(1, 11)</text>
  <text x="1165" y="417" font-size="27" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">FALSE</text>
  <polygon points="824.5,526.5 1017.25,526.5 1047.5,471.5 854.75,471.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="936" y="508.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">(2, NULL)</text>
  <text x="1165" y="507" font-size="27" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">UNKNOWN</text>
  <polygon points="824.5,616.5 1017.25,616.5 1047.5,561.5 854.75,561.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="936" y="598.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">(3, 12)</text>
  <text x="1165" y="597" font-size="27" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">FALSE</text>
  <text x="1012" y="705" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">WHERE 只保留第一行</text>
  <text x="680" y="767" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">先已有匹配行又被过滤时，系统不会再补空。</text>
</svg>

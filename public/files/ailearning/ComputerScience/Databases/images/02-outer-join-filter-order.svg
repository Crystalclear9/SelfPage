<svg xmlns="http://www.w3.org/2000/svg" width="1232.000" height="713.368" viewBox="13.867 61.847 1232.000 713.368" role="img" aria-labelledby="title desc"><title id="title">先生成哪些行，再决定保留哪些行</title><desc id="desc">先生成哪些行，再决定保留哪些行 先生成哪些行，再决定保留哪些行</desc><rect width="1232.0" height="713.368" fill="white" x="13.867" y="61.847" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="40" y="110" font-size="27" fill="#203747" text-anchor="start" font-weight="400">用户 1 有 done、cancelled；用户 2 无订单；用户 3 只有 cancelled</text><text x="40" y="165" font-size="28" fill="#286da2" text-anchor="start" font-weight="600">把 done 放进 ON：只用合格订单匹配，未匹配用户补空行</text><circle cx="205" cy="215" r="26" fill="white" stroke="#286da2" stroke-width="2" /><text x="205" y="225" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">1</text><path d="M205 245L205 285" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><rect x="55" y="300" width="300" height="62" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="205" y="341" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">(1, 10)</text><circle cx="625" cy="215" r="26" fill="white" stroke="#286da2" stroke-width="2" /><text x="625" y="225" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">2</text><path d="M625 245L625 285" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><rect x="475" y="300" width="300" height="62" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="625" y="341" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">(2, NULL)</text><circle cx="1045" cy="215" r="26" fill="white" stroke="#286da2" stroke-width="2" /><text x="1045" y="225" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">3</text><path d="M1045 245L1045 285" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><rect x="895" y="300" width="300" height="62" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="1045" y="341" font-size="27" fill="#203747" text-anchor="middle" font-weight="400">(3, NULL)</text><text x="40" y="430" font-size="28" fill="#c96e32" text-anchor="start" font-weight="600">先按用户连接，再 WHERE done：过滤不会重新补空行</text><rect x="55" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2" /><text x="195" y="504" font-size="24" fill="#203747" text-anchor="middle" font-weight="400">(1, 10, done)</text><path d="M195 535L195 578" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><text x="195" y="614" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">TRUE</text><text x="195" y="662" font-size="27" fill="#286da2" text-anchor="middle" font-weight="400">保留用户 1</text><rect x="350" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2" /><text x="490" y="504" font-size="24" fill="#203747" text-anchor="middle" font-weight="400">(1, 11, cancelled)</text><path d="M490 535L490 578" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><text x="490" y="614" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">FALSE</text><text x="490" y="662" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">丢弃</text><rect x="645" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2" /><text x="785" y="504" font-size="24" fill="#203747" text-anchor="middle" font-weight="400">(2, NULL, NULL)</text><path d="M785 535L785 578" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><text x="785" y="614" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">UNKNOWN</text><text x="785" y="662" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">丢弃</text><rect x="940" y="465" width="280" height="60" fill="#f5f7f9" stroke="none" stroke-width="2" /><text x="1080" y="504" font-size="24" fill="#203747" text-anchor="middle" font-weight="400">(3, 12, cancelled)</text><path d="M1080 535L1080 578" fill="none" stroke="#728694" stroke-width="2" marker-end="url(#arrow)" /><text x="1080" y="614" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">FALSE</text><text x="1080" y="662" font-size="27" fill="#c96e32" text-anchor="middle" font-weight="400">丢弃</text><text x="40" y="745" font-size="28" fill="#203747" text-anchor="start" font-weight="400">加 OR 订单号 IS NULL 只救回用户 2；用户 3 已匹配过，仍被丢弃</text></g></svg>

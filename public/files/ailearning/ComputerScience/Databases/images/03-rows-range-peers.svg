<view id="textbook-detail-2-2" viewBox="567.600000 257.570000 752.400000 341.430000"/><title id="plate-title">窗口帧按位置或同值范围取成员</title><desc id="plate-desc">排序值相同的 a、b 都是十。到 a 时 ROWS 只取 a，RANGE 还取同值的 b。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="599" fill="white" stroke="none" stroke-width="1.6"/><text x="330" y="72" fill="#196f77" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">ROWS 按位置</text><rect x="100" y="167" width="114" height="147" fill="url(#wash-teal)" stroke="#c9d7dc" stroke-width="1.6"/><text x="157" y="213" fill="#196f77" font-size="28" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">a</text><text x="157" y="276" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">10</text><rect x="245" y="167" width="114" height="147" fill="#ffffff" stroke="#c9d7dc" stroke-width="1.6"/><text x="302" y="213" fill="#196f77" font-size="28" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">b</text><text x="302" y="276" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">10</text><rect x="390" y="167" width="114" height="147" fill="#ffffff" stroke="#c9d7dc" stroke-width="1.6"/><text x="447" y="213" fill="#196f77" font-size="28" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">c</text><text x="447" y="276" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">14</text><text x="311" y="381" fill="#196f77" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaH
<polyline points="714.938,303.026 720.000,315.000 725.062,303.026" fill="none" stroke="#203247" stroke-width="3" opacity="1"/>
<rect x="637" y="325" width="166" height="146" fill="white" stroke="#203247" stroke-width="2" rx="0"/>
<text x="720" y="410" font-size="28" fill="#203247" text-anchor="middle" font-weight="700">FALSE</text>
<line x1="720" y1="489" x2="720" y2="570" stroke="#203247" stroke-width="3"/>
<polyline points="714.938,558.026 720.000,570.000 725.062,558.026" fill="none" stroke="#203247" stroke-width="3" opacity="1"/>
<text x="720" y="628" font-size="27" fill="#203247" text-anchor="middle" font-weight="700">WHERE NOT p</text>
<circle cx="720" cy="695" r="24" fill="#203247"/>
<text x="720" y="760" font-size="29" fill="#203247" text-anchor="middle">保留 1 行</text>
<rect x="1035" y="160" width="290" height="74" fill="white" stroke="#d87320" stroke-width="2" rx="8"/>
<text x="1180.0" y="207.0" font-size="27" fill="#d87320" text-anchor="middle">102 · NULL</text>
<line x1="1045" y1="226" x2="1315" y2="226" stroke="#d87320" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1180" y1="245" x2="1180" y2="315" stroke="#d87320" stroke-width="3"/>

<circle cx="260" cy="398" r="73" fill="white" stroke="#2563a6" stroke-width="3"/>
<text x="260" y="410" font-size="28" fill="#2563a6" text-anchor="middle" font-weight="700">TRUE</text>
<line x1="260" y1="489" x2="260" y2="570" stroke="#2563a6" stroke-width="3"/>
<polyline points="254.938,558.026 260.000,570.000 265.062,558.026" fill="none" stroke="#2563a6" stroke-width="3" opacity="1"/>
<text x="260" y="628" font-size="27" fill="#2563a6" text-anchor="middle" font-weight="700">WHERE p</text>
<circle cx="260" cy="695" r="24" fill="#2563a6"/>
<text x="260" y="760" font-size="29" fill="#2563a6" text-anchor="middle">保留 1 行</text>
<rect x="575" y="160" width="290" height="74" fill="white" stroke="#203247" stroke-width="2" rx="8"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img"><title>NOT 不能把 UNKNOWN 变成 TRUE</title><rect width="1440" height="930" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="44" y="55" font-size="34" fill="#203247" text-anchor="start" font-weight="700">NOT 不能把 UNKNOWN 变成 TRUE</text>
<text x="720" y="110" font-size="27" fill="#6b7785" text-anchor="middle">仍用用户 1 的三笔订单：p 表示 amount_cents &gt; 1500</text>
<rect x="115" y="160" width="290" height="74" fill="white" stroke="#2563a6" stroke-width="2" rx="8"/>

<text x="1180" y="410" font-size="28" fill="#d87320" text-anchor="middle" font-weight="700">UNKNOWN</text>
<line x1="1180" y1="489" x2="1180" y2="570" stroke="#d87320" stroke-width="3"/>
<polyline points="1174.938,558.026 1180.000,570.000 1185.062,558.026" fill="none" stroke="#d87320" stroke-width="3" opacity="1"/>
<text x="1180" y="628" font-size="27" fill="#d87320" text-anchor="middle" font-weight="700">WHERE amount_cents IS NULL</text>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：首次分页已读取键 1、2，随后插入 0</title><desc id="detail-desc">首次分页已读取键 1、2，随后插入 0。偏移两行会重新读到 2；以最后读取键 2 继续查询则返回 3、4。该例解释位置漂移，并不把键游标等同于跨页快照隔离。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="30" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">首次读取：按键排序，已读 1、2</text><rect x="60" y="90" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="132.5" y="132.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="210" y="90" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="282.5" y="132.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="360" y="90" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="432.5" y="132.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">3</text><rect x="510" y="90" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="582.5" y="132.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">4</text><path d="M180,185 L180,250" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="280" y="215" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">插入更小的键 0</text><rect x="60" y="270" width="145" height="65" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="132.5" y="312.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">0</text><rect x="210" y="270" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="282.5" y="312.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="360" y="270" width="145" height="65" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="432.5" y="312.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">2</text><rect x="510" y="270" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="582.5" y="312.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">3</text><rect x="660" y="270" width="145" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="732.5" y="312.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">4</text><text x="800" y="110" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">OFFSET 2</text><text x="800" y="160" font-size="25" fill="#213447" font-weight="400" text-anchor="start">返回 2、3</text><text x="800" y="285" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">WHERE key &gt; 2</text><text x="800" y="335" font-size="25" fill="#213447" font-weight="400" text-anchor="start">返回 3、4</text></g></svg>

<text x="478" y="549" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">按键大于 2 → 3、4。</text>
<text x="76" y="629" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">新插入在游标之前的键 0 不会被这一轮的键集续页补读。</text>
<text x="76" y="675" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">若任务要求完整一致的集合，还需明确视图与排序键。</text>

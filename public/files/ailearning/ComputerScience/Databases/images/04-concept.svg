" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 4</text><rect x="1110" y="675" width="140" height="75" rx="5" fill="white" stroke="#9caeb9" stroke-width="2" /><text xml:space="preserve" x="1180" y="724" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="1430" y="720" font-size="30" fill="#d47732" text-anchor="middle" font-weight="400">返回 2,3</text><text xml:space="preserve" x="55" y="870" font-size="30" fill="#193a4e" text-anchor="start" font-weight="700">插入 0 后：key &gt; 2</text><text xml:space="preserve" x="360" y="935" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 0</text><rect x="290" y="965" width="140" height="75" rx="5" fill="white" stroke="#9caeb9" stroke-width="2" /><text xml:space="preserve" x="360" y="1014" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="565" y="935" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 1</text><rect x="495" y="965" width="140" height="75" rx="5" fill="white" stroke="#9caeb9" stroke-width="2" /><text xml:space="preserve" x="565" y="1014" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="770" y="935" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 2</text><rect x="700" y="965" width="140" height="75" rx="5" fill="white" stroke="#9caeb9" stroke-width="2" /><text xml:space="preserve" x="770" y="1014" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="975" y="935" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 3</text><rect x="905" y="965" width="140" height="75" rx="5" fill="#edf5fa" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="975" y="1014" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">3</text><text xml:space="preserve" x="1180" y="935" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">位置 4</text><rect x="1110" y="965" width="140" height="75" rx="5" fill="#edf5fa" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="1180" y="1014" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="1430" y="1010" font-size="30" fill="#2676ad" text-anchor="middle" font-weight="400">返回 3,4</text><path d="M565,420 C565,480 660,560 690,712" stroke="#d47732" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="980" y="475" font-size="29" fill="#d47732" text-anchor="middle" font-weight="400">键 2 的位置由 1 移到 2</text><text xml:space="preserve" x="55" y="1080" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">键集续页不重复 2，但新插入且已落在游标之前的 0 也不会被这一轮补读</text></g><desc> OFFSET 追随当前行位置；键集分页追随已越过的键</desc></svg>

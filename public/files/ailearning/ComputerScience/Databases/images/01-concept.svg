<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：比较同一组金额 40、160 的两条执行路径：先过滤金额大于 100 的行再平均，结果为 160；先求组平均得到 100，再要求平均严格大于 100，则整组消失</title><desc id="detail-desc">比较同一组金额 40、160 的两条执行路径：先过滤金额大于 100 的行再平均，结果为 160；先求组平均得到 100，再要求平均严格大于 100，则整组消失。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="50" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="87.5" y="92.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">40</text><rect x="145" y="50" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="197.5" y="92.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">160</text><text x="280" y="90" font-size="25" fill="#213447" font-weight="400" text-anchor="start">同一组的两笔金额</text><path d="M200,140 L200,170" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M400,140 L650,170" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="25" y="205" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">先 WHERE amount &gt; 100</text><rect x="65" y="250" width="115" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="122.5" y="292.25" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">160</text><text x="40" y="375" font-size="26" fill="#2865a0" font-weight="400" text-anchor="start">AVG = 160，组保留</text><text x="600" y="205" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">先 GROUP BY，再 HAVING</text><text x="710.0" y="286" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">40 + 160</text><line x1="620" y1="300" x2="800" y2="300" stroke="#213447" stroke-width="1.6" /><text x="710.0" y="330" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text><text x="815" y="308" font-size="25" fill="#158476" font-weight="600" text-anchor="start">= 100</text><text x="610" y="395" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">HAVING AVG &gt; 100：组被删除</text></g></svg>

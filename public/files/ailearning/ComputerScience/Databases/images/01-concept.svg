<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1752.5" viewBox="0 0 1800 1752.5" role="img"><title>行筛选与组筛选改变均值的参与记录</title><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img"><title>行筛选与组筛选改变均值的参与记录</title><rect width="1800" height="1190" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="80" y="170" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">订单 104</text><rect x="380" y="130" width="240.0" height="65" rx="0" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="640.0" y="175" font-size="32" fill="#176b91" text-anchor="start" font-weight="400">4000</text><text x="80" y="310" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">订单 105</text><rect x="380" y="270" width="960.0" height="65" rx="0" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1360.0" y="315" font-size="32" fill="#176b91" text-anchor="start" font-weight="400">16000</text><text x="430" y="485" font-size="35" fill="#203b4a" text-anchor="middle" font-weight="700">WHERE：先筛行</text><rect x="80" y="550" width="650" height="85" rx="4" fill="white" stroke="#80929d" stroke-width="2"/><text x="110" y="605" font-size="33" fill="#80929d" text-anchor="start" font-weight="400">104      U2       4000</text><line x1="90" y1="560" x2="720" y2="625" stroke="#d87332" stroke-width="3"/><rect x="80" y="680" width="650" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="110" y="735" font-size="33" fill="#176b91" text-anchor="start" font-weight="400">105      U2       16000</text><text x="360" y="877" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">16000</text><line x1="260" y1="890" x2="460" y2="890" stroke="#176b91" stroke-width="2"/><text x="360" y="930" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">1</text><text x="550" y="910" font-size="35" fill="#176b91" text-anchor="middle" font-weight="400">= 16000</text><rect x="160" y="1020" width="530" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="425" y="1075" font-size="35" fill="#176b91" text-anchor="middle" font-weight="400">U2      16000</text><text x="1350" y="485" font-size="35" fill="#203b4a" text-anchor="middle" font-weight="700">HAVING：后筛组</text><rect x="1000" y="550" width="650" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1030" y="605" font-size="33" fill="#176b91" text-anchor="start" font-weight="400">104      U2       4000</text><rect x="1000" y="680" width="650" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1030" y="735" font-size="33" fill="#176b91" text-anchor="start" font-weight="400">105      U2       16000</text><text x="1270" y="877" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">4000 + 16000</text><line x1="1170" y1="890" x2="1370" y2="890" stroke="#176b91" stroke-width="2"/><text x="1270" y="930" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">2</text><text x="1510" y="910" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">= 10000</text><rect x="1080" y="1020" width="530" height="85" rx="4" fill="white" stroke="#d87332" stroke-width="2" stroke-dasharray="8 6"/><text x="1345" y="1075" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">10000 &gt; 10000 为假</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1190) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">聚合后的过滤看到整个组；行过滤已永久改变这个组</text><rect x="65" y="140" width="472" height="58" fill="#edf5f8" stroke="#216c89"/><text x="301.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">U2：4000</text><rect x="545" y="140" width="472" height="58" fill="#edf5f8" stroke="#216c89"/><text x="781.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">U2：16000</text><text x="65" y="260" font-size="30" fill="#c96937" text-anchor="start">先 WHERE 金额&gt;10000：只剩 16000 → AVG=16000</text><text x="65" y="335" font-size="30" fill="#216c89" text-anchor="start">先按 U2 分组：AVG=10000 → HAVING AVG&gt;10000 为假</text><text x="65" y="411" font-size="28" fill="#203742" text-anchor="start">同一个“大于一万”，作用对象一个是订单，一个是组统计，不能交换执行位置。</text></g></g></svg>

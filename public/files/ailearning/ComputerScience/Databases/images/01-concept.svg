 x="1350" y="485" font-size="35" fill="#20354a" text-anchor="middle" font-weight="700">HAVING：后筛组</text><rect x="1000" y="550" width="650" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1030" y="605" font-size="33" fill="#1672a0" text-anchor="start" font-weight="400">104      U2       4000</text><rect x="1000" y="680" width="650" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1030" y="735" font-size="33" fill="#1672a0" text-anchor="start" font-weight="400">105      U2       16000</text><text x="1270" y="877" font-size="31" fill="#1672a0" text-anchor="middle" font-weight="400">4000 + 16000</text><line x1="1170" y1="890" x2="1370" y2="890" stroke="#1672a0" stroke-width="2"/><text x="1270" y="930" font-size="31" fill="#1672a0" text-anchor="middle" font-weight="400">2</text><text x="1510" y="910" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">= 10000</text><rect x="1080" y="1020" width="530" height="85" rx="4" fill="white" stroke="#d37537" stroke-width="2" stroke-dasharray="8 6"/><text x="1345" y="1075" font-size="31" fill="#d37537" text-anchor="middle" font-weight="400">10000 &gt; 10000 为假</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1190) scale(1.25)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">聚合后的过滤看到整个组；行过滤已永久改变这个组</text><rect x="65" y="140" width="472" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="301.0" y="179" font-size="28" fill="#1e7499" text-anchor="middle">U2：4000</text><rect x="545" y="140" width="472" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="781.0" y="179" font-size="28" fill="#1e7499" text-anchor="middle">U2：16000</text><text x="65" y="260" font-size="30" fill="#c66d3a" text-anchor="start">先 WHERE 金额&gt;10000：只剩 16000 → AVG=16000</text><text x="65" y="335" font-size="30" fill="#1e7499" text-anchor="start">先按 U2 分组：AVG=10000 → HAVING AVG&gt;10000 为假</text><text x="65" y="411" font-size="28" fill="#1d3145" text-anchor="start">同一个“大于一万”，作用对象一个是订单，一个是组统计，不能交换执行位置。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1403.62" viewBox="0 0 1440 1403.62" role="img"><title>没有丢失更新，也可能出现写偏差</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="953.617" viewBox="16.000 51.000 1128.000 747.000" role="img" aria-labelledby="title desc"><title id="title">没有丢失更新，也可能出现写偏差</title><desc id="desc">两个事务读取相同旧快照，分别更新自己的行。读写反依赖形成环，结果无法解释为任何串行顺序。 没有丢失更新，也可能出现写偏差</desc><rect width="1128.0" height="747.0" fill="white" x="16.0" y="51.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="98" font-size="27" fill="#627689" text-anchor="start">初始 A=1、B=1；业务不变量：A+B 至少为 1</text><text x="45" y="195" font-size="28" fill="#2865a0" text-anchor="start">事务 A</text><line x1="210" y1="185" x2="1120" y2="185" stroke="#dce5ed" stroke-width="2" /><rect x="235" y="151" width="265" height="64" fill="#2865a0" opacity="0.12" rx="3" /><text x="367.5" y="192" font-size="26" fill="#213447" text-anchor="middle">快照读 A=B=1</text><rect x="630" y="151" width="205" height="64" fill="#c87536" opacity="0.12" rx="3" /><text x="732.5" y="192" font-size="26" fill="#213447" text-anchor="middle">写 A=0</text><rect x="950" y="151" width="145" height="64" fill="#2865a0" opacity="0.12" rx="3" /><text x="1022.5" y="192" font-size="26" fill="#213447" text-anchor="middle">提交</text><text x="45" y="290" font-size="28" fill="#c87536" text-anchor="start">事务 B</text><line x1="210" y1="280" x2="1120" y2="280" stroke="#dce5ed" stroke-width="2" /><rect x="235" y="246" width="265" height="64" fill="#2865a0" opacity="0.12" rx="3" /><text x="367.5" y="287" font-size="26" fill="#213447" text-anchor="middle">快照读 A=B=1</text><rect x="630" y="246" width="205" height="64" fill="#c87536" opacity="0.12" rx="3" /><text x="732.5" y="287" font-size="26" fill="#213447" text-anchor="middle">写 B=0</text><rect x="950" y="246" width="145" height="64" fill="#2865a0" opacity="0.12" rx="3" /><text x="1022.5" y="287" font-size="26" fill="#213447" text-anchor="middle">提交</text><text x="45" y="374" font-size="29" fill="#c87536" text-anchor="start">写入不同的行，仍可共同破坏约束：最终 A=B=0</text><text x="45" y="430" font-size="26" fill="#213447" text-anchor="start">若能串行化，两条读旧版本的依赖必须同时成立：</text><circle cx="320" cy="565" r="53" fill="#2865a0" /><circle cx="860" cy="565" r="53" fill="#c87536" /><text x="320" y="574" font-size="29" fill="#fff" text-anchor="middle">A</text><text x="860" y="574" font-size="29" fill="#fff" text-anchor="middle">B</text><line x1="375" y1="525" x2="805" y2="525" stroke="#2865a0" stroke-width="3" /><polygon points="805,525 795.9955289764732,529.3496553411123 795.9955289764732,520.6503446588877" fill="#2865a0" /><text x="590" y="493" font-size="25" fill="#2865a0" text-anchor="middle">A 读 B=1，排在 B 写之前</text><line x1="805" y1="605" x2="375" y2="605" stroke="#c87536" stroke-width="3" /><polygon points="375,605 384.0044710235268,600.6503446588877 384.0044710235268,609.3496553411123" fill="#c87536" /><text x="590" y="650" font-size="25" fill="#c87536" text-anchor="middle">B 读 A=1，排在 A 写之前</text><text x="45" y="720" font-size="28" fill="#213447" text-anchor="start">形成环：不存在满足两项读取结果的串行顺序。</text><text x="45" y="770" font-size="25" fill="#627689" text-anchor="start">串行校验：先离岗者留下 1 人，后执行者看到 1 人就不能离岗。</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 953.617) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">串行世界可以直接枚举：没有一种顺序会让两人都离岗</text><rect x="65" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="276.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">初态 (1,1)</text><rect x="495" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="706.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">A先离岗 (0,1)</text><rect x="925" y="145" width="422" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1136.0" y="184" font-size="28" fill="#216c89" text-anchor="middle">B看到A=0，留下</text><rect x="65" y="280" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="276.0" y="319" font-size="28" fill="#c96937" text-anchor="middle">初态 (1,1)</text><rect x="495" y="280" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="706.0" y="319" font-size="28" fill="#c96937" text-anchor="middle">B先离岗 (1,0)</text><rect x="925" y="280" width="422" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1136.0" y="319" font-size="28" fill="#c96937" text-anchor="middle">A看到B=0，留下</text><text x="65" y="411" font-size="27" fill="#203742" text-anchor="start">并发快照结果 (0,0) 不等于任意串行结果；写不同记录不足以排除读写依赖。</text></g></g></svg>

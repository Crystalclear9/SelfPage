<title id="fig-title">并发读写反依赖造成写偏差</title>
<desc id="fig-desc">两个事务从同一旧快照读到两人在岗，分别更新不同记录，结果无人值守。依赖形成环，两个串行次序都不会得到这个结果。</desc>
<rect x="0" y="0" width="1200" height="696" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">两个事务读同一旧快照</text>
<text x="76" y="146" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">事务 A</text>
<path d="M240 162 L257 115 L431 115 L414 162 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="335.5" y="146.55" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">读 A = B = 1</text>
<path d="M440 139 L467 139" fill="none" stroke="#166d75" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M467 139 L456 144 L456 134 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M476 162 L493 115 L667 115 L650 162 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="571.5" y="146.55" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">写 A = 0</text>
<path d="M676 139 L703 139" fill="none" stroke="#166d75" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M703 139 L692 144 L692 134 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M712 162 L729 115 L903 115 L886 162 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="807.5" y="146.55" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">提交</text>
<text x="76" y="225" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">事务 B</text>
<path d="M240 241 L257 194 L431 194 L414 241 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="335.5" y="225.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">读 A = B = 1</text>
<path d="M440 218 L467 218" fill="none" stroke="#a74d3a" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M467 218 L456 223 L456 213 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M476 241 L493 194 L667 194 L650 241 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="571.5" y="225.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">写 B = 0</text>
<path d="M676 218 L703 218" fill="none" stroke="#a74d3a" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M703 218 L692 223 L692 213 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M712 241 L729 194 L903 194 L886 241 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="807.5" y="225.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">提交</text>
<text x="947" y="152" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">合并结果</text>
<text x="938" y="212" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" text-anchor="start" font-weight="400">(0, 0)</text>
<path d="M75 278 L1125 278" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="322" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="26" text-anchor="start" font-weight="600">若存在串行解释，两条约束必须同时满足</text>
<path d="M168 446 L195 398 L382 398 L355 446 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="275" y="430.4" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">事务 A</text>
<path d="M804 446 L831 398 L1018 398 L991 446 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="911" y="430.4" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">事务 B</text>
<path d="M400 403 L791 403" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M791 403 L780 408 L780 398 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="597" y="384" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">A 读 B 的旧值，须在 B 写入之前</text>
<path d="M793 445 L400 445" fill="none" stroke="#a74d3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 445 L411 440 L411 450 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="597" y="484" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">B 读 A 的旧值，须在 A 写入之前</text>
<path d="M75 519 L1125 519" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="569" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="600">直接枚举两个串行顺序</text>
<text x="79" y="618" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">A 先： (1, 1) → (0, 1)，B 留在岗。</text>
<text x="662" y="618" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">B 先： (1, 1) → (1, 0)，A 留在岗。</text>
<text x="76" y="667" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">两种串行次序都保持至少一人在岗。</text>
</svg>

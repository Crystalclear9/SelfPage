<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="938.5248" viewBox="0 0 1440 938.5248" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">普通索引通过rowid查表，覆盖索引直接提供amount</title><rect width="1440" height="938.5248" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">普通索引通过rowid查表，覆盖索引直接提供amount</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="796.5248" viewBox="13.867 61.847 1252.267 742.159" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="title">覆盖索引：从索引项直接拿到要输出的列</title><desc id="desc">覆盖索引：从索引项直接拿到要输出的列 覆盖索引：从索引项直接拿到要输出的列</desc><rect width="1252.267" height="742.159" fill="white" x="13.867" y="61.847"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#748e9f"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3348"><text x="40" y="110" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">SQLite 普通 rowid 表；查询 user_id = 2、t ≥ 3，按 t 输出 amount</text><text x="40" y="165" font-size="30" fill="#2479b3" text-anchor="start" font-weight="600">索引 (user_id, t)</text><rect x="45" y="195" width="405" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="234" font-size="27" fill="#2479b3" text-anchor="start" font-weight="400">(2, 3) → rowid 11</text><rect x="45" y="259" width="405" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="298" font-size="27" fill="#2479b3" text-anchor="start" font-weight="400">(2, 8) → rowid 22</text><rect x="45" y="323" width="405" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="65" y="362" font-size="27" fill="#748e9f" text-anchor="start" font-weight="400">(3, 1) → rowid 33</text><text x="740" y="165" font-size="28" fill="#1f3348" text-anchor="start" font-weight="600">表记录：按 rowid 找 amount</text><rect x="770" y="195" width="445" height="57" fill="#f9eae0" stroke="none" stroke-width="2"/><text x="790" y="234" font-size="27" fill="#c56f36" text-anchor="start" font-weight="400">id 11   →   amount 100</text><path d="M470 225L750 225" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="259" width="445" height="57" fill="#f9eae0" stroke="none" stroke-width="2"/><text x="790" y="298" font-size="27" fill="#c56f36" text-anchor="start" font-weight="400">id 22   →   amount 200</text><path d="M470 289L750 289" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="323" width="445" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="790" y="362" font-size="27" fill="#748e9f" text-anchor="start" font-weight="400">id 33   →   amount 300</text><text x="600" y="414" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">两条命中索引项 → 两条表记录 → 输出 100、200</text><path d="M40 445L1240 445" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="40" y="485" font-size="30" fill="#2479b3" text-anchor="start" font-weight="600">索引 (user_id, t, amount)</text><rect x="45" y="515" width="560" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="554" font-size="27" fill="#2479b3" text-anchor="start" font-weight="400">(2, 3, 100) → rowid 11</text><path d="M630 545L835 545" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><text x="885" y="555" font-size="30" fill="#c56f36" text-anchor="start" font-weight="400">输出 100</text><rect x="45" y="579" width="560" height="57" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="65" y="618" font-size="27" fill="#2479b3" text-anchor="start" font-weight="400">(2, 8, 200) → rowid 22</text><path d="M630 609L835 609" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><text x="885" y="619" font-size="30" fill="#c56f36" text-anchor="start" font-weight="400">输出 200</text><rect x="45" y="643" width="560" height="57" fill="#f5f7f9" stroke="none" stroke-width="2"/><text x="65" y="682" font-size="27" fill="#748e9f" text-anchor="start" font-weight="400">(3, 1, 300) → rowid 33</text><text x="40" y="775" font-size="27" fill="#1f3348" text-anchor="start" font-weight="400">查询所需的筛选、排序与输出列都已在索引中；此路线不再查表取 amount</text></g></svg></svg>

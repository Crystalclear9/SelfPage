<svg xmlns="http://www.w3.org/2000/svg" width="1368.000" height="840.000" viewBox="36.000 57.600 1368.000 840.000" role="img"><title>三笔订单，两个已知金额</title><rect width="1368.0" height="840.0" fill="white" x="36.0" y="57.6" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="720" y="110" font-size="27" fill="#6b7785" text-anchor="middle">完整实验的用户 1；金额单位为分</text>
<text x="475" y="178" font-size="27" fill="#2563a6" text-anchor="middle">订单 101</text>
<rect x="365" y="205" width="220" height="80" fill="white" stroke="#2563a6" stroke-width="2" rx="8" />
<text x="475.0" y="255.0" font-size="27" fill="#2563a6" text-anchor="middle">1000</text>
<text x="855" y="178" font-size="27" fill="#d87320" text-anchor="middle">订单 102</text>
<rect x="745" y="205" width="220" height="80" fill="white" stroke="#d87320" stroke-width="2" rx="8" />
<text x="855.0" y="255.0" font-size="27" fill="#d87320" text-anchor="middle">NULL</text>
<line x1="755" y1="277" x2="955" y2="277" stroke="#d87320" stroke-width="2" stroke-dasharray="6 5" />
<text x="1235" y="178" font-size="27" fill="#2563a6" text-anchor="middle">订单 103</text>
<rect x="1125" y="205" width="220" height="80" fill="white" stroke="#2563a6" stroke-width="2" rx="8" />
<text x="1235.0" y="255.0" font-size="27" fill="#2563a6" text-anchor="middle">2000</text>
<text x="90" y="362" font-size="28" fill="#203247" text-anchor="start" font-weight="700">COUNT(*)</text>
<text x="90" y="410" font-size="26" fill="#6b7785" text-anchor="start">三笔订单都计入</text>
<line x1="475" y1="291" x2="475" y2="365" stroke="#6b7785" stroke-width="2" />
<circle cx="475" cy="375" r="11" fill="#203247" />
<text x="475" y="420" font-size="28" fill="#203247" text-anchor="middle">1</text>
<line x1="855" y1="291" x2="855" y2="365" stroke="#6b7785" stroke-width="2" />
<circle cx="855" cy="375" r="11" fill="#203247" />
<text x="855" y="420" font-size="28" fill="#203247" text-anchor="middle">1</text>
<line x1="1235" y1="291" x2="1235" y2="365" stroke="#6b7785" stroke-width="2" />
<circle cx="1235" cy="375" r="11" fill="#203247" />
<text x="1235" y="420" font-size="28" fill="#203247" text-anchor="middle">1</text>
<text x="1320" y="420" font-size="32" fill="#203247" text-anchor="middle">→ 3</text>
<text x="90" y="505" font-size="28" fill="#203247" text-anchor="start" font-weight="700">COUNT(金额)</text>
<text x="90" y="551" font-size="26" fill="#6b7785" text-anchor="start">只计已知金额</text>
<circle cx="475" cy="490" r="11" fill="#2563a6" />
<text x="475" y="550" font-size="28" fill="#2563a6" text-anchor="middle">1</text>
<rect x="843" y="478" width="24" height="24" fill="white" stroke="#d87320" stroke-width="2" rx="0" />
<text x="855" y="550" font-size="26" fill="#d87320" text-anchor="middle">不计</text>
<circle cx="1235" cy="490" r="11" fill="#2563a6" />
<text x="1235" y="550" font-size="28" fill="#2563a6" text-anchor="middle">1</text>
<text x="1320" y="550" font-size="32" fill="#2563a6" text-anchor="middle">→ 2</text>
<line x1="65" y1="600" x2="1375" y2="600" stroke="#dce4ec" stroke-width="2" />
<text x="65" y="656" font-size="28" fill="#2563a6" text-anchor="start">已知和 = 1000 + 2000 = 3000</text>
<text x="65" y="712" font-size="28" fill="#2563a6" text-anchor="start" font-weight="700">AVG(金额)</text>
<text x="410" y="707" font-size="33" fill="#2563a6" text-anchor="middle">3000</text>
<line x1="345.0" y1="720" x2="475.0" y2="720" stroke="#2563a6" stroke-width="2" />
<text x="410" y="758" font-size="33" fill="#2563a6" text-anchor="middle">2</text>
<text x="500.0" y="732" font-size="33" fill="#2563a6" text-anchor="start">= 1500</text>
<text x="800" y="656" font-size="28" fill="#d87320" text-anchor="start">若先把 NULL 填成 0</text>
<text x="930" y="707" font-size="33" fill="#d87320" text-anchor="middle">3000</text>
<line x1="865.0" y1="720" x2="995.0" y2="720" stroke="#d87320" stroke-width="2" />
<text x="930" y="758" font-size="33" fill="#d87320" text-anchor="middle">3</text>
<text x="1020.0" y="732" font-size="33" fill="#d87320" text-anchor="start">= 1000</text>
<text x="65" y="865" font-size="28" fill="#203247" text-anchor="start">NULL 仍代表一笔订单；它没有为金额均值贡献一个已知值。</text>
</g><desc> 三笔订单，两个已知金额 平均值 1500 描述已知金额；填零后的 1000 回答了另一个问题。</desc></svg>

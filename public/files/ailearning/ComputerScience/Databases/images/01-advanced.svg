<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">AVG 的分母不包含 NULL</title><desc id="desc">三条记录中金额有一项 NULL。COUNT(*) 数行，COUNT(金额) 只数非 NULL 值，AVG(金额) 则对有效的 10 与 20 求平均，因此结果为 15，不是 10。 图中的 NULL 代表缺失而非零金额。若先用 COALESCE 替换为零，统计对象与分母会随之改变；哪一种符合业务必须由指标定义决定。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">AVG 的分母不包含 NULL</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">三条输入只有两条非 NULL；全为空时 AVG 返回 NULL。</text><text x="65" y="169" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">10</text><rect x="415.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="428" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">NULL</text><rect x="765.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="778" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">20</text><text x="65" y="340" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">COUNT(*)</text><rect x="285" y="310" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="344" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">3</text><text x="65" y="465" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">COUNT(金额)</text><rect x="285" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="469" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">2</text><text x="65" y="590" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">AVG(金额)</text><rect x="285" y="560" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="594" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">15</text></g></svg>

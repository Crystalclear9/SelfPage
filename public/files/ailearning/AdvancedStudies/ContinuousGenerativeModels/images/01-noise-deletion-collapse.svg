<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="705.772" viewBox="0 80.715884 1280 705.771812" role="img"><rect id="offline-white-background" x="0" y="80.715884" width="1280" height="705.771812" fill="#ffffff"/><title>直接删除反向噪声，会把正确方差收缩到几乎为零</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="65" y="125" font-size="27" fill="#183944" text-anchor="start">解析高斯；β = 8；从真实 t = 1 边缘积分到 ε = 0.001。</text><text x="65" y="197" font-size="28" fill="#71858b" text-anchor="start">真实噪声端</text><line x1="201.78793827568455" y1="245" x2="802.7789869094058" y2="245" stroke="#71858b" stroke-width="10" stroke-dasharray=""/><line x1="201.78793827568455" y1="228" x2="201.78793827568455" y2="262" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><line x1="802.7789869094058" y1="228" x2="802.7789869094058" y2="262" stroke="#71858b" stroke-width="3" stroke-dasharray=""/><circle cx="502.28346259254516" cy="245" r="7" fill="#71858b"/><text x="65" y="306" font-size="27" fill="#71858b" text-anchor="start">均值 0.036631；方差 0.999748</text><text x="65" y="367" font-size="28" fill="#246b82" text-anchor="start">正确概率流</text><line x1="650.0570503209875" y1="415" x2="954.1611831433272" y2="415" stroke="#246b82" stroke-width="10" stroke-dasharray=""/><line x1="650.0570503209875" y1="398" x2="650.0570503209875" y2="432" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="954.1611831433272" y1="398" x2="954.1611831433272" y2="432" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="802.1091167321573" cy="415" r="7" fill="#246b82"/><text x="65" y="476" font-size="27" fill="#246b82" text-anchor="start">均值 1.992016；方差 0.255976</text><text x="65" y="537" font-size="28" fill="#c0673e" text-anchor="start">仅删除噪声</text><line x1="800.6942814032429" y1="585" x2="803.5239520610719" y2="585" stroke="#c0673e" stroke-width="10" stroke-dasharray=""/><line x1="800.6942814032429" y1="568" x2="800.6942814032429" y2="602" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><line x1="803.5239520610719" y1="568" x2="803.5239520610719" y2="602" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><circle cx="802.1091167321573" cy="585" r="7" fill="#c0673e"/><text x="65" y="646" font-size="27" fill="#c0673e" text-anchor="start">均值 1.992016；方差 2.216e-05</text><line x1="190" y1="716" x2="1110" y2="716" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="190.0" y1="716" x2="190.0" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="190.0" y="764" font-size="25" fill="#71858b" text-anchor="middle">-2</text><line x1="343.3333333333333" y1="716" x2="343.3333333333333" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="343.3333333333333" y="764" font-size="25" fill="#71858b" text-anchor="middle">-1</text><line x1="496.66666666666663" y1="716" x2="496.66666666666663" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="496.66666666666663" y="764" font-size="25" fill="#71858b" text-anchor="middle">0</text><line x1="650.0" y1="716" x2="650.0" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="650.0" y="764" font-size="25" fill="#71858b" text-anchor="middle">1</text><line x1="803.3333333333333" y1="716" x2="803.3333333333333" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="803.3333333333333" y="764" font-size="25" fill="#71858b" text-anchor="middle">2</text><line x1="956.6666666666667" y1="716" x2="956.6666666666667" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="956.6666666666667" y="764" font-size="25" fill="#71858b" text-anchor="middle">3</text><line x1="1110.0" y1="716" x2="1110.0" y2="724" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1110.0" y="764" font-size="25" fill="#71858b" text-anchor="middle">4</text></g><desc> 横线是总体中央约 95% 的概率区间，不是均值估计的置信区间。</desc></svg>

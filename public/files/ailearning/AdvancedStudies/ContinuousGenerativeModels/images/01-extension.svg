<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>概率流的散度控制体积与密度</title><desc>一维确定流满足速度v(x)=ax时，位置按exp(at)缩放；同一小区间的长度以相同比例扩张，沿轨迹的对数密度变化率为−a。图取a=0.5，在t=1时宽度约乘1.649，密度约乘0.607。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">概率流的散度控制体积与密度</text><text x="100" y="160" font-size="22" fill="#193e54" text-anchor="start">t=0：宽度1，密度1</text><text x="690" y="160" font-size="22" fill="#193e54" text-anchor="start">t=1：宽度exp(0.5)，密度exp(-0.5)</text><rect x="150" y="300" width="200" height="200" rx="8" fill="#d6ede3" stroke="#9cb8c8" /><rect x="690" y="379" width="329.74425414002565" height="121.30613194252669" rx="8" fill="#dcecf8" stroke="#9cb8c8" /><path d="M400,420 L650,420" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><line x1="100" y1="500" x2="1080" y2="500" stroke="#277eac" stroke-width="2.5" /><text x="160" y="560" font-size="22" fill="#193e54" text-anchor="start">面积=1</text><text x="800" y="560" font-size="22" fill="#193e54" text-anchor="start">面积仍为1</text><text x="180" y="720" font-size="21" fill="#193e54" text-anchor="start">矩形宽度与高度按真实比例绘制，质量通过体积与密度反向变化保持。</text></g></svg>

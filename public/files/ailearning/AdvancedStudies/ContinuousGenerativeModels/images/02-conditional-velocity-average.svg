<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="611" viewBox="0 0 1350 611" role="img" aria-labelledby="title desc"><title id="title">条件路径汇聚成边缘速度场</title><desc id="desc">两条条件轨迹在同一个中间位置交会。等权条件下，两个速度的纵向分量抵消。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="611" fill="white" stroke="none" stroke-width="1.55"/><text x="304" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">两条条件轨迹</text><text x="1049" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">在同一位置合成速度</text><circle cx="116" cy="464" r="7" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><circle cx="578" cy="151" r="7" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><line x1="125.9347" y1="457.2693" x2="567.2374" y2="158.2915" stroke="#196f77" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="116" cy="151" r="7" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><circle cx="578" cy="464" r="7" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><line x1="125.9347" y1="157.7307" x2="567.2374" y2="456.7085" stroke="#a84b3b" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-coral)"/><circle cx="347" cy="307.5" r="8" stroke="#202a37" stroke-width="1.7" fill="#202a37"/><line x1="609" y1="308" x2="724" y2="308" stroke="#c7d5da" stroke-width="1.8" stroke-linecap="round"/><line x1="878" y1="307" x2="1120" y2="148" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="878" y1="307" x2="1120" y2="466" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-coral)"/><line x1="878" y1="307" x2="1120" y2="307" stroke="#655184" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><circle cx="878" cy="307" r="7" stroke="#202a37" stroke-width="1.7" fill="#202a37"/><text x="1155" y="318" fill="#655184" font-size="29" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">条件平均</text><text x="677" y="564" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">这里对同一时刻、同一位置的条件速度取平均</text></svg>
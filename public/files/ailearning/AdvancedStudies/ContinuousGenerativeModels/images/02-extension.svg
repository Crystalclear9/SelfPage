<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>旋转速度场可以改变路径而不改径向密度</title><desc>二维标准正态是旋转对称的。零速度场保持每个点不动，旋转场v(x,y)=(−y,x)则使点沿圆周转动；后者散度为零且沿密度等值线移动，所以同一初始标准正态在各时刻仍保持原边缘。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">旋转速度场可以改变路径而不改径向密度</text><circle cx="310" cy="420" r="180" fill="none" stroke="#a6bfcb" stroke-dasharray="6 5" /><line x1="80" y1="420" x2="540" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="310" y1="190" x2="310" y2="650" stroke="#2865a0" stroke-width="3" /><circle cx="860" cy="420" r="180" fill="none" stroke="#a6bfcb" stroke-dasharray="6 5" /><line x1="630" y1="420" x2="1090" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="860" y1="190" x2="860" y2="650" stroke="#2865a0" stroke-width="3" /><circle cx="490" cy="420" r="32" fill="#daedf8" stroke="#5597b5" /><text x="490" y="428" font-size="24" fill="#193e54" text-anchor="middle">P</text><text x="170" y="160" font-size="25" fill="#193e54" text-anchor="start">零场：点保持不动</text><text x="690" y="160" font-size="25" fill="#193e54" text-anchor="start">旋转场：沿等密度圆运动</text><path d="M1040.0,420.0 L1040.0,365.0" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M860.0,240.0 L805.0,240.0" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M680.0,420.0 L680.0,475.0" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M860.0,600.0 L915.0,600.0" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /></g></svg>

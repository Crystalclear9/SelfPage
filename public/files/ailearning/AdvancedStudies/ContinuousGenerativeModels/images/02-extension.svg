<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="871.6913" viewBox="0 0 1440 871.6913" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">旋转速度场可以改变路径而不改径向密度</title><rect width="1440" height="871.6913" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">旋转速度场可以改变路径而不改径向密度</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="729.6913" viewBox="0 80.7159 1280 694.9441" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="80.715884" width="1280" height="694.944072" fill="#ffffff"/><title>零散度旋转保持面积，却不保持任意密度</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="65" y="125" font-size="27" fill="#1c2e40" text-anchor="start">相同速度 v(x, y) = (−y, x)；观察时刻 t = π/2，即逆时针旋转 90°。</text><text x="330" y="191" font-size="27" fill="#1c2e40" text-anchor="middle">旋转对称：C0 = I</text><line x1="110" y1="433" x2="550" y2="433" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="330" y1="213" x2="330" y2="653" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="160" y="461" font-size="24" fill="#728d97" text-anchor="middle">-2</text><text x="245" y="461" font-size="24" fill="#728d97" text-anchor="middle">-1</text><text x="415" y="461" font-size="24" fill="#728d97" text-anchor="middle">1</text><text x="500" y="461" font-size="24" fill="#728d97" text-anchor="middle">2</text><circle cx="330" cy="433" r="85" fill="none" stroke="#217292" stroke-width="4"/><circle cx="330" cy="433" r="170" fill="none" stroke="#217292" stroke-width="2" stroke-dasharray="8 7"/><text x="330" y="694" font-size="27" fill="#217292" text-anchor="middle">旋转前后：标准正态密度相同</text><text x="960" y="191" font-size="27" fill="#1c2e40" text-anchor="middle">各向异性：C0 = diag(4, 1)</text><line x1="740" y1="433" x2="1180" y2="433" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="960" y1="213" x2="960" y2="653" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="790" y="461" font-size="24" fill="#728d97" text-anchor="middle">-2</text><text x="875" y="461" font-size="24" fill="#728d97" text-anchor="middle">-1</text><text x="1045" y="461" font-size="24" fill="#728d97" text-anchor="middle">1</text><text x="1130" y="461" font-size="24" fill="#728d97" text-anchor="middle">2</text><ellipse cx="960" cy="433" rx="170" ry="85" fill="none" stroke="#217292" stroke-width="4"/><ellipse cx="960" cy="433" rx="85" ry="170" fill="none" stroke="#bd6c41" stroke-width="4"/><circle cx="1130" cy="433" r="7" fill="#1c2e40"/><text x="1090" y="498" font-size="25" fill="#1c2e40" text-anchor="start">(2, 0)</text><text x="960" y="694" font-size="27" fill="#bd6c41" text-anchor="middle">同一点密度：0.048266 → 0.010770</text><line x1="65" y1="753" x2="1110" y2="753" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/></g><desc> 蓝：初始；橙：旋转后。保持密度要求 div(pv) = 0，仅 div(v) = 0 不够。</desc></svg></svg>

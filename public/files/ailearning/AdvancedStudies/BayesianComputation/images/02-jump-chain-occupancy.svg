<text x="65" y="725" font-size="31" fill="#233c4b" text-anchor="start" font-weight="normal">C  按迭代计数与按跳跃计数，得到不同目标</text>
<text x="100" y="785" font-size="29" fill="#233c4b" text-anchor="start" font-weight="normal">完整链的平稳质量</text>

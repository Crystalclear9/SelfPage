<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1011.12" viewBox="0 0 1440 1011.12" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">保留拒绝时的等待长度，才能保留目标平稳占据比例</title><rect width="1440" height="1011.12" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">保留拒绝时的等待长度，才能保留目标平稳占据比例</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg viewBox="0 0 1500 970" width="1344" height="869.12" role="img" x="48" y="106" overflow="hidden">
<rect width="1500" height="970" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#21374d">
<text x="65" y="55" font-size="32" fill="#21374d" text-anchor="start" font-weight="normal">A  每次都提议换状态，接受率决定停留</text>
<circle cx="290" cy="225" r="63" fill="#eaf2f6" stroke="#217599" stroke-width="3"/>
<text x="290" y="237" font-size="36" fill="#217599" text-anchor="middle" font-weight="normal">A</text>
<circle cx="1050" cy="225" r="63" fill="#f9eee6" stroke="#cb753f" stroke-width="3"/>
<text x="1050" y="237" font-size="36" fill="#cb753f" text-anchor="middle" font-weight="normal">B</text>
<line x1="360" y1="200" x2="975" y2="200" stroke="#217599" stroke-width="4"/>
<path d="M963.294,205.655 L975.000,200.000 L963.294,194.345" fill="none" stroke="#217599" stroke-width="4"/>
<text x="670" y="165" font-size="30" fill="#217599" text-anchor="middle" font-weight="normal">A → B：0.25</text>
<line x1="975" y1="270" x2="360" y2="270" stroke="#cb753f" stroke-width="4"/>
<path d="M371.706,264.345 L360.000,270.000 L371.706,275.655" fill="none" stroke="#cb753f" stroke-width="4"/>
<text x="670" y="320" font-size="30" fill="#cb753f" text-anchor="middle" font-weight="normal">B → A：1</text>
<path d="M230.000,205.000 L170.000,205.000 L170.000,110.000 L290.000,110.000 L290.000,158.000" fill="none" stroke="#217599" stroke-width="3"/>
<line x1="290" y1="110" x2="290" y2="159" stroke="#217599" stroke-width="3"/>
<path d="M284.345,147.294 L290.000,159.000 L295.655,147.294" fill="none" stroke="#217599" stroke-width="3"/>
<text x="105" y="85" font-size="26" fill="#217599" text-anchor="start" font-weight="normal">A 原地：0.75</text>
<text x="65" y="425" font-size="31" fill="#21374d" text-anchor="start" font-weight="normal">B  停留长度是随机的；以下画它们的期望</text>
<rect x="120" y="485" width="155" height="80" fill="#eaf2f6" stroke="#217599" stroke-width="1"/>
<text x="197" y="537" font-size="31" fill="#217599" text-anchor="middle" font-weight="normal">A</text>
<rect x="280" y="485" width="155" height="80" fill="#eaf2f6" stroke="#217599" stroke-width="1"/>
<text x="357" y="537" font-size="31" fill="#217599" text-anchor="middle" font-weight="normal">A</text>
<rect x="440" y="485" width="155" height="80" fill="#eaf2f6" stroke="#217599" stroke-width="1"/>
<text x="517" y="537" font-size="31" fill="#217599" text-anchor="middle" font-weight="normal">A</text>
<rect x="600" y="485" width="155" height="80" fill="#eaf2f6" stroke="#217599" stroke-width="1"/>
<text x="677" y="537" font-size="31" fill="#217599" text-anchor="middle" font-weight="normal">A</text>
<rect x="760" y="485" width="155" height="80" fill="#f9eee6" stroke="#cb753f" stroke-width="1"/>
<text x="837" y="537" font-size="31" fill="#cb753f" text-anchor="middle" font-weight="normal">B</text>
<text x="120" y="620" font-size="28" fill="#217599" text-anchor="start" font-weight="normal">A：平均停留 4 次</text>
<text x="760" y="620" font-size="28" fill="#cb753f" text-anchor="start" font-weight="normal">B：平均停留 1 次</text>
<text x="65" y="725" font-size="31" fill="#21374d" text-anchor="start" font-weight="normal">C  按迭代计数与按跳跃计数，得到不同目标</text>
<text x="100" y="785" font-size="29" fill="#21374d" text-anchor="start" font-weight="normal">完整链的平稳质量</text>
<rect x="100" y="820" width="448.0" height="60" fill="#217599" stroke="none" stroke-width="1"/>
<rect x="548.0" y="820" width="111.99999999999997" height="60" fill="#cb753f" stroke="none" stroke-width="1"/>
<text x="324.0" y="862" font-size="28" fill="white" text-anchor="middle" font-weight="normal">A：0.8</text>
<text x="604.0" y="862" font-size="28" fill="white" text-anchor="middle" font-weight="normal">B：0.2</text>
<text x="820" y="785" font-size="29" fill="#21374d" text-anchor="start" font-weight="normal">只记接受后的状态</text>
<rect x="820" y="820" width="280.0" height="60" fill="#217599" stroke="none" stroke-width="1"/>
<rect x="1100.0" y="820" width="280.0" height="60" fill="#cb753f" stroke="none" stroke-width="1"/>
<text x="960.0" y="862" font-size="28" fill="white" text-anchor="middle" font-weight="normal">A：0.5</text>
<text x="1240.0" y="862" font-size="28" fill="white" text-anchor="middle" font-weight="normal">B：0.5</text>
</g></svg></svg>

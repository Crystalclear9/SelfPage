<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">拒绝步携带驻留时间</title>
<desc id="fig-desc">完整马尔可夫链的占据比例不同于只保留接受转移的跳链。</desc>
<rect x="0" y="0" width="1200" height="787" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">删掉原地停留，改变了时间平均所用的分母</text>
<circle cx="248" cy="222" r="34" fill="url(#t)" stroke="#166d75" stroke-width="1.55"/>
<text x="248" y="230" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A</text>
<circle cx="586" cy="222" r="34" fill="url(#r)" stroke="#a74d3a" stroke-width="1.55"/>
<text x="586" y="230" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">B</text>
<path d="M282 210 L550 210" fill="none" stroke="#166d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M550 210 L539 215 L539 205 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M550 239 L282 239" fill="none" stroke="#a74d3a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M282 239 L293 234 L293 244 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="414" y="184" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.25</text>
<text x="414" y="276" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1</text>
<path d="M218 211 L145 192 L145 119 L248 119" fill="none" stroke="#166d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M248 119 L248 185" fill="none" stroke="#166d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M248 185 L243 174 L253 174 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="283" y="130" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">A 原地 0.75</text>
<text x="752" y="184" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">期望驻留长度</text>
<path d="M754 254 L766.4 207 L809 207 L796.6 254 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="781.5" y="238.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A</text>
<path d="M816 254 L828.4 207 L871 207 L858.6 254 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="843.5" y="238.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A</text>
<path d="M878 254 L890.4 207 L933 207 L920.6 254 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="905.5" y="238.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A</text>
<path d="M940 254 L952.4 207 L995 207 L982.6 254 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="967.5" y="238.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A</text>
<path d="M1002 254 L1014.4 207 L1057 207 L1044.6 254 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1029.5" y="238.55" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">B</text>
<text x="752" y="295" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">A：4 次；B：1 次</text>
<path d="M75 347 L1125 347" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="451" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">按迭代计数</text>
<path d="M279 481 L294 424 L842.2 424 L827.2 481 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560.6" y="460.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">A · 0.8</text>
<path d="M842.2 481 L857.2 424 L983 424 L968 481 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="912.6" y="460.9" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">B · 0.2</text>
<text x="75" y="564" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">只记跳跃</text>
<path d="M279 594 L294 537 L631 537 L616 594 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="455" y="573.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">A · 0.5</text>
<path d="M631 594 L646 537 L983 537 L968 594 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="807" y="573.9" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">B · 0.5</text>
<text x="75" y="693" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">只记接受转移后，A 与 B 严格交替。中间五格画的是驻留期望。</text>
<text x="75" y="743" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">估计 B 的长期占据比例时，完整链为 0.2，跳链不加权为 0.5。</text>
</svg>

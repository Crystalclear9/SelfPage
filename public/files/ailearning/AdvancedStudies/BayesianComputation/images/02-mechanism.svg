<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>非线性换元中的雅可比修正</title><desc>设正变量X服从单位速率指数分布，并令Y=log X。正确的Y密度是exp(y−exp(y))，其中exp(y)来自换元雅可比。若只把原密度中的x替换成exp(y)，遗漏雅可比，就得到另一条不能归一化为该Y分布的曲线。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">非线性换元中的雅可比修正</text><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">-5</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">-3.6</text><line x1="495.99999999999994" y1="235" x2="495.99999999999994" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="495.99999999999994" y="671" font-size="24" fill="#16344c" text-anchor="middle">-2.2</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">-0.8</text><line x1="871.9999999999999" y1="235" x2="871.9999999999999" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="871.9999999999999" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.6</text><line x1="1060.0" y1="235" x2="1060.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">2</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="24" fill="#16344c" text-anchor="end">0</text><line x1="120" y1="535.0" x2="1060" y2="535.0" s
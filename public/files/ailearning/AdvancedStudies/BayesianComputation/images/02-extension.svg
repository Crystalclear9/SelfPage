<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>Leapfrog 的相空间轨迹与能量误差</title><desc>取标准正态目标与单位质量，哈密顿量为位置与动量平方和的一半。Leapfrog从(q,p)=(1,0)出发、步长0.3作20步，轨迹接近圆而能量产生有界振荡；Metropolis校正仍需依据最终能量差决定接受。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">Leapfrog 的相空间轨迹与能量误差</text><circle cx="580" cy="420" r="205" fill="none" stroke="#afc3d0" stroke-dasharray="6 5" /><line x1="310" y1="420" x2="850" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="580" y1="150" x2="580" y2="690" stroke="#277eac" stroke-width="2.5" /><polyline points="785.0,420.0 775.8,480.1 748.9,534.8 706.9,579.2 653.4,609.2 593.3,622.3 532.1,617.1 475.1,594.1 427.6,555.5 393.8,504.7 376.7,446.3 378.0,385.5 397.4,327.8 433.3,278.4 482.4,241.8 540.2,221.2 601.6,218.5 661.1,233.9 713.3,266.0 753.5,312.1 778.1,367.8" stroke="#148671" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="900" y="435" font-size="22" fill="#193e54" text-anchor="start">位置 q</text><text x="595" y="155" font-size="22" fill="#193e54" text-anchor="start">动量 p</text><text x="100" y="725" font-size="21" fill="#193e54" text-anchor="start">虚线为精确能量圆；圆点标出离散步数0、5、10、15、20。</text><circle cx="785.0" cy="420.0" r="6" fill="#d67629" stroke="white" stroke-width="2" /><text x="811.0" y="455.0" font-size="22" fill="#a45524">第0步</text><circle cx="593.33885749775" cy="622.2511203821625" r="6" fill="#d67629" stroke="white" stroke-width="2" /><text x="598.33885749775" y="657.2511203821625" font-size="22" fill="#a45524">第5步</text><circle cx="376.7358548228808" cy="446.31998901012633" r="6" fill="#d67629" stroke="white" stroke-width="2" /><text x="331.7358548228808" y="456.31998901012633" font-size="22" fill="#a45524">第10步</text><circle cx="540.2093233127908" cy="221.1740365227002" r="6" fill="#d67629" stroke="white" stroke-width="2" /><text x="525.2093233127908" y="203.1740365227002" font-size="22" fill="#a45524">第15步</text><circle cx="778.0859777032682" cy="367.8057554418098" r="6" fill="#d67629" stroke="white" stroke-width="2" /><text x="802.0859777032682" y="347.8057554418098" font-size="22" fill="#a45524">第20步</text><text x="60" y="210" font-size="21" fill="#193e54">初始能量 H0=0.5</text><text x="60" y="255" font-size="21" fill="#193e54">末步能量 H20=0.49925</text><text x="60" y="300" font-size="21" fill="#193e54">能量差 ΔH=-0.00075</text></g></svg>

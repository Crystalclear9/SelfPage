<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="extra-title">Leapfrog 的相空间轨迹与能量误差</title><desc id="extra-desc">取 U(q)=\frac{q^2}{2}、单位质量和 H(q,p)=\frac{q^2+p^2}{2}，从 (1,0) 出发，以步长 0.3 积分 20 步。左图灰线是精确能量为 \frac{1}{2} 的单位圆，蓝线是实际 leapfrog 轨迹，橙点间隔五步。右图单独放大每一步的能量差：它有清晰的振荡，而不是仅靠末端很接近初始能量就宣称“数值积分完全守恒”。

本例 H_{20}\approx0.49925075，所以提议末端 \Delta H\approx-0.00074925，该次提议的 Metropolis 接受概率 \min(1,e^{-\Delta H}) 为一；这不表示其他初值、步长或目标下也必然接受。谐振子在 0&lt;\varepsilon&lt;2 时具有有界的离散振荡，复杂后验仍可能发生发散。图中的 20 个积分步构成一次提议轨迹，不能当成 20 个相互独立的后验样本。

积分与接受步骤见 [Stan 手册的 Leapfrog 与 Metropolis 说明](https://mc-stan.org/docs/reference-manual/mcmc.html#leapfrog-integrator)。</desc><rect width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">Leapfrog 的相空间轨迹与能量误差</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">相空间：接近圆，不是精确圆</text><text x="690" y="105" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">能量差：随积分步数振荡</text><line x1="85" y1="532.5" x2="475" y2="532.5" stroke="#dce5ed" stroke-width="2" /><text x="73" y="540.5" font-size="24" fill="#627689" text-anchor="end" font-weight="400">-1</text><line x1="85" y1="370.0" x2="475" y2="370.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="378.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="207.49999999999994" x2="475" y2="207.49999999999994" stroke="#dce5ed" stroke-width="2" /><text x="73" y="215.49999999999994" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="85" y1="175" x2="85" y2="565" stroke="#627689" stroke-width="2" /><line x1="85" y1="565" x2="475" y2="565" stroke="#627689" stroke-width="2" /><line x1="117.5" y1="565.0" x2="117.5" y2="571.0" stroke="#627689" stroke-width="2" /><text x="117.5" y="597.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">-1</text><line x1="280.0" y1="565.0" x2="280.0" y2="571.0" stroke="#627689" stroke-width="2" /><text x="280.0" y="597.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="442.50000000000006" 
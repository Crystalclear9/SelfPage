<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>ELBO 中的证据与近似误差</title><desc>A用相关高斯的真实轮廓与最优独立高斯平均场轮廓对照，相关方向缺失而边缘方差从1缩为0.36。B直接复核这两个尺度。C用标准化证据为0、KL为a²的可解示意解释下界：优化近似参数改变下界，不改变固定数据的证据。 下方分别画相关高斯的等密度椭圆、保留边缘方差的独立圆，以及反向 KL 平均场的较小圆。轮廓对应相同标准化半径，显式区分去相关与方差收缩。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">ELBO 中的证据与近似误差</text><g transform="translate(10,15) scale(.95)"><line x1="115.44" y1="578.00" x2="508.56" y2="578.00" stroke="#95adba" stroke-width="2" /><line x1="312.00" y1="381.44" x2="312.00" y2="774.56" stroke="#95adba" stroke-width="2" /><ellipse cx="312.0" cy="578.0" rx="202.8560869187809" ry="67.61869563959364" transform="rotate(-45 312.0 578.0)" fill="none" stroke="#2563eb" stroke-width="3" /><ellipse cx="312.0" cy="578.0" rx="304.28413037817137" ry="101.42804345939047" transform="rotate(-45 312.0 578.0)" fill="none" stroke="#2563eb" stroke-width="3" /><line x1="493.44" y1="578.00" x2="886.56" y2="578.00" stroke="#95adba" stroke-width="2" /><line x1="690.00" y1="381.44" x2="690.00" y2="774.56" stroke="#95adba" stroke-width="2" /><circle cx="690.0" cy="578.0" r="90.71999999999998" fill="none" stroke="#cb702a" stroke-width="3" /><circle cx="690.0" cy="578.0" r="136.07999999999998" fill="none" stroke="#cb702a" stroke-width="3" /><text x="144.00" y="258.80" font-size="25" fill="#15364c" text-anchor="start">真实相关后验</text><text x="580.80" y="258.80" font-size="25" fill="#15364c" text-anc
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>平均场近似遗漏相关方向</title><desc>取二维高斯后验，两个边缘方差均为1、相关系数为0.8。真实等密度轮廓沿对角方向伸长；最小化反向KL的独立高斯平均场解具有两个方差0.36，轮廓却是轴对齐圆。图同时呈现相关结构缺失与边缘方差缩小。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">平均场近似遗漏相关方向</text><text x="100" y="160" font-size="24" fill="#16344c" text-anchor="start">真实后验：相关系数0.8</text><text x="690" y="160" font-size="24" fill="#16344c" text-anchor="start">反向KL平均场：方差0.36</text><line x1="90" y1="420" x2="510" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="300" y1="210" x2="300" y2="630" stroke="#2865a0" stroke-width="3" /><line x1="640" y1="420" x2="1060" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="850" y1="210" x2="850" y2="630" stroke="#2865a0" stroke-width="3" /><ellipse cx="300" cy="420" rx="134.16407864998737" ry="44.721359549995796" transform="rotate(-45 300 420)" fill="none" stroke="#2865a0" stroke-width="3" /><circle cx="850" cy="420" r="60" fill="none" stroke="#627689" stroke-width="3" /><ellipse cx="300" cy="420" rx="214.66252583997982" ry="71.55417527999327" transform="rotate(-45 300 420)" fill="none" stroke="#2865a0" stroke-width="3" /><circle cx="850" cy="420" r="96.0" fill="none" stroke="#627689" stroke-width="3" /></g></svg>

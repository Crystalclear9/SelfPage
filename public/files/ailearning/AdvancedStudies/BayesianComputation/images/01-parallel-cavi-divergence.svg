<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>正定三维高斯中顺序CAVI与同时坐标更新的对照</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="62" font-size="36" fill="#22364a" text-anchor="start" font-weight="bold">精确坐标解，并不保证同步更新提高 ELBO</text><text x="60" y="111" font-size="26" fill="#64788b" text-anchor="start" font-weight="normal">正定精度矩阵：对角为 1，非对角为 0.6；初始均值 (1, 1, 1)</text><line x1="130" y1="541.1111111111111" x2="640" y2="541.1111111111111" stroke="#dce5ee" stroke-width="2"/><text x="115" y="550.1111111111111" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">1e-06</text><line x1="130" y1="463.33333333333337" x2="640" y2="463.33333333333337" stroke="#dce5ee" stroke-width="2"/><text x="115" y="472.33333333333337" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">0.0001</text><line x1="130" y1="385.55555555555554" x2="640" y2="385.55555555555554" stroke="#dce5ee" stroke-width="2"/><text x="115" y="394.55555555555554" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">0.01</text><line x1="130" y1="307.77777777777777" x2="640" y2="307.77777777777777" stroke="#dce5ee" stroke-width="2"/><text x="115" y="316.77777777777777" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">1</text><line x1="130" y1="230.0" x2="640" y2="230.0" stroke="#dce5ee" stroke-width="2"/><text x="115" y="239.0" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">100</text><line x1="130" y1="580" x2="640" y2="580" stroke="#22364a" stroke-width="2"/><line x1="130" y1="580" x2="130" y2="195" stroke="#22364a" stroke-width="2"/><text x="130.0" y="614" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="257.5" y="614" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">2</text><text x="385.0" y="614" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">4</text><text x="512.5" y="614" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">6</text><text x="640.0" y="614" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">8</text><path d="M 130.000,287.613 L 193.750,321.999 L 257.500,349.530 L 321.250,378.578 L 385.000,407.741 L 448.750,434.699 L 512.500,458.476 L 576.250,480.881 L 640.000,504.032" stroke="#2666a4" stroke-width="4" fill="none"/><path d="M 130.000,287.613 L 193.750,281.455 L 257.500,275.296 L 321.250,269.138 L 385.000,262.979 L 448.750,256.821 L 512.500,250.662 L 576.250,244.504 L 640.000,238.345" stroke="#c86d31" stroke-width="4" fill="none"/><circle cx="130.0" cy="287.6133467825266" r="5" fill="#2666a4"/><circle cx="130.0" cy="287.6133467825266" r="5" fill="#c86d31"/><circle cx="193.75" cy="321.9985079499238" r="5" fill="#2666a4"/><circle cx="193.75" cy="281.4548054232669" r="5" fill="#c86d31"/><circle cx="257.5" cy="349.5298326962736" r="5" fill="#2666a4"/><circle cx="257.5" cy="275.2962640640072" r="5" fill="#c86d31"/><circle cx="321.25" cy="378.57840427983126" r="5" fill="#2666a4"/><circle cx="321.25" cy="269.13772270474743" r="5" fill="#c86d31"/><circle cx="385.0" cy="407.74073416970367" r="5" fill="#2666a4"/><circle cx="385.0" cy="262.9791813454878" r="5" fill="#c86d31"/><circle cx="448.75" cy="434.69862804921223" r="5" fill="#2666a4"/><circle cx="448.75" cy="256.82063998622806" r="5" fill="#c86d31"/><circle cx="512.5" cy="458.47647856133557" r="5" fill="#2666a4"/><circle cx="512.5" cy="250.66209862696837" r="5" fill="#c86d31"/><circle cx="576.25" cy="480.88136518437256" r="5" fill="#2666a4"/><circle cx="576.25" cy="244.50355726770863" r="5" fill="#c86d31"/><circle cx="640.0" cy="504.03163144943096" r="5" fill="#2666a4"/><circle cx="640.0" cy="238.34501590844894" r="5" fill="#c86d31"/><text x="130" y="174" font-size="26" fill="#22364a" text-anchor="start" font-weight="bold">可优化的 KL 间隙 G(m)，纵轴为对数</text><text x="390" y="657" font-size="26" fill="#22364a" text-anchor="middle" font-weight="normal">整轮更新次数</text><line x1="740" y1="236" x2="795" y2="236" stroke="#2666a4" stroke-width="5"/><text x="815" y="246" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">依次使用最新均值</text><text x="740" y="298" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">首轮：(−1.2, 0.12, 0.648)</text><text x="740" y="345" font-size="29" fill="#2666a4" text-anchor="start" font-weight="normal">G：3.3 → 0.430848</text><line x1="740" y1="420" x2="795" y2="420" stroke="#c86d31" stroke-width="5"/><text x="815" y="430" font-size="27" fill="#c86d31" text-anchor="start" font-weight="bold">同时使用旧均值</text><text x="740" y="482" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">首轮：(−1.2, −1.2, −1.2)</text><text x="740" y="529" font-size="29" fill="#c86d31" text-anchor="start" font-weight="normal">G：3.3 → 4.752</text><line x1="60" y1="701" x2="1140" y2="701" stroke="#dce5ee" stroke-width="2"/><text x="60" y="750" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">同时更新把均值沿 (1,1,1) 方向乘以 −1.2；误差反号并放大。</text><text x="60" y="794" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">图中只比较均值优化间隙；平均场族本身的近似 KL 尚未消失。</text></g></svg>
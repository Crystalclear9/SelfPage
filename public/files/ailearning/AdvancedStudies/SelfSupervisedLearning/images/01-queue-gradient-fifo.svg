<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1120" viewBox="0 0 1360 1120" role="img"><title>冻结历史键仍改变当前查询的梯度，FIFO随后替换状态</title><rect width="1360" height="1120" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="55" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">温度 1；先用旧队列求当前损失，再更新 FIFO</text><line x1="95" y1="365" x2="580" y2="365" stroke="#80929d" stroke-width="2" marker-end="url(#g)"/><line x1="325" y1="485" x2="325" y2="120" stroke="#80929d" stroke-width="2" marker-end="url(#g)"/><line x1="325" y1="365" x2="505" y2="365" stroke="#176b91" stroke-width="4" marker-end="url(#b)"/><circle cx="505" cy="365" r="7" fill="#176b91" stroke="#176b91" stroke-width="2"/><text x="505" y="340" font-size="27" fill="#176b91" text-anchor="middle" font-weight="400">q = k+ = (1, 0)</text><line x1="325" y1="365" x2="145" y2="365" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><circle cx="145" cy="365" r="7" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="145" y="340" font-size="27" fill="#d87332" text-anchor="middle" font-weight="400">kA = (−1, 0)</text><line x1="325" y1="365" x2="325" y2="185" stroke="#218579" stroke-width="4" marker-end="url(#t)"/><circle cx="325" cy="185" r="7" fill="#218579" stroke="#218579" stroke-width="2"/><text x="325" y="153" font-size="27" fill="#218579" text-anchor="middle" font-weight="400">kB = (0, 1)</text><text x="105" y="570" font-size="29" fill="#80929d" text-anchor="start" font-weight="400">所有键停止梯度</text><text x="735" y="135" font-size="32" fill="#176b91" text-anchor="start" font-weight="400">候选竞争</text><text x="735" y="200" font-size="30" fill="#176b91" text-anchor="start" font-weight="400">k+</text><text x="870" y="200" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">logit 1</text><rect x="1015" y="165" width="133.04819999999998" height="45" rx="4" fill="#176b91" stroke="#176b91" stroke-width="2"/><text x="1240" y="200" font-size="26" fill="#176b91" text-anchor="middle" font-weight="400">0.665241</text><text x="735" y="305" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">kA</text><text x="870" y="305" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">logit -1</text><rect x="1015" y="270" width="18.0062" height="45" rx="4" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="1240" y="305" font-size="26" fill="#d87332" text-anchor="middle" font-weight="400">0.090031</text><text x="735" y="410" font-size="30" fill="#218579" text-anchor="start" font-weight="400">kB</text><text x="870" y="410" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">logit 0</text><rect x="1015" y="375" width="48.945600000000006" height="45" rx="4" fill="#218579" stroke="#218579" stroke-width="2"/><text x="1240" y="410" font-size="26" fill="#218579" text-anchor="middle" font-weight="400">0.244728</text><text x="735" y="540" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">自由查询梯度</text><text x="735" y="595" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">gq = (−0.424790, 0.244728)</text><line x1="60" y1="650" x2="1300" y2="650" stroke="#d9e4ea" stroke-width="2"/><text x="60" y="720" font-size="31" fill="#176b91" text-anchor="start" font-weight="400">旧快照 → 当前反向完成 → 写入正键</text><rect x="210" y="775" width="245" height="85" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="332" y="830" font-size="28" fill="#d87332" text-anchor="middle" font-weight="400">kA (−1, 0)</text><rect x="490" y="775" width="245" height="85" rx="4" fill="#eaf4fa" stroke="#218579" stroke-width="2"/><text x="612" y="830" font-size="28" fill="#218579" text-anchor="middle" font-weight="400">kB (0, 1)</text><text x="60" y="830" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">旧队列</text><line x1="755" y1="818" x2="870" y2="818" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="1060" y="725" font-size="29" fill="#203b4a" text-anchor="middle">新队列</text><rect x="910" y="775" width="300" height="85" rx="4" fill="#eaf4fa" stroke="#218579" stroke-width="2"/><text x="1060" y="830" font-size="29" fill="#218579" text-anchor="middle" font-weight="400">kB (0, 1)</text><rect x="910" y="900" width="300" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1060" y="955" font-size="29" fill="#176b91" text-anchor="middle" font-weight="400">k+ (1, 0)</text><path d="M612 865 L612 880 L880 880 L880 818 L900 818" fill="none" stroke="#218579" stroke-width="2" marker-end="url(#t)"/><text x="210" y="955" font-size="29" fill="#d87332" text-anchor="start" font-weight="400">移出最旧 kA</text><text x="60" y="1070" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">梯度是对自由查询 q 的导数；回到归一化前表示或网络参数，还要继续乘雅可比。</text></g></svg>
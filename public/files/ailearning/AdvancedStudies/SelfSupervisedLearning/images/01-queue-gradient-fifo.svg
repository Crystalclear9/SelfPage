<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="776" viewBox="0 0 1200 776" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">旧负样本参与当前反传，之后更新队列</title>
<desc id="fig-desc">固定 q=(1,0)，所有键均停止梯度。</desc>
<rect x="0" y="0" width="1200" height="776" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">先读旧快照，完成当前反向，再替换队首</text>
<rect x="224" y="163" width="210" height="53" fill="#ecf6f6" opacity="1"/>
<text x="329" y="197.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(1, 0)</text>
<rect x="438" y="163" width="210" height="53" fill="#ecf6f6" opacity="1"/>
<text x="543" y="197.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1</text>
<rect x="652" y="163" width="210" height="53" fill="#ecf6f6" opacity="1"/>
<text x="757" y="197.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.665241</text>
<text x="208" y="197.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">正键 k₊</text>
<rect x="224" y="220" width="210" height="53" fill="#f1f5f6" opacity="1"/>
<text x="329" y="254.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(−1, 0)</text>

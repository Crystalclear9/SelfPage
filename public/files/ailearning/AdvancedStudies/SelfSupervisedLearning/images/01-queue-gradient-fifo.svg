<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1248.8235" viewBox="0 0 1440 1248.8235" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">旧队列参与当前候选竞争，查询收到梯度，随后FIFO替换最旧键</title><rect width="1440" height="1248.8235" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">旧队列参与当前候选竞争，查询收到梯度，随后FIFO替换最旧键</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1106.8235" viewBox="0 0 1360 1120" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>冻结历史键仍改变当前查询的梯度，FIFO随后替换状态</title><rect width="1360" height="1120" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1672a0" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1e9195" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="55" font-size="31" fill="#20354a" text-anchor="start" font-weight="400">温度 1；先用旧队列求当前损失，再更新 FIFO</text><line x1="95" y1="365" x2="580" y2="365" stroke="#818fa4" stroke-width="2" marker-end="url(#g)"/><line x1="325" y1="485" x2="325" y2="120" stroke="#818fa4" stroke-width="2" marker-end="url(#g)"/><line x1="325" y1="365" x2="505" y2="365" stroke="#1672a0" stroke-width="4" marker-end="url(#b)"/><circle cx="505" cy="365" r="7" fill="#1672a0" stroke="#1672a0" stroke-width="2"/><text x="505" y="340" font-size="27" fill="#1672a0" text-anchor="middle" font-weight="400">q = k+ = (1, 0)</text><line x1="325" y1="365" x2="145" y2="365" stroke="#d37537" stroke-width="4" marker-end="url(#o)"/><circle cx="145" cy="365" r="7" fill="#d37537" stroke="#d37537" stroke-width="2"/><text x="145" y="340" font-size="27" fill="#d37537" text-anchor="middle" font-weight="400">kA = (−1, 0)</text><line x1="325" y1="365" x2="325" y2="185" stroke="#1e9195" stroke-width="4" marker-end="url(#t)"/><circle cx="325" cy="185" r="7" fill="#1e9195" stroke="#1e9195" stroke-width="2"/><text x="325" y="153" font-size="27" fill="#1e9195" text-anchor="middle" font-weight="400">kB = (0, 1)</text><text x="105" y="570" font-size="29" fill="#818fa4" text-anchor="start" font-weight="400">所有键停止梯度</text><text x="735" y="135" font-size="32" fill="#1672a0" text-anchor="start" font-weight="400">候选竞争</text><text x="735" y="200" font-size="30" fill="#1672a0" text-anchor="start" font-weight="400">k+</text><text x="870" y="200" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">logit 1</text><rect x="1015" y="165" width="133.04819999999998" height="45" rx="4" fill="#1672a0" stroke="#1672a0" stroke-width="2"/><text x="1240" y="200" font-size="26" fill="#1672a0" text-anchor="middle" font-weight="400">0.665241</text><text x="735" y="305" font-size="30" fill="#d37537" text-anchor="start" font-weight="400">kA</text><text x="870" y="305" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">logit -1</text><rect x="1015" y="270" width="18.0062" height="45" rx="4" fill="#d37537" stroke="#d37537" stroke-width="2"/><text x="1240" y="305" font-size="26" fill="#d37537" text-anchor="middle" font-weight="400">0.090031</text><text x="735" y="410" font-size="30" fill="#1e9195" text-anchor="start" font-weight="400">kB</text><text x="870" y="410" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">logit 0</text><rect x="1015" y="375" width="48.945600000000006" height="45" rx="4" fill="#1e9195" stroke="#1e9195" stroke-width="2"/><text x="1240" y="410" font-size="26" fill="#1e9195" text-anchor="middle" font-weight="400">0.244728</text><text x="735" y="540" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">自由查询梯度</text><text x="735" y="595" font-size="30" fill="#d37537" text-anchor="start" font-weight="400">gq = (−0.424790, 0.244728)</text><line x1="60" y1="650" x2="1300" y2="650" stroke="#d9e4ea" stroke-width="2"/><text x="60" y="720" font-size="31" fill="#1672a0" text-anchor="start" font-weight="400">旧快照 → 当前反向完成 → 写入正键</text><rect x="210" y="775" width="245" height="85" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="332" y="830" font-size="28" fill="#d37537" text-anchor="middle" font-weight="400">kA (−1, 0)</text><rect x="490" y="775" width="245" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1e9195" stroke-width="2"/><text x="612" y="830" font-size="28" fill="#1e9195" text-anchor="middle" font-weight="400">kB (0, 1)</text><text x="60" y="830" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">旧队列</text><line x1="755" y1="818" x2="870" y2="818" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><text x="1060" y="725" font-size="29" fill="#20354a" text-anchor="middle">新队列</text><rect x="910" y="775" width="300" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1e9195" stroke-width="2"/><text x="1060" y="830" font-size="29" fill="#1e9195" text-anchor="middle" font-weight="400">kB (0, 1)</text><rect x="910" y="900" width="300" height="85" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1060" y="955" font-size="29" fill="#1672a0" text-anchor="middle" font-weight="400">k+ (1, 0)</text><path d="M612 865 L612 880 L880 880 L880 818 L900 818" fill="none" stroke="#1e9195" stroke-width="2" marker-end="url(#t)"/><text x="210" y="955" font-size="29" fill="#d37537" text-anchor="start" font-weight="400">移出最旧 kA</text><text x="60" y="1070" font-size="28" fill="#20354a" text-anchor="start" font-weight="400">梯度是对自由查询 q 的导数；回到归一化前表示或网络参数，还要继续乘雅可比。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>InfoNCE 的正负样本竞争</title><desc>A把查询、正样本和负样本放入同一候选归一化，B固定三项相似度对比温度，低温会放大最相近候选的竞争。C指出增加负样本同时提高同类碰撞机会，更多负例不自动等于更好语义表示。 下方固定相似度 (1,0.8,0)，将 exp(s/τ) 归一化为三项概率。温度下降后，质量集中到最高相似度项；每个条的总长始终为 1。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">InfoNCE 的正负样本竞争</text><g transform="translate(10,15) scale(.95)"><circle cx="186.00" cy="540.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="186.00" y="549.12" font-size="24" fill="#15364c" text-anchor="middle">q</text><circle cx="664.80" cy="327.20" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="664.80" y="336.32" font-size="24" fill="#15364c" text-anchor="middle">k+</text><circle cx="664.80" cy="540.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="664.80" y="549.12" font-size="24" fill="#15364c" text-anchor="middle">k1</text><circle cx="664.80" cy="752.80" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="664.80" y="761.92" font-size="24" fill="#15364c" text-anchor="middle">k2</text><path d="M236.40,540.00 L614.40,327.20" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M236.40,540.00 L614.40,540.00" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M236.40,540.00 L
ont-size="27" fill="#19333c" text-anchor="start">均值预测的风险为 1；独立随机抽一个 ±1 预测，平均平方误差为 2。</text><text x="60" y="750" font-size="26" fill="#74858a" text-anchor="start">随机抽样保留条件分布的形状；确定预测最小化点预测误差，二者评价对象不同。</text></g></svg>

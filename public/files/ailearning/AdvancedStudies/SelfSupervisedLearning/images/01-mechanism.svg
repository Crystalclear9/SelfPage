<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">降低温度改变概率和梯度的尺度</title>
<desc id="fig-desc">相似度为一、零点八和零。只有第一项是正例。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1058" viewBox="0 0 960 1058" role="img" aria-labelledby="title desc">
<title id="title">降低温度，梯度集中到哪一个负例</title><desc id="desc">固定三个相似度。比较温度一和零点一的归一化概率，以及每个分数的带符号梯度。</desc>

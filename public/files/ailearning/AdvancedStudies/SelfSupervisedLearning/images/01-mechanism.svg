<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>温度既改变概率，也改变相似度梯度</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">温度既改变概率，也改变相似度梯度</text><text x="60" y="112" font-size="27" fill="#74858a" text-anchor="start">固定相似度 (1, 0.8, 0)；第一项为正样本，后两项为负样本</text><text x="320" y="180" font-size="31" fill="#19333c" text-anchor="middle">温度 1</text><rect x="110" y="346.0944901456258" width="90" height="118.90550985437419" fill="#256b82"/><text x="155" y="321.0944901456258" font-size="26" fill="#256b82" text-anchor="middle">0.4573</text><text x="155" y="510" font-size="26" fill="#19333c" text-anchor="middle">正样本</text><text x="155" y="605" font-size="28" fill="#256b82" text-anchor="middle">-0.5427</text><rect x="260" y="367.6484023718068" width="90" height="97.35159762819318" fill="#bf653c"/><text x="305" y="342.6484023718068" font-size="26" fill="#bf653c" text-anchor="middle">0.3744</text><text x="305" y="510" font-size="26" fill="#19333c" text-anchor="middle">近负例</text><text x="305" y="605" font-size="28" fill="#bf653c" text-anchor="middle">0.3744</text><rect x="410" y="421.2571074825674" width="90" height="43.74289251743261" fill="#bf653c"/><text x="455" y="396.2571074825674" font-size="26" fill="#bf653c" text-anchor="middle">0.1682</text><text x="455" y="510" font-size="26" fill="#19333c" text-anchor="middle">远负例</text><text x="455" y="605" font-size="28" fill="#bf653c" text-anchor="middle">0.1682</text><line x1="95" y1="465" x2="550" y2="465" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><text x="940" y="180" font-size="31" fill="#19333c" text-anchor="middle">温度 0.1</text><rect x="730" y="236.00191692982997" width="90" height="228.99808307017003" fill="#256b82"/><text x="775" y="211.00191692982997" font-size="26" fill="#256b82" text-anchor="middle">0.8808</text><text x="775" y="510" font-size="26" fill="#19333c" text-anchor="middle">正样本</text><text x="775" y="605" font-size="28" fill="#256b82" text-anchor="middle">-1.1924</text><rect x="880" y="434.0084795670572" width="90" height="30.991520432942835" fill="#bf653c"/><text x="925" y="409.0084795670572" font-size="26" fill="#bf653c" text-anchor="middle">0.1192</text><text x="925" y="510" font-size="26" fill="#19333c" text-anchor="middle">近负例</text><text x="925" y="605" font-size="28" fill="#bf653c" text-anchor="middle">1.1920</text><rect x="1030" y="464.98960350311285" width="90" height="0.01039649688712939" fill="#bf653c"/><text x="1075" y="439.98960350311285" font-size="26" fill="#bf653c" text-anchor="middle">0.000040</text><text x="1075" y="510" font-size="26" fill="#19333c" text-anchor="middle">远负例</text><text x="1075" y="605" font-size="28" fill="#bf653c" text-anchor="middle">0.0004</text><line x1="715" y1="465" x2="1170" y2="465" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><text x="60" y="562" font-size="27" fill="#74858a" text-anchor="start">对相似度的梯度：</text><line x1="60" y1="660" x2="1220" y2="660" stroke="#dce5e7" stroke-width="2" stroke-dasharray=""/><text x="60" y="710" font-size="27" fill="#19333c" text-anchor="start">梯度 = (概率 − 目标指示值) ÷ 温度；低温并不保证所有梯度都增大。</text><text x="60" y="754" font-size="26" fill="#74858a" text-anchor="start">本例近负例梯度增大，远负例梯度变小；更尖锐的概率并不直接证明表示更好。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>温度改变同一组相似度的竞争强度</title><desc>固定三个候选相似度为1、0.8、0，并比较温度1与0.1下的softmax概率。温度降低后，最高相似度候选获得更集中权重，第二名与第一名很小的差异也会被放大；候选本身的几何位置并没有改变。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">温度改变同一组相似度的竞争强度</text><text x="85" y="190" font-size="24" fill="#16344c" text-anchor="start">候选概率（各组三项和为1）</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="449.9" width="108.3" height="160.1" fill="#2865a0" /><text x="189.16666666666666" y="433.9348905806501" font-size="24" fill="#16344c" text-anchor="middle">0.457329</text><text x="189.16666666666666" y="680" font-size="24" fill="#16344c" text-anchor="middle">温度1：候选1</text><rect x="291.7" y="478.9" width="108.3" height="131.1" fill="#cf7432" /><text x="345.8333333333333" y="462.94977242358607" font-size="24" fill="#16344c" text-anchor="middle">0.374429</text><text x="345.8333333333333" y="680" font-size="24" fill="#16344c" text-anchor="middle">候选2</text><rect x="448.3" y="551.1" width="108.3" height="58.9" fill="#627689" /><text x="502.5" y="535.1153369957638" font-size="24" fill="#16344c" text-anchor="middle">0.168242</text><text x="502.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">候选3</text><rect x="605.0" y="301.7" width="108.3" height="308.3" fill="#2865a0" /><text x="659.1666666666666" y="285.73334971323266" font-size="24" fill="#16344c" text-anchor="middle">0.880762</text><text x="659.1666666666666" y="680" font-size="24" fill="#16344c" text-anchor="middle">温度0.1：候选1</text><rect x="761.7" y="568.3" width="108.3" height="41.7" fill="#cf7432" /><text x="815.8333333333333" y="552.2806455710385" font-size="24" fill="#16344c" text-anchor="middle">0.119198</text><text x="815.8333333333333" y="680" font-size="24" fill="#16344c" text-anchor="middle">候选2</text><rect x="918.3" y="610.0" width="108.3" height="0.0" fill="#627689" /><text x="972.5" y="593.9860047157289" font-size="24" fill="#16344c" text-anchor="middle">3.99865e-05</text><text x="972.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">候选3</text><text x="100" y="135" font-size="24" fill="#16344c" text-anchor="start">相似度固定为 (1,0.8,0)，只改变归一化温度。</text></g></svg>

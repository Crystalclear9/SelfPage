<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764.189189" viewBox="0.0 64.63964 1200.0 764.189189" role="img"><rect id="offline-white-background" x="0.0" y="64.63964" width="1200.0" height="764.189189" fill="#ffffff"/><title>三样本三特征协方差非对角能量的可达下界</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="108" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">B = 3，d = 3；每维样本方差为 1，协方差秩至多为 2</text><text x="300" y="161" font-size="29" fill="#22364a" text-anchor="middle" font-weight="bold">归一化特征列向量</text><circle cx="300" cy="340" r="140" fill="none" stroke="#dce5ee" stroke-width="2"/><line x1="140" y1="340" x2="460" y2="340" stroke="#dce5ee" stroke-width="2"/><line x1="300" y1="180" x2="300" y2="500" stroke="#dce5ee" stroke-width="2"/><line x1="300" y1="340" x2="440.0" y2="340.0" stroke="#2666a4" stroke-width="5"/><circle cx="440.0" cy="340.0" r="7" fill="#2666a4"/><text x="476.0" y="349.0" font-size="29" fill="#2666a4" text-anchor="middle" font-weight="normal">v1</text><line x1="300" y1="340" x2="230.00000000000003" y2="218.75644347017857" stroke="#2666a4" stroke-width="5"/><circle cx="230.00000000000003" cy="218.75644347017857" r="7" fill="#2666a4"/><text x="212.00000000000006" y="196.57952893393878" font-size="29" fill="#2666a4" text-anchor="middle" font-weight="normal">v2</text><line x1="300" y1="340" x2="229.99999999999994" y2="461.2435565298214" stroke="#2666a4" stroke-width="5"/><circle cx="229.99999999999994" cy="461.2435565298214" r="7" fill="#2666a4"/><text x="211.99999999999991" y="501.42047106606117" font-size="29" fill="#2666a4" text-anchor="middle" font-weight="normal">v3</text><text x="300" y="535" font-size="26" fill="#22364a" text-anchor="middle" font-weight="normal">两两夹角 120°；v1 + v2 + v3 = 0</text><text x="880" y="161" font-size="29" fill="#22364a" text-anchor="middle" font-weight="bold">样本协方差矩阵 C</text><rect x="715" y="195" width="108" height="98" fill="#d0e3f2"/
<g id="round-20261105c-teaching" transform="translate(0 917.027) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">每维方差都为1，谱仍能揭示完全冗余与最大可达秩</text><text x="65" y="125" font-size="30" fill="#1d3145" text-anchor="start">三样本、三特征、列均值零：协方差的秩最多2</text><rect x="65" y="195" width="642" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="386.0" y="234" font-size="28" fill="#1e7499" text-anchor="middle">三列相同：谱 (3,0,0)</text><rect x="715" y="195" width="642" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1036.0" y="234" font-size="28" fill="#1e7499" text-anchor="middle">原三角构造：谱 (1.5,1.5,0)</text><text x="65" y="315" font-size="31" fill="#c66d3a" text-anchor="start">两者迹均为3；非对角平方和分别为6与1.5。</text><text x="65" y="412" font-size="28" fill="#1d3145" text-anchor="start">只看对角方差无法区分它们；方差、相关与有效维度要同时解释。</text></g></g></svg></svg>

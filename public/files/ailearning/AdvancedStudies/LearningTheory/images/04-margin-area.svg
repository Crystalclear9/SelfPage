<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="523.449" viewBox="0 66.469719 1200 523.449040" role="img"><rect id="offline-white-background" x="0" y="66.469719" width="1200" height="523.449040" fill="#ffffff"/><title id="extra-title">分歧区域大小与超额风险不是同一个量</title><desc id="extra-desc">令 X 在 [-1,1] 上均匀分布，\eta(x)=P(Y=1\mid X=x)=\frac{x+1}{2}。Bayes 规则的边界为零；把候选边界右移到 \delta=0.4，两条规则只在 [0,0.4) 上分歧，所以分歧概率为 \frac{0.4}{2}=0.2。但该区间靠近标签难以区分的边界，额外错误率需按 |2\eta(x)-1|=x 加权，而不能直接把所有分歧当成等量风险。

右图的高度已经乘入输入密度 \frac12，故三角形面积为 \int_0^{0.4}\frac{x}{2}\,dx=0.04。一般右移量 0\le\delta\le1 对应分歧概率 \frac{\delta}{2}、超额风险 \frac{\delta^2}{4}；在这一具体分布中，损失差二阶矩等于分歧概率，因此恰有 Pg_h^2=\sqrt{Pg_h}。这展示了边界附近的标签优势怎样改变风险与区域大小的关系，并不把图中的指数推广到所有分类分布。</desc><rect width="1200" height="625" fill="white"/><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="45" y="110" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">分歧区域：0 到 δ=0.4</text><text x="670" y="110" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">按标签优势加权后的面积</text><line x1="75" y1="495.0" x2="505" y2="495.0" stroke="#dce5ed" stroke-width="2"/><text x="63" y="503.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="75" y1="330.0" x2="505" y2="330.0" stroke="#dce5ed" stroke-width="2"/><text x="63" y="338.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="75" y1="165.0" x2="505" y2="165.0" stroke="#dce5ed" stroke-width="2"/><text x="63" y="173.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="75" y1="165" x2="75" y2="495" stroke="#627689" stroke-width="2"/><line x1="75" y1="495" x2="505" y2="495" stroke="#627689" stroke-width="2"/><line x1="75.0" y1="495.0" x2="75.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="75.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">-1</text><line x1="290.0" y1="495.0" x2="290.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="290.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="376.0" y1="495.0" x2="376.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="376.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.4</text><line x1="505.0" y1="495.0" x2="505.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="505.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><polygon points="290.000,495.000 376.000,495.000 376.000,165.000 290.000,165.000" fill="#fff0e3" stroke="none"/><polyline points="75.000,495.000 505.000,165.000" fill="none" stroke="#2865a0" stroke-width="3" stroke-linejoin="round"/><line x1="75.0" y1="330.0" x2="505.0" y2="330.0" stroke="#627689" stroke-width="2" stroke-dasharray="6 5"/><line x1="290.0" y1="495.0" x2="290.0" y2="165.0" stroke="#2865a0" stroke-width="2" stroke-dasharray="5 5"/><line x1="376.0" y1="495.0" x2="376.0" y2="165.0" stroke="#cf7432" stroke-width="3"/><text x="90" y="565" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">分歧概率 = 0.2</text><line x1="690" y1="495.0" x2="1120" y2="495.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="503.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="690" y1="429.0" x2="1120" y2="429.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="437.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.1</text><line x1="690" y1="363.0" x2="1120" y2="363.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="371.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.2</text><line x1="690" y1="297.0" x2="1120" y2="297.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="305.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.3</text><line x1="690" y1="231.0" x2="1120" y2="231.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="239.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.4</text><line x1="690" y1="165.0" x2="1120" y2="165.0" stroke="#dce5ed" stroke-width="2"/><text x="678" y="173.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="690" y1="165" x2="690" y2="495" stroke="#627689" stroke-width="2"/><line x1="690" y1="495" x2="1120" y2="495" stroke="#627689" stroke-width="2"/><line x1="690.0" y1="495.0" x2="690.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="690.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="862.0" y1="495.0" x2="862.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="862.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.4</text><line x1="1120.0" y1="495.0" x2="1120.0" y2="501.0" stroke="#627689" stroke-width="2"/><text x="1120.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><polygon points="690.000,495.000 862.000,495.000 862.000,363.000" fill="#fff0e3" stroke="none"/><polyline points="690.000,495.000 1120.000,165.000" fill="none" stroke="#2865a0" stroke-width="3" stroke-linejoin="round"/><line x1="862.0" y1="495.0" x2="862.0" y2="363.0" stroke="#cf7432" stroke-width="3"/><text x="900" y="330" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">面积 = 0.04</text><path d="M940,350 L793.2,468.6" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/><text x="700" y="565" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">超额风险 = 0.04</text><text x="75" y="150" font-size="24" fill="#627689" text-anchor="start" font-weight="400">η(x)</text><text x="690" y="150" font-size="24" fill="#627689" text-anchor="start" font-weight="400">加权高度</text></g></svg>

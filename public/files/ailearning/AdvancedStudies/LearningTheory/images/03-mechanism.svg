<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="797.8621" viewBox="0 0 1440 797.8621" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">对称参数后验具有相同成员函数但参数平均函数退化</title><rect width="1440" height="797.8621" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">对称参数后验具有相同成员函数但参数平均函数退化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="655.8621" viewBox="0 71.9212 1280 624.6305" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="71.921182" width="1280" height="624.630542" fill="#ffffff"/><title>平均参数可以破坏所有后验成员共同表示的函数</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#728d97" text-anchor="start">参数化 f(w, x) = w²x；Q 在 w = −1 与 w = +1 各放一半质量</text><text x="80" y="190" font-size="29" fill="#1c2e40" text-anchor="start">参数空间</text><line x1="110" y1="360" x2="600" y2="360" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="170" y1="350" x2="170" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="170" y="408" font-size="27" fill="#1c2e40" text-anchor="middle">−1</text><line x1="355" y1="350" x2="355" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="355" y="408" font-size="27" fill="#1c2e40" text-anchor="middle">0</text><line x1="540" y1="350" x2="540" y2="370" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><text x="540" y="408" font-size="27" fill="#1c2e40" text-anchor="middle">+1</text><line x1="170" y1="360" x2="170" y2="250" stroke="#217292" stroke-width="7" stroke-dasharray=""/><line x1="540" y1="360" x2="540" y2="250" stroke="#217292" stroke-width="7" stroke-dasharray=""/><text x="170" y="230" font-size="25" fill="#217292" text-anchor="middle">质量 0.5</text><text x="540" y="230" font-size="25" fill="#217292" text-anchor="middle">质量 0.5</text><circle cx="355" cy="360" r="7" fill="#bd6c41"/><text x="355" y="470" font-size="26" fill="#bd6c41" text-anchor="middle">平均参数 E[w] = 0</text><text x="755" y="190" font-size="29" fill="#1c2e40" text-anchor="start">函数空间：同一测试输入 x</text><line x1="835" y1="579.0" x2="835" y2="231.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="550" x2="1154.0" y2="550" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="1125" y1="579.0" x2="1125" y2="231.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="260" x2="1154.0" y2="260" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#728d97" stroke-width="2" stroke-dasharray=""/><path d="M820.50,564.50 L1139.50,245.50" fill="none" stroke="#217292" stroke-width="4"/><path d="M820.50,405.00 L1139.50,405.00" fill="none" stroke="#bd6c41" stroke-width="4"/><text x="780" y="625" font-size="25" fill="#217292" text-anchor="start">成员与平均函数：E[f(w,x)] = x</text><text x="780" y="670" font-size="25" fill="#bd6c41" text-anchor="start">平均参数函数：f(E[w],x) = 0</text></g><desc> 若真实输出为 x：每个成员平方误差为 0，平均参数模型误差却为 x²。</desc></svg></svg>

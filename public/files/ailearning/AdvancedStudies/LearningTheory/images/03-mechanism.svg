<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>平均参数可以破坏所有后验成员共同表示的函数</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">平均参数可以破坏所有后验成员共同表示的函数</text><text x="60" y="115" font-size="26" fill="#71858b" text-anchor="start">参数化 f(w, x) = w²x；Q 在 w = −1 与 w = +1 各放一半质量</text><text x="80" y="190" font-size="29" fill="#183944" text-anchor="start">参数空间</text><line x1="110" y1="360" x2="600" y2="360" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="170" y1="350" x2="170" y2="370" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="170" y="408" font-size="27" fill="#183944" text-anchor="middle">−1</text><line x1="355" y1="350" x2="355" y2="370" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="355" y="408" font-size="27" fill="#183944" text-anchor="middle">0</text><line x1="540" y1="350" x2="540" y2="370" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="540" y="408" font-size="27" fill="#183944" text-anchor="middle">+1</text><line x1="170" y1="360" x2="170" y2="250" stroke="#246b82" stroke-width="7" stroke-dasharray=""/><line x1="540" y1="360" x2="540" y2="250" stroke="#246b82" stroke-width="7" stroke-dasharray=""/><text x="170" y="230" font-size="25" fill="#246b82" text-anchor="middle">质量 0.5</text><text x="540" y="230" font-size="25" fill="#246b82" text-anchor="middle">质量 0.5</text><circle cx="355" cy="360" r="7" fill="#c0673e"/><text x="355" y="470" font-size="26" fill="#c0673e" text-anchor="middle">平均参数 E[w] = 0</text><text x="755" y="190" font-size="29" fill="#183944" text-anchor="start">函数空间：同一测试输入 x</text><line x1="835" y1="579.0" x2="835" y2="231.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="550" x2="1154.0" y2="550" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="1125" y1="579.0" x2="1125" y2="231.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="260" x2="1154.0" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="806.0" y1="405" x2="1154.0" y2="405" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="579.0" x2="980" y2="231.0" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><path d="M820.50,564.50 L1139.50,245.50" fill="none" stroke="#246b82" stroke-width="4"/><path d="M820.50,405.00 L1139.50,405.00" fill="none" stroke="#c0673e" stroke-width="4"/><text x="780" y="625" font-size="25" fill="#246b82" text-anchor="start">成员与平均函数：E[f(w,x)] = x</text><text x="780" y="670" font-size="25" fill="#c0673e" text-anchor="start">平均参数函数：f(E[w],x) = 0</text><text x="60" y="744" font-size="27" fill="#183944" text-anchor="start">若真实输出为 x：每个成员平方误差为 0，平均参数模型误差却为 x²。</text></g></svg>

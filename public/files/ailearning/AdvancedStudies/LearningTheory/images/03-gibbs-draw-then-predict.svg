<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="610" viewBox="0 0 1330 610" role="img" aria-labelledby="title desc"><title id="title">随机预测器从后验中抽取</title><desc id="desc">每次先从后验抽取一个预测器，再对新输入计算。不同预测器的风险按抽样概率平均。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="610" fill="white" stroke="none" stroke-width="1.55"/><text x="306" y="64" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">从后验抽取</text><text x="1064" y="64" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">对新样本预测</text><rect x="119" y="133" width="96.2" height="49" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="397" y="167" fill="#196f77" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">h₁</text><rect x="119" y="266" width="214.6" height="49" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="397" y="300" fill="#655184" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">h₂</text><line x1="452" y1="291" x2="700" y2="291" stroke="#655184" stroke-width="2.35" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="726,325 935,325 968,257 759,257" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="847" y="301.2" fill="#655184" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">抽中的预测器</text><line x1="1084" y1="291" x2="982" y2="291" stroke="#655184" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="847" y1="335" x2="847" y2="388" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="847" y="430" fill="#655184" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">输出预测</text><circle cx="1138" cy="291" r="32" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><text x="1138" y="301.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">x</text><rect x="119" y="399" width="59.2" height="49" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.55"/><text x="397" y="433" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">h₃</text><text x="644" y="554" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">每次抽一个预测器，风险对抽样结果求期望</text></svg>
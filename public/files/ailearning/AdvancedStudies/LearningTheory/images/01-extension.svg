<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>VC 维要求打散同一组点的全部标记</title><desc>一维阈值分类器可以在一个固定点上实现正、负两种标记，因而能打散单点。对有序两个点，它不能实现“左正右负”和“左负右正”中的某一反向模式（取固定方向的阈值），所以不能打散这组两点。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">VC 维要求打散同一组点的全部标记</text><text x="65" y="150" font-size="22" fill="#193e54" text-anchor="start">固定方向阈值 h(x)=1[x≥θ]</text><line x1="170" y1="430" x2="1050" y2="430" stroke="#277eac" stroke-width="2.5" /><circle cx="420" cy="430" r="32" fill="#daedf8" stroke="#5597b5" /><text x="420" y="438" font-size="22" fill="#193e54" text-anchor="middle">x1</text><circle cx="800" cy="430" r="32" fill="#daedf8" stroke="#5597b5" /><text x="800" y="438" font-size="22" fill="#193e54" text-anchor="middle">x2</text><text x="390" y="290" font-size="22" fill="#193e54" text-anchor="start">左侧点</text><text x="770" y="290" font-size="22" fill="#193e54" text-anchor="start">右侧点</text><text x="200" y="540" font-size="28" fill="#193e54" text-anchor="start">可实现：00、01、11</text><text x="200" y="610" font-size="28" fill="#b25b24" text-anchor="start">不能实现：10（左正右负）</text><text x="95" y="730" font-size="22" fill="#193e54" text-anchor="start">打散要求同一组点的全部标记可实现，不是为每种标记另换一组点。</text></g></svg>

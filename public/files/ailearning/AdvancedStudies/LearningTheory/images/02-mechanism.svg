<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>零空间中的移动不改变训练拟合</title><desc>训练设计矩阵只有一行[1,0]，标签为1，所有参数(1,t)都完全插值。若测试输入是(0,1)，预测却等于t，可以任意变化。图中竖直直线是训练零误差解集，不同点共享训练拟合但拥有不同外推行为。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">零空间中的移动不改变训练拟合</text><line x1="180" y1="570" x2="1000" y2="570" stroke="#277eac" stroke-width="2.5" /><line x1="430" y1="180" x2="430" y2="650" stroke="#277eac" stroke-width="2.5" /><line x1="650" y1="180" x2="650" y2="650" stroke="#148671" stroke-width="2.5" /><text x="605" y="155" font-size="23" fill="#16344c" text-anchor="start">w1=1：训练零误差解集</text><circle cx="650" cy="290" r="32" fill="#daedf8" stroke="#5597b5" /><text x="650" y="298" font-size="22" fill="#16344c" text-anchor="middle">t=2</text><circle cx="650" cy="430" r="32" fill="#daedf8" stroke="#5597b5" /><text x="650" y="438" font-size="22" fill="#16344c" text-anchor="middle">t=1</text><circle cx="650" cy="570" r="32" fill="#daedf8" stroke="#5597b5" /><text x="650" y="578" font-size="22" fill="#16344c" text-anchor="middle">t=0</text><text x="1020" y="580" font-size="22" fill="#16344c" text-anchor="start">w1</text><text x="390" y="175" font-size="22" fill="#16344c" text-anchor="start">w2</text><text x="120" y="710" font-size="23" fill="#16344c" text-anchor="start">训练只约束第一坐标；测试输入 (0,1) 的预测等于 t。</text></g></svg>

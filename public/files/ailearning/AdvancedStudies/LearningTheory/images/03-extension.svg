<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>随机 Gibbs 预测与多数投票风险不同</title><desc>三个分类器在一个固定样本上分别预测(对、对、错)，若后验等权，随机抽一个预测器的错误概率为三分之一，多数投票却预测正确。两种风险对象不同，不能把关于Gibbs预测器的界直接当作同数值的投票风险界。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">随机 Gibbs 预测与多数投票风险不同</text><rect x="100" y="240" width="280" height="200" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="240" y="310" font-size="25" fill="#193e54" text-anchor="middle">分类器1</text><text x="240" y="385" font-size="36" fill="#193e54" text-anchor="middle">正确</text><rect x="460" y="240" width="280" height="200" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="600" y="310" font-size="25" fill="#193e54" text-anchor="middle">分类器2</text><text x="600" y="385" font-size="36" fill="#193e54" text-anchor="middle">正确</text><rect x="820" y="240" width="280" height="200" rx="8" fill="#f4d6c1" stroke="#9cb8c8" /><text x="960" y="310" font-size="25" fill="#193e54" text-anchor="middle">分类器3</text><text x="960" y="385" font-size="36" fill="#193e54" text-anchor="middle">错误</text><text x="100" y="570" font-size="28" fill="#193e54" text-anchor="start">随机等权抽取：错误概率三分之一</text><text x="100" y="650" font-size="28" fill="#193e54" text-anchor="start">多数投票：这个样本预测正确</text><text x="100" y="735" font-size="22" fill="#193e54" text-anchor="start">这是单个固定样本的对象对照，不是总体风险估计。</text></g></svg>

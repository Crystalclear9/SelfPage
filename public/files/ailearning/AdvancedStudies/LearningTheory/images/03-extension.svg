<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-title fig-desc" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title id="fig-title">随机 Gibbs 预测与多数投票回答不同的问题</title><desc id="fig-desc">随机 Gibbs 预测与多数投票回答不同的问题</desc><rect width="1200" height="580" fill="white" /><defs><marker id="m-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="m-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">随机 Gibbs 预测与多数投票回答不同的问题</text><text x="40" y="120" font-size="27" fill="#213447" text-anchor="start" font-weight="400">同一个样本，三个分类器的结果</text><circle cx="110" cy="220" r="40" fill="#2865a0" /><text x="110" y="229" font-size="25" fill="white" text-anchor="middle" font-weight="600">对</text><circle cx="255" cy="220" r="40" fill="#2865a0" /><text x="255" y="229" font-size="25" fill="white" text-anchor="middle" font-weight="600">对</text><circle cx="400" cy="220" r="40" fill="#cf7432" /><text x="400" y="229" font-size="25" fill="white" text-anchor="middle" font-weight="600">错</text><path d="M465,200 L675,145" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#m-b)" /><path d="M465,245 L675,360" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#m-o)" /><text x="710" y="110" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">随机抽一个分类器</text><text x="710" y="170" font-size="28" fill="#213447" text-anchor="start" font-weight="400">出错概率</text><text x="952.5" y="154" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><line x1="920" y1="166" x2="985" y2="166" stroke="#213447" stroke-width="1.7" /><text x="952.5" y="200" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">3</text><text x="710" 
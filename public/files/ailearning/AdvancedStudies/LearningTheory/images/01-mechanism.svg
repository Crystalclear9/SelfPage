<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img"><title>随机符号先实现，再选择最匹配函数：顺序不能交换</title><rect width="1280" height="870" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">随机符号先实现，再选择最匹配函数：顺序不能交换</text><text x="65" y="123" font-size="27" fill="#183944" text-anchor="start">固定输入 x = (1, 2)；预测类 g_w(x) = wx，约束 |w| ≤ 1。</text><text x="135" y="225" font-size="27" fill="#183944" text-anchor="middle">σ1</text><text x="335" y="225" font-size="27" fill="#183944" text-anchor="middle">σ2</text><text x="575" y="225" font-size="27" fill="#183944" text-anchor="middle">σ1 + 2σ2</text><text x="800" y="225" font-size="27" fill="#183944" text-anchor="middle">最优 w</text><text x="1060" y="225" font-size="27" fill="#183944" text-anchor="middle">上确界</text><text x="135" y="315" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="335" y="315" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="575" y="315" font-size="30" fill="#183944" text-anchor="middle">-3</text><text x="800" y="315" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="1060" y="315" font-size="30" fill="#246b82" text-anchor="middle">1.5</text><line x1="65" y1="345" x2="1190" y2="345" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="403" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="335" y="403" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="575" y="403" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="800" y="403" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="1060" y="403" font-size="30" fill="#246b82" text-anchor="middle">0.5</text><line x1="65" y1="433" x2="1190" y2="433" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="491" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="335" y="491" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="575" y="491" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="800" y="491" font-size="30" fill="#183944" text-anchor="middle">-1</text><text x="1060" y="491" font-size="30" fill="#246b82" text-anchor="middle">0.5</text><line x1="65" y1="521" x2="1190" y2="521" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="579" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="335" y="579" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="575" y="579" font-size="30" fill="#183944" text-anchor="middle">+3</text><text x="800" y="579" font-size="30" fill="#183944" text-anchor="middle">+1</text><text x="1060" y="579" font-size="30" fill="#246b82" text-anchor="middle">1.5</text><line x1="65" y1="609" x2="1190" y2="609" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="65" y="691" font-size="27" fill="#246b82" text-anchor="start">每种符号组合概率 1/4；平均上确界 = (1.5 + 0.5 + 0.5 + 1.5) / 4 = 1。</text><text x="65" y="754" font-size="27" fill="#183944" text-anchor="start">对任一预先固定的 w，符号相关性的期望为 0；取最大后，期望变为 1。</text><text x="65" y="815" font-size="26" fill="#183944" text-anchor="start">这里是预测类复杂度；转成风险界，还需损失收缩、有界或尾部条件。</text></g></svg>

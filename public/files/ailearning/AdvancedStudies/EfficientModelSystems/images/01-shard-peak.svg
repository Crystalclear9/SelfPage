<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="625" viewBox="0 0 1200 625" role="img"><title id="extra-title">参数分片的常驻量与当前层聚合峰值不同</title><desc id="extra-desc">仅统计一个含四个 FP32 权重的计算单元：每个权重 4 字节，总量 16 字节，两台设备各持久拥有两个坐标，因此每卡分片为 8 字节。图示协议在当前层计算前，另行分配 16 字节的完整聚合缓冲，同时继续保留原来的本地分片；此时仅这两类参数缓冲就共占 24 字节。完成当前层并释放完整缓冲后，再回到每卡 8 字节。

这个账本依赖明确的存活关系：图中假设聚合缓冲与分片缓冲并存。若实现复用、释放或别名共享了缓冲，峰值需要按真实所有权重新计算。激活、梯度、优化器矩、通信工作区及下一单元预取均未计入，因此不能把任何一个图中数字当作完整训练显存预算。分片降低持久复制量，是否容得下瞬时计算仍要逐个检查聚合单元。</desc><rect width="1200" height="625" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">参数分片的常驻量与当前层聚合峰值不同</text><text x="165" y="110" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">持久分片</text><text x="505" y="110" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">当前层全聚合</text><text x="905" y="110" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">计算后重分片</text><text x="30" y="218" font-size="27" fill="#213447" text-anchor="start" font-weight="400">设备 0</text><rect x="165" y="175" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="202.0" y="217.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w1</text><rect x="245" y="175" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="282.0" y="217.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w2</text><rect x="500" y="175" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="537.0" y="217.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w1</text><rect x="580" y="175" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="617.0" y="217.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w2</text><rect x="660" y="175" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="697.0" y="217.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w3</text><rect x="740" y="175" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="777.0" y="217.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w4</text><rect x="940" y="175" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="977.0" y="217.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w1</text><rect x="1020" y="175" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1057.0" y="217.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w2</text><path d="M335,207 L480,207" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M835,207 L920,207" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><text x="505" y="285" font-size="24" fill="#627689" text-anchor="start" font-weight="400">仍保留本地分片 8 B</text><text x="30" y="398" font-size="27" fill="#213447" text-anchor="start" font-weight="400">设备 1</text><rect x="165" y="355" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="202.0" y="397.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w3</text><rect x="245" y="355" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="282.0" y="397.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w4</text><rect x="500" y="355" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="537.0" y="397.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w1</text><rect x="580" y="355" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="617.0" y="397.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w2</text><rect x="660" y="355" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="697.0" y="397.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w3</text><rect x="740" y="355" width="74" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="777.0" y="397.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">w4</text><rect x="940" y="355" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="977.0" y="397.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w3</text><rect x="1020" y="355" width="74" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1057.0" y="397.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">w4</text><path d="M335,387 L480,387" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M835,387 L920,387" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><text x="505" y="465" font-size="24" fill="#627689" text-anchor="start" font-weight="400">仍保留本地分片 8 B</text><text x="205" y="565" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">每卡 8 B</text><text x="500" y="565" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">每卡 8 + 16 = 24 B</text><text x="950" y="565" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">每卡 8 B</text></g></svg>

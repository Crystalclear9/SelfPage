<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img"><title>同一混合精度账本：每卡持久状态如何随分片减少</title><rect width="1280" height="860" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一混合精度账本：每卡持久状态如何随分片减少</text><rect x="65" y="119" width="25" height="25" fill="#246b82"/><text x="105" y="143" font-size="25" fill="#183944" text-anchor="start">计算权重 2 B</text><rect x="365" y="119" width="25" height="25" fill="#95a9ae"/><text x="405" y="143" font-size="25" fill="#183944" text-anchor="start">梯度 2 B</text><rect x="665" y="119" width="25" height="25" fill="#c0673e"/><text x="705" y="143" font-size="25" fill="#183944" text-anchor="start">主权重 4 B</text><rect x="965" y="119" width="25" height="25" fill="#d9a17e"/><text x="1005" y="143" font-size="25" fill="#183944" text-anchor="start">Adam 两矩 8 B</text><text x="65" y="200" font-size="27" fill="#183944" text-anchor="start">十亿参数，8 个数据并行设备；横轴为每设备十进制 GB。</text><text x="65" y="309" font-size="28" fill="#183944" text-anchor="start">复制</text><rect x="230" y="274" width="110" height="47" fill="#246b82"/><rect x="340" y="274" width="110" height="47" fill="#95a9ae"/><rect x="450" y="274" width="220" height="47" fill="#c0673e"/><rect x="670" y="274" width="440" height="47" fill="#d9a17e"/><text x="1128" y="310" font-size="28" fill="#183944" text-anchor="start">16 GB</text><text x="65" y="421" font-size="28" fill="#183944" text-anchor="start">分优化器</text><rect x="230" y="386" width="110" height="47" fill="#246b82"/><rect x="340" y="386" width="110" height="47" fill="#95a9ae"/><rect x="450" y="386" width="27.5" height="47" fill="#c0673e"/><rect x="477.5" y="386" width="55" height="47" fill="#d9a17e"/><text x="550.5" y="422" font-size="28" fill="#183944" text-anchor="start">5.5 GB</text><text x="65" y="533" font-size="28" fill="#183944" text-anchor="start">再分梯度</text><rect x="230" y="498" width="110" height="47" fill="#246b82"/><rect x="340" y="498" width="13.75" height="47" fill="#95a9ae"/><rect x="353.75" y="498" width="27.5" height="47" fill="#c0673e"/><rect x="381.25" y="498" width="55" height="47" fill="#d9a17e"/><text x="454.25" y="534" font-size="28" fill="#183944" text-anchor="start">3.75 GB</text><text x="65" y="645" font-size="28" fill="#183944" text-anchor="start">再分参数</text><rect x="230" y="610" width="13.75" height="47" fill="#246b82"/><rect x="243.75" y="610" width="13.75" height="47" fill="#95a9ae"/><rect x="257.5" y="610" width="27.5" height="47" fill="#c0673e"/><rect x="285.0" y="610" width="55" height="47" fill="#d9a17e"/><text x="358.0" y="646" font-size="28" fill="#183944" text-anchor="start">2 GB</text><line x1="230" y1="715" x2="1110" y2="715" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="715" x2="230" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="230" y="760" font-size="25" fill="#71858b" text-anchor="middle">0</text><line x1="340" y1="715" x2="340" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="340" y="760" font-size="25" fill="#71858b" text-anchor="middle">2</text><line x1="450" y1="715" x2="450" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="450" y="760" font-size="25" fill="#71858b" text-anchor="middle">4</text><line x1="670" y1="715" x2="670" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="670" y="760" font-size="25" fill="#71858b" text-anchor="middle">8</text><line x1="890" y1="715" x2="890" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="890" y="760" font-size="25" fill="#71858b" text-anchor="middle">12</text><line x1="1110" y1="715" x2="1110" y2="722" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1110" y="760" font-size="25" fill="#71858b" text-anchor="middle">16</text><text x="65" y="817" font-size="26" fill="#183944" text-anchor="start">仅计所列持久状态；激活、完整参数聚合、预取和工作区需另做存活账本。</text></g></svg>

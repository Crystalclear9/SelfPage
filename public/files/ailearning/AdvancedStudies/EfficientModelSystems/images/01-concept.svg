<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>训练显存由多种状态相加</title><desc>A将同一参数的权重、梯度与两个Adam状态按所有权分开；B复算仅这几项就需16字节每参数。C再区分激活：检查点重计算减少内部激活驻留，却不直接删除参数或优化器状态。 下方用四个层位置表示一次前向链，蓝色位置保存激活，橙色位置需要从最近的检查点重新计算。三种保存策略的差别是中间状态存储与额外计算的交换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">训练显存由多种状态相加</text><g transform="translate(10,15) scale(.95)"><text x="102.00" y="236.00" font-size="26" fill="#15364c" text-anchor="start">同一参数的状态分解</text><rect x="110.40" y="388.00" width="168.00" height="288.80" rx="5" fill="#d6eae3" stroke="#a5bdc8" /><text x="123.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">权重4字节</text><rect x="299.40" y="388.00" width="168.00" height="288.80" rx="5" fill="#dfeaf3" stroke="#a5bdc8" /><text x="312.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">梯度4字节</text><rect x="488.40" y="388.00" width="336.00" height="288.80" rx="5" fill="#f1ddcb" stroke="#a5bdc8" /><text x="501.00" y="524.80" font-size="24" fill="#15364c" text-anchor="start">Adam状态8字节</text><text x="110.40" y="798.40" font-size="26" fill="#15364c" text-anchor="start">仅这些状态：16字节每参数</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">FP32：每参数字节</text><rect x="1066.95" y="329.00" width="74.43" height="76.00" fill="#2563eb" /><text x="1104.17" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1104.17" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">参数</text><rect x="1195.28" y="329.00" width="74.43" height="76.00" fill="#cb702a" /><text x="1232.50" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1232.50" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">梯度</text><rect x="1323.62" y="253.00" width="74.43" height="152.00" fill="#497da4" /><text x="1360.83" y="244.00" font-size="21" fill="#15364c" text-anchor="middle">8</text><text x="1360.83" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">Adam两状态</text><text x="1032" y="411" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="20" fill="#15364c">5</text><text x="1032" y="221" text-anchor="end" font-size="20" fill="#15364c">10</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><rect x="1003.00" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1014.50" y="755.10" font-size="25" fill="#15364c" text-anchor="start">1</text><text x="1007.60" y="831.00" font-size="21" fill="#15364c" text-anchor="start">保存</text><path d="M1092.70,751.80 L1108.80,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1111.10" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1122.60" y="755.10" font-size="25" fill="#15364c" text-anchor="start">2</text><text x="1115.70" y="831.00" font-size="21" fill="#15364c" text-anchor="start">重算</text><path d="M1200.80,751.80 L1216.90,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1219.20" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1230.70" y="755.10" font-size="25" fill="#15364c" text-anchor="start">3</text><text x="1223.80" y="831.00" font-size="21" fill="#15364c" text-anchor="start">重算</text><path d="M1308.90,751.80 L1325.00,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1327.30" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1338.80" y="755.10" font-size="25" fill="#15364c" text-anchor="start">4</text><text x="1331.90" y="831.00" font-size="21" fill="#15364c" text-anchor="start">保存</text><text x="1003.00" y="639.60" font-size="22" fill="#15364c" text-anchor="start">边界检查点与内部重计算</text><text x="1003.00" y="903.60" font-size="21" fill="#15364c" text-anchor="start">减少激活驻留，不消除优化器状态</text></g><line x1="40" y1="1040" x2="1460" y2="1040" stroke="#dbe4ed" stroke-width="2" /><text x="45" y="1080" font-size="26" fill="#15364c">保存激活与重算</text><g transform="translate(55,1135)"><text x="0" y="0" font-size="20" fill="#15364c">每层保存</text><rect x="30" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="37" y="92" font-size="20" fill="white">1</text><text x="22" y="145" font-size="20" fill="#2563eb">保存</text><line x1="67" y1="85" x2="130" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="120.996,89.350 130.000,85.000 120.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="130" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="137" y="92" font-size="20" fill="white">2</text><text x="122" y="145" font-size="20" fill="#2563eb">保存</text><line x1="167" y1="85" x2="230" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="220.996,89.350 230.000,85.000 220.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="230" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="237" y="92" font-size="20" fill="white">3</text><text x="222" y="145" font-size="20" fill="#2563eb">保存</text><line x1="267" y1="85" x2="330" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="320.996,89.350 330.000,85.000 320.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="330" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="337" y="92" font-size="20" fill="white">4</text><text x="322" y="145" font-size="20" fill="#2563eb">保存</text></g><g transform="translate(545,1135)"><text x="0" y="0" font-size="20" fill="#15364c">只保存第 1、4 层</text><rect x="30" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="37" y="92" font-size="20" fill="white">1</text><text x="22" y="145" font-size="20" fill="#2563eb">保存</text><line x1="67" y1="85" x2="130" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="120.996,89.350 130.000,85.000 120.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="130" y="60" width="30" height="50" fill="#df7326" rx="3" /><text x="137" y="92" font-size="20" fill="white">2</text><text x="122" y="145" font-size="20" fill="#df7326">重算</text><line x1="167" y1="85" x2="230" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="220.996,89.350 230.000,85.000 220.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="230" y="60" width="30" height="50" fill="#df7326" rx="3" /><text x="237" y="92" font-size="20" fill="white">3</text><text x="222" y="145" font-size="20" fill="#df7326">重算</text><line x1="267" y1="85" x2="330" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="320.996,89.350 330.000,85.000 320.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="330" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="337" y="92" font-size="20" fill="white">4</text><text x="322" y="145" font-size="20" fill="#2563eb">保存</text></g><g transform="translate(1035,1135)"><text x="0" y="0" font-size="20" fill="#15364c">只保存第 1 层</text><rect x="30" y="60" width="30" height="50" fill="#2563eb" rx="3" /><text x="37" y="92" font-size="20" fill="white">1</text><text x="22" y="145" font-size="20" fill="#2563eb">保存</text><line x1="67" y1="85" x2="130" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="120.996,89.350 130.000,85.000 120.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="130" y="60" width="30" height="50" fill="#df7326" rx="3" /><text x="137" y="92" font-size="20" fill="white">2</text><text x="122" y="145" font-size="20" fill="#df7326">重算</text><line x1="167" y1="85" x2="230" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="220.996,89.350 230.000,85.000 220.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="230" y="60" width="30" height="50" fill="#df7326" rx="3" /><text x="237" y="92" font-size="20" fill="white">3</text><text x="222" y="145" font-size="20" fill="#df7326">重算</text><line x1="267" y1="85" x2="330" y2="85" stroke="#dbe4ed" stroke-width="3" /><polyline points="320.996,89.350 330.000,85.000 320.996,80.650" fill="none" stroke="#dbe4ed" stroke-width="3" stroke-linejoin="round" /><rect x="330" y="60" width="30" height="50" fill="#df7326" rx="3" /><text x="337" y="92" font-size="20" fill="white">4</text><text x="322" y="145" font-size="20" fill="#df7326">重算</text></g></g></svg>

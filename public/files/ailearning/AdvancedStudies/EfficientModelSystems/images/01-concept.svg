<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>训练显存由多种状态相加</title><desc>A将同一参数的权重、梯度与两个Adam状态按所有权分开；B复算仅这几项就需16字节每参数。C再区分激活：检查点重计算减少内部激活驻留，却不直接删除参数或优化器状态。 下方用四个层位置表示一次前向链，蓝色位置保存激活，橙色位置需要从最近的检查点重新计算。三种保存策略的差别是中间状态存储与额外计算的交换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">训练显存由多种状态相加</text><g transform="translate(10,15) scale(.95)"><text x="100" y="220" font-size="30" fill="#213447">一个 FP32 参数的常见状态账本</text><rect x="100" y="360" width="39" height="110" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="143" y="360" width="39" height="110" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="186" y="360" width="39" height="110" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="229" y="360" width="39" height="110" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="272" y="360" width="39" height="110" fill="#edf0f3" stroke="#627689" stroke-width="1.5" /><rect x="315" y="360" width="39" height="110" fill="#edf0f3" stroke="#627689" stroke-width="1.5" /><rect x="358" y="360" width="39" height="110" fill="#edf0f3" stroke="#627689" stroke-width="1.5" /><rect x="401" y="360" width="39" height="110" fill="#edf0f3" stroke="#627689" stroke-width="1.5" /><rect x="444" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="487" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="530" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="573" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="616" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="659" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="702" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><rect x="745" y="360" width="39" height="110" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="100" y="525" font-size="28" fill="#2865a0">权重 4 B</text><text x="275" y="525" font-size="28" fill="#627689">梯度 4 B</text><text x="475" y="525" font-size="28" fill="#cf7432">Adam 两组状态 8 B</text><text x="100" y="640" font-size="32" fill="#213447">合计 16 B / 参数</text><text x="100" y="705" font-size="26" fill="#213447">每格 1 B；不含激活、缓存及其他实现状态</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="24" fill="#15364c" text-anchor="start">FP32：每参数字节</text><rect x="1066.95" y="329.00" width="74.43" height="76.00" fill="#2563eb" /><text x="1104.17" y="320.00" font-size="24" fill="#15364c" text-anchor="middle">4</text><text x="1104.17" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">参数</text><rect x="1195.28" y="329.00" width="74.43" height="76.00" fill="#cb702a" /><text x="1232.50" y="320.00" font-size="24" fill="#15364c" text-anchor="middle">4</text><text x="1232.50" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">梯度</text><rect x="1323.62" y="253.00" width="74.43" height="152.00" fill="#497da4" /><text x="1360.83" y="244.00" font-size="24" fill="#15364c" text-anchor="middle">8</text><text x="1360.83" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">Adam两状态</text><text x="1032" y="411" text-anchor="end" font-size="24" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="24" fill="#15364c">5</text><text x="1032" y="221" text-anchor="end" font-size="24" fill="#15364c">10</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><rect x="1003.00" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1014.50" y="755.10" font-size="25" fill="#15364c" text-anchor="start">1</text><text x="1007.60" y="831.00" font-size="24" fill="#15364c" text-anchor="start">保存</text><path d="M1092.70,751.80 L1108.80,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1111.10" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1122.60" y="755.10" font-size="25" fill="#15364c" text-anchor="start">2</text><text x="1115.70" y="831.00" font-size="24" fill="#15364c" text-anchor="start">重算</text><path d="M1200.80,751.80 L1216.90,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1219.20" y="699.00" width="87.40" height="115.50" rx="5" fill="#f7eadc" stroke="#a5bdc8" /><text x="1230.70" y="755.10" font-size="25" fill="#15364c" text-anchor="start">3</text><text x="1223.80" y="831.00" font-size="24" fill="#15364c" text-anchor="start">重算</text><path d="M1308.90,751.80 L1325.00,751.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1327.30" y="699.00" width="87.40" height="115.50" rx="5" fill="#d9eee5" stroke="#a5bdc8" /><text x="1338.80" y="755.10" font-size="25" fill="#15364c" text-anchor="start">4</text><text x="1331.90" y="831.00" font-size="24" fill="#15364c" text-anchor="start">保存</text><text x="1003.00" y="639.60" font-size="24" fill="#15364c" text-anchor="start">边界检查点与内部重计算</text><text x="1003.00" y="903.60" font-size="24" fill="#15364c" text-anchor="start">减少激活驻留，不消除优化器状态</text></g></g></svg>

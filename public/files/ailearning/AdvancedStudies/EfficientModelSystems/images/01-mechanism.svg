<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>重计算用额外计算换取更短的激活驻留</title><desc>图取四个串联计算块。普通反传保存每层所需激活；检查点方案只保留边界，在反向进入某段前重新前向计算内部激活，再释放该段。两种策略的数学目标相同，但存储存活区间与执行次数不同。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">重计算用额外计算换取更短的激活驻留</text><text x="60" y="200" font-size="24" fill="#16344c" text-anchor="start">常规：保留每个所需激活</text><rect x="90" y="240" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="105" y="277" font-size="25" fill="#16344c" text-anchor="start">计算块 1</text><text x="105" y="315" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><path d="M325,288 L350,288" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="360" y="240" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="375" y="277" font-size="25" fill="#16344c" text-anchor="start">计算块 2</text><text x="375" y="315" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><path d="M595,288 L620,288" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="630" y="240" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="645" y="277" font-size="25" fill="#16344c" text-anchor="start">计算块 3</text><text x="645" y="315" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><path d="M865,288 L890,288" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="900" y="240" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="915" y="277" font-size="25" fill="#16344c" text-anchor="start">计算块 4</text><text x="915" y="315" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><text x="60" y="430" font-size="24" fill="#16344c" text-anchor="start">分段重算：只保留边界检查点</text><rect x="90" y="470" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="105" y="507" font-size="25" fill="#16344c" text-anchor="start">计算块 1</text><text x="105" y="545" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><path d="M325,518 L350,518" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="360" y="470" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="375" y="507" font-size="25" fill="#16344c" text-anchor="start">计算块 2</text><text x="375" y="545" font-size="21" fill="#16344c" text-anchor="start">反向前重算</text><path d="M595,518 L620,518" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="630" y="470" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="645" y="507" font-size="25" fill="#16344c" text-anchor="start">计算块 3</text><text x="645" y="545" font-size="21" fill="#16344c" text-anchor="start">反向前重算</text><path d="M865,518 L890,518" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><rect x="900" y="470" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="915" y="507" font-size="25" fill="#16344c" text-anchor="start">计算块 4</text><text x="915" y="545" font-size="21" fill="#16344c" text-anchor="start">保存激活</text><text x="100" y="715" font-size="22" fill="#16344c" text-anchor="start">内存与重算次数取决于实际切分；参数和优化器状态不在此图中。</text></g></svg>

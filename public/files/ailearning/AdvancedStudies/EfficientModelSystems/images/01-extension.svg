<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>全局裁剪保留方向，逐片裁剪改变方向</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">全局裁剪保留方向，逐片裁剪改变方向</text><text x="60" y="112" font-size="27" fill="#74858a" text-anchor="start">同一全局梯度 g = (3, 4)，阈值为 1；两张图各自使用等比例坐标</text><line x1="265" y1="440" x2="575" y2="440" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><line x1="300" y1="475" x2="300" y2="165" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><circle cx="300" cy="440" r="55" fill="none" stroke="#74858a" stroke-width="3"/><line x1="300" y1="440" x2="465" y2="220" stroke="#256b82" stroke-width="4" stroke-dasharray=""/><path d="M463.141,232.866 L465.000,220.000 L453.169,225.387" fill="none" stroke="#256b82" stroke-width="3"/><text x="300" y="610" font-size="29" fill="#256b82" text-anchor="middle">原梯度：范数 5</text><text x="300" y="660" font-size="27" fill="#74858a" text-anchor="middle">每个圆的半径都表示阈值 1</text><line x1="885" y1="440" x2="1130.25" y2="440" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><line x1="920" y1="475" x2="920" y2="229.75" stroke="#19333c" stroke-width="2" stroke-dasharray=""/><circle cx="920" cy="440" r="145" fill="none" stroke="#74858a" stroke-width="3"/><line x1="920" y1="440" x2="1007.0" y2="324.0" stroke="#256b82" stroke-width="4" stroke-dasharray=""/><path d="M1005.141,336.866 L1007.000,324.000 L995.169,329.387" fill="none" stroke="#256b82" stroke-width="3"/><text x="920" y="610" font-size="29" fill="#256b82" text-anchor="middle">全局裁剪：(0.6, 0.8)</text><line x1="920" y1="440" x2="1065" y2="295" stroke="#bf653c" stroke-width="4" stroke-dasharray=""/><path d="M1061.340,307.474 L1065.000,295.000 L1052.526,298.660" fill="none" stroke="#bf653c" stroke-width="3"/><text x="1100" y="290" font-size="28" fill="#bf653c" text-anchor="start">(1, 1)</text><line x1="920" y1="295" x2="1065" y2="295" stroke="#74858a" stroke-width="2" stroke-dasharray="6 6"/><line x1="1065" y1="440" x2="1065" y2="295" stroke="#74858a" stroke-width="2" stroke-dasharray="6 6"/><text x="920" y="660" font-size="28" fill="#bf653c" text-anchor="middle">逐片裁剪：范数 √2 &gt; 1</text><line x1="60" y1="690" x2="1220" y2="690" stroke="#dce5e7" stroke-width="2" stroke-dasharray=""/><text x="60" y="735" font-size="27" fill="#19333c" text-anchor="start">先归约平方和 3² + 4² = 25，再统一乘 0.2；不能先把每个分片各裁成 1。</text></g></svg>

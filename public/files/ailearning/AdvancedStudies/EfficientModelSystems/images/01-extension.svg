<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>局部裁剪与聚合后全局裁剪不交换</title><desc>两分片梯度分别为(3,0)与(0,4)，拼接全局范数为5。按阈值1全局裁剪得到(0.6,0.8)，而每片分别裁剪会得到(1,1)，全局范数为√2。通信与归约顺序因而属于正确性的一部分。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">局部裁剪与聚合后全局裁剪不交换</text><line x1="170" y1="600" x2="1050" y2="600" stroke="#277eac" stroke-width="2.5" /><line x1="300" y1="120" x2="300" y2="690" stroke="#277eac" stroke-width="2.5" /><path d="M300,600 L660,120" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,600 L372.0,504.0" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,600 L420,480" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="690" y="140" font-size="24" fill="#193e54" text-anchor="start">原梯度(3,4)，范数5</text><text x="480" y="500" font-size="24" fill="#193e54" text-anchor="start">分片各裁剪：(1,1)</text><text x="450" y="565" font-size="24" fill="#193e54" text-anchor="start">全局裁剪：(0.6,0.8)</text><text x="100" y="730" font-size="21" fill="#193e54" text-anchor="start">横纵单位相同；阈值1限制的是全局向量范数，不是每片各自的范数。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title id="extra-title">通道幅度相差很大时，共享尺度会抹平小值</title><desc id="extra-desc">用两行分别代表两个权重输出通道，取 W=\begin{pmatrix}0.1&amp;0.2&amp;0.3\\10&amp;20&amp;30\end{pmatrix}。采用零点为零、整数范围 [-3,3] 的七级对称量化：先将 W/s 舍入并截断，再乘回尺度 s。若全矩阵共享最大绝对值尺度，s=\frac{30}{3}=10，第一行的三个数都舍入到零，第二行仍重构为 10,20,30。此时平方重构误差总和为 0.1^2+0.2^2+0.3^2=0.14。

若每个输出通道分别取尺度 s_1=0.1,s_2=10，两行整数码都为 (1,2,3)，在给定量化规则的实数语义下可以重构这六个数。这个特定例子展示共享尺度的分辨率如何被另一行占据，并不说明任意数据的逐通道误差都为零。更细尺度还需保存元数据，并与实际算子的归约轴、重定标位置相配合。</desc><rect width="1200" height="600" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">通道幅度相差很大时，共享尺度会抹平小值</text><text x="200" y="112" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">原始数值</text><text x="550" y="112" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">共享尺度 10</text><text x="900" y="112" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">逐通道尺度</text><text x="30" y="220" font-size="27" fill="#213447" text-anchor="start" font-weight="400">小幅通道</text><text x="30" y="390" font-size="27" fill="#213447" text-anchor="start" font-weight="400">大幅通道</text><rect x="200" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="237.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.1</text><rect x="280" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="317.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.2</text><rect x="360" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="397.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.3</text><rect x="200" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="237.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="280" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="317.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="360" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="397.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">30</text><rect x="550" y="175" width="74" height="70" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="587.0" y="220.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">0</text><rect x="630" y="175" width="74" height="70" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="667.0" y="220.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">0</text><rect x="710" y="175" width="74" height="70" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="747.0" y="220.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">0</text><rect x="550" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="587.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="630" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="667.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="710" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="747.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">30</text><rect x="900" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="937.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.1</text><rect x="980" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1017.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.2</text><rect x="1060" y="175" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1097.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.3</text><rect x="900" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="937.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="980" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1017.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="1060" y="345" width="74" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1097.0" y="390.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">30</text><text x="540" y="530" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">小值全部落到 0</text><text x="895" y="530" font-size="27" fill="#213447" text-anchor="start" font-weight="400">尺度 0.1 与 10</text></g></svg>

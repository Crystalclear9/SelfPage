<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 706" width="1360" height="706"><title id="plate-caption">算术强度决定带宽还是计算更可能限速</title><desc id="plate-alt">图采用一台**假想硬件**：峰值计算吞吐 P_{\max}=1000\,\mathrm{GFLOP/s}、指定存储层的带宽 B=100\,\mathrm{GB/s}，均按十进制单位。算术强度 I=\frac{F}{Q} 以 FLOP/B 计量，其中 F 是运算数，Q 是经过该存储层的实际传输字节数。Roofline 上界为 P\le\min(P_{\max},BI)，拐点 I=\frac{P_{\max}}{B}=10\,\mathrm{FLOP/B}；图中数值是教学设定，不是设备实测。 A 点执行 1 GFLOP、搬运 0.5 GB，算术强度为 2。即使计算只需 1 ms，搬运也至少需 5 ms，所以理想运行时间下界为 5 ms，对应吞吐上界 200 GFLOP/s。B 点执行 1.5 GFLOP、搬运 0.1 GB，计算与搬运下界分别为 1.5 ms 和 1 ms，屋顶对应计算上限 1000 GFLOP/s。这里采用 T\ge\max(\frac{F}{P_{\max}},\frac{Q}{B})，允许理想重叠；不能把两个下界直接相加当成普遍规律。低于屋顶的性能还可能受利用率、通信、转换或启动开销限制，量化减少 Q 也不保证执行时间按字节比缩短。 模型定义见 [Williams、Waterman 与 Patterson 的 Roofline 原始技术报告](https://www2.eecs.berkeley.edu/Pubs/TechRpts/2008/EECS-2008-134.html)。 拐点：1000 ÷ 100 = 10 FLOP/B；实际性能仍可能低于屋顶。</desc><defs><clipPath id="plate-view-0"><rect x="-18.24" y="84.012938" width="996.48" height="421.21128"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="438.995147"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="525.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="489" viewBox="0 47 960 489" overflow="hidden"><rect width="960" height="536" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 29.789972) scale(0.758333)"><g><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf1ec"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect id="offline-white-background" x="0" y="60.936281" width="1200" height="578.894668" fill="#ffffff"/><title id="extra-title">算术强度决定带宽还是计算更可能限速</title><desc id="extra-desc">图采用一台**假想硬件**：峰值计算吞吐 P_{\max}=1000\,\mathrm{GFLOP/s}、指定存储层的带宽 B=100\,\mathrm{GB/s}，均按十进制单位。算术强度 I=\frac{F}{Q} 以 FLOP/B 计量，其中 F 是运算数，Q 是经过该存储层的实际传输字节数。Roofline 上界为 P\le\min(P_{\max},BI)，拐点 I=\frac{P_{\max}}{B}=10\,\mathrm{FLOP/B}；图中数值是教学设定，不是设备实测。

A 点执行 1 GFLOP、搬运 0.5 GB，算术强度为 2。即使计算只需 1 ms，搬运也至少需 5 ms，所以理想运行时间下界为 5 ms，对应吞吐上界 200 GFLOP/s。B 点执行 1.5 GFLOP、搬运 0.1 GB，计算与搬运下界分别为 1.5 ms 和 1 ms，屋顶对应计算上限 1000 GFLOP/s。这里采用 T\ge\max(\frac{F}{P_{\max}},\frac{Q}{B})，允许理想重叠；不能把两个下界直接相加当成普遍规律。低于屋顶的性能还可能受利用率、通信、转换或启动开销限制，量化减少 Q 也不保证执行时间按字节比缩短。

模型定义见 [Williams、Waterman 与 Patterson 的 Roofline 原始技术报告](https://www2.eecs.berkeley.edu/Pubs/TechRpts/2008/EECS-2008-134.html)。 拐点：1000 ÷ 100 = 10 FLOP/B；实际性能仍可能低于屋顶。</desc><rect width="1200" height="710" fill="#ffffff"/><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e77a6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#be6f3e"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="85" y="105" font-size="34.945055px" fill="#233a4b" text-anchor="start" font-weight="400">示意硬件：100 GB/s，1000 GFLOP/s</text><line x1="100" y1="555" x2="100" y2="218.63636" stroke="#657682" stroke-width="1.55" stroke-linecap="round"/><line x1="95" y1="555" x2="100" y2="555" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="95" y1="386.81818" x2="100" y2="386.81818" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="95" y1="218.63636" x2="100" y2="218.63636" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="100" y1="555.0" x2="720" y2="555.0" stroke="#d6e2e6" stroke-width="1.3"/><text x="88" y="563.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">0</text><line x1="100" y1="386.8181818181818" x2="720" y2="386.8181818181818" stroke="#d6e2e6" stroke-width="1.3"/><text x="88" y="394.8181818181818" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">500</text><line x1="100" y1="218.63636363636363" x2="720" y2="218.63636363636363" stroke="#d6e2e6" stroke-width="1.3"/><text x="88" y="226.63636363636363" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">1000</text><line x1="100" y1="185" x2="100" y2="555" stroke="#608094" stroke-width="2"/><line x1="100" y1="555" x2="720" y2="555" stroke="#608094" stroke-width="2"/><line x1="100.0" y1="555.0" x2="100.0" y2="561.0" stroke="#6080
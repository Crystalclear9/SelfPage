<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="extra-title">算术强度决定带宽还是计算更可能限速</title><desc id="extra-desc">图采用一台**假想硬件**：峰值计算吞吐 P_{\max}=1000\,\mathrm{GFLOP/s}、指定存储层的带宽 B=100\,\mathrm{GB/s}，均按十进制单位。算术强度 I=\frac{F}{Q} 以 FLOP/B 计量，其中 F 是运算数，Q 是经过该存储层的实际传输字节数。Roofline 上界为 P\le\min(P_{\max},BI)，拐点 I=\frac{P_{\max}}{B}=10\,\mathrm{FLOP/B}；图中数值是教学设定，不是设备实测。

A 点执行 1 GFLOP、搬运 0.5 GB，算术强度为 2。即使计算只需 1 ms，搬运也至少需 5 ms，所以理想运行时间下界为 5 ms，对应吞吐上界 200 GFLOP/s。B 点执行 1.5 GFLOP、搬运 0.1 GB，计算与搬运下界分别为 1.5 ms 和 1 ms，屋顶对应计算上限 1000 GFLOP/s。这里采用 T\ge\max(\frac{F}{P_{\max}},\frac{Q}{B})，允许理想重叠；不能把两个下界直接相加当成普遍规律。低于屋顶的性能还可能受利用率、通信、转换或启动开销限制，量化减少 Q 也不保证执行时间按字节比缩短。

模型定义见 [Williams、Waterman 与 Patterson 的 Roofline 原始技术报告](https://www2.eecs.berkeley.edu/Pubs/TechRpts/2008/EECS-2008-134.html)。</desc><rect width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">算术强度决定带宽还是计算更可能限速</text><text x="85" y="105" font-size="28" fill="#213447" text-anchor="start" font-weight="400">示意硬件：100 GB/s，1000 GFLOP/s</text><line x1="100" y1="555.0" x2="720" y2="555.0" stroke="#dce5ed" stroke-width="2" /><text x="88" y="563.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="100" y1="386.8181818181818" x2="720" y2="386.8181818181818" stroke="#dce5ed" stroke-width="2" /><text x="88" y="394.8181818181818" font-size="24" fill="#627689" text-anchor="end" font-weight="400">500</text><line x1="100" y1="218.63636363636363" x2="720" y2="218.63636363636363" stroke="#dce5ed" stroke-width="2" /><text x="88" y="226.63636363636363" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1000</text><line x1="100" y1="185" x2="100" y2="555" stroke="#627689" stroke-width="2" /><line x1="100" y1="555" x2="720" y2="555" stroke="#627689" stroke-width="2" /><line x1="100.0" y1="555.0" x2="100.0" y2="561.0" stroke="#627689" stroke-width="2" /><text x="100.0" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="255.0" y1="555.0" x2="255.0" y2="561.0" stroke="#627689" stroke-width="2" /><text x="255.0" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">5</text><line x1="410.0" y1="555.0" x2="410.0" y2="561.0" stroke="#627689" stroke-width="2" /><text x="410.0" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">10</text><line x1="565.0" y1="555.0" x2="565.0" y2="561.0" stroke="#627689" stroke-width="2" /><text x="565.0" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">15</text><line x1="720.0" y1="555.0" x2="720.0" y2="561.0" stroke="#627689" stroke-width="2" /><text x="720.0" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">20</text><polygon points="100.000,555.000 100.000,185.000 410.000,185.000 410.000,555.000" fill="#eaf2fa" stroke="none" /><polygon points="410.000,555.000 410.000,185.000 720.000,185.000 720.000,555.000" fill="#fff0e3" stroke="none" /><line x1="100.0" y1="555.0" x2="720.0" y2="555.0" stroke="#dce5ed" stroke-width="2" /><line x1="100.0" y1="386.8181818181818" x2="720.0" y2="386.8181818181818" stroke="#dce5ed" stroke-width="2" /><line x1="100.0" y1="218.63636363636363" x2="720.0" y2="218.63636363636363" stroke="#dce5ed" stroke-width="2" /><polyline points="100.000,555.000 410.000,218.636 720.000,218.636" fill="none" stroke="#2865a0" stroke-width="5" stroke-linejoin="round" /><line x1="410.0" y1="555.0" x2="410.0" y2="185.0" stroke="#627689" stroke-width="2" stroke-dasharray="7 6" /><text x="170" y="260" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">带宽约束</text><text x="495" y="350" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">计算峰值约束</text><circle cx="162.0" cy="487.72727272727275" r="7" fill="#cf7432" /><circle cx="565.0" cy="218.63636363636363" r="7" fill="#cf7432" /><text x="180.60000000000002" y="470.9090909090909" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">A</text><text x="580.5" y="255.63636363636363" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">B</text><text x="100" y="145" font-size="25" fill="#627689" text-anchor="start" font-weight="400">吞吐上界（GFLOP/s）</text><text x="215" y="615" font-size="25" fill="#627689" text-anchor="start" font-weight="400">算术强度 I（FLOP/B）</text><text x="810" y="175" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">A：I = 2 FLOP/B</text><text x="810" y="230" font-size="26" fill="#213447" text-anchor="start" font-weight="400">算 1 GFLOP：1 ms</text><text x="810" y="275" font-size="26" fill="#213447" text-anchor="start" font-weight="400">搬 0.5 GB：5 ms</text><text x="810" y="325" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">理想下界 ≥ 5 ms</text><text x="810" y="405" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">B：I = 15 FLOP/B</text><text x="810" y="460" font-size="25" fill="#213447" text-anchor="start" font-weight="400">算 1.5 GFLOP：1.5 ms</text><text x="810" y="505" font-size="26" fill="#213447" text-anchor="start" font-weight="400">搬 0.1 GB：1 ms</text><text x="810" y="555" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">理想下界 ≥ 1.5 ms</text><text x="100" y="675" font-size="27" fill="#213447" text-anchor="start" font-weight="400">拐点：1000 ÷ 100 = 10 FLOP/B；实际性能仍可能低于屋顶。</text></g></svg>

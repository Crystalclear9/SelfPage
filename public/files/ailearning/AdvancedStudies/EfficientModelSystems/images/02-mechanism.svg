ily="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">计算峰值约束</text><circle cx="162.0" cy="487.72727272727275" r="7" fill="#b36131"/><circle cx="565.0" cy="218.63636363636363" r="7" fill="#b36131"/><text x="180.60000000000002" y="470.9090909090909" font-size="34.83px" fill="#a25e34" text-anchor="start" font-weight="400">A</text><text x="580.5" y="255.63636363636363" font-size="34.83px" fill="#a25e34" text-anchor="start" font-weight="400">B</text><text x="100" y="145" font-size="32.25px" fill="#4f7791" text-anchor="start" font-weight="400">吞吐上界（GFLOP/s）</text><text x="215" y="615" font-size="32.25px" fill="#4f7791" text-anchor="start" font-weight="400">算术强度 I（FLOP/B）</text><text x="810" y="175" font-size="34.83px" fill="#2e77a6" text-anchor="start" font-weight="400">A：I = 2 FLOP/B</text><text x="810" y="230" font-size="33.54px" fill="#233a4b" text-anchor="start" font-weight="400">算 1 GFLOP：1 ms</text><text x="810" y="275" font-size="33.54px" fill="#233a4b" text-anchor="start" font-weight="400">搬 0.5 GB：5 ms</text><text x="810" y="325" font-size="34.945055px" fill="#2e77a6" text-anchor="start" font-weight="400">理想下界 ≥ 5 ms</text><text x="810" y="405" font-size="34.83px" fill="#a25e34" text-anchor="start" font-weight="400">B：I = 15 FLOP/B</text><text x="810" y="460" font-size="32.25px" fill="#233a4b" text-anchor="start" font-weight="400">算 1.5 GFLOP：1.5 ms</text><text x="810" y="505" font-size="33.54px" fill="#233a4b" text-anchor="start" font-weight="400">搬 0.1 GB：1 ms</text><text x="810" y="555" font-size="34.945055px" fill="#a25e34" text-anchor="start" font-weight="400">理想下界 ≥ 1.5 ms</text></g></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="706" fill="white"/><g transform="translate(9.1827414 -70.488778) scale(1.4371612)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g></g></svg>

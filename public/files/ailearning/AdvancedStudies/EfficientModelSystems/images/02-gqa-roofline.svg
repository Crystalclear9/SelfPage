<text x="75" y="610" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">假定 1 TB/s、100 TFLOP/s，且同组查询头理想复用 K、V。</text>
<text x="75" y="663" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">三者共用的计算下界约 0.001342 ms。当前三个理想下界都由读取决定。</text>
<text x="75" y="713" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实际延迟还取决于内核、访存和调度；这里显示的是模型下界。</text>

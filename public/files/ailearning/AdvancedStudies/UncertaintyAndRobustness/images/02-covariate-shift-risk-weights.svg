<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="602" viewBox="0 0 1350 602" role="img" aria-labelledby="title desc"><title id="title">密度比重加权改变目标关注区域</title><desc id="desc">源域与目标域支撑相同，但区域质量不同。密度比改变来源观察的风险权重。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="602" fill="white" stroke="none" stroke-width="1.55"/><text x="157" y="181" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">源域质量</text><rect x="450" y="141" width="170.8" height="63" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="705" y="182" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.7</text><rect x="853" y="141" width="73.2" height="63" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="1108" y="182" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.3</text><text x="584" y="112" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">区域 A</text><text x="982" y="112" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">区域 B</text><text x="157" y="370" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">目标域质量</text><rect x="450" y="330" width="73.2" height="63" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="705" y="371" fill="#655184" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.3</text><rect x="853" y="330" width="170.8" height="63" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="1108" y="371" fill="#655184" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.7</text><text x="584" y="301" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">区域 A</text><text x="982" y="301" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">区域 B</text><text x="665" y="547" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">同一条件机制下，风险的区域权重发生改变</text></svg>
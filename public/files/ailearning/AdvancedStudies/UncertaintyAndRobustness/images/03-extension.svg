<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>搜索多个工作点需要同时有效的证据</title><desc>设20个预先固定规则分别用同一认证集评价，希望整体错误概率不超过0.05。简单并合控制可将每个规则的失败预算设为0.0025；规则选出后仍由这组同时界保护，而不能对20次搜索都无条件重复使用单个0.05。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">搜索多个工作点需要同时有效的证据</text><text x="85" y="190" font-size="24" fill="#193e54" text-anchor="start">失败概率预算</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="318.3" width="145.0" height="291.7" fill="#1977b4" /><text x="207.5" y="302.3333333333333" font-size="24" fill="#193e54" text-anchor="middle">0.05</text><text x="207.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">单规则预算</text><rect x="605.0" y="595.4" width="145.0" height="14.6" fill="#cf7432" /><text x="677.5" y="579.4166666666666" font-size="24" fill="#193e54" text-anchor="middle">0.0025</text><text x="677.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">20规则各自预算</text><text x="95" y="145" font-size="25" fill="#193e54" text-anchor="start">并合界：20×0.0025=0.05，不要求规则独立。</text></g></svg>

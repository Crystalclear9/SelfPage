<text x="654" y="543" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">真实正类比例 π</text>
<text x="128" y="162" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">预测正类比例 q</text>
<path d="M128 466.4 L635 254.6" fill="none" stroke="#166d75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M128 364.03 L635 356.97" fill="none" stroke="#6e618e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M128 360.5 L635 360.5" fill="none" stroke="#a74d3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<circle cx="482.9" cy="318.14" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="790" y="199" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="start" font-weight="400">q = 0.2 + 0.6π</text>
<text x="790" y="289" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="start" font-weight="400">q = 0.49 + 0.02π</text>
<text x="790" y="379" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="start" font-weight="400">q = 0.5</text>
<text x="790" y="244" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">q 偏差 0.03 → π 偏差 0.05</text>
<text x="790" y="334" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">q 偏差 0.01 → π 偏差 0.5</text>
<text x="790" y="424" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">任意 π 都得到同一个 q</text>
<path d="M75 611 L1125 611" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="666" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实线算例：π = 0.7 时，两个真实类分别贡献 0.3 × 0.2 和 0.7 × 0.8。</text>
<text x="75" y="723" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">两项相加得到 q = 0.62。斜率为零时，无标签样本再多也不能反推出 π。</text>
</svg>

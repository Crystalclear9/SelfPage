<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>标签变化需要可识别的混淆结构</title><desc>二分类来源判别器的混淆矩阵若为[[0.8,0.2],[0.2,0.8]]，两列不同，可从预测标签边缘识别目标标签比例；若两列都变为(0.5,0.5)，任何标签比例都产生相同预测边缘，问题不再可识别。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">标签变化需要可识别的混淆结构</text><text x="65" y="160" font-size="24" fill="#193e54" text-anchor="start">可区分标签的列</text><text x="670" y="160" font-size="24" fill="#193e54" text-anchor="start">不可区分标签的列</text><rect x="85" y="240" width="180" height="140" rx="8" fill="#d6ecdf" stroke="#9cb8c8" /><text x="175" y="325" font-size="38" fill="#193e54" text-anchor="middle">0.8</text><rect x="285" y="240" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="375" y="325" font-size="38" fill="#193e54" text-anchor="middle">0.2</text><rect x="85" y="400" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="175" y="485" font-size="38" fill="#193e54" text-anchor="middle">0.2</text><rect x="285" y="400" width="180" height="140" rx="8" fill="#d6ecdf" stroke="#9cb8c8" /><text x="375" y="485" font-size="38" fill="#193e54" text-anchor="middle">0.8</text><rect x="655" y="240" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="745" y="325" font-size="38" fill="#193e54" text-anchor="middle">0.5</text><rect x="855" y="240" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="945" y="325" font-size="38" fill="#193e54" text-anchor="middle">0.5</text><rect x="655" y="400" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="745" y="485" font-size="38" fill="#193e54" text-anchor="middle">0.5</text><rect x="855" y="400" width="180" height="140" rx="8" fill="#e9f1f8" stroke="#9cb8c8" /><text x="945" y="485" font-size="38" fill="#193e54" text-anchor="middle">0.5</text><text x="100" y="680" font-size="24" fill="#193e54" text-anchor="start">行：预测标签；列：真实标签。右图两列相同，目标混合权重不可识别。</text></g></svg>

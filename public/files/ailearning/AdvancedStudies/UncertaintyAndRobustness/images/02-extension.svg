<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img"><title>条件混淆矩阵的列区分能力决定标签先验是否可识别</title><rect width="1360" height="1060" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">条件行为固定：真实 0 中 20% 预测为 1；真实 1 中 80% 预测为 1</text><rect x="60" y="150" width="290" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="205" y="205" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">真实 0：质量 0.3</text><line x1="365" y1="193" x2="495" y2="193" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="430" y="245" font-size="29" fill="#176b91" text-anchor="middle" font-weight="400">× 0.2</text><rect x="515" y="150" width="320" height="85" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="675" y="205" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">预测 1：质量 0.06</text><rect x="60" y="310" width="290" height="85" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="205" y="365" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">真实 1：质量 0.7</text><line x1="365" y1="353" x2="495" y2="353" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="430" y="405" font-size="29" fill="#d87332" text-anchor="middle" font-weight="400">× 0.8</text><rect x="515" y="310" width="320" height="85" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="675" y="365" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">预测 1：质量 0.56</text><text x="950" y="165" font-size="32" fill="#d87332" text-anchor="start" font-weight="400">π = 0.7</text><rect x="950" y="230" width="21.0" height="80" rx="4" fill="#176b91" stroke="#176b91" stroke-width="2"/><rect x="971.0" y="230" width="196.00000000000003" height="80" rx="4" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="950" y="365" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">q = 0.06 + 0.56 = 0.62</text><text x="60" y="500" font-size="31" fill="#176b91" text-anchor="start" font-weight="400">两类条件行为不同：q = 0.2 + 0.6π，可以反解 π。</text><line x1="60" y1="550" x2="1300" y2="550" stroke="#d9e4ea" stroke-width="2"/><text x="60" y="625" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">退化分类器：两类中都恰有一半预测为 1</text><text x="60" y="765" font-size="32" fill="#d87332" text-anchor="start" font-weight="400">π = 0.1</text><text x="295" y="765" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">0.45 + 0.05</text><rect x="610" y="720" width="315.0" height="70" rx="4" fill="#176b91" stroke="#176b91" stroke-width="2"/><rect x="925.0" y="720" width="35.0" height="70" rx="4" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="1040" y="765" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">q = 0.5</text><text x="60" y="925" font-size="32" fill="#d87332" text-anchor="start" font-weight="400">π = 0.9</text><text x="295" y="925" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">0.05 + 0.45</text><rect x="610" y="880" width="34.99999999999999" height="70" rx="4" fill="#176b91" stroke="#176b91" stroke-width="2"/><rect x="645.0" y="880" width="315.0" height="70" rx="4" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="1040" y="925" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">q = 0.5</text><text x="60" y="1020" font-size="28" fill="#80929d" text-anchor="start" font-weight="400">相同预测边缘可以来自完全不同的真实比例；增加无标签样本不能补回识别信息。</text></g></svg>
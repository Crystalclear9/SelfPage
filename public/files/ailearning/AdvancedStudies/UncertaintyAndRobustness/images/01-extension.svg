<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>总体覆盖可以掩盖预先指定群体的不足</title><desc>群体A占90%、覆盖率95%，群体B占10%、覆盖率45%，总体覆盖恰好90%。单看总体数字完全达标，却遗漏了小群体明显不足；图把各组条件覆盖与总体混合分开。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">总体覆盖可以掩盖预先指定群体的不足</text><text x="85" y="190" font-size="22" fill="#193e54" text-anchor="start">覆盖率</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="293.3" width="145.0" height="316.7" fill="#1977b4" /><text x="207.5" y="277.33333333333337" font-size="24" fill="#193e54" text-anchor="middle">0.95</text><text x="207.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">A：权重90%</text><rect x="448.3" y="460.0" width="145.0" height="150.0" fill="#d26724" /><text x="520.8333333333333" y="444.0" font-size="24" fill="#193e54" text-anchor="middle">0.45</text><text x="520.8333333333333" y="680" font-size="19" fill="#193e54" text-anchor="middle">B：权重10%</text><rect x="761.7" y="310.0" width="145.0" height="300.0" fill="#148671" /><text x="834.1666666666666" y="294.0" font-size="24" fill="#193e54" text-anchor="middle">0.9</text><text x="834.1666666666666" y="680" font-size="19" fill="#193e54" text-anchor="middle">总体混合</text><text x="100" y="145" font-size="25" fill="#193e54" text-anchor="start">总体0.9 = 0.9×0.95 + 0.1×0.45</text></g></svg>

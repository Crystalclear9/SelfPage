<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title id="extra-title">校准概率与保形集合的不同保证</title><desc id="extra-desc">左图用 50 条分类预测构造一个可复算的可靠性图：五个置信度组各含 10 条，组内平均置信度依次为 0.55、0.65、0.75、0.85、0.95，正确数依次为 5、5、6、7、8。蓝点的横坐标是组内平均置信度，纵坐标是组内正确率；空心点位于理想对角线上，橙色竖线表示两者差距。本例分箱 ECE 为 \frac{0.05+0.15+0.15+0.15+0.15}{5}=0.13。每组只有十条，经验正确率仍有明显抽样波动，不能据此宣称得到总体校准定理；分箱方式和样本数也会影响 ECE。

右上图使用另一组**预测集合覆盖**的构造：群体 A 占 90%、覆盖率 95%，群体 B 占 10%、覆盖率 45%，总体覆盖仍为 0.9\times0.95+0.1\times0.45=0.9。这些覆盖率不是左图的分类正确率。右下图则是九个已排序的校准分数；在错误率 \alpha=0.2 时选择第 \lceil(9+1)(1-0.2)\rceil=8 项，阈值为 0.8。分数阈值 0.8 本身也不是覆盖率或正确率；覆盖结论依赖交换性、合法切分和相应集合构造。

可靠性图与分箱校准误差见 [Guo 等《On Calibration of Modern Neural Networks》](https://arxiv.org/abs/1706.04599)。</desc><rect width="1200" height="740" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">校准概率与保形集合的不同保证</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">概率校准：按置信度分组检验</text><line x1="85" y1="590.0" x2="595" y2="590.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="598.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.4</text><line x1="85" y1="453.33333333333337" x2="595" y2="453.33333333333337" stroke="#dce5ed" stroke-width="2" /><text x="73" y="461.33333333333337" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.6</text><line x1="85" y1="316.66666666666663" x2="595" y2="316.66666666666663" stroke="#dce5ed" stroke-width="2" /><text x="73" y="324.66666666666663" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.8</text><line x1="85" y1="180.0" x2="595" y2="180.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="188.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="85" y1="180" x2="85" y2="590" stroke="#627689" stroke-width="2" /><line x1="85" y1="590" x2="595" y2="590" stroke="#627689" stroke-width="2" /><line x1="131.36363636363635" y1="590.0" x2="131.36363636363635" y2="596.0" stroke="#627689" stroke-width="2" /><text x="131.36363636363635" y="622.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.5</text><line x1="363.1818181818182" y1="590.0" x2="363.1818181818182" y2="596.0" stroke="#627689" s
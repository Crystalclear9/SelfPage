<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img"><title>完全校准不等于能够区分高低风险个体</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">完全校准不等于能够区分高低风险个体</text><text x="60" y="112" font-size="26" fill="#71858b" text-anchor="start">总体由两个等大群体组成：真实正类概率分别为 0.1 与 0.9</text><text x="120" y="190" font-size="27" fill="#246b82" text-anchor="start">常数预测：所有人 p = 0.5</text><line x1="120" y1="660" x2="120" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="660" x2="520" y2="660" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="120" y="700" font-size="25" fill="#183944" text-anchor="middle">0</text><text x="100" y="668" font-size="25" fill="#183944" text-anchor="end">0</text><line x1="320.0" y1="660" x2="320.0" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="460.0" x2="520" y2="460.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="320.0" y="700" font-size="25" fill="#183944" text-anchor="middle">0.5</text><text x="100" y="468.0" font-size="25" fill="#183944" text-anchor="end">0.5</text><line x1="520" y1="660" x2="520" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="260" x2="520" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="520" y="700" font-size="25" fill="#183944" text-anchor="middle">1</text><text x="100" y="268" font-size="25" fill="#183944" text-anchor="end">1</text><line x1="120" y1="660" x2="520" y2="260" stroke="#71858b" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="460.0" r="18.0" fill="#246b82"/><text x="320.0" y="430.0" font-size="24" fill="#246b82" text-anchor="middle">总体质量 1</text><text x="120" y="237" font-size="24" fill="#71858b" text-anchor="start">纵轴：给定报告概率后的真实正类频率</text><text x="520" y="746" font-size="25" fill="#183944" text-anchor="end">报告概率 p</text><text x="120" y="802" font-size="29" fill="#246b82" text-anchor="start">Brier = 0.25</text><text x="735" y="190" font-size="27" fill="#c0673e" text-anchor="start">信息预测：p 等于群体真实概率</text><line x1="735" y1="660" x2="735" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="735" y1="660" x2="1135" y2="660" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="735" y="700" font-size="25" fill="#183944" text-anchor="middle">0</text><text x="715" y="668" font-size="25" fill="#183944" text-anchor="end">0</text><line x1="935.0" y1="660" x2="935.0" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="735" y1="460.0" x2="1135" y2="460.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="935.0" y="700" font-size="25" fill="#183944" text-anchor="middle">0.5</text><text x="715" y="468.0" font-size="25" fill="#183944" text-anchor="end">0.5</text><line x1="1135" y1="660" x2="1135" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><line x1="735" y1="260" x2="1135" y2="260" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="1135" y="700" font-size="25" fill="#183944" text-anchor="middle">1</text><text x="715" y="268" font-size="25" fill="#183944" text-anchor="end">1</text><line x1="735" y1="660" x2="1135" y2="260" stroke="#71858b" stroke-width="2" stroke-dasharray="6 6"/><circle cx="775.0" cy="620.0" r="12.727922061357857" fill="#c0673e"/><text x="775.0" y="590.0" font-size="24" fill="#c0673e" text-anchor="middle">总体质量 0.5</text><circle cx="1095.0" cy="300.0" r="12.727922061357857" fill="#c0673e"/><text x="1095.0" y="270.0" font-size="24" fill="#c0673e" text-anchor="middle">总体质量 0.5</text><text x="735" y="237" font-size="24" fill="#71858b" text-anchor="start">纵轴：给定报告概率后的真实正类频率</text><text x="1135" y="746" font-size="25" fill="#183944" text-anchor="end">报告概率 p</text><text x="735" y="802" font-size="29" fill="#c0673e" text-anchor="start">Brier = 0.09</text><text x="60" y="855" font-size="27" fill="#183944" text-anchor="start">两者总体校准误差都为零；更好的分辨力使 Brier 减少 0.16。</text></g></svg>

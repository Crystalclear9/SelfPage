<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="689.119" viewBox="0 70.880829 1280 689.119171" role="img"><rect id="offline-white-background" x="0" y="70.880829" width="1280" height="689.119171" fill="#ffffff"/><title>分数更高，不保证接受后的错误率更低</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="27" fill="#71858b" text-anchor="start">10 份等质量对象：2 份高分中有 1 份错误，8 份低分全部正确</text><rect x="85" y="240" width="84" height="120" fill="#c0643c"/><text x="127" y="310" font-size="29" fill="white" text-anchor="middle">错</text><rect x="193" y="240" width="84" height="120" fill="#256b82"/><text x="235" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="301" y="240" width="84" height="120" fill="#256b82"/><text x="343" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="409" y="240" width="84" height="120" fill="#256b82"/><text x="451" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="517" y="240" width="84" height="120" fill="#256b82"/><text x="559" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="625" y="240" width="84" height="120" fill="#256b82"/><text x="667" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="733" y="240" width="84" height="120" fill="#256b82"/><text x="775" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="841" y="240" width="84" height="120" fill="#256b82"/><text x="883" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="949" y="240" width="84" height="120" fill="#256b82"/><text x="991" y="310" font-size="29" fill="white" text-anchor="middle">对</text><rect x="1057" y="240" width="84" height="120" fill="#256b82"/><text x="1099" y="310" font-size="29" fill="white" text-anchor="middle">对</text><line x1="85" y1="205" x2="277" y2="205" stroke="#c0643c" stroke-width="4"/><text x="180" y="180" font-size="28" fill="#c0643c" text-anchor="middle">分数 0.99</text><line x1="301" y1="205" x2="1141" y2="205" stroke="#256b82" stroke-width="4"/><text x="720" y="180" font-size="28" fill="#256b82" text-anchor="middle">分数 0.70</text><text x="85" y="440" font-size="30" fill="#256b82" text-anchor="start">接受全部</text><text x="85" y="492" font-size="29" fill="#19333c" text-anchor="start">覆盖 100%，错误率 10%</text><text x="720" y="440" font-size="30" fill="#c0643c" text-anchor="start">只接受分数 ≥ 0.9</text><text x="720" y="492" font-size="29" fill="#c0643c" text-anchor="start">覆盖 20%，错误率 50%</text><line x1="60" y1="560" x2="1220" y2="560" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="625" font-size="28" fill="#19333c" text-anchor="start">阈值提高后，正确对象被大量拒绝，错误却集中在剩下的高分组。</text><text x="60" y="685" font-size="27" fill="#71858b" text-anchor="start">阈值选择需要独立认证；只有“自信”这个数值，不能推出低风险。</text><text x="60" y="737" font-size="26" fill="#71858b" text-anchor="start">同分对象一起纳入或排除；不能在看见标签后拆开同一分数组。</text></g></svg>

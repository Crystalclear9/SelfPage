"27" fill="#203742" text-anchor="middle">(0.2×0.01 + 0.20x)</text><line x1="69.000" x2="310.875" y1="286" y2="286" stroke="#203742" stroke-width="1.5"/><text x="189.938" y="314" font-size="27" fill="#203742" text-anchor="middle">(0.2+x)</text><text x="314.875" y="295" font-size="29" fill="#203742"> ≤ 0.05 → x ≤ 0.053333</text></g><text x="65" y="370" font-size="28" fill="#c96937" text-anchor="start">可达覆盖0.253333；只接受逐点风险≤0.05的对象，覆盖只有0.2。</text><text x="65" y="425" font-size="26" fill="#203742" text-anchor="start">部分同风险组可事先随机接受；这里风险已知，只演示目标差异，不提供经验认证。</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>平均风险改善可以掩盖最坏群体变差</title><desc>设群体A占90%、B占10%。模型1的群体风险为0.1与0.5，平均0.14；模型2为0.05与0.6，平均降到0.105，但最坏群体风险由0.5升至0.6。不同目标可能给出不同模型排序。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">平均风险改善可以掩盖最坏群体变差</text><text x="85" y="190" font-size="22" fill="#16344c" text-anchor="start">风险：A占90%，B占10%</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="560.0" width="108.3" height="50.0" fill="#118779" /><text x="189.16666666666666" y="544.0" font-size="24" fill="#16344c" text-anchor="middle">0.1</text><text x="189.16666666666666" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型1：A</text><rect x="291.7" y="360.0" width="108.3" height="250.0" fill="#d26724" /><text x="345.8333333333333" y="344.0" font-size="24" fill="#16344c" text-anchor="middle">0.5</text><text x="345.8333333333333" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型1：B</text><rect x="448.3" y="540.0" width="108.3" height="70.0" fill="#148671" /><text x="502.5" y="524.0" font-size="24" fill="#16344c" text-anchor="middle">0.14</text><text x="502.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型1均值</text><rect x="605.0" y="585.0" width="108.3" height="25.0" fill="#118779" /><text x="659.1666666666666" y="569.0" font-size="24" fill="#16344c" text-anchor="middle">0.05</text><text x="659.1666666666666" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型2：A</text><rect x="761.7" y="310.0" width="108.3" height="300.0" fill="#d26724" /><text x="815.8333333333333" y="294.0" font-size="24" fill="#16344c" text-anchor="middle">0.6</text><text x="815.8333333333333" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型2：B</text><rect x="918.3" y="557.5" width="108.3" height="52.5" fill="#148671" /><text x="972.5" y="541.5" font-size="24" fill="#16344c" text-anchor="middle">0.105</text><text x="972.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">模型2均值</text><text x="90" y="135" font-size="24" fill="#16344c" text-anchor="start">平均风险下降，最坏群体风险却上升。</text><text x="90" y="740" font-size="21" fill="#416478">群体权重90%与10%；平均与最坏风险分开</text></g></svg>

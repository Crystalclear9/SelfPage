<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title id="extra-title">保形阈值来自校准分数的有限样本秩</title><desc id="extra-desc">上排是一次已经得到的九个校准分数。错误率 \alpha=0.2 给出 k=\lceil(9+1)(1-0.2)\rceil=8，故阈值为第八项 0.8；若使用绝对残差分数，预测区间就是预测中心两侧各扩 0.8。排序必须按第 k 小值取值，不能随意用默认插值的普通经验百分位替代。

中排解释 n+1 来自哪里：将未来真实标签的分数与九个校准分数一起考虑，在交换性且几乎必然无并列的条件下，未来分数的十个名次具有相同的**无条件**概率。接受名次一至八，联合平均覆盖为 \frac{8}{10}=0.8。这并不是说“固定上排这九个数以后，未来分数落进十个间隙的条件概率仍各为十分之一”；给定具体校准集后的覆盖可以波动。存在并列时，用小于等于阈值的规则一般会得到保守覆盖。

下排补足小样本边界：若仍只有九个校准分数，却要求 \alpha=0.05，则 k=\lceil10\times0.95\rceil=10&gt;9，该规则应取 q=+\infty。绝对残差型预测集合因此覆盖整个实轴；这是有形式保证但没有区分能力的结果。把 k 强行截成九、取最大分数 0.9，会只保留 \frac{9}{10}=0.9 的无并列名次覆盖，达不到 95%。有限样本秩证明与无穷阈值约定见 [Angelopoulos 与 Bates 教程附录 D](https://arxiv.org/html/2107.07511v6#A4)。</desc><rect width="1200" height="720" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">保形阈值来自校准分数的有限样本秩</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">已观察到的校准分数：n=9，α=0.2</text><rect x="120" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="163.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.1</text><rect x="225" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="268.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.2</text><rect x="330" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="373.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.3</text><rect x="435" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="478.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.4</text><rect x="540" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="583.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.5</text><rect x="645" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="688.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.6</text><rect x="750" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="793.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.7</text><rect x="855" y="145" width="86" height="64" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="898.0" y="187.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">0.8</text><rect x="960" y="145" width="86" height="64" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1003.0" y="187.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.9</text><text x="900" y="255" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">第 8 项：q=0.8</text><path d="M900,230 L900,213" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><text x="85" y="330" font-size="27" fill="#213447" text-anchor="start" font-weight="400">交换性且无并列：未来分数在全部 10 个分数中的名次</text><rect x="85" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="127.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="190" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="232.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="295" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="337.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><rect x="400" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="442.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">4</text><rect x="505" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="547.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">5</text><rect x="610" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="652.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">6</text><rect x="715" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="757.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">7</text><rect x="820" y="375" width="85" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="862.5" y="417.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">8</text><rect x="925" y="375" width="85" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="967.5" y="417.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">9</text><rect x="1030" y="375" width="85" height="65" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="1072.5" y="417.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">10</text><text x="85" y="490" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">蓝色名次可接受，橙色名次被排除</text><text x="85" y="545" font-size="27" fill="#213447" text-anchor="start" font-weight="400">对校准集和未来点联合平均：覆盖概率</text><text x="710.0" y="518" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">8</text><line x1="665" y1="530" x2="755" y2="530" stroke="#2865a0" stroke-width="1.7" /><text x="710.0" y="564" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><text x="785" y="545" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">= 0.8</text><text x="85" y="625" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">若要求 α=0.05：k=10 &gt; n，阈值必须为 +∞</text><text x="85" y="680" font-size="27" fill="#213447" text-anchor="start" font-weight="400">取最大分数 0.9 只对应 90% 的名次覆盖，不能冒充 95%。</text></g></svg>

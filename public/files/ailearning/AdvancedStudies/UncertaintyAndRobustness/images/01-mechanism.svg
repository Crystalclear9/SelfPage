<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>保形阈值来自校准分数的有限样本秩</title><desc>取9个校准非一致性分数0.1到0.9，目标错误率0.2。Split conformal使用秩ceil((9+1)×0.8)=8，因此阈值为0.8；绝对残差型区间在预测中心两侧各扩0.8。图同时呈现排序位置和最终集合，避免把普通百分位与有限样本秩修正混淆。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">保形阈值来自校准分数的有限样本秩</text><text x="65" y="160" font-size="22" fill="#16344c" text-anchor="start">9个校准分数：按从小到大排序；选第8个</text><rect x="90" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="135" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.1</text><text x="135" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩1</text><rect x="205" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="250" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.2</text><text x="250" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩2</text><rect x="320" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="365" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.3</text><text x="365" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩3</text><rect x="435" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="480" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.4</text><text x="480" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩4</text><rect x="550" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="595" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.5</text><text x="595" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩5</text><rect x="665" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="710" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.6</text><text x="710" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩6</text><rect x="780" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="825" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.7</text><text x="825" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩7</text><rect x="895" y="230" width="90" height="100" rx="8" fill="#cce9d9" stroke="#9cb8c8" /><text x="940" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.8</text><text x="940" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩8</text><rect x="1010" y="230" width="90" height="100" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="1055" y="275" font-size="24" fill="#16344c" text-anchor="middle">0.9</text><text x="1055" y="310" font-size="18" fill="#16344c" text-anchor="middle">秩9</text><line x1="210" y1="550" x2="990" y2="550" stroke="#277eac" stroke-width="2.5" /><line x1="600" y1="525" x2="600" y2="575" stroke="#277eac" stroke-width="2.5" /><text x="600" y="620" font-size="23" fill="#16344c" text-anchor="middle">预测中心</text><text x="210" y="510" font-size="23" fill="#16344c" text-anchor="middle">中心−0.8</text><text x="990" y="510" font-size="23" fill="#16344c" text-anchor="middle">中心+0.8</text><text x="110" y="720" font-size="22" fill="#16344c" text-anchor="start">绝对残差分数对应对称区间；绿色阈值不是预测标签本身。</text></g></svg>

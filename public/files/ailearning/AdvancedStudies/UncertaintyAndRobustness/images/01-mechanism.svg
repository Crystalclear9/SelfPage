<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img"><title>秩覆盖证明：轮流把一个身份看作未来点</title><rect width="1280" height="1120" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">秩覆盖证明：轮流把一个身份看作未来点</text><text x="60" y="120" font-size="27" fill="#71858b" text-anchor="start">固定十个不同的联合分数；n = 9，α = 0.2，校准秩 k = 8</text><text x="60" y="200" font-size="30" fill="#183944" text-anchor="start">未来身份的联合秩 r = 6</text><line x1="130" y1="300" x2="1160" y2="300" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><circle cx="170" cy="300" r="7" fill="#246b82"/><text x="170" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.1</text><circle cx="270" cy="300" r="7" fill="#246b82"/><text x="270" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.2</text><circle cx="370" cy="300" r="7" fill="#246b82"/><text x="370" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.3</text><circle cx="470" cy="300" r="7" fill="#246b82"/><text x="470" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.4</text><circle cx="570" cy="300" r="7" fill="#246b82"/><text x="570" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.5</text><circle cx="670" cy="300" r="14" fill="#c0673e"/><text x="670" y="270" font-size="25" fill="#c0673e" text-anchor="middle">未来</text><circle cx="770" cy="300" r="7" fill="#246b82"/><text x="770" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.7</text><circle cx="870" cy="300" r="7" fill="#246b82"/><text x="870" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.8</text><circle cx="970" cy="300" r="7" fill="#246b82"/><text x="970" y="346" font-size="25" fill="#246b82" text-anchor="middle">0.9</text><circle cx="1070" cy="300" r="7" fill="#246b82"/><text x="1070" y="346" font-size="25" fill="#246b82" text-anchor="middle">1.0</text><line x1="970" y1="248" x2="970" y2="368" stroke="#183944" stroke-width="3" stroke-dasharray="8 6"/><text x="970" y="230" font-size="27" fill="#183944" text-anchor="middle">q = 0.9</text><line x1="130" y1="390" x2="970" y2="390" stroke="#246b82" stroke-width="6" stroke-dasharray=""/><text x="170" y="435" font-size="25" fill="#246b82" text-anchor="start">接受区域：分数不超过校准阈值</text><text x="1120" y="435" font-size="30" fill="#c0673e" text-anchor="end">覆盖</text><text x="60" y="510" font-size="30" fill="#183944" text-anchor="start">未来身份的联合秩 r = 9</text><line x1="130" y1="610" x2="1160" y2="610" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><circle cx="170" cy="610" r="7" fill="#246b82"/><text x="170" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.1</text><circle cx="270" cy="610" r="7" fill="#246b82"/><text x="270" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.2</text><circle cx="370" cy="610" r="7" fill="#246b82"/><text x="370" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.3</text><circle cx="470" cy="610" r="7" fill="#246b82"/><text x="470" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.4</text><circle cx="570" cy="610" r="7" fill="#246b82"/><text x="570" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.5</text><circle cx="670" cy="610" r="7" fill="#246b82"/><text x="670" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.6</text><circle cx="770" cy="610" r="7" fill="#246b82"/><text x="770" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.7</text><circle cx="870" cy="610" r="7" fill="#246b82"/><text x="870" y="656" font-size="25" fill="#246b82" text-anchor="middle">0.8</text><circle cx="970" cy="610" r="14" fill="#c0673e"/><text x="970" y="580" font-size="25" fill="#c0673e" text-anchor="middle">未来</text><circle cx="1070" cy="610" r="7" fill="#246b82"/><text x="1070" y="656" font-size="25" fill="#246b82" text-anchor="middle">1.0</text><line x1="870" y1="558" x2="870" y2="678" stroke="#183944" stroke-width="3" stroke-dasharray="8 6"/><text x="870" y="540" font-size="27" fill="#183944" text-anchor="middle">q = 0.8</text><line x1="130" y1="700" x2="870" y2="700" stroke="#246b82" stroke-width="6" stroke-dasharray=""/><text x="170" y="745" font-size="25" fill="#246b82" text-anchor="start">接受区域：分数不超过校准阈值</text><text x="1120" y="745" font-size="30" fill="#c0673e" text-anchor="end">未覆盖</text><text x="60" y="865" font-size="30" fill="#183944" text-anchor="start">交换性：未来身份在十个联合名次上等可能</text><circle cx="170" cy="940" r="7" fill="#246b82"/><text x="170" y="987" font-size="27" fill="#183944" text-anchor="middle">1</text><circle cx="270" cy="940" r="7" fill="#246b82"/><text x="270" y="987" font-size="27" fill="#183944" text-anchor="middle">2</text><circle cx="370" cy="940" r="7" fill="#246b82"/><text x="370" y="987" font-size="27" fill="#183944" text-anchor="middle">3</text><circle cx="470" cy="940" r="7" fill="#246b82"/><text x="470" y="987" font-size="27" fill="#183944" text-anchor="middle">4</text><circle cx="570" cy="940" r="7" fill="#246b82"/><text x="570" y="987" font-size="27" fill="#183944" text-anchor="middle">5</text><circle cx="670" cy="940" r="7" fill="#246b82"/><text x="670" y="987" font-size="27" fill="#183944" text-anchor="middle">6</text><circle cx="770" cy="940" r="7" fill="#246b82"/><text x="770" y="987" font-size="27" fill="#183944" text-anchor="middle">7</text><circle cx="870" cy="940" r="7" fill="#246b82"/><text x="870" y="987" font-size="27" fill="#183944" text-anchor="middle">8</text><circle cx="970" cy="940" r="7" fill="#c0673e"/><text x="970" y="987" font-size="27" fill="#183944" text-anchor="middle">9</text><circle cx="1070" cy="940" r="7" fill="#c0673e"/><text x="1070" y="987" font-size="27" fill="#183944" text-anchor="middle">10</text><text x="60" y="1060" font-size="28" fill="#183944" text-anchor="start">前八个身份覆盖；阈值随移除的身份改变，联合覆盖恰为 80%</text></g></svg>

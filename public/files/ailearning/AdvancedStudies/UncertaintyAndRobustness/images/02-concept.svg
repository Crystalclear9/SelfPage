<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>重要性加权修正哪一种变化</title><desc>A固定标签条件机制，只改变输入分布，将来源0.8/0.2变为目标0.4/0.6。B复算低区密度比0.5、高区3，重加权可恢复目标输入平均。C明确来源概率为零而目标为正时不存在有限密度比，支持缺口不能靠增加权重修复。 下方从来源总体 (0.8,0.2) 出发，按权重 (0.5,3) 得到未归一化质量 (0.4,0.6)，其和已为 1，恰好等于目标总体。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">重要性加权修正哪一种变化</text><g transform="translate(10,15) scale(.95)"><line x1="120" x2="885" y1="835.0000" y2="835.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="120" x2="885" y1="525.0000" y2="525.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="120" x2="885" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="120.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">输入概率</text><rect x="160.16" y="339.00" width="110.92" height="496.00" fill="#2563eb" /><text x="215.62" y="330.00" font-size="21" fill="#15364c" text-anchor="middle">0.8</text><text x="215.62" y="867.00" font-size="20" fill="#15364c" text-anchor="middle">来源低区</text><rect x="351.41" y="711.00" width="110.92" height="124.00" fill="#cb702a" /><text x="406.88" y="702.00" font-size="21" fill="#15364c" text-anchor="middle">0.2</text><text x="406.88" y="867.00" font-size="20" fill="#15364c" text-anchor="middle">来源高区</text><rect x="542.66" y="587.00" width="110.92" height="248.00" fill="#497da4" /><text x="598.12" y="578.00" font-size="21" fill="#15364c" text-anchor="middle">0.4</text><text x="598.12" y="867.00" font-size="20" fill="#15364c" text-anchor="middle">目标低区</text><rect x="733.91" y="463.00" width="110.92" height="372.00" fill="#2563eb" /><text x="789.38" y="454.00" font-size="21" fill="#15364c" text-anchor="middle">0.6</text><text x="789.38" y="867.00" font-size="20" fill="#15364c" text-anchor="middle">目标高区</text><text x="144.00" y="236.00" font-size="25" fill="#15364c" text-anchor="start">相同标签条件机制</text><text x="112" y="841" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="112" y="531" text-anchor="end" font-size="20" fill="#15364c">0.5</text><text x="112" y="221" text-anchor="end" font-size="20" fill="#15364c">1</text><line x1="120" x2="885" y1="835.0000" y2="835.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">权重低区0.5，高区3</text><rect x="1060.21" y="253.00" width="55.82" height="152.00" fill="#2563eb" /><text x="1088.12" y="244.00" font-size="21" fill="#15364c" text-anchor="middle">0.8</text><text x="1088.12" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">训练低区</text><rect x="1156.46" y="367.00" width="55.82" height="38.00" fill="#cb702a" /><text x="1184.38" y="358.00" font-size="21" fill="#15364c" text-anchor="middle">0.2</text><text x="1184.38" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">训练高区</text><rect x="1252.71" y="329.00" width="55.82" height="76.00" fill="#497da4" /><text x="1280.62" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">0.4</text><text x="1280.62" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">目标低区</text><rect x="1348.96" y="291.00" width="55.82" height="114.00" fill="#2563eb" /><text x="1376.88" y="282.00" font-size="21" fill="#15364c" text-anchor="middle">0.6</text><text x="1376.88" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">目标高区</text><text x="1032" y="411" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="20" fill="#15364c">0.5</text><text x="1032" y="221" text-anchor="end" font-size="20" fill="#15364c">1</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="781.6667" y2="781.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="718.3333" y2="718.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="655.0000" y2="655.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="625.00" font-size="20" fill="#15364c" text-anchor="start">同一输入区域的概率</text><rect x="1080.42" y="845.00" width="111.65" height="0.00" fill="#2563eb" /><text x="1136.25" y="836.00" font-size="21" fill="#15364c" text-anchor="middle">0</text><text x="1136.25" y="877.00" font-size="20" fill="#15364c" text-anchor="middle">来源</text><rect x="1272.92" y="718.33" width="111.65" height="126.67" fill="#cb702a" /><text x="1328.75" y="709.33" font-size="21" fill="#15364c" text-anchor="middle">0.2</text><text x="1328.75" y="877.00" font-size="20" fill="#15364c" text-anchor="middle">目标</text><text x="1026.00" y="633.00" font-size="23" fill="#15364c" text-anchor="start">来源支持缺失</text><text x="1032" y="851" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="1032" y="787.667" text-anchor="end" font-size="20" fill="#15364c">0.1</text><text x="1032" y="724.333" text-anchor="end" font-size="20" fill="#15364c">0.2</text><text x="1032" y="661" text-anchor="end" font-size="20" fill="#15364c">0.3</text><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#95adba" stroke-width="2" /></g><line x1="40" y1="1040" x2="1460" y2="1040" stroke="#dbe4ed" stroke-width="2" /><text x="45" y="1080" font-size="26" fill="#15364c">来源分布的重加权</text><g transform="translate(55,1135)"><text x="0" y="0" font-size="20" fill="#15364c">来源区域质量</text><rect x="20" y="45" width="304.0" height="65" fill="#2563eb" fill-opacity=".85" /><circle cx="20" cy="137" r="4" fill="#2563eb" /><text x="30" y="143" font-size="20" fill="#15364c">低区</text><rect x="324.0" y="45" width="76.0" height="65" fill="#df7326" fill-opacity=".85" /><circle cx="160" cy="137" r="4" fill="#df7326" /><text x="170" y="143" font-size="20" fill="#15364c">高区</text></g><g transform="translate(545,1135)"><text x="0" y="0" font-size="20" fill="#15364c">乘权重后：0.8×0.5 与 0.2×3</text><rect x="20" y="45" width="152.0" height="65" fill="#2563eb" fill-opacity=".85" /><circle cx="20" cy="137" r="4" fill="#2563eb" /><text x="30" y="143" font-size="20" fill="#15364c">低区</text><rect x="172.0" y="45" width="228.0" height="65" fill="#df7326" fill-opacity=".85" /><circle cx="160" cy="137" r="4" fill="#df7326" /><text x="170" y="143" font-size="20" fill="#15364c">高区</text></g><g transform="translate(1035,1135)"><text x="0" y="0" font-size="20" fill="#15364c">目标区域质量</text><rect x="20" y="45" width="152.0" height="65" fill="#2563eb" fill-opacity=".85" /><circle cx="20" cy="137" r="4" fill="#2563eb" /><text x="30" y="143" font-size="20" fill="#15364c">低区</text><rect x="172.0" y="45" width="228.0" height="65" fill="#df7326" fill-opacity=".85" /><circle cx="160" cy="137" r="4" fill="#df7326" /><text x="170" y="143" font-size="20" fill="#15364c">高区</text></g></g></svg>

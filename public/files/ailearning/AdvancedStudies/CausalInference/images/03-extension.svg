<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="688.135" viewBox="0 71.865285 1280 688.134715" role="img"><rect id="offline-white-background" x="0" y="71.865285" width="1280" height="688.134715" fill="#ffffff"/><title>裁剪改变哪一笔贡献？把权重与回报一起看</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">四条观测：w = (0.2, 0.8, 1, 8)，r = (1, 1, 1, 0)；裁剪上限 2</text><text x="120" y="180" font-size="30" fill="#19333c" text-anchor="start">权重</text><rect x="120" y="523.0" width="35" height="7.0" fill="#256b82"/><rect x="158" y="523.0" width="35" height="7.0" fill="#c0643c"/><text x="156" y="575" font-size="26" fill="#74858a" text-anchor="middle">1</text><rect x="230" y="502.0" width="35" height="28.0" fill="#256b82"/><rect x="268" y="502.0" width="35" height="28.0" fill="#c0643c"/><text x="266" y="575" font-size="26" fill="#74858a" text-anchor="middle">2</text><rect x="340" y="495" width="35" height="35" fill="#256b82"/><rect x="378" y="495" width="35" height="35" fill="#c0643c"/><text x="376" y="575" font-size="26" fill="#74858a" text-anchor="middle">3</text><rect x="450" y="250" width="35" height="280" fill="#256b82"/><rect x="488" y="460" width="35" height="70" fill="#c0643c"/><text x="486" y="575" font-size="26" fill="#74858a" text-anchor="middle">4</text><text x="740" y="180" font-size="30" fill="#19333c" text-anchor="start">权重 × 回报</text><rect x="740" y="523.0" width="35" height="7.0" fill="#256b82"/><rect x="778" y="523.0" width="35" height="7.0" fill="#c0643c"/><text x="776" y="575" font-size="26" fill="#74858a" text-anchor="middle">1</text><rect x="850" y="502.0" width="35" height="28.0" fill="#256b82"/><rect x="888" y="502.0" width="35" height="28.0" fill="#c0643c"/><text x="886" y="575" font-size="26" fill="#74858a" text-anchor="middle">2</text><rect x="960" y="495" width="35" height="35" fill="#256b82"/><rect x="998" y="495" width="35" height="35" fill="#c0643c"/><text x="996" y="575" font-size="26" fill="#74858a" text-anchor="middle">3</text><rect x="1070" y="530" width="35" height="0" fill="#256b82"/><rect x="1108" y="530" width="35" height="0" fill="#c0643c"/><text x="1106" y="575" font-size="26" fill="#74858a" text-anchor="middle">4</text><line x1="60" y1="615" x2="1220" y2="615" stroke="#dce4e5" stroke-width="2"/><text x="60" y="665" font-size="27" fill="#19333c" text-anchor="start">蓝：原始；橙：裁剪。最高权重那条回报为 0，本次估计仍同为 0.5。</text><text x="60" y="750" font-size="25" fill="#74858a" text-anchor="start">这里是单份数据的贡献账本；重复抽样偏差还需要给出采样分布。</text></g><desc> 若将第 4 条回报改为 1，原估计为 2.5，裁剪后为 1，数值才改变。</desc></svg>

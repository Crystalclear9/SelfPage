<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>截断权重同时改变贡献和估计目标</title><desc>图中原始轨迹权重为(0.2,0.8,1,8)，按上限2裁剪后最后一项变为2，其余不变。稀有高权重轨迹的影响受到抑制，但这种非线性截断会改变原本的无偏加权关系，必须同时记录偏差与不确定性。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">截断权重同时改变贡献和估计目标</text><text x="85" y="190" font-size="24" fill="#193e54" text-anchor="start">轨迹权重（截断上限2）</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="602.2" width="81.2" height="7.8" fill="#1977b4" /><text x="175.625" y="586.2222222222222" font-size="24" fill="#193e54" text-anchor="middle">0.2</text><text x="175.625" y="680" font-size="24" fill="#193e54" text-anchor="middle">原1</text><rect x="252.5" y="578.9" width="81.2" height="31.1" fill="#cf7432" /><text x="293.125" y="562.8888888888889" font-size="24" fill="#193e54" text-anchor="middle">0.8</text><text x="293.125" y="680" font-size="24" fill="#193e54" text-anchor="middle">原2</text><rect x="370.0" y="571.1" width="81.2" height="38.9" fill="#627689" /><text x="410.625" y="555.1111111111111" font-size="24" fill="#193e54" text-anchor="middle">1</text><text x="410.625" y="680" font-size="24" fill="#193e54" text-anchor="middle">原3</text><rect x="487.5" y="298.9" width="81.2" height="311.1" fill="#1977b4" /><text x="528.125" y="282.8888888888889" font-size="24" fill="#193e54" text-anchor="middle">8</text><text x="528.125" y="680" font-size="24" fill="#193e54" text-anchor="middle">原4</text><rect x="605.0" y="602.2" width="81.2" height="7.8" fill="#cf7432" /><text x="645.625" y="586.2222222222222" font-size="24" fill="#193e54" text-anchor="middle">0.2</text><text x="645.625" y="680" font-size="24" fill="#193e54" text-anchor="middle">截断1</text><rect x="722.5" y="578.9" width="81.2" height="31.1" fill="#627689" /><text x="763.125" y="562.8888888888889" font-size="24" fill="#193e54" text-anchor="middle">0.8</text><text x="763.125" y="680" font-size="24" fill="#193e54" text-anchor="middle">截断2</text><rect x="840.0" y="571.1" width="81.2" height="38.9" fill="#1977b4" /><text x="880.625" y="555.1111111111111" font-size="24" fill="#193e54" text-anchor="middle">1</text><text x="880.625" y="680" font-size="24" fill="#193e54" text-anchor="middle">截断3</text><rect x="957.5" y="532.2" width="81.2" height="77.8" fill="#cf7432" /><text x="998.125" y="516.2222222222222" font-size="24" fill="#193e54" text-anchor="middle">2</text><text x="998.125" y="680" font-size="24" fill="#193e54" text-anchor="middle">截断4</text><text x="90" y="145" font-size="24" fill="#193e54" text-anchor="start">仅改变超过上限的贡献；是否降低实际估计方差还依赖回报结构。</text></g></svg>

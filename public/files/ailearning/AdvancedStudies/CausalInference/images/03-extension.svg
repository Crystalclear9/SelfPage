<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1224.15" viewBox="0 0 1440 1224.15" role="img"><title>裁剪改变哪一笔贡献？把权重与回报一起看</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="774.152" viewBox="0 71.865285 1280 688.134715" role="img"><rect id="offline-white-background" x="0" y="71.865285" width="1280" height="688.134715" fill="#ffffff"/><title>裁剪改变哪一笔贡献？把权重与回报一起看</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">四条观测：w = (0.2, 0.8, 1, 8)，r = (1, 1, 1, 0)；裁剪上限 2</text><text x="120" y="180" font-size="30" fill="#19333c" text-anchor="start">权重</text><rect x="120" y="523.0" width="35" height="7.0" fill="#256b82"/><rect x="158" y="523.0" width="35" height="7.0" fill="#c0643c"/><text x="156" y="575" font-size="26" fill="#74858a" text-anchor="middle">1</text><rect x="230" y="502.0" width="35" height="28.0" fill="#256b82"/><rect x="268" y="502.0" width="35" height="28.0" fill="#c0643c"/><text x="266" y="575" font-size="26" fill="#74858a" text-anchor="middle">2</text><rect x="340" y="495" width="35" height="35" fill="#256b82"/><rect x="378" y="495" width="35" height="35" fill="#c0643c"/><text x="376" y="575" font-size="26" fill="#74858a" text-anchor="middle">3</text><rect x="450" y="250" width="35" height="280" fill="#256b82"/><rect x="488" y="460" width="35" height="70" fill="#c0643c"/><text x="486" y="575" font-size="26" fill="#74858a" text-anchor="middle">4</text><text x="740" y="180" font-size="30" fill="#19333c" text-anchor="start">权重 × 回报</text><rect x="740" y="523.0" width="35" height="7.0" fill="#256b82"/><rect x="778" y="523.0" width="35" height="7.0" fill="#c0643c"/><text x="776" y="575" font-size="26" fill="#74858a" text-anchor="middle">1</text><rect x="850" y="502.0" width="35" height="28.0" fill="#256b82"/><rect x="888" y="502.0" width="35" height="28.0" fill="#c0643c"/><text x="886" y="575" font-size="26" fill="#74858a" text-anchor="middle">2</text><rect x="960" y="495" width="35" height="35" fill="#256b82"/><rect x="998" y="495" width="35" height="35" fill="#c0643c"/><text x="996" y="575" font-size="26" fill="#74858a" text-anchor="middle">3</text><rect x="1070" y="530" width="35" height="0" fill="#256b82"/><rect x="1108" y="530" width="35" height="0" fill="#c0643c"/><text x="1106" y="575" font-size="26" fill="#74858a" text-anchor="middle">4</text><line x1="60" y1="615" x2="1220" y2="615" stroke="#dce4e5" stroke-width="2"/><text x="60" y="665" font-size="27" fill="#19333c" text-anchor="start">蓝：原始；橙：裁剪。最高权重那条回报为 0，本次估计仍同为 0.5。</text><text x="60" y="750" font-size="25" fill="#74858a" text-anchor="start">这里是单份数据的贡献账本；重复抽样偏差还需要给出采样分布。</text></g><desc> 若将第 4 条回报改为 1，原估计为 2.5，裁剪后为 1，数值才改变。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 774.152) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">回报带符号时，裁剪也可能把估计向上推</text><rect x="65" y="140" width="642" height="58" fill="#edf5f8" stroke="#216c89"/><text x="386.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">权重 0.2,0.8,1,8</text><rect x="715" y="140" width="642" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1036.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">回报 1,1,1,−1</text><g><text x="65.000" y="270" font-size="31" fill="#216c89">原普通平均：</text><text x="358.945" y="253" font-size="29" fill="#216c89" text-anchor="middle">(0.2+0.8+1−8)</text><line x1="255.000" x2="462.891" y1="261" y2="261" stroke="#216c89" stroke-width="1.5"/><text x="358.945" y="289" font-size="29" fill="#216c89" text-anchor="middle">4</text><text x="466.891" y="270" font-size="31" fill="#216c89"> = −1.5</text></g><g><text x="65.000" y="340" font-size="31" fill="#c96937">裁剪到2：</text><text x="315.117" y="323" font-size="29" fill="#c96937" text-anchor="middle">(0.2+0.8+1−2)</text><line x1="211.172" x2="419.062" y1="331" y2="331" stroke="#c96937" stroke-width="1.5"/><text x="315.117" y="359" font-size="29" fill="#c96937" text-anchor="middle">4</text><text x="423.062" y="340" font-size="31" fill="#c96937"> = 0</text></g><text x="65" y="415" font-size="28" fill="#203742" text-anchor="start">同一被裁掉的质量6，乘负回报后让估计增加1.5；非负回报前提不能漏掉。</text></g></g></svg>

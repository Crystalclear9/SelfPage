<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>条件化选择人群；干预改变处理规则</title><rect width="1280" height="840" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">条件化选择人群；干预改变处理规则</text><text x="60" y="135" font-size="30" fill="#246b82" text-anchor="start">观察 A = 1</text><line x1="303" y1="242" x2="155" y2="377" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><polygon points="155,377 171.53835337173865,371.38904038942525 162.10355473829884,361.0457055912838" fill="#246b82"/><line x1="357" y1="242" x2="485" y2="377" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><polygon points="485,377 479.07100632556376,360.57297854118116 468.9116245987419,370.20557751179746" fill="#246b82"/><line x1="168" y1="404" x2="472" y2="404" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><polygon points="472,404 456.0,397.0 456.0,411.0" fill="#246b82"/><circle cx="330" cy="214" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="330" y="224" font-size="30" fill="#183944" text-anchor="middle">X</text><circle cx="130" cy="404" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="130" y="414" font-size="30" fill="#183944" text-anchor="middle">A</text><circle cx="510" cy="404" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="510" y="414" font-size="30" fill="#183944" text-anchor="middle">Y</text><text x="60" y="487" font-size="26" fill="#183944" text-anchor="start">高风险占 90%，低风险占 10%</text><text x="60" y="548" font-size="28" fill="#183944" text-anchor="start">0.9 × 0.4 + 0.1 × 0.9</text><text x="60" y="609" font-size="30" fill="#246b82" text-anchor="start">观察成功率：0.45</text><text x="690" y="135" font-size="30" fill="#c0673e" text-anchor="start">干预 do(A = 1)</text><line x1="933" y1="242" x2="785" y2="377" stroke="#dce7e9" stroke-width="3" stroke-dasharray="8 7"/><line x1="850" y1="292" x2="895" y2="337" stroke="#c0673e" stroke-width="4" stroke-dasharray=""/><line x1="895" y1="292" x2="850" y2="337" stroke="#c0673e" stroke-width="4" stroke-dasharray=""/><line x1="987" y1="242" x2="1115" y2="377" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><polygon points="1115,377 1109.0710063255638,360.57297854118116 1098.911624598742,370.20557751179746" fill="#246b82"/><line x1="798" y1="404" x2="1102" y2="404" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><polygon points="1102,404 1086.0,397.0 1086.0,411.0" fill="#246b82"/><circle cx="960" cy="214" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="960" y="224" font-size="30" fill="#183944" text-anchor="middle">X</text><circle cx="760" cy="404" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="760" y="414" font-size="30" fill="#183944" text-anchor="middle">A</text><circle cx="1140" cy="404" r="37" fill="#edf4f5" stroke="#246b82" stroke-width="2"/><text x="1140" y="414" font-size="30" fill="#183944" text-anchor="middle">Y</text><text x="690" y="487" font-size="26" fill="#183944" text-anchor="start">高风险占 50%，低风险占 50%</text><text x="690" y="548" font-size="28" fill="#183944" text-anchor="start">0.5 × 0.4 + 0.5 × 0.9</text><text x="690" y="609" font-size="30" fill="#c0673e" text-anchor="start">干预成功率：0.65</text><line x1="635" y1="110" x2="635" y2="649" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="713" font-size="28" fill="#183944" text-anchor="start">层内处理成功率相同：高风险 0.4，低风险 0.9。</text><text x="60" y="769" font-size="27" fill="#183944" text-anchor="start">干预删除 X → A 的原分配机制，保留 X 的总体分布与结果机制。</text></g></svg>

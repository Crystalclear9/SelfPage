<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="635" viewBox="0 0 1200 635" role="img"><title id="extra-title">自归一化的有限样本偏差：一个单步反例</title><desc id="extra-desc">把时域缩到一步，行为策略以各半概率选择 A,B，目标策略概率为 0.8,0.2，确定回报分别为 0,1。两个动作均有行为支持，重要性权重分别为 1.6,0.4，真实目标价值为 0.2。当数据集只有一条观测时，普通 IS 取值为 0 或 0.4，重复试验期望为 \frac12(0+0.4)=0.2。

自归一化估计为 \frac{w r}{w}=r，在两个等可能分支上取值 0 或 1，因此期望为 0.5，偏差为 0.3。本例两个分母都严格为正，偏差并非零分母处理造成，而是有限样本比值估计与求期望不交换。它不否定自归一化在合适条件下的一致性，也不表示其均方误差总比普通 IS 更差；比较时需要同时核对偏差、方差与样本预算。</desc><rect width="1200" height="635" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">自归一化的有限样本偏差：一个单步反例</text><text x="40" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">一条行为观测</text><text x="345" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">权重 w</text><text x="640" y="115" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">普通 IS：w×r</text><text x="925" y="115" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">再除以权重和</text><rect x="35" y="175" width="235" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="152.5" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">A，回报 0</text><rect x="340" y="175" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="415.0" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1.6</text><rect x="625" y="175" width="185" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="717.5" y="220.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="940" y="175" width="185" height="70" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="1032.5" y="220.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">0</text><path d="M280,210 L325,210" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M505,210 L610,210" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M825,210 L925,210" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><rect x="35" y="350" width="235" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="152.5" y="395.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">B，回报 1</text><rect x="340" y="350" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="415.0" y="395.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.4</text><rect x="625" y="350" width="185" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="717.5" y="395.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.4</text><rect x="940" y="350" width="185" height="70" rx="6" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="1032.5" y="395.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">1</text><path d="M280,385 L325,385" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M505,385 L610,385" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><path d="M825,385 L925,385" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><text x="40" y="520" font-size="27" fill="#213447" text-anchor="start" font-weight="400">行为各半；目标选择 A 的概率为 0.8，选择 B 的概率为 0.2</text><text x="40" y="585" font-size="28" fill="#213447" text-anchor="start" font-weight="400">真实价值 0.2；普通 IS 的期望 0.2；自归一化的期望 0.5</text></g></svg>

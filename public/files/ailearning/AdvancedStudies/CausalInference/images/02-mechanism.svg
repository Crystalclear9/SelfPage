<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="549.236" viewBox="0 80.712042 1280 549.235602" role="img"><rect id="offline-white-background" x="0" y="80.712042" width="1280" height="549.235602" fill="#ffffff"/><title>五折交叉拟合：每条记录只接受一次折外评分</title><rect width="1280" height="940" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="65" y="125" font-size="27" fill="#183944" text-anchor="start">6000 个独立单位；每折 1200；每轮用其余 4800 个单位拟合。</text><rect x="70" y="159" width="30" height="25" fill="#e8f1f3"/><text x="114" y="183" font-size="26" fill="#246b82" text-anchor="start">训练</text><rect x="285" y="159" width="30" height="25" fill="#f6e6dc"/><text x="330" y="183" font-size="26" fill="#c0673e" text-anchor="start">只评分，不参与该轮拟合</text><text x="250" y="252" font-size="26" fill="#183944" text-anchor="middle">第 1 折</text><text x="427" y="252" font-size="26" fill="#183944" text-anchor="middle">第 2 折</text><text x="604" y="252" font-size="26" fill="#183944" text-anchor="middle">第 3 折</text><text x="781" y="252" font-size="26" fill="#183944" text-anchor="middle">第 4 折</text><text x="958" y="252" font-size="26" fill="#183944" text-anchor="middle">第 5 折</text><text x="65" y="312" font-size="26" fill="#183944" text-anchor="start">轮次 1</text><rect x="171" y="275" width="155" height="53" fill="#f6e6dc"/><text x="249" y="311" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="348" y="275" width="155" height="53" fill="#e8f1f3"/><text x="426" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="275" width="155" height="53" fill="#e8f1f3"/><text x="603" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="275" width="155" height="53" fill="#e8f1f3"/><text x="780" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="275" width="155" height="53" fill="#e8f1f3"/><text x="957" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="3
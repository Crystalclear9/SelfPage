<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>交叉拟合让打分使用未参与拟合的样本</title><desc>把样本分成A、B两折。用A训练干扰函数后只在B上计算得分，再用B训练并在A上打分，最终合并两折得分。图中特意把训练箭头跨到另一折，防止把“不同函数名”误当成真正样本外预测。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">交叉拟合让打分使用未参与拟合的样本</text><rect x="80" y="190" width="370" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="95" y="227" font-size="25" fill="#16344c" text-anchor="start">折 A：训练</text><text x="95" y="265" font-size="21" fill="#16344c" text-anchor="start">拟合干扰函数 fA</text><rect x="750" y="190" width="370" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="765" y="227" font-size="25" fill="#16344c" text-anchor="start">折 B：打分</text><text x="765" y="265" font-size="21" fill="#16344c" text-anchor="start">仅由 fA 给出预测</text><rect x="80" y="450" width="370" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="95" y="487" font-size="25" fill="#16344c" text-anchor="start">折 A：打分</text><text x="95" y="525" font-size="21" fill="#16344c" text-anchor="start">仅由 fB 给出预测</text><rect x="750" y="450" width="370" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="765" y="487" font-size="25" fill="#16344c" text-anchor="start">折 B：训练</text><text x="765" y="525" font-size="21" fill="#16344c" text-anchor="start">拟合干扰函数 fB</text><path d="M465,235 L730,235" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M730,495 L465,495" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M270,560 L520,680" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M930,300 L650,680" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="440" y="730" font-size="25" fill="#16344c" text-anchor="start">合并两折样本外得分</text></g></svg>

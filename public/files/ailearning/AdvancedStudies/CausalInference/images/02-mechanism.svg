<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="889.288" viewBox="0 80.712042 1280 889.287958" role="img"><rect id="offline-white-background" x="0" y="80.712042" width="1280" height="889.287958" fill="#ffffff"/><title>五折交叉拟合：每条记录只接受一次折外评分</title><rect width="1280" height="970" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="65" y="125" font-size="27" fill="#183944" text-anchor="start">6000 个独立单位；每折 1200；每轮用其余 4800 个单位拟合。</text><rect x="70" y="159" width="30" height="25" fill="#e8f1f3"/><text x="114" y="183" font-size="26" fill="#246b82" text-anchor="start">训练</text><rect x="285" y="159" width="30" height="25" fill="#f6e6dc"/><text x="330" y="183" font-size="26" fill="#c0673e" text-anchor="start">只评分，不参与该轮拟合</text><text x="250" y="252" font-size="26" fill="#183944" text-anchor="middle">第 1 折</text><text x="427" y="252" font-size="26" fill="#183944" text-anchor="middle">第 2 折</text><text x="604" y="252" font-size="26" fill="#183944" text-anchor="middle">第 3 折</text><text x="781" y="252" font-size="26" fill="#183944" text-anchor="middle">第 4 折</text><text x="958" y="252" font-size="26" fill="#183944" text-anchor="middle">第 5 折</text><text x="65" y="312" font-size="26" fill="#183944" text-anchor="start">轮次 1</text><rect x="171" y="275" width="155" height="53" fill="#f6e6dc"/><text x="249" y="311" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="348" y="275" width="155" height="53" fill="#e8f1f3"/><text x="426" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="275" width="155" height="53" fill="#e8f1f3"/><text x="603" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="275" width="155" height="53" fill="#e8f1f3"/><text x="780" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="275" width="155" height="53" fill="#e8f1f3"/><text x="957" y="311" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="382" font-size="26" fill="#183944" text-anchor="start">轮次 2</text><rect x="171" y="345" width="155" height="53" fill="#e8f1f3"/><text x="249" y="381" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="348" y="345" width="155" height="53" fill="#f6e6dc"/><text x="426" y="381" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="525" y="345" width="155" height="53" fill="#e8f1f3"/><text x="603" y="381" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="345" width="155" height="53" fill="#e8f1f3"/><text x="780" y="381" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="345" width="155" height="53" fill="#e8f1f3"/><text x="957" y="381" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="452" font-size="26" fill="#183944" text-anchor="start">轮次 3</text><rect x="171" y="415" width="155" height="53" fill="#e8f1f3"/><text x="249" y="451" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="348" y="415" width="155" height="53" fill="#e8f1f3"/><text x="426" y="451" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="415" width="155" height="53" fill="#f6e6dc"/><text x="603" y="451" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="702" y="415" width="155" height="53" fill="#e8f1f3"/><text x="780" y="451" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="415" width="155" height="53" fill="#e8f1f3"/><text x="957" y="451" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="522" font-size="26" fill="#183944" text-anchor="start">轮次 4</text><rect x="171" y="485" width="155" height="53" fill="#e8f1f3"/><text x="249" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="348" y="485" width="155" height="53" fill="#e8f1f3"/><text x="426" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="485" width="155" height="53" fill="#e8f1f3"/><text x="603" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="485" width="155" height="53" fill="#f6e6dc"/><text x="780" y="521" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="879" y="485" width="155" height="53" fill="#e8f1f3"/><text x="957" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="592" font-size="26" fill="#183944" text-anchor="start">轮次 5</text><rect x="171" y="555" width="155" height="53" fill="#e8f1f3"/><text x="249" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="348" y="555" width="155" height="53" fill="#e8f1f3"/><text x="426" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="555" width="155" height="53" fill="#e8f1f3"/><text x="603" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="555" width="155" height="53" fill="#e8f1f3"/><text x="780" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="555" width="155" height="53" fill="#f6e6dc"/><text x="957" y="591" font-size="26" fill="#c0673e" text-anchor="middle">评分</text></g><desc> 最终平均全部 6000 条得分；共享训练数据使它们并非有限样本独立。 该条增广得分：ψ = (2 − 1) + (3 − 2) ÷ 0.25 = 5。 A = 1，Y = 3；折外预测 m1 = 2，m0 = 1，e = 0.25。 例：第 3 折某条记录，只用第 1、2、4、5 折拟合的函数评分。</desc><g font-family="Microsoft YaHei,sans-serif" fill="#183944"><line x1="70" y1="650" x2="1210" y2="650" stroke="#dce7ed" stroke-width="2"/><text x="70" y="702" font-size="30">第 3 折的一条评分记录</text><text x="70" y="752" font-size="28">A＝1，Y＝3；折外预测 m1＝2，m0＝1，e＝0.25</text><text x="70" y="831" font-size="32">ψ＝(2−1)＋</text><g transform="translate(355,820)" font-size="29"><text text-anchor="middle" y="-12">3−2</text><path d="M -42 0 H 42" stroke="#183944" stroke-width="2"/><text text-anchor="middle" y="34">0.25</text></g><text x="420" y="831" font-size="32">−0＝5</text><text x="70" y="927" font-size="27">最终平均 6000 条得分；共享训练数据不等于得分彼此独立。</text></g></svg>

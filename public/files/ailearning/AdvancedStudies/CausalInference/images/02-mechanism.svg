3" fill="#e8f1f3"/><text x="603" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="485" width="155" height="53" fill="#f6e6dc"/><text x="780" y="521" font-size="26" fill="#c0673e" text-anchor="middle">评分</text><rect x="879" y="485" width="155" height="53" fill="#e8f1f3"/><text x="957" y="521" font-size="26" fill="#246b82" text-anchor="middle">训练</text><text x="65" y="592" font-size="26" fill="#183944" text-anchor="start">轮次 5</text><rect x="171" y="555" width="155" height="53" fill="#e8f1f3"/><text x="249" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="348" y="555" width="155" height="53" fill="#e8f1f3"/><text x="426" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="525" y="555" width="155" height="53" fill="#e8f1f3"/><text x="603" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="702" y="555" width="155" height="53" fill="#e8f1f3"/><text x="780" y="591" font-size="26" fill="#246b82" text-anchor="middle">训练</text><rect x="879" y="555" width="155" height="53" fill="#f6e6dc"/><text x="957" y="591" font-size="26" fill="#c0673e" text-anchor="middle">评分</text></g><desc> 最终平均全部 6000 条得分；共享训练数据使它们并非有限样本独立。 该条增广得分：ψ = (2 − 1) + (3 − 2) ÷ 0.25 = 5。 A = 1，Y = 3；折外预测 m1 = 2，m0 = 1，e = 0.25。 例：第 3 折某条记录，只用第 1、2、4、5 折拟合的函数评分。</desc></svg>

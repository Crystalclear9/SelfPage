<text x="74" y="581" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">折外辅助预测：m₁ = 2，m₀ = 1，e = 0.25。</text>
<text x="74" y="651" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">回归差 2 − 1 = 1；处理残差修正</text>

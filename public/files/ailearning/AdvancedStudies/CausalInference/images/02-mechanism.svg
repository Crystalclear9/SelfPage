<text x="597" y="650" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">= 4。总得分 1 + 4 = 5。</text>
<text x="74" y="731" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">每一列只在对角线评分一次。单条得分并非该人的真实处理效应。</text>

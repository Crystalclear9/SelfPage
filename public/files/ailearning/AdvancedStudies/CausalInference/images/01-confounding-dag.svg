<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
<title id="title">干预删除分配箭头而保留结果机制</title>
<desc id="description">左右共用节点位置。干预只删除 X 到 A 的箭头，X 到 Y 和 A 到 Y 保留。</desc>
<defs>

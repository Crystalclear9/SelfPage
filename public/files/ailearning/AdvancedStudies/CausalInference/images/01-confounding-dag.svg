<linearGradient id="wash-c" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#fdf2ef"/><stop offset="1" stop-color="#f3d5cd"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f7f4fb"/><stop offset="1" stop-color="#e4dbee"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f8fafb"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="440" rx="0" fill="white" stroke="none" stroke-width="1.6"/>

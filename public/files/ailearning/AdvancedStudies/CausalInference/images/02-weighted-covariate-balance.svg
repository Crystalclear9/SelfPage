<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="627" viewBox="0 0 1360 627" role="img" aria-labelledby="title desc"><title id="title">逆概率权重如何平衡观测组成</title><desc id="desc">两层各 4 条记录。原处理组与对照组构成不同，按真实倾向倒数加权后，各层各组总权重都为 4。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="627" fill="white" stroke="none" stroke-width="1.55"/><text x="316" y="64" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">原记录</text><text x="1047" y="64" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">权重改变贡献大小</text><text x="98" y="189" fill="#202a37" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">层 1</text><circle cx="189" cy="181" r="12" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="865" cy="181" r="13.85641" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="283" cy="181" r="12" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="972" cy="181" r="13.85641" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="377" cy="181" r="12" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="1079" cy="181" r="13.85641" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="471" cy="181" r="12" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="1186" cy="181" r="24" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><line x1="531" y1="181" x2="723" y2="181" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="1030" y="246" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">处理、对照总权重各为 4</text><text x="98" y="424" fill="#202a37" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">层 2</text><circle cx="189" cy="416" r="12" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="865" cy="416" r="24" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="283" cy="416" r="12" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="972" cy="416" r="13.85641" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="377" cy="416" r="12" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="1079" cy="416" r="13.85641" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="471" cy="416" r="12" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><circle cx="1186" cy="416" r="13.85641" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><line x1="531" y1="416" x2="723" y2="416" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="1030" y="481" fill="#202a37" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">处理、对照总权重各为 4</text><text x="667" y="584" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">青色为处理，珊瑚色为对照，圆的面积按权重缩放</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title id="extra-title">双重稳健的余项是两个误差的乘积</title><desc id="extra-desc">本图把抽象的“误差乘积”落到处理均值的一项增广得分上，避免把它误读为所有问题都具有相同偏差常数。给定 X，记真实倾向概率为 e=P(A=1\mid X)、真实处理结果均值为 m=E[Y\mid A=1,X]，并将 \widetilde e&gt;0,\widetilde m 视作已冻结的干扰估计。对 S=\widetilde m+\frac{A(Y-\widetilde m)}{\widetilde e} 取条件期望，有
E[S\mid X]-m=\frac{(\widetilde e-e)(\widetilde m-m)}{\widetilde e}。
当任一种干扰估计正确时，该条件偏差归零；这是双重稳健性的代数机制。

右图令两类情形都满足 \widetilde e-e=0.1、\widetilde m-m=0.2。当 e=0.5,\widetilde e=0.6 时，偏差为 \frac{0.02}{0.6}=\frac{1}{30}\approx0.0333；当 e=0.05,\widetilde e=0.15 时，偏差为 \frac{0.02}{0.15}=\frac{2}{15}\approx0.1333。虽然两个误差的乘积相同，偏差却相差四倍。因而范数乘积界所需的重叠下界、分母控制不能省略；“二阶”不等于数值上必然很小。

这只是处理均值分量的条件偏差。ATE 还要减去对照均值项，其分母为 1-\widetilde e，最后对 X 平均；不能把右图两个柱子直接当成任意 ATE 的总偏差。有限样本推断还要处理随机波动、交叉拟合和矩条件。增广得分的原式见 [Oxford 因果推断讲义第 12.2 节](https://www.stats.ox.ac.uk/~evans/APTS/dr.html#augmented-inverse-probability-weighting)。</desc><rect width="1200" height="700" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">双重稳健的余项是两个误差的乘积</text><text x="85" y="105" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">任一干扰模型正确，条件偏差归零</text><text x="85" y="175" font-size="29" fill="#213447" text-anchor="start" font-weight="400">S = m_est +</text><text x="420.0" y="153" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">A(Y−m_est)</text><line x1="300" y1="165" x2="540" y2="165" stroke="#213447" stroke-width="1.7" /><text x="420.0" y="199" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">e_est</text><text x="85" y="270" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">e_est = e：条件偏差为 0</text><text x="85" y="330" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">m_est = m：条件偏差为 0</text><text x="85" y="405" font-size="28" fill="#213447" text-anchor="start" font-weight="400">两者都错：</text><text x="325.0" y="468" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">(e_est−e)(m_est−m)</text><line x1="85" y1="480" x2="565" y2="480" stroke="#cf7432" stroke-width="1.7" /><text x="325.0" y="514" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">e_est</text><text x="85" y="605" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">小分母会放大同一误差乘积</text><text x="690" y="105" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">相同误差乘积，不同的重叠程度</text><line x1="690" y1="540.0" x2="1120" y2="540.0" stroke="#dce5ed" stroke-width="2" /><text x="678" y="548.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="690" y1="365.0" x2="1120" y2="365.0" stroke="#dce5ed" stroke-width="2" /><text x="678" y="373.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.08</text><line x1="690" y1="190.0" x2="1120" y2="190.0" stroke="#dce5ed" stroke-width="2" /><text x="678" y="198.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.16</text><line x1="690" y1="190" x2="690" y2="540" stroke="#627689" stroke-width="2" /><line x1="690" y1="540" x2="1120" y2="540" stroke="#627689" stroke-width="2" /><rect x="785.3333333333333" y="467.08333333333337" width="96" height="72.91666666666663" fill="#2865a0" /><text x="833.3333333333333" y="447.08333333333337" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">0.0333</text><text x="833.3333333333333" y="580" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">e=0.5</text><rect x="928.6666666666666" y="248.33333333333337" width="96" height="291.66666666666663" fill="#cf7432" /><text x="976.6666666666666" y="228.33333333333337" font-size="26" fill="#cf7432" text-anchor="middle" font-weight="400">0.1333</text><text x="976.6666666666666" y="580" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">e=0.05</text><text x="690" y="165" font-size="25" fill="#627689" text-anchor="start" font-weight="400">处理均值得分的条件偏差</text><text x="690" y="630" font-size="24" fill="#213447" text-anchor="start" font-weight="400">两组：e_est−e=0.1，m_est−m=0.2</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>充分单状态模型中边际化消除无关历史比率的精确方差</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="62" font-size="36" fill="#22364a" text-anchor="start" font-weight="bold">过去与末步奖励无关时，连乘会多加噪声</text><text x="60" y="110" font-size="26" fill="#64788b" text-anchor="start" font-weight="normal">行为每步选 1 的概率为 0.5；目标为 0.9；奖励只有末步动作 A</text><line x1="120" y1="548.6" x2="650" y2="548.6" stroke="#dce5ee" stroke-width="2"/><text x="100" y="556.6" font-size="25" fill="#22364a" text-anchor="end" font-weight="normal">1</text><line x1="120" y1="416.6" x2="650" y2="416.6" stroke="#dce5ee" stroke-width="2"/><text x="100" y="424.6" font-size="25" fill="#22364a" text-anchor="end" font-weight="normal">10</text><line x1="120" y1="284.59999999999997" x2="650" y2="284.59999999999997" stroke="#dce5ee" stroke-width="2"/><text x="100" y="292.59999999999997" font-size="25" fill="#22364a" text-anchor="end" font-weight="normal">100</text><line x1="120" y1="575" x2="650" y2="575" stroke="#22364a" stroke-width="2"/><line x1="120" y1="575" x2="120" y2="205" stroke="#22364a" stroke-width="2"/><text x="120" y="176" font-size="27" fill="#22364a" text-anchor="start" font-weight="bold">单轨迹贡献方差，纵轴为对数</text><text x="120.0" y="612" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="237.77777777777777" y="612" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">3</text><text x="355.55555555555554" y="612" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">5</text><text x="473.3333333333333" y="612" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">7</text><text x="650.0" y="612" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">10</text><path d="M 120.000,560.680 L 178.889,513.433 L 237.778,476.016 L 296.667,442.763 L 355.556,411.612 L 414.444,381.616 L 473.333,352.280 L 532.222,323.334 L 591.111,294.619 L 650.000,266.044" stroke="#c86d31" stroke-width="4" fill="none"/><line x1="120.0" y1="560.6799775080183" x2="650.0" y2="560.6799775080183" stroke="#2666a4" stroke-width="5"/><text x="380" y="657" font-size="27" fill="#22364a" text-anchor="middle" font-weight="normal">时域 H</text><text x="760" y="220" font-size="32" fill="#22364a" text-anchor="start" font-weight="bold">H = 10</text><text x="760" y="280" font-size="28" fill="#c86d31" text-anchor="start" font-weight="bold">轨迹 IS / PDIS</text><text x="760" y="324" font-size="29" fill="#c86d31" text-anchor="start" font-weight="normal">方差 138.22036</text><text x="760" y="405" font-size="28" fill="#2666a4" text-anchor="start" font-weight="bold">已知边际比</text><text x="760" y="449" font-size="29" fill="#2666a4" text-anchor="start" font-weight="normal">方差 0.81</text><text x="760" y="518" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">贡献只取 0 或 1.8</text><text x="760" y="559" font-size="26" fill="#64788b" text-anchor="start" font-weight="normal">各以 0.5 概率出现</text><line x1="60" y1="704" x2="1140" y2="704" stroke="#dce5ee" stroke-width="2"/><text x="60" y="751" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">两种估计都以 0.9 为期望；状态若不充分，直接删去历史权重可能有偏。</text><text x="60" y="793" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">本例状态边际比已知为 1；一般问题仍须估计目标访问分布。</text></g></svg>
1.616 473.333,352.28 532.222,323.334 591.111,294.619 650,266.044"/><line x1="120.0" y1="560.6799775080183" x2="650.0" y2="560.6799775080183" stroke="#20739d" stroke-width="5"/><text x="380" y="657" font-size="34.83px" fill="#243c4e" text-anchor="middle" font-weight="normal">时域 H</text><text x="760" y="220" font-size="34.945055px" fill="#243c4e" text-anchor="start" font-weight="bold">H = 10</text><text x="760" y="280" font-size="34.945055px" fill="#a05d36" text-anchor="start" font-weight="bold">轨迹 IS / PDIS</text><text x="760" y="324" font-size="34.945055px" fill="#a05d36" text-anchor="start" font-weight="normal">方差 138.22036</text><text x="760" y="405" font-size="34.945055px" fill="#2c78aa" text-anchor="start" font-weight="bold" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">已知边际比</text><text x="760" y="449" font-size="34.945055px" fill="#2c78aa" text-anchor="start" font-weight="normal">方差 0.81</text><text x="760" y="518" font-size="33.54px" fill="#243c4e" text-anchor="start" font-weight="normal">贡献只取 0 或 1.8</text><text x="760" y="559" font-size="33.54px" fill="#4f7791" text-anchor="start" font-weight="normal">各以 0.5 概率出现</text><line x1="60" y1="704" x2="1140" y2="704" stroke="#dbe8eb" stroke-width="2"/><text x="60" y="793" font-size="33.54px" fill="#243c4e" text-anchor="start" font-weight="normal">本例状态边际比已知为 1；一般问题仍须估计目标访问分布。</text></g><desc> 两种估计都以 0.9 为期望；状态若不充分，直接删去历史权重可能有偏。</desc></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="903" fill="white"/><g transform="translate(-22.385414 -127.77571) scale(1.4776826)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g><g transform="translate(-22.385414 -139.78532) scale(1.4776826)"><use href="#plate-scene" clip-path="url(#plate-view-1)" xlink:href="#plate-scene"/></g></g></svg>

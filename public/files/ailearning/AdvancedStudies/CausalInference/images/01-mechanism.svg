<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1112.6709" viewBox="0 0 1440 1112.6709" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同向分层效应也可能总体反向</title><rect width="1440" height="1112.6709" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同向分层效应也可能总体反向</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="970.6709" viewBox="0 80.7293 1280 924.4485" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="80.729262" width="1280" height="924.448496" fill="#ffffff"/><title>层内两条线都向上，组成变化却能让总体线向下</title><rect width="1280" height="1080" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="27" fill="#1c2e40" text-anchor="start">同一成功率纵轴；圆的面积与该层人数成正比，每组共 200 人</text><line x1="160" y1="740" x2="770" y2="740" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="748" font-size="24" fill="#728d97" text-anchor="end">0</text><line x1="160" y1="636.0" x2="770" y2="636.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="644.0" font-size="24" fill="#728d97" text-anchor="end">0.2</text><line x1="160" y1="532.0" x2="770" y2="532.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="540.0" font-size="24" fill="#728d97" text-anchor="end">0.4</text><line x1="160" y1="428.0" x2="770" y2="428.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="436.0" font-size="24" fill="#728d97" text-anchor="end">0.6</text><line x1="160" y1="324.0" x2="770" y2="324.0" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="332.0" font-size="24" fill="#728d97" text-anchor="end">0.8</text><line x1="160" y1="220" x2="770" y2="220" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="135" y="228" font-size="24" fill="#728d97" text-anchor="end">1</text><text x="75" y="190" font-size="27" fill="#1c2e40" text-anchor="start">成功率</text><text x="250" y="800" font-size="28" fill="#1c2e40" text-anchor="middle">对照</text><text x="700" y="800" font-size="28" fill="#1c2e40" text-anchor="middle">处理</text><line x1="250" y1="636.0" x2="700" y2="584.0" stroke="#217292" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="636.0" r="10.73312629199899" fill="#217292" fill-opacity=".18" stroke="#217292" stroke-width="3"/><circle cx="250" cy="636.0" r="7" fill="#217292"/><circle cx="700" cy="584.0" r="32.19937887599697" fill="#217292" fill-opacity=".18" stroke="#217292" stroke-width="3"/><circle cx="700" cy="584.0" r="7" fill="#217292"/><line x1="250" y1="324.0" x2="700" y2="272.0" stroke="#bd6c41" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="324.0" r="32.19937887599697" fill="#bd6c41" fill-opacity=".18" stroke="#bd6c41" stroke-width="3"/><circle cx="250" cy="324.0" r="7" fill="#bd6c41"/><circle cx="700" cy="272.0" r="10.73312629199899" fill="#bd6c41" fill-opacity=".18" stroke="#bd6c41" stroke-width="3"/><circle cx="700" cy="272.0" r="7" fill="#bd6c41"/><path d="M250.00,355.20 L700.00,552.80" fill="none" stroke="#1c2e40" stroke-width="4"/><circle cx="250" cy="355.2" r="7" fill="#1c2e40"/><circle cx="700" cy="552.8" r="7" fill="#1c2e40"/><line x1="250" y1="480.0" x2="700" y2="428.0" stroke="#468e84" stroke-width="4" stroke-dasharray="10 8"/><circle cx="250" cy="480.0" r="7" fill="#468e84"/><circle cx="700" cy="428.0" r="7" fill="#468e84"/><text x="820" y="270" font-size="28" fill="#217292" text-anchor="start">低成功率层</text><text x="820" y="315" font-size="26" fill="#217292" text-anchor="start">0.2 → 0.3，增加 0.1</text><text x="820" y="390" font-size="28" fill="#bd6c41" text-anchor="start">高成功率层</text><text x="820" y="435" font-size="26" fill="#bd6c41" text-anchor="start">0.8 → 0.9，增加 0.1</text><text x="820" y="515" font-size="28" fill="#1c2e40" text-anchor="start">实际组内组成不同</text><text x="820" y="560" font-size="26" fill="#1c2e40" text-anchor="start">0.74 → 0.36，下降 0.38</text><text x="820" y="645" font-size="28" fill="#468e84" text-anchor="start">虚线：统一两层各半</text><text x="820" y="690" font-size="26" fill="#468e84" text-anchor="start">0.50 → 0.60，增加 0.10</text><text x="185" y="676.0" font-size="24" fill="#1c2e40" text-anchor="start">20 人</text><text x="745" y="604.0" font-size="24" fill="#1c2e40" text-anchor="start">180 人</text><text x="165" y="284.0" font-size="24" fill="#1c2e40" text-anchor="start">180 人</text><text x="745" y="260.0" font-size="24" fill="#1c2e40" text-anchor="start">20 人</text><line x1="60" y1="855" x2="1220" y2="855" stroke="#e0e5ec" stroke-width="2" stroke-dasharray=""/><text x="70" y="915" font-size="28" fill="#1c2e40" text-anchor="start">总体成功率是加权平均：层内概率和人群组成必须一起看。</text><text x="70" y="980" font-size="27" fill="#1c2e40" text-anchor="start">统一组成后得到相同目标的比较；其因果解释仍依赖合法调整条件。</text></g></svg></svg>

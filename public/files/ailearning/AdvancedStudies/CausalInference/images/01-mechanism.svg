<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="924.448" viewBox="0 80.729262 1280 924.448496" role="img"><rect id="offline-white-background" x="0" y="80.729262" width="1280" height="924.448496" fill="#ffffff"/><title>层内两条线都向上，组成变化却能让总体线向下</title><rect width="1280" height="1080" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="27" fill="#183944" text-anchor="start">同一成功率纵轴；圆的面积与该层人数成正比，每组共 200 人</text><line x1="160" y1="740" x2="770" y2="740" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="748" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="160" y1="636.0" x2="770" y2="636.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="644.0" font-size="24" fill="#71858b" text-anchor="end">0.2</text><line x1="160" y1="532.0" x2="770" y2="532.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="540.0" font-size="24" fill="#71858b" text-anchor="end">0.4</text><line x1="160" y1="428.0" x2="770" y2="428.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="436.0" font-size="24" fill="#71858b" text-anchor="end">0.6</text><line x1="160" y1="324.0" x2="770" y2="324.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="332.0" font-size="24" fill="#71858b" text-anchor="end">0.8</text><line x1="160" y1="220" x2="770" y2="220" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="135" y="228" font-size="24" fill="#71858b" text-anchor="end">1</text><text x="75" y="190" font-size="27" fill="#183944" text-anchor="start">成功率</text><text x="250" y="800" font-size="28" fill="#183944" text-anchor="middle">对照</text><text x="700" y="800" font-size="28" fill="#183944" text-anchor="middle">处理</text><line x1="250" y1="636.0" x2="700" y2="584.0" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="636.0" r="10.73312629199899" fill="#246b82" fill-opacity=".18" stroke="#246b82" stroke-width="3"/><circle cx="250" cy="636.0" r="7" fill="#246b82"/><circle cx="700" cy="584.0" r="32.19937887599697" fill="#246b82" fill-opacity=".18" stroke="#246b82" stroke-width="3"/><circle cx="700" cy="584.0" r="7" fill="#246b82"/><line x1="250" y1="324.0" x2="700" y2="272.0" stroke="#c0673e" stroke-width="3" stroke-dasharray=""/><circle cx="250" cy="324.0" r="32.19937887599697" fill="#c0673e" fill-opacity=".18" stroke="#c0673e" stroke-width="3"/><circle cx="250" cy="324.0" r="7" fill="#c0673e"/><circle cx="700" cy="272.0" r="10.73312629199899" fill="#c0673e" fill-opacity=".18" stroke="#c0673e" stroke-width="3"/><circle cx="700" cy="272.0" r="7" fill="#c0673e"/><path d="M250.00,355.20 L700.00,552.80" fill="none" stroke="#183944" stroke-width="4"/><circle cx="250" cy="355.2" r="7" fill="#183944"/><circle cx="700" cy="552.8" r="7" fill="#183944"/><line x1="250" y1="480.0" x2="700" y2="428.0" stroke="#47806a" stroke-width="4" stroke-dasharray="10 8"/><circle cx="250" cy="480.0" r="7" fill="#47806a"/><circle cx="700" cy="428.0" r="7" fill="#47806a"/><text x="820" y="270" font-size="28" fill="#246b82" text-anchor="start">低成功率层</text><text x="820" y="315" font-size="26" fill="#246b82" text-anchor="start">0.2 → 0.3，增加 0.1</text><text x="820" y="390" font-size="28" fill="#c0673e" text-anchor="start">高成功率层</text><text x="820" y="435" font-size="26" fill="#c0673e" text-anchor="start">0.8 → 0.9，增加 0.1</text><text x="820" y="515" font-size="28" fill="#183944" text-anchor="start">实际组内组成不同</text><text x="820" y="560" font-size="26" fill="#183944" text-anchor="start">0.74 → 0.36，下降 0.38</text><text x="820" y="645" font-size="28" fill="#47806a" text-anchor="start">虚线：统一两层各半</text><text x="820" y="690" font-size="26" fill="#47806a" text-anchor="start">0.50 → 0.60，增加 0.10</text><text x="185" y="676.0" font-size="24" fill="#183944" text-anchor="start">20 人</text><text x="745" y="604.0" font-size="24" fill="#183944" text-anchor="start">180 人</text><text x="165" y="284.0" font-size="24" fill="#183944" text-anchor="start">180 人</text><text x="745" y="260.0" font-size="24" fill="#183944" text-anchor="start">20 人</text><line x1="60" y1="855" x2="1220" y2="855" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="70" y="915" font-size="28" fill="#183944" text-anchor="start">总体成功率是加权平均：层内概率和人群组成必须一起看。</text><text x="70" y="980" font-size="27" fill="#183944" text-anchor="start">统一组成后得到相同目标的比较；其因果解释仍依赖合法调整条件。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>同向分层效应也可能总体反向</title><desc>设低风险层中对照和处理成功率为0.2与0.3，高风险层中为0.8与0.9。处理组90%来自低风险层，对照组90%来自高风险层，于是粗成功率分别为0.36与0.74，方向与每层比较相反。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">同向分层效应也可能总体反向</text><text x="85" y="190" font-size="22" fill="#16344c" text-anchor="start">观测成功率</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="540.0" width="108.3" height="70.0" fill="#118779" /><text x="189.16666666666666" y="524.0" font-size="24" fill="#16344c" text-anchor="middle">0.2</text><text x="189.16666666666666" y="680" font-size="19" fill="#16344c" text-anchor="middle">低层对照</text><rect x="291.7" y="505.0" width="108.3" height="105.0" fill="#d26724" /><text x="345.8333333333333" y="489.0" font-size="24" fill="#16344c" text-anchor="middle">0.3</text><text x="345.8333333333333" y="680" font-size="19" fill="#16344c" text-anchor="middle">低层处理</text><rect x="448.3" y="330.0" width="108.3" height="280.0" fill="#148671" /><text x="502.5" y="314.0" font-size="24" fill="#16344c" text-anchor="middle">0.8</text><text x="502.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">高层对照</text><rect x="605.0" y="295.0" width="108.3" height="315.0" fill="#118779" /><text x="659.1666666666666" y="279.0" font-size="24" fill="#16344c" text-anchor="middle">0.9</text><text x="659.1666666666666" y="680" font-size="19" fill="#16344c" text-anchor="middle">高层处理</text><rect x="761.7" y="351.0" width="108.3" height="259.0" fill="#d26724" /><text x="815.8333333333333" y="335.0" font-size="24" fill="#16344c" text-anchor="middle">0.74</text><text x="815.8333333333333" y="680" font-size="19" fill="#16344c" text-anchor="middle">总体对照</text><rect x="918.3" y="484.0" width="108.3" height="126.0" fill="#148671" /><text x="972.5" y="468.0" font-size="24" fill="#16344c" text-anchor="middle">0.36</text><text x="972.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">总体处理</text><text x="70" y="135" font-size="24" fill="#16344c" text-anchor="start">层内处理高0.1；总体因组分比例不同而反转。</text></g></svg>

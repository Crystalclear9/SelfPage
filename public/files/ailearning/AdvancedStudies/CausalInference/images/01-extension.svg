<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>不可识别时应报告多个相容世界</title><desc>在同一组观测治疗组与对照组结果下，未观测的潜在结果可以有多种补全方式。图用两名个体的已观测格与未观测格说明：仅看到每人实际接受处理后的结果，并不能同时看到其反事实结果。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">不可识别时应报告多个相容世界</text><text x="70" y="150" font-size="23" fill="#193e54" text-anchor="start">两人已观测：个体1接受处理且结果1；个体2未处理且结果0。</text><text x="70" y="220" font-size="25" fill="#193e54" text-anchor="start">世界A：效应1</text><text x="70" y="270" font-size="22" fill="#193e54" text-anchor="start">个体     Y(0)       Y(1)</text><rect x="190" y="310" width="130" height="100" rx="8" fill="#f9e4cf" stroke="#9cb8c8" /><text x="255" y="372" font-size="35" fill="#193e54" text-anchor="middle">0</text><rect x="340" y="310" width="130" height="100" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="405" y="372" font-size="35" fill="#193e54" text-anchor="middle">1</text><rect x="190" y="440" width="130" height="100" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="255" y="502" font-size="35" fill="#193e54" text-anchor="middle">0</text><rect x="340" y="440" width="130" height="100" rx="8" fill="#f9e4cf" stroke="#9cb8c8" /><text x="405" y="502" font-size="35" fill="#193e54" text-anchor="middle">1</text><text x="85" y="370" font-size="22" fill="#193e54" text-anchor="start">1</text><text x="85" y="500" font-size="22" fill="#193e54" text-anchor="start">2</text><text x="230" y="630" font-size="27" fill="#193e54" text-anchor="start">ATE=1</text><text x="640" y="220" font-size="25" fill="#193e54" text-anchor="start">世界B：效应0</text><text x="640" y="270" font-size="22" fill="#193e54" text-anchor="start">个体     Y(0)       Y(1)</text><rect x="760" y="310" width="130" height="100" rx="8" fill="#f9e4cf" stroke="#9cb8c8" /><text x="825" y="372" font-size="35" fill="#193e54" text-anchor="middle">1</text><rect x="910" y="310" width="130" height="100" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="975" y="372" font-size="35" fill="#193e54" text-anchor="middle">1</text><rect x="760" y="440" width="130" height="100" rx="8" fill="#d4ecdf" stroke="#9cb8c8" /><text x="825" y="502" font-size="35" fill="#193e54" text-anchor="middle">0</text><rect x="910" y="440" width="130" height="100" rx="8" fill="#f9e4cf" stroke="#9cb8c8" /><text x="975" y="502" font-size="35" fill="#193e54" text-anchor="middle">0</text><text x="655" y="370" font-size="22" fill="#193e54" text-anchor="start">1</text><text x="655" y="500" font-size="22" fill="#193e54" text-anchor="start">2</text><text x="800" y="630" font-size="27" fill="#193e54" text-anchor="start">ATE=0</text><text x="95" y="735" font-size="22" fill="#193e54" text-anchor="start">绿色为实际观测，橙色为反事实补全；两个世界与相同观测相容。</text></g></svg>

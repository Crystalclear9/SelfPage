<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="682" viewBox="103 70 1075 682" role="img" aria-labelledby="title desc"><rect x="103" y="70" width="1075" height="682" fill="#ffffff"/><title id="title">颜色和形状都在，绑定关系却可能已经丢失</title><desc id="desc">颜色和形状都在，绑定关系却可能已经丢失</desc><rect width="1280" height="800" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="640" y="115" font-size="32" fill="#203747" text-anchor="middle" font-weight="400">问题：红色物体是什么形状？</text><text x="320" y="180" font-size="29" fill="#203747" text-anchor="middle" font-weight="400">场景 A</text><circle cx="205" cy="280" r="62" fill="#c64942" stroke="#c64942" stroke-width="2"/><rect x="365" y="218" width="124" height="124" fill="#286da2" stroke="none" stroke-width="2"/><text x="320" y="400" font-size="30" fill="#c64942" text-anchor="middle" font-weight="400">答案：圆形</text><text x="320" y="458" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">左 / 右位置、颜色数、形状数均相同</text><path d="M320 485L640 565" fill="none" stroke="#728694" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="180" font-size="29" fill="#203747" text-anchor="middle" font-weight="400">场景 B</text><circle cx="845" cy="280" r="62" fill="#286da2" stroke="#286da2" stroke-width="2"/><rect x="1005" y="218" width="124" height="124" fill="#c64942" stroke="none" stroke-width="2"/><text x="960" y="400" font-size="30" fill="#c64942" text-anchor="middle" font-weight="400">答案：方形</text><text x="960" y="458" font-size="25" fill="#728694" text-anchor="middle" font-weight="400">左 / 右位置、颜色数、形状数均相同</text><path d="M960 485L640 565" fill="none" stroke="#728694" stroke-width="3" marker-end="url(#arrow)"/><rect x="155" y="590" width="970" height="80" fill="#edf4f9" stroke="none" stroke-width="2"/><text x="640" y="640" font-size="28" fill="#286da2" text-anchor="middle" font-weight="400">分别编码颜色、形状、位置，再平均：六个分量全为 0.5</text><text x="640" y="730" font-size="29" fill="#203747" text-anchor="middle" font-weight="400">相同摘要 + 相同问题 → 相同输出，无法同时答对这两个场景</text></g></svg>

<title id="fig-title">对象的属性组合有信息，边缘计数没有</title>
<desc id="fig-desc">交换同样两种形状和颜色的绑定，问题的正确答案改变。</desc>
<rect x="0" y="0" width="1200" height="687" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">要认出红色物体，必须保留颜色和形状的绑定</text>
<text x="84" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">场景 A</text>
<path d="M143 369 L161 333 L288 333 L270 369 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="212" cy="267" r="39" fill="url(#r)" stroke="#a74d3a" stroke-width="2"/>
<path d="M318 369 L336 333 L463 333 L445 369 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M350 230 L424 230 L424 304 L350 304 Z" fill="url(#t)" stroke="#166d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="426" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">问：红色物体是什么形状？</text>
<text x="84" y="481" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">答：圆形</text>
<text x="639" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">场景 B</text>
<path d="M698 369 L716 333 L843 333 L825 369 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M730 230 L804 230 L804 304 L730 304 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M873 369 L891 333 L1018 333 L1000 369 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="942" cy="267" r="39" fill="url(#t)" stroke="#166d75" stroke-width="2"/>
<text x="639" y="426" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">问：红色物体是什么形状？</text>
<text x="639" y="481" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">答：方形</text>
<path d="M75 523 L1125 523" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="579" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">分别统计颜色、形状、位置：两场景得到的六个分量都是 0.5。</text>
<text x="75" y="631" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">相同问题和相同摘要只能得到相同输出，无法同时答对。</text>
</svg>

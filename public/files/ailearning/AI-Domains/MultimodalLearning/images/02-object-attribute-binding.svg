"M320 485L640 565" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="180" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">场景 B</text><circle cx="845" cy="280" r="62" fill="#2479b3" stroke="#2479b3" stroke-width="2"/><rect x="1005" y="218" width="124" height="124" fill="#c34c45" stroke="none" stroke-width="2"/><text x="960" y="400" font-size="30" fill="#c34c45" text-anchor="middle" font-weight="400">答案：方形</text><text x="960" y="458" font-size="25" fill="#748e9f" text-anchor="middle" font-weight="400">左 / 右位置、颜色数、形状数均相同</text><path d="M960 485L640 565" fill="none" stroke="#748e9f" stroke-width="3" marker-end="url(#arrow)"/><rect x="155" y="590" width="970" height="80" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="640" y="640" font-size="28" fill="#2479b3" text-anchor="middle" font-weight="400">分别编码颜色、形状、位置，再平均：六个分量全为 0.5</text><text x="640" y="730" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">相同摘要 + 相同问题 → 相同输出，无法同时答对这两个场景</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img"><title>同一批图文分数，两个方向分配的是两份候选概率</title><rect width="1280" height="920" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">同一批图文分数，两个方向分配的是两份候选概率</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">分数 S = [[2, 0], [1, 3]] 已含温度；蓝色为候选 1，橙色为候选 2</text><text x="65" y="183" font-size="29" fill="#20343e" text-anchor="start">图像查询：每行单独归一化</text><text x="65" y="260" font-size="27" fill="#20343e" text-anchor="start">图 1</text><rect x="200" y="225" width="745.6775162811999" height="60" fill="#216983"/><text x="574.3387581406" y="264" font-size="28" fill="white" text-anchor="middle">0.881</text><line x1="200" y1="295" x2="945.6775162811999" y2="295" stroke="#20343e" stroke-width="5"/><rect x="948.6775162811999" y="225" width="98.32248371879992" height="60" fill="#bc5b32"/><text x="999.3387581405999" y="264" font-size="28" fill="white" text-anchor="middle">0.119</text><text x="1090" y="260" font-size="26" fill="#20343e" text-anchor="start">和 = 1</text><text x="65" y="360" font-size="27" fill="#20343e" text-anchor="start">图 2</text><rect x="200" y="325" width="98.32248371879992" height="60" fill="#216983"/><text x="250.66124185939995" y="364" font-size="28" fill="white" text-anchor="middle">0.119</text><rect x="301.3224837187999" y="325" width="745.6775162811999" height="60" fill="#bc5b32"/><text x="675.6612418593999" y="364" font-size="28" fill="white" text-anchor="middle">0.881</text><line x1="301.3224837187999" y1="395" x2="1046.9999999999998" y2="395" stroke="#20343e" stroke-width="5"/><text x="1090" y="360" font-size="26" fill="#20343e" text-anchor="start">和 = 1</text><text x="200" y="440" font-size="25" fill="#627882" text-anchor="start">下划线：已知正确配对；条段的长度 = 当前方向的候选概率</text><text x="65" y="483" font-size="29" fill="#20343e" text-anchor="start">文本查询：每列单独归一化</text><text x="65" y="560" font-size="27" fill="#20343e" text-anchor="start">文 1</text><rect x="200" y="525" width="618.3997918355042" height="60" fill="#216983"/><text x="510.6998959177521" y="564" font-size="28" fill="white" text-anchor="middle">0.731</text><line x1="200" y1="595" x2="818.3997918355042" y2="595" stroke="#20343e" stroke-width="5"/><rect x="821.3997918355042" y="525" width="225.60020816449583" height="60" fill="#bc5b32"/><text x="935.6998959177521" y="564" font-size="28" fill="white" text-anchor="middle">0.269</text><text x="1090" y="560" font-size="26" fill="#20343e" text-anchor="start">和 = 1</text><text x="65" y="660" font-size="27" fill="#20343e" text-anchor="start">文 2</text><rect x="200" y="625" width="37.31199220093177" height="60" fill="#216983"/><rect x="240.31199220093177" y="625" width="806.6880077990684" height="60" fill="#bc5b32"/><text x="645.1559961004659" y="664" font-size="28" fill="white" text-anchor="middle">0.953</text><line x1="240.31199220093177" y1="695" x2="1047.0000000000002" y2="695" stroke="#20343e" stroke-width="5"/><text x="1090" y="660" font-size="26" fill="#20343e" text-anchor="start">和 = 1</text><text x="200" y="740" font-size="25" fill="#627882" text-anchor="start">下划线：已知正确配对；条段的长度 = 当前方向的候选概率</text><text x="65" y="835" font-size="27" fill="#20343e" text-anchor="start">图→文平均损失 0.126928；文→图 0.180925；双向平均 0.153926。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1082" height="587" viewBox="22 70 1082 587" role="img"><rect x="22" y="70" width="1082" height="587" fill="#ffffff"/><title id="figure-title">时钟偏移是常量，时钟漂移会随时间累计</title><desc id="figure-desc">时钟偏移是常量，时钟漂移会随时间累计</desc><rect width="1200" height="680" fill="white"/><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#213447" text-anchor="start" font-weight="400">对应事件满足：视频时钟 = 1.001 × 音频时钟 + 0.2 s</text><line x1="165" y1="500.0" x2="1065" y2="500.0" stroke="#c8d7e3" stroke-width="1"/><text x="145" y="508.0" font-size="25" fill="#647789" text-anchor="end" font-weight="400">0</text><line x1="165" y1="337.5" x2="1065" y2="337.5" stroke="#c8d7e3" stroke-width="1"/><text x="145" y="345.5" font-size="25" fill="#647789" text-anchor="end" font-weight="400">50</text><line x1="165" y1="175.0" x2="1065" y2="175.0" stroke="#c8d7e3" stroke-width="1"/><text x="145" y="183.0" font-size="25" fill="#647789" text-anchor="end" font-weight="400">100</text><line x1="165.0" y1="500.0" x2="165.0" y2="508.0" stroke="#647789" stroke-width="2"/><text x="165.0" y="542.0" font-size="25" fill="#647789" text-anchor="middle" font-weight="400">0</text><line x1="615.0" y1="500.0" x2="615.0" y2="508.0" stroke="#647789" stroke-width="2"/><text x="615.0" y="542.0" font-size="25" fill="#647789" text-anchor="middle" font-weight="400">50</text><line x1="1065.0" y1="500.0" x2="1065.0" y2="508.0" stroke="#647789" stroke-width="2"/><text x="1065.0" y="542.0" font-size="25" fill="#647789" text-anchor="middle" font-weight="400">100</text><line x1="165" y1="175" x2="165" y2="50
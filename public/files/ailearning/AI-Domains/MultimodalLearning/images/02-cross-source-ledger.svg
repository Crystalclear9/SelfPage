roke-width="2"/><line x1="150" y1="646.25" x2="1080" y2="252.5" stroke="#2176a2" stroke-width="4"/><text x="1110" y="260.5" font-size="29" text-anchor="start" font-weight="normal" style="fill: #2176a2">正确绑定</text><circle cx="1080" cy="252.5" r="8" fill="#2176a2" stroke="none" stroke-width="1"/><line x1="150" y1="558.75" x2="1080" y2="427.5" stroke="#cd783d" stroke-width="4"/><text x="1110" y="435.5" font-size="29" text-anchor="start" font-weight="normal" style="fill: #cd783d">只交换键</text><circle cx="1080" cy="427.5" r="8" fill="#cd783d" stroke="none" stroke-width="1"/><line x1="150" y1="515" x2="1080" y2="515" stroke="#2d9499" stroke-width="4"/><text x="1110" y="523" font-size="29" text-anchor="start" font-weight="normal" style="fill: #2d9499">删除来源 2</text><circle cx="1080" cy="515" r="8" fill="#2d9499" stroke="none" stroke-width="1"/><text x="150" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">0</text><text x="460" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">1</text><text x="770" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">2</text><text x="1080" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill: #5b7a8d">3</text><text x="1080" y="805" font-size="28" text-anchor="end" font-weight="normal" style="fill: #5b7a8d">第二个值 v2</text><text x="80" y="880" font-size="31" text-anchor="start" font-weight="normal" style="fill: #173c5b">值为零仍保留分母质量；删除来源则重新归一化。</text></svg></svg>

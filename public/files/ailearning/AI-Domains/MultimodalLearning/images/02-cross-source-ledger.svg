<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="920" viewBox="0 0 1450 920" role="img"><title>改变被读取的值、错绑键值与删除来源产生不同函数</title><rect width="1450" height="920" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#17324d}</style><text x="80" y="65" font-size="32" text-anchor="start" font-weight="normal" style="fill:#17324d">只改变第二个值 v2；查询与原始键固定</text><text x="80" y="125" font-size="27" text-anchor="start" font-weight="normal" style="fill:#5b7180">读取输出</text><line x1="150" y1="690" x2="1080" y2="690" stroke="#e2ebef" stroke-width="1"/><text x="125" y="698" font-size="25" text-anchor="end" font-weight="normal" style="fill:#5b7180">0</text><line x1="150" y1="515" x2="1080" y2="515" stroke="#e2ebef" stroke-width="1"/><text x="125" y="523" font-size="25" text-anchor="end" font-weight="normal" style="fill:#5b7180">1</text><line x1="150" y1="340" x2="1080" y2="340" stroke="#e2ebef" stroke-width="1"/><text x="125" y="348" font-size="25" text-anchor="end" font-weight="normal" style="fill:#5b7180">2</text><line x1="150" y1="165" x2="1080" y2="165" stroke="#e2ebef" stroke-width="1"/><text x="125" y="173" font-size="25" text-anchor="end" font-weight="normal" style="fill:#5b7180">3</text><line x1="150" y1="690" x2="1080" y2="690" stroke="#5b7180" stroke-width="2"/><line x1="150" y1="150" x2="150" y2="690" stroke="#5b7180" stroke-width="2"/><line x1="150" y1="646.25" x2="1080" y2="252.5" stroke="#246d91" stroke-width="4"/><text x="1110" y="260.5" font-size="29" text-anchor="start" font-weight="normal" style="fill:#246d91">正确绑定</text><circle cx="1080" cy="252.5" r="8" fill="#246d91" stroke="none" stroke-width="1"/><line x1="150" y1="558.75" x2="1080" y2="427.5" stroke="#d17839" stroke-width="4"/><text x="1110" y="435.5" font-size="29" text-anchor="start" font-weight="normal" style="fill:#d17839">只交换键</text><circle cx="1080" cy="427.5" r="8" fill="#d17839" stroke="none" stroke-width="1"/><line x1="150" y1="515" x2="1080" y2="515" stroke="#2f897f" stroke-width="4"/><text x="1110" y="523" font-size="29" text-anchor="start" font-weight="normal" style="fill:#2f897f">删除来源 2</text><circle cx="1080" cy="515" r="8" fill="#2f897f" stroke="none" stroke-width="1"/><text x="150" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">0</text><text x="460" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">1</text><text x="770" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">2</text><text x="1080" y="740" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">3</text><text x="1080" y="805" font-size="28" text-anchor="end" font-weight="normal" style="fill:#5b7180">第二个值 v2</text><text x="80" y="880" font-size="31" text-anchor="start" font-weight="normal" style="fill:#17324d">值为零仍保留分母质量；删除来源则重新归一化。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img"><title>同一次跨注意力：先算归一化，再逐个检查身份和可见性</title><rect width="1440" height="1110" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="44" y="55" font-size="34" fill="#203247" text-anchor="start" font-weight="700">同一次跨注意力：先算归一化，再逐个检查身份和可见性</text>
<text x="50" y="110" font-size="28" fill="#203247" text-anchor="start">实验二：q=[1]，键 k=[0, ln 3]，值 v=[1,3]，键宽度 dk=1。</text>
<rect x="50" y="160" width="390" height="170" fill="white" stroke="#2563a6" stroke-width="2" rx="12"/>
<text x="70" y="205" font-size="28" fill="#2563a6" text-anchor="start" font-weight="700">① 来源打分</text>
<text x="70" y="255" font-size="26" fill="#203247" text-anchor="start">点积分数 = [0, ln 3]</text>
<text x="70" y="302" font-size="26" fill="#203247" text-anchor="start">exp 分数 = [1,3]</text>
<rect x="525" y="160" width="390" height="170" fill="white" stroke="#d87320" stroke-width="2" rx="12"/>
<text x="545" y="205" font-size="28" fill="#d87320" text-anchor="start" font-weight="700">② 沿来源归一化</text>
<text x="545" y="255" font-size="26" fill="#203247" text-anchor="start">分母 = 1+3 = 4</text>
<text x="545" y="302" font-size="26" fill="#203247" text-anchor="start">权重 = [0.25,0.75]</text>
<rect x="1000" y="160" width="390" height="170" fill="white" stroke="#27816c" stroke-width="2" rx="12"/>
<text x="1020" y="205" font-size="28" fill="#27816c" text-anchor="start" font-weight="700">③ 加权读取值</text>
<text x="1020" y="255" font-size="26" fill="#203247" text-anchor="start">0.25×1 + 0.75×3</text>
<text x="1020" y="302" font-size="26" fill="#203247" text-anchor="start">输出 = 2.5</text>
<line x1="450" y1="245" x2="510" y2="245" stroke="#6b7785" stroke-width="3"/>
<polyline points="498.026,250.062 510.000,245.000 498.026,239.938" fill="none" stroke="#6b7785" stroke-width="3" opacity="1"/>
<line x1="925" y1="245" x2="985" y2="245" stroke="#6b7785" stroke-width="3"/>
<polyline points="973.026,250.062 985.000,245.000 973.026,239.938" fill="none" stroke="#6b7785" stroke-width="3" opacity="1"/>
<text x="50" y="400" font-size="28" fill="#203247" text-anchor="start" font-weight="700">固定查询与原始来源，只改变一项，跟踪同一个输出。</text>
<text x="65" y="465" font-size="28" fill="#203247" text-anchor="start" font-weight="700">对照操作</text>
<text x="540" y="465" font-size="28" fill="#203247" text-anchor="start" font-weight="700">实际打分</text>
<text x="855" y="465" font-size="28" fill="#203247" text-anchor="start" font-weight="700">权重</text>
<text x="1210" y="465" font-size="28" fill="#203247" text-anchor="start" font-weight="700">输出</text>
<rect x="48" y="499" width="1344" height="58" fill="#f7f9fc" stroke="none" stroke-width="2" rx="4"/>
<text x="65" y="535" font-size="26" fill="#203247" text-anchor="start">键、值与掩码一起交换</text>
<text x="540" y="535" font-size="26" fill="#203247" text-anchor="start">[ln 3,0]</text>
<text x="855" y="535" font-size="26" fill="#203247" text-anchor="start">[0.75,0.25]</text>
<text x="1210" y="535" font-size="26" fill="#27816c" text-anchor="start">2.5</text>
<text x="65" y="607" font-size="26" fill="#203247" text-anchor="start">只交换键，值仍为 [1,3]</text>
<text x="540" y="607" font-size="26" fill="#203247" text-anchor="start">[ln 3,0]</text>
<text x="855" y="607" font-size="26" fill="#203247" text-anchor="start">[0.75,0.25]</text>
<text x="1210" y="607" font-size="26" fill="#d87320" text-anchor="start">1.5</text>
<rect x="48" y="643" width="1344" height="58" fill="#f7f9fc" stroke="none" stroke-width="2" rx="4"/>
<text x="65" y="679" font-size="26" fill="#203247" text-anchor="start">屏蔽第二来源</text>
<text x="540" y="679" font-size="26" fill="#203247" text-anchor="start">[0,−∞]</text>
<text x="855" y="679" font-size="26" fill="#203247" text-anchor="start">[1,0]</text>
<text x="1210" y="679" font-size="26" fill="#2563a6" text-anchor="start">1</text>
<text x="65" y="751" font-size="26" fill="#203247" text-anchor="start">第二个值清零，但键不屏蔽</text>
<text x="540" y="751" font-size="26" fill="#203247" text-anchor="start">[0,ln 3]</text>
<text x="855" y="751" font-size="26" fill="#203247" text-anchor="start">[0.25,0.75]</text>
<text x="1210" y="751" font-size="26" fill="#d87320" text-anchor="start">0.25</text>
<rect x="48" y="787" width="1344" height="58" fill="#f7f9fc" stroke="none" stroke-width="2" rx="4"/>
<text x="65" y="823" font-size="26" fill="#203247" text-anchor="start">第二个键和值都清零</text>
<text x="540" y="823" font-size="26" fill="#203247" text-anchor="start">[0,0]</text>
<text x="855" y="823" font-size="26" fill="#203247" text-anchor="start">[0.5,0.5]</text>
<text x="1210" y="823" font-size="26" fill="#d87320" text-anchor="start">0.5</text>
<text x="65" y="895" font-size="26" fill="#203247" text-anchor="start">屏蔽全部来源</text>
<text x="540" y="895" font-size="26" fill="#203247" text-anchor="start">[−∞,−∞]</text>
<text x="855" y="895" font-size="26" fill="#203247" text-anchor="start">未定义</text>
<text x="1210" y="895" font-size="26" fill="#d87320" text-anchor="start">报错</text>
<rect x="48" y="982" width="1344" height="83" fill="#edf4fc" stroke="#2563a6" stroke-width="2" rx="12"/>
<text x="75" y="1030" font-size="28" fill="#203247" text-anchor="start">共同维护键、值、位置、身份与掩码；概率和为 1 不能证明来源绑定正确。</text>
</g></svg>

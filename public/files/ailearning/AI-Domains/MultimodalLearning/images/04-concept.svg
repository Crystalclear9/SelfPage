<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>音视频时间对齐的共同时间轴</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">音视频时间对齐的共同时间轴</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">回到共同时间轴，才能找到相邻的跨模态位置</text><path d="M180,260 L1020,260" stroke="#64788b" stroke-width="2" fill="none" /><text x="60" y="268" font-size="26" fill="#19344d" text-anchor="start">视频</text><circle cx="200" cy="260" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="200" y="310" font-size="24" fill="#19344d" text-anchor="middle">0ms</text><text x="200" y="225" font-size="24" fill="#19344d" text-anchor="middle">索引0</text><circle cx="600" cy="260" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="600" y="310" font-size="24" fill="#19344d" text-anchor="middle">40ms</text><text x="600" y="225" font-size="24" fill="#19344d" text-anchor="middle">索引1</text><circle cx="1000" cy="260" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="1000" y="310" font-size="24" fill="#19344d" text-anchor="middle">80ms</text><text x="1000" y="225" font-size="24" fill="#19344d" text-anchor="middle">索引2</text><path d="M180,470 L1020,470" stroke="#64788b" stroke-width="2" fill="none" /><text x="60" y="478" font-size="26" fill="#19344d" text-anchor="start">音频</text><circle cx="200" cy="470" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="200" y="520" font-size="24" fill="#19344d" text-anchor="middle">0ms</text><text x="200" y="435" font-size="24" fill="#19344d" text-anchor="middle">索引0</text><circle cx="400" cy="470" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="400" y="520" font-size="24" fill="#19344d" text-anchor="middle">20ms</text><text x="400" y="435" font-size="24" fill="#19344d" text-anchor="middle">索引1</text><circle cx="600" cy="470" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="600" y="520" font-size="24" fill="#19344d" text-anchor="middle">40ms</text><text x="600" y="435" font-size="24" fill="#19344d" text-anchor="middle">索引2</text><circle cx="800" cy="470" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="800" y="520" font-size="24" fill="#19344d" text-anchor="middle">60ms</text><text x="800" y="435" font-size="24" fill="#19344d" text-anchor="middle">索引3</text><circle cx="1000" cy="470" r="15" fill="#eaf2fa" stroke="#2166ac" stroke-width="2" /><text x="1000" y="520" font-size="24" fill="#19344d" text-anchor="middle">80ms</text><text x="1000" y="435" font-size="24" fill="#19344d" text-anchor="middle">索引4</text><path d="M200,280 L200,450" stroke="#d66b28" stroke-width="2" fill="none" /><path d="M600,280 L600,450" stroke="#d66b28" stroke-width="2" fill="none" /><path d="M1000,280 L1000,450" stroke="#d66b28" stroke-width="2" fill="none" /></g></svg>

<text x="89" y="510.0" font-size="24" fill="#63788c" text-anchor="end" font-weight="400">0.2</text>
<line x1="103" y1="414.0" x2="595" y2="414.0" stroke="#dce5ed" stroke-width="2"/>
<text x="89" y="422.0" font-size="24" fill="#63788c" text-anchor="end" font-weight="400">0.4</text>
<line x1="103" y1="326.0" x2="595" y2="326.0" stroke="#dce5ed" stroke-width="2"/>
<text x="89" y="334.0" font-size="24" fill="#63788c" text-anchor="end" font-weight="400">0.6</text>
<line x1="103.0" y1="590" x2="103.0" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="103.0" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">2</text>
<line x1="201.4" y1="590" x2="201.4" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="201.4" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">4</text>
<line x1="299.8" y1="590" x2="299.8" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="299.8" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">8</text>
<line x1="398.2" y1="590" x2="398.2" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="398.2" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">16</text>
<line x1="496.6" y1="590" x2="496.6" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="496.6" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">32</text>
<line x1="595.0" y1="590" x2="595.0" y2="597" stroke="#63788c" stroke-width="2"/>
<text x="595.0" y="629" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">64</text>

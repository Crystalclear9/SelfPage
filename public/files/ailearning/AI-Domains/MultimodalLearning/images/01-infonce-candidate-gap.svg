<text x="112" y="219" font-size="25" fill="#213447" text-anchor="start" font-weight="400">蓝：最优下界　橙：真实互信息</text>
<text x="349" y="675" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">候选数 B（对数刻度）</text>
<text x="678" y="161" font-size="28" fill="#213447" text-anchor="start" font-weight="700">② 换一种负例规则，界可失效</text>
<text x="678" y="222" font-size="25" fill="#63788c" text-anchor="start" font-weight="400">固定查询 X = 1，候选数 B = 4</text>
<text x="678" y="269" font-size="24" fill="#213447" text-anchor="start" font-weight="400">独立抽样的一种结果</text>
<rect x="685" y="292" width="82" height="61" rx="10" fill="#dceaf6" stroke="none"/>
<text x="726" y="333" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">1</text>
<rect x="797" y="292" width="82" height="61" rx="10" fill="#edf1f5" stroke="none"/>
<text x="838" y="333" font-size="29" fill="#63788c" text-anchor="middle" font-weight="700">0</text>
<rect x="909" y="292" width="82" height="61" rx="10" fill="#dceaf6" stroke="none"/>
<text x="950" y="333" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">1</text>
<rect x="1021" y="292" width="82" height="61" rx="10" fill="#edf1f5" stroke="none"/>
<text x="1062" y="333" font-size="29" fill="#63788c" text-anchor="middle" font-weight="700">0</text>
<text x="678" y="437" font-size="24" fill="#213447" text-anchor="start" font-weight="400">只允许取与查询不同的负例</text>
<rect x="685" y="460" width="82" height="61" rx="10" fill="#dceaf6" stroke="none"/>
<text x="726" y="501" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">1</text>
<rect x="797" y="460" width="82" height="61" rx="10" fill="#edf1f5" stroke="none"/>
<text x="838" y="501" font-size="29" fill="#63788c" text-anchor="middle" font-weight="700">0</text>
<rect x="909" y="460" width="82" height="61" rx="10" fill="#edf1f5" stroke="none"/>
<text x="950" y="501" font-size="29" fill="#63788c" text-anchor="middle" font-weight="700">0</text>
<rect x="1021" y="460" width="82" height="61" rx="10" fill="#edf1f5" stroke="none"/>
<text x="1062" y="501" font-size="29" fill="#63788c" text-anchor="middle" font-weight="700">0</text>
<text x="685" y="401" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">两个 1 无法分辨原始正例身份</text>
<text x="685" y="568" font-size="25" fill="#c87536" text-anchor="start" font-weight="400">最优损失 0，log 4 ≈ 1.3863</text>
<text x="685" y="613" font-size="24" fill="#c87536" text-anchor="start" font-weight="700">超过 log 2，不能再称原互信息下界</text>
<rect x="44" y="718" width="1112" height="66" rx="12" fill="#eef4f9" stroke="none"/>
<text x="65" y="761" font-size="26" fill="#213447" text-anchor="start" font-weight="400">损失公式可以继续用于训练；一旦候选生成规则改变，其信息量解释需要重新证明。</text>
</g></svg>
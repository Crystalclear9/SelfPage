<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">InfoNCE的候选数和负采样机制</title><desc id="desc">二元等概率X且正例Y等于X，真实互信息为log2。独立边缘负采样下候选数增大使最优下界逐渐逼近log2；改用仅不同值负例时logB减损失不再是该互信息下界。</desc>
<rect width="1200" height="820" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="54" font-size="34" fill="#213447" text-anchor="start" font-weight="700">InfoNCE：候选越多，为什么仍要检查负采样？</text>
<text x="44" y="99" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">X 等概率取 0 或 1，正例 Y = X；真实互信息始终为 log 2 ≈ 0.6931</text>
<text x="44" y="161" font-size="28" fill="#213447" text-anchor="start" font-weight="700">① 独立边缘负采样：有限候选缺口</text>

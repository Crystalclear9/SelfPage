<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="618" viewBox="0 0 1330 618" role="img" aria-labelledby="label detail"><title id="label">单位球上圆点表示图像向量，菱形表示文本向量，放大框对比匹配与不匹配的夹角</title><desc id="detail">归一后的向量在单位圆截面上。匹配夹角 25 度，另一对为 76 度。温度不改变几何位置。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="618" fill="white" stroke="none" stroke-width="1.6"/><text x="341" y="63" fill="#196f77" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">匹配对</text><circle cx="341" cy="330" r="160" stroke="#657682" stroke-width="1.5" fill="url(#wash-gray)"/><line x1="341" y1="330" x2="491.12862777" y2="306.22196131" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="341" y1="330" x2="467.01371103" y2="245.00267867" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="499.0301345" cy="304.97048559" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><polygon points="473.646,230.529 483.646,240.529 473.646,250.529 463.646,240.529" stroke="#196f77" fill="white" stroke-width="1.65" stroke-linejoin="round"/><path d="M 390.3844170297569 322.17827674798843 A 50 50 0 0 0 382.4518786277521 302.04035482646265" stroke="#196f77" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="423" y="284" fill="#196f77" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">25°</text><text x="341" y="554" fill="#196f77" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">夹角更小，余弦更大</text><text x="995" y="63" fill="#a84b3b" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">非匹配对</text><circle cx="995" cy="330" r="160" stroke="#657682" stroke-width="1.5" fill="url(#wash-gray)"/><line x1="995" y1="330" x2="1145.12862777" y2="306.22196131" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="995" y1="330" x2="1008.2476729" y2="178.57840589" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-coral)"/><circle cx="1153.0301345" cy="304.97048559" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><polygon points="1008.94,160.609 1018.94,170.609 1008.94,180.609 998.945,170.609" stroke="#a84b3b" fill="white" stroke-width="1.65" stroke-linejoin="round"/><path d="M 1044.3844170297568 322.17827674798843 A 50 50 0 0 0 999.357787137383 280.1902650954127" stroke="#a84b3b" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1077" y="284" fill="#a84b3b" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">76°</text><text x="995" y="554" fill="#a84b3b" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">夹角更大，余弦更小</text></svg>
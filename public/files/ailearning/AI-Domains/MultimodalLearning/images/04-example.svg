<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title desc"><title id="title">DTW：从真实序列到平方距离和零代价路径</title><desc id="desc">x零一二，y零一一二。最优路径是一一、二二、二三、三四，总代价零，重复的是第二位置。</desc><rect width="1320" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="40" y="55" font-size="35" fill="#20343d" text-anchor="start" font-weight="700">DTW：在数值相同的位置之间，追踪局部停顿</text>
<text x="40" y="108" font-size="28" fill="#647b88" text-anchor="start" font-weight="400">本章实验三：x = (0, 1, 2)，y = (0, 1, 1, 2)</text>
<text x="50" y="180" font-size="28" fill="#20343d" text-anchor="start" font-weight="700">序列 x</text>
<text x="50" y="485" font-size="28" fill="#20343d" text-anchor="start" font-weight="700">序列 y</text>
<line x1="155" y1="245" x2="120" y2="389" stroke="#2867ac" stroke-width="3"/>
<line x1="340" y1="245" x2="255" y2="389" stroke="#2867ac" stroke-width="3"/>
<line x1="340" y1="245" x2="390" y2="389" stroke="#2867ac" stroke-width="3"/>
<line x1="525" y1="245" x2="525" y2="389" stroke="#2867ac" stroke-width="3"/>
<circle cx="155" cy="218" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="155" y="229" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">0</text>
<circle cx="340" cy="218" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="340" y="229" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<circle cx="525" cy="218" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="525" y="229" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<circle cx="120" cy="418" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="120" y="429" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">0</text>
<circle cx="255" cy="418" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="255" y="429" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<circle cx="390" cy="418" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="390" y="429" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<circle cx="525" cy="418" r="29" fill="white" stroke="#2867ac" stroke-width="3"/>
<text x="525" y="429" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<text x="340" y="555" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">x 的第二点，匹配 y 的第二、三点</text>
<text x="770" y="180" font-size="28" fill="#20343d" text-anchor="start" font-weight="700">平方距离 (x − y)²</text>
<text x="841.0" y="220" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">y=0</text>
<text x="943.0" y="220" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">y=1</text>
<text x="1045.0" y="220" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">y=1</text>
<text x="1147.0" y="220" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">y=2</text>
<text x="770" y="307" font-size="26" fill="#20343d" text-anchor="end" font-weight="400">x=0</text>
<rect x="790" y="245" width="102" height="102" fill="#edf3f8" stroke="white" stroke-width="2"/>
<rect x="892" y="245" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="994" y="245" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="1096" y="245" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<text x="770" y="409" font-size="26" fill="#20343d" text-anchor="end" font-weight="400">x=1</text>
<rect x="790" y="347" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="892" y="347" width="102" height="102" fill="#edf3f8" stroke="white" stroke-width="2"/>
<rect x="994" y="347" width="102" height="102" fill="#edf3f8" stroke="white" stroke-width="2"/>
<rect x="1096" y="347" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<text x="770" y="511" font-size="26" fill="#20343d" text-anchor="end" font-weight="400">x=2</text>
<rect x="790" y="449" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="892" y="449" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="994" y="449" width="102" height="102" fill="#f7f8fa" stroke="white" stroke-width="2"/>
<rect x="1096" y="449" width="102" height="102" fill="#edf3f8" stroke="white" stroke-width="2"/>
<line x1="841" y1="296" x2="943" y2="398" stroke="#cd7c2a" stroke-width="5"/>
<line x1="943" y1="398" x2="1045" y2="398" stroke="#cd7c2a" stroke-width="5"/>
<line x1="1045" y1="398" x2="1147" y2="500" stroke="#cd7c2a" stroke-width="5"/>
<circle cx="841" cy="296" r="29" fill="white" stroke="#cd7c2a" stroke-width="3"/>
<text x="841" y="307" font-size="30" fill="#cd7c2a" text-anchor="middle" font-weight="400">0</text>
<text x="943" y="307" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<text x="1045" y="307" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<text x="1147" y="307" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">4</text>
<text x="841" y="409" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<circle cx="943" cy="398" r="29" fill="white" stroke="#cd7c2a" stroke-width="3"/>
<text x="943" y="409" font-size="30" fill="#cd7c2a" text-anchor="middle" font-weight="400">0</text>
<circle cx="1045" cy="398" r="29" fill="white" stroke="#cd7c2a" stroke-width="3"/>
<text x="1045" y="409" font-size="30" fill="#cd7c2a" text-anchor="middle" font-weight="400">0</text>
<text x="1147" y="409" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<text x="841" y="511" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">4</text>
<text x="943" y="511" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<text x="1045" y="511" font-size="30" fill="#647b88" text-anchor="middle" font-weight="400">1</text>
<circle cx="1147" cy="500" r="29" fill="white" stroke="#cd7c2a" stroke-width="3"/>
<text x="1147" y="511" font-size="30" fill="#cd7c2a" text-anchor="middle" font-weight="400">0</text>
<text x="790" y="616" font-size="28" fill="#cd7c2a" text-anchor="start" font-weight="400">路径代价：0 + 0 + 0 + 0 = 0</text>
<line x1="40" y1="665" x2="1280" y2="665" stroke="#a9b8be" stroke-width="2"/>
<text x="40" y="724" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">重复一次对应，可表达局部伸缩；不是任意交换顺序。</text>
<text x="40" y="785" font-size="28" fill="#647b88" text-anchor="start" font-weight="400">零代价只说明这份代价函数匹配，不能证明物理同步唯一。</text></g></svg>

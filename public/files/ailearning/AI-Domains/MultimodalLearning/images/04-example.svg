<text x="790" y="616" font-size="28" fill="#c9772e" text-anchor="start" font-weight="400">路径代价：0 + 0 + 0 + 0 = 0</text>
<line x1="40" y1="665" x2="1280" y2="665" stroke="#abb5c3" stroke-width="2"/>
<text x="40" y="724" font-size="30" fill="#1c2e41" text-anchor="start" font-weight="400">重复一次对应，可表达局部伸缩；不是任意交换顺序。</text>
<text x="40" y="785" font-size="28" fill="#648496" text-anchor="start" font-weight="400">零代价只说明这份代价函数匹配，不能证明物理同步唯一。</text></g></svg></svg>

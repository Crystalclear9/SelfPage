<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="852" viewBox="0 0 1360 852" role="img" aria-labelledby="plate-title plate-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 775.200000 485.640000"/>
<view id="textbook-detail-1-2" viewBox="584.800000 0.000000 775.200000 485.640000"/>

  <line x1="506" y1="147" x2="570" y2="147" stroke="#196f77" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="849,181 995,181 1021,114 875,114" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="935" y="157.73" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31" fill="#196f77" text-anchor="middle">× 4</text>
  <line x1="770" y1="147" x2="834" y2="147" stroke="#196f77" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="1126,181 1272,181 1298,114 1152,114" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="1212" y="157.73" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31" fill="#a84b3b" text-anchor="middle">y = 24</text>
  <line x1="1034" y1="147" x2="1111" y2="147" stroke="#196f77" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="408" y="228" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="25" fill="#196f77" text-anchor="middle">前端 a</text>
  <text x="935" y="228" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="25" fill="#196f77" text-anchor="middle">后端 b</text>
  <text x="673" y="228" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="25" fill="#655184" text-anchor="middle">固定中间乘数 f</text>
  <text x="814" y="211" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#196f77" text-anchor="middle">h = 6</text>
  <text x="351" y="291" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" fill="#196f77" text-anchor="middle">冻结参数，梯度仍通过</text>
  <line x1="1212" y1="342" x2="970" y2="342" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="938" y="382" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#196f77" text-anchor="middle">后端梯度 = 144</text>
  <line x1="902" y1="342" x2="708" y2="342" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <line x1="630" y1="342" x2="443" y2="342" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="403" y="382" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#196f77" text-anchor="middle">前端梯度 = 288</text>
  <text x="351" y="475" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" fill="#a84b3b" text-anchor="middle">在 h 处截断梯度</text>
  <line x1="1212" y1="526" x2="970" y2="526" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <text x="938" y="566" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#a84b3b" text-anchor="middle">后端梯度 = 144</text>
  <line x1="907" y1="526" x2="783" y2="526" stroke="#a84b3b" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-coral)" stroke-dasharray="6 6"/>
  <line x1="774" y1="514" x2="774" y2="538" stroke="#a84b3b" stroke-width="2.7" stroke-linecap="round"/>
  <text x="401" y="565" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" fill="#a84b3b" text-anchor="middle">前端梯度缺失</text>
  <line x1="91" y1="654" x2="1270" y2="654" stroke="#d4e0e4" stroke-width="1.4" stroke-linecap="round"/>
  <text x="678" y="710" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">前端改为 1，缓存旧表示会用错值</text>
  <text x="418" y="783" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#196f77" text-anchor="middle">重算：h = 3，输出 12</text>
  <text x="983" y="783" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#a84b3b" text-anchor="middle">复用旧值：h = 6，输出 24</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img"><title>来源的总梯度：内容路径与路由路径可以方向相反</title><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">来源的总梯度：内容路径与路由路径可以方向相反</text><text x="60" y="112" font-size="26" fill="#19343e" text-anchor="start">单查询 q = 1；同一标量来源同时作键和值；y1 = 0，y2 = 3</text><text x="115" y="190" font-size="29" fill="#276a80" text-anchor="start">来源 1：键 0，值 0</text><text x="115" y="260" font-size="29" fill="#5d8c79" text-anchor="start">来源 2：键 3，值 3</text><line x1="380" y1="200" x2="575" y2="350" stroke="#276a80" stroke-width="4"/><path d="M563.15,348.14 L575.00,350.00 L570.16,339.02" fill="none" stroke="#276a80" stroke-width="4"/><line x1="380" y1="270" x2="575" y2="350" stroke="#5d8c79" stroke-width="4"/><path d="M563.07,351.33 L575.00,350.00 L567.44,340.68" fill="none" stroke="#5d8c79" stroke-width="4"/><text x="650" y="220" font-size="27" fill="#19343e" text-anchor="start">softmax 权重</text><text x="650" y="275" font-size="28" fill="#19343e" text-anchor="start">(0.047426, 0.952574)</text><text x="650" y="350" font-size="30" fill="#19343e" text-anchor="start">输出 o = 2.857722</text><line x1="60" y1="405" x2="1220" y2="405" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="465" font-size="29" fill="#19343e" text-anchor="start">只改变来源 1</text><line x1="760" y1="485" x2="760" y2="536" stroke="#74888d" stroke-width="2"/><rect x="760" y="500" width="90.10915903737688" height="30" fill="#276a80"/><text x="60" y="525" font-size="28" fill="#19343e" text-anchor="start">值路径：提高被读取的值</text><text x="1090" y="525" font-size="28" fill="#19343e" text-anchor="middle">+0.047426</text><line x1="760" y1="565" x2="760" y2="616" stroke="#74888d" stroke-width="2"/><rect x="502.4930395338008" y="580" width="257.5069604661992" height="30" fill="#c2673f"/><text x="60" y="605" font-size="28" fill="#19343e" text-anchor="start">键路径：更多权重转向低值</text><text x="1090" y="605" font-size="28" fill="#19343e" text-anchor="middle">-0.135530</text><line x1="760" y1="645" x2="760" y2="696" stroke="#74888d" stroke-width="2"/><rect x="592.6021985711777" y="660" width="167.39780142882228" height="30" fill="#c2673f"/><text x="60" y="685" font-size="28" fill="#19343e" text-anchor="start">总导数：两条路径相加</text><text x="1090" y="685" font-size="28" fill="#19343e" text-anchor="middle">-0.088104</text><text x="60" y="755" font-size="27" fill="#19343e" text-anchor="start">权重为正，也不保证该来源增大时输出增大；必须通过完整计算图求导</text></g></svg>

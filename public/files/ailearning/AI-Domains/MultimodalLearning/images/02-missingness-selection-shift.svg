<text x="990.75" y="226" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.500</text>
<text x="732" y="266" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">正 25 条，负 25 条</text>
<text x="637" y="340" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">M = 0</text>
<rect x="732" y="312" width="172.5" height="42" fill="#ecf6f6" opacity="1"/>
<path d="M732 312 L904.5 312" fill="none" stroke="#166d75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="818.25" y="341" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.500</text>
<rect x="904.5" y="312" width="172.5" height="42" fill="#fbede8" opacity="1"/>
<path d="M904.5 312 L1077 312" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="990.75" y="341" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.500</text>
<text x="732" y="381" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">正 25 条，负 25 条</text>
<text x="637" y="503" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">冻结规则准确率 50%</text>
<path d="M75 547 L1125 547" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="602" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">M = 1 就判正。蓝绿与橙色长度对应正、负例比例；每行 50 条。</text>
<text x="75" y="652" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">两处都可以补零，但补零无法让部署保留训练时的缺失机制。</text>
</svg>

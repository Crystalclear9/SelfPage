<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1006" viewBox="0 0 1440 1006" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同样的零内容在状态相关与独立采集下具有不同的掩码条件概率</title><rect width="1440" height="1006" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同样的零内容在状态相关与独立采集下具有不同的掩码条件概率</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="864" viewBox="0 0 1400 900" role="img" x="48" y="106" overflow="hidden"><title>缺失掩码本身可以预测标签，也会随采集规则失效</title><rect width="1400" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#1a2a3b" text-anchor="start" font-weight="normal">缺失掩码本身可以预测标签，也会随采集规则失效</text><text x="60" y="112" font-size="26" fill="#738d99" text-anchor="start" font-weight="normal">每组均有 50 个正例、50 个负例；模态内容恒为 0，只有可用性 M 改变</text><text x="70" y="180" font-size="30" fill="#1a2a3b" text-anchor="start" font-weight="normal">训练：按状态选择采集</text><text x="70" y="236" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">M=1</text><rect x="70" y="250" width="450.0" height="50" fill="#227292" stroke="none"/><rect x="520.0" y="250" width="50.0" height="50" fill="#bd6a3f" stroke="none"/><text x="70" y="348" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">正例 45；负例 5</text><text x="70" y="388" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">P(Y=1 | M=1) = 0.9</text><text x="70" y="426" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">M=0</text><rect x="70" y="440" width="50.0" height="50" fill="#227292" stroke="none"/><rect x="120.0" y="440" width="450.0" height="50" fill="#bd6a3f" stroke="none"/><text x="70" y="538" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">正例 5；负例 45</text><text x="70" y="578" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">P(Y=1 | M=0) = 0.1</text><text x="70" y="664" font-size="26" fill="#1a2a3b" text-anchor="start" font-weight="normal">只用掩码的冻结规则：M=1 判正</text><text x="70" y="725" font-size="38" fill="#227292" text-anchor="start" font-weight="normal">准确率 90%</text><text x="765" y="180" font-size="30" fill="#1a2a3b" text-anchor="start" font-weight="normal">部署：与状态独立采集</text><text x="765" y="236" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">M=1</text><rect x="765" y="250" width="250.0" height="50" fill="#227292" stroke="none"/><rect x="1015.0" y="250" width="250.0" height="50" fill="#bd6a3f" stroke="none"/><text x="765" y="348" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">正例 25；负例 25</text><text x="765" y="388" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">P(Y=1 | M=1) = 0.5</text><text x="765" y="426" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">M=0</text><rect x="765" y="440" width="250.0" height="50" fill="#227292" stroke="none"/><rect x="1015.0" y="440" width="250.0" height="50" fill="#bd6a3f" stroke="none"/><text x="765" y="538" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">正例 25；负例 25</text><text x="765" y="578" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">P(Y=1 | M=0) = 0.5</text><text x="765" y="664" font-size="26" fill="#1a2a3b" text-anchor="start" font-weight="normal">只用掩码的冻结规则：M=1 判正</text><text x="765" y="725" font-size="38" fill="#bd6a3f" text-anchor="start" font-weight="normal">准确率 50%</text><line x1="700" y1="150" x2="700" y2="770" stroke="#e0e4eb" stroke-width="2"/><text x="60" y="832" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">填零值相同不代表条件信息相同；随机丢模态不能自动复现状态相关缺失。</text></g></svg></svg>

<text x="732" y="313.0" font-size="25" fill="#63788c" text-anchor="end" font-weight="400">x = 0</text>
<rect x="750" y="250" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<rect x="860" y="250" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<rect x="970" y="250" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<text x="732" y="423.0" font-size="25" fill="#63788c" text-anchor="end" font-weight="400">x = 0</text>
<rect x="750" y="360" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<rect x="860" y="360" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<rect x="970" y="360" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<text x="732" y="533.0" font-size="25" fill="#63788c" text-anchor="end" font-weight="400">x = 1</text>
<rect x="750" y="470" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>

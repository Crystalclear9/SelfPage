<text x="310.0" y="226" font-size="25" fill="#63788c" text-anchor="middle" font-weight="400">y = 2</text>
<text x="420.0" y="226" font-size="25" fill="#63788c" text-anchor="middle" font-weight="400">y = 3</text>
<text x="127" y="313.0" font-size="25" fill="#63788c" text-anchor="end" font-weight="400">x = 0</text>

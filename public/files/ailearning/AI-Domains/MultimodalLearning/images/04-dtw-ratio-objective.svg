<rect x="365" y="470" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<polyline points="200.000,305.000 200.000,415.000 310.000,525.000 420.000,525.000" fill="none" stroke="#2865a0" stroke-width="7" stroke-linejoin="round"/>

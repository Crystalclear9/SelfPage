<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1073" height="755" viewBox="26 60 1073 755" role="img" aria-labelledby="title desc">
<rect x="26" y="60" width="1073" height="755" fill="#ffffff"/><title id="title">DTW最小总和与最小平均代价选择不同路径</title><desc id="desc">序列x为0,0,1，y为0,2,3，格点代价为平方差。总和最优路径代价5长4平均1.25，平均最优路径代价6长5平均1.20。长度为3,4,5的最小总和分别8,5,6。</desc>
<rect width="1200" height="850" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="100" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">x = (0, 0, 1)，y = (0, 2, 3)；每个访问格点按平方差计一次</text>
<text x="60" y="168" font-size="29" fill="#2865a0" text-anchor="start" font-weight="700">① 总和最小</text>

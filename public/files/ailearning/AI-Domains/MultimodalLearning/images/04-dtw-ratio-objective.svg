<polyline points="805.000,305.000 805.000,415.000 805.000,525.000 915.000,525.000 1025.000,525.000" fill="none" stroke="#c87536" stroke-width="7" stroke-linejoin="round"/>
<circle cx="805.0" cy="305.0" r="27" fill="white"/>
<circle cx="805.0" cy="305.0" r="27" fill="none" stroke="#c87536" stroke-width="3"/>
<text x="805.0" y="315.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="700">0</text>
<text x="915.0" y="315.0" font-size="30" fill="#63788c" text-anchor="middle" font-weight="400">4</text>
<text x="1025.0" y="315.0" font-size="30" fill="#63788c" text-anchor="middle" font-weight="400">9</text>
<circle cx="805.0" cy="415.0" r="27" fill="white"/>
<circle cx="805.0" cy="415.0" r="27" fill="none" stroke="#c87536" stroke-width="3"/>
<text x="805.0" y="425.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="700">0</text>
<text x="915.0" y="425.0" font-size="30" fill="#63788c" text-anchor="middle" font-weight="400">4</text>
<text x="1025.0" y="425.0" font-size="30" fill="#63788c" text-anchor="middle" font-weight="400">9</text>
<circle cx="805.0" cy="525.0" r="27" fill="white"/>
<circle cx="805.0" cy="525.0" r="27" fill="none" stroke="#c87536" stroke-width="3"/>
<text x="805.0" y="535.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="700">1</text>
<circle cx="915.0" cy="525.0" r="27" fill="white"/>
<circle cx="915.0" cy="525.0" r="27" fill="none" stroke="#c87536" stroke-width="3"/>
<text x="915.0" y="535.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="700">1</text>
<circle cx="1025.0" cy="525.0" r="27" fill="white"/>
<circle cx="1025.0" cy="525.0" r="27" fill="none" stroke="#c87536" stroke-width="3"/>
<text x="1025.0" y="535.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="700">4</text>
<text x="910" y="630" font-size="28" fill="#c87536" text-anchor="middle" font-weight="700">总和 6　长度 5</text>
<text x="910" y="674" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">平均 = 1.20</text>
<rect x="44" y="719" width="1112" height="96" rx="12" fill="#eef4f9" stroke="none"/>
<text x="65" y="757" font-size="25" fill="#213447" text-anchor="start" font-weight="400">按长度单独求最优：长度 3 → 总和 8；长度 4 → 总和 5；长度 5 → 总和 6。</text>
<text x="65" y="793" font-size="25" fill="#213447" text-anchor="start" font-weight="400">比较各长度的最小总和与长度之比，才能得到本例的最小平均值。</text>

<text x="305" y="630" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="700">总和 5　长度 4</text>
<text x="305" y="674" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">平均 = 1.25</text>

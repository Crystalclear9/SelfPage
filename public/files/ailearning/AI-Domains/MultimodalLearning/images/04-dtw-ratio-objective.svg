<rect x="365" y="360" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>
<text x="127" y="533.0" font-size="25" fill="#63788c" text-anchor="end" font-weight="400">x = 1</text>
<rect x="145" y="470" width="110" height="110" rx="0" fill="#f6f8fa" stroke="#dce5ed"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>单位球只固定输出范数，原始向量仍会随更新变长</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">单位球只固定输出范数，原始向量仍会随更新变长</text><text x="75" y="125" font-size="28" fill="#19333c" text-anchor="start">A  负余弦目标的一步梯度下降</text><circle cx="345" cy="425" r="190" fill="#f3f7f8" stroke="#dbe5e8" stroke-width="2"/><line x1="117.0" y1="425" x2="639.5" y2="425" stroke="#71858b" stroke-width="2"/><line x1="345" y1="634.0" x2="345" y2="197.0" stroke="#71858b" stroke-width="2"/><line x1="345" y1="425" x2="440.0" y2="260.45517328095667" stroke="#256b82" stroke-width="4"/><line x1="345" y1="425" x2="535" y2="425" stroke="#19333c" stroke-width="3"/><line x1="440.0" y1="260.45517328095667" x2="582.5" y2="342.7275866404783" stroke="#c0643c" stroke-width="4"/><line x1="345" y1="425" x2="582.5" y2="342.7275866404783" stroke="#71858b" stroke-width="2"/><circle cx="440.0" cy="260.45517328095667" r="8" fill="#256b82"/><circle cx="582.5" cy="342.7275866404783" r="8" fill="#c0643c"/><circle cx="524.5331246793829" cy="362.8079012827422" r="6" fill="#256b82"/><text x="420.0" y="240.45517328095667" font-size="25" fill="#256b82" text-anchor="end">原始 a = v</text><text x="592.5" y="327.7275866404783" font-size="26" fill="#c0643c" text-anchor="start">a + d</text><text x="550" y="460" font-size="25" fill="#19333c" text-anchor="start">固定 u</text><text x="82" y="690" font-size="25" fill="#19333c" text-anchor="start">d 为负梯度，与 a 正交；有限步的端点却在圆外。</text><text x="770" y="125" font-size="28" fill="#19333c" text-anchor="start">B  用相同步长更新原始向量</text><text x="770" y="210" font-size="27" fill="#19333c" text-anchor="start">η</text><text x="920" y="210" font-size="26" fill="#19333c" text-anchor="start">新范数</text><text x="1100" y="210" font-size="26" fill="#19333c" text-anchor="start">新余弦</text><text x="770" y="295" font-size="28" fill="#19333c" text-anchor="start">0</text><text x="920" y="295" font-size="28" fill="#c0643c" text-anchor="start">1.0000</text><text x="1100" y="295" font-size="28" fill="#256b82" text-anchor="start">0.5000</text><text x="770" y="375" font-size="28" fill="#19333c" text-anchor="start">0.1</text><text x="920" y="375" font-size="28" fill="#c0643c" text-anchor="start">1.0037</text><text x="1100" y="375" font-size="28" fill="#256b82" text-anchor="start">0.5729</text><text x="770" y="455" font-size="28" fill="#19333c" text-anchor="start">0.5</text><text x="920" y="455" font-size="28" fill="#c0643c" text-anchor="start">1.0897</text><text x="1100" y="455" font-size="28" fill="#256b82" text-anchor="start">0.8030</text><text x="770" y="535" font-size="28" fill="#19333c" text-anchor="start">1</text><text x="920" y="535" font-size="28" fill="#c0643c" text-anchor="start">1.3229</text><text x="1100" y="535" font-size="28" fill="#256b82" text-anchor="start">0.9449</text><text x="770" y="628" font-size="24" fill="#19333c" text-anchor="start">图 A 取 η = 1，蓝点为重新归一化</text><line x1="60" y1="728" x2="1220" y2="728" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="768" font-size="24" fill="#19333c" text-anchor="start">切向梯度是局部一阶性质；重新归一化后的点积才是余弦，原始参数范数并未被固定。</text></g></svg>

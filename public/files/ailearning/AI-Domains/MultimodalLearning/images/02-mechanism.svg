<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1382" height="960" viewBox="29 69 1382 960" role="img"><rect x="29" y="69" width="1382" height="960" fill="#ffffff"/><title>新证据的两个分支：一次更不确定，平均信息仍然增加</title><rect width="1440" height="1060" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="50" y="110" font-size="27" fill="#203247" text-anchor="start">固定同一个联合模型：P(Z=1)=0.9，P(E|Z=1)=0.1，P(E|Z=2)=0.9。</text>
<rect x="48" y="180" width="380" height="375" fill="#f7f9fc" stroke="#dce4ec" stroke-width="2" rx="12"/>
<text x="78" y="230" font-size="30" fill="#203247" text-anchor="start" font-weight="700">观测前</text>
<text x="78" y="285" font-size="27" fill="#203247" text-anchor="start">类别概率 = [0.9,0.1]</text>
<text x="78" y="340" font-size="27" fill="#203247" text-anchor="start">联合分支权重：</text>
<text x="78" y="395" font-size="27" fill="#d87320" text-anchor="start">E：[0.09,0.09]</text>
<text x="78" y="450" font-size="27" fill="#2563a6" text-anchor="start">非 E：[0.81,0.01]</text>
<text x="78" y="510" font-size="26" fill="#203247" text-anchor="start">原熵 H(Z)=0.325083 nat</text>
<line x1="440" y1="360" x2="680" y2="310" stroke="#d87320" stroke-width="3"/>
<polyline points="669.310,317.398 680.000,310.000 667.245,307.486" fill="none" stroke="#d87320" stroke-width="3" opacity="1"/>
<text x="525" y="275" font-size="27" fill="#d87320" text-anchor="middle">概率 0.18</text>
<rect x="695" y="185" width="695" height="260" fill="white" stroke="#d87320" stroke-width="2" rx="12"/>
<text x="725" y="235" font-size="30" fill="#d87320" text-anchor="start" font-weight="700">E 出现</text>
<text x="725" y="293" font-size="27" fill="#203247" text-anchor="start">分支内归一化 → [0.5,0.5]</text>
<text x="725" y="349" font-size="28" fill="#d87320" text-anchor="start">分支熵 = 0.693147 nat</text>
<text x="725" y="402" font-size="27" fill="#d87320" text-anchor="start">比观测前更不确定</text>
<line x1="440" y1="360" x2="680" y2="660" stroke="#2563a6" stroke-width="3"/>
<polyline points="668.567,653.813 680.000,660.000 676.473,647.488" fill="none" stroke="#2563a6" stroke-width="3" opacity="1"/>
<text x="525" y="595" font-size="27" fill="#2563a6" text-anchor="middle">概率 0.82</text>
<rect x="695" y="535" width="695" height="260" fill="white" stroke="#2563a6" stroke-width="2" rx="12"/>
<text x="725" y="585" font-size="30" fill="#2563a6" text-anchor="start" font-weight="700">E 未出现</text>
<text x="725" y="643" font-size="27" fill="#203247" text-anchor="start">分支内归一化 → [0.987805,0.012195]</text>
<text x="725" y="699" font-size="28" fill="#2563a6" text-anchor="start">分支熵 = 0.065861 nat</text>
<text x="725" y="752" font-size="27" fill="#2563a6" text-anchor="start">比观测前更集中</text>
<rect x="48" y="850" width="1344" height="160" fill="#edf4fc" stroke="#2563a6" stroke-width="2" rx="12"/>
<text x="78" y="900" font-size="29" fill="#203247" text-anchor="start">平均条件熵 = 0.18×0.693147 + 0.82×0.065861 = 0.178772 nat</text>
<text x="78" y="955" font-size="29" fill="#27816c" text-anchor="start">证据信息增量 = 0.325083 − 0.178772 = 0.146311 nat ≥ 0</text>
<text x="78" y="994" font-size="26" fill="#203247" text-anchor="start">互信息约束的是加权平均；它不要求每一条实际证据都降低后验熵。</text>
</g></svg>

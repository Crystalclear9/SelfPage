<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="783" viewBox="0 0 1200 783" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 446.310000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 446.310000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 336.690000 684.000000 446.310000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 336.690000 684.000000 446.310000"/>
<title id="fig-title">观察一个分支可以增大后验熵</title>
<desc id="fig-desc">分支概率必须计入平均。另用全方差验证信息增益。</desc>
<rect x="0" y="0" width="1200" height="783" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">某条证据让预测更难，平均仍带来信息</text>
<path d="M72 349 L99 287 L322 287 L295 349 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="197" y="326.4" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">先验 (0.9, 0.1)</text>
<path d="M312 318 L585 220" fill="none" stroke="#a74d3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M585 220 L576.336 228.422 L572.958 219.011 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="392" y="244" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">概率 0.18</text>
<path d="M588 251 L615 189 L1002 189 L975 251 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="795" y="227.7" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">观测到 E  ·  0.5, 0.5</text>
<text x="600" y="299" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">分支熵 0.693147 nat</text>
<path d="M312 318 L585 430" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M585 430 L572.925 430.451 L576.721 421.199 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="392" y="454" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">概率 0.82</text>
<path d="M588 461 L615 399 L1002 399 L975 461 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="795" y="437.7" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">没有观测到 E  ·  0.987805, 0.0121951</text>
<text x="600" y="509" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">分支熵 0.065861 nat</text>
<path d="M75 548 L1125 548" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="603" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">平均条件熵 0.178772 nat；从先验熵 0.325083 nat 中减去它，得到互信息 0.146311。</text>
<text x="75" y="659" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">对于 Z=1 的指示量，先验方差 0.09 = 平均后验方差 0.054878 + 后验均值方差 0.035122。</text>
<text x="75" y="716" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">上支提高不确定性；两条分支按概率加权，才得到平均结果。</text>
</svg>

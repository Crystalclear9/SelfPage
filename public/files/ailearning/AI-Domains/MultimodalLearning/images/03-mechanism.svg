<text x="40" y="690" font-size="31" fill="#20343d" text-anchor="start" font-weight="700">问题：第一个位置是 1 吗？</text>
<text x="40" y="750" font-size="29" fill="#cd7c2a" text-anchor="start" font-weight="400">A：是；B：否。只看这两个摘要，后续模型无法区分。</text></g></svg>

<text x="510" y="260" font-size="32" fill="#647b88" text-anchor="middle" font-weight="400">0</text>
<rect x="682" y="217" width="96" height="65" fill="#f3f5f7" stroke="none" stroke-width="2"/>
<text x="730" y="260" font-size="32" fill="#647b88" text-anchor="middle" font-weight="400">0</text>

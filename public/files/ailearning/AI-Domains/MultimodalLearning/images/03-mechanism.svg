<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc"><title id="title">压缩碰撞：不同输入得到同一组连接token</title><desc id="desc">固定两个查询，各自均匀汇总三个位置。输入A一零零零一零和B零一零一零零均压缩为三分之一、三分之一，无法回答第一位置是否为一。</desc><rect width="1320" height="800" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="40" y="55" font-size="35" fill="#20343d" text-anchor="start" font-weight="700">两个输入、同一个摘要：丢失的区别在哪里？</text>
<text x="40" y="108" font-size="28" fill="#647b88" text-anchor="start" font-weight="400">固定两个查询：各自读取三个位置的均值</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>同一个二元联合分布：沿路径相乘，沿事件相加</title><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">

<text x="76" y="695" font-size="28" fill="#203247" text-anchor="start" font-weight="700">③ 反向条件：先把 B=1 的两条叶路径合并，再归一化</text>
<text x="76" y="750" font-size="28" fill="#203247" text-anchor="start">P(B=1) = 0.06 + 0.63 = 0.69</text>
<text x="76" y="805" font-size="28" fill="#203247" text-anchor="start">P(A=1 | B=1) = 0.913043…；正向 P(B=1 | A=1) = 0.9</text>

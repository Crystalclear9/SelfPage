/text><text x="365" y="522" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">2</text><text x="490" y="522" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">3</text><text x="615" y="522" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">4</text><line x1="115" y1="125" x2="115" y2="487" stroke="#213447" stroke-width="2" /><text x="115" y="108" font-size="27" fill="#213447" text-anchor="start" font-weight="400">预测坐标 2</text><text x="600" y="555" font-size="27" fill="#213447" text-anchor="end" font-weight="400">预测坐标 1</text><line x1="115" y1="487" x2="240" y2="418" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="115" y1="487" x2="365" y2="280" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="115" y1="487" x2="490" y2="142" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><line x1="240" y1="418" x2="365" y2="280" stroke="#cf7432" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#orange-arrow)" /><line x1="365" y1="280" x2="490" y2="142" stroke="#cf7432" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#orange-arrow)" /><text x="258" y="446" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">无条件 (1,1)</text><text x="383" y="308" font-size="27" fill="#213447" text-anchor="start" font-weight="400">条件 (2,3)</text><text x="508" y="132" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">引导 (3,5)</text><text x="910" y="132" font-size="30" fill="#213447" text-anchor="middle" font-weight="400">本章：u + s(c − u)</text><rect x="750" y="180" width="310" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="905.0" y="222.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">s = 0：无条件 u</text><rect x="750" y="265" width="310" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="905.0" y="307.5" font-size="28" fill="#213447" text-an
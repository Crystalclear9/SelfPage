<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>可逆缩放怎样改变密度而保持总质量</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#18364e">可逆缩放怎样改变密度而保持总质量</text><rect x="40.0" y="115.0" width="266.0" height="162.66666666666666" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="310.0" y="115.0" width="266.0" height="162.66666666666666" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="580.0" y="115.0" width="266.0" height="162.66666666666666" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="850.0" y="115.0" width="266.0" height="162.66666666666666" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="40.0" y="281.66666666666663" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="310.0" y="281.66666666666663" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="580.0" y="281.66666666666663" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="850.0" y="281.66666666666663" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="40.0" y="448.3333333333333" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="310.0" y="448.3333333333333" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="580.0" y="448.3333333333333" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="850.0" y="448.3333333333333" width="266.0" height="162.66666666666666" rx="6" fill="#edf5fa" stroke="#7895aa" /><text x="53.0" y="150.0" font-size="23" fill="#143651">变量变换</text><text x="323.0" y="150.0" font-size="23" fill="#143651">区间长度</text><text x="593.0" y="150.0" font-size="23" fill="#143651">区间内密度</text><text x="863.0" y="150.0" font-size="23" fill="#143651">积分质量</text><text x="53.0" y="316.66666666666663" font-size="23" fill="#143651">x 在零至一均匀</text><text x="323.0" y="316.66666666666663" font-size="23" fill="#143651">1</text><text x="593.0" y="316.66666666666663" font-size="23" fill="#143651">1</text><text x="863.0" y="316.66666666666663" font-size="23" fill="#143651">1</text><text x="53.0" y="483.3333333333333" font-size="23" fill="#143651">y=2x</text><text x="323.0" y="483.3333333333333" font-size="23" fill="#143651">2</text><text x="593.0" y="483.3333333333333" font-size="23" fill="#143651">二分之一</text><text x="863.0" y="483.3333333333333" font-size="23" fill="#143651">1</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title id="figure-title">ELBO 改善可以来自推断间隙缩小</title><desc id="figure-desc">ELBO 改善可以来自推断间隙缩小</desc><rect width="1200" height="680" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">ELBO 改善可以来自推断间隙缩小</text><text x="32" y="105" font-size="27" fill="#213447" text-anchor="start" font-weight="400">同一模型、同一观测 x=3；只改变近似后验 q</text><line x1="882.4371053126467" y1="140" x2="882.4371053126467" y2="540" stroke="#c8d7e3" stroke-width="2" stroke-dasharray="5 6" /><text x="882.4371053126467" y="140" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">log p(x) ≈ -2.624</text><text x="30" y="239" font-size="27" fill="#213447" text-anchor="start" font-weight="400">精确后验</text><line x1="882.4371053126467" y1="230" x2="882.4371053126467" y2="230" stroke="#cf7432" stroke-width="5" /><circle cx="882.4371053126467" cy="230" r="9" fill="white" stroke="#2865a0" stroke-width="2.5" /><circle cx="882.4371053126467" cy="230" r="8" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="882.4371053126467" y="205" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">ELBO -2.624</text><text x="1015" y="239" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">KL ≈ 0.000</text><text x="30" y="374" font-size="27" fill="#213447" text-anchor="start" font-weight="400">q=N(1,0.5)</text><line x1="839.9861866224967" y1="365" x2="882.4371053126467" y2="365" stroke="#cf7432" stroke-width="5" /><circle cx="839.9861866224967" cy="365" r="9" fill="white" stroke="#2865a0" stroke-width="2.5" /><circle cx="882.4371053126467" cy="365" r="8" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="839.9861866224967" y="340" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">ELBO -3.016</text><text x="1015" y="374" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">KL ≈ 0.392</text><text x="30" y="509" font-size="27" fill="#213447" text-anchor="start" font-weight="400">q=N(0,1)</text><line x1="362.9483255694938" y1="500" x2="882.4371053126467" y2="500" stroke="#cf7432" stroke-width="5" /><circle cx="362.9483255694938" cy="500" r="9" fill="white" stroke="#2865a0" stroke-width="2.5" /><circle cx="882.4371053126467" cy="500" r="8" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="362.9483255694938" y="475" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">ELBO -7.419</text><text x="1015" y="509" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">KL ≈ 4.795</text><text x="600" y="635" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">固定的对数证据 = 变化的下界 + 非负的后验 KL 间隙</text><line x1="300" x2="950" y1="550" y2="550" stroke="#647789" stroke-width="1.5" /><line x1="300.0" x2="300.0" y1="550" y2="556" stroke="#647789" /><text x="300.0" y="580" font-size="24" fill="#647789" text-anchor="middle">-8</text><line x1="516.6666666666666" x2="516.6666666666666" y1="550" y2="556" stroke="#647789" /><text x="516.6666666666666" y="580" font-size="24" fill="#647789" text-anchor="middle">-6</text><line x1="733.3333333333333" x2="733.3333333333333" y1="550" y2="556" stroke="#647789" /><text x="733.3333333333333" y="580" font-size="24" fill="#647789" text-anchor="middle">-4</text><line x1="950.0" x2="950.0" y1="550" y2="556" stroke="#647789" /><text x="950.0" y="580" font-size="24" fill="#647789" text-anchor="middle">-2</text><text x="35" y="580" font-size="26" fill="#647789">自然对数值</text></g></svg>

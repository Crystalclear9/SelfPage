80" y="672" font-size="24" fill="#1a2b3d" text-anchor="middle">(1, 1)</text><text x="1140" y="672" font-size="24" fill="#1a2b3d" text-anchor="middle">(3, 1)</text><text x="750" y="605" font-size="28" fill="#bf6d42" text-anchor="start">平行四边形</text><line x1="440" y1="735" x2="655" y2="735" stroke="#257190" stroke-width="4"/><path d="M644.47,740.75 L655.00,735.00 L644.47,729.25" fill="none" stroke="#257190" stroke-width="4"/><text x="540" y="690" font-size="26" fill="#1a2b3d" text-anchor="middle">可逆剪切与伸缩</text><text x="90" y="913" font-size="27" fill="#257190" text-anchor="start">总面积 1 × 密度 1 = 1</text><text x="90.0" y="420" font-size="27" fill="#257190" text-anchor="start">深色区域：概率</text><text x="310.0" y="399" font-size="24" fill="#257190" text-anchor="middle">1</text><line x1="297.0" y1="409" x2="323.0" y2="409" stroke="#257190" stroke-width="1.5"/><text x="310.0" y="436" font-size="24" fill="#257190" text-anchor="middle">4</text><text x="880" y="248" font-size="26" fill="#1a2b3d" text-anchor="start">密度</text><text x="952" y="230" font-size="24" fill="#1a2b3d" text-anchor="middle">1</text><line x1="939.0" y1="240" x2="965.0" y2="240" stroke="#1a2b3d" stroke-width="1.5"/><text x="952" y="267" font-size="24" fill="#1a2b3d" text-anchor="middle">2</text><text x="760.0" y="420" font-size="27" fill="#257190" text-anchor="start">深色区域：概率</text><text x="980.0" y="399" font-size="24" fill="#257190" text-anchor="middle">1</text><line x1="967.0" y1="409" x2="993.0" y2="409" stroke="#257190" stroke-width="1.5"/><text x="980.0" y="436" font-size="24" fill="#257190" text-anchor="middle">4</text><text x="735" y="905" font-size="27" fill="#bf6d42" text-anchor="start">总面积 2 × 密度</text><text x="978" y="884" font-size="24" fill="#bf6d42" text-anchor="middle">1</text><line x1="965.0" y1="894" x2="991.0" y2="894" stroke="#bf6d42" stroke-width="1.5"/><text x="978" y="921" font-size="24" fill="#bf6d42" text-anchor="middle">2</text><text x="1005" y="905" font-size="27" fill="#bf6d42" text-anchor="start">= 1</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1119.1339" viewBox="0 0 1440 1119.1339" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">线性缩放与剪切保持对应区域概率</title><rect width="1440" height="1119.1339" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">线性缩放与剪切保持对应区域概率</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="977.1339" viewBox="42 104 1143 831" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="104" width="1143" height="831" fill="#ffffff"/><title>体积变大时密度降低，同一片区域的概率保持不变</title><rect width="1280" height="960" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><rect x="90" y="205" width="160" height="140" fill="#dcecf1"/><rect x="90" y="205" width="40.0" height="140" fill="#257190"/><line x1="80" y1="345" x2="440" y2="345" stroke="#769099" stroke-width="2"/><text x="90" y="145" font-size="29" fill="#1a2b3d" text-anchor="start">X ~ U(0,1)</text><text x="170.0" y="185" font-size="26" fill="#1a2b3d" text-anchor="middle">密度 1</text><text x="90" y="380" font-size="25" fill="#1a2b3d" text-anchor="middle">0</text><text x="250" y="380" font-size="25" fill="#1a2b3d" text-anchor="middle">1</text><text x="410" y="380" font-size="25" fill="#1a2b3d" text-anchor="middle">2</text><rect x="760" y="275" width="320" height="70" fill="#dcecf1"/><rect x="760" y="275" width="80.0" height="70" fill="#257190"/><line x1="750" y1="345" x2="1110" y2="345" stroke="#769099" stroke-width="2"/><text x="760" y="145" font-size="29" fill="#1a2b3d" text-anchor="start">Y = 2X</text><text x="760" y="380" font-size="25" fill="#1a2b3d" text-anchor="middle">0</text><text x="920" y="380" font-size="25" fill="#1a2b3d" text-anchor="middle">1</text><text x="1080" y="380" font-size="25" fill="#1a2b
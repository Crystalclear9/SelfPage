<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img"><title>两层交替耦合：沿真实中间状态计算尺度，再倒序恢复</title><rect width="1440" height="1040" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="44" y="55" font-size="34" fill="#203247" text-anchor="start" font-weight="700">两层交替耦合：沿真实中间状态计算尺度，再倒序恢复</text>
<text x="48" y="112" font-size="28" fill="#203247" text-anchor="start" font-weight="700">生成方向：与实验二 transform 的输入、公式和精度一致</text>
<rect x="48" y="145" width="390" height="245" fill="white" stroke="#2563a6" stroke-width="2" rx="12"/>
<text x="68" y="190" font-size="28" fill="#2563a6" text-anchor="start" font-weight="700">输入 v</text>
<text x="68" y="238" font-size="25" fill="#203247" text-anchor="start">a = 0.700000</text>
<text x="68" y="281" font-size="25" fill="#203247" text-anchor="start">b = −0.400000</text>
<rect x="535" y="145" width="390" height="245" fill="white" stroke="#d87320" stroke-width="2" rx="12"/>
<text x="555" y="190" font-size="28" fill="#d87320" text-anchor="start" font-weight="700">第一层：保留 a</text>
<text x="555" y="238" font-size="25" fill="#203247" text-anchor="start">s1 = 0.3 tanh(a) = 0.181310</text>
<text x="555" y="281" font-size="25" fill="#203247" text-anchor="start">b1 = b exp(s1) + 0.2a²</text>
<text x="555" y="324" font-size="25" fill="#203247" text-anchor="start">(a, b1) = (0.7, −0.381515)</text>
<rect x="1025" y="145" width="360" height="245" fill="white" stroke="#27816c" stroke-width="2" rx="12"/>
<text x="1045" y="190" font-size="28" fill="#27816c" text-anchor="start" font-weight="700">第二层：保留 b1</text>
<text x="1045" y="238" font-size="25" fill="#203247" text-anchor="start">s2 = −0.2 tanh(b1)</text>
<text x="1045" y="281" font-size="25" fill="#203247" text-anchor="start">s2 = 0.072804</text>
<text x="1045" y="324" font-size="25" fill="#203247" text-anchor="start">(a2, b1)</text>
<text x="1045" y="367" font-size="25" fill="#203247" text-anchor="start">= (0.714713, −0.381515)</text>
<line x1="446" y1="267" x2="518" y2="267" stroke="#6b7785" stroke-width="3"/>
<polyline points="506.026,272.062 518.000,267.000 506.026,261.938" fill="none" stroke="#6b7785" stroke-width="3" opacity="1"/>
<line x1="937" y1="267" x2="1008" y2="267" stroke="#6b7785" stroke-width="3"/>
<polyline points="996.026,272.062 1008.000,267.000 996.026,261.938" fill="none" stroke="#6b7785" stroke-width="3" opacity="1"/>
<text x="48" y="445" font-size="28" fill="#203247" text-anchor="start" font-weight="700">逆向恢复：先撤销第二层，再撤销第一层</text>
<rect x="48" y="475" width="1344" height="170" fill="#f7f9fc" stroke="#dce4ec" stroke-width="2" rx="12"/>
<text x="75" y="520" font-size="29" fill="#27816c" text-anchor="start">(a2,b1) → a = (a2 − 0.1b1) exp(−s2) = 0.700000</text>
<text x="75" y="575" font-size="29" fill="#d87320" text-anchor="start">(a,b1) → b = (b1 − 0.2a²) exp(−s1) = −0.400000</text>
<text x="75" y="620" font-size="26" fill="#203247" text-anchor="start">逆过程不求 tanh 的逆：保留坐标已知，可重算同一个尺度。</text>
<text x="48" y="706" font-size="28" fill="#203247" text-anchor="start" font-weight="700">局部体积账本：两层行列式相乘，log 绝对值相加</text>
<rect x="48" y="735" width="625" height="210" fill="#edf4fc" stroke="#2563a6" stroke-width="2" rx="12"/>
<rect x="705" y="735" width="687" height="210" fill="#fff4e9" stroke="#d87320" stroke-width="2" rx="12"/>
<text x="75" y="784" font-size="27" fill="#2563a6" text-anchor="start">第一层 J1 = [[1, 0], [*, exp(s1)]]</text>
<text x="75" y="834" font-size="27" fill="#27816c" text-anchor="start">第二层 J2 = [[exp(s2), *], [0, 1]]</text>
<text x="75" y="889" font-size="25" fill="#203247" text-anchor="start">* 是非对角导数，不进入三角行列式。</text>
<text x="730" y="784" font-size="27" fill="#203247" text-anchor="start">log |det J| = s1 + s2 = 0.254115</text>
<text x="730" y="834" font-size="27" fill="#203247" text-anchor="start">|det J| = 1.289320；逆向 = −0.254115</text>
<text x="730" y="889" font-size="25" fill="#d87320" text-anchor="start">第二层必须使用 b1，不能偷换成原始 b。</text>
<text x="48" y="1000" font-size="26" fill="#6b7785" text-anchor="start">图中数值仅展示六位小数；代码以 float64 完成往返和雅可比核验。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1011.8225" viewBox="0 0 1440 1011.8225" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">筛选账本：保留比例与总接受率必须同时计算</title><rect width="1440" height="1011.8225" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">筛选账本：保留比例与总接受率必须同时计算</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="869.8225" viewBox="24 63 1352 875" role="img" x="48" y="106" overflow="hidden"><rect x="24" y="63" width="1352" height="875" fill="#ffffff"/><title>筛选前后概率流与全成本</title><desc>实验四以各半的两个模式提议，A全接收B接收十分之一。按100提议的期望流量为50A,50B，保留50A,5B并拒绝45B，总接受率0.55，模式10/11与1/11，每成功60/11调用。</desc><rect width="1400" height="930" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="104" font-size="27" fill="#628198" text-anchor="start" font-weight="400">实验四：原模式各半；A 接受率 1，B 接受率 0.1</text><text x="80" y="171" font-size="28" fill="#21374d" text-anchor="start" font-weight="600">100 次提议的期望流量</text><text x="880" y="171" font-size="28" fill="#21374d" text-anchor="start" font-weight="600">保留与拒绝分开计数</text><rect x="80" y="230" width="170" height="200" rx="6" fill="#1f74b4" stroke="none"/><text x="165" y="340" font-size="30" fill="white" text-anchor="middle" font-weight="600">A：50</text><rect x="80" y="475" width="170" height="200" rx="6" fill="#c1682c" stroke="none"/><text x="165" y="585" font-size="30" fill="white" text-anchor="middle" font-weight="600">B：50</text><path d="M250 230 C510 230 630 230 880 230 L880 430 C630 430 510 430 250 430 Z" fill="#1f74b4" opacity=".16"/><path d="M250 475 C510 475 630 475 880 475 L880 495 C630 495 510 495 250 495 Z" fill="#c1682c" opacity=".28"/><path d="M250 495 C510 495 630 535 880 535 L880 715 C630 715 510 675 250 675 Z" fill="#e3e9ef"/><rect x="880" y="230" width="170" height="200" rx="6" fill="#1f74b4" stroke="none"/><text x="965" y="340" font-size="29" fill="white" text-anchor="middle" font-weight="600">保留 50</text><rect x="880" y="475" width="170" height="20" rx="0" fill="#c1682c" stroke="none"/><text x="1075" y="495" font-size="27" fill="#c1682c" text-anchor="start" font-weight="400">保留 B：5</text><rect x="880" y="535" width="170" height="180" rx="6" fill="#e3e9ef" stroke="none"/><text x="965" y="633" font-size="28" fill="#628198" text-anchor="middle" font-weight="600">拒绝 45</text><text x="1100" y="285" font-size="26" fill="#1f74b4" text-anchor="start" font-weight="400">保留集中 A</text><text x="1200" y="335" font-size="27" fill="#1f74b4" text-anchor="middle" font-weight="400">10</text><line x1="1164" y1="345" x2="1236" y2="345" stroke="#1f74b4" stroke-width="2"/><text x="1200" y="379" font-size="27" fill="#1f74b4" text-anchor="middle" font-weight="400">11</text><text x="1100" y="580" font-size="26" fill="#1d9295" text-anchor="start" font-weight="400">总接受率</text><text x="1100" y="624" font-size="29" fill="#1d9295" text-anchor="start" font-weight="600">Z = 0.55</text><line x1="42" y1="765" x2="1358" y2="765" stroke="#d1dfe8" stroke-width="2"/><text x="60" y="820" font-size="29" fill="#21374d" text-anchor="start" font-weight="400">100 次提议 × 3 次单位调用 = 300 次</text><text x="60" y="870" font-size="28" fill="#1d9295" text-anchor="start" font-weight="600">期望保留 55；长期平均每成功样本约 5.454545 次调用</text><text x="42" y="916" font-size="25" fill="#628198" text-anchor="start" font-weight="400">带宽按期望计数绘制；有限次随机接受不保证恰好保留 55 个。</text></g></svg></svg>

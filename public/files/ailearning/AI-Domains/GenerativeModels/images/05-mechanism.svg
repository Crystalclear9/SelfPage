<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="746" viewBox="0 0 1200 746" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">筛选保留与拒绝的质量账本</title>
<desc id="fig-desc">以一百次提议的期望计数作图，线带宽度与数量成正比。</desc>
<rect x="0" y="0" width="1200" height="746" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">接受率改变了输出分布，也改变了单位成本</text>
<text x="75" y="146" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">模式 A · 50</text>
<text x="75" y="342" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">模式 B · 50</text>
<path d="M75 164 L210 164 L798 158 L898 158 L898 258 L798 258 L210 264 L75 264 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 360 L210 360 L798 340 L898 340 L898 350 L798 350 L210 370 L75 370 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 370 L210 370 L798 419 L898 419 L898 509 L798 509 L210 460 L75 460 Z" fill="url(#n)" stroke="#526976" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="922" y="211" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">保留 A · 50</text>
<text x="922" y="352" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">保留 B · 5</text>
<text x="922" y="474" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">拒绝 45</text>
<path d="M75 541 L1125 541" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="600" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">期望接受 55 次，接受率 0.55。保留集中 A 的比例为</text>
<text x="662" y="588" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">10</text>
<path d="M642 594 L682 594" fill="none" stroke="#166d75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="662" y="619" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">11</text>
<text x="75" y="676" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">每次提议 3 次调用。长期每个保留样本约耗费 5.45 次调用。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1403.12" viewBox="0 0 1450 1403.12" role="img"><title>支持未变时移动大量概率，频率误差与搬运成本同时可复算</title><svg xmlns="http://www.w3.org/2000/svg" width="1450" height="950" viewBox="0 0 1450 950" role="img"><title>支持未变时移动大量概率，频率误差与搬运成本同时可复算</title><rect width="1450" height="950" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#17324d}</style><text x="65" y="100" font-size="32" text-anchor="start" font-weight="normal" style="fill:#17324d">参考 P</text><rect x="110" y="130.0" width="80" height="50.0" fill="#246d91" stroke="white" stroke-width="1"/><text x="150" y="225" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.25</text><text x="150" y="270" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">-2</text><rect x="370" y="130.0" width="80" height="50.0" fill="#246d91" stroke="white" stroke-width="1"/><text x="410" y="225" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.25</text><text x="410" y="270" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">-1</text><rect x="890" y="130.0" width="80" height="50.0" fill="#246d91" stroke="white" stroke-width="1"/><text x="930" y="225" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.25</text><text x="930" y="270" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">1</text><rect x="1150" y="130.0" width="80" height="50.0" fill="#246d91" stroke="white" stroke-width="1"/><text x="1190" y="225" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.25</text><text x="1190" y="270" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">2</text><text x="65" y="640" font-size="32" text-anchor="start" font-weight="normal" style="fill:#17324d">生成 Q</text><rect x="110" y="718.0" width="80" height="2.0" fill="#d17839" stroke="white" stroke-width="1"/><text x="150" y="765" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.01</text><text x="150" y="810" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">-2</text><rect x="370" y="718.0" width="80" height="2.0" fill="#d17839" stroke="white" stroke-width="1"/><text x="410" y="765" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.01</text><text x="410" y="810" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">-1</text><rect x="890" y="718.0" width="80" height="2.0" fill="#d17839" stroke="white" stroke-width="1"/><text x="930" y="765" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.01</text><text x="930" y="810" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">1</text><rect x="1150" y="526.0" width="80" height="194.0" fill="#d17839" stroke="white" stroke-width="1"/><text x="1190" y="765" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#17324d">0.97</text><text x="1190" y="810" font-size="25" text-anchor="middle" font-weight="normal" style="fill:#5b7180">2</text><line x1="150" y1="335" x2="1190" y2="335" stroke="#2f897f" stroke-width="4"/><polygon points="1190,335 1177.0,329.0 1177.0,341.0" fill="#2f897f"/><text x="670.0" y="313" font-size="28" text-anchor="middle" font-weight="normal" style="fill:#2f897f">移动 0.24；距离 4</text><line x1="410" y1="430" x2="1190" y2="430" stroke="#2f897f" stroke-width="4"/><polygon points="1190,430 1177.0,424.0 1177.0,436.0" fill="#2f897f"/><text x="800.0" y="408" font-size="28" text-anchor="middle" font-weight="normal" style="fill:#2f897f">移动 0.24；距离 3</text><line x1="930" y1="525" x2="1190" y2="525" stroke="#2f897f" stroke-width="4"/><polygon points="1190,525 1177.0,519.0 1177.0,531.0" fill="#2f897f"/><text x="1060.0" y="503" font-size="28" text-anchor="middle" font-weight="normal" style="fill:#2f897f">移动 0.24；距离 1</text><text x="80" y="895" font-size="31" text-anchor="start" font-weight="normal" style="fill:#17324d">总变差 0.72；一维搬运成本 0.24 × (4 + 3 + 1) = 1.92</text></svg><g id="round-20261105c-teaching" transform="translate(0 950) scale(1.00694)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">最优搬运会随成本改变：W1 最优方案未必使 W2 最小</text><text x="70" y="125" font-size="29" fill="#203742" text-anchor="start">前三处各搬 0.24 到 2：W1=1.92；该方案的平方成本=6.24</text><text x="70" y="180" font-size="29" fill="#203742" text-anchor="start">平方成本的单调匹配：先分配起点 −2 的 0.25 质量</text><rect x="70" y="210" width="302" height="58" fill="#edf5f8" stroke="#216c89"/><text x="221.0" y="249" font-size="28" fill="#216c89" text-anchor="middle">到 −2：.01</text><rect x="380" y="210" width="302" height="58" fill="#edf5f8" stroke="#216c89"/><text x="531.0" y="249" font-size="28" fill="#216c89" text-anchor="middle">到 −1：.01</text><rect x="690" y="210" width="302" height="58" fill="#edf5f8" stroke="#216c89"/><text x="841.0" y="249" font-size="28" fill="#216c89" text-anchor="middle">到 1：.01</text><rect x="1000" y="210" width="302" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1151.0" y="249" font-size="28" fill="#216c89" text-anchor="middle">到 2：.22</text><text x="70" y="315" font-size="29" fill="#203742" text-anchor="start">起点 −1、1、2 的质量各 0.25，均匹配到终点 2。</text><text x="70" y="375" font-size="28" fill="#c96937" text-anchor="start">W2² = .01×1 + .01×9 + .22×16 + .25×9 + .25×1 = 6.12</text><text x="70" y="430" font-size="31" fill="#216c89" text-anchor="start">W1 仍为 1.92；W2=√6.12≈2.47386。</text></g></g></svg>

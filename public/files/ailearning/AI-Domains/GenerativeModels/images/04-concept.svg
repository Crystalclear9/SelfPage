<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>自回归分解与可逆流的区别</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">自回归分解与可逆流的区别</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">可逆缩放扩大支撑区间，密度高度相应缩小</text><path d="M120,500 L1080,500" stroke="#64788b" stroke-width="2" fill="none" /><rect x="150" y="250" width="250" height="250" rx="3" fill="#eaf2fa" stroke="white" stroke-width="2" /><rect x="550" y="375" width="500" height="125" rx="3" fill="#fceadf" stroke="white" stroke-width="2" /><text x="150" y="220" font-size="24" fill="#19344d" text-anchor="start">X  服从  U[0,1]：密度 1</text><text x="550" y="340" font-size="24" fill="#19344d" text-anchor="start">Y=2X：密度 0.5</text><text x="150" y="545" font-size="24" fill="#19344d" text-anchor="start">0</text><text x="400" y="545" font-size="24" fill="#19344d" text-anchor="start">1</text><text x="550" y="545" font-size="24" fill="#19344d" text-anchor="start">0</text><text x="1050" y="545" font-size="24" fill="#19344d" text-anchor="start">2</text></g></svg>

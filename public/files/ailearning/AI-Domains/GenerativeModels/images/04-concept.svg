<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1143" height="831" viewBox="42 104 1143 831" role="img"><rect x="42" y="104" width="1143" height="831" fill="#ffffff"/><title>体积变大时密度降低，同一片区域的概率保持不变</title><rect width="1280" height="960" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><rect x="90" y="205" width="160" height="140" fill="#dcecf1"/><rect x="90" y="205" width="40.0" height="140" fill="#276a80"/><line x1="80" y1="345" x2="440" y2="345" stroke="#74888d" stroke-width="2"/><text x="90" y="145" font-size="29" fill="#19343e" text-anchor="start">X ~ U(0,1)</text><text x="170.0" y="185" font-size="26" fill="#19343e" text-anchor="middle">密度 1</text><text x="90" y="380" font-size="25" fill="#19343e" text-anchor="middle">0</text><text x="250" y="380" font-size="25" fill="#19343e" text-anchor="middle">1</text><text x="410" y="380" font-size="25" fill="#19343e" text-anchor="middle">2</text><text x="90" y="420" font-size="27" fill="#276a80" text-anchor="start">深色区域：概率 ¼</text><rect x="760" y="275" width="320" height="70" fill="#dcecf1"/><rect x="760" y="275" width="80.0" height="70" fill="#276a80"/><line x1="750" y1="345" x2="1110" y2="345" stroke="#74888d" stroke-width="2"/><text x="760" y="145" font-size="29" fill="#19343e" text-anchor="start">Y = 2X</text><text x="920.0" y="255" font-size="26" fill="#19343e" text-anchor="middle">密度 ½</text><text x="760" y="380" font-size="25" fill="#19343e" text-anchor="middle">0</text><text x="920" y="380" font-size="25" fill="#19343e" text-anchor="middle">1</text><text x="1080" y="380" font-size="25" fill="#19343e" text-anchor="middle">2</text><text x="760" y="420" font-size="27" fill="#276a80" text-anchor="start">深色区域：概率 ¼</text><line x1="470" y1="255" x2="660" y2="255" stroke="#276a80" stroke-width="4"/><path d="M649.47,260.75 L660.00,255.00 L649.47,249.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="565" y="225" font-size="28" fill="#19343e" text-anchor="middle">放大两倍</text><text x="60" y="495" font-size="29" fill="#19343e" text-anchor="start">二维：A = [[2, 1], [0, 1]]，det A = 2</text><path d="M110.00,820.00 L175.00,820.00 L175.00,755.00 L110.00,755.00 Z" fill="#276a80" stroke="#276a80" stroke-width="4"/><path d="M110.00,755.00 L175.00,755.00 L175.00,690.00 L110.00,690.00 Z" fill="#edf3f5" stroke="#276a80" stroke-width="4"/><path d="M175.00,820.00 L240.00,820.00 L240.00,755.00 L175.00,755.00 Z" fill="#edf3f5" stroke="#276a80" stroke-width="4"/><path d="M175.00,755.00 L240.00,755.00 L240.00,690.00 L175.00,690.00 Z" fill="#edf3f5" stroke="#276a80" stroke-width="4"/><text x="110" y="856" font-size="24" fill="#19343e" text-anchor="middle">(0, 0)</text><text x="240" y="856" font-size="24" fill="#19343e" text-anchor="middle">(1, 0)</text><text x="110" y="672" font-size="24" fill="#19343e" text-anchor="middle">(0, 1)</text><text x="240" y="672" font-size="24" fill="#19343e" text-anchor="middle">(1, 1)</text><text x="110" y="605" font-size="28" fill="#276a80" text-anchor="start">单位正方形</text><path d="M750.00,820.00 L880.00,820.00 L945.00,755.00 L815.00,755.00 Z" fill="#c2673f" stroke="#c2673f" stroke-width="4"/><path d="M815.00,755.00 L945.00,755.00 L1010.00,690.00 L880.00,690.00 Z" fill="#edf3f5" stroke="#c2673f" stroke-width="4"/><path d="M880.00,820.00 L1010.00,820.00 L1075.00,755.00 L945.00,755.00 Z" fill="#edf3f5" stroke="#c2673f" stroke-width="4"/><path d="M945.00,755.00 L1075.00,755.00 L1140.00,690.00 L1010.00,690.00 Z" fill="#edf3f5" stroke="#c2673f" stroke-width="4"/><text x="750" y="856" font-size="24" fill="#19343e" text-anchor="middle">(0, 0)</text><text x="1010" y="856" font-size="24" fill="#19343e" text-anchor="middle">(2, 0)</text><text x="880" y="672" font-size="24" fill="#19343e" text-anchor="middle">(1, 1)</text><text x="1140" y="672" font-size="24" fill="#19343e" text-anchor="middle">(3, 1)</text><text x="750" y="605" font-size="28" fill="#c2673f" text-anchor="start">平行四边形</text><line x1="440" y1="735" x2="655" y2="735" stroke="#276a80" stroke-width="4"/><path d="M644.47,740.75 L655.00,735.00 L644.47,729.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="540" y="690" font-size="26" fill="#19343e" text-anchor="middle">可逆剪切与伸缩</text><text x="90" y="913" font-size="27" fill="#276a80" text-anchor="start">总面积 1 × 密度 1 = 1</text><text x="735" y="913" font-size="27" fill="#c2673f" text-anchor="start">总面积 2 × 密度 ½ = 1</text></g></svg>

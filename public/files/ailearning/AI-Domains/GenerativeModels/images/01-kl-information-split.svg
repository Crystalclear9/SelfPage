51" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">X=1</text><rect x="460" y="513" width="112" height="53" fill="#e8f0f4" stroke="none"/><text x="516" y="549" font-size="29" fill="#1a2a3b" text-anchor="middle" font-weight="normal">0.1</text><rect x="585" y="513" width="112" height="53" fill="#227292" stroke="none"/><text x="641" y="549" font-size="29" fill="white" text-anchor="middle" font-weight="normal">0.9</text><text x="815" y="425" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">聚合后验 q(Z=1)</text><rect x="815" y="470" width="39.99999999999999" height="55" fill="#e8f0f4" stroke="none"/><rect x="855.0" y="470" width="360.0" height="55" fill="#227292" stroke="none"/><text x="815" y="567" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">0.9 ≠ 先验</text><line x1="60" y1="648" x2="1340" y2="648" stroke="#e0e4eb" stroke-width="2"/><text x="60" y="700" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">KL 分解（nat）</text><text x="80" y="764" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">A</text><rect x="145" y="727" width="520" height="46" fill="#227292" stroke="none"/><text x="710" y="760" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">互信息 0.368064；聚合 KL = 0</text><text x="80" y="832" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">B</text><rect x="145" y="795" width="520" height="46" fill="#bd6a3f" stroke="none"/><text x="710" y="828" font-size="28" fill="#1a2a3b" text-anchor="start" font-weight="normal">互信息 0；聚合 KL = 0.368064</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 925.714) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">同样的平均 KL，剩余类别不确定性却不同</text><text x="70" y="125" font-size="31" fill="#1d3145" text-anchor="start">二元 X 等概率：H(X) = log 2 = 0.6931 nat</text><text x="70" y="204" font-size="28" fill="#1d3145" text-anchor="start">编码器 A：H(X|Z)</text><rect x="320" y="170" width="217.80559217799998" height="44" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="552.805592178" y="204" font-size="28" fill="#1d3145" text-anchor="start">0.325083</text><text x="70" y="274" font-size="28" fill="#1d3145" text-anchor="start">编码器 B：H(X|Z)</text><rect x="320" y="240" width="464.40861100200004" height="44" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="799.408611002" y="274" font-size="28" fill="#1d3145" text-anchor="start">0.693147</text><text x="70" y="355" font-size="30" fill="#1e7499" text-anchor="start">A：I(X;Z)=0.3681；最优判别正确率 0.9</text><text x="70" y="420" font-size="30" fill="#c66d3a" text-anchor="start">B：I(X;Z)=0；最优判别正确率 0.5</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1425.996" viewBox="0 0 1440 1425.996" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两个离散编码器的条件分布、聚合后验和完全不同的KL分解</title><rect width="1440" height="1425.996" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两个离散编码器的条件分布、聚合后验和完全不同的KL分解</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1283.996" viewBox="0 0 1440 1375.71" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>相同的平均 KL，可能对应完全不同的输入信息</title><svg width="1440" height="925.714" viewBox="0 0 1400 900" role="img"><title>相同的平均 KL，可能对应完全不同的输入信息</title><rect width="1400" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#1a2a3b" text-anchor="start" font-weight="normal">相同的平均 KL，可能对应完全不同的输入信息</text><text x="60" y="112" font-size="27" fill="#738d99" text-anchor="start" font-weight="normal">X 的两种取值等概率；Z 为二元变量，先验 p(Z=1)=0.5</text><text x="65" y="175" font-size="30" fill="#1a2a3b" text-anchor="start" font-weight="normal">A：潜变量能区分输入</text><text x="480" y="175" font-size="25" fill="#1a2a3b" text-anchor="start" font-weight="normal">Z=0</text><text x="605" y="175" font-size="25" fill="#1a2a3b" text-anchor="start" font-weight="normal">Z=1</text><text x="365" y="237" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">X
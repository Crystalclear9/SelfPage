<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="761" viewBox="0 0 1200 761" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">非单调平方变换须把两支密度相加</title>
<desc id="fig-desc">x 等于一有两个标准正态原像。输出密度为两支之和，不能只看正半轴。</desc>
<rect x="0" y="0" width="1200" height="761" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">两个潜变量值，可以映到同一个输出</text>
<text x="74" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">Z 为标准正态，X = Z²。</text>

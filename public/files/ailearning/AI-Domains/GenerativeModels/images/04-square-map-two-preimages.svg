<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1224" viewBox="0 0 960 1224" role="img" aria-labelledby="title desc">
<title id="title">输出相同，两条分支都贡献密度</title><desc id="desc">平方映射把正负两条分支折到同一输出。正负原像的密度贡献相等，漏掉任何一支都会少算一半质量。</desc>

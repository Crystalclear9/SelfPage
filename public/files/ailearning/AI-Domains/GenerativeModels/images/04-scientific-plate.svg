<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="641.2" viewBox="0 0 1440 641.2" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">保留横坐标后，逐列恢复纵坐标</title><rect width="1440" height="641.2" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">保留横坐标后，逐列恢复纵坐标</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="499.2" viewBox="0 0 1400 520" role="img" aria-labelledby="title description" x="48" y="106" overflow="hidden">
<title id="title">耦合层的纵向平移特例</title><desc id="description">保留横坐标，令 z2=x2+αx1。同一竖线上的点按同一距离上下平移。两图每列同宽、每格同高。</desc>
<rect width="1400" height="520" fill="#fff"/>
<defs><linearGradient id="bluefill" x2="0" y2="1"><stop stop-color="#b4ddf5"/><stop offset="1" stop-color="#e7f4f9"/></linearGradient><linearGradient id="orangefill" x2="0" y2="1"><stop stop-color="#f2bba3"/><stop offset="1" stop-color="#ffebe3"/></linearGradient><linearGradient id="simplexfill" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#dcf3e7"/><stop offset=".55" stop-color="#d9e9fa"/><stop offset="1" stop-color="#e8ddf9"/></linearGradient><marker id="axis" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5"><path d="M0 0 11 5 0 10Z" fill="#182737"/></marker><marker id="bluearrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="13" refY="7"><path d="M0 0 15 7 0 14Z" fill="#1e7abd"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182737">
<text x="277" y="65" font-size="33" text-anchor="middle" fill="#182737" font-weight="700">原网格</text>
<text x="1117" y="65" font-size="33" text-anchor="middle" fill="#182737" font-weight="700">变换后网格</text>
<polygon points="79.000,384.000 211.000,384.000 211.000,288.000 79.000,288.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="79.000,288.000 211.000,288.000 211.000,192.000 79.000,192.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="211.000,384.000 343.000,384.000 343.000,288.000 211.000,288.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="211.000,288.000 343.000,288.000 343.000,192.000 211.000,192.000" fill="#f3d6a7" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="343.000,384.000 475.000,384.000 475.000,288.000 343.000,288.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="343.000,288.000 475.000,288.000 475.000,192.000 343.000,192.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<line x1="79.000" y1="384.000" x2="79.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="79" y="461" font-size="21" text-anchor="middle" fill="#182737">0</text>
<line x1="211.000" y1="384.000" x2="211.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="211" y="461" font-size="21" text-anchor="middle" fill="#182737">1</text>
<line x1="343.000" y1="384.000" x2="343.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="343" y="461" font-size="21" text-anchor="middle" fill="#182737">2</text>
<line x1="475.000" y1="384.000" x2="475.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="475" y="461" font-size="21" text-anchor="middle" fill="#182737">3</text>

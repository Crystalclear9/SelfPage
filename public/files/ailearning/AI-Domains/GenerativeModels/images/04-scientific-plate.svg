<text x="919" y="461" font-size="21" text-anchor="middle" fill="#182737">0</text>
<line x1="1051.000" y1="345.720" x2="1051.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1051" y="461" font-size="21" text-anchor="middle" fill="#182737">1</text>
<line x1="1183.000" y1="307.440" x2="1183.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1183" y="461" font-size="21" text-anchor="middle" fill="#182737">2</text>
<line x1="1315.000" y1="269.160" x2="1315.000" y2="433.000" stroke="#9eadc3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1315" y="461" font-size="21" text-anchor="middle" fill="#182737">3</text>
<text x="1117" y="496" font-size="23" text-anchor="middle" fill="#182737">横坐标</text>
<text x="700" y="208" font-size="29" text-anchor="middle" fill="#182737" font-weight="700">保留横坐标</text>
<text x="700" y="249" font-size="27" text-anchor="middle" fill="#1e7abd">逐列纵向平移</text>
<line x1="505.000" y1="274.000" x2="896.000" y2="274.000" stroke="#1e7abd" stroke-width="3.8" marker-end="url(#bluearrow)"/>
<line x1="896.000" y1="340.000" x2="505.000" y2="340.000" stroke="#1e7abd" stroke-width="3.8" marker-end="url(#bluearrow)"/>
<text x="700" y="378" font-size="24" text-anchor="middle" fill="#182737">逆变换减去相同位移</text>
</g>

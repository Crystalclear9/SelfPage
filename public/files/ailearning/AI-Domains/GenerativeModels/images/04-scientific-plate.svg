<polygon points="919.000,288.000 1051.000,249.720 1051.000,153.720 919.000,192.000" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="1051.000,345.720 1183.000,307.440 1183.000,211.440 1051.000,249.720" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="1051.000,249.720 1183.000,211.440 1183.000,115.440 1051.000,153.720" fill="#f3d6a7" stroke="#1e7abd" stroke-width="2.4"/>
<polygon points="1183.000,307.440 1315.000,269.160 1315.000,173.160 1183.000,211.440" fill="url(#bluefill)" stroke="#1e7abd" stroke-width="2.4"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
<title id="title">耦合层的纵向平移特例</title><desc id="description">保留横坐标，令 z2=x2+αx1。同一竖线上的点按同一距离上下平移。两图每列同宽、每格同高。</desc>
<rect width="1400" height="520" fill="#fff"/>
<defs><linearGradient id="bluefill" x2="0" y2="1"><stop stop-color="#b4ddf5"/><stop offset="1" stop-color="#e6f4fa"/></linearGradient><linearGradient id="orangefill" x2="0" y2="1"><stop stop-color="#f8b49d"/><stop offset="1" stop-color="#ffebe3"/></linearGradient><linearGradient id="simplexfill" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#dbf4e7"/><stop offset=".55" stop-color="#d8e9fb"/><stop offset="1" stop-color="#e8dcfa"/></linearGradient><marker id="axis" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5"><path d="M0 0 11 5 0 10Z" fill="#14293b"/></marker><marker id="bluearrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="13" refY="7"><path d="M0 0 15 7 0 14Z" fill="#236eab"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#14293b">
<text x="277" y="65" font-size="33" text-anchor="middle" fill="#14293b" font-weight="700">原网格</text>
<text x="1117" y="65" font-size="33" text-anchor="middle" fill="#14293b" font-weight="700">变换后网格</text>
<polygon points="79.000,384.000 211.000,384.000 211.000,288.000 79.000,288.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="79.000,288.000 211.000,288.000 211.000,192.000 79.000,192.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="211.000,384.000 343.000,384.000 343.000,288.000 211.000,288.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="211.000,288.000 343.000,288.000 343.000,192.000 211.000,192.000" fill="#fae2a0" stroke="#236eab" stroke-width="2.4"/>
<polygon points="343.000,384.000 475.000,384.000 475.000,288.000 343.000,288.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="343.000,288.000 475.000,288.000 475.000,192.000 343.000,192.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<line x1="79.000" y1="384.000" x2="79.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="79" y="461" font-size="21" text-anchor="middle" fill="#14293b">0</text>
<line x1="211.000" y1="384.000" x2="211.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="211" y="461" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<line x1="343.000" y1="384.000" x2="343.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="343" y="461" font-size="21" text-anchor="middle" fill="#14293b">2</text>
<line x1="475.000" y1="384.000" x2="475.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="475" y="461" font-size="21" text-anchor="middle" fill="#14293b">3</text>
<text x="277" y="496" font-size="23" text-anchor="middle" fill="#14293b">横坐标</text>
<polygon points="919.000,384.000 1051.000,345.720 1051.000,249.720 919.000,288.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="919.000,288.000 1051.000,249.720 1051.000,153.720 919.000,192.000" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="1051.000,345.720 1183.000,307.440 1183.000,211.440 1051.000,249.720" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="1051.000,249.720 1183.000,211.440 1183.000,115.440 1051.000,153.720" fill="#fae2a0" stroke="#236eab" stroke-width="2.4"/>
<polygon points="1183.000,307.440 1315.000,269.160 1315.000,173.160 1183.000,211.440" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<polygon points="1183.000,211.440 1315.000,173.160 1315.000,77.160 1183.000,115.440" fill="url(#bluefill)" stroke="#236eab" stroke-width="2.4"/>
<line x1="919.000" y1="384.000" x2="919.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="919" y="461" font-size="21" text-anchor="middle" fill="#14293b">0</text>
<line x1="1051.000" y1="345.720" x2="1051.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1051" y="461" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<line x1="1183.000" y1="307.440" x2="1183.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1183" y="461" font-size="21" text-anchor="middle" fill="#14293b">2</text>
<line x1="1315.000" y1="269.160" x2="1315.000" y2="433.000" stroke="#9bb0bf" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1315" y="461" font-size="21" text-anchor="middle" fill="#14293b">3</text>
<text x="1117" y="496" font-size="23" text-anchor="middle" fill="#14293b">横坐标</text>
<text x="700" y="208" font-size="29" text-anchor="middle" fill="#14293b" font-weight="700">保留横坐标</text>
<text x="700" y="249" font-size="27" text-anchor="middle" fill="#236eab">逐列纵向平移</text>
<line x1="505.000" y1="274.000" x2="896.000" y2="274.000" stroke="#236eab" stroke-width="3.8" marker-end="url(#bluearrow)"/>
<line x1="896.000" y1="340.000" x2="505.000" y2="340.000" stroke="#236eab" stroke-width="3.8" marker-end="url(#bluearrow)"/>
<text x="700" y="378" font-size="24" text-anchor="middle" fill="#14293b">逆变换减去相同位移</text>
</g>
</svg>

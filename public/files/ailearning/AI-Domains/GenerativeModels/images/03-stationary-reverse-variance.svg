"570" x2="905.0" y2="230" stroke="#dfe4eb" stroke-width="2"/><text x="905.0" y="608" font-size="25" fill="#769099" text-anchor="middle">15</text><line x1="1170.0" y1="570" x2="1170.0" y2="230" stroke="#dfe4eb" stroke-width="2"/><text x="1170.0" y="608" font-size="25" fill="#769099" text-anchor="middle">20</text><line x1="110" y1="539.0909090909091" x2="1170" y2="539.0909090909091" stroke="#dfe4eb" stroke-width="2"/><text x="95" y="546.0909090909091" font-size="25" fill="#769099" text-anchor="end">0.75</text><line x1="110" y1="487.5757575757575" x2="1170" y2="487.5757575757575" stroke="#dfe4eb" stroke-width="2"/><text x="95" y="494.5757575757575" font-size="25" fill="#769099" text-anchor="end">0.8</text><line x1="110" y1="384.5454545454545" x2="1170" y2="384.5454545454545" stroke="#dfe4eb" stroke-width="2"/><text x="95" y="391.5454545454545" font-size="25" fill="#769099" text-anchor="end">0.9</text><line x1="110" y1="281.51515151515156" x2="1170" y2="281.51515151515156" stroke="#dfe4eb" stroke-width="2"/><text x="95" y="288.51515151515156" font-size="25" fill="#769099" text-anchor="end">1</text><path d="M110.00,281.52 L1170.00,281.52" fill="none" stroke="#257190" stroke-width="4"/><path d="M110.00,281.52 L163.00,283.10 L216.00,284.73 L269.00,286.43 L322.00,288.23 L375.00,290.16 L428.00,292.27 L481.00,294.59 L534.00,297.18 L587.00,300.12 L640.00,303.49 L693.00,307.43 L746.00,312.07 L799.00,317.67 L852.00,324.55 L905.00,333.23 L958.00,344.57 L1011.00,360.10 L1064.00,383.04 L1117.00,421.69 L1170.00,510.70" fill="none" stroke="#bf6d42" stroke-width="4"/><circle cx="110.0" cy="281.51515151515156" r="5" fill="#bf6d42"/><circle cx="163.0" cy="283.0995659384269" r="5" fill="#bf6d42"/><circle cx="216.0" cy="284.72908040263303" r="5" fill="#bf6d42"/><circle cx="269.0" cy="286.42938917099644" r="5" fill="#bf6d42"/><circle cx="322.0" cy="288.22926130097943" r="5" fill="#bf6d42"/><circle cx="375.0" cy="290.16164046582327" r="5" fill="#bf6d42"/><circle cx="428.0" cy="292.26510205819227" r="5" fill="#bf6d42"/><circle cx="481.0" cy="294.585832037785" r="5" fill="#bf6d42"/><circle cx="534.0" cy="297.1803833528527" r="5" fill="#bf6d42"/><circle cx="587.0" cy="300.11961987534403" r="5" fill="#bf6d42"/><circle cx="640.0" cy="303.4945271760885" r="5" fill="#bf6d42"/><circle cx="693.0" cy="307.4250602210317" r="5" fill="#bf6d42"/><circle cx="746.0" cy="312.0741363612563" r="5" fill="#bf6d42"/><circle cx="799.0" cy="317.67078175308444" r="5" fill="#bf6d42"/><circle cx="852.0" cy="324.5505612474259" r="5" fill="#bf6d42"/><circle cx="905.0" cy="333.23116178815155" r="5" fill="#bf6d42"/><circle cx="958.0" cy="344.56665016481776" r="5" fill="#bf6d42"/><circle cx="1011.0" cy="360.1018873045301" r="5" fill="#bf6d42"/><circle cx="1064.0" cy="383.0382489486717" r="5" fill="#bf6d42"/><circle cx="1117.0" cy="421.6897669565158" r="5" fill="#bf6d42"/><circle cx="1170.0" cy="510.7026084426824" r="5" fill="#bf6d42"/><text x="600" y="185" font-size="28" fill="#1a2b3d" text-anchor="start">蓝：真实逆向方差 β；橙：已知干净值的条件后验方差</text><text x="930" y="445" font-size="28" fill="#bf6d42" text-anchor="start">最终方差 0.777553</text><text x="1180" y="640" font-size="26" fill="#1a2b3d" text-anchor="end">逆向更新次数</text><text x="60" y="685" font-size="28" fill="#1a2b3d" text-anchor="start">两条链都使用解析最优均值；差异来自条件对象和方差，而非训练不足</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 718.855) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">只用精确条件均值反复去噪，也会把分布压窄</text><text x="65" y="170" font-size="28" fill="#1e7499" text-anchor="start">加精确逆过程噪声</text><rect x="480" y="140" width="700" height="46" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1200" y="173" font-size="27" fill="#1e7499" text-anchor="start">方差 1.000000</text><text x="65" y="255" font-size="28" fill="#c66d3a" text-anchor="start">加条件 x0 后验噪声</text><rect x="480" y="225" width="544.2873450000001" height="46" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1200" y="258" font-size="27" fill="#c66d3a" text-anchor="start">方差 0.777553</text><text x="65" y="340" font-size="28" fill="#818fa4" text-anchor="start">完全不加逆过程噪声</text><rect x="480" y="310" width="85.10365821339855" height="46" fill="url(#book-wash-edf5f8)" stroke="#818fa4"/><text x="1200" y="343" font-size="27" fill="#818fa4" text-anchor="start">方差 0.121577</text><text x="65" y="435" font-size="29" fill="#1d3145" text-anchor="start">固定同一精确均值，20 步，α=0.9；无噪声时方差是 0.9^20。</text></g></g></svg></svg>

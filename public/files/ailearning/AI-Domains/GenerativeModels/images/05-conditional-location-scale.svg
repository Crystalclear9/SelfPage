<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img"><title>相同边缘不同条件，正确中心仍可能缺失变化</title><desc>四个等频条件在均值正负2和标准差0.2,0.6间组合。对三系统绘制已知均值与正负两标准差区间，灰色为同条件真实区间；错误条件具有相同边缘但条件平方W2为16，坍缩为0.1844。</desc><rect width="1400" height="990" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="55" font-size="34" fill="#23394b" text-anchor="start" font-weight="600">看总体之前，先把同一条件下的中心和宽度对齐</text><text x="42" y="104" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">第 14 节已知高斯；线段为均值 ±2σ，标记为均值；灰带是对应真实条件</text><text x="475" y="183" font-size="30" fill="#2368a2" text-anchor="middle" font-weight="600">忠实系统</text><text x="845" y="183" font-size="30" fill="#c56728" text-anchor="middle" font-weight="600">条件翻转</text><text x="1215" y="183" font-size="30" fill="#208577" text-anchor="middle" font-weight="600">局部坍缩</text><text x="42" y="252" font-size="26" fill="#23394b" text-anchor="start" font-weight="400">C1: μ = -2</text><text x="42" y="291" font-size="26" fill="#63788a" text-anchor="start" font-weight="400">σ = 0.2</text><line x1="330.0" y1="260" x2="620.0" y2="260" stroke="#d3dee6" stroke-width="1"/><rect x="375.57142857142856" y="247" width="33.14285714285717" height="26" rx="2" fill="#e3e9ef" stroke="none"/><line x1="375.57142857142856" y1="260" x2="408.7142857142857" y2="260" stroke="#2368a2" stroke-width="8"/><line x1="375.57142857142856" y1="250" x2="375.57142857142856" y2="270" stroke="#2368a2" stroke-width="2"/><line x1="408.7142857142857" y1="250" x2="408.7142857142857" y2="270" stroke="#2368a2" stroke-width="2"/><circle cx="392.1428571428571" cy="260" r="7" fill="#2368a2"/><line x1="700.0" y1="260" x2="990.0" y2="260" stroke="#d3dee6" stroke-width="1"/><rect x="745.5714285714286" y="247" width="33.14285714285711" height="26" rx="2" fill="#e3e9ef" stroke="none"/><line x1="911.2857142857142" y1="260" x2="944.4285714285714" y2="260" stroke="#c56728" stroke-width="8"/><line x1="911.285714
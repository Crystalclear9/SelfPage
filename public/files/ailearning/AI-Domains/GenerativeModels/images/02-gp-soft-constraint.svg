<title id="title">WGAN梯度惩罚的软约束偏差</title><desc id="desc">真实点0，生成点2，线性critic f(x)=wx。有限惩罚lambda最优w=-1-1/lambda，Lipschitz常数超过1。lambda10时原始分差2.2，减惩罚后2.1，均非真实W1距离2。</desc>

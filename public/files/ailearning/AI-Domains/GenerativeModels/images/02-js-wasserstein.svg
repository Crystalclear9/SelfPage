<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 487" role="img" aria-labelledby="title description">
<title id="title">点质量接近时JS平台与Wasserstein距离的对照</title>
<desc id="description">P 是原点处点质量，Q 在 θ。θ 大于零时两支撑不交，JS 恒为 ln 2。Wasserstein 一阶距离为 θ。两者都在 θ 等于零时取零。</desc>

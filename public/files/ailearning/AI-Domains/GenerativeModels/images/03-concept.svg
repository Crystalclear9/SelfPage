<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>扩散模型的加噪与反向采样</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">扩散模型的加噪与反向采样</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">同一个像素的信号项与噪声项如何合成</text><rect x="130" y="220" width="110" height="260" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="185.0" y="208" font-size="24" fill="#19344d" text-anchor="middle">2</text><text x="185.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">x<tspan font-size="72%" dy="0.25em">0</tspan><tspan dy="-0.25em" /></text><rect x="275" y="272.0" width="110" height="208.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="330.0" y="260.0" font-size="24" fill="#19344d" text-anchor="middle">1.6</text><text x="330.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">0.8x<tspan font-size="72%" dy="0.25em">0</tspan><tspan dy="-0.25em" /></text><path d="M122,480 L400,480" stroke="#64788b" stroke-width="2" fill="none" /><path d="M560,350 L800,350" stroke="#64788b" stroke-width="2" fill="none" /><rect x="620" y="350" width="110" height="78" rx="3" fill="#d66b28" stroke="white" stroke-width="2" /><text x="675" y="470" font-size="27" fill="#19344d" text-anchor="middle">−0.6</text><text x="570" y="280" font-size="25" fill="#19344d" text-anchor="start">噪声项：0.6ε</text><rect x="960" y="350" width="110" height="130" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="1015.0" y="338" font-size="24" fill="#19344d" text-anchor="middle">1</text><text x="1015.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">x<tspan font-size="72%" dy="0.25em">t</tspan><tspan dy="-0.25em" /></text><path d="M952,480 L1085,480" stroke="#64788b" stroke-width="2" fill="none" /><text x="210" y="580" font-size="29" fill="#d66b28" text-anchor="start">x<tspan font-size="72%" dy="0.25em">0</tspan><tspan dy="-0.25em"> = 2，ε = −1：1.6 − 0.6 = 1</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" viewBox="0 0 1200 638" role="img"><title>高斯观测噪声尺度改变重构项权重</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="638" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="32" fill="#213447">高斯观测噪声尺度改变重构项权重</text><line x1="90" y1="512.3199999999999" x2="1100" y2="512.3199999999999" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="195.51999999999995" width="125" height="316.80000000000007" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="24" fill="#213447">标准差 0.5</text><text x="170.0" y="178.71999999999997" font-size="25.0" fill="#213447">2</text><rect x="463.3333333333333" y="433.12" width="125" height="79.2" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="453.3333333333333" y="604.0" font-size="24" fill="#213447">标准差 1</text><text x="463.3333333333333" y="416.32" font-size="25.0" fill="#213447">0.5</text><rect x="756.6666666666666" y="492.52000000000004" width="125" height="19.8" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="746.6666666666666" y="604.0" font-size="24" fill="#213447">标准差 2</text><text x="756.6666666666666" y="475.72" font-size="25.0" fill="#213447">0.125</text><text x="115" y="102" font-size="26" fill="#213447">平方误差项的系数</text></g><desc> 纵轴：平方重构误差前的系数，为 1 除以两倍方差。 固定 σ 的高斯负对数似然另有常数项；若学习 σ，不能省去 log σ 项。</desc></svg>

<view id="textbook-detail-2-2" viewBox="589.100000 267.460000 780.900000 354.540000"/><title id="label">分离的支持让判别结果饱和，距离却不告诉你往哪移</title><desc id="detail">真实支持与生成支持分离，最优判别器在两支持上的值分别为 1 和 0。平移后仍分离时 JS 为 ln 2。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1370" height="622" fill="white" stroke="none" stroke-width="1.6"/><line x1="116" y1="238" x2="1225" y2="238" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-ink)"/><polygon points="195,238 316,155 437,238" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><polygon points="760,238 881,155 1002,238" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.65" stroke-linejoin="round"/><text x="317" y="127" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">真实分布</text><text x="880" y="127" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">生成分布</text><text x="317" y="289" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">D* = 1</text><text x="881" y="289" fill="#a84b3b" font-size="27" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">D* = 0</text><line x1="116" y1="495" x2="1225" y2="495" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-ink)"/><polygon points="195,495 316,412 437,495" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><polygon points="867,495 988,412 1109,495" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.65" stroke-linejoin="round"/><text x="317" y="384" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">真实分布</text><text x="987" y="384" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">生成分布</text><text x="317" y="546" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">D* = 1</text><text x="988" y="546" fill="#a84b3b" font-size="27" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">D* = 0</text><line x1="746" y1="318" x2="930" y2="318" stroke="#655184" stroke-width="2.15" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="841" y="353" fill="#655184" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">只平移生成支持</text><text x="675" y="594" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">两次都分离，JS 均为 ln 2</text></svg>
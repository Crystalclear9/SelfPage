<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="699" viewBox="0 0 1200 699" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">判别器比较两个来源在同一位置的质量</title>
<desc id="fig-desc">在负二处真实与生成质量比为一比二；在正二处只有真实质量。</desc>
<rect x="0" y="0" width="1200" height="699" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">先问同一个位置，真实和生成各占多少</text>
<text x="74" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">位置 −2</text>
<text x="74" y="198" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">真实 P</text>
<path d="M194 192 L487 192" fill="none" stroke="#dbe8eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M194 217 L206 167 L340.5 167 L328.5 217 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="267.25" y="200.05" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">0.5</text>
<text x="74" y="295" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">生成 Q</text>
<path d="M194 289 L487 289" fill="none" stroke="#dbe8eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M194 314 L206 264 L487 264 L475 314 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="340.5" y="297.05" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">1</text>
<text x="74" y="428" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">最优 D =</text>
<text x="249" y="413" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">1</text>
<path d="M229 419 L269 419" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="249" y="444" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">3</text>
<text x="74" y="511" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">真实和生成混在一起。</text>
<text x="649" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">位置 +2</text>
<text x="649" y="198" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">真实 P</text>
<path d="M769 192 L1062 192" fill="none" stroke="#dbe8eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M769 217 L781 167 L915.5 167 L903.5 217 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="842.25" y="200.05" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">0.5</text>
<text x="649" y="295" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">生成 Q</text>
<path d="M769 289 L1062 289" fill="none" stroke="#dbe8eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="769" cy="289" r="5.5" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="787" y="295" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">0</text>
<text x="649" y="428" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">最优 D =</text>
<text x="824" y="413" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">1</text>
<path d="M804 419 L844 419" fill="none" stroke="#166d75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="824" y="444" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">1</text>
<text x="649" y="511" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">该位置只有真实质量。</text>
<path d="M75 555 L1125 555" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="606" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">两处共用质量尺度。等先验下，判别概率为真实质量占两来源总质量的比例。</text>
<text x="74" y="653" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">理想 D 可以取 1，有限 logit 的 sigmoid 只能趋近它。</text>
</svg>

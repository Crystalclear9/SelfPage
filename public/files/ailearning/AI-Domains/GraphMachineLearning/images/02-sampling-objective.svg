<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="711" viewBox="26 59 1142 711" role="img" aria-labelledby="title desc">
<rect x="26" y="59" width="1142" height="711" fill="#ffffff"/><title id="title">邻居采样改变训练目标</title><desc id="desc">两个邻居消息1和3，等概率抽一个，均值估计无偏。平方损失的采样目标比全邻域目标多w平方除以2，最优参数从0.5变为0.4。</desc>
<rect width="1200" height="800" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="99" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">固定邻居消息为 1 和 3；单个线性权重 w，监督目标 y = 1</text>
<text x="44" y="158" font-size="28" fill="#213447" text-anchor="start" font-weight="700">① 同一个均值，不同随机性</text>
<circle cx="105" cy="255" r="38" fill="#2865a0"/>
<text x="105" y="265" font-size="29" fill="white" text-anchor="middle" font-weight="700">1</text>
<circle cx="275" cy="255" r="38" fill="#2865a0"/>
<text x="275" y="265" font-size="29" fill="white" text-anchor="middle" font-weight="700">3</text>
<line x1="105" y1="293" x2="190" y2="348" stroke="#2865a0" stroke-width="3"/>
<line x1="275" y1="293" x2="190" y2="348" stroke="#2865a0" stroke-width="3"/>
<rect x="70" y="350" width="240" height="70" rx="12" fill="#eaf2f9" stroke="none"/>
<text x="190" y="394" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="700">完整均值 = 2</text>
<text x="60" y="475" font-size="25" fill="#213447" text-anchor="start" font-weight="400">抽一个：1 或 3，各一半</text>
<text x="60" y="521" font-size="25" fill="#213447" text-anchor="start" font-weight="400">采样均值的期望 = 2</text>
<text x="60" y="567" font-size="25" fill="#213447" text-anchor="start" font-weight="400">采样均值的方差 = 1</text>
<text x="440" y="158" font-size="28" fill="#213447" text-anchor="start" font-weight="700">② 比较两条完整目标曲线</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="986.8" viewBox="0 0 1440 986.8" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同一图A与不同图B组成批次后批归一化输出的变化</title><rect width="1440" height="986.8" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同一图A与不同图B组成批次后批归一化输出的变化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="844.8" viewBox="0 0 1400 880" role="img" x="48" y="106" overflow="hidden"><title>没有跨图边，批归一化仍能传递批组成的影响</title><rect width="1400" height="880" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#1a2a3b" text-anchor="start" font-weight="normal">没有跨图边，批归一化仍能传递批组成的影响</text><text x="60" y="112" font-size="26" fill="#738d99" text-anchor="start" font-weight="normal">训练模式；一个特征通道；γ=1，β=0，ε=0；方差用节点数作分母</text><text x="60" y="195" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">批次 1</text><circle cx="260" cy="230" r="37" fill="#227292"/><text x="260" y="240" font-size="28" fill="white" text-anchor="middle" font-weight="normal">0</text><circle cx="390" cy="230" r="37" fill="#227292"/><text x="390" y="240" font-size="28" fill="white" text-anchor="middle" font-weight="normal">2</text><circle cx="610" cy="230" r="37" fill="#bd6a3f"/><text x="610" y="240" font-size="28" fill="white" text-anchor="middle" font-weight="normal">4</text><circle cx="740" cy="230" r="37" fill="#bd6a3f"/><text x="740" y="240" font-size="28" fill="white" text-anchor="middle" font-weight="normal">6</text><line x1="297" y1="230" x2="353" y2="230" stroke="#227292" stroke-width="4"/><line x1="647" y1="230" x2="703" y2="230" stroke="#bd6a3f" stroke-width="4"/><text x="260" y="306" font-size="26" fill="#227292" text-anchor="start" font-weight="normal">图 A：保持不变</text><text x="605" y="306" font-size="26" fill="#bd6a3f" text-anchor="start" font-weight="normal">图 B：更换同伴</text><text x="920" y="197" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">均值 3；方差 5</text><text x="920" y="262" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">A 输出</text><text x="920" y="307" font-size="29" fill="#227292" text-anchor="start" font-weight="normal">(-1.3416, -0.4472)</text><text x="60" y="430" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">批次 2</text><circle cx="260" cy="465" r="37" fill="#227292"/><text x="260" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="normal">0</text><circle cx="390" cy="465" r="37" fill="#227292"/><text x="390" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="normal">2</text><circle cx="610" cy="465" r="37" fill="#bd6a3f"/><text x="610" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="normal">100</text><circle cx="740" cy="465" r="37" fill="#bd6a3f"/><text x="740" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="normal">102</text><line x1="297" y1="465" x2="353" y2="465" stroke="#227292" stroke-width="4"/><line x1="647" y1="465" x2="703" y2="465" stroke="#bd6a3f" stroke-width="4"/><text x="260" y="541" font-size="26" fill="#227292" text-anchor="start" font-weight="normal">图 A：保持不变</text><text x="605" y="541" font-size="26" fill="#bd6a3f" text-anchor="start" font-weight="normal">图 B：更换同伴</text><text x="920" y="432" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">均值 51；方差 2501</text><text x="920" y="497" font-size="27" fill="#1a2a3b" text-anchor="start" font-weight="normal">A 输出</text><text x="920" y="542" font-size="29" fill="#227292" text-anchor="start" font-weight="normal">(-1.0198, -0.9798)</text><line x1="60" y1="628" x2="1340" y2="628" stroke="#e0e4eb" stroke-width="2"/><text x="60" y="690" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">按图 A 自身统计：均值 1，方差 1</text><text x="800" y="690" font-size="31" fill="#388e8b" text-anchor="start" font-weight="normal">两批都得到 (−1, 1)</text><text x="60" y="766" font-size="29" fill="#1a2a3b" text-anchor="start" font-weight="normal">边隔离限定消息传播；统计范围是另一条依赖路径。</text><text x="60" y="827" font-size="27" fill="#738d99" text-anchor="start" font-weight="normal">使用固定运行统计的标准 eval 行为，不等于上面逐批重新计算。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1076" height="539" viewBox="97 68 1076 539" role="img"><rect x="97" y="68" width="1076" height="539" fill="#ffffff"/><title id="figure-title">倒概率补偿保留总和，抽样概率改变方差</title><desc id="figure-desc">倒概率补偿保留总和，抽样概率改变方差</desc><rect width="1200" height="635" fill="white"/><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="600" y="110" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">两个固定消息的总和：1 + 3 = 4；每次只抽一个</text><text x="300" y="170" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">均匀概率</text><circle cx="300" cy="235" r="35" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="300" y="245" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">抽样</text><line x1="280" y1="275" x2="160" y2="325" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="230.0" y="280" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">p=0.5</text><circle cx="160" cy="370" r="33" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="160" y="380" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="160.0" y="458" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">1</text><line x1="115" y1="470" x2="205" y2="470" stroke="#213447" stroke-width="1.8"/><text x="160.0" y="503" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">0.5</text><text x="230" y="480" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">= 2</text><line x1="320" y1="275" x2="440" y2="325" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="370.0" y="280" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">p=0.5</text><circle cx="440" cy="370" r="33" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="440" y="380" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><text x="440.0" y="458" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">3</text><line x1="395" y1="470" x2="485" y2="470" stroke="#213447" stroke-width="1.8"/><text x="440.0" y="503" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">0.5</text><text x="510" y="480" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">= 6</text><text x="300" y="585" font-size="30" fill="#cf7432" text-anchor="middle" font-weight="400">期望 = 4；方差 = 4</text><text x="900" y="170" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">按正贡献分配概率</text><circle cx="900" cy="235" r="35" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="900" y="245" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">抽样</text><line x1="880" y1="275" x2="760" y2="325" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="830.0" y="280" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">p=0.25</text><circle cx="760" cy="370" r="33" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="760" y="380" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="760.0" y="458" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">1</text><line x1="715" y1="470" x2="805" y2="470" stroke="#213447" stroke-width="1.8"/><text x="760.0" y="503" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">0.25</text><text x="830" y="480" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">= 4</text><line x1="920" y1="275" x2="1040" y2="325" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="970.0" y="280" 
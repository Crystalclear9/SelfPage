<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>平均传播削弱什么，取决于任务信号怎样分布</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">平均传播削弱什么，取决于任务信号怎样分布</text><text x="60" y="125" font-size="27" fill="#19343e" text-anchor="start">n 个叶子各有独立噪声，标准差 σ；根节点取它们的均值</text><text x="60" y="185" font-size="29" fill="#c2673f" text-anchor="start">只在一个叶子出现信号 a</text><text x="670" y="185" font-size="29" fill="#276a80" text-anchor="start">每个叶子都包含共同信号 a</text><circle cx="100" cy="265" r="22" fill="#c2673f"/><line x1="100" y1="290" x2="260" y2="360" stroke="#74888d" stroke-width="4"/><path d="M248.05,361.05 L260.00,360.00 L252.66,350.51" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="180" cy="265" r="22" fill="#dbe5e8"/><line x1="180" y1="290" x2="260" y2="360" stroke="#74888d" stroke-width="4"/><path d="M248.29,357.39 L260.00,360.00 L255.86,348.74" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="260" cy="265" r="22" fill="#dbe5e8"/><line x1="260" y1="290" x2="260" y2="360" stroke="#74888d" stroke-width="4"/><path d="M254.25,349.47 L260.00,360.00 L265.75,349.47" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="340" cy="265" r="22" fill="#dbe5e8"/><line x1="340" y1="290" x2="260" y2="360" stroke="#74888d" stroke-width="4"/><path d="M264.14,348.74 L260.00,360.00 L271.71,357.39" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="420" cy="265" r="22" fill="#dbe5e8"/><line x1="420" y1="290" x2="260" y2="360" stroke="#74888d" stroke-width="4"/><path d="M267.34,350.51 L260.00,360.00 L271.95,361.05" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="260" cy="390" r="32" fill="#c2673f"/><text x="260" y="400" font-size="24" fill="white" text-anchor="middle">均值</text><text x="60" y="470" font-size="28" fill="#c2673f" text-anchor="start">信号均值：a ÷ n</text><text x="60" y="520" font-size="28" fill="#19343e" text-anchor="start">噪声标准差：σ ÷ √n</text><text x="60" y="575" font-size="29" fill="#c2673f" text-anchor="start">信噪比：a ÷ (σ√n)</text><circle cx="710" cy="265" r="22" fill="#276a80"/><line x1="710" y1="290" x2="870" y2="360" stroke="#74888d" stroke-width="4"/><path d="M858.05,361.05 L870.00,360.00 L862.66,350.51" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="790" cy="265" r="22" fill="#276a80"/><line x1="790" y1="290" x2="870" y2="360" stroke="#74888d" stroke-width="4"/><path d="M858.29,357.39 L870.00,360.00 L865.86,348.74" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="870" cy="265" r="22" fill="#276a80"/><line x1="870" y1="290" x2="870" y2="360" stroke="#74888d" stroke-width="4"/><path d="M864.25,349.47 L870.00,360.00 L875.75,349.47" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="950" cy="265" r="22" fill="#276a80"/><line x1="950" y1="290" x2="870" y2="360" stroke="#74888d" stroke-width="4"/><path d="M874.14,348.74 L870.00,360.00 L881.71,357.39" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="1030" cy="265" r="22" fill="#276a80"/><line x1="1030" y1="290" x2="870" y2="360" stroke="#74888d" stroke-width="4"/><path d="M877.34,350.51 L870.00,360.00 L881.95,361.05" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="870" cy="390" r="32" fill="#276a80"/><text x="870" y="400" font-size="24" fill="white" text-anchor="middle">均值</text><text x="670" y="470" font-size="28" fill="#276a80" text-anchor="start">信号均值：a</text><text x="670" y="520" font-size="28" fill="#19343e" text-anchor="start">噪声标准差：σ ÷ √n</text><text x="670" y="575" font-size="29" fill="#276a80" text-anchor="start">信噪比：a√n ÷ σ</text><line x1="620" y1="165" x2="620" y2="620" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="670" font-size="28" fill="#19343e" text-anchor="start">a = 4，σ = 1：n 从 4 增至 64</text><text x="60" y="720" font-size="28" fill="#c2673f" text-anchor="start">稀疏信号的信噪比：2 → 0.5</text><text x="670" y="720" font-size="28" fill="#276a80" text-anchor="start">共同信号的信噪比：8 → 32</text></g></svg>

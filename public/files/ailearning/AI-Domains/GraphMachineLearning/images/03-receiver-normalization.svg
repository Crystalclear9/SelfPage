middle">B</text><circle cx="668" cy="181" r="34" stroke="#196f77" stroke-width="2" fill="url(#wash-teal)"/><text x="668" y="191.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">U</text><circle cx="668" cy="379" r="34" stroke="#a84b3b" stroke-width="2" fill="url(#wash-coral)"/><text x="668" y="389.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">V</text><line x1="711" y1="181" x2="826" y2="181" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="850,222 1123,222 1168,140 895,140" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="1009" y="191.5" fill="#196f77" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">两条入边分别归一</text><text x="1008" y="275" fill="#196f77" font-size="24" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">w(A→U) + w(S→U) = 1</text><line x1="711" y1="379" x2="826" y2="379" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/><polygon points="850,420 1123,420 1168,338 895,338" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="1009" y="389.5" fill="#a84b3b" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">两条入边分别归一</text><text x="1008" y="473" fill="#a84b3b" font-size="24" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">w(S→V) + w(B→V) = 1</text><text x="316" y="536" fill="#655184" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">同一个发送节点可有两种权重</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">两跳不是一句标签：沿同一链图逐层计算</title><desc id="desc">五节点自环链，GCN对称归一化，无通道变换与激活。输入仅节点2为1。两层后节点0收到1/(3 sqrt6)，节点3到节点0仍无两步路径。</desc><rect width="1400" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="45" y="58" font-size="37" fill="#20343d" text-anchor="start" font-weight="700">两跳不是一句标签：沿同一链图逐层计算</text>
<text x="45" y="108" font-size="28" fill="#91a1aa" text-anchor="start" font-weight="400">五节点链加单位自环；只传播标量，不加权重矩阵或激活。</text>

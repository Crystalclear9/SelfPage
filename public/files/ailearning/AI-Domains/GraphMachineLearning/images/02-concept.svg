<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img"><title>同一计算的三种画法：图身份、展开槽位、节点层状态</title><rect width="1280" height="980" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">同一计算的三种画法：图身份、展开槽位、节点层状态</text><text x="60" y="120" font-size="27" fill="#19343e" text-anchor="start">均值路径：v[0] = 2，c[0] = 6；a[1] = b[1] = 4；v[2] = 4。</text><text x="200" y="205" font-size="28" fill="#19343e" text-anchor="middle">原图：4 个身份</text><text x="650" y="205" font-size="28" fill="#19343e" text-anchor="middle">展开：7 个槽位</text><text x="1050" y="205" font-size="28" fill="#19343e" text-anchor="middle">复用：5 个状态</text><line x1="200" y1="300" x2="100" y2="470" stroke="#74888d" stroke-width="3"/><line x1="200" y1="300" x2="300" y2="470" stroke="#74888d" stroke-width="3"/><line x1="100" y1="470" x2="200" y2="640" stroke="#74888d" stroke-width="3"/><line x1="300" y1="470" x2="200" y2="640" stroke="#74888d" stroke-width="3"/><circle cx="200" cy="300" r="36" fill="#c2673f"/><text x="200" y="310" font-size="28" fill="white" text-anchor="middle">v</text><circle cx="100" cy="470" r="36" fill="#276a80"/><text x="100" y="480" font-size="28" fill="white" text-anchor="middle">a</text><circle cx="300" cy="470" r="36" fill="#276a80"/><text x="300" y="480" font-size="28" fill="white" text-anchor="middle">b</text><circle cx="200" cy="640" r="36" fill="#276a80"/><text x="200" y="650" font-size="28" fill="white" text-anchor="middle">c</text><line x1="470" y1="640" x2="540" y2="470" stroke="#276a80" stroke-width="4"/><path d="M541.31,481.93 L540.00,470.00 L530.67,477.55" fill="none" stroke="#276a80" stroke-width="4"/><line x1="590" y1="640" x2="540" y2="470" stroke="#276a80" stroke-width="4"/><path d="M548.49,478.48 L540.00,470.00 L537.45,481.73" fill="none" stroke="#276a80" stroke-width="4"/><line x1="710" y1="640" x2="760" y2="470" stroke="#276a80" stroke-width="4"/><path d="M762.55,481.73 L760.00,470.00 L751.51,478.48" fill="none" stroke="#276a80" stroke-width="4"/><line x1="830" y1="640" x2="760" y2="470" stroke="#276a80" stroke-width="4"/><path d="M769.33,477.55 L760.00,470.00 L758.69,481.93" fill="none" stroke="#276a80" stroke-width="4"/><line x1="540" y1="470" x2="650" y2="300" stroke="#276a80" stroke-width="4"/><path d="M649.11,311.97 L650.00,300.00 L639.45,305.72" fill="none" stroke="#276a80" stroke-width="4"/><line x1="760" y1="470" x2="650" y2="300" stroke="#276a80" stroke-width="4"/><path d="M660.55,305.72 L650.00,300.00 L650.89,311.97" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="650" cy="300" r="44" fill="#c2673f"/><text x="650" y="310" font-size="28" fill="white" text-anchor="middle">v[2]</text><circle cx="540" cy="470" r="44" fill="#276a80"/><text x="540" y="480" font-size="28" fill="white" text-anchor="middle">a[1]</text><circle cx="760" cy="470" r="44" fill="#276a80"/><text x="760" y="480" font-size="28" fill="white" text-anchor="middle">b[1]</text><circle cx="470" cy="640" r="44" fill="#c2673f"/><text x="470" y="650" font-size="28" fill="white" text-anchor="middle">v[0]</text><circle cx="590" cy="640" r="44" fill="#276a80"/><text x="590" y="650" font-size="28" fill="white" text-anchor="middle">c[0]</text><circle cx="710" cy="640" r="44" fill="#c2673f"/><text x="710" y="650" font-size="28" fill="white" text-anchor="middle">v[0]</text><circle cx="830" cy="640" r="44" fill="#276a80"/><text x="830" y="650" font-size="28" fill="white" text-anchor="middle">c[0]</text><text x="470" y="720" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="590" y="720" font-size="30" fill="#19343e" text-anchor="middle">6</text><text x="710" y="720" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="830" y="720" font-size="30" fill="#19343e" text-anchor="middle">6</text><line x1="960" y1="640" x2="960" y2="470" stroke="#276a80" stroke-width="4"/><path d="M965.75,480.53 L960.00,470.00 L954.25,480.53" fill="none" stroke="#276a80" stroke-width="4"/><line x1="1180" y1="640" x2="960" y2="470" stroke="#276a80" stroke-width="4"/><path d="M971.85,471.89 L960.00,470.00 L964.82,480.99" fill="none" stroke="#276a80" stroke-width="4"/><line x1="960" y1="640" x2="1180" y2="470" stroke="#276a80" stroke-width="4"/><path d="M1175.18,480.99 L1180.00,470.00 L1168.15,471.89" fill="none" stroke="#276a80" stroke-width="4"/><line x1="1180" y1="640" x2="1180" y2="470" stroke="#276a80" stroke-width="4"/><path d="M1185.75,480.53 L1180.00,470.00 L1174.25,480.53" fill="none" stroke="#276a80" stroke-width="4"/><line x1="960" y1="470" x2="1070" y2="300" stroke="#276a80" stroke-width="4"/><path d="M1069.11,311.97 L1070.00,300.00 L1059.45,305.72" fill="none" stroke="#276a80" stroke-width="4"/><line x1="1180" y1="470" x2="1070" y2="300" stroke="#276a80" stroke-width="4"/><path d="M1080.55,305.72 L1070.00,300.00 L1070.89,311.97" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="1070" cy="300" r="44" fill="#c2673f"/><text x="1070" y="310" font-size="28" fill="white" text-anchor="middle">v[2]</text><circle cx="960" cy="470" r="44" fill="#276a80"/><text x="960" y="480" font-size="28" fill="white" text-anchor="middle">a[1]</text><circle cx="1180" cy="470" r="44" fill="#276a80"/><text x="1180" y="480" font-size="28" fill="white" text-anchor="middle">b[1]</text><circle cx="960" cy="640" r="44" fill="#c2673f"/><text x="960" y="650" font-size="28" fill="white" text-anchor="middle">v[0]</text><circle cx="1180" cy="640" r="44" fill="#276a80"/><text x="1180" y="650" font-size="28" fill="white" text-anchor="middle">c[0]</text><text x="960" y="720" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="1180" y="720" font-size="30" fill="#19343e" text-anchor="middle">6</text><line x1="60" y1="770" x2="1220" y2="770" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="830" font-size="29" fill="#c2673f" text-anchor="start">v[0] 与 v[2] 属于同一实体，却是不同层的数值：2 与 4。</text><text x="60" y="890" font-size="28" fill="#19343e" text-anchor="start">去重只合并底部重复读取；6 条依赖边仍要完整保留。</text><text x="60" y="945" font-size="27" fill="#74888d" text-anchor="start">这里不含中心拼接或 dropout；独立随机状态不能据节点编号强行复用。</text></g></svg>

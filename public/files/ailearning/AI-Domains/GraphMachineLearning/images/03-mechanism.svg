<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 414.960000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 414.960000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 313.040000 684.000000 414.960000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 313.040000 684.000000 414.960000"/>
<title id="fig-title">加性查询不会改变固定候选的排序</title>
<desc id="fig-desc">查询统一平移，跨 LeakyReLU 拐点能改变相对间距。同一线性分支内的共同平移被 softmax 消去。</desc>
<rect x="0" y="0" width="1200" height="728" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">注意力权重能变，邻居排序仍可能不变</text>
<text x="74" y="111" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">邻居项固定为 (−2, −1, 1)，LeakyReLU 负半轴斜率 0.2。</text>
<rect x="236" y="181" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="369.5" y="229" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(−2, −1, 1)</text>
<rect x="507" y="181" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="640.5" y="229" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(−0.4, −0.2, 1.0)</text>
<rect x="778" y="181" width="267" height="80" fill="#fbede8" opacity="1"/>
<text x="911.5" y="229" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.1593, 0.1946, 0.6461</text>
<text x="220" y="229" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">查询 +0</text>
<rect x="236" y="265" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="369.5" y="313" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(0, 1, 3)</text>
<rect x="507" y="265" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="640.5" y="313" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(0.0, 1.0, 3.0)</text>
<rect x="778" y="265" width="267" height="80" fill="#fbede8" opacity="1"/>
<text x="911.5" y="313" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.0420, 0.1142, 0.8438</text>
<text x="220" y="313" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">查询 +2</text>
<rect x="236" y="349" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="369.5" y="397" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(1, 2, 4)</text>
<rect x="507" y="349" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="640.5" y="397" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(1.0, 2.0, 4.0)</text>
<rect x="778" y="349" width="267" height="80" fill="#ecf6f6" opacity="1"/>
<text x="911.5" y="397" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.0420, 0.1142, 0.8438</text>
<text x="220" y="397" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">查询 +3</text>
<rect x="236" y="433" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="369.5" y="481" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(2, 3, 5)</text>
<rect x="507" y="433" width="267" height="80" fill="#f1f5f6" opacity="1"/>
<text x="640.5" y="481" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">(2.0, 3.0, 5.0)</text>
<rect x="778" y="433" width="267" height="80" fill="#ecf6f6" opacity="1"/>
<text x="911.5" y="481" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.0420, 0.1142, 0.8438</text>
<text x="220" y="481" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">查询 +4</text>
<text x="369.5" y="167" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">预激活</text>
<text x="640.5" y="167" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">LeakyReLU 后</text>
<text x="911.5" y="167" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">邻居 1、2、3 的权重</text>
<path d="M75 546 L1125 546" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="599" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">前两行的分布改变，但邻居次序仍为 3 &gt; 2 &gt; 1。</text>
<text x="74" y="651" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">后两行全在正半轴，权重完全相同。</text>
</svg>

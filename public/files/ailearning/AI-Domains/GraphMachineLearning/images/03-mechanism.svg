<g id="round-20261105c-teaching" transform="translate(0 816.568) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">当所有项落在同一线性分支，查询项甚至完全抵消</text><rect x="70" y="145" width="542" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="341.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">查询 c=3</text><rect x="620" y="145" width="542" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="891.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">打分 1,2,4</text><rect x="70" y="220" width="542" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="341.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">查询 c=4</text><rect x="620" y="220" width="542" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="891.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">打分 2,3,5</text><text x="70" y="335" font-size="31" fill="#1d3145" text-anchor="start">两行 softmax 相同：(0.0420, 0.1142, 0.8438)</text><text x="70" y="415" font-size="29" fill="#1d3145" text-anchor="start">邻居偏置固定为 −2,−1,1；所有预激活均为正。</text></g></g></svg></svg>

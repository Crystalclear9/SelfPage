<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="853" viewBox="42 79 1104 853" role="img"><rect x="42" y="79" width="1104" height="853" fill="#ffffff"/><title>同一邻域，三种聚合：中心信息在哪一步被混合</title><rect width="1280" height="950" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="27" fill="#74888d" text-anchor="start">固定旧输入：邻居 1 与 5，中心 2；本图只比较聚合，不加训练参数。</text><circle cx="280" cy="230" r="36" fill="#276a80"/><text x="280" y="240" font-size="28" fill="white" text-anchor="middle">1</text><circle cx="640" cy="230" r="36" fill="#c2673f"/><text x="640" y="240" font-size="28" fill="white" text-anchor="middle">2</text><circle cx="1000" cy="230" r="36" fill="#276a80"/><text x="1000" y="240" font-size="28" fill="white" text-anchor="middle">5</text><line x1="325" y1="230" x2="585" y2="230" stroke="#276a80" stroke-width="4"/><path d="M574.47,235.75 L585.00,230.00 L574.47,224.25" fill="none" stroke="#276a80" stroke-width="4"/><line x1="955" y1="230" x2="695" y2="230" stroke="#276a80" stroke-width="4"/><path d="M705.53,224.25 L695.00,230.00 L705.53,235.75" fill="none" stroke="#276a80" stroke-width="4"/><text x="640" y="305" font-size="28" fill="#c2673f" text-anchor="middle">接收中心</text><text x="60" y="410" font-size="29" fill="#19343e" text-anchor="start">邻域均值，中心单独留</text><rect x="420" y="377" width="65.0" height="48" fill="#276a80"/><text x="452.5" y="325" font-size="25" fill="#276a80" text-anchor="middle">0.500</text><rect x="485.0" y="377" width="325.0" height="48" fill="#5d8c79"/><text x="647.5" y="362" font-size="25" fill="#5d8c79" text-anchor="middle">2.500</text><text x="900" y="410" font-size="27" fill="#19343e" text-anchor="start">邻域 3；拼接 [2,3]</text><line x1="420" y1="445" x2="850" y2="445" stroke="#74888d" stroke-width="2"/><text x="60" y="580" font-size="29" fill="#19343e" text-anchor="start">中心也进入均值</text><rect x="420" y="547" width="43.33333333333333" height="48" fill="#276a80"/><text x="441.6666666666667" y="495" font-size="25" fill="#276a80" text-anchor="middle">0.333</text><rect x="463.3333333333333" y="547" width="86.66666666666666" height="48" fill="#c2673f"/><text x="506.66666666666663" y="532" font-size="25" fill="#c2673f" text-anchor="middle">0.667</text><rect x="550.0" y="547" width="216.66666666666669" height="48" fill="#5d8c79"/><text x="658.3333333333334" y="532" font-size="25" fill="#5d8c79" text-anchor="middle">1.667</text><text x="900" y="580" font-size="27" fill="#19343e" text-anchor="start">含自身均值 2.6667</text><line x1="420" y1="615" x2="850" y2="615" stroke="#74888d" stroke-width="2"/><text x="60" y="750" font-size="29" fill="#19343e" text-anchor="start">对称归一化 GCN</text><rect x="420" y="717" width="53.0722777603022" height="48" fill="#276a80"/><text x="446.5361388801511" y="665" font-size="25" fill="#276a80" text-anchor="middle">0.408</text><rect x="473.0722777603022" y="717" width="86.66666666666666" height="48" fill="#c2673f"/><text x="516.4056110936356" y="702" font-size="25" fill="#c2673f" text-anchor="middle">0.667</text><rect x="559.7389444269688" y="717" width="265.361388801511" height="48" fill="#5d8c79"/><text x="692.4196388277244" y="702" font-size="25" fill="#5d8c79" text-anchor="middle">2.041</text><text x="900" y="750" font-size="27" fill="#19343e" text-anchor="start">中心输出 3.1162</text><line x1="420" y1="785" x2="850" y2="785" stroke="#74888d" stroke-width="2"/><text x="60" y="910" font-size="27" fill="#19343e" text-anchor="start">蓝/绿：两个邻居贡献；橙：中心贡献。三条长度轴使用相同刻度。</text></g></svg>

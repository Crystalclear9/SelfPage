<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="573" viewBox="0 0 1320 573" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">图中 A、B、D 的消息汇入中心 C，E 没有通向 C 的直接边</title><desc id="plate-desc">一层只从 A、B、D 直接汇入 C。E 经 D 至少需要两层。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="573" fill="white" stroke="none" stroke-width="1.6"/><line x1="152.0022286" y1="172.1724155" x2="363.4260244" y2="265.8029537" stroke="#196f77" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="154" y1="282" x2="360" y2="282" stroke="#655184" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="152.0022286" y1="391.8275845" x2="363.4260244" y2="298.1970463" stroke="#a84b3b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-coral)"/><line x1="116.4267157" y1="476.0363722" x2="118.3185136" y2="438.9571328" stroke="#657682" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="6 6"/><circle cx="120" cy="158" r="33" stroke="#196f77" stroke-width="2" fill="url(#wash-teal)"/><text x="120" y="168.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><circle cx="119" cy="282" r="33" stroke="#655184" stroke-width="2" fill="url(#wash-violet)"/><text x="119" y="292.85" fill="#655184" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><circle cx="120" cy="406" r="33" stroke="#a84b3b" stroke-width="2" fill="url(#wash-coral)"/><text x="120" y="416.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Not
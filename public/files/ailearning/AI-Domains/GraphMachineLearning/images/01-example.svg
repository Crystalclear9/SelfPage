<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="570" viewBox="0 0 1200 570" role="img"><title id="figure-title">边的方向决定消息的读取方向</title><desc id="figure-desc">边的方向决定消息的读取方向</desc><rect width="1200" height="570" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">边的方向决定消息的读取方向</text><circle cx="270" cy="265" r="55" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="270" y="275" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">A</text><circle cx="850" cy="265" r="55" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="850" y="275" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">B</text><line x1="345" y1="265" x2="770" y2="265" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><text x="270" y="150" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">源节点</text><text x="850" y="150" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">接收节点</text><text x="560" y="220" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">消息 m(A→B)</text><text x="560" y="365" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">B 汇总来自 A 的消息</text><text x="560" y="445" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">没有反向边时，A 不会因此读取 B</text></g></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" width="1188" height="663" viewBox="6 56 1188 663" role="img"><rect x="6" y="56" width="1188" height="663" fill="#ffffff"/><title>无偏的样本均值，经过非线性后可以有偏</title><rect width="1200" height="710" fill="white"/><text x="40" y="94" font-size="24" fill="#18364b">两个邻居值为 −2 和 +2；每次等概率抽取一个邻居，以 ReLU 作为聚合后激活。</text><rect x="25" y="125" width="1150" height="220" rx="16" fill="white" stroke="#d8e2e8"/><text x="49" y="168" font-size="27" fill="#18364b">A  先看完整邻域：先平均，再激活</text><circle cx="90" cy="247" r="40" fill="#e2f3ee" stroke="#15998b"/><text x="90" y="257" font-size="30" fill="#18364b" text-anchor="middle">−2</text><circle cx="250" cy="247" r="40" fill="#e2f3ee" stroke="#15998b"/><text x="250" y="257" font-size="30" fill="#18364b" text-anchor="middle">+2</text><line x1="315" y1="247" x2="480" y2="247" stroke="#9aafbb" stroke-width="2"/><text x="390" y="225" font-size="24" fill="#18364b" text-anchor="middle">平均</text><text x="530" y="257" font-size="32" fill="#18364b">0</text><line x1="585" y1="247" x2="790" y2="247" stroke="#9aafbb" stroke-width="2"/><text x="685" y="225" font-size="24" fill="#18364b" text-anchor="middle">ReLU</text><text x="845" y="257" font-size="32" fill="#18364b">0</text><rect x="25" y="370" width="1150" height="330" rx="16" fill="white" stroke="#d8e2e8"/><text x="49" y="413" font-size="27" fill="#18364b">B  单邻居采样：每条分支先激活，再对采样结果取期望</text><text x="60" y="485" font-size="24" fill="#18364b">概率 0.5</text><circle cx="345" cy="477" r="36" fill="#fff1e2" stroke="#d88739"/><text x="345" y="485" font-size="28" fill="#18364b" text-anchor="middle">−2</text><line x1="400" y1="477" x2="600" y2="477" stroke="#9aafbb" stroke-width="2"/><text x="495" y="455" font-size="24" fill="#18364b" text-anchor="middle">ReLU</text><text x="650" y="485" font-size="29" fill="#18364b">0</text><text x="60" y="600" font-size="24" fill="#18364b">概率 0.5</text><circle cx="345" cy="592" r="36" fill="#fff1e2" stroke="#d88739"/><text x="345" y="600" font-size="28" fill="#18364b" text-anchor="middle">+2</text><line x1="400" y1="592" x2="600" y2="592" stroke="#9aafbb" stroke-width="2"/><text x="495" y="570" font-size="24" fill="#18364b" text-anchor="middle">ReLU</text><text x="650" y="600" font-size="29" fill="#18364b">2</text><line x1="720" y1="475" x2="890" y2="530" stroke="#9aafbb" stroke-width="2"/><line x1="720" y1="590" x2="890" y2="530" stroke="#9aafbb" stroke-width="2"/><text x="920" y="540" font-size="29" fill="#b56a27">期望 = 1</text></svg>

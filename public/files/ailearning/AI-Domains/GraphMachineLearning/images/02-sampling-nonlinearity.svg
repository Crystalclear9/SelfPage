<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1312.064" viewBox="0 0 1440 1312.064" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">采样无偏性为何不能直接穿过激活函数</title><rect width="1440" height="1312.064" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">采样无偏性为何不能直接穿过激活函数</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1170.064" viewBox="0 0 1440 1253.64" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>无偏的样本均值，经过非线性后可以有偏</title><svg font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" width="1440" height="803.636" viewBox="6 56 1188 663" role="img"><rect x="6" y="56" width="1188" height="663" fill="#ffffff"/><title>无偏的样本均值，经过非线性后可以有偏</title><rect width="1200" height="710" fill="white"/><text x="40" y="94" font-size="24" fill="#1e3145">两个邻居值为 −2 和 +2；每次等概率抽取一个邻居，以 ReLU 作为聚合后激活。</text><rect x="25" y="125" width="1150" height="220" rx="16" fill="white" stroke="#dce2eb"/><text x="49" y="168" font-size="27" fill="#1e3145">A  先看完整邻域：先平均，再激活</text><circle cx="90" cy="247" r="40" fill="#e2f3ee" stroke="#169ea5"/><text x="90" y="257" font-size="30" fill="#1e3145" text-anchor="middle">−2</text><circle cx="250" cy="247" r="40" fill="#e2f3ee" stroke="#169ea5"/><text x="250" y="257" font-size="30" fill="#1e3145" text-anchor="middle">+2</text><line x1="315" y1="247" x2="480" y2="247" stroke="#9cabc0" stroke-width="2"/><text x="390" y="225" font-size="24" fill="#1e3145" text-anchor="middle">平均</text><text x="530" y="257" font-size="32" fill="#1e3145">0</text><line x1="585" y1="247" x2="790" y2="247" stroke="#9cabc0" stroke-width="2"/><text x="685" y="225" font-size="24" fill="#1e3145" text-anchor="middle">ReLU</text><text x="845" y="257" font-size="32" fill="#1e3145">0</text><rect x="25" y="370" width="1150" height="330" rx="16" fill="white" stroke="#dce2eb"/><text x="49" y="413" font-size="27" fill="#1e3145">B  单邻居采样：每条分支先激活，再对采样结果取期望</text><text x="60" y="485" font-size="24" fill="#1e3145">概率 0.5</text><circle cx="345" cy="477" r="36" fill="#fff1e2" stroke="#d4833d"/><text x="345" y="485" font-size="28" fill="#1e3145" text-anchor="middle">−2</text><line x1="400" y1="477" x2="600" y2="477" stroke="#9cabc0" stroke-width="2"/><text x="495" y="455" font-size="24" fill="#1e3145" text-anchor="middle">ReLU</text><text x="650" y="485" font-size="29" fill="#1e3145">0</text><text x="60" y="600" font-size="24" fill="#1e3145">概率 0.5</text><circle cx="345" cy="592" r="36" fill="#fff1e2" stroke="#d4833d"/><text x="345" y="600" font-size="28" fill="#1e3145" text-anchor="middle">+2</text><line x1="400" y1="592" x2="600" y2="592" stroke="#9cabc0" stroke-width="2"/><text x="495" y="570" font-size="24" fill="#1e3145" text-anchor="middle">ReLU</text><text x="650" y="600" font-size="29" fill="#1e3145">2</text><line x1="720" y1="475" x2="890" y2="530" stroke="#9cabc0" stroke-width="2"/><line x1="720" y1="590" x2="890" y2="530" stroke="#9cabc0" stroke-width="2"/><text x="920" y="540" font-size="29" fill="#b1672b">期望 = 1</text></svg>
<g id="round-20261105c-teaching" transform="translate(0 803.636) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">多抽一个邻居后，非线性偏差缩小但不自动消失</text><rect x="70" y="145" width="302" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="221.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">−2,−2</text><rect x="380" y="145" width="302" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="531.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">−2,+2</text><rect x="690" y="145" width="302" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="841.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">+2,−2</text><rect x="1000" y="145" width="302" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1151.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">+2,+2</text><rect x="70" y="220" width="302" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="221.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">ReLU 0</text><rect x="380" y="220" width="302" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="531.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">ReLU 0</text><rect x="690" y="220" width="302" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="841.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">ReLU 0</text><rect x="1000" y="220" width="302" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1151.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">ReLU 2</text><text x="70" y="330" font-size="30" fill="#1d3145">有放回独立抽 2 次：四条路径各 </text><text x="520.43" y="313" font-size="28" fill="#1d3145" text-anchor="middle">1</text><line x1="507.219" y1="321" x2="533.641" y2="321" stroke="#1d3145" stroke-width="1.6"/><text x="520.43" y="349" font-size="28" fill="#1d3145" text-anchor="middle">4</text><text x="536.641" y="330" font-size="30" fill="#1d3145">，输出期望 0.5</text><text x="70" y="410" font-size="31" fill="#1e7499" text-anchor="start">无放回抽齐 2 个：平均为 0，输出恒为 0。</text></g></g></svg></svg>

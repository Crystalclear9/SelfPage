<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="645" viewBox="0 0 1200 645" role="img"><title id="figure-title">同一评分器，替换负候选就能改变 AUC</title><desc id="figure-desc">同一评分器，替换负候选就能改变 AUC</desc><rect width="1200" height="645" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">同一评分器，替换负候选就能改变 AUC</text><text x="600" y="102" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">固定两个正例的分数：0.8，0.6；评分器始终不变</text><text x="295" y="170" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">候选集一：低分负例</text><text x="295" y="215" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">负例分数：0.2，0.1</text><text x="225" y="275" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.2</text><text x="335" y="275" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.1</text><text x="138" y="335" font-size="28" fill="#213447" text-anchor="end" font-weight="400">0.8</text><rect x="170" y="292" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="222.5" y="334.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="280" y="292" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="332.5" y="334.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><text x="138" y="407" font-size="28" fill="#213447" text-anchor="end" font-weight="400">0.6</text><rect x="170" y="364" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="222.5" y="406.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="280" y="364" width="105" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="332.5" y="406.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><text x="295" y="498" font-size="32" fill="#2865a0" text-anchor="middle" font-weight="400">AUC = 1</text><text x="885" y="170" font-size="29" fill="#cf7432" text-anchor="middle" font-weight="400">候选集二：高分负例</text><text x="885" y="215" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">负例分数：0.9，0.7</text><text x="815" y="275" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.9</text><text x="925" y="275" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.7</text><text x="728" y="335" font-size="28" fill="#213447" text-anchor="end" font-weight="400">0.8</text><rect x="760" y="292" width="105" height="65" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="812.5" y="334.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0</text><rect x="870" y="292" width="105" height="65" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="922.5" y="334.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><text x="728" y="407" font-size="28" fill="#213447" text-anchor="end" font-weight="400">0.6</text><rect x="760" y="364" width="105" height="65" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="812.5" y="406.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0</text><rect x="870" y="364" width="105" height="65" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="922.5" y="406.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0</text><text x="885" y="498" font-size="32" fill="#cf7432" text-anchor="middle" font-weight="400">AUC = 0.25</text><text x="600" y="566" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">行：正例；列：负例；格子 = 正例分数是否更高</text><text x="600" y="612" font-size="28" fill="#647789" text-anchor="middle" font-weight="400">候选分布变了，评价问题也随之改变</text></g></svg>

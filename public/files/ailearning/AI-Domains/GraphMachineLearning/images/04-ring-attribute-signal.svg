<title id="fig-title">相同多重集合经过不同局部排列后读出不同</title>
<desc id="fig-desc">两个八节点环使用同样的正负一属性。取含自环的均值、ReLU，再读出。</desc>
<rect x="0" y="0" width="1200" height="763" fill="#ffffff" opacity="1"/>

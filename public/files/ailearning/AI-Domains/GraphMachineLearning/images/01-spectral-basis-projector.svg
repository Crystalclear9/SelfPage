<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">四节点环的拉普拉斯特征子空间旋转</title><desc id="desc">四节点环组合拉普拉斯特征值为0,2,2,4。特征值2的两列正交特征向量允许旋转45度；节点坐标改变，但UU转置投影矩阵不变。</desc>
<rect width="1200" height="870" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="54" font-size="32" fill="#213447" text-anchor="start" font-weight="700">拉普拉斯位置编码：同一个子空间，可以换一组坐标</text>
<text x="44" y="100" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">四节点环 1—2—3—4—1；组合拉普拉斯的特征值为 0、2、2、4</text>
<text x="44" y="164" font-size="28" fill="#213447" text-anchor="start" font-weight="700">① 特征值 2 的两组合法正交基</text>

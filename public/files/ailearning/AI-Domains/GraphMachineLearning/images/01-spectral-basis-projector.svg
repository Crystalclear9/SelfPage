<text x="65" y="768" font-size="25" fill="#213447" text-anchor="start" font-weight="400">换基不变 ≠ 节点重编号不变：重编号时，P 的行与列必须一起重排。</text>
<text x="65" y="807" font-size="25" fill="#213447" text-anchor="start" font-weight="400">只取重特征值中的一列，或只检查符号翻转，都不足以处理整个子空间。</text>

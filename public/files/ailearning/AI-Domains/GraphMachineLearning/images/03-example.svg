<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="653" viewBox="24 62 1229 653" role="img" aria-labelledby="title desc"><rect x="24" y="62" width="1229" height="653" fill="#ffffff"/><title id="title">相同均值掩盖两种不同信息：分散程度与邻居数量</title><desc id="desc">多重集合 A 为 1、3，B 为 2、2，C 为 2、2、2。均值均为二；和为四、四、六；最大值三、二、二；平方后均值五、四、四。比较同一特征上的不同聚合，不能宣称某一个聚合识别任意多重集合。</desc><rect width="1280" height="720" fill="white"/><g font-family="Microsoft YaHei,DejaVu Sans,sans-serif" fill="#17374e"><text x="42" y="102" font-size="26" fill="#526c7b" text-anchor="start">同一批邻居特征；只改变聚合规则，不添加中心节点</text><text x="300" y="169" font-size="27" fill="#17374e" text-anchor="middle">邻居在同一数轴上</text><text x="650" y="169" font-size="26" fill="#17374e" text-anchor="middle">均值</text><text x="800" y="169" font-size="26" fill="#17374e" text-anchor="middle">求和</text><text x="950" y="169" font-size="26" fill="#17374e" text-anchor="middle">最大值</text><text x="1130" y="169" font-size="26" fill="#17374e" text-anchor="middle">平方后均值</text><line x1="42" y1="191" x2="1235" y2="191" stroke="#dbe4e9" stroke-width="2"/><text x="45" y="273" font-size="31" fill="#17374e" text-anchor="start" font-weight="bold">A</text><line x1="142" y1="265" x2="525" y2="265" stroke="#a4b7c2" stroke-width="2"/><line x1="150" y1="260" x2="150" y2="270" stroke="#8197a4" stroke-width="2"/><text x="150" y="303" font-size="23" fill="#526c7b" text-anchor="middle">1</text><line x1="330" y1="260" x2="330" y2="270" stroke="#8197a4" stroke-width="2"/><text x="330" y="303" font-size="23" fill="#526c7b" text-anchor="middle">2</text><line x1="510" y1="260" x2="510" y2="270" stroke="#8197a4" stroke-width="2"/><text x="510" y="303" font-size="23" fill="#526c7b" text-anchor="middle">3</text><circle cx="150" cy="253" r="11" fill="#2865a0"/><circle cx="510" cy="253" r="11" fill="#2865a0"/><rect x="610" y="231" width="80" height="56" rx="8" fill="#edf4f7"/><text x="650" y="270" font-size="32" fill="#17374e" text-anchor="middle">2</text><text x="800" y="270" font-size="32" fill="#17374e" text-anchor="middle">4</text><text x="950" y="270" font-size="32" fill="#ce6b32" text-anchor="middle">3</text><text x="1130" y="270" font-size="32" fill="#ce6b32" text-anchor="middle">5</text><line x1="42" y1="329" x2="1235" y2="329" stroke="#dbe4e9" stroke-width="2"/><text x="45" y="409" font-size="31" fill="#17374e" text-anchor="start" font-weight="bold">B</text><line x1="142" y1="401" x2="525" y2="401" stroke="#a4b7c2" stroke-width="2"/><line x1="150" y1="396" x2="150" y2="406" stroke="#8197a4" stroke-width="2"/><text x="150" y="439" font-size="23" fill="#526c7b" text-anchor="middle">1</text><line x1="330" y1="396" x2="330" y2="406" stroke="#8197a4" stroke-width="2"/><text x="330" y="439" font-size="23" fill="#526c7b" text-anchor="middle">2</text><line x1="510" y1="396" x2="510" y2="406" stroke="#8197a4" stroke-width="2"/><text x="510" y="439" font-size="23" fill="#526c7b" text-anchor="middle">3</text><circle cx="330" cy="389" r="11" fill="#2865a0"/><circle cx="330" cy="365" r="11" fill="#2865a0"/><rect x="610" y="367" width="80" height="56" rx="8" fill="#edf4f7"/><text x="650" y="406" font-size="32" fill="#17374e" text-anchor="middle">2</text><text x="800" y="406" font-size="32" fill="#17374e" text-anchor="middle">4</text><text x="950" y="406" font-size="32" fill="#17374e" text-anchor="middle">2</text><text x="1130" y="406" font-size="32" fill="#17374e" text-anchor="middle">4</text><line x1="42" y1="465" x2="1235" y2="465" stroke="#dbe4e9" stroke-width="2"/><text x="45" y="545" font-size="31" fill="#17374e" text-anchor="start" font-weight="bold">C</text><line x1="142" y1="537" x2="525" y2="537" stroke="#a4b7c2" stroke-width="2"/><line x1="150" y1="532" x2="150" y2="542" stroke="#8197a4" stroke-width="2"/><text x="150" y="575" font-size="23" fill="#526c7b" text-anchor="middle">1</text><line x1="330" y1="532" x2="330" y2="542" stroke="#8197a4" stroke-width="2"/><text x="330" y="575" font-size="23" fill="#526c7b" text-anchor="middle">2</text><line x1="510" y1="532" x2="510" y2="542" stroke="#8197a4" stroke-width="2"/><text x="510" y="575" font-size="23" fill="#526c7b" text-anchor="middle">3</text><circle cx="330" cy="525" r="11" fill="#2865a0"/><circle cx="330" cy="501" r="11" fill="#2865a0"/><circle cx="330" cy="477" r="11" fill="#2865a0"/><rect x="610" y="503" width="80" height="56" rx="8" fill="#edf4f7"/><text x="650" y="542" font-size="32" fill="#17374e" text-anchor="middle">2</text><text x="800" y="542" font-size="32" fill="#ce6b32" text-anchor="middle">6</text><text x="950" y="542" font-size="32" fill="#17374e" text-anchor="middle">2</text><text x="1130" y="542" font-size="32" fill="#17374e" text-anchor="middle">4</text><line x1="42" y1="603" x2="1235" y2="603" stroke="#dbe4e9" stroke-width="2"/><text x="42" y="649" font-size="27" fill="#2865a0" text-anchor="start">A 与 B：数量相同，分散程度不同</text><text x="663" y="649" font-size="27" fill="#ce6b32" text-anchor="start">B 与 C：值相同，重复次数不同</text><text x="42" y="693" font-size="25" fill="#526c7b" text-anchor="start">平方发生在逐邻居消息里；若先求均值再平方，三个结果仍全是 4。</text></g></svg>

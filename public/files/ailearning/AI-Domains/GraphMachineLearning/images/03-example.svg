<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>均值聚合无法区分某些不同邻居集合</title><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="38" y="53" font-size="32" fill="#17374e">均值聚合无法区分某些不同邻居集合</text><text x="65" y="220" font-size="28" fill="#17374e">集合 A</text><line x1="280" y1="210" x2="1040" y2="210" stroke="#d6e4ec" stroke-width="2"/><circle cx="500" cy="210" r="13" fill="#15988d"/><circle cx="900" cy="210" r="13" fill="#15988d"/><line x1="700" y1="155" x2="700" y2="245" stroke="#df9b57" stroke-width="3"/><text x="1050" y="218" font-size="26" fill="#17374e">均值 2</text><text x="65" y="375" font-size="28" fill="#17374e">集合 B</text><line x1="280" y1="365" x2="1040" y2="365" stroke="#d6e4ec" stroke-width="2"/><circle cx="700" cy="365" r="13" fill="#15988d"/><circle cx="700" cy="333" r="13" fill="#15988d"/><line x1="700" y1="310" x2="700" y2="400" stroke="#df9b57" stroke-width="3"/><text x="1050" y="373" font-size="26" fill="#17374e">均值 2</text><text x="65" y="530" font-size="28" fill="#17374e">集合 C</text><line x1="280" y1="520" x2="1040" y2="520" stroke="#d6e4ec" stroke-width="2"/><circle cx="700" cy="520" r="13" fill="#15988d"/><circle cx="700" cy="488" r="13" fill="#15988d"/><circle cx="700" cy="456" r="13" fill="#15988d"/><line x1="700" y1="465" x2="700" y2="555" stroke="#df9b57" stroke-width="3"/><text x="1050" y="528" font-size="26" fill="#17374e">均值 2</text><text x="492" y="685" font-size="25" fill="#17374e">1</text><text x="692" y="685" font-size="25" fill="#17374e">2</text><text x="892" y="685" font-size="25" fill="#17374e">3</text><text x="180" y="120" font-size="24" fill="#17374e">橙线标出共同均值；重复点纵向错开，不改变其横坐标取值。</text></g></svg>

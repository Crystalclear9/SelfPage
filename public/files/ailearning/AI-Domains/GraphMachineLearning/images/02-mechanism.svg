<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">叶子影响怎样沿平均树逐层衰减</title><desc id="desc">八叶二叉树，只有第一个叶子为1，其余为0，每个父节点取两个孩子均值。根为1/8；深度k任意叶子的导数为2的负k次。</desc><rect width="1440" height="820" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">

#a9603b"/><text x="660" y="290" font-size="33.32px" fill="#ffffff" text-anchor="middle">2</text><text x="660" y="365" font-size="34.682967px" fill="#283341" text-anchor="middle">x = 1</text><text x="660" y="410" font-size="33.54px" fill="#475b6c" text-anchor="middle">d = 2</text><line x1="196" y1="280" x2="374" y2="280" stroke="#a9603b" stroke-width="6"/><text x="285" y="250" font-size="34.682967px" fill="#a05f3f" text-anchor="middle">t</text><line x1="446" y1="280" x2="624" y2="280" stroke="#22627b" stroke-width="4"/><text x="535" y="250" font-size="34.682967px" fill="#2c6f89" text-anchor="middle">1</text><text x="60" y="490" font-size="34.682967px" fill="#a05f3f" text-anchor="start">节点 0 没有内容，却仍参与节点 1 的度数</text><text x="60" y="545" font-size="34.682967px" fill="#283341" text-anchor="start">节点 2 → 1 的消息：</text><text x="410" y="526" font-size="34.51px" fill="#2c6f89" text-anchor="middle">1</text><line x1="315" y1="540" x2="505" y2="540" stroke="#22627b" stroke-width="2.46"/><text x="410" y="579" font-size="34.682967px" fill="#2c6f89" text-anchor="middle">√[2(t + 2)]</text><text x="810.0" y="575" font-size="29.75px" fill="#475b6c" text-anchor="middle">0</text><line x1="907.5" y1="535" x2="907.5" y2="205" stroke="#d6e2e6" stroke-width="1.3"/><text x="907.5" y="575" font-size="29.75px" fill="#475b6c" text-anchor="middle">1</text><line x1="1005.0" y1="535" x2="1005.0" y2="205" stroke="#d6e2e6" stroke-width="1.3"/><text x="1005.0" y="575" font-size="29.75px" fill="#475b6c" text-anchor="middle">2</text><line x1="1102.5" y1="535" x2="1102.5" y2="205" stroke="#d6e2e6" stroke-width="1.3"/><text x="1102.5" y="575" font-size="29.75px" fill="#475b6c" text-anchor="middle">3</text><line x1="1200.0" y1="535" x2="1200.0" y2="205" stroke="#d6e2e6" stroke-width="1.3"/><text x="1200.0" y="575" font-size="25" fill="#475b6c" text-anchor="middle">4</text><line x1="810" y1="535" x2="1200" y2="535" stroke="#657682" stroke-width="1.55" stroke-linecap="round"/><line x1="810" y1="535" x2="810
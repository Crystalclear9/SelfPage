<svg xmlns="http://www.w3.org/2000/svg" width="1191" height="618" viewBox="42 84 1191 618" role="img"><rect x="42" y="84" width="1191" height="618" fill="#ffffff"/><title>加大一条边，也会改变另一条边的归一化系数</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="27" fill="#19343e" text-anchor="start">三节点链；每点自环权重为 1；只让左边权重 t 改变</text><circle cx="160" cy="280" r="36" fill="#276a80"/><text x="160" y="290" font-size="28" fill="white" text-anchor="middle">0</text><text x="160" y="365" font-size="27" fill="#19343e" text-anchor="middle">x = 0</text><text x="160" y="410" font-size="26" fill="#74888d" text-anchor="middle">d = 1 + t</text><circle cx="410" cy="280" r="36" fill="#276a80"/><text x="410" y="290" font-size="28" fill="white" text-anchor="middle">1</text><text x="410" y="365" font-size="27" fill="#19343e" text-anchor="middle">x = 0</text><text x="410" y="410" font-size="26" fill="#74888d" text-anchor="middle">d = 2 + t</text><circle cx="660" cy="280" r="36" fill="#c2673f"/><text x="660" y="290" font-size="28" fill="white" text-anchor="middle">2</text><text x="660" y="365" font-size="27" fill="#19343e" text-anchor="middle">x = 1</text><text x="660" y="410" font-size="26" fill="#74888d" text-anchor="middle">d = 2</text><line x1="196" y1="280" x2="374" y2="280" stroke="#c2673f" stroke-width="6"/><text x="285" y="250" font-size="30" fill="#c2673f" text-anchor="middle">t</text><line x1="446" y1="280" x2="624" y2="280" stroke="#276a80" stroke-width="4"/><text x="535" y="250" font-size="30" fill="#276a80" text-anchor="middle">1</text><text x="60" y="490" font-size="28" fill="#c2673f" text-anchor="start">节点 0 没有内容，却仍参与节点 1 的度数</text><text x="60" y="545" font-size="27" fill="#19343e" text-anchor="start">节点 2 → 1 的消息：</text><text x="410" y="526" font-size="29" fill="#276a80" text-anchor="middle">1</text><line x1="315" y1="540" x2="505" y2="540" stroke="#276a80" stroke-width="2"/><text x="410" y="579" font-size="29" fi
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="935.4188" viewBox="0 0 1440 935.4188" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">适配器产物依赖基座、分词器与任务配置</title><rect width="1440" height="935.4188" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">适配器产物依赖基座、分词器与任务配置</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="793.4188" viewBox="37 83 1201 709" role="img" x="48" y="106" overflow="hidden"><rect x="37" y="83" width="1201" height="709" fill="#ffffff"/><title>适配器相同，也不能替代完整模型身份</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="28" fill="#1a2b3d" text-anchor="start">ΔW = [[0.4, −0.2], [0.8, −0.4]]，三个配置共用它</text><text x="60" y="210" font-size="28" fill="#1a2b3d" text-anchor="start">基座 W0</text><text x="290" y="210" font-size="28" fill="#1a2b3d" text-anchor="start">“甲”的输入 x</text><text x="560" y="210" font-size="28" fill="#1a2b3d" text-anchor="start">输出 y</text><text x="60" y="310" font-size="28" fill="#257190" text-anchor="start">I</text><text x="315" y="310" font-size="28" fill="#257190" text-anchor="start">(1, 0)</text><text x="560" y="310" font-size="28" fill="#257190" text-anchor="start">(1.4, 0.8)</text><line x1="55" y1="342" x2="730" y2="342" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="435" font-size="28" fill="#bf6d42" text-anchor="start">diag(2, 1)</text><text x="315" y="435" font-size="28" fill="#bf6d42" text-anchor="start">(1, 0)</text><text x="560" y="435" font-size="28" fill="#bf6d42" text-anchor="start">(2.4, 0.8)</text><line x1="55" y1="467" x2="730" y2="467" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="560" font-size="28" fill="#5c9a91" text-anchor="start">I</text><text x="315" y="560" font-size="28" fill="#5c9a91" text-anchor="start">(0, 1)</text><text x="560" y="560" font-size="28" fill="#5c9a91" text-anchor="start">(−0.2, 0.6)</text><line x1="55" y1="592" x2="730" y2="592" stroke="#dfe4eb" stroke-width="2"/><line x1="800" y1="600" x2="1220" y2="600" stroke="#769099" stroke-width="2"/><line x1="850" y1="640" x2="850" y2="265" stroke="#769099" stroke-width="2"/><line x1="850" y1="600" x2="1025.0" y2="424.0" stroke="#257190" stroke-width="4"/><path d="M1021.65,435.52 L1025.00,424.00 L1013.50,427.41" fill="none" stroke="#257190" stroke-width="4"/><circle cx="1025.0" cy="424.0" r="7" fill="#257190"/><text x="1025.0" y="402.0" font-size="24" fill="#257190" text-anchor="middle">(1.4, 0.8)</text><line x1="850" y1="600" x2="1150.0" y2="424.0" stroke="#bf6d42" stroke-width="4"/><path d="M1143.83,434.29 L1150.00,424.00 L1138.01,424.37" fill="none" stroke="#bf6d42" stroke-width="4"/><circle cx="1150.0" cy="424.0" r="7" fill="#bf6d42"/><text x="1150.0" y="402.0" font-size="24" fill="#bf6d42" text-anchor="middle">(2.4, 0.8)</text><line x1="850" y1="600" x2="825.0" y2="468.0" stroke="#5c9a91" stroke-width="4"/><path d="M832.61,477.28 L825.00,468.00 L821.31,479.42" fill="none" stroke="#5c9a91" stroke-width="4"/><circle cx="825.0" cy="468.0" r="7" fill="#5c9a91"/><text x="825.0" y="446.0" font-size="24" fill="#5c9a91" text-anchor="middle">(-0.2, 0.6)</text><text x="60" y="705" font-size="28" fill="#1a2b3d" text-anchor="start">第二行只换基座；第三行交换词表到嵌入坐标的对应</text><text x="60" y="770" font-size="28" fill="#1a2b3d" text-anchor="start">同形状、可加载、同一适配文件，都不足以证明同一函数</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>适配器相同，也不能替代完整模型身份</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">适配器相同，也不能替代完整模型身份</text><text x="60" y="125" font-size="28" fill="#19343e" text-anchor="start">ΔW = [[0.4, −0.2], [0.8, −0.4]]，三个配置共用它</text><text x="60" y="210" font-size="28" fill="#19343e" text-anchor="start">基座 W0</text><text x="290" y="210" font-size="28" fill="#19343e" text-anchor="start">“甲”的输入 x</text><text x="560" y="210" font-size="28" fill="#19343e" text-anchor="start">输出 y</text><text x="60" y="310" font-size="28" fill="#276a80" text-anchor="start">I</text><text x="315" y="310" font-size="28" fill="#276a80" text-anchor="start">(1, 0)</text><text x="560" y="310" font-size="28" fill="#276a80" text-anchor="start">(1.4, 0.8)</text><line x1="55" y1="342" x2="730" y2="342" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="435" font-size="28" fill="#c2673f" text-anchor="start">diag(2, 1)</text><text x="315" y="435" font-size="28" fill="#c2673f" text-anchor="start">(1, 0)</text><text x="560" y="435" font-size="28" fill="#c2673f" text-anchor="start">(2.4, 0.8)</text><line x1="55" y1="467" x2="730" y2="467" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="560" font-size="28" fill="#5d8c79" text-anchor="start">I</text><text x="315" y="560" font-size="28" fill="#5d8c79" text-anchor="start">(0, 1)</text><text x="560" y="560" font-size="28" fill="#5d8c79" text-anchor="start">(−0.2, 0.6)</text><line x1="55" y1="592" x2="730" y2="592" stroke="#dbe5e8" stroke-width="2"/><line x1="800" y1="600" x2="1220" y2="600" stroke="#74888d" stroke-width="2"/><line x1="850" y1="640" x2="850" y2="265" stroke="#74888d" stroke-width="2"/><line x1="850" y1="600" x2="1025.0" y2="424.0" stroke="#276a80" stroke-width="4"/><path d="M1021.65,435.52 L1025.00,424.00 L1013.50,427.41" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="1025.0" cy="424.0" r="7" fill="#276a80"/><text x="1025.0" y="402.0" font-size="24" fill="#276a80" text-anchor="middle">(1.4, 0.8)</text><line x1="850" y1="600" x2="1150.0" y2="424.0" stroke="#c2673f" stroke-width="4"/><path d="M1143.83,434.29 L1150.00,424.00 L1138.01,424.37" fill="none" stroke="#c2673f" stroke-width="4"/><circle cx="1150.0" cy="424.0" r="7" fill="#c2673f"/><text x="1150.0" y="402.0" font-size="24" fill="#c2673f" text-anchor="middle">(2.4, 0.8)</text><line x1="850" y1="600" x2="825.0" y2="468.0" stroke="#5d8c79" stroke-width="4"/><path d="M832.61,477.28 L825.00,468.00 L821.31,479.42" fill="none" stroke="#5d8c79" stroke-width="4"/><circle cx="825.0" cy="468.0" r="7" fill="#5d8c79"/><text x="825.0" y="446.0" font-size="24" fill="#5d8c79" text-anchor="middle">(-0.2, 0.6)</text><text x="60" y="705" font-size="28" fill="#19343e" text-anchor="start">第二行只换基座；第三行交换词表到嵌入坐标的对应</text><text x="60" y="770" font-size="28" fill="#19343e" text-anchor="start">同形状、可加载、同一适配文件，都不足以证明同一函数</text></g></svg>

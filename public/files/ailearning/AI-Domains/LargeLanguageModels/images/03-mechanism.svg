<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img"><title>工具调用需要有预算和终止条件的状态机</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="606" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">工具调用需要有预算和终止条件的状态机</text><rect x="70" y="170" width="280" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="85" y="205" font-size="24" fill="#213447">提出调用</text><rect x="455" y="170" width="280" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="470" y="205" font-size="24" fill="#213447">校验参数与权限</text><rect x="840" y="170" width="280" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="855" y="205" font-size="24" fill="#213447">执行并返回结果</text><rect x="455" y="480" width="280" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="470" y="515" font-size="24" fill="#213447">终止／拒绝／预算耗尽</text><line x1="350" y1="215" x2="445" y2="215" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="735" y1="215" x2="830" y2="215" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="595" y1="265" x2="595" y2="470" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /><path d="M980 265 V375 H210 V275" fill="none" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><text x="360" y="350" font-size="24" fill="#213447">带剩余预算继续下一轮</text><text x="630" y="410" font-size="24" fill="#a8652e">无效／无权限／预算不足</text></g></svg>

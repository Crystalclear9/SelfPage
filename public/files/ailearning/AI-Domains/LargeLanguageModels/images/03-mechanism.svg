<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="798" viewBox="0 0 1200 798" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">工具白名单、整数契约与尝试预算</title>
<desc id="fig-desc">LocalExecutor 只允许 add，最多三个调用尝试。</desc>

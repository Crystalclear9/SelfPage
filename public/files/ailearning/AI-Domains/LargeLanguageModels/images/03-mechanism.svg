<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1274.93" viewBox="0 0 1440 1274.93" role="img"><title>工具调用：一次成功、两次拒绝，预算已经用完</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="764.933" viewBox="27 65 1346 715" role="img" aria-labelledby="title desc"><rect x="27" y="65" width="1346" height="715" fill="#ffffff"/><title id="title">工具调用：一次成功、两次拒绝，预算已经用完</title><desc id="desc">严格对应本章 LocalExecutor 的四次请求与三条 trace；进入解析前扣预算，耗尽时不追加 trace。</desc><rect width="1400" height="790" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="45" y="105" font-size="26" fill="#6d7c84" text-anchor="start" font-weight="400">正文 LocalExecutor，max_calls = 3；只允许 add，参数须为范围内的严格整数。</text>
<line x1="45" y1="130" x2="1355" y2="130" stroke="#a9b8be" stroke-width="2"/>
<text x="60" y="185" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">请求</text>
<text x="500" y="185" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">处理结果</text>
<text x="1020" y="185" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">剩余次数</text>
<text x="60" y="245" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">1   add(2, 3)</text>
<line x1="400" y1="235" x2="460" y2="235" stroke="#237e74" stroke-width="2"/>
<text x="500" y="245" font-size="29" fill="#237e74" text-anchor="start" font-weight="400">ok：5</text>
<rect x="1040" y="205" width="60" height="50" fill="#237e74" stroke="#237e74" stroke-width="2"/>
<rect x="1115" y="205" width="60" height="50" fill="#237e74" stroke="#237e74" stroke-width="2"/>
<rect x="1190" y="205" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<text x="1305" y="245" font-size="30" fill="#237e74" text-anchor="start" font-weight="400">2</text>
<line x1="55" y1="280" x2="1345" y2="280" stroke="#e1e7ea" stroke-width="1"/>
<text x="60" y="350" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">2   add(true, 3)</text>
<line x1="400" y1="340" x2="460" y2="340" stroke="#c67630" stroke-width="2"/>
<text x="500" y="350" font-size="29" fill="#c67630" text-anchor="start" font-weight="400">invalid：整数类型不符</text>
<rect x="1040" y="310" width="60" height="50" fill="#c67630" stroke="#c67630" stroke-width="2"/>
<rect x="1115" y="310" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<rect x="1190" y="310" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<text x="1305" y="350" font-size="30" fill="#c67630" text-anchor="start" font-weight="400">1</text>
<line x1="55" y1="385" x2="1345" y2="385" stroke="#e1e7ea" stroke-width="1"/>
<text x="60" y="455" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">3   send(1, 2)</text>
<line x1="400" y1="445" x2="460" y2="445" stroke="#c67630" stroke-width="2"/>
<text x="500" y="455" font-size="29" fill="#c67630" text-anchor="start" font-weight="400">invalid：工具名不允许</text>
<rect x="1040" y="415" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<rect x="1115" y="415" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<rect x="1190" y="415" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<text x="1305" y="455" font-size="30" fill="#c67630" text-anchor="start" font-weight="400">0</text>
<line x1="55" y1="490" x2="1345" y2="490" stroke="#e1e7ea" stroke-width="1"/>
<text x="60" y="560" font-size="30" fill="#20343d" text-anchor="start" font-weight="400">4   add(1, 2)</text>
<line x1="400" y1="550" x2="460" y2="550" stroke="#6d7c84" stroke-width="2"/>
<text x="500" y="560" font-size="29" fill="#6d7c84" text-anchor="start" font-weight="400">budget-exhausted</text>
<rect x="1040" y="520" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<rect x="1115" y="520" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<rect x="1190" y="520" width="60" height="50" fill="#edf1f3" stroke="#cbd5da" stroke-width="2"/>
<text x="1305" y="560" font-size="30" fill="#6d7c84" text-anchor="start" font-weight="400">0</text>
<line x1="45" y1="650" x2="1355" y2="650" stroke="#a9b8be" stroke-width="2"/>
<text x="60" y="705" font-size="28" fill="#20343d" text-anchor="start" font-weight="700">trace 只有前三条；第四次在解析前返回，不再执行、不再增加 calls。</text>
<text x="60" y="755" font-size="26" fill="#6d7c84" text-anchor="start" font-weight="400">JSON 的 true 会变成 Python bool；这里用 type(v) is int 显式排除。</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 764.933) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="510" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">工具参数校验：整数类型与数值范围是两道独立的门</text><rect x="70" y="130" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="226.0" y="169" font-size="28" fill="#216c89" text-anchor="middle">JSON 值</text><rect x="390" y="130" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="546.0" y="169" font-size="28" fill="#216c89" text-anchor="middle">严格 int</text><rect x="710" y="130" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="866.0" y="169" font-size="28" fill="#216c89" text-anchor="middle">在 ±1000 内</text><rect x="1030" y="130" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1186.0" y="169" font-size="28" fill="#216c89" text-anchor="middle">接受</text><rect x="70" y="200" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="226.0" y="239" font-size="28" fill="#c96937" text-anchor="middle">true</text><rect x="390" y="200" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="546.0" y="239" font-size="28" fill="#c96937" text-anchor="middle">否</text><rect x="710" y="200" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="866.0" y="239" font-size="28" fill="#c96937" text-anchor="middle">不再检查</text><rect x="1030" y="200" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1186.0" y="239" font-size="28" fill="#c96937" text-anchor="middle">否</text><rect x="70" y="255" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="226.0" y="294" font-size="28" fill="#c96937" text-anchor="middle">2.0</text><rect x="390" y="255" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="546.0" y="294" font-size="28" fill="#c96937" text-anchor="middle">否</text><rect x="710" y="255" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="866.0" y="294" font-size="28" fill="#c96937" text-anchor="middle">不再检查</text><rect x="1030" y="255" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1186.0" y="294" font-size="28" fill="#c96937" text-anchor="middle">否</text><rect x="70" y="310" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="226.0" y="349" font-size="28" fill="#216c89" text-anchor="middle">2</text><rect x="390" y="310" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="546.0" y="349" font-size="28" fill="#216c89" text-anchor="middle">是</text><rect x="710" y="310" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="866.0" y="349" font-size="28" fill="#216c89" text-anchor="middle">是</text><rect x="1030" y="310" width="312" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1186.0" y="349" font-size="28" fill="#216c89" text-anchor="middle">是</text><rect x="70" y="365" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="226.0" y="404" font-size="28" fill="#c96937" text-anchor="middle">1001</text><rect x="390" y="365" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="546.0" y="404" font-size="28" fill="#c96937" text-anchor="middle">是</text><rect x="710" y="365" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="866.0" y="404" font-size="28" fill="#c96937" text-anchor="middle">否</text><rect x="1030" y="365" width="312" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1186.0" y="404" font-size="28" fill="#c96937" text-anchor="middle">否</text><text x="70" y="490" font-size="27" fill="#203742" text-anchor="start">Python 中 bool 是 int 的子类；严格契约应使用 type(v) is int。</text></g></g></svg>

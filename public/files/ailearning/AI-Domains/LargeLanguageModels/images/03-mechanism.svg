<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>工具调用需要有预算和终止条件的状态机</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">工具调用需要有预算和终止条件的状态机</text><rect x="70" y="170" width="280" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="85" y="205" font-size="22" fill="#143651">提出调用</text><rect x="455" y="170" width="280" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="470" y="205" font-size="22" fill="#143651">校验参数与权限</text><rect x="840" y="170" width="280" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="855" y="205" font-size="22" fill="#143651">执行并返回结果</text><rect x="455" y="480" width="280" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="470" y="515" font-size="22" fill="#143651">终止／拒绝／预算耗尽</text><line x1="350" y1="215" x2="445" y2="215" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><line x1="735" y1="215" x2="830" y2="215" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><line x1="595" y1="265" x2="595" y2="470" stroke="#ed9a46" stroke-width="3" marker-end="url(#arr)" /><path d="M980 265 V375 H210 V275" fill="none" stroke="#15988d" stroke-width="3" marker-end="url(#arr)" /><text x="360" y="350" font-size="23" fill="#143651">带剩余预算继续下一轮</text><text x="630" y="410" font-size="22" fill="#a8652e">无效／无权限／预算不足</text></g></svg>

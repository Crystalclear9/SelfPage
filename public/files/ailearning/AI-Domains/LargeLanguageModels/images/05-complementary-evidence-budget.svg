<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="564" viewBox="0 0 1320 564" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">固定预算下的互补证据选择</title><desc id="plate-desc">相同长度预算。只含长 A 的输入没有事实 B；较短的 A 与 B 一起提供所需事实。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="564" fill="white" stroke="none" stroke-width="1.6"/><text x="225" y="93" fill="#a84b3b" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">只有事实 A</text><line x1="91" y1="147" x2="896" y2="147" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><line x1="91" y1="138" x2="91" y2="156" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><line x1="896" y1="138" x2="896" y2="156" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><text x="493.5" y="132" fill="#202a37" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">同一证据预算</text><polygon points="91,247 851,247 896,174 136,174" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="493.5" y="221.7" fill="#a84b3b" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">长 A</text><line x1="923" y1="209" x2="1042" y2="209" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/><text x="1171" y="219" fill="#a84b3b" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">缺 B</text><text x="225" y="317" fill="#196f77" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">两条事实齐全</text><line x1="91" y1="371" x2="896" y2="371" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><line x1="91" y1="362" x2="91" y2="380" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><line x1="896" y1="362" x2="896" y2="380" stroke="#657682" stroke-width="1.6" stroke-linecap="round"/><text x="493.5" y="356" fill="#202a37" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">同一证据预算</text><polygon points="91,471 424.35,471 469.35,398 136,398" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="280.175" y="445.35" fill="#196f77" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">短 A</text><polygon points="485.45,471 851,471 896,398 530.45,398" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="690.725" y="445.35" fill="#655184" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">短 B</text><line x1="923" y1="433" x2="1042" y2="433" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="1171" y="443" fill="#196f77" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">A 与 B 互补</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="637" viewBox="0 0 1200 637" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">同一段上下文预算，两种事实覆盖结果</title>
<desc id="fig-desc">按分数选 A 和 B，两块重复覆盖 u。换用 B、C、D 仍花费十个单位，同时保留 u、v、w。</desc>
<rect x="0" y="0" width="1200" height="637" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
<linearGradient id="blue" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f1f8"/></linearGradient>
<linearGradient id="ochre" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
<linearGradient id="green" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4e9"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">同一预算，能留下多少必需事实？</text>
<text x="76" y="105" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">问题需要 u、v、w 同时出现。</text>
<text x="276" y="161" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">上下文预算（成本单位）</text>
<text x="925" y="161" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">保留的事实</text>

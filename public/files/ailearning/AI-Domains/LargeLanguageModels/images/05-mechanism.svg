<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="958" viewBox="30 64 1340 958" role="img"><rect x="30" y="64" width="1340" height="958" fill="#ffffff"/><title>候选、预算、打包策略：三个条件分别检查</title><rect width="1400" height="1030" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="104" font-size="26" fill="#687988" text-anchor="start" font-weight="normal">仍是 q4；保持同一排序与读取器，仅改变明确列出的条件</text><line x1="48" y1="128" x2="1352" y2="128" stroke="#d9e3eb" stroke-width="2"/><text x="65" y="185" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">① 保持贪心策略：扩大候选不等于读到完整证据</text><text x="535" y="249" font-size="29" fill="#18354a" text-anchor="middle" font-weight="bold">预算 80</text><text x="835" y="249" font-size="29" fill="#18354a" text-anchor="middle" font-weight="bold">预算 84</text><text x="1135" y="249" font-size="29" fill="#18354a" text-anchor="middle" font-weight="bold">预算 159</text><text x="65" y="365" font-size="31" fill="#2769a5" text-anchor="start" font-weight="normal">k = 4</text><rect x="395" y="290" width="280" height="143" rx="8" fill="#f3f6f9" stroke="#d9e3eb" stroke-width="2"/><text x="535" y="340" font-size="32" fill="#cc6b26" text-anchor="middle" font-weight="bold">未知</text><text x="535" y="389" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44</text><rect x="695" y="290" width="280" height="143" rx="8" fill="#f3f6f9" stroke="#d9e3eb" stroke-width="2"/><text x="835" y="340" font-size="32" fill="#cc6b26" text-anchor="middle" font-weight="bold">未知</text><text x="835" y="389" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44 + 38</text><rect x="995" y="290" width="280" height="143" rx="8" fill="#f3f6f9" stroke="#d9e3eb" stroke-width="2"/><text x="1135" y="340" font-size="32" fill="#cc6b26" text-anchor="middle" font-weight="bold">未知</text><text x="1135" y="389" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44 + 38 + 37</text><text x="65" y="545" font-size="31" fill="#2769a5" text-anchor="start" font-weight="normal">k = 5</text><rect x="395" y="470" width="280" height="143" rx="8" fill="#f3f6f9" stroke="#d9e3eb" stroke-width="2"/><text x="535" y="520" font-size="32" fill="#cc6b26" text-anchor="middle" font-weight="bold">未知</text><text x="535" y="569" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44</text><rect x="695" y="470" width="280" height="143" rx="8" fill="#f3f6f9" stroke="#d9e3eb" stroke-width="2"/><text x="835" y="520" font-size="32" fill="#cc6b26" text-anchor="middle" font-weight="bold">未知</text><text x="835" y="569" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44 + 38</text><rect x="995" y="470" width="280" height="143" rx="8" fill="#e8f6f0" stroke="#17806e" stroke-width="2"/><text x="1135" y="520" font-size="32" fill="#17806e" text-anchor="middle" font-weight="bold">60 日</text><text x="1135" y="569" font-size="26" fill="#18354a" text-anchor="middle" font-weight="normal">44 + 38 + 37 + 40</text><text x="65" y="662" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">② 固定 k = 5、预算 84：策略本身仍然可以丢证据</text><text x="65" y="729" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">排名贪心</text><rect x="245" y="688" width="396" height="60" rx="3" fill="#eef4fa" stroke="#2769a5" stroke-width="2"/><text x="443.0" y="729" font-size="27" fill="#2769a5" text-anchor="middle" font-weight="normal">成员 44</text><rect x="641" y="688" width="342" height="60" rx="3" fill="#fff1e6" stroke="#cc6b26" stroke-width="2"/><text x="812.0" y="729" font-size="27" fill="#cc6b26" text-anchor="middle" font-weight="normal">无关规则 38</text><line x1="1001" y1="677" x2="1001" y2="825" stroke="#687988" stroke-width="3" stroke-dasharray="6 5"/><text x="1060" y="729" font-size="27" fill="#cc6b26" text-anchor="start" font-weight="normal">82：仍缺红方案规则</text><text x="65" y="813" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">金标准诊断</text><rect x="245" y="772" width="396" height="60" rx="3" fill="#eef4fa" stroke="#2769a5" stroke-width="2"/><text x="443.0" y="813" font-size="27" fill="#2769a5" text-anchor="middle" font-weight="normal">成员 44</text><rect x="641" y="772" width="360" height="60" rx="3" fill="#e8f6f0" stroke="#17806e" stroke-width="2"/><text x="821.0" y="813" font-size="27" fill="#17806e" text-anchor="middle" font-weight="normal">红方案规则 40</text><text x="1060" y="813" font-size="27" fill="#17806e" text-anchor="start" font-weight="normal">84：可读出 60 日</text><text x="65" y="904" font-size="32" fill="#18354a" text-anchor="start" font-weight="bold">最低证据成本 84 ≠ 现有贪心的成功预算 159</text><text x="65" y="957" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">下行使用金标准选集合，只诊断预算可达性；没有实现可部署的选择器。</text><text x="65" y="1000" font-size="27" fill="#687988" text-anchor="start" font-weight="normal">上行多装入的 75 字符来自 blue-new 与 member，均不能连接 Nebula 的 red。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="701" viewBox="0 0 1200 701" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">字符、教学词元与 UTF-8 字节不同</title>

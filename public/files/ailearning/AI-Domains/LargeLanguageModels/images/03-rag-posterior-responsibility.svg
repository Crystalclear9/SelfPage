<text x="664" y="407" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">责任归一后求和 = 1</text>
<path d="M75 449 L1125 449" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="504" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">边缘 NLL 约 1.3471；逐证据平均损失约 1.8631。</text>
<text x="75" y="561" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">两者差约 0.5161，等于从检索先验到后验责任的 KL。</text>
<text x="75" y="619" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">责任度描述模型内部的归因，引用是否支持答案仍需另行判断。</text>

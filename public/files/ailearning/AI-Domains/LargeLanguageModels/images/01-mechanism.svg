<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">截断改变支持集与 KL 的方向</title>
<desc id="fig-desc">原分布保留四个词，top-2 仅保留 A 与 B。</desc>
<rect x="0" y="0" width="1200" height="733" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">删掉两个词后，两个方向的 KL 有不同结果</text>
<text x="75" y="212" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">原始分布 p</text>
<rect x="274" y="178" width="370" height="53" fill="#ecf6f6" opacity="1"/>
<path d="M274 178 L644 178" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="459" y="212" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">A 0.5</text>
<rect x="644" y="178" width="222" height="53" fill="#e8e6f2" opacity="1"/>
<path d="M644 178 L866 178" fill="none" stroke="#6e618e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="755" y="212" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">B 0.3</text>
<rect x="866" y="178" width="111" height="53" fill="#fbede8" opacity="1"/>
<path d="M866 178 L977 178" fill="none" stroke="#a74d3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="921.5" y="212" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">C 0.15</text>
<rect x="977" y="178" width="37" height="53" fill="#f1f5f6" opacity="1"/>
<path d="M977 178 L1014 178" fill="none" stroke="#526976" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="995.5" y="212" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">0.05</text>
<text x="75" y="378" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">top-2 后 q</text>
<rect x="274" y="344" width="462.5" height="53" fill="#ecf6f6" opacity="1"/>
<path d="M274 344 L736.5 344" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505.25" y="378" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">A 0.625</text>
<rect x="736.5" y="344" width="277.5" height="53" fill="#e8e6f2" opacity="1"/>
<path d="M736.5 344 L1014 344" fill="none" stroke="#6e618e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="875.25" y="378" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">B 0.375</text>
<text x="274" y="449" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">C 与 D 的概率被截为 0。</text>
<path d="M75 493 L1125 493" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="553" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">保留质量 0.8，q 在保留集合上按这个分母重新归一。</text>
<text x="75" y="612" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">KL(q ‖ p) = −ln 0.8 ≈ 0.2231。</text>
<text x="75" y="669" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">KL(p ‖ q) = ∞，因为 p 仍为被删的词分配正概率。</text>
</svg>

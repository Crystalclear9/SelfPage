<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="942" viewBox="30 64 1340 942" role="img"><rect x="30" y="64" width="1340" height="942" fill="#ffffff"/><title>引用联合支持：链接存在，还要连接正确命题</title><rect width="1400" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="104" font-size="26" fill="#687988" text-anchor="start" font-weight="normal">固定 q1、组 A、时点 6；答案命题为“Orion 的日志保留 14 日”</text><line x1="48" y1="128" x2="1352" y2="128" stroke="#d9e3eb" stroke-width="2"/><rect x="70" y="215" width="280" height="112" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="210.0" y="264" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">Orion</text><text x="210.0" y="307" font-size="26" fill="#687988" text-anchor="middle" font-weight="normal">项目实体</text><rect x="560" y="215" width="280" height="112" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="700.0" y="264" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">blue</text><text x="700.0" y="307" font-size="26" fill="#687988" text-anchor="middle" font-weight="normal">方案实体</text><rect x="1050" y="215" width="280" height="112" rx="8" fill="#eff5fa" stroke="#d9e3eb" stroke-width="2"/><text x="1190.0" y="264" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">14 日</text><text x="1190.0" y="307" font-size="26" fill="#687988" text-anchor="middle" font-weight="normal">保留时长</text><line x1="350" y1="269" x2="560" y2="269" stroke="#2769a5" stroke-width="3"/><path d="M548.5914266954252,275.2325320018546 L560,269 L548.5914266954252,262.7674679981454" fill="none" stroke="#2769a5" stroke-width="3"/><text x="455" y="200" font-size="27" fill="#2769a5" text-anchor="middle" font-weight="normal">member</text><line x1="840" y1="269" x2="1050" y2="269" stroke="#17806e" stroke-width="3"/><path d="M1038.591426695425,275.2325320018546 L1050,269 L1038.591426695425,262.7674679981454" fill="none" stroke="#17806e" stroke-width="3"/><text x="945" y="200" font-size="27" fill="#17806e" text-anchor="middle" font-weight="normal">blue-new</text><text x="65" y="392" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">去掉任一必要关系，完整命题就不再可推出</text><text x="75" y="455" font-size="28" fill="#cc6b26" text-anchor="start" font-weight="normal">只引 blue-new</text><text x="445" y="455" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">Orion</text><line x1="565" y1="445" x2="740" y2="445" stroke="#cc6b26" stroke-width="3" stroke-dasharray="7 6"/><text x="655" y="429" font-size="25" fill="#cc6b26" text-anchor="middle" font-weight="normal">连接缺失</text><text x="765" y="455" font-size="29" fill="#17806e" text-anchor="start" font-weight="normal">blue → 14 日</text><text x="75" y="525" font-size="28" fill="#cc6b26" text-anchor="start" font-weight="normal">只引 member</text><text x="445" y="525" font-size="29" fill="#2769a5" text-anchor="start" font-weight="normal">Orion → blue</text><line x1="700" y1="515" x2="950" y2="515" stroke="#cc6b26" stroke-width="3" stroke-dasharray="7 6"/><text x="825" y="499" font-size="25" fill="#cc6b26" text-anchor="middle" font-weight="normal">时长规则缺失</text><text x="970" y="525" font-size="31" fill="#cc6b26" text-anchor="start" font-weight="normal">?</text><line x1="65" y1="568" x2="1335" y2="568" stroke="#d9e3eb" stroke-width="2"/><text x="65" y="622" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">充分性与引用必要性分开判断</text><text x="75" y="681" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">引用集合</text><text x="755" y="681" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">完整命题受支持</text><text x="1080" y="681" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">缺失或额外关系</text><text x="75" y="745" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">member + blue-new</text><text x="820" y="745" font-size="28" fill="#17806e" text-anchor="middle" font-weight="normal">是</text><text x="1080" y="745" font-size="27" fill="#17806e" text-anchor="start" font-weight="normal">无</text><line x1="65" y1="770" x2="1335" y2="770" stroke="#d9e3eb" stroke-width="2"/><text x="75" y="820" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">member + blue-new + green</text><text x="820" y="820" font-size="28" fill="#17806e" text-anchor="middle" font-weight="normal">是</text><text x="1080" y="820" font-size="27" fill="#cc6b26" text-anchor="start" font-weight="normal">green → 2 日</text><line x1="65" y1="845" x2="1335" y2="845" stroke="#d9e3eb" stroke-width="2"/><text x="75" y="895" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">member + member-copy</text><text x="820" y="895" font-size="28" fill="#cc6b26" text-anchor="middle" font-weight="normal">否</text><text x="1080" y="895" font-size="27" fill="#cc6b26" text-anchor="start" font-weight="normal">缺 blue 时长规则</text><line x1="65" y1="920" x2="1335" y2="920" stroke="#d9e3eb" stroke-width="2"/><text x="65" y="981" font-size="26" fill="#687988" text-anchor="start" font-weight="normal">green 不属于本题方案；member-copy 是重复同一有效关系，不能一概当成错误引用。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="919" viewBox="30 66 1340 919" role="img"><rect x="30" y="66" width="1340" height="919" fill="#ffffff"/><title>同一段原文：7 个码点、5 个 token、15 个字节</title><rect width="1400" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="106" font-size="26" fill="#647786" text-anchor="start" font-weight="normal">实验一的“学习学习 AI”；只应用一条预先给定的合并规则，保留空格</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#dbe5ec" stroke-width="2"/><text x="50" y="199" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">① Unicode 码点序列</text><rect x="140" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="210" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">学</text><rect x="310" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="380" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">习</text><rect x="480" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="550" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">学</text><rect x="650" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="720" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">习</text><rect x="820" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="890" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">空格</text><rect x="990" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="1060" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">A</text><rect x="1160" y="230" width="140" height="80" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="1230" y="282" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">I</text><text x="50" y="403" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">② 合并</text><text x="50" y="440" font-size="29" fill="#18354a" font-weight="bold">token</text><line x1="210" y1="315" x2="295.0" y2="450" stroke="#286da8" stroke-width="3"/><path d="M283.6471874982558,443.6664663654292 L295.0,450 L294.1955340120152,437.02491485676586" fill="none" stroke="#286da8" stroke-width="3"/><line x1="380" y1="315" x2="295.0" y2="450" stroke="#286da8" stroke-width="3"/><path d="M295.8044659879848,437.02491485676586 L295.0,450 L306.3528125017442,443.6664663654292" fill="none" stroke="#286da8" stroke-width="3"/><rect x="140" y="455" width="310" height="82" rx="7" fill="#e9f5ef" stroke="#197e70" stroke-width="2"/><text x="295.0" y="509" font-size="34" fill="#197e70" text-anchor="middle" font-weight="normal">学习</text><line x1="550" y1="315" x2="635.0" y2="450" stroke="#286da8" stroke-width="3"/><path d="M623.6471874982558,443.6664663654292 L635.0,450 L634.1955340120152,437.02491485676586" fill="none" stroke="#286da8" stroke-width="3"/><line x1="720" y1="315" x2="635.0" y2="450" stroke="#286da8" stroke-width="3"/><path d="M635.8044659879848,437.02491485676586 L635.0,450 L646.3528125017442,443.6664663654292" fill="none" stroke="#286da8" stroke-width="3"/><rect x="480" y="455" width="310" height="82" rx="7" fill="#e9f5ef" stroke="#197e70" stroke-width="2"/><text x="635.0" y="509" font-size="34" fill="#197e70" text-anchor="middle" font-weight="normal">学习</text><line x1="890" y1="315" x2="890" y2="450" stroke="#647786" stroke-width="3"/><path d="M883.7674679981453,438.5914266954252 L890,450 L896.2325320018547,438.5914266954251" fill="none" stroke="#647786" stroke-width="3"/><rect x="820" y="455" width="140" height="82" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="890" y="509" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">空格</text><line x1="1060" y1="315" x2="1060" y2="450" stroke="#647786" stroke-width="3"/><path d="M1053.7674679981453,438.5914266954252 L1060,450 L1066.2325320018547,438.5914266954251" fill="none" stroke="#647786" stroke-width="3"/><rect x="990" y="455" width="140" height="82" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="1060" y="509" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">A</text><line x1="1230" y1="315" x2="1230" y2="450" stroke="#647786" stroke-width="3"/><path d="M1223.7674679981453,438.5914266954252 L1230,450 L1236.2325320018547,438.5914266954251" fill="none" stroke="#647786" stroke-width="3"/><rect x="1160" y="455" width="140" height="82" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="1230" y="509" font-size="34" fill="#18354a" text-anchor="middle" font-weight="normal">I</text><text x="50" y="596" font-size="28" fill="#647786" text-anchor="start" font-weight="normal">规则只合并“学 + 习”；没有重新训练频率，也没有删除任何原文。</text><line x1="50" y1="630" x2="1350" y2="630" stroke="#dbe5ec" stroke-width="2"/><text x="50" y="685" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">③ 同一原文的 UTF–8 编码</text><rect x="147.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="168.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">E5</text><rect x="189.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="210.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">AD</text><rect x="231.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="252.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">A6</text><text x="210" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[0, 3)</text><rect x="317.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="338.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">E4</text><rect x="359.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="380.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">B9</text><rect x="401.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="422.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">A0</text><text x="380" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[3, 6)</text><rect x="487.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="508.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">E5</text><rect x="529.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="550.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">AD</text><rect x="571.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="592.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">A6</text><text x="550" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[6, 9)</text><rect x="657.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="678.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">E4</text><rect x="699.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="720.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">B9</text><rect x="741.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="762.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">A0</text><text x="720" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[9, 12)</text><rect x="869.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="890.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">20</text><text x="890" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[12, 13)</text><rect x="1039.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="1060.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">41</text><text x="1060" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[13, 14)</text><rect x="1209.0" y="729" width="42" height="60" rx="0" fill="#fff4e9" stroke="#c96a28" stroke-width="2"/><text x="1230.0" y="769" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">49</text><text x="1230" y="837" font-size="26" fill="#647786" text-anchor="middle" font-weight="normal">[14, 15)</text><text x="50" y="906" font-size="31" fill="#18354a" text-anchor="start" font-weight="bold">模型步数变了，原文与 15 个 UTF–8 字节没变。</text><text x="50" y="960" font-size="26" fill="#647786" text-anchor="start" font-weight="normal">本例只数 Python Unicode 码点；“可见字符”在一般 Unicode 文本中可能由多个码点组成。</text></g></svg>

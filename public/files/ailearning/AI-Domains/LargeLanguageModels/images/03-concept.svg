<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img"><title>最新有效版本先决定内容，再判权限，不能回退失效旧版</title><rect width="1450" height="900" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#17324d}</style><text x="80" y="60" font-size="32" text-anchor="start" font-weight="normal" style="fill:#17324d">同一型号 A 的版本时间</text><line x1="150" y1="220" x2="1290" y2="220" stroke="#5b7180" stroke-width="3"/><text x="150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#5b7180">1</text><text x="650" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#5b7180">2</text><text x="1150" y="270" font-size="29" text-anchor="middle" font-weight="normal" style="fill:#5b7180">3</text><line x1="150" y1="160" x2="650" y2="160" stroke="#246d91" stroke-width="20"/><text x="370" y="125" font-size="30" text-anchor="middle" font-weight="normal" style="fill:#246d91">旧版：上限 35</text><line x1="650" y1="335" x2="1290" y2="335" stroke="#d17839" stroke-width="20"/><text x="950" y="395" font-size="30" text-anchor="middle" font-weight="normal" style="fill:#d17839">新版：上限 40</text><line x1="650" y1="100" x2="650" y2="430" stroke="#5b7180" stroke-width="2" stroke-dasharray="6 6"/><text x="650" y="480" font-size="31" text-anchor="middle" font-weight="normal" style="fill:#17324d">时点 2：新版已替换旧版</text><line x1="50" y1="540" x2="1400" y2="540" stroke="#bacbd5" stroke-width="2"/><text x="100" y="620" font-size="31" text-anchor="start" font-weight="normal" style="fill:#246d91">team-a 在时点 1：旧版可见 → 35</text><text x="100" y="705" font-size="31" text-anchor="start" font-weight="normal" style="fill:#d17839">team-a 在时点 2：新版仅限 team-b → 无可见证据</text><text x="100" y="790" font-size="31" text-anchor="start" font-weight="normal" style="fill:#2f897f">team-b 在时点 2：新版可见 → 40</text></svg>
  <line x1="118" y1="564" x2="472" y2="378" stroke="#d4e0e4" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="118" y1="626" x2="590" y2="378" stroke="#d4e0e4" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="236" y1="626" x2="590" y2="440" stroke="#d4e0e4" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="236" y1="440" x2="354" y2="378" stroke="#196f77" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <circle cx="236" cy="440" r="6" stroke="#196f77" stroke-width="1.8" fill="#196f77"/>
  <text x="288" y="461" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="24" fill="#196f77" text-anchor="middle">(1, 3)</text>
  <circle cx="354" cy="378" r="6" stroke="#196f77" stroke-width="1.8" fill="#196f77"/>
  <text x="406" y="399" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="24" fill="#196f77" text-anchor="middle">(2, 4)</text>
  <text x="340" y="705" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" fill="#202a37" text-anchor="middle">沿同一差值线，瓶颈读数不变</text>
  <line x1="335" y1="737" x2="335" y2="932" stroke="#657682" stroke-width="1.25" stroke-linecap="round"/>
  <rect x="295" y="744" width="40" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="285" y="754" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="end">−2</text>
  <rect x="335" y="768" width="80" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="425" y="778" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="start">4</text>
  <rect x="335" y="792" width="40" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="385" y="802" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="start">2</text>
  <rect x="335" y="816" width="120" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="465" y="826" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="start">6</text>
  <rect x="315" y="840" width="20" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="305" y="850" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="end">−1</text>
  <rect x="335" y="864" width="40" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="385" y="874" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="start">2</text>
  <circle cx="335" cy="893" r="3" stroke="#655184" stroke-width="1.8" fill="#655184"/>
  <text x="345" y="898" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="start">0</text>
  <rect x="135" y="912" width="200" height="11" fill="url(#wash-violet)" stroke="#655184" stroke-width="1"/>
  <text x="125" y="922" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="21" fill="#655184" text-anchor="end">−10</text>
  <polygon points="784,484 1025,484 1056,421 815,421" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="920" y="461.08" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#196f77" text-anchor="middle">原因子</text>
  <line x1="1067" y1="453" x2="1126" y2="453" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="1213" y="448" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#196f77" text-anchor="middle">0.8</text>
  <text x="1213" y="485" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="24" fill="#196f77" text-anchor="middle">一步后损失</text>
  <polygon points="784,634 1025,634 1056,571 815,571" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="920" y="611.08" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#a84b3b" text-anchor="middle">B 减半，A 加倍</text>
  <line x1="1067" y1="603" x2="1126" y2="603" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <text x="1213" y="598" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#a84b3b" text-anchor="middle">0.153125</text>
  <text x="1213" y="635" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="24" fill="#a84b3b" text-anchor="middle">一步后损失</text>
  <text x="1021" y="735" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#202a37" text-anchor="middle">因子缩放改变各自的梯度尺度。</text>
  <text x="679" y="989" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#202a37" text-anchor="middle">完整层输出还要加上冻结基座支路。</text>

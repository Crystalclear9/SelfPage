  <text x="1154" y="229" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#655184" text-anchor="middle">8 维</text>
  <line x1="338" y1="150" x2="537" y2="150" stroke="#196f77" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="437.5" y="130" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="30" fill="#196f77" text-anchor="middle">A</text>
  <line x1="826" y1="150" x2="991" y2="150" stroke="#196f77" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <text x="908.5" y="130" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="30" fill="#196f77" text-anchor="middle">B</text>
  <line x1="89" y1="278" x2="1260" y2="278" stroke="#d4e0e4" stroke-width="1.35" stroke-linecap="round"/>

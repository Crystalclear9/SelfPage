  <text x="203" y="160.07" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#657682" text-anchor="middle">输入 x</text>
  <text x="203" y="229" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#657682" text-anchor="middle">6 维</text>
  <polygon points="561.5,186 761.5,186 798.5,115 598.5,115" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="680" y="160.07" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#196f77" text-anchor="middle">瓶颈 Ax</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">低秩增量的所有输出位于一条直线</title>
<desc id="fig-desc">二乘二目标增量的两列共线。三个输入经同一适配器得到的输出增量都平行于 B。</desc>

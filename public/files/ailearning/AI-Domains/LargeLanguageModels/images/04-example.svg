<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="834" viewBox="0 0 1200 834" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">停止梯度改变反向路径，不改变前向数值</title>

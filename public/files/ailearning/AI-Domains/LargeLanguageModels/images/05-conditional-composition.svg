<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>条件正确率下降，可能来自检索覆盖的人群变难</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">条件正确率下降，可能来自检索覆盖的人群变难</text><text x="60" y="112" font-size="26" fill="#19343e" text-anchor="start">固定 100 题：80 道容易、20 道困难；读取器分层成功率始终为 90% 与 40%</text><text x="60" y="185" font-size="28" fill="#19343e" text-anchor="start">总体题目</text><rect x="285" y="150" width="640" height="55" fill="#276a80"/><rect x="925" y="150" width="160" height="55" fill="#c2673f"/><text x="605" y="187" font-size="28" fill="white" text-anchor="middle">容易 80</text><text x="1005" y="187" font-size="28" fill="white" text-anchor="middle">困难 20</text><text x="60" y="330" font-size="28" fill="#19343e" text-anchor="start">原检索</text><rect x="285" y="300" width="288" height="55" fill="#5d8c79"/><text x="429" y="337" font-size="28" fill="white" text-anchor="middle">36</text><rect x="573" y="300" width="32" height="55" fill="#c8d8de"/><text x="589" y="337" font-size="28" fill="#19343e" text-anchor="middle">4</text><rect x="605" y="300" width="480" height="55" fill="#eef2f3"/><text x="845" y="337" font-size="28" fill="#19343e" text-anchor="middle">60</text><text x="60" y="465" font-size="28" fill="#19343e" text-anchor="start">改进检索</text><rect x="285" y="435" width="640" height="55" fill="#5d8c79"/><text x="605" y="472" font-size="28" fill="white" text-anchor="middle">80</text><rect x="925" y="435" width="160" height="55" fill="#c8d8de"/><text x="1005" y="472" font-size="28" fill="#19343e" text-anchor="middle">20</text><rect x="1085" y="435" width="0" height="55" fill="#eef2f3"/><text x="285" y="565" font-size="27" fill="#5d8c79" text-anchor="start">绿色：最终正确</text><text x="620" y="565" font-size="27" fill="#19343e" text-anchor="start">蓝灰：有证据但读错</text><text x="285" y="615" font-size="27" fill="#19343e" text-anchor="start">浅灰：缺证据，未进入条件分母</text><text x="60" y="695" font-size="29" fill="#19343e" text-anchor="start">有证据时：36 ÷ 40 = 90%  →  80 ÷ 100 = 80%</text><text x="60" y="752" font-size="29" fill="#5d8c79" text-anchor="start">同一总体上：36 ÷ 100 = 36%  →  80 ÷ 100 = 80%</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="754" viewBox="0 0 1200 754" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">条件准确率下降，端到端准确率仍可上升</title>

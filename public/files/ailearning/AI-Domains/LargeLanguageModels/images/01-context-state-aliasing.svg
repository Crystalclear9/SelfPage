<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img"><title>历史被合并以后，训练次数不能恢复丢掉的信息</title><rect width="1400" height="1100" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="34" fill="#18354a" text-anchor="start" font-weight="bold">历史被合并以后，训练次数不能恢复丢掉的信息</text><text x="48" y="106" font-size="26" fill="#647786" text-anchor="start" font-weight="normal">等频两种历史：红、占位 → 停；蓝、占位 → 走。只评价最后一个待预测符号。</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#dbe5ec" stroke-width="2"/><rect x="65" y="190" width="310" height="90" rx="7" fill="#fff2e8" stroke="#c96a28" stroke-width="2"/><text x="220" y="245" font-size="33" fill="#c96a28" text-anchor="middle" font-weight="normal">红 → 占位</text><rect x="65" y="370" width="310" height="90" rx="7" fill="#eaf2fa" stroke="#286da8" stroke-width="2"/><text x="220" y="425" font-size="33" fill="#286da8" text-anchor="middle" font-weight="normal">蓝 → 占位</text><rect x="610" y="277" width="220" height="100" rx="7" fill="#f0f6fa" stroke="#dbe5ec" stroke-width="2"/><text x="720" y="339" font-size="30" fill="#18354a" text-anchor="middle" font-weight="normal">同一状态：占位</text><line x1="375" y1="235" x2="605" y2="315" stroke="#c96a28" stroke-width="3"/><path d="M592.1771237506259,317.1386548794131 L605,315 L596.2721543670574,305.3654418571724" fill="none" stroke="#c96a28" stroke-width="3"/><line x1="375" y1="415" x2="605" y2="340" stroke="#286da8" stroke-width="3"/><path d="M596.0857422431093,349.4623468887857 L605,340 L592.2213156237485,337.61143858941284" fill="none" stroke="#286da8" stroke-width="3"/><text x="485" y="170" font-size="27" fill="#647786" text-anchor="middle" font-weight="normal">只读最后</text><text x="485" y="207" font-size="27" fill="#647786" text-anchor="middle" font-weight="normal">一个 token</text><line x1="830" y1="327" x2="1015" y2="245" stroke="#c96a28" stroke-width="3"/><path d="M1007.095623829834,255.3208932443133 L1015,245 L1002.0445151264206,243.92509921831976" fill="none" stroke="#c96a28" stroke-width="3"/><line x1="830" y1="327" x2="1015" y2="425" stroke="#286da8" stroke-width="3"/><path d="M1002.0010736898425,425.1670771770629 L1015,425 L1007.8360595440898,414.1520528603715" fill="none" stroke="#286da8" stroke-width="3"/><rect x="1020" y="202" width="290" height="82" rx="7" fill="#f6f8fa" stroke="#c96a28" stroke-width="2"/><text x="1070" y="254" font-size="32" fill="#c96a28" text-anchor="start" font-weight="normal">停</text><text x="1210" y="224" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">1</text><line x1="1196.25" y1="234" x2="1223.75" y2="234" stroke="#c96a28" stroke-width="2"/><text x="1210" y="262" font-size="25" fill="#c96a28" text-anchor="middle" font-weight="normal">2</text><rect x="1020" y="382" width="290" height="82" rx="7" fill="#f6f8fa" stroke="#286da8" stroke-width="2"/><text x="1070" y="434" font-size="32" fill="#286da8" text-anchor="start" font-weight="normal">走</text><text x="1210" y="404" font-size="25" fill="#286da8" text-anchor="middle" font-weight="normal">1</text><line x1="1196.25" y1="414" x2="1223.75" y2="414" stroke="#286da8" stroke-width="2"/><text x="1210" y="442" font-size="25" fill="#286da8" text-anchor="middle" font-weight="normal">2</text><line x1="50" y1="505" x2="1350" y2="505" stroke="#dbe5ec" stroke-width="2"/><text x="65" y="558" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">合并状态的最优损失</text><text x="830" y="558" font-size="29" fill="#18354a" text-anchor="start" font-weight="bold">保留两步历史后的最优损失</text><line x1="115" y1="620" x2="115" y2="920" stroke="#18354a" stroke-width="2"/><line x1="115" y1="920" x2="675" y2="920" stroke="#18354a" stroke-width="2"/><line x1="115" y1="920" x2="115" y2="927" stroke="#18354a" stroke-width="2"/><text x="115" y="962" font-size="25" fill="#18354a" text-anchor="middle" font-weight="normal">0</text><line x1="255.0" y1="920" x2="255.0" y2="927" stroke="#18354a" stroke-width="2"/
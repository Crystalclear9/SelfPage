<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">多跳查询必须同时满足权限、版本、召回与预算</title>
<desc id="fig-desc">公开链选择生效规则，私有链还受到候选截断和证据预算影响。</desc>
<rect x="0" y="0" width="1200" height="765" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">找到了成员关系，还要找到当前生效的规则</text>
<text x="75" y="127" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">公开链 · 查询时点 6 · A、B 两组可见</text>
<path d="M83 201 L98 158 L388 158 L373 201 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235.5" y="187.2" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">Orion</text>
<path d="M390 179 L412 179" fill="none" stroke="#166d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M412 179 L401 184 L401 174 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M418 201 L433 158 L723 158 L708 201 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="570.5" y="187.2" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">blue</text>
<path d="M725 179 L747 179" fill="none" stroke="#166d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M747 179 L736 184 L736 174 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M753 201 L768 158 L1058 158 L1043 201 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="905.5" y="187.2" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">新版：14 日</text>
<text x="83" y="263" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">blue-old 在时点 5 之前生效，给出 7 日。时点 6 应用 blue-new。</text>
<path d="M75 306 L1125 306" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="359" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">私有链 · 仅组 B 可见</text>
<path d="M83 433 L98 390 L388 390 L373 433 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235.5" y="419.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">Nebula</text>
<path d="M390 411 L412 411" fill="none" stroke="#6e618e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M412 411 L401 416 L401 406 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M418 433 L433 390 L723 390 L708 433 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="570.5" y="419.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">red</text>
<path d="M725 411 L747 411" fill="none" stroke="#6e618e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M747 411 L736 416 L736 406 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M753 433 L768 390 L1058 390 L1043 433 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="905.5" y="419.2" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">规则：60 日</text>
<text x="83" y="498" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">q4 的红方案规则排第 5，k = 4 时尚未进入候选。</text>
<text x="83" y="563" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">若补齐候选，最小充分集合仍需：</text>
<path d="M551 578 L566 529 L781 529 L766 578 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="666" y="561.55" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">成员关系 44</text>
<path d="M790 578 L805 529 L1008 529 L993 578 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="899" y="561.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">红方案规则 40</text>
<text x="83" y="643" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">两段共 84 字符，超过 80 字符预算。</text>
</svg>

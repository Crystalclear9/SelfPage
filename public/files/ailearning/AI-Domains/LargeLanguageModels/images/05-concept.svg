<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img"><title>问题要跨两条关系，权限、版本与预算各有边界</title><rect width="1280" height="1030" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">问题要跨两条关系，权限、版本与预算各有边界</text><text x="60" y="135" font-size="28" fill="#276a80" text-anchor="start">公开链：组 A、B 均可读，查询时点 6</text><circle cx="130" cy="265" r="12" fill="#276a80"/><text x="130" y="313" font-size="30" fill="#19343e" text-anchor="middle">Orion</text><circle cx="610" cy="265" r="12" fill="#276a80"/><text x="610" y="313" font-size="30" fill="#19343e" text-anchor="middle">blue</text><circle cx="1100" cy="265" r="12" fill="#276a80"/><text x="1100" y="313" font-size="30" fill="#19343e" text-anchor="middle">14 日</text><circle cx="1100" cy="400" r="12" fill="#74888d"/><text x="1100" y="448" font-size="30" fill="#19343e" text-anchor="middle">7 日</text><line x1="155" y1="265" x2="585" y2="265" stroke="#276a80" stroke-width="4"/><path d="M574.47,270.75 L585.00,265.00 L574.47,259.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="365" y="225" font-size="25" fill="#276a80" text-anchor="middle">member / member-copy</text><line x1="635" y1="265" x2="1075" y2="265" stroke="#276a80" stroke-width="4"/><path d="M1064.47,270.75 L1075.00,265.00 L1064.47,259.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="850" y="225" font-size="26" fill="#276a80" text-anchor="middle">blue-new：t ≥ 5</text><line x1="635" y1="275" x2="1075" y2="400" stroke="#74888d" stroke-width="3"/><text x="840" y="390" font-size="26" fill="#74888d" text-anchor="middle">blue-old：0 ≤ t &lt; 5</text><text x="60" y="520" font-size="28" fill="#c2673f" text-anchor="start">私有链：仅组 B 可读，同一句问题不代表同一可答性</text><circle cx="130" cy="620" r="12" fill="#c2673f"/><text x="130" y="670" font-size="30" fill="#c2673f" text-anchor="middle">Nebula</text><circle cx="610" cy="620" r="12" fill="#c2673f"/><text x="610" y="670" font-size="30" fill="#c2673f" text-anchor="middle">red</text><circle cx="1100" cy="620" r="12" fill="#c2673f"/><text x="1100" y="670" font-size="30" fill="#c2673f" text-anchor="middle">60 日</text><line x1="155" y1="620" x2="585" y2="620" stroke="#c2673f" stroke-width="4"/><path d="M574.47,625.75 L585.00,620.00 L574.47,614.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="365" y="575" font-size="26" fill="#c2673f" text-anchor="middle">secret-member</text><line x1="635" y1="620" x2="1075" y2="620" stroke="#c2673f" stroke-width="4"/><path d="M1064.47,625.75 L1075.00,620.00 L1064.47,614.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="850" y="575" font-size="26" fill="#c2673f" text-anchor="middle">secret-rule</text><text x="60" y="745" font-size="28" fill="#19343e" text-anchor="start">q4：组 B 有权，但规则排第 5，被 k = 4 截断</text><text x="60" y="805" font-size="27" fill="#19343e" text-anchor="start">即使补齐候选，最低充分成本也超过 80：</text><rect x="210" y="850" width="396" height="50" fill="#276a80"/><rect x="606" y="850" width="360" height="50" fill="#c2673f"/><text x="408" y="884" font-size="26" fill="white" text-anchor="middle">成员关系 44</text><text x="786" y="884" font-size="26" fill="white" text-anchor="middle">规则 40</text><line x1="930" y1="830" x2="930" y2="932" stroke="#19343e" stroke-width="3"/><text x="930" y="968" font-size="26" fill="#19343e" text-anchor="middle">80 字符上限</text><text x="1110" y="884" font-size="28" fill="#c2673f" text-anchor="start">合计 84</text></g></svg>

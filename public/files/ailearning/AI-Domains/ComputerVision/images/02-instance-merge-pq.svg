<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" role="img" aria-labelledby="title description">
<title id="title">两个相邻同类实例的正确划分、整体合并、局部等分与PQ变化</title>
<desc id="description">真值是相邻但不重叠的两个同类实例，各一百像素。三种预测的语义前景均相同，但实例匹配要求 IoU 严格大于二分之一。</desc>
<defs>
<linearGradient id="wash-t" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#eff9f8"/><stop offset="1" stop-color="#c4e3e3"/></linearGradient>
<linearGradient id="wash-c" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#fdf4f1"/><stop offset="1" stop-color="#f1d2c9"/></linearGradient>
<linearGradient id="wash-v" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f8f5fa"/><stop offset="1" stop-color="#e3d9ef"/></linearGradient>
<linearGradient id="wash-g" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f2f8f3"/><stop offset="1" stop-color="#d7eadc"/></linearGradient>
<linearGradient id="wash-n" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f7fafb"/><stop offset="1" stop-color="#e8eef0"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="624" fill="white" stroke="none" stroke-width="1.6" rx="0"/>
<text x="387" y="55" fill="#222d39" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两个真值实例，各一百像素</text>
<rect x="248" y="93" width="139" height="54" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2.6" rx="0"/>
<text x="317" y="129" fill="#1a7077" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">G₁</text>
<rect x="387" y="93" width="139" height="54" fill="url(#wash-c)" stroke="#ac4f3e" stroke-width="2.6" rx="0"/>
<text x="456" y="129" fill="#ac4f3e" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">G₂</text>
<text x="835" y="125" fill="#536979" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">匹配要求 IoU 大于</text>
<text x="1000" y="106" fill="#ac4f3e" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<path d="M982 115 L1018 115" stroke="#ac4f3e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1000" y="143" fill="#ac4f3e" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2</text>
<path d="M89 190 L1110 190" stroke="#d5e3e5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="208" y="249" fill="#222d39" font-size="33" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">A  正确区分</text>
<rect x="61" y="296" width="147.0" height="81" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2.4" rx="0"/>
<text x="134.5" y="348" fill="#1a7077" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">100</text>
<rect x="208.0" y="296" width="147.0" height="81" fill="url(#wash-c)" stroke="#ac4f3e" stroke-width="2.4" rx="0"/>
<text x="281.5" y="348" fill="#ac4f3e" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">100</text>
<text x="208" y="454" fill="#655185" font-size="34" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">PQ = 1</text>
<text x="114" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">TP</text>
<text x="114" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2</text>
<text x="208" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FP</text>
<text x="208" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<text x="302" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FN</text>
<text x="302" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<text x="597" y="249" fill="#222d39" font-size="33" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">B  全部合并</text>
<rect x="450" y="296" width="294.0" height="81" fill="url(#wash-v)" stroke="#655185" stroke-width="2.4" rx="0"/>
<text x="597.0" y="348" fill="#655185" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">200</text>
<text x="597" y="454" fill="#655185" font-size="34" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">PQ = 0</text>
<text x="503" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">TP</text>
<text x="503" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<text x="597" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FP</text>
<text x="597" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<text x="691" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FN</text>
<text x="691" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2</text>
<text x="986" y="249" fill="#222d39" font-size="33" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">C  等分首个实例</text>
<rect x="839" y="296" width="73.5" height="81" fill="url(#wash-v)" stroke="#655185" stroke-width="2.4" rx="0"/>
<text x="875.75" y="348" fill="#655185" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">50</text>
<rect x="912.5" y="296" width="73.5" height="81" fill="url(#wash-g)" stroke="#3d725a" stroke-width="2.4" rx="0"/>
<text x="949.25" y="348" fill="#3d725a" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">50</text>
<rect x="986.0" y="296" width="147.0" height="81" fill="url(#wash-c)" stroke="#ac4f3e" stroke-width="2.4" rx="0"/>
<text x="1059.5" y="348" fill="#ac4f3e" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">100</text>
<text x="986" y="454" fill="#655185" font-size="34" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">PQ = 0.4</text>
<text x="892" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">TP</text>
<text x="892" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<text x="986" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FP</text>
<text x="986" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2</text>
<text x="1080" y="514" fill="#536979" font-size="23" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">FN</text>
<text x="1080" y="552" fill="#222d39" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<text x="600" y="602" fill="#536979" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">三种预测的语义前景 IoU 都为一</text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1485" height="1078" viewBox="42 74 1485 1078" role="img"><rect x="42" y="74" width="1485" height="1078" fill="#ffffff"/><title>语义全对，实例仍可失败：合并与拆分的PQ算例</title><desc>两相邻同类真值实例各100像素。正确区分PQ1，全部合并IoU恰0.5无匹配PQ0，将一个实例等分为两半时PQ0.4。所有前景语义IoU均1。</desc><rect width="1600" height="1190" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1d3048"><text x="60.00" y="115.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">两个相邻同类实例各 100 像素；只评价这一前景类，无 void、crowd 或背景类参与平均。</text><text x="65.00" y="180.00" font-size="30" fill="#1d3048" text-anchor="start" font-weight="bold">真值</text><rect x="210.00" y="140.00" width="200.00" height="100.00" rx="0" fill="#9fc0ee" stroke="white" stroke-width="2"/><rect x="410.00" y="140.00" width="200.00" height="100.00" rx="0" fill="#f1c78f" stroke="white" stroke-width="2"/><text x="310.00" y="202.00" font-size="28" fill="#1d3048" text-anchor="middle" font-weight="normal">G1：100</text><text x="510.00" y="202.00" font-size="28" fill="#1d3048" text-anchor="middle" font-weight="normal">G2：100</text><text x="790.00" y="180.00" font-size="29" fill="#087f73" text-anchor="start" font-weight="bold">规则：同类、互斥区域，匹配要求 IoU &gt; 0.5</text><text x="790.00" y="230.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">严格大于；恰好 0.5 不能领取匹配。</text><text x="70.00" y="345.00" font-size="30" fill="#1d3048" text-anchor="start" font-weight="bold">A  身份正确</text><rect x="70.00" y="400.00" width="200.00" height="160.00" rx="0" fill="#2663c9" stroke="white" stroke-width="2"/><text x="170.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P1</text><rect x="270.00" y="400.00" width="200.00" height="160.00" rx="0" fill="#d17b24" stroke="white" stroke-width="2"/><text x="370.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P2</text><text x="70.00" y="620.00" font-size="28" fill="#087f73" text-anchor="start" font-weight="normal">语义前景 IoU = 1</text><text x="70.00" y="685.00" font-size="28" fill="#1d3048" text-anchor="start" font-weight="normal">TP 2，FP 0，FN 0</text><text x="70.00" y="760.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">两对匹配 IoU 都为 1</text><text x="70.00" y="810.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">重叠和 = 2</text><text x="70.00" y="900.00" font-size="36" fill="#087f73" text-anchor="start" font-weight="bold">PQ = 1</text><text x="70.00" y="965.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">RQ = 1；SQ = 1</text><text x="590.00" y="345.00" font-size="30" fill="#1d3048" text-anchor="start" font-weight="bold">B  两个合为一个</text><rect x="590.00" y="400.00" width="400.00" height="160.00" rx="0" fill="#8b5cad" stroke="white" stroke-width="2"/><text x="790.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P1</text><text x="590.00" y="620.00" font-size="28" fill="#087f73" text-anchor="start" font-weight="normal">语义前景 IoU = 1</text><text x="590.00" y="685.00" font-size="28" fill="#1d3048" text-anchor="start" font-weight="normal">TP 0，FP 1，FN 2</text><text x="590.00" y="760.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">P1 对 G1、G2 都为 0.5</text><text x="590.00" y="810.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">没有合法匹配</text><text x="590.00" y="900.00" font-size="36" fill="#087f73" text-anchor="start" font-weight="bold">PQ = 0</text><text x="590.00" y="965.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">RQ = 0；SQ = 无匹配</text><text x="1110.00" y="345.00" font-size="30" fill="#1d3048" text-anchor="start" font-weight="bold">C  第一个拆成两半</text><rect x="1110.00" y="400.00" width="100.00" height="160.00" rx="0" fill="#2663c9" stroke="white" stroke-width="2"/><text x="1160.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P1</text><rect x="1210.00" y="400.00" width="100.00" height="160.00" rx="0" fill="#8b5cad" stroke="white" stroke-width="2"/><text x="1260.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P2</text><rect x="1310.00" y="400.00" width="200.00" height="160.00" rx="0" fill="#d17b24" stroke="white" stroke-width="2"/><text x="1410.00" y="495.00" font-size="28" fill="white" text-anchor="middle" font-weight="normal">P3</text><text x="1110.00" y="620.00" font-size="28" fill="#087f73" text-anchor="start" font-weight="normal">语义前景 IoU = 1</text><text x="1110.00" y="685.00" font-size="28" fill="#1d3048" text-anchor="start" font-weight="normal">TP 1，FP 2，FN 1</text><text x="1110.00" y="760.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">P1/P2 对 G1 均为 0.5</text><text x="1110.00" y="810.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">P3 对 G2 为 1；重叠和 = 1</text><text x="1110.00" y="900.00" font-size="36" fill="#087f73" text-anchor="start" font-weight="bold">PQ = 0.4</text><text x="1110.00" y="965.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">RQ = 0.4；SQ = 1</text><text x="60.00" y="1060.00" font-size="29" fill="#1d3048" text-anchor="start" font-weight="normal">C：分母 = 1 + 0.5 × 2 + 0.5 × 1 = 2.5；PQ = 0.4。</text><text x="60.00" y="1130.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">图中颜色表示实例身份；合并颜色再看前景，三种预测完全一样。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="42 72 1100 720" role="img"><rect x="42" y="72" width="1100" height="720" fill="#ffffff"/><title>RoIAlign：保留连续坐标，再从邻近特征插值</title><rect width="1280" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#19343e" text-anchor="start">人工特征 F(x, y) = x + 2y；整数网格是采样位置，图中 y 向下增加</text><line x1="145" y1="215" x2="145" y2="545" stroke="#dbe5e8" stroke-width="2"/><line x1="145" y1="215" x2="475" y2="215" stroke="#dbe5e8" stroke-width="2"/><circle cx="145" cy="215" r="5" fill="#74888d"/><text x="130" y="200" font-size="25" fill="#19343e" text-anchor="start">0</text><circle cx="255" cy="215" r="5" fill="#74888d"/><text x="240" y="200" font-size="25" fill="#19343e" text-anchor="start">1</text><circle cx="365" cy="215" r="5" fill="#74888d"/><text x="350" y="200" font-size="25" fill="#19343e" text-anchor="start">2</text><circle cx="475" cy="215" r="5" fill="#74888d"/><text x="460" y="200" font-size="25" fill="#19343e" text-anchor="start">3</text><line x1="255" y1="215" x2="255" y2="545" stroke="#dbe5e8" stroke-width="2"/><line x1="145" y1="325" x2="475" y2="325" stroke="#dbe5e8" stroke-width="2"/><circle cx="145" cy="325" r="5" fill="#74888d"/><text x="130" y="310" font-size="25" fill="#19343e" text-anchor="start">2</text><circle cx="255" cy="325" r="5" fill="#74888d"/><text x="240" y="310" font-size="25" fill="#19343e" text-anchor="start">3</text><circle cx="365" cy="325" r="5" fill="#74888d"/><text x="350" y="310" font-size="25" fill="#19343e" text-anchor="start">4</text><circle cx="475" cy="325" r="5" fill="#74888d"/><text x="460" y="310" font-size="25" fill="#19343e" text-anchor="start">5</text><line x1="365" y1="215" x2="365" y2="545" stroke="#dbe5e8" stroke-width="2"/><line x1="145" y1="435" x2="475" y2="435" stroke="#dbe5e8" stroke-width="2"/><circle cx="145" cy="435" r="5" fill="#74888d"/><text x="130" y="420" font-size="25" fill="#19343e" text-anchor="start">4</text><circle cx="255" cy="435" r="5" fill="#74888d"/><text x="240" y="420" font-size="25" fill="#19343e" text-anchor="start">5</text><circle cx="365" cy="435" r="5" fill="#74888d"/><text x="350" y="420" font-size="25" fill="#19343e" text-anchor="start">6</text><circle cx="475" cy="435" r="5" fill="#74888d"/><text x="460" y="420" font-size="25" fill="#19343e" text-anchor="start">7</text><line x1="475" y1="215" x2="475" y2="545" stroke="#dbe5e8" stroke-width="2"/><line x1="145" y1="545" x2="475" y2="545" stroke="#dbe5e8" stroke-width="2"/><circle cx="145" cy="545" r="5" fill="#74888d"/><text x="130" y="530" font-size="25" fill="#19343e" text-anchor="start">6</text><circle cx="255" cy="545" r="5" fill="#74888d"/><text x="240" y="530" font-size="25" fill="#19343e" text-anchor="start">7</text><circle cx="365" cy="545" r="5" fill="#74888d"/><text x="350" y="530" font-size="25" fill="#19343e" text-anchor="start">8</text><circle cx="475" cy="545" r="5" fill="#74888d"/><text x="460" y="530" font-size="25" fill="#19343e" text-anchor="start">9</text><rect x="167.0" y="248.0" width="132.0" height="132.0" fill="#276a80" fill-opacity="0.06" stroke="#276a80" stroke-width="4"/><circle cx="200.0" cy="281.0" r="8" fill="#c2673f"/><circle cx="200.0" cy="347.0" r="8" fill="#c2673f"/><circle cx="266.0" cy="281.0" r="8" fill="#c2673f"/><circle cx="266.0" cy="347.0" r="8" fill="#c2673f"/><text x="60" y="615" font-size="27" fill="#19343e" text-anchor="start">一个 bin：x 从 0.2 到 1.4</text><text x="60" y="660" font-size="27" fill="#19343e" text-anchor="start">y 从 0.3 到 1.5；四点均匀采样</text><text x="745" y="185" font-size="28" fill="#19343e" text-anchor="start">放大第一个点 (0.5, 0.6)</text><line x1="790" y1="255" x2="1010" y2="255" stroke="#74888d" stroke-width="2"/><line x1="790" y1="475" x2="1010" y2="475" stroke="#74888d" stroke-width="2"/><line x1="790" y1="255" x2="790" y2="475" stroke="#74888d" stroke-width="2"/><line x1="1010" y1="255" x2="1010" y2="475" stroke="#74888d" stroke-width="2"/><circle cx="790" cy="255" r="7" fill="#276a80"/><text x="770" y="263" font-size="28" fill="#19343e" text-anchor="end">0</text><circle cx="1010" cy="255" r="7" fill="#276a80"/><text x="1030" y="263" font-size="28" fill="#19343e" text-anchor="start">1</text><circle cx="790" cy="475" r="7" fill="#276a80"/><text x="770" y="483" font-size="28" fill="#19343e" text-anchor="end">2</text><circle cx="1010" cy="475" r="7" fill="#276a80"/><text x="1030" y="483" font-size="28" fill="#19343e" text-anchor="start">3</text><circle cx="900.0" cy="387.0" r="10" fill="#c2673f"/><text x="1080" y="395" font-size="32" fill="#c2673f" text-anchor="start">1.7</text><text x="700" y="555" font-size="26" fill="#19343e" text-anchor="start">权重：(0.2, 0.2, 0.3, 0.3)</text><text x="700" y="615" font-size="26" fill="#19343e" text-anchor="start">插值：0 + 0.2 + 0.6 + 0.9 = 1.7</text><text x="700" y="675" font-size="30" fill="#276a80" text-anchor="start">四点取均值：2.6</text><text x="60" y="770" font-size="27" fill="#19343e" text-anchor="start">插值不恢复丢失细节；步长、半像素偏移与边界规则仍需独立核对</text></g></svg>

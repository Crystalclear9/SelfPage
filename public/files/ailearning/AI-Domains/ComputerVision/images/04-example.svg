<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>零次失败不能证明失败概率为零</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#18364e">零次失败不能证明失败概率为零</text><line x1="90" y1="512.3199999999999" x2="1100" y2="512.3199999999999" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="195.52000000000004" width="125" height="316.8" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="21" fill="#18364e">30 次零失败</text><text x="170.0" y="178.72000000000003" font-size="25.0" fill="#18364e">0.09503</text><rect x="463.3333333333333" y="413.93680459545413" width="125" height="98.38319540454586" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="453.3333333333333" y="604.0" font-size="21" fill="#18364e">100 次零失败</text><text x="463.3333333333333" y="397.1368045954542" font-size="25.0" fill="#18364e">0.02951</text><rect x="756.6666666666666" y="479.19758450878675" width="125" height="33.12241549121329" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="746.6666666666666" y="604.0" font-size="21" fill="#18364e">300 次零失败</text><text x="756.6666666666666" y="462.39758450878674" font-size="25.0" fill="#18364e">0.009936</text></g><text x="105" y="657" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">纵轴：失败概率的 95% 单侧精确上限；不是观测失败率。</text><text x="105" y="691" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">假定 n 次独立同分布伯努利试验：上限 = 1 − 0.05 的 (1/n) 次方。</text></svg>

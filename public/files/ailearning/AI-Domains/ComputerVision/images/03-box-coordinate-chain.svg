<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="632" viewBox="22 66 1352 632" role="img"><rect x="22" y="66" width="1352" height="632" fill="#ffffff"/><title>框回归：几何位移、编码与梯度是三个坐标层次</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245f98"/></marker></defs><rect width="1400" height="760" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<line x1="44" y1="85" x2="1356" y2="85" stroke="#dce5ed" stroke-width="2"/>
<text x="300" y="140" font-size="29" fill="#18324a" text-anchor="middle" font-weight="normal">同一坐标平面</text>
<text x="1030" y="140" font-size="29" fill="#18324a" text-anchor="middle" font-weight="normal">编码目标</text>
<line x1="70" y1="565" x2="70" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="70" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">0</text>
<line x1="160" y1="565" x2="160" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="160" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">2</text>
<line x1="250" y1="565" x2="250" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="250" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">4</text>
<line x1="340" y1="565" x2="340" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="340" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">6</text>
<line x1="430" y1="565" x2="430" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="430" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">8</text>
<line x1="520" y1="565" x2="520" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="520" y="600" font-size="24" fill="#18324a" text-anchor="middle" font-weight="normal">10</text>
<line x1="70" y1="565" x2="540" y2="565" stroke="#dce5ed" stroke-width="2"/>
<text x="55" y="574" font-size="24" fill="#18324a" text-anchor="end" font-weight="normal">0</text>
<line x1="70" y1="475" x2="540" y2="475" stroke="#dce5ed" stroke-width="2"/>
<text x="55" y="484" font-size="24" fill="#18324a" text-anchor="end" font-weight="normal">2</text>
<line x1="70" y1="385" x2="540" y2="385" stroke="#dce5ed" stroke-width="2"/>
<text x="55" y="394" font-size="24" fill="#18324a" text-anchor="end" font-weight="normal">4</text>
<line x1="70" y1="295" x2="540" y2="295" stroke="#dce5ed" stroke-width="2"/>
<text x="55" y="304" font-size="24" fill="#18324a" text-anchor="end" font-weight="normal">6</text>
<line x1="70" y1="205" x2="540" y2="205" stroke="#dce5ed" stroke-width="2"/>
<text x="55" y="214" font-size="24" fill="#18324a" text-anchor="end" font-weight="normal">8</text>
<rect x="160" y="250" width="360" height="180" fill="#fff1e5" fill-opacity=".6" stroke="#c76b25" stroke-width="4"/>
<rect x="160" y="340" width="180" height="90" fill="#dbeaf7" fill-opacity=".7" stroke="#245f98" stroke-width="4"/>
<circle cx="250" cy="385" r="7" fill="#245f98" stroke="#245f98" stroke-width="2"/>
<circle cx="340" cy="340" r="7" fill="#c76b25" stroke="#c76b25" stroke-width="2"/>
<line x1="250" y1="385" x2="340" y2="340" stroke="#c76b25" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="635" font-size="25" fill="#18324a" text-anchor="middle" font-weight="normal">锚框 (4,4,4,2) → 真值 (6,5,8,4)</text>
<text x="1030" y="245" font-size="31" fill="#18324a" text-anchor="middle" font-weight="normal">tx = 0.5    ty = 0.5</text>
<text x="1030" y="330" font-size="31" fill="#18324a" text-anchor="middle" font-weight="normal">t_w = ln 2    th = ln 2</text>
<text x="1030" y="415" font-size="31" fill="#18324a" text-anchor="middle" font-weight="normal">解码：cx = 4 + 4tx</text>
<line x1="700" y1="115" x2="700" y2="680" stroke="#dce5ed" stroke-width="2"/>
<text x="1030" y="535" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">预测 tx=0.25 → cx=5</text>
<text x="1030" y="600" font-size="28" fill="#c76b25" text-anchor="middle" font-weight="normal">中心梯度 −1 → 编码梯度 −4</text>
<text x="1030" y="665" font-size="25" fill="#18324a" text-anchor="middle" font-weight="normal">同样差 1 像素，梯度仍受锚宽影响</text></g></svg>

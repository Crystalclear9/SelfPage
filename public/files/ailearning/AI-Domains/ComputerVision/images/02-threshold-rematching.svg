<text x="302" y="683" fill="#536979" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">两个对象被领取</text>
<text x="856" y="420" fill="#536979" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">重叠门槛</text>
<text x="967" y="406" fill="#655185" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<path d="M949 415 L985 415" stroke="#655185" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="967" y="443" fill="#655185" font-size="27" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">4</text>
<circle cx="766" cy="519" r="24" fill="white" stroke="#ac4f3e" stroke-width="2.4"/>
<text x="766" y="528" fill="#ac4f3e" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">P₁</text>
<path d="M797 519 L895 519" stroke="#536979" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M906 519L892 513.2L892 524.8Z" stroke="#536979" stroke-width="1" fill="#536979" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M924 547l19 -54h146l-19 54Z" stroke="#536979" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1005" y="529" fill="#536979" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未匹配</text>
<circle cx="766" cy="619" r="24" fill="white" stroke="#ac4f3e" stroke-width="2.4"/>
<text x="766" y="628" fill="#ac4f3e" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">P₂</text>
<path d="M797 619 L895 619" stroke="#1a7077" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M906 619L892 613.2L892 624.8Z" stroke="#1a7077" stroke-width="1" fill="#1a7077" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M924 647l19 -54h146l-19 54Z" stroke="#1a7077" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1005" y="629" fill="#1a7077" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<text x="923" y="683" fill="#536979" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">对象 B 留空</text>

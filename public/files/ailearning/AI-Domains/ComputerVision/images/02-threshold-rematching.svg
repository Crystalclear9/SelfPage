<text x="384" y="529" fill="#1a7077" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<circle cx="145" cy="619" r="24" fill="white" stroke="#ac4f3e" stroke-width="2.4"/>
<text x="145" y="628" fill="#ac4f3e" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">P₂</text>
<path d="M176 619 L274 619" stroke="#1a7077" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M285 619L271 613.2L271 624.8Z" stroke="#1a7077" stroke-width="1" fill="#1a7077" stroke-linecap="round" stroke-linejoin="round"/>

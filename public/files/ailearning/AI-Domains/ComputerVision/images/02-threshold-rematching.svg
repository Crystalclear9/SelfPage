<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="945.4783" viewBox="0 0 1440 945.4783" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同一预测在两个IoU门槛下重新领取不同对象</title><rect width="1440" height="945.4783" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同一预测在两个IoU门槛下重新领取不同对象</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="803.4783" viewBox="42 72 1196 715" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="72" width="1196" height="715" fill="#ffffff"/><title>评价门槛改变后，必须重新决定预测领取哪个对象</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#1a2b3d" text-anchor="start">同一图、同一类别；四个框竖直范围均为 [0, 10]；只展示水平投影</text><text x="60" y="208" font-size="26" fill="#1a2b3d" text-anchor="start">真值 A</text><rect x="315" y="180" width="450" height="35" fill="#257190"/><text x="780" y="208" font-size="26" fill="#1a2b3d" text-anchor="start">[0, 10]</text><text x="60" y="273" font-size="26" fill="#1a2b3d" text-anchor="start">真值 B</text><rect x="495" y="245" width="450" height="35" fill="#5c9a91"/><text x="960" y="273" font-size="26" fill="#1a2b3d" text-anchor="start">[4, 14]</text><text x="60" y="338" font-size="26" fill="#1a2b3d" text-anchor="start">P1：0.90</text><rect x="180" y="310" width="450" height="35" fill="#bf6d42"/><text x="645" y="338" font-size="26" fill="#1a2b3d" text-anchor="start">[-3, 7]</text><text x="60" y="403" font-size="26" fill="#1a2b3d" text-anchor="start">P2：0.80</text><rect x="360" y="375" width="450" height="35" fill="#bf6d42"/><text x="825" y="403" font-size="26" fill="#1a2b3d" text-anchor="start">[1, 11]</text><text x="1030" y="200" font-size="26" fill="#1a2b3d" text-anchor="middle">对 A / 对 B</text><text x="1030" y="320" font-size="25" fill="#1a2b3d" text-anchor="middle">P1：0.538 / 0.176</text><text x="1030" y="385" font-size="25" fill="#1a2b3d" text-anchor="middle">P2：0.818 / 0.538</text><line x1="60" y1="445" x2="1220" y2="445" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="505" font-size="31" fill="#1a2b3d" text-anchor="start">IoU 门槛 0.50</text><text x="90" y="565" font-size="29" fill="#257190" text-anchor="start">P1 → A：TP</text><text x="90" y="625" font-size="29" fill="#257190" text-anchor="start">P2 → B：TP</text><text x="90" y="685" font-size="29" fill="#257190" text-anchor="start">A、B 均被找到</text><text x="710" y="505" font-size="31" fill="#1a2b3d" text-anchor="start">IoU 门槛 0.75</text><text x="710" y="565" font-size="29" fill="#bf6d42" text-anchor="start">P1 → 无：FP</text><text x="710" y="625" font-size="29" fill="#bf6d42" text-anchor="start">P2 → A：TP</text><text x="710" y="685" font-size="29" fill="#bf6d42" text-anchor="start">B 仍然漏检</text><text x="60" y="765" font-size="27" fill="#1a2b3d" text-anchor="start">P2 在低门槛领取 B，在高门槛领取 A；不能只筛掉原匹配表中的 P1</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 707" role="img" aria-labelledby="title description">
<title id="title">同一预测在两个IoU门槛下重新领取不同对象</title>
<desc id="description">所有框的纵向范围均为零到十。低门槛时 P1 先领取 A，P2 转而领取 B；提高门槛后 P1 失败，P2 改为领取 A。</desc>
<defs>
<linearGradient id="wash-t" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#eff9f8"/><stop offset="1" stop-color="#c4e3e3"/></linearGradient>
<linearGradient id="wash-c" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#fdf4f1"/><stop offset="1" stop-color="#f1d2c9"/></linearGradient>
<linearGradient id="wash-v" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f8f5fa"/><stop offset="1" stop-color="#e3d9ef"/></linearGradient>
<linearGradient id="wash-g" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f2f8f3"/><stop offset="1" stop-color="#d7eadc"/></linearGradient>
<linearGradient id="wash-n" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f7fafb"/><stop offset="1" stop-color="#e8eef0"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="707" fill="white" stroke="none" stroke-width="1.6" rx="0"/>
<text x="577" y="58" fill="#222d39" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">共同横坐标，四个框的高度相同</text>
<text x="185" y="135" fill="#1a7077" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">A</text>
<rect x="451" y="106" width="310" height="39" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2" rx="3"/>
<text x="436" y="134" fill="#536979" font-size="24" text-anchor="end" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<text x="778" y="134" fill="#536979" font-size="24" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">10</text>
<text x="185" y="197" fill="#1a7077" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">B</text>
<rect x="575" y="168" width="310" height="39" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2" rx="3"/>
<text x="560" y="196" fill="#536979" font-size="24" text-anchor="end" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">4</text>
<text x="902" y="196" fill="#536979" font-size="24" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">14</text>
<text x="185" y="259" fill="#ac4f3e" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">P₁</text>
<rect x="358" y="230" width="310" height="39" fill="url(#wash-c)" stroke="#ac4f3e" stroke-width="2" rx="3"/>
<text x="343" y="258" fill="#536979" font-size="24" text-anchor="end" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">-3</text>
<text x="685" y="258" fill="#536979" font-size="24" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">7</text>
<text x="185" y="321" fill="#ac4f3e" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">P₂</text>
<rect x="482" y="292" width="310" height="39" fill="url(#wash-c)" stroke="#ac4f3e" stroke-width="2" rx="3"/>
<text x="467" y="320" fill="#536979" font-size="24" text-anchor="end" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<text x="809" y="320" fill="#536979" font-size="24" text-anchor="start" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">11</text>
<path d="M58 373 L1133 373" stroke="#dce7eb" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235" y="420" fill="#536979" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">重叠门槛</text>

52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1297" y="285" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1349" y="285" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1401" y="285" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1245" y="337" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1297" y="337" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1349" y="337" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1401" y="337" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1245" y="389" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1297" y="389" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1349" y="389" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1401" y="389" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1245" y="441" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1297" y="441" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1349" y="441" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><rect x="1401" y="441" width="52" height="52" fill="#919191" stroke="#e0e7ed" stroke-width="1"/><text x="1349.00" y="585.00" font-size="32" fill="#087e77" text-anchor="middle" font-weight="bold">全为 0.5</text><text x="1245.00" y="662.00" font-size="25" fill="#62778b" text-anchor="start" font-weight="normal">每个 2×2 的均值</text><text x="635.00" y="755.00" font-size="28" fill="#20334b" text-anchor="start" font-weight="normal">改变起点就翻转整个输出：高频纹理发生混叠。</text><text x="635.00" y="803.00" font-size="28" fill="#20334b" text-anchor="start" font-weight="normal">均值降低相位敏感性，也删掉了棋盘的细纹理。</text><text x="60.00" y="895.00" font-size="27" fill="#62778b" text-anchor="start" font-weight="normal">图中 0.5 是数组的算术均值；这里没有把颜色编码均值解释成真实线性光强。</text></g></svg>

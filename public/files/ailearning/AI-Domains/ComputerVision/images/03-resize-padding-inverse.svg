<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="690" viewBox="26 69 1392 690" role="img" aria-labelledby="title desc"><rect x="26" y="69" width="1392" height="690" fill="#ffffff"/><title id="title">从原图到缩放图再到填充画布，逆变换必须先减填充再除缩放</title><desc id="desc">原图宽200高100，框角点20,10和60,50。缩放0.64得到宽128高64，上下各填32后成为128方图。框在画布中的角点为12.8,38.4和38.4,64。忘记减上方填充会在原图中将框向下错移50像素。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526c7b" stroke-width="2"/></marker></defs><rect width="1450" height="760" fill="white"/><g font-family="Microsoft YaHei,DejaVu Sans,sans-serif"><text x="44" y="110" font-size="27" fill="#526c7b" text-anchor="start">连续边界坐标；宽 × 高；三个面板使用同一绘图单位</text><text x="70" y="180" font-size="28" fill="#17374e" text-anchor="start" font-weight="bold">1  原图：200 × 100</text><rect x="70" y="260" width="500" height="250" fill="#f8fafb" stroke="#91a7b5" stroke-width="2"/><text x="650" y="180" font-size="28" fill="#17374e" text-anchor="start" font-weight="bold">2  缩放：128 × 64</text><rect x="650" y="300" width="320" height="160" fill="#f8fafb" stroke="#91a7b5" stroke-width="2"/><text x="1040" y="180" font-size="28" fill="#17374e" text-anchor="start" font-weight="bold">3  画布：128 × 128</text><rect x="1040" y="220" width="320" height="320" fill="#f8fafb" stroke="#91a7b5" stroke-width="2"/><rect x="1040" y="220" width="320" height="80" fill="#edf0f2" stroke="none" stroke-width="1"/><rect x="1040" y="460" width="320" height="80" fill="#edf0f2" stroke="none" stroke-width="1"/><text x="1200.0" y="267" font-size="24" fill="#526c7b" text-anchor="middle">顶部填充 32</text><text x="1200.0" y="514" font-size="24" fill="#526c7b" text-anchor="middle">底部填充 32</text><line x1="1040" y1="300" x2="1360" y2="300" stroke="#91a7b5" stroke-width="1"/><line x1="1040" y1="460" x2="1360" y2="460" stroke="#91a7b5" stroke-width="1"/><rect x="120.0" y="285.0" width="100.0" height="100.0" fill="#c6dce7" stroke="#246f94" stroke-width="3"/><line x1="132.5" y1="297.5" x2="207.5" y2="372.5" stroke="#246f94" stroke-width="3"/><rect x="682.0" y="316.0" width="64.0" height="64.0" fill="#c6dce7" stroke="#246f94" stroke-width="3"/><line x1="690.0" y1="324.0" x2="738.0" y2="372.0" stroke="#246f94" stroke-width="3"/><rect x="1072.0" y="316.0" width="64.0" height="64.0" fill="#c6dce7" stroke="#246f94" stroke-width="3"/><line x1="1080.0" y1="324.0" x2="1128.0" y2="372.0" stroke="#246f94" stroke-width="3"/><rect x="120" y="410" width="100" height="100" fill="none" stroke="#ce6b32" stroke-width="3" stroke-dasharray="9 7"/><text x="246" y="458" font-size="26" fill="#ce6b32" text-anchor="start">错误回投</text><line x1="590" y1="380" x2="635" y2="380" stroke="#526c7b" stroke-width="2" marker-end="url(#arr)"/><line x1="988" y1="380" x2="1027" y2="380" stroke="#526c7b" stroke-width="2" marker-end="url(#arr)"/><text x="810" y="247" font-size="26" fill="#246f94" text-anchor="middle">坐标乘 0.64</text><text x="1200" y="575" font-size="26" fill="#246f94" text-anchor="middle">纵坐标再加 32</text><text x="70" y="625" font-size="25" fill="#17374e" text-anchor="start">左上 (20,10)</text><text x="70" y="665" font-size="25" fill="#17374e" text-anchor="start">右下 (60,50)</text><text x="650" y="625" font-size="25" fill="#17374e" text-anchor="start">左上 (12.8,6.4)</text><text x="650" y="665" font-size="25" fill="#17374e" text-anchor="start">右下 (38.4,32.0)</text><text x="1040" y="625" font-size="25" fill="#17374e" text-anchor="start">左上 (12.8,38.4)</text><text x="1040" y="665" font-size="25" fill="#17374e" text-anchor="start">右下 (38.4,64.0)</text><line x1="44" y1="688" x2="1400" y2="688" stroke="#dbe6ec" stroke-width="1"/><text x="44" y="736" font-size="28" fill="#17374e" text-anchor="start">回原图：先减填充 (0,32)，再除以 0.64；漏减会把框向下错移 50 个原图像素。</text></g></svg>

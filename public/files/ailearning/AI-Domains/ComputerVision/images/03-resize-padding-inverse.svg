<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
<title id="title">200乘100原图缩放并填充成128方图，以及漏减填充导致的回投错位</title>
<desc id="description">三个面板使用共同的长度尺度。先将坐标乘以 0.64，再向下平移 32。原图橙框展示逆变换漏减填充时错移的五十像素。</desc>
<defs>
<linearGradient id="wash-t" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#eff9f8"/><stop offset="1" stop-color="#c4e3e3"/></linearGradient>
<linearGradient id="wash-c" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#fdf4f1"/><stop offset="1" stop-color="#f1d2c9"/></linearGradient>
<linearGradient id="wash-v" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f8f5fa"/><stop offset="1" stop-color="#e3d9ef"/></linearGradient>
<linearGradient id="wash-g" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f2f8f3"/><stop offset="1" stop-color="#d7eadc"/></linearGradient>
<linearGradient id="wash-n" x1="0%" y1="0%" x2="90%" y2="100%"><stop offset="0" stop-color="#f7fafb"/><stop offset="1" stop-color="#e8eef0"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="550" fill="white" stroke="none" stroke-width="1.6" rx="0"/>
<text x="198.0" y="64" fill="#222d39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原图</text>
<text x="198.0" y="113" fill="#536979" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">200 × 100</text>
<rect x="43" y="155" width="310.0" height="155.0" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2.5" rx="0"/>
<rect x="74.0" y="170.5" width="62.0" height="62.0" fill="none" stroke="#1a7077" stroke-width="4" rx="0"/>
<text x="198.0" y="425" fill="#1a7077" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">(20, 10) → (60, 50)</text>
<rect x="74.0" y="248.0" width="62.0" height="62.0" fill="none" stroke="#ac4f3e" stroke-width="3.5" rx="0" stroke-dasharray="7 5"/>
<path d="M140 279 L178 279" stroke="#ac4f3e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="188" y="289.0" fill="#ac4f3e" font-size="27" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">错移 50</text>
<text x="607.2" y="64" fill="#222d39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">等比缩放</text>
<text x="607.2" y="113" fill="#536979" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">128 × 64</text>
<rect x="508" y="155" width="198.4" height="99.2" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2.5" rx="0"/>
<rect x="527.84" y="164.92000000000002" width="39.68" height="39.68000000000001" fill="none" stroke="#1a7077" stroke-width="4" rx="0"/>
<text x="607.2" y="425" fill="#1a7077" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">(12.8, 6.4) → (38.4, 32)</text>
<text x="1046.2" y="64" fill="#222d39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">上下填充</text>
<text x="1046.2" y="113" fill="#536979" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">128 × 128</text>
<rect x="947" y="155" width="198.4" height="198.4" fill="url(#wash-t)" stroke="#1a7077" stroke-width="2.5" rx="0"/>
<rect x="947" y="155.0" width="198.4" height="49.6" fill="url(#wash-v)" stroke="#655185" stroke-width="1.7" rx="0"/>
<rect x="947" y="303.8" width="198.4" height="49.6" fill="url(#wash-v)" stroke="#655185" stroke-width="1.7" rx="0"/>
<text x="1058" y="187.8" fill="#655185" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">32</text>
<text x="1058" y="336.6" fill="#655185" font-size="24" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">32</text>
<path d="M947 204.6 L1145.4 204.6" stroke="#1a7077" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M947 303.8 L1145.4 303.8" stroke="#1a7077" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="966.84" y="214.51999999999998" width="39.68" height="39.68000000000001" fill="none" stroke="#1a7077" stroke-width="4" rx="0"/>
<text x="1046.2" y="425" fill="#1a7077" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">(12.8, 38.4) → (38.4, 64)</text>
<text x="425" y="232" fill="#1a7077" font-size="24" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">乘 0.64</text>
<path d="M372 248 L470 248" stroke="#1a7077" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M481 248L467 242.2L467 253.8Z" stroke="#1a7077" stroke-width="1" fill="#1a7077" stroke-linecap="round" stroke-linejoin="round"/>
<text x="826" y="232" fill="#655185" font-size="23" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">纵坐标加 32</text>
<path d="M728 248 L903 248" stroke="#655185" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M914 248L900 242.2L900 253.8Z" stroke="#655185" stroke-width="1" fill="#655185" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1039 472 L214 472" stroke="#ac4f3e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M203 472L217 477.8L217 466.2Z" stroke="#ac4f3e" stroke-width="1" fill="#ac4f3e" stroke-linecap="round" stroke-linejoin="round"/>
<text x="601" y="524" fill="#222d39" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">回投先撤销填充，再除以缩放系数</text>
</svg>

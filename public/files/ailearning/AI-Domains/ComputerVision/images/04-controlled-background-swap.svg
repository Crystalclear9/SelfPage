<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" role="img" aria-labelledby="title desc"><title id="title">交叉替换背景，分别检查两类目标</title><desc id="desc">同一扳手的轮廓在两种背景下逐像素复用；改变背景时保持形状、朝向与位置。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient><path id="open" d="M 74 60 C 104 49 122 61 142 83 L 351 83 Q 364 83 364 98 Q 364 113 351 113 L 142 113 C 121 139 101 147 74 137 L 101 111 L 101 85 Z" fill-rule="evenodd" fill="#bccbd0" stroke="#52636d" stroke-width="2"/><path id="ring" d="M 123 77 L 350 77 Q 365 77 365 98 Q 365 119 350 119 L 123 119 C 105 151 49 147 38 106 C 27 64 82 38 110 62 Z M 96 76 L 75 73 L 59 86 L 57 108 L 75 123 L 96 118 L 108 98 Z" fill-rule="evenodd" fill="#bccbd0" stroke="#52636d" stroke-width="2"/><pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="20" height="20" fill="#edf6f5" stroke="none" stroke-width="1.55"/><line x1="0" y1="20" x2="20" y2="0" stroke="#196f77" stroke-width="0.64" stroke-linecap="round"/></pattern><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="20" height="20" fill="#faefeb" stroke="none" stroke-width="1.55"/><circle cx="10" cy="10" r="1.45" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/></pattern></defs><rect x="0" y="0" width="1320" height="640" fill="white" stroke="none" stroke-width="1.55"/><text x="110" y="260" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">开口扳手</text><rect x="223" y="149" width="468" height="182" fill="url(#stripe)" stroke="#c7d5da" stroke-width="1.55"/><use x="277" y="146" href="#open"/><rect x="785" y="149" width="468" height="182" fill="url(#dots)" stroke="#c7d5da" stroke-width="1.55"/><use x="839" y="146" href="#open"/><text x="110" y="489" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">梅花扳手</text><rect x="223" y="378" width="468" height="182" fill="url(#stripe)" stroke="#c7d5da" stroke-width="1.55"/><use x="277" y="375" href="#ring"/><rect x="785" y="378" width="468" height="182" fill="url(#dots)" stroke="#c7d5da" stroke-width="1.55"/><use x="839" y="375" href="#ring"/><text x="456" y="91" fill="#196f77" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">背景 A</text><text x="1019" y="91" fill="#a84b3b" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">背景 B</text><text x="670" y="614" fill="#202a37" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">沿行换背景，沿列换目标类型</text></svg>
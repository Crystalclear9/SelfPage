<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>置信筛选必须同时报告覆盖与条件错误率</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">置信筛选必须同时报告覆盖与条件错误率</text><line x1="130" y1="590" x2="1070" y2="590" stroke="#407e9e" stroke-width="3" /><line x1="130" y1="590" x2="130" y2="160" stroke="#407e9e" stroke-width="3" /><text x="930" y="640" font-size="23" fill="#143651">覆盖率</text><text x="145" y="135" font-size="23" fill="#143651">回答内风险</text><text x="120.0" y="620" font-size="19" fill="#143651">0</text><text x="570.0" y="620" font-size="19" fill="#143651">0.5</text><text x="1020.0" y="620" font-size="19" fill="#143651">1</text><text x="63" y="597.0" font-size="19" fill="#143651">0</text><text x="63" y="397.0" font-size="19" fill="#143651">0.15</text><text x="63" y="197.0" font-size="19" fill="#143651">0.3</text><polyline points="310.0,523.3333333333334 670.0,456.66666666666663 1030.0,323.3333333333333" fill="none" stroke="#15988d" stroke-width="4" /><circle cx="310.0" cy="523.3333333333334" r="10" fill="#15988d" stroke="#12536a" /><circle cx="670.0" cy="456.66666666666663" r="10" fill="#15988d" stroke="#12536a" /><circle cx="1030.0" cy="323.3333333333333" r="10" fill="#15988d" stroke="#12536a" /><text x="240" y="190" font-size="25" fill="#143651">示例：更低风险也可能覆盖更少请求</text><text x="300" y="260" font-size="24" fill="#143651">不能只报告被保留预测的准确率</text></g></svg>

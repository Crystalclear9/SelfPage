<line x1="1214" y1="230" x2="1223" y2="239" stroke="white" stroke-width="3"/>
<line x1="1223" y1="239" x2="1239" y2="221" stroke="white" stroke-width="3"/>
<line x1="74" y1="280" x2="635" y2="280" stroke="#be7028" stroke-width="3"/>

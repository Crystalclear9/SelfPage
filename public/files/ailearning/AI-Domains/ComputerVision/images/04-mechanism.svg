<text x="622.5" y="732" font-size="24" fill="#627982" text-anchor="middle" font-weight="400">0.75</text>
<text x="780" y="732" font-size="24" fill="#627982" text-anchor="middle" font-weight="400">1</text>
<text x="150" y="382" font-size="27" fill="#20343d" text-anchor="start" font-weight="600">接收样本中的错误率</text>
<text x="600" y="776" font-size="27" fill="#627982" text-anchor="start" font-weight="400">覆盖率</text>
<text x="900" y="452" font-size="30" fill="#be7028" text-anchor="start" font-weight="600">保留 4 条</text>
<text x="900" y="501" font-size="29" fill="#be7028" text-anchor="start" font-weight="400">覆盖 50% · 错误 50%</text>
<text x="900" y="594" font-size="30" fill="#147d92" text-anchor="start" font-weight="600">全部 8 条</text>
<text x="900" y="643" font-size="29" fill="#147d92" text-anchor="start" font-weight="400">覆盖 100% · 错误 25%</text>
<text x="56" y="821" font-size="26" fill="#627982" text-anchor="start" font-weight="400">覆盖为零时，条件错误率无定义；连线只帮助追踪阈值变化。</text></g></svg>

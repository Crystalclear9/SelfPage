<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">高置信筛选反而放大错误的八样本反例</title><desc id="desc">分数由高到低为0.99到0.55，前两个预测错误，之后六个正确。只接收前四个时覆盖0.5、条件错误率0.5；全接收时条件错误率0.25。</desc><rect width="1400" height="840" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="56" y="62" font-size="38" fill="#20343d" text-anchor="start" font-weight="600">拒绝低置信预测，不一定会降低条件错误率</text>
<text x="56" y="110" font-size="27" fill="#627982" text-anchor="start" font-weight="400">沿用实验五的 8 条人工预测；橙色叉号是错误，蓝色勾号是正确。</text>
<text x="120" y="182" font-size="28" fill="#627982" text-anchor="middle" font-weight="400">0.99</text>

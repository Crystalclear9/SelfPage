<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">交集为零之后，包围框仍提供距离信息</title>
  <desc id="plate-desc">上排三个等比例矩形比较 d=1、3、4。下排横轴是中心距离，纵轴是损失。d≥2 后 IoU 损失固定为 1，GIoU 损失仍随距离增加。</desc>

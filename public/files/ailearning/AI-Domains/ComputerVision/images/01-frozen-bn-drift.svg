<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="942" viewBox="42 70 1470 942" role="img"><rect x="42" y="70" width="1470" height="942" fill="#ffffff"/><title>冻结BN参数，运行统计仍可使评估表示漂移</title><desc>单通道批次[0,2]，gamma1 beta0被冻结，momentum0.1，初始运行均值0方差1；重复train前向，运行均值1-0.9^k，方差2-0.9^k，评估探针2的输出随之改变。</desc><rect width="1600" height="1010" fill="white"/><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2866b2" stroke-width="1.5"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#cf7c29" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#20334b"><text x="60.00" y="112.00" font-size="28" fill="#62778b" text-anchor="start" font-weight="normal">只看一个 BN 通道：固定批次 [0,2]，γ = 1、β = 0；没有优化器，也不更新参数。</text><text x="95.00" y="210.00" font-size="31" fill="#20334b" text-anchor="start" font-weight="bold">A  train 前向更新缓冲区</text><line x1="110.0" y1="310" x2="110.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="110.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">0</text><line x1="242.5" y1="310" x2="242.5" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="242.50" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">5</text><line x1="375.0" y1="310" x2="375.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="375.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">10</text><line x1="507.5" y1="310" x2="507.5" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="507.50" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">15</text><line x1="640.0" y1="310" x2="640.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="640.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">20</text><line x1="110" y1="740.0" x2="640" y2="740.0" stroke="#dbe5ee" stroke-width="2"/><text x="96.00" y="749.00" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">0</text><line x1="110" y1="544.5454545454545" x2="640" y2="544.5454545454545" stroke="#dbe5ee" stroke-width="2"/><text x="96.00" y="553.55" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">1</text><line x1="110" y1="349.0909090909091" x2="640" y2="349.0909090909091" stroke="#dbe5ee" stroke-width="2"/><text x="96.00" y="358.09" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">2</text><line x1="110" y1="310" x2="110" y2="740" stroke="#62778b" stroke-width="2"/><line x1="110" y1="740" x2="640" y2="740" stroke="#62778b" stroke-width="2"/><text x="110.00" y="284.00" font-size="27" fill="#20334b" text-anchor="start" font-weight="normal">运行统计值</text><text x="640.00" y="825.00" font-size="27" fill="#20334b" text-anchor="end" font-weight="normal">train 前向次数 k</text><polyline points="110.00,740.00 136.50,720.45 163.00,702.86 189.50,687.03 216.00,672.78 242.50,659.96 269.00,648.42 295.50,638.03 322.00,628.68 348.50,620.27 375.00,612.70 401.50,605.88 428.00,599.75 454.50,594.23 481.00,589.26 507.50,584.79 534.00,580.76 560.50,577.14 587.00,573.88 613.50,570.95 640.00,568.31" fill="none" stroke="#2866b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="110.00,544.55 136.50,525.00 163.00,507.41 189.50,491.58 216.00,477.33 242.50,464.50 269.00,452.96 295.50,442.58 322.00,433.23 348.50,424.81 375.00,417.24 401.50,410.43 428.00,404.29 454.50,398.77 481.00,393.80 507.50,389.33 534.00,385.31 560.50,381.69 587.00,378.43 613.50,375.49 640.00,372.85" fill="none" stroke="#cf7c29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110.0" cy="740.0" r="5" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><rect x="105.0" y="539.5454545454545" width="10" height="10" fill="#cf7c29" stroke="#cf7c29" stroke-width="1"/><circle cx="136.5" cy="720.4545454545455" r="5" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><rect x="131.5" y="520.0" width="10" height="10" fill="#cf7c29" stroke="#cf7c29" stroke-width="1"/><circle cx="242.5" cy="659.959409090909" r="5" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><rect x="237.5" y="459.50486363636367" width="10" height="10" fill="#cf7c29" stroke="#cf7c29" stroke-width="1"/><circle cx="640.0" cy="568.3081643063385" r="5" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><rect x="635.0" y="367.85361885179316" width="10" height="10" fill="#cf7c29" stroke="#cf7c29" stroke-width="1"/><text x="660.00" y="382.85" font-size="28" fill="#cf7c29" text-anchor="start" font-weight="normal">方差</text><text x="660.00" y="578.31" font-size="28" fill="#2866b2" text-anchor="start" font-weight="normal">均值</text><text x="95.00" y="887.00" font-size="28" fill="#2866b2" text-anchor="start" font-weight="normal">μ(k) = 1 − 0.9^k</text><text x="95.00" y="942.00" font-size="28" fill="#cf7c29" text-anchor="start" font-weight="normal">v(k) = 2 − 0.9^k</text><text x="925.00" y="210.00" font-size="31" fill="#20334b" text-anchor="start" font-weight="bold">B  同一个探针 x = 2 的 eval 输出</text><line x1="950.0" y1="310" x2="950.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="950.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">0</text><line x1="1082.5" y1="310" x2="1082.5" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="1082.50" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">5</text><line x1="1215.0" y1="310" x2="1215.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="1215.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">10</text><line x1="1347.5" y1="310" x2="1347.5" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="1347.50" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">15</text><line x1="1480.0" y1="310" x2="1480.0" y2="740" stroke="#dbe5ee" stroke-width="2"/><text x="1480.00" y="779.00" font-size="25" fill="#62778b" text-anchor="middle" font-weight="normal">20</text><line x1="950" y1="740.0" x2="1480" y2="740.0" stroke="#dbe5ee" stroke-width="2"/><text x="936.00" y="749.00" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">0</text><line x1="950" y1="544.5454545454545" x2="1480" y2="544.5454545454545" stroke="#dbe5ee" stroke-width="2"/><text x="936.00" y="553.55" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">1</text><line x1="950" y1="349.0909090909091" x2="1480" y2="349.0909090909091" stroke="#dbe5ee" stroke-width="2"/><text x="936.00" y="358.09" font-size="25" fill="#62778b" text-anchor="end" font-weight="normal">2</text><line x1="950" y1="310" x2="950" y2="740" stroke="#62778b" stroke-width="2"/><line x1="950" y1="740" x2="1480" y2="740" stroke="#62778b" stroke-width="2"/><text x="950.00" y="284.00" font-size="27" fill="#20334b" text-anchor="start" font-weight="normal">评估输出</text><text x="1480.00" y="825.00" font-size="27" fill="#20334b" text-anchor="end" font-weight="normal">train 前向次数 k</text><polyline points="950.00,349.09 976.50,385.92 1003.00,415.70 1029.50,440.25 1056.00,460.78 1082.50,478.16 1109.00,493.00 1135.50,505.77 1162.00,516.83 1188.50,526.45 1215.00,534.87 1241.50,542.25 1268.00,548.74 1294.50,554.47 1321.00,559.54 1347.50,564.03 1374.00,568.02 1400.50,571.57 1427.00,574.73 1453.50,577.54 1480.00,580.05" fill="none" stroke="#2866b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="950.00,349.09 1480.00,349.09" fill="none" stroke="#cf7c29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><circle cx="950.0" cy="349.0928636217047" r="6" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><circle cx="976.5" cy="385.9202751707056" r="6" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><circle cx="1082.5" cy="478.15692269774337" r="6" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><circle cx="1480.0" cy="580.0527265856133" r="6" fill="#2866b2" stroke="#2866b2" stroke-width="2.5"/><text x="985.00" y="326.09" font-size="27" fill="#cf7c29" text-anchor="start" font-weight="normal">始终 eval：保持约 2</text><text x="1115.00" y="637.05" font-size="27" fill="#2866b2" text-anchor="start" font-weight="normal">曾以 train 前向：约 0.818</text><text x="925.00" y="887.00" font-size="28" fill="#20334b" text-anchor="start" font-weight="normal">同一权重，同一探针，不同运行统计。</text><text x="925.00" y="942.00" font-size="28" fill="#62778b" text-anchor="start" font-weight="normal">评估模式使用保存的 μ(k)、v(k)。</text><text x="60.00" y="990.00" font-size="27" fill="#62778b" text-anchor="start" font-weight="normal">前向用按 n 归约的方差 1；运行方差用按 n−1 归约的估计值 2 做移动更新。</text></g></svg>

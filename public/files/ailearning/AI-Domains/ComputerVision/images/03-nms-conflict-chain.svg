<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1440.5373" viewBox="0 0 1440 1440.5373" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">NMS 冲突链在分数微扰下保留集合的变化</title><rect width="1440" height="1440.5373" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">NMS 冲突链在分数微扰下保留集合的变化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1298.5373" viewBox="0 0 1440 1391.29" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eef4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>NMS冲突链与排序敏感性</title><svg width="1440" height="941.287" viewBox="26 60 1103 721" role="img" aria-labelledby="title desc">
<rect x="26" y="60" width="1103" height="721" fill="#ffffff"/><title id="title">NMS冲突链与排序敏感性</title><desc id="desc">三框同高且水平区间分别[-1,1]、[0,2]、[1,3]。相邻IoU三分之一，首尾IoU零。阈值0.3时先选B只留B，先选A则留A和C。</desc>
<rect width="1200" height="800" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1f3449">
<text x="44" y="100" font-size="26" fill="#62819a" text-anchor="start" font-weight="400">同一类别，竖直区间均为 [0, 1]；A 分数 0.800，C 分数 0.799</text>
<text x="44" y="163" font-size="28" fill="#1f3449" text-anchor="start" font-weight="700">① 框的水平投影与冲突关系</text>
<text x="61" y="277" font-size="29" fill="#2472b1" text-anchor="start" font-weight="700">A</text>
<rect x="125" y="245" width="210" height="42" rx="5" fill="#e4eef6" stroke="#2472b1"/>
<line x1="125" y1="237" x2="125" y2="293" stroke="#2472b1" stroke-width="2"/>
<line x1="335" y1="237" x2="335" y2="293" stroke="#2472b1" stroke-width="2"/>
<text x="61" y="357" font-size="29" fill="#c57439" text-anchor="start" font-weight="700">B</text>
<rect x="230" y="325" width="210" height="42" rx="5" fill="#f0dccd" stroke="#c57439"/>
<line x1="230" y1="317" x2="230" y2="373" stroke="#c57439" stroke-width="2"/>
<line x1="440" y1="317" x2="440" y2="373" stroke="#c57439" stroke-width="2"/>
<text x="61" y="437" font-size="29" fill="#2472b1" text-anchor="start" font-weight="700">C</text>
<rect x="335" y="405" width="210" height="42" rx="5" fill="#e4eef6" stroke="#2472b1"/>
<line x1="335" y1="397" x2="335" y2="453" stroke="#2472b1" stroke-width="2"/>
<line x1="545" y1="397" x2="545" y2="453" stroke="#2472b1" stroke-width="2"/>
<text x="125" y="485" font-size="24" fill="#62819a" text-anchor="middle" font-weight="400">-1</text>
<text x="230" y="485" font-size="24" fill="#62819a" text-anchor="middle" font-weight="400">0</text>
<text x="335" y="485" font-size="24" fill="#62819a" text-anchor="middle" font-weight="400">1</text>
<text x="440" y="485" font-size="24" fill="#62819a" text-anchor="middle" font-weight="400">2</text>
<text x="545" y="485" font-size="24" fill="#62819a" text-anchor="middle" font-weight="400">3</text>
<text x="70" y="557" font-size="25" fill="#1f3449" text-anchor="start" font-weight="400">相邻 IoU 为三分之一，首尾为 0</text>
<text x="70" y="607" font-size="25" fill="#1f3449" text-anchor="start" font-weight="400">阈值 0.3：A—B、B—C 有冲突</text>
<text x="655" y="163" font-size="28" fill="#1f3449" text-anchor="start" font-weight="700">② 相同框坐标，不同的最高分</text>
<circle cx="715" cy="258" r="36" fill="#2472b1"/>
<text x="715" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">A</text>
<circle cx="895" cy="258" r="36" fill="#c57439"/>
<text x="895" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">B</text>
<circle cx="1075" cy="258" r="36" fill="#2472b1"/>
<text x="1075" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">C</text>
<line x1="754" y1="258" x2="856" y2="258" stroke="#62819a" stroke-width="3"/>
<line x1="934" y1="258" x2="1036" y2="258" stroke="#62819a" stroke-width="3"/>
<text x="655" y="356" font-size="27" fill="#c57439" text-anchor="start" font-weight="700">B = 0.801：先选 B</text>
<rect x="655" y="384" width="470" height="66" rx="10" fill="#fbf2e9" stroke="none"/>
<text x="678" y="426" font-size="26" fill="#c57439" text-anchor="start" font-weight="400">A、C 都被抑制 → 只留 B</text>
<text x="655" y="521" font-size="27" fill="#2472b1" text-anchor="start" font-weight="700">B = 0.7995：先选 A</text>
<rect x="655" y="549" width="470" height="66" rx="10" fill="#eef5fa" stroke="none"/>
<text x="678" y="591" font-size="24" fill="#2472b1" text-anchor="start" font-weight="400">抑制 B；A 与 C 无冲突 → 留 A、C</text>
<rect x="44" y="689" width="1112" height="81" rx="12" fill="url(#book-wash-eef4f9)" stroke="none"/>
<text x="65" y="725" font-size="26" fill="#1f3449" text-anchor="start" font-weight="400">B 的分数只降低 0.0015，保留框就从 1 个变成 2 个；不存在分数平局。</text>
<text x="65" y="759" font-size="26" fill="#1f3449" text-anchor="start" font-weight="400">一条连通冲突链不等于一个等价类；硬 NMS 也不是全局最大总分选择。</text>
</g></svg>
<g id="round-20261105c-teaching" transform="translate(0 941.287) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">Soft-NMS 留住真框后，错误框的排序仍会降低 AP</text><text x="65" y="125" font-size="31" fill="#1d3145" text-anchor="start">按分数：B（误检） → A（真检） → C（真检）</text><rect x="70" y="175" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="216.0" y="214" font-size="28" fill="#1e7499" text-anchor="middle">前 1 框</text><rect x="370" y="175" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="516.0" y="214" font-size="28" fill="#1e7499" text-anchor="middle">前 2 框</text><rect x="670" y="175" width="292" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="816.0" y="214" font-size="28" fill="#1e7499" text-anchor="middle">前 3 框</text><rect x="70" y="245" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="216.0" y="284" font-size="28" fill="#c66d3a" text-anchor="middle">P=0</text><rect x="370" y="245" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="481.43" y="284" font-size="28" fill="#c66d3a">P=</text><text x="534.945" y="267" font-size="26" fill="#c66d3a" text-anchor="middle">1</text><line x1="522.32" y1="275" x2="547.57" y2="275" stroke="#c66d3a" stroke-width="1.6"/><text x="534.945" y="303" font-size="26" fill="#c66d3a" text-anchor="middle">2</text><rect x="670" y="245" width="292" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="781.43" y="284" font-size="28" fill="#c66d3a">P=</text><text x="834.945" y="267" font-size="26" fill="#c66d3a" text-anchor="middle">2</text><line x1="822.32" y1="275" x2="847.57" y2="275" stroke="#c66d3a" stroke-width="1.6"/><text x="834.945" y="303" font-size="26" fill="#c66d3a" text-anchor="middle">3</text><text x="70" y="350" font-size="31" fill="#1d3145">召回：0 → </text><text x="247.016" y="333" font-size="29" fill="#1d3145" text-anchor="middle">1</text><line x1="233.516" y1="341" x2="260.516" y2="341" stroke="#1d3145" stroke-width="1.6"/><text x="247.016" y="369" font-size="29" fill="#1d3145" text-anchor="middle">2</text><text x="263.516" y="350" font-size="31" fill="#1d3145"> → 1；插值精度包络为 </text><text x="604.703" y="333" font-size="29" fill="#1d3145" text-anchor="middle">2</text><line x1="591.203" y1="341" x2="618.203" y2="341" stroke="#1d3145" stroke-width="1.6"/><text x="604.703" y="369" font-size="29" fill="#1d3145" text-anchor="middle">3</text><text x="70" y="420" font-size="31" fill="#1e7499">该排序 AP = </text><text x="270.797" y="403" font-size="29" fill="#1e7499" text-anchor="middle">2</text><line x1="257.297" y1="411" x2="284.297" y2="411" stroke="#1e7499" stroke-width="1.6"/><text x="270.797" y="439" font-size="29" fill="#1e7499" text-anchor="middle">3</text><text x="287.297" y="420" font-size="31" fill="#1e7499">；若 A、C 在 B 前，AP = 1。</text></g></g></svg></svg>

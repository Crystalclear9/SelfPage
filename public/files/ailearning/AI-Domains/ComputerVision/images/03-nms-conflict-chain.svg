<path d="M220 396 L220 408" fill="none" stroke="#526976" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="220" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0</text>
<path d="M314 396 L314 408" fill="none" stroke="#526976" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="314" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">1</text>
<path d="M408 396 L408 408" fill="none" stroke="#526976" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="408" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">2</text>
<path d="M502 396 L502 408" fill="none" stroke="#526976" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="502" y="436" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">3</text>
<text x="645" y="145" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">冲突链 A—B—C，A 与 C 不冲突。</text>
<text x="645" y="207" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">B = 0.801 时，B 先保留，抑制 A 与 C。</text>
<text x="645" y="265" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">B = 0.7995 时，A 先保留，最后留 A、C。</text>
<text x="645" y="331" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">A、C 分数固定为 0.800、0.799。</text>
<text x="645" y="378" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">相邻框 IoU 为三分之一，阈值 0.3。</text>
<path d="M75 464 L1125 464" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="514" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">Soft-NMS 若保留三个框，排序仍决定这道题的 AP。</text>

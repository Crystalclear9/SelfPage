<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1391.29" viewBox="0 0 1440 1391.29" role="img"><title>NMS冲突链与排序敏感性</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="941.287" viewBox="26 60 1103 721" role="img" aria-labelledby="title desc">
<rect x="26" y="60" width="1103" height="721" fill="#ffffff"/><title id="title">NMS冲突链与排序敏感性</title><desc id="desc">三框同高且水平区间分别[-1,1]、[0,2]、[1,3]。相邻IoU三分之一，首尾IoU零。阈值0.3时先选B只留B，先选A则留A和C。</desc>
<rect width="1200" height="800" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="100" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">同一类别，竖直区间均为 [0, 1]；A 分数 0.800，C 分数 0.799</text>
<text x="44" y="163" font-size="28" fill="#213447" text-anchor="start" font-weight="700">① 框的水平投影与冲突关系</text>
<text x="61" y="277" font-size="29" fill="#2865a0" text-anchor="start" font-weight="700">A</text>
<rect x="125" y="245" width="210" height="42" rx="5" fill="#e4eef6" stroke="#2865a0"/>
<line x1="125" y1="237" x2="125" y2="293" stroke="#2865a0" stroke-width="2"/>
<line x1="335" y1="237" x2="335" y2="293" stroke="#2865a0" stroke-width="2"/>
<text x="61" y="357" font-size="29" fill="#c87536" text-anchor="start" font-weight="700">B</text>
<rect x="230" y="325" width="210" height="42" rx="5" fill="#f1ddcc" stroke="#c87536"/>
<line x1="230" y1="317" x2="230" y2="373" stroke="#c87536" stroke-width="2"/>
<line x1="440" y1="317" x2="440" y2="373" stroke="#c87536" stroke-width="2"/>
<text x="61" y="437" font-size="29" fill="#2865a0" text-anchor="start" font-weight="700">C</text>
<rect x="335" y="405" width="210" height="42" rx="5" fill="#e4eef6" stroke="#2865a0"/>
<line x1="335" y1="397" x2="335" y2="453" stroke="#2865a0" stroke-width="2"/>
<line x1="545" y1="397" x2="545" y2="453" stroke="#2865a0" stroke-width="2"/>
<text x="125" y="485" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">-1</text>
<text x="230" y="485" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">0</text>
<text x="335" y="485" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">1</text>
<text x="440" y="485" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">2</text>
<text x="545" y="485" font-size="24" fill="#63788c" text-anchor="middle" font-weight="400">3</text>
<text x="70" y="557" font-size="25" fill="#213447" text-anchor="start" font-weight="400">相邻 IoU 为三分之一，首尾为 0</text>
<text x="70" y="607" font-size="25" fill="#213447" text-anchor="start" font-weight="400">阈值 0.3：A—B、B—C 有冲突</text>
<text x="655" y="163" font-size="28" fill="#213447" text-anchor="start" font-weight="700">② 相同框坐标，不同的最高分</text>
<circle cx="715" cy="258" r="36" fill="#2865a0"/>
<text x="715" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">A</text>
<circle cx="895" cy="258" r="36" fill="#c87536"/>
<text x="895" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">B</text>
<circle cx="1075" cy="258" r="36" fill="#2865a0"/>
<text x="1075" y="269" font-size="29" fill="white" text-anchor="middle" font-weight="700">C</text>
<line x1="754" y1="258" x2="856" y2="258" stroke="#63788c" stroke-width="3"/>
<line x1="934" y1="258" x2="1036" y2="258" stroke="#63788c" stroke-width="3"/>
<text x="655" y="356" font-size="27" fill="#c87536" text-anchor="start" font-weight="700">B = 0.801：先选 B</text>
<rect x="655" y="384" width="470" height="66" rx="10" fill="#fbf2e9" stroke="none"/>
<text x="678" y="426" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">A、C 都被抑制 → 只留 B</text>
<text x="655" y="521" font-size="27" fill="#2865a0" text-anchor="start" font-weight="700">B = 0.7995：先选 A</text>
<rect x="655" y="549" width="470" height="66" rx="10" fill="#eef5fa" stroke="none"/>
<text x="678" y="591" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">抑制 B；A 与 C 无冲突 → 留 A、C</text>
<rect x="44" y="689" width="1112" height="81" rx="12" fill="#eef4f9" stroke="none"/>
<text x="65" y="725" font-size="26" fill="#213447" text-anchor="start" font-weight="400">B 的分数只降低 0.0015，保留框就从 1 个变成 2 个；不存在分数平局。</text>
<text x="65" y="759" font-size="26" fill="#213447" text-anchor="start" font-weight="400">一条连通冲突链不等于一个等价类；硬 NMS 也不是全局最大总分选择。</text>
</g></svg>
<g id="round-20261105c-teaching" transform="translate(0 941.287) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">Soft-NMS 留住真框后，错误框的排序仍会降低 AP</text><text x="65" y="125" font-size="31" fill="#203742" text-anchor="start">按分数：B（误检） → A（真检） → C（真检）</text><rect x="70" y="175" width="292" height="58" fill="#edf5f8" stroke="#216c89"/><text x="216.0" y="214" font-size="28" fill="#216c89" text-anchor="middle">前 1 框</text><rect x="370" y="175" width="292" height="58" fill="#edf5f8" stroke="#216c89"/><text x="516.0" y="214" font-size="28" fill="#216c89" text-anchor="middle">前 2 框</text><rect x="670" y="175" width="292" height="58" fill="#edf5f8" stroke="#216c89"/><text x="816.0" y="214" font-size="28" fill="#216c89" text-anchor="middle">前 3 框</text><rect x="70" y="245" width="292" height="58" fill="#fff1e7" stroke="#c96937"/><text x="216.0" y="284" font-size="28" fill="#c96937" text-anchor="middle">P=0</text><rect x="370" y="245" width="292" height="58" fill="#fff1e7" stroke="#c96937"/><text x="481.43" y="284" font-size="28" fill="#c96937">P=</text><text x="534.945" y="267" font-size="26" fill="#c96937" text-anchor="middle">1</text><line x1="522.32" y1="275" x2="547.57" y2="275" stroke="#c96937" stroke-width="1.6"/><text x="534.945" y="303" font-size="26" fill="#c96937" text-anchor="middle">2</text><rect x="670" y="245" width="292" height="58" fill="#fff1e7" stroke="#c96937"/><text x="781.43" y="284" font-size="28" fill="#c96937">P=</text><text x="834.945" y="267" font-size="26" fill="#c96937" text-anchor="middle">2</text><line x1="822.32" y1="275" x2="847.57" y2="275" stroke="#c96937" stroke-width="1.6"/><text x="834.945" y="303" font-size="26" fill="#c96937" text-anchor="middle">3</text><text x="70" y="350" font-size="31" fill="#203742">召回：0 → </text><text x="247.016" y="333" font-size="29" fill="#203742" text-anchor="middle">1</text><line x1="233.516" y1="341" x2="260.516" y2="341" stroke="#203742" stroke-width="1.6"/><text x="247.016" y="369" font-size="29" fill="#203742" text-anchor="middle">2</text><text x="263.516" y="350" font-size="31" fill="#203742"> → 1；插值精度包络为 </text><text x="604.703" y="333" font-size="29" fill="#203742" text-anchor="middle">2</text><line x1="591.203" y1="341" x2="618.203" y2="341" stroke="#203742" stroke-width="1.6"/><text x="604.703" y="369" font-size="29" fill="#203742" text-anchor="middle">3</text><text x="70" y="420" font-size="31" fill="#216c89">该排序 AP = </text><text x="270.797" y="403" font-size="29" fill="#216c89" text-anchor="middle">2</text><line x1="257.297" y1="411" x2="284.297" y2="411" stroke="#216c89" stroke-width="1.6"/><text x="270.797" y="439" font-size="29" fill="#216c89" text-anchor="middle">3</text><text x="287.297" y="420" font-size="31" fill="#216c89">；若 A、C 在 B 前，AP = 1。</text></g></g></svg>

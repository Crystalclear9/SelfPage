<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="706" viewBox="42 72 1196 706" role="img"><rect x="42" y="72" width="1196" height="706" fill="#ffffff"/><title>类别激活图：同一特征，因类别权重不同而改变</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#19343e" text-anchor="start">两通道、2 × 2 特征；全局平均后接线性分类头；两类偏置都为 0.25</text><text x="105" y="185" font-size="29" fill="#19343e" text-anchor="start">通道 F1</text><rect x="105" y="215" width="87" height="87" fill="#276a80"/><text x="150.0" y="269.0" font-size="30" fill="white" text-anchor="middle">4</text><rect x="195" y="215" width="87" height="87" fill="#eef2f3"/><text x="240.0" y="269.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="105" y="305" width="87" height="87" fill="#eef2f3"/><text x="150.0" y="359.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="195" y="305" width="87" height="87" fill="#eef2f3"/><text x="240.0" y="359.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><text x="105" y="440" font-size="27" fill="#19343e" text-anchor="start">空间均值 = 1</text><text x="405" y="185" font-size="29" fill="#19343e" text-anchor="start">通道 F2</text><rect x="405" y="215" width="87" height="87" fill="#eef2f3"/><text x="450.0" y="269.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="495" y="215" width="87" height="87" fill="#eef2f3"/><text x="540.0" y="269.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="405" y="305" width="87" height="87" fill="#eef2f3"/><text x="450.0" y="359.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="495" y="305" width="87" height="87" fill="#276a80"/><text x="540.0" y="359.0" font-size="30" fill="white" text-anchor="middle">4</text><text x="405" y="440" font-size="27" fill="#19343e" text-anchor="start">空间均值 = 1</text><text x="790" y="185" font-size="29" fill="#19343e" text-anchor="start">线性权重</text><text x="790" y="255" font-size="29" fill="#276a80" text-anchor="start">类 A：(1, −0.5)</text><text x="790" y="330" font-size="29" fill="#c2673f" text-anchor="start">类 B：(−0.5, 1)</text><line x1="60" y1="475" x2="1220" y2="475" stroke="#dbe5e8" stroke-width="2"/><text x="105" y="525" font-size="29" fill="#19343e" text-anchor="start">CAM A</text><rect x="105" y="550" width="67" height="67" fill="#276a80"/><text x="140.0" y="592.0" font-size="30" fill="white" text-anchor="middle">4</text><rect x="175" y="550" width="67" height="67" fill="#eef2f3"/><text x="210.0" y="592.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="105" y="620" width="67" height="67" fill="#eef2f3"/><text x="140.0" y="662.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="175" y="620" width="67" height="67" fill="#c2673f"/><text x="210.0" y="662.0" font-size="30" fill="white" text-anchor="middle">-2</text><text x="405" y="525" font-size="29" fill="#19343e" text-anchor="start">CAM B</text><rect x="405" y="550" width="67" height="67" fill="#c2673f"/><text x="440.0" y="592.0" font-size="30" fill="white" text-anchor="middle">-2</text><rect x="475" y="550" width="67" height="67" fill="#eef2f3"/><text x="510.0" y="592.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="405" y="620" width="67" height="67" fill="#eef2f3"/><text x="440.0" y="662.0" font-size="30" fill="#19343e" text-anchor="middle">0</text><rect x="475" y="620" width="67" height="67" fill="#276a80"/><text x="510.0" y="662.0" font-size="30" fill="white" text-anchor="middle">4</text><text x="790" y="565" font-size="29" fill="#19343e" text-anchor="start">两类 logit 均为 0.75</text><text x="790" y="625" font-size="27" fill="#276a80" text-anchor="start">正值：增加该类分数</text><text x="790" y="680" font-size="27" fill="#c2673f" text-anchor="start">负值：降低该类分数</text><text x="60" y="752" font-size="28" fill="#19343e" text-anchor="start">空间贡献不是像素因果效应；概率还取决于其他类别的 logit</text></g></svg>

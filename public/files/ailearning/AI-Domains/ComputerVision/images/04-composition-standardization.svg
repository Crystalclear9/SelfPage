<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="972.439" viewBox="0 0 1440 972.439" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">组内质量下降与样本组成变化的两步标准化</title><rect width="1440" height="972.439" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">组内质量下降与样本组成变化的两步标准化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="830.439" viewBox="8 72 1230 760" role="img" x="48" y="106" overflow="hidden"><rect x="8" y="72" width="1230" height="760" fill="#ffffff"/><title>总体质量提高，仍可能掩盖小目标退化</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#1a2b3d" text-anchor="start">沿用实验三的实际计数；“常规”表示本例中小目标以外的组</text><text x="70" y="185" font-size="26" fill="#1a2b3d" text-anchor="start">版本</text><text x="260" y="185" font-size="26" fill="#1a2b3d" text-anchor="start">小目标：正确数与总数</text><text x="640" y="185" font-size="26" fill="#1a2b3d" text-anchor="start">常规：正确数与总数</text><text x="1030" y="185" font-size="26" fill="#1a2b3d" text-anchor="start">总体准确率</text><text x="70" y="255" font-size="27" fill="#1a2b3d" text-anchor="start">A</text><text x="260" y="255" font-size="27" fill="#1a2b3d" text-anchor="start">80 对，共 100（80%）</text><text x="640" y="255" font-size="27" fill="#1a2b3d" text-anchor="start">882 对，共 900（98%）</text><text x="1030" y="255" font-size="27" fill="#1a2b3d" text-anchor="start">96.20%</text><text x="70" y="330" font-size="27" fill="#1a2b3d" text-anchor="start">B</text><text x="260" y="330" font-size="27" fill="#1a2b3d" text-anchor="start">6 对，共 10（60%）</text><text x="640" y="330" font-size="27" fill="#1a2b3d" text-anchor="start">980 对，共 990（98.99%）</text><text x="1030" y="330" font-size="27" fill="#1a2b3d" text-anchor="start">98.60%</text><line x1="60" y1="375" x2="1220" y2="375" stroke="#dfe4eb" stroke-width="2"/><line x1="115" y1="710.0" x2="1210" y2="710.0" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="718.0" font-size="25" fill="#1a2b3d" text-anchor="end">93%</text><line x1="115" y1="635.714285714286" x2="1210" y2="635.714285714286" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="643.714285714286" font-size="25" fill="#1a2b3d" text-anchor="end">95%</text><line x1="115" y1="561.4285714285718" x2="1210" y2="561.4285714285718" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="569.4285714285718" font-size="25" fill="#1a2b3d" text-anchor="end">97%</text><line x1="115" y1="487.1428571428574" x2="1210" y2="487.1428571428574" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="495.1428571428574" font-size="25" fill="#1a2b3d" text-anchor="end">99%</text><line x1="115" y1="450.0000000000002" x2="1210" y2="450.0000000000002" stroke="#dfe4eb" stroke-width="2"/><text x="90" y="458.0000000000002" font-size="25" fill="#1a2b3d" text-anchor="end">100%</text><path d="M260.00,591.14 L650.00,632.34 L1050.00,502.00" fill="none" stroke="#769099" stroke-width="4"/><circle cx="260" cy="591.1428571428575" r="9" fill="#257190"/><text x="260" y="568.1428571428575" font-size="29" fill="#1a2b3d" text-anchor="middle">96.200%</text><text x="260" y="760" font-size="27" fill="#1a2b3d" text-anchor="middle">A 原组成</text><circle cx="650" cy="632.3376623380002" r="9" fill="#257190"/><text x="650" y="609.3376623380002" font-size="29" fill="#1a2b3d" text-anchor="middle">95.091%</text><text x="650" y="760" font-size="27" fill="#1a2b3d" text-anchor="middle">B 用 A 组成</text><circle cx="1050" cy="502.0000000000002" r="9" fill="#5c9a91"/><text x="1050" y="479.0000000000002" font-size="29" fill="#1a2b3d" text-anchor="middle">98.600%</text><text x="1050" y="760" font-size="27" fill="#1a2b3d" text-anchor="middle">B 新组成</text><text x="360" y="490" font-size="26" fill="#bf6d42" text-anchor="start">组内变化 −1.1
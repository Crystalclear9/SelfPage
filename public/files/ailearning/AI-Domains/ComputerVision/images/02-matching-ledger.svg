<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img"><title>四个预测怎样领取两个真实对象</title><desc>同一类别，IoU门槛0.5，每图一个真值。P1正确，P2重复，P3正确，P4背景；已匹配对象不能被重复领取。</desc><rect width="1600" height="1160" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1d3048"><text x="60.00" y="65.00" font-size="38" fill="#1d3048" text-anchor="start" font-weight="bold">先决定谁匹配谁，再计算精确率与召回率</text><text x="60.00" y="112.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">同一类别，IoU ≥ 0.5；P1、P2、P3 都是 [0,0,10,10]，P4 是 [20,20,30,30]。</text><text x="85.00" y="180.00" font-size="29" fill="#1d3048" text-anchor="start" font-weight="bold">图甲：G甲，P1 与 P2 完全重合</text><rect x="85.00" y="220.00" width="620.00" height="350.00" rx="12" fill="#f7fafc" stroke="#dce6ef" stroke-width="2"/><rect x="145.00" y="255.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#1d3048" stroke-width="10"/><rect x="145.00" y="255.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#2663c9" stroke-width="6"/><rect x="145.00" y="255.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#d17b24" stroke-width="4" stroke-dasharray="12 10"/><text x="300.00" y="295.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">P1：0.95 → G甲</text><text x="300.00" y="345.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">P2：0.90 → 重复</text><text x="145.00" y="420.00" font-size="25" fill="#61758b" text-anchor="start" font-weight="normal">黑色粗边是真值；重合框未作位移。</text><text x="875.00" y="180.00" font-size="29" fill="#1d3048" text-anchor="start" font-weight="bold">图乙：G乙、P3 与背景框 P4</text><rect x="875.00" y="220.00" width="620.00" height="350.00" rx="12" fill="#f7fafc" stroke="#dce6ef" stroke-width="2"/><rect x="935.00" y="255.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#1d3048" stroke-width="10"/><rect x="935.00" y="255.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#2663c9" stroke-width="6"/><text x="1090.00" y="305.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">P3：0.80 → G乙</text><rect x="1135.00" y="455.00" width="100.00" height="100.00" rx="0" fill="none" stroke="#d17b24" stroke-width="5"/><text x="1255.00" y="515.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">P4：0.70</text><text x="935.00" y="420.00" font-size="25" fill="#61758b" text-anchor="start" font-weight="normal">黑色粗边是真值；重合框未作位移。</text><text x="75.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">顺序</text><text x="195.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">分数</text><text x="360.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">匹配决定</text><text x="750.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">累计 TP / FP</text><text x="1045.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">精确率</text><text x="1245.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">召回率</text><text x="1435.00" y="660.00" font-size="27" fill="#61758b" text-anchor="start" font-weight="normal">剩余真值</text><rect x="55.00" y="699.00" width="1490.00" height="84.00" rx="8" fill="#f6f9fc" stroke="none" stroke-width="2"/><text x="75.00" y="755.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">P1</text><text x="195.00" y="755.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">.95</text><text x="360.00" y="755.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">领取 G甲</text><text x="750.00" y="755.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">1 / 0</text><text x="1065.00" y="727.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">1</text><line x1="1041.00" y1="743.00" x2="1089.00" y2="743.00" stroke="#2663c9" stroke-width="2"/><text x="1065.00" y="777.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">1</text><text x="1265.00" y="727.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">1</text><line x1="1241.00" y1="743.00" x2="1289.00" y2="743.00" stroke="#2663c9" stroke-width="2"/><text x="1265.00" y="777.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">2</text><text x="1435.00" y="755.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">G乙</text><text x="75.00" y="848.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">P2</text><text x="195.00" y="848.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">.90</text><text x="360.00" y="848.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">G甲已被领取：FP</text><text x="750.00" y="848.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">1 / 1</text><text x="1065.00" y="820.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">1</text><line x1="1041.00" y1="836.00" x2="1089.00" y2="836.00" stroke="#d17b24" stroke-width="2"/><text x="1065.00" y="870.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">2</text><text x="1265.00" y="820.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">1</text><line x1="1241.00" y1="836.00" x2="1289.00" y2="836.00" stroke="#d17b24" stroke-width="2"/><text x="1265.00" y="870.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">2</text><text x="1435.00" y="848.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">G乙</text><rect x="55.00" y="885.00" width="1490.00" height="84.00" rx="8" fill="#f6f9fc" stroke="none" stroke-width="2"/><text x="75.00" y="941.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">P3</text><text x="195.00" y="941.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">.80</text><text x="360.00" y="941.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">领取 G乙</text><text x="750.00" y="941.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">2 / 1</text><text x="1065.00" y="913.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">2</text><line x1="1041.00" y1="929.00" x2="1089.00" y2="929.00" stroke="#2663c9" stroke-width="2"/><text x="1065.00" y="963.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">3</text><text x="1265.00" y="913.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">2</text><line x1="1241.00" y1="929.00" x2="1289.00" y2="929.00" stroke="#2663c9" stroke-width="2"/><text x="1265.00" y="963.00" font-size="26" fill="#2663c9" text-anchor="middle" font-weight="normal">2</text><text x="1435.00" y="941.00" font-size="28" fill="#2663c9" text-anchor="start" font-weight="normal">无</text><text x="75.00" y="1034.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">P4</text><text x="195.00" y="1034.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">.70</text><text x="360.00" y="1034.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">未重叠任何真值：FP</text><text x="750.00" y="1034.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">2 / 2</text><text x="1065.00" y="1006.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">2</text><line x1="1041.00" y1="1022.00" x2="1089.00" y2="1022.00" stroke="#d17b24" stroke-width="2"/><text x="1065.00" y="1056.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">4</text><text x="1265.00" y="1006.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">2</text><line x1="1241.00" y1="1022.00" x2="1289.00" y2="1022.00" stroke="#d17b24" stroke-width="2"/><text x="1265.00" y="1056.00" font-size="26" fill="#d17b24" text-anchor="middle" font-weight="normal">2</text><text x="1435.00" y="1034.00" font-size="28" fill="#d17b24" text-anchor="start" font-weight="normal">无</text><text x="60.00" y="1140.00" font-size="28" fill="#61758b" text-anchor="start" font-weight="normal">分母不同：精确率除以当前预测数，召回率始终除以两个有效真值。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img"><title>覆盖增加时，条件风险不必单调</title><rect width="1440" height="1090" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203247">
<text x="44" y="55" font-size="34" fill="#203247" text-anchor="start" font-weight="700">覆盖增加时，条件风险不必单调</text>
<text x="720" y="110" font-size="27" fill="#6b7785" text-anchor="middle">实验四的六个请求，按置信分数从高到低排列</text>
<text x="190" y="175" font-size="27" fill="#203247" text-anchor="middle">q1</text>
<circle cx="190" cy="230" r="22" fill="#2563a6"/>
<text x="190" y="295" font-size="28" fill="#2563a6" text-anchor="middle">0.95</text>
<text x="400" y="175" font-size="27" fill="#203247" text-anchor="middle">q2</text>
<circle cx="400" cy="230" r="22" fill="#2563a6"/>
<text x="400" y="295" font-size="28" fill="#2563a6" text-anchor="middle">0.9</text>
<text x="610" y="175" font-size="27" fill="#203247" text-anchor="middle">q3</text>
<rect x="589.0" y="209.0" width="42" height="42" fill="white" stroke="#d87320" stroke-width="2" rx="0"/>
<line x1="596" y1="216" x2="624" y2="244" stroke="#d87320" stroke-width="3"/>
<line x1="624" y1="216" x2="596" y2="244" stroke="#d87320" stroke-width="3"/>
<text x="610" y="295" font-size="28" fill="#d87320" text-anchor="middle">0.7</text>
<text x="820" y="175" font-size="27" fill="#203247" text-anchor="middle">q4</text>
<circle cx="820" cy="230" r="22" fill="#2563a6"/>
<text x="820" y="295" font-size="28" fill="#2563a6" text-anchor="middle">0.6</text>
<text x="1030" y="175" font-size="27" fill="#203247" text-anchor="middle">q5</text>
<rect x="1009.0" y="209.0" width="42" height="42" fill="white" stroke="#d87320" stroke-width="2" rx="0"/>
<line x1="1016" y1="216" x2="1044" y2="244" stroke="#d87320" stroke-width="3"/>
<line x1="1044" y1="216" x2="1016" y2="244" stroke="#d87320" stroke-width="3"/>
<text x="1030" y="295" font-size="28" fill="#d87320" text-anchor="middle">0.4</text>
<text x="1240" y="175" font-size="27" fill="#203247" text-anchor="middle">q6</text>
<rect x="1219.0" y="209.0" width="42" height="42" fill="white" stroke="#d87320" stroke-width="2" rx="0"/>
<line x1="1226" y1="216" x2="1254" y2="244" stroke="#d87320" stroke-width="3"/>
<line x1="1254" y1="216" x2="1226" y2="244" stroke="#d87320" stroke-width="3"/>
<text x="1240" y="295" font-size="28" fill="#d87320" text-anchor="middle">0.2</text>
<line x1="100" y1="337" x2="490" y2="337" stroke="#2563a6" stroke-width="3"/>
<text x="295" y="383" font-size="27" fill="#2563a6" text-anchor="middle">阈值 0.8：只回答前两题</text>
<text x="1060" y="383" font-size="26" fill="#6b7785" text-anchor="middle">圆：正确；叉方块：错误</text>
<line x1="150.0" y1="495" x2="150.0" y2="885" stroke="#dce4ec" stroke-width="2"/>
<text x="150.0" y="920" font-size="24" fill="#6b7785" text-anchor="middle">0</text>
<line x1="526.6666666666666" y1="495" x2="526.6666666666666" y2="885" stroke="#dce4ec" stroke-width="2"/>
<text x="526.6666666666666" y="920" font-size="24" fill="#6b7785" text-anchor="middle">0.333</text>
<line x1="903.3333333333333" y1="495" x2="903.3333333333333" y2="885" stroke="#dce4ec" stroke-width="2"/>
<text x="903.3333333333333" y="920" font-size="24" fill="#6b7785" text-anchor="middle">0.667</text>
<line x1="1280.0" y1="495" x2="1280.0" y2="885" stroke="#dce4ec" stroke-width="2"/>
<text x="1280.0" y="920" font-size="24" fill="#6b7785" text-anchor="middle">1</text>
<line x1="150" y1="885.0" x2="1280" y2="885.0" stroke="#dce4ec" stroke-width="2"/>
<text x="137" y="893.0" font-size="24" fill="#6b7785" text-anchor="end">0</text>
<line x1="150" y1="707.7272727272727" x2="1280" y2="707.7272727272727" stroke="#dce4ec" stroke-width="2"/>
<text x="137" y="715.7272727272727" font-size="24" fill="#6b7785" text-anchor="end">0.25</text>
<line x1="150" y1="530.4545454545455" x2="1280" y2="530.4545454545455" stroke="#dce4ec" stroke-width="2"/>
<text x="137" y="538.4545454545455" font-size="24" fill="#6b7785" text-anchor="end">0.5</text>
<line x1="150" y1="885" x2="1280" y2="885" stroke="#203247" stroke-width="2"/>
<line x1="150" y1="495" x2="150" y2="885" stroke="#203247" stroke-width="2"/>
<text x="1280" y="957" font-size="26" fill="#203247" text-anchor="end">覆盖率</text>
<text x="150" y="477" font-size="26" fill="#203247" text-anchor="start">回答内错误率</text>
<polyline points="338.333,885.000 526.667,885.000 715.000,648.636 903.333,707.727 1091.667,601.364 1280.000,530.455" fill="none" stroke="#2563a6" stroke-width="4" opacity="1"/>
<circle cx="338.3333333333333" cy="885.0" r="8" fill="#2563a6"/>
<text x="338.3333333333333" y="863.0" font-size="25" fill="#2563a6" text-anchor="middle">k=1</text>
<circle cx="526.6666666666666" cy="885.0" r="8" fill="#2563a6"/>
<text x="526.6666666666666" y="863.0" font-size="25" fill="#2563a6" text-anchor="middle">k=2</text>
<circle cx="715.0" cy="648.6363636363637" r="8" fill="#2563a6"/>
<text x="732.0" y="626.6363636363637" font-size="25" fill="#2563a6" text-anchor="start">k=3</text>
<circle cx="903.3333333333333" cy="707.7272727272727" r="8" fill="#2563a6"/>
<text x="903.3333333333333" y="749.7272727272727" font-size="25" fill="#2563a6" text-anchor="middle">k=4</text>
<circle cx="1091.6666666666667" cy="601.3636363636364" r="8" fill="#2563a6"/>
<text x="1091.6666666666667" y="579.3636363636364" font-size="25" fill="#2563a6" text-anchor="middle">k=5</text>
<circle cx="1280.0" cy="530.4545454545455" r="8" fill="#2563a6"/>
<text x="1280.0" y="508.4545454545455" font-size="25" fill="#2563a6" text-anchor="middle">k=6</text>
<circle cx="526.6666666666666" cy="885.0" r="17" fill="white" stroke="#d87320" stroke-width="4"/>
<text x="568.6666666666666" y="833.0" font-size="27" fill="#d87320" text-anchor="start">覆盖 0.333，风险 0</text>
<text x="720" y="1005" font-size="27" fill="#203247" text-anchor="middle">k 是回答数；从第 3 题到第 4 题，风险由 0.333 降为 0.25。</text>
<text x="720" y="1050" font-size="27" fill="#6b7785" text-anchor="middle">回答数为 0 时风险未定义，图中没有把原点补成零风险。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img"><title>同一输入，三种监督对象与三种解码</title><rect width="1280" height="1050" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">同一输入，三种监督对象与三种解码</text><rect x="290" y="130" width="180" height="65" fill="#edf3f5"/><text x="380" y="177" font-size="38" fill="#276a80" text-anchor="middle">北</text><rect x="480" y="130" width="180" height="65" fill="#edf3f5"/><text x="570" y="177" font-size="38" fill="#276a80" text-anchor="middle">京</text><rect x="670" y="130" width="180" height="65" fill="#edf3f5"/><text x="760" y="177" font-size="38" fill="#276a80" text-anchor="middle">很</text><rect x="860" y="130" width="180" height="65" fill="#edf3f5"/><text x="950" y="177" font-size="38" fill="#276a80" text-anchor="middle">美</text><text x="60" y="175" font-size="29" fill="#19343e" text-anchor="start">输入</text><text x="60" y="265" font-size="30" fill="#19343e" text-anchor="start">分类：整句选一类</text><text x="200" y="325" font-size="27" fill="#19343e" text-anchor="start">正向</text><rect x="290" y="299" width="454.99999999999994" height="30" fill="#276a80"/><text x="765.0" y="325" font-size="27" fill="#276a80" text-anchor="start">0.7</text><text x="200" y="377" font-size="27" fill="#19343e" text-anchor="start">中性</text><rect x="290" y="351" width="130.0" height="30" fill="#74888d"/><text x="440.0" y="377" font-size="27" fill="#74888d" text-anchor="start">0.2</text><text x="200" y="429" font-size="27" fill="#19343e" text-anchor="start">负向</text><rect x="290" y="403" width="65.0" height="30" fill="#c2673f"/><text x="375.0" y="429" font-size="27" fill="#c2673f" text-anchor="start">0.1</text><text x="60" y="505" font-size="30" fill="#19343e" text-anchor="start">标注：每处一个标签，再恢复完整跨度</text><text x="380" y="560" font-size="33" fill="#276a80" text-anchor="middle">北</text><rect x="290" y="580" width="180" height="52" fill="#edf3f5"/><text x="380" y="617" font-size="26" fill="#276a80" text-anchor="middle">B-LOC</text><text x="570" y="560" font-size="33" fill="#276a80" text-anchor="middle">京</text><rect x="480" y="580" width="180" height="52" fill="#edf3f5"/><text x="570" y="617" font-size="26" fill="#276a80" text-anchor="middle">I-LOC</text><text x="760" y="560" font-size="33" fill="#276a80" text-anchor="middle">很</text><rect x="670" y="580" width="180" height="52" fill="#edf3f5"/><text x="760" y="617" font-size="26" fill="#276a80" text-anchor="middle">O</text><text x="950" y="560" font-size="33" fill="#276a80" text-anchor="middle">美</text><rect x="860" y="580" width="180" height="52" fill="#edf3f5"/><text x="950" y="617" font-size="26" fill="#276a80" text-anchor="middle">O</text><line x1="290" y1="650" x2="660" y2="650" stroke="#276a80" stroke-width="3"/><text x="475" y="690" font-size="28" fill="#276a80" text-anchor="middle">LOC [0,2)：北京</text><text x="60" y="770" font-size="30" fill="#19343e" text-anchor="start">生成：给定已生成前缀，逐步选择下一个词</text><text x="370" y="845" font-size="29" fill="#276a80" text-anchor="middle">Beijing</text><text x="370" y="895" font-size="27" fill="#74888d" text-anchor="middle">0.8</text><line x1="460" y1="833" x2="500" y2="833" stroke="#276a80" stroke-width="4"/><path d="M489.47,838.75 L500.00,833.00 L489.47,827.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="590" y="845" font-size="29" fill="#276a80" text-anchor="middle">is</text><text x="590" y="895" font-size="27" fill="#74888d" text-anchor="middle">0.75</text><line x1="680" y1="833" x2="720" y2="833" stroke="#276a80" stroke-width="4"/><path d="M709.47,838.75 L720.00,833.00 L709.47,827.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="810" y="845" font-size="29" fill="#276a80" text-anchor="middle">beautiful</text><text x="810" y="895" font-size="27" fill="#74888d" text-anchor="middle">0.5</text><line x1="900" y1="833" x2="940" y2="833" stroke="#276a80" stroke-width="4"/><path d="M929.47,838.75 L940.00,833.00 L929.47,827.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="1030" y="845" font-size="29" fill="#276a80" text-anchor="middle">EOS</text><text x="1030" y="895" font-size="27" fill="#74888d" text-anchor="middle">0.9</text><text x="60" y="980" font-size="27" fill="#19343e" text-anchor="start">该完整路径的条件概率乘积：0.8 × 0.75 × 0.5 × 0.9 = 0.27</text></g></svg>

<text x="552" y="133" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="34">B</text>
<text x="552" y="189" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="32">a, b, c</text>
<path d="M818 214l35 -70h150l-35 70Z" fill="url(#wash-t)" stroke="#176f76" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="902" y="133" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="34">C</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title description">
<title id="title">三个词集合相邻相似却端点不相似的连通分量反例</title>
<desc id="description">实线连接 A 与 B、B 与 C，两边相似度均为三分之二。端点相似度仅三分之一，虚线不计为连边。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#eef8f8"/><stop offset="1" stop-color="#c9e6e7"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#fdf2ef"/><stop offset="1" stop-color="#f3d5cd"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f7f4fb"/><stop offset="1" stop-color="#e4dbee"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f8fafb"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="370" rx="0" fill="white" stroke="none" stroke-width="1.6"/>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="884.4564" viewBox="0 0 1440 884.4564" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三个词集合相邻相似却端点不相似的连通分量反例</title><rect width="1440" height="884.4564" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">三个词集合相邻相似却端点不相似的连通分量反例</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="742.4564" viewBox="42 75 1135 627" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="75" width="1135" height="627" fill="#ffffff"/><title>相似关系不传递：同组件不意味着任意两篇都近似</title><rect width="1280" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#1a2b3d" text-anchor="start">沿用实验一集合：A = {a, b}，B = {a, b, c}，C = {b, c}；阈值 0.6。</text><line x1="160" y1="340" x2="640" y2="215" stroke="#257190" stroke-width="6"/><line x1="640" y1="215" x2="1120" y2="340" stroke="#257190" stroke-width="6"/><circle cx="160" cy="340" r="39" fill="#257190"/><text x="160" y="352" font-size="34" fill="white" text-anchor="middle">A</text><circle cx="640" cy="215" r="39" fill="#257190"/><text x="640" y="227" font-size="34" fill="white" text-anchor="middle">B</text><circle cx="1120" cy="340" r="39" fill="#257190"/><text x="1120" y="352" font-size="34" fill="white" text-anchor="middle">C</text><line x1="200" y1="390" x2="1080" y2="390" stroke="#bf6d42" stroke-width="3" stroke-dasharray="10 10"/><text x="60" y="550" font-size="28" fill="#1a2b3d" text-anchor="start">两条蓝边已经连通 A、B、C；分组时三者仍属于同一个组件。</text><text x="60" y="615" font-size="28" fill="#1a2b3d" text-anchor="start">它约束的是跨集合隔离，不是把三篇视作同一事实并删掉两篇。</text><text x="60" y="680" font-size="26" fill="#1a2b3d" text-anchor="start">连接原因、组件大小和来源身份仍需保留，避免模板链无限扩张。</text><text x="300" y="205" font-size="27" fill="#257190" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(A, B) =</text><text x="465" y="189" font-size="27" fill="#257190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">2</text><line x1="451.0" x2="479.0" y1="199" y2="199" stroke="#257190" stroke-width="2"/><text x="465" y="229" font-size="27" fill="#257190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="790" y="205" font-size="27" fill="#257190" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(B, C) =</text><text x="955" y="189" font-size="27" fill="#257190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">2</text><line x1="941.0" x2="969.0" y1="199" y2="199" stroke="#257190" stroke-width="2"/><text x="955" y="229" font-size="27" fill="#257190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="335" y="450" font-size="28" fill="#bf6d42" text-anchor="start" font-family="Microsoft YaHei, sans-serif">J(A, C) =</text><text x="505" y="433" font-size="28" fill="#bf6d42" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">1</text><line x1="490.0" x2="520.0" y1="443" y2="443" stroke="#bf6d42" stroke-width="2"/><text x="505" y="473" font-size="28" fill="#bf6d42" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3</text><text x="545" y="450" font-size="28" fill="#bf6d42" text-anchor="start" font-family="Microsoft YaHei, sans-serif">&lt; 0.6：没有相似边</text></g></svg></svg>

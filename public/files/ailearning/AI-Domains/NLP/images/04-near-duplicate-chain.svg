<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><ns0:title>相似关系不传递：同组件不意味着任意两篇都近似</ns0:title><ns0:rect width="1280" height="720" fill="white" /><ns0:g font-family="Microsoft YaHei, sans-serif"><ns0:text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">相似关系不传递：同组件不意味着任意两篇都近似</ns0:text><ns0:text x="60" y="115" font-size="26" fill="#19343e" text-anchor="start">沿用实验一集合：A = {a, b}，B = {a, b, c}，C = {b, c}；阈值 0.6。</ns0:text><ns0:line x1="160" y1="340" x2="640" y2="215" stroke="#276a80" stroke-width="6" /><ns0:line x1="640" y1="215" x2="1120" y2="340" stroke="#276a80" stroke-width="6" /><ns0:circle cx="160" cy="340" r="39" fill="#276a80" /><ns0:text x="160" y="352" font-size="34" fill="white" text-anchor="middle">A</ns0:text><ns0:circle cx="640" cy="215" r="39" fill="#276a80" /><ns0:text x="640" y="227" font-size="34" fill="white" text-anchor="middle">B</ns0:text><ns0:circle cx="1120" cy="340" r="39" fill="#276a80" /><ns0:text x="1120" y="352" font-size="34" fill="white" text-anchor="middle">C</ns0:text><ns0:text x="300" y="235" font-size="27" fill="#276a80" text-anchor="start">J(A, B) = 2 ÷ 3</ns0:text><ns0:text x="790" y="235" font-size="27" fill="#276a80" text-anchor="start">J(B, C) = 2 ÷ 3</ns0:text><ns0:line x1="200" y1="390" x2="1080" y2="390" stroke="#c2673f" stroke-width="3" stroke-dasharray="10 10" /><ns0:text x="640" y="450" font-size="28" fill="#c2673f" text-anchor="middle">J(A, C) = 1 ÷ 3 &lt; 0.6：没有相似边</ns0:text><ns0:text x="60" y="550" font-size="28" fill="#19343e" text-anchor="start">两条蓝边已经连通 A、B、C；分组时三者仍属于同一个组件。</ns0:text><ns0:text x="60" y="615" font-size="28" fill="#19343e" text-anchor="start">它约束的是跨集合隔离，不是把三篇视作同一事实并删掉两篇。</ns0:text><ns0:text x="60" y="680" font-size="26" fill="#19343e" text-anchor="start">连接原因、组件大小和来源身份仍需保留，避免模板链无限扩张。</ns0:text></ns0:g></ns0:svg>
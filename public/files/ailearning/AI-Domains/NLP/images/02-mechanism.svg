<text x="850" y="212" font-size="30" fill="#2867ac" text-anchor="start" font-weight="400">只计一次“甲”</text>
<text x="850" y="280" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">一元精确率 =</text>
<text x="1120" y="274" font-size="29" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="1107" y1="281" x2="1133" y2="281" stroke="#20343d" stroke-width="1.5"/>

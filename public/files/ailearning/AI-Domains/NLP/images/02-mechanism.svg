<text x="45" y="522" font-size="30" fill="#20343d" text-anchor="start" font-weight="700">二元词对</text>
<rect x="280" y="490" width="170" height="65" fill="#f8ecde" stroke="none" stroke-width="2"/>
<text x="365" y="532" font-size="30" fill="#cc7d28" text-anchor="middle" font-weight="400">甲甲</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>词面重复需要按参考次数裁剪计数</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">词面重复需要按参考次数裁剪计数</text><rect x="170" y="180" width="150" height="90" rx="8" fill="#d8ede4" stroke="#82a2b7" /><text x="215" y="237" font-size="35" fill="#143651">猫</text><rect x="470" y="180" width="150" height="90" rx="8" fill="#d8ede4" stroke="#82a2b7" /><text x="515" y="237" font-size="35" fill="#143651">猫</text><rect x="770" y="180" width="150" height="90" rx="8" fill="#d8ede4" stroke="#82a2b7" /><text x="815" y="237" font-size="35" fill="#143651">猫</text><rect x="470" y="460" width="150" height="90" rx="8" fill="#d9e9f6" stroke="#82a2b7" /><text x="515" y="517" font-size="35" fill="#143651">猫</text><line x1="245" y1="275" x2="545" y2="450" stroke="#15988d" stroke-width="4" marker-end="url(#arr)" /><line x1="545" y1="275" x2="545" y2="450" stroke="#cfb398" stroke-width="2" /><text x="565" y="335" font-size="34" fill="#aa642b">×</text><line x1="845" y1="275" x2="545" y2="450" stroke="#cfb398" stroke-width="2" /><text x="865" y="335" font-size="34" fill="#aa642b">×</text><text x="110" y="140" font-size="27" fill="#143651">候选：同一个词出现三次</text><text x="700" y="520" font-size="26" fill="#143651">参考只出现一次</text><text x="160" y="650" font-size="24" fill="#143651">该词被裁剪的匹配计数最多为一，不允许重复复用参考次数。</text></g></svg>

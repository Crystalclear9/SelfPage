<text x="850" y="610" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">二元精确率 =</text>
<text x="1120" y="604" font-size="29" fill="#20343d" text-anchor="middle" font-weight="400">0</text>
<line x1="1107" y1="611" x2="1133" y2="611" stroke="#20343d" stroke-width="1.5"/>

<text x="45" y="772" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">长度相同：BP = 1</text>
<text x="600" y="772" font-size="31" fill="#cc7d28" text-anchor="start" font-weight="700">未做平滑：BLEU-2 = 0</text>
<text x="45" y="821" font-size="27" fill="#657c88" text-anchor="start" font-weight="400">一元词都“见过”，不代表重复、顺序与内容都正确。</text></g></svg>

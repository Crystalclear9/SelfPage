<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1276" height="777" viewBox="22 66 1276 777" role="img" aria-labelledby="title desc"><rect x="22" y="66" width="1276" height="777" fill="#ffffff"/><title id="title">重复匹配需要裁剪，二元搭配也必须匹配</title><desc id="desc">候选甲甲甲，参考甲乙丙。一元匹配为一除三，二元匹配为零除二；等长所以长度惩罚一，不平滑 BLEU-2 为零。</desc><rect width="1320" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="45" y="108" font-size="28" fill="#657c88" text-anchor="start" font-weight="400">同一组文本，同时检查单词与相邻词对</text>
<text x="50" y="216" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">候选</text>
<rect x="240" y="170" width="130" height="75" fill="#e9f1f8" stroke="none" stroke-width="2"/>

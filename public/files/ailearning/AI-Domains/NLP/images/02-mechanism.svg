<rect x="440" y="335" width="130" height="75" fill="#e9f1f8" stroke="none" stroke-width="2"/>
<text x="505" y="386" font-size="36" fill="#20343d" text-anchor="middle" font-weight="400">乙</text>
<rect x="640" y="335" width="130" height="75" fill="#e9f1f8" stroke="none" stroke-width="2"/>
<text x="705" y="386" font-size="36" fill="#20343d" text-anchor="middle" font-weight="400">丙</text>
<line x1="305" y1="245" x2="305" y2="329" stroke="#2867ac" stroke-width="5"/>

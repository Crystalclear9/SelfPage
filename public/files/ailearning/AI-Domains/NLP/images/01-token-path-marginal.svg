<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1339.04" viewBox="0 0 1440 1339.04" role="img"><title>规范分词与解码文本概率</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="889.043" viewBox="25 60 1150 710" role="img" aria-labelledby="title desc">
<rect x="25" y="60" width="1150" height="710" fill="#ffffff"/><title id="title">规范分词与解码文本概率</title><desc id="desc">四条完整token路径总概率一，其中aa和a,a都解码为aa，合计0.5；规范路径概率0.3。ab路径0.4，b路径0.1。</desc>
<rect width="1200" height="780" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#213447">
<text x="44" y="100" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">以下四条完整路径合计概率 1；EOS 结束生成，不追加到显示文本</text>
<text x="44" y="165" font-size="28" fill="#213447" text-anchor="start" font-weight="700">① 完整 token 序列</text>
<text x="590" y="165" font-size="28" fill="#213447" text-anchor="start" font-weight="700">② 解码并汇总</text>
<rect x="44" y="193" width="345" height="78" rx="12" fill="#f3f6f9" stroke="#dce5ed"/>
<text x="66" y="241" font-size="28" fill="#2865a0" text-anchor="start" font-weight="700">[aa, EOS]</text>
<text x="363" y="241" font-size="28" fill="#2865a0" text-anchor="end" font-weight="400">0.3</text>
<line x1="401" y1="232" x2="568" y2="272" stroke="#2865a0" stroke-width="3"/>
<path d="M 568 272 L 555 265 L 555 279 Z" fill="#2865a0"/>
<rect x="44" y="301" width="345" height="78" rx="12" fill="#f3f6f9" stroke="#dce5ed"/>
<text x="66" y="349" font-size="28" fill="#c87536" text-anchor="start" font-weight="700">[a, a, EOS]</text>
<text x="363" y="349" font-size="28" fill="#c87536" text-anchor="end" font-weight="400">0.2</text>
<line x1="401" y1="340" x2="568" y2="272" stroke="#c87536" stroke-width="3"/>
<path d="M 568 272 L 555 265 L 555 279 Z" fill="#c87536"/>
<rect x="44" y="409" width="345" height="78" rx="12" fill="#f3f6f9" stroke="#dce5ed"/>
<text x="66" y="457" font-size="28" fill="#2865a0" text-anchor="start" font-weight="700">[ab, EOS]</text>
<text x="363" y="457" font-size="28" fill="#2865a0" text-anchor="end" font-weight="400">0.4</text>
<line x1="401" y1="448" x2="568" y2="448" stroke="#2865a0" stroke-width="3"/>
<path d="M 568 448 L 555 441 L 555 455 Z" fill="#2865a0"/>
<rect x="44" y="517" width="345" height="78" rx="12" fill="#f3f6f9" stroke="#dce5ed"/>
<text x="66" y="565" font-size="28" fill="#2865a0" text-anchor="start" font-weight="700">[b, EOS]</text>
<text x="363" y="565" font-size="28" fill="#2865a0" text-anchor="end" font-weight="400">0.1</text>
<line x1="401" y1="556" x2="568" y2="556" stroke="#2865a0" stroke-width="3"/>
<path d="M 568 556 L 555 549 L 555 563 Z" fill="#2865a0"/>
<rect x="590" y="233" width="183" height="78" rx="12" fill="#eaf2f9" stroke="none"/>
<text x="680" y="282" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">aa：0.5</text>
<rect x="590" y="409" width="183" height="78" rx="12" fill="#eaf2f9" stroke="none"/>
<text x="680" y="458" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">ab：0.4</text>
<rect x="590" y="517" width="183" height="78" rx="12" fill="#eaf2f9" stroke="none"/>
<text x="680" y="566" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="700">b：0.1</text>
<text x="832" y="165" font-size="28" fill="#213447" text-anchor="start" font-weight="700">③ 两种评分</text>
<text x="832" y="224" font-size="24" fill="#63788c" text-anchor="start" font-weight="400">文本</text>
<text x="915" y="224" font-size="24" fill="#63788c" text-anchor="start" font-weight="400">规范</text>
<text x="1050" y="224" font-size="24" fill="#63788c" text-anchor="start" font-weight="400">边缘</text>
<text x="832" y="292" font-size="27" fill="#213447" text-anchor="start" font-weight="400">aa</text>
<text x="940" y="292" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">0.3</text>
<text x="1080" y="292" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0.5</text>
<line x1="825" y1="318" x2="1130" y2="318" stroke="#dce5ed" stroke-width="2"/>
<text x="832" y="387" font-size="27" fill="#213447" text-anchor="start" font-weight="400">ab</text>
<text x="940" y="387" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">0.4</text>
<text x="1080" y="387" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0.4</text>
<line x1="825" y1="413" x2="1130" y2="413" stroke="#dce5ed" stroke-width="2"/>
<text x="832" y="482" font-size="27" fill="#213447" text-anchor="start" font-weight="400">b</text>
<text x="940" y="482" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">0.1</text>
<text x="1080" y="482" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0.1</text>
<line x1="825" y1="508" x2="1130" y2="508" stroke="#dce5ed" stroke-width="2"/>
<text x="832" y="601" font-size="26" fill="#213447" text-anchor="start" font-weight="700">最高分：ab → aa</text>
<text x="44" y="653" font-size="26" fill="#63788c" text-anchor="start" font-weight="400">蓝：编码器选用的规范路径　橙：可解码为同文的非规范路径</text>
<rect x="44" y="692" width="1112" height="57" rx="12" fill="#eef4f9" stroke="none"/>
<text x="65" y="729" font-size="27" fill="#213447" text-anchor="start" font-weight="400">只计算规范路径时总质量是 0.8；按解码文本求和时总质量仍是 1。</text>
</g></svg>
<g id="round-20261105c-teaching" transform="translate(0 889.043) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">单一路径似然是文本似然的下界：差值来自路径后验</text><text x="70" y="130" font-size="32" fill="#203742" text-anchor="start">文本 aa：两条路径质量 0.3 + 0.2 = 0.5</text><rect x="70" y="190" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="266.0" y="229" font-size="28" fill="#216c89" text-anchor="middle">规范路径 NLL</text><rect x="470" y="190" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="666.0" y="229" font-size="28" fill="#216c89" text-anchor="middle">文本 NLL</text><rect x="870" y="190" width="392" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1066.0" y="229" font-size="28" fill="#216c89" text-anchor="middle">差值</text><rect x="70" y="265" width="392" height="58" fill="#fff1e7" stroke="#c96937"/><text x="266.0" y="304" font-size="28" fill="#c96937" text-anchor="middle">−log .3 = 1.203973</text><rect x="470" y="265" width="392" height="58" fill="#fff1e7" stroke="#c96937"/><text x="666.0" y="304" font-size="28" fill="#c96937" text-anchor="middle">−log .5 = .693147</text><rect x="870" y="265" width="392" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1066.0" y="304" font-size="28" fill="#c96937" text-anchor="middle">.510826</text><text x="70" y="380" font-size="30" fill="#203742">给定文本 aa，规范路径的后验质量为 </text><text x="598.695" y="363" font-size="28" fill="#203742" text-anchor="middle">0.3</text><line x1="573.906" y1="371" x2="623.484" y2="371" stroke="#203742" stroke-width="1.6"/><text x="598.695" y="399" font-size="28" fill="#203742" text-anchor="middle">0.5</text><text x="626.484" y="380" font-size="30" fill="#203742"> = 0.6。</text><text x="70" y="435" font-size="29" fill="#203742" text-anchor="start">NLL 差值 = −log 0.6；不是另一份语言模型额外出错。</text></g></g></svg>

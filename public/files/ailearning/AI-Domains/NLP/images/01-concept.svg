<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="764" viewBox="42 79 1196 764" role="img"><rect x="42" y="79" width="1196" height="764" fill="#ffffff"/><title>同一实体：字符、UTF-8 字节与 token 是三套坐标</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="27" fill="#74888d" text-anchor="start">指定切分：北京 | 大学；所有区间均为左闭右开。</text><text x="60" y="223" font-size="29" fill="#19343e" text-anchor="start">字符</text><text x="60" y="407" font-size="29" fill="#19343e" text-anchor="start">字节</text><text x="60" y="607" font-size="29" fill="#19343e" text-anchor="start">token</text><rect x="230" y="175" width="214" height="70" fill="#edf3f5"/><text x="337" y="222" font-size="38" fill="#276a80" text-anchor="middle">北</text><text x="230" y="280" font-size="25" fill="#74888d" text-anchor="middle">0</text><rect x="230.0" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="263.6666666666667" y="395" font-size="24" fill="#276a80" text-anchor="middle">0</text><rect x="303.3333333333333" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="337.0" y="395" font-size="24" fill="#276a80" text-anchor="middle">1</text><rect x="376.66666666666663" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="410.3333333333333" y="395" font-size="24" fill="#276a80" text-anchor="middle">2</text><line x1="337" y1="298" x2="337" y2="339" stroke="#276a80" stroke-width="4"/><path d="M331.25,328.47 L337.00,339.00 L342.75,328.47" fill="none" stroke="#276a80" stroke-width="4"/><rect x="450" y="175" width="214" height="70" fill="#edf3f5"/><text x="557" y="222" font-size="38" fill="#276a80" text-anchor="middle">京</text><text x="450" y="280" font-size="25" fill="#74888d" text-anchor="middle">1</text><rect x="450.0" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="483.6666666666667" y="395" font-size="24" fill="#276a80" text-anchor="middle">3</text><rect x="523.3333333333334" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="557.0" y="395" font-size="24" fill="#276a80" text-anchor="middle">4</text><rect x="596.6666666666666" y="354" width="67.33333333333333" height="64" fill="#edf3f5"/><text x="630.3333333333333" y="395" font-size="24" fill="#276a80" text-anchor="middle">5</text><line x1="557" y1="298" x2="557" y2="339" stroke="#276a80" stroke-width="4"/><path d="M551.25,328.47 L557.00,339.00 L562.75,328.47" fill="none" stroke="#276a80" stroke-width="4"/><rect x="670" y="175" width="214" height="70" fill="#fbefe8"/><text x="777" y="222" font-size="38" fill="#c2673f" text-anchor="middle">大</text><text x="670" y="280" font-size="25" fill="#74888d" text-anchor="middle">2</text><rect x="670.0" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="703.6666666666666" y="395" font-size="24" fill="#c2673f" text-anchor="middle">6</text><rect x="743.3333333333334" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="777.0" y="395" font-size="24" fill="#c2673f" text-anchor="middle">7</text><rect x="816.6666666666666" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="850.3333333333333" y="395" font-size="24" fill="#c2673f" text-anchor="middle">8</text><line x1="777" y1="298" x2="777" y2="339" stroke="#c2673f" stroke-width="4"/><path d="M771.25,328.47 L777.00,339.00 L782.75,328.47" fill="none" stroke="#c2673f" stroke-width="4"/><rect x="890" y="175" width="214" height="70" fill="#fbefe8"/><text x="997" y="222" font-size="38" fill="#c2673f" text-anchor="middle">学</text><text x="890" y="280" font-size="25" fill="#74888d" text-anchor="middle">3</text><rect x="890.0" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="923.6666666666666" y="395" font-size="24" fill="#c2673f" text-anchor="middle">9</text><rect x="963.3333333333334" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="997.0" y="395" font-size="24" fill="#c2673f" text-anchor="middle">10</text><rect x="1036.6666666666667" y="354" width="67.33333333333333" height="64" fill="#fbefe8"/><text x="1070.3333333333335" y="395" font-size="24" fill="#c2673f" text-anchor="middle">11</text><line x1="997" y1="298" x2="997" y2="339" stroke="#c2673f" stroke-width="4"/><path d="M991.25,328.47 L997.00,339.00 L1002.75,328.47" fill="none" stroke="#c2673f" stroke-width="4"/><text x="1110" y="280" font-size="25" fill="#74888d" text-anchor="middle">4</text><rect x="230" y="555" width="434" height="72" fill="#edf3f5"/><text x="450" y="602" font-size="38" fill="#276a80" text-anchor="middle">北京</text><text x="450" y="675" font-size="27" fill="#276a80" text-anchor="middle">token 0 → 字符 [0,2)</text><line x1="337" y1="440" x2="450" y2="540" stroke="#276a80" stroke-width="4"/><path d="M438.30,537.33 L450.00,540.00 L445.93,528.71" fill="none" stroke="#276a80" stroke-width="4"/><line x1="557" y1="440" x2="450" y2="540" stroke="#276a80" stroke-width="4"/><path d="M453.77,528.61 L450.00,540.00 L461.62,537.01" fill="none" stroke="#276a80" stroke-width="4"/><rect x="670" y="555" width="434" height="72" fill="#fbefe8"/><text x="890" y="602" font-size="38" fill="#c2673f" text-anchor="middle">大学</text><text x="890" y="675" font-size="27" fill="#c2673f" text-anchor="middle">token 1 → 字符 [2,4)</text><line x1="777" y1="440" x2="890" y2="540" stroke="#c2673f" stroke-width="4"/><path d="M878.30,537.33 L890.00,540.00 L885.93,528.71" fill="none" stroke="#c2673f" stroke-width="4"/><line x1="997" y1="440" x2="890" y2="540" stroke="#c2673f" stroke-width="4"/><path d="M893.77,528.61 L890.00,540.00 L901.62,537.01" fill="none" stroke="#c2673f" stroke-width="4"/><line x1="60" y1="715" x2="1220" y2="715" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="765" font-size="30" fill="#c2673f" text-anchor="start">大学：字符 [2,4)  →  字节 [6,12)  →  token [1,2)</text><text x="60" y="820" font-size="27" fill="#19343e" text-anchor="start">字节 [2,4) 会切开汉字；不能把字符偏移直接交给字节切片。</text></g></svg>

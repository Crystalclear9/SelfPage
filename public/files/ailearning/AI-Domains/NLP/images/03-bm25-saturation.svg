<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>BM25 的词频增益递减，不能由词项重复无限加分</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">BM25 的词频增益递减，不能由词项重复无限加分</text><text x="60" y="115" font-size="25" fill="#19343e" text-anchor="start">固定文档长 = 平均文档长 = 12，k1 = 1.2；只画除去 IDF 后的词频因子。</text><line x1="120" y1="565.0" x2="1110" y2="565.0" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="573.0" font-size="24" fill="#74888d" text-anchor="end">0</text><line x1="120" y1="503.3333333333333" x2="1110" y2="503.3333333333333" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="511.3333333333333" font-size="24" fill="#74888d" text-anchor="end">2</text><line x1="120" y1="441.6666666666667" x2="1110" y2="441.6666666666667" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="449.6666666666667" font-size="24" fill="#74888d" text-anchor="end">4</text><line x1="120" y1="380.0" x2="1110" y2="380.0" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="388.0" font-size="24" fill="#74888d" text-anchor="end">6</text><line x1="120" y1="318.33333333333337" x2="1110" y2="318.33333333333337" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="326.33333333333337" font-size="24" fill="#74888d" text-anchor="end">8</text><line x1="120" y1="256.66666666666663" x2="1110" y2="256.66666666666663" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="264.66666666666663" font-size="24" fill="#74888d" text-anchor="end">10</text><line x1="120" y1="195.0" x2="1110" y2="195.0" stroke="#dbe5e8" stroke-width="2"/><text x="100" y="203.0" font-size="24" fill="#74888d" text-anchor="end">12</text><path d="M120.00,534.17 L206.36,503.33 L292.73,472.50 L379.09,441.67 L465.45,410.83 L551.82,380.00 L638.18,349.17 L724.55,318.33 L810.91,287.50 L897.27,256.67 L983.64,225.83 L1070.00,195.00" fill="none" stroke="#74888d" stroke-width="4"/><circle cx="120.0" cy="534.1666666666666" r="4" fill="#74888d"/><circle cx="206.36363636363637" cy="503.3333333333333" r="4" fill="#74888d"/><circle cx="292.72727272727275" cy="472.5" r="4" fill="#74888d"/><circle cx="379.09090909090907" cy="441.6666666666667" r="4" fill="#74888d"/><circle cx="465.45454545454544" cy="410.8333333333333" r="4" fill="#74888d"/><circle cx="551.8181818181818" cy="380.0" r="4" fill="#74888d"/><circle cx="638.1818181818181" cy="349.16666666666663" r="4" fill="#74888d"/><circle cx="724.5454545454545" cy="318.33333333333337" r="4" fill="#74888d"/><circle cx="810.9090909090909" cy="287.5" r="4" fill="#74888d"/><circle cx="897.2727272727274" cy="256.66666666666663" r="4" fill="#74888d"/><circle cx="983.6363636363636" cy="225.83333333333337" r="4" fill="#74888d"/><circle cx="1070.0" cy="195.0" r="4" fill="#74888d"/><path d="M120.00,534.17 L206.36,522.60 L292.73,516.55 L379.09,512.82 L465.45,510.30 L551.82,508.47 L638.18,507.09 L724.55,506.01 L810.91,505.15 L897.27,504.43 L983.64,503.84 L1070.00,503.33" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="120.0" cy="534.1666666666666" r="4" fill="#276a80"/><circle cx="206.36363636363637" cy="522.6041666666666" r="4" fill="#276a80"/><circle cx="292.72727272727275" cy="516.547619047619" r="4" fill="#276a80"/><circle cx="379.09090909090907" cy="512.8205128205128" r="4" fill="#276a80"/><circle cx="465.45454545454544" cy="510.2956989247312" r="4" fill="#276a80"/><circle cx="551.8181818181818" cy="508.47222222222223" r="4" fill="#276a80"/><circle cx="638.1818181818181" cy="507.0934959349593" r="4" fill="#276a80"/><circle cx="724.5454545454545" cy="506.0144927536232" r="4" fill="#276a80"/><circle cx="810.9090909090909" cy="505.1470588235294" r="4" fill="#276a80"/><circle cx="897.2727272727274" cy="504.4345238095238" r="4" fill="#276a80"/><circle cx="983.6363636363636" cy="503.8387978142076" r="4" fill="#276a80"/><circle cx="1070.0" cy="503.3333333333333" r="4" fill="#276a80"/><text x="120.0" y="610" font-size="24" fill="#19343e" text-anchor="middle">1</text><text x="206.36363636363637" y="610" font-size="24" fill="#19343e" text-anchor="middle">2</text><text x="379.09090909090907" y="610" font-size="24" fill="#19343e" text-anchor="middle">4</text><text x="551.8181818181818" y="610" font-size="24" fill="#19343e" text-anchor="middle">6</text><text x="724.5454545454545" y="610" font-size="24" fill="#19343e" text-anchor="middle">8</text><text x="897.2727272727274" y="610" font-size="24" fill="#19343e" text-anchor="middle">10</text><text x="1070.0" y="610" font-size="24" fill="#19343e" text-anchor="middle">12</text><text x="120" y="170" font-size="27" fill="#19343e" text-anchor="start">词频贡献</text><text x="790" y="170" font-size="26" fill="#74888d" text-anchor="start">灰：原始词频 f</text><text x="650" y="490" font-size="28" fill="#276a80" text-anchor="start">蓝：2.2 f ÷ (f + 1.2)</text><text x="120" y="670" font-size="28" fill="#19343e" text-anchor="start">f = 1、2、12 时，BM25 因子分别为 1、1.375、2。</text><text x="120" y="725" font-size="26" fill="#19343e" text-anchor="start">保持总长 12，用非查询词填充剩余位置；图只画合法的 f ≤ 12。</text></g></svg>

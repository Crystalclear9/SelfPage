<text x="55" y="490" font-size="26" fill="#20343d" text-anchor="start" font-weight="400">出现于几篇文档</text>
<text x="370" y="490" font-size="30" fill="#2867ac" text-anchor="middle" font-weight="400">1</text>
<text x="520" y="490" font-size="30" fill="#2867ac" text-anchor="middle" font-weight="400">2</text>
<text x="670" y="490" font-size="30" fill="#2867ac" text-anchor="middle" font-weight="400">2</text>
<text x="55" y="557" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">平滑 IDF</text>
<text x="370" y="557" font-size="29" fill="#2867ac" text-anchor="middle" font-weight="400">1.6931</text>
<text x="520" y="557" font-size="29" fill="#2867ac" text-anchor="middle" font-weight="400">1.2877</text>
<text x="670" y="557" font-size="29" fill="#2867ac" text-anchor="middle" font-weight="400">1.2877</text>
<line x1="790" y1="145" x2="790" y2="570" stroke="#d5e0e6" stroke-width="2"/>
<text x="840" y="175" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">一篇出现两次</text>
<text x="840" y="221" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">文档频率仍只加 1</text>
<text x="840" y="321" font-size="29" fill="#20343d" text-anchor="start" font-weight="400">IDF = 1 + ln</text>
<line x1="1090" y1="311" x2="1222" y2="311" stroke="#20343d" stroke-width="1.8"/>
<text x="1156" y="299" font-size="27" fill="#20343d" text-anchor="middle" font-weight="400">3 + 1</text>
<text x="1156" y="346" font-size="27" fill="#20343d" text-anchor="middle" font-weight="400">df + 1</text>
<text x="840" y="425" font-size="27" fill="#20343d" text-anchor="start" font-weight="400">“猫”只在一篇出现</text>
<text x="840" y="470" font-size="27" fill="#2867ac" text-anchor="start" font-weight="400">因此得到更高权重</text>
<line x1="40" y1="610" x2="1280" y2="610" stroke="#a9b8be" stroke-width="2"/>
<text x="40" y="662" font-size="29" fill="#20343d" text-anchor="start" font-weight="700">测试只做变换</text>
<text x="45" y="725" font-size="32" fill="#cc7d28" text-anchor="start" font-weight="400">猫 新词</text>
<text x="290" y="725" font-size="36" fill="#20343d" text-anchor="start" font-weight="400">→</text>

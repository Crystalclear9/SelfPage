<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1276" height="750" viewBox="22 61 1276 750" role="img" aria-labelledby="title desc"><rect x="22" y="61" width="1276" height="750" fill="#ffffff"/><title id="title">TF-IDF：训练文档决定每个坐标</title><desc id="desc">三篇训练文档的计数、文档频率和 IDF；冻结词表之后，测试中的新词没有新坐标。</desc><rect width="1320" height="820" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="40" y="103" font-size="28" fill="#20343d" text-anchor="start" font-weight="400">训练：猫 猫 鱼 ｜ 狗 鱼 ｜ 狗</text>

<rect x="725" y="682" width="110" height="67" fill="#edf3f8" stroke="none" stroke-width="2"/>
<text x="780" y="725" font-size="30" fill="#20343d" text-anchor="middle" font-weight="400">0</text>
<text x="990" y="705" font-size="27" fill="#20343d" text-anchor="start" font-weight="400">仍按 猫、狗、鱼</text>
<text x="990" y="750" font-size="27" fill="#cc7d28" text-anchor="start" font-weight="400">新词不扩充词表</text>
<text x="450" y="789" font-size="26" fill="#657c88" text-anchor="start" font-weight="400">L2 归一化后的向量</text></g></svg>

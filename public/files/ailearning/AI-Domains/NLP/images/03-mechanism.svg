<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" viewBox="0 0 1360 1264" width="1360" height="1264"><title id="plate-caption">一百问题的证据召回遗漏候选内判断及总体正确流量分解</title><defs><linearGradient id="scientific-plane-1c6583" x1="7%" y1="0%" x2="87%" y2="100%"><stop offset="0%" stop-color="#1c6583" stop-opacity=".08"/><stop offset="100%" stop-color="#1c6583" stop-opacity=".24"/></linearGradient><linearGradient id="scientific-plane-ae5f34" x1="7%" y1="0%" x2="87%" y2="100%"><stop offset="0%" stop-color="#a74d3a" stop-opacity=".08"/><stop offset="100%" stop-color="#a74d3a" stop-opacity=".24"/></linearGradient><clipPath id="plate-view-0"><rect x="-18.24" y="82.356472" width="996.48" height="41.359874"/></clipPath><clipPath id="plate-view-1"><rect x="-18.24" y="123.71635" width="996.48" height="53.704819"/></clipPath><clipPath id="plate-view-2"><rect x="-18.24" y="177.42117" width="996.48" height="421.07691"/></clipPath><clipPath id="plate-view-3"><rect x="-18.24" y="598.49808" width="996.48" height="160.33613"/></clipPath><clipPath id="plate-view-4"><rect x="-18.24" y="758.8342" width="996.48" height="203.25266"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="901.809402"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="988.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="952" viewBox="0 47 960 952" overflow="hidden"><rect width="960" height="999" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.598291)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>检索—判别串联后的总误差包含两阶段失败</title><svg width="1521" height="1032" viewBox="42 70 1521 1032" role="img"><rect x="42" y="70" width="1521" height="1032" fill="#ffffff"/><title>检索—判别串联后的总误差包含两阶段失败</title><desc>构造100问题，80召回所需证据，候选内60正确20错误，另外20证据未召回。总体成功率0.6等于0.8乘0.75，不是两个阶段百分比相加。</desc><rect width="1700" height="1120" fill="#ffffff"/><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#227aaa" stroke-width="1.5"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#b05f2b" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#233b4a"><text x="60.00" y="112.00" font-size="28" fill="#4f7791" text-anchor="start" font-weight="normal">构造 100 个必须召回证据才能算正确的问题；本图不是前面人工文档库的实测结果。</text><text x="100.00" y="208.00" font-size="31" fill="#233b4a" text-anchor="start" font-weight="bold">全部 100 题</text><text x="640.00" y="208.00" font-size="31" fill="#2e7db6" text-anchor="start" font-weight="bold">证据到位：80 题</text><text x="1190.00" y="208.00" font-size="31" fill="#233b4a" text-anchor="start" font-weight="bold">终点仍按全部 100 题计数</text><path d="M160,270 C405.0,270 405.0,270 650,270 L650,670 C405.0,670 405.0,670 160,670 Z" fill="#2e7db6" fill-opacity="0.18"/><path d="M160,670 C405.0,670 405.0,720 650,720 L650,820 C405.0,820 405.0,770 160,770 Z" fill="#608196" fill-opacity="0.18"/><path d="M710,270 C955.0,270 955.0,270 1200,270 L1200,570 C955.0,570 955.0,570 710,570 Z" fill="#1b6f7c" fill-opacity="0.18"/><path d="M710,570 C955.0,570 955.0,620 1200,620 L1200,720 C955.0,720 955.0,670 710,670 Z" fill="#bc6f38" fill-opacity="0.18"/><path d="M710,720 C955.0,720 955.0,770 1200,770 L1200,870 C955.0,870 955.0,820 710,820 Z" fill="#608196" fill-opacity="0.18"/><rect x="100" y="270" width="60" height="500" fill="#c0d6e4" stroke="none" stroke-width="2"/><rect x="650" y="270" width="60" height="400" fill="#2e7db6" stroke="none" stroke-width="2"/><rect x="650" y="720" width="60" height="100" fill="#608196" stroke="none" stroke-width="2"/><rect x="1200" y="270" width="60" height="300" fill="#1b6f7c" stroke="none" stroke-width="2"/><rect x="1200" y="620" width="60" height="100" fill="#bc6f38" stroke="none" stroke-width="2"/><rect x="1200" y="770" width="60" height="100" fill="#608196" stroke="none" stroke-width="2"/><text x="1290.00" y="432.00" font-size="32" fill="#1b6f7c" text-anchor="start" font-weight="bold">正确 60</text><text x="1290.00" y="682.00" font-size="31" fill="#9f5e2f" text-anchor="start" font-weight="bold">候选内错误 20</text><text x="1290.00" y="832.00" font-size="31" fill="#4f7791" text-anchor="start" font-weight="bold">未召回 20</text><text x="640.00" y="891.00" font-size="28" fill="#4f7791" text-anchor="start" font-weight="normal">检索阶段已遗漏 20</text><text x="60.00" y="1018.00" font-size="31" fill="#1b6f7c" text-anchor="start" font-weight="normal">召回证据：80%      候选内正确：75%      全部问题正确：80% × 75% = 60%</text><text x="60.00" y="1080.00" font-size="28" fill="#4f7791" text-anchor="start" font-weight="normal">两个 20 互不重叠；第二阶段的 75% 以进入候选的 80 个问题为分母。</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 1032) scale(1.05625)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dbe8eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">允许无证据猜答后，原始正确率与有依据正确率开始分离</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="86.82,145 462,145 462,175.16 445.18,203 70,203 70,172.84" stroke-linejoin="round"/><text x="266.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">证据完整 80 题</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="486.82,145 862,145 862,175.16 845.18,203 470,203 470,172.84" stroke-linejoin="round"/><text x="666.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">正确 60</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="886.82,145 1262,145 1262,175.16 1245.18,203 870,203 870,172.84" stroke-linejoin="round"/><text x="1066.0" y="184" font-size="36.12px" fill="#277290" text-anchor="middle">仍为 0.8×0.75</text><polygon fill="url(#scientific-plane-ae5f34)" stroke="#a74d3a" points="86.82,220 462,220 462,250.16 445.18,278 70,278 70,247.84" stroke-linejoin="round"/><text x="266.0" y="259" font-size="36.12px" fill="#a55f3a" text-anchor="middle">证据缺失 20 题</text><polygon fill="url(#scientific-plane-ae5f34)" stroke="#a74d3a" points="486.82,220 862,220 862,250.16 845.18,278 470,278 470,247.84" stroke-linejoin="round"/><text x="666.0" y="259" font-size="36.12px" fill="#a55f3a" text-anchor="middle">猜对 2</text><polygon fill="url(#scientific-plane-ae5f34)" stroke="#a74d3a" points="886.82,220 1262,220 1262,250.16 1245.18,278 870,278 870,247.84" stroke-linejoin="round"/><text x="1066.0" y="259" font-size="36.12px" fill="#a55f3a" text-anchor="middle">新增 0.2×0.1</text><text x="70" y="335" font-size="41.28px" fill="#213747" text-anchor="start">原始答案正确率：0.60 + 0.02 = 0.62</text><text x="70" y="415" font-size="41.28px" fill="#277290" text-anchor="start">要求证据完整且答案正确：仍为 0.60。</text></g></g></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="1264" fill="white"/><g transform="translate(20.312866 -62.683862) scale(1.3743482)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g><g transform="translate(20.312866 -71.926048) scale(1.3743482)"><use href="#plate-scene" clip-path="url(#plate-view-1)" xlink:href="#plate-scene"/></g><g transform="translate(20.312866 -80.783142) scale(1.3743482)"><use href="#plate-scene" clip-path="url(#plate-view-2)" xlink:href="#plate-scene"/></g><g transform="translate(20.312866 -97.080145) scale(1.3743482)"><use href="#plate-scene" clip-path="url(#plate-view-3)" xlink:href="#plate-scene"/></g><g transform="translate(20.312866 -109.40306) scale(1.3743482)"><use href="#plate-scene" clip-path="url(#plate-view-4)" xlink:href="#plate-scene"/></g></g></svg>

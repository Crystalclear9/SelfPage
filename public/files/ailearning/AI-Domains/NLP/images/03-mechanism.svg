<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1473.9031" viewBox="0 0 1440 1473.9031" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">一百问题的证据召回遗漏候选内判断及总体正确流量分解</title><rect width="1440" height="1473.9031" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">一百问题的证据召回遗漏候选内判断及总体正确流量分解</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1331.9031" viewBox="0 0 1521 1507.31" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>检索—判别串联后的总误差包含两阶段失败</title><svg width="1521" height="1032" viewBox="42 70 1521 1032" role="img"><rect x="42" y="70" width="1521" height="1032" fill="#ffffff"/><title>检索—判别串联后的总误差包含两阶段失败</title><desc>构造100问题，80召回所需证据，候选内60正确20错误，另外20证据未召回。总体成功率0.6等于0.8乘0.75，不是两个阶段百分比相加。</desc><rect width="1700" height="1120" fill="white"/><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2376c4" stroke-width="1.5"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#ca772e" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#20354b"><text x="60.00" y="112.00" font-size="28" fill="#618099" text-anchor="start" font-weight="normal">构造 100 个必须召回证据才能算正确的问题；本图不是前面人工文档库的实测结果。</text><text x="100.00" y="208.00" font-size="31" fill="#20354b" text-anchor="start" font-weight="bold">全部 100 题</text><text x="640.00" y="208.00" font-size="31" fill="#2376c4" text-anchor="start" font-weight="bold">证据到位：80 题</text><text x="1190.00" y="208.00" font-size="31" fill="#20354b" text-anchor="start" font-weight="bold">终点仍按全部 100 题计数</text><path d="M160,270 C405.0,270 405.0,270 650,270 L650,670 C405.0,670 405.0,670 160,670 Z" fill="#2376c4" fill-opacity="0.18"/><path d="M160,670 C405.0,670 405.0,720 650,720 L650,820 C405.0,820 405.0,770 160,770 Z" fill="#618099" fill-opacity="0.18"/><path d="M710,270 C955.0,270 955.0,270 1200,270 L1200,570 C955.0,570 955.0,570 710,570 Z" fill="#127982" fill-opacity="0.18"/><path d="M710,570 C955.0,570 955.0,620 1200,620 L1200,720 C955.0,720 955.0,670 710,670 Z" fill="#ca772e" fill-opacity="0.18"/><path d="M710,720 C955.0,720 955.0,770 1200,770 L1200,870 C955.0,870 955.0,820 710,820 Z" fill="#618099" fill-opacity="0.18"/><rect x="100" y="270" width="60" height="500" fill="#b6cee2" stroke="none" stroke-width="2"/><rect x="650" y="270" width="60" height="400" fill="#2376c4" stroke="none" stroke-width="2"/><rect x="650" y="720" width="60" height="100" fill="#618099" stroke="none" stroke-width="2"/><rect x="1200" y="270" width="60" height="300" fill="#127982" stroke="none" stroke-width="2"/><rect x="1200" y="620" width="60" height="100" fill="#ca772e" stroke="none" stroke-width="2"/><rect x="1200" y="770" width="60" height="100" fill="#618099" stroke="none" stroke-width="2"/><text x="1290.00" y="432.00" font-size="32" fill="#127982" text-anchor="start" font-weight="bold">正确 60</text><text x="1290.00" y="682.00" font-size="31" fill="#ca772e" text-anchor="start" font-weight="bold">候选内错误 20</text><text x="1290.00" y="832.00" font-size="31" fill="#618099" text-anchor="start" font-weight="bold">未召回 20</text><text x="640.00" y="891.00" font-size="28" fill="#618099" text-anchor="start" font-weight="normal">检索阶段已遗漏 20</text><text x="60.00" y="1018.00" font-size="31" fill="#127982" text-anchor="start" font-weight="normal">召回证据：80%      候选内正确：75%      全部问题正确：80% × 75% = 60%</text><text x="60.00" y="1080.00" font-size="28" fill="#618099" text-anchor="start" font-weight="normal">两个 20 互不重叠；第二阶段的 75% 以进入候选的 80 个问题为分母。</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 1032) scale(1.05625)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">允许无证据猜答后，原始正确率与有依据正确率开始分离</text><rect x="70" y="145" width="392" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="266.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">证据完整 80 题</text><rect x="470" y="145" width="392" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="666.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">正确 60</text><rect x="870" y="145" width="392" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1066.0" y="184" font-size="28" fill="#1e7499" text-anchor="middle">仍为 0.8×0.75</text><rect x="70" y="220" width="392" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="266.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">证据缺失 20 题</text><rect x="470" y="220" width="392" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="666.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">猜对 2</text><rect x="870" y="220" width="392" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1066.0" y="259" font-size="28" fill="#c66d3a" text-anchor="middle">新增 0.2×0.1</text><text x="70" y="335" font-size="32" fill="#1d3145" text-anchor="start">原始答案正确率：0.60 + 0.02 = 0.62</text><text x="70" y="415" font-size="32" fill="#1e7499" text-anchor="start">要求证据完整且答案正确：仍为 0.60。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="601" viewBox="0 0 1200 601" role="img"><title>检索—判别串联后的总误差包含两阶段失败</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="601" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">检索—判别串联后的总误差包含两阶段失败</text><rect x="60" y="190" width="260" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="75" y="225" font-size="24" fill="#213447">全部问题</text><rect x="450" y="190" width="260" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="465" y="225" font-size="24" fill="#213447">候选检索</text><rect x="840" y="190" width="260" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="855" y="225" font-size="24" fill="#213447">候选内判断</text><line x1="320" y1="235" x2="440" y2="235" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="710" y1="235" x2="830" y2="235" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="300" y="475" width="350" height="95" rx="8" fill="#fff0df" stroke="#94a9bb" /><text x="315" y="510" font-size="24" fill="#213447">首阶段：相关文档未召回</text><rect x="760" y="475" width="350" height="95" rx="8" fill="#fff0df" stroke="#94a9bb" /><text x="775" y="510" font-size="24" fill="#213447">次阶段：候选内误判</text><line x1="580" y1="285" x2="475" y2="465" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /><line x1="970" y1="285" x2="940" y2="465" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /></g><desc> 定位首个失败环节，才能判断应改召回、排序还是判别。</desc></svg>

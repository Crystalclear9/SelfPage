<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img"><title>检索—判别串联后的总误差包含两阶段失败</title><desc>构造100问题，80召回所需证据，候选内60正确20错误，另外20证据未召回。总体成功率0.6等于0.8乘0.75，不是两个阶段百分比相加。</desc><rect width="1700" height="1120" fill="white"/><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2866b2" stroke-width="1.5"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#cf7c29" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#20334b"><text x="60.00" y="65.00" font-size="38" fill="#20334b" text-anchor="start" font-weight="bold">检索遗漏与候选内误判，要分开数</text><text x="60.00" y="112.00" font-size="28" fill="#62778b" text-anchor="start" font-weight="normal">构造 100 个必须召回证据才能算正确的问题；本图不是前面人工文档库的实测结果。</text><text x="100.00" y="208.00" font-size="31" fill="#20334b" text-anchor="start" font-weight="bold">全部 100 题</text><text x="640.00" y="208.00" font-size="31" fill="#2866b2" text-anchor="start" font-weight="bold">证据到位：80 题</text><text x="1190.00" y="208.00" font-size="31" fill="#20334b" text-anchor="start" font-weight="bold">终点仍按全部 100 题计数</text><path d="M160,270 C405.0,270 405.0,270 650,270 L650,670 C405.0,670 405.0,670 160,670 Z" fill="#2866b2" fill-opacity="0.18"/><path d="M160,670 C405.0,670 405.0,720 650,720 L650,820 C405.0,820 405.0,770 160,770 Z" fill="#62778b" fill-opacity="0.18"/><path d="M710,270 C955.0,270 955.0,270 1200,270 L1200,570 C955.0,570 955.0,570 710,570 Z" fill="#087e77" fill-opacity="0.18"/><path d="M710,570 C955.0,570 955.0,620 1200,620 L1200,720 C955.0,720 955.0,670 710,670 Z" fill="#cf7c29" fill-opacity="0.18"/><path d="M710,720 C955.0,720 955.0,770 1200,770 L1200,870 C955.0,870 955.0,820 710,820 Z" fill="#62778b" fill-opacity="0.18"/><rect x="100" y="270" width="60" height="500" fill="#b9ccdf" stroke="none" stroke-width="2"/><rect x="650" y="270" width="60" height="400" fill="#2866b2" stroke="none" stroke-width="2"/><rect x="650" y="720" width="60" height="100" fill="#62778b" stroke="none" stroke-width="2"/><rect x="1200" y="270" width="60" height="300" fill="#087e77" stroke="none" stroke-width="2"/><rect x="1200" y="620" width="60" height="100" fill="#cf7c29" stroke="none" stroke-width="2"/><rect x="1200" y="770" width="60" height="100" fill="#62778b" stroke="none" stroke-width="2"/><text x="1290.00" y="432.00" font-size="32" fill="#087e77" text-anchor="start" font-weight="bold">正确 60</text><text x="1290.00" y="682.00" font-size="31" fill="#cf7c29" text-anchor="start" font-weight="bold">候选内错误 20</text><text x="1290.00" y="832.00" font-size="31" fill="#62778b" text-anchor="start" font-weight="bold">未召回 20</text><text x="640.00" y="891.00" font-size="28" fill="#62778b" text-anchor="start" font-weight="normal">检索阶段已遗漏 20</text><text x="60.00" y="1018.00" font-size="31" fill="#087e77" text-anchor="start" font-weight="normal">召回证据：80%      候选内正确：75%      全部问题正确：80% × 75% = 60%</text><text x="60.00" y="1080.00" font-size="28" fill="#62778b" text-anchor="start" font-weight="normal">两个 20 互不重叠；第二阶段的 75% 以进入候选的 80 个问题为分母。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>配对重采样应保持两系统的样本对应</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">配对重采样应保持两系统的样本对应</text><text x="95" y="130" font-size="27" fill="#143651">原始共同问题索引</text><text x="720" y="130" font-size="27" fill="#143651">一次配对重采样：2、1、2</text><rect x="100" y="210" width="330" height="85" rx="8" fill="#e0f0e8" stroke="#82a2b7" /><text x="125" y="260" font-size="25" fill="#143651">问题 1：A_i，B_i</text><rect x="100" y="340" width="330" height="85" rx="8" fill="#e0f0e8" stroke="#82a2b7" /><text x="125" y="390" font-size="25" fill="#143651">问题 2：A_i，B_i</text><rect x="100" y="470" width="330" height="85" rx="8" fill="#e0f0e8" stroke="#82a2b7" /><text x="125" y="520" font-size="25" fill="#143651">问题 3：A_i，B_i</text><rect x="750" y="210" width="330" height="85" rx="8" fill="#dcebf6" stroke="#82a2b7" /><text x="775" y="260" font-size="25" fill="#143651">问题 2：A，B</text><line x1="435" y1="382" x2="740" y2="252" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><rect x="750" y="340" width="330" height="85" rx="8" fill="#dcebf6" stroke="#82a2b7" /><text x="775" y="390" font-size="25" fill="#143651">问题 1：A，B</text><line x1="435" y1="252" x2="740" y2="382" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><rect x="750" y="470" width="330" height="85" rx="8" fill="#dcebf6" stroke="#82a2b7" /><text x="775" y="520" font-size="25" fill="#143651">问题 2：A，B</text><line x1="435" y1="382" x2="740" y2="512" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><text x="150" y="665" font-size="24" fill="#143651">每次抽共同索引，两个系统的结果始终保持同一个问题身份。</text></g></svg>

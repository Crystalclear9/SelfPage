<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 385.320000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 385.320000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 290.680000 684.000000 385.320000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 290.680000 684.000000 385.320000"/>
<title id="fig-title">同一组路径质量，求和与取最大不同</title>
<desc id="fig-desc">矩阵的行列分别是第一和第二位置标签；逐位置边缘取最大得到 01，联合最优是 00。</desc>
<rect x="0" y="0" width="1200" height="676" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">联合最优路径与逐位置最优可以不同</text>
<text x="75" y="114" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">四条路径的未归一化质量</text>
<text x="298" y="169" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">位置 2</text>
<text x="73" y="282" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">位置 1</text>
<rect x="214" y="220" width="84" height="75" fill="#ecf6f6" opacity="1"/>
<text x="256" y="265.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">35</text>
<rect x="302" y="220" width="84" height="75" fill="#e8e6f2" opacity="1"/>
<text x="344" y="265.5" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">30</text>
<text x="198" y="265.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">0</text>
<rect x="214" y="299" width="84" height="75" fill="#f1f5f6" opacity="1"/>
<text x="256" y="344.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1</text>
<rect x="302" y="299" width="84" height="75" fill="#f1f5f6" opacity="1"/>
<text x="344" y="344.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">34</text>
<text x="198" y="344.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">1</text>
<text x="256" y="206" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">0</text>
<text x="344" y="206" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">1</text>
<text x="462" y="157" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">前向：按终点求和</text>
<path d="M462 283 L475 218 L756 218 L743 283 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="609" y="258.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">35 + 1 = 36</text>
<path d="M462 362 L475 297 L756 297 L743 362 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="609" y="337.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">30 + 34 = 64</text>
<text x="462" y="418" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">分区函数 Z = 100</text>
<text x="817" y="157" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">Viterbi：按终点取最大</text>
<path d="M817 283 L830 218 L1111 218 L1098 283 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="258.9" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">max(35, 1) = 35</text>
<path d="M817 362 L830 297 L1111 297 L1098 362 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="337.9" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">max(30, 34) = 34</text>
<text x="817" y="418" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">回溯最佳路径 00</text>
<path d="M75 458 L1125 458" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="509" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">位置 1 的边缘最大值在 0（0.65），位置 2 在 1（0.64）。</text>
<text x="74" y="559" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">拼出的 01 联合概率为 0.30；最佳路径 00 的概率为 0.35。</text>
<text x="74" y="609" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">把前向总质量保存下来，仍不能替代 Viterbi 的前驱记录。</text>
</svg>

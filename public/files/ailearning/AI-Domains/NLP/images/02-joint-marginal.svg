<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="627" viewBox="26 66 1348 627" role="img"><rect x="26" y="66" width="1348" height="627" fill="#ffffff"/><title>同一条 CRF 链：求和用于归一化，取最大用于最优路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245f98"/></marker></defs><rect width="1400" height="760" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<line x1="44" y1="85" x2="1356" y2="85" stroke="#dce5ed" stroke-width="2"/>
<text x="350" y="140" font-size="29" fill="#18324a" text-anchor="middle" font-weight="normal">四条路径的未归一化质量</text>
<circle cx="120" cy="255" r="38" fill="#f4f7fa" stroke="#245f98" stroke-width="2"/>
<text x="120" y="266" font-size="31" fill="#18324a" text-anchor="middle" font-weight="normal">0</text>

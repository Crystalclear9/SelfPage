<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img"><title>事实正确与引用正确：同一组回答的两个检查面</title><rect width="1280" height="1030" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">事实正确与引用正确：同一组回答的两个检查面</text><text x="60" y="118" font-size="27" fill="#74888d" text-anchor="start">alpha 的四个去重命题；启动年原句重复两次，因此有五条引用边。</text><text x="60" y="185" font-size="29" fill="#19343e" text-anchor="start">命题</text><text x="710" y="185" font-size="29" fill="#19343e" text-anchor="middle">d1</text><text x="915" y="185" font-size="29" fill="#19343e" text-anchor="middle">d2</text><text x="1120" y="185" font-size="29" fill="#19343e" text-anchor="middle">missing</text><text x="60" y="280" font-size="30" fill="#276a80" text-anchor="start">启动年 2020</text><line x1="620" y1="323" x2="800" y2="323" stroke="#dbe5e8" stroke-width="2"/><line x1="825" y1="323" x2="1005" y2="323" stroke="#dbe5e8" stroke-width="2"/><line x1="1030" y1="323" x2="1210" y2="323" stroke="#dbe5e8" stroke-width="2"/><circle cx="710" cy="270" r="20" fill="#edf2f3"/><circle cx="915" cy="270" r="20" fill="#edf2f3"/><circle cx="1120" cy="270" r="20" fill="#edf2f3"/><text x="60" y="395" font-size="30" fill="#c2673f" text-anchor="start">预算 100</text><line x1="620" y1="438" x2="800" y2="438" stroke="#dbe5e8" stroke-width="2"/><line x1="825" y1="438" x2="1005" y2="438" stroke="#dbe5e8" stroke-width="2"/><line x1="1030" y1="438" x2="1210" y2="438" stroke="#dbe5e8" stroke-width="2"/><circle cx="710" cy="385" r="20" fill="#edf2f3"/><circle cx="915" cy="385" r="20" fill="#edf2f3"/><circle cx="1120" cy="385" r="20" fill="#edf2f3"/><text x="60" y="510" font-size="30" fill="#276a80" text-anchor="start">未批准</text><line x1="620" y1="553" x2="800" y2="553" stroke="#dbe5e8" stroke-width="2"/><line x1="825" y1="553" x2="1005" y2="553" stroke="#dbe5e8" stroke-width="2"/><line x1="1030" y1="553" x2="1210" y2="553" stroke="#dbe5e8
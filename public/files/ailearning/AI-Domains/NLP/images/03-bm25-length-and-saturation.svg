 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="599" fill="white" stroke="none" stroke-width="1.6"/><text x="108" y="164" fill="#196f77" font-size="33" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">短文</text><rect x="214" y="129" width="59" height="52" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="244" y="163" fill="#196f77" font-size="29" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">q</text><rect x="287" y="129" width="59" height="52" fill="white" stroke="#657682" stroke-width="1.6"/><text x="317" y="163" fill="#657682" font-size="29" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">a</text><rect x="360" y="129" width="59" height="52" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="390" y="163" fill="#196f77" font-size="29" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">q</text><rect x="433" y="129" width="59" height="52" fill="white" stroke="#657682" stroke-width="1.6"/><text x="463" y="163" fill="#657682" font-size="29" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">b</text><line x1="834" y1="155" x2="932" y2="155" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="1014" y="152" fill="#196f77" font-size="29" font-family="Segoe UI, Noto Sans,
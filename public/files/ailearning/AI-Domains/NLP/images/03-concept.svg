06；但 I-PER 禁止出现在开头。</text><text x="60" y="790" font-size="27" fill="#19343e" text-anchor="start">可用词特征只有 bias 与左邻 BOS；未知字符不会新建参数。</text><text x="60" y="845" font-size="27" fill="#276a80" text-anchor="start">B-PER → I-PER 转移加 1.084，整条路径还要累加后续分数。</text><line x1="60" y1="885" x2="1220" y2="885" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="935" font-size="29" fill="#276a80" text-anchor="start">正确跨度：赵六 [0,2) PER；南京 [3,5) LOC。</text><text x="60" y="990" font-size="27" fill="#c2673f" text-anchor="start">仅把“京”改为 O：地点缩成“南”；字符对 6 个，实体只对 1 个。</text><text x="1120" y="1030" font-size="27" fill="#c2673f" text-anchor="middle">6</text><line x1="1092" y1="1039" x2="1148" y2="1039" stroke="#c2673f" stroke-width="2"/><text x="1120" y="1070" font-size="27" fill="#c2673f" text-anchor="middle">7</text><text x="820" y="1050" font-size="26" fill="#c2673f" text-anchor="start">字符准确率</text></g></svg>

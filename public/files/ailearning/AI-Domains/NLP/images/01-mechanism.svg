<svg xmlns="http://www.w3.org/2000/svg" width="1347" height="696" viewBox="26 68 1347 696" role="img" aria-labelledby="title desc"><rect x="26" y="68" width="1347" height="696" fill="#ffffff"/><title id="title">窗口有重叠仍可能没有一个窗口看全实体</title><desc id="desc">八字符文本甲于北京大学任职，实体北京大学的全局半开跨度为2到6。长度五的窗口A为0到5、B为3到8，重叠两个字符但都切断实体。额外窗口C为2到7，可以完整保留实体，局部跨度0到4。</desc><rect width="1400" height="760" fill="white"/><g font-family="Microsoft YaHei,DejaVu Sans,sans-serif"><text x="44" y="109" font-size="27" fill="#526c7b" text-anchor="start">受控例子：一字一个 token；全部跨度使用左闭右开的内容坐标</text><text x="340" y="160" font-size="24" fill="#526c7b" text-anchor="middle">0</text><text x="426" y="160" font-size="24" fill="#526c7b" text-anchor="middle">1</text><text x="512" y="160" font-size="24" fill="#526c7b" text-anchor="middle">2</text><text x="598" y="160" font-size="24" fill="#526c7b" text-anchor="middle">3</text><text x="684" y="160" font-size="24" fill="#526c7b" text-anchor="middle">4</text><text x="770" y="160" font-size="24" fill="#526c7b" text-anchor="middle">5</text><text x="856" y="160" font-size="24" fill="#526c7b" text-anchor="middle">6</text><text x="942" y="160" font-size="24" fill="#526c7b" text-anchor="middle">7</text><text x="1028" y="160" font-size="24" fill="#526c7b" text-anchor="middle">8</text><rect x="342" y="201" width="82" height="66" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="383.0" y="246" font-size="31" fill="#17374e" text-anchor="middle">甲</text><rect x="428" y="201" width="82" height="66" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="469.0" y="246" font-size="31" fill="#17374e" text-anchor="middle">于</text><rect x="514" y="201" width="82" height="66" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="555.0" y="246" font-size="31" fill="#246f94" text-anchor="middle">北</text><rect x="600" y="201" width="82" height="66" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="641.0" y="246" font-size="31" fill="#246f94" text-anchor="middle">京</text><rect x="686" y="201" width="82" height="66" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="727.0" y="246" font-size="31" fill="#246f94" text-anchor="middle">大</text><rect x="772" y="201" width="82" height="66" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="813.0" y="246" font-size="31" fill="#246f94" text-anchor="middle">学</text><rect x="858" y="201" width="82" height="66" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="899.0" y="246" font-size="31" fill="#17374e" text-anchor="middle">任</text><rect x="944" y="201" width="82" height="66" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="985.0" y="246" font-size="31" fill="#17374e" text-anchor="middle">职</text><text x="44" y="241" font-size="30" fill="#17374e" text-anchor="start" font-weight="bold">原文</text><line x1="512" y1="186" x2="856" y2="186" stroke="#246f94" stroke-width="4"/><line x1="512" y1="178" x2="512" y2="194" stroke="#246f94" stroke-width="3"/><line x1="856" y1="178" x2="856" y2="194" stroke="#246f94" stroke-width="3"/><text x="684.0" y="295" font-size="28" fill="#246f94" text-anchor="middle">北京大学  [2,6)</text><text x="44" y="379" font-size="28" fill="#ce6b32" text-anchor="start" font-weight="bold">窗口 A  [0,5)</text><rect x="342" y="338" width="82" height="64" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="383.0" y="380" font-size="31" fill="#17374e" text-anchor="middle">甲</text><rect x="428" y="338" width="82" height="64" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="469.0" y="380" font-size="31" fill="#17374e" text-anchor="middle">于</text><rect x="514" y="338" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="555.0" y="380" font-size="31" fill="#246f94" text-anchor="middle">北</text><rect x="600" y="338" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="641.0" y="380" font-size="31" fill="#246f94" text-anchor="middle">京</text><rect x="686" y="338" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="727.0" y="380" font-size="31" fill="#246f94" text-anchor="middle">大</text><line x1="340" y1="408" x2="770" y2="408" stroke="#ce6b32" stroke-width="4"/><line x1="340" y1="333" x2="340" y2="409" stroke="#ce6b32" stroke-width="3"/><line x1="770" y1="333" x2="770" y2="409" stroke="#ce6b32" stroke-width="3"/><text x="1080" y="379" font-size="28" fill="#ce6b32" text-anchor="start">缺少“学”</text><text x="44" y="485" font-size="28" fill="#ce6b32" text-anchor="start" font-weight="bold">窗口 B  [3,8)</text><rect x="600" y="444" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="641.0" y="486" font-size="31" fill="#246f94" text-anchor="middle">京</text><rect x="686" y="444" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="727.0" y="486" font-size="31" fill="#246f94" text-anchor="middle">大</text><rect x="772" y="444" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="813.0" y="486" font-size="31" fill="#246f94" text-anchor="middle">学</text><rect x="858" y="444" width="82" height="64" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="899.0" y="486" font-size="31" fill="#17374e" text-anchor="middle">任</text><rect x="944" y="444" width="82" height="64" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="985.0" y="486" font-size="31" fill="#17374e" text-anchor="middle">职</text><line x1="598" y1="514" x2="1028" y2="514" stroke="#ce6b32" stroke-width="4"/><line x1="598" y1="439" x2="598" y2="515" stroke="#ce6b32" stroke-width="3"/><line x1="1028" y1="439" x2="1028" y2="515" stroke="#ce6b32" stroke-width="3"/><text x="1080" y="485" font-size="28" fill="#ce6b32" text-anchor="start">缺少“北”</text><text x="44" y="591" font-size="28" fill="#246f94" text-anchor="start" font-weight="bold">窗口 C  [2,7)</text><rect x="514" y="550" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="555.0" y="592" font-size="31" fill="#246f94" text-anchor="middle">北</text><rect x="600" y="550" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="641.0" y="592" font-size="31" fill="#246f94" text-anchor="middle">京</text><rect x="686" y="550" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="727.0" y="592" font-size="31" fill="#246f94" text-anchor="middle">大</text><rect x="772" y="550" width="82" height="64" fill="#e8f1f5" stroke="none" stroke-width="1"/><text x="813.0" y="592" font-size="31" fill="#246f94" text-anchor="middle">学</text><rect x="858" y="550" width="82" height="64" fill="#f0f3f5" stroke="none" stroke-width="1"/><text x="899.0" y="592" font-size="31" fill="#17374e" text-anchor="middle">任</text><line x1="512" y1="620" x2="942" y2="620" stroke="#246f94" stroke-width="4"/><line x1="512" y1="545" x2="512" y2="621" stroke="#246f94" stroke-width="3"/><line x1="942" y1="545" x2="942" y2="621" stroke="#246f94" stroke-width="3"/><text x="1080" y="591" font-size="28" fill="#246f94" text-anchor="start">完整；局部 [0,4)</text><line x1="44" y1="654" x2="1355" y2="654" stroke="#dbe6ec" stroke-width="2"/><text x="44" y="701" font-size="28" fill="#17374e" text-anchor="start">A、B 重叠两字，却没有一份完整的“北京大学”。C 通过调整起点补齐覆盖。</text><text x="44" y="742" font-size="27" fill="#ce6b32" text-anchor="start">看见每个字符  ≠  在同一窗口看见完整跨度</text></g></svg>

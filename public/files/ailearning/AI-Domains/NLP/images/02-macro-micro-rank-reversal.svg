<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>同一测试集：微 F1 与宏 F1 可以给出相反排序</title><rect width="1400" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="64" font-size="36" fill="#19333c" text-anchor="start" font-weight="normal">同一测试集：微 F1 与宏 F1 可以给出相反排序</text><text x="60" y="112" font-size="26" fill="#71858d" text-anchor="start" font-weight="normal">互斥、穷尽的两个类别；每条文本恰好一个真值和一个预测；共 100 条</text><text x="75" y="175" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">系统 A：全部预测常见类</text><text x="195" y="225" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">预测：常见</text><text x="360" y="225" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">稀有</text><text x="75" y="290" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">真常见</text><rect x="195" y="245" width="155" height="88" fill="#e8f0f4" stroke="none"/><text x="272" y="300" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">90</text><rect x="365" y="245" width="155" height="88" fill="#f8ece4" stroke="none"/><text x="442" y="300" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">0</text><text x="75" y="390" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">真稀有</text><rect x="195" y="345" width="155" height="88" fill="#f8ece4" stroke="none"/><text x="272" y="400" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">10</text><rect x="365" y="345" width="155" height="88" fill="#e8f0f4" stroke="none"/><text x="442" y="400" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">0</text><text x="75" y="505" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">两类 F1：0.9474，0.0000</text><text x="75" y="572" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">微 F1</text><rect x="215" y="542" width="360.0" height="40" fill="#256b82" stroke="none"/><text x="585" y="573" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.90</text><text x="75" y="650" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">宏 F1</text><rect x="215" y="620" width="189.4736842105263" height="40" fill="#c0643c" stroke="none"/><text x="585" y="651" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.4737</text><text x="765" y="175" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">系统 B：识别部分稀有类</text><text x="885" y="225" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">预测：常见</text><text x="1050" y="225" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">稀有</text><text x="765" y="290" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">真常见</text><rect x="885" y="245" width="155" height="88" fill="#e8f0f4" stroke="none"/><text x="962" y="300" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">80</text><rect x="1055" y="245" width="155" height="88" fill="#f8ece4" stroke="none"/><text x="1132" y="300" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">10</text><text x="765" y="390" font-size="25" fill="#19333c" text-anchor="start" font-weight="normal">真稀有</text><rect x="885" y="345" width="155" height="88" fill="#f8ece4" stroke="none"/><text x="962" y="400" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">2</text><rect x="1055" y="345" width="155" height="88" fill="#e8f0f4" stroke="none"/><text x="1132" y="400" font-size="35" fill="#19333c" text-anchor="middle" font-weight="normal">8</text><text x="765" y="505" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">两类 F1：0.9302，0.5714</text><text x="765" y="572" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">微 F1</text><rect x="905" y="542" width="352.0" height="40" fill="#256b82" stroke="none"/><text x="1275" y="573" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.88</text><text x="765" y="650" font-size="28" fill="#19333c" text-anchor="start" font-weight="normal">宏 F1</text><rect x="905" y="620" width="300.3322259136213" height="40" fill="#c0643c" stroke="none"/><text x="1275" y="651" font-size="29" fill="#19333c" text-anchor="start" font-weight="normal">0.7508</text><line x1="60" y1="711" x2="1340" y2="711" stroke="#dce5e8" stroke-width="2"/><text x="70" y="777" font-size="31" fill="#256b82" text-anchor="start" font-weight="normal">逐文本等权汇总：A 优于 B</text><text x="765" y="777" font-size="31" fill="#c0643c" text-anchor="start" font-weight="normal">先逐类计分再等权：B 优于 A</text><text x="60" y="847" font-size="27" fill="#71858d" text-anchor="start" font-weight="normal">评价目标与标签集合必须预先固定；不能看完排序后再挑平均方式。</text></g></svg>

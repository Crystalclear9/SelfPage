<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>误分类成本改变条件风险交点</title><desc>误报成本1，漏报成本4。报正风险1-p，报负风险4p，在p=0.2相交。p=0.3时风险0.7与1.2，选择报正少付0.5。</desc><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="34" fill="#233642" text-anchor="start">阈值由两种行动的期望成本相交决定</text><text x="50" y="111" font-size="27" fill="#233642" text-anchor="start">误报成本 1，漏报成本 4；正确行动成本为 0。</text><line x1="130" y1="650" x2="1030" y2="650" stroke="#dce5e9" stroke-width="2"/><text x="112" y="658" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="130" y1="535" x2="1030" y2="535" stroke="#dce5e9" stroke-width="2"/><text x="112" y="543" font-size="24" fill="#687b86" text-anchor="end">1</text><line x1="130" y1="420" x2="1030" y2="420" stroke="#dce5e9" stroke-width="2"/><text x="112" y="428" font-size="24" fill="#687b86" text-anchor="end">2</text><line x1="130" y1="305" x2="1030" y2="305" stroke="#dce5e9" stroke-width="2"/><text x="112" y="313" font-size="24" fill="#687b86" text-anchor="end">3</text><line x1="130" y1="190" x2="1030" y2="190" stroke="#dce5e9" stroke-width="2"/><text x="112" y="198" font-size="24" fill="#687b86" text-anchor="end">4</text><text x="130" y="692" font-size="24" fill="#687b86" text-anchor="middle">0</text><text x="310.0" y="692" font-size="24" fill="#687b86" text-anchor="middle">0.2</text><text x="400.0" y="692" font-size="24" fill="#687b86" text-anchor="middle">0.3</text><text x="580.0" y="692" font-size="24" fill="#687b86" text-anchor="middle">0.5</text><text x="1030" y="692" font-size="24" fill="#687b86" text-anchor="middle">1</text><polyline points="130.000,535.000 1030.000,650.000" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><polyline points="130.000,650.000 1030.000,190.000" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><polyline points="130.000,650.000 310.000,558.000 1030.000,650.000" fill="none" stroke="#233642" stroke-width="7" stroke-linejoin="round"/><line x1="310.0" y1="558.0" x2="310.0" y2="650" stroke="#687b86" stroke-width="2" stroke-dasharray="5 7"/><text x="520" y="219" font-size="29" fill="#bc5b31" text-anchor="start">报负：4p</text><text x="770" y="574" font-size="29" fill="#246d91" text-anchor="start">报正：1 − p</text><text x="130" y="167" font-size="26" fill="#687b86" text-anchor="start">期望成本</text><circle cx="400.0" cy="569.5" r="8" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="400.0" cy="512.0" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><line x1="400.0" y1="569.5" x2="400.0" y2="512.0" stroke="#233642" stroke-width="3"/><text x="550" y="515" font-size="27" fill="#233642" text-anchor="start">p = 0.3：1.2 − 0.7 = 0.5</text><line x1="409.0" y1="540.75" x2="535" y2="518" stroke="#687b86" stroke-width="2"/><text x="550" y="744" font-size="27" fill="#233642" text-anchor="middle">真实正类概率 p</text><text x="50" y="807" font-size="26" fill="#687b86" text-anchor="start">粗线：可达到的最低成本。交点 p = 0.2，两种行动成本相同。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>验证选择与选择后的乐观偏差</title><desc>上图给出六个复杂度的受控训练和验证误差。下图对两个真实风险均为0.5的候选枚举四个等可能验证噪声组合，最小验证值均值为0.45。</desc><rect width="1200" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="35" fill="#233642" text-anchor="start">验证集选择模型，也会被选择过程适应</text><text x="50" y="108" font-size="26" fill="#687b86" text-anchor="start">六个候选共享同一划分；下方另用两候选说明选择偏差。</text><line x1="140" y1="445.0" x2="1040" y2="445.0" stroke="#dce5e9" stroke-width="2"/><text x="122" y="453.0" font-size="24" fill="#687b86" text-anchor="end">0.1</text><line x1="140" y1="375.0" x2="1040" y2="375.0" stroke="#dce5e9" stroke-width="2"/><text x="122" y="383.0" font-size="24" fill="#687b86" text-anchor="end">0.3</text><line x1="140" y1="305.0" x2="1040" y2="305.0" stroke="#dce5e9" stroke-width="2"/><text x="122" y="313.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><line x1="140" y1="235.00000000000003" x2="1040" y2="235.00000000000003" stroke="#dce5e9" stroke-width="2"/><text x="122" y="243.00000000000003" font-size="24" fill="#687b86" text-anchor="end">0.7</text><line x1="140" y1="165.0" x2="1040" y2="165.0" stroke="#dce5e9" stroke-width="2"/><text x="122" y="173.0" font-size="24" fill="#687b86" text-anchor="end">0.9</text><polyline points="140.000,200.000 320.000,287.500 500.000,340.000 680.000,382.000 860.000,417.000 1040.000,445.000" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="200.0" r="7" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="320" cy="287.5" r="7" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="500" cy="340.0" r="7" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="680" cy="382.0" r="7" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="860" cy="417.0" r="7" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="1040" cy="445.0" r="7" fill="#246d91" stroke="white" stroke-width="2"/><polyline points="140.000,182.500 320.000,252.500 500.000,298.000 680.000,312.000 860.000,287.500 1040.000,224.500" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="182.5" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="320" cy="252.5" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="500" cy="298.0" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="680" cy="312.0" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="860" cy="287.5" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="1040" cy="224.5" r="7" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="140" y="517" font-size="24" fill="#687b86" text-anchor="middle">1</text><text x="320" y="517" font-size="24" fill="#687b86" text-anchor="middle">2</text><text x="500" y="517" font-size="24" fill="#687b86" text-anchor="middle">3</text><text x="680" y="517" font-size="24" fill="#687b86" text-anchor="middle">4</text><text x="860" y="517" font-size="24" fill="#687b86" text-anchor="middle">5</text><text x="1040" y="517" font-size="24" fill="#687b86" text-anchor="middle">6</text><text x="590" y="557" font-size="27" fill="#233642" text-anchor="middle">模型复杂度</text><text x="50" y="145" font-size="25" fill="#687b86" text-anchor="start">误差</text><text x="875" y="158" font-size="27" fill="#bc5b31" text-anchor="start">验证</text><text x="875" y="194" font-size="27" fill="#246d91" text-anchor="start">训练</text><line x1="680" y1="324.0" x2="680" y2="490" stroke="#bc5b31" stroke-width="2" stroke-dasharray="5 7"/><text x="730" y="245" font-size="27" fill="#bc5b31" text-anchor="start">选 4：0.48</text><line x1="690" y1="305" x2="718" y2="252" stroke="#bc5b31" stroke-width="2"/><line x1="50" y1="594" x2="1150" y2="594" stroke="#dce5e9" stroke-width="2"/><text x="50" y="639" font-size="28" fill="#233642" text-anchor="start">两个真实风险都为 0.5 的候选，验证噪声各为 
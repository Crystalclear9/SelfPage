<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="623" viewBox="0 0 1340 623" role="img" aria-labelledby="title desc"><title id="title">正则化约束与稀疏解的几何</title><desc id="desc">二维约束截面。对同一个无约束最优点做欧氏投影，L2 解两坐标非零，L1 解为顶点 (1,0)。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1340" height="623" fill="white" stroke="none" stroke-width="1.55"/><text x="309" y="63" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">L2 圆形截面</text><line x1="142.75" y1="382" x2="576.5" y2="382" stroke="#657682" stroke-width="1.45" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="309" y1="532" x2="309" y2="182" stroke="#657682" stroke-width="1.45" stroke-linecap="round" marker-end="url(#arrow-gray)"/><circle cx="309" cy="382" r="125" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="534" cy="300.75" r="54.82596" stroke="#655184" stroke-width="1.7" fill="none"/><circle cx="534" cy="300.75" r="84.52335" stroke="#655184" stroke-width="1.7" fill="none"/><circle cx="534" cy="300.75" r="114.2207" stroke="#655184" stroke-width="1.7" fill="none"/><circle cx="534" cy="300.75" r="5.5" stroke="#655184" stroke-width="1.7" fill="#655184"/><circle cx="426.5692" cy="339.5444" r="8" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><text x="309" y="562" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">接触点不在坐标轴上</text><text x="939" y="63" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">L1 菱形截面</text><line x1="772.75" y1
ize="24" fill="#217292" text-anchor="start">0.15</text><text x="520" y="485.0" font-size="24" fill="#217292" text-anchor="start">容易组</text><path d="M160.00,300.00 L500.00,265.00" fill="none" stroke="#bd6c41" stroke-width="4"/><circle cx="160" cy="300.0" r="7" fill="#bd6c41"/><text x="172" y="285.0" font-size="24" fill="#bd6c41" text-anchor="start">0.4</text><circle cx="500" cy="265.0" r="7" fill="#bd6c41"/><text x="512" y="250.0" font-size="24" fill="#bd6c41" text-anchor="start">0.45</text><text x="520" y="275.0" font-size="24" fill="#bd6c41" text-anchor="start">困难组</text><path d="M160.00,342.00 L500.00,433.00" fill="none" stroke="#1c2e40" stroke-width="4"/><circle cx="160" cy="342.0" r="7" fill="#1c2e40"/><text x="172" y="377.0" font-size="24" fill="#1c2e40" text-anchor="start">0.34</text><circle cx="500" cy="433.0" r="7" fill="#1c2e40"/><text x="440" y="410" font-size="24" fill="#1c2e40" text-anchor="start">0.21</text><text x="520" y="443.0" font-size="24" fill="#1c2e40" text-anchor="start">实际总体</text><text x="160" y="625" font-size="25" fill="#1c2e40" text-anchor="middle">旧环境</text><text x="500" y="625" font-size="25" fill="#1c2e40" text-anchor="middle">新环境</text><text x="735" y="185" font-size="25" fill="#1c2e40" text-anchor="start">错误率贡献 = 组占比 × 组内率</text><text x="735" y="360" font-size="26" fill="#1c2e40" text-anchor="start">旧</text><rect x="790" y="330" width="17.0" height="50" fill="#217292"/><text x="798.5" y="318" font-size="24" fill="#217292" text-anchor="middle">0.02</text><rect x="807.0" y="330" width="272.0" height="50" fill="#bd6c41"/><text x="943.0" y="318" font-size="24" fill="#bd6c41" text-anchor="middle">0.32</text><text x="1099.0" y="363" font-size="24" fill="#1c2e40" text-anchor="start">总和 0.34</text><text x="735" y="530" font-size="26" fill="#1c2e40" text-anchor="start">新</text><rect x="790" y="500" width="102.0" height="50" fill="#217292"/><text x="841.0" y="488" font-size="24" fill="#217292" text-anchor="middle">0.12</text><rect x="892.0" y="
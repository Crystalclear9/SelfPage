<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img"><title>两组错误率都上升，总体错误率为什么反而下降？</title><rect width="1280" height="930" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">两组错误率都上升，总体错误率为什么反而下降？</text><text x="70" y="120" font-size="25" fill="#183944" text-anchor="start">同一批次定义与成熟标签；容易组占比由 0.2 变为 0.8，困难组由 0.8 变为 0.2</text><text x="85" y="185" font-size="27" fill="#183944" text-anchor="start">组内错误率与实际总体错误率</text><line x1="160" y1="580" x2="500" y2="580" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="140" y="588" font-size="24" fill="#183944" text-anchor="end">0</text><line x1="160" y1="440.0" x2="500" y2="440.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="140" y="448.0" font-size="24" fill="#183944" text-anchor="end">0.2</text><line x1="160" y1="300.0" x2="500" y2="300.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="140" y="308.0" font-size="24" fill="#183944" text-anchor="end">0.4</text><path d="M160.00,510.00 L500.00,475.00" fill="none" stroke="#246b82" stroke-width="4"/><circle cx="160" cy="510.0" r="7" fill="#246b82"/><text x="172" y="535.0" font-size="24" fill="#246b82" text-anchor="start">0.1</text><circle cx="500" cy="475.0" r="7" fill="#246b82"/><text x="440" y="500" font-size="24" fill="#246b82" text-anchor="start">0.15</text><text x="520" y="485.0" font-size="24" fill="#246b82" text-anchor="start">容易组</text><path d="M160.00,300.00 L500.00,265.00" fill="none" stroke="#c0673e" stroke-width="4"/><circle cx="160" cy="300.0" r="7" fill="#c0673e"/><text x="172" y="285.0" font-size="24" fill="#c0673e" text-anchor="start">0.4</text><circle cx="500" cy="265.0" r="7" fill="#c0673e"/><text x="512" y="250.0" font-size="24" fill="#c0673e" text-anchor="start">0.45</text><text x="520" y="275.0" font-size="24" fill="#c0673e" text-anchor="start">困难组</text><path d="M160.00,342.00 L500.00,433.00" fill="none" stroke="#183944" stroke-width="4"/><circle cx="160" cy="342.0" r="7" fill="#183944"/><text x="172" y="377.0" font-size="24" fill="#183944" text-anchor="start">0.34</text><circle cx="500" cy="433.0" r="7" fill="#183944"/><text x="440" y="410" font-size="24" fill="#183944" text-anchor="start">0.21</text><text x="520" y="443.0" font-size="24" fill="#183944" text-anchor="start">实际总体</text><text x="160" y="625" font-size="25" fill="#183944" text-anchor="middle">旧环境</text><text x="500" y="625" font-size="25" fill="#183944" text-anchor="middle">新环境</text><text x="735" y="185" font-size="25" fill="#183944" text-anchor="start">错误率贡献 = 组占比 × 组内率</text><text x="735" y="360" font-size="26" fill="#183944" text-anchor="start">旧</text><rect x="790" y="330" width="17.0" height="50" fill="#246b82"/><text x="798.5" y="318" font-size="24" fill="#246b82" text-anchor="middle">0.02</text><rect x="807.0" y="330" width="272.0" height="50" fill="#c0673e"/><text x="943.0" y="318" font-size="24" fill="#c0673e" text-anchor="middle">0.32</text><text x="1099.0" y="363" font-size="24" fill="#183944" text-anchor="start">总和 0.34</text><text x="735" y="530" font-size="26" fill="#183944" text-anchor="start">新</text><rect x="790" y="500" width="102.0" height="50" fill="#246b82"/><text x="841.0" y="488" font-size="24" fill="#246b82" text-anchor="middle">0.12</text><rect x="892.0" y="500" width="76.5" height="50" fill="#c0673e"/><text x="930.25" y="488" font-size="24" fill="#c0673e" text-anchor="middle">0.09</text><text x="988.5" y="533" font-size="24" fill="#183944" text-anchor="start">总和 0.21</text><text x="70" y="700" font-size="27" fill="#183944" text-anchor="start">固定旧组成后：总体 0.34 → 0.39，显示同类对象确实退化</text><line x1="160" y1="804.0" x2="600" y2="784.0" stroke="#c0673e" stroke-width="4" stroke-dasharray=""/><line x1="600" y1="784.0" x2="1040" y2="856.0" stroke="#246b82" stroke-width="4" stroke-dasharray=""/><circle cx="160" cy="804.0" r="7" fill="#183944"/><text x="160" y="784.0" font-size="25" fill="#183944" text-anchor="middle">0.34</text><text x="160" y="906" font-size="24" fill="#183944" text-anchor="middle">旧结果</text><circle cx="600" cy="784.0" r="7" fill="#183944"/><text x="600" y="764.0" font-size="25" fill="#183944" text-anchor="middle">0.39</text><text x="600" y="906" font-size="24" fill="#183944" text-anchor="middle">仅换组内率</text><circle cx="1040" cy="856.0" r="7" fill="#183944"/><text x="1040" y="836.0" font-size="25" fill="#183944" text-anchor="middle">0.21</text><text x="1040" y="906" font-size="24" fill="#183944" text-anchor="middle">再换组占比</text><text x="360" y="826" font-size="25" fill="#c0673e" text-anchor="start">+0.05</text><text x="820" y="806" font-size="25" fill="#246b82" text-anchor="start">−0.18</text></g></svg>

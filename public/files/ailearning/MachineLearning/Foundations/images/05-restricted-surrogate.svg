<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>受限模型族的交叉熵与分类错误率比较</title><rect width="1280" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="48" fill="#213447" font-size="34" text-anchor="start" font-weight="700">受限模型族：同一候选，两个风险给出不同排序</text><text x="40" y="92" fill="#627689" font-size="26" text-anchor="start" font-weight="400">两个输入等概率出现；只允许 A 与 B 两个候选，按 0.5 阈值分类</text><text x="40" y="145" fill="#213447" font-size="28" text-anchor="start" font-weight="700">输入 x1：真实正类概率 0.90</text><rect x="95" y="215" width="480" height="175" fill="#f5f8fa" rx="0"/><line x1="95" y1="390" x2="575" y2="390" stroke="#dce5ed" stroke-width="2"/><text x="83" y="399" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0</text><line x1="95" y1="302.5" x2="575" y2="302.5" stroke="#627689" stroke-width="2" stroke-dasharray="6 6"/><text x="83" y="311.5" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0.5</text><line x1="95" y1="215" x2="575" y2="215" stroke="#dce5ed" stroke-width="2"/><text x="83" y="224" fill="#627689" font-size="24" text-anchor="end" font-weight="400">1</text><text x="95" y="195" fill="#627689" font-size="24" text-anchor="start" font-weight="400">预测正类概率</text><rect x="150" y="300.75" width="90" height="89.25" fill="#2865a0" rx="0"/><text x="195" y="286.75" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.51</text><text x="195" y="425" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">A</text><rect x="370" y="232.5" width="90" height="157.5" fill="#c87536" rx="0"/><text x="415" y="218.5" fill="#c87536" font-size="28" text-anchor="middle" font-weight="700">0.90</text><text x="415" y="425" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">B</text><text x="40" y="478" fill="#478574" font-size="26" text-anchor="start" font-weight="400">A：判正；B：判正</text><text x="670" y="145" fill="#213447" font-size="28" text-anchor="start" font-weight="700">输入 x2：真实正类概率 0.10</text><rect x="725" y="215" width="480" height="175" fill="#f5f8fa" rx="0"/><line x1="725" y1="390" x2="1205" y2="390" stroke="#dce5ed" stroke-width="2"/><text x="713" y="399" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0</text><line x1="725" y1="302.5" x2="1205" y2="302.5" stroke="#627689" stroke-width="2" stroke-dasharray="6 6"/><text x="713" y="311.5" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0.5</text><line x1="725" y1="215" x2="1205" y2="215" stroke="#dce5ed" stroke-width="2"/><text x="713" y="224" fill="#627689" font-size="24" text-anchor="end" font-weight="400">1</text><text x="725" y="195" fill="#627689" font-size="24" text-anchor="start" font-weight="400">预测正类概率</text><rect x="780" y="304.25" width="90" height="85.75" fill="#2865a0" rx="0"/><text x="825" y="290.25" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="700">0.49</text><text x="825" y="425" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">A</text><rect x="1000" y="300.75" width="90" height="89.25" fill="#c87536" rx="0"/><text x="1045" y="286.75" fill="#c87536" font-size="28" text-anchor="middle" font-weight="700">0.51</text><text x="1045" y="425" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">B</text><text x="670" y="478" fill="#c87536" font-size="26" text-anchor="start" font-weight="400">A：判负；B：判正（跨过阈值）</text><line x1="40" y1="512" x2="1240" y2="512" stroke="#dce5ed" stroke-width="2"/><text x="40" y="560" fill="#213447" font-size="28" text-anchor="start" font-weight="700">总体交叉熵：越低越好</text><text x="55" y="630" fill="#2865a0" font-size="28" text-anchor="start" font-weight="400">A</text><rect x="105" y="600" width="330.20568749999995" height="42" fill="#2865a0" rx="0"/><text x="450.20568749999995" y="631" fill="#2865a0" font-size="26" text-anchor="start" font-weight="400">0.677345</text><text x="55" y="710" fill="#c87536" font-size="28" text-anchor="start" font-weight="400">B</text><rect x="105" y="680" width="252.14279999999997" height="42" fill="#c87536" rx="0"/><text x="372.14279999999997" y="711" fill="#c87536" font-size="26" text-anchor="start" font-weight="400">0.517216</text><text x="40" y="805" fill="#c87536" font-size="30" text-anchor="start" font-weight="700">选择 B</text><text x="670" y="560" fill="#213447" font-size="28" text-anchor="start" font-weight="700">总体错误率：越低越好</text><text x="685" y="630" fill="#2865a0" font-size="28" text-anchor="start" font-weight="400">A</text><rect x="735" y="600" width="48.75" height="42" fill="#2865a0" rx="0"/><text x="798.75" y="631" fill="#2865a0" font-size="26" text-anchor="start" font-weight="400">0.1</text><text x="685" y="710" fill="#c87536" font-size="28" text-anchor="start" font-weight="400">B</text><rect x="735" y="680" width="243.75" height="42" fill="#c87536" rx="0"/><text x="993.75" y="711" fill="#c87536" font-size="26" text-anchor="start" font-weight="400">0.5</text><text x="670" y="805" fill="#2865a0" font-size="30" text-anchor="start" font-weight="700">选择 A</text><text x="40" y="862" fill="#627689" font-size="27" text-anchor="start" font-weight="400">A 已给出贝叶斯分类决策；B 改善概率评分，却使第二个输入偏离贝叶斯决策。</text></g></svg>
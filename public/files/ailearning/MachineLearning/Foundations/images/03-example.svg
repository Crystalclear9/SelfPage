<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img"><title>填补与缺失指示的几何含义</title><desc>仅填零使真实零A与缺测B重合，增加缺失指示后，A位于(0,0)，B位于(0,1)，C位于(5,0)。不同潜在真值仍会映射到同一缺测表示。</desc><rect width="1200" height="870" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="35" fill="#233642" text-anchor="start">缺失指示恢复测量状态，不恢复真值</text><text x="50" y="114" font-size="28" fill="#233642" text-anchor="start">A：实测 0       B：没有测量       C：实测 5</text><text x="50" y="185" font-size="28" fill="#233642" text-anchor="start">只填零：A 与 B 重合</text><line x1="100" y1="280" x2="1080" y2="280" stroke="#687b86" stroke-width="2"/><circle cx="150" cy="280" r="12" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="150" y="244" font-size="28" fill="#bc5b31" text-anchor="middle">A、B</text><circle cx="1000" cy="280" r="12" fill="#246d91" stroke="white" stroke-width="2"/><text x="1000" y="244" font-size="28" fill="#246d91" text-anchor="middle">C</text><text x="150" y="323" font-size="26" fill="#687b86" text-anchor="middle">0</text><text x="1000" y="323" font-size="26" fill="#687b86" text-anchor="middle">5</text><text x="1090" y="323" font-size="25" fill="#687b86" text-anchor="start">数值</text><line x1="50" y1="363" x2="1150" y2="363" stroke="#dce5e9" stroke-width="2"/><text x="50" y="415" font-size="28" fill="#233642" text-anchor="start">再增加一维：是否缺失</text><line x1="150" y1="700" x2="690" y2="700" stroke="#687b86" stroke-width="2"/><line x1="150" y1="700" x2="150" y2="470" stroke="#687b86" stroke-width="2"/><text x="105" y="478" font-size="25" fill="#687b86" text-anchor="end">缺失</text><text x="128" y="708" font-size="24" fill="#687b86" text-anchor="end">0</text><text x="128" y="518" font-size="24" fill="#687b86" text-anchor="end">1</text><text x="150" y="741" font-size="24" fill="#687b86" text-anchor="middle">0</text><text x="650" y="741" font-size="24" fill="#687b86" text-anchor="middle">5</text><circle cx="150" cy="700" r="10" fill="#246d91" stroke="white" stroke-width="2"/><text x="170" y="680" font-size="26" fill="#246d91" text-anchor="start">A (0, 0)</text><circle cx="150" cy="510" r="10" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="170" y="490" font-size="26" fill="#bc5b31" text-anchor="start">B (0, 1)</text><circle cx="650" cy="700" r="10" fill="#246d91" stroke="white" stroke-width="2"/><text x="640" y="678" font-size="26" fill="#246d91" text-anchor="end">C (5, 0)</text><text x="695" y="740" font-size="25" fill="#687b86" text-anchor="start">填补数值</text><text x="795" y="484" font-size="28" fill="#bc5b31" text-anchor="start">B 的真实数值？</text><text x="795" y="542" font-size="26" fill="#233642" text-anchor="start">可能为 1，也可能为 10</text><text x="795" y="592" font-size="26" fill="#233642" text-anchor="start">两种情况都没有被测量</text><text x="795" y="642" font-size="26" fill="#233642" text-anchor="start">可见特征同为 (0, 1)</text><text x="50" y="820" font-size="26" fill="#687b86" text-anchor="start">保留“未测量”这一事实，仍需要其他信息或假设才能推断缺失值。</text></g></svg>

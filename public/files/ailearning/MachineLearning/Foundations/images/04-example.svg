<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>组成混杂如何反转行动比较</title><desc>低风险组行动0/1成功率为0.8/0.9，高风险组为0.2/0.3。观察分组混杂使总体成功率变为0.74与0.36；统一到两组各半总体后为0.5与0.6。</desc><rect width="1200" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="35" fill="#233642" text-anchor="start">组内都提升，汇总为什么反而下降？</text><text x="50" y="113" font-size="28" fill="#233642" text-anchor="start">成功概率：低风险 0.8 → 0.9；高风险 0.2 → 0.3</text><text x="50" y="166" font-size="25" fill="#687b86" text-anchor="start">蓝：低风险组贡献     橙：高风险组贡献     灰：其余未成功</text><text x="50" y="236" font-size="29" fill="#233642" text-anchor="start">观察数据：两种行动来自不同人群</text><text x="50" y="348" font-size="27" fill="#233642" text-anchor="start">行动 0</text><rect x="205" y="321" width="760" height="42" fill="#edf1f3"/><rect x="205" y="321" width="547.2" height="42" fill="#246d91"/><rect x="752.2" y="321" width="15.2" height="42" fill="#bc5b31"/><text x="1000" y="353" font-size="31" fill="#233642" text-anchor="start">0.74</text><text x="205" y="405" font-size="25" fill="#687b86" text-anchor="start">低风险 900 人 × .8 + 高风险 100 人 × .2 = 740 人</text><text x="50" y="473" font-size="27" fill="#233642" text-anchor="start">行动 1</text><rect x="205" y="446" width="760" height="42" fill="#edf1f3"/><rect x="205" y="446" width="68.4" height="42" fill="#246d91"/><rect x="273.4" y="446" width="205.2" height="42" fill="#bc5b31"/><text x="1000" y="478" font-size="31" fill="#233642" text-anchor="start">0.36</text><text x="205" y="530" font-size="25" fill="#687b86" text-anchor="start">低风险 100 人 × .9 + 高风险 900 人 × .3 = 360 人</text><text x="50" y="607" font-size="29" fill="#233642" text-anchor="start">统一人群：两种行动都按低、高风险各半计算</text><text x="50" y="719" font-size="27" fill="#233642" text-anchor="start">行动 0</text><rect x="205" y="692" width="760" height="42" fill="#edf1f3"/><rect x="205" y="692" width="304.0" height="42" fill="#246d91"/><rect x="509.0" y="692" width="76.0" height="42" fill="#bc5b31"/><text x="1000" y="724" font-size="31" fill="#233642" text-anchor="start">0.50</text><text x="205" y="776" font-size="25" fill="#687b86" text-anchor="start">低风险 500 人 × .8 + 高风险 500 人 × .2 = 500 人</text><text x="50" y="844" font-size="27" fill="#233642" text-anchor="start">行动 1</text><rect x="205" y="817" width="760" height="42" fill="#edf1f3"/><rect x="205" y="817" width="342.0" height="42" fill="#246d91"/><rect x="547.0" y="817" width="114.0" height="42" fill="#bc5b31"/><text x="1000" y="849" font-size="31" fill="#233642" text-anchor="start">0.60</text><text x="205" y="901" font-size="25" fill="#687b86" text-anchor="start">低风险 500 人 × .9 + 高风险 500 人 × .3 = 600 人</text><line x1="50" y1="547" x2="1150" y2="547" stroke="#dce5e9" stroke-width="2"/><text x="50" y="952" font-size="25" fill="#687b86" text-anchor="start">按每组 1000 人计算期望人数；随机分配使两种行动面向相同总体。</text></g></svg>

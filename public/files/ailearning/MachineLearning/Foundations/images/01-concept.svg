<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>合法输入取决于何时可查询，不能只看事件日期</title><rect width="1280" height="840" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">合法输入取决于何时可查询，不能只看事件日期</text><text x="60" y="112" font-size="25" fill="#71858b" text-anchor="start">空心点：事件发生；实心点：系统可查询；预测必须在第 0 天作出</text><rect x="300" y="160" width="510" height="340" fill="#f1f7f8"/><line x1="810" y1="155" x2="810" y2="510" stroke="#c0673e" stroke-width="3" stroke-dasharray="7 7"/><text x="810" y="145" font-size="26" fill="#c0673e" text-anchor="middle">预测时点</text><text x="60" y="248" font-size="28" fill="#183944" text-anchor="start">行为记录</text><line x1="300" y1="240" x2="470" y2="240" stroke="#246b82" stroke-width="5" stroke-dasharray=""/><circle cx="300" cy="240" r="9" fill="white" stroke="#246b82" stroke-width="3"/><circle cx="470" cy="240" r="7" fill="#246b82"/><text x="492" y="248" font-size="26" fill="#246b82" text-anchor="start">可用</text><text x="60" y="348" font-size="28" fill="#183944" text-anchor="start">交易记录</text><line x1="640" y1="340" x2="725.0" y2="340" stroke="#246b82" stroke-width="5" stroke-dasharray=""/><circle cx="640" cy="340" r="9" fill="white" stroke="#246b82" stroke-width="3"/><circle cx="725.0" cy="340" r="7" fill="#246b82"/><text x="747.0" y="348" font-size="26" fill="#246b82" text-anchor="start">可用</text><text x="60" y="448" font-size="28" fill="#183944" text-anchor="start">审核结论</text><line x1="640" y1="440" x2="980" y2="440" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><circle cx="640" cy="440" r="9" fill="white" stroke="#c0673e" stroke-width="3"/><circle cx="980" cy="440" r="7" fill="#c0673e"/><text x="1002" y="448" font-size="26" fill="#c0673e" text-anchor="start">未来才可用</text><text x="300" y="550" font-size="25" fill="#71858b" text-anchor="middle">-3</text><text x="470" y="550" font-size="25" fill="#71858b" text-anchor="middle">-2</text><text x="640" y="550" font-size="25" fill="#71858b" text-anchor="middle">-1</text><text x="810" y="550" font-size="25" fill="#71858b" text-anchor="middle">0</text><text x="980" y="550" font-size="25" fill="#71858b" text-anchor="middle">1</text><text x="60" y="610" font-size="28" fill="#183944" text-anchor="start">审核描述过去的交易，却在预测以后才可查询，因此必须排除。</text><line x1="60" y1="650" x2="1220" y2="650" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="60" y="700" font-size="29" fill="#183944" text-anchor="start">同一可见历史 → 同一预测</text><text x="60" y="752" font-size="25" fill="#183944" text-anchor="start">若两人的合法信息完全相同而未来结果分别为 0、1，模型不能偷读未来。</text><text x="60" y="798" font-size="25" fill="#183944" text-anchor="start">在这个等概率算例中，最佳概率预测均为 0.5；不确定性来自信息边界。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img"><title>t-SNE 的移动来自吸引与归一化排斥的相加</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">t-SNE 的移动来自吸引与归一化排斥的相加</text><text x="60" y="112" font-size="25" fill="#71858b" text-anchor="start">同一组三点 y = (0, 1, 3)；下面只做一次步长 0.5 的标准梯度更新</text><line x1="160" y1="250" x2="1160" y2="250" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><circle cx="260.0" cy="250" r="7" fill="#246b82"/><text x="260.0" y="205" font-size="27" fill="#246b82" text-anchor="middle">点 1：0</text><text x="60" y="345" font-size="25" fill="#183944" text-anchor="start">吸引梯度</text><text x="260.0" y="345" font-size="29" fill="#246b82" text-anchor="middle">-0.520</text><text x="60" y="420" font-size="25" fill="#183944" text-anchor="start">排斥梯度</text><text x="260.0" y="420" font-size="29" fill="#c0673e" text-anchor="middle">+0.700</text><text x="60" y="495" font-size="25" fill="#183944" text-anchor="start">总梯度</text><text x="260.0" y="495" font-size="29" fill="#246b82" text-anchor="middle">+0.180</text><line x1="260.0" y1="550" x2="237.5" y2="550" stroke="#246b82" stroke-width="4" stroke-dasharray=""/><path d="M249.5,542 L237.5,550 L249.5,558" fill="none" stroke="#246b82" stroke-width="3"/><text x="260.0" y="615" font-size="26" fill="#246b82" text-anchor="middle">新位置 -0.0900</text><circle cx="510.0" cy="250" r="7" fill="#246b82"/><text x="510.0" y="205" font-size="27" fill="#246b82" text-anchor="middle">点 2：1</text><text x="510.0" y="345" font-size="29" fill="#246b82" text-anchor="middle">+0.080</text><text x="510.0" y="420" font-size="29" fill="#c0673e" text-anchor="middle">-0.425</text><text x="510.0" y="495" font-size="29" fill="#246b82" text-anchor="middle">-0.345</text><line x1="510.0" y1="550" x2="553.125" y2="550" stroke="#246b82" stroke-width="4" stroke-dasharray=""/><path d="M541.125,542 L553.125,550 L541.125,558" fill="none" stroke="#246b82" stroke-width="3"/><text x="510.0" y="615" font-size="26" fill="#246b82" text-anchor="middle">新位置 1.1725</text><circle cx="1010.0" cy="250" r="7" fill="#246b82"/><text x="1010.0" y="205" font-size="27" fill="#246b82" text-anchor="middle">点 3：3</text><text x="1010.0" y="345" font-size="29" fill="#246b82" text-anchor="middle">+0.440</text><text x="1010.0" y="420" font-size="29" fill="#c0673e" text-anchor="middle">-0.275</text><text x="1010.0" y="495" font-size="29" fill="#246b82" text-anchor="middle">+0.165</text><line x1="1010.0" y1="550" x2="989.375" y2="550" stroke="#246b82" stroke-width="4" stroke-dasharray=""/><path d="M1001.375,542 L989.375,550 L1001.375,558" fill="none" stroke="#246b82" stroke-width="3"/><text x="1010.0" y="615" font-size="26" fill="#246b82" text-anchor="middle">新位置 2.9175</text><text x="60" y="680" font-size="28" fill="#183944" text-anchor="start">更新使用负梯度：点 1 向左，点 2 向右，点 3 向左。</text><text x="60" y="735" font-size="26" fill="#183944" text-anchor="start">完整 KL：0.103487 → 0.035175；三个总梯度之和为 0。</text><text x="60" y="790" font-size="25" fill="#183944" text-anchor="start">忽略归一化分母会漏掉整行排斥项；距离最近的点也不一定继续相互靠近。</text></g></svg>

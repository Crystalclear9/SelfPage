<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>弱桥如何拉动谱坐标：小幅组内变化换取更小跨桥跳跃</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">弱桥如何拉动谱坐标：小幅组内变化换取更小跨桥跳跃</text><text x="60" y="115" font-size="26" fill="#71858b" text-anchor="start">边权定义相似度；节点位置只为排版，谱坐标 f 由图拉普拉斯求出</text><line x1="130" y1="320" x2="280" y2="205" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="130" y1="320" x2="430" y2="320" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="280" y1="205" x2="430" y2="320" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="430" y1="320" x2="770" y2="320" stroke="#c0673e" stroke-width="5" stroke-dasharray=""/><line x1="770" y1="320" x2="920" y2="205" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="770" y1="320" x2="1070" y2="320" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><line x1="920" y1="205" x2="1070" y2="320" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><circle cx="130" cy="320" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="130" y="329" font-size="26" fill="#183944" text-anchor="middle">1</text><text x="130" y="386" font-size="25" fill="#183944" text-anchor="middle">f = +0.2925</text><circle cx="280" cy="205" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="280" y="214" font-size="26" fill="#183944" text-anchor="middle">2</text><text x="280" y="170" font-size="25" fill="#183944" text-anchor="middle">f = +0.2925</text><circle cx="430" cy="320" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="430" y="329" font-size="26" fill="#183944" text-anchor="middle">3</text><text x="430" y="386" font-size="25" fill="#183944" text-anchor="middle">f = +0.2741</text><circle cx="770" cy="320" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="770" y="329" font-size="26" fill="#183944" text-anchor="middle">4</text><text x="770" y="386" font-size="25" fill="#183944" text-anchor="middle">f = -0.2741</text><circle cx="920" cy="205" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="920" y="214" font-size="26" fill="#183944" text-anchor="middle">5</text><text x="920" y="170" font-size="25" fill="#183944" text-anchor="middle">f = -0.2925</text><circle cx="1070" cy="320" r="27" fill="white" stroke="#246b82" stroke-width="3"/><text x="1070" y="329" font-size="26" fill="#183944" text-anchor="middle">6</text><text x="1070" y="386" font-size="25" fill="#183944" text-anchor="middle">f = -0.2925</text><text x="600" y="297" font-size="27" fill="#c0673e" text-anchor="middle">桥权 0.1</text><text x="60" y="450" font-size="27" fill="#183944" text-anchor="start">同一规范化：加权均值为零，f^T D f = 1</text><text x="60" y="500" font-size="26" fill="#71858b" text-anchor="start">能量 = 各无向边的 边权 × 两端谱坐标差的平方</text><text x="60" y="616" font-size="27" fill="#183944" text-anchor="start">两值切分指示</text><rect x="330" y="590" width="0.0" height="42" fill="#246b82"/><rect x="330.0" y="590" width="688.5245901639345" height="42" fill="#c0673e"/><text x="1036.5245901639346" y="619" font-size="27" fill="#183944" text-anchor="start">0.032787</text><text x="330" y="668" font-size="25" fill="#71858b" text-anchor="start">内部 0.000000   +   跨桥 0.032787</text><text x="60" y="736" font-size="27" fill="#183944" text-anchor="start">连续松弛解</text><rect x="330" y="710" width="28.35341741869898" height="42" fill="#246b82"/><rect x="358.353417418699" y="710" width="631.1847549124361" height="42" fill="#c0673e"/><text x="1007.538172331135" y="739" font-size="27" fill="#183944" text-anchor="start">0.031407</text><text x="330" y="788" font-size="25" fill="#71858b" text-anchor="start">内部 0.001350   +   跨桥 0.030056</text><rect x="860" y="456" width="22" height="22" fill="#246b82"/><text x="895" y="478" font-size="25" fill="#246b82" text-anchor="start">组内变化</text><rect x="1050" y="456" width="22
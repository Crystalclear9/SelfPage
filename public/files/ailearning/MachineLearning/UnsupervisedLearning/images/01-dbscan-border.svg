<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">DBSCAN：共享边界点不能连接两个核心簇</title>
  <desc id="desc">上方显示九个样本的真实一维位置和共享边界点的闭邻域，下方仅连接核心点；边界点不合并左右核心簇。</desc>
  <rect width="1200" height="650" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">DBSCAN：共享边界点不能连接两个核心簇</text>
    <text x="35" y="95" font-size="25" fill="#213447" font-weight="400" text-anchor="start">ε = 1；min_samples = 4（计入自身）</text>
    <rect x="250" y="142" width="700" height="100" fill="#fff0e3" />
    <line x1="75.0" y1="200" x2="1125.0" y2="200" stroke="#5a6c7d" stroke-width="2" />
    <circle cx="145.0" cy="200" r="9" fill="#2865a0" />
    <text x="145.0" y="248" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.3</text>
    <circle cx="180.0" cy="200" r="9" fill="#2865a0" />
    <text x="180.0" y="165" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.2</text>
    <circle cx="214.99999999999994" cy="200" r="9" fill="#2865a0" />
    <text x="214.99999999999994" y="248" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.1</text>
    <circle cx="250.0" cy="200" r="9" fill="#2865a0" />
    <text x="250.0" y="140" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <circle cx="600.0" cy="200" r="9" fill="#cf7432" />
    <text x="600.0" y="270" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">0</text>
    <circle cx="950.0" cy="200" r="9" fill="#2865a0" />
    <text x="950.0" y="140" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">1</text>
    <circle cx="985.0" cy="200" r="9" fill="#2865a0" />
    <text x="985.0" y="248" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.1</text>
    <circle cx="1020.0" cy="200" r="9" fill="#2865a0" />
    <text x="1020.0" y="165" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.2</text>
    <circle cx="1055.0" cy="200" r="9" fill="#2865a0" />
    <text x="1055.0" y="248" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.3</text>
    <text x="600" y="120" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">0 的闭邻域：[−1, 1]</text>
    <text x="600" y="315" font-size="27" fill="#cf7432" font-weight="400" text-anchor="middle">只含 −1、0、1，共 3 点：0 不是核心点</text>
    <line x1="35" y1="343" x2="1165" y2="343" stroke="#cad7e2" stroke-width="2" />
    <text x="35" y="388" font-size="26" fill="#213447" font-weight="400" text-anchor="start">核心点图：仅核心点之间的邻接可传递连通</text>
    <line x1="310" y1="455" x2="150" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="150" y1="570" x2="150" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="150" y1="570" x2="310" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="310" y1="570" x2="150" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="310" y1="570" x2="310" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="310" y1="570" x2="150" y2="570" stroke="#2865a0" stroke-width="2" />
    <circle cx="150" cy="455" r="10" fill="#2865a0" />
    <text x="150" y="435" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.3</text>
    <circle cx="310" cy="455" r="10" fill="#2865a0" />
    <text x="310" y="435" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.2</text>
    <circle cx="150" cy="570" r="10" fill="#2865a0" />
    <text x="150" y="550" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1.1</text>
    <circle cx="310" cy="570" r="10" fill="#2865a0" />
    <text x="310" y="550" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">-1</text>
    <line x1="1050" y1="455" x2="890" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="890" y1="570" x2="890" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="890" y1="570" x2="1050" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="1050" y1="570" x2="890" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="1050" y1="570" x2="1050" y2="455" stroke="#2865a0" stroke-width="2" />
    <line x1="1050" y1="570" x2="890" y2="570" stroke="#2865a0" stroke-width="2" />
    <circle cx="890" cy="455" r="10" fill="#2865a0" />
    <text x="890" y="435" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1</text>
    <circle cx="1050" cy="455" r="10" fill="#2865a0" />
    <text x="1050" y="435" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.1</text>
    <circle cx="890" cy="570" r="10" fill="#2865a0" />
    <text x="890" y="550" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.2</text>
    <circle cx="1050" cy="570" r="10" fill="#2865a0" />
    <text x="1050" y="550" font-size="22" fill="#2865a0" font-weight="400" text-anchor="middle">1.3</text>
    <circle cx="600" cy="510" r="11" fill="#cf7432" />
    <text x="600" y="553" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">边界点 0</text>
    <line x1="310" y1="570" x2="587" y2="515" stroke="#cf7432" stroke-width="2" stroke-dasharray="8 6" />
    <line x1="890" y1="455" x2="613" y2="505" stroke="#cf7432" stroke-width="2" stroke-dasharray="8 6" />
    <text x="215" y="625" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">核心簇 1</text>
    <text x="970" y="625" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">核心簇 2</text>
  </g>
</svg>

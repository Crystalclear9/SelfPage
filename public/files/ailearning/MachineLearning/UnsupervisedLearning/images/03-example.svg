<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>从排序中的真标签读出告警工作点</title><desc>六个排序对象，三个异常；增加预算时精确率未必单调。</desc><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="65" font-size="34" fill="#233642" text-anchor="start">先看审到哪些对象，再读精确率与召回率</text><text x="65" y="110" font-size="26" fill="#687b86" text-anchor="start">同一分数排序：橙色是真异常，空心是正常；真实标签已知。</text><circle cx="175" cy="205" r="22" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="175" y="260" font-size="26" fill="#687b86" text-anchor="middle">1</text><circle cx="340" cy="205" r="22" fill="white" stroke="white" stroke-width="2"/><circle cx="340" cy="205" r="22" fill="none" stroke="#687b86" stroke-width="3"/><text x="340" y="260" font-size="26" fill="#687b86" text-anchor="middle">2</text><circle cx="505" cy="205" r="22" fill="white" stroke="white" stroke-width="2"/><circle cx="505" cy="205" r="22" fill="none" stroke="#687b86" stroke-width="3"/><text x="505" y="260" font-size="26" fill="#687b86" text-anchor="middle">3</text><circle cx="670" cy="205" r="22" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="670" y="260" font-size="26" fill="#687b86" text-anchor="middle">4</text><circle cx="835" cy="205" r="22" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="835" y="260" font-size="26" fill="#687b86" text-anchor="middle">5</text><circle cx="1000" cy="205" r="22" fill="white" stroke="white" stroke-width="2"/><circle cx="1000" cy="205" r="22" fill="none" stroke="#687b86" stroke-width="3"/><text x="1000" y="260" font-size="26" fill="#687b86" text-anchor="middle">6</text><text x="65" y="260" font-size="24" fill="#687b86" text-anchor="start">名次</text><line x1="144" y1="290" x2="700" y2="290" stroke="#246d91" stroke-width="4"/><line x1="144" y1="280" x2="144" y2="300" stroke="#246d91" stroke-width="3"/><line x1="700" y1="280" x2="700" y2="300" stroke="#246d91" stroke-width="3"/><text x="425" y="335" font-size="27" fill="#246d91" text-anchor="middle">预算 4：检出 2 个，剩余 1 个</text><text x="110" y="405" font-size="25" fill="#246d91" text-anchor="start">精确率：已审核中有多少是真的</text><line x1="110" y1="690" x2="530" y2="690" stroke="#dce5e9" stroke-width="2"/><text x="92" y="698" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="110" y1="580.0" x2="530" y2="580.0" stroke="#dce5e9" stroke-width="2"/><text x="92" y="588.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><line x1="110" y1="470" x2="530" y2="470" stroke="#dce5e9" stroke-width="2"/><text x="92" y="478" font-size="24" fill="#687b86" text-anchor="end">1</text><circle cx="110" cy="470" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="110" y="730" font-size="24" fill="#687b86" text-anchor="middle">1</text><circle cx="194" cy="580.0" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="194" y="730" font-size="24" fill="#687b86" text-anchor="middle">2</text><circle cx="278" cy="616.6666666666666" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="278" y="730" font-size="24" fill="#687b86" text-anchor="middle">3</text><circle cx="362" cy="580.0" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="362" y="730" font-size="24" fill="#687b86" text-anchor="middle">4</text><circle cx="446" cy="558.0" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="446" y="730" font-size="24" fill="#687b86" text-anchor="middle">5</text><circle cx="530" cy="580.0" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="530" y="730" font-size="24" fill="#687b86" text-anchor="middle">6</text><polyline points="110.000,470.000 194.000,580.000 278.000,616.667 362.000,580.000 446.000,558.000 530.000,580.000" fill="none" stroke="#246d91" stroke-width="3" stroke-linejoin="round"/><text x="320" y="773" font-size="24" fill="#687b86" text-anchor="middle">审核前 k 个对象</text><text x="680" y="405" font-size="25" fill="#bc5b31" text-anchor="start">召回率：全部真异常找到了多少</text><line x1="680" y1="690" x2="1100" y2="690" stroke="#dce5e9" stroke-width="2"/><text x="662" y="698" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="680" y1="580.0" x2="1100" y2="580.0" stroke="#dce5e9" stroke-width="2"/><text x="662" y="588.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><line x1="680" y1="470" x2="1100" y2="470" stroke="#dce5e9" stroke-width="2"/><text x="662" y="478" font-size="24" fill="#687b86" text-anchor="end">1</text><circle cx="680" cy="616.6666666666666" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="680" y="730" font-size="24" fill="#687b86" text-anchor="middle">1</text><circle cx="764" cy="616.6666666666666" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="764" y="730" font-size="24" fill="#687b86" text-anchor="middle">2</text><circle cx="848" cy="616.6666666666666" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="848" y="730" font-size="24" fill="#687b86" text-anchor="middle">3</text><circle cx="932" cy="543.3333333333334" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="932" y="730" font-size="24" fill="#687b86" text-anchor="middle">4</text><circle cx="1016" cy="470" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="1016" y="730" font-size="24" fill="#687b86" text-anchor="middle">5</text><circle cx="1100" cy="470" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="1100" y="730" font-size="24" fill="#687b86" text-anchor="middle">6</text><polyline points="680.000,616.667 764.000,616.667 848.000,616.667 932.000,543.333 1016.000,470.000 1100.000,470.000" fill="none" stroke="#bc5b31" stroke-width="3" stroke-linejoin="round"/><text x="890" y="773" font-size="24" fill="#687b86" text-anchor="middle">审核前 k 个对象</text><text x="65" y="827" font-size="25" fill="#233642" text-anchor="start">预算从 4 增至 5：精确率从 0.5 升至 0.6；增至 6 后又降至 0.5。</text></g></svg>

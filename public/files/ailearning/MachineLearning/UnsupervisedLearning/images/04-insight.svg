<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960.78" viewBox="0 68.297491 1200 960.779570" role="img"><rect id="offline-white-background" x="0" y="68.297491" width="1200" height="960.779570" fill="#ffffff"/><title>簇数越多平方误差越低，但轮廓分数不必越高</title><desc>七点数据全枚举连续分组，真实计算SSE与silhouette。</desc><rect width="1200" height="1030" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="110" font-size="25" fill="#687b86" text-anchor="start">一维数据：0、1、2、8、9、10、30；每个 K 枚举全部连续非空分组。</text><text x="65" y="198" font-size="27" fill="#233642" text-anchor="start">K = 2</text><line x1="220" y1="190" x2="1020" y2="190" stroke="#dce5e9" stroke-width="2"/><circle cx="230" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="230" y="226" font-size="24" fill="#246d91" text-anchor="middle">0</text><circle cx="255" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="255" y="226" font-size="24" fill="#246d91" text-anchor="middle">1</text><circle cx="280" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="280" y="226" font-size="24" fill="#246d91" text-anchor="middle">2</text><circle cx="430" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="430" y="226" font-size="24" fill="#246d91" text-anchor="middle">8</text><circle cx="455" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="455" y="226" font-size="24" fill="#246d91" text-anchor="middle">9</text><circle cx="480" cy="190" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="480" y="226" font-size="24" fill="#246d91" text-anchor="middle">10</text><circle cx="980" cy="190" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="980" y="226" font-size="24" fill="#bc5b31" text-anchor="middle">30</text><text x="1080" y="198" font-size="28" fill="#233642" text-anchor="middle">100</text><text x="1080" y="142" font-size="24" fill="#687b86" text-anchor="middle">SSE</text><text x="65" y="333" font-size="27" fill="#233642" text-anchor="start">K = 3</text><line x1="220" y1="325" x2="1020" y2="325" stroke="#dce5e9" stroke-width="2"/><circle cx="230" cy="325" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="230" y="361" font-size="24" fill="#246d91" text-anchor="middle">0</text><circle cx="255" cy="325" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="255" y="361" font-size="24" fill="#246d91" text-anchor="middle">1</text><circle cx="280" cy="325" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="280" y="361" font-size="24" fill="#246d91" text-anchor="middle">2</text><circle cx="430" cy="325" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="430" y="361" font-size="24" fill="#bc5b31" text-anchor="middle">8</text><circle cx="455" cy="325" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="455" y="361" font-size="24" fill="#bc5b31" text-anchor="middle">9</text><circle cx="480" cy="325" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="480" y="361" font-size="24" fill="#bc5b31" text-anchor="middle">10</text><circle cx="980" cy="325" r="8" fill="#63805d" stroke="white" stroke-width="2"/><text x="980" y="361" font-size="24" fill="#63805d" text-anchor="middle">30</text><text x="1080" y="333" font-size="28" fill="#233642" text-anchor="middle">4</text><text x="65" y="468" font-size="27" fill="#233642" text-anchor="start">K = 4</text><line x1="220" y1="460" x2="1020" y2="460" stroke="#dce5e9" stroke-width="2"/><circle cx="230" cy="460" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="230" y="496" font-size="24" fill="#246d91" text-anchor="middle">0</text><circle cx="255" cy="460" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="255" y="496" font-size="24" fill="#bc5b31" text-anchor="middle">1</text><circle cx="280" cy="460" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="280" y="496" font-size="24" fill="#bc5b31" text-anchor="middle">2</text><circle cx="430" cy="460" r="8" fill="#63805d" stroke="white" stroke-width="2"/><text x="430" y="496" font-size="24" fill="#63805d" text-anchor="middle">8</text><circle cx="455" cy="460" r="8" fill="#63805d" stroke="white" stroke-width="2"/><text x="455" y="496" font-size="24" fill="#63805d" text-anchor="middle">9</text><circle cx="480" cy="460" r="8" fill="#63805d" stroke="white" stroke-width="2"/><text x="480" y="496" font-size="24" fill="#63805d" text-anchor="middle">10</text><circle cx="980" cy="460" r="8" fill="#9c748c" stroke="white" stroke-width="2"/><text x="980" y="496" font-size="24" fill="#9c748c" text-anchor="middle">30</text><text x="1080" y="468" font-size="28" fill="#233642" text-anchor="middle">2.5</text><text x="65" y="590" font-size="28" fill="#246d91" text-anchor="start">全局最小平方误差</text><text x="660" y="590" font-size="28" fill="#bc5b31" text-anchor="start">同一最优分组的平均轮廓分数</text><rect x="83" y="655.0" width="34" height="225.0" fill="#246d91"/><text x="100" y="639.0" font-size="24" fill="#246d91" text-anchor="middle">100</text><text x="100" y="920" font-size="25" fill="#687b86" text-anchor="middle">2</text><rect x="168" y="871.0" width="34" height="9.0" fill="#246d91"/><text x="185" y="855.0" font-size="24" fill="#246d91" text-anchor="middle">4</text><text x="185" y="920" font-size="25" fill="#687b86" text-anchor="middle">3</text><rect x="253" y="874.375" width="34" height="5.625" fill="#246d91"/><text x="270" y="858.375" font-size="24" fill="#246d91" text-anchor="middle">2.5</text><text x="270" y="920" font-size="25" fill="#687b86" text-anchor="middle">4</text><rect x="338" y="877.75" width="34" height="2.25" fill="#246d91"/><text x="355" y="861.75" font-size="24" fill="#246d91" text-anchor="middle">1</text><text x="355" y="920" font-size="25" fill="#687b86" text-anchor="middle">5</text><rect x="423" y="878.875" width="34" height="1.125" fill="#246d91"/><text x="440" y="862.875" font-size="24" fill="#246d91" text-anchor="middle">0.5</text><text x="440" y="920" font-size="25" fill="#687b86" text-anchor="middle">6</text><line x1="65" y1="880" x2="475" y2="880" stroke="#687b86" stroke-width="2"/><text x="270" y="958" font-size="25" fill="#687b86" text-anchor="middle">簇数 K</text><rect x="693" y="691.8252591062501" width="34" height="188.17474089374997" fill="#bc5b31"/><text x="710" y="675.8252591062501" font-size="24" fill="#bc5b31" text-anchor="middle">0.669</text><text x="710" y="920" font-size="25" fill="#687b86" text-anchor="middle">2</text><rect x="778" y="679.5854591875" width="34" height="200.41454081249998" fill="#bc5b31"/><text x="795" y="663.5854591875" font-size="24" fill="#bc5b31" text-anchor="middle">0.713</text><text x="795" y="920" font-size="25" fill="#687b86" text-anchor="middle">3</text><rect x="863" y="761.094457" width="34" height="118.90554299999998" fill="#bc5b31"/><text x="880" y="745.094457" font-size="24" fill="#bc5b31" text-anchor="middle">0.423</text><text x="880" y="920" font-size="25" fill="#687b86" text-anchor="middle">4</text><rect x="948" y="839.82142853125" width="34" height="40.17857146874999" fill="#bc5b31"/><text x="965" y="823.82142853125" font-size="24" fill="#bc5b31" text-anchor="middle">0.143</text><text x="965" y="920" font-size="25" fill="#687b86" text-anchor="middle">5</text><rect x="1033" y="859.91071429375" width="34" height="20.08928570625" fill="#bc5b31"/><text x="1050" y="843.91071429375" font-size="24" fill="#bc5b31" text-anchor="middle">0.071</text><text x="1050" y="920" font-size="25" fill="#687b86" text-anchor="middle">6</text><line x1="675" y1="880" x2="1085" y2="880" stroke="#687b86" stroke-width="2"/><text x="880" y="958" font-size="25" fill="#687b86" text-anchor="middle">簇数 K</text><text x="65" y="1005" font-size="25" fill="#233642" text-anchor="start">更多中心能压低 SSE；单点簇的轮廓值约定为 0，并不因此获得“完美得分”。</text></g></svg>

 x="1050" y="843.91071429375" font-size="24" fill="#b96134" text-anchor="middle">0.071</text><text x="1050" y="920" font-size="25" fill="#688493" text-anchor="middle">6</text><line x1="675" y1="880" x2="1085" y2="880" stroke="#688493" stroke-width="2"/><text x="880" y="958" font-size="25" fill="#688493" text-anchor="middle">簇数 K</text><text x="65" y="1005" font-size="25" fill="#1e3247" text-anchor="start">更多中心能压低 SSE；单点簇的轮廓值约定为 0，并不因此获得“完美得分”。</text></g></svg></svg>

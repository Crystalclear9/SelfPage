<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">降维验证：比较同一对象的邻居身份</title>
  <desc id="desc">同一个对象在原空间和投影空间的四个候选邻居中，最近三个分别为ABC与ADC，共同邻居为AC。</desc>
  <rect width="1200" height="620" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">降维验证：比较同一对象的邻居身份</text>
    <text x="35" y="110" font-size="27" fill="#213447" font-weight="400" text-anchor="start">原空间：最近的 3 个是 A、B、C</text>
    <line x1="100" y1="215" x2="1080" y2="215" stroke="#5a6c7d" stroke-width="2" />
    <circle cx="100" cy="215" r="10" fill="#213447" />
    <text x="100" y="190" font-size="27" fill="#213447" font-weight="600" text-anchor="middle">X</text>
    <text x="100" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">0</text>
    <circle cx="335" cy="215" r="10" fill="#2865a0" />
    <text x="335" y="190" font-size="27" fill="#2865a0" font-weight="600" text-anchor="middle">A</text>
    <text x="335" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">1</text>
    <circle cx="570" cy="215" r="10" fill="#cf7432" />
    <text x="570" y="190" font-size="27" fill="#cf7432" font-weight="600" text-anchor="middle">B</text>
    <text x="570" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">2</text>
    <circle cx="805" cy="215" r="10" fill="#2865a0" />
    <text x="805" y="190" font-size="27" fill="#2865a0" font-weight="600" text-anchor="middle">C</text>
    <text x="805" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">3</text>
    <circle cx="1040" cy="215" r="10" fill="#cf7432" />
    <text x="1040" y="190" font-size="27" fill="#cf7432" font-weight="600" text-anchor="middle">D</text>
    <text x="1040" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">4</text>
    <text x="1130" y="255" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="end">距离</text>
    <text x="35" y="350" font-size="27" fill="#213447" font-weight="400" text-anchor="start">投影空间：最近的 3 个是 A、D、C</text>
    <line x1="100" y1="455" x2="1080" y2="455" stroke="#5a6c7d" stroke-width="2" />
    <circle cx="100" cy="455" r="10" fill="#213447" />
    <text x="100" y="430" font-size="27" fill="#213447" font-weight="600" text-anchor="middle">X</text>
    <text x="100" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">0</text>
    <circle cx="288.0" cy="455" r="10" fill="#2865a0" />
    <text x="288.0" y="430" font-size="27" fill="#2865a0" font-weight="600" text-anchor="middle">A</text>
    <text x="288.0" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">0.8</text>
    <circle cx="1040" cy="455" r="10" fill="#cf7432" />
    <text x="1040" y="430" font-size="27" fill="#cf7432" font-weight="600" text-anchor="middle">B</text>
    <text x="1040" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">4</text>
    <circle cx="570" cy="455" r="10" fill="#2865a0" />
    <text x="570" y="430" font-size="27" fill="#2865a0" font-weight="600" text-anchor="middle">C</text>
    <text x="570" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">2</text>
    <circle cx="382.0" cy="455" r="10" fill="#cf7432" />
    <text x="382.0" y="430" font-size="27" fill="#cf7432" font-weight="600" text-anchor="middle">D</text>
    <text x="382.0" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="middle">1.2</text>
    <text x="1130" y="495" font-size="23" fill="#5a6c7d" font-weight="400" text-anchor="end">距离</text>
    <text x="35" y="590" font-size="27" fill="#2865a0" font-weight="400" text-anchor="start">共同邻居 A、C</text>
    <text x="530" y="590" font-size="27" fill="#213447" font-weight="400" text-anchor="start">邻居召回 =</text>
    <text x="739.0" y="568" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text>
    <line x1="715" y1="578" x2="763" y2="578" stroke="#213447" stroke-width="1.5" />
    <text x="739.0" y="607" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">3</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="583.5969" viewBox="0 0 1440 583.5969" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三次重复中对象对是否同簇</title><rect width="1440" height="583.5969" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">三次重复中对象对是否同簇</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="441.5969" viewBox="0 60.0196 1200 394.2829" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="60.019646" width="1200" height="394.282908" fill="#ffffff"/><title>追踪对象关系，不追踪簇的名字</title><desc>三次重复中的对象A和B始终同簇，A和C只在第二次同簇。描边胶囊为组，点为同一批对象。</desc><rect width="1200" height="470" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="102" font-size="26" fill="#7a8f97" text-anchor="start" font-weight="400">三次构造的重复：对象都出现，簇编号可以任意改变</text><text x="190" y="168" font-size="28" fill="#1a2a3b" text-anchor="middle" font-weight="400">第 1 次</text><rect x="68" y="211" width="190" height="88" fill="#dbecef" stroke="none" stroke-width="2"/><circle cx="90" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="90" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">A</text><circle cx="200" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="200" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">B</text><circle cx="310" cy="255" r="12" fill="#bd6a3f" stroke="#bd6a3f" stroke-width="2"/><text x="310" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">C</text><text x="570" y="168" font-size="28" fill="#1a2a3b" text-anchor="middle" font-weight="400">第 2 次</text><rect x="448" y="211" width="300" height="88" fill="#dbecef" stroke="none" stroke-width="2"/><circle cx="470" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="470" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">A</text><circle cx="580" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="580" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">B</text><circle cx="690" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="690" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">C</text><text x="950" y="168" font-size="28" fill="#1a2a3b" text-anchor="middle" font-weight="400">第 3 次</text><rect x="828" y="211" width="190" height="88" fill="#dbecef" stroke="none" stroke-width="2"/><circle cx="850" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="850" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">A</text><circle cx="960" cy="255" r="12" fill="#227292" stroke="#227292" stroke-width="2"/><text x="960" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">B</text><circle cx="1070" cy="255" r="12" fill="#bd6a3f" stroke="#bd6a3f" stroke-width="2"/><text x="1070" y="337" font-size="30" fill="#1a2a3b" text-anchor="middle" font-weight="400">C</text><text x="45" y="418" font-size="30" fill="#227292" text-anchor="start" font-weight="400">A 与 B：3 次同簇 → 1</text><text x="660" y="418" font-size="30" fill="#bd6a3f" text-anchor="start" font-weight="400">A 与 C：1 次同簇 →</text><text x="1053" y="393" font-size="26" fill="#bd6a3f" text-anchor="middle" font-weight="400">1</text><line x1="1032" y1="402" x2="1074" y2="402" stroke="#bd6a3f" stroke-width="2"/><text x="1053" y="433" font-size="26" fill="#bd6a3f" text-anchor="middle" font-weight="400">3</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="736.185" viewBox="0 68.894289 1280 736.184690"><rect id="offline-white-background" x="0" y="68.894289" width="1280" height="736.184690" fill="#ffffff"/><title>样本发生在过去，不等于训练时标签已经成熟</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">第 7.3 节的实际协议：标签在预测日之后 3 天成熟，第 12 天重训。</text><text x="360" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">8</text><text x="465" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">9</text><text x="570" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">10</text><text x="675" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">11</text><text x="780" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">12</text><text x="885" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">13</text><text x="990" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">14</text><text x="1095" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">15</text><text x="1200" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">16</text><text x="44" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">日期</text><line x1="780" y1="220" x2="780" y2="622" stroke="#cc661c" stroke-width="3" stroke-dasharray="8 6"/><text x="44" y="265" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">样本预测日 8</text><line x1="360" y1="255" x2="675" y2="255" stroke="#2676b5" stroke-width="8" stroke-dasharray=""/><circle cx="360" cy="255" r="9" fill="#2676b5" stroke="none"/><circle cx="675" cy="255" r="11" fill="#2676b5" stroke="none"/><text x="1240" y="265" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#2676b5" text-anchor="end" font-weight="400">可训练</text><text x="44" y="337" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">样本预测日 9</text><line x1="465" y1="327" x2="780" y2="327" stroke="#2676b5" stroke-width="8" stroke-dasharray=""/><circle cx="465" cy="327" r="9" fill="#2676b5" stroke="none"/><circle cx="780" cy="327" r="11" fill="#2676b5" stroke="none"/><text x="1240" y="337" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#2676b5" text-anchor="end" font-weight="400">可训练</text><text x="44" y="409" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">样本预测日 10</text><line x1="570" y1="399" x2="885" y2="399" stroke="#a4b4c2" stroke-width="8" stroke-dasharray=""/><circle cx="570" cy="399" r="9" fill="#2676b5" stroke="none"/><circle cx="885" cy="399" r="11" fill="#cc661c" stroke="none"/><text x="1240" y="409" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#cc661c" text-anchor="end" font-weight="400">未成熟</text><text x="44" y="481" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">样本预测日 11</text><line x1="675" y1="471" x2="990" y2="471" stroke="#a4b4c2" stroke-width="8" stroke-dasharray=""/><circle cx="675" cy="471" r="9" fill="#2676b5" stroke="none"/><circle cx="990" cy="471" r="11" fill="#cc661c" stroke="none"/><text x="1240" y="481" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#cc661c" text-anchor="end" font-weight="400">未成熟</text><text x="44" y="553" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">样本预测日 12</text><line x1="780" y1="543" x2="1095" y2="543" stroke="#a4b4c2" stroke-width="8" stroke-dasharray=""/><circle cx="780" cy="543" r="9" fill="#2676b5" stroke="none"/><circle cx="1095" cy="543" r="11" fill="#cc661c" stroke="none"/><text x="1240" y="553" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#cc661c" text-anchor="end" font-weight="400">未成熟</text><text x="44" y="668" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">因此训练最后可用样本为第 9 天；仅筛预测日 &lt; 12 会误收 10、11。</text><text x="44" y="730" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">特征还有另一条边界：第 13 天预测不能使用第 14 天才可用的信息。</text><text x="44" y="780" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#cc661c" text-anchor="start" font-weight="400">等号是否可用取决于当天的处理先后；日级表示不能替代真实提交时刻。</text></svg>

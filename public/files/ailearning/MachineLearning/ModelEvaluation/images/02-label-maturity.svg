<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="743" viewBox="0 0 1200 743" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">时间切分要检查标签成熟，不只检查预测日期</title>
<desc id="fig-desc">预测日与成熟日相隔三天，十二日按先接收当天成熟标签再重训的规则。</desc>
<rect x="0" y="0" width="1200" height="743" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">第 12 天重训，最后可用的是第 9 天的样本</text>
<text x="74" y="107" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">标签在预测后三天成熟。本例约定同一天先接收成熟标签，再重训。</text>
<path d="M652 152 L652 578" fill="none" stroke="#6e618e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="652" y="146" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">重训 12</text>
<text x="74" y="186" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">预测日 8</text>
<path d="M324 179 L570 179" fill="none" stroke="#166d75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="324" cy="179" r="6" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<circle cx="570" cy="179" r="6" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="1020" y="187" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">可训练</text>
<text x="74" y="260" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">预测日 9</text>
<path d="M406 253 L652 253" fill="none" stroke="#166d75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="406" cy="253" r="6" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<circle cx="652" cy="253" r="6" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="1020" y="261" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">可训练</text>
<text x="74" y="334" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">预测日 10</text>
<path d="M488 327 L734 327" fill="none" stroke="#a74d3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="488" cy="327" r="6" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<circle cx="734" cy="327" r="6" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="1020" y="335" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">未成熟</text>
<text x="74" y="408" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">预测日 11</text>
<path d="M570 401 L816 401" fill="none" stroke="#a74d3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="570" cy="401" r="6" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<circle cx="816" cy="401" r="6" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="1020" y="409" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">未成熟</text>
<text x="74" y="482" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">预测日 12</text>
<path d="M652 475 L898 475" fill="none" stroke="#a74d3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="652" cy="475" r="6" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<circle cx="898" cy="475" r="6" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="1020" y="483" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">未成熟</text>
<path d="M310 578 L998 578" fill="none" stroke="#233b4a" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M998 578 L987 583 L987 573 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="324" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">8</text>
<text x="406" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">9</text>
<text x="488" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">10</text>
<text x="570" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">11</text>
<text x="652" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">12</text>
<text x="734" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">13</text>
<text x="816" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">14</text>
<text x="898" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">15</text>
<text x="980" y="611" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">16</text>
<path d="M75 650 L1125 650" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="693" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">第 10、11 天虽然已经过去，标签仍未到达。特征另有独立的可用时间边界。</text>
</svg>

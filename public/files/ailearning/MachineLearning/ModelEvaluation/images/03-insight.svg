<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="890.3469" viewBox="0 0 1440 890.3469" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">固定容量下应按期望净收益而非概率盲目扩容</title><rect width="1440" height="890.3469" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">固定容量下应按期望净收益而非概率盲目扩容</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="748.3469" viewBox="0 61.8331 1200 668.1669" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="61.833123" width="1200" height="668.166877" fill="#ffffff"/><title>多选一个人，累计收益一定更高吗？</title><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="40" y="104" fill="#7d939d" font-size="26" text-anchor="start">按概率从高到低行动；每检出一例收益 1，每次行动成本 0.3</text><circle cx="190" cy="184" r="16" fill="#207494" stroke="#207494" stroke-width="2"/><text x="190" y="193" fill="white" font-size="24" text-anchor="middle">A</text><text x="190" y="244" fill="#1d3043" font-size="28" text-anchor="middle">p = 0.9</text><circle cx="440" cy="184" r="16" fill="#207494" stroke="#207494" stroke-width="2"/><text x="440" y="193" fill="white" font-size="24" text-anchor="middle">B</text><text x="440" y="244" fill="#1d3043" font-size="28" text-anchor="middle">p = 0.7</text><circle cx="690" cy="184" r="16" fill="#207494" stroke="#207494" stroke-width="2"/><text x="690" y="193" fill="white" font-size="24" text-anchor="middle">C</text><text x="690" y="244" fill="#1d3043" font-size="28" text-anchor="middle">p = 0.4</text><circle cx="940" cy="184" r="16" fill="#207494" stroke="#207494" stroke-width="2"/><text x="940" y="193" fill="white" font-size="24" text-anchor="middle">D</text><text x="940" y="244" fill="#1d3043" font-size="28" text-anchor="middle">p = 0.1</text><text x="40" y="318" fill="#1d3043" font-size="28" text-anchor="start">累计期望净收益</text><line x1="80" y1="605" x2="1090" y2="605" stroke="#7d939d" stroke-width="2" stroke-dasharray=""/><line x1="80" y1="605" x2="1090" y2="605" stroke="#e6eaf0" stroke-width="2" stroke-dasharray=""/><text x="65" y="614" fill="#7d939d" font-size="24" text-anchor="end">0</text><line x1="80" y1="500.0" x2="1090" y2="500.0" stroke="#e6eaf0" stroke-width="2" stroke-dasharray=""/><text x="65" y="509.0" fill="#7d939d" font-size="24" text-anchor="end">0.5</text><line x1="80" y1="395" x2="1090" y2="395" stroke="#e6eaf0" stroke-width="2" stroke-dasharray=""/><text x="65" y="404" fill="#7d939d" font-size="24" text-anchor="end">1</text><rect x="148" y="479.0" width="84" height="126.0" fill="#c7e0e8"/><text x="190" y="459.0" fill="#207494" font-size="28" text-anchor="middle">+0.6</text><circle cx="190" cy="479.0" r="6" fill="#207494" stroke="#207494" stroke-width="2"/><text x="243" y="511.0" fill="#1d3043" font-size="26" text-anchor="start">0.6</text><line x1="233" y1="479.0" x2="397" y2="479.0" stroke="#7d939d" stroke-width="2" stroke-dasharray="5 5"/><rect x="398" y="395" width="84" height="84.0" fill="#c7e0e8"/><text x="440" y="375" fill="#207494" font-size="28" text-anchor="middle">+0.4</text><circle cx="440" cy="395" r="6" fill="#207494" stroke="#207494" stroke-width="2"/><text x="493" y="427" fill="#1d3043" font-size="26" text-anchor="start">1.0</text><line x1="483" y1="395" x2="647" y2="395" stroke="#7d939d" stroke-width="2" stroke-dasharray="5 5"/><rect x="648" y="374.0" width="84" height="21.0" fill="#c7e0e8"/><text x="690" y="354.0" fill="#207494" font-size="28" text-anchor="middle">+0.1</text><circle cx="690" cy="374.0" r="6" fill="#207494" stroke="#207494" stroke-width="2"/><text x="743" y="406.0" fill="#1d3043" font-size="26" text-anchor="start">1.1</text><line x1="733" y1="374.0" x2="897" y2="374.0" stroke="#7d939d" stroke-width="2" stroke-dasharray="5 5"/><rect x="898" y="374.0" width="84" height="42.0" fill="#ebc7b2"/><text x="940" y="354.0" fill="#be6d40" font-size="28" text-anchor="middle">−0.2</text><circle cx="940" cy="416.0" r="6" fill="#be6d40" stroke="#be6d40" stroke-width="2"/><text x="993" y="448.0" fill="#1d3043" font-size="26" text-anchor="start">0.9</text><text x="190" y="651" fill="#1d3043" font-size="26" text-anchor="middle">选 A</text><text x="440" y="651" fill="#1d3043" font-size="26" text-anchor="middle">再选 B</text><text x="690" y="651" fill="#1d3043" font-size="26" text-anchor="middle">再选 C</text><text x="940" y="651" fill="#be6d40" font-size="26" text-anchor="middle">再选 D</text><text x="40" y="707" fill="#1d3043" font-size="28" text-anchor="start">允许少于容量上限时，D 的负增益不值得加入。</text></g></svg></svg>

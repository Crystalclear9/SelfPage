<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="689.655" viewBox="0 66.995074 1280 689.655172"><rect id="offline-white-background" x="0" y="66.995074" width="1280" height="689.655172" fill="#ffffff"/><title>支持外没有标签：误差再小，也留下不可消除的风险区间</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="110" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">目标总体：80% 有源域支持，已知风险 10%；20% 没有源标签。</text><rect x="70" y="180" width="800" height="180" rx="0" fill="#edf4f8" stroke="#b7c7d3"/><rect x="70" y="342" width="800" height="18" rx="0" fill="#2676b5" stroke="#b7c7d3"/><rect x="870" y="180" width="200" height="180" rx="0" fill="#fff0df" stroke="#d56b1b"/><text x="470" y="235" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253f52" text-anchor="middle" font-weight="400">覆盖区质量 0.8</text><text x="470" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">已识别贡献 0.8 × 0.1 = 0.08</text><text x="970" y="235" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253f52" text-anchor="middle" font-weight="400">未知区</text><text x="970" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">质量 0.2</text><text x="70" y="405" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">蓝色面积已知；橙色区域的损失可从 0 到 1，缺少标签无法区分。</text><line x1="140" y1="540" x2="1040.0" y2="540" stroke="#a9bac6" stroke-width="3" stroke-dasharray=""/><line x1="140" y1="532" x2="140" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="140" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.00</text><line x1="380.0" y1="532" x2="380.0" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="380.0" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.08</text><line x1="440.0" y1="532" x2="440.0" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="440.0" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.10</text><line x1="740.0" y1="532" x2="740.0" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="740.0" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.20</text><line x1="980.0000000000001" y1="532" x2="980.0000000000001" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="980.0000000000001" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.28</text><line x1="1040.0" y1="532" x2="1040.0" y2="550" stroke="#a8b8c6" stroke-width="2" stroke-dasharray=""/><text x="1040.0" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="middle" font-weight="400">0.30</text><rect x="380.0" y="485" width="600.0000000000001" height="55" rx="0" fill="#ffe2bd" stroke="#d56b1b"/><line x1="380.0" y1="485" x2="380.0" y2="540" stroke="#2676b5" stroke-width="4" stroke-dasharray=""/><text x="680.0" y="520" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">整体风险可取的范围</text><text x="55" y="665" font-family="Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253f52" text-anchor="start" font-weight="400">下界 0.08：未知区全对；上界 0.28：未知区全错。</text><text x="55" y="730" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#586e7c" text-anchor="start" font-weight="400">区间宽度 0.20 来自识别缺口；增加覆盖区样本不会缩小它。</text></svg>

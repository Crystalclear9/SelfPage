<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" role="img" aria-labelledby="title description">
<title id="title">目标总体的已识别风险面积与支持外未知区域共同给出百分之八至二十八的整体风险范围</title>
<desc id="description">覆盖区质量为 0.8，已知条件风险 0.1，贡献 0.08。未知区质量为 0.2，其条件风险可在零与一之间，因此总体风险落在 0.08 与 0.28 之间。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cae6e8"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#fff5f2"/><stop offset="1" stop-color="#f1d2ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f9f6fc"/><stop offset="1" stop-color="#e9deef"/></linearGradient>
<linearGradient id="wash-g" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f3f9f4"/><stop offset="1" stop-color="#d5e9da"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#e8edf1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="576" fill="white" stroke="none" stroke-width="1.7" rx="0"/>
<text x="600" y="60" fill="#202a36" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总体质量一，只有覆盖区的风险已知</text>
<rect x="105" y="126" width="787.2" height="104" fill="url(#wash-t)" stroke="#176b74" stroke-width="1.6" rx="4"/>
<rect x="892.2" y="126" width="196.8" height="104" fill="url(#wash-c)" stroke="#a64635" stroke-width="1.6" rx="4"/>
<text x="498.6" y="169" fill="#176b74" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">有源域支持</text>
<text x="498.6" y="209" fill="#176b74" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.8 × 0.1 = 0.08</text>
<text x="990.6" y="167" fill="#a64635" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知区</text>
<text x="990.6" y="208" fill="#a64635" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.2</text>
<path d="M599 254L599 307" stroke="#67517d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M599 318L605 304L593 304Z" stroke="#67517d" stroke-width="1" fill="#67517d" stroke-linecap="round" stroke-linejoin="round"/>
<text x="285" y="293" fill="#176b74" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">已识别贡献固定</text>
<text x="872" y="293" fill="#a64635" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知贡献可变</text>
<rect x="327.4" y="375" width="446.0000000000001" height="45" fill="url(#wash-v)" stroke="#67517d" stroke-width="1.6" rx="4"/>
<text x="550.4000000000001" y="406" fill="#67517d" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">总体风险可能范围</text>
<path d="M149 443L996.55 443" stroke="#526577" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1007.55 443L993.55 437L993.55 449Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M149 438L149 450" stroke="#526577" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="149" y="479" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<path d="M327.4 438L327.4 450" stroke="#526577" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="327.4" y="479" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.08</text>
<path d="M595 438L595 450" stroke="#526577" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="595.0" y="479" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.20</text>
<path d="M773.4 438L773.4 450" stroke="#526577" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="773.4000000000001" y="479" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0.28</text>
<path d="M327.4 421L327.4 443" stroke="#176b74" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="327.4" cy="443" r="6.2" fill="#176b74" stroke="none" stroke-width="1.9"/>
<text x="327.4" y="537" fill="#176b74" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知区全对</text>
<path d="M773.4 421L773.4 443" stroke="#a64635" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="773.4000000000001" cy="443" r="6.2" fill="#a64635" stroke="none" stroke-width="1.9"/>
<text x="773.4000000000001" y="537" fill="#a64635" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">未知区全错</text>
</svg>

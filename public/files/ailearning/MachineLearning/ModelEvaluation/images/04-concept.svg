t-size="29" fill="#193a4e" text-anchor="start" font-weight="400">各占一半</text><text xml:space="preserve" x="745.0" y="455" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">10% → 17.5%</text><line x1="1242.5" y1="255" x2="1242.5" y2="760" stroke="#8ca5b4" stroke-width="2" stroke-dasharray="7 7"/><circle cx="1242.5" cy="628.8" r="8" fill="#2676ad" stroke="none" stroke-width="2"/><circle cx="1242.5" cy="631.1999999999999" r="8" fill="#b65a27" stroke="none" stroke-width="2"/><text xml:space="preserve" x="1227.5" y="205" font-size="29" fill="#193a4e" text-anchor="end" font-weight="400">A 占 95%</text><text xml:space="preserve" x="1227.5" y="247" font-size="29" fill="#2676ad" text-anchor="end" font-weight="400">8.2% → 8.05%</text><text xml:space="preserve" x="60" y="925" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">交点 w = 16/17 ≈ 94.12%：右侧总体略改善，B 组仍从 12% 恶化到 28%。</text><text xml:space="preserve" x="60" y="975" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">两条线改变的是汇总组成，组内错误率始终固定；没有模拟训练、抽样或因果干预。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img"><title>组内AUC为1但合并AUC为0.19的跨组配对反例</title><rect width="1280" height="860" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="48" fill="#213447" font-size="34" text-anchor="start" font-weight="700">组内全对，合并仍可能很差：关键在跨组配对</text><text x="40" y="92" fill="#627689" font-size="26" text-anchor="start" font-weight="400">A、B 各十条记录；两组内部 AUC 都为 1，合并后需要比较 100 对</text><text x="40" y="150" fill="#213447" font-size="28" text-anchor="start" font-weight="700">分数顺序（高分更像正例）</text><line x1="210" y1="210" x2="210" y2="460" stroke="#213447" stroke-width="3"/><circle cx="210" cy="220.0" r="9" fill="#2865a0"/><text x="180" y="229.0" fill="#213447" font-size="26" text-anchor="end" font-weight="400">0.9</text><text x="235" y="229.0" fill="#2865a0" font-size="28" text-anchor="start" font-weight="400">B 正例 × 1</text><circle cx="210" cy="250.0" r="9" fill="#c87536"/><text x="180" y="259.0" fill="#213447" font-size="26" text-anchor="end" font-weight="400">0.8</text><text x="235" y="259.0" fill="#c87536" font-size="28" text-anchor="start" font-weight="400">B 负例 × 9</text><circle cx="210" cy="430.0" r="9" fill="#2865a0"/><text x="180" y="439.0" fill="#213447" font-size="26" text-anchor="end" font-weight="400">0.2</text><text x="235" y="439.0" fill="#2865a0" font-size="28" text-anchor="start" font-weight="400">A 正例 × 9</text><circle cx="210" cy="460.0" r="9" fill="#c87536"/><text x="180" y="469.0" fill="#213447" font-size="26" text-anchor="end" font-weight="400">0.1</text><text x="235" y="469.0" fill="#c87536" font-size="28" text-anchor="start" font-weight="400">A 负例 × 1</text><text x="40" y="530" fill="#c87536" font-size="26" text-anchor="start" font-weight="400">A 正例分数 0.2 &lt; B 负例分数 0.8</text><text x="660" y="150" fill="#213447" font-size="28" text-anchor="start" font-weight="700">正例来源 × 负例来源</text><text x="865" y="205" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">负例 A（1）</text><text x="1110" y="205" fill="#213447" font-size="25" text-anchor="middle" font-weight="400">负例 B（9）</text><text x="745" y="285" fill="#213447" font-size="24" text-anchor="end" font-weight="400">正例 A（9）</text><text x="745" y="445" fill="#213447" font-size="24" text-anchor="end" font-weight="400">正例 B（1）</text><rect x="770" y="235" width="210" height="140" fill="#edf4f9" rx="8"/><text x="875" y="293" fill="#2865a0" font-size="32" text-anchor="middle" font-weight="700">9 对</text><text x="875" y="340" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="400">全对</text><rect x="1015" y="235" width="210" height="140" fill="#fff1e5" rx="8"/><text x="1120" y="293" fill="#c87536" font-size="32" text-anchor="middle" font-weight="700">81 对</text><text x="1120" y="340" fill="#c87536" font-size="28" text-anchor="middle" font-weight="400">全错</text><rect x="770" y="395" width="210" height="140" fill="#edf4f9" rx="8"/><text x="875" y="453" fill="#2865a0" font-size="32" text-anchor="middle" font-weight="700">1 对</text><text x="875" y="500" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="400">全对</text><rect x="1015" y="395" width="210" height="140" fill="#edf4f9" rx="8"/><text x="1120" y="453" fill="#2865a0" font-size="32" text-anchor="middle" font-weight="700">9 对</text><text x="1120" y="500" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="400">全对</text><line x1="40" y1="590" x2="1240" y2="590" stroke="#dce5ed" stroke-width="2"/><text x="40" y="642" fill="#213447" font-size="29" text-anchor="start" font-weight="700">组内指标看不到的，是 A 正例对 B 负例这 81 对错误。</text><text x="40" y="705" fill="#c87536" font-size="30" text-anchor="start" font-weight="700">正确 19 对，总计 100 对 → AUC = 0.19</text><text x="40" y="768" fill="#627689" font-size="26" text-anchor="start" font-weight="400">对照：只把 A 组所有分数加 0.75，组内次序不变，合并 AUC 变成 1。</text><text x="40" y="820" fill="#627689" font-size="25" text-anchor="start" font-weight="400">统一排序队列需要可比较的跨组分数；组内平均与合并 AUC 衡量不同对象。</text></g></svg>
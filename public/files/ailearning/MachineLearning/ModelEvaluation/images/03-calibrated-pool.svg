<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">对平均报告重新分组后不再校准</title>
<desc id="fig-desc">四个等概率输入。平均报告把原来的同报告群体重新分组，使组内阳性率改变。</desc>
<rect x="0" y="0" width="1200" height="807" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">两个各自校准的报告，平均后仍会换人群</text>
<text x="74" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">原输入</text>
<text x="355" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">两个报告</text>
<text x="793" y="135" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">平均报告的分组</text>
<path d="M74 217 L86 166 L317 166 L305 217 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195.5" y="199.55" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">(0, 0)，Y = 0</text>
<path d="M355 217 L367 166 L599 166 L587 217 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="477" y="199.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">P₁ 0.5，P₂ 0.5</text>
<path d="M608 191 L777 206" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M777 206 L765.601 210.008 L766.485 200.047 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M74 309 L86 258 L317 258 L305 309 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195.5" y="291.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">(0, 1)，Y = 1</text>
<path d="M355 309 L367 258 L599 258 L587 309 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="477" y="291.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">P₁ 0.5，P₂ 1</text>
<path d="M608 283 L777 342" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M777 342 L764.967 343.095 L768.263 333.654 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M74 401 L86 350 L317 350 L305 401 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195.5" y="383.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">(1, 0)，Y = 1</text>
<path d="M355 401 L367 350 L599 350 L587 401 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="477" y="383.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">P₁ 1，P₂ 0.5</text>
<path d="M608 375 L777 342" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M777 342 L767.162 349.015 L765.246 339.201 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M74 493 L86 442 L317 442 L305 493 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195.5" y="475.55" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">(1, 1)，Y = 1</text>
<path d="M355 493 L367 442 L599 442 L587 493 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="477" y="475.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">P₁ 1，P₂ 1</text>
<path d="M608 467 L777 478" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M777 478 L765.698 482.275 L766.348 472.296 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M790 231 L802 181 L1092 181 L1080 231 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="941" y="214.05" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">报告 0.5 · 1 点</text>
<text x="790" y="258" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实际阳性率 0</text>
<path d="M790 367 L802 317 L1092 317 L1080 367 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="941" y="350.05" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">报告 0.75 · 2 点</text>
<text x="790" y="394" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实际阳性率 1</text>
<path d="M790 503 L802 453 L1092 453 L1080 503 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="941" y="486.05" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">报告 1 · 1 点</text>
<text x="790" y="530" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实际阳性率 1</text>
<path d="M75 571 L1125 571" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="622" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">成员报告 0.5 时，各自包含两点，其中一半是阳性。</text>
<text x="74" y="680" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">平均报告 0.5 时，只剩 (0, 0)，阳性率为 0。</text>
<text x="74" y="738" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">本例 Brier 从单个报告的 0.125 降到平均报告的 0.09375。</text>
</svg>

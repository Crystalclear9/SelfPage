<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">平均改变了分数分组：成员校准不会自动传给平均值</text><text xml:space="preserve" x="70" y="135" font-size="30" fill="#193a4e" text-anchor="start" font-weight="700">四种等概率输入 · 每点占总体 25%</text><circle cx="200" cy="340" r="28" fill="white" stroke="#2676ad" stroke-width="4"/><text xml:space="preserve" x="200" y="275" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">X = (0, 0)</text><text xml:space="preserve" x="200" y="410" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">Y = 0</text><circle cx="500" cy="340" r="28" fill="#2676ad" stroke="#2676ad" stroke-width="4"/><text xml:space="preserve" x="500" y="275" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">X = (0, 1)</text><text xml:space="preserve" x="500" y="410" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">Y = 1</text><circle cx="200" cy="620" r="28" fill="#2676ad" stroke="#2676ad" stroke-width="4"/><text xml:space="preserve" x="200" y="555" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">X = (1, 0)</text><text xml:space="preserve" x="200" y="690" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">Y = 1</text><circle cx="500" cy="620" r="28" fill="#2676ad" stroke="#2676ad" stroke-width="4"/><text xml:space="preserve" x="500" y="555" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">X = (1, 1)</text><text xml:space="preserve" x="500" y="690" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">Y = 1</text><line x1="200" y1="280" x2="500" y2="280" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="6 6"/><line x1="200" y1="560" x2="500" y2="560" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="6 6"/><text xml:space="preserve" x="150" y="230" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">P1 = 0.5（上排）或 1（下排）</text><text xml:space="preserve" x="85" y="755" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">P2 = 0.5（左列）或 1（右列）</text><path d="M228,325 C320,300 740,300 910,300" stroke="#8ca5b4" stroke-width="2" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M535,340 C700,340 740,530 910,530" stroke="#8ca5b4" stroke-width="2" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M228,600 C520,460 740,530 910,530" stroke="#8ca5b4" stroke-width="2" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M535,620 C700,620 740,760 910,760" stroke="#8ca5b4" stroke-width="2" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="970" cy="300" r="35" fill="#f2f7fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="970" y="310" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1040" y="285" font-size="29" fill="#193a4e" text-anchor="start" font-weight="700">平均报告 P = 0.5</text><text xml:space="preserve" x="1040" y="340" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">组内阳性率 = 0</text><circle cx="970" cy="530" r="35" fill="#f2f7fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="970" y="540" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1040" y="515" font-size="29" fill="#193a4e" text-anchor="start" font-weight="700">平均报告 P = 0.75</text><text xml:space="preserve" x="1040" y="570" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">组内阳性率 = 1</text><circle cx="970" cy="760" r="35" fill="#f2f7fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="970" y="770" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1040" y="745" font-size="29" fill="#193a4e" text-anchor="start" font-weight="700">平均报告 P = 1</text><text xml:space="preserve" x="1040" y="800" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">组内阳性率 = 1</text><text xml:space="preserve" x="900" y="200" font-size="30" fill="#193a4e" text-anchor="start" font-weight="700">按平均报告重新分组</text><text xml:space="preserve" x="70" y="875" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">成员报告 0.5：各自汇集 2 点，其中 1 点阳性。</text><text xml:space="preserve" x="70" y="925" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">平均报告 0.5：只剩 (0,0) 这 1 点，阳性率变成 0。</text><text xml:space="preserve" x="70" y="980" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">点的标签不变；变的是相同报告值下的人群。各点等权，圈内数字是成员点数。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>四格总体说明概率平均可改善Brier评分却破坏校准</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="54" fill="#213447" font-size="34" text-anchor="start" font-weight="700">两个已校准的报告，平均后仍会失准</text><text x="48" y="101" fill="#627689" font-size="26" text-anchor="start" font-weight="400">X1、X2 独立且等概率取 0、1；标签 Y = X1 或 X2</text><text x="48" y="156" fill="#213447" font-size="28" text-anchor="start" font-weight="700">四种输入各占总体 25%</text><rect x="70" y="190" width="255" height="126" fill="#eff4f8" rx="9"/><text x="88" y="226" fill="#213447" font-size="27" text-anchor="start" font-weight="700">X = (0, 0)</text><text x="88" y="267" fill="#213447" font-size="26" text-anchor="start" font-weight="400">Y = 0；均值 = 0.5</text><text x="88" y="300" fill="#627689" font-size="24" text-anchor="start" font-weight="400">P1 = 0.5，P2 = 0.5</text><rect x="355" y="190" width="255" height="126" fill="#eff4f8" rx="9"/><text x="373" y="226" fill="#213447" font-size="27" text-anchor="start" font-weight="700">X = (0, 1)</text><text x="373" y="267" fill="#213447" font-size="26" text-anchor="start" font-weight="400">Y = 1；均值 = 0.75</text><text x="373" y="300" fill="#627689" font-size="24" text-anchor="start" font-weight="400">P1 = 0.5，P2 = 1</text><rect x="70" y="340" width="255" height="126" fill="#eff4f8" rx="9"/><text x="88" y="376" fill="#213447" font-size="27" text-anchor="start" font-weight="700">X = (1, 0)</text><text x="88" y="417" fill="#213447" font-size="26" text-anchor="start" font-weight="400">Y = 1；均值 = 0.75</text><text x="88" y="450" fill="#627689" font-size="24" text-anchor="start" font-weight="400">P1 = 1，P2 = 0.5</text><rect x="355" y="340" width="255" height="126" fill="#eff4f8" rx="9"/><text x="373" y="376" fill="#213447" font-size="27" text-anchor="start" font-weight="700">X = (1, 1)</text><text x="373" y="417" fill="#213447" font-size="26" text-anchor="start" font-weight="400">Y = 1；均值 = 1</text><text x="373" y="450" fill="#627689" font-size="24" text-anchor="start" font-weight="400">P1 = 1，P2 = 1</text><text x="750" y="156" fill="#213447" font-size="28" text-anchor="start" font-weight="700">平均报告的可靠性点</text><line x1="750" y1="485" x2="1140" y2="485" stroke="#dce5ed" stroke-width="2"/><text x="734" y="493" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0</text><text x="750" y="521" fill="#627689" font-size="24" text-anchor="middle" font-weight="400">0</text><line x1="750" y1="350.0" x2="1140" y2="350.0" stroke="#dce5ed" stroke-width="2"/><text x="734" y="358.0" fill="#627689" font-size="24" text-anchor="end" font-weight="400">0.5</text><text x="945.0" y="521" fill="#627689" font-size="24" text-anchor="middle" font-weight="400">0.5</text><line x1="750" y1="215" x2="1140" y2="215" stroke="#dce5ed" stroke-width="2"/><text x="734" y="223" fill="#627689" font-size="24" text-anchor="end" font-weight="400">1</text><text x="1140" y="521" fill="#627689" font-size="24" text-anchor="middle" font-weight="400">1</text><line x1="750" y1="485" x2="1140" y2="215" stroke="#627689" stroke-width="2" stroke-dasharray="7 7"/><line x1="750" y1="485" x2="1140" y2="485" stroke="#213447" stroke-width="2"/><line x1="750" y1="485" x2="750" y2="215" stroke="#213447" stroke-width="2"/><circle cx="945.0" cy="485" r="9" fill="#c87536"/><circle cx="1042.5" cy="215" r="9" fill="#c87536"/><circle cx="1140" cy="215" r="9" fill="#c87536"/><text x="945" y="567" fill="#627689" font-size="25" text-anchor="middle" font-weight="400">平均报告 P</text><text x="750" y="194" fill="#627689" font-size="25" text-anchor="start" font-weight="400">真实阳性率</text><text x="945.0" y="467" fill="#c87536" font-size="24" text-anchor="middle" font-weight="400">(0.5, 0)</text><text x="1034.5" y="197" fill="#c87536" font-size="24" text-anchor="end" font-weight="400">(0.75, 1)</text><text x="1152" y="245" fill="#c87536" font-size="24" text-anchor="start" font-weight="400">(1, 1)</text><line x1="48" y1="602" x2="1232" y2="602" stroke="#dce5ed" stroke-width="2"/><text x="48" y="650" fill="#213447" font-size="29" text-anchor="start" font-weight="700">评分改善与校准改善不是同一个结论</text><text x="65" y="701" fill="#2865a0" font-size="28" text-anchor="start" font-weight="400">每个成员：Brier = 0.125</text><text x="65" y="747" fill="#627689" font-size="25" text-anchor="start" font-weight="400">各自报告 0.5 的人群，阳性率恰为 0.5</text><text x="720" y="701" fill="#c87536" font-size="28" text-anchor="start" font-weight="400">概率平均：Brier = 0.09375</text><text x="720" y="747" fill="#627689" font-size="25" text-anchor="start" font-weight="400">报告 0.5 的人群，阳性率却为 0</text><text x="48" y="807" fill="#627689" font-size="26" text-anchor="start" font-weight="400">这些是已知有限总体的精确值，不是分箱误差或有限样本噪声。</text></g></svg>
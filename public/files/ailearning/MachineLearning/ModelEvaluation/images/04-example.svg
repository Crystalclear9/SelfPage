<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title>重要性权重将区域风险重新组合</title><desc>源域A/B质量0.8/0.2，目标0.4/0.6，区域条件损失0.1/0.5不变。以宽度表示区域质量，色块高度表示条件损失，源域风险面积0.18，目标0.34。</desc><rect width="1200" height="920" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="58" font-size="33" fill="#233642" text-anchor="start">重新加权改变区域占比，不改变区域内损失</text><text x="50" y="113" font-size="26" fill="#233642" text-anchor="start">区域 A 条件损失 0.1，区域 B 条件损失 0.5；两个域保持相同。</text><text x="50" y="188" font-size="28" fill="#233642" text-anchor="start">源域：色块面积为总体风险</text><rect x="105" y="250" width="450" height="300" fill="#edf1f3"/><rect x="105" y="520.0" width="360.0" height="30.0" fill="#246d91"/><line x1="105" y1="250" x2="105" y2="550" stroke="white" stroke-width="3"/><text x="285.0" y="593" font-size="26" fill="#246d91" text-anchor="middle">A 0.8</text><rect x="465.0" y="400.0" width="90.0" height="150.0" fill="#bc5b31"/><line x1="465.0" y1="250" x2="465.0" y2="550" stroke="white" stroke-width="3"/><text x="510.0" y="593" font-size="26" fill="#bc5b31" text-anchor="middle">B 0.2</text><text x="90" y="558" font-size="24" fill="#687b86" text-anchor="end">0</text><text x="90" y="408.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><text x="90" y="258" font-size="24" fill="#687b86" text-anchor="end">1</text><text x="105" y="660" font-size="25" fill="#233642" text-anchor="start">0.8 × 0.1 + 0.2 × 0.5 = 0.18</text><text x="650" y="188" font-size="28" fill="#233642" text-anchor="start">目标域：色块面积为总体风险</text><rect x="705" y="250" width="450" height="300" fill="#edf1f3"/><rect x="705" y="520.0" width="180.0" height="30.0" fill="#246d91"/><line x1="705" y1="250" x2="705" y2="550" stroke="white" stroke-width="3"/><text x="795.0" y="593" font-size="26" fill="#246d91" text-anchor="middle">A 0.4</text><rect x="885.0" y="400.0" width="270.0" height="150.0" fill="#bc5b31"/><line x1="885.0" y1="250" x2="885.0" y2="550" stroke="white" stroke-width="3"/><text x="1020.0" y="593" font-size="26" fill="#bc5b31" text-anchor="middle">B 0.6</text><text x="690" y="558" font-size="24" fill="#687b86" text-anchor="end">0</text><text x="690" y="408.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><text x="690" y="258" font-size="24" fill="#687b86" text-anchor="end">1</text><text x="705" y="660" font-size="25" fill="#233642" text-anchor="start">0.4 × 0.1 + 0.6 × 0.5 = 0.34</text><text x="50" y="727" font-size="25" fill="#687b86" text-anchor="start">宽度：区域概率质量     高度：区域条件平均损失     面积：风险贡献</text><line x1="50" y1="758" x2="1150" y2="758" stroke="#dce5e9" stroke-width="2"/><text x="50" y="809" font-size="29" fill="#233642" text-anchor="start">源域加权：A 乘 0.5，B 乘 3</text><text x="50" y="864" font-size="29" fill="#246d91" text-anchor="start">0.8 × 0.5 × 0.1 + 0.2 × 3 × 0.5 = 0.34</text></g></svg>

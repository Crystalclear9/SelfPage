<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="885.813" viewBox="0 93.425606 1500 885.813149"><rect id="offline-white-background" x="0" y="93.425606" width="1500" height="885.813149" fill="#ffffff"/><title>配对比较：同一个对象必须沿同一条连线相减</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="100" y="145" font-size="31" fill="#2676ad" text-anchor="start" font-weight="700">保留对象身份</text><text xml:space="preserve" x="165" y="205" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">A 损失</text><text xml:space="preserve" x="465" y="205" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">B 损失</text><text xml:space="preserve" x="85" y="739" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">3</text><line x1="120" y1="730" x2="580" y2="730" stroke="#e0e8ee" stroke-width="1" stroke-dasharray=""/><text xml:space="preserve" x="85" y="674" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">4</text><line x1="120" y1="665" x2="580" y2="665" stroke="#e0e8ee" stroke-width="1" stroke-dasharray=""/><text xml:space="preserve" x="85" y="544" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">6</text><line x1="120" y1="535" x2="580" y2="535" stroke="#e0e8ee" stroke-width="1" stroke-dasharray=""/><text xml:space="preserve" x="85" y="479" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">7</text><line x1="120" y1="470" x2="580" y2="470" stroke="#e0e8ee" stroke-width="1" stroke-dasharray=""/><text xml:space="preserve" x="85" y="349" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">9</text><line x1="120" y1="340" x2="580" y2="34
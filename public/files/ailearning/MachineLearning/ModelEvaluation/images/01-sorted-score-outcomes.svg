<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="623" viewBox="0 0 1360 623" role="img" aria-labelledby="title desc"><title id="title">排序、阈值与错误类型</title><desc id="desc">六条记录按分数排序，阈值在 0.6 和 0.5 之间。TP=2，FP=1，FN=1，TN=2。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="623" fill="white" stroke="none" stroke-width="1.55"/><text x="680" y="65" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">同一条记录从分数读到错误类型</text><circle cx="129" cy="239" r="13" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><text x="129" y="192" fill="#196f77" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.9</text><line x1="129" y1="263" x2="129" y2="347" stroke="#196f77" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="70.5,429.5 160.5,429.5 187.5,370.5 97.5,370.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="129" y="410.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">TP</text><polygon points="338,224 353,239 338,254 323,239" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="338" y="192" fill="#655184" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.8</text><line x1="338" y1="263" x2="338" y2="347" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="279.5,429.5 369.5,429.5 396.5,370.5 306.5,370.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="338" y="410.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">FP</text><circle cx="547" cy="239" r="13" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><text x="547" y="192" fill="#196f77" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.6</text><line x1="547" y1="263" x2="547" y2="347" stroke="#196f77" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="488.5,429.5 578.5,429.5 605.5,370.5 515.5,370.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="547" y="410.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">TP</text><polygon points="756,224 771,239 756,254 741,239" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="756" y="192" fill="#655184" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.5</text><line x1="756" y1="263" x2="756" y2="347" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="697.5,429.5 787.5,429.5 814.5,370.5 724.5,370.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="756" y="410.2" fill="#655184" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">TN</text><circle cx="965" cy="239" r="13" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><text x="965" y="192" fill="#196f77" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.3</text><line x1="965" y1="263" x2="965" y2="347" stroke="#196f77" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="906.5,429.5 996.5,429.5 1023.5,370.5 933.5,370.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="965" y="410.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">FN</text><polygon points="1174,224 1189,239 1174,254 1159,239" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="1174" y="192" fill="#655184" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">0.2</text><line x1="1174" y1="263" x2="1174" y2="347" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="1115.5,429.5 1205.5,429.5 1232.5,370.5 1142.5,370.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="1174" y="410.2" fill="#655184" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">TN</text><line x1="651.5" y1="127" x2="651.5" y2="461" stroke="#a84b3b" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 6"/><text x="651.5" y="112" fill="#a84b3b" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">阈值</text><text x="677" y="544" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">圆形是真实正类，菱形是真实负类</text></svg>
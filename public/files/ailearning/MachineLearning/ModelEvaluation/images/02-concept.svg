<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">标准化泄漏：验证点不应拉动训练坐标系</text><text xml:space="preserve" x="50" y="180" font-size="32" fill="#2676ad" text-anchor="start" font-weight="700">合法：只用训练点拟合</text><circle cx="130.0" cy="245" r="9" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="130.0" y="290" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><circle cx="153.4" cy="245" r="9" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="153.4" y="290" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><circle cx="1300.0" cy="245" r="9" fill="#dd8d52" stroke="none" stroke-width="2"/><text xml:space="preserve" x="1300.0" y="290" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">100</text><line x1="110" y1="245" x2="1350" y2="245" stroke="#8ca5b4" stroke-width="3" stroke-dasharray=""/><line x1="141.7" y1="205" x2="141.7" y2="265" stroke="#2676ad" stroke-width="4" stroke-dasharray=""/><text xml:space="preserve" x="470" y="210" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">拟合均值 μ = 1</text><text xml:space="preserve" x="80" y="360" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">标准差 σ = 1</text><text xml:space="preserve" x="500" y="360" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">验证点的新坐标 z = (100 − 1) / 1 = 99</text><text xml:space="preserve" x="50" y="505" font-size="32" fill="#b65a27" text-anchor="start" font-weight="700">泄漏：验证点也参与拟合</text><circle cx="130.0" cy="570" r="9" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="130.0" y="615" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><circle cx="153.4" cy="570" r="9" fill="#2676ad" stroke="none" stroke-width="2"/><text xml:space="preserve" x="153.4" y="615" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><circle cx="1300.0" cy="570" r="9" fill="#dd8d52" stroke="none" stroke-width="2"/><text xml:space="preserve" x="1300.0" y="615" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">100</text><line x1="110" y1="570" x2="1350" y2="570" stroke="#8ca5b4" stroke-width="3" stroke-dasharray=""/><line x1="527.8" y1="530" x2="527.8" y2="590" stroke="#b65a27" stroke-width="4" stroke-dasharray=""/><text xml:space="preserve" x="470" y="535" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">拟合均值 μ = 34</text><text xml:space="preserve" x="80" y="685" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">标准差 σ = 46.68</text><text xml:space="preserve" x="500" y="685" font-size="29" fill="#b65a27" text-anchor="start" font-weight="400">验证点的新坐标 z = (100 − 34) / 46.68 = 1.414</text><text xml:space="preserve" x="60" y="855" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">两个蓝点是训练输入 0、2；橙点 100 只用于验证。竖线是变换原点，不是决策边界。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="665" viewBox="0 0.000000 1080 665.000000" role="img"><rect id="offline-white-background" x="0" y="0.000000" width="1080" height="665.000000" fill="#ffffff"/><title>总体可靠性图为什么可能看不见群体误差</title><desc>两组各100人，预测均为0.5，阳性数20和80；合并阳性率0.5掩盖组内误差。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="760" rx="5" fill="white"/><rect x="24" y="94" width="1032" height="632" rx="5" fill="white"/><text x="50" y="132" font-size="26" fill="#17364c" text-anchor="start">相同预测概率，三种观察单位</text><text x="590" y="132" font-size="26" fill="#17364c" text-anchor="start">把分母和人数放回图中</text><path d="M110,580 L490,580" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="90" y="587" font-size="24" fill="#17364c" text-anchor="end">0</text><path d="M110,504.0 L490,504.0" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="90" y="511.0" font-size="24" fill="#17364c" text-anchor="end">0.2</text><path d="M110,390.0 L490,390.0" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="90" y="397.0" font-size="24" fill="#17364c" text-anchor="end">0.5</text><path d="M110,276.0 L490,276.0" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="90" y="283.0" font-size="24" fill="#17364c" text-anchor="end">0.8</text><path d="M110,200 L490,200" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="90" y="207" font-size="24" fill="#17364c" text-anchor="end">1</text><path d="M110,580 L490,200" stroke="#9caebc" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M110,580 L110,200" stroke="#c6d5df" stroke-width="2" fill="none"/><path d="M110,580 L490,580" stroke="#c6d5df" stroke-width="2" fill="none"/><text x="300" y="642" font-size="24" fill="#17364c" text-anchor="middle">预测概率 p</text><text x="65" y="176" font-size="24" fill="#17364c" text-anchor="start">实际阳性率</text><circle cx="300" cy="504.0" r="10" fill="#cf7432" stroke="white" stroke-width="2"/><text x="318" y="511.0" font-size="24
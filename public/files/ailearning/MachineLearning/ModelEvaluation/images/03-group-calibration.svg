<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="969.5556" viewBox="0 0 1440 969.5556" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">总体校准与群体误差的对照</title><rect width="1440" height="969.5556" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">总体校准与群体误差的对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="827.5556" viewBox="0 0 1080 665" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="0.000000" width="1080" height="665.000000" fill="#ffffff"/><title>总体可靠性图为什么可能看不见群体误差</title><desc>两组各100人，预测均为0.5，阳性数20和80；合并阳性率0.5掩盖组内误差。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="760" rx="5" fill="white"/><rect x="24" y="94" width="1032" height="632" rx="5" fill="white"/><text x="50" y="132" font-size="26" fill="#173f5a" text-anchor="start">相同预测概率，三种观察单位</text><text x="590" y="132" font-size="26" fill="#173f5a" text-anchor="start">把分母和人数放回图中</text><path d="M110,580 L490,580" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="90" y="587" font-size="24" fill="#173f5a" text-anchor="end">0</text><path d="M110,504.0 L490,504.0" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="90" y="511.0" font-size="24" fill="#173f5a" text-anchor="end">0.2</text><path d="M110,390.0 L490,390.0" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="90" y="397.0" font-size="24" fill="#173f5a" text-anchor="end">0.5</text><path d="M110,276.0 L490,276.0" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="90" y="283.0" font-size="24" fill="#173f5a" text-anchor="end">0.8</text><path d="M110,200 L490,200" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="90" y="207" font-size="24" fill="#173f5a" text-anchor="end">1</text><path d="M110,580 L490,200" stroke="#9eacc1" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M110,580 L110,200" stroke="#c4d6e1" stroke-width="2" fill="none"/><path d="M110,580 L490,580" stroke="#c4d6e1" stroke-width="2" fill="none"/><text x="300" y="642" font-size="24" fill="#173f5a" text-anchor="middle">预测概率 p</text><text x="65" y="176" font-size="24" fill="#173f5a" text-anchor="start">实际阳性率</text><circle cx="300" cy="504.0" r="10" fill="#cb7436" stroke="white" stroke-width="2"/><text x="318" y="511.0" font-size="24" fill="#cb7436" text-anchor="start">组 A：0.20</text><circle cx="300" cy="390.0" r="10" fill="#173f5a" stroke="white" stroke-width="2"/><text x="318" y="397.0" font-size="24" fill="#173f5a" text-anchor="start">总体：0.50</text><circle cx="300" cy="276.0" r="10" fill="#2472b1" stroke="white" stroke-width="2"/><text x="282" y="283.0" font-size="24" fill="#2472b1" text-anchor="end">组 B：0.80</text><text x="600" y="202" font-size="24" fill="#173f5a" text-anchor="start">组 A：100 人，20 个阳性</text><rect x="600" y="220" width="380" height="50" rx="5" fill="#eaf0f4"/><rect x="600" y="220" width="76.0" height="50" rx="5" fill="#cb7436"/><text x="600" y="304" font-size="24" fill="#527489" text-anchor="start">每人预测均为 0.50</text><text x="600" y="342" font-size="24" fill="#173f5a" text-anchor="start">组 B：100 人，80 个阳性</text><rect x="600" y="360" width="380" height="50" rx="5" fill="#eaf0f4"/><rect x="600" y="360" width="304.0" height="50" rx="5" fill="#2472b1"/><text x="600" y="444" font-size="24" fill="#527489" text-anchor="start">每人预测均为 0.50</text><text x="600" y="526" font-size="24" fill="#173f5a" text-anchor="start">合计：200 人，100 个阳性</text><text x="110" y="606" font-size="24" fill="#173f5a" text-anchor="middle">0</text><text x="300" y="606" font-size="24" fill="#173f5a" text-anchor="middle">0.5</text><text x="490" y="606" font-size="24" fill="#173f5a" text-anchor="middle">1</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="804.206" viewBox="0 65.950783 1280 804.205817" role="img" aria-labelledby="title desc"><rect id="offline-white-background" x="0" y="65.950783" width="1280" height="804.205817" fill="#ffffff"/><title id="title">固定检出率与误报率，基率下降仍会稀释告警命中率</title><desc id="desc">固定检出率与误报率，基率下降仍会稀释告警命中率</desc><rect width="1280" height="880" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="40" y="110" font-size="27" fill="#203747" text-anchor="start" font-weight="400">两组各 1000 人；检出率 TPR=80%，误报率 FPR=10%；只改变真实阳性率。</text><text x="45" y="220" font-size="30" fill="#203747" text-anchor="start" font-weight="600">阳性率 10%</text><text x="45" y="270" font-size="32" fill="#203747" text-anchor="start" font-weight="400">1000 人</text><path d="M205 255L300 210" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><path d="M205 255L300 310" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="215" font-size="30" fill="#286da2" text-anchor="start" font-weight="400">真实正类 100</text><text x="325" y="315" font-size="30" fill="#c96e32" text-anchor="start" font-weight="400">真实负类 900</text><path d="M560 205L725 205" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="182" font-size="26" fill="#286da2" text-anchor="start" font-weight="400">×80%</text><text x="750" y="215" font-size="31" fill="#286da2" text-anchor="start" font-weight="400">TP = 80</text><path d="M560 305L725 305" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="282" font-size="26" fill="#c96e32" text-anchor="start" font-weight="400">×10%</text><text x="750" y="315" font-size="31" fill="#c96e32" text-anchor="start" font-weight="400">FP = 90</text><path d="M900 215L970 255" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 310L970 270" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="1080" y="231" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">80</text><path d="M1007.5 245L1152.5 245" fill="none" stroke="#286da2" stroke-width="2"/><text x="1080" y="277" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">80+90</text><text x="1080" y="340" font-size="34" fill="#286da2" text-anchor="middle" font-weight="400">≈ 47.06%</text><rect x="315" y="400" width="296.0" height="36" fill="#286da2" stroke="none" stroke-width="2"/><rect x="611.0" y="400" width="333.0" height="36" fill="#c96e32" stroke="none" stroke-width="2"/><text x="964.0" y="428" font-size="27" fill="#203747" text-anchor="start" font-weight="400">170 个告警</text><text x="45" y="555" font-size="30" fill="#203747" text-anchor="start" font-weight="600">阳性率 1%</text><text x="45" y="605" font-size="32" fill="#203747" text-anchor="start" font-weight="400">1000 人</text><path d="M205 590L300 545" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><path d="M205 590L300 645" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="550" font-size="30" fill="#286da2" text-anchor="start" font-weight="400">真实正类 10</text><text x="325" y="650" font-size="30" fill="#c96e32" text-anchor="start" font-weight="400">真实负类 990</text><path d="M560 540L725 540" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="517" font-size="26" fill="#286da2" text-anchor="start" font-weight="400">×80%</text><text x="750" y="550" font-size="31" fill="#286da2" text-anchor="start" font-weight="400">TP = 8</text><path d="M560 640L725 640" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="617" font-size="26" fill="#c96e32" text-anchor="start" font-weight="400">×10%</text><text x="750" y="650" font-size="31" fill="#c96e32" text-anchor="start" font-weight="400">FP = 99</text><path d="M900 550L970 590" fill="none" stroke="#286da2" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 645L970 605" fill="none" stroke="#c96e32" stroke-width="3" marker-end="url(#arrow)"/><text x="1080" y="566" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">8</text><path d="M1007.5 580L1152.5 580" fill="none" stroke="#286da2" stroke-width="2"/><text x="1080" y="612" font-size="31" fill="#286da2" text-anchor="middle" font-weight="400">8+99</text><text x="1080" y="675" font-size="34" fill="#286da2" text-anchor="middle" font-weight="400">≈ 7.48%</text><rect x="315" y="735" width="29.6" height="36" fill="#286da2" stroke="none" stroke-width="2"/><rect x="344.6" y="735" width="366.3" height="36" fill="#c96e32" stroke="none" stroke-width="2"/><text x="730.9000000000001" y="763" font-size="27" fill="#203747" text-anchor="start" font-weight="400">107 个告警</text><text x="45" y="845" font-size="27" fill="#203747" text-anchor="start" font-weight="400">告警带共用人数刻度；蓝色是真告警，橙色是假告警。未告警者不进入右侧分母。</text></g></svg>

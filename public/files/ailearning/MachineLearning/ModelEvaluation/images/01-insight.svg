<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">相同检出与误报率，为何稀有事件会被误报淹没</title><desc id="desc">相同检出与误报率，为何稀有事件会被误报淹没</desc><rect width="1200" height="750" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">相同检出与误报率，为何稀有事件会被误报淹没</text><text x="65" y="112" font-size="26" fill="#213447" font-weight="600" text-anchor="start">1000 人中，正类比例 0.1</text><text x="65" y="165" font-size="26" fill="#213447" font-weight="400" text-anchor="start">真实正类 100 人；负类 900 人</text><text x="65" y="220" font-size="25" fill="#2865a0" font-weight="400" text-anchor="start">检出 80% → TP 80，FN 20</text><text x="65" y="265" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">误报 10% → FP 90，TN 810</text><text x="65" y="335" font-size="26" fill="#213447" font-weight="600" text-anchor="start">被报为正类的人</text><rect x="65" y="365" width="230.58823529411765" height="95" fill="#2865a0" /><rect x="295.5882352941177" y="365" width="259.4117647058824" height="95" fill="#cf7432" /><text x="73" y="503" font-size="26" fill="#2865a0" font-weight="400" text-anchor="start">TP 80</text><text x="315" y="503" font-size="26" fill="#cf7432" font-weight="400" text-anchor="start">FP 90</text><text x="315.0" y="555" font-size="28" fill="#213447" font-weight="400" text-anchor="middle">80</text><line x1="245" y1="565" x2="385" y2="565" stroke="#213447" stroke-width="1.5" /><text x="315.0" y="594" font-size="28" fill="#213447" font-weight="400" text-anchor="middle">80 + 90</text><text x="405" y="575" font-size="30" fill="#213447" font-weight="600" text-anchor="start">= 47.1%</text><text x="65" y="655" font-size="25" fill="#213447" font-weight="400" text-anchor="start">每 170 个告警，仅 80 个是真正例</text><text x="655" y="112" font-size="26" fill="#213447" font-weight="600" text-anchor="start">1000 人中，正类比例 0.01</text><text x="655" y="165" font-size="26" fill="#213447" font-weight="400" text-anchor="start">真实正类 10 人；负类 990 人</text><text x="655" y="220" font-size="25" fill="#2865a0" font-weight="400" text-anchor="start">检出 80% → TP 8，FN 2</text><text x="655" y="265" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">误报 10% → FP 99，TN 891</text><text x="655" y="335" font-size="26" fill="#213447" font-weight="600" text-anchor="start">被报为正类的人</text><rect x="655" y="365" width="36.63551401869159" height="95" fill="#2865a0" /><rect x="691.6355140186915" y="365" width="453.3644859813084" height="95" fill="#cf7432" /><text x="663" y="503" font-size="26" fill="#2865a0" font-weight="400" text-anchor="start">TP 8</text><text x="905" y="503" font-size="26" fill="#cf7432" font-weight="400" text-anchor="start">FP 99</text><text x="905.0" y="555" font-size="28" fill="#213447" font-weight="400" text-anchor="middle">8</text><line x1="835" y1="565" x2="975" y2="565" stroke="#213447" stroke-width="1.5" /><text x="905.0" y="594" font-size="28" fill="#213447" font-weight="400" text-anchor="middle">8 + 99</text><text x="995" y="575" font-size="30" fill="#213447" font-weight="600" text-anchor="start">= 7.5%</text><text x="655" y="655" font-size="25" fill="#213447" font-weight="400" text-anchor="start">每 107 个告警，仅 8 个是真正例</text><text x="65" y="720" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">两侧告警条各自归一化：长度表示告警内组成，不表示同样的告警人数。</text></g></svg>

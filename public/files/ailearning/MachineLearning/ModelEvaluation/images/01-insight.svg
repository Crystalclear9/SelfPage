<text x="74" y="707" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">同样十个百分点的误报率，在更大的负类人群里仍会产生许多假告警。</text>

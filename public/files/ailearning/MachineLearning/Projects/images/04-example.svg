<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730.796" viewBox="0 68.281430 1200 730.795848" role="img"><rect id="offline-white-background" x="0" y="68.281430" width="1200" height="730.795848" fill="#ffffff"/><title>设备等权与记录等权的风险差反转来自不同抽样单位</title><desc>设备一两条记录损失差2，设备二六条记录损失差负1。</desc><rect width="1200" height="800" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="110" font-size="25" fill="#687b86" text-anchor="start">固定每条损失差 d = 模型 A 损失 − 模型 B 损失；正值表示 B 更好。</text><text x="65" y="220" font-size="29" fill="#233642" text-anchor="start">设备一</text><circle cx="285" cy="212" r="25" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="285" y="223" font-size="25" fill="white" text-anchor="middle">2</text><circle cx="400" cy="212" r="25" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="400" y="223" font-size="25" fill="white" text-anchor="middle">2</text><text x="1080" y="225" font-size="26" fill="#687b86" text-anchor="end">2 条记录</text><text x="65" y="380" font-size="29" fill="#233642" text-anchor="start">设备二</text><circle cx="285" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="285" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><circle cx="400" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="400" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><circle cx="515" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="515" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><circle cx="630" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="630" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><circle cx="745" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="745" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><circle cx="860" cy="372" r="25" fill="#246d91" stroke="white" stroke-width="2"/><text x="860" y="383" font-size="25" fill="white" text-anchor="middle">-1</text><text x="1080" y="385" font-size="26" fill="#687b86" text-anchor="end">6 条记录</text><line x1="65" y1="465" x2="1135" y2="465" stroke="#dce5e9" stroke-width="2"/><text x="70" y="530" font-size="31" fill="#bc5b31" text-anchor="start">设备等权</text><text x="670" y="530" font-size="31" fill="#246d91" text-anchor="start">记录等权</text><text x="70" y="590" font-size="26" fill="#233642" text-anchor="start">先各取设备均值，再平均</text><text x="70" y="645" font-size="26" fill="#687b86" text-anchor="start">两台设备各占 50%</text><text x="70" y="705" font-size="30" fill="#bc5b31" text-anchor="start">平均差 = 0.5 → 选 B</text><text x="670" y="590" font-size="26" fill="#233642" text-anchor="start">设备一占 25%，设备二占 75%</text><text x="670" y="645" font-size="25" fill="#687b86" text-anchor="start">按记录数加权：2×0.25 − 1×0.75</text><text x="670" y="705" font-size="30" fill="#246d91" text-anchor="start">平均差 = −0.25 → 选 A</text><text x="65" y="775" font-size="25" fill="#687b86" text-anchor="start">没有算术矛盾：两种风险对应不同目标总体；两台设备不足以推断总体显著性。</text></g></svg>

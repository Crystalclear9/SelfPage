<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906.741" viewBox="0 67.405355 1200 906.740536" role="img"><rect id="offline-white-background" x="0" y="67.405355" width="1200" height="906.740536" fill="#ffffff"/><title>复制特征下的单列置换、联合置换与删列重训</title><desc>与本章代码一致：x取负2至2，标签x，固定线性模型为两列均值。</desc><rect width="1200" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="110" font-size="26" fill="#687b86" text-anchor="start">五个等权对象：x = −2、−1、0、1、2；X1 = X2 = y = x。</text><text x="65" y="165" font-size="28" fill="#233642" text-anchor="start">固定线性模型：取 X1 与 X2 的算术平均</text><text x="65" y="215" font-size="25" fill="#687b86" text-anchor="start">模型预测</text><line x1="110" y1="675" x2="530" y2="675" stroke="#dce5e9" stroke-width="2"/><text x="110" y="720" font-size="24" fill="#687b86" text-anchor="middle">-2</text><text x="90" y="683" font-size="24" fill="#687b86" text-anchor="end">-2</text><line x1="110" y1="570" x2="530" y2="570" stroke="#dce5e9" stroke-width="2"/><text x="215" y="720" font-size="24" fill="#687b86" text-anchor="middle">-1</text><text x="90" y="578" font-size="24" fill="#687b86" text-anchor="end">-1</text><line x1="110" y1="465" x2="530" y2="465" stroke="#dce5e9" stroke-width="2"/><text x="320" y="720" font-size="24" fill="#687b86" text-anchor="middle">0</text><text x="90" y="473" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="110" y1="360" x2="530" y2="360" stroke="#dce5e9" stroke-width="2"/><text x="425" y="720" font-size="24" fill="#687b86" text-anchor="middle">1</text><text x="90" y="368" font-size="24" fill="#687b86" text-anchor="end">1</text><line x1="110" y1="255" x2="530" y2="255" stroke="#dce5e9" stroke-width="2"/><text x="530" y="720" font-size="24" fill="#687b86" text-anchor="middle">2</text><text x="90" y="263" font-size="24" fill="#687b86" text-anchor="end">2</text><polyline points="110.000,675.000 530.000,255.000" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><polyline points="110.000,255.000 530.000,675.000" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><line x1="110" y1="465" x2="530" y2="465" stroke="#63805d" stroke-width="4"/><circle cx="110" cy="675" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="110" cy="255" r="6" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="110" cy="465" r="6" fill="#63805d" stroke="white" stroke-width="2"/><circle cx="215" cy="570" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="215" cy="360" r="6" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="215" cy="465" r="6" fill="#63805d" stroke="white" stroke-width="2"/><circle cx="320" cy="465" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="320" cy="465" r="6" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="320" cy="465" r="6" fill="#63805d" stroke="white" stroke-width="2"/><circle cx="425" cy="360" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="425" cy="570" r="6" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="425" cy="465" r="6" fill="#63805d" stroke="white" stroke-width="2"/><circle cx="530" cy="255" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="530" cy="675" r="6" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="530" cy="465" r="6" fill="#63805d" stroke="white" stroke-width="2"/><text x="320" y="755" font-size="26" fill="#687b86" text-anchor="middle">原始 x</text><text x="665" y="260" font-size="27" fill="#246d91" text-anchor="start">原始两列：预测 x，MSE = 0</text><text x="665" y="325" font-size="27" fill="#63805d" text-anchor="start">只反转 X1：预测 0，MSE = 2</text><text x="665" y="390" font-size="27" fill="#bc5b31" text-anchor="start">两列一起反转：预测 −x，MSE = 8</text><text x="665" y="485" font-size="29" fill="#233642" text-anchor="start">删除 X1 后重新拟合</text><text x="665" y="535" font-size="26" fill="#246d91" text-anchor="start">新模型读取 X2：预测 x，MSE = 0</text><text x="665" y="625" font-size="25" fill="#687b86" text-anchor="start">三种扰动都保留原始标签。</text><text x="665" y="670" font-size="25" fill="#687b86" text-anchor="start">删除后重训改变了模型函数。</text><text x="65" y="835" font-size="27" fill="#233642" text-anchor="start">单列反转：平方误差为 4、1、0、1、4，平均为 2。</text><text x="65" y="885" font-size="27" fill="#233642" text-anchor="start">联合反转：误差幅度翻倍，平方损失变为四倍，平均为 8。</text><text x="65" y="950" font-size="25" fill="#687b86" text-anchor="start">这是确定的反向置换，不是对全部随机排列取期望；不同扰动政策要分别报告。</text></g></svg>

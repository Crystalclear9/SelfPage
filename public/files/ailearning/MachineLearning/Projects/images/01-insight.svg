<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">历史可见时间与标签成熟，共同决定数据能否使用</title><desc id="desc">历史可见时间与标签成熟，共同决定数据能否使用</desc><rect width="1200" height="880" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">历史可见时间与标签成熟，共同决定数据能否使用</text><line x1="205.0" y1="170" x2="1125.0" y2="170" stroke="#cad7e2" stroke-width="2" /><line x1="205.0" y1="270" x2="1125.0" y2="270" stroke="#cad7e2" stroke-width="2" /><line x1="205.0" y1="370" x2="1125.0" y2="370" stroke="#cad7e2" stroke-width="2" /><line x1="205.0" y1="575" x2="1125.0" y2="575" stroke="#cad7e2" stroke-width="2" /><line x1="205.0" y1="700" x2="1125.0" y2="700" stroke="#cad7e2" stroke-width="2" /><text x="262.5" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">4</text><text x="435.0" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">7</text><text x="492.5" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">8</text><text x="607.5" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">10</text><text x="665.0" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">11</text><text x="837.5" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">14</text><text x="895.0" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">15</text><text x="1010.0" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">17</text><text x="1067.5" y="110" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">18</text><text x="25" y="110" font-size="24" fill="#213447" font-weight="400" text-anchor="start">日</text><line x1="607.5" y1="130" x2="607.5" y2="420" stroke="#213447" stroke-width="2.5" stroke-dasharray="6 4" /><text x="607.5" y="455" font-size="26" fill="#213447" font-weight="600" text-anchor="middle">预测日 10</text><text x="25" y="178" font-size="26" fill="#213447" font-weight="400" text-anchor="start">晚到特征</text><line x1="262.5" y1="170" x2="665.0" y2="170" stroke="#cf7432" stroke-width="5" /><circle cx="262.5" cy="170" r="10" fill="white" stroke="#5a6c7d" stroke-width="2" /><circle cx="665.0" cy="170" r="11" fill="#cf7432" /><text x="681.0" y="152" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">晚于预测</text><text x="25" y="278" font-size="26" fill="#213447" font-weight="400" text-anchor="start">及时特征</text><line x1="435.0" y1="270" x2="492.5" y2="270" stroke="#2865a0" stroke-width="5" /><circle cx="435.0" cy="270" r="10" fill="white" stroke="#5a6c7d" stroke-width="2" /><circle cx="492.5" cy="270" r="11" fill="#2865a0" /><text x="508.5" y="252" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">可用</text><text x="25" y="378" font-size="26" fill="#213447" font-weight="400" text-anchor="start">及时特征</text><line x1="550.0" y1="370" x2="550.0" y2="370" stroke="#2865a0" stroke-width="5" /><circle cx="550.0" cy="370" r="10" fill="white" stroke="#5a6c7d" stroke-width="2" /><circle cx="550.0" cy="370" r="11" fill="#2865a0" /><text x="566.0" y="352" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">可用</text><text x="30" y="510" font-size="25" fill="#213447" font-weight="400" text-anchor="start">空心：发生；实心：可见。发生在过去，并不等于当时已经可见。</text><text x="25" y="555" font-size="26" fill="#213447" font-weight="600" text-anchor="start">标签窗口 [10,17]，另留 1 天到达余量</text><text x="25" y="628" font-size="26" fill="#213447" font-weight="400" text-anchor="start">阳性事件</text><line x1="607.5" y1="620" x2="1010.0" y2="620" stroke="#eaf2fa" stroke-width="24" /><line x1="895.0" y1="585" x2="895.0" y2="645" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="5 4" /><circle cx="780.0" cy="620" r="8" fill="#5a6c7d" /><path d="M780.0,620 L837.5,620" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" /><text x="837.5" y="590" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">14 日可确认阳性</text><text x="25" y="753" font-size="26" fill="#213447" font-weight="400" text-anchor="start">尚无事件</text><line x1="607.5" y1="745" x2="1010.0" y2="745" stroke="#eaf2fa" stroke-width="24" /><line x1="895.0" y1="710" x2="895.0" y2="770" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="5 4" /><path d="M1010.0,745 L1067.5,745" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" /><text x="1067.5" y="715" font-size="24" fill="#cf7432" font-weight="400" text-anchor="end">18 日才可确认阴性</text><text x="30" y="842" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="start">15 日只取“已收到的标签”，会偏向早到阳性；完整队列仍需成熟规则。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="718.227" viewBox="0 66.009852 1280 718.226601" role="img" aria-labelledby="title desc"><rect id="offline-white-background" x="0" y="66.009852" width="1280" height="718.226601" fill="#ffffff"/><title id="title">残差均值都为零，归一化仍可能颠倒误差排序</title><desc id="desc">残差均值都为零，归一化仍可能颠倒误差排序</desc><rect width="1280" height="800" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#728694"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203747"><text x="40" y="110" font-size="27" fill="#203747" text-anchor="start" font-weight="400">三个区间各含两个等权残差：±2、±3、±12；参考尺度事先固定为 1、10、100。</text><path d="M110 640.0L565 640.0" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="95" y="649.0" font-size="26" fill="#728694" text-anchor="end" font-weight="400">-12</text><path d="M110 535.0L565 535.0" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="95" y="544.0" font-size="26" fill="#728694" text-anchor="end" font-weight="400">-6</text><path d="M110 430.0L565 430.0" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="95" y="439.0" font-size="26" fill="#728694" text-anchor="end" font-weight="400">0</text><path d="M110 325.0L565 325.0" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="95" y="334.0" font-size="26" fill="#728694" text-anchor="end" font-weight="400">6</text><path d="M110 220.0L565 220.0" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="95" y="229.0" font-size="26" fill="#728694" text-anchor="end" font-weight="400">12</text><path d="M110 220L110 640" fill="none" stroke="#728694" stroke-width="2"/><path d="M110 640L565 640" fill="none" stroke="#728694" stroke-width="2"/><text x="100" y="185" font-size="28" fill="#203747" text-anchor="start" font-weight="400">原单位残差 r</text><path d="M110 430L565 430" fill="none" stroke="#31877b" stroke-width="2" stroke-da
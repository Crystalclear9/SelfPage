" fill="#728694" text-anchor="end" font-weight="400">1</text><path d="M750 220L1180 220" fill="none" stroke="#dce6ed" stroke-width="2"/><text x="735" y="229" font-size="26" fill="#728694" text-anchor="end" font-weight="400">2</text><path d="M750 220L750 640" fill="none" stroke="#728694" stroke-width="2"/><path d="M750 640L1180 640" fill="none" stroke="#728694" stroke-width="2"/><text x="965.0" y="724" font-size="28" fill="#203747" text-anchor="middle" font-weight="400">相同的目标区间</text><text x="740" y="195" font-size="28" fill="#203747" text-anchor="start" font-weight="400">MAE ÷ 参考尺度</text><path d="M750 640L750 220.0" fill="none" stroke="#286da2" stroke-width="5"/><circle cx="750" cy="220.0" r="7" fill="#286da2" stroke="#286da2" stroke-width="2"/><path d="M965 640L965 577.0" fill="none" stroke="#286da2" stroke-width="5"/><circle cx="965" cy="577.0" r="7" fill="#286da2" stroke="#286da2" stroke-width="2"/><text x="977" y="563.0" font-size="30" fill="#286da2" text-anchor="start" font-weight="400">0.3</text><path d="M1180 640L1180 614.8" fill="none" stroke="#286da2" stroke-width="5"/><circle cx="1180" cy="614.8" r="7" fill="#286da2" stroke="#286da2" stroke-width="2"/><text x="1192" y="600.8" font-size="30" fill="#286da2" text-anchor="start" font-weight="400">0.12</text><text x="65" y="758" font-size="29" fill="#203747" text-anchor="start" font-weight="400">原单位 MAE = 2、3、12；归一化后 = 2、0.3、0.12。</text></g></svg>

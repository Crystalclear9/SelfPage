<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="604" viewBox="0 0 1360 604" role="img" aria-labelledby="title desc"><title id="title">目标变换改变回归优化的几何</title><desc id="desc">取响应 1 和 9。原尺度算术平均为 5，平均对数取指数为 3。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="604" fill="white" stroke="none" stroke-width="1.55"/><text x="680" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">平均后再逆变换，结果会改变</text><text x="124" y="179" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">原尺度</text><polygon points="249.5,207 501.5,207 534.5,131 282.5,131" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="392" y="179.54" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">1 与 9</text><line x1="554" y1="169" x2="702" y2="169" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="719.5,207 939.5,207 972.5,131 752.5,131" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="846" y="179.54" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">均值为 5</text><text x="124" y="387" fill="#655184" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">对数尺度</text><polygon points="249.5,415 501.5,415 534.5,339 282.5,339" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="392" y="387.54" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">ln 1 与 ln 9</text><line x1="554" y1="377" x2="702" y2="377" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="719.5,415 939.5,415 972.5,339 752.5,339" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="846" y="387.54" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">均值为 ln 3</text><line x1="986" y1="377" x2="1084" y2="377" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="1097,415 1254,415 1285,339 1128,339" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="1191" y="386.52" fill="#a84b3b" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">取指数得 3</text><text x="670" y="544" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">原尺度的平方误差目标需要原尺度的条件均值</text></svg>
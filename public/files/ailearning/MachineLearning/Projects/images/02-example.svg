<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812.592" viewBox="0 67.408185 1200 812.591815" role="img"><rect id="offline-white-background" x="0" y="67.408185" width="1200" height="812.591815" fill="#ffffff"/><title>阈值在同四条记录上移动时，错分对象与成本逐项改变</title><desc>真标签1、0、1、0，分数0.8、0.6、0.4、0.2，误报成本1漏报成本4。</desc><rect width="1200" height="880" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="110" font-size="26" fill="#687b86" text-anchor="start">蓝点：真实正类；橙点：真实负类。分数 ≥ 阈值时采取行动。</text><text x="65" y="160" font-size="29" fill="#233642" text-anchor="start">阈值 0.3</text><rect x="340.0" y="190" width="420.0" height="80" fill="#edf4f6"/><line x1="160" y1="230" x2="760" y2="230" stroke="#dce5e9" stroke-width="2"/><line x1="340.0" y1="175" x2="340.0" y2="285" stroke="#233642" stroke-width="2" stroke-dasharray="7 5"/><circle cx="280.0" cy="230" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="280.0" y="310" font-size="26" fill="#687b86" text-anchor="middle">0.2</text><circle cx="400.0" cy="230" r="13" fill="#246d91" stroke="white" stroke-width="2"/><text x="400.0" y="310" font-size="26" fill="#687b86" text-anchor="middle">0.4</text><circle cx="520.0" cy="230" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="520.0" cy="230" r="23" fill="none" stroke="#233642" stroke-width="2"/><text x="520.0" y="310" font-size="26" fill="#687b86" text-anchor="middle">0.6</text><circle cx="640.0" cy="230" r="13" fill="#246d91" stroke="white" stroke-width="2"/><text x="640.0" y="310" font-size="26" fill="#687b86" text-anchor="middle">0.8</text><text x="1120" y="220" font-size="25" fill="#233642" text-anchor="end">误报 1</text><text x="1120" y="265" font-size="28" fill="#bc5b31" text-anchor="end">成本 1</text><text x="65" y="365" font-size="29" fill="#233642" text-anchor="start">阈值 0.5</text><rect x="460.0" y="395" width="300.0" height="80" fill="#edf4f6"/><line x1="160" y1="435" x2="760" y2="435" stroke="#dce5e9" stroke-width="2"/><line x1="460.0" y1="380" x2="460.0" y2="490" stroke="#233642" stroke-width="2" stroke-dasharray="7 5"/><circle cx="280.0" cy="435" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="280.0" y="515" font-size="26" fill="#687b86" text-anchor="middle">0.2</text><circle cx="400.0" cy="435" r="13" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="400.0" cy="435" r="23" fill="none" stroke="#233642" stroke-width="2"/><text x="400.0" y="515" font-size="26" fill="#687b86" text-anchor="middle">0.4</text><circle cx="520.0" cy="435" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="520.0" cy="435" r="23" fill="none" stroke="#233642" stroke-width="2"/><text x="520.0" y="515" font-size="26" fill="#687b86" text-anchor="middle">0.6</text><circle cx="640.0" cy="435" r="13" fill="#246d91" stroke="white" stroke-width="2"/><text x="640.0" y="515" font-size="26" fill="#687b86" text-anchor="middle">0.8</text><text x="1120" y="425" font-size="25" fill="#233642" text-anchor="end">误报 1 + 漏报 1</text><text x="1120" y="470" font-size="28" fill="#bc5b31" text-anchor="end">成本 5</text><text x="65" y="570" font-size="29" fill="#233642" text-anchor="start">阈值 0.7</text><rect x="580.0" y="600" width="180.0" height="80" fill="#edf4f6"/><line x1="160" y1="640" x2="760" y2="640" stroke="#dce5e9" stroke-width="2"/><line x1="580.0" y1="585" x2="580.0" y2="695" stroke="#233642" stroke-width="2" stroke-dasharray="7 5"/><circle cx="280.0" cy="640" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="280.0" y="720" font-size="26" fill="#687b86" text-anchor="middle">0.2</text><circle cx="400.0" cy="640" r="13" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="400.0" cy="640" r="23" fill="none" stroke="#233642" stroke-width="2"/><text x="400.0" y="720" font-size="26" fill="#687b86" text-anchor="middle">0.4</text><circle cx="520.0" cy="640" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="520.0" y="720" font-size="26" fill="#687b86" text-anchor="middle">0.6</text><circle cx="640.0" cy="640" r="13" fill="#246d91" stroke="white" stroke-width="2"/><text x="640.0" y="720" font-size="26" fill="#687b86" text-anchor="middle">0.8</text><text x="1120" y="630" font-size="25" fill="#233642" text-anchor="end">漏报 1</text><text x="1120" y="675" font-size="28" fill="#bc5b31" text-anchor="end">成本 4</text><text x="65" y="820" font-size="26" fill="#233642" text-anchor="start">圈线标出错分对象；阴影标出采取行动的分数范围。</text><text x="65" y="860" font-size="25" fill="#687b86" text-anchor="start">本例成本：一次误报 1，一次漏报 4；阈值应在开发阶段确定。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>沿对象身份追踪置换：坐标离开联合支持，固定模型输出改变</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">沿对象身份追踪置换：坐标离开联合支持，固定模型输出改变</text><text x="60" y="111" font-size="26" fill="#71858b" text-anchor="start">与第 4.3 节相同反向置换：只替换 X1，X2 和真实标签 y 始终不动</text><line x1="163" y1="674.3" x2="163" y2="209.70000000000002" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><line x1="132.70000000000002" y1="644" x2="597.3" y2="644" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="163" y="714" font-size="24" fill="#71858b" text-anchor="middle">-2</text><text x="112" y="653" font-size="24" fill="#71858b" text-anchor="end">-2</text><line x1="264" y1="674.3" x2="264" y2="209.70000000000002" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><line x1="132.70000000000002" y1="543" x2="597.3" y2="543" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="264" y="714" font-size="24" fill="#71858b" text-anchor="middle">-1</text><text x="112" y="552" font-size="24" fill="#71858b" text-anchor="end">-1</text><line x1="365" y1="674.3" x2="365" y2="209.70000000000002" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><line x1="132.70000000000002" y1="442" x2="597.3" y2="442" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="365" y="714" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="112" y="451" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="466" y1="674.3" x2="466" y2="209.70000000000002" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><line x1="132.70000000000002" y1="341" x2="597.3" y2="341" stroke="#dce7e9" stroke-width="1" stroke-dasharray=""/><text x="466" y="714" font-size="24" fill="#71858b" text-anchor="middle">1</text><text x="112" y="350" font-size="24" fill="#71858b" text-anchor="end">1</t
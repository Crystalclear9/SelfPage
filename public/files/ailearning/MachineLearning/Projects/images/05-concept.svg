<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1410" viewBox="0 0 1800 1410" role="img"><title>单位适配在调用同一参数模型之前发生</title><rect width="1800" height="1410" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="85" font-size="36" fill="#176b91" text-anchor="start" font-weight="700">秒入口</text><rect x="70" y="140" width="350" height="140" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="245.0" y="228" font-size="39" fill="#176b91" text-anchor="middle" font-weight="400">2 秒</text><rect x="700" y="140" width="370" height="140" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="885.0" y="228" font-size="39" fill="#176b91" text-anchor="middle" font-weight="400">2 秒</text><rect x="1370" y="140" width="350" height="140" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1545.0" y="228" font-size="39" fill="#176b91" text-anchor="middle" font-weight="400">输出 1</text><line x1="450" y1="210" x2="660" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><line x1="1110" y1="210" x2="1330" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="560" y="315" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">已经是秒</text><text x="1210" y="105" font-size="30" fill="#203b4a" text-anchor="middle" font-weight="400">同一模型 f(t) = 0.5t</text><text x="70" y="545" font-size="36" fill="#218579" text-anchor="start" font-weight="700">毫秒入口</text><rect x="70" y="600" width="350" height="140" rx="4" fill="#eaf6f2" stroke="#218579" stroke-width="2"/><text x="245.0" y="688" font-size="39" fill="#218579" text-anchor="middle" font-weight="400">2000 毫秒</text><rect x="700" y="600" width="370" height="140" rx="4" fill="#eaf6f2" stroke="#218579" stroke-width="2"/><text x="885.0" y="688" font-size="39" fill="#218579" text-anchor="middle" font-weight="400">2 秒</text><rect x="1370" y="600" width="350" height="140" rx="4" fill="#eaf6f2" stroke="#218579" stroke-width="2"/><text x="1545.0" y="688" font-size="39" fill="#218579" text-anchor="middle" font-weight="400">输出 1</text><line x1="450" y1="670" x2="660" y2="670" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><line x1="1110" y1="670" x2="1330" y2="670" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><text x="560" y="775" font-size="31" fill="#218579" text-anchor="middle" font-weight="400">单位适配</text><text x="1210" y="565" font-size="30" fill="#203b4a" text-anchor="middle" font-weight="400">同一模型 f(t) = 0.5t</text><text x="560" y="858" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">2000</text><line x1="480" y1="873" x2="640" y2="873" stroke="#218579" stroke-width="2"/><text x="560" y="915" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">1000</text><rect x="180" y="1170" width="1440" height="140" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="900" y="1225" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">漏掉适配：2000 被当作“秒”送进模型</text><text x="900" y="1285" font-size="38" fill="#d87332" text-anchor="middle" font-weight="400">f(2000) = 1000 ≠ 1</text></g></svg>
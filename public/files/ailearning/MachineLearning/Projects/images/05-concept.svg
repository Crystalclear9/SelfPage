<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>单位适配必须与预测可交换：同一物理时长走两条合法路径</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">单位适配必须与预测可交换：同一物理时长走两条合法路径</text><text x="60" y="112" font-size="26" fill="#71858b" text-anchor="start">模型约定秒；令 u = 1000t。毫秒入口的完整函数应为 h(u) = f(u ÷ 1000)。</text><text x="60" y="214" font-size="26" fill="#183944" text-anchor="start">秒</text><line x1="250" y1="205" x2="1130" y2="205" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="260" y1="197" x2="260" y2="213" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="260" y="185" font-size="25" fill="#183944" text-anchor="middle">0</text><line x1="540" y1="197" x2="540" y2="213" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="540" y="185" font-size="25" fill="#183944" text-anchor="middle">1</text><line x1="820" y1="197" x2="820" y2="213" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="820" y="185" font-size="25" fill="#183944" text-anchor="middle">2</text><line x1="1100" y1="197" x2="1100" y2="213" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1100" y="185" font-size="25" fill="#183944" text-anchor="middle">3</text><text x="60" y="314" font-size="26" fill="#183944" text-anchor="start">毫秒</text><line x1="250" y1="305" x2="1130" y2="305" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><line x1="260" y1="297" x2="260" y2="313" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="260" y="285" font-size="25" fill="#183944" text-anchor="middle">0</text><line x1="540" y1="297" x2="540" y2="313" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="540" y="285" font-size="25" fill="#183944" text-anchor="middle">1000</text><line x1="820" y1="297" x2="820" y2="313" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="820" y="285" font-size="25" fill="#183944" text-anchor="middle">2000</text><line x1="1100" y1="297" x2="1100" y2="313" stroke="#71858b" stroke-width="2" stroke-dasharray=""/><text x="1100" y="285" font-size="25" fill="#183944" text-anchor="middle">3000</text><line x1="260" y1="218" x2="260" y2="270" stroke="#dce7e9" stroke-width="2" stroke-dasharray="6 5"/><line x1="540" y1="218" x2="540" y2="270" stroke="#dce7e9" stroke-width="2" stroke-dasharray="6 5"/><line x1="820" y1="218" x2="820" y2="270" stroke="#dce7e9" stroke-width="2" stroke-dasharray="6 5"/><line x1="1100" y1="218" x2="1100" y2="270" stroke="#dce7e9" stroke-width="2" stroke-dasharray="6 5"/><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#246b82"/></marker></defs><text x="155" y="421" font-size="31" fill="#183944" text-anchor="start">t = 2 秒</text><text x="1000" y="421" font-size="31" fill="#246b82" text-anchor="start">输出 1</text><line x1="360" y1="412" x2="930" y2="412" stroke="#246b82" stroke-width="3" marker-end="url(#ar)"/><text x="645" y="392" font-size="29" fill="#246b82" text-anchor="middle">f(t) = 0.5t</text><text x="155" y="596" font-size="31" fill="#183944" text-anchor="start">u = 2000 毫秒</text><text x="1000" y="596" font-size="31" fill="#246b82" text-anchor="start">输出 1</text><line x1="440" y1="586" x2="930" y2="586" stroke="#246b82" stroke-width="3" marker-end="url(#ar)"/><text x="685" y="566" font-size="29" fill="#246b82" text-anchor="middle">h(u) = u ÷ 2000</text><line x1="220" y1="550" x2="220" y2="453" stroke="#246b82" stroke-width="3" marker-end="url(#ar)"/><text x="68" y="507" font-size="27" fill="#246b82" text-anchor="start">÷1000</text><line x1="1050" y1="452" x2="1050" y2="551" stroke="#246b82" stroke-width="3" stroke-dasharray=""/><text x="1095" y="507" font-size="27" fill="#246b82" text-anchor="start">相同</text><text x="60" y="704" font-size="28" fill="#c0673e" text-anchor="start">漏转换直接调用 f(2000) = 1000：参数文件可完好，输入语义仍已改变。</text></g></svg>

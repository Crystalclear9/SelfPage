<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="759.386" viewBox="0 62.050985 1280 759.385863" role="img"><rect id="offline-white-background" x="0" y="62.050985" width="1280" height="759.385863" fill="#ffffff"/><title>共享实体的隔离，必须沿整条关联路径传递</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">四条记录分别连接一个设备与一个现场；同色表示不能拆开的连通分量</text><text x="65" y="190" font-size="29" fill="#20343e" text-anchor="start">记录—实体关联矩阵</text><text x="175" y="255" font-size="27" fill="#20343e" text-anchor="middle">A</text><text x="233" y="255" font-size="27" fill="#20343e" text-anchor="middle">B</text><text x="291" y="255" font-size="27" fill="#20343e" text-anchor="middle">C</text><text x="349" y="255" font-size="27" fill="#20343e" text-anchor="middle">X</text><text x="407" y="255" font-size="27" fill="#20343e" text-anchor="middle">Y</text><text x="465" y="255" font-size="27" fill="#20343e" text-anchor="middle">Z</text><text x="70" y="323" font-size="27" fill="#216983" text-anchor="start">r1</text><rect x="145" y="285" width="53" height="56" fill="#e7f0f4"/><circle cx="171" cy="313" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="203" y="285" width="53" height="56" fill="#f8fafb"/><rect x="261" y="285" width="53" height="56" fill="#f8fafb"/><rect x="319" y="285" width="53" height="56" fill="#e7f0f4"/><circle cx="345" cy="313" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="377" y="285" width="53" height="56" fill="#f8fafb"/><rect x="435" y="285" width="53" height="56" fill="#f8fafb"/><text x="70" y="398" font-size="27" fill="#216983" text-anchor="start">r2</text><rect x="145" y="360" width="53" height="56" fill="#e7f0f4"/><circle cx="171" cy="388" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="203" y="360" width="53" height="56" fill="#f8fafb"/><rect x="261" y="360" width="53" height="56" fill="#f8fafb"/><rect x="319" y="360" width="53" height="56" fill="#f8fafb"/><rect x="377" y="360" width="53" height="56" fill="#e7f0f4"/><circle cx="403" cy="388" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="435" y="360" width="53" height="56" fill="#f8fafb"/><text x="70" y="473" font-size="27" fill="#216983" text-anchor="start">r3</text><rect x="145" y="435" width="53" height="56" fill="#f8fafb"/><rect x="203" y="435" width="53" height="56" fill="#e7f0f4"/><circle cx="229" cy="463" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="261" y="435" width="53" height="56" fill="#f8fafb"/><rect x="319" y="435" width="53" height="56" fill="#f8fafb"/><rect x="377" y="435" width="53" height="56" fill="#e7f0f4"/><circle cx="403" cy="463" r="9" fill="#216983" stroke="#216983" stroke-width="2"/><rect x="435" y="435" width="53" height="56" fill="#f8fafb"/><text x="70" y="548" font-size="27" fill="#bc5b32" text-anchor="start">r4</text><rect x="145" y="510" width="53" height="56" fill="#f8fafb"/><rect x="203" y="510" width="53" height="56" fill="#f8fafb"/><rect x="261" y="510" width="53" height="56" fill="#e7f0f4"/><circle cx="287" cy="538" r="9" fill="#bc5b32" stroke="#bc5b32" stroke-width="2"/><rect x="319" y="510" width="53" height="56" fill="#f8fafb"/><rect x="377" y="510" width="53" height="56" fill="#f8fafb"/><rect x="435" y="510" width="53" height="56" fill="#e7f0f4"/><circle cx="461" cy="538" r="9" fill="#bc5b32" stroke="#bc5b32" stroke-width="2"/><text x="125" y="645" font-size="25" fill="#627882" text-anchor="start">A、B、C：设备；X、Y、Z：现场</text><text x="690" y="190" font-size="29" fill="#20343e" text-anchor="start">相同关系画成二部图</text><line x1="780" y1="310" x2="1115" y2="310" stroke="#216983" stroke-width="4"/><text x="947.5" y="296.0" font-size="26" fill="#216983" text-anchor="middle">r1</text><line x1="780" y1="310" x2="1115" y2="440" stroke="#216983" stroke-width="4"/><text x="947.5" y="361.0" font-size="26" fill="#216983" text-anchor="middle">r2</text><line x1="780" y1="440" x2="1115" y2="440" stroke="#216983" stroke-width="4"/><text x="947.5" y="426.0" font-size="26" fill="#216983" text-anchor="middle">r3</text><line x1="780" y1="570" x2="1115" y2="570" stroke="#bc5b32" stroke-width="4"/><text x="947.5" y="556.0" font-size="26" fill="#bc5b32" text-anchor="middle">r4</text><circle cx="755" cy="310" r="29" fill="white" stroke="#216983" stroke-width="2"/><text x="755" y="319" font-size="27" fill="#216983" text-anchor="middle">A</text><circle cx="755" cy="440" r="29" fill="white" stroke="#216983" stroke-width="2"/><text x="755" y="449" font-size="27" fill="#216983" text-anchor="middle">B</text><circle cx="755" cy="570" r="29" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="755" y="579" font-size="27" fill="#bc5b32" text-anchor="middle">C</text><circle cx="1140" cy="310" r="29" fill="white" stroke="#216983" stroke-width="2"/><text x="1140" y="319" font-size="27" fill="#216983" text-anchor="middle">X</text><circle cx="1140" cy="440" r="29" fill="white" stroke="#216983" stroke-width="2"/><text x="1140" y="449" font-size="27" fill="#216983" text-anchor="middle">Y</text><circle cx="1140" cy="570" r="29" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="1140" y="579" font-size="27" fill="#bc5b32" text-anchor="middle">Z</text><text x="65" y="735" font-size="27" fill="#20343e" text-anchor="start">分量 1：{r1, r2, r3}；分量 2：{r4}。任何共享实体均不跨集合，至少要这样分组。</text><text x="65" y="795" font-size="27" fill="#20343e" text-anchor="start">按设备拆开 A 与 B，仍会把现场 Y 分到两侧；设备与现场拼接成复合键也无济于事。</text></g></svg>

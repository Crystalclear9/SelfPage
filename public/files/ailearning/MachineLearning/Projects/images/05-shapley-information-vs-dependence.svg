<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img"><title>没有读取的字段，为什么仍能获得一半条件归因？</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">没有读取的字段，为什么仍能获得一半条件归因？</text><text x="60" y="115" font-size="26" fill="#183944" text-anchor="start">模型 f(x1, x2) = x1；背景只有 (−2, −2) 与 (2, 2)，解释对象为 (2, 2)</text><text x="70" y="185" font-size="30" fill="#183944" text-anchor="start">先固定四个集合的值</text><text x="75" y="245" font-size="26" fill="#183944" text-anchor="start">已知字段</text><text x="315" y="245" font-size="26" fill="#183944" text-anchor="start">边缘替换</text><text x="510" y="245" font-size="26" fill="#183944" text-anchor="start">条件信息</text><line x1="70" y1="270" x2="650" y2="270" stroke="#183944" stroke-width="2" stroke-dasharray=""/><text x="80" y="325" font-size="28" fill="#183944" text-anchor="start">无</text><text x="370" y="325" font-size="29" fill="#246b82" text-anchor="middle">0</text><text x="570" y="325" font-size="29" fill="#c0673e" text-anchor="middle">0</text><text x="80" y="410" font-size="28" fill="#183944" text-anchor="start">只有 x1</text><text x="370" y="410" font-size="29" fill="#246b82" text-anchor="middle">2</text><text x="570" y="410" font-size="29" fill="#c0673e" text-anchor="middle">2</text><rect x="70" y="452" width="580" height="70" fill="#fff1e7"/><text x="80" y="495" font-size="28" fill="#183944" text-anchor="start">只有 x2</text><text x="370" y="495" font-size="29" fill="#246b82" text-anchor="middle">0</text><text x="570" y="495" font-size="29" fill="#c0673e" text-anchor="middle">2</text><text x="80" y="580" font-size="28" fill="#183944" text-anchor="start">x1 与 x2</text><text x="370" y="580" font-size="29" fill="#246b82" text-anchor="middle">2</text><text x="570" y="580" font-size="29" fill="#c0673e" text-anchor="middle">2</text><text x="740" y="185" font-size="29" fill="#183944" text-anchor="start">再平均两种加入顺序的增量</text><text x="740" y="245" font-size="25" fill="#183944" text-anchor="start">蓝色：x1 贡献；橙色：x2 贡献</text><text x="740" y="320" font-size="28" fill="#183944" text-anchor="start">边缘替换</text><rect x="740" y="345" width="440" height="64" fill="#246b82"/><text x="960" y="388" font-size="29" fill="white" text-anchor="middle">2</text><text x="740" y="470" font-size="28" fill="#183944" text-anchor="start">条件信息</text><rect x="740" y="495" width="220" height="64" fill="#246b82"/><rect x="960" y="495" width="220" height="64" fill="#c0673e"/><text x="850" y="538" font-size="29" fill="white" text-anchor="middle">1</text><text x="1070" y="538" font-size="29" fill="white" text-anchor="middle">1</text><text x="740" y="620" font-size="25" fill="#183944" text-anchor="start">两种贡献和都等于：预测 2 − 基准 0</text><line x1="60" y1="665" x2="1220" y2="665" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="70" y="720" font-size="28" fill="#c0673e" text-anchor="start">知道 x2 = 2 已能推断 x1 = 2，所以条件信息值会上升。</text><text x="70" y="770" font-size="26" fill="#183944" text-anchor="start">解释的信息来源、程序读取的字段与真实干预效果，是三个不同问题。</text></g></svg>

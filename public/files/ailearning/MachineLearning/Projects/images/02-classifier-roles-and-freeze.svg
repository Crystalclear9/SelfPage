Gradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="606" fill="white" stroke="none" stroke-width="1.55"/><text x="209" y="67" fill="#196f77" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">训练样本</text><circle cx="97" cy="174" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="134" cy="203" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="171" cy="232" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="208" cy="174" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="245" cy="203" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="282" cy="232" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="319" cy="174" r="6" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><line x1="209" y1="247" x2="209" y2="323" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="71.5,410 313.5,410 346.5,330 104.5,330" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="209" y="380.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">拟合分数函数</text><line x1="359" y1="370" x2="518" y2="370" stroke="#202a37" stroke-width="2" stroke-linecap="roun
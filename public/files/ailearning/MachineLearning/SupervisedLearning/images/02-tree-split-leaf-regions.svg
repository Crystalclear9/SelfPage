<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="616" viewBox="0 0 1360 616" role="img" aria-labelledby="title desc"><title id="title">树的递归切分怎样形成预测区域</title><desc id="desc">根节点先切 x1，右侧子区域再切 x2。左、右上和右下对应三个叶节点。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="616" fill="white" stroke="none" stroke-width="1.55"/><text x="310" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">分区几何</text><text x="1034" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">对应树结构</text><rect x="113" y="132" width="203" height="350" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><rect x="316" y="132" width="256" height="177" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><rect x="316" y="309" width="256" height="173" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.55"/><line x1="316" y1="132" x2="316" y2="482" stroke="#202a37" stroke-width="2.35" stroke-linecap="round"/><line x1="316" y1="309" x2="572" y2="309" stroke="#202a37" stroke-width="2.35" stroke-linecap="round"/><text x="211" y="308" fill="#196f77" font-size="35" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">L</text><text x="433" y="225" fill="#655184" font-size="35" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">U</text><text x="433" y="406" fill="#a84b3b" font-size="35" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">D</text><line x1="985.2011" y1="161.3583" x2="824.2045" y2="260.5437" stroke="#657682" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="1041.712" y1="165.6153" x2="1148.235" y2="255.8001" stroke="#657682" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="1158.627" y1="310.1496" x2="1092.587" y2="409.519" stroke="#657682" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="1196.862" y1="310.4828" x2="1259.983" y2="409.1477" stroke="#657682" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-gray)"/><circle cx="1015" cy="143" r="32" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="1015" y="153.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">x₁</text><circle cx="791" cy="281" r="32" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><text x="791" y="291.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">L</text><circle cx="1178" cy="281" r="32" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="1178" y="291.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">x₂</text><circle cx="1071" cy="442" r="32" stroke="#655184" stroke-width="1.7" fill="url(#wash-violet)"/><text x="1071" y="452.2" fill="#655184" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">U</text><circle cx="1281" cy="442" r="32" stroke="#a84b3b" stroke-width="1.7" fill="url(#wash-coral)"/><text x="1281" y="452.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">D</text><text x="668" y="563" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">第二次切分只作用于右侧子区域</text></svg>
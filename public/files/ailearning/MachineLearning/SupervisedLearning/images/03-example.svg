<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="577.201" viewBox="0 57.258297 1200 577.200577" role="img" aria-labelledby="title desc">
  <rect id="offline-white-background" x="0" y="57.258297" width="1200" height="577.200577" fill="#ffffff"/><title id="title">软间隔 SVM：样本位置与 KKT 条件</title>
  <desc id="desc">四个正类样本按函数间隔的位置，分别展示松弛变量和对偶乘子的KKT条件，包含间隔边界退化情形。</desc>
  <rect width="1200" height="640" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/>
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="35" y="100" font-size="26" fill="#213447" font-weight="400" text-anchor="start">正类样本 y = +1；横轴为函数间隔 m = y f(x)</text>
    <rect x="88.00000000000001" y="155" width="287.0" height="150" fill="#fff0e3"/>
    <rect x="375.0" y="155" width="410.0" height="150" fill="#f3f6fa"/>
    <line x1="70" y1="235" x2="1120" y2="235" stroke="#5a6c7d" stroke-width="2"/>
    <line x1="375.0" y1="150" x2="375.0" y2="310" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="375.0" y="140" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">决策边界</text>
    <line x1="785.0" y1="150" x2="785.0" y2="310" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="785.0" y="140" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">规范化间隔边界</text>
    <circle cx="170.0" cy="235" r="11" fill="#cf7432"/>
    <text x="170.0" y="285" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">-0.5</text>
    <circle cx="580.0" cy="235" r="11" fill="#cf7432"/>
    <text x="580.0" y="285" font-size="25" fill="#cf7432" font-weight="400" text-anchor="middle">0.5</text>
    <circle cx="785.0" cy="235" r="11" fill="#2865a0"/>
    <text x="785.0" y="285" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">1</text>
    <circle cx="990.0" cy="235" r="11" fill="#2865a0"/>
    <text x="990.0" y="285" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">1.5</text>
    <text x="167" y="380" font-size="23" fill="#213447" font-weight="600" text-anchor="middle">错分</text>
    <text x="167" y="430" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">ξ = 1.5</text>
    <text x="167" y="480" font-size="27" fill="#cf7432" font-weight="400" text-anchor="middle">α = C</text>
    <text x="462" y="380" font-size="23" fill="#213447" font-weight="600" text-anchor="middle">分类正确，侵入间隔</text>
    <text x="462" y="430" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">ξ = 0.5</text>
    <text x="462" y="480" font-size="27" fill="#cf7432" font-weight="400" text-anchor="middle">α = C</text>
    <text x="757" y="380" font-size="23" fill="#213447" font-weight="600" text-anchor="middle">恰在间隔上</text>
    <text x="757" y="430" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">ξ = 0</text>
    <text x="757" y="480" font-size="27" fill="#2865a0" font-weight="400" text-anchor="middle">0 ≤ α ≤ C</text>
    <text x="1052" y="380" font-size="23" fill="#213447" font-weight="600" text-anchor="middle">严格在间隔外</text>
    <text x="1052" y="430" font-size="26" fill="#213447" font-weight="400" text-anchor="middle">ξ = 0</text>
    <text x="1052" y="480" font-size="27" fill="#2865a0" font-weight="400" text-anchor="middle">α = 0</text>
    <text x="35" y="565" font-size="25" fill="#213447" font-weight="400" text-anchor="start">条件：标准 L1 松弛目标、C &gt; 0、最优解满足 KKT</text>
    <text x="35" y="610" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="start">边界点可退化：m = 1 并不保证 0 &lt; α &lt; C</text>
  </g>
</svg>

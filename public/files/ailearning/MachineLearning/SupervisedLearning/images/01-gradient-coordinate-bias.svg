<title id="title">同一训练解直线在欧氏范数和重参数化范数下有不同切点；相同零训练误差仍能产生不同新输入预测</title>
<desc id="description">两种度量在同一插值解直线有不同切点，未约束方向的初始化则得到第三个解。三者训练预测相同，在新输入上的预测不同。</desc>

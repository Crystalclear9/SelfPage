<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" role="img" aria-labelledby="title description">
<title id="title">单调变换保持训练排序但不保证未见点预测相同</title>
<desc id="description">两条轴均使用原始 x。原尺度算术中点为五，对数中点映回三，两棵树仅在三开五闭的区间给出不同预测。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="494" fill="white" stroke="none" stroke-width="1.6"/>
<rect x="462" y="119" width="182" height="247" fill="url(#wash-v)" stroke="none" stroke-width="1.6"/>
<text x="488.0" y="75" fill="#655281" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">分歧区间</text>
<text x="614.0" y="75" fill="#655281" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">(3, 5]</text>
<text x="115" y="122" fill="#212c39" font-size="31" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">原坐标取中点</text>
<path d="M203.56 164L644 164" stroke="#176b73" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M644 164L1101.65 164" stroke="#a44736" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1112.65 164 L1098.65 158.5L1098.65 169.5Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="644" cy="164" r="7.8" fill="#176b73" stroke="none" stroke-width="1.6"/>
<circle cx="644" cy="179" r="6.7" fill="white" stroke="#a44736" stroke-width="2.3"/>
<text x="644" y="225" fill="#655281" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">5</text>
<circle cx="280" cy="164" r="7.2" fill="#176b73" stroke="white" stroke-width="2"/>
<text x="280" y="203" fill="#176b73" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<circle cx="1008" cy="164" r="7.2" fill="#a44736" stroke="white" stroke-width="2"/>
<text x="1008" y="203" fill="#a44736" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">9</text>
<path d="M553 172L553 195" stroke="#655281" stroke-width="2" fill="none" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="553" cy="164" r="8" fill="white" stroke="#655281" stroke-width="3"/>
<text x="553" y="258" fill="#655281" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">新点预测 0</text>
<text x="115" y="281" fill="#212c39" font-size="31" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">对数中点映回</text>
<path d="M203.56 323L462 323" stroke="#176b73" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M462 323L1101.65 323" stroke="#a44736" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1112.65 323 L1098.65 317.5L1098.65 328.5Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="462" cy="323" r="7.8" fill="#176b73" stroke="none" stroke-width="1.6"/>
<circle cx="462" cy="338" r="6.7" fill="white" stroke="#a44736" stroke-width="2.3"/>
<text x="462" y="384" fill="#655281" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<circle cx="280" cy="323" r="7.2" fill="#176b73" stroke="white" stroke-width="2"/>
<text x="280" y="362" fill="#176b73" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<circle cx="1008" cy="323" r="7.2" fill="#a44736" stroke="white" stroke-width="2"/>
<text x="1008" y="362" fill="#a44736" font-size="26" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">9</text>
<path d="M553 331L553 354" stroke="#655281" stroke-width="2" fill="none" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="553" cy="323" r="8" fill="white" stroke="#655281" stroke-width="3"/>
<text x="553" y="417" fill="#655281" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">新点预测 1</text>
<text x="593" y="470" fill="#536777" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">紫色标记为同一个新点 x = 4</text>
</svg>

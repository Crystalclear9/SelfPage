<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="685.181" viewBox="0 57.098446 1280 685.181347" role="img"><rect id="offline-white-background" x="0" y="57.098446" width="1280" height="685.181347" fill="#ffffff"/><title>单调变换保持训练排序但不保证未见点预测相同</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="101" fill="#627689" font-size="26" text-anchor="start" font-weight="400">两条训练记录：x = 1 → 类别 0；x = 9 → 类别 1</text><text x="48" y="156" fill="#213447" font-size="28" text-anchor="start" font-weight="700">原坐标取中点：阈值 5</text><rect x="100" y="190" width="432" height="70" fill="#e9f1f8" rx="0"/><rect x="532" y="190" width="432" height="70" fill="#fcf0e6" rx="0"/><line x1="100" y1="268" x2="964" y2="268" stroke="#213447" stroke-width="2"/><text x="280" y="236" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="400">预测 0</text><text x="750" y="236" fill="#c87536" font-size="28" text-anchor="middle" font-weight="400">预测 1</text><line x1="532" y1="175" x2="532" y2="277" stroke="#213447" stroke-width="3"/><text x="532" y="308" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">5</text><text x="48" y="368" fill="#213447" font-size="28" text-anchor="start" font-weight="700">先取 log 再取中点：映回原坐标的阈值是 3</text><rect x="100" y="402" width="216" height="70" fill="#e9f1f8" rx="0"/><rect x="316" y="402" width="648" height="70" fill="#fcf0e6" rx="0"/><line x1="100" y1="480" x2="964" y2="480" stroke="#213447" stroke-width="2"/><text x="200" y="448" fill="#2865a0" font-size="28" text-anchor="middle" font-weight="400">预测 0</text><text x="660" y="448" fill="#c87536" font-size="28" text-anchor="middle" font-weight="400">预测 1</text><line x1="316" y1="388" x2="316" y2="489" stroke="#213447" stroke-width="3"/><text x="316" y="520" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">3</text><circle cx="100" cy="268" r="9" fill="#2865a0"/><text x="100" y="306" fill="#2865a0" font-size="24" text-anchor="middle" font-weight="400">训练点 1</text><circle cx="964" cy="268" r="9" fill="#c87536"/><text x="964" y="306" fill="#c87536" font-size="24" text-anchor="middle" font-weight="400">训练点 9</text><circle cx="424" cy="240" r="10" fill="#213447"/><circle cx="100" cy="480" r="9" fill="#2865a0"/><text x="100" y="518" fill="#2865a0" font-size="24" text-anchor="middle" font-weight="400">训练点 1</text><circle cx="964" cy="480" r="9" fill="#c87536"/><text x="964" y="518" fill="#c87536" font-size="24" text-anchor="middle" font-weight="400">训练点 9</text><circle cx="424" cy="452" r="10" fill="#213447"/><text x="1010" y="232" fill="#213447" font-size="26" text-anchor="start" font-weight="700">新点 x = 4</text><text x="1010" y="271" fill="#2865a0" font-size="26" text-anchor="start" font-weight="400">上图预测 0</text><text x="1010" y="447" fill="#c87536" font-size="26" text-anchor="start" font-weight="400">下图预测 1</text><line x1="424" y1="174" x2="424" y2="480" stroke="#627689" stroke-width="2" stroke-dasharray="7 7"/><rect x="316" y="564" width="216" height="48" fill="#f7dfca" rx="0"/><text x="424" y="599" fill="#c87536" font-size="26" text-anchor="middle" font-weight="700">分歧区间</text><text x="48" y="672" fill="#213447" font-size="27" text-anchor="start" font-weight="400">训练误差都为零；若新样本都落在 (3, 5]，预测分歧率就是 100%。</text><text x="48" y="717" fill="#627689" font-size="25" text-anchor="start" font-weight="400">图中两条横轴均为原始 x；中点规则受坐标表示影响。</text></g></svg>

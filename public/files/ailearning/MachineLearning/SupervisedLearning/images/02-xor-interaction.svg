<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="758.154" viewBox="0 59.230769 1400 758.153846"><rect id="offline-white-background" x="0" y="59.230769" width="1400" height="758.153846" fill="#ffffff"/><title>异或：每个单变量切分收益为零，组合后却能完全区分</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="50" y="105" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">四种输入等概率；标签 1 表示两值不同。圆点为 1，空心方块为 0。</text><text x="50" y="170" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">先按 x1 切分：左右都各一正一负</text><rect x="98" y="473" width="34" height="34" rx="0" fill="white" stroke="#d56b1b"/><text x="157" y="498" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 0</text><circle cx="115" cy="250" r="17" fill="#2676b5" stroke="none"/><text x="157" y="258" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 1</text><circle cx="375" cy="490" r="17" fill="#2676b5" stroke="none"/><text x="417" y="498" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 1</text><rect x="358" y="233" width="34" height="34" rx="0" fill="white" stroke="#d56b1b"/><text x="417" y="258" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 0</text><line x1="245" y1="210" x2="245" y2="540" stroke="#647b8b" stroke-width="3" stroke-dasharray="8 7"/><text x="115" y="580" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">x1 = 0</text><text x="375" y="580" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">x1 = 1</text><text x="60" y="250" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">1</text><text x="60" y="490" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">0</text><text x="40" y="365" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">x2</text><text x="240" y="650" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">Gini = 0.5 → 0.5</text><text x="740" y="170" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">再按 x2 切分：四个叶子全部纯净</text><rect x="788" y="473" width="34" height="34" rx="0" fill="white" stroke="#d56b1b"/><text x="847" y="498" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 0</text><circle cx="805" cy="250" r="17" fill="#2676b5" stroke="none"/><text x="847" y="258" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 1</text><circle cx="1065" cy="490" r="17" fill="#2676b5" stroke="none"/><text x="1107" y="498" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 1</text><rect x="1048" y="233" width="34" height="34" rx="0" fill="white" stroke="#d56b1b"/><text x="1107" y="258" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">y = 0</text><line x1="935" y1="210" x2="935" y2="540" stroke="#647b8b" stroke-width="3" stroke-dasharray="8 7"/><line x1="760" y1="370" x2="1180" y2="370" stroke="#647b8b" stroke-width="3" stroke-dasharray="8 7"/><text x="805" y="580" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">x1 = 0</text><text x="1065" y="580" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">x1 = 1</text><text x="750" y="250" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">1</text><text x="750" y="490" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">0</text><text x="730" y="365" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#253f52" text-anchor="end" font-weight="400">x2</text><text x="930" y="650" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="middle" font-weight="400">每个子节点 Gini = 0.5 → 0</text><text x="50" y="730" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">树桩相加仍是 u(x1) + v(x2)；四个角的加性恒等式排除了纯异或符号。</text><text x="50" y="790" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#586e7c" text-anchor="start" font-weight="400">允许零收益中间分裂是搜索选择；深度二提供表达能力，两者都需要。</text></svg>

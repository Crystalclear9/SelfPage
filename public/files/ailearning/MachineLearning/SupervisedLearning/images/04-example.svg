<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="706.939" viewBox="0 58.142523 1200 706.939252" role="img" aria-labelledby="title desc">
  <rect id="offline-white-background" x="0" y="58.142523" width="1200" height="706.939252" fill="#ffffff"/><title id="title">Stacking：算法身份与折身份是两条不同的轴</title>
  <desc id="desc">两种不同基学习算法在每折分别拟合副本，填充完整六行两列折外特征；部署使用全数据重拟合的两个基学习器。</desc>

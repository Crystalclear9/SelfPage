<svg xmlns="http://www.w3.org/2000/svg" width="1328.64" height="871.92000" viewBox="-24.32 31.812 1328.64 871.92000" role="img" aria-labelledby="plate-title"><title id="plate-title">两种特征加入顺序和相关系数揭示Shapley价值函数的不同</title><rect id="edition-paper" x="-24.32" y="31.812" width="1328.64" height="945.767" fill="#ffffff"/><svg id="scientific-layout" x="0" y="56.132" width="1280" height="897.127" viewBox="0 56.132 1280 897.1269" overflow="hidden"><rect id="offline-white-background" x="0" y="56.131980" width="1280" height="897.126904" fill="#ffffff"/><rect width="1280" height="970" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="100" fill="#608094" font-size="26" text-anchor="start" font-weight="400">模型 f(x1, x2) = x1；解释输入 (1, 1)；背景均值为 0.5</text><text x="48" y="154" fill="#233a4b" font-size="28" text-anchor="start" font-weight="700">先看完全相关：背景只有 (0, 0) 与 (1, 1)</text><text x="48" y="205" fill="#2e77a6" font-size="27" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">边缘替换</text><text x="680" y="205" fill="#b96f41" font-size="27" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">条件观察</text><text x="60" y="275" fill="#233a4b" font-size="25" text-anchor="start" font-weight="400">先 X1，再 X2</text><rect x="265" y="250" width="200.0" height="37" fill="#2e77a6" rx="4"/><text x="365.0" y="278" fill="#ffffff" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="60" y="359" fill="#233a4b" font-size="25" text-anchor="start" font-weight="400">先 X2，再 X1</text><rect x="265" y="334" width="200.0" height="37" fill="#2e77a6" rx="4"/><text x="365.0" y="362" fill="#ffffff" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="60" y="443" fill="#2e77a6" font-size="25" text-anchor="start" font-weight="400">平均贡献：X1 = 0.5；X2 = 0</text><text x="690" y="275" fill="#233a4b" font-size="25" text-anchor="start" font-weight="400">先 X1，再 X2</text><rect x="895" y="250" width="200.0" height="37" fill="#2e77a6" rx="4"/><text x="995.0" y="278" fill="#ffffff" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="690" y="359" fill="#233a4b" font-size="25" text-anchor="start" font-weight="400">先 X2，再 X1</text><rect x="895" y="334" width="200.0" height="37" fill="#b96f41" rx="4"/><text x="995.0" y="362" fill="#ffffff" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="690" y="443" fill="#b96f41" font-size="25" text-anchor="start" font-weight="400">平均贡献：X1 = 0.25；X2 = 0.25</text><line x1="48" y1="478" x2="1232" y2="478" stroke="#e0e9ef" stroke-width="2"/><text x="48" y="524" fill="#233a4b" font-size="28" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">保持边际各半，只改变相关系数 ρ</text><line x1="125" y1="790" x2="815" y2="790" stroke="#e0e9ef" stroke-width="2"/><text x="107" y="798" fill="#608094" font-size="24" text-anchor="end" font-weight="400">0</text><line x1="125" y1="695.0" x2="815" y2="695.0" stroke="#e0e9ef" stroke-width="2"/><text x="107" y="703.0" fill="#608094" font-size="24" text-anchor="end" font-weight="400">0.25</text><line x1="125" y1="600.0" x2="815" y2="600.0" stroke="#e0e9ef" stroke-width="2"/><text x="107" y="608.0" fill="#608094" font-size="24" text-anchor="end" font-weight="400">0.5</text><text x="125" y="825" fill="#608094" font-size="24" text-anchor="middle" font-weight="400">0</text><text x="470.0" y="825" fill="#608094" font-size="24" text-anchor="middle" font-weight="400">0.5</text><text x="815" y="825" fill="#608094" font-size="24" text-anchor="middle" font-weight="400">1</text><line x1="125" y1="790" x2="815" y2="790" stroke="#233a4b" stroke-width="2"/><line x1="125" y1="790" x2="125" y2="600.0" stroke="#233a4b" stroke-width="2"/><polyline points="125,600.0 815,695.0" fill="none" stroke="#2e77a6" stroke-width="4"/><polyline points="125,790 815,695.0" fill="none" stroke="#b96f41" stroke-width="4"/><text x="900" y="610" fill="#2e77a6" font-size="27" text-anchor="start" font-weight="400">条件贡献 X1</text><text x="900" y="651" fill="#2e77a6" font-size="25" text-anchor="start" font-weight="400">从 0.5 降至 0.25</text><text x="900" y="714" fill="#b96f41" font-size="27" text-anchor="start" font-weight="400">条件贡献 X2</text><text x="900" y="755" fill="#b96f41" font-size="25" text-anchor="start" font-weight="400">从 0 升至 0.25</text><text x="125" y="570" fill="#608094" font-size="24" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">贡献</text><text x="815" y="873" fill="#608094" font-size="25" text-anchor="end" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">相关系数 ρ</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1083.9832" viewBox="0 0 1440 1083.9832" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两种特征加入顺序和相关系数揭示Shapley价值函数的不同</title><rect width="1440" height="1083.9832" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两种特征加入顺序和相关系数揭示Shapley价值函数的不同</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="941.9832" viewBox="0 56.132 1280 897.1269" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="56.131980" width="1280" height="897.126904" fill="#ffffff"/><title>两种特征加入顺序和相关系数揭示Shapley价值函数的不同</title><rect width="1280" height="970" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="100" fill="#617f97" font-size="26" text-anchor="start" font-weight="400">模型 f(x1, x2) = x1；解释输入 (1, 1)；背景均值为 0.5</text><text x="48" y="154" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">先看完全相关：背景只有 (0, 0) 与 (1, 1)</text><text x="48" y="205" fill="#2472b1" font-size="27" text-anchor="start" font-weight="700">边缘替换</text><text x="680" y="205" fill="#c57439" font-size="27" text-anchor="start" font-weight="700">条件观察</text><text x="60" y="275" fill="#1f3449" font-size="25" text-anchor="start" font-weight="400">先 X1，再 X2</text><rect x="265" y="250" width="200.0" height="37" fill="#2472b1" rx="4"/><text x="365.0" y="278" fill="white" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="60" y="359" fill="#1f3449" font-size="25" text-anchor="start" font-weight="400">先 X2，再 X1</text><rect x="265" y="334" width="200.0" height="37" fill="#2472b1" rx="4"/><text x="365.0" y="362" fill="white" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="60" y="443" fill="#2472b1" font-size="25" text-anchor="start" font-weight="400">平均贡献：X1 = 0.5；X2 = 0</text><text x="690" y="275" fill="#1f3449" font-size="25" text-anchor="start" font-weight="400">先 X1，再 X2</text><rect x="895" y="250" width="200.0" height="37" fill="#2472b1" rx="4"/><text x="995.0" y="278" fill="white" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="690" y="359" fill="#1f3449" font-size="25" text-anchor="start" font-weight="400">先 X2，再 X1</text><rect x="895" y="334" width="200.0" height="37" fill="#c57439" rx="4"/><text x="995.0" y="362" fill="white" font-size="25" text-anchor="middle" font-weight="400">+0.5</text><text x="690" y="443" fill="#c57439" font-size="25" text-anchor="start" font-weight="400">平均贡献：X1 = 0.25；X2 = 0.25</text><line x1="48" y1="478" x2="1232" y2="478" stroke="#dce5ed" stroke-width="2"/><text x="48" y="524" fill="#1f3449" font-size="28" text-anchor="start" font-weight="700">保持边际各半，只改变相关系数 ρ</text><line x1="125" y1="790" x2="815" y2="790" stroke="#dce5ed" stroke-width="2"/><text x="107" y="798" fill="#617f97" font-size="24" text-anchor="end" font-weight="400">0</text><line x1="125" y1="695.0" x2="815" y2="695.0" stroke="#dce5ed" stroke-width="2"/><text x="107" y="703.0" fill="#617f97" font-size="24" text-anchor="end" font-weight="400">0.25</text><line x1="125" y1="600.0" x2="815" y2="600.0" stroke="#dce5ed" stroke-width="2"/><text x="107" y="608.0" fill="#617f97" font-size="24" text-anchor="end" font-weight="400">0.5</text><text x="125" y="825" fill="#617f97" font-size="24" text-anchor="middle" font-weight="400">0</text><text x="470.0" y="825" fill="#617f97" font-size="24" text-anchor="middle" font-weight="400">0.5</text><text x="815" y="825" fill="#617f97" font-size="24" text-anchor="middle" font-weight="400">1</text><line x1="125" y1="790" x2="815" y2="790" stroke="#1f3449" stroke-width="2"/><line x1="125" y1="790" x2="125" y2="600.0" stroke="#1f3449" stroke-width="2"/><polyline points="125,600.0 815,695.0" fill="none" stroke="#2472b1" stroke-width="4"/><polyline points="125,790 815,695.0" fill="none" stroke="#c57439" stroke-width="4"/><text x="900" y="610" fill="#2472b1" font-size="27" text-anchor="start" font-weight="400">条件贡献 X1</text><text x="900" y="651" fill="#2472b1" font-size="25" text-anchor="start" font-weight="400">从 0.5 降至 0.25</text><text x="900" y="714" fill="#c57439" font-size="27" text-anchor="start" font-weight="400">条件贡献 X2</text><text x="900" y="755" fill="#c57439" font-size="25" text-anchor="start" font-weight="400">从 0 升至 0.25</text><text x="125" y="570" fill="#617f97" font-size="24" text-anchor="start" font-weight="400">贡献</text><text x="815" y="873" fill="#617f97" font-size="25" text-anchor="end" font-weight="400">相关系数 ρ</text><text x="48" y="927" fill="#617f97" font-size="26" text-anchor="start" font-weight="400">两条贡献之和始终为 0.5；变化来自背景依赖，不是模型参数变化。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825.878" viewBox="0 69.207623 1200 825.877633" role="img"><rect id="offline-white-background" x="0" y="69.207623" width="1200" height="825.877633" fill="#ffffff"/><title>相关输入中的PDP与条件响应</title><desc>真实分布满足X2=X1且X1均值0。固定函数f=x1x2，PDP为0，条件响应为x1²。左图固定x1=1并按五点经验边际平均X2，显示离开真实支持的组合。</desc><rect width="1200" height="920" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="50" y="112" font-size="26" fill="#233642" text-anchor="start">固定模型 f(x1, x2) = x1x2；真实输入始终满足 x2 = x1。</text><text x="50" y="183" font-size="29" fill="#233642" text-anchor="start">把 x1 固定为 1</text><line x1="110" y1="250" x2="110" y2="690" stroke="#dce5e9" stroke-width="1"/><line x1="100" y1="680" x2="540" y2="680" stroke="#dce5e9" stroke-width="1"/><line x1="215" y1="250" x2="215" y2="690" stroke="#dce5e9" stroke-width="1"/><line x1="100" y1="575" x2="540" y2="575" stroke="#dce5e9" stroke-width="1"/><line x1="320" y1="250" x2="320" y2="690" stroke="#dce5e9" stroke-width="1"/><line x1="100" y1="470" x2="540" y2="470" stroke="#dce5e9" stroke-width="1"/><line x1="425" y1="250" x2="425" y2="690" stroke="#dce5e9" stroke-width="1"/><line x1="100" y1="365" x2="540" y2="365" stroke="#dce5e9" stroke-width="1"/><line x1="530" y1="250" x2="530" y2="690" stroke="#dce5e9" stroke-width="1"/><line x1="100" y1="260" x2="540" y2="260" stroke="#dce5e9" stroke-width="1"/><polyline points="110.000,680.000 530.000,260.000" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><circle cx="110" cy="680" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="425" cy="680" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="215" cy="575" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="425" cy="575" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="320" cy="470" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="425" cy="470" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="425" cy="365" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="530" cy="260" r="6" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="425" cy="260" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><line x1="425" y1="240" x2="425" y2="690" stroke="#bc5b31" stroke-width="2" stroke-dasharray="5 7"/><text x="110" y="735" font-size="24" fill="#687b86" text-anchor="middle">-2</text><text x="320" y="735" font-size="24" fill="#687b86" text-anchor="middle">0</text><text x="425" y="735" font-size="24" fill="#687b86" text-anchor="middle">1</text><text x="530" y="735" font-size="24" fill="#687b86" text-anchor="middle">2</text><text x="552" y="735" font-size="25" fill="#687b86" text-anchor="start">x1</text><text x="95" y="235" font-size="25" fill="#687b86" text-anchor="start">x2</text><text x="83" y="688" font-size="24" fill="#687b86" text-anchor="end">-2</text><text x="83" y="478" font-size="24" fill="#687b86" text-anchor="end">0</text><text x="83" y="268" font-size="24" fill="#687b86" text-anchor="end">2</text><text x="650" y="183" font-size="29" fill="#233642" text-anchor="start">同一模型，两种平均对象</text><text x="650" y="256" font-size="27" fill="#bc5b31" text-anchor="start">PDP：沿橙色竖线替换组合</text><text x="650" y="313" font-size="26" fill="#233642" text-anchor="start">f(1, x2) = −2, −1, 0, 1, 2</text><text x="650" y="366" font-size="28" fill="#bc5b31" text-anchor="start">五点等权平均 = 0</text><text x="650" y="449" font-size="27" fill="#246d91" text-anchor="start">条件响应：仍在蓝色支持线上</text><text x="650" y="506" font-size="26" fill="#233642" text-anchor="start">知道 x1 = 1，就知道 x2 = 1</text><text x="650" y="559" font-size="28" fill="#246d91" text-anchor="start">f(1, 1) = 1</text><text x="650" y="646" font-size="26" fill="#687b86" text-anchor="start">四个橙点从未在原分布出现。</text><text x="50" y="813" font-size="25" fill="#233642" text-anchor="start">蓝线：真实支持；橙点：PDP 构造的离支持组合；蓝橙交点保留真实组合。</text><text x="50" y="871" font-size="24" fill="#687b86" text-anchor="start">一般地，PDP = x1·E[X2] = 0；条件响应 = x1²。两者都不是自动的因果效应。</text></g></svg>

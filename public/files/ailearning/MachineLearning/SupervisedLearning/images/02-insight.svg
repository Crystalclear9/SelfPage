<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>一棵树桩怎样修正四个预测？</title><rect width="1200" height="850" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="45" y="55" font-size="36" fill="#203d47" text-anchor="start">一棵树桩怎样修正四个预测？</text><text x="45" y="100" font-size="26" fill="#829298" text-anchor="start">同一组 y = (1, 3, 2, 4)；树桩固定按前两点、后两点分组</text><text x="45" y="157" font-size="29" fill="#203d47" text-anchor="start">先拟合残差</text><line x1="120" y1="320" x2="1030" y2="320" stroke="#829298" stroke-width="2" stroke-dasharray=""/><line x1="170" y1="320" x2="170" y2="420.5" stroke="#c66a36" stroke-width="4" stroke-dasharray=""/><circle cx="170" cy="420.5" r="9" fill="#203d47" stroke="#203d47" stroke-width="2"/><text x="170" y="455.5" font-size="26" fill="#203d47" text-anchor="middle">-1.5</text><text x="170" y="475" font-size="24" fill="#829298" text-anchor="middle">1</text><line x1="430" y1="320" x2="430" y2="286.5" stroke="#c66a36" stroke-width="4" stroke-dasharray=""/><circle cx="430" cy="286.5" r="9" fill="#203d47" stroke="#203d47" stroke-width="2"/><text x="430" y="269.5" font-size="26" fill="#203d47" text-anchor="middle">+0.5</text><text x="430" y="475" font-size="24" fill="#829298" text-anchor="middle">2</text><line x1="690" y1="320" x2="690" y2="353.5" stroke="#c66a36" stroke-width="4" stroke-dasharray=""/><circle cx="690" cy="353.5" r="9" fill="#203d47" stroke="#203d47" stroke-width="2"/><text x="690" y="388.5" font-size="26" fill="#203d47" text-anchor="middle">-0.5</text><text x="690" y="475" font-size="24" fill="#829298" text-anchor="middle">3</text><line x1="950" y1="320" x2="950" y2="219.5" stroke="#c66a36" stroke-width="4" stroke-dasharray=""/><circle cx="950" cy="219.5" r="9" fill="#203d47" stroke="#203d47" stroke-width="2"/><text x="950" y="202.5" font-size="26" fill="#203d47" text-anchor="middle">+1.5</text><text x="950" y="475" font-size="24" fill="#829298" text-anchor="middle">4</tex
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="708.764" viewBox="0 66.938776 1280 708.763505"><rect id="offline-white-background" x="0" y="66.938776" width="1280" height="708.763505" fill="#ffffff"/><title>近邻只作平均，局部直线还会向边界外推</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#516579" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="50" y="110" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#253f52" text-anchor="start" font-weight="400">查询 x = 0；两个邻居 x = 0.1、0.2；真实均值 m(x) = 2x。</text><line x1="130" y1="180" x2="130" y2="550" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="130" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">0</text><line x1="310.0" y1="180" x2="310.0" y2="550" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="310.0" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">0.1</text><line x1="490.0" y1="180" x2="490.0" y2="550" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="490.0" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="middle" font-weight="400">0.2</text><line x1="130" y1="550" x2="600" y2="550" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="105" y="559" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="end" font-weight="400">0</text><line x1="130" y1="380.0" x2="600" y2="380.0" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="105" y="389.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="end" font-weight="400">0.2</text><line x1="130" y1="210.0" x2="600" y2="210.0" stroke="#e4ebf0" stroke-width="2" stroke-dasharray=""/><text x="105" y="219.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#253f52" text-anchor="end" font-weight="400">0.4</text><path d="M 130,550 L 562.0,142.0" stroke="#2676b5" stroke-width="4" fill="none" stroke-dasharray=""/><circle cx="310.0" cy="380.0" r="8" fill="#2676b5" stroke="none"/><circle cx="490.0" cy="210.0" r="8" fill="#2676b5" stroke="none"/><line x1="130" y1="550" x2="130" y2="295.0" stroke="#d56b1b" stroke-width="3" stroke-dasharray="7 5"/><circle cx="130" cy="295.0" r="9" fill="#d56b1b" stroke="none"/><text x="150" y="280.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#d56b1b" text-anchor="start" font-weight="400">均值预测 0.3</text><circle cx="130" cy="550" r="9" fill="white" stroke="#2676b5"/><text x="710" y="200" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#253f52" text-anchor="start" font-weight="400">局部常数：权重 0.5、0.5</text><text x="710" y="260" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">预测 0.3；噪声方差 0.5σ²</text><text x="710" y="355" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#253f52" text-anchor="start" font-weight="400">局部直线：权重 2、−1</text><text x="710" y="415" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">预测 0；噪声方差 5σ²</text><text x="710" y="505" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">负权重使外推成为可能，</text><text x="710" y="550" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">也放大两个邻居的噪声。</text><text x="50" y="680" font-family="Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#253f52" text-anchor="start" font-weight="400">直线截距 = 2y1 − y2；权重和为 1，加权输入位置恰为查询 0。</text><text x="50" y="750" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#586e7c" text-anchor="start" font-weight="400">减少边界偏差，付出的可能是更大的方差；不能仅凭无噪声例子选方法。</text></svg>

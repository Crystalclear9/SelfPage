<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="769.167" viewBox="0 58.106061 1280 769.166667" role="img"><rect id="offline-white-background" x="0" y="58.106061" width="1280" height="769.166667" fill="#ffffff"/><title>四条路径与后向似然共同解释HMM过滤和平滑的差别</title><rect width="1280" height="845" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="102" fill="#627689" font-size="26" text-anchor="start" font-weight="400">观察为 (0, 1)；留在原状态的概率 0.9；发射与状态相同的概率 0.8</text><text x="60" y="167" fill="#213447" font-size="29" text-anchor="start" font-weight="700">过滤</text><text x="60" y="207" fill="#627689" font-size="24" text-anchor="start" font-weight="400">仅见 x1 = 0</text><text x="60" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">z1 = 0</text><rect x="155" y="246" width="176.0" height="36" fill="#2865a0" rx="4"/><text x="341.0" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">0.800</text><text x="60" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">z1 = 1</text><rect x="155" y="324" width="44.0" height="36" fill="#c87536" rx="4"/><text x="209.0" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">0.200</text><text x="465" y="167" fill="#213447" font-size="29" text-anchor="start" font-weight="700">未来似然</text><text x="465" y="207" fill="#627689" font-size="24" text-anchor="start" font-weight="400">β1 = P(x2 = 1 | z1)</text><text x="465" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">z1 = 0</text><rect x="560" y="246" width="57.2" height="36" fill="#2865a0" rx="4"/><text x="627.2" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">0.260</text><text x="465" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">z1 = 1</text><rect x="560" y="324" width="162.8" height="36" fill="#c87536" rx="4"/><text x="732.8" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">0.740</text><text x="870" y="167" fill="#213447" font-size="29" text-anchor="start" font-weight="700">平滑</text><text x="870" y="207" fill="#627689" font-size="24" text-anchor="start" font-weight="400">同时见 x1、x2</text><text x="870" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">z1 = 0</text><rect x="965" y="246" width="128.53932584269663" height="36" fill="#2865a0" rx="4"/><text x="1103.5393258426966" y="274" fill="#2865a0" font-size="25" text-anchor="start" font-weight="400">0.584</text><text x="870" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">z1 = 1</text><rect x="965" y="324" width="91.46067415730337" height="36" fill="#c87536" rx="4"/><text x="1066.4606741573034" y="352" fill="#c87536" font-size="25" text-anchor="start" font-weight="400">0.416</text><line x1="420" y1="152" x2="420" y2="400" stroke="#dce5ed" stroke-width="2"/><line x1="825" y1="152" x2="825" y2="400" stroke="#dce5ed" stroke-width="2"/><text x="48" y="434" fill="#213447" font-size="28" text-anchor="start" font-weight="700">四条路径的联合权重：先相加，再按观察总概率归一化</text><text x="180" y="482" fill="#2865a0" font-size="26" text-anchor="middle" font-weight="400">0 → 0</text><rect x="110" y="516.4" width="140" height="129.6" fill="#2865a0" rx="3"/><text x="180" y="504.4" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">0.072</text><line x1="78" y1="646" x2="282" y2="646" stroke="#213447" stroke-width="2"/><text x="470" y="482" fill="#2865a0" font-size="26" text-anchor="middle" font-weight="400">0 → 1</text><rect x="400" y="588.4" width="140" height="57.6" fill="#2865a0" rx="3"/><text x="470" y="576.4" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">0.032</text><line x1="368" y1="646" x2="572" y2="646" stroke="#213447" stroke-width="2"/><text x="760" y="482" fill="#c87536" font-size="26" text-anchor="middle" font-weight="400">1 → 0</text><rect x="690" y="642.4" width="140" height="3.6" fill="#c87536" rx="3"/><text x="760" y="630.4" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">0.002</text><line x1="658" y1="646" x2="862" y2="646" stroke="#213447" stroke-width="2"/><text x="1050" y="482" fill="#c87536" font-size="26" text-anchor="middle" font-weight="400">1 → 1</text><rect x="980" y="516.4" width="140" height="129.6" fill="#c87536" rx="3"/><text x="1050" y="504.4" fill="#213447" font-size="26" text-anchor="middle" font-weight="400">0.072</text><line x1="948" y1="646" x2="1152" y2="646" stroke="#213447" stroke-width="2"/><text x="48" y="703" fill="#213447" font-size="27" text-anchor="start" font-weight="400">总似然 0.178；第一状态为 0 的质量：0.072 + 0.032 = 0.104</text><text x="48" y="748" fill="#213447" font-size="27" text-anchor="start" font-weight="400">第一状态为 1 的质量：0.002 + 0.072 = 0.074</text><text x="48" y="799" fill="#627689" font-size="25" text-anchor="start" font-weight="400">β 是“各状态解释未来的能力”，不是状态概率；平滑需要前向 × 后向。</text></g></svg>

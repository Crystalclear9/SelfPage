<text x="990" y="501" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">0.072</text>
<text x="75" y="567" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">四条路径权重相加是观察似然 0.178。先按第一状态分组，再除以总似然。</text>
<text x="75" y="629" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">z₁ = 0 的分子为 0.072 + 0.032 = 0.104。</text>
<text x="75" y="687" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">z₁ = 1 的分子为 0.002 + 0.072 = 0.074。</text>

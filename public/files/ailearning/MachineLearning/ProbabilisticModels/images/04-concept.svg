<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1302" viewBox="0 0 960 1302" role="img" aria-labelledby="title desc">
<title id="title">前向递推按终点汇合路径</title><desc id="desc">两步转移分别按来源状态和终点状态列出联合贡献。第二时刻前向量为零点一一三和零点一零二六，第三时刻似然为零点零六九六一六。</desc>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#55728a"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="960" height="1302" rx="0" fill="#ffffff" stroke="none" stroke-width="1.8"/>
<text x="44" y="63" font-size="39" fill="#172a40" font-weight="700" text-anchor="start">前向递推按终点汇合路径</text>
<text x="46" y="106" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">观察序列为 0、1、0。每条贡献都已乘入当前发射概率。</text>
<rect x="44" y="144" width="42" height="41" rx="9" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="174" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">A</text>
<text x="103" y="174" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">从时刻 1 到时刻 2，分别累加两列</text>
<text x="48" y="232" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">进入这一步的前向量为 (0.3, 0.04)</text>
<text x="64" y="297" font-size="25" fill="#465d72" font-weight="700" text-anchor="start">来源状态</text>
<text x="470" y="297" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">终点为 0</text>
<text x="750" y="297" font-size="25" fill="#a85127" font-weight="700" text-anchor="middle">终点为 1</text>
<rect x="44" y="316" width="872" height="60" rx="8" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="355" font-size="26" fill="#172a40" font-weight="650" text-anchor="start">从状态 0 来</text>
<text x="470" y="357" font-size="29" fill="#136d84" font-weight="700" text-anchor="middle">0.105</text>
<text x="750" y="357" font-size="29" fill="#a85127" font-weight="700" text-anchor="middle">0.081</text>
<rect x="44" y="388" width="872" height="60" rx="8" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="427" font-size="26" fill="#172a40" font-weight="650" text-anchor="start">从状态 1 来</text>
<text x="470" y="429" font-size="29" fill="#136d84" font-weight="700" text-anchor="middle">0.008</text>
<text x="750" y="429" font-size="29" fill="#a85127" font-weight="700" text-anchor="middle">0.0216</text>
<rect x="44" y="474" width="872" height="70" rx="9" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="520" font-size="26" fill="#172a40" font-weight="700" text-anchor="start">时刻 2 的前向量</text>
<text x="470" y="520" font-size="30" fill="#136d84" font-weight="700" text-anchor="middle">0.113</text>
<text x="750" y="520" font-size="30" fill="#a85127" font-weight="700" text-anchor="middle">0.1026</text>
<rect x="44" y="603" width="42" height="41" rx="9" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="633" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">B</text>
<text x="103" y="633" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">从时刻 2 到时刻 3，分别累加两列</text>
<text x="48" y="691" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">进入这一步的前向量为 (0.113, 0.1026)</text>
<text x="64" y="756" font-size="25" fill="#465d72" font-weight="700" text-anchor="start">来源状态</text>
<text x="470" y="756" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">终点为 0</text>
<text x="750" y="756" font-size="25" fill="#a85127" font-weight="700" text-anchor="middle">终点为 1</text>
<rect x="44" y="775" width="872" height="60" rx="8" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="814" font-size="26" fill="#172a40" font-weight="650" text-anchor="start">从状态 0 来</text>
<text x="470" y="816" font-size="29" fill="#136d84" font-weight="700" text-anchor="middle">0.03955</text>
<text x="750" y="816" font-size="29" fill="#a85127" font-weight="700" text-anchor="middle">0.00339</text>
<rect x="44" y="847" width="872" height="60" rx="8" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="886" font-size="26" fill="#172a40" font-weight="650" text-anchor="start">从状态 1 来</text>
<text x="470" y="888" font-size="29" fill="#136d84" font-weight="700" text-anchor="middle">0.02052</text>
<text x="750" y="888" font-size="29" fill="#a85127" font-weight="700" text-anchor="middle">0.006156</text>
<rect x="44" y="933" width="872" height="70" rx="9" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="64" y="979" font-size="26" fill="#172a40" font-weight="700" text-anchor="start">时刻 3 的前向量</text>
<text x="470" y="979" font-size="30" fill="#136d84" font-weight="700" text-anchor="middle">0.06007</text>
<text x="750" y="979" font-size="30" fill="#a85127" font-weight="700" text-anchor="middle">0.009546</text>
<rect x="44" y="1054" width="42" height="41" rx="9" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="1084" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">C</text>
<text x="103" y="1084" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">同层再相加，得到观察前缀概率</text>
<rect x="44" y="1113" width="272" height="121" rx="10" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="66" y="1158" font-size="26" fill="#465d72" font-weight="650" text-anchor="start">观察到 0</text>
<text x="66" y="1205" font-size="33" fill="#136d84" font-weight="700" text-anchor="start">0.34</text>
<rect x="344" y="1113" width="272" height="121" rx="10" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="366" y="1158" font-size="26" fill="#465d72" font-weight="650" text-anchor="start">观察到 0、1</text>
<text x="366" y="1205" font-size="33" fill="#136d84" font-weight="700" text-anchor="start">0.2156</text>
<rect x="644" y="1113" width="272" height="121" rx="10" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="666" y="1158" font-size="26" fill="#465d72" font-weight="650" text-anchor="start">观察到 0、1、0</text>
<text x="666" y="1205" font-size="33" fill="#136d84" font-weight="700" text-anchor="start">0.069616</text>
</g>
</svg>

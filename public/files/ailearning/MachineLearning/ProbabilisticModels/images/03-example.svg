<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>四个观测与Poisson均值二的完整概率分箱比较</title><desc>计数0到5单列，大于等于6合为尾部，使显示概率总和为一。</desc><rect width="1200" height="780" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="65" font-size="34" fill="#233642" text-anchor="start">均值相同，计数分布仍可能不同</text><text x="65" y="110" font-size="26" fill="#687b86" text-anchor="start">观察为 0、0、4、4；蓝色为经验频率，橙色为 Poisson(2) 概率。</text><line x1="110" y1="535" x2="1110" y2="535" stroke="#dce5e9" stroke-width="2"/><text x="90" y="543" font-size="25" fill="#687b86" text-anchor="end">0</text><line x1="110" y1="372.5" x2="1110" y2="372.5" stroke="#dce5e9" stroke-width="2"/><text x="90" y="380.5" font-size="25" fill="#687b86" text-anchor="end">0.25</text><line x1="110" y1="210.0" x2="1110" y2="210.0" stroke="#dce5e9" stroke-width="2"/><text x="90" y="218.0" font-size="25" fill="#687b86" text-anchor="end">0.5</text><rect x="144" y="210.0" width="30" height="325.0" fill="#246d91"/><rect x="186" y="447.03206589620174" width="30" height="87.96793410379826" fill="#bc5b31"/><text x="159" y="193.0" font-size="24" fill="#246d91" text-anchor="middle">0.500</text><text x="201" y="430.03206589620174" font-size="24" fill="#bc5b31" text-anchor="middle">0.135</text><text x="180" y="585" font-size="26" fill="#687b86" text-anchor="middle">0</text><rect x="289" y="535" width="30" height="0" fill="#246d91"/><rect x="331" y="359.0641317924035" width="30" height="175.9358682075965" fill="#bc5b31"/><text x="346" y="342.0641317924035" font-size="24" fill="#bc5b31" text-anchor="middle">0.271</text><text x="325" y="585" font-size="26" fill="#687b86" text-anchor="middle">1</text><rect x="434" y="535" width="30" height="0" fill="#246d91"/><rect x="476" y="359.0641317924035" width="30" height="175.9358682075965" fill="#bc5b31"/><text x="491" y="342.0641317924035" font-size="24" fill="#bc5b31" text-anchor="middle">0.271</text><text x="470" y="585" font-size="26" fill="#687b86" text-anchor="middle">2</text><rect x="579" y="535" width="30" height="0" fill="#246d91"/><rect x="621" y="417.70942119493566" width="30" height="117.29057880506431" fill="#bc5b31"/><text x="636" y="400.70942119493566" font-size="24" fill="#bc5b31" text-anchor="middle">0.180</text><text x="615" y="585" font-size="26" fill="#687b86" text-anchor="middle">3</text><rect x="724" y="210.0" width="30" height="325.0" fill="#246d91"/><rect x="766" y="476.35471059746783" width="30" height="58.64528940253216" fill="#bc5b31"/><text x="739" y="193.0" font-size="24" fill="#246d91" text-anchor="middle">0.500</text><text x="781" y="459.35471059746783" font-size="24" fill="#bc5b31" text-anchor="middle">0.090</text><text x="760" y="585" font-size="26" fill="#687b86" text-anchor="middle">4</text><rect x="869" y="535" width="30" height="0" fill="#246d91"/><rect x="911" y="511.5418842389871" width="30" height="23.45811576101287" fill="#bc5b31"/><text x="926" y="494.5418842389871" font-size="24" fill="#bc5b31" text-anchor="middle">0.036</text><text x="905" y="585" font-size="26" fill="#687b86" text-anchor="middle">5</text><rect x="1014" y="535" width="30" height="0" fill="#246d91"/><rect x="1056" y="524.2336544876006" width="30" height="10.76634551239938" fill="#bc5b31"/><text x="1071" y="507.2336544876006" font-size="24" fill="#bc5b31" text-anchor="middle">0.017</text><text x="1050" y="585" font-size="26" fill="#687b86" text-anchor="middle">≥ 6</text><text x="65" y="650" font-size="27" fill="#246d91" text-anchor="start">经验：均值 2，方差 4，零值比例 0.5。</text><text x="65" y="697" font-size="27" fill="#bc5b31" text-anchor="start">Poisson(2)：均值 2，方差 2，零值概率约 0.135。</text><text x="65" y="746" font-size="25" fill="#687b86" text-anchor="start">四个观察只能提出结构疑问；正式检验须考虑小样本波动和参数不确定性。</text></g></svg>

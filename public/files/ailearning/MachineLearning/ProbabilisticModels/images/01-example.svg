ext><text x="110" y="590" font-size="26" fill="#688493" text-anchor="middle">1</text><circle cx="290" cy="262.6470588235294" r="8" fill="#b96134" stroke="white" stroke-width="2"/><text x="290" y="240.6470588235294" font-size="25" fill="#b96134" text-anchor="middle">0.941</text><text x="290" y="590" font-size="26" fill="#688493" text-anchor="middle">2</text><circle cx="470" cy="249.61538461538458" r="8" fill="#b96134" stroke="white" stroke-width="2"/><text x="470" y="227.61538461538458" font-size="25" fill="#b96134" text-anchor="middle">0.985</text><text x="470" y="590" font-size="26" fill="#688493" text-anchor="middle">3</text><line x1="110" y1="305" x2="470" y2="305" stroke="#2176a2" stroke-width="3" stroke-dasharray="8 6"/><text x="290" y="350" font-size="25" fill="#2176a2" text-anchor="middle">真实后验始终为 0.8</text><text x="290" y="635" font-size="26" fill="#688493" text-anchor="middle">同一特征的副本数</text><text x="675" y="180" font-size="26" fill="#2176a2" text-anchor="start">在真实后验 0.8 下的 Brier 风险</text><line x1="700" y1="545.0" x2="1060" y2="545.0" stroke="#e0e5ec" stroke-width="2"/><text x="680" y="553.0" font-size="24" fill="#688493" text-anchor="end">0</text><line x1="700" y1="408.6363636363636" x2="1060" y2="408.6363636363636" stroke="#e0e5ec" stroke-width="2"/><text x="680" y="416.6363636363636" font-size="24" fill="#688493" text-anchor="end">0.1</text><line x1="700" y1="272.27272727272725" x2="1060" y2="272.27272727272725" stroke="#e0e5ec" stroke-width="2"/><text x="680" y="280.27272727272725" font-size="24" fill="#688493" text-anchor="end">0.2</text><polyline points="700.000,326.818 880.000,299.640 1060.000,280.342" fill="none" stroke="#2176a2" stroke-width="4" stroke-linejoin="round"/><circle cx="700" cy="326.8181818181818" r="8" fill="#2176a2" stroke="white" stroke-width="2"/><text x="700" y="304.8181818181818" font-size="25" fill="#2176a2" text-anchor="middle">0.160</text><text x="700" y="590" font-size="26" fill="#688493" text-anchor="middle">1</text><circle cx="880" cy="299.6398238439761" r="8" fill="#2176a2" stroke="white" stroke-width="2"/><text x="880" y="277.6398238439761" font-size="25" fill="#2176a2" text-anchor="middle">0.180</text><text x="880" y="590" font-size="26" fill="#688493" text-anchor="middle">2</text><circle cx="1060" cy="280.34158149542765" r="8" fill="#2176a2" stroke="white" stroke-width="2"/><text x="1060" y="258.34158149542765" font-size="25" fill="#2176a2" text-anchor="middle">0.194</text><text x="1060" y="590" font-size="26" fill="#688493" text-anchor="middle">3</text><line x1="700" y1="326.8181818181818" x2="1060" y2="326.8181818181818" stroke="#688493" stroke-width="2" stroke-dasharray="7 5"/><text x="880" y="385" font-size="25" fill="#688493" text-anchor="middle">最低风险 0.160</text><text x="880" y="635" font-size="26" fill="#688493" text-anchor="middle">同一特征的副本数</text><text x="65" y="700" font-size="27" fill="#1e3247" text-anchor="start">分类阈值取 0.5 时，三种输出都判正类；概率评分却区分了它们。</text><text x="65" y="742" font-size="25" fill="#688493" text-anchor="start">风险 = 0.16 +（报告概率 − 0.8）²；偏离真实后验产生额外损失。</text></g></svg></svg>

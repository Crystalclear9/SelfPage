<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 793" width="1360" height="793"><title id="plate-caption">重复证据下的错设后验与真实条件Brier风险</title><desc id="plate-alt">真实后验0.8保持不变；错误独立模型把似然比4按副本数乘方。</desc><defs><clipPath id="plate-view-0"><rect x="-22.8" y="85.409589" width="1245.6" height="50.745414"/></clipPath><clipPath id="plate-view-1"><rect x="-22.8" y="136.155" width="1245.6" height="339.87812"/></clipPath><clipPath id="plate-view-2"><rect x="-22.8" y="476.03312" width="1245.6" height="181.13848"/></clipPath><clipPath id="plate-view-3"><rect x="-22.8" y="657.1716" width="1245.6" height="92.621515"/></clipPath><g id="plate-scene"><rect id="edition-paper" x="-22.8" y="44.6119" width="1245.6" height="738.188" fill="#ffffff"/><svg id="scientific-layout" x="0" y="67.4119" width="1200" height="692.588" viewBox="0 67.4119 1200 692.5881" overflow="hidden"><rect id="offline-white-background" x="0" y="67.411908" width="1200" height="692.588092" fill="#ffffff"/><rect width="1200" height="760" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#223849"><text x="65" y="110" font-size="26" fill="#658391" text-anchor="start">等先验；一条观察的似然比为 4。重复保存同一个特征。</text><text x="85" y="180" font-size="26" fill="#ae613c" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">模型报告的正类概率</text><line x1="110" y1="545" x2="470" y2="545" stroke="#657682" stroke-width="1.25" stroke-linecap="round"/><text x="90" y="553.0" font-size="24" fill="#658391" text-anchor="end">0</text><line x1="110" y1="545" x2="110" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="290" y1="545" x2="290" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="470" y1="545" x2="470" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="105" y1="545" x2="110" y2="545" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="105" y1="395" x2="110" y2="395" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="105" y1="245" x2="110" y2="245" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="110" y1="395.0" x2="470" y2="395.0" stroke="#d6e2e6" stroke-width="1.3"/><text x="90" y="403.0" font-size="24" fill="#658391" text-anchor="end">0.5</text><line x1="110" y1="245.0" x2="470" y2="245.0" stroke="#d6e2e6" stroke-width="1.3"/><text x="90" y="253.0" font-size="24" fill="#658391" text-anchor="end">1</text><polyline points="110.000,305.000 290.000,262.647 470.000,249.615" fill="none" stroke="#ae613c" stroke-width="4" stroke-linejoin="round"/><circle cx="110" cy="305.0" r="8" fill="#ae613c" stroke="#ffffff" stroke-width="2"/><text x="110" y="283.0" font-size="25" fill="#ae613c" text-anchor="middle">0.800</text><text x="110" y="590" font-size="26" fill="#658391" text-anchor="middle">1</text><circle cx="290" cy="262.6470588235294" r="8" fill="#ae613c" stroke="#ffffff" stroke-width="2"/><text x="290" y="240.6470588235294" font-size="25" fill="#ae613c" text-anchor="middle">0.941</text><text x="290" y="590" font-size="26" fill="#658391" text-anchor="middle">2</text><circle cx="470" cy="249.61538461538458" r="8" fill="#ae613c" stroke="#ffffff" stroke-width="2"/><text x="470" y="227.61538461538458" font-size="25" fill="#ae613c" text-anchor="middle">0.985</text><text x="470" y="590" font-size="26" fill="#658391" text-anchor="middle">3</text><line x1="110" y1="305" x2="470" y2="305" stroke="#2a7698" stroke-width="3" stroke-dasharray="8 6"/><text x="290" y="350" font-size="25" fill="#2a7698" text-anchor="middle">真实后验始终为 0.8</text><text x="290" y="635" font-size="26" fill="#658391" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">同一特征的副本数</text><text x="675" y="180" font-size="26" fill="#2a7698" text-anchor="start">在真实后验 0.8 下的 Brier 风险</text><line x1="700" y1="545" x2="1060" y2="545" stroke="#657682" stroke-width="1.25" stroke-linecap="round"/><text x="680" y="553.0" font-size="24" fill="#658391" text-anchor="end">0</text><line x1="700" y1="545" x2="700" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="880" y1="545" x2="880" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="1060" y1="545" x2="1060" y2="550" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="695" y1="545" x2="700" y2="545" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="695" y1="408.63636" x2="700" y2="408.63636" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="695" y1="272.27273" x2="700" y2="272.27273" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="700" y1="408.6363636363636" x2="1060" y2="408.6363636363636" stroke="#d6e2e6" stroke-width="1.3"/><text x="680" y="416.6363636363636" font-size="24" fill="#658391" text-anchor="end">0.1</text><line x1="700" y1="272.27272727272725" x2="1060" y2="272.27272727272725" stroke="#d6e2e6" stroke-width="1.3"/><text x="680" y="280.27272727272725" font-size="24" fill="#658391" text-anchor="end">0.2</text><polyline points="700.000,326.818 880.000,299.640 1060.000,280.342" fill="none" stroke="#2a7698" stroke-width="4" stroke-linejoin="round"/><circle cx="700" cy="326.8181818181818" r="8" fill="#2a7698" stroke="#ffffff" stroke-width="2"/><text x="700" y="304.8181818181818" font-size="25" fill="#2a7698" text-anchor="middle">0.160</text><text x="700" y="590" font-size="26" fill="#658391" text-anchor="middle">1</text><circle cx="880" cy="299.6398238439761" r="8" fill="#2a7698" stroke="#ffffff" stroke-width="2"/><text x="880" y="277.6398238439761" font-size="25" fill="#2a7698" text-anchor="middle">0.180</text><text x="880" y="590" font-size="26" fill="#658391" text-anchor="middle">2</text><circle cx="1060" cy="280.34158149542765" r="8" fill="#2a7698" stroke="#ffffff" stroke-width="2"/><text x="1060" y="258.34158149542765" font-size="25" fill="#2a7698" text-anchor="middle">0.194</text><text x="1060" y="590" font-size="26" fill="#658391" text-anchor="middle">3</text><line x1="700" y1="326.8181818181818" x2="1060" y2="326.8181818181818" stroke="#658391" stroke-width="2" stroke-dasharray="7 5"/><text x="880" y="385" font-size="25" fill="#658391" text-anchor="middle">最低风险 0.160</text><text x="880" y="635" font-size="26" fill="#658391" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">同一特征的副本数</text><text x="65" y="700" font-size="27" fill="#223849" text-anchor="start">分类阈值取 0.5 时，三种输出都判正类；概率评分却区分了它们。</text><text x="65" y="742" font-size="25" fill="#658391" text-anchor="start">风险 = 0.16 +（报告概率 − 0.8）²；偏离真实后验产生额外损失。</text></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="793" fill="white"/><g transform="translate(3.0449522 -49.496896) scale(1.1799282)"><use xmlns:ns0="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-0)" ns0:href="#plate-scene"/></g><g transform="translate(3.0449522 -59.425017) scale(1.1799282)"><use xmlns:ns1="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-1)" ns1:href="#plate-scene"/></g><g transform="translate(3.0449522 -134.61378) scale(1.1799282)"><use xmlns:ns2="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-2)" ns2:href="#plate-scene"/></g><g transform="translate(3.0449522 -143.30088) scale(1.1799282)"><use xmlns:ns3="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-3)" ns3:href="#plate-scene"/></g></g></svg>

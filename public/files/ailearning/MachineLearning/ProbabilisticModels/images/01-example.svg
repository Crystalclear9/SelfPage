<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="692.588" viewBox="0 67.411908 1200 692.588092" role="img"><rect id="offline-white-background" x="0" y="67.411908" width="1200" height="692.588092" fill="#ffffff"/><title>复制证据让错设概率趋近一，却增加条件Brier风险</title><desc>真实后验0.8保持不变；错误独立模型把似然比4按副本数乘方。</desc><rect width="1200" height="760" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="65" y="110" font-size="26" fill="#687b86" text-anchor="start">等先验；一条观察的似然比为 4。重复保存同一个特征。</text><text x="85" y="180" font-size="26" fill="#bc5b31" text-anchor="start">模型报告的正类概率</text><line x1="110" y1="545.0" x2="470" y2="545.0" stroke="#dce5e9" stroke-width="2"/><text x="90" y="553.0" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="110" y1="395.0" x2="470" y2="395.0" stroke="#dce5e9" stroke-width="2"/><text x="90" y="403.0" font-size="24" fill="#687b86" text-anchor="end">0.5</text><line x1="110" y1="245.0" x2="470" y2="245.0" stroke="#dce5e9" stroke-width="2"/><text x="90" y="253.0" font-size="24" fill="#687b86" text-anchor="end">1</text><polyline points="110.000,305.000 290.000,262.647 470.000,249.615" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><circle cx="110" cy="305.0" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="110" y="283.0" font-size="25" fill="#bc5b31" text-anchor="middle">0.800</text><text x="110" y="590" font-size="26" fill="#687b86" text-anchor="middle">1</text><circle cx="290" cy="262.6470588235294" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="290" y="240.6470588235294" font-size="25" fill="#bc5b31" text-anchor="middle">0.941</text><text x="290" y="590" font-size="26" fill="#687b86" text-anchor="middle">2</text><circle cx="470" cy="249.61538461538458" r="8" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="470" y="227.61538461538458" font-size="25" fill="#bc5b31" text-anchor="middle">0.985</text><text x="470" y="590" font-size="26" fill="#687b86" text-anchor="middle">3</text><line x1="110" y1="305" x2="470" y2="305" stroke="#246d91" stroke-width="3" stroke-dasharray="8 6"/><text x="290" y="350" font-size="25" fill="#246d91" text-anchor="middle">真实后验始终为 0.8</text><text x="290" y="635" font-size="26" fill="#687b86" text-anchor="middle">同一特征的副本数</text><text x="675" y="180" font-size="26" fill="#246d91" text-anchor="start">在真实后验 0.8 下的 Brier 风险</text><line x1="700" y1="545.0" x2="1060" y2="545.0" stroke="#dce5e9" stroke-width="2"/><text x="680" y="553.0" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="700" y1="408.6363636363636" x2="1060" y2="408.6363636363636" stroke="#dce5e9" stroke-width="2"/><text x="680" y="416.6363636363636" font-size="24" fill="#687b86" text-anchor="end">0.1</text><line x1="700" y1="272.27272727272725" x2="1060" y2="272.27272727272725" stroke="#dce5e9" stroke-width="2"/><text x="680" y="280.27272727272725" font-size="24" fill="#687b86" text-anchor="end">0.2</text><polyline points="700.000,326.818 880.000,299.640 1060.000,280.342" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><circle cx="700" cy="326.8181818181818" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="700" y="304.8181818181818" font-size="25" fill="#246d91" text-anchor="middle">0.160</text><text x="700" y="590" font-size="26" fill="#687b86" text-anchor="middle">1</text><circle cx="880" cy="299.6398238439761" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="880" y="277.6398238439761" font-size="25" fill="#246d91" text-anchor="middle">0.180</text><text x="880" y="590" font-size="26" fill="#687b86" text-anchor="middle">2</text><circle cx="1060" cy="280.34158149542765" r="8" fill="#246d91" stroke="white" stroke-width="2"/><text x="1060" y="258.34158149542765" font-size="25" fill="#246d91" text-anchor="middle">0.194</text><text x="1060" y="590" font-size="26" fill="#687b86" text-anchor="middle">3</text><line x1="700" y1="326.8181818181818" x2="1060" 
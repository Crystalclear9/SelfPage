<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img"><title>同一文档的证据：新词先改变条件预测，再改变类别后验</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#183944" text-anchor="start">同一文档的证据：新词先改变条件预测，再改变类别后验</text><text x="70" y="120" font-size="26" fill="#183944" text-anchor="start">词序列：词 1 → 词 1 → 词 3；两类先验均为 0.5</text><line x1="140" y1="615.0" x2="1070" y2="615.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="115" y="624.0" font-size="24" fill="#183944" text-anchor="end">0</text><line x1="140" y1="517.5" x2="1070" y2="517.5" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="115" y="526.5" font-size="24" fill="#183944" text-anchor="end">0.25</text><line x1="140" y1="420.0" x2="1070" y2="420.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="115" y="429.0" font-size="24" fill="#183944" text-anchor="end">0.5</text><line x1="140" y1="322.5" x2="1070" y2="322.5" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="115" y="331.5" font-size="24" fill="#183944" text-anchor="end">0.75</text><line x1="140" y1="225.0" x2="1070" y2="225.0" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="115" y="234.0" font-size="24" fill="#183944" text-anchor="end">1</text><line x1="140" y1="225" x2="140" y2="615" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="140" y="655" font-size="24" fill="#183944" text-anchor="middle">未观察</text><line x1="450" y1="225" x2="450" y2="615" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="450" y="655" font-size="24" fill="#183944" text-anchor="middle">第一个词 1</text><line x1="760" y1="225" x2="760" y2="615" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="760" y="655" font-size="24" fill="#183944" text-anchor="middle">第二个词 1</text><line x1="1070" y1="225" x2="1070" y2="615" stroke="#dce7e9" stroke-width="2" stroke-dasharray=""/><text x="1070" y="655" font-size="24" fill="#183944" text-anchor="middle">第三个词 3</text><text x="70" y="190" font-size="27" fill="#183944" text-anchor="start">广告类别的后验概率</text><path d="M140.00,420.00 L450.00,295.91 L760.00,249.38 L1070.00,336.43" fill="none" stroke="#246b82" stroke-width="4"/><line x1="140" y1="420.0" x2="450" y2="295.9090909090909" stroke="#c0673e" stroke-width="3" stroke-dasharray="9 6"/><line x1="450" y1="295.9090909090909" x2="760" y2="243.3529411764706" stroke="#c0673e" stroke-width="3" stroke-dasharray="9 6"/><line x1="760" y1="243.3529411764706" x2="1070" y2="314.1428571428571" stroke="#c0673e" stroke-width="3" stroke-dasharray="9 6"/><circle cx="140" cy="420.0" r="7" fill="#246b82"/><circle cx="450" cy="295.9090909090909" r="7" fill="#246b82"/><circle cx="760" cy="249.375" r="7" fill="#246b82"/><circle cx="1070" cy="336.42857142857144" r="7" fill="#246b82"/><circle cx="140" cy="420.0" r="10" fill="white" stroke="#c0673e" stroke-width="3"/><circle cx="450" cy="295.9090909090909" r="10" fill="white" stroke="#c0673e" stroke-width="3"/><circle cx="760" cy="243.3529411764706" r="10" fill="white" stroke="#c0673e" stroke-width="3"/><circle cx="1070" cy="314.1428571428571" r="10" fill="white" stroke="#c0673e" stroke-width="3"/><text x="156" y="456.0" font-size="24" fill="#246b82" text-anchor="start">0.5000</text><text x="466" y="331.9090909090909" font-size="24" fill="#246b82" text-anchor="start">0.8182</text><text x="776" y="285.375" font-size="24" fill="#246b82" text-anchor="start">0.9375</text><text x="1086" y="372.42857142857144" font-size="24" fill="#246b82" text-anchor="start">0.7143</text><text x="1120" y="323.1428571428571" font-size="24" fill="#c0673e" text-anchor="middle">0.7714</text><text x="450" y="170" font-size="26" fill="#246b82" text-anchor="start">积分同一共享参数</text><line x1="390" y1="160" x2="430" y2="160" stroke="#246b82" stroke-width="4" stroke-dasharray=""/><text x="820" y="170" font-size="26" fill="#c0673e" text-anchor="start">固定后验均值代入</text><line x1="750" y1="160" x2="800" y2="160" stroke="#c0673e" stroke-width="3" stroke-dasharray="9 6"/><text x="70" y="725" font-size="27" fill="#183944" text-anchor="start">第三词的类条件预测：广告约 0.0667，普通为 0.4。</text><text x="70" y="773" font-size="27" fill="#183944" text-anchor="start">重复词使广告证据上升；随后词 3 的反向证据使后验回落。</text></g></svg>

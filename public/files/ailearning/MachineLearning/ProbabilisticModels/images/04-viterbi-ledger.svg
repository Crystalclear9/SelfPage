<text x="75" y="740" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">箭头沿前驱回溯。前向算法在同一列求和，Viterbi 则保留最大候选。</text>

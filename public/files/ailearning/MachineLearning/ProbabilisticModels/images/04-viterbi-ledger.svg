<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="802" viewBox="0 0 1200 802" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Viterbi 按终点列取最大值再回溯</title>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="878.9664" viewBox="0 0 1440 878.9664" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两条可能的中间状态路径及其端点条件权重，解释缺失观察时底层仍有两次转移</title><rect width="1440" height="878.9664" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="36" font-weight="700" fill="#142b45">两条可能的中间状态路径及其端点条件权重，解释缺失观察时底层仍有两次转移</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="736.9664" viewBox="0 68.9076 1280 701.8727" role="img" x="48" y="106" overflow="hidden"><rect id="offline-white-background" x="0" y="68.907563" width="1280" height="701.872749" fill="#ffffff"/><title>漏掉中间观察，状态仍走了两步</title><rect width="1280" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="25" fill="#728d97" text-anchor="start">A 的两行为 (0.9, 0.1)、(0.2, 0.8)；已知两端状态为 0 → 1</text><line x1="170" y1="340" x2="550" y2="270" stroke="#217292" stroke-width="4" stroke-dasharray=""/><line x1="550" y1="270" x2="940" y2="340" stroke="#217292" stroke-width="4" stroke-dasharray=""/><rect x="490" y="238" width="120" height="64" fill="#f2f5f8"/><text x="550" y="280" font-size="30" fill="#217292" text-anchor="middle">0</text><text x="1080" y="280" font-size="25" fill="#217292" text-anchor="middle">0.9 × 0.1 = 0.09</text><line x1="170" y1="340" x2="550" y2="410" stroke="#bd6c41" stroke-width="4" stroke-dasharray=""/><line x1="550" y1="410" x2="940" y2="340" stroke="#bd6c41" stroke-width="4" stroke-dasharray=""/><rect x="490" y="378" width="120" height="64" fill="#fbf0ea"/><text x="550" y="420" font-size="30" fill="#bd6c41" text-anchor="middle">1</text><text x="1080" y="420" font-size="25" fill="#bd6c41" text-anchor="middle">0.1 × 0.8 = 0.08</text><rect x="110" y="308" width="120" height="64" fill="#f2f5f8"/><text x="170" y="350" font-size="30" fill="#217292" text-anchor="middle">0</text><rect x="880" y="308" width="120" height="64" fill="#f2f5f8"/><text x="940" y="350" font-size="30" fill="#217292" text-anchor="middle">1</text><text x="170" y="200" font-size="27" fill="#1c2e40" text-anchor="middle">首端已知</text><text x="550" y="200" font-size="27" fill="#1c2e40" text-anchor="middle">中间状态未知</text><text x="940" y="200" font-size="27" fill="#1c2e40" text-anchor="middle">末端已知</text><text x="60" y="500" font-size="27" fill="#1c2e40" text-anchor="start">两条桥接路径的概率和 = 0.17；条件于端点后，权重约为 0.529412 与 0.470588。</text><text x="60" y="560" font-size="29" fill="#1c2e40" text-anchor="start">原一步转移的期望使用次数</text><text x="110" y="620" font-size="26" fill="#1c2e40" text-anchor="start">0 → 0</text><text x="110" y="668" font-size="30" fill="#217292" text-anchor="start">0.529412</text><text x="400" y="620" font-size="26" fill="#1c2e40" text-anchor="start">0 → 1</text><text x="400" y="668" font-size="30" fill="#217292" text-anchor="start">1.000000</text><text x="690" y="620" font-size="26" fill="#1c2e40" text-anchor="start">1 → 0</text><text x="690" y="668" font-size="30" fill="#728d97" text-anchor="start">0.000000</text><text x="980" y="620" font-size="26" fill="#1c2e40" text-anchor="start">1 → 1</text><text x="980" y="668" font-size="30" fill="#217292" text-anchor="start">0.470588</text><text x="60" y="745" font-size="27" fill="#1c2e40" text-anchor="start">四项总和为 2：一次端点变化并不等于一次底层状态转移。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">HMM 解码：整条路径最优 ≠ 每个位置最优</title>
  <desc id="desc">两步路径联合后验求和得到边缘后验；联合最优路径BB与逐位置最优AB对应不同损失。</desc>
  <rect width="1200" height="710" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">HMM 解码：整条路径最优 ≠ 每个位置最优</text>
    <text x="35" y="100" font-size="26" fill="#213447" font-weight="400" text-anchor="start">同一组观察下的联合后验</text>
    <text x="275" y="150" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="middle">时刻 2</text>
    <text x="230" y="195" font-size="26" fill="#213447" font-weight="600" text-anchor="middle">A</text>
    <text x="375" y="195" font-size="26" fill="#213447" font-weight="600" text-anchor="middle">B</text>
    <text x="110" y="253" font-size="26" fill="#213447" font-weight="600" text-anchor="middle">A</text>
    <rect x="160" y="213" width="140" height="86" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" />
    <text x="230.0" y="264.0" font-size="32" fill="#2865a0" font-weight="500" text-anchor="middle">0.34</text>
    <rect x="305" y="213" width="140" height="86" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" />
    <text x="375.0" y="264.0" font-size="32" fill="#2865a0" font-weight="500" text-anchor="middle">0.27</text>
    <text x="110" y="345" font-size="26" fill="#213447" font-weight="600" text-anchor="middle">B</text>
    <rect x="160" y="305" width="140" height="86" rx="5" fill="#eaf2fa" stroke="#9db8d0" stroke-width="1.2" />
    <text x="230.0" y="356.0" font-size="32" fill="#2865a0" font-weight="500" text-anchor="middle">0.03</text>
    <rect x="305" y="305" width="140" height="86" rx="5" fill="#fff0e3" stroke="#cf7432" stroke-width="1.2" />
    <text x="375.0" y="356.0" font-size="32" fill="#cf7432" font-weight="500" text-anchor="middle">0.36</text>
    <text x="35" y="200" font-size="22" fill="#5a6c7d" font-weight="400" text-anchor="start">时刻 1</text>
    <text x="520" y="150" font-size="26" fill="#213447" font-weight="400" text-anchor="start">边缘后验：沿行、沿列求和</text>
    <text x="520" y="205" font-size="24" fill="#213447" font-weight="400" text-anchor="start">时刻 1</text>
    <rect x="655" y="181" width="244.0" height="29" fill="#2865a0" />
    <text x="640" y="203" font-size="23" fill="#213447" font-weight="400" text-anchor="end">A</text>
    <text x="960" y="203" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">0.61</text>
    <rect x="655" y="221" width="156.0" height="29" fill="#d7e2ec" />
    <text x="640" y="243" font-size="23" fill="#213447" font-weight="400" text-anchor="end">B</text>
    <text x="960" y="243" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">0.39</text>
    <text x="520" y="313" font-size="24" fill="#213447" font-weight="400" text-anchor="start">时刻 2</text>
    <rect x="655" y="289" width="148.0" height="29" fill="#d7e2ec" />
    <text x="640" y="311" font-size="23" fill="#213447" font-weight="400" text-anchor="end">A</text>
    <text x="960" y="311" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">0.37</text>
    <rect x="655" y="329" width="252.0" height="29" fill="#2865a0" />
    <text x="640" y="351" font-size="23" fill="#213447" font-weight="400" text-anchor="end">B</text>
    <text x="960" y="351" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">0.63</text>
    <line x1="35" y1="430" x2="1165" y2="430" stroke="#cad7e2" stroke-width="2" />
    <text x="35" y="485" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">整条路径：最大化联合后验</text>
    <text x="650" y="485" font-size="27" fill="#2865a0" font-weight="600" text-anchor="start">逐位置：分别最大化边缘后验</text>
    <circle cx="155" cy="555" r="35" fill="#fff0e3" stroke="#cf7432" stroke-width="2" />
    <text x="155" y="565" font-size="29" fill="#cf7432" font-weight="600" text-anchor="middle">B</text>
    <circle cx="340" cy="555" r="35" fill="#fff0e3" stroke="#cf7432" stroke-width="2" />
    <text x="340" y="565" font-size="29" fill="#cf7432" font-weight="600" text-anchor="middle">B</text>
    <path d="M195,555 L300,555" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#arrow-orange)" />
    <circle cx="770" cy="555" r="35" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="770" y="565" font-size="29" fill="#2865a0" font-weight="600" text-anchor="middle">A</text>
    <circle cx="955" cy="555" r="35" fill="#eaf2fa" stroke="#2865a0" stroke-width="2" />
    <text x="955" y="565" font-size="29" fill="#2865a0" font-weight="600" text-anchor="middle">B</text>
    <path d="M810,555 L915,555" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="245" y="645" font-size="28" fill="#cf7432" font-weight="400" text-anchor="middle">BB：路径概率 0.36</text>
    <text x="865" y="645" font-size="28" fill="#2865a0" font-weight="400" text-anchor="middle">AB：路径概率 0.27</text>
  </g>
</svg>

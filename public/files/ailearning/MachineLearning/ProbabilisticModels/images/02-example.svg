<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
  <title id="title">EM 的一轮更新：用真实混合模型核对下界</title>
  <desc id="desc">固定Bernoulli分量成功率0.2和0.8，仅更新混合权重，显示EM一次M步提高下界，新E步只消除后验间隙。</desc>
  <rect width="1200" height="755" fill="white" />
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" />
    </marker>
    <marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5a6c7d" />
    </marker>
  </defs>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="30" y="45" font-size="30" fill="#213447" font-weight="600" text-anchor="start">EM 的一轮更新：用真实混合模型核对下界</text>
    <text x="35" y="98" font-size="25" fill="#213447" font-weight="400" text-anchor="start">一次观察 x = 1；两 Bernoulli 分量成功率固定为 0.2、0.8</text>
    <text x="210" y="156" font-size="24" fill="#213447" font-weight="600" text-anchor="middle">旧 E 步</text>
    <text x="210" y="200" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">π = (0.5, 0.5)</text>
    <text x="210" y="242" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">q = (0.2, 0.8)</text>
    <path d="M385,194 L420,194" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="605" y="156" font-size="24" fill="#213447" font-weight="600" text-anchor="middle">M 步：只更新混合权重</text>
    <text x="605" y="200" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">π = (0.2, 0.8)</text>
    <text x="605" y="242" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">q = (0.2, 0.8)</text>
    <path d="M780,194 L815,194" fill="none" stroke="#5a6c7d" stroke-width="2.5" marker-end="url(#arrow-muted)" />
    <text x="1000" y="156" font-size="24" fill="#213447" font-weight="600" text-anchor="middle">新 E 步：只更新后验</text>
    <text x="1000" y="200" font-size="25" fill="#2865a0" font-weight="400" text-anchor="middle">π = (0.2, 0.8)</text>
    <text x="1000" y="242" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">q ≈ (0.0588, 0.9412)</text>
    <line x1="110" y1="572.7777777777777" x2="1055" y2="572.7777777777777" stroke="#cad7e2" stroke-width="1" />
    <text x="98" y="579.7777777777777" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">-0.7</text>
    <line x1="110" y1="508.3333333333333" x2="1055" y2="508.3333333333333" stroke="#cad7e2" stroke-width="1" />
    <text x="98" y="515.3333333333333" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">-0.6</text>
    <line x1="110" y1="443.8888888888889" x2="1055" y2="443.8888888888889" stroke="#cad7e2" stroke-width="1" />
    <text x="98" y="450.8888888888889" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">-0.5</text>
    <line x1="110" y1="379.44444444444446" x2="1055" y2="379.44444444444446" stroke="#cad7e2" stroke-width="1" />
    <text x="98" y="386.44444444444446" font-size="21" fill="#5a6c7d" font-weight="400" text-anchor="end">-0.4</text>
    <line x1="110" y1="605" x2="1055" y2="605" stroke="#5a6c7d" stroke-width="1.4" />
    <line x1="110" y1="315" x2="110" y2="605" stroke="#5a6c7d" stroke-width="1.4" />
    <polyline points="171.630,568.362 582.500,370.205 993.370,370.205" fill="none" stroke="#2865a0" stroke-width="3.5" stroke-linejoin="round" />
    <polyline points="171.630,568.362 582.500,444.148 993.370,370.205" fill="none" stroke="#cf7432" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="171.6304347826087" cy="568.3615163608537" r="7" fill="#2865a0" />
    <circle cx="582.5" cy="370.20470985661234" r="7" fill="#2865a0" />
    <circle cx="993.3695652173914" cy="370.20470985661234" r="7" fill="#2865a0" />
    <circle cx="171.6304347826087" cy="568.3615163608537" r="6" fill="#cf7432" />
    <circle cx="582.5" cy="444.1482285023877" r="6" fill="#cf7432" />
    <circle cx="993.3695652173914" cy="370.20470985661234" r="6" fill="#cf7432" />
    <text x="171.6304347826087" y="646" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">旧 E 步</text>
    <text x="582.5" y="646" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">新 M 步</text>
    <text x="993.3695652173914" y="646" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">新 E 步</text>
    <text x="35" y="290" font-size="24" fill="#5a6c7d" font-weight="400" text-anchor="start">对数值</text>
    <text x="171.6304347826087" y="548.3615163608537" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">-0.693147</text>
    <text x="582.5" y="350.20470985661234" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">-0.385662</text>
    <text x="993.3695652173914" y="350.20470985661234" font-size="24" fill="#2865a0" font-weight="400" text-anchor="middle">-0.385662</text>
    <text x="610.5" y="472.1482285023877" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">-0.500402</text>
    <text x="800" y="440" font-size="25" fill="#5a6c7d" font-weight="400" text-anchor="start">间隙 ≈ 0.114740</text>
    <line x1="594.5" y1="444.1482285023877" x2="594.5" y2="370.20470985661234" stroke="#5a6c7d" stroke-width="2" stroke-dasharray="5 4" />
    <line x1="40" y1="710" x2="100" y2="710" stroke="#2865a0" stroke-width="4" />
    <text x="115" y="718" font-size="25" fill="#2865a0" font-weight="400" text-anchor="start">观察对数似然</text>
    <line x1="650" y1="710" x2="710" y2="710" stroke="#cf7432" stroke-width="4" />
    <text x="725" y="718" font-size="25" fill="#cf7432" font-weight="400" text-anchor="start">当前 q 对应的下界</text>
  </g>
</svg>

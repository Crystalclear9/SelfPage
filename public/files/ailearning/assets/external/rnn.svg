  <title id="plate-title">同一循环单元在三个时间步复用</title>
  <desc id="plate-desc">左侧折叠为自环。右侧三列展开同一规则，输入 1、2、0 对应状态 1、2.5、1.25 以及输出 2、5、2.5。</desc>

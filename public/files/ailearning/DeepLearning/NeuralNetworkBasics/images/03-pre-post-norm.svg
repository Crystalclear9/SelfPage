<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1153" height="675" viewBox="17 68 1153 675" role="img"><rect x="17" y="68" width="1153" height="675" fill="#ffffff"/><title id="figure-title">归一化的位置改变了残差的直接路径</title><desc id="figure-desc">归一化的位置改变了残差的直接路径</desc><rect width="1200" height="765" fill="white"/><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="110" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">预归一化：y = x + F(N(x))</text><circle cx="90" cy="215" r="32" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="90" y="225" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">x</text><line x1="135" y1="215" x2="245" y2="215" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><rect x="265" y="180" width="130" height="70" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="330.0" y="225.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">N</text><line x1="410" y1="215" x2="480" y2="215" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><rect x="500" y="180" width="130" height="70" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="565.0" y="225.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">F</text><line x1="645" y1="215" x2="780" y2="215" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><circle cx="825" cy="215" r="30" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="825" y="225" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">+</text><line x1="870" y1="215" x2="1035" y2="215" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><circle cx="1080" cy="215" r="30" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="1080" y="225" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">y</text><line x1="90" y1="255" x2="90" y2="305" stroke="#2865a0" stroke-width="2.5"/><line x1="90" y1="305" x2="825" y2="305" stroke="#2865a0" stroke-width="2.5"/><line x1="825" y1="305" x2="825" y2="255" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="450" y="350" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">恒等路径不经过 N</text><text x="35" y="425" font-size="29" fill="#cf7432" text-anchor="start" font-weight="400">后归一化：y = N(x + F(x))</text><circle cx="90" cy="520" r="32" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="90" y="530" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">x</text><line x1="135" y1="520" x2="350" y2="520" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><rect x="370" y="485" width="130" height="70" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="435.0" y="530.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">F</text><line x1="515" y1="520" x2="700" y2="520" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><circle cx="745" cy="520" r="30" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="745" y="530" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">+</text><line x1="790" y1="520" x2="840" y2="520" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><rect x="860" y="485" width="130" height="70" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="925.0" y="530.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">N</text><line x1="1005" y1="520" x2="1080" y2="520" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><circle cx="1120" cy="520" r="30" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="1120" y="530" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">y</text><line x1="90" y1="560" x2="90" y2="610" stroke="#2865a0" stroke-width="2.5"/><line x1="90" y1="610" x2="745" y2="610" stroke="#2865a0" stroke-width="2.5"/><line x1="745" y1="610" x2="745" y2="560" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="475" y="655" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">相加后的所有路径都经过 N</text><text x="35" y="720" font-size="27" fill="#213447" text-anchor="start" font-weight="400">F=0；x：(1,3) → (2,4)</text><text x="610" y="720" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">预：输出同移；后：归一化输出不变</text></g></svg>

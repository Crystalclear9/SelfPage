<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 862" width="1360" height="862"><title id="plate-caption">单 logit 与双 logit 参数化的梯度几何和单步对照</title><desc id="plate-alt">固定输入等于1，标签1，初始logit为0。单logit步长0.2后有效logit0.1；两个logit同样步长各向相反方向移动0.1，有效差值0.2；两logit学习率减半则恢复0.1。</desc><defs><clipPath id="plate-view-0"><rect x="-8.85" y="73.351687" width="1193.7" height="607.89265"/></clipPath><clipPath id="plate-view-1"><rect x="-8.85" y="681.24434" width="1193.7" height="94.537229"/></clipPath><g id="plate-scene"><defs><linearGradient id="book-wash-eef4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect id="edition-paper" x="-8.85" y="38.15" width="1193.7" height="774.7" fill="#ffffff"/><svg id="scientific-layout" x="13" y="60" width="1150" height="731" viewBox="13 60 1150 731" overflow="hidden"><rect x="13" y="60" width="1150" height="731" fill="#ffffff"/><rect width="1200" height="820" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233a4b">
<text x="44" y="100" font-size="26" fill="#618297" text-anchor="start" font-weight="400">固定输入 x = 1，标签 y = 1，初始概率 0.5；无动量、无正则</text>

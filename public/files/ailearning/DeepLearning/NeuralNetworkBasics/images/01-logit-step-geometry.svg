<line x1="152" y1="569" x2="152" y2="574" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="302" y1="569" x2="302" y2="574" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="452" y1="569" x2="452" y2="574" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="87" y1="569" x2="92" y2="569" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="87" y1="419" x2="92" y2="419" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="87" y1="269" x2="92" y2="269" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="91.99999999999997" y1="419" x2="512.0" y2="419" stroke="#d6e2e6" stroke-width="1"/>
<text x="302" y="599.0" font-size="24" fill="#618297" text-anchor="middle" font-weight="400">0</text>
<text x="69.5" y="427" font-size="24" fill="#618297" text-anchor="end" font-weight="400">0</text>

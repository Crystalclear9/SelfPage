<text x="69.5" y="277.0" font-size="24" fill="#618297" text-anchor="end" font-weight="400">0.1</text>
<line x1="91.99999999999997" y1="419" x2="512.0" y2="419" stroke="#618297" stroke-width="2"/>
<line x1="302" y1="569.0" x2="302" y2="208.99999999999997" stroke="#618297" stroke-width="2"/>
<text x="514" y="452" font-size="26" fill="#233a4b" text-anchor="start" font-weight="400">s0</text>
<text x="319" y="208" font-size="26" fill="#233a4b" text-anchor="start" font-weight="400">s1</text>

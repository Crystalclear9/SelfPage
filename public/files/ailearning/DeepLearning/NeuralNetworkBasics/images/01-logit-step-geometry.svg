<text x="62" y="219" font-size="25" fill="#b96f41" text-anchor="start" font-weight="400">η = 0.2：差值 0.2</text>
<line x1="154" y1="230" x2="152.0" y2="256.0" stroke="#b96f41" stroke-width="2"/>
<text x="44" y="550" font-size="25" fill="#2e77a6" text-anchor="start" font-weight="400">η = 0.1：差值 0.1</text>
<line x1="205" y1="524" x2="214.0" y2="357.0" stroke="#2e77a6" stroke-width="2"/>
<text x="55" y="650" font-size="26" fill="#233a4b" text-anchor="start" font-weight="700">概率只看差值 a = s1 − s0</text>
<text x="650" y="163" font-size="28" fill="#233a4b" text-anchor="start" font-weight="700" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">② 对齐的是有效差值更新</text>
<text x="650" y="235" font-size="28" fill="#2e77a6" text-anchor="start" font-weight="700">单 logit</text>
<text x="850" y="235" font-size="26" fill="#2e77a6" text-anchor="start" font-weight="400">η = 0.2</text>
<line x1="650" y1="254" x2="1145" y2="254" stroke="#e0e9ef" stroke-width="2"/>
<text x="668" y="300" font-size="28" fill="#233a4b" text-anchor="start" font-weight="400">a = 0.1</text>
<text x="900" y="300" font-size="27" fill="#233a4b" text-anchor="start" font-weight="400">p = 0.5250</text>
<text x="650" y="371" font-size="28" fill="#b96f41" text-anchor="start" font-weight="700">双 logit</text>
<text x="850" y="371" font-size="26" fill="#b96f41" text-anchor="start" font-weight="400">η = 0.2</text>
<line x1="650" y1="390" x2="1145" y2="390" stroke="#e0e9ef" stroke-width="2"/>
<text x="668" y="436" font-size="28" fill="#233a4b" text-anchor="start" font-weight="400">a = 0.2</text>
<text x="900" y="436" font-size="27" fill="#233a4b" text-anchor="start" font-weight="400">p = 0.5498</text>
<text x="650" y="507" font-size="28" fill="#2e77a6" text-anchor="start" font-weight="700">双 logit</text>
<text x="850" y="507" font-size="26" fill="#2e77a6" text-anchor="start" font-weight="400">η = 0.1</text>
<line x1="650" y1="526" x2="1145" y2="526" stroke="#e0e9ef" stroke-width="2"/>
<text x="668" y="572" font-size="28" fill="#233a4b" text-anchor="start" font-weight="400">a = 0.1</text>
<text x="900" y="572" font-size="27" fill="#233a4b" text-anchor="start" font-weight="400">p = 0.5250</text>
<rect x="44" y="692" width="1112" height="92" rx="12" fill="url(#book-wash-eef4f9)" stroke="none"/>
<text x="65" y="730" font-size="27" fill="#233a4b" text-anchor="start" font-weight="400">两分数梯度分别为 −g 与 g，所以差值更新含 2ηg。</text>
<text x="65" y="769" font-size="25" fill="#233a4b" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">图仅比较自由输出分数；共享骨干的学习率不能跟着整体减半。</text>
</g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="862" fill="white"/><g transform="translate(36.827664 -28.74404) scale(1.0955681)"><use xmlns:ns0="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-0)" ns0:href="#plate-scene"/></g><g transform="translate(36.827664 -40.155968) scale(1.0955681)"><use xmlns:ns1="http://www.w3.org/1999/xlink" href="#plate-scene" clip-path="url(#plate-view-1)" ns1:href="#plate-scene"/></g></g></svg>

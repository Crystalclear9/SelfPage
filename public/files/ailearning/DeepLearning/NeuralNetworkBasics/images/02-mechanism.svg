<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img"><title>全局范数裁剪与逐坐标裁剪：球与方盒的区别</title><rect width="1280" height="860" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">全局范数裁剪与逐坐标裁剪：球与方盒的区别</text><text x="60" y="117" font-size="27" fill="#74888d" text-anchor="start">同一个梯度 g = (3, 4)，同一个数值阈值 2，两种约束并不相同</text><rect x="136" y="411" width="288" height="288" fill="#faf1eb"/><circle cx="280" cy="555" r="144" fill="#f1f7f8" stroke="#276a80" stroke-width="3"/><text x="136" y="591" font-size="24" fill="#74888d" text-anchor="middle">-2</text><text x="280" y="591" font-size="24" fill="#74888d" text-anchor="middle">0</text><text x="424" y="591" font-size="24" fill="#74888d" text-anchor="middle">2</text><text x="568" y="591" font-size="24" fill="#74888d" text-anchor="middle">4</text><line x1="100.0" y1="555" x2="618.4000000000001" y2="555" stroke="#74888d" stroke-width="2"/><line x1="280" y1="735.0" x2="280" y2="231.0" stroke="#74888d" stroke-width="2"/><line x1="280" y1="555" x2="496" y2="267" stroke="#74888d" stroke-width="4"/><path d="M494.28,278.88 L496.00,267.00 L485.08,271.97" fill="none" stroke="#74888d" stroke-width="4"/><line x1="280" y1="555" x2="424" y2="411" stroke="#c2673f" stroke-width="4"/><path d="M420.62,422.51 L424.00,411.00 L412.49,414.38" fill="none" stroke="#c2673f" stroke-width="4"/><line x1="280" y1="555" x2="366.4" y2="439.8" stroke="#276a80" stroke-width="4"/><path d="M364.68,451.68 L366.40,439.80 L355.48,444.77" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="496" cy="267" r="7" fill="#74888d"/><text x="508" y="257" font-size="26" fill="#74888d" text-anchor="start">g = (3, 4)</text><circle cx="424" cy="411" r="7" fill="#c2673f"/><text x="436" y="401" font-size="26" fill="#c2673f" text-anchor="start">(2, 2)</text><circle cx="366.4" cy="439.8" r="7" fill="#276a80"/><text x="348.4" y="484.8" font-size="26" fill="#276a80" text-anchor="start">(1.2, 1.6)</text><text x="760" y="240" font-size="30" fill="#276a80" text-anchor="start">欧氏球：整体乘 0.4</text><text x="760" y="295" font-size="28" fill="#276a80" text-anchor="start">长度 = 2；方向保持</text><text x="760" y="390" font-size="30" fill="#c2673f" text-anchor="start">坐标盒：分别截到 ±2</text><text x="760" y="445" font-size="28" fill="#c2673f" text-anchor="start">长度 ≈ 2.828；方向改变</text><text x="760" y="550" font-size="28" fill="#19343e" text-anchor="start">(2, 2) 在方盒内，</text><text x="760" y="595" font-size="28" fill="#19343e" text-anchor="start">却已超出半径 2 的圆。</text><text x="60" y="805" font-size="27" fill="#74888d" text-anchor="start">箭头画的是梯度；普通梯度下降沿负方向移动，其他优化器还可能改变更新方向。</text></g></svg>

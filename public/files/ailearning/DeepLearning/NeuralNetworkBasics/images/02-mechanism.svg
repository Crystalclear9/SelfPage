<text x="74" y="692" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">先裁后加：1 + (−1) = 0。</text>
<text x="640" y="692" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">先加后裁：10 − 9 = 1。</text>
<text x="74" y="745" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">图画的是梯度。动量或预条件还会改变最终更新方向。</text>

1</text><text x="65" y="933" font-size="27" fill="#ba6940" text-anchor="start">先裁后加</text><circle cx="750.0" cy="927.5" r="10" fill="#ba6940"/><text x="680" y="1021" font-size="28" fill="#ba6940" text-anchor="middle">1 + (−1) = 0</text><text x="65" y="1060" font-size="28" fill="#226f90" text-anchor="start">先加后裁：10 − 9 = 1 → 1</text><circle cx="1125.0" cy="927.5" r="10" fill="#226f90"/><line x1="1125.0" y1="927.5" x2="1125.0" y2="1032" stroke="#226f90" stroke-width="2"/></g></svg></svg>

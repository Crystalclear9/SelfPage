<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img"><title>LayerNorm：公共平移被消除，尺度方向取决于 ε</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245f98"/></marker></defs><rect width="1400" height="740" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="44" y="58" font-size="34" fill="#18324a" text-anchor="start" font-weight="bold">LayerNorm：公共平移被消除，尺度方向取决于 ε</text>
<line x1="44" y1="85" x2="1356" y2="85" stroke="#dce5ed" stroke-width="2"/>
<text x="240" y="135" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">输入坐标 (x1, x2)</text>
<text x="705" y="135" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">减去均值后的方向</text>
<text x="1150" y="135" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">输出 y = (−c, c)</text>
<line x1="50" y1="540" x2="400" y2="540" stroke="#62778a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="100" y1="600" x2="100" y2="200" stroke="#62778a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="420" x2="885" y2="420" stroke="#62778a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="710" y1="480" x2="710" y2="220" stroke="#62778a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="165" cy="345" r="9" fill="#245f98" stroke="#245f98" stroke-width="2"/>
<text x="182" y="333" font-size="28" fill="#245f98" text-anchor="start" font-weight="normal">A</text>
<text x="182" y="370" font-size="24" fill="#245f98" text-anchor="start" font-weight="normal">(1,3)</text>
<circle cx="230" cy="280" r="9" fill="#c76b25" stroke="#c76b25" stroke-width="2"/>
<text x="247" y="268" font-size="28" fill="#c76b25" text-anchor="start" font-weight="normal">B</text>
<text x="247" y="305" font-size="24" fill="#c76b25" text-anchor="start" font-weight="normal">(2,4)</text>
<circle cx="100" cy="280" r="9" fill="#62778a" stroke="#62778a" stroke-width="2"/>
<text x="117" y="268" font-size="28" fill="#62778a" text-anchor="start" font-weight="normal">C</text>
<text x="117" y="305" font-size="24" fill="#62778a" text-anchor="start" font-weight="normal">(0,4)</text>
<line x1="175" y1="335" x2="220" y2="290" stroke="#c76b25" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="455" font-size="25" fill="#c76b25" text-anchor="middle" font-weight="normal">A→B：加 (1,1)</text>
<line x1="710" y1="420" x2="645" y2="355" stroke="#245f98" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="645" cy="355" r="7" fill="#245f98" stroke="#245f98" stroke-width="2"/>
<text x="635" y="335" font-size="27" fill="#245f98" text-anchor="middle" font-weight="normal">A、B</text>
<line x1="710" y1="420" x2="580" y2="290" stroke="#c76b25" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="580" cy="290" r="7" fill="#c76b25" stroke="#c76b25" stroke-width="2"/>
<text x="570" y="270" font-size="27" fill="#c76b25" text-anchor="middle" font-weight="normal">C</text>
<text x="700" y="565" font-size="25" fill="#245f98" text-anchor="middle" font-weight="normal">A、B → (−1,1)</text>
<text x="700" y="610" font-size="25" fill="#c76b25" text-anchor="middle" font-weight="normal">C → (−2,2)</text>
<line x1="930" y1="115" x2="930" y2="670" stroke="#dce5ed" stroke-width="2"/>
<text x="1045" y="225" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">ε=0</text>
<text x="1245" y="225" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">ε=1</text>
<text x="965" y="310" font-size="28" fill="#18324a" text-anchor="start" font-weight="normal">A</text>
<text x="1045" y="310" font-size="28" fill="#245f98" text-anchor="middle" font-weight="normal">1.000</text>
<text x="1245" y="310" font-size="28" fill="#c76b25" text-anchor="middle" font-weight="normal">0.707</text>
<text x="965" y="410" font-size="28" fill="#18324a" text-anchor="start" font-weight="normal">B</text>
<text x="1045" y="410" font-size="28" fill="#245f98" text-anchor="middle" font-weight="normal">1.000</text>
<text x="1245" y="410" font-size="28" fill="#c76b25" text-anchor="middle" font-weight="normal">0.707</text>
<text x="965" y="510" font-size="28" fill="#18324a" text-anchor="start" font-weight="normal">C</text>
<text x="1045" y="510" font-size="28" fill="#245f98" text-anchor="middle" font-weight="normal">1.000</text>
<text x="1245" y="510" font-size="28" fill="#c76b25" text-anchor="middle" font-weight="normal">0.894</text>
<text x="1150" y="620" font-size="25" fill="#18324a" text-anchor="middle" font-weight="normal">平移不变 ≠ 任意尺度不变</text></g></svg>

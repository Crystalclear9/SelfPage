 d="M630,450 L640.8053652282322,455.21958640933474" stroke="#d66b28" stroke-width="3" fill="none" /><path d="M530,450 L230,450" stroke="#d66b28" stroke-width="3" fill="none" /><path d="M230,450 L240.80536522823212,444.78041359066526" stroke="#d66b28" stroke-width="3" fill="none" /><path d="M230,450 L240.80536522823212,455.21958640933474" stroke="#d66b28" stroke-width="3" fill="none" /><text x="740" y="490" font-size="26" fill="#d66b28" text-anchor="start">× 3</text><text x="330" y="490" font-size="26" fill="#d66b28" text-anchor="start">× 2x = × 4</text><text x="150" y="565" font-size="32" fill="#d66b28" text-anchor="start">12</text><text x="570" y="565" font-size="32" fill="#d66b28" text-anchor="start">3</text><text x="960" y="565" font-size="32" fill="#d66b28" text-anchor="start">1</text></g></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="941" viewBox="42 71 1196 941" role="img"><rect x="42" y="71" width="1196" height="941" fill="#ffffff"/><title>反向既要乘局部斜率，也要把共享路径的贡献加回去</title><rect width="1280" height="1050" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="27" fill="#19343e" text-anchor="start">上半：一条计算链；下半：同一个参数 w 在两处调用</text><circle cx="150" cy="245" r="10" fill="#276a80"/><text x="150" y="210" font-size="29" fill="#276a80" text-anchor="middle">x = 2</text><circle cx="540" cy="245" r="10" fill="#276a80"/><text x="540" y="210" font-size="29" fill="#276a80" text-anchor="middle">z = x² = 4</text><circle cx="1010" cy="245" r="10" fill="#276a80"/><text x="1010" y="210" font-size="29" fill="#276a80" text-anchor="middle">y = 3z = 12</text><line x1="180" y1="245" x2="500" y2="245" stroke="#276a80" stroke-width="4"/><path d="M489.47,250.75 L500.00,245.00 L489.47,239.25" fill="none" stroke="#276a80" stroke-width="4"/><line x1="575" y1="245" x2="970" y2="245" stroke="#276a80" stroke-width="4"/><path d="M959.47,250.75 L970.00,245.00 L959.47,239.25" fill="none" stroke="#276a80" stroke-width="4"/><line x1="970" y1="320" x2="580" y2="320" stroke="#c2673f" stroke-width="4"/><path d="M590.53,314.25 L580.00,320.00 L590.53,325.75" fill="none" stroke="#c2673f" stroke-width="4"/><line x1="500" y1="320" x2="180" y2="320" stroke="#c2673f" stroke-width="4"/><path d="M190.53,314.25 L180.00,320.00 L190.53,325.75" fill="none" stroke="#c2673f" stroke-width="4"/><text x="775" y="365" font-size="28" fill="#c2673f" text-anchor="middle">上游 1 × 3 = 3</text><text x="340" y="365" font-size="28" fill="#c2673f" text-anchor="middle">3 × 4 = 12</text><text x="60" y="430" font-size="28" fill="#19343e" text-anchor="start">有限 Δx = 0.1：实际 Δy = 1.23；一阶预测 12Δx = 1.2</text><line x1="60" y1="475" x2="1220" y2="475" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="540" font-size="29" fill="#19343e" text-anchor="start">u = wx，v = wu，L = u + v；取 w = 2、x = 3</text><circle cx="145" cy="660" r="12" fill="#c2673f"/><text x="145" y="632" font-size="29" fill="#c2673f" text-anchor="middle">w = 2</text><circle cx="145" cy="830" r="12" fill="#276a80"/><text x="145" y="802" font-size="29" fill="#276a80" text-anchor="middle">x = 3</text><circle cx="520" cy="830" r="12" fill="#276a80"/><text x="520" y="802" font-size="29" fill="#276a80" text-anchor="middle">u = 6</text><circle cx="845" cy="660" r="12" fill="#276a80"/><text x="845" y="632" font-size="29" fill="#276a80" text-anchor="middle">v = 12</text><circle cx="1120" cy="830" r="12" fill="#276a80"/><text x="1120" y="802" font-size="29" fill="#276a80" text-anchor="middle">L = 18</text><line x1="175" y1="660" x2="485" y2="810" stroke="#74888d" stroke-width="4"/><path d="M473.01,810.59 L485.00,810.00 L478.03,800.23" fill="none" stroke="#74888d" stroke-width="4"/><line x1="185" y1="830" x2="485" y2="830" stroke="#276a80" stroke-width="4"/><path d="M474.47,835.75 L485.00,830.00 L474.47,824.25" fill="none" stroke="#276a80" stroke-width="4"/><line x1="555" y1="815" x2="810" y2="680" stroke="#276a80" stroke-width="4"/><path d="M803.38,690.01 L810.00,680.00 L798.00,679.84" fill="none" stroke="#276a80" stroke-width="4"/><line x1="185" y1="660" x2="810" y2="660" stroke="#c2673f" stroke-width="4"/><path d="M799.47,665.75 L810.00,660.00 L799.47,654.25" fill="none" stroke="#c2673f" stroke-width="4"/><line x1="880" y1="680" x2="1085" y2="810" stroke="#276a80" stroke-width="4"/><path d="M1073.03,809.22 L1085.00,810.00 L1079.19,799.50" fill="none" stroke="#276a80" stroke-width="4"/><line x1="555" y1="845" x2="1085" y2="845" stroke="#276a80" stroke-width="4"/><path d="M1074.47,850.75 L1085.00,845.00 L1074.47,839.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="400" y="710" font-size="27" fill="#c2673f" text-anchor="start">经 u： (1 + w)x = 9</text><text x="485" y="620" font-size="27" fill="#c2673f" text-anchor="start">直接经 v： u = 6</text><text x="60" y="990" font-size="28" fill="#19343e" text-anchor="start">同一个 w 接收 9 + 6 = 15；数值相等的两个独立参数，各自只接收一项。</text></g></svg>

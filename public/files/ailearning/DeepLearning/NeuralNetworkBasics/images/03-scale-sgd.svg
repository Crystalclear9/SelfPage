<text x="1017" y="526" fill="#233b4a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" font-weight="400">w₁</text>
<text x="681" y="181" fill="#233b4a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">w₂</text>
<path d="M722.64 520 L722.64 251.356" fill="none" stroke="#526976" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M722.64 251.356 L727.64 262.356 L717.64 262.356 Z" fill="#526976" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M722.64 520 L729.356 251.356" fill="none" stroke="#a74d3a" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M729.356 251.356 L734.079 262.477 L724.083 262.228 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>

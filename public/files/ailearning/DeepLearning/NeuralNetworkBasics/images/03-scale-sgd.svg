<path d="M75 608 L1125 608" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="653" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">步长同为 0.1。范数放大两倍后，本例的方向步长变为四分之一。</text>
<text x="74" y="704" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">第二组步长若改为 0.4，更新到 (0.2, 2)，方向才与第一组一致。</text>

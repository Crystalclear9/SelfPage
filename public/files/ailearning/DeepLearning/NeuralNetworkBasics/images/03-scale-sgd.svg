<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="982.5619" viewBox="0 0 1440 982.5619" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">尺度不变损失中不同参数范数导致不同的方向更新</title><rect width="1440" height="982.5619" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">尺度不变损失中不同参数范数导致不同的方向更新</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="840.5619" viewBox="42 50 1196 748" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="74" width="1196" height="724" fill="#ffffff"/><title>前向函数相同，参数尺度却改变方向学习的步长</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="119" font-size="27" fill="#769099">L(w) = −</text><text x="220" y="97" font-size="27" fill="#769099" text-anchor="middle">w1</text><line x1="183" y1="108" x2="257" y2="108" stroke="#769099" stroke-width="1.8"/><text x="220" y="138" font-size="27" fill="#769099" text-anchor="middle">‖w‖</text><text x="280" y="119" font-size="27" fill="#769099">普通 SGD；两个初值方向相同，损失都为 0</text><text x="80" y="175" font-size="30" fill="#257190" text-anchor="start">w = (0, 1)</text><text x="80" y="220" font-size="27" fill="#1a2b3d" text-anchor="start">梯度 (−1, 0)，步长 0.1</text><line x1="160" y1="530" x2="380" y2="530" stroke="#769099" stroke-width="2"/><line x1="180" y1="550" x2="180" y2="205" stroke="#769099" stroke-width="2"/><line x1="180" y1="530" x2="180" y2="385" stroke="#769099" stroke-width="4"/><path d="M185.75,395.53 L180.00,385.00 L174.25,395.53" fill="none" stroke="#769099" stroke-width="4"/><line x1="180" y1="530" x2="194.5" y2="385" stroke="#257190" stroke-width="4"/><path d="M199.18,396.05 L194.50,385.00 L187.73,394.91" fill="none" stroke="#257190" stroke-width="4"/><text x="250" y="410" font-size="26" fill="#257190" text-anchor="start">(0.1, 1)</text><text x="80" y="620" font-size="30" fill="#257190" text-anchor="start">转角约 5.7106°</text><text x="700" y="175" font-size="30" fill="#bf6d42" text-anchor="start">w = (0, 2)</text><text x="700" y="220" font-size="27" fill="#1a2b3d" text-anchor="start">梯度 (−0.5, 0)，步长 0.1</text><line x1="780" y1="530" x2="1000" y2="530" stroke="#769099" stroke-width="2"/><line x1="800" y1="550" x2="800" y2="205" stroke="#769099" stroke-width="2"/><line x1="800" y1="530" x2="800" y2="240" stroke="#769099" stroke-width="4"/><path d="M805.75,250.53 L800.00,240.00 L794.25,250.53" fill="none" stroke="#769099" stroke-width="4"/><line x1="800" y1="530" x2="807.25" y2="240" stroke="#bf6d42" stroke-width="4"/><path d="M812.74,250.67 L807.25,240.00 L801.24,250.38" fill="none" stroke="#bf6d42" stroke-width="4"/><text x="870" y="265" font-size="26" fill="#bf6d42" text-anchor="start">(0.05, 2)</text><text x="700" y="620" font-size="30" fill="#bf6d42" text-anchor="start">转角约 1.4321°</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="725" font-size="29" fill="#1a2b3d" text-anchor="start">尺度放大 2 倍、步长不变：等效方向步长变为四分之一。</text><text x="60" y="775" font-size="27" fill="#769099" text-anchor="start">把第二个学习率改为 0.4，得到 (0.2, 2)，才与第一个更新后的方向一致。</text></g></svg></svg>

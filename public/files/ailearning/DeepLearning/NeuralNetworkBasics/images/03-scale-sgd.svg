<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="758" viewBox="0 0 1200 758" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">初始方向相同，普通 SGD 的转角仍不同</title>
<desc id="fig-desc">使用等比例坐标。两组初始权重在同一射线，第二组范数更大、转角更小。</desc>
<rect x="0" y="0" width="1200" height="758" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">前向对尺度不敏感，普通 SGD 仍在参数空间迈步</text>
<text x="74" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">示例损失为 −w₁ 除以权重范数，两组起点损失都为 0。</text>
<text x="117" y="157" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">起点 (0, 1)，梯度 (-1, 0)</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img"><title>前向函数相同，参数尺度却改变方向学习的步长</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">前向函数相同，参数尺度却改变方向学习的步长</text><text x="60" y="115" font-size="27" fill="#74888d" text-anchor="start">L(w) = −w1 / ‖w‖，普通 SGD；两个初值方向相同，损失都为 0</text><text x="80" y="175" font-size="30" fill="#276a80" text-anchor="start">w = (0, 1)</text><text x="80" y="220" font-size="27" fill="#19343e" text-anchor="start">梯度 (−1, 0)，步长 0.1</text><line x1="160" y1="530" x2="380" y2="530" stroke="#74888d" stroke-width="2"/><line x1="180" y1="550" x2="180" y2="205" stroke="#74888d" stroke-width="2"/><line x1="180" y1="530" x2="180" y2="385" stroke="#74888d" stroke-width="4"/><path d="M185.75,395.53 L180.00,385.00 L174.25,395.53" fill="none" stroke="#74888d" stroke-width="4"/><line x1="180" y1="530" x2="194.5" y2="385" stroke="#276a80" stroke-width="4"/><path d="M199.18,396.05 L194.50,385.00 L187.73,394.91" fill="none" stroke="#276a80" stroke-width="4"/><text x="250" y="410" font-size="26" fill="#276a80" text-anchor="start">(0.1, 1)</text><text x="80" y="620" font-size="30" fill="#276a80" text-anchor="start">转角约 5.7106°</text><text x="700" y="175" font-size="30" fill="#c2673f" text-anchor="start">w = (0, 2)</text><text x="700" y="220" font-size="27" fill="#19343e" text-anchor="start">梯度 (−0.5, 0)，步长 0.1</text><line x1="780" y1="530" x2="1000" y2="530" stroke="#74888d" stroke-width="2"/><line x1="800" y1="550" x2="800" y2="205" stroke="#74888d" stroke-width="2"/><line x1="800" y1="530" x2="800" y2="240" stroke="#74888d" stroke-width="4"/><path d="M805.75,250.53 L800.00,240.00 L794.25,250.53" fill="none" stroke="#74888d" stroke-width="4"/><line x1="800" y1="530" x2="807.25" y2="240" stroke="#c2673f" stroke-width="4"/><path d="M812.74,250.67 L807.25,240.00 L801.24,250.38" fill="none" stroke="#c2673f" stroke-width="4"/><text x="870" y="265" font-size="26" fill="#c2673f" text-anchor="start">(0.05, 2)</text><text x="700" y="620" font-size="30" fill="#c2673f" text-anchor="start">转角约 1.4321°</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="725" font-size="29" fill="#19343e" text-anchor="start">尺度放大 2 倍、步长不变：等效方向步长变为四分之一。</text><text x="60" y="775" font-size="27" fill="#74888d" text-anchor="start">把第二个学习率改为 0.4，得到 (0.2, 2)，才与第一个更新后的方向一致。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title id="figure-title">BatchNorm：训练方差和运行方差如何分开计算</title><desc id="figure-desc">BatchNorm：训练方差和运行方差如何分开计算</desc><rect width="1200" height="580" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">BatchNorm：训练方差和运行方差如何分开计算</text><text x="600" y="103" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">同一通道的两个值：8，12；批均值 10</text><line x1="600" y1="130" x2="600" y2="495" stroke="#c8d7e3" stroke-width="2" /><text x="305" y="165" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">训练前向：当前批统计</text><text x="305" y="219" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">平方离差：4 + 4 = 8</text><text x="184.0" y="266" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">8</text><line x1="154" y1="278" x2="214" y2="278" stroke="#2865a0" stroke-width="1.8" /><text x="184.0" y="311" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><text x="240" y="288" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">= 4  （归一化方差）</text><line x1="305" y1="327" x2="305" y2="361" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><rect x="95" y="382" width="420" height="68" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="305.0" y="426.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">训练输出 ≈ (−1，1)</text><text x="895" y="165" font-size="29" fill="#cf7432" text-anchor="middle" font-weight="400">运行缓冲：另一种方差估计</text><text x="758.0" y="213" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">8</text><line x1="708" y1="225" x2="808" y2="225" stroke="#cf7432" stroke-width="1.8" /><text x="758.0" y="258" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">2 − 1</text><text x="835" y="235" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">= 8</text><text x="895" y="309" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">均值：0.9 × 0 + 0.1 × 10 = 1</text><text x="895" y="352" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">方差：0.9 × 1 + 0.1 × 8 = 1.7</text><line x1="895" y1="371" x2="895" y2="395" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><rect x="672" y="412" width="446" height="68" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="895.0" y="456.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">评估输出 ≈ (5.369，8.437)</text><text x="600" y="548" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">评估读取更新后的缓冲；训练读取本批统计</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="641" viewBox="0 0 1370 641" role="img" aria-labelledby="label detail"><title id="label">逐坐标 ReLU 把哪些方向压到零</title><desc id="detail">输入四象限经逐坐标 ReLU 后分别保留、压到纵轴、压到横轴、压到原点。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1370" height="641" fill="white" stroke="none" stroke-width="1.6"/><text x="330" y="68" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">输入空间</text><rect x="330" y="154" width="184" height="180" fill="url(#wash-teal)" stroke="none" stroke-width="1.6"/><rect x="146" y="154" width="184" height="180" fill="url(#wash-violet)" stroke="none" stroke-width="1.6"/><rect x="330" y="334" width="184" height="180" fill="url(#wash-coral)" stroke="none" stroke-width="1.6"/><rect x="146" y="334" width="184" height="180" fill="url(#wash-gray)" stroke="none" stroke-width="1.6"/><line x1="130" y1="334" x2="530" y2="334" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="330" y1="532.4" x2="330" y2="135.6" stroke="#202a37" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="542.8" y="343.6" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">x₁</text><text x="314.8" y="125.2" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">x₂</text><circle cx="442" cy="230" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><circle cx="218" cy="230" r="7" stroke="#655184" fill="#655184" stroke-width="1.75"/><circle cx="442" cy="438" r="
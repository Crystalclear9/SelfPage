<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>多任务梯度冲突不等于没有共同下降方向</title><desc>目标A为到(2,0)距离平方的一半，B为到(-1,1)距离平方的一半；起点为原点。等权梯度和的一步使A改善但B变差，而0.4A加0.6B的梯度方向使二者均改善。</desc><rect width="1200" height="780" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="55" font-size="34" fill="#233642" text-anchor="start">梯度有冲突，仍可能找到两者都接受的一步</text><text x="48" y="105" font-size="25" fill="#687b86" text-anchor="start">A：到 (2, 0) 的平方距离的一半；B：到 (−1, 1) 的平方距离的一半。</text><text x="48" y="150" font-size="27" fill="#233642" text-anchor="start">同一起点 θ = (0, 0)，同一步长 0.2。</text><text x="300" y="205" font-size="29" fill="#233642" text-anchor="middle">当前梯度</text><line x1="80" y1="355" x2="500" y2="355" stroke="#687b86" stroke-width="2"/><line x1="300" y1="485" x2="300" y2="240" stroke="#687b86" stroke-width="2"/><line x1="300" y1="355" x2="116" y2="355" stroke="#246d91" stroke-width="4"/><polyline points="128.606,348.910 116.000,355.000 128.606,361.090" fill="none" stroke="#246d91" stroke-width="3" stroke-linejoin="round"/><line x1="300" y1="355" x2="392" y2="447" stroke="#bc5b31" stroke-width="4"/><polyline points="378.780,442.392 392.000,447.000 387.392,433.780" fill="none" stroke="#bc5b31" stroke-width="3" stroke-linejoin="round"/><text x="80" y="325" font-size="27" fill="#246d91" text-anchor="start">gA = (−2, 0)</text><text x="345" y="484" font-size="27" fill="#bc5b31" text-anchor="start">gB = (1, −1)</text><text x="60" y="545" font-size="27" fill="#687b86" text-anchor="start">内积 −2：最陡方向相互冲突</text><text x="650" y="205" font-size="29" fill="#233642" text-anchor="start">实际更新后的两个损失</text><text x="650" y="280" font-size="26" fill="#687b86" text-anchor="start">起点</text><text x="690" y="321" font-size="28" fill="#687b86" text-anchor="start">A = 2      B = 1</text><text x="650" y="365" font-size="26" fill="#bc5b31" text-anchor="start">梯度和：θ = (0.2, 0.2)</text><text x="690" y="406" font-size="28" fill="#bc5b31" text-anchor="start">A = 1.64      B = 1.04</text><text x="650" y="450" font-size="26" fill="#246d91" text-anchor="start">加权：θ = (0.04, 0.12)</text><text x="690" y="491" font-size="28" fill="#246d91" text-anchor="start">A = 1.928      B = 0.928</text><line x1="60" y1="590" x2="1140" y2="590" stroke="#dce5e9" stroke-width="2"/><text x="60" y="645" font-size="27" fill="#bc5b31" text-anchor="start">等权和 gA + gB：总损失下降，B 却从 1 升至 1.04。</text><text x="60" y="700" font-size="27" fill="#246d91" text-anchor="start">0.4gA + 0.6gB：两项都下降；这只是本次二次目标的一步。</text><text x="60" y="750" font-size="25" fill="#687b86" text-anchor="start">图示是梯度；参数移动取其负方向。权重变化也改变合成梯度尺度。</text></g></svg>

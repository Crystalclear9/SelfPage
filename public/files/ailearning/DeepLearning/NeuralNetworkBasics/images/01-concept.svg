<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1102" viewBox="0 0 1440 1102" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两条样本经过相同两层参数，在输入、隐藏表示与输出分数中保持对应</title><rect width="1440" height="1102" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两条样本经过相同两层参数，在输入、隐藏表示与输出分数中保持对应</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="960" viewBox="0 0 1400 1000" role="img" x="48" y="106" overflow="hidden"><title>同一批样本：几何位置与逐层运算一一对应</title><rect width="1400" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#20354a" text-anchor="start">同一批样本：几何位置与逐层运算一一对应</text><text x="55" y="111" font-size="27" fill="#7d949d" text-anchor="start">A、B 的颜色贯穿三幅图；轴表示不同特征，屏幕距离不能跨图比较</text><text x="85" y="171" font-size="30" fill="#20354a" text-anchor="start">输入 X</text><line x1="85" y1="208" x2="85" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="85" y1="463" x2="385" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="85.0" y1="208" x2="85.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="85.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">-2</text><line x1="235.0" y1="208" x2="235.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="235.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">0</text><line x1="385.0" y1="208" x2="385.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="385.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">2</text><line x1="85" y1="463.0" x2="385" y2="463.0" stroke="#dfe4ec" stroke-width="1"/><text x="73" y="471.0" font-size="24" fill="#7d949d" text-anchor="end">0</text><line x1="85" y1="378.0" x2="385" y2="378.0" stroke="#dfe4ec" stroke-width="1"/><text x="73" y="386.0" font-size="24" fill="#7d949d" text-anchor="end">1</text><line x1="85" y1="293.0" x2="385" y2="293.0" stroke="#dfe4ec" stroke-width="1"/><text x="73" y="301.0" font-size="24" fill="#7d949d" text-anchor="end">2</text><line x1="85" y1="208.0" x2="385" y2="208.0" stroke="#dfe4ec" stroke-width="1"/><text x="73" y="216.0" font-size="24" fill="#7d949d" text-anchor="end">3</text><circle cx="310.0" cy="293.0" r="9" fill="#226f90"/><text x="320.0" y="278.0" font-size="25" fill="#226f90" text-anchor="start">A(1, 2)</text><circle cx="160.0" cy="378.0" r="9" fill="#ba6940"/><text x="170.0" y="363.0" font-size="25" fill="#ba6940" text-anchor="start">B(-1, 1)</text><text x="540" y="171" font-size="30" fill="#20354a" text-anchor="start">隐藏 H = ReLU(Z)</text><line x1="540" y1="208" x2="540" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="540" y1="463" x2="840" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="540.0" y1="208" x2="540.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="540.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">0</text><line x1="640.0" y1="208" x2="640.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="640.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">2</text><line x1="740.0" y1="208" x2="740.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="740.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">4</text><line x1="840.0" y1="208" x2="840.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="840.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">6</text><line x1="540" y1="463.0" x2="840" y2="463.0" stroke="#dfe4ec" stroke-width="1"/><text x="528" y="471.0" font-size="24" fill="#7d949d" text-anchor="end">0</text><line x1="540" y1="378.0" x2="840" y2="378.0" stroke="#dfe4ec" stroke-width="1"/><text x="528" y="386.0" font-size="24" fill="#7d949d" text-anchor="end">1</text><line x1="540" y1="293.0" x2="840" y2="293.0" stroke="#dfe4ec" stroke-width="1"/><text x="528" y="301.0" font-size="24" fill="#7d949d" text-anchor="end">2</text><line x1="540" y1="208.0" x2="840" y2="208.0" stroke="#dfe4ec" stroke-width="1"/><text x="528" y="216.0" font-size="24" fill="#7d949d" text-anchor="end">3</text><circle cx="790.0" cy="463.0" r="9" fill="#226f90"/><text x="800.0" y="448.0" font-size="25" fill="#226f90" text-anchor="start">A(5, 0)</text><circle cx="590.0" cy="378.0" r="9" fill="#ba6940"/><text x="600.0" y="363.0" font-size="25" fill="#ba6940" text-anchor="start">B(1, 1)</text><text x="995" y="171" font-size="30" fill="#20354a" text-anchor="start">分数 S</text><line x1="995" y1="208" x2="995" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="995" y1="463" x2="1295" y2="463" stroke="#7d949d" stroke-width="2"/><line x1="995.0" y1="208" x2="995.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="995.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">0</text><line x1="1095.0" y1="208" x2="1095.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="1095.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">2</text><line x1="1195.0" y1="208" x2="1195.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="1195.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">4</text><line x1="1295.0" y1="208" x2="1295.0" y2="463" stroke="#dfe4ec" stroke-width="1"/><text x="1295.0" y="497" font-size="24" fill="#7d949d" text-anchor="middle">6</text><line x1="995" y1="463.0" x2="1295" y2="463.0" stroke="#dfe4ec" stroke-width="1"/><text x="983" y="471.0" font-size="24" fill="#7d949d" text-anchor="end">0</text><line x1="995" y1="335.5" x2="1295" y2="335.5" stroke="#dfe4ec" stroke-width="1"/><text x="983" y="343.5" font-size="24" fill="#7d949d" text-anchor="end">5</text><line x1="995" y1="208.0" x2="1295" y2="208.0" stroke="#dfe4ec" stroke-width="1"/><text x="983" y="216.0" font-size="24" fill="#7d949d" text-anchor="end">10</text><circle cx="1270.0" cy="220.75" r="9" fill="#226f90"/><text x="1260.0" y="205.75" font-size="25" fill="#226f90" text-anchor="end">A(5.5, 9.5)</text><circle cx="1020.0" cy="399.25" r="9" fill="#ba6940"/><text x="1030.0" y="384.25" font-size="25" fill="#ba6940" text-anchor="start">B(0.5, 2.5)</text><line x1="419" y1="331" x2="498" y2="331" stroke="#7d949d" stroke-width="3"/><polygon points="498,331 487.1946347717679,336.21958640933474 487.1946347717679,325.78041359066526" fill="#7d949d"/><line x1="874" y1="331" x2="953" y2="331" stroke="#7d949d" stroke-width="3"/><polygon points="953,331 942.1946347717678,336.21958640933474 942.1946347717678,325.78041359066526" fill="#7d949d"/><text x="55" y="555" font-size="29" fill="#20354a" text-anchor="start">逐行复算：同一组 W1、b1、W2、b2 对两条样本复用</text><text x="65" y="621" font-size="28" fill="#20354a" text-anchor="start">样本输入</text><text x="325" y="621" font-size="28" fill="#20354a" text-anchor="start">预激活 Z</text><text x="620" y="621" font-size="28" fill="#20354a" text-anchor="start">ReLU 后 H</text><text x="915" y="621" font-size="28" fill="#20354a" text-anchor="start">输出分数 S</text><text x="65" y="689" font-size="31" fill="#226f90" text-anchor="start">(1, 2)</text><text x="325" y="689" font-size="31" fill="#226f90" text-anchor="start">(5, 0)</text><text x="620" y="689" font-size="31" fill="#226f90" text-anchor="start">(5, 0)</text><text x="915" y="689" font-size="31" fill="#226f90" text-anchor="start">(5.5, 9.5)</text><line x1="260" y1="677" x2="300" y2="677" stroke="#226f90" stroke-width="3"/><polygon points="300,677 289.1946347717679,682.2195864093347 289.1946347717679,671.7804135906653" fill="#226f90"/><line x1="555" y1="677" x2="595" y2="677" stroke="#226f90" stroke-width="3"/><polygon points="595,677 584.1946347717678,682.2195864093347 584.1946347717678,671.7804135906653" fill="#226f90"/><line x1="850" y1="677" x2="890" y2="677" stroke="#226f90" stroke-width="3"/><polygon points="890,677 879.1946347717678,682.2195864093347 879.1946347717678,671.7804135906653" fill="#226f90"/><text x="65" y="768" font-size="31" fill="#ba6940" text-anchor="start">(−1, 1)</text><text x="325" y="768" font-size="31" fill="#ba6940" text-anchor="start">(1, 1)</text><text x="620" y="768" font-size="31" fill="#ba6940" text-anchor="start">(1, 1)</text><text x="915" y="768" font-size="31" fill="#ba6940" text-anchor="start">(0.5, 2.5)</text><line x1="260" y1="756" x2="300" y2="756" stroke="#ba6940" stroke-width="3"/><polygon points="300,756 289.1946347717679,761.2195864093347 289.1946347717679,750.7804135906653" fill="#ba6940"/><line x1="555" y1="756" x2="595" y2="756" stroke="#ba6940" stroke-width="3"/><polygon points="595,756 584.1946347717678,761.2195864093347 584.1946347717678,750.7804135906653" fill="#ba6940"/><line x1="850" y1="756" x2="890" y2="756" stroke="#ba6940" stroke-width="3"/><polygon points="890,756 879.1946347717678,761.2195864093347 879.1946347717678,750.7804135906653" fill="#ba6940"/><line x1="55" y1="820" x2="1345" y2="820" stroke="#dfe4ec" stroke-width="2"/><text x="55" y="875" font-size="27" fill="#20354a" text-anchor="start">W1 = [[1, −1], [2, 1]]；b1 = (0, −1)</text><text x="55" y="932" font-size="27" fill="#20354a" text-anchor="start">W2 = [[1, 2], [−1, 1]]；b2 = (0.5, −0.5)</text><text x="900" y="895" font-size="27" fill="#4c9590" text-anchor="start">这里 ReLU 未改数值</text><text x="900" y="943" font-size="27" fill="#7d949d" text-anchor="start">分数还不是概率</text></g></svg></svg>

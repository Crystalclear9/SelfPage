ke="#74888d" stroke-width="4"/><text x="150" y="640" font-size="24" fill="#19343e" text-anchor="middle">-1</text><text x="276" y="640" font-size="24" fill="#19343e" text-anchor="middle">1</text><text x="402" y="640" font-size="24" fill="#19343e" text-anchor="middle">3</text><text x="528" y="640" font-size="24" fill="#19343e" text-anchor="middle">5</text><text x="130" y="613" font-size="24" fill="#19343e" text-anchor="end">-2</text><text x="130" y="487" font-size="24" fill="#19343e" text-anchor="end">0</text><text x="130" y="361" font-size="24" fill="#19343e" text-anchor="end">2</text><text x="130" y="235" font-size="24" fill="#19343e" text-anchor="end">4</text><text x="560" y="645" font-size="26" fill="#19343e" text-anchor="start">x2</text><text x="100" y="205" font-size="26" fill="#19343e" text-anchor="start">x3</text><circle cx="276" cy="542" r="7" fill="#c2673f"/><text x="288" y="532" font-size="27" fill="#c2673f" text-anchor="start">A</text><circle cx="465" cy="479" r="7" fill="#c2673f"/><text x="477" y="469" font-size="27" fill="#c2673f" text-anchor="start">B</text><circle cx="276" cy="290" r="7" fill="#276a80"/><text x="288" y="280" font-size="27" fill="#276a80" text-anchor="start">C</text><text x="240" y="570" font-size="28" fill="#c2673f" text-anchor="start">整片负区 → 0</text><text x="750" y="185" font-size="28" fill="#19343e" text-anchor="start">输出曲线：横轴是 z，不是 x2</text><line x1="770" y1="605" x2="1250" y2="605" stroke="#74888d" stroke-width="4"/><path d="M1239.47,610.75 L1250.00,605.00 L1239.47,599.25" fill="none" stroke="#74888d" stroke-width="4"/><line x1="896" y1="635" x2="896" y2="215" stroke="#74888d" stroke-width="4"/><path d="M901.75,225.53 L896.00,215.00 L890.25,225.53" fill="none" stroke="#74888d" stroke-width="4"/><path d="M770.00,605.00 L896.00,605.00 L1232.00,269.00" fill="none" stroke="#276a80" stroke-width="4"/><text x="770" y="645" font-size="24" fill="#19343e" text-anchor="middle">-3</text><text x="896" y="645" font-size="24" fill="#19343e" text
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>Dropout 保持的是缩放后的条件期望</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#18364e">Dropout 保持的是缩放后的条件期望</text><line x1="90" y1="512.3199999999999" x2="1100" y2="512.3199999999999" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="512.3199999999999" width="125" height="3.5999999999999996" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="21" fill="#18364e">丢弃结果</text><text x="170.0" y="495.52000000000004" font-size="25.0" fill="#18364e">0</text><rect x="463.3333333333333" y="195.51999999999995" width="125" height="316.80000000000007" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="453.3333333333333" y="604.0" font-size="21" fill="#18364e">保留结果</text><text x="463.3333333333333" y="178.71999999999997" font-size="25.0" fill="#18364e">4</text><rect x="756.6666666666666" y="353.92" width="125" height="158.4" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="746.6666666666666" y="604.0" font-size="21" fill="#18364e">原激活</text><text x="756.6666666666666" y="337.12" font-size="25.0" fill="#18364e">2</text></g><text x="105" y="657" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">本例丢弃概率 p=0.5；训练时保留激活按 1/(1−p) 缩放。</text><text x="105" y="691" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">输入 2：输出以各 0.5 的概率取 0 或 4，条件期望仍为 2。</text></svg>

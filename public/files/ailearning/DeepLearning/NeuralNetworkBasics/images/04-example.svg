<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img"><title>四个随机点经过同一个 ReLU，均值不能穿过折点</title><rect width="1400" height="1100" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">四个随机点经过同一个 ReLU，均值不能穿过折点</text><text x="55" y="112" font-size="28" fill="#7b8c92" text-anchor="start">h=(1,1)，独立保留概率 0.5；倒置缩放后四点等概率</text><line x1="130" y1="220" x2="130" y2="660" stroke="#7b8c92" stroke-width="2"/><line x1="130" y1="660" x2="570" y2="660" stroke="#7b8c92" stroke-width="2"/><line x1="188.66666666666666" y1="220" x2="188.66666666666666" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="188.66666666666666" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="335.33333333333337" y1="220" x2="335.33333333333337" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="335.33333333333337" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">1</text><line x1="482.0" y1="220" x2="482.0" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="482.0" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">2</text><line x1="130" y1="601.3333333333334" x2="570" y2="601.3333333333334" stroke="#dbe5e9" stroke-width="1"/><text x="118" y="609.3333333333334" font-size="24" fill="#7b8c92" text-anchor="end">0</text><line x1="130" y1="454.6666666666667" x2="570" y2="454.6666666666667" stroke="#dbe5e9" stroke-width="1"/><text x="118" y="462.6666666666667" font-size="24" fill="#7b8c92" text-anchor="end">1</text><line x1="130" y1="308.00000000000006" x2="570" y2="308.00000000000006" stroke="#dbe5e9" stroke-width="1"/><text x="118" y="316.00000000000006" font-size="24" fill="#7b8c92" text-anchor="end">2</text><polyline points="130.0,660.0 570.0,220.0" fill="none" stroke="#7b8c92" stroke-width="2"/><circle cx="188.66666666666666" cy="601.3333333333334" r="10" fill="#246880"/><text x="173.66666666666666" y="641.3333333333334" font-size="27" fill="#246880" text-anchor="start">(0,0)</text><circle cx="188.66666666666666" cy="308.00000000000006" r="10" fill="#246880"/><text x="173.66666666666666" y="288.00000000000006" font-size="27" fill="#246880" text-anchor="start">(0,2)</text><circle cx="482.0" cy="601.3333333333334" r="10" fill="#bd633d"/><text x="482.0" y="641.3333333333334" font-size="27" fill="#bd633d" text-anchor="start">(2,0)</text><circle cx="482.0" cy="308.00000000000006" r="10" fill="#246880"/><text x="482.0" y="288.00000000000006" font-size="27" fill="#246880" text-anchor="start">(2,2)</text><circle cx="335.33333333333337" cy="454.6666666666667" r="11" fill="#4d8776"/><text x="350.33333333333337" y="494.6666666666667" font-size="27" fill="#4d8776" text-anchor="start">均值 (1,1)</text><text x="150" y="725" font-size="26" fill="#243c46" text-anchor="start">横轴 h1；纵轴 h2</text><text x="160" y="174" font-size="29" fill="#243c46" text-anchor="start">隐藏向量的四个可能值</text><text x="850" y="174" font-size="29" fill="#243c46" text-anchor="start">只保留差值 d=h1−h2</text><line x1="860" y1="220" x2="860" y2="660" stroke="#7b8c92" stroke-width="2"/><line x1="860" y1="660" x2="1290" y2="660" stroke="#7b8c92" stroke-width="2"/><line x1="903.0" y1="220" x2="903.0" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="903.0" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">-2</text><line x1="1075.0" y1="220" x2="1075.0" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="1075.0" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="1247.0" y1="220" x2="1247.0" y2="660" stroke="#dbe5e9" stroke-width="1"/><text x="1247.0" y="694" font-size="24" fill="#7b8c92" text-anchor="middle">2</text><line x1="860" y1="612.8571428571429" x2="1290" y2="612.8571428571429" stroke="#dbe5e9" stroke-width="1"/><text x="848" y="620.8571428571429" font-size="24" fill="#7b8c92" text-anchor="end">0</text><line x1="860" y1="455.71428571428567" x2="1290" y2="455.71428571428567" stroke="#dbe5e9" stroke-width="1"/><text x="848" y="463.71428571428567" font-size="24" fill="#7b8c92" text-anchor="end">1</text><line x1="860" y1="298.5714285714286" x2="1290" y2="298.5714285714286" stroke="#dbe5e9" stroke-width="1"/><text x="848" y="306.5714285714286" font-size="24" fill="#7b8c92" text-anchor="end">2</text><polyline points="860.0,612.8571428571429 1075.0,612.8571428571429 1290.0,220.0" fill="none" stroke="#246880" stroke-width="4"/><circle cx="903.0" cy="612.8571428571429" r="10" fill="#246880"/><text x="891.0" y="587.8571428571429" font-size="26" fill="#246880" text-anchor="start">1 点</text><circle cx="1075.0" cy="612.8571428571429" r="10" fill="#246880"/><text x="1063.0" y="587.8571428571429" font-size="26" fill="#246880" text-anchor="start">2 点</text><circle cx="1247.0" cy="298.5714285714286" r="10" fill="#bd633d"/><text x="1235.0" y="273.5714285714286" font-size="26" fill="#bd633d" text-anchor="start">1 点</text><text x="870" y="725" font-size="26" fill="#243c46" text-anchor="start">横轴 d；纵轴 max(0,d)</text><text x="55" y="800" font-size="29" fill="#243c46" text-anchor="start">输出分布：概率 0.75 落在 0，概率 0.25 落在 2</text><text x="170" y="868" font-size="28" fill="#243c46" text-anchor="start">随机网络均值</text><line x1="170" y1="980" x2="510" y2="980" stroke="#7b8c92" stroke-width="2"/><rect x="230" y="931.25" width="75" height="48.75" fill="#246880" stroke="none"/><text x="267" y="1020" font-size="28" fill="#243c46" text-anchor="middle">0</text><text x="267" y="919.25" font-size="25" fill="#7b8c92" text-anchor="middle">0.75</text><rect x="440" y="963.75" width="75" height="16.25" fill="#bd633d" stroke="none"/><text x="477" y="1020" font-size="28" fill="#243c46" text-anchor="middle">2</text><text x="477" y="951.75" font-size="25" fill="#7b8c92" text-anchor="middle">0.25</text><text x="850" y="868" font-size="28" fill="#243c46" text-anchor="start">均值向量的固定输出</text><line x1="850" y1="980" x2="1190" y2="980" stroke="#7b8c92" stroke-width="2"/><rect x="910" y="915" width="75" height="65" fill="#246880" stroke="none"/><text x="947" y="1020" font-size="28" fill="#243c46" text-anchor="middle">0</text><text x="947" y="903" font-size="25" fill="#7b8c92" text-anchor="middle">1</text><text x="140" y="1060" font-size="27" fill="#bd633d" text-anchor="start">期望 0.75×0 + 0.25×2 = 0.5</text><text x="850" y="1060" font-size="27" fill="#4d8776" text-anchor="start">ReLU(1−1) = 0</text></g></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="672" viewBox="30 63 1128 672" role="img"><rect x="30" y="63" width="1128" height="672" fill="#ffffff"/><title>Dropout保持隐藏均值但不保持非线性输出均值</title><desc>两个输入激活均为1，各以二分之一概率保留并翻倍，四种等概率掩码的后续ReLU输出为0、0、2、0，均值为0.5，关闭Dropout的输出为0。</desc><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="105" font-size="28" fill="#687b86" text-anchor="start">h = (1, 1)；两个单元独立保留，概率均为 0.5。</text><text x="48" y="155" font-size="29" fill="#233642" text-anchor="start">后续函数：ReLU(h1 − h2)</text><text x="140" y="222" font-size="25" fill="#233642" text-anchor="middle">两者丢弃</text><line x1="74" y1="370" x2="206" y2="370" stroke="#687b86" stroke-width="2"/><rect x="90" y="370" width="40" height="0" fill="#246d91"/><text x="110" y="394" font-size="24" fill="#687b86" text-anchor="middle">h1</text><text x="110" y="355" font-size="27" fill="#246d91" text-anchor="middle">0</text><rect x="147" y="370" width="40" height="0" fill="#bc5b31"/><text x="167" y="394" font-size="24" fill="#687b86" text-anchor="middle">h2</text><text x="167" y="355" font-size="27" fill="#bc5b31" text-anchor="middle">0</text><text x="140" y="454" font-size="27" fill="#233642" text-anchor="middle">0 − 0 = 0</text><text x="140" y="505" font-size="31" fill="#687b86" text-anchor="middle">输出 0</text><text x="420" y="222" font-size="25" fill="#233642" text-anchor="middle">仅保留第二个</text><line x1="354" y1="370" x2="486" y2="370" stroke="#687b86" stroke-width="2"/><rect x="370" y="370" width="40" height="0" fill="#246d91"/><text x="390" y="394" font-size="24" fill="#687b86" text-anchor="middle">h1</text><text x="390" y="355" font-size="27" fill="#246d91" text-anchor="middle">0</text><rect x="427" y="274" width="40" height="96" fill="#bc5b31"/><text x="447" y="394" font-size="24" fill="#687b86" text-anchor="middle">h2</text><text x="447" y="259" font-size="27" fill="#bc5b31" text-anchor="middle">2</text><text x="420" y="454" font-size="27" fill="#233642" text-anchor="middle">0 − 2 = -2</text><text x="420" y="505" font-size="31" fill="#687b86" text-anchor="middle">输出 0</text><text x="700" y="222" font-size="25" fill="#233642" text-anchor="middle">仅保留第一个</text><line x1="634" y1="370" x2="766" y2="370" stroke="#687b86" stroke-width="2"/><rect x="650" y="274" width="40" height="96" fill="#246d91"/><text x="670" y="394" font-size="24" fill="#687b86" text-anchor="middle">h1</text><text x="670" y="259" font-size="27" fill="#246d91" text-anchor="middle">2</text><rect x="707" y="370" width="40" height="0" fill="#bc5b31"/><text x="727" y="394" font-size="24" fill="#687b86" text-anchor="middle">h2</text><text x="727" y="355" font-size="27" fill="#bc5b31" text-anchor="middle">0</text><text x="700" y="454" font-size="27" fill="#233642" text-anchor="middle">2 − 0 = 2</text><text x="700" y="505" font-size="31" fill="#bc5b31" text-anchor="middle">输出 2</text><text x="980" y="222" font-size="25" fill="#233642" text-anchor="middle">两者保留</text><line x1="914" y1="370" x2="1046" y2="370" stroke="#687b86" stroke-width="2"/><rect x="930" y="274" width="40" height="96" fill="#246d91"/><text x="950" y="394" font-size="24" fill="#687b86" text-anchor="middle">h1</text><text x="950" y="259" font-size="27" fill="#246d91" text-anchor="middle">2</text><rect x="987" y="274" width="40" height="96" fill="#bc5b31"/><text x="1007" y="394" font-size="24" fill="#687b86" text-anchor="middle">h2</text><text x="1007" y="259" font-size="27" fill="#bc5b31" text-anchor="middle">2</text><text x="980" y="454" font-size="27" fill="#233642" text-anchor="middle">2 − 2 = 0</text><text x="980" y="505" font-size="31" fill="#687b86" text-anchor="middle">输出 0</text><line x1="60" y1="545" x2="1140" y2="545" stroke="#dce5e9" stroke-width="2"/><text x="60" y="600" font-size="29" fill="#246d91" text-anchor="start">隐藏向量均值：(1, 1)</text><text x="60" y="655" font-size="28" fill="#bc5b31" text-anchor="start">四种结果等概率：输出均值 = (0 + 0 + 2 + 0) ÷ 4 = 0.5</text><text x="60" y="710" font-size="28" fill="#687b86" text-anchor="start">关闭 Dropout：ReLU(1 − 1) = 0</text></g></svg>

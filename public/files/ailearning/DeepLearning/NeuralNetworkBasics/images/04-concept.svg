<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img"><title>分母不只改变损失数值：它改变每个位置移动多远</title><rect width="1280" height="1070" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">分母不只改变损失数值：它改变每个位置移动多远</text><text x="60" y="112" font-size="27" fill="#19343e" text-anchor="start">预测初值全为 0；A 有两个标签 1，B 有四个标签 2；灰格没有观测</text><text x="60" y="252" font-size="30" fill="#19343e" text-anchor="start">A</text><rect x="145" y="215" width="105" height="65" fill="#e5edf0"/><text x="197" y="258" font-size="30" fill="#19343e" text-anchor="middle">1</text><rect x="285" y="215" width="105" height="65" fill="#e5edf0"/><text x="337" y="258" font-size="30" fill="#19343e" text-anchor="middle">1</text><rect x="425" y="215" width="105" height="65" fill="#f2f2f2"/><text x="477" y="258" font-size="30" fill="#74888d" text-anchor="middle">—</text><rect x="565" y="215" width="105" height="65" fill="#f2f2f2"/><text x="617" y="258" font-size="30" fill="#74888d" text-anchor="middle">—</text><text x="60" y="347" font-size="30" fill="#19343e" text-anchor="start">B</text><rect x="145" y="310" width="105" height="65" fill="#e5edf0"/><text x="197" y="353" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="285" y="310" width="105" height="65" fill="#e5edf0"/><text x="337" y="353" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="425" y="310" width="105" height="65" fill="#e5edf0"/><text x="477" y="353" font-size="30" fill="#19343e" text-anchor="middle">2</text><rect x="565" y="310" width="105" height="65" fill="#e5edf0"/><text x="617" y="353" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="820" y="255" font-size="28" fill="#19343e" text-anchor="start">误差平方和：A = 2</text><text x="820" y="350" font-size="28" fill="#19343e" text-anchor="start">误差平方和：B = 16</text><line x1="60" y1="415" x2="1220" y2="415" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="475" font-size="29" fill="#276a80" text-anchor="start">① 有效元素平均：损失 3</text><text x="690" y="475" font-size="29" fill="#c2673f" text-anchor="start">② 序列等权：损失 2.5</text><text x="60" y="560" font-size="27" fill="#19343e" text-anchor="start">A 每个梯度</text><text x="300" y="538" font-size="25" fill="#276a80" text-anchor="middle">−1</text><line x1="278" y1="550" x2="322" y2="550" stroke="#276a80" stroke-width="1.7"/><text x="300" y="578" font-size="25" fill="#276a80" text-anchor="middle">3</text><text x="690" y="560" font-size="27" fill="#19343e" text-anchor="start">A 每个梯度</text><text x="970" y="538" font-size="25" fill="#c2673f" text-anchor="middle">−1</text><line x1="948" y1="550" x2="992" y2="550" stroke="#c2673f" stroke-width="1.7"/><text x="970" y="578" font-size="25" fill="#c2673f" text-anchor="middle">2</text><text x="60" y="670" font-size="27" fill="#19343e" text-anchor="start">B 每个梯度</text><text x="300" y="648" font-size="25" fill="#276a80" text-anchor="middle">−2</text><line x1="278" y1="660" x2="322" y2="660" stroke="#276a80" stroke-width="1.7"/><text x="300" y="688" font-size="25" fill="#276a80" text-anchor="middle">3</text><text x="690" y="670" font-size="27" fill="#19343e" text-anchor="start">B 每个梯度</text><text x="970" y="648" font-size="25" fill="#c2673f" text-anchor="middle">−1</text><line x1="948" y1="660" x2="992" y2="660" stroke="#c2673f" stroke-width="1.7"/><text x="970" y="688" font-size="25" fill="#c2673f" text-anchor="middle">2</text><line x1="60" y1="730" x2="1220" y2="730" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="790" font-size="29" fill="#19343e" text-anchor="start">普通 SGD 同取步长 0.3：向标签方向的实际位移</text><text x="115" y="863" font-size="27" fill="#19343e" text-anchor="end">A</text><line x1="150" y1="855" x2="450" y2="855" stroke="#dbe5e8" stroke-width="2"/><circle cx="150" cy="855" r="5" fill="#74888d"/><line x1="150" y1="855" x2="270.0" y2="855" stroke="#276a80" stroke-width="4"/><path d="M259.47,860.75 L270.00,855.00 L259.47,849.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="270.0" y="837" font-size="27" fill="#276a80" text-anchor="middle">0.1</text><text x="115" y="958" font-size="27" fill="#19343e" text-anchor="end">B</text><line x1="150" y1="950" x2="450" y2="950" stroke="#dbe5e8" stroke-width="2"/><circle cx="150" cy="950" r="5" fill="#74888d"/><line x1="150" y1="950" x2="390.0" y2="950" stroke="#276a80" stroke-width="4"/><path d="M379.47,955.75 L390.00,950.00 L379.47,944.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="390.0" y="932" font-size="27" fill="#276a80" text-anchor="middle">0.2</text><text x="715" y="863" font-size="27" fill="#19343e" text-anchor="end">A</text><line x1="750" y1="855" x2="1050" y2="855" stroke="#dbe5e8" stroke-width="2"/><circle cx="750" cy="855" r="5" fill="#74888d"/><line x1="750" y1="855" x2="930.0" y2="855" stroke="#c2673f" stroke-width="4"/><path d="M919.47,860.75 L930.00,855.00 L919.47,849.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="930.0" y="837" font-size="27" fill="#c2673f" text-anchor="middle">0.15</text><text x="715" y="958" font-size="27" fill="#19343e" text-anchor="end">B</text><line x1="750" y1="950" x2="1050" y2="950" stroke="#dbe5e8" stroke-width="2"/><circle cx="750" cy="950" r="5" fill="#74888d"/><line x1="750" y1="950" x2="930.0" y2="950" stroke="#c2673f" stroke-width="4"/><path d="M919.47,955.75 L930.00,950.00 L919.47,944.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="930.0" y="932" font-size="27" fill="#c2673f" text-anchor="middle">0.15</text><text x="60" y="1040" font-size="27" fill="#19343e" text-anchor="start">A 的两套步长比例与 B 不同；调整一个公共学习率，无法同时恢复所有位置。</text></g></svg>

33.3653349888 377.07364926208004,1046.00745190144 416.26851990630405,1045.584611932672 451.4170514954753,1033.4455947675135 479.4090247761818,1011.9759198421197 498.1608982511995,984.2556204250532 506.7214945535955,953.681788907188 505.25388177039235,923.5971616503906 494.9076420884703,896.9612809542338 477.6052621658934,876.0928602322692" fill="none" stroke="#bd633d" stroke-width="3"/><circle cx="615.0" cy="808.0" r="5" fill="#bd633d"/><circle cx="559.0" cy="760.0" r="5" fill="#bd633d"/><circle cx="317.02239999999995" cy="777.9232" r="5" fill="#bd633d"/><circle cx="302.616053632" cy="1007.611278976" r="5" fill="#bd633d"/><circle cx="477.6052621658934" cy="876.0928602322692" r="5" fill="#bd633d"/><text x="595.0" y="796.0" font-size="24" fill="#bd633d" text-anchor="end">起点</text><text x="790" y="735" font-size="29" fill="#243c46" text-anchor="start">完整状态能量</text><text x="790" y="800" font-size="31" fill="#246880" text-anchor="start">E = θ² + (0.3v)²</text><text x="790" y="875" font-size="31" fill="#bd633d" text-anchor="start">每步 E 乘 0.9</text><text x="790" y="950" font-size="27" fill="#243c46" text-anchor="start">参数损失可以回升，</text><text x="790" y="995" font-size="27" fill="#243c46" text-anchor="start">状态能量仍逐步下降。</text><text x="125" y="1260" font-size="27" fill="#243c46" text-anchor="start">相图只连接真实离散更新；本结论限定这一二次目标和固定超参数</text><text x="1235" y="610" font-size="24" fill="#7b8c92" text-anchor="end">恢复后的更新次数</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300" role="img"><title>动量恢复改变相位：参数曲线不同，完整状态才解释得通</title><rect width="1400" height="1300" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">动量恢复改变相位：参数曲线不同，完整状态才解释得通</text><text x="125" y="125" font-size="28" fill="#243c46" text-anchor="start">L(θ) = θ² 除以二，学习率 0.1，动量 0.9，初始 θ = 1</text><line x1="125" y1="190" x2="125" y2="490" stroke="#7b8c92" stroke-width="2"/><line x1="125" y1="490" x2="1235" y2="490" stroke="#7b8c92" stroke-width="2"/><line x1="125.0" y1="190" x2="125.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="125.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="347.0" y1="190" x2="347.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="347.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">2</text><line x1="569.0" y1="190" x2="569.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="569.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">4</text><line x1="791.0" y1="190" x2="791.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="791.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">6</text><line x1="1013.0" y1="190" x2="1013.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="1013.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">8</text><line x1="1235.0" y1="190" x2="1235.0" y2="490" stroke="#dbe5e9" stroke-width="1"/><text x="1235.0" y="524" font-size="24" fill="#7b8c92" text-anchor="middle">10</text><line x1="125" y1="442.63157894736844" x2="1235" y2="442.63157894736844" stroke="#dbe5e9" stroke-width="1"/><text x="113" y="450.63157894736844" font-size="24" fill="#7b8c92" text-anchor="end">-0.5</text><line x1="125" y1="363.6842105263158" x2="1235" y2="363.6842105263158" stroke="#dbe5e9" stroke-width="1"/><text x="113" y="371.6842105263158" font-size="24" fill="#7b8c92" text-anc
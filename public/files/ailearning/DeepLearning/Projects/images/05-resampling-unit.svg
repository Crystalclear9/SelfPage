085.470016" y2="261" stroke="#257190" stroke-width="3"/><circle cx="778.41326144" cy="245" r="10" fill="#257190"/><text x="463.050752" y="215" font-size="25" fill="#257190" text-anchor="start">-0.0245</text><text x="1085.470016" y="215" font-size="25" fill="#257190" text-anchor="end">0.0404</text><text x="60" y="375" font-size="28" fill="#bf6d42" text-anchor="start">把 72 格展平</text><line x1="702.695168" y1="365" x2="857.92544" y2="365" stroke="#bf6d42" stroke-width="7"/><line x1="702.695168" y1="349" x2="702.695168" y2="381" stroke="#bf6d42" stroke-width="3"/><line x1="857.92544" y1="349" x2="857.92544" y2="381" stroke="#bf6d42" stroke-width="3"/><circle cx="778.41326144" cy="365" r="10" fill="#bf6d42"/><text x="702.695168" y="335" font-size="25" fill="#bf6d42" text-anchor="start">0.0005</text><text x="857.92544" y="420" font-size="25" fill="#bf6d42" text-anchor="end">0.0167</text><text x="410" y="525" font-size="27" fill="#1a2b3d" text-anchor="start">损失差（同一方向与同一尺度）</text><text x="60" y="590" font-size="28" fill="#1a2b3d" text-anchor="start">均值都约 0.00838；展平破坏共享结构，窄区间不等于更强证据。</text></g></svg></svg>

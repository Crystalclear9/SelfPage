<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><ns0:title>重采样单位改变区间；点估计并没有增加信息</ns0:title><ns0:rect width="1280" height="640" fill="white" /><ns0:g font-family="Microsoft YaHei, sans-serif"><ns0:text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">重采样单位改变区间；点估计并没有增加信息</ns0:text><ns0:text x="60" y="115" font-size="26" fill="#19343e" text-anchor="start">本章 4 × 6 × 3 人工表、固定种子与 4000 次重采样的实际输出。</ns0:text><ns0:line x1="506.0" y1="175" x2="506.0" y2="425" stroke="#dbe5e8" stroke-width="2" /><ns0:text x="506.0" y="470" font-size="25" fill="#19343e" text-anchor="middle">-0.02</ns0:text><ns0:line x1="698.0" y1="175" x2="698.0" y2="425" stroke="#74888d" stroke-width="3" /><ns0:text x="698.0" y="470" font-size="25" fill="#19343e" text-anchor="middle">0.00</ns0:text><ns0:line x1="890.0" y1="175" x2="890.0" y2="425" stroke="#dbe5e8" stroke-width="2" /><ns0:text x="890.0" y="470" font-size="25" fill="#19343e" text-anchor="middle">0.02</ns0:text><ns0:line x1="1082.0" y1="175" x2="1082.0" y2="425" stroke="#dbe5e8" stroke-width="2" /><ns0:text x="1082.0" y="470" font-size="25" fill="#19343e" text-anchor="middle">0.04</ns0:text><ns0:text x="60" y="255" font-size="28" fill="#276a80" text-anchor="start">训练 × 完整来源</ns0:text><ns0:line x1="463.050752" y1="245" x2="1085.470016" y2="245" stroke="#276a80" stroke-width="7" /><ns0:line x1="463.050752" y1="229" x2="463.050752" y2="261" stroke="#276a80" stroke-width="3" /><ns0:line x1="1085.470016" y1="229" x2="1085.470016" y2="261" stroke="#276a80" stroke-width="3" /><ns0:circle cx="778.41326144" cy="245" r="10" fill="#276a80" /><ns0:text x="463.050752" y="215" font-size="25" fill="#276a80" text-anchor="start">-0.0245</ns0:text><ns0:text x="1085.470016" y="215" font-size="25" fill="#276a80" text-anchor="end">0.0404</ns0:text><ns0:text x="60" y="375" font-size="28" fill="#c2673f" text-anchor="start">把 72 格展平</ns0:text><ns0:line x1="702.695168" y1="365" x2="857.92544" y2="365" stroke="#c2673f" stroke-width="7" /><ns0:line x1="702.695168" y1="349" x2="702.695168" y2="381" stroke="#c2673f" stroke-width="3" /><ns0:line x1="857.92544" y1="349" x2="857.92544" y2="381" stroke="#c2673f" stroke-width="3" /><ns0:circle cx="778.41326144" cy="365" r="10" fill="#c2673f" /><ns0:text x="702.695168" y="335" font-size="25" fill="#c2673f" text-anchor="start">0.0005</ns0:text><ns0:text x="857.92544" y="420" font-size="25" fill="#c2673f" text-anchor="end">0.0167</ns0:text><ns0:text x="410" y="525" font-size="27" fill="#19343e" text-anchor="start">损失差（同一方向与同一尺度）</ns0:text><ns0:text x="60" y="590" font-size="28" fill="#19343e" text-anchor="start">均值都约 0.00838；展平破坏共享结构，窄区间不等于更强证据。</ns0:text></ns0:g></ns0:svg>
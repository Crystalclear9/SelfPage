<view id="textbook-detail-2-2" viewBox="580.500000 262.730000 769.500000 348.270000"/><title id="title">相同参数位置不保证下一步相同</title><desc id="desc">同一个参数位置，在保留完整状态和仅恢复参数时可以产生不同更新。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="611" fill="white" stroke="none" stroke-width="1.55"/><text x="666" y="68" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">同一权重，后续轨迹可能不同</text><circle cx="245" cy="287" r="34" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="245" y="297.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">w</text><path d="M 288 287 Q 538 179 761 166" stroke="#196f77" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-teal)"/><path d="M 288 296 Q 515 423 757 433" stroke="#a84b3b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-coral)"/><polygon points="844.5,206 1132.5,206 1165.5,126 877.5,126" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="1005" y="176.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">完整训练状态</text><polygon points="845.5,473 1133.5,473 1166.5,393 878.5,393" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="1006" y="443.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">仅保留权重</text><text x="515" y="123" fill="#196f77" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">恢复动量、随机状态、下一批位置</text><text x="681" y="553" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">图上只对照更新方向，距离不编码训练损失</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>配对比较要看两模型错在同一批样本上</title><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="38" y="53" font-size="32" fill="#17374e">配对比较要看两模型错在同一批样本上</text><rect x="310" y="185" width="210" height="190" fill="rgb(63,177,148)" stroke="white" stroke-width="5"/><text x="385" y="297" font-size="46" fill="#17374e">70</text><rect x="530" y="185" width="210" height="190" fill="rgb(196,232,226)" stroke="white" stroke-width="5"/><text x="605" y="297" font-size="46" fill="#17374e">15</text><rect x="310" y="385" width="210" height="190" fill="rgb(220,242,240)" stroke="white" stroke-width="5"/><text x="385" y="497" font-size="46" fill="#17374e">5</text><rect x="530" y="385" width="210" height="190" fill="rgb(208,237,233)" stroke="white" stroke-width="5"/><text x="605" y="497" font-size="46" fill="#17374e">10</text><text x="330" y="145" font-size="28" fill="#17374e">B 正确</text><text x="550" y="145" font-size="28" fill="#17374e">B 错误</text><text x="90" y="295" font-size="28" fill="#17374e">A 正确</text><text x="90" y="495" font-size="28" fill="#17374e">A 错误</text><text x="810" y="250" font-size="28" fill="#17374e">仅 A 对：15</text><text x="810" y="315" font-size="28" fill="#17374e">仅 B 对：5</text><text x="810" y="430" font-size="25" fill="#17374e">差异由不一致样本提供</text><text x="810" y="490" font-size="26" fill="#17374e">A：85%；B：75%</text><text x="140" y="660" font-size="24" fill="#17374e">相同颜色尺度：颜色越深，样本计数越多；数字给出完整可复算值。</text></g></svg>

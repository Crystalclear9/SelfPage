<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="859" viewBox="42 83 1196 859" role="img"><rect x="42" y="83" width="1196" height="859" fill="#ffffff"/><title>生命周期成本：先付训练成本，再累加服务成本</title><rect width="1280" height="940" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="125" font-size="28" fill="#19343e" text-anchor="start">教学账本：质量假定相同；成本统一为秒，不是硬件实测</text><text x="60" y="185" font-size="27" fill="#19343e" text-anchor="start">蓝：训练          橙：服务；同一横向比例，长度可以相加</text><text x="60" y="230" font-size="29" fill="#19343e" text-anchor="start">1000 次请求</text><text x="70" y="285" font-size="28" fill="#19343e" text-anchor="start">A</text><rect x="160" y="250" width="180.0" height="42" fill="#276a80"/><rect x="340.0" y="250" width="7.2" height="42" fill="#c2673f"/><text x="362.20000000000005" y="282" font-size="27" fill="#19343e" text-anchor="start">104 秒</text><text x="70" y="350" font-size="28" fill="#19343e" text-anchor="start">B</text><rect x="160" y="315" width="288.0" height="42" fill="#276a80"/><rect x="448.0" y="315" width="1.8" height="42" fill="#c2673f"/><text x="464.8" y="347" font-size="27" fill="#19343e" text-anchor="start">161 秒</text><text x="60" y="420" font-size="29" fill="#19343e" text-anchor="start">20000 次请求</text><text x="70" y="475" font-size="28" fill="#19343e" text-anchor="start">A</text><rect x="160" y="440" width="180.0" height="42" fill="#276a80"/><rect x="340.0" y="440" width="144.0" height="42" fill="#c2673f"/><text x="499.0" y="472" font-size="27" fill="#19343e" text-anchor="start">180 秒</text><text x="70" y="540" font-size="28" fill="#19343e" text-anchor="start">B</text><rect x="160" y="505" width="288.0" height="42" fill="#276a80"/><rect x="448.0" y="505" width="36.0" height="42" fill="#c2673f"/><text x="499.0" y="537" font-size="27" fill="#19343e" text-anchor="start">180 秒</text><text x="60" y="610" font-size="29" fill="#19343e" text-anchor="start">100000 次请求</text><text x="70" y="665" font-size="28" fill="#19343e" text-anchor="start">A</text><rect x="160" y="630" width="180.0" height="42" fill="#276a80"/><rect x="340.0" y="630" width="720.0" height="42" fill="#c2673f"/><text x="1075.0" y="662" font-size="27" fill="#19343e" text-anchor="start">500 秒</text><text x="70" y="730" font-size="28" fill="#19343e" text-anchor="start">B</text><rect x="160" y="695" width="288.0" height="42" fill="#276a80"/><rect x="448.0" y="695" width="180.0" height="42" fill="#c2673f"/><text x="643.0" y="727" font-size="27" fill="#19343e" text-anchor="start">260 秒</text><line x1="60" y1="815" x2="1220" y2="815" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="865" font-size="28" fill="#19343e" text-anchor="start">20 000 次时：A = 100 + 80；B = 160 + 20；两者都是 180 秒</text><text x="60" y="920" font-size="27" fill="#c2673f" text-anchor="start">内存若限 1.5 GiB，A 占 1 GiB、B 占 2 GiB，则 B 仍不可行。</text></g></svg>

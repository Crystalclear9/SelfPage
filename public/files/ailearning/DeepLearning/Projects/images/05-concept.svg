<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>消融比较怎样对齐预算</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">消融比较怎样对齐预算</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">把质量与资源分开编码，才看得清取舍</text><text x="60" y="270" font-size="25" fill="#19344d" text-anchor="start">方案 A</text><rect x="190" y="230" width="130" height="65" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="330" y="270" font-size="24" fill="#19344d" text-anchor="start">1 小时</text><text x="920" y="270" font-size="32" fill="#d66b28" text-anchor="start">90%</text><text x="60" y="490" font-size="25" fill="#19344d" text-anchor="start">方案 B</text><rect x="190" y="450" width="520" height="65" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="720" y="490" font-size="24" fill="#19344d" text-anchor="start">4 小时</text><text x="920" y="490" font-size="32" fill="#d66b28" text-anchor="start">91%</text></g></svg>

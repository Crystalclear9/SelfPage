<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" role="img"><title>训练截距与服务斜率：配置搜索会把回本点推后</title><rect width="1400" height="1110" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">训练截距与服务斜率：配置搜索会把回本点推后</text><text x="55" y="112" font-size="27" fill="#7b8c92" text-anchor="start">人工成本算例，质量假定相同；A 每请求 0.004 秒，B 每请求 0.001 秒</text><text x="70" y="188" font-size="29" fill="#243c46" text-anchor="start">已知配置，各训练一次</text><line x1="110" y1="235" x2="110" y2="595" stroke="#7b8c92" stroke-width="2"/><line x1="110" y1="595" x2="565" y2="595" stroke="#7b8c92" stroke-width="2"/><line x1="110.0" y1="235" x2="110.0" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="110.0" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="337.5" y1="235" x2="337.5" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="337.5" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">50000</text><line x1="565.0" y1="235" x2="565.0" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="565.0" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">100000</text><line x1="110" y1="595.0" x2="565" y2="595.0" stroke="#dbe5e9" stroke-width="1"/><text x="98" y="603.0" font-size="24" fill="#7b8c92" text-anchor="end">0</text><line x1="110" y1="415.0" x2="565" y2="415.0" stroke="#dbe5e9" stroke-width="1"/><text x="98" y="423.0" font-size="24" fill="#7b8c92" text-anchor="end">275</text><line x1="110" y1="235.0" x2="565" y2="235.0" stroke="#dbe5e9" stroke-width="1"/><text x="98" y="243.0" font-size="24" fill="#7b8c92" text-anchor="end">550</text><polyline points="110.0,529.5454545454545 565.0,267.72727272727275" fill="none" stroke="#246880" stroke-width="4"/><text x="575.0" y="275.72727272727275" font-size="28" fill="#246880" text-anchor="start">A</text><polyline points="110.0,490.27272727272725 565.0,424.8181818181818" fill="none" stroke="#bd633d" stroke-width="4"/><text x="575.0" y="432.8181818181818" font-size="28" fill="#bd633d" text-anchor="start">B</text><circle cx="201.0" cy="477.1818181818182" r="9" fill="#4d8776"/><text x="140" y="665" font-size="29" fill="#4d8776" text-anchor="start">交点 20000 次请求</text><text x="150" y="714" font-size="26" fill="#243c46" text-anchor="start">训练成本 100 对 160 秒</text><text x="785" y="188" font-size="29" fill="#243c46" text-anchor="start">计入搜索：A 四次，B 十次</text><line x1="825" y1="235" x2="825" y2="595" stroke="#7b8c92" stroke-width="2"/><line x1="825" y1="595" x2="1280" y2="595" stroke="#7b8c92" stroke-width="2"/><line x1="825.0" y1="235" x2="825.0" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="825.0" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="1052.5" y1="235" x2="1052.5" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="1052.5" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">300000</text><line x1="1280.0" y1="235" x2="1280.0" y2="595" stroke="#dbe5e9" stroke-width="1"/><text x="1280.0" y="629" font-size="24" fill="#7b8c92" text-anchor="middle">600000</text><line x1="825" y1="595.0" x2="1280" y2="595.0" stroke="#dbe5e9" stroke-width="1"/><text x="813" y="603.0" font-size="24" fill="#7b8c92" text-anchor="end">0</text><line x1="825" y1="415.0" x2="1280" y2="415.0" stroke="#dbe5e9" stroke-width="1"/><text x="813" y="423.0" font-size="24" fill="#7b8c92" text-anchor="end">1550</text><line x1="825" y1="235.0" x2="1280" y2="235.0" stroke="#dbe5e9" stroke-width="1"/><text x="813" y="243.0" font-size="24" fill="#7b8c92" text-anchor="end">3100</text><polyline points="825.0,548.5483870967741 1280.0,269.8387096774194" fill="none" stroke="#246880" stroke-width="4"/><text x="1290.0" y="277.8387096774194" font-size="28" fill="#246880" text-anchor="start">A</text><polyline points="825.0,409.19354838709677 1280.0,339.51612903225805" fill="none" stroke="#bd633d" stroke-width="4"/><text x="1290.0" y="347.51612903225805" font-size="28" fill="#bd633d" text-anchor="start">B</text><circle cx="1128.3333333333333" cy="362.741935483871" r="9" fill="#4d8776"/><text x="855" y="665" font-size="29" fill="#4d8776" text-anchor="start">交点 400000 次请求</text><text x="865" y="714" font-size="26" fill="#243c46" text-anchor="start">训练成本 400 对 1600 秒</text><text x="55" y="786" font-size="27" fill="#243c46" text-anchor="start">用同一请求轴比较 B−A：向下斜率相同，只有前期额外成本不同</text><line x1="145" y1="825" x2="145" y2="990" stroke="#7b8c92" stroke-width="2"/><line x1="145" y1="990" x2="1205" y2="990" stroke="#7b8c92" stroke-width="2"/><line x1="145.0" y1="825" x2="145.0" y2="990" stroke="#dbe5e9" stroke-width="1"/><text x="145.0" y="1024" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="498.3333333333333" y1="825" x2="498.3333333333333" y2="990" stroke="#dbe5e9" stroke-width="1"/><text x="498.3333333333333" y="1024" font-size="24" fill="#7b8c92" text-anchor="middle">200000</text><line x1="851.6666666666666" y1="825" x2="851.6666666666666" y2="990" stroke="#dbe5e9" stroke-width="1"/><text x="851.6666666666666" y="1024" font-size="24" fill="#7b8c92" text-anchor="middle">400000</text><line x1="1205.0" y1="825" x2="1205.0" y2="990" stroke="#dbe5e9" stroke-width="1"/><text x="1205.0" y="1024" font-size="24" fill="#7b8c92" text-anchor="middle">600000</text><line x1="145" y1="959.0625" x2="1205" y2="959.0625" stroke="#dbe5e9" stroke-width="1"/><text x="133" y="967.0625" font-size="24" fill="#7b8c92" text-anchor="end">-1200</text><line x1="145" y1="897.1875" x2="1205" y2="897.1875" stroke="#dbe5e9" stroke-width="1"/><text x="133" y="905.1875" font-size="24" fill="#7b8c92" text-anchor="end">0</text><line x1="145" y1="835.3125" x2="1205" y2="835.3125" stroke="#dbe5e9" stroke-width="1"/><text x="133" y="843.3125" font-size="24" fill="#7b8c92" text-anchor="end">1200</text><polyline points="145.0,894.09375 1205.0,986.90625" fill="none" stroke="#246880" stroke-width="3"/><circle cx="180.33333333333334" cy="897.1875" r="7" fill="#246880"/><polyline points="145.0,835.3125 1205.0,928.125" fill="none" stroke="#bd633d" stroke-width="3"/><circle cx="851.6666666666666" cy="897.1875" r="7" fill="#bd633d"/><text x="940" y="860" font-size="25" fill="#bd633d" text-anchor="start">完整搜索</text><text x="940" y="960" font-size="25" fill="#246880" text-anchor="start">单次拟合</text><text x="65" y="1080" font-size="27" fill="#7b8c92" text-anchor="start">横轴均为请求数 N；纵轴为秒。显存与质量硬约束仍需分别满足。</text></g></svg>

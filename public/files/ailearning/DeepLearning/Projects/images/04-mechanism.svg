<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" role="img"><title>相同参数仍可能因动量不同走向不同下一步</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="586" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">相同参数仍可能因动量不同走向不同下一步</text><text x="65" y="140" font-size="26" fill="#213447">同一参数 w=1、同一梯度 g=0.2，旧动量不同</text><rect x="60" y="230" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="75" y="265" font-size="24" fill="#213447">旧动量 0</text><rect x="430" y="230" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="445" y="265" font-size="24" fill="#213447">新动量 0.2</text><rect x="810" y="230" width="270" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="825" y="265" font-size="24" fill="#213447">下一参数 0.98</text><line x1="290" y1="278" x2="420" y2="278" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="660" y1="278" x2="800" y2="278" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="60" y="460" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="75" y="495" font-size="24" fill="#213447">旧动量 1</text><rect x="430" y="460" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="445" y="495" font-size="24" fill="#213447">新动量 1.1</text><rect x="810" y="460" width="270" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="825" y="495" font-size="24" fill="#213447">下一参数 0.89</text><line x1="290" y1="508" x2="420" y2="508" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="660" y1="508" x2="800" y2="508" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /></g><desc> 动量系数 0.9，学习率 0.1；历史状态改变下一次更新。</desc></svg>

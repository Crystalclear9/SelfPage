<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="676" viewBox="42 76 1190 676" role="img"><rect x="42" y="76" width="1190" height="676" fill="#ffffff"/><title>丢失动量的影响会延续：相同权重并不确定下一条轨迹</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="25" fill="#74858a" text-anchor="start">w(0) = 1；每步输入梯度固定 0.2；m(k) = 0.9 m(k−1) + 0.2；学习率 0.1</text><line x1="130" y1="555.0" x2="1060" y2="555.0" stroke="#dce4e5" stroke-width="2"/><text x="115" y="563.0" font-size="24" fill="#74858a" text-anchor="end">0.2</text><line x1="130" y1="467.0" x2="1060" y2="467.0" stroke="#dce4e5" stroke-width="2"/><text x="115" y="475.0" font-size="24" fill="#74858a" text-anchor="end">0.4</text><line x1="130" y1="379.0" x2="1060" y2="379.0" stroke="#dce4e5" stroke-width="2"/><text x="115" y="387.0" font-size="24" fill="#74858a" text-anchor="end">0.6</text><line x1="130" y1="290.99999999999994" x2="1060" y2="290.99999999999994" stroke="#dce4e5" stroke-width="2"/><text x="115" y="298.99999999999994" font-size="24" fill="#74858a" text-anchor="end">0.8</text><line x1="130" y1="203.0" x2="1060" y2="203.0" stroke="#dce4e5" stroke-width="2"/><text x="115" y="211.0" font-size="24" fill="#74858a" text-anchor="end">1</text><path d="M130.000,203.000 L285.000,211.800 L440.000,228.520 L595.000,252.368 L750.000,282.631 L905.000,318.668 L1060.000,359.901" stroke="#256b82" stroke-width="4" fill="none"/><circle cx="130" cy="203.0" r="5" fill="#256b82"/><circle cx="285" cy="211.8" r="5" fill="#256b82"/><circle cx="440" cy="228.51999999999998" r="5" fill="#256b82"/><circle cx="595" cy="252.368" r="5" fill="#256b82"/><circle cx="750" cy="282.63120000000004" r="5" fill="#256b82"/><circle cx="905" cy="318.66808000000015" r="5" fill="#256b82"/><circle cx="1060" cy="359.90127200000006" r="5" fill="#256b82"/><path d="M130.000,203.000 L285.000,251.400 L440.000,303.760 L595.000,359.684 L750.000,418.816 L905.000,480.834 L1060.000,545.451" stroke="#c0643c" stroke-width="4" fill="none"/><circle cx="130" cy="203.0" r="5" fill="#c0643c"/><circle cx="285" cy="251.40000000000003" r="5" fill="#c0643c"/><circle cx="440" cy="303.76" r="5" fill="#c0643c"/><circle cx="595" cy="359.68399999999997" r="5" fill="#c0643c"/><circle cx="750" cy="418.8156" r="5" fill="#c0643c"/><circle cx="905" cy="480.83404" r="5" fill="#c0643c"/><circle cx="1060" cy="545.450636" r="5" fill="#c0643c"/><text x="650" y="165" font-size="27" fill="#256b82" text-anchor="start">蓝：恢复时 m(0) = 0</text><text x="650" y="210" font-size="27" fill="#c0643c" text-anchor="start">橙：恢复时 m(0) = 1</text><text x="130" y="605" font-size="25" fill="#74858a" text-anchor="middle">0</text><text x="285" y="605" font-size="25" fill="#74858a" text-anchor="middle">1</text><text x="440" y="605" font-size="25" fill="#74858a" text-anchor="middle">2</text><text x="595" y="605" font-size="25" fill="#74858a" text-anchor="middle">3</text><text x="750" y="605" font-size="25" fill="#74858a" text-anchor="middle">4</text><text x="905" y="605" font-size="25" fill="#74858a" text-anchor="middle">5</text><text x="1060" y="605" font-size="25" fill="#74858a" text-anchor="middle">6</text><text x="1110" y="605" font-size="26" fill="#19333c" text-anchor="start">更新次数</text><text x="60" y="675" font-size="27" fill="#19333c" text-anchor="start">第一步 w：0.98 对 0.89；第二步 w：0.942 对 0.771。</text><text x="60" y="730" font-size="25" fill="#74858a" text-anchor="start">固定梯度仅隔离状态影响；真实训练梯度会随参数、数据和随机性继续变化。</text></g></svg>

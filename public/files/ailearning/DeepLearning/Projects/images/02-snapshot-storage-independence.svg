<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1226.8" viewBox="0 0 1440 1226.8" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">共享存储不是独立快照</title><rect width="1440" height="1226.8" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">共享存储不是独立快照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1084.8" viewBox="0 0 1400 1130" role="img" x="48" y="106" overflow="hidden"><title>独立复制参数，还要保留参与预测的缓冲</title><rect width="1400" height="1130" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#20354a" text-anchor="start">独立复制参数，还要保留参与预测的缓冲</text><line x1="125" y1="150" x2="125" y2="440" stroke="#7d949d" stroke-width="2"/><line x1="125" y1="440" x2="1235" y2="440" stroke="#7d949d" stroke-width="2"/><line x1="125.0" y1="150" x2="125.0" y2="440" stroke="#dfe4ec" stroke-width="1"/><text x="125.0" y="474" font-size="24" fill="#7d949d" text-anchor="middle">0</text><line x1="283.57142857142856" y1="150" x2="283.57142857142856" y2="440" stroke="#dfe4ec" stroke-width="1"/><text x="283.57142857142856" y="474" font-size="24" fill="#7d949d" text-anchor="middle">1</text><line x1="600.7142857142858" y1="150" x2="600.7142857142858" y2="440" stroke="#dfe4ec" stroke-width="1"/><text x="600.7142857142858" y="474" font-size="24" fill="#7d949d" text-anchor="middle">3</text><line x1="917.8571428571429" y1="150" x2="917.8571428571429" y2="440" stroke="#dfe4ec" stroke-width="1"/><text x="917.8571428571429" y="474" font-size="24" fill="#7d949d" text-anchor="middle">5</text><line x1="1235.0" y1="150" x2="1235.0" y2="440" stroke="#dfe4ec" stroke-width="1"/><text x="1235.0" y="474" font-size="24" fill="#7d949d" text-anchor="middle">7</text><line x1="125" y1="440.0" x2="1235" y2="440.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="448.0" font-size="24" fill="#7d949d" text-anchor="end">0</text><line x1="125" y1="382.0" x2="1235" y2="382.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="390.0" font-size="24" fill="#7d949d" text-anchor="end">0.5</text><line x1="125" y1="324.0" x2="1235" y2="324.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="332.0" font-size="24" fill="#7d949d" text-anchor="end">1</text><line x1="125" y1="266.0" x2="1235" y2="266.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="274.0" font-size="24" fill="#7d949d" text-anchor="end">1.5</text><line x1="125" y1="208.0" x2="1235" y2="208.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="216.0" font-size="24" fill="#7d949d" text-anchor="end">2</text><line x1="125" y1="150.0" x2="1235" y2="150.0" stroke="#dfe4ec" stroke-width="1"/><text x="113" y="158.0" font-size="24" fill="#7d949d" text-anchor="end">2.5</text><polyline points="125.0,324.0 283.57142857142856,300.8 442.14285714285717,277.6 600.7142857142858,254.4 759.2857142857143,231.20000000000002 917.8571428571429,208.0 1076.4285714285716,184.79999999999995 1235.0,161.59999999999997" fill="none" stroke="#ba6940" stroke-width="4"/><polyline points="125.0,324.0 1235.0,324.0" fill="none" stroke="#226f90" stroke-width="4"/><text x="125" y="115" font-size="27" fill="#20354a" text-anchor="start">原存储算例：每次原地加 0.2，七次后当前参数为 2.4</text><text x="125" y="520" font-size="28" fill="#226f90" text-anchor="start">蓝：独立快照保留 1</text><text x="735" y="520" font-size="28" fill="#ba6940" text-anchor="start">橙：共享引用随模型变</text><text x="125" y="615" font-size="28" fill="#20354a" text-anchor="start">补上一个推理必需的缓冲：y = w × (x − μ)，固定输入 x = 4</text><text x="125" y="680" font-size="29" fill="#20354a" text-anchor="start">保存时 w = 1、μ = 0；随后只把 μ 更新成 3</text><text x="125" y="765" font-size="29" fill="#226f90" text-anchor="start">完整恢复</text><circle cx="470" cy="755" r="42" fill="#226f90"/><text x="470" y="765" font-size="28" fill="white" text-anchor="middle">4</text><line x1="520" y1="755" x2="710" y2="755" stroke="#226f90" stroke-width="3"/><polygon points="710,755 699.1946347717678,760.2195864093347 699.1946347717678,749.7804135906653" fill="#226f90"/><text x="615" y="730" font-size="28" fill="#226f90" text-anchor="middle">− 0</text><circle cx="760" cy="755" r="42" fill="#226f90"/><text x="760" y="765" font-size="28" fill="white" text-anchor="middle">4</text><line x1="810" y1="755" x2="1050" y2="755" stroke="#226f90" stroke-width="3"/><polygon points="1050,755 1039.1946347717678,760.2195864093347 1039.1946347717678,749.7804135906653" fill="#226f90"/><text x="930" y="730" font-size="28" fill="#226f90" text-anchor="middle">× 1</text><circle cx="1100" cy="755" r="42" fill="#226f90"/><text x="1100" y="765" font-size="28" fill="white" text-anchor="middle">4</text><text x="125" y="900" font-size="29" fill="#ba6940" text-anchor="start">只恢复参数</text><circle cx="470" cy="890" r="42" fill="#ba6940"/><text x="470" y="900" font-size="28" fill="white" text-anchor="middle">4</text><line x1="520" y1="890" x2="710" y2="890" stroke="#ba6940" stroke-width="3"/><polygon points="710,890 699.1946347717678,895.2195864093347 699.1946347717678,884.7804135906653" fill="#ba6940"/><text x="615" y="865" font-size="28" fill="#ba6940" text-anchor="middle">− 3</text><circle cx="760" cy="890" r="42" fill="#ba6940"/><text x="760" y="900" font-size="28" fill="white" text-anchor="middle">1</text><line x1="810" y1="890" x2="1050" y2="890" stroke="#ba6940" stroke-width="3"/><polygon points="1050,890 1039.1946347717678,895.2195864093347 1039.1946347717678,884.7804135906653" fill="#ba6940"/><text x="930" y="865" font-size="28" fill="#ba6940" text-anchor="middle">× 1</text><circle cx="1100" cy="890" r="42" fill="#ba6940"/><text x="1100" y="900" font-size="28" fill="white" text-anchor="middle">1</text><text x="125" y="1050" font-size="29" fill="#20354a" text-anchor="start">权重相同，输出却为 4 与 1；恢复对象由完整前向函数决定</text><text x="1235" y="570" font-size="24" fill="#7d949d" text-anchor="end">原地更新次数</text></g></svg></svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="981.4381" viewBox="0 0 1440 981.4381" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">检查点与日志应对应同一提交边界</title><rect width="1440" height="981.4381" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">检查点与日志应对应同一提交边界</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="839.4381" viewBox="42 70 1196 747" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="70" width="1196" height="747" fill="#ffffff"/><title>崩溃后恢复的是哪一步：状态与日志对齐</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="110" font-size="26" fill="#769099" text-anchor="start">手算一次动量更新：m新 = 0.9m旧 + g，θ新 = θ旧 − 0.1m新，g = 0.2。</text><text x="80" y="175" font-size="29" fill="#1a2b3d" text-anchor="start">持久状态</text><text x="400" y="175" font-size="29" fill="#257190" text-anchor="start">更新前：id 17</text><text x="850" y="175" font-size="29" fill="#257190" text-anchor="start">更新后：id 18</text><text x="80" y="225" font-size="27" fill="#1a2b3d" text-anchor="start">参数 θ</text><text x="470" y="225" font-size="28" fill="#257190" text-anchor="middle">1.000</text><text x="950" y="225" font-size="28" fill="#257190" text-anchor="middle">0.962</text><text x="80" y="282" font-size="27" fill="#1a2b3d" text-anchor="start">动量 m</text><text x="470" y="282" font-size="28" fill="#257190" text-anchor="middle">0.200</text><text x="950" y="282" font-size="28" fill="#257190" text-anchor="middle">0.380</text><text x="80" y="339" font-size="27" fill="#1a2b3d" text-anchor="start">成功更新数</text><text x="470" y="339" font-size="28" fill="#257190" text-anchor="middle">17</text><text x="950" y="339" font-size="28" fill="#257190" text-anchor="middle">18</text><text x="80" y="396" font-size="27" fill="#1a2b3d" text-anchor="start">采样游标</text><text x="470" y="396" font-size="28" fill="#257190" text-anchor="middle">201</text><text x="950" y="396" font-size="28" fill="#257190" text-anchor="middle">202</text><line x1="570" y1="280" x2="785" y2="280" stroke="#bf6d42" stroke-width="4"/><path d="M774.47,285.75 L785.00,280.00 L774.47,274.25" fill="none" stroke="#bf6d42" stroke-width="4"/><text x="615" y="255" font-size="25" fill="#bf6d42" text-anchor="start">完整更新</text><line x1="60" y1="435" x2="1220" y2="435" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="485" font-size="29" fill="#1a2b3d" text-anchor="start">一次允许的故障：新检查点已替换，日志尚未来得及追加。</text><line x1="240" y1="600" x2="1140" y2="600" stroke="#769099" stroke-width="3"/><circle cx="350" cy="600" r="11" fill="#257190"/><text x="350" y="560" font-size="27" fill="#257190" text-anchor="middle">保存 id 18</text><circle cx="640" cy="600" r="11" fill="#bf6d42"/><text x="640" y="560" font-size="27" fill="#bf6d42" text-anchor="middle">进程崩溃</text><circle cx="1000" cy="600" r="9" fill="#769099"/><text x="1000" y="560" font-size="27" fill="#769099" text-anchor="middle">日志仍到 id 17</text><text x="85" y="655" font-size="27" fill="#257190" text-anchor="start">检查点：id 18 / θ 0.962 / m 0.380 / 游标 202</text><line x1="420" y1="675" x2="420" y2="735" stroke="#257190" stroke-width="4"/><path d="M414.25,724.47 L420.00,735.00 L425.75,724.47" fill="none" stroke="#257190" stroke-width="4"/><text x="465" y="725" font-size="27" fill="#257190" text-anchor="start">按检查点恢复，再核对或补齐相同 id 的日志。</text><text x="60" y="795" font-size="27" fill="#bf6d42" text-anchor="start">单文件原子替换不能自动使检查点与外部日志成为同一个事务。</text></g></svg></svg>

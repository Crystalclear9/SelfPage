<text x="386" y="197.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1.000</text>
<rect x="489" y="163" width="198" height="53" fill="#ecf6f6" opacity="1"/>
<text x="588" y="197.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.962</text>
<text x="271" y="197.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">参数 θ</text>
<rect x="287" y="220" width="198" height="53" fill="#f1f5f6" opacity="1"/>
<text x="386" y="254.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.200</text>
<rect x="489" y="220" width="198" height="53" fill="#ecf6f6" opacity="1"/>
<text x="588" y="254.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.380</text>
<text x="271" y="254.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">动量 m</text>
<rect x="287" y="277" width="198" height="53" fill="#f1f5f6" opacity="1"/>
<text x="386" y="311.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">17</text>
<rect x="489" y="277" width="198" height="53" fill="#ecf6f6" opacity="1"/>
<text x="588" y="311.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">18</text>
<text x="271" y="311.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">成功更新数</text>
<rect x="287" y="334" width="198" height="53" fill="#f1f5f6" opacity="1"/>
<text x="386" y="368.5" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">201</text>
<rect x="489" y="334" width="198" height="53" fill="#ecf6f6" opacity="1"/>
<text x="588" y="368.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">202</text>
<text x="271" y="368.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">采样游标</text>
<text x="386" y="149" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">更新前 id 17</text>
<text x="588" y="149" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">更新后 id 18</text>
<text x="779" y="184" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">m 新 = 0.9 × 0.2 + 0.2</text>
<text x="779" y="237" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">θ 新 = 1 − 0.1 × 0.38</text>
<path d="M75 429 L1125 429" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="482" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">检查点替换已经完成，日志追加尚未执行</text>
<path d="M74 565 L89 522 L404 522 L389 565 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="239" y="551.2" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">持久化 id 18</text>

<path d="M428 543 L417 548 L417 538 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M434 565 L449 522 L764 522 L749 565 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="599" y="551.2" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">进程崩溃</text>
<path d="M766 543 L788 543" fill="none" stroke="#a74d3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M788 543 L777 548 L777 538 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M794 565 L809 522 L1124 522 L1109 565 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="959" y="551.2" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">日志仍在 id 17</text>
<text x="74" y="646" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">恢复检查点 id 18：θ 0.962，m 0.380，游标 202。</text>
<text x="74" y="710" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">按同一个更新标识核对或补齐日志。</text>
<text x="74" y="772" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">单文件原子替换不会自动把日志也纳入同一事务。</text>
</svg>

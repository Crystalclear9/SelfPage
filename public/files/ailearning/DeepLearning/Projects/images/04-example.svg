<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="747" viewBox="42 70 1196 747" role="img"><rect x="42" y="70" width="1196" height="747" fill="#ffffff"/><title>崩溃后恢复的是哪一步：状态与日志对齐</title><rect width="1280" height="830" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="110" font-size="26" fill="#74888d" text-anchor="start">手算一次动量更新：m新 = 0.9m旧 + g，θ新 = θ旧 − 0.1m新，g = 0.2。</text><text x="80" y="175" font-size="29" fill="#19343e" text-anchor="start">持久状态</text><text x="400" y="175" font-size="29" fill="#276a80" text-anchor="start">更新前：id 17</text><text x="850" y="175" font-size="29" fill="#276a80" text-anchor="start">更新后：id 18</text><text x="80" y="225" font-size="27" fill="#19343e" text-anchor="start">参数 θ</text><text x="470" y="225" font-size="28" fill="#276a80" text-anchor="middle">1.000</text><text x="950" y="225" font-size="28" fill="#276a80" text-anchor="middle">0.962</text><text x="80" y="282" font-size="27" fill="#19343e" text-anchor="start">动量 m</text><text x="470" y="282" font-size="28" fill="#276a80" text-anchor="middle">0.200</text><text x="950" y="282" font-size="28" fill="#276a80" text-anchor="middle">0.380</text><text x="80" y="339" font-size="27" fill="#19343e" text-anchor="start">成功更新数</text><text x="470" y="339" font-size="28" fill="#276a80" text-anchor="middle">17</text><text x="950" y="339" font-size="28" fill="#276a80" text-anchor="middle">18</text><text x="80" y="396" font-size="27" fill="#19343e" text-anchor="start">采样游标</text><text x="470" y="396" font-size="28" fill="#276a80" text-anchor="middle">201</text><text x="950" y="396" font-size="28" fill="#276a80" text-anchor="middle">202</text><line x1="570" y1="280" x2="785" y2="280" stroke="#c2673f" stroke-width="4"/><path d="M774.47,285.75 L785.00,280.00 L774.47,274.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="615" y="255" font-size="25" fill="#c2673f" text-anchor="start">完整更新</text><line x1="60" y1="435" x2="1220" y2="435" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="485" font-size="29" fill="#19343e" text-anchor="start">一次允许的故障：新检查点已替换，日志尚未来得及追加。</text><line x1="240" y1="600" x2="1140" y2="600" stroke="#74888d" stroke-width="3"/><circle cx="350" cy="600" r="11" fill="#276a80"/><text x="350" y="560" font-size="27" fill="#276a80" text-anchor="middle">保存 id 18</text><circle cx="640" cy="600" r="11" fill="#c2673f"/><text x="640" y="560" font-size="27" fill="#c2673f" text-anchor="middle">进程崩溃</text><circle cx="1000" cy="600" r="9" fill="#74888d"/><text x="1000" y="560" font-size="27" fill="#74888d" text-anchor="middle">日志仍到 id 17</text><text x="85" y="655" font-size="27" fill="#276a80" text-anchor="start">检查点：id 18 / θ 0.962 / m 0.380 / 游标 202</text><line x1="420" y1="675" x2="420" y2="735" stroke="#276a80" stroke-width="4"/><path d="M414.25,724.47 L420.00,735.00 L425.75,724.47" fill="none" stroke="#276a80" stroke-width="4"/><text x="465" y="725" font-size="27" fill="#276a80" text-anchor="start">按检查点恢复，再核对或补齐相同 id 的日志。</text><text x="60" y="795" font-size="27" fill="#c2673f" text-anchor="start">单文件原子替换不能自动使检查点与外部日志成为同一个事务。</text></g></svg>

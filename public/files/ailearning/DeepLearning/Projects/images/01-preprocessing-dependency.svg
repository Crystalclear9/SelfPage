<svg xmlns="http://www.w3.org/2000/svg" width="1356" height="903" viewBox="22 63 1356 903" role="img"><rect x="22" y="63" width="1356" height="903" fill="#ffffff"/><title>固定缩放与拟合中心化的依赖边界</title><desc>训练值0,0,16保持固定，把唯一测试值从16改成1600。固定除16不变，训练均值16/3不变；全数据均值从8变成404，训练坐标随之改变。</desc><rect width="1400" height="960" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="105" font-size="28" fill="#63788a" text-anchor="start" font-weight="400">与实验二相同：训练 [0, 0, 16]；测试 16 → 1600</text><rect x="40" y="155" width="390" height="98" rx="6" fill="#e8f1f8" stroke="none"/><text x="235" y="213" font-size="29" fill="#2368a2" text-anchor="middle" font-weight="600">预定单位：除以 16</text><rect x="505" y="155" width="390" height="98" rx="6" fill="#e8f1f8" stroke="none"/><text x="700" y="213" font-size="29" fill="#2368a2" text-anchor="middle" font-weight="600">只拟合训练均值</text><rect x="970" y="155" width="390" height="98" rx="6" fill="#fff0e4" stroke="none"/><text x="1165" y="213" font-size="29" fill="#c56728" text-anchor="middle" font-weight="600">混入测试拟合</text><text x="40" y="300" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">测试改动前</text><text x="40" y="525" font-size="28" fill="#23394b" text-anchor="start" font-weight="600">测试改动后</text><text x="235" y="345" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">训练坐标</text><text x="235" y="397" font-size="31" fill="#2368a2" text-anchor="middle" font-weight="400">[0, 0, 1]</text><text x="700" y="345" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">训练均值</text><text x="700" y="385" font-size="26" fill="#2368a2" text-anchor="middle" font-weight="400">16</text><line x1="657" y1="395" x2="743" y2="395" stroke="#2368a2" stroke-width="2"/><text x="700" y="429" font-size="26" fill="#2368a2" text-anchor="middle" font-weight="400">3</text><text x="1165" y="345" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">全数据均值</text><text x="1165" y="403" font-size="31" fill="#c56728" text-anchor="middle" font-weight="400">8</text><text x="235" y="570" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">训练坐标</text><text x="235" y="622" font-size="31" fill="#2368a2" text-anchor="middle" font-weight="400">[0, 0, 1]</text><text x="700" y="570" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">训练均值</text><text x="700" y="610" font-size="26" fill="#2368a2" text-anchor="middle" font-weight="400">16</text><line x1="657" y1="620" x2="743" y2="620" stroke="#2368a2" stroke-width="2"/><text x="700" y="654" font-size="26" fill="#2368a2" text-anchor="middle" font-weight="400">3</text><text x="1165" y="570" font-size="25" fill="#63788a" text-anchor="middle" font-weight="400">全数据均值</text><text x="1165" y="628" font-size="31" fill="#c56728" text-anchor="middle" font-weight="400">404</text><text x="700" y="465" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">训练中心化坐标相同</text><text x="700" y="690" font-size="25" fill="#2368a2" text-anchor="middle" font-weight="400">测试中心化坐标改变</text><text x="1165" y="465" font-size="26" fill="#c56728" text-anchor="middle" font-weight="400">训练 → [−8, −8, 8]</text><text x="1165" y="690" font-size="25" fill="#c56728" text-anchor="middle" font-weight="400">训练 → [−404, −404, −388]</text><line x1="235" y1="487" x2="235" y2="515" stroke="#2368a2" stroke-width="3"/><line x1="235" y1="515" x2="229.345448056554" y2="503.2941876694152" stroke="#2368a2" stroke-width="3"/><line x1="235" y1="515" x2="240.654551943446" y2="503.2941876694152" stroke="#2368a2" stroke-width="3"/><line x1="700" y1="487" x2="700" y2="515" stroke="#2368a2" stroke-width="3"/><line x1="700" y1="515" x2="694.345448056554" y2="503.2941876694152" stroke="#2368a2" stroke-width="3"/><line x1="700" y1="515" x2="705.654551943446" y2="503.2941876694152" stroke="#2368a2" stroke-width="3"/><line x1="1165" y1="487" x2="1165" y2="515" stroke="#c56728" stroke-width="3"/><line x1="1165" y1="515" x2="1159.345448056554" y2="503.2941876694152" stroke="#c56728" stroke-width="3"/><line x1="1165" y1="515" x2="1170.654551943446" y2="503.2941876694152" stroke="#c56728" stroke-width="3"/><rect x="40" y="754" width="1320" height="152" rx="6" fill="#e8f1f8" stroke="none"/><text x="65" y="801" font-size="31" fill="#2368a2" text-anchor="start" font-weight="600">没有使用测试标签，也可能改变被训练的对象。</text><text x="65" y="850" font-size="28" fill="#23394b" text-anchor="start" font-weight="400">固定量程可以逐样本变换；经验统计量必须追踪 fit 的数据来源。</text><text x="40" y="944" font-size="25" fill="#63788a" text-anchor="start" font-weight="400">本例代码仅减均值，验证的是中心化；完整标准化还需只用训练数据拟合尺度。</text></g></svg>

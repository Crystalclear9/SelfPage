<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img"><title>帕累托比较同时保留质量与资源维度</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="674" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">帕累托比较同时保留质量与资源维度</text><line x1="130" y1="590" x2="1070" y2="590" stroke="#2865a0" stroke-width="3" /><line x1="130" y1="590" x2="130" y2="160" stroke="#2865a0" stroke-width="3" /><text x="145" y="135" font-size="24" fill="#213447">质量（越高越好）</text><text x="120.0" y="620" font-size="24" fill="#213447">0</text><text x="570.0" y="620" font-size="24" fill="#213447">5</text><text x="1020.0" y="620" font-size="24" fill="#213447">10</text><text x="63" y="597.0" font-size="24" fill="#213447">0</text><text x="63" y="397.0" font-size="24" fill="#213447">0.5</text><text x="63" y="197.0" font-size="24" fill="#213447">1</text><polyline points="310.0,350.0 490.0,270.0 760.0,230.0" fill="none" stroke="#2865a0" stroke-width="4" /><circle cx="310.0" cy="350.0" r="18" fill="#2865a0" stroke="#2865a0" /><text x="302.0" y="357.0" font-size="24" fill="white">A</text><circle cx="490.0" cy="270.0" r="18" fill="#2865a0" stroke="#2865a0" /><text x="482.0" y="277.0" font-size="24" fill="white">B</text><circle cx="760.0" cy="230.0" r="18" fill="#2865a0" stroke="#2865a0" /><text x="752.0" y="237.0" font-size="24" fill="white">C</text><circle cx="760.0" cy="330.0" r="18" fill="#cf7432" stroke="#2865a0" /><text x="752.0" y="337.0" font-size="24" fill="white">D</text><text x="460" y="220" font-size="24" fill="#213447">D 被 B 支配：更贵且质量更低</text><text x="930" y="640" font-size="24" fill="#143651">相对成本（越小越好）</text></g><desc> 相对成本（越小越好）</desc></svg>

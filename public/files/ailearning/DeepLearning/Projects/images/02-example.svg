<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="687" viewBox="42 75 1146 687" role="img"><rect x="42" y="75" width="1146" height="687" fill="#ffffff"/><title>保存最佳状态：两个名字是否仍指向同一份张量？</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">手算线性层 y = w·x；x = (1, 2)，初始权重 w = (1, 2)，偏置为 0</text><text x="100" y="195" font-size="30" fill="#19333c" text-anchor="start">第二轮：记录最佳状态</text><text x="100" y="260" font-size="27" fill="#19333c" text-anchor="start">当前模型</text><rect x="100" y="285" width="240" height="75" fill="#dbecef"/><text x="220" y="335" font-size="30" fill="#19333c" text-anchor="middle">[1, 2]</text><text x="510" y="260" font-size="27" fill="#19333c" text-anchor="start">共享 state_dict</text><rect x="510" y="285" width="240" height="75" fill="#dbecef"/><text x="630" y="335" font-size="30" fill="#19333c" text-anchor="middle">[1, 2]</text><text x="930" y="260" font-size="27" fill="#19333c" text-anchor="start">独立快照</text><rect x="930" y="285" width="240" height="75" fill="#dbecef"/><text x="1050" y="335" font-size="30" fill="#19333c" text-anchor="middle">[1, 2]</text><text x="100" y="430" font-size="30" fill="#19333c" text-anchor="start">第三轮：当前权重每项加 5</text><rect x="100" y="465" width="240" height="75" fill="#f3ddd0"/><text x="220" y="515" font-size="30" fill="#c0643c" text-anchor="middle">[6, 7]</text><rect x="510" y="465" width="240" height="75" fill="#f3ddd0"/><text x="630" y="515" font-size="30" fill="#c0643c" text-anchor="middle">[6, 7]</text><rect x="930" y="465" width="240" height="75" fill="#dbecef"/><text x="1050" y="515" font-size="30" fill="#256b82" text-anchor="middle">[1, 2]</text><line x1="340" y1="500" x2="510" y2="500" stroke="#c0643c" stroke-width="4"/><text x="60" y="630" font-size="27" fill="#19333c" text-anchor="start">当前预测 = 20；共享引用也读到新权重；独立快照仍可恢复预测 5。</text><text x="60" y="690" font-size="27" fill="#19333c" text-anchor="start">“最佳轮次 = 2”的元数据不会冻结张量；需要独立复制或立即序列化。</text><text x="60" y="740" font-size="25" fill="#74858a" text-anchor="start">这是数值固定的别名示例；续训检查点还需优化器、调度器及随机状态。</text></g></svg>

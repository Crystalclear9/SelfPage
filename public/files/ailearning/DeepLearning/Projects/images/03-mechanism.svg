<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>两个组件的联合收益可能不是单项收益之和</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">两个组件的联合收益可能不是单项收益之和</text><line x1="130" y1="590" x2="1070" y2="590" stroke="#407e9e" stroke-width="3" /><line x1="130" y1="590" x2="130" y2="160" stroke="#407e9e" stroke-width="3" /><text x="930" y="640" font-size="23" fill="#143651">组件 B：0 关闭，1 开启</text><text x="145" y="135" font-size="23" fill="#143651">示例分数</text><text x="120.0" y="620" font-size="19" fill="#143651">0</text><text x="570.0" y="620" font-size="19" fill="#143651">0.5</text><text x="1020.0" y="620" font-size="19" fill="#143651">1</text><text x="63" y="597.0" font-size="19" fill="#143651">0.65</text><text x="63" y="397.0" font-size="19" fill="#143651">0.775</text><text x="63" y="197.0" font-size="19" fill="#143651">0.9</text><polyline points="130.0,510.0000000000001 1030.0,446.00000000000006" fill="none" stroke="#15988d" stroke-width="4" /><polyline points="130.0,430.0 1030.0,286.0000000000001" fill="none" stroke="#ed9a46" stroke-width="4" /><circle cx="130.0" cy="510.0000000000001" r="8" fill="#15988d" stroke="#12536a" /><circle cx="1030.0" cy="446.00000000000006" r="8" fill="#15988d" stroke="#12536a" /><circle cx="130.0" cy="430.0" r="8" fill="#15988d" stroke="#12536a" /><circle cx="1030.0" cy="286.0000000000001" r="8" fill="#15988d" stroke="#12536a" /><text x="300" y="170" font-size="24" fill="#143651">青绿：A 关闭</text><text x="300" y="210" font-size="24" fill="#143651">橙色：A 开启</text><text x="500" y="500" font-size="25" fill="#143651">不平行的收益变化＝交互</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>组件增益依赖背景：沿用代码的 70、71、72、75</title><rect width="1280" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">组件增益依赖背景：沿用代码的 70、71、72、75</text><text x="60" y="115" font-size="26" fill="#19343e" text-anchor="start">五次重复只加入共同偏移；图画其均值，单位为教学分数。</text><line x1="220" y1="550.0" x2="1050" y2="550.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="558.0" font-size="24" fill="#74888d" text-anchor="end">69</text><line x1="220" y1="500.0" x2="1050" y2="500.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="508.0" font-size="24" fill="#74888d" text-anchor="end">70</text><line x1="220" y1="450.0" x2="1050" y2="450.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="458.0" font-size="24" fill="#74888d" text-anchor="end">71</text><line x1="220" y1="400.0" x2="1050" y2="400.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="408.0" font-size="24" fill="#74888d" text-anchor="end">72</text><line x1="220" y1="350.0" x2="1050" y2="350.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="358.0" font-size="24" fill="#74888d" text-anchor="end">73</text><line x1="220" y1="300.0" x2="1050" y2="300.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="308.0" font-size="24" fill="#74888d" text-anchor="end">74</text><line x1="220" y1="250.0" x2="1050" y2="250.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="258.0" font-size="24" fill="#74888d" text-anchor="end">75</text><line x1="220" y1="200.0" x2="1050" y2="200.0" stroke="#dbe5e8" stroke-width="2"/><text x="185" y="208.0" font-size="24" fill="#74888d" text-anchor="end">76</text><path d="M220.00,500.00 L940.00,400.00" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="220" cy="500.0" r="9" fill="#276a80"/><text x="195" y="480.0" font-size="28" fill="#276a80" text-anchor="start">70</text><circle cx="940" cy="400.0" r="9" fill="#276a80"/><text x="915" y="380.0" font-size="28" fill="#276a80" text-anchor="start">72</text><text x="1035" y="390.0" font-size="26" fill="#276a80" text-anchor="start">A 关闭</text><path d="M220.00,450.00 L940.00,250.00" fill="none" stroke="#c2673f" stroke-width="4"/><circle cx="220" cy="450.0" r="9" fill="#c2673f"/><text x="195" y="430.0" font-size="28" fill="#c2673f" text-anchor="start">71</text><circle cx="940" cy="250.0" r="9" fill="#c2673f"/><text x="915" y="230.0" font-size="28" fill="#c2673f" text-anchor="start">75</text><text x="1035" y="240.0" font-size="26" fill="#c2673f" text-anchor="start">A 开启</text><text x="220" y="600" font-size="28" fill="#19343e" text-anchor="middle">B 关闭</text><text x="940" y="600" font-size="28" fill="#19343e" text-anchor="middle">B 开启</text><text x="100" y="660" font-size="29" fill="#19343e" text-anchor="start">A 的条件增益：无 B 时 +1；有 B 时 +3；差中差 = 2。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img"><title>两个组件的联合收益可能不是单项收益之和</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="651" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">两个组件的联合收益可能不是单项收益之和</text><line x1="130" y1="590" x2="1070" y2="590" stroke="#2865a0" stroke-width="3" /><line x1="130" y1="590" x2="130" y2="160" stroke="#2865a0" stroke-width="3" /><text x="145" y="135" font-size="24" fill="#213447">示例分数</text><text x="120.0" y="620" font-size="24" fill="#213447">0</text><text x="570.0" y="620" font-size="24" fill="#213447">0.5</text><text x="1020.0" y="620" font-size="24" fill="#213447">1</text><text x="63" y="597.0" font-size="24" fill="#213447">0.65</text><text x="63" y="397.0" font-size="24" fill="#213447">0.775</text><text x="63" y="197.0" font-size="24" fill="#213447">0.9</text><polyline points="130.0,510.0000000000001 1030.0,446.00000000000006" fill="none" stroke="#2865a0" stroke-width="4" /><polyline points="130.0,430.0 1030.0,286.0000000000001" fill="none" stroke="#cf7432" stroke-width="4" /><circle cx="130.0" cy="510.0000000000001" r="8" fill="#2865a0" stroke="#2865a0" /><circle cx="1030.0" cy="446.00000000000006" r="8" fill="#2865a0" stroke="#2865a0" /><circle cx="130.0" cy="430.0" r="8" fill="#2865a0" stroke="#2865a0" /><circle cx="1030.0" cy="286.0000000000001" r="8" fill="#2865a0" stroke="#2865a0" /><text x="300" y="170" font-size="24" fill="#213447">蓝色：A 关闭</text><text x="300" y="210" font-size="24" fill="#213447">橙色：A 开启</text><text x="500" y="500" font-size="25" fill="#213447">不平行的收益变化＝交互</text></g><desc> 组件 B：0 关闭，1 开启</desc></svg>

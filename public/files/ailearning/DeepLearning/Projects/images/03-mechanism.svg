<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="891.8235" viewBox="0 0 1440 891.8235" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两个组件的联合收益可能不是单项收益之和</title><rect width="1440" height="891.8235" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两个组件的联合收益可能不是单项收益之和</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="749.8235" viewBox="42 75 1088 607" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="75" width="1088" height="607" fill="#ffffff"/><title>组件增益依赖背景：沿用代码的 70、71、72、75</title><rect width="1280" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#1a2b3d" text-anchor="start">五次重复只加入共同偏移；图画其均值，单位为教学分数。</text><line x1="220" y1="550.0" x2="1050" y2="550.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="558.0" font-size="24" fill="#769099" text-anchor="end">69</text><line x1="220" y1="500.0" x2="1050" y2="500.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="508.0" font-size="24" fill="#769099" text-anchor="end">70</text><line x1="220" y1="450.0" x2="1050" y2="450.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="458.0" font-size="24" fill="#769099" text-anchor="end">71</text><line x1="220" y1="400.0" x2="1050" y2="400.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="408.0" font-size="24" fill="#769099" text-anchor="end">72</text><line x1="220" y1="350.0" x2="1050" y2="350.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="358.0" font-size="24" fill="#769099" text-anchor="end">73</text><line x1="220" y1="300.0" x2="1050" y2="300.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="308.0" font-size="24" fill="#769099" text-anchor="end">74</text><line x1="220" y1="250.0" x2="1050" y2="250.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="258.0" font-size="24" fill="#769099" text-anchor="end">75</text><line x1="220" y1="200.0" x2="1050" y2="200.0" stroke="#dfe4eb" stroke-width="2"/><text x="185" y="208.0" font-size="24" fill="#769099" text-anchor="end">76</text><path d="M220.00,500.00 L940.00,400.00" fill="none" stroke="#257190" stroke-width="4"/><circle cx="220" cy="500.0" r="9" fill="#257190"/><text x="195" y="480.0" font-size="28" fill="#257190" text-anchor="start">70</text><circle cx="940" cy="400.0" r="9" fill="#257190"/><text x="915" y="380.0" font-size="28" fill="#257190" text-anchor="start">72</text><text x="1035" y="390.0" font-size="26" fill="#257190" text-anchor="start">A 关闭</text><path d="M220.00,450.00 L940.00,250.00" fill="none" stroke="#bf6d42" stroke-width="4"/><circle cx="220" cy="450.0" r="9" fill="#bf6d42"/><text x="195" y="430.0" font-size="28" fill="#bf6d42" text-anchor="start">71</text><circle cx="940" cy="250.0" r="9" fill="#bf6d42"/><text x="915" y="230.0" font-size="28" fill="#bf6d42" text-anchor="start">75</text><text x="1035" y="240.0" font-size="26" fill="#bf6d42" text-anchor="start">A 开启</text><text x="220" y="600" font-size="28" fill="#1a2b3d" text-anchor="middle">B 关闭</text><text x="940" y="600" font-size="28" fill="#1a2b3d" text-anchor="middle">B 开启</text><text x="100" y="660" font-size="29" fill="#1a2b3d" text-anchor="start">A 的条件增益：无 B 时 +1；有 B 时 +3；差中差 = 2。</text></g></svg></svg>

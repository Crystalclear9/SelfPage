ient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="598" fill="white" stroke="none" stroke-width="1.55"/><polygon points="58,165 265,165 298,97 91,97" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="178" y="141.54" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">训练数据</text><polygon points="470,165 677,165 710,97 503,97" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="590" y="141.54" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">验证数据</text><polygon points="913,165 1120,165 1153,97 946,97" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="1033" y="141.54" fill="#a84b3b" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">测试数据</text><line x1="179" y1="179" x2="351" y2="324" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="590" y1="178" x2="590" y2="323" stroke="#655184" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="1033" y1="176" x2="1041" y2="323" stroke="#a84b3b" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-coral)"/><polygon points="262,408 443,408 476,332 295,332" fill="url(#
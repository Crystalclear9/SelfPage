<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img"><title>验证选择可以找到更好模型，也可以同时低估它的风险</title><rect width="1400" height="1160" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">验证选择可以找到更好模型，也可以同时低估它的风险</text><line x1="125" y1="155" x2="125" y2="445" stroke="#7b8c92" stroke-width="2"/><line x1="125" y1="445" x2="1235" y2="445" stroke="#7b8c92" stroke-width="2"/><line x1="125.0" y1="155" x2="125.0" y2="445" stroke="#dbe5e9" stroke-width="1"/><text x="125.0" y="479" font-size="24" fill="#7b8c92" text-anchor="middle">1</text><line x1="358.6842105263158" y1="155" x2="358.6842105263158" y2="445" stroke="#dbe5e9" stroke-width="1"/><text x="358.6842105263158" y="479" font-size="24" fill="#7b8c92" text-anchor="middle">5</text><line x1="650.7894736842105" y1="155" x2="650.7894736842105" y2="445" stroke="#dbe5e9" stroke-width="1"/><text x="650.7894736842105" y="479" font-size="24" fill="#7b8c92" text-anchor="middle">10</text><line x1="942.8947368421053" y1="155" x2="942.8947368421053" y2="445" stroke="#dbe5e9" stroke-width="1"/><text x="942.8947368421053" y="479" font-size="24" fill="#7b8c92" text-anchor="middle">15</text><line x1="1235.0" y1="155" x2="1235.0" y2="445" stroke="#dbe5e9" stroke-width="1"/><text x="1235.0" y="479" font-size="24" fill="#7b8c92" text-anchor="middle">20</text><line x1="125" y1="420.8333333333333" x2="1235" y2="420.8333333333333" stroke="#dbe5e9" stroke-width="1"/><text x="113" y="428.8333333333333" font-size="24" fill="#7b8c92" text-anchor="end">0.15</text><line x1="125" y1="324.1666666666665" x2="1235" y2="324.1666666666665" stroke="#dbe5e9" stroke-width="1"/><text x="113" y="332.1666666666665" font-size="24" fill="#7b8c92" text-anchor="end">0.17</text><line x1="125" y1="227.49999999999994" x2="1235" y2="227.49999999999994" stroke="#dbe5e9" stroke-width="1"/><text x="113" y="235.49999999999994" font-size="2
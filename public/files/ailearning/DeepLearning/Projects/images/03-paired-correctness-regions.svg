<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="622" viewBox="0 0 1320 622" role="img" aria-labelledby="title desc"><title id="title">每条样本只落入配对结果的一个区域</title><desc id="desc">两个集合分别为方法 A 与 B 判对的对象。每个对象只能属于四个区域之一。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="622" fill="white" stroke="none" stroke-width="1.55"/><text x="658" y="64" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">同一批对象的四种配对结果</text><ellipse cx="524" cy="321" rx="245" ry="186" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.8"/><ellipse cx="794" cy="321" rx="245" ry="186" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.8"/><text x="419" y="139" fill="#196f77" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">A 判对</text><text x="892" y="139" fill="#655184" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">B 判对</text><circle cx="424" cy="288" r="9" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><text x="424" y="342" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">只有 A 对</text><circle cx="666" cy="288" r="9" stroke="#202a37" stroke-width="1.7" fill="#202a37"/><text x="666" y="342" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">都对</text><circle cx="903" cy="288" r="9" stroke="#655184" stroke-width="1.7" fill="#655184"/><text x="903" y="342" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">只有 B 对</text><circle cx="1106" cy="429" r="9" stroke="#657682" stroke-width="1.7" fill="#657682"/><text x="1106" y="483" fill="#657682" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">都错</text><text x="664" y="581" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">比较准确率差时，只有两类不一致贡献净差</text></svg>
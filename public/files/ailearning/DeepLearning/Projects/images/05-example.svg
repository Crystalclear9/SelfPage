<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" viewBox="0 0 1200 638" role="img"><title>多重比较怎样放大至少一次误报概率</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="638" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="32" fill="#213447">多重比较怎样放大至少一次误报概率</text><line x1="90" y1="512.3199999999999" x2="1100" y2="512.3199999999999" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="487.6284140265936" width="125" height="24.691585973406426" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="24" fill="#213447">1 次检验</text><text x="170.0" y="470.8284140265936" font-size="25.0" fill="#213447">0.05</text><rect x="463.3333333333333" y="400.6058513891569" width="125" height="111.71414861084313" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="453.3333333333333" y="604.0" font-size="24" fill="#213447">5 次独立检验</text><text x="463.3333333333333" y="383.8058513891569" font-size="25.0" fill="#213447">0.2262</text><rect x="756.6666666666666" y="195.52000000000004" width="125" height="316.8" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="746.6666666666666" y="604.0" font-size="24" fill="#213447">20 次独立检验</text><text x="756.6666666666666" y="178.72000000000003" font-size="25.0" fill="#213447">0.6415</text><text x="115" y="102" font-size="26" fill="#213447">至少一次误拒绝概率</text></g><desc> 纵轴：至少一次误拒绝真零假设的概率；每项显著性水平为 0.05。 仅在各检验独立且零假设均成立时：1 − 0.95 的 m 次方；一般情形不套此式。</desc></svg>

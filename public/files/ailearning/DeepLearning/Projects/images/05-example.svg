<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150" role="img"><title>从一族误报到 Holm 决策：校正还包含停止规则</title><rect width="1400" height="1150" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">从一族误报到 Holm 决策：校正还包含停止规则</text><text x="125" y="125" font-size="28" fill="#243c46" text-anchor="start">所有零假设为真、各项独立、单项误报概率 0.05</text><line x1="125" y1="170" x2="125" y2="450" stroke="#7b8c92" stroke-width="2"/><line x1="125" y1="450" x2="1235" y2="450" stroke="#7b8c92" stroke-width="2"/><line x1="125.0" y1="170" x2="125.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="125.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">0</text><line x1="347.0" y1="170" x2="347.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="347.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">0.2</text><line x1="569.0" y1="170" x2="569.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="569.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">0.4</text><line x1="791.0" y1="170" x2="791.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="791.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">0.6</text><line x1="1013.0" y1="170" x2="1013.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="1013.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">0.8</text><line x1="1235.0" y1="170" x2="1235.0" y2="450" stroke="#dbe5e9" stroke-width="1"/><text x="1235.0" y="484" font-size="24" fill="#7b8c92" text-anchor="middle">1</text><rect x="125.0" y="196.00000000000003" width="55.50000000000006" height="55" fill="#246880" stroke="none"/><text x="198.50000000000006" y="234.00000000000003" font-size="28" fill="#246880" text-anchor="start">1 次：0.0500</text><rect x="125.0" y="276.0" width="251.10315937500025" height="55" fill="#4d8776" stroke="none"/><text x="394.10315937500025" y="314.0" font-size="28" fill="#4d8776" text-anchor="start">5 次：0.2262</text><rect x="125.0" y="356.0" width="712.0806261265185" height="55" fill="#bd633d" stroke="none"/><text x="855.0806261265185" y="394.0" font-size="28" fill="#bd633d" text-anchor="start">20 次：0.6415</text><text x="1235" y="510" font-size="25" fill="#7b8c92" text-anchor="end">至少一次误报概率</text><text x="125" y="605" font-size="28" fill="#243c46" text-anchor="start">本章三项人工 p 值：0.01、0.04、0.20；家族水平 0.05</text><text x="125" y="715" font-size="28" fill="#246880" text-anchor="start">第一项：拒绝</text><line x1="560" y1="715" x2="1250" y2="715" stroke="#dbe5e9" stroke-width="3"/><circle cx="591.3636363636364" cy="715" r="9" fill="#246880"/><text x="591.3636363636364" y="765" font-size="26" fill="#246880" text-anchor="middle">0.01</text><line x1="612.2727272727273" y1="680" x2="612.2727272727273" y2="735" stroke="#243c46" stroke-width="3"/><text x="632.2727272727273" y="700" font-size="25" fill="#243c46" text-anchor="start">阈值 0.01667</text><text x="125" y="875" font-size="28" fill="#bd633d" text-anchor="start">第二项：失败，停止</text><line x1="560" y1="875" x2="1250" y2="875" stroke="#dbe5e9" stroke-width="3"/><circle cx="685.4545454545455" cy="875" r="9" fill="#bd633d"/><text x="685.4545454545455" y="925" font-size="26" fill="#bd633d" text-anchor="middle">0.04</text><line x1="638.4090909090909" y1="840" x2="638.4090909090909" y2="895" stroke="#243c46" stroke-width="3"/><text x="658.4090909090909" y="860" font-size="25" fill="#243c46" text-anchor="start">阈值 0.02500</text><text x="125" y="1035" font-size="28" fill="#7b8c92" text-anchor="start">第三项：不再拒绝</text><line x1="560" y1="1035" x2="1250" y2="1035" stroke="#dbe5e9" stroke-width="3"/><circle cx="1187.2727272727275" cy="1035" r="9" fill="#7b8c92"/><text x="1187.2727272727275" y="1085" font-size="26" fill="#7b8c92" text-anchor="middle">0.2</text><text x="560" y="665" font-size="24" fill="#7b8c92">0</text><text x="1250" y="665" font-size="24" fill="#7b8c92" text-anchor="end">p = 0.22</text></g></svg>

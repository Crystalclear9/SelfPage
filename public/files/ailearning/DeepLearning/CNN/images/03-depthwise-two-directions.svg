<text x="76" y="646" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">分别保留 H、V 两个空间响应，再用单位点投影，就能同时命中。</text>

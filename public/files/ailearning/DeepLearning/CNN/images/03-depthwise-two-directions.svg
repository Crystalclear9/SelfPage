<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>一个空间基不能独立读取两种边缘</title><rect width="1440" height="960" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="65" y="60" font-size="36" fill="#19343e" text-anchor="start">一个空间基，为什么不够？</text><text x="65" y="106" font-size="25" fill="#71848c" text-anchor="start">单输入通道；单个有效窗口；无偏置、无中间非线性。</text><text x="65" y="175" font-size="29" fill="#19343e" text-anchor="start">① 两个目标空间核，也作为两种测试输入</text><rect x="95" y="210" width="52" height="52" fill="#f7e9e0"/><text x="121" y="245" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="150" y="210" width="52" height="52" fill="#f5f7f8"/><text x="176" y="245" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="205" y="210" width="52" height="52" fill="#e9f2f6"/><text x="231" y="245" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="95" y="265" width="52" height="52" fill="#f7e9e0"/><text x="121" y="300" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="150" y="265" width="52" height="52" fill="#f5f7f8"/><text x="176" y="300" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="205" y="265" width="52" height="52" fill="#e9f2f6"/><text x="231" y="300" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="95" y="320" width="52" height="52" fill="#f7e9e0"/><text x="121" y="355" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="150" y="320" width="52" height="52" fill="#f5f7f8"/><text x="176" y="355" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="205" y="320" width="52" height="52" fill="#e9f2f6"/><text x="231" y="355" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="365" y="210" width="52" height="52" fill="#f7e9e0"/><text x="391" y="245" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="420" y="210" width="52" height="52" fill="#f7e9e0"/><text x="446" y="245" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="475" y="210" width="52" height="52" fill="#f7e9e0"/><text x="501" y="245" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="365" y="265" width="52" height="52" fill="#f5f7f8"/><text x="391" y="300" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="420" y="265" width="52" height="52" fill="#f5f7f8"/><text x="446" y="300" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="475" y="265" width="52" height="52" fill="#f5f7f8"/><text x="501" y="300" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="365" y="320" width="52" height="52" fill="#e9f2f6"/><text x="391" y="355" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="420" y="320" width="52" height="52" fill="#e9f2f6"/><text x="446" y="355" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="475" y="320" width="52" height="52" fill="#e9f2f6"/><text x="501" y="355" font-size="28" fill="#19343e" text-anchor="middle">1</text><text x="176" y="415" font-size="27" fill="#226b88" text-anchor="middle">H：左右差</text><text x="446" y="415" font-size="27" fill="#bd673c" text-anchor="middle">V：上下差</text><text x="65" y="480" font-size="26" fill="#19343e" text-anchor="start">逐元素相乘求和：输出 (H 响应, V 响应)</text><text x="95" y="535" font-size="25" fill="#71848c" text-anchor="start">输入</text><text x="300" y="535" font-size="25" fill="#71848c" text-anchor="start">H 响应</text><text x="475" y="535" font-size="25" fill="#71848c" text-anchor="start">V 响应</text><line x1="75" y1="550" x2="635" y2="550" stroke="#dae2e6" stroke-width="2" stroke-dasharray=""/><text x="95" y="603" font-size="28" fill="#226b88" text-anchor="start">窗口 H</text><text x="342" y="603" font-size="30" fill="#226b88" text-anchor="middle">6</text><text x="517" y="603" font-size="30" fill="#226b88" text-anchor="middle">0</text><text x="95" y="673" font-size="28" fill="#bd673c" text-anchor="start">窗口 V</text><text x="342" y="673" font-size="30" fill="#bd673c" text-anchor="middle">0</text><text x="517" y="673" font-size="30" fill="#bd673c" text-anchor="middle">6</text><line x1="700" y1="150" x2="700" y2="708" stroke="#dae2e6" stroke-width="2" stroke-dasharray=""/><text x="755" y="175" font-size="29" fill="#19343e" text-anchor="start">② 一个深度核，之后只能缩放同一响应</text><text x="755" y="221" font-size="27" fill="#19343e" text-anchor="start">z = D 与窗口的内积</text><text x="755" y="263" font-size="29" fill="#226b88" text-anchor="start">两个输出 = (a z, b z)</text><line x1="820" y1="658" x2="1121" y2="658" stroke="#71848c" stroke-width="2" stroke-dasharray=""/><line x1="820" y1="658" x2="820" y2="357" stroke="#71848c" stroke-width="2" stroke-dasharray=""/><line x1="820" y1="658" x2="1108.1" y2="369.9" stroke="#71848c" stroke-width="3" stroke-dasharray="8 7"/><text x="1143" y="666" font-size="25" fill="#71848c" text-anchor="start">H</text><text x="800" y="340" font-size="25" fill="#71848c" text-anchor="start">V</text><circle cx="1078" cy="658" r="10" fill="#226b88"/><text x="1125" y="690" font-size="25" fill="#226b88" text-anchor="start">(6, 0)</text><circle cx="820" cy="400" r="10" fill="#bd673c"/><text x="850" y="405" font-size="25" fill="#bd673c" text-anchor="start">(0, 6)</text><text x="1085" y="430" font-size="24" fill="#71848c" text-anchor="start">图示 a = b</text><text x="1052" y="468" font-size="23" fill="#71848c" text-anchor="start">改变 a,b 可改变方向</text><text x="755" y="745" font-size="27" fill="#19343e" text-anchor="start">两个目标点与原点不共线，无法同时命中。</text><line x1="65" y1="792" x2="1375" y2="792" stroke="#dae2e6" stroke-width="2" stroke-dasharray=""/><text x="65" y="845" font-size="29" fill="#19343e" text-anchor="start">③ 两个空间基：分别取 H 与 V，点投影取单位矩阵</text><text x="65" y="898" font-size="26" fill="#226b88" text-anchor="start">先保留 (H 响应, V 响应)，再分别读取：两个测试窗口都得到正确输出。</text></g></svg>

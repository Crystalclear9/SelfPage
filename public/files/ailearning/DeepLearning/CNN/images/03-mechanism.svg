<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="743" viewBox="42 74 1196 743" role="img"><rect x="42" y="74" width="1196" height="743" fill="#ffffff"/><title>同一个块投影，把像素变成可计算的 token</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="27" fill="#74888d" text-anchor="start">单通道 4 × 4 图像 → 四个 2 × 2 块；按“行内从左到右”展开</text><rect x="70" y="185" width="59" height="59" fill="#d6e8ee"/><text x="101.0" y="227.16" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="132" y="185" width="59" height="59" fill="#d6e8ee"/><text x="163.0" y="227.16" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="194" y="185" width="59" height="59" fill="#b8d3de"/><text x="225.0" y="227.16" font-size="28" fill="#19343e" text-anchor="middle">3</text><rect x="256" y="185" width="59" height="59" fill="#b8d3de"/><text x="287.0" y="227.16" font-size="28" fill="#19343e" text-anchor="middle">4</text><rect x="70" y="247" width="59" height="59" fill="#d6e8ee"/><text x="101.0" y="289.16" font-size="28" fill="#19343e" text-anchor="middle">5</text><rect x="132" y="247" width="59" height="59" fill="#d6e8ee"/><text x="163.0" y="289.16" font-size="28" fill="#19343e" text-anchor="middle">6</text><rect x="194" y="247" width="59" height="59" fill="#b8d3de"/><text x="225.0" y="289.16" font-size="28" fill="#19343e" text-anchor="middle">7</text><rect x="256" y="247" width="59" height="59" fill="#b8d3de"/><text x="287.0" y="289.16" font-size="28" fill="#19343e" text-anchor="middle">8</text><rect x="70" y="309" width="59" height="59" fill="#f3dfd1"/><text x="101.0" y="351.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">9</text><rect x="132" y="309" width="59" height="59" fill="#f3dfd1"/><text x="163.0" y="351.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">10</text><rect x="194" y="309" width="59" height="59" fill="#e9b99d"/><text x="225.0" y="351.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">11</text><rect x="256" y="309" width="59" height="59" fill="#e9b99d"/><text x="287.0" y="351.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">12</text><rect x="70" y="371" width="59" height="59" fill="#f3dfd1"/><text x="101.0" y="413.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">13</text><rect x="132" y="371" width="59" height="59" fill="#f3dfd1"/><text x="163.0" y="413.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">14</text><rect x="194" y="371" width="59" height="59" fill="#e9b99d"/><text x="225.0" y="413.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">15</text><rect x="256" y="371" width="59" height="59" fill="#e9b99d"/><text x="287.0" y="413.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">16</text><text x="70" y="512" font-size="26" fill="#74888d" text-anchor="start">位置次序：左上、右上、左下、右下</text><line x1="350" y1="300" x2="460" y2="300" stroke="#276a80" stroke-width="4"/><path d="M449.47,305.75 L460.00,300.00 L449.47,294.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="470" y="185" font-size="29" fill="#276a80" text-anchor="start">共享投影 W</text><rect x="490" y="218" width="57" height="57" fill="#eaf1f2"/><text x="520.0" y="258.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="550" y="218" width="57" height="57" fill="#eaf1f2"/><text x="580.0" y="258.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="610" y="218" width="57" height="57" fill="#eaf1f2"/><text x="640.0" y="258.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="670" y="218" width="57" height="57" fill="#eaf1f2"/><text x="700.0" y="258.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="490" y="278" width="57" height="57" fill="#f7eae4"/><text x="520.0" y="318.8" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="550" y="278" width="57" height="57" fill="#eaf1f2"/><text x="580.0" y="318.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="610" y="278" width="57" height="57" fill="#f7eae4"/><text x="640.0" y="318.8" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="670" y="278" width="57" height="57" fill="#eaf1f2"/><text x="700.0" y="318.8" font-size="28" fill="#19343e" text-anchor="middle">1</text><text x="475" y="420" font-size="27" fill="#276a80" text-anchor="start">第 1 维：四个像素之和</text><text x="475" y="463" font-size="27" fill="#c2673f" text-anchor="start">第 2 维：右列 − 左列</text><line x1="770" y1="300" x2="860" y2="300" stroke="#276a80" stroke-width="4"/><path d="M849.47,305.75 L860.00,300.00 L849.47,294.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="900" y="185" font-size="29" fill="#19343e" text-anchor="start">token（尚未加位置）</text><text x="930" y="245" font-size="30" fill="#276a80" text-anchor="start">T1  (14, 2)</text><text x="930" y="307" font-size="30" fill="#276a80" text-anchor="start">T2  (22, 2)</text><text x="930" y="369" font-size="30" fill="#c2673f" text-anchor="start">T3  (46, 2)</text><text x="930" y="431" font-size="30" fill="#c2673f" text-anchor="start">T4  (54, 2)</text><line x1="60" y1="535" x2="1220" y2="535" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="585" font-size="30" fill="#19343e" text-anchor="start">压缩丢掉了哪些差异？</text><rect x="65" y="620" width="50" height="50" fill="#eaf1f2"/><text x="91.5" y="656.04" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="118" y="620" width="50" height="50" fill="#eaf1f2"/><text x="144.5" y="656.04" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="65" y="673" width="50" height="50" fill="#eaf1f2"/><text x="91.5" y="709.04" font-size="28" fill="#19343e" text-anchor="middle">5</text><rect x="118" y="673" width="50" height="50" fill="#eaf1f2"/><text x="144.5" y="709.04" font-size="28" fill="#19343e" text-anchor="middle">6</text><line x1="200" y1="675" x2="300" y2="675" stroke="#276a80" stroke-width="4"/><path d="M289.47,680.75 L300.00,675.00 L289.47,669.25" fill="none" stroke="#276a80" stroke-width="4"/><rect x="330" y="620" width="50" height="50" fill="#eaf1f2"/><text x="356.5" y="656.04" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="383" y="620" width="50" height="50" fill="#eaf1f2"/><text x="409.5" y="656.04" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="330" y="673" width="50" height="50" fill="#eaf1f2"/><text x="356.5" y="709.04" font-size="28" fill="#19343e" text-anchor="middle">4</text><rect x="383" y="673" width="50" height="50" fill="#eaf1f2"/><text x="409.5" y="709.04" font-size="28" fill="#19343e" text-anchor="middle">7</text><text x="505" y="650" font-size="29" fill="#19343e" text-anchor="start">块像素不同，两个投影却都为 (14, 2)。</text><text x="505" y="704" font-size="27" fill="#c2673f" text-anchor="start">差值 (1, −1, −1, 1) 落在 W 的零空间。</text><text x="60" y="795" font-size="28" fill="#74888d" text-anchor="start">位置编码保留块的位置；它不能恢复已经被块投影抹掉的内部差异。</text></g></svg>

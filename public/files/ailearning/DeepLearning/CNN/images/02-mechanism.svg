<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>增强是否保留标签取决于任务语义</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">增强是否保留标签取决于任务语义</text><rect x="190" y="200" width="270" height="270" rx="8" fill="#e2f3ed" stroke="#82a2b7" /><text x="268" y="385" font-size="140" fill="#143651">↑</text><rect x="730" y="200" width="270" height="270" rx="8" fill="#e2f3ed" stroke="#82a2b7" /><text x="808" y="385" font-size="140" fill="#143651">→</text><line x1="480" y1="340" x2="690" y2="340" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><text x="495" y="300" font-size="22" fill="#143651">旋转 90°</text><text x="120" y="550" font-size="25" fill="#143651">对象种类：可以保持</text><text x="640" y="550" font-size="25" fill="#aa642b">朝向标签：必须改变</text><text x="140" y="635" font-size="24" fill="#143651">标签是否保留由任务语义决定，不能由像素操作名称决定。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="669" viewBox="0 0 1200 669" role="img"><title>增强是否保留标签取决于任务语义</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="669" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">增强是否保留标签取决于任务语义</text><rect x="190" y="200" width="270" height="270" rx="8" fill="#e2f3ed" stroke="#94a9bb" /><text x="268" y="385" font-size="140" fill="#213447">↑</text><rect x="730" y="200" width="270" height="270" rx="8" fill="#e2f3ed" stroke="#94a9bb" /><text x="808" y="385" font-size="140" fill="#213447">→</text><line x1="480" y1="340" x2="690" y2="340" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><text x="495" y="300" font-size="24" fill="#213447">旋转 90°</text><text x="120" y="550" font-size="25" fill="#213447">对象种类：可以保持</text><text x="640" y="550" font-size="25" fill="#aa642b">朝向标签：必须改变</text><text x="140" y="635" font-size="24" fill="#213447">标签是否保留由任务语义决定，不能由像素操作名称决定。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>分组限制：矩阵里的零，等于被删去的通道连接</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">分组限制：矩阵里的零，等于被删去的通道连接</text><text x="60" y="117" font-size="27" fill="#74888d" text-anchor="start">同一空间位置：1 × 1 核，4 个输入、4 个输出、两组，无偏置</text><text x="75" y="184" font-size="29" fill="#276a80" text-anchor="start">分组权重 W</text><rect x="490" y="215" width="59" height="59" fill="#eaf1f2"/><text x="521.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="490" y="277" width="59" height="59" fill="#eaf1f2"/><text x="521.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="490" y="339" width="59" height="59" fill="#eaf1f2"/><text x="521.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">3</text><rect x="490" y="401" width="59" height="59" fill="#eaf1f2"/><text x="521.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">4</text><text x="405" y="350" font-size="40" fill="#19343e" text-anchor="start">×</text><text x="480" y="184" font-size="29" fill="#19343e" text-anchor="start">输入 x</text><rect x="80" y="215" width="59" height="59" fill="#d6e8ee"/><text x="111.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="142" y="215" width="59" height="59" fill="#d6e8ee"/><text x="173.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="204" y="215" width="59" height="59" fill="#f5f6f6"/><text x="235.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="266" y="215" width="59" height="59" fill="#f5f6f6"/><text x="297.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="80" y="277" width="59" height="59" fill="#d6e8ee"/><text x="111.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">3</text><rect x="142" y="277" width="59" height="59" fill="#d6e8ee"/><text x="173.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">4</text><rect x="204" y="277" width="59" height="59" fill="#f5f6f6"/><text x="235.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="266" y="277" width="59" height="59" fill="#f5f6f6"/><text x="297.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="80" y="339" width="59" height="59" fill="#f5f6f6"/><text x="111.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="142" y="339" width="59" height="59" fill="#f5f6f6"/><text x="173.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="204" y="339" width="59" height="59" fill="#f3dfd1"/><text x="235.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">1</text><rect x="266" y="339" width="59" height="59" fill="#f3dfd1"/><text x="297.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="80" y="401" width="59" height="59" fill="#f5f6f6"/><text x="111.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="142" y="401" width="59" height="59" fill="#f5f6f6"/><text x="173.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="204" y="401" width="59" height="59" fill="#f3dfd1"/><text x="235.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">2</text><rect x="266" y="401" width="59" height="59" fill="#f3dfd1"/><text x="297.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">1</text><text x="595" y="350" font-size="40" fill="#19343e" text-anchor="start">=</text><text x="680" y="184" font-size="29" fill="#276a80" text-anchor="start">输出 y</text><rect x="700" y="215" width="59" height="59" fill="#eaf1f2"/><text x="731.0" y="257.16" font-size="28" fill="#19343e" text-anchor="middle">5</text><rect x="700" y="277" width="59" height="59" fill="#eaf1f2"/><text x="731.0" y="319.16" font-size="28" fill="#19343e" text-anchor="middle">11</text><rect x="700" y="339" width="59" height="59" fill="#f7eae4"/><text x="731.0" y="381.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">-1</text><rect x="700" y="401" width="59" height="59" fill="#eaf1f2"/><text x="731.0" y="443.15999999999997" font-size="28" fill="#19343e" text-anchor="middle">10</text><text x="875" y="245" font-size="29" fill="#276a80" text-anchor="start">1 + 2 × 2 = 5</text><text x="875" y="308" font-size="29" fill="#276a80" text-anchor="start">3 + 4 × 2 = 11</text><text x="875" y="371" font-size="29" fill="#c2673f" text-anchor="start">3 − 4 = −1</text><text x="875" y="434" font-size="29" fill="#c2673f" text-anchor="start">2 × 3 + 4 = 10</text><line x1="60" y1="510" x2="1220" y2="510" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="560" font-size="29" fill="#19343e" text-anchor="start">完整连接：16 个自由权重</text><text x="650" y="560" font-size="29" fill="#276a80" text-anchor="start">两组：8 个自由权重</text><rect x="60" y="585" width="480" height="24" fill="#dbe5e8"/><rect x="650" y="585" width="240" height="24" fill="#276a80"/><text x="60" y="660" font-size="28" fill="#19343e" text-anchor="start">换成 3 × 3 核：144 → 72；跨组的零仍是结构约束。</text><text x="60" y="713" font-size="26" fill="#74888d" text-anchor="start">一层之后加通道混合可以改变连通性，不能让这一层的缺失连接自动存在。</text></g></svg>

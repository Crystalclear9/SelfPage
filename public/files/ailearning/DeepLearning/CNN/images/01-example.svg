<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="570" viewBox="0 0 1200 570" role="img"><title id="figure-title">分组卷积删除跨组通道连接</title><desc id="figure-desc">分组卷积删除跨组通道连接</desc><rect width="1200" height="570" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">分组卷积删除跨组通道连接</text><text x="195" y="115" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">输入通道</text><text x="690" y="115" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">输出通道</text><circle cx="195" cy="185" r="30" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="195" y="195" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><circle cx="690" cy="185" r="30" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="690" y="195" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><circle cx="195" cy="270" r="30" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="195" y="280" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><circle cx="690" cy="270" r="30" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="690" y="280" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><circle cx="195" cy="355" r="30" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="195" y="365" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">3</text><circle cx="690" cy="355" r="30" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="690" y="365" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">3</text><circle cx="195" cy="440" r="30" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="195" y="450" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">4</text><circle cx="690" cy="440" r="30" fill="white" stroke="#cf7432" stroke-width="2.5" /><text x="690" y="450" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">4</text><line x1="230" y1="185" x2="650" y2="185" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="230" y1="185" x2="650" y2="270" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="230" y1="270" x2="650" y2="185" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="230" y1="270" x2="650" y2="270" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="230" y1="355" x2="650" y2="355" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><line x1="230" y1="355" x2="650" y2="440" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><line x1="230" y1="440" x2="650" y2="355" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><line x1="230" y1="440" x2="650" y2="440" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="830" y="205" font-size="28" fill="#213447" text-anchor="start" font-weight="400">两组：各 2 入、2 出</text><text x="830" y="280" font-size="24" fill="#213447" text-anchor="start" font-weight="400">每条线配一个空间卷积核</text><text x="830" y="365" font-size="26" fill="#213447" text-anchor="start" font-weight="400">3 × 3 核、无偏置</text><text x="830" y="425" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">2 × (2 × 2 × 9) = 72</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>特征金字塔的侧向投影与低分辨率上采样</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#738d9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#16364e">特征金字塔：只上采样低分辨率路径，再逐元素相加</text><rect x="35" y="148.0" width="230" height="120.0" rx="7" fill="#e2eff8" stroke="#7895aa" /><text x="47" y="190.0" font-size="23.0" fill="#16364e">C3：高分辨率</text><text x="47" y="238.0" font-size="21" fill="#16364e">16×16×128</text><rect x="330" y="148.0" width="240" height="120.0" rx="7" fill="#e2f0e7" stroke="#7895aa" /><text x="342" y="190.0" font-size="23.0" fill="#16364e">1×1 侧向投影</text><text x="342" y="238.0" font-size="21" fill="#16364e">16×16×64</text><line x1="265" y1="208.0" x2="320" y2="208.0" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><rect x="35" y="418.0" width="230" height="120.0" rx="7" fill="#e2eff8" stroke="#7895aa" /><text x="47" y="460.0" font-size="23.0" fill="#16364e">C4：低分辨率</text><text x="47" y="508.0" font-size="21" fill="#16364e">8×8×256</text><rect x="330" y="418.0" width="240" height="120.0" rx="7" fill="#e2f0e7" stroke="#7895aa" /><text x="342" y="460.0" font-size="23.0" fill="#16364e">1×1 投影得到 P4</text><text x="342" y="508.0" font-size="21" fill="#16364e">8×8×64</text><line x1="265" y1="478.0" x2="320" y2="478.0" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><rect x="635" y="418.0" width="230" height="120.0" rx="7" fill="#f2e8d9" stroke="#7895aa" /><text x="647" y="460.0" font-size="23.0" fill="#16364e">仅 P4 上采样</text><text x="647" y="508.0" font-size="21" fill="#16364e">16×16×64</text><line x1="570" y1="478.0" x2="625" y2="478.0" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><path d="M 570 208.0 H 930 V 286.0" fill="none" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><path d="M 865 478.0 H 930 V 370.0" fill="none" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><circle cx="930" cy="328.0" r="32" fill="#e8dcf2" stroke="#7895aa" /><text x="914" y="342.4" font-size="32.0" fill="#16364e">＋</text><line x1="963" y1="328.0" x2="1030" y2="328.0" stroke="#738d9f" stroke-width="3" marker-end="url(#arr)" /><text x="1045" y="316.0" font-size="27.0" fill="#16364e">P3</text><text x="990" y="376.0" font-size="21" fill="#16364e">16×16×64</text><text x="35" y="622.0" font-size="22.0" fill="#16364e">空间尺寸对齐：16×16；通道对齐：64。高分辨率 C3 路径不做上采样。</text><text x="35" y="676.0" font-size="21" fill="#16364e">本图展示一次自顶向下融合；相加前还须核对采样中心、插值与边界约定。</text></g></svg>

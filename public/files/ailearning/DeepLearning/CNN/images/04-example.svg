<svg xmlns="http://www.w3.org/2000/svg" width="1023" height="488" viewBox="72 103 1023 488" role="img"><rect x="72" y="103" width="1023" height="488" fill="#ffffff"/><title>混淆计数比总准确率更能定位失败</title><rect width="1200" height="603" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><rect x="310" y="185" width="210" height="190" fill="rgb(63,177,148)" stroke="white" stroke-width="5"/><text x="385" y="297" font-size="46" fill="#17374e">8</text><rect x="530" y="185" width="210" height="190" fill="rgb(190,229,223)" stroke="white" stroke-width="5"/><text x="605" y="297" font-size="46" fill="#17374e">2</text><rect x="310" y="385" width="210" height="190" fill="rgb(148,212,198)" stroke="white" stroke-width="5"/><text x="385" y="497" font-size="46" fill="#17374e">4</text><rect x="530" y="385" width="210" height="190" fill="rgb(105,194,173)" stroke="white" stroke-width="5"/><text x="605" y="497" font-size="46" fill="#17374e">6</text><text x="330" y="145" font-size="28" fill="#17374e">预测 A</text><text x="550" y="145" font-size="28" fill="#17374e">预测 B</text><text x="90" y="295" font-size="28" fill="#17374e">真实 A</text><text x="90" y="495" font-size="28" fill="#17374e">真实 B</text><text x="815" y="265" font-size="27" fill="#17374e">正确：8＋6＝14</text><text x="815" y="335" font-size="25" fill="#17374e" text-anchor="start">准确率：</text><text x="946" y="320" font-size="21" fill="#17374e" text-anchor="middle">14</text><line x1="928.0" y1="327" x2="964.0" y2="327" stroke="#17374e" stroke-width="1.6"/><text x="946" y="349" font-size="21" fill="#17374e" text-anchor="middle">20</text><text x="974" y="335" font-size="25" fill="#17374e" text-anchor="start">＝0.70</text><text x="815" y="445" font-size="25" fill="#17374e" text-anchor="start">A 召回：</text><text x="946" y="430" font-size="21" fill="#17374e" text-anchor="middle">8</text><line x1="928.0" y1="437" x2="964.0" y2="437" stroke="#17374e" stroke-width="1.6"/><text x="946" y="459" font-size="21" fill="#17374e" text-anchor="middle">10</text><text x="974" y="445" font-size="25" fill="#17374e" text-anchor="start">＝0.80</text><text x="815" y="500" font-size="25" fill="#17374e" text-anchor="start">B 召回：</text><text x="946" y="485" font-size="21" fill="#17374e" text-anchor="middle">6</text><line x1="928.0" y1="492" x2="964.0" y2="492" stroke="#17374e" stroke-width="1.6"/><text x="946" y="514" font-size="21" fill="#17374e" text-anchor="middle">10</text><text x="974" y="500" font-size="25" fill="#17374e" text-anchor="start">＝0.60</text></g><desc> 相同颜色尺度：颜色越深，样本计数越多；数字给出完整可复算值。</desc></svg>

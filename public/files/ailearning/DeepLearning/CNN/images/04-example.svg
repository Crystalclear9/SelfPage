<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>混淆计数比总准确率更能定位失败</title><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="38" y="53" font-size="32" fill="#17374e">混淆计数比总准确率更能定位失败</text><rect x="310" y="185" width="210" height="190" fill="rgb(63,177,148)" stroke="white" stroke-width="5"/><text x="385" y="297" font-size="46" fill="#17374e">8</text><rect x="530" y="185" width="210" height="190" fill="rgb(190,229,223)" stroke="white" stroke-width="5"/><text x="605" y="297" font-size="46" fill="#17374e">2</text><rect x="310" y="385" width="210" height="190" fill="rgb(148,212,198)" stroke="white" stroke-width="5"/><text x="385" y="497" font-size="46" fill="#17374e">4</text><rect x="530" y="385" width="210" height="190" fill="rgb(105,194,173)" stroke="white" stroke-width="5"/><text x="605" y="497" font-size="46" fill="#17374e">6</text><text x="330" y="145" font-size="28" fill="#17374e">预测 A</text><text x="550" y="145" font-size="28" fill="#17374e">预测 B</text><text x="90" y="295" font-size="28" fill="#17374e">真实 A</text><text x="90" y="495" font-size="28" fill="#17374e">真实 B</text><text x="815" y="265" font-size="27" fill="#17374e">正确：8＋6＝14</text><text x="815" y="335" font-size="26" fill="#17374e">准确率：14÷20＝0.70</text><text x="815" y="445" font-size="25" fill="#17374e">A 召回：8÷10＝0.80</text><text x="815" y="500" font-size="25" fill="#17374e">B 召回：6÷10＝0.60</text><text x="140" y="660" font-size="24" fill="#17374e">相同颜色尺度：颜色越深，样本计数越多；数字给出完整可复算值。</text></g></svg>

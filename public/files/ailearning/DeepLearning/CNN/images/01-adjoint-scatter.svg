<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">前向读取与伴随散射</title>
<desc id="fig-desc">前向两个窗口共享中间输入；伴随回传在同一个中间位置将两份贡献相加。</desc>
<rect x="0" y="0" width="1200" height="708" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">前向读取重叠窗口</text>
<path d="M256 148 L273 100 L376 100 L359 148 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316" y="132.75" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">x₁ = 1</text>
<path d="M545 148 L562 100 L665 100 L648 148 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="605" y="132.75" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">x₂ = 2</text>
<path d="M834 148 L851 100 L954 100 L937 148 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="894" y="132.75" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">x₃ = 3</text>
<path d="M316 152 L440 227" fill="none" stroke="#166d75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 227 L428 225.585 L433.175 217.029 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="366" y="176" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 1</text>
<path d="M605 152 L440 227" fill="none" stroke="#166d75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 227 L447.945 217.896 L452.083 227 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="534.5" y="176" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 2</text>
<path d="M605 152 L766 227" fill="none" stroke="#166d75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M766 227 L753.917 226.887 L758.14 217.823 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="673.5" y="176" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 1</text>
<path d="M894 152 L766 227" fill="none" stroke="#166d75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M766 227 L772.963 217.125 L778.019 225.753 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="842" y="176" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 2</text>
<path d="M380 283 L397 235 L500 235 L483 283 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="267.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">5</text>
<path d="M706 283 L723 235 L826 235 L809 283 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="766" y="267.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">8</text>
<path d="M75 319 L1125 319" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="362" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="27" text-anchor="start" font-weight="600">伴随沿同一连接散射并累加</text>
<path d="M380 439 L397 391 L500 391 L483 439 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="423.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">u₁ = 3</text>
<path d="M706 439 L723 391 L826 391 L809 439 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="766" y="423.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">u₂ = 4</text>
<path d="M440 443 L316 519" fill="none" stroke="#a74d3a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M316 519 L322.766 508.989 L327.991 517.515 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="366" y="463" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 1</text>
<path d="M440 443 L605 519" fill="none" stroke="#a74d3a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M605 519 L592.917 518.939 L597.101 509.857 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="534.5" y="463" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 2</text>
<path d="M766 443 L605 519" fill="none" stroke="#a74d3a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M605 519 L612.813 509.783 L617.082 518.826 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="673.5" y="463" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 1</text>
<path d="M766 443 L894 519" fill="none" stroke="#a74d3a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M894 519 L881.989 517.683 L887.094 509.085 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="842" y="463" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">× 2</text>
<path d="M256 576 L273 528 L376 528 L359 576 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316" y="560.75" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">3</text>
<path d="M545 576 L562 528 L665 528 L648 576 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="605" y="560.75" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">10</text>
<path d="M834 576 L851 528 L954 528 L937 576 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="894" y="560.75" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">8</text>
<text x="75" y="619" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">中间位置收到两份贡献：2 × 3 + 1 × 4 = 10。</text>
<text x="76" y="661" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">核对内积：5 × 3 + 8 × 4 = 1 × 3 + 2 × 10 + 3 × 8 = 47。</text>
</svg>

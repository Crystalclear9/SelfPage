<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img"><title>打包执行：只更新仍有效的序列，再恢复原行顺序</title><rect width="1280" height="1030" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">打包执行：只更新仍有效的序列，再恢复原行顺序</text><text x="60" y="125" font-size="28" fill="#19343e" text-anchor="start">线性单元 h = 0.5h + x；各序列初值均为 0</text><text x="345" y="185" font-size="26" fill="#74888d" text-anchor="middle">t = 0</text><text x="515" y="185" font-size="26" fill="#74888d" text-anchor="middle">t = 1</text><text x="685" y="185" font-size="26" fill="#74888d" text-anchor="middle">t = 2</text><text x="855" y="185" font-size="26" fill="#74888d" text-anchor="middle">t = 3</text><text x="1025" y="185" font-size="26" fill="#74888d" text-anchor="middle">t = 4</text><text x="70" y="266" font-size="30" fill="#276a80" text-anchor="start">B</text><rect x="285" y="230" width="125" height="75" fill="#f0f5f6"/><text x="347" y="261" font-size="25" fill="#276a80" text-anchor="middle">x 10</text><text x="347" y="294" font-size="24" fill="#19343e" text-anchor="middle">h 10</text><line x1="415" y1="270" x2="447" y2="270" stroke="#276a80" stroke-width="4"/><path d="M436.47,275.75 L447.00,270.00 L436.47,264.25" fill="none" stroke="#276a80" stroke-width="4"/><rect x="455" y="230" width="125" height="75" fill="#f0f5f6"/><text x="517" y="261" font-size="25" fill="#276a80" text-anchor="middle">x 20</text><text x="517" y="294" font-size="24" fill="#19343e" text-anchor="middle">h 25</text><line x1="585" y1="270" x2="617" y2="270" stroke="#276a80" stroke-width="4"/><path d="M606.47,275.75 L617.00,270.00 L606.47,264.25" fill="none" stroke="#276a80" stroke-width="4"/><rect x="625" y="230" width="125" height="75" fill="#f0f5f6"/><text x="687" y="261" font-size="25" fill="#276a80" text-anchor="middle">x 30</text><text x="687" y="294" font-size="24" fill="#19343e" text-anchor="middle">h 42.5</text><line x1="755" y1="270" x2="787" y2="270" stroke="#276a80" stroke-width="4"/><path d="M776.47,275.75 L787.00,270.00 L776.47,264.25" fill="none" stroke="#276a80" stroke-width="4"/><rect x="795" y="230" width="125" height="75" fill="#f0f5f6"/><text x="857" y="261" font-size="25" fill="#276a80" text-anchor="middle">x 40</text><text x="857" y="294" font-size="24" fill="#19343e" text-anchor="middle">h 61.25</text><line x1="925" y1="270" x2="957" y2="270" stroke="#276a80" stroke-width="4"/><path d="M946.47,275.75 L957.00,270.00 L946.47,264.25" fill="none" stroke="#276a80" stroke-width="4"/><rect x="965" y="230" width="125" height="75" fill="#f0f5f6"/><text x="1027" y="261" font-size="25" fill="#276a80" text-anchor="middle">x 50</text><text x="1027" y="294" font-size="24" fill="#19343e" text-anchor="middle">h 80.625</text><text x="70" y="411" font-size="30" fill="#c2673f" text-anchor="start">C</text><rect x="285" y="375" width="125" height="75" fill="#f0f5f6"/><text x="347" y="406" font-size="25" fill="#c2673f" text-anchor="middle">x 100</text><text x="347" y="439" font-size="24" fill="#19343e" text-anchor="middle">h 100</text><line x1="415" y1="415" x2="447" y2="415" stroke="#c2673f" stroke-width="4"/><path d="M436.47,420.75 L447.00,415.00 L436.47,409.25" fill="none" stroke="#c2673f" stroke-width="4"/><rect x="455" y="375" width="125" height="75" fill="#f0f5f6"/><text x="517" y="406" font-size="25" fill="#c2673f" text-anchor="middle">x 200</text><text x="517" y="439" font-size="24" fill="#19343e" text-anchor="middle">h 250</text><line x1="585" y1="415" x2="617" y2="415" stroke="#c2673f" stroke-width="4"/><path d="M606.47,420.75 L617.00,415.00 L606.47,409.25" fill="none" stroke="#c2673f" stroke-width="4"/><rect x="625" y="375" width="125" height="75" fill="#f0f5f6"/><text x="687" y="406" font-size="25" fill="#c2673f" text-anchor="middle">x 300</text><text x="687" y="439" font-size="24" fill="#19343e" text-anchor="middle">h 425</text><rect x="795" y="375" width="125" height="75" fill="#eceff0"/><text x="857" y="422" font-size="24" fill="#74888d" text-anchor="middle">不执行</text><rect x="965" y="375" width="125" height="75" fill="#eceff0"/><text x="1027" y="422" font-size="24" fill="#74888d" text-anchor="middle">不执行</text><text x="70" y="556" font-size="30" fill="#5d8c79" text-anchor="start">A</text><rect x="285" y="520" width="125" height="75" fill="#f0f5f6"/><text x="347" y="551" font-size="25" fill="#5d8c79" text-anchor="middle">x 1</text><text x="347" y="584" font-size="24" fill="#19343e" text-anchor="middle">h 1</text><line x1="415" y1="560" x2="447" y2="560" stroke="#5d8c79" stroke-width="4"/><path d="M436.47,565.75 L447.00,560.00 L436.47,554.25" fill="none" stroke="#5d8c79" stroke-width="4"/><rect x="455" y="520" width="125" height="75" fill="#f0f5f6"/><text x="517" y="551" font-size="25" fill="#5d8c79" text-anchor="middle">x 2</text><text x="517" y="584" font-size="24" fill="#19343e" text-anchor="middle">h 2.5</text><rect x="625" y="520" width="125" height="75" fill="#eceff0"/><text x="687" y="567" font-size="24" fill="#74888d" text-anchor="middle">不执行</text><rect x="795" y="520" width="125" height="75" fill="#eceff0"/><text x="857" y="567" font-size="24" fill="#74888d" text-anchor="middle">不执行</text><rect x="965" y="520" width="125" height="75" fill="#eceff0"/><text x="1027" y="567" font-size="24" fill="#74888d" text-anchor="middle">不执行</text><text x="60" y="650" font-size="28" fill="#19343e" text-anchor="start">每个时间切片的有效条数</text><text x="345" y="695" font-size="30" fill="#19343e" text-anchor="middle">3</text><text x="515" y="695" font-size="30" fill="#19343e" text-anchor="middle">3</text><text x="685" y="695" font-size="30" fill="#19343e" text-anchor="middle">2</text><text x="855" y="695" font-size="30" fill="#19343e" text-anchor="middle">1</text><text x="1025" y="695" font-size="30" fill="#19343e" text-anchor="middle">1</text><line x1="60" y1="735" x2="1220" y2="735" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="790" font-size="28" fill="#19343e" text-anchor="start">执行顺序 B、C、A</text><text x="680" y="790" font-size="28" fill="#19343e" text-anchor="start">恢复原顺序 A、B、C</text><text x="150" y="845" font-size="30" fill="#276a80" text-anchor="middle">80.625</text><line x1="150" y1="865" x2="900" y2="920" stroke="#276a80" stroke-width="4"/><path d="M889.08,924.97 L900.00,920.00 L889.92,913.49" fill="none" stroke="#276a80" stroke-width="4"/><text x="900" y="965" font-size="30" fill="#276a80" text-anchor="middle">80.625</text><text x="330" y="845" font-size="30" fill="#c2673f" text-anchor="middle">425</text><line x1="330" y1="865" x2="1100" y2="920" stroke="#c2673f" stroke-width="4"/><path d="M1089.09,924.99 L1100.00,920.00 L1089.91,913.51" fill="none" stroke="#c2673f" stroke-width="4"/><text x="1100" y="965" font-size="30" fill="#c2673f" text-anchor="middle">425</text><text x="510" y="845" font-size="30" fill="#5d8c79" text-anchor="middle">2.5</text><line x1="510" y1="865" x2="700" y2="920" stroke="#5d8c79" stroke-width="4"/><path d="M688.28,922.60 L700.00,920.00 L691.48,911.55" fill="none" stroke="#5d8c79" stroke-width="4"/><text x="700" y="965" font-size="30" fill="#5d8c79" text-anchor="middle">2.5</text><text x="60" y="1010" font-size="27" fill="#19343e" text-anchor="start">填充不是零观测：A 若再执行三个零输入，会从 2.5 错变成 0.3125。</text></g></svg>

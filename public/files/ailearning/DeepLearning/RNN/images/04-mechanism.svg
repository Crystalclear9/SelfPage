<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>递归预测中旧误差传播与新误差持续注入</title><desc>两个线性误差系统比较收缩系数0.8和放大系数1.2。单次0.1冲击的第k步误差为0.1a的k减一次方，持续每步0.1注入的误差为0.1等比和。</desc><rect width="1200" height="800" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="55" font-size="34" fill="#233642" text-anchor="start">后面的误差来自两件事：旧误差传播、新误差加入</text><text x="48" y="105" font-size="27" fill="#687b86" text-anchor="start">误差递推 e(k) = a · e(k−1) + δ(k)；起点误差为 0。</text><text x="315.0" y="175" font-size="29" fill="#233642" text-anchor="middle">a = 0.8：旧扰动收缩</text><line x1="100" y1="565.0" x2="530" y2="565.0" stroke="#dce5e9" stroke-width="1"/><text x="84" y="574.0" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="100" y1="482.5" x2="530" y2="482.5" stroke="#dce5e9" stroke-width="1"/><text x="84" y="491.5" font-size="24" fill="#687b86" text-anchor="end">0.2</text><line x1="100" y1="400.0" x2="530" y2="400.0" stroke="#dce5e9" stroke-width="1"/><text x="84" y="409.0" font-size="24" fill="#687b86" text-anchor="end">0.4</text><line x1="100" y1="317.5" x2="530" y2="317.5" stroke="#dce5e9" stroke-width="1"/><text x="84" y="326.5" font-size="24" fill="#687b86" text-anchor="end">0.6</text><line x1="100" y1="235.0" x2="530" y2="235.0" stroke="#dce5e9" stroke-width="1"/><text x="84" y="244.0" font-size="24" fill="#687b86" text-anchor="end">0.8</text><line x1="100" y1="565" x2="530" y2="565" stroke="#687b86" stroke-width="2"/><text x="100.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">1</text><text x="207.5" y="601" font-size="25" fill="#687b86" text-anchor="middle">2</text><text x="315.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">3</text><text x="422.5" y="601" font-size="25" fill="#687b86" text-anchor="middle">4</text><text x="530.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">5</text><polyline points="100.000,523.750 207.500,532.000 315.000,538.600 422.500,543.880 530.000,548.104" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><polyline points="100.000,523.750 207.500,490.750 315.000,464.350 422.500,443.230 530.000,426.334" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><circle cx="100.0" cy="523.75" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="207.5" cy="532.0" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="315.0" cy="538.6" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="422.5" cy="543.88" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="530.0" cy="548.104" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="100.0" cy="523.75" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="207.5" cy="490.75" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="315.0" cy="464.35" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="422.5" cy="443.22999999999996" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="530.0" cy="426.33399999999995" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="522" y="408.33399999999995" font-size="26" fill="#bc5b31" text-anchor="end">0.33616</text><text x="522" y="518.104" font-size="26" fill="#246d91" text-anchor="end">0.04096</text><text x="895.0" y="175" font-size="29" fill="#233642" text-anchor="middle">a = 1.2：旧扰动放大</text><line x1="680" y1="565.0" x2="1110" y2="565.0" stroke="#dce5e9" stroke-width="1"/><text x="664" y="574.0" font-size="24" fill="#687b86" text-anchor="end">0</text><line x1="680" y1="482.5" x2="1110" y2="482.5" stroke="#dce5e9" stroke-width="1"/><text x="664" y="491.5" font-size="24" fill="#687b86" text-anchor="end">0.2</text><line x1="680" y1="400.0" x2="1110" y2="400.0" stroke="#dce5e9" stroke-width="1"/><text x="664" y="409.0" font-size="24" fill="#687b86" text-anchor="end">0.4</text><line x1="680" y1="317.5" x2="1110" y2="317.5" stroke="#dce5e9" stroke-width="1"/><text x="664" y="326.5" font-size="24" fill="#687b86" text-anchor="end">0.6</text><line x1="680" y1="235.0" x2="1110" y2="235.0" stroke="#dce5e9" stroke-width="1"/><text x="664" y="244.0" font-size="24" fill="#687b86" text-anchor="end">0.8</text><line x1="680" y1="565" x2="1110" y2="565" stroke="#687b86" stroke-width="2"/><text x="680.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">1</text><text x="787.5" y="601" font-size="25" fill="#687b86" text-anchor="middle">2</text><text x="895.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">3</text><text x="1002.5" y="601" font-size="25" fill="#687b86" text-anchor="middle">4</text><text x="1110.0" y="601" font-size="25" fill="#687b86" text-anchor="middle">5</text><polyline points="680.000,523.750 787.500,515.500 895.000,505.600 1002.500,493.720 1110.000,479.464" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><polyline points="680.000,523.750 787.500,474.250 895.000,414.850 1002.500,343.570 1110.000,258.034" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><circle cx="680.0" cy="523.75" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="787.5" cy="515.5" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="895.0" cy="505.6" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="1002.5" cy="493.72" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="1110.0" cy="479.464" r="5" fill="#246d91" stroke="white" stroke-width="2"/><circle cx="680.0" cy="523.75" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="787.5" cy="474.25" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="895.0" cy="414.85" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="1002.5" cy="343.57" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><circle cx="1110.0" cy="258.034" r="5" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="1102" y="240.034" font-size="26" fill="#bc5b31" text-anchor="end">0.74416</text><text x="1102" y="514.4639999999999" font-size="26" fill="#246d91" text-anchor="end">0.20736</text><text x="1050" y="630" font-size="25" fill="#687b86" text-anchor="start">预测步数 k</text><line x1="60" y1="670" x2="100" y2="670" stroke="#246d91" stroke-width="4"/><text x="120" y="680" font-size="27" fill="#246d91" text-anchor="start">仅第 1 步注入 0.1</text><line x1="650" y1="670" x2="690" y2="670" stroke="#bc5b31" stroke-width="4"/><text x="710" y="680" font-size="27" fill="#bc5b31" text-anchor="start">每一步都注入 0.1</text><text x="60" y="740" font-size="27" fill="#687b86" text-anchor="start">a &lt; 1 时，单次误差会减小，但持续偏差仍会积累到非零水平。</text><text x="60" y="785" font-size="25" fill="#687b86" text-anchor="start">这是确定性误差算例；随机创新的均方误差要计算方差及协方差。</text></g></svg>

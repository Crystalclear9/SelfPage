<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="604" viewBox="0 0 1200 604" role="img"><title>递归预测把早期输出继续作为后续输入</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="604" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">递归预测把早期输出继续作为后续输入</text><rect x="80" y="260" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="95" y="295" font-size="24" fill="#213447">预测 y1</text><text x="80" y="220" font-size="24" fill="#213447">历史＋已有预测</text><line x1="310" y1="310" x2="440" y2="310" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><text x="325" y="365" font-size="24" fill="#213447">反馈</text><rect x="450" y="260" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="465" y="295" font-size="24" fill="#213447">预测 y2</text><text x="450" y="220" font-size="24" fill="#213447">历史＋已有预测</text><line x1="680" y1="310" x2="810" y2="310" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><text x="695" y="365" font-size="24" fill="#213447">反馈</text><rect x="820" y="260" width="230" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="835" y="295" font-size="24" fill="#213447">预测 y3</text><text x="820" y="220" font-size="24" fill="#213447">历史＋已有预测</text><text x="100" y="485" font-size="28" fill="#213447">直接多步：同一历史 → [y1，y2，y3]</text><text x="100" y="570" font-size="25" fill="#213447">递归：输出成为后续输入，误差也进入后续条件。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>递归预测把早期输出继续作为后续输入</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">递归预测把早期输出继续作为后续输入</text><rect x="80" y="260" width="230" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="95" y="295" font-size="22" fill="#143651">预测 y1</text><text x="80" y="220" font-size="22" fill="#143651">历史＋已有预测</text><line x1="310" y1="310" x2="440" y2="310" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><text x="325" y="365" font-size="21" fill="#143651">反馈</text><rect x="450" y="260" width="230" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="465" y="295" font-size="22" fill="#143651">预测 y2</text><text x="450" y="220" font-size="22" fill="#143651">历史＋已有预测</text><line x1="680" y1="310" x2="810" y2="310" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><text x="695" y="365" font-size="21" fill="#143651">反馈</text><rect x="820" y="260" width="230" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="835" y="295" font-size="22" fill="#143651">预测 y3</text><text x="820" y="220" font-size="22" fill="#143651">历史＋已有预测</text><text x="100" y="485" font-size="28" fill="#143651">直接多步：同一历史 → [y1，y2，y3]</text><text x="100" y="570" font-size="25" fill="#143651">递归：输出成为后续输入，误差也进入后续条件。</text></g></svg>

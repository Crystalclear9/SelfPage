<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1121.2" viewBox="0 0 1440 1121.2" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">循环单元展开后仍共享参数</title><rect width="1440" height="1121.2" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">循环单元展开后仍共享参数</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="979.2" viewBox="0 0 1400 1020" role="img" x="48" y="106" overflow="hidden"><title>循环状态不是一串新参数：展开路径，再按来源求和</title><rect width="1400" height="1020" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#20354a" text-anchor="start">循环状态不是一串新参数：展开路径，再按来源求和</text><text x="55" y="111" font-size="28" fill="#7d949d" text-anchor="start">h0=0；h(t) = a h(t-1) + x(t)；每一步都复用 a=0.5</text><circle cx="155" cy="255" r="47" fill="#226f90"/><text x="155" y="265" font-size="28" fill="white" text-anchor="middle">0</text><text x="155" y="345" font-size="27" fill="#226f90" text-anchor="middle">h0</text><circle cx="480" cy="255" r="47" fill="#226f90"/><text x="480" y="265" font-size="28" fill="white" text-anchor="middle">1</text><text x="480" y="345" font-size="27" fill="#226f90" text-anchor="middle">h1</text><line x1="205" y1="255" x2="431" y2="255" stroke="#226f90" stroke-width="4"/><polygon points="431,255 420.1946347717679,260.21958640933474 420.1946347717679,249.78041359066523" fill="#226f90"/><text x="315" y="225" font-size="25" fill="#226f90" text-anchor="middle">× 0.5，再加输入</text><text x="480" y="155" font-size="28" fill="#ba6940" text-anchor="middle">x1 = 1</text><line x1="480" y1="170" x2="480" y2="205" stroke="#ba6940" stroke-width="3"/><polygon points="480,205 474.78041359066526,194.19463477176788 485.21958640933474,194.19463477176788" fill="#ba6940"/><circle cx="805" cy="255" r="47" fill="#226f90"/><text x="805" y="265" font-size="28" fill="white" text-anchor="middle">2.5</text><text x="805" y="345" font-size="27" fill="#226f90" text-anchor="middle">h2</text><line x1="530" y1="255" x2="756" y2="255" stroke="#226f90" stroke-width="4"/><polygon points="756,255 745.1946347717678,260.21958640933474 745.1946347717678,249.78041359066523" fill="#226f90"/><text x="640" y="225" font-size="25" fill="#226f90" text-anchor="middle">× 0.5，再加输入</text><text x="805" y="155" font-size="28" fill="#ba6940" text-anchor="middle">x2 = 2</text><line x1="805" y1="170" x2="805" y2="205" stroke="#ba6940" stroke-width="3"/><polygon points="805,205 799.7804135906653,194.19463477176788 810.2195864093347,194.19463477176788" fill="#ba6940"/><circle cx="1130" cy="255" r="47" fill="#226f90"/><text x="1130" y="265" font-size="28" fill="white" text-anchor="middle">1.25</text><text x="1130" y="345" font-size="27" fill="#226f90" text-anchor="middle">h3</text><line x1="855" y1="255" x2="1081" y2="255" stroke="#226f90" stroke-width="4"/><polygon points="1081,255 1070.1946347717678,260.21958640933474 1070.1946347717678,249.78041359066523" fill="#226f90"/><text x="965" y="225" font-size="25" fill="#226f90" text-anchor="middle">× 0.5，再加输入</text><text x="1130" y="155" font-size="28" fill="#ba6940" text-anchor="middle">x3 = 0</text><line x1="1130" y1="170" x2="1130" y2="205" stroke="#ba6940" stroke-width="3"/><polygon points="1130,205 1124.7804135906651,194.19463477176788 1135.2195864093349,194.19463477176788" fill="#ba6940"/><line x1="55" y1="385" x2="1340" y2="385" stroke="#dfe4ec" stroke-width="2"/><text x="60" y="441" font-size="29" fill="#20354a" text-anchor="start">每格是输入的实际贡献</text><text x="300" y="493" font-size="27" fill="#20354a" text-anchor="middle">t=1</text><text x="500" y="493" font-size="27" fill="#20354a" text-anchor="middle">t=2</text><text x="700" y="493" font-size="27" fill="#20354a" text-anchor="middle">t=3</text><text x="65" y="568" font-size="27" fill="#226f90" text-anchor="start">来源 x1</text><rect x="215" y="525" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="300" y="568" font-size="29" fill="#226f90" text-anchor="middle">1</text><rect x="415" y="525" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="500" y="568" font-size="29" fill="#226f90" text-anchor="middle">0.5</text><rect x="615" y="525" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="700" y="568" font-size="29" fill="#226f90" text-anchor="middle">0.25</text><text x="65" y="658" font-size="27" fill="#ba6940" text-anchor="start">来源 x2</text><rect x="215" y="615" width="170" height="60" fill="#f4f5f5" stroke="none"/><text x="300" y="658" font-size="29" fill="#ba6940" text-anchor="middle">0</text><rect x="415" y="615" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="500" y="658" font-size="29" fill="#ba6940" text-anchor="middle">2</text><rect x="615" y="615" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="700" y="658" font-size="29" fill="#ba6940" text-anchor="middle">1</text><text x="65" y="748" font-size="27" fill="#4c9590" text-anchor="start">来源 x3</text><rect x="215" y="705" width="170" height="60" fill="#f4f5f5" stroke="none"/><text x="300" y="748" font-size="29" fill="#4c9590" text-anchor="middle">0</text><rect x="415" y="705" width="170" height="60" fill="#f4f5f5" stroke="none"/><text x="500" y="748" font-size="29" fill="#4c9590" text-anchor="middle">0</text><rect x="615" y="705" width="170" height="60" fill="#e9f1f4" stroke="none"/><text x="700" y="748" font-size="29" fill="#4c9590" text-anchor="middle">0</text><text x="950" y="445" font-size="28" fill="#20354a" text-anchor="start">来源堆叠 = 当前状态</text><rect x="925" y="670" width="70" height="95" fill="#226f90" stroke="none"/><rect x="925" y="670" width="70" height="0" fill="#ba6940" stroke="none"/><rect x="925" y="670" width="70" height="0" fill="#4c9590" stroke="none"/><text x="960" y="817" font-size="26" fill="#20354a" text-anchor="middle">t=1</text><text x="960" y="652" font-size="29" fill="#226f90" text-anchor="middle">1</text><rect x="1075" y="717.5" width="70" height="47.5" fill="#226f90" stroke="none"/><rect x="1075" y="527.5" width="70" height="190" fill="#ba6940" stroke="none"/><rect x="1075" y="527.5" width="70" height="0" fill="#4c9590" stroke="none"/><text x="1110" y="817" font-size="26" fill="#20354a" text-anchor="middle">t=2</text><text x="1110" y="509.5" font-size="29" fill="#226f90" text-anchor="middle">2.5</text><rect x="1225" y="741.25" width="70" height="23.75" fill="#226f90" stroke="none"/><rect x="1225" y="646.25" width="70" height="95" fill="#ba6940" stroke="none"/><rect x="1225" y="646.25" width="70" height="0" fill="#4c9590" stroke="none"/><text x="1260" y="817" font-size="26" fill="#20354a" text-anchor="middle">t=3</text><text x="1260" y="628.25" font-size="29" fill="#226f90" text-anchor="middle">1.25</text><line x1="55" y1="860" x2="1340" y2="860" stroke="#dfe4ec" stroke-width="2"/><text x="60" y="919" font-size="29" fill="#20354a" text-anchor="start">末状态：0.25 × 1 + 0.5 × 2 + 1 × 0 = 1.25</text><text x="60" y="980" font-size="27" fill="#4c9590" text-anchor="start">共享 a 的梯度：0.5（第 2 步调用）+ 2.5（第 3 步调用）= 3</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>状态是一条时间链，也是一个下三角变换</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">状态是一条时间链，也是一个下三角变换</text><text x="60" y="118" font-size="28" fill="#19343e" text-anchor="start">h = 0.5 × 上一步状态 + 当前输入</text><text x="260" y="175" font-size="28" fill="#276a80" text-anchor="middle">输入 1</text><line x1="260" y1="190" x2="260" y2="245" stroke="#276a80" stroke-width="4"/><path d="M254.25,234.47 L260.00,245.00 L265.75,234.47" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="260" cy="300" r="42" fill="#276a80"/><text x="260" y="310" font-size="28" fill="white" text-anchor="middle">1</text><text x="260" y="380" font-size="26" fill="#19343e" text-anchor="middle">时刻 1</text><line x1="308" y1="300" x2="545" y2="300" stroke="#74888d" stroke-width="4"/><path d="M534.47,305.75 L545.00,300.00 L534.47,294.25" fill="none" stroke="#74888d" stroke-width="4"/><text x="430" y="280" font-size="26" fill="#74888d" text-anchor="middle">× 0.5</text><text x="600" y="175" font-size="28" fill="#276a80" text-anchor="middle">输入 2</text><line x1="600" y1="190" x2="600" y2="245" stroke="#276a80" stroke-width="4"/><path d="M594.25,234.47 L600.00,245.00 L605.75,234.47" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="600" cy="300" r="42" fill="#276a80"/><text x="600" y="310" font-size="28" fill="white" text-anchor="middle">2.5</text><text x="600" y="380" font-size="26" fill="#19343e" text-anchor="middle">时刻 2</text><line x1="648" y1="300" x2="885" y2="300" stroke="#74888d" stroke-width="4"/><path d="M874.47,305.75 L885.00,300.00 L874.47,294.25" fill="none" stroke="#74888d" stroke-width="4"/><text x="770" y="280" font-size="26" fill="#74888d" text-anchor="middle">× 0.5</text><text x="940" y="175" font-size="28" fill="#276a80" text-anchor="middle">输入 0</text><line x1="940" y1="190" x2="940" y2="245" stroke="#276a80" stroke-width="4"/><path d="M934.25,234.47 L940.00,245.00 L945.75,234.47" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="940" cy="300" r="42" fill="#276a80"/><text x="940" y="310" font-size="28" fill="white" text-anchor="middle">1.25</text><text x="940" y="380" font-size="26" fill="#19343e" text-anchor="middle">时刻 3</text><text x="60" y="310" font-size="26" fill="#19343e" text-anchor="start">初值 0</text><line x1="150" y1="300" x2="208" y2="300" stroke="#74888d" stroke-width="4"/><path d="M197.47,305.75 L208.00,300.00 L197.47,294.25" fill="none" stroke="#74888d" stroke-width="4"/><line x1="60" y1="425" x2="1220" y2="425" stroke="#dbe5e8" stroke-width="2"/><text x="70" y="485" font-size="29" fill="#19343e" text-anchor="start">每个输入怎样留下来</text><rect x="145" y="530" width="116" height="66" fill="#e1edf0"/><text x="203" y="573" font-size="28" fill="#276a80" text-anchor="middle">1</text><rect x="280" y="530" width="116" height="66" fill="#f3f5f5"/><text x="338" y="573" font-size="28" fill="#74888d" text-anchor="middle">0</text><rect x="415" y="530" width="116" height="66" fill="#f3f5f5"/><text x="473" y="573" font-size="28" fill="#74888d" text-anchor="middle">0</text><rect x="145" y="610" width="116" height="66" fill="#e1edf0"/><text x="203" y="653" font-size="28" fill="#276a80" text-anchor="middle">0.5</text><rect x="280" y="610" width="116" height="66" fill="#e1edf0"/><text x="338" y="653" font-size="28" fill="#276a80" text-anchor="middle">1</text><rect x="415" y="610" width="116" height="66" fill="#f3f5f5"/><text x="473" y="653" font-size="28" fill="#74888d" text-anchor="middle">0</text><rect x="145" y="690" width="116" height="66" fill="#e1edf0"/><text x="203" y="733" font-size="28" fill="#276a80" text-anchor="middle">0.25</text><rect x="280" y="690" width="116" height="66" fill="#e1edf0"/><text x="338" y="733" font-size="28" fill="#276a80" text-anchor="middle">0.5</text><rect x="415" y="690" width="116" height="66" fill="#e1edf0"/><text x="473" y="733" font-size="28" fill="#276a80" text-anchor="middle">1</text><text x="580" y="650" font-size="38" fill="#19343e" text-anchor="start">×</text><text x="680" y="573" font-size="30" fill="#276a80" text-anchor="middle">1</text><text x="680" y="653" font-size="30" fill="#c2673f" text-anchor="middle">2</text><text x="680" y="733" font-size="30" fill="#5d8c79" text-anchor="middle">0</text><text x="790" y="650" font-size="38" fill="#19343e" text-anchor="start">=</text><text x="930" y="573" font-size="30" fill="#19343e" text-anchor="middle">1</text><text x="930" y="653" font-size="30" fill="#19343e" text-anchor="middle">2.5</text><text x="930" y="733" font-size="30" fill="#19343e" text-anchor="middle">1.25</text><text x="60" y="810" font-size="29" fill="#19343e" text-anchor="start">末状态的来源：0.25 × 1 + 0.5 × 2 + 1 × 0 = 1.25</text></g></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="741" viewBox="26 66 1348 741" role="img"><rect x="26" y="66" width="1348" height="741" fill="#ffffff"/><title>截断可删去相消项，使零梯度变成非零</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245f98"/></marker></defs><rect width="1400" height="800" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<line x1="44" y1="85" x2="1356" y2="85" stroke="#dce5ed" stroke-width="2"/>
<text x="700" y="130" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">h[t] = w(h[t−1] + x[t])；w=1，x[1]=0，x[2]=−2</text>
<circle cx="110" cy="275" r="55" fill="#f4f7fa" stroke="#245f98" stroke-width="2"/>
<text x="110" y="286" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">h0=1</text>
<circle cx="430" cy="275" r="55" fill="#f4f7fa" stroke="#245f98" stroke-width="2"/>
<text x="430" y="286" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">h1=1</text>
<circle cx="790" cy="275" r="55" fill="#f4f7fa" stroke="#245f98" stroke-width="2"/>
<text x="790" y="286" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">h2=−1</text>
<circle cx="1180" cy="275" r="55" fill="#f4f7fa" stroke="#245f98" stroke-width="2"/>
<text x="1180" y="286" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">L=0.5</text>
<line x1="170" y1="275" x2="370" y2="275" stroke="#245f98" stroke-width="3" marker-end="url(#arrow)"/>
<text x="270" y="240" font-size="28" fill="#18324a" text-anchor="middle" font-weight="normal">×w</text>
<line x1="490" y1="275" x2="730" y2="275" stroke="#245f98" stroke-width="3" marker-end="url(#arrow)"/>
<text x="610" y="240" font-size="25" fill="#18324a" text-anchor="middle" font-weight="normal">加 x2，再 ×w</text>
<line x1="850" y1="275" x2="1120" y2="275" stroke="#245f98" stroke-width="3" marker-end="url(#arrow)"/>
<text x="990" y="240" font-size="25" fill="#18324a" text-anchor="middle" font-weight="normal">平方后乘 0.5</text>
<text x="430" y="390" font-size="27" fill="#245f98" text-anchor="middle" font-weight="normal">共享 w：历史路径</text>
<text x="800" y="390" font-size="27" fill="#c76b25" text-anchor="middle" font-weight="normal">共享 w：直接路径</text>
<line x1="220" y1="630" x2="655" y2="630" stroke="#62778a" stroke-width="2"/>
<text x="440" y="465" font-size="29" fill="#18324a" text-anchor="middle" font-weight="normal">完整反向</text>
<rect x="290" y="520" width="105" height="110" rx="7" fill="#c76b25" stroke="#c76b25"/>
<rect x="490" y="630" width="105" height="110" rx="7" fill="#245f98" stroke="#245f98"/>
<text x="342" y="505" font-size="29" fill="#c76b25" text-anchor="middle" font-weight="normal">+1</text>
<text x="542" y="785" font-size="29" fill="#245f98" text-anchor="middle" font-weight="normal">−1</text>
<text x="440" y="590" font-size="27" fill="#18324a" text-anchor="middle" font-weight="normal">总和 0</text>
<line x1="820" y1="630" x2="1260" y2="630" stroke="#62778a" stroke-width="2"/>
<text x="1040" y="465" font-size="29" fill="#18324a" text-anchor="middle" font-weight="normal">在 h1 后 detach</text>
<rect x="875" y="520" width="105" height="110" rx="7" fill="#c76b25" stroke="#c76b25"/>
<rect x="1080" y="630" width="105" height="110" rx="7" fill="white" stroke="#dce5ed"/>
<text x="928" y="505" font-size="29" fill="#c76b25" text-anchor="middle" font-weight="normal">+1</text>
<text x="1132" y="785" font-size="25" fill="#62778a" text-anchor="middle" font-weight="normal">历史项切断</text>
<text x="1040" y="590" font-size="27" fill="#18324a" text-anchor="middle" font-weight="normal">剩余 +1</text></g></svg>

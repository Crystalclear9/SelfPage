<defs><linearGradient id="book-wash-eef4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect x="26" y="60" width="1137" height="720" fill="#ffffff"/><title id="title">序列结束：局部归一化不等于有限长度保证</title><desc id="desc">比较两种结束率：第t步的结束概率分别为1除以(t+1)平方和1除以(t+1)。前者一半概率永不结束；后者几乎必然结束但期望长度无穷。</desc>

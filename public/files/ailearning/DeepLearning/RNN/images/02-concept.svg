<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="809" viewBox="42 73 1196 809" role="img"><rect x="42" y="73" width="1196" height="809" fill="#ffffff"/><title>LSTM：保留、写入与读出是三条不同的通路</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="28" fill="#19343e" text-anchor="start">固定门的标量算例：c(0) = 2</text><text x="95" y="230" font-size="28" fill="#276a80" text-anchor="start">旧状态 2</text><line x1="250" y1="220" x2="345" y2="220" stroke="#276a80" stroke-width="4"/><path d="M334.47,225.75 L345.00,220.00 L334.47,214.25" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="390" cy="220" r="34" fill="#276a80"/><text x="390" y="230" font-size="35" fill="white" text-anchor="middle">×</text><text x="390" y="165" font-size="27" fill="#276a80" text-anchor="middle">遗忘门 0.9</text><line x1="390" y1="175" x2="390" y2="180" stroke="#276a80" stroke-width="4"/><path d="M384.25,169.47 L390.00,180.00 L395.75,169.47" fill="none" stroke="#276a80" stroke-width="4"/><text x="510" y="200" font-size="27" fill="#276a80" text-anchor="middle">1.8</text><line x1="430" y1="220" x2="590" y2="220" stroke="#276a80" stroke-width="4"/><path d="M579.47,225.75 L590.00,220.00 L579.47,214.25" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="630" cy="220" r="34" fill="#19343e"/><text x="630" y="230" font-size="35" fill="white" text-anchor="middle">+</text><line x1="630" y1="365" x2="630" y2="262" stroke="#c2673f" stroke-width="4"/><path d="M635.75,272.53 L630.00,262.00 L624.25,272.53" fill="none" stroke="#c2673f" stroke-width="4"/><text x="630" y="403" font-size="28" fill="#c2673f" text-anchor="middle">0.2 × 0.5 = 0.1</text><text x="630" y="445" font-size="26" fill="#c2673f" text-anchor="middle">输入门 × 候选</text><line x1="670" y1="220" x2="805" y2="220" stroke="#19343e" stroke-width="4"/><path d="M794.47,225.75 L805.00,220.00 L794.47,214.25" fill="none" stroke="#19343e" stroke-width="4"/><text x="740" y="200" font-size="26" fill="#19343e" text-anchor="middle">c(1) = 1.9</text><text x="885" y="230" font-size="27" fill="#19343e" text-anchor="start">tanh → × 0.6</text><line x1="1060" y1="220" x2="1190" y2="220" stroke="#5d8c79" stroke-width="4"/><path d="M1179.47,225.75 L1190.00,220.00 L1179.47,214.25" fill="none" stroke="#5d8c79" stroke-width="4"/><text x="1095" y="290" font-size="27" fill="#5d8c79" text-anchor="middle">h(1) ≈ 0.574</text><line x1="60" y1="490" x2="1220" y2="490" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="540" font-size="29" fill="#19343e" text-anchor="start">总状态接近 1，并不代表初始记忆被完整保留</text><rect x="115" y="600.0" width="70" height="170.0" fill="#276a80"/><rect x="115" y="600.0" width="70" height="0.0" fill="#c2673f"/><text x="150" y="584.0" font-size="26" fill="#19343e" text-anchor="middle">2.000</text><text x="150" y="815" font-size="26" fill="#19343e" text-anchor="middle">t = 0</text><rect x="340" y="617.0" width="70" height="153.0" fill="#276a80"/><rect x="340" y="608.5" width="70" height="8.499999999999998" fill="#c2673f"/><text x="375" y="592.5" font-size="26" fill="#19343e" text-anchor="middle">1.900</text><text x="375" y="815" font-size="26" fill="#19343e" text-anchor="middle">t = 1</text><rect x="565" y="669.6167" width="70" height="100.3833" fill="#276a80"/><rect x="565" y="634.80835" width="70" height="34.80835" fill="#c2673f"/><text x="600" y="618.80835" font-size="26" fill="#19343e" text-anchor="middle">1.590</text><text x="600" y="815" font-size="26" fill="#19343e" text-anchor="middle">t = 5</text><rect x="790" y="710.724665183" width="70" height="59.275334817000015" fill="#276a80"/><rect x="790" y="655.3623325915" width="70" height="55.3623325915" fill="#c2673f"/><text x="825" y="639.3623325915" font-size="26" fill="#19343e" text-anchor="middle">1.349</text><text x="825" y="815" font-size="26" fill="#19343e" text-anchor="middle">t = 10</text><rect x="1015" y="749.3319687196032" width="70" height="20.66803128039679" fill="#276a80"/><rect x="1015" y="674.6659843598015" width="70" height="74.66598435980161" fill="#c2673f"/><text x="1050" y="658.6659843598015" font-size="26" fill="#19343e" text-anchor="middle">1.122</text><text x="1050" y="815" font-size="26" fill="#19343e" text-anchor="middle">t = 20</text><text x="60" y="860" font-size="26" fill="#19343e" text-anchor="start">蓝：初始记忆贡献       橙：后续写入贡献       纵向长度表示状态贡献</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>LSTM 细胞状态的保留与写入</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">LSTM 细胞状态的保留与写入</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">细胞记忆由两条可见贡献相加</text><rect x="120" y="220" width="100" height="260" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="170.0" y="208" font-size="24" fill="#19344d" text-anchor="middle">2</text><text x="170.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">旧状态</text><rect x="255" y="246.0" width="100" height="234.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="305.0" y="234.0" font-size="24" fill="#19344d" text-anchor="middle">1.8</text><text x="305.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">保留项</text><path d="M112,480 L370,480" stroke="#64788b" stroke-width="2" fill="none" /><text x="150" y="165" font-size="25" fill="#19344d" text-anchor="start">遗忘门 0.9</text><rect x="510" y="415.0" width="100" height="65.0" rx="3" fill="#d66b28" stroke="white" stroke-width="2" /><text x="560.0" y="403.0" font-size="24" fill="#19344d" text-anchor="middle">0.5</text><text x="560.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">候选</text><rect x="645" y="467.0" width="100" height="13.0" rx="3" fill="#d66b28" stroke="white" stroke-width="2" /><text x="695.0" y="455.0" font-size="24" fill="#19344d" text-anchor="middle">0.1</text><text x="695.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">写入项</text><path d="M502,480 L760,480" stroke="#64788b" stroke-width="2" fill="none" /><text x="520" y="190" font-size="25" fill="#19344d" text-anchor="start">输入门 0.2</text><rect x="950" y="233.0" width="110" height="247.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="1005.0" y="221.0" font-size="24" fill="#19344d" text-anchor="middle">1.9</text><text x="1005.0" y="512" font-size="24" fill="#19344d" text-anchor="middle">新状态</text><path d="M942,480 L1075,480" stroke="#64788b" stroke-width="2" fill="none" /><text x="820" y="560" font-size="28" fill="#19344d" text-anchor="start">1.8 + 0.1 = 1.9</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 613" role="img" aria-labelledby="title description">
<title id="title">跨批状态必须同时保持实体身份与时间顺序</title>
<desc id="description">第一批结束时 Alice 的状态为一、Bob 为十。新批行顺序交换后，应按实体身份取旧状态。若按行号拼接，会错误得到二十一和十二。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="613" fill="white" stroke="none" stroke-width="1.6"/>
<text x="259" y="64" fill="#212c39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">第一批结束</text>
<text x="869" y="64" fill="#212c39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">第二批交换行顺序</text>
<path d="M74 204l30 -79h298l-30 79Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="175" fill="#176b73" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">Alice</text>
<text x="299" y="175" fill="#176b73" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1</text>
<path d="M74 372l30 -79h298l-30 79Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="343" fill="#a44736" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">Bob</text>
<text x="299" y="343" fill="#a44736" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">10</text>
<path d="M733 204l30 -79h380l-30 79Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="828" y="175" fill="#a44736" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">Bob</text>
<text x="1012" y="175" fill="#a44736" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">10 + 20 = 30</text>
<path d="M733 372l30 -79h380l-30 79Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="828" y="343" fill="#176b73" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">Alice</text>
<text x="1012" y="343" fill="#176b73" font-size="30" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1 + 2 = 3</text>
<path d="M400 165L714.235 327.937" stroke="#176b73" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M724 333 L714.103 321.673L709.04 331.438Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 333L714.235 170.063" stroke="#a44736" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M724 165 L709.04 166.562L714.103 176.327Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<text x="597" y="464" fill="#536777" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">按行号接续时，两条历史被混合</text>
<path d="M234 567l30 -65h243l-30 65Z" stroke="#655281" stroke-width="1.9" fill="url(#wash-v)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="366" y="545" fill="#655281" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1 + 20 = 21</text>
<path d="M706 567l30 -65h243l-30 65Z" stroke="#655281" stroke-width="1.9" fill="url(#wash-v)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="838" y="545" fill="#655281" font-size="32" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">10 + 2 = 12</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img"><title>跨批状态必须同时保持实体身份与时间顺序</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="576" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">跨批状态必须同时保持实体身份与时间顺序</text><text x="40" y="265" font-size="27" fill="#213447">主体甲</text><rect x="210" y="220" width="190" height="95" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="228" y="275" font-size="25" fill="#213447">状态 t1</text><line x1="400" y1="265" x2="490" y2="265" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="500" y="220" width="190" height="95" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="518" y="275" font-size="25" fill="#213447">状态 t2</text><line x1="690" y1="265" x2="780" y2="265" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="790" y="220" width="190" height="95" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="808" y="275" font-size="25" fill="#213447">状态 t3</text><text x="40" y="495" font-size="27" fill="#213447">主体乙</text><rect x="210" y="450" width="190" height="95" rx="8" fill="#dbe9f5" stroke="#94a9bb" /><text x="228" y="505" font-size="25" fill="#213447">状态 t1</text><line x1="400" y1="495" x2="490" y2="495" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="500" y="450" width="190" height="95" rx="8" fill="#dbe9f5" stroke="#94a9bb" /><text x="518" y="505" font-size="25" fill="#213447">状态 t2</text><line x1="690" y1="495" x2="780" y2="495" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><rect x="790" y="450" width="190" height="95" rx="8" fill="#dbe9f5" stroke="#94a9bb" /><text x="808" y="505" font-size="25" fill="#213447">状态 t3</text></g><desc> 状态沿主体身份传递，而非机械沿下一批行号传递。</desc></svg>

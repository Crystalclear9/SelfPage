<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>跨批状态必须同时保持实体身份与时间顺序</title><desc>累计状态h加当前观测。第一批Alice和Bob分别得到1和10，第二批顺序换为Bob和Alice；按实体取状态得到30和3，按行号误传得到21和12。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="55" font-size="34" fill="#233642" text-anchor="start">批次换行之后，状态也必须跟着实体换行</text><text x="48" y="105" font-size="27" fill="#687b86" text-anchor="start">最小累计器：新状态 = 旧状态 + 当前观测；初始状态都为 0。</text><text x="60" y="170" font-size="28" fill="#233642" text-anchor="start">第一批结束</text><text x="660" y="170" font-size="28" fill="#233642" text-anchor="start">第二批输入顺序：Bob → Alice</text><circle cx="90" cy="252" r="13" fill="#246d91" stroke="white" stroke-width="2"/><text x="120" y="260" font-size="30" fill="#246d91" text-anchor="start">Alice：状态 1</text><circle cx="90" cy="382" r="13" fill="#bc5b31" stroke="white" stroke-width="2"/><text x="120" y="390" font-size="30" fill="#bc5b31" text-anchor="start">Bob：状态 10</text><polyline points="330.000,250.000 470.000,250.000 580.000,380.000 640.000,380.000" fill="none" stroke="#246d91" stroke-width="4" stroke-linejoin="round"/><polyline points="330.000,380.000 470.000,380.000 580.000,250.000 640.000,250.000" fill="none" stroke="#bc5b31" stroke-width="4" stroke-linejoin="round"/><text x="665" y="250" font-size="31" fill="#bc5b31" text-anchor="start">Bob：10 + 20 = 30</text><text x="665" y="380" font-size="31" fill="#246d91" text-anchor="start">Alice：1 + 2 = 3</text><line x1="60" y1="450" x2="1140" y2="450" stroke="#dce5e9" stroke-width="2"/><text x="60" y="510" font-size="29" fill="#233642" text-anchor="start">若错误沿行号传递：</text><text x="90" y="570" font-size="29" fill="#bc5b31" text-anchor="start">第 1 行：1 + 20 = 21</text><text x="650" y="570" font-size="29" fill="#246d91" text-anchor="start">第 2 行：10 + 2 = 12</text><text x="60" y="630" font-size="27" fill="#687b86" text-anchor="start">张量形状完全相同，数字也都有限，但两个人的历史已经混在一起。</text><text x="60" y="688" font-size="27" fill="#687b86" text-anchor="start">正确索引来自实体身份；同一实体内还需按时间顺序消费观测。</text></g></svg>

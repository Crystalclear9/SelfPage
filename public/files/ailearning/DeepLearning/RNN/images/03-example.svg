<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">逐步贪心不一定得到最可能序列</title>
<desc id="fig-desc">从起点出发枚举所有带 EOS 的路径。贪心先选 A，但概率最大的完整序列是 B、EOS。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="731" viewBox="42 76 1045 731" role="img"><rect x="42" y="76" width="1045" height="731" fill="#ffffff"/><title>和搜索程序同一棵树：结束符也是路径概率的一部分</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="117" font-size="27" fill="#74888d" text-anchor="start">每条边标条件概率；每个叶子已输出 EOS。无长度归一化，无省略分支。</text><circle cx="80" cy="420" r="9" fill="#74888d"/><text x="96" y="429" font-size="27" fill="#74888d" text-anchor="start">开始</text><circle cx="300" cy="265" r="9" fill="#276a80"/><text x="316" y="274" font-size="27" fill="#276a80" text-anchor="start">A</text><circle cx="300" cy="590" r="9" fill="#c2673f"/><text x="316" y="599" font-size="27" fill="#c2673f" text-anchor="start">B</text><line x1="100" y1="410" x2="285" y2="270" stroke="#276a80" stroke-width="3"/><text x="170" y="317" font-size="28" fill="#276a80" text-anchor="start">0.6</text><line x1="100" y1="435" x2="285" y2="585" stroke="#c2673f" stroke-width="3"/><text x="165" y="542" font-size="28" fill="#c2673f" text-anchor="start">0.4</text><line x1="320" y1="265" x2="605" y2="190" stroke="#276a80" stroke-width="3"/><circle cx="620" cy="190" r="9" fill="#276a80"/><text x="636" y="199" font-size="27" fill="#276a80" text-anchor="start">A, EOS</text><text x="470.0" y="215.5" font-size="27" fill="#276a80" text-anchor="start">0.5</text><line x1="320" y1="265" x2="605" y2="365" stroke="#276a80" stroke-width="3"/><circle cx="620" cy="365" r="9" fill="#276a80"/><text x="636" y="374" font-size="27" fill="#276a80" text-anchor="start">A, C</text><text x="470.0" y="303.0" font-size="27" fill="#276a80" text-anchor="start">0.5</text><line x1="320" y1="590" x2="605" y2="520" stroke="#c2673f" stroke-width="3"/><circle cx="620" cy="520" r="9" fill="#c2673f"/><text x="636" y="529" font-size="27" fill="#c2673f" text-anchor="start">B, EOS</text><text x="470.0" y="543.0" font-size="27" fill="#c2673f" text-anchor="start">0.9</text><line x1="320" y1="590" x2="605" y2="695" stroke="#c2673f" stroke-width="3"/><circle cx="620" cy="695" r="9" fill="#c2673f"/><text x="636" y="704" font-size="27" fill="#c2673f" text-anchor="start">B, C</text><text x="470.0" y="630.5" font-size="27" fill="#c2673f" text-anchor="start">0.1</text><circle cx="935" cy="365" r="9" fill="#276a80"/><text x="951" y="374" font-size="27" fill="#276a80" text-anchor="start">A, C, EOS</text><circle cx="935" cy="695" r="9" fill="#c2673f"/><text x="951" y="704" font-size="27" fill="#c2673f" text-anchor="start">B, C, EOS</text><line x1="735" y1="365" x2="920" y2="365" stroke="#276a80" stroke-width="4"/><path d="M909.47,370.75 L920.00,365.00 L909.47,359.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="825" y="340" font-size="27" fill="#74888d" text-anchor="middle">1.0</text><line x1="735" y1="695" x2="920" y2="695" stroke="#c2673f" stroke-width="4"/><path d="M909.47,700.75 L920.00,695.00 L909.47,689.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="825" y="670" font-size="27" fill="#74888d" text-anchor="middle">1.0</text><text x="935" y="198" font-size="29" fill="#276a80" text-anchor="start">P = 0.30</text><text x="935" y="420" font-size="29" fill="#276a80" text-anchor="start">P = 0.30</text><text x="935" y="528" font-size="29" fill="#c2673f" text-anchor="start">P = 0.36</text><text x="935" y="750" font-size="29" fill="#c2673f" text-anchor="start">P = 0.04</text><text x="60" y="785" font-size="26" fill="#74888d" text-anchor="start">贪心先选 A；A 后平局按代码顺序选 EOS。穷举最优是 B, EOS，概率 0.36。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>贪心局部最优可能错过更高概率序列</title><rect width="1200" height="750" fill="white" /><text x="35" y="50" font-size="32" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">贪心局部最优可能错过更高概率序列</text><rect x="75" y="310" width="130" height="60" rx="9" fill="#e4f1f9" stroke="#7895aa" /><text x="100" y="349" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">起点</text><rect x="395" y="190" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="420" y="229" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">A</text><rect x="395" y="440" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="420" y="479" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">B</text><line x1="205" y1="320" x2="395" y2="220" stroke="#748e9f" stroke-width="3" /><text x="270" y="230" font-size="24" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.6</text><line x1="205" y1="360" x2="395" y2="470" stroke="#748e9f" stroke-width="3" /><text x="270" y="450" font-size="24" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.4</text><rect x="705" y="110" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="730" y="149" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">a</text><line x1="525" y1="220" x2="705" y2="140" stroke="#cf7432" stroke-width="3" /><text x="600" y="168.0" font-size="24" fill="#cf7432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.5</text><text x="875" y="148" font-size="25" fill="#cf7432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">整串概率 0.30</text><rect x="705" y="260" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="730" y="299" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">a′</text><line x1="525" y1="220" x2="705" y2="290" stroke="#748e9f" stroke-width="3" /><text x="600" y="243.0" font-size="24" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.5</text><text x="875" y="298" font-size="25" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">整串概率 0.30</text><rect x="705" y="390" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="730" y="429" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">b</text><line x1="525" y1="470" x2="705" y2="420" stroke="#2865a0" stroke-width="3" /><text x="600" y="433.0" font-size="24" fill="#2865a0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.9</text><text x="875" y="428" font-size="25" fill="#2865a0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">整串概率 0.36</text><rect x="705" y="540" width="130" height="60" rx="9" fill="#eaf2fa" stroke="#7895aa" /><text x="730" y="579" font-size="25" fill="#213447" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">b′</text><line x1="525" y1="470" x2="705" y2="570" stroke="#748e9f" stroke-width="3" /><text x="600" y="508.0" font-size="24" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">0.1</text><text x="875" y="578" font-size="25" fill="#748e9f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">整串概率 0.04</text><desc> 固定生成两步后终止；同层分支互斥，条件概率分别归一化。 贪心先选 A，最佳整串概率 0.30；全局最优 B→b 的概率为 0.4×0.9=0.36。</desc></svg>

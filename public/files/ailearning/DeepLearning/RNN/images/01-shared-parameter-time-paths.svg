" y="935" font-size="28" fill="#246880" text-anchor="start">贡献 0.512</text><line x1="160" y1="960" x2="370" y2="960" stroke="#bd633d" stroke-width="12"/><text x="455" y="885" font-size="27" fill="#246880" text-anchor="start">第 2 处 θ</text><text x="455" y="935" font-size="28" fill="#246880" text-anchor="start">贡献 0.512</text><line x1="455" y1="960" x2="665" y2="960" stroke="#bd633d" stroke-width="12"/><text x="750" y="885" font-size="27" fill="#246880" text-anchor="start">第 3 处 θ</text><text x="750" y="935" font-size="28" fill="#246880" text-anchor="start">贡献 0.512</text><line x1="750" y1="960" x2="960" y2="960" stroke="#bd633d" stroke-width="12"/><text x="1045" y="885" font-size="27" fill="#246880" text-anchor="start">第 4 处 θ</text><text x="1045" y="935" font-size="28" fill="#246880" text-anchor="start">贡献 0.512</text><line x1="1045" y1="960" x2="1255" y2="960" stroke="#bd633d" stroke-width="12"/><text x="125" y="1030" font-size="31" fill="#bd633d" text-anchor="start">四条等长路径相加：0.512 × 4 = 2.048</text><text x="125" y="1080" font-size="26" fill="#7b8c92" text-anchor="start">初态敏感性却是 0.4096：它没有“共享调用次数”这个和</text><text x="1285" y="620" font-size="24" fill="#7b8c92" text-anchor="end">时间步 t</text></g></svg>

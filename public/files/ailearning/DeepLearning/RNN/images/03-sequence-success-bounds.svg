633d" stroke="none"/><text x="610" y="1030" font-size="24" fill="#7b8c92" text-anchor="end">位置 3</text><rect x="650" y="1007" width="600" height="25" fill="#e9f1f4" stroke="none"/><rect x="650" y="1007" width="60.0" height="25" fill="#bd633d" stroke="none"/><text x="125" y="1100" font-size="27" fill="#243c46" text-anchor="start">每条错误带概率都是 0.1；差别在它们是否落在同一批序列上</text><text x="1285" y="620" font-size="24" fill="#7b8c92" text-anchor="end">序列长度 L</text></g></svg>

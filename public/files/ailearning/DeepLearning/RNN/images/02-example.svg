<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="672" viewBox="42 75 1196 672" role="img"><rect x="42" y="75" width="1196" height="672" fill="#ffffff"/><title>GRU 重置门的位置，为什么不能随意交换？</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="116" font-size="27" fill="#74888d" text-anchor="start">与本节代码同一反例：U = [[1, 2], [3, 4]]，h = (2, −1)，r = (0.2, 0.8)</text><text x="60" y="177" font-size="27" fill="#74888d" text-anchor="start">只比较候选的循环线性部分：无偏置、尚未通过 tanh</text><text x="60" y="257" font-size="31" fill="#276a80" text-anchor="start">先重置，再混合</text><text x="60" y="330" font-size="31" fill="#19343e" text-anchor="start">(2, −1)</text><line x1="250" y1="320" x2="380" y2="320" stroke="#276a80" stroke-width="4"/><path d="M369.47,325.75 L380.00,320.00 L369.47,314.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="305" y="290" font-size="26" fill="#276a80" text-anchor="middle">乘 r</text><text x="405" y="330" font-size="31" fill="#276a80" text-anchor="start">(0.4, −0.8)</text><line x1="640" y1="320" x2="770" y2="320" stroke="#276a80" stroke-width="4"/><path d="M759.47,325.75 L770.00,320.00 L759.47,314.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="705" y="290" font-size="26" fill="#276a80" text-anchor="middle">乘 U</text><text x="800" y="330" font-size="31" fill="#276a80" text-anchor="start">(−1.2, −2.0)</text><line x1="60" y1="390" x2="1220" y2="390" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="464" font-size="31" fill="#c2673f" text-anchor="start">先混合，再重置</text><text x="60" y="537" font-size="31" fill="#19343e" text-anchor="start">(2, −1)</text><line x1="250" y1="527" x2="380" y2="527" stroke="#c2673f" stroke-width="4"/><path d="M369.47,532.75 L380.00,527.00 L369.47,521.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="305" y="497" font-size="26" fill="#c2673f" text-anchor="middle">乘 U</text><text x="405" y="537" font-size="31" fill="#c2673f" text-anchor="start">(0, 2)</text><line x1="640" y1="527" x2="770" y2="527" stroke="#c2673f" stroke-width="4"/><path d="M759.47,532.75 L770.00,527.00 L759.47,521.25" fill="none" stroke="#c2673f" stroke-width="4"/><text x="705" y="497" font-size="26" fill="#c2673f" text-anchor="middle">乘 r</text><text x="800" y="537" font-size="31" fill="#c2673f" text-anchor="start">(0, 1.6)</text><line x1="60" y1="610" x2="1220" y2="610" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="665" font-size="29" fill="#19343e" text-anchor="start">前者按输入坐标筛选；后者按混合后的候选坐标筛选。</text><text x="60" y="722" font-size="27" fill="#74888d" text-anchor="start">U × diag(r) 与 diag(r) × U 一般不同；加上候选偏置后还需继续核对。</text></g></svg>

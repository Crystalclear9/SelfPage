<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1071" height="573" viewBox="17 69 1071 573" role="img"><rect x="17" y="69" width="1071" height="573" fill="#ffffff"/><title id="figure-title">遗忘门小于 1，不代表完整状态一定收缩</title><desc id="figure-desc">遗忘门小于 1，不代表完整状态一定收缩</desc><rect width="1200" height="670" fill="white"/><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0"/></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="110" font-size="27" fill="#213447" text-anchor="start" font-weight="400">零状态；固定 f=0.99、i=o=0.5，g=tanh(8h旧)</text><circle cx="130" cy="200" r="43" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="130" y="210" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">c旧</text><circle cx="130" cy="420" r="43" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="130" y="430" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h旧</text><circle cx="545" cy="200" r="43" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="545" y="210" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">c新</text><circle cx="545" cy="420" r="43" fill="white" stroke="#2865a0" stroke-width="2.5"/><text x="545" y="430" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h新</text><line x1="190" y1="200" x2="485" y2="200" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="340" y="175" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">×0.99</text><line x1="175" y1="390" x2="495" y2="235" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)"/><text x="285" y="310" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">×4</text><line x1="545" y1="260" x2="545" y2="360" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="565" y="320" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">×0.5</text><text x="925" y="148" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">完整状态雅可比 J</text><text x="865" y="205" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">c旧</text><text x="1000" y="205" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">h旧</text><text x="745" y="262" font-size="25" fill="#213447" text-anchor="start" font-weight="400">c新</text><text x="745" y="342" font-size="25" fill="#213447" text-anchor="start" font-weight="400">h新</text><rect x="805" y="220" width="129" height="74" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="869.5" y="267.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.99</text><rect x="940" y="220" width="129" height="74" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="1004.5" y="267.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">4</text><rect x="805" y="300" width="129" height="74" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="869.5" y="347.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">0.495</text><rect x="940" y="300" width="129" height="74" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1"/><text x="1004.5" y="347.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">2</text><text x="600" y="555" font-size="30" fill="#cf7432" text-anchor="middle" font-weight="400">J × (2,1) = (5.98,2.99) = 2.99 × (2,1)</text><text x="600" y="620" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">直接保留系数小于 1，完整状态仍存在放大方向。</text></g></svg>

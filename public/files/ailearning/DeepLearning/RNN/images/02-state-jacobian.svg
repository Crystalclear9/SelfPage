"74" rx="5" fill="url(#book-wash-eaf2fa)" stroke="#c6d8e5" stroke-width="1"/><text x="869.5" y="347.0" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">0.495</text><rect x="940" y="300" width="129" height="74" rx="5" fill="url(#book-wash-eaf2fa)" stroke="#c6d8e5" stroke-width="1"/><text x="1004.5" y="347.0" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">2</text><text x="600" y="555" font-size="30" fill="#cb7436" text-anchor="middle" font-weight="400">J × (2,1) = (5.98,2.99) = 2.99 × (2,1)</text><text x="600" y="620" font-size="29" fill="#1f3449" text-anchor="middle" font-weight="400">直接保留系数小于 1，完整状态仍存在放大方向。</text></g></svg></svg>

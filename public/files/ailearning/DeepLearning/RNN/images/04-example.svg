<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="933.1171" viewBox="0 0 1440 933.1171" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">重叠预测窗口共享未来标签</title><rect width="1440" height="933.1171" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">重叠预测窗口共享未来标签</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="791.1171" viewBox="42 75 1196 704" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="75" width="1196" height="704" fill="#ffffff"/><title>预测起点与目标时间：同一未来值怎样被预测两次？</title><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="116" font-size="27" fill="#769099" text-anchor="start">本章约定：起点 t 的历史只到 t−1；三步目标为 [t, t+3)</text><text x="440" y="190" font-size="29" fill="#769099" text-anchor="middle">t</text><text x="625" y="190" font-size="29" fill="#769099" text-anchor="middle">t+1</text><text x="810" y="190" font-size="29" fill="#769099" text-anchor="middle">t+2</text><text x="995" y="190" font-size="29" fill="#769099" text-anchor="middle">t+3</text><text x="60" y="309" font-size="31" fill="#1a2b3d" text-anchor="start">起点 t</text><rect x="370" y="255" width="140" height="88" fill="#d6e8ee"/><text x="440" y="310" font-size="27" fill="#257190" text-anchor="middle">第 1 步</text><rect x="555" y="255" width="140" height="88" fill="#f2dfd2"/><text x="625" y="310" font-size="27" fill="#bf6d42" text-anchor="middle">第 2 步</text><rect x="740" y="255" width="140" height="88" fill="#f2dfd2"/><text x="810" y="310" font-size="27" fill="#bf6d42" text-anchor="middle">第 3 步</text><text x="995" y="310" font-size="28" fill="#769099" text-anchor="middle">—</text><text x="60" y="484" font-size="31" fill="#1a2b3d" text-anchor="start">起点 t+1</text><text x="440" y="485" font-size="28" fill="#769099" text-anchor="middle">—</text><rect x="555" y="430" width="140" height="88" fill="#f2dfd2"/><text x="625" y="485" font-size="27" fill="#bf6d42" text-anchor="middle">第 1 步</text><rect x="740" y="430" width="140" height="88" fill="#f2dfd2"/><text x="810" y="485" font-size="27" fill="#bf6d42" text-anchor="middle">第 2 步</text><rect x="925" y="430" width="140" height="88" fill="#d6e8ee"/><text x="995" y="485" font-size="27" fill="#257190" text-anchor="middle">第 3 步</text><line x1="625" y1="345" x2="625" y2="425" stroke="#bf6d42" stroke-width="3"/><line x1="810" y1="345" x2="810" y2="425" stroke="#bf6d42" stroke-width="3"/><line x1="60" y1="585" x2="1220" y2="585" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="645" font-size="29" fill="#bf6d42" text-anchor="start">实际时间 t+1：起点 t 的第 2 步，也是起点 t+1 的第 1 步。</text><text x="60" y="702" font-size="27" fill="#1a2b3d" text-anchor="start">这是两个不同信息条件的预测；可以都评价，但不能自动当作独立证据。</text><text x="60" y="757" font-size="26" fill="#769099" text-anchor="start">图中的目标从 t 开始，保持与正文滑窗索引和训练截止条件一致。</text></g></svg></svg>

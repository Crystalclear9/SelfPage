<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img"><title>预测起点与目标时间：同一未来值怎样被预测两次？</title><rect width="1280" height="790" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">预测起点与目标时间：同一未来值怎样被预测两次？</text><text x="60" y="116" font-size="27" fill="#74888d" text-anchor="start">本章约定：起点 t 的历史只到 t−1；三步目标为 [t, t+3)</text><text x="440" y="190" font-size="29" fill="#74888d" text-anchor="middle">t</text><text x="625" y="190" font-size="29" fill="#74888d" text-anchor="middle">t+1</text><text x="810" y="190" font-size="29" fill="#74888d" text-anchor="middle">t+2</text><text x="995" y="190" font-size="29" fill="#74888d" text-anchor="middle">t+3</text><text x="60" y="309" font-size="31" fill="#19343e" text-anchor="start">起点 t</text><rect x="370" y="255" width="140" height="88" fill="#d6e8ee"/><text x="440" y="310" font-size="27" fill="#276a80" text-anchor="middle">第 1 步</text><rect x="555" y="255" width="140" height="88" fill="#f3dfd1"/><text x="625" y="310" font-size="27" fill="#c2673f" text-anchor="middle">第 2 步</text><rect x="740" y="255" width="140" height="88" fill="#f3dfd1"/><text x="810" y="310" font-size="27" fill="#c2673f" text-anchor="middle">第 3 步</text><text x="995" y="310" font-size="28" fill="#74888d" text-anchor="middle">—</text><text x="60" y="484" font-size="31" fill="#19343e" text-anchor="start">起点 t+1</text><text x="440" y="485" font-size="28" fill="#74888d" text-anchor="middle">—</text><rect x="555" y="430" width="140" height="88" fill="#f3dfd1"/><text x="625" y="485" font-size="27" fill="#c2673f" text-anchor="middle">第 1 步</text><rect x="740" y="430" width="140" height="88" fill="#f3dfd1"/><text x="810" y="485" font-size="27" fill="#c2673f" text-anchor="middle">第 2 步</text><rect x="925" y="430" width="140" height="88" fill="#d6e8ee"/><text x="995" y="485" font-size="27" fill="#276a80" text-anchor="middle">第 3 步</text><line x1="625" y1="345" x2="625" y2="425" stroke="#c2673f" stroke-width="3"/><line x1="810" y1="345" x2="810" y2="425" stroke="#c2673f" stroke-width="3"/><line x1="60" y1="585" x2="1220" y2="585" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="645" font-size="29" fill="#c2673f" text-anchor="start">实际时间 t+1：起点 t 的第 2 步，也是起点 t+1 的第 1 步。</text><text x="60" y="702" font-size="27" fill="#19343e" text-anchor="start">这是两个不同信息条件的预测；可以都评价，但不能自动当作独立证据。</text><text x="60" y="757" font-size="26" fill="#74888d" text-anchor="start">图中的目标从 t 开始，保持与正文滑窗索引和训练截止条件一致。</text></g></svg>

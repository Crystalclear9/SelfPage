<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="925.2508" viewBox="0 0 1440 925.2508" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">截断反向传播切断梯度而不必清空状态</title><rect width="1440" height="925.2508" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">截断反向传播切断梯度而不必清空状态</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="783.2508" viewBox="42 75 1196 697" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="75" width="1196" height="697" fill="#ffffff"/><title>前向值完全相同：截断改变的是哪一项导数？</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="27" fill="#769099" text-anchor="start">h(t) = w × h(t−1) + x(t)，w = 0.5，输入 (1, 2, 3)，h(0) = 0</text><circle cx="110" cy="245" r="28" fill="#257190"/><text x="110" y="255" font-size="26" fill="white" text-anchor="middle">0</text><text x="110" y="185" font-size="28" fill="#257190" text-anchor="middle">h0</text><line x1="148" y1="245" x2="352" y2="245" stroke="#257190" stroke-width="4"/><path d="M341.47,250.75 L352.00,245.00 L341.47,239.25" fill="none" stroke="#257190" stroke-width="4"/><text x="250.0" y="300" font-size="26" fill="#769099" text-anchor="middle">×0.5，+1</text><circle cx="390" cy="245" r="28" fill="#257190"/><text x="390" y="255" font-size="26" fill="white" text-anchor="middle">1</text><text x="390" y="185" font-size="28" fill="#257190" text-anchor="middle">h1</text><line x1="428" y1="245" x2="632" y2="245" stroke="#257190" stroke-width="4"/><path d="M621.47,250.75 L632.00,245.00 L621.47,239.25" fill="none" stroke="#257190" stroke-width="4"/><text x="530.0" y="300" font-size="26" fill="#769099" text-anchor="middle">×0.5，+2</text><circle cx="670" cy="245" r="28" fill="#257190"/><text x="670" y="255" font-size="26" fill="white" text-anchor="middle">2.5</text><text x="670" y="185" font-size="28" fill="#257190" text-anchor="middle">h2</text><line x1="708" y1="245" x2="912" y2="245" stroke="#257190" stroke-width="4"/><path d="M901.47,250.75 L912.00,245.00 L901.47,239.25" fill="none" stroke="#257190" stroke-width="4"/><text x="810.0" y="300" font-size="26" fill="#769099" text-anchor="middle">×0.5，+3</text><circle cx="950" cy="245" r="28" fill="#257190"/><text x="950" y="255" font-size="26" fill="white" text-anchor="middle">4.25</text><text x="950" y="185" font-size="28" fill="#257190" text-anchor="middle">h3</text><text x="60" y="365" font-size="29" fill="#1a2b3d" text-anchor="start">损失 L = 0.5 × h3²；反向伴随从末步 4.25 开始</text><text x="390" y="440" font-size="27" fill="#257190" text-anchor="middle">g(h1) = 1.0625</text><line x1="625" y1="468" x2="455" y2="468" stroke="#bf6d42" stroke-width="4"/><path d="M465.53,462.25 L455.00,468.00 L465.53,473.75" fill="none" stroke="#bf6d42" stroke-width="4"/><text x="670" y="440" font-size="27" fill="#257190" text-anchor="middle">g(h2) = 2.125</text><line x1="905" y1="468" x2="735" y2="468" stroke="#bf6d42" stroke-width="4"/><path d="M745.53,462.25 L735.00,468.00 L745.53,473.75" fill="none" stroke="#bf6d42" stroke-width="4"/><text x="950" y="440" font-size="27" fill="#257190" text-anchor="middle">g(h3) = 4.25</text><line x1="60" y1="490" x2="1220" y2="490" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="545" font-size="29" fill="#1a2b3d" text-anchor="start">共享 w 的贡献</text><text x="60" y="599" font-size="27" fill="#257190" text-anchor="start">第 2 步：2.125 × 1 = 2.125</text><text x="60" y="648" font-size="27" fill="#bf6d42" text-anchor="start">第 3 步：4.25 × 2.5 = 10.625</text><rect x="670" y="570" width="74.375" height="38" fill="#257190"/><rect x="744.375" y="570" width="371.875" height="38" fill="#bf6d42"/><text x="670" y="658" font-size="29" fill="#1a2b3d" text-anchor="start">完整梯度 12.75</text><text x="60" y="750" font-size="29" fill="#bf6d42" text-anchor="start">若在 h2 后 detach：h3 仍是 4.25，但只留下第 3 步的 10.625。</text></g></svg></svg>

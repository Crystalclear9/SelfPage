<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title id="figure-title">截断反向：保留状态数值，切断历史</title><desc id="figure-desc">截断反向：保留状态数值，切断历史</desc><rect width="1200" height="590" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">截断反向：保留状态数值，切断历史</text><text x="310" y="115" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">片段 A</text><text x="850" y="115" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">片段 B</text><circle cx="150" cy="250" r="43" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="150" y="260" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h1</text><circle cx="390" cy="250" r="43" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="390" y="260" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h2</text><circle cx="750" cy="250" r="43" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="750" y="260" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h3</text><circle cx="990" cy="250" r="43" fill="white" stroke="#2865a0" stroke-width="2.5" /><text x="990" y="260" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">h4</text><line x1="205" y1="250" x2="335" y2="250" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="445" y1="250" x2="695" y2="250" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="805" y1="250" x2="935" y2="250" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><line x1="570" y1="150" x2="570" y2="420" stroke="#cf7432" stroke-width="3" stroke-dasharray="6 5" /><text x="570" y="465" font-size="29" fill="#cf7432" text-anchor="middle" font-weight="400">detach 边界</text><line x1="990" y1="365" x2="750" y2="365" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><line x1="705" y1="365" x2="590" y2="365" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="860" y="420" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">片段 B 的反向</text><text x="570" y="535" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">数值状态继续传递，梯度历史在边界切断。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>低秩分数经过 softmax，不再保证相同的秩</title><rect width="1280" height="650" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">低秩分数经过 softmax，不再保证相同的秩</text><text x="60" y="115" font-size="27" fill="#19343e" text-anchor="start">两条标量查询 q = (0, 1)，两条标量键 k = (0, 1)</text><text x="85" y="180" font-size="29" fill="#19343e" text-anchor="start">分数 S = q × k 的转置</text><rect x="85" y="205" width="104" height="82" fill="#edf4f5"/><text x="137" y="257" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="195" y="205" width="104" height="82" fill="#edf4f5"/><text x="247" y="257" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="85" y="293" width="104" height="82" fill="#edf4f5"/><text x="137" y="345" font-size="28" fill="#19343e" text-anchor="middle">0</text><rect x="195" y="293" width="104" height="82" fill="#edf4f5"/><text x="247" y="345" font-size="28" fill="#19343e" text-anchor="middle">1</text><line x1="355" y1="280" x2="540" y2="280" stroke="#276a80" stroke-width="4"/><path d="M529.47,285.75 L540.00,280.00 L529.47,274.25" fill="none" stroke="#276a80" stroke-width="4"/><text x="368" y="245" font-size="26" fill="#19343e" text-anchor="start">逐行 softmax</text><text x="650" y="180" font-size="29" fill="#19343e" text-anchor="start">权重 A</text><rect x="650" y="205" width="104" height="82" fill="#edf4f5"/><text x="702" y="257" font-size="28" fill="#19343e" text-anchor="middle">0.5</text><rect x="760" y="205" width="104" height="82" fill="#edf4f5"/><text x="812" y="257" font-size="28" fill="#19343e" text-anchor="middle">0.5</text><rect x="650" y="293" width="104" height="82" fill="#edf4f5"/><text x="702" y="345" font-size="28" fill="#19343e" text-anchor="middle">0.2689</text><rect x="760" y="293" width="104" height="82" fill="#edf4f5"/><text x="812" y="345" font-size="28" fill="#19343e" text-anchor="middle">0.7311</text><text x="85" y="455" font-size="28" fill="#276a80" text-anchor="start">det(S) = 0，rank(S) = 1</text><text x="650" y="455" font-size="28" fill="#c2673f" text-anchor="start">det(A) ≈ 0.2311 &gt; 0</text><text x="650" y="500" font-size="30" fill="#c2673f" text-anchor="start">rank(A) = 2</text><line x1="60" y1="540" x2="1210" y2="540" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="590" font-size="28" fill="#19343e" text-anchor="start">点积因子分解限制分数矩阵；逐行非线性改变其代数结构。</text></g></svg>

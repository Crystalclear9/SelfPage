<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>用未来干预检验目标因果掩码</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#18364e">用未来干预检验目标因果掩码</text><rect x="40.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="400.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="760.0" y="115.0" width="356.0" height="121.0" rx="6" fill="#cce2f2" stroke="#7895aa" /><rect x="40.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="400.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="760.0" y="240.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="40.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="400.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="760.0" y="365.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="40.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="400.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><rect x="760.0" y="490.0" width="356.0" height="121.0" rx="6" fill="#edf5fa" stroke="#7895aa" /><text x="53.0" y="150.0" font-size="23" fill="#143651">实验</text><text x="413.0" y="150.0" font-size="23" fill="#143651">应保持不变</text><text x="773.0" y="150.0" font-size="23" fill="#143651">允许变化</text><text x="53.0" y="275.0" font-size="23" fill="#143651">改变未来目标 token</text><text x="413.0" y="275.0" font-size="23" fill="#143651">更早位置的输出</text><text x="773.0" y="275.0" font-size="23" fill="#143651">该位置及后续输出</text><text x="53.0" y="400.0" font-size="23" fill="#143651">改变源 token</text><text x="413.0" y="400.0" font-size="23" fill="#143651">不要求目标输出不变</text><text x="773.0" y="400.0" font-size="23" fill="#143651">所有依赖源的目标输出</text><text x="53.0" y="525.0" font-size="23" fill="#143651">改变源填充区</text><text x="413.0" y="525.0" font-size="23" fill="#143651">有效目标输出</text><text x="773.0" y="525.0" font-size="23" fill="#143651">仅无效或被屏蔽位置</text></g><text x="105" y="657" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">前提：固定模型、关闭随机性；源编码器与交叉注意力都正确屏蔽填充键。</text><text x="105" y="691" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">更改填充值时保持位置、长度、有效性掩码不变；否则无法要求输出不变。</text></svg>

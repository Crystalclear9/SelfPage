<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="853.1637" viewBox="0 0 1440 853.1637" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两类接近并列的logits在极小扰动后交换最大类别</title><rect width="1440" height="853.1637" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两类接近并列的logits在极小扰动后交换最大类别</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="711.1637" viewBox="42 75 1081 572" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="75" width="1081" height="572" fill="#ffffff"/><title>量化后是否换答案，要同时看扰动与原始裕量</title><rect width="1280" height="680" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="115" font-size="26" fill="#1a2b3d" text-anchor="start">沿用代码中的两类 logits；仅放大展示接近并列的区域。</text><text x="60" y="175" font-size="29" fill="#1a2b3d" text-anchor="start">原始：类 2 领先 0.00001</text><line x1="190" y1="395.0000000000555" x2="480" y2="395.0000000000555" stroke="#dfe4eb" stroke-width="2"/><text x="175" y="403.0000000000555" font-size="24" fill="#769099" text-anchor="end">1.00000</text><line x1="190" y1="344.99999999972243" x2="480" y2="344.99999999972243" stroke="#dfe4eb" stroke-width="2"/><text x="175" y="352.99999999972243" font-size="24" fill="#769099" text-anchor="end">1.00001</text><line x1="190" y1="295.00000000049965" x2="480" y2="295.00000000049965" stroke="#dfe4eb" stroke-width="2"/><text x="175" y="303.00000000049965" font-size="24" fill="#769099" text-anchor="end">1.00002</text><circle cx="270" cy="395.0000000000555" r="10" fill="#257190"/><line x1="270" y1="470" x2="270" y2="395.0000000000555" stroke="#257190" stroke-width="4"/><text x="270" y="515" font-size="27" fill="#257190" text-anchor="middle">类 1</text><circle cx="425" cy="344.99999999972243" r="10" fill="#bf6d42"/><line x1="425" y1="470" x2="425" y2="344.99999999972243" stroke="#bf6d42" stroke-width="4"/><text x="425" y="515" font-size="27" fill="#bf6d42" text-anchor="middle">类 2</text><text x="685" y="175" font-size="29" fill="#1a2b3d" text-anchor="start">扰动后：类 1 领先 0.00003</text><line x1="815" y1="395.0000000000555" x2="1105" y2="395.0000000000555" stroke="#dfe4eb" stroke-width="2"/><text x="800" y="403.0000000000555" font-size="24" fill="#769099" text-anchor="end">1.00000</text><line x1="815" y1="344.99999999972243" x2="1105" y2="344.99999999972243" stroke="#dfe4eb" stroke-width="2"/><text x="800" y="352.99999999972243" font-size="24" fill="#769099" text-anchor="end">1.00001</text><line x1="815" y1="295.00000000049965" x2="1105" y2="295.00000000049965" stroke="#dfe4eb" stroke-width="2"/><text x="800" y="303.00000000049965" font-size="24" fill="#769099" text-anchor="end">1.00002</text><circle cx="895" cy="295.00000000049965" r="10" fill="#257190"/><line x1="895" y1="470" x2="895" y2="295.00000000049965" stroke="#257190" stroke-width="4"/><text x="895" y="515" font-size="27" fill="#257190" text-anchor="middle">类 1</text><circle cx="1050" cy="444.99999999983345" r="10" fill="#bf6d42"/><line x1="1050" y1="470" x2="1050" y2="444.99999999983345" stroke="#bf6d42" stroke-width="4"/><text x="1050" y="515" font-size="27" fill="#bf6d42" text-anchor="middle">类 2</text><text x="60" y="570" font-size="26" fill="#1a2b3d" text-anchor="start">扰动为 (+0.00002, −0.00002)，最大绝对扰动 δ = 0.00002。</text><text x="60" y="625" font-size="28" fill="#bf6d42" text-anchor="start">充分条件 m &gt; 2δ 未满足；误差很小仍能交换类别排序。</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="826" viewBox="42 78 1196 826" role="img"><rect x="42" y="78" width="1196" height="826" fill="#ffffff"/><title>长度变长时，算术量与缓存沿不同规律增长</title><rect width="1280" height="920" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="28" fill="#19343e" text-anchor="start">固定 B = 1，d = 32，FFN 宽度 128；乘加计 2 FLOPs</text><text x="60" y="175" font-size="27" fill="#19343e" text-anchor="start">每层前向主算术量：投影 + FFN 为线性项；稠密注意力为平方项</text><text x="70" y="268" font-size="28" fill="#19343e" text-anchor="start">T = 32</text><rect x="265" y="230" width="43.25376" height="48" fill="#276a80"/><rect x="308.25376" y="230" width="7.20896" height="48" fill="#c2673f"/><text x="333.46272" y="265" font-size="27" fill="#19343e" text-anchor="start">0.92 M</text><text x="70" y="378" font-size="28" fill="#19343e" text-anchor="start">T = 64</text><rect x="265" y="340" width="86.50752" height="48" fill="#276a80"/><rect x="351.50752" y="340" width="28.83584" height="48" fill="#c2673f"/><text x="398.34336" y="375" font-size="27" fill="#19343e" text-anchor="start">2.10 M</text><text x="70" y="488" font-size="28" fill="#19343e" text-anchor="start">T = 128</text><rect x="265" y="450" width="173.01504" height="48" fill="#276a80"/><rect x="438.01504" y="450" width="115.34336" height="48" fill="#c2673f"/><text x="571.3584000000001" y="485" font-size="27" fill="#19343e" text-anchor="start">5.24 M</text><text x="70" y="598" font-size="28" fill="#19343e" text-anchor="start">T = 256</text><rect x="265" y="560" width="346.03008" height="48" fill="#276a80"/><rect x="611.03008" y="560" width="461.37344" height="48" fill="#c2673f"/><text x="1090.40352" y="595" font-size="27" fill="#19343e" text-anchor="start">14.68 M</text><text x="270" y="690" font-size="27" fill="#276a80" text-anchor="start">蓝：投影与 FFN</text><text x="760" y="690" font-size="27" fill="#c2673f" text-anchor="start">橙：两次注意力矩阵乘</text><line x1="60" y1="725" x2="1220" y2="725" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="780" font-size="28" fill="#19343e" text-anchor="start">两层 float32 KV 缓存：每个位置固定占 512 字节</text><text x="230" y="835" font-size="27" fill="#19343e" text-anchor="middle">T 32</text><text x="230" y="885" font-size="30" fill="#276a80" text-anchor="middle">16 KiB</text><text x="510" y="835" font-size="27" fill="#19343e" text-anchor="middle">T 64</text><text x="510" y="885" font-size="30" fill="#276a80" text-anchor="middle">32 KiB</text><text x="790" y="835" font-size="27" fill="#19343e" text-anchor="middle">T 128</text><text x="790" y="885" font-size="30" fill="#276a80" text-anchor="middle">64 KiB</text><text x="1070" y="835" font-size="27" fill="#19343e" text-anchor="middle">T 256</text><text x="1070" y="885" font-size="30" fill="#276a80" text-anchor="middle">128 KiB</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>缓存能否复用？先检查旧位置的输出是否改变</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19333c" text-anchor="start">缓存能否复用？先检查旧位置的输出是否改变</text><text x="60" y="115" font-size="26" fill="#74858a" text-anchor="start">单层注意力；所有可见分数均为 0，值依次为 1、3，再追加 8</text><text x="100" y="190" font-size="30" fill="#256b82" text-anchor="start">因果读取</text><text x="100" y="245" font-size="27" fill="#19333c" text-anchor="start">前缀 1、3</text><rect x="100" y="280" width="90" height="70" fill="#dbecef"/><text x="145" y="326" font-size="30" fill="#19333c" text-anchor="middle">1</text><rect x="220" y="280" width="90" height="70" fill="#dbecef"/><text x="265" y="326" font-size="30" fill="#19333c" text-anchor="middle">2</text><text x="100" y="405" font-size="27" fill="#19333c" text-anchor="start">追加 8 后</text><rect x="100" y="440" width="90" height="70" fill="#dbecef"/><text x="145" y="486" font-size="30" fill="#19333c" text-anchor="middle">1</text><rect x="220" y="440" width="90" height="70" fill="#dbecef"/><text x="265" y="486" font-size="30" fill="#19333c" text-anchor="middle">2</text><rect x="340" y="440" width="90" height="70" fill="#dbecef"/><text x="385" y="486" font-size="30" fill="#19333c" text-anchor="middle">4</text><text x="100" y="595" font-size="27" fill="#256b82" text-anchor="start">旧位置仍为 1、2</text><text x="720" y="190" font-size="30" fill="#c0643c" text-anchor="start">双向读取</text><text x="720" y="245" font-size="27" fill="#19333c" text-anchor="start">前缀 1、3</text><rect x="720" y="280" width="90" height="70" fill="#f3ddd0"/><text x="765" y="326" font-size="30" fill="#19333c" text-anchor="middle">2</text><rect x="840" y="280" width="90" height="70" fill="#f3ddd0"/><text x="885" y="326" font-size="30" fill="#19333c" text-anchor="middle">2</text><text x="720" y="405" font-size="27" fill="#19333c" text-anchor="start">追加 8 后</text><rect x="720" y="440" width="90" height="70" fill="#f3ddd0"/><text x="765" y="486" font-size="30" fill="#19333c" text-anchor="middle">4</text><rect x="840" y="440" width="90" height="70" fill="#f3ddd0"/><text x="885" y="486" font-size="30" fill="#19333c" text-anchor="middle">4</text><rect x="960" y="440" width="90" height="70" fill="#f3ddd0"/><text x="1005" y="486" font-size="30" fill="#19333c" text-anchor="middle">4</text><text x="720" y="595" font-size="27" fill="#c0643c" text-anchor="start">旧位置由 2、2 变为 4、4</text><text x="60" y="680" font-size="26" fill="#19333c" text-anchor="start">每个输出都是合法值的平均；因果结构保持旧表示，双向结构重新读取新增内容。</text><text x="60" y="735" font-size="25" fill="#74858a" text-anchor="start">真实多层网络逐层检查同一不变性；还要固定位置编码、模型状态与掩码。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="593" viewBox="0 0 1200 593" role="img"><title>KV 缓存的有效性依赖历史表示不变</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="593" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="32" fill="#213447">KV 缓存的有效性依赖历史表示不变</text><line x1="275" y1="280.0" x2="275" y2="396.4" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)" /><line x1="870" y1="280.0" x2="870" y2="396.4" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)" /><line x1="485" y1="484.0" x2="652" y2="484.0" stroke="#748e9f" stroke-width="3" marker-end="url(#arr)" /><rect x="65" y="124.0" width="420" height="156.0" rx="6" fill="#e4f1f9" stroke="#7895aa" /><text x="81" y="203.2" font-size="24" fill="#213447">前缀 A、B 的 K/V</text><rect x="660" y="124.0" width="420" height="156.0" rx="6" fill="#eaf2fa" stroke="#7895aa" /><text x="676" y="203.2" font-size="24" fill="#213447">追加新 token C</text><rect x="65" y="406.0" width="420" height="156.0" rx="6" fill="#fff0db" stroke="#7895aa" /><text x="81" y="485.2" font-size="24" fill="#213447">历史 K/V 原样复用</text><rect x="660" y="406.0" width="420" height="156.0" rx="6" fill="#eee4f3" stroke="#7895aa" /><text x="676" y="485.2" font-size="24" fill="#213447">只计算 C 的增量 K/V</text></g></svg>

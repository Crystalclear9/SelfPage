" font-weight="400">•</text><text x="868" y="216" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">K3</text><rect x="832" y="235" width="72" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="868.0" y="277.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">•</text><text x="946" y="216" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">K4</text><rect x="910" y="235" width="72" height="65" rx="5" fill="#eaf2fa" stroke="#c8d7e3" stroke-width="1" /><text x="946.0" y="277.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">•</text><text x="1024" y="216" font-size="27" fill="#213447" text-anchor="middle" font-weight="400">K5</text><rect x="988" y="235" width="72" height="65" rx="5" fill="#fff0e3" stroke="#c8d7e3" stroke-width="1" /><text x="1024.0" y="277.5" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">•</text><text x="643" y="277" font-size="27" fill="#213447" text-anchor="end" font-weight="400">Q5</text><line x1="678" y1="334" x2="978" y2="334" stroke="#2865a0" stroke-width="3" /><text x="828" y="373" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">复用 4 份历史 K、V</text><text x="1060" y="373" font-size="26" fill="#cf7432" text-anchor="middle" font-weight="400">新增 1 份</text><text x="890" y="466" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">新查询只与 5 个键配对</text><text x="600" y="546" font-size="27" fill="#647789" text-anchor="middle" font-weight="400">同一头的配对计数，不等于总运行时间或必须物化的显存</text></g></svg>

<text x="77" y="612" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">原因是第二个过滤器看到的概率分母不同。</text>

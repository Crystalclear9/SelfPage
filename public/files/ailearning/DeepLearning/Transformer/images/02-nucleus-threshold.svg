<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1217.2" viewBox="0 0 1440 1217.2" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">Top-p在累计质量越过阈值时保留边界项并重新归一化</title><rect width="1440" height="1217.2" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">Top-p在累计质量越过阈值时保留边界项并重新归一化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1075.2" viewBox="0 0 1400 1120" role="img" x="48" y="106" overflow="hidden"><title>Top-p 选择完整词元；过滤器顺序会改变支持集</title><rect width="1400" height="1120" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#20354a" text-anchor="start">Top-p 选择完整词元；过滤器顺序会改变支持集</text><text x="125" y="125" font-size="29" fill="#20354a" text-anchor="start">原概率：A 0.55，B 0.30，C 0.10，D 0.05</text><rect x="125" y="175" width="605.0" height="80" fill="#226f90" stroke="none"/><rect x="730.0" y="175" width="330.0" height="80" fill="#ba6940" stroke="none"/><rect x="1060.0" y="175" width="110.0" height="80" fill="#4c9590" stroke="none"/><rect x="1170.0" y="175" width="55.0" height="80" fill="#7d949d" stroke="none"/><text x="125" y="290" font-size="25" fill="#7d949d" text-anchor="middle">0</text><text x="730" y="290" font-size="25" fill="#7d949d" text-anchor="middle">0.55</text><text x="1060" y="290" font-size="25" fill="#7d949d" text-anchor="middle">0.85</text><text x="1225" y="290" font-size="25" fill="#7d949d" text-anchor="middle">1</text><line x1="1005" y1="155" x2="1005" y2="270" stroke="#20354a" stroke-width="3"/><text x="1005" y="325" font-size="27" fill="#20354a" text-anchor="middle">阈值 0.80 落在 B 内，仍保留整个 B</text><text x="125" y="405" font-size="29" fill="#20354a" text-anchor="start">保留 A、B 后重新归一：</text><text x="665" y="395" font-size="29" fill="#226f90" text-anchor="middle">11</text><line x1="635" y1="405" x2="695" y2="405" stroke="#226f90" stroke-width="2"/><text x="665" y="439" font-size="29" fill="#226f90" text-anchor="middle">17</text><text x="1010" y="395" font-size="29" fill="#ba6940" text-anchor="middle">6</text><line x1="980" y1="405" x2="1040" y2="405" stroke="#ba6940" stroke-width="2"/><text x="1010" y="439" font-size="29" fill="#ba6940" text-anchor="middle">17</text><text x="125" y="535" font-size="30" fill="#20354a" text-anchor="start">把 top-p 改为 0.60：同样两个参数，次序不同</text><text x="125" y="625" font-size="29" fill="#20354a" text-anchor="start">先 top-k = 2，再 top-p = 0.60</text><rect x="125" y="660" width="1100" height="65" fill="#226f90" stroke="none"/><text x="125" y="770" font-size="27" fill="#20354a" text-anchor="start">A 归一后已占约 0.647，超过 0.60；最终只剩 A</text><text x="125" y="855" font-size="29" fill="#20354a" text-anchor="start">先 top-p = 0.60，再 top-k = 2</text><rect x="125" y="890" width="711.7647058823529" height="65" fill="#226f90" stroke="none"/><rect x="836.7647058823529" y="890" width="388.2352941176471" height="65" fill="#ba6940" stroke="none"/><text x="125" y="1000" font-size="27" fill="#20354a" text-anchor="start">原分布 A 仅占 0.55，需要连 B 一起保留；最终仍有 A、B</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img"><title>Top-p：跨过阈值的那一项也必须保留</title><rect width="1280" height="690" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">Top-p：跨过阈值的那一项也必须保留</text><text x="60" y="118" font-size="26" fill="#19343e" text-anchor="start">原分布 A = 0.55，B = 0.30，C = 0.10，D = 0.05；阈值 p = 0.80</text><rect x="90" y="205" width="583.0" height="95" fill="#276a80"/><text x="381.5" y="263" font-size="32" fill="white" text-anchor="middle">A</text><rect x="673.0" y="205" width="318.0" height="95" fill="#5d8c79"/><text x="832.0" y="263" font-size="32" fill="white" text-anchor="middle">B</text><rect x="991.0" y="205" width="106.0" height="95" fill="#c8d9dd"/><text x="1044.0" y="263" font-size="32" fill="#19343e" text-anchor="middle">C</text><rect x="1097.0" y="205" width="53.0" height="95" fill="#e4ebed"/><text x="1123.5" y="263" font-size="32" fill="#19343e" text-anchor="middle">D</text><line x1="90" y1="307" x2="90" y2="320" stroke="#74888d" stroke-width="2"/><text x="90" y="352" font-size="25" fill="#19343e" text-anchor="middle">0</text><line x1="673.0" y1="307" x2="673.0" y2="320" stroke="#74888d" stroke-width="2"/><text x="673.0" y="352" font-size="25" fill="#19343e" text-anchor="middle">0.55</text><line x1="991.0" y1="307" x2="991.0" y2="320" stroke="#74888d" stroke-width="2"/><text x="991.0" y="352" font-size="25" fill="#19343e" text-anchor="middle">0.85</text><line x1="1150" y1="307" x2="1150" y2="320" stroke="#74888d" stroke-width="2"/><text x="1150" y="352" font-size="25" fill="#19343e" text-anchor="middle">1</text><line x1="938.0" y1="168" x2="938.0" y2="315" stroke="#c2673f" stroke-width="4"/><text x="938.0" y="158" font-size="27" fill="#c2673f" text-anchor="middle">0.80</text><text x="90" y="420" font-size="28" fill="#19343e" text-anchor="start">A 单独只有 0.55；加入 B 才达到 0.85 ≥ 0.80。</text><text x="90" y="470" font-size="28" fill="#19343e" text-anchor="start">保留 A、B，删除 C、D，再除以保留质量 0.85。</text><line x1="90" y1="510" x2="1150" y2="510" stroke="#dbe5e8" stroke-width="2"/><text x="115" y="580" font-size="30" fill="#276a80" text-anchor="start">A：</text><text x="650" y="580" font-size="30" fill="#5d8c79" text-anchor="start">B：</text><text x="90" y="640" font-size="26" fill="#19343e" text-anchor="start">阈值作用于截断前的累计质量；采样使用重新归一化后的概率。</text><text x="240" y="557" font-size="27" text-anchor="middle" fill="#19343e">11</text><line x1="215" y1="565" x2="265" y2="565" stroke="#19343e" stroke-width="2"/><text x="240" y="595" font-size="27" text-anchor="middle" fill="#19343e">17</text><text x="290" y="580" font-size="29" fill="#19343e">≈ 0.6471</text><text x="775" y="557" font-size="27" text-anchor="middle" fill="#19343e">6</text><line x1="750" y1="565" x2="800" y2="565" stroke="#19343e" stroke-width="2"/><text x="775" y="595" font-size="27" text-anchor="middle" fill="#19343e">17</text><text x="825" y="580" font-size="29" fill="#19343e">≈ 0.3529</text></g></svg>

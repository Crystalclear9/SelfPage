<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1181" height="617" viewBox="42 80 1181 617" role="img"><rect x="42" y="80" width="1181" height="617" fill="#ffffff"/><title>同样正常结束：次序错误与计数错误要分开看</title><rect width="1280" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="26" fill="#19343e" text-anchor="start">本章固定划分与种子下的真实生成错例；EOS 表示模型自行结束。</text><text x="60" y="211" font-size="28" fill="#19343e" text-anchor="start">源</text><rect x="310" y="165" width="120" height="76" fill="#edf4f5"/><text x="370" y="214" font-size="30" fill="#276a80" text-anchor="middle">3</text><rect x="445" y="165" width="120" height="76" fill="#edf4f5"/><text x="505" y="214" font-size="30" fill="#276a80" text-anchor="middle">4</text><rect x="580" y="165" width="120" height="76" fill="#edf4f5"/><text x="640" y="214" font-size="30" fill="#276a80" text-anchor="middle">4</text><rect x="715" y="165" width="120" height="76" fill="#edf4f5"/><text x="775" y="214" font-size="30" fill="#276a80" text-anchor="middle">5</text><text x="60" y="306" font-size="28" fill="#19343e" text-anchor="start">正确目标</text><rect x="310" y="260" width="120" height="76" fill="#edf4f5"/><text x="370" y="309" font-size="30" fill="#276a80" text-anchor="middle">5</text><rect x="445" y="260" width="120" height="76" fill="#edf4f5"/><text x="505" y="309" font-size="30" fill="#276a80" text-anchor="middle">4</text><rect x="580" y="260" width="120" height="76" fill="#edf4f5"/><text x="640" y="309" font-size="30" fill="#276a80" text-anchor="middle">4</text><rect x="715" y="260" width="120" height="76" fill="#edf4f5"/><text x="775" y="309" font-size="30" fill="#276a80" text-anchor="middle">3</text><rect x="850" y="260" width="120" height="76" fill="#edf4f5"/><text x="910" y="309" font-size="30" fill="#276a80" text-anchor="middle">EOS</text><text x="60" y="401" font-size="28" fill="#19343e" text-anchor="start">实际生成</text><rect x="310" y="355" width="120" height="76" fill="#edf4f5"/><text x="370" y="404" font-size="30" fill="#c2673f" text-anchor="middle">5</text><rect x="445" y="355" width="120" height="76" fill="#edf4f5"/><text x="505" y="404" font-size="30" fill="#c2673f" text-anchor="middle">4</text><rect x="580" y="355" width="120" height="76" fill="#faeee7"/><text x="640" y="404" font-size="30" fill="#c2673f" text-anchor="middle">3</text><rect x="715" y="355" width="120" height="76" fill="#faeee7"/><text x="775" y="404" font-size="30" fill="#c2673f" text-anchor="middle">4</text><rect x="850" y="355" width="120" height="76" fill="#edf4f5"/><text x="910" y="404" font-size="30" fill="#c2673f" text-anchor="middle">EOS</text><text x="310" y="470" font-size="27" fill="#c2673f" text-anchor="start">长度正确，结束正确；第 3、4 个符号次序错误。</text><line x1="60" y1="505" x2="1205" y2="505" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="555" font-size="27" fill="#19343e" text-anchor="start">另一条源：(3, 3, 3)</text><text x="60" y="610" font-size="27" fill="#276a80" text-anchor="start">正确：(3, 3, 3, EOS)</text><text x="650" y="610" font-size="27" fill="#c2673f" text-anchor="start">生成：(3, 3, 3, 3, EOS)</text><text x="60" y="675" font-size="29" fill="#19343e" text-anchor="start">十九条全部在预算内结束，仍只有十一条整条精确匹配。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="601" viewBox="0 0 1200 601" role="img"><title>无位置编码的自注意力对重新编号等变</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="601" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">无位置编码的自注意力对重新编号等变</text><rect x="150" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#94a9bb" /><text x="218" y="220" font-size="30" fill="#213447">A</text><rect x="150" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="218" y="540" font-size="30" fill="#213447">C</text><line x1="230" y1="255" x2="580" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /><rect x="500" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#94a9bb" /><text x="568" y="220" font-size="30" fill="#213447">B</text><rect x="500" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="568" y="540" font-size="30" fill="#213447">A</text><line x1="580" y1="255" x2="930" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /><rect x="850" y="170" width="160" height="80" rx="8" fill="#e7f2fa" stroke="#94a9bb" /><text x="918" y="220" font-size="30" fill="#213447">C</text><rect x="850" y="490" width="160" height="80" rx="8" fill="#d9eee8" stroke="#94a9bb" /><text x="918" y="540" font-size="30" fill="#213447">B</text><line x1="930" y1="255" x2="230" y2="480" stroke="#6c9bac" stroke-width="3" marker-end="url(#arr)" /></g><desc> 全连接、无位置项且关闭随机性：输入与输出按同一置换重排。 有掩码时须同步置换掩码；只重排内容并固定因果掩码，通常不成立。</desc></svg>

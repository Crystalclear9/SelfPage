<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="799" viewBox="42 108 1196 799" role="img"><rect x="42" y="108" width="1196" height="799" fill="#ffffff"/><title>移位监督与缓存追加：跟踪真正被处理的位置</title><rect width="1280" height="920" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="315" y="150" font-size="30" fill="#276a80" text-anchor="middle">A</text><line x1="315" y1="175" x2="315" y2="225" stroke="#74888d" stroke-width="4"/><path d="M309.25,214.47 L315.00,225.00 L320.75,214.47" fill="none" stroke="#74888d" stroke-width="4"/><text x="315" y="265" font-size="30" fill="#c2673f" text-anchor="middle">B</text><text x="535" y="150" font-size="30" fill="#276a80" text-anchor="middle">B</text><line x1="535" y1="175" x2="535" y2="225" stroke="#74888d" stroke-width="4"/><path d="M529.25,214.47 L535.00,225.00 L540.75,214.47" fill="none" stroke="#74888d" stroke-width="4"/><text x="535" y="265" font-size="30" fill="#c2673f" text-anchor="middle">C</text><text x="755" y="150" font-size="30" fill="#276a80" text-anchor="middle">C</text><line x1="755" y1="175" x2="755" y2="225" stroke="#74888d" stroke-width="4"/><path d="M749.25,214.47 L755.00,225.00 L760.75,214.47" fill="none" stroke="#74888d" stroke-width="4"/><text x="755" y="265" font-size="30" fill="#c2673f" text-anchor="middle">D</text><text x="975" y="150" font-size="30" fill="#276a80" text-anchor="middle">D</text><line x1="975" y1="175" x2="975" y2="225" stroke="#74888d" stroke-width="4"/><path d="M969.25,214.47 L975.00,225.00 L980.75,214.47" fill="none" stroke="#74888d" stroke-width="4"/><text x="975" y="265" font-size="30" fill="#c2673f" text-anchor="middle">EOS</text><text x="60" y="150" font-size="28" fill="#19343e" text-anchor="start">训练输入</text><text x="60" y="265" font-size="28" fill="#19343e" text-anchor="start">监督目标</text><line x1="60" y1="305" x2="1220" y2="305" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="360" font-size="28" fill="#19343e" text-anchor="start">推理：已处理 A、B、C；现在处理 D，得到预测下一词的分布</text><text x="320" y="425" font-size="30" fill="#276a80" text-anchor="middle">A</text><rect x="250" y="450" width="140" height="65" fill="#e5eff1"/><text x="320" y="492" font-size="26" fill="#276a80" text-anchor="middle">k 0</text><text x="320" y="550" font-size="27" fill="#276a80" text-anchor="middle">v 2</text><text x="320" y="615" font-size="26" fill="#276a80" text-anchor="middle">权重 0.1</text><text x="540" y="425" font-size="30" fill="#276a80" text-anchor="middle">B</text><rect x="470" y="450" width="140" height="65" fill="#e5eff1"/><text x="540" y="492" font-size="26" fill="#276a80" text-anchor="middle">k ln 2</text><text x="540" y="550" font-size="27" fill="#276a80" text-anchor="middle">v 4</text><text x="540" y="615" font-size="26" fill="#276a80" text-anchor="middle">权重 0.2</text><text x="760" y="425" font-size="30" fill="#276a80" text-anchor="middle">C</text><rect x="690" y="450" width="140" height="65" fill="#e5eff1"/><text x="760" y="492" font-size="26" fill="#276a80" text-anchor="middle">k ln 3</text><text x="760" y="550" font-size="27" fill="#276a80" text-anchor="middle">v 8</text><text x="760" y="615" font-size="26" fill="#276a80" text-anchor="middle">权重 0.3</text><text x="980" y="425" font-size="30" fill="#c2673f" text-anchor="middle">D</text><rect x="910" y="450" width="140" height="65" fill="#f9e9df"/><text x="980" y="492" font-size="26" fill="#c2673f" text-anchor="middle">k ln 4</text><text x="980" y="550" font-size="27" fill="#c2673f" text-anchor="middle">v 10</text><text x="980" y="615" font-size="26" fill="#c2673f" text-anchor="middle">权重 0.4</text><text x="60" y="492" font-size="28" fill="#19343e" text-anchor="start">K 缓存</text><text x="60" y="550" font-size="28" fill="#19343e" text-anchor="start">V 缓存</text><text x="60" y="690" font-size="28" fill="#19343e" text-anchor="start">新查询 q = 1 → 分数 (0, ln 2, ln 3, ln 4)</text><text x="60" y="750" font-size="28" fill="#19343e" text-anchor="start">归一化指数 (1, 2, 3, 4) → 权重 (0.1, 0.2, 0.3, 0.4)</text><text x="60" y="810" font-size="28" fill="#19343e" text-anchor="start">读取 = 0.1×2 + 0.2×4 + 0.3×8 + 0.4×10 = 7.4</text><text x="60" y="885" font-size="28" fill="#c2673f" text-anchor="start">抽出下一词之后，它尚无自己的 KV；需在下一次前向中处理它。</text></g></svg>

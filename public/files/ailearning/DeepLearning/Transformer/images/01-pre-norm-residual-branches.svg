<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="620" viewBox="0 0 1370 620" role="img" aria-labelledby="label detail"><title id="label">两处归一化都在侧支</title><desc id="detail">主路经过两次残差相加。每个侧支先归一化，再做注意力或 MLP。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1370" height="620" fill="white" stroke="none" stroke-width="1.6"/><circle cx="107" cy="211" r="32" stroke="#202a37" fill="url(#wash-ink)" stroke-width="2"/><text x="107" y="221.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">x</text><circle cx="639" cy="211" r="32" stroke="#202a37" fill="url(#wash-ink)" stroke-width="2"/><text x="639" y="221.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">x′</text><circle cx="1192" cy="211" r="32" stroke="#202a37" fill="url(#wash-ink)" stroke-width="2"/><text x="1192" y="221.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">y</text><line x1="147" y1="211" x2="599" y2="211" stroke="#202a37" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 161 216 L 161 397 L 209 397" stroke="#196f77" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><polygon points="224,433 325,433 347,361 246,361" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><text x="285.5" y="407.08" fill="#196f77" font-size="28" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">LN</text><line x1="357" y1="397" x2="395" y2="397" stroke="#196f77" stroke-width="1.8" stroke-li
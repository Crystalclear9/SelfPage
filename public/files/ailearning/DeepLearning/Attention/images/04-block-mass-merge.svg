<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="725" viewBox="0 0 1360 725" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">分块读值要按各块指数质量合并</title>
  <desc id="plate-desc">块 1 的质量为 0.75、加权和为 2.5。块 2 的质量为 1、加权和为 8。正确合并后为 6，等权平均只在两块质量相同时正确。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="725" fill="white" stroke="none" stroke-width="0"/>
  <text x="335" y="64" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">先把块均值拆回分子与分母</text>
  <text x="149" y="177" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">块 1</text>
  <rect x="241" y="142" width="182.25" height="44" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.4"/>
  <text x="506" y="174" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">0.75</text>
  <text x="322" y="232" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">加权和</text>
  <text x="448" y="232" font-size="26" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">2.5</text>
  <text x="149" y="338" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">块 2</text>
  <rect x="241" y="303" width="243" height="44" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.4"/>
  <text x="506" y="335" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">1</text>
  <text x="322" y="393" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">加权和</text>
  <text x="448" y="393" font-size="26" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">8</text>
  <polyline points="97,428 618,428" fill="none" stroke="#d4e0e4" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="145" y="507" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">合并读取</text>
  <text x="325" y="489" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">2.5 + 8</text>
  <polyline points="259.5,496 390.5,496" fill="none" stroke="#196f77" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="325" y="524" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">0.75 + 1</text>
  <text x="470" y="507" font-size="29" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">= 6</text>
  <text x="324" y="605" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">条长只表示指数质量。</text>
  <text x="1035" y="64" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">质量比例决定该读哪个位置</text>
  <polyline points="808,506 1310,506" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <polyline points="811,509 811,116" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="810" y="99" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="start">读取值</text>
  <text x="1060.5" y="571" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">第二块的质量比例</text>
  <polyline points="811,506 811,512" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="811" y="539" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <polyline points="1045,506 1045,512" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1045" y="539" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0.5</text>
  <polyline points="1279,506 1279,512" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1279" y="539" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <polyline points="805,506 811,506" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="513" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">3</text>
  <polyline points="805,436 811,436" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="443" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">4</text>
  <polyline points="805,366 811,366" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="373" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">5</text>
  <polyline points="805,296 811,296" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="303" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">6</text>
  <polyline points="805,226 811,226" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="233" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">7</text>
  <polyline points="805,156 811,156" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="799" y="163" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">8</text>
  <polyline points="811,482.66667 1279,156" fill="none" stroke="#196f77" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="811,319.33333 1279,319.33333" fill="none" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
  <circle cx="1078.4286" cy="296" r="6" fill="#196f77" stroke="#196f77" stroke-width="1.6"/>
  <text x="1095.4286" y="276" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">6</text>
  <circle cx="1045" cy="319.33333" r="5" fill="white" stroke="#a84b3b" stroke-width="1.6"/>
  <text x="1190" y="355.33333" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">等权平均</text>
  <text x="680" y="680" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">块内输出固定。右图只改变两块之间的相对质量。</text>
</svg>

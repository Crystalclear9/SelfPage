<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="746" viewBox="0 0 1360 746" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">只有合法值会进入分子和分母</title>
  <desc id="plate-desc">左图使用相同的可见分数，四行分别读取合法前缀的平均。右图只改变第四个值，第三个输出始终为 5。</desc>
  <defs>

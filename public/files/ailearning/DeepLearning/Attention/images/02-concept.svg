  <polyline points="784,260 790,260" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="778" y="267" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">20</text>
  <polyline points="784,137 790,137" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="778" y="144" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">30</text>

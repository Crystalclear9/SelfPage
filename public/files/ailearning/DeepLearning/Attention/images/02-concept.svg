  <text x="344" y="545" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">上方数值是被读取的值</text>
  <text x="337" y="594" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">青色点可见，灰色点被屏蔽。</text>

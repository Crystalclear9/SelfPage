<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title id="figure-title">RoPE：共同位移不变，相对位移改变点积</title><desc id="figure-desc">RoPE：共同位移不变，相对位移改变点积</desc><rect width="1200" height="600" fill="white" /><defs><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="47" font-size="32" fill="#213447" text-anchor="start" font-weight="600">RoPE：共同位移不变，相对位移改变点积</text><text x="600" y="102" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">同一二维频率块；每个位置旋转 30°</text><text x="210" y="155" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">原位置：m=0，n=0</text><circle cx="210" cy="285" r="104" fill="white" stroke="#c8d7e3" stroke-width="2" /><line x1="90" y1="285" x2="330" y2="285" stroke="#c8d7e3" stroke-width="2" /><line x1="210" y1="165" x2="210" y2="405" stroke="#c8d7e3" stroke-width="2" /><line x1="210" y1="285" x2="300.06664199358164" y2="233.0" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><text x="308.06664199358164" y="221.0" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">q</text><line x1="210" y1="285" x2="210.0" y2="181.0" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="218.0" y="169.0" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">k</text><path d="M247.23909236273087,263.5 A43,43 0 0 0 210.0,242.0" fill="none" stroke="#cf7432" stroke-width="2" /><text x="210" y="446" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">相对角 60°</text><text x="210" y="491" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">点积 0.5</text><text x="600" y="155" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">共同移一格：m=1，n=1</text><circle cx="600" cy="285" r="104" fill="white" stroke="#c8d7e3" stroke-width="2" /><line x1="480" y1="285" x2="720" y2="285" stroke="#c8d7e3" stroke-width="2" /><line x1="600" y1="165" x2="600" y2="405" stroke="#c8d7e3" stroke-width="2" /><line x1="600" y1="285" x2="652.0" y2="194.9333580064184" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><text x="660.0" y="182.9333580064184" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">q</text><line x1="600" y1="285" x2="548.0" y2="194.93335800641836" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="540.0" y="182.93335800641836" font-size="28" fill="#cf7432" text-anchor="end" font-weight="400">k</text><path d="M621.5,247.76090763726916 A43,43 0 0 0 578.5,247.76090763726913" fill="none" stroke="#cf7432" stroke-width="2" /><text x="600" y="446" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">相对角 60°</text><text x="600" y="491" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">点积 0.5</text><text x="990" y="155" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">只移动键：m=0，n=2</text><circle cx="990" cy="285" r="104" fill="white" stroke="#c8d7e3" stroke-width="2" /><line x1="870" y1="285" x2="1110" y2="285" stroke="#c8d7e3" stroke-width="2" /><line x1="990" y1="165" x2="990" y2="405" stroke="#c8d7e3" stroke-width="2" /><line x1="990" y1="285" x2="1080.0666419935817" y2="233.0" stroke="#2865a0" stroke-width="2.5" marker-end="url(#blue-arrow)" /><text x="1088.0666419935817" y="221.0" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">q</text><line x1="990" y1="285" x2="899.9333580064184" y2="233.0" stroke="#cf7432" stroke-width="2.5" marker-end="url(#orange-arrow)" /><text x="891.9333580064184" y="221.0" font-size="28" fill="#cf7432" text-anchor="end" font-weight="400">k</text><path d="M1027.2390923627308,263.5 A43,43 0 0 0 952.7609076372692,263.5" fill="none" stroke="#cf7432" stroke-width="2" /><text x="990" y="446" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">相对角 120°</text><text x="990" y="491" font-size="30" fill="#cf7432" text-anchor="middle" font-weight="400">点积 −0.5</text><text x="600" y="565" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">共同旋转可消去；改变相对位置会改变分数</text></g></svg>

00" fill="none" stroke="#276a80" stroke-width="4"/><path d="M360.00,345.00 L430.00,345.00 L430.00,500.00 L950.00,500.00 L950.00,320.00 L990.00,320.00" fill="none" stroke="#c2673f" stroke-width="4"/><path d="M978.00,314.00 L990.00,320.00 L978.00,326.00" fill="none" stroke="#c2673f" stroke-width="4"/><text x="450" y="255" font-size="27" fill="#19343e" text-anchor="start">先拆末维</text><text x="440" y="415" font-size="26" fill="#19343e" text-anchor="start">再交换位置轴与头轴</text><line x1="60" y1="525" x2="1220" y2="525" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="585" font-size="29" fill="#19343e" text-anchor="start">合头：先移回位置轴，再拼接该位置的两组通道</text><rect x="415" y="625" width="70" height="65" fill="#d9e8ef"/><text x="450" y="668" font-size="30" fill="#19343e" text-anchor="middle">6</text><rect x="490" y="625" width="70" height="65" fill="#d9e8ef"/><text x="525" y="668" font-size="30" fill="#19343e" text-anchor="middle">7</text><rect x="565" y="625" width="70" height="65" fill="#d9e8ef"/><text x="600" y="668" font-size="30" fill="#19343e" text-anchor="middle">8</text><rect x="640" y="625" width="70" height="65" fill="#f4decf"/><text x="675" y="668" font-size="30" fill="#19343e" text-anchor="middle">9</text><rect x="715" y="625" width="70" height="65" fill="#f4decf"/><text x="750" y="668" font-size="30" fill="#19343e" text-anchor="middle">10</text><rect x="790" y="625" width="70" height="65" fill="#f4decf"/><text x="825" y="668" font-size="30" fill="#19343e" text-anchor="middle">11</text><text x="60" y="670" font-size="29" fill="#19343e" text-anchor="start">位置 2</text><text x="60" y="765" font-size="27" fill="#c2673f" text-anchor="start">直接 reshape 的头 1 第二行：</text><rect x="670" y="725" width="65" height="60" fill="#f4decf"/><text x="703" y="765" font-size="29" fill="#c2673f" text-anchor="middle">3</text><rect x="740" y="725" width="65" height="60" fill="#f4decf"/><text x="773" y="765" font-size="29" fill="#c2673f" text-anchor="middle">4</text><rect x="810" y="725" width="65" height="60" fill="#f4decf"/><text x="843" y="765" font-size="29" fill="#c2673f" text-anchor="middle">5</text><text x="930" y="765" font-size="28" fill="#c2673f" text-anchor="start">≠ (6, 7, 8)</text><text x="60" y="850" font-size="27" fill="#19343e" text-anchor="start">拆头没有生成新信息；它重组已有通道，不能让一个位置冒充另一个位置。</text></g></svg>

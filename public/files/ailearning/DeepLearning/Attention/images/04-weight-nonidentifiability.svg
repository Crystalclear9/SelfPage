<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>权重不同，读取输出仍然相同</title><rect width="1200" height="850" fill="white" /><text x="40" y="54" font-size="32" fill="#18364b">权重不同，读取输出仍然相同</text><text x="40" y="94" font-size="22" fill="#18364b">固定三个标量值 v = (−1, 0, 1)；两组权重均严格为正且和为 1。</text><rect x="25" y="125" width="560" height="400" rx="16" fill="white" stroke="#d8e2e8" /><text x="49" y="168" font-size="27" fill="#18364b">A  中心位置权重较大</text><line x1="90" y1="440" x2="535" y2="440" stroke="#9aafbb" stroke-width="2" /><text x="50" y="210" font-size="20" fill="#18364b">权重</text><rect x="130" y="345.0" width="68" height="95.0" rx="5" fill="#15998b" /><text x="164" y="330.0" font-size="24" fill="#18364b" text-anchor="middle">0.25</text><text x="164" y="479" font-size="23" fill="#18364b" text-anchor="middle">v1=−1</text><rect x="275" y="250.0" width="68" height="190.0" rx="5" fill="#15998b" /><text x="309" y="235.0" font-size="24" fill="#18364b" text-anchor="middle">0.5</text><text x="309" y="479" font-size="23" fill="#18364b" text-anchor="middle">v2=0</text><rect x="420" y="345.0" width="68" height="95.0" rx="5" fill="#15998b" /><text x="454" y="330.0" font-size="24" fill="#18364b" text-anchor="middle">0.25</text><text x="454" y="479" font-size="23" fill="#18364b" text-anchor="middle">v3=1</text><rect x="615" y="125" width="560" height="400" rx="16" fill="white" stroke="#d8e2e8" /><text x="639" y="168" font-size="27" fill="#18364b">B  两端位置权重较大</text><line x1="680" y1="440" x2="1125" y2="440" stroke="#9aafbb" stroke-width="2" /><text x="640" y="210" font-size="20" fill="#18364b">权重</text><rect x="720" y="288.0" width="68" height="152.0" rx="5" fill="#d88739" /><text x="754" y="273.0" font-size="24" fill="#18364b" text-anchor="middle">0.4</text><text x="754" y="479" font-size="23" fill="#18364b" text-anchor="middle">v1=−1</text><rect x="865" y="364.0" width="68" height="76.0" rx="5" fill="#d88739" /><text x="899" y="349.0" font-size="24" fill="#18364b" text-anchor="middle">0.2</text><text x="899" y="479" font-size="23" fill="#18364b" text-anchor="middle">v2=0</text><rect x="1010" y="288.0" width="68" height="152.0" rx="5" fill="#d88739" /><text x="1044" y="273.0" font-size="24" fill="#18364b" text-anchor="middle">0.4</text><text x="1044" y="479" font-size="23" fill="#18364b" text-anchor="middle">v3=1</text><rect x="25" y="550" width="1150" height="270" rx="16" fill="white" stroke="#d8e2e8" /><text x="49" y="593" font-size="27" fill="#18364b">C  相同输出不能反推出唯一的注意力权重</text><text x="55" y="641" font-size="27" fill="#18364b">A：0.25 × (−1) + 0.50 × 0 + 0.25 × 1 = 0</text><text x="55" y="690" font-size="27" fill="#18364b">B：0.40 × (−1) + 0.20 × 0 + 0.40 × 1 = 0</text><text x="55" y="746" font-size="23" fill="#18364b">两组均可由 logits = log(权重) 经 softmax 得到；并非只能靠零权重实现。</text><text x="55" y="784" font-size="23" fill="#18364b">这里固定值向量与单次读取；不声称任意网络、任意输入都具有同样的不唯一性。</text></svg>

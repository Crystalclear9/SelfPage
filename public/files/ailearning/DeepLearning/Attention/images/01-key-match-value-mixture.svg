<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc"><title id="title">键空间匹配，值空间合成</title><desc id="desc">左侧的查询和三个等长键形成分数；右侧按同样顺序读取值并加权，输出在三角形凸包内。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="620" fill="white" stroke="none" stroke-width="1.55"/><text x="294" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">键空间内比较</text><text x="1019" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">值空间内合成</text><line x1="130" y1="443" x2="401" y2="443" stroke="#202a37" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="411" y="460" fill="#202a37" font-size="29" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">q</text><line x1="130" y1="443" x2="367.2185" y2="413.8732" stroke="#196f77" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="378.1738" y="397.142" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">k1</text><line x1="130" y1="443" x2="298.9985" y2="274.0015" stroke="#655184" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="308.2412" y="253.7588" fill="#655184" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">k2</text><line x1="130" y1="443" x2="105.0177" y2="205.3093" stroke="#a84b3b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-coral)"/><text x="109.3905" y="183.3421" fill="#a84b3b" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">k3</text><polygon points="861,446 1185,409 1042,153" fill="none" stroke="#657682" stroke-width="1.5" stroke-linejoin="round"/><circle cx="861" cy="446" r="7" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><text x="861" y="488" fill="#196f77" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">v1</text><circle cx="1185" cy="409" r="7" stroke="#655184" stroke-width="1.7" fill="#655184"/><text x="1185" y="451" fill="#655184" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">v2</text><circle cx="1042" cy="153" r="7" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><text x="1042" y="195" fill="#a84b3b" font-size="27" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">v3</text><line x1="872.0902" y1="441.4165" x2="995.6626" y2="390.345" stroke="#196f77" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="1173.101" y1="407.4487" x2="1018.652" y2="387.3128" stroke="#655184" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="1040.203" y1="164.8647" x2="1008.549" y2="373.8967" stroke="#a84b3b" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-coral)"/><circle cx="1006.753" cy="385.7615" r="8" stroke="#655184" stroke-width="1.7" fill="#655184"/><text x="1024.753" y="372.7615" fill="#655184" font-size="28" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">合成输出</text><line x1="527" y1="313" x2="733" y2="313" stroke="#657682" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-gray)"/><text x="632" y="276" fill="#202a37" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">得到权重</text><text x="684" y="572" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">键和值
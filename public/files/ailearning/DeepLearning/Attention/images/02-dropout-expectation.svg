<rect x="26" y="59" width="1117" height="692" fill="#ffffff"/><title id="title">注意力Dropout的四种结果</title><desc id="desc">两条权重0.25和0.75，值1和3，独立丢弃概率0.5；缩放后输出0、0.5、4.5、5各等概率，期望2.5。</desc>

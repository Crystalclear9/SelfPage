<rect x="44" y="652" width="1112" height="91" rx="12" fill="#eef4f9" stroke="none"/>
<text x="66" y="690" font-size="27" fill="#213447" text-anchor="start" font-weight="400">若再除以随机行和，并把空行置零：输出变为 0、1、3、2.5。</text>
<text x="66" y="726" font-size="27" fill="#213447" text-anchor="start" font-weight="400">新期望为 1.625，已经不是原来的 Dropout 算子。</text>

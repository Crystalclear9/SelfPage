<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1114.649" viewBox="0 0 1440 1114.649" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">局部窗口用稀疏连接改变可见图</title><rect width="1440" height="1114.649" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">局部窗口用稀疏连接改变可见图</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="972.649" viewBox="30 64 1017 736" role="img" x="48" y="106" overflow="hidden"><rect x="30" y="64" width="1017" height="736" fill="#ffffff"/><title>局部窗口用稀疏连接改变可见图</title><desc>两层双向半径一窗口，每个内部查询对三个邻居均匀读取。第二层位置4可依赖输入2至6，权重为1、2、3、2、1各除以9，不等于五个位置的直接均匀平均。</desc><rect width="1200" height="810" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e3247"><text x="48" y="105" font-size="27" fill="#688493" text-anchor="start">双向半径 1；可见分数相等；只画影响第二层位置 4 的路径。</text><line x1="385" y1="245" x2="510" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="510" y1="245" x2="510" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="635" y1="245" x2="510" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="510" y1="405" x2="635" y2="500" stroke="#2176a2" stroke-width="4"/><line x1="510" y1="245" x2="635" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="635" y1="245" x2="635" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="760" y1="245" x2="635" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="635" y1="405" x2="635" y2="500" stroke="#2176a2" stroke-width="4"/><line x1="635" y1="245" x2="760" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="760" y1="245" x2="760" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="885" y1="245" x2="760" y2="375" stroke="#bdc8d8" stroke-width="3"/><line x1="760" y1="405" x2="635" y2="500" stroke="#2176a2" stroke-width="4"/><text x="60" y="240" font-size="28" fill="#1e3247" text-anchor="start">输入</text><circle cx="260" cy="230" r="20" fill="#688493" stroke="white" stroke-width="2"/><text x="260" y="239" font-size="25" fill="white" text-anchor="middle">1</text><circle cx="385" cy="230" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="385" y="239" font-size="25" fill="white" text-anchor="middle">2</text><circle cx="510" cy="230" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="510" y="239" font-size="25" fill="white" text-anchor="middle">3</text><circle cx="635" cy="230" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="635" y="239" font-size="25" fill="white" text-anchor="middle">4</text><circle cx="760" cy="230" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="760" y="239" font-size="25" fill="white" text-anchor="middle">5</text><circle cx="885" cy="230" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="885" y="239" font-size="25" fill="white" text-anchor="middle">6</text><circle cx="1010" cy="230" r="20" fill="#688493" stroke="white" stroke-width="2"/><text x="1010" y="239" font-size="25" fill="white" text-anchor="middle">7</text><text x="60" y="400" font-size="28" fill="#1e3247" text-anchor="start">第 1 层</text><circle cx="510" cy="390" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="510" y="399" font-size="25" fill="white" text-anchor="middle">3</text><circle cx="635" cy="390" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="635" y="399" font-size="25" fill="white" text-anchor="middle">4</text><circle cx="760" cy="390" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="760" y="399" font-size="25" fill="white" text-anchor="middle">5</text><text x="60" y="530" font-size="28" fill="#1e3247" text-anchor="start">第 2 层</text><circle cx="635" cy="520" r="20" fill="#2176a2" stroke="white" stroke-width="2"/><text x="635" y="529" font-size="25" fill="white" text-anchor="middle">4</text><text x="855" y="405" font-size="26" fill="#688493" text-anchor="start">每条边权重</text><text x="940" y="450" font-size="26" fill="#688493" text-anchor="middle">1</text><line x1="920" y1="460" x2="960" y2="460" stroke="#688493" stroke-width="2"/><text x="940" y="493" font-size="26" fill="#688493" text-anchor="middle">3</text><text x="60" y="590" font-size="26" fill="#1e3247" text-anchor="start">到位置 4 的路径数</text><rect x="240" y="690" width="40" height="0" fill="#b96134"/><text x="260" y="728" font-size="26" fill="#b96134" text-anchor="middle">0</text><rect x="365" y="668" width="40" height="22" fill="#b96134"/><text x="385" y="728" font-size="26" fill="#b96134" text-anchor="middle">1</text><rect x="490" y="646" width="40" height="44" fill="#b96134"/><text x="510" y="728" font-size="26" fill="#b96134" text-anchor="middle">2</text><rect x="615" y="624" width="40" height="66" fill="#b96134"/><text x="635" y="728" font-size="26" fill="#b96134" text-anchor="middle">3</text><rect x="740" y="646" width="40" height="44" fill="#b96134"/><text x="760" y="728" font-size="26" fill="#b96134" text-anchor="middle">2</text><rect x="865" y="668" width="40" height="22" fill="#b96134"/><text x="885" y="728" font-size="26" fill="#b96134" text-anchor="middle">1</text><rect x="990" y="690" width="40" height="0" fill="#b96134"/><text x="1010" y="728" font-size="26" fill="#b96134" text-anchor="middle">0</text><text x="60" y="778" font-size="26" fill="#688493" text-anchor="start">最终权重 = 路径数 ÷ 9；可达五个位置，并不等于五处各占五分之一。</text></g></svg></svg>

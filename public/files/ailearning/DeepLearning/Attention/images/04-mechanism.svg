<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img"><title>局部窗口用稀疏连接改变可见图</title><desc>两层双向半径一窗口，每个内部查询对三个邻居均匀读取。第二层位置4可依赖输入2至6，权重为1、2、3、2、1各除以9，不等于五个位置的直接均匀平均。</desc><rect width="1200" height="810" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="55" font-size="34" fill="#233642" text-anchor="start">两层局部读取：范围扩大了，权重却不是均匀铺开</text><text x="48" y="105" font-size="27" fill="#687b86" text-anchor="start">双向半径 1；可见分数相等；只画影响第二层位置 4 的路径。</text><line x1="385" y1="245" x2="510" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="510" y1="245" x2="510" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="635" y1="245" x2="510" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="510" y1="405" x2="635" y2="500" stroke="#246d91" stroke-width="4"/><line x1="510" y1="245" x2="635" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="635" y1="245" x2="635" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="760" y1="245" x2="635" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="635" y1="405" x2="635" y2="500" stroke="#246d91" stroke-width="4"/><line x1="635" y1="245" x2="760" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="760" y1="245" x2="760" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="885" y1="245" x2="760" y2="375" stroke="#b9cbd5" stroke-width="3"/><line x1="760" y1="405" x2="635" y2="500" stroke="#246d91" stroke-width="4"/><text x="60" y="240" font-size="28" fill="#233642" text-anchor="start">输入</text><circle cx="260" cy="230" r="20" fill="#687b86" stroke="white" stroke-width="2"/><text x="260" y="239" font-size="25" fill="white" text-anchor="middle">1</text><circle cx="385" cy="230" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="385" y="239" font-size="25" fill="white" text-anchor="middle">2</text><circle cx="510" cy="230" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="510" y="239" font-size="25" fill="white" text-anchor="middle">3</text><circle cx="635" cy="230" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="635" y="239" font-size="25" fill="white" text-anchor="middle">4</text><circle cx="760" cy="230" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="760" y="239" font-size="25" fill="white" text-anchor="middle">5</text><circle cx="885" cy="230" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="885" y="239" font-size="25" fill="white" text-anchor="middle">6</text><circle cx="1010" cy="230" r="20" fill="#687b86" stroke="white" stroke-width="2"/><text x="1010" y="239" font-size="25" fill="white" text-anchor="middle">7</text><text x="60" y="400" font-size="28" fill="#233642" text-anchor="start">第 1 层</text><circle cx="510" cy="390" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="510" y="399" font-size="25" fill="white" text-anchor="middle">3</text><circle cx="635" cy="390" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="635" y="399" font-size="25" fill="white" text-anchor="middle">4</text><circle cx="760" cy="390" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="760" y="399" font-size="25" fill="white" text-anchor="middle">5</text><text x="60" y="530" font-size="28" fill="#233642" text-anchor="start">第 2 层</text><circle cx="635" cy="520" r="20" fill="#246d91" stroke="white" stroke-width="2"/><text x="635" y="529" font-size="25" fill="white" text-anchor="middle">4</text><text x="855" y="405" font-size="26" fill="#687b86" text-anchor="start">每条边权重</text><text x="940" y="450" font-size="26" fill="#687b86" text-anchor="middle">1</text><line x1="920" y1="460" x2="960" y2="460" stroke="#687b86" stroke-width="2"/><text x="940" y="493" font-size="26" fill="#687b86" text-anchor="middle">3</text><text x="60" y="590" font-size="26" fill="#233642" text-anchor="start">到位置 4 的路径数</text><rect x="240" y="690" width="40" height="0" fill="#bc5b31"/><text x="260" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">0</text><rect x="365" y="668" width="40" height="22" fill="#bc5b31"/><text x="385" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">1</text><rect x="490" y="646" width="40" height="44" fill="#bc5b31"/><text x="510" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">2</text><rect x="615" y="624" width="40" height="66" fill="#bc5b31"/><text x="635" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">3</text><rect x="740" y="646" width="40" height="44" fill="#bc5b31"/><text x="760" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">2</text><rect x="865" y="668" width="40" height="22" fill="#bc5b31"/><text x="885" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">1</text><rect x="990" y="690" width="40" height="0" fill="#bc5b31"/><text x="1010" y="728" font-size="26" fill="#bc5b31" text-anchor="middle">0</text><text x="60" y="778" font-size="26" fill="#687b86" text-anchor="start">最终权重 = 路径数 ÷ 9；可达五个位置，并不等于五处各占五分之一。</text></g></svg>

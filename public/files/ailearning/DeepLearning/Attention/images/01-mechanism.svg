<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">改变第三个分数时输出沿同一直线移动</title>
<desc id="fig-desc">另两个分数固定。改变第三个分数，输出在原两值的固定混合点与第三值之间移动。</desc>
<rect x="0" y="0" width="1200" height="558" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">增加第三个分数，重心向 v₃ 移动</text>
<path d="M334.278 452.365 L126.887 158.452 L541.67 305.409 Z" fill="#ecf6f6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>

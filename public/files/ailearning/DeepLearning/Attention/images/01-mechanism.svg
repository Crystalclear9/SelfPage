<text x="345.278" y="442.365" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">v1</text>
<circle cx="126.887" cy="158.452" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="137.887" y="148.452" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">v2</text>
<circle cx="541.67" cy="305.409" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="552.67" y="295.409" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">v3</text>
<path d="M196.017 256.423 L541.67 305.409" fill="none" stroke="#a74d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

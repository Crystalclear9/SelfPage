<circle cx="541.67" cy="158.452" r="8" fill="#ffffff" stroke="#526976" stroke-width="3"/>
<text x="529.67" y="148.452" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">(2, 2)</text>
<text x="701" y="133" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="600">第三个分数 s₃ = ln 3 + δ</text>
<circle cx="282.43" cy="268.67" r="7" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="282.43" y="299.67" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">1</text>
<path d="M694 220 L721 173 L1111 173 L1084 220 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714" y="204" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">1   δ = −ln 3</text>
<text x="1082" y="204" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="end" font-weight="400">(0.7500, 1.2500)</text>
<circle cx="368.843" cy="280.916" r="7" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="368.843" y="311.916" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">2</text>
<path d="M694 288 L721 241 L1111 241 L1084 288 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714" y="272" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">2   δ = 0</text>
<text x="1082" y="272" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="end" font-weight="400">(1.1667, 1.1667)</text>
<circle cx="455.257" cy="293.162" r="7" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="455.257" y="324.162" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">3</text>
<path d="M694 356 L721 309 L1111 309 L1084 356 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714" y="340" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">3   δ = ln 3</text>
<text x="1082" y="340" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="end" font-weight="400">(1.5833, 1.0833)</text>
<text x="698" y="435" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">(2, 2) 位于坐标范围内，</text>
<text x="698" y="466" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">但落在三角形外，无法由这些值读出。</text>
<text x="78" y="522" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">有限分数下只会趋近第三个值，仍有其他候选参与归一化。</text>
</svg>

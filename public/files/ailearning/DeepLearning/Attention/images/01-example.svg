<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>注意力输出对分数的局部敏感性</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="78" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="28.0" fill="#18364e">注意力输出对分数的局部敏感性</text><line x1="90" y1="353.92" x2="1100" y2="353.92" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="353.92" width="125" height="158.4" rx="6" fill="#d39c89" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="21" fill="#18364e">候选 1</text><text x="170.0" y="548.3199999999999" font-size="25.0" fill="#18364e">-0.75</text><rect x="610.0" y="195.52000000000004" width="125" height="158.4" rx="6" fill="#82b7d7" stroke="#7895aa" /><text x="600.0" y="604.0" font-size="21" fill="#18364e">候选 2</text><text x="610.0" y="178.72000000000003" font-size="25.0" fill="#18364e">0.75</text></g><text x="105" y="657" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">纵轴：输出 o 对各候选分数 s 的偏导；此例 o=5。</text><text x="105" y="691" font-size="23" fill="#18364e" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><tspan font-size="23.0" dy="0">∂o/∂s</tspan><tspan font-size="16.56" dy="5.06">1</tspan><tspan font-size="23.0" dy="-5.06">=0.25×(2−5)=−0.75；∂o/∂s</tspan><tspan font-size="16.56" dy="5.06">2</tspan><tspan font-size="23.0" dy="-5.06">=0.75×(6−5)=0.75。</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>提高某个分数：输出会朝那个值移动，但速度不同</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">提高某个分数：输出会朝那个值移动，但速度不同</text><text x="60" y="112" font-size="27" fill="#74888d" text-anchor="start">保持三个值不变；箭头为输出对一个分数的导数，统一放大 2 倍显示</text><line x1="148.5" y1="590" x2="681.5" y2="590" stroke="#74888d" stroke-width="2"/><line x1="210" y1="610.5" x2="210" y2="159.5" stroke="#74888d" stroke-width="2"/><text x="210" y="630" font-size="25" fill="#74888d" text-anchor="middle">0</text><text x="195" y="598" font-size="25" fill="#74888d" text-anchor="end">0</text><text x="415" y="630" font-size="25" fill="#74888d" text-anchor="middle">1</text><text x="195" y="393" font-size="25" fill="#74888d" text-anchor="end">1</text><text x="620" y="630" font-size="25" fill="#74888d" text-anchor="middle">2</text><text x="195" y="188" font-size="25" fill="#74888d" text-anchor="end">2</text><circle cx="415" cy="590" r="8" fill="#276a80"/><line x1="449.1666666666667" y1="350.8333333333333" x2="437.7777777777778" y2="430.55555555555554" stroke="#276a80" stroke-width="4"/><path d="M433.57,419.32 L437.78,430.56 L444.96,420.94" fill="none" stroke="#276a80" stroke-width="4"/><circle cx="210" cy="180" r="8" fill="#c2673f"/><line x1="449.1666666666667" y1="350.8333333333333" x2="289.72222222222223" y2="236.9444444444444" stroke="#c2673f" stroke-width="4"/><path d="M301.64,238.38 L289.72,236.94 L294.95,247.75" fill="none" stroke="#c2673f" stroke-width="4"/><circle cx="620" cy="385" r="8" fill="#5d8c79"/><line x1="449.1666666666667" y1="350.8333333333333" x2="620.0" y2="385.0" stroke="#5d8c79" stroke-width="4"/><path d="M608.55,388.58 L620.00,385.00 L610.80,377.29" fill="none" stroke="#5d8c79" stroke-width="4"/><circle cx="449.1666666666667" cy="350.8333333333333" r="8" fill="#19343e"/><text x="466.25" y="313.25" font-size="28" fill="#19343e" text-anchor="start">o</text><text x="815" y="270" font-size="26" fill="#276a80" text-anchor="start">分数 1： (−0.0278, −0.1944)</text><text x="815" y="365" font-size="26" fill="#c2673f" text-anchor="start">分数 2： (−0.3889, 0.2778)</text><text x="815" y="460" font-size="26" fill="#5d8c79" text-anchor="start">分数 3： (0.4167, −0.0833)</text><text x="815" y="590" font-size="27" fill="#19343e" text-anchor="start">三个导数向量之和为零。</text><text x="60" y="715" font-size="28" fill="#19343e" text-anchor="start">方向由“值 − 当前输出”决定，速度还乘读取权重；这是一阶局部响应。</text></g></svg>

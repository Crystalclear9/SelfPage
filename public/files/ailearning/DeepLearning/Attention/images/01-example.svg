<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" viewBox="0 0 1200 638" role="img"><title>注意力输出对分数的局部敏感性</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#748e9f" /></marker></defs><rect width="1200" height="638" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="50" font-size="32" fill="#213447">注意力输出对分数的局部敏感性</text><line x1="90" y1="353.92" x2="1100" y2="353.92" stroke="#748e9f" stroke-width="3" /><line x1="90" y1="100.0" x2="90" y2="562.0" stroke="#748e9f" stroke-width="3" /><rect x="170.0" y="353.92" width="125" height="158.4" rx="6" fill="#d39c89" stroke="#7895aa" /><text x="160.0" y="604.0" font-size="24" fill="#213447">候选 1</text><text x="170.0" y="548.3199999999999" font-size="25.0" fill="#213447">-0.75</text><rect x="610.0" y="195.52000000000004" width="125" height="158.4" rx="6" fill="#2865a0" stroke="#7895aa" /><text x="600.0" y="604.0" font-size="24" fill="#213447">候选 2</text><text x="610.0" y="178.72000000000003" font-size="25.0" fill="#213447">0.75</text><text x="115" y="102" font-size="26" fill="#213447">输出对分数的偏导</text></g><desc> 纵轴：输出 o 对各候选分数 s 的偏导；此例 o=5。 ∂o/∂s1=0.25×(2−5)=−0.75；∂o/∂s2=0.75×(6−5)=0.75。</desc></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="906.1472" viewBox="0 0 1440 906.1472" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两个头的独立分布与读取后拼接</title><rect width="1440" height="906.1472" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两个头的独立分布与读取后拼接</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="764.1472" viewBox="42 72 1196 680" role="img" x="48" y="106" overflow="hidden"><rect x="42" y="72" width="1196" height="680" fill="#ffffff"/><title>两次独立归一化，保留的是两条不同的读取通路</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="26" fill="#769099" text-anchor="start">同一查询、三个候选，两个头各自形成概率；本例两头标量值都为 (0, 1, 3)</text><text x="100" y="185" font-size="28" fill="#257190" text-anchor="start">头 1：分数 (0, ln 2, ln 3)</text><rect x="100" y="395.0" width="90" height="55.0" fill="#257190"/><text x="145" y="377.0" font-size="25" fill="#257190" text-anchor="middle">0.1667</text><text x="145" y="490" font-size="26" fill="#769099" text-anchor="middle">值 0</text><rect x="240" y="340.0" width="90" height="110.0" fill="#257190"/><text x="285" y="322.0" font-size="25" fill="#257190" text-anchor="middle">0.3333</text><text x="285" y="490" font-size="26" fill="#769099" text-anchor="middle">值 1</text><rect x="380" y="285.0" width="90" height="165.0" fill="#257190"/><text x="425" y="267.0" font-size="25" fill="#257190" text-anchor="middle">0.5</text><text x="425" y="490" font-size="26" fill="#769099" text-anchor="middle">值 3</text><line x1="100" y1="450" x2="510" y2="450" stroke="#769099" stroke-width="2"/><text x="100" y="565" font-size="29" fill="#257190" text-anchor="start">读取 = 1.8333</text><text x="720" y="185" font-size="28" fill="#bf6d42" text-anchor="start">头 2：分数 (ln 3, ln 2, 0)</text><rect x="720" y="285.0" width="90" height="165.0" fill="#bf6d42"/><text x="765" y="267.0" font-size="25" fill="#bf6d42" text-anchor="middle">0.5</text><text x="765" y="490" font-size="26" fill="#769099" text-anchor="middle">值 0</text><rect x="860" y="340.0" width="90" height="110.0" fill="#bf6d42"/><text x="905" y="322.0" font-size="25" fill="#bf6d42" text-anchor="middle">0.3333</text><text x="905" y="490" font-size="26" fill="#769099" text-anchor="middle">值 1</text><rect x="1000" y="395.0" width="90" height="55.0" fill="#bf6d42"/><text x="1045" y="377.0" font-size="25" fill="#bf6d42" text-anchor="middle">0.1667</text><text x="1045" y="490" font-size="26" fill="#769099" text-anchor="middle">值 3</text><line x1="720" y1="450" x2="1130" y2="450" stroke="#769099" stroke-width="2"/><text x="720" y="565" font-size="29" fill="#bf6d42" text-anchor="start">读取 = 0.8333</text><line x1="60" y1="620" x2="1220" y2="620" stroke="#dfe4eb" stroke-width="2"/><text x="60" y="674" font-size="28" fill="#1a2b3d" text-anchor="start">拼接保留 (1.8333, 0.8333)；输出投影取两头之差，可得到 1。</text><text x="60" y="730" font-size="26" fill="#769099" text-anchor="start">先平均只留下 1.3333，头之间的差异已被抹去；两种接口的表示约束不同。</text></g></svg></svg>

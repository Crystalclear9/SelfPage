<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>两次独立归一化，保留的是两条不同的读取通路</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="35" fill="#19343e" text-anchor="start">两次独立归一化，保留的是两条不同的读取通路</text><text x="60" y="112" font-size="26" fill="#74888d" text-anchor="start">同一查询、三个候选，两个头各自形成概率；本例两头标量值都为 (0, 1, 3)</text><text x="100" y="185" font-size="28" fill="#276a80" text-anchor="start">头 1：分数 (0, ln 2, ln 3)</text><rect x="100" y="395.0" width="90" height="55.0" fill="#276a80"/><text x="145" y="377.0" font-size="25" fill="#276a80" text-anchor="middle">0.1667</text><text x="145" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 0</text><rect x="240" y="340.0" width="90" height="110.0" fill="#276a80"/><text x="285" y="322.0" font-size="25" fill="#276a80" text-anchor="middle">0.3333</text><text x="285" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 1</text><rect x="380" y="285.0" width="90" height="165.0" fill="#276a80"/><text x="425" y="267.0" font-size="25" fill="#276a80" text-anchor="middle">0.5</text><text x="425" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 3</text><line x1="100" y1="450" x2="510" y2="450" stroke="#74888d" stroke-width="2"/><text x="100" y="565" font-size="29" fill="#276a80" text-anchor="start">读取 = 1.8333</text><text x="720" y="185" font-size="28" fill="#c2673f" text-anchor="start">头 2：分数 (ln 3, ln 2, 0)</text><rect x="720" y="285.0" width="90" height="165.0" fill="#c2673f"/><text x="765" y="267.0" font-size="25" fill="#c2673f" text-anchor="middle">0.5</text><text x="765" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 0</text><rect x="860" y="340.0" width="90" height="110.0" fill="#c2673f"/><text x="905" y="322.0" font-size="25" fill="#c2673f" text-anchor="middle">0.3333</text><text x="905" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 1</text><rect x="1000" y="395.0" width="90" height="55.0" fill="#c2673f"/><text x="1045" y="377.0" font-size="25" fill="#c2673f" text-anchor="middle">0.1667</text><text x="1045" y="490" font-size="26" fill="#74888d" text-anchor="middle">值 3</text><line x1="720" y1="450" x2="1130" y2="450" stroke="#74888d" stroke-width="2"/><text x="720" y="565" font-size="29" fill="#c2673f" text-anchor="start">读取 = 0.8333</text><line x1="60" y1="620" x2="1220" y2="620" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="674" font-size="28" fill="#19343e" text-anchor="start">拼接保留 (1.8333, 0.8333)；输出投影取两头之差，可得到 1。</text><text x="60" y="730" font-size="26" fill="#74888d" text-anchor="start">先平均只留下 1.3333，头之间的差异已被抹去；两种接口的表示约束不同。</text></g></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="679" viewBox="42 73 1196 679" role="img"><rect x="42" y="73" width="1196" height="679" fill="#ffffff"/><title>删除零值候选，仍会通过分母把读取结果从 1 推到 50</title><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="25" fill="#74888d" text-anchor="start">固定三个值 (0, 0, 100)，原概率 (0.98, 0.01, 0.01)；删除第一个候选并重新归一化</text><text x="60" y="190" font-size="29" fill="#19343e" text-anchor="start">原读取：98% 的质量给了第一个零值</text><rect x="90" y="230" width="784" height="65" fill="#276a80"/><rect x="874" y="230" width="8" height="65" fill="#74888d"/><rect x="882" y="230" width="8" height="65" fill="#c2673f"/><text x="90" y="340" font-size="27" fill="#276a80" text-anchor="start">零值候选 1：0.98</text><text x="590" y="340" font-size="27" fill="#74888d" text-anchor="start">零值候选 2：0.01</text><text x="950" y="275" font-size="26" fill="#c2673f" text-anchor="start">值 100：0.01</text><text x="60" y="420" font-size="29" fill="#19343e" text-anchor="start">删除后：剩余两份质量各占一半</text><rect x="90" y="460" width="400" height="65" fill="#74888d"/><rect x="490" y="460" width="400" height="65" fill="#c2673f"/><text x="90" y="570" font-size="27" fill="#74888d" text-anchor="start">值 0：0.5</text><text x="590" y="570" font-size="27" fill="#c2673f" text-anchor="start">值 100：0.5</text><line x1="60" y1="620" x2="1220" y2="620" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="675" font-size="30" fill="#19343e" text-anchor="start">原输出 0.01 × 100 = 1；删除后 0.5 × 100 = 50。</text><text x="60" y="730" font-size="26" fill="#74888d" text-anchor="start">把第一个值替换成 0 不改变输出；删掉对应候选改变了分母，属于不同干预。</text></g></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="717" viewBox="0 0 1360 717" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">直接贡献为零，删除效应仍可能很大</title>
  <desc id="plate-desc">三项原权重为 0.98、0.01、0.01。第一项的值为零。删除第一项后另外两项重新各得一半质量，输出从 1 升到 50。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="717" fill="white" stroke="none" stroke-width="0"/>
  <text x="351" y="64" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">原始权重</text>
  <text x="131" y="165" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">值 0</text>
  <rect x="236" y="137" width="341.04" height="38" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/>
  <text x="623" y="164" font-size="26" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">0.98</text>
  <text x="131" y="281" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">值 0</text>
  <rect x="236" y="253" width="3.48" height="38" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/>
  <text x="623" y="280" font-size="26" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">0.01</text>
  <text x="131" y="397" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">值 100</text>
  <rect x="236" y="369" width="3.48" height="38" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/>
  <text x="623" y="396" font-size="26" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">0.01</text>
  <polygon points="209.5,584 456.5,584 492.5,508 245.5,508" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="351" y="555.24" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">输出 = 1</text>
  <text x="1017" y="64" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">删除后重新归一化</text>
  <text x="797" y="165" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">值 0</text>
  <polyline points="899,156 1154,156" fill="none" stroke="#657682" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="1205" y="163" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">删除</text>
  <text x="797" y="281" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">值 0</text>
  <rect x="902" y="253" width="174" height="38" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/>
  <text x="1207" y="263" font-size="20" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">1</text>
  <polyline points="1188,270 1226,270" fill="none" stroke="#196f77" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1207" y="295" font-size="20" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">2</text>
  <text x="797" y="397" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">值 100</text>
  <rect x="902" y="369" width="174" height="38" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/>
  <text x="1207" y="379" font-size="20" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">1</text>
  <polyline points="1188,386 1226,386" fill="none" stroke="#196f77" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1207" y="411" font-size="20" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">2</text>
  <polygon points="875.5,584 1122.5,584 1158.5,508 911.5,508" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="1017" y="555.24" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="middle">输出 = 50</text>
  <text x="679" y="672" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">大权重零值影响分母。删除后，另外两项的贡献都被重新缩放。</text>
</svg>

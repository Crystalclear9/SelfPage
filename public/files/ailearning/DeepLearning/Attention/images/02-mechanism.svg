<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>未来信息也可能绕过正确的因果掩码</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#407e9e" /></marker></defs><rect width="1200" height="750" fill="white" /><rect x="18" y="75" width="1164" height="650" rx="14" fill="white" stroke="#d6e7f0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="30" fill="#143651">未来信息也可能绕过正确的因果掩码</text><rect x="60" y="180" width="245" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="75" y="215" font-size="22" fill="#143651">未来位置输入</text><rect x="70" y="480" width="245" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="85" y="515" font-size="22" fill="#143651">早期输出</text><line x1="180" y1="275" x2="180" y2="470" stroke="#ed9a46" stroke-width="3" marker-end="url(#arr)" /><text x="195" y="380" font-size="22" fill="#aa642b">× 直接注意力已屏蔽</text><rect x="600" y="180" width="245" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="615" y="215" font-size="22" fill="#143651">跨全部时间的统计</text><rect x="600" y="480" width="245" height="95" rx="8" fill="#e0f3ed" stroke="#82a2b7" /><text x="615" y="515" font-size="22" fill="#143651">早期位置使用该统计</text><line x1="305" y1="225" x2="590" y2="225" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><line x1="720" y1="275" x2="720" y2="470" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><line x1="600" y1="525" x2="325" y2="525" stroke="#407e9e" stroke-width="3" marker-end="url(#arr)" /><text x="475" y="365" font-size="24" fill="#143651">绕行依赖仍可能泄漏</text><text x="90" y="650" font-size="23" fill="#143651">逐 token 的特征归一化本身不等于跨时间统计。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>未来信息也可能绕过正确的因果掩码</title><desc>早期输入恒为1，未来从3改为7；按全序列均值中心化后，早期值从-1变为-3。即使首查询只允许读取自身，输出仍改变；前缀均值不会受未来影响。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#233642"><text x="48" y="55" font-size="34" fill="#233642" text-anchor="start">掩码挡住未来键，却挡不住已经混入的未来信息</text><text x="48" y="105" font-size="27" fill="#687b86" text-anchor="start">只检查第 1 个查询；注意力只允许它读取第 1 个值。</text><text x="60" y="175" font-size="29" fill="#233642" text-anchor="start">输入</text><text x="340" y="175" font-size="29" fill="#233642" text-anchor="start">全序列均值</text><text x="670" y="175" font-size="29" fill="#233642" text-anchor="start">第 1 个值</text><text x="970" y="175" font-size="29" fill="#233642" text-anchor="start">输出</text><text x="70" y="270" font-size="34" fill="#246d91" text-anchor="start">(1, 3)</text><line x1="215" y1="260" x2="315" y2="260" stroke="#687b86" stroke-width="3"/><text x="365" y="270" font-size="34" fill="#687b86" text-anchor="start">2</text><line x1="525" y1="260" x2="635" y2="260" stroke="#687b86" stroke-width="3"/><text x="655" y="270" font-size="32" fill="#246d91" text-anchor="start">1 − 2 = -1</text><line x1="865" y1="260" x2="945" y2="260" stroke="#687b86" stroke-width="3"/><text x="980" y="270" font-size="34" fill="#246d91" text-anchor="start">-1</text><text x="70" y="430" font-size="34" fill="#bc5b31" text-anchor="start">(1, 7)</text><line x1="215" y1="420" x2="315" y2="420" stroke="#687b86" stroke-width="3"/><text x="365" y="430" font-size="34" fill="#687b86" text-anchor="start">4</text><line x1="525" y1="420" x2="635" y2="420" stroke="#687b86" stroke-width="3"/><text x="655" y="430" font-size="32" fill="#bc5b31" text-anchor="start">1 − 4 = -3</text><line x1="865" y1="420" x2="945" y2="420" stroke="#687b86" stroke-width="3"/><text x="980" y="430" font-size="34" fill="#bc5b31" text-anchor="start">-3</text><text x="60" y="505" font-size="27" fill="#bc5b31" text-anchor="start">只改未来</text><text x="675" y="505" font-size="27" fill="#bc5b31" text-anchor="start">但早期表示已改变</text><line x1="60" y1="550" x2="1140" y2="550" stroke="#dce5e9" stroke-width="2"/><text x="60" y="610" font-size="27" fill="#233642" text-anchor="start">首行掩码始终为 [允许，禁止]，归一化权重始终为 [1，0]。</text><text x="60" y="665" font-size="26" fill="#246d91" text-anchor="start">若改用第 1 步可见前缀的均值，两次都是 1，中心化输出均为 0。</text><text x="60" y="713" font-size="24" fill="#687b86" text-anchor="start">该例只做跨时间减均值；逐 token 的特征轴 LayerNorm 不等于这种操作。</text></g></svg>

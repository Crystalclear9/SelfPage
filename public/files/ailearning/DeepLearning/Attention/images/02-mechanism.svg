<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img"><title>未来信息也可能绕过正确的因果掩码</title><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#2865a0" /></marker></defs><rect width="1200" height="606" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="38" y="50" font-size="32" fill="#213447">未来信息也可能绕过正确的因果掩码</text><rect x="60" y="180" width="245" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="75" y="215" font-size="24" fill="#213447">未来位置输入</text><rect x="70" y="480" width="245" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="85" y="515" font-size="24" fill="#213447">早期输出</text><line x1="180" y1="275" x2="180" y2="470" stroke="#cf7432" stroke-width="3" marker-end="url(#arr)" /><text x="195" y="380" font-size="24" fill="#aa642b">× 直接注意力已屏蔽</text><rect x="600" y="180" width="245" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="615" y="215" font-size="24" fill="#213447">跨全部时间的统计</text><rect x="600" y="480" width="245" height="95" rx="8" fill="#eaf2fa" stroke="#94a9bb" /><text x="615" y="515" font-size="24" fill="#213447">早期位置使用该统计</text><line x1="305" y1="225" x2="590" y2="225" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="720" y1="275" x2="720" y2="470" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><line x1="600" y1="525" x2="325" y2="525" stroke="#2865a0" stroke-width="3" marker-end="url(#arr)" /><text x="475" y="365" font-size="24" fill="#213447">绕行依赖仍可能泄漏</text></g><desc> 逐 token 的特征归一化本身不等于跨时间统计。</desc></svg>

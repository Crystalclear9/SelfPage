<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>在线 softmax：更换行最大值时，旧统计必须一起缩放</title><rect width="1200" height="630" fill="white" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="29" fill="#19344d" text-anchor="start">在线 softmax：更换行最大值时，旧统计必须一起缩放</text><path d="M48,86 L1152,86" stroke="#d8e3ed" stroke-width="2" fill="none" /><text x="65" y="135" font-size="25" fill="#19344d" text-anchor="start">在线 softmax：旧项换基准，新项再合并</text><rect x="100" y="330.0" width="85" height="90.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="142.5" y="318.0" font-size="24" fill="#19344d" text-anchor="middle">0.5</text><text x="142.5" y="452" font-size="24" fill="#19344d" text-anchor="middle">旧项1</text><rect x="220" y="240" width="85" height="180" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="262.5" y="228" font-size="24" fill="#19344d" text-anchor="middle">1</text><text x="262.5" y="452" font-size="24" fill="#19344d" text-anchor="middle">旧项2</text><path d="M92,420 L320,420" stroke="#64788b" stroke-width="2" fill="none" /><path d="M350,280 L435,280" stroke="#2166ac" stroke-width="3" fill="none" /><path d="M435,280 L424.1946347717679,285.21958640933474" stroke="#2166ac" stroke-width="3" fill="none" /><path d="M435,280 L424.1946347717679,274.78041359066526" stroke="#2166ac" stroke-width="3" fill="none" /><rect x="480" y="375.0" width="85" height="45.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="522.5" y="363.0" font-size="24" fill="#19344d" text-anchor="middle">0.25</text><text x="522.5" y="452" font-size="24" fill="#19344d" text-anchor="middle">旧项1</text><rect x="600" y="330.0" width="85" height="90.0" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="642.5" y="318.0" font-size="24" fill="#19344d" text-anchor="middle">0.5</text><text x="642.5" y="452" font-size="24" fill="#19344d" text-anchor="middle">旧项2</text><rect x="720" y="240" width="85" height="180" rx="3" fill="#2166ac" stroke="white" stroke-width="2" /><text x="762.5" y="228" font-size="24" fill="#19344d" text-anchor="middle">1</text><text x="762.5" y="452" font-size="24" fill="#19344d" text-anchor="middle">新项</text><path d="M472,420 L820,420" stroke="#64788b" stroke-width="2" fill="none" /><text x="90" y="190" font-size="25" fill="#19344d" text-anchor="start">旧基准 ln 2</text><text x="480" y="190" font-size="25" fill="#19344d" text-anchor="start">新基准 ln 4</text><text x="870" y="260" font-size="25" fill="#19344d" text-anchor="start">分母 = 1.75</text><text x="870" y="310" font-size="25" fill="#19344d" text-anchor="start">分子 = 10.5</text><text x="870" y="385" font-size="30" fill="#d66b28" text-anchor="start">输出 = 6</text><text x="180" y="535" font-size="25" fill="#d66b28" text-anchor="start">旧分母 1.5 → 0.75；旧加权和 5 → 2.5</text></g></svg>

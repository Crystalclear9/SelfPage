<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img"><title>在线换基：分母和分子必须同步缩放，再接收新块</title><rect width="1400" height="1200" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="55" y="60" font-size="36" fill="#243c46" text-anchor="start">在线换基：分母和分子必须同步缩放，再接收新块</text><text x="55" y="111" font-size="27" fill="#7b8c92" text-anchor="start">分数 (0, ln 2, ln 4)，值 (2,4,8)；蓝为旧项，橙为新项</text><text x="110" y="185" font-size="30" fill="#243c46" text-anchor="start">旧基准 ln 2</text><text x="110" y="244" font-size="27" fill="#243c46" text-anchor="start">指数质量</text><rect x="110" y="352.5" width="90" height="67.5" fill="#246880" stroke="none"/><text x="155" y="460" font-size="27" fill="#246880" text-anchor="middle">0.5</text><rect x="260" y="285" width="90" height="135" fill="#246880" stroke="none"/><text x="305" y="460" font-size="27" fill="#246880" text-anchor="middle">1</text><text x="110" y="520" font-size="27" fill="#243c46" text-anchor="start">质量 × 值</text><rect x="110" y="710" width="90" height="20" fill="#246880" stroke="none"/><text x="155" y="770" font-size="27" fill="#246880" text-anchor="middle">1</text><rect x="260" y="650" width="90" height="80" fill="#246880" stroke="none"/><text x="305" y="770" font-size="27" fill="#246880" text-anchor="middle">4</text><text x="825" y="185" font-size="30" fill="#243c46" text-anchor="start">新基准 ln 4</text><text x="825" y="244" font-size="27" fill="#243c46" text-anchor="start">指数质量</text><rect x="825" y="386.25" width="90" height="33.75" fill="#246880" stroke="none"/><text x="870" y="460" font-size="27" fill="#246880" text-anchor="middle">0.25</text><rect x="975" y="352.5" width="90" height="67.5" fill="#246880" stroke="none"/><text x="1020" y="460" font-size="27" fill="#246880" text-anchor="middle">0.5</text><rect x="1125" y="285" width="90" height="135" fill="#bd633d" stroke="none"/><text x="1170" y="460" font-size="27" fill="#bd633d" text-anchor="middle">1</text><text x="825" y="520" font-size="27" fill="#243c46" text-anchor="start">质量 × 值</text><rect x="825" y="720.0" width="90" height="10.0" fill="#246880" stroke="none"/><text x="870" y="770" font-size="27" fill="#246880" text-anchor="middle">0.5</text><rect x="975" y="690" width="90" height="40" fill="#246880" stroke="none"/><text x="1020" y="770" font-size="27" fill="#246880" text-anchor="middle">2</text><rect x="1125" y="570" width="90" height="160" fill="#bd633d" stroke="none"/><text x="1170" y="770" font-size="27" fill="#bd633d" text-anchor="middle">8</text><line x1="480" y1="350" x2="735" y2="350" stroke="#4d8776" stroke-width="4"/><polygon points="735,350 724.1946347717678,355.21958640933474 724.1946347717678,344.78041359066526" fill="#4d8776"/><text x="605" y="304" font-size="28" fill="#4d8776" text-anchor="middle">旧项都乘 0.5</text><text x="70" y="851" font-size="28" fill="#4d8776">只重标旧项时：</text><text x="385" y="825" font-size="29" fill="#4d8776" text-anchor="middle">5</text><line x1="348" y1="835" x2="422" y2="835" stroke="#4d8776" stroke-width="2"/><text x="385" y="873" font-size="29" fill="#4d8776" text-anchor="middle">1.5</text><text x="445" y="851" font-size="30" fill="#4d8776">=</text><text x="550" y="825" font-size="29" fill="#4d8776" text-anchor="middle">2.5</text><line x1="513" y1="835" x2="587" y2="835" stroke="#4d8776" stroke-width="2"/><text x="550" y="873" font-size="29" fill="#4d8776" text-anchor="middle">0.75</text><text x="610" y="851" font-size="30" fill="#4d8776">=</text><text x="715" y="825" font-size="29" fill="#4d8776" text-anchor="middle">10</text><line x1="678" y1="835" x2="752" y2="835" stroke="#4d8776" stroke-width="2"/><text x="715" y="873" font-size="29" fill="#4d8776" text-anchor="middle">3</text><line x1="55" y1="890" x2="1340" y2="890" stroke="#dbe5e9" stroke-width="2"/><text x="55" y="947" font-size="29" fill="#243c46" text-anchor="start">接收新项后，不同缩放策略的最终读取</text><text x="100" y="1011" font-size="27" fill="#246880" text-anchor="start">同步缩放</text><text x="180" y="1055" font-size="29" fill="#246880" text-anchor="middle">10.5</text><line x1="143" y1="1065" x2="217" y2="1065" stroke="#246880" stroke-width="2"/><text x="180" y="1103" font-size="29" fill="#246880" text-anchor="middle">1.75</text><text x="100" y="1160" font-size="29" fill="#246880" text-anchor="start">= 6.000000</text><text x="450" y="1011" font-size="27" fill="#bd633d" text-anchor="start">只缩分母</text><text x="530" y="1055" font-size="29" fill="#bd633d" text-anchor="middle">13</text><line x1="493" y1="1065" x2="567" y2="1065" stroke="#bd633d" stroke-width="2"/><text x="530" y="1103" font-size="29" fill="#bd633d" text-anchor="middle">1.75</text><text x="450" y="1160" font-size="29" fill="#bd633d" text-anchor="start">= 7.428571</text><text x="800" y="1011" font-size="27" fill="#bd633d" text-anchor="start">只缩分子</text><text x="880" y="1055" font-size="29" fill="#bd633d" text-anchor="middle">10.5</text><line x1="843" y1="1065" x2="917" y2="1065" stroke="#bd633d" stroke-width="2"/><text x="880" y="1103" font-size="29" fill="#bd633d" text-anchor="middle">2.5</text><text x="800" y="1160" font-size="29" fill="#bd633d" text-anchor="start">= 4.200000</text><text x="1130" y="1011" font-size="27" fill="#bd633d" text-anchor="start">完全不缩</text><text x="1210" y="1055" font-size="29" fill="#bd633d" text-anchor="middle">13</text><line x1="1173" y1="1065" x2="1247" y2="1065" stroke="#bd633d" stroke-width="2"/><text x="1210" y="1103" font-size="29" fill="#bd633d" text-anchor="middle">2.5</text><text x="1130" y="1160" font-size="29" fill="#bd633d" text-anchor="start">= 5.200000</text></g></svg>

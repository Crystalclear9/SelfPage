<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title id="extra-title">同样的小残差可以对应不同的位置误差</title><desc id="extra-desc">图中**真正固定同一个残差**来比较两个候选解。对 f(x)=x 取候选位置 \widehat x_f=0.001，对 g(x)=0.01x 取候选位置 \widehat x_g=0.1。两者根都为零，残差也同为 0.001，但位置误差分别为 0.001 和 0.1，相差 100 倍。灰色水平线是共同的残差水平；由于纵轴只显示 0 到 0.0014，蓝色直线在很靠近左轴的位置就离开可见范围，不是曲线消失或算法发生跳变。

对简单根 x_*，局部一阶关系为 |\,\widehat x-x_*\,|\approx\frac{|f(\widehat x)|}{|f'(x_*)|}，前提是根附近可微、导数非零且高阶项可控。本例两条函数都是线性的，因此除以斜率 1 和 0.01 后，这个关系恰好精确成立。将函数整体乘以常数不会改变根，却会按比例改变绝对残差；所以不说明函数尺度就跨问题比较同一个绝对残差阈值，没有统一的位置精度含义。

重根的导数为零，一阶换算会失效；这时还应结合括根区间、局部结构或其他误差证书。本图解释的是问题的条件性，而不是把候选位置当成某个特定算法的迭代轨迹。根的绝对条件数见 [《Fundamentals of Numerical Computation》第 4.1.1 节](https://fncbook.com/rootproblem/#conditioning-error-and-residual)。</desc><rect width="1200" height="720" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">同样的小残差可以对应不同的位置误差</text><text x="85" y="105" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一水平残差：r=0.001</text><line x1="120" y1="550.0" x2="635" y2="550.0" stroke="#dce5ed" stroke-width="2" /><text x="108" y="558.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="120" y1="425.0" x2="635" y2="425.0" stroke="#dce5ed" stroke-width="2" /><text x="108" y="433.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.0005</text><line x1="120" y1="300.0" x2="635" y2="300.0" stroke="#dce5ed" stroke-width="2" /><text x="108" y="308.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.001</text><line x1="120" y1="200" x2="120" y2="550" stroke="#627689" stroke-width="2" /><line x1="120" y1="550" x2="635" y2="550" stroke="#627689" stroke-width="2" /><line x1="120.0" y1="550.0" x2="120.0" y2="556.0" stroke="#627689" stroke-width="2" /><text x="120.0" y="582.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="334.58333333333337" y1="550.0" x2="334.58333333333337" y2="556.0" stroke="#627689" stroke-width="2" /><text x="334.58333333333337" y="582.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.05</text><line x1="549.1666666666667" y1="550.0" x2="549.1666666666667" y2="556.0" stroke="#627689" stroke-width="2" /><text x="549.1666666666667" y="582.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.1</text><polyline points="120.000,550.000 126.008,200.000" fill="none" stroke="#2865a0" stroke-width="4" stroke-linejoin="round" /><polyline points="120.000,550.000 635.000,250.000" fill="none" stroke="#cf7432" stroke-width="4" stroke-linejoin="round" /><line x1="120.0" y1="300.0" x2="635.0" y2="300.0" stroke="#627689" stroke-width="2" stroke-dasharray="7 5" /><circle cx="124.29166666666667" cy="300.0" r="7" fill="#2865a0" /><line x1="124.29166666666667" y1="550.0" x2="124.29166666666667" y2="300.0" stroke="#2865a0" stroke-width="2" stroke-dasharray="4 5" /><circle cx="549.1666666666667" cy="300.0" r="7" fill="#cf7432" /><line x1="549.1666666666667" y1="550.0" x2="549.1666666666667" y2="300.0" stroke="#cf7432" stroke-width="2" stroke-dasharray="4 5" /><text x="120" y="170" font-size="25" fill="#627689" text-anchor="start" font-weight="400">函数值（纵轴局部放大）</text><text x="290" y="610" font-size="26" fill="#627689" text-anchor="start" font-weight="400">候选位置 x</text><line x1="230" y1="235" x2="124.29166666666667" y2="300.0" stroke="#2865a0" stroke-width="2" /><text x="230" y="225" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">f(x)=x</text><text x="390" y="470" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">g(x)=0.01x</text><text x="735" y="190" font-size="28" fill="#213447" text-anchor="start" font-weight="400">两函数的根均为 0</text><text x="735" y="280" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">f 的候选：0.001</text><text x="735" y="330" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">位置误差：0.001</text><text x="735" y="430" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">g 的候选：0.1</text><text x="735" y="480" font-size="27" fill="#cf7432" text-anchor="start" font-weight="400">位置误差：0.1</text><text x="735" y="575" font-size="26" fill="#213447" text-anchor="start" font-weight="400">相同残差，误差相差 100 倍</text><text x="85" y="680" font-size="28" fill="#213447" text-anchor="start" font-weight="400">简单根附近的位置误差，需要结合导数尺度解释。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>白化相关观测噪声需要旋转与缩放</title><desc>观测噪声协方差取[[1,0.8],[0.8,1]]。噪声等密度椭圆沿对角线拉长，按协方差逆平方根变换后成为单位圆。白化将误差度量改写为与噪声相关结构相容的欧氏长度。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">白化相关观测噪声需要旋转与缩放</text><text x="90" y="165" font-size="22" fill="#193e54" text-anchor="start">变换前</text><text x="710" y="165" font-size="22" fill="#193e54" text-anchor="start">变换后：单位协方差</text><line x1="90" y1="420" x2="510" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="300" y1="210" x2="300" y2="630" stroke="#277eac" stroke-width="2.5" /><line x1="640" y1="420" x2="1060" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="850" y1="210" x2="850" y2="630" stroke="#277eac" stroke-width="2.5" /><ellipse cx="300" cy="420" rx="134.16407864998737" ry="44.721359549995796" transform="rotate(-45 300 420)" fill="none" stroke="#148671" stroke-width="3" /><circle cx="850" cy="420" r="100" fill="none" stroke="#1977b4" stroke-width="3" /><ellipse cx="300" cy="420" rx="201.24611797498108" ry="67.0820393249937" transform="rotate(-45 300 420)" fill="none" stroke="#148671" stroke-width="3" /><circle cx="850" cy="420" r="150" fill="none" stroke="#1977b4" stroke-width="3" /><path d="M545,420 L610,420" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="725" font-size="21" fill="#193e54" text-anchor="start">同一坐标比例；轮廓层级用于比较形状，不表示密度峰值相同。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>奇异方向决定误差放大</title><desc>A将单位圆经diag(1,0.01)压成细椭圆，弱奇异方向在求逆时放大100倍。B标出构成条件数的两个奇异值。C将无正则逆增益与岭滤波比较，正则化压低弱方向噪声，却也会引入信号恢复偏差。 下方让同一圆周点集分别经过 diag(1,s)，s 取 1、0.2、0.01。对应线显示信息沿竖直方向被压缩；点距越小，同样的观测误差越难恢复。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">奇异方向决定误差放大</text><g transform="translate(10,15) scale(.95)"><circle cx="270.0" cy="540.0" r="159.6" fill="none" stroke="#497da4" stroke-width="3" /><ellipse cx="673.1999999999999" cy="540.0" rx="159.6" ry="1.596" fill="#d6ebe3" stroke="#2563eb" stroke-width="3" /><path d="M454.80,540.00 L496.80,540.00" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="102.00" y="251.20" font-size="25" fill="#15364c" text-anchor="start">单位圆经diag(1,0.01)变换</text><text x="169.20" y="768.00" font-size="24" fill="#15364c" text-anchor="start">输入：各向等长</text><text x="538.80" y="768.00" font-size="24" fill="#15364c" text-anchor="start">输出：短轴缩至1%</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stro
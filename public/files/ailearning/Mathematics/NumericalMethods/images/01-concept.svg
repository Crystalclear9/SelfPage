<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="782" viewBox="0 0 1200 782" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">舍入改变后续相减与名义对称</title>
<desc id="fig-desc">第一条数轴以 a 为基准，第二条以一为基准并以 u 为单位。空心点是名义实数位置。</desc>
<rect x="0" y="0" width="1200" height="782" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">把浮点舍入定位到格点上</text>
<text x="74" y="133" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">A　先相加，低位已丢失</text>
<path d="M270 200 L854 200" fill="none" stroke="#233b4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M854 200 L843 205 L843 195 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="200" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="330" y="239" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">a</text>
<circle cx="562" cy="200" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="562" y="239" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">a + 2</text>
<circle cx="794" cy="200" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="794" y="239" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">a + 4</text>
<circle cx="446" cy="200" r="7" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="446" y="148" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">精确 a + 1</text>
<path d="M446 166 L446 190" fill="none" stroke="#a74d3a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M446 191 L446 171 L330 171" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 171 L330 189" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 189 L325 178 L335 178 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="304" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">先加后减得 0；先减后加得 1。</text>
<text x="74" y="464" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">B　一两侧的浮点间距不同</text>
<path d="M270 531 L1086 531" fill="none" stroke="#233b4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1086 531 L1075 536 L1075 526 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="531" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="330" y="570" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1 − 2u</text>
<circle cx="446" cy="531" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="446" y="570" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1 − u</text>
<circle cx="562" cy="531" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="562" y="570" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1</text>
<circle cx="794" cy="531" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="794" y="570" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1 + 2u</text>
<circle cx="1026" cy="531" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="1026" y="570" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">1 + 4u</text>
<circle cx="457.516" cy="531" r="7" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="457.516" y="479" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">名义 1 − h</text>
<path d="M457.516 497 L457.516 521" fill="none" stroke="#a74d3a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M457.516 522 L457.516 502 L446 502" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M446 502 L446 520" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M446 520 L441 509 L451 509 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="666.484" cy="531" r="7" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="666.484" y="479" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">名义 1 + h</text>
<path d="M666.484 497 L666.484 521" fill="none" stroke="#a74d3a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M666.484 522 L666.484 502 L562 502" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M562 502 L562 520" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M562 520 L557 509 L567 509 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="635" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">u = 2⁻⁵³，h = 10⁻¹⁶；右侧存回 1，实际扰动不对称。</text>
<path d="M75 374 L1125 374" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="732" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">实心点是可表示数，空心点标出舍入前的位置。</text>
</svg>

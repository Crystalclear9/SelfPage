<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>先找到可表示格点，再判断信息在哪一步丢失</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">先找到可表示格点，再判断信息在哪一步丢失</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">上排 a = 10 的 16 次方；下排以 1 附近的单位 u = 2^−53 观察名义对称的扰动</text><text x="65" y="170" font-size="29" fill="#20343e" text-anchor="start">a 附近：相邻可表示数相差 2</text><line x1="100" y1="255" x2="1140" y2="255" stroke="#627882" stroke-width="2"/><circle cx="204.0" cy="255" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="204.0" y="305" font-size="27" fill="#216983" text-anchor="middle">a</text><circle cx="620.0" cy="255" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="620.0" y="305" font-size="27" fill="#216983" text-anchor="middle">a + 2</text><circle cx="1036.0" cy="255" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="1036.0" y="305" font-size="27" fill="#216983" text-anchor="middle">a + 4</text><circle cx="412.0" cy="255" r="8" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="412.0" y="218" font-size="27" fill="#bc5b32" text-anchor="middle">精确 a + 1</text><line x1="412.0" y1="335" x2="204.0" y2="335" stroke="#bc5b32" stroke-width="3"/><path d="M215.71,329.35 L204.00,335.00 L215.71,340.65" fill="none" stroke="#bc5b32" stroke-width="3"/><text x="65" y="405" font-size="27" fill="#20343e" text-anchor="start">平局取偶数：先做 a + 1，得到 a；之后相减无法恢复那一位。</text><text x="65" y="490" font-size="29" fill="#20343e" text-anchor="start">1 的两侧：左间距是 u，右间距是 2u</text><line x1="100" y1="590" x2="1140" y2="590" stroke="#627882" stroke-width="2"/><circle cx="174.28571428571428" cy="590" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="174.28571428571428" y="640" font-size="27" fill="#216983" text-anchor="middle">1 − 2u</text><circle cx="322.8571428571429" cy="590" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="322.8571428571429" y="640" font-size="27" fill="#216983" text-anchor="middle">1 − u</text><circle cx="471.42857142857144" cy="590" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="471.42857142857144" y="640" font-size="27" fill="#216983" text-anchor="middle">1</text><circle cx="768.5714285714286" cy="590" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="768.5714285714286" y="640" font-size="27" fill="#216983" text-anchor="middle">1 + 2u</text><circle cx="1065.7142857142858" cy="590" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="1065.7142857142858" y="640" font-size="27" fill="#216983" text-anchor="middle">1 + 4u</text><circle cx="337.60732535813383" cy="590" r="7" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="337.60732535813383" y="535" font-size="26" fill="#bc5b32" text-anchor="middle">1 − h</text><line x1="337.60732535813383" y1="680" x2="322.8571428571429" y2="680" stroke="#bc5b32" stroke-width="3"/><path d="M334.56,674.35 L322.86,680.00 L334.56,685.65" fill="none" stroke="#bc5b32" stroke-width="3"/><circle cx="605.249817499009" cy="590" r="7" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="605.249817499009" y="535" font-size="26" fill="#bc5b32" text-anchor="middle">1 + h</text><line x1="605.249817499009" y1="680" x2="471.42857142857144" y2="680" stroke="#bc5b32" stroke-width="3"/><path d="M483.13,674.35 L471.43,680.00 L483.13,685.65" fill="none" stroke="#bc5b32" stroke-width="3"/><text x="65" y="790" font-size="27" fill="#20343e" text-anchor="start">h = 10^−16：左节点移动一个格点，右节点却与中心重合；几何已不再对称。</text></g></svg>

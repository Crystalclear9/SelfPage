<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-title fig-desc" width="1200" height="570" viewBox="0 0 1200 570" role="img"><title id="fig-title">相同输入，不同求和次序得到不同的舍入结果</title><desc id="fig-desc">相同输入，不同求和次序得到不同的舍入结果</desc><rect width="1200" height="570" fill="white" /><defs><marker id="m-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="m-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">相同输入，不同求和次序得到不同的舍入结果</text><text x="35" y="110" font-size="28" fill="#213447" text-anchor="start" font-weight="400">三个 binary64 输入</text><rect x="460" y="65" width="152" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="536.0" y="107.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1e16</text><rect x="620" y="65" width="152" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="696.0" y="107.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="780" y="65" width="152" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="856.0" y="107.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">−1e16</text><text x="50" y="220" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">先把 1 加到大数上</text><text x="665" y="220" font-size="29" fill="#cf7432" text-anchor="start" font-weight="400">先抵消两个大数</text><rect x="45" y="265" width="485" height="75" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="287.5" y="312.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1e16 + 1 → 1e16</text><path d="M285,355 L285,410" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#m-b)" /><rect x="45" y="430" width="485" height="75" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="287.5" y="477.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">再加 −1e16 → 0</text><rect x="665" y="265" width="485" height="75" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="907.5" y="312.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">1e16 − 1e16 → 0</text><path d="M905,355 L905,410" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#m-o)" /><rect x="665" y="430" width="485" height="75" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="907.5" y="477.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">再加 1 → 1</text></g></svg>

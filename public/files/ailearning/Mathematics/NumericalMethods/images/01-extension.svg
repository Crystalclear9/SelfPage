<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>补偿求和：主和舍掉的一，被另一条状态保留下来</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">补偿求和：主和舍掉的一，被另一条状态保留下来</text><text x="60" y="120" font-size="27" fill="#71858b" text-anchor="start">按原次序处理 (10 的 16 次方, 1, −10 的 16 次方)；Neumaier 变体</text><text x="60" y="210" font-size="28" fill="#19333c" text-anchor="start">加入的输入</text><text x="390" y="210" font-size="28" fill="#19333c" text-anchor="middle">舍入后的主和 s</text><text x="755" y="210" font-size="28" fill="#19333c" text-anchor="middle">累计补偿 c</text><text x="1110" y="210" font-size="28" fill="#19333c" text-anchor="middle">s + c</text><line x1="60" y1="265" x2="1215" y2="265" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="310" font-size="28" fill="#19333c" text-anchor="start">10 的 16 次方</text><text x="390" y="310" font-size="28" fill="#256b82" text-anchor="middle">10 的 16 次方</text><text x="755" y="310" font-size="32" fill="#c0643c" text-anchor="middle">0</text><text x="1110" y="310" font-size="28" fill="#19333c" text-anchor="middle">仍为大数</text><line x1="60" y1="390" x2="1215" y2="390" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="435" font-size="28" fill="#19333c" text-anchor="start">1</text><text x="390" y="435" font-size="28" fill="#256b82" text-anchor="middle">10 的 16 次方</text><text x="755" y="435" font-size="32" fill="#c0643c" text-anchor="middle">1</text><text x="1110" y="435" font-size="28" fill="#19333c" text-anchor="middle">仍为大数</text><line x1="60" y1="515" x2="1215" y2="515" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="560" font-size="28" fill="#19333c" text-anchor="start">−10 的 16 次方</text><text x="390" y="560" font-size="28" fill="#256b82" text-anchor="middle">0</text><text x="755" y="560" font-size="32" fill="#c0643c" text-anchor="middle">1</text><text x="1110" y="560" font-size="28" fill="#19333c" text-anchor="middle">1</text><text x="60" y="700" font-size="27" fill="#19333c" text-anchor="start">第二步：大主和 + 1 舍入回原值，补偿记录 (s − t) + 1 = 1。</text><text x="60" y="750" font-size="27" fill="#19333c" text-anchor="start">第三步：两个大数相消，主和成为 0；最后加补偿得到 1。</text><text x="60" y="793" font-size="25" fill="#71858b" text-anchor="start">s 与 c 分开存储；前两行若立即合成一个 binary64，低位仍可能被舍掉。</text></g></svg>

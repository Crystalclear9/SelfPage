<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="675.2638" viewBox="30.5778 64.7111 1213.1556 640.0000" role="img"><title>梯形积分误差的面积解释</title><desc>f等于x平方在零到一，两段与四段线性插值均位于曲线上方，总面积误差分别二十四分之一与九十六分之一。 梯形公式多算了哪里？把误差画成面积 每段误差与 h³ 成正比，段数与 h 的倒数成正比；总误差与 h² 成正比。 区间折半后，橙色总面积变成四分之一；这与程序的观测误差一致。</desc><rect width="1280" height="780" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="27" fill="#50636e" text-anchor="start" font-weight="400">f(x) = x²，区间 [0, 1]；蓝色曲线，橙色多余面积</text><line x1="100" y1="500.0" x2="500" y2="500.0" stroke="#dce4e5" stroke-width="2" /><text x="88" y="508.0" font-size="24" fill="#50636e" text-anchor="end" font-weight="400">0</text><text x="100" y="535" font-size="24" fill="#50636e" text-anchor="middle" font-weight="400">0</text><line x1="100" y1="350.0" x2="500" y2="350.0" stroke="#dce4e5" stroke-width="2" /><text x="88" y="358.0" font-size="24" fill="#50636e" text-anchor="end" font-weight="400">0.5</text><text x="300.0" y="535" font-size="24" fill="#50636e" text-anchor="middle" font-weight="400">0.5</text><line x1="100" y1="200.0" x2="500" y2="200.0" stroke="#dce4e5" stroke-width="2" /><text x="88" y="208.0" font-size="24" fill="#50636e" text-anchor="end" font-weight="400">1</text><text x="500" y="535" font-size="24" fill="#50636e" text-anchor="middle" font-weight="400">1</text><path d="M100.00,500.00 L300.00,425.00 L300.00,425.00 L295.00,428.70 L290.00,432.31 L285.00,435.83 L280.00,439.25 L275.00,442.58 L270.00,445.81 L265.00,448.95 L260.00,452.00 L255.00,454.95 L250.00,457.81 L245.00,460.58 L240.00,463.25 L235.00,465.83 L230.00,468.31 L225.00,470.70 L220.00,473.00 L215.00,475.20 L210.00,477.31 L205.00,479.33 L200.00,481.25 L195.00,483.08 L190.00,484.81 L185.00,486.45 L180.00,488.00 L175.00,489.45 L170.00,490.81 L165.00,492.08 L160.00,493.25 L155.00,494.33 L150.00,495.31 L145.00,496.20 L140.00,497.00 L135.00,497.70 L130.00,498.31 L125.00,498.83 L120.00,499.25 L115.00,499.58 L110.00,499.81 L105.00,499.95
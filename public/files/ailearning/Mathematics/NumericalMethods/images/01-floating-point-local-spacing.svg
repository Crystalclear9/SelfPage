<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="598" viewBox="0 0 1320 598" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">浮点刻度随量级变化</title><desc id="plate-desc">同样的增量相对细刻度足够大，在粗刻度下却仍舍入到原点。示意不是实际浮点格式。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="598" fill="white" stroke="none" stroke-width="1.6"/><text x="169" y="201" fill="#196f77" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">小量级</text><line x1="319" y1="192" x2="1163" y2="192" stroke="#202a37" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="395" y1="181" x2="395" y2="203" stroke="#202a37" stroke-width="1.55" stroke-linecap="round"/><circle cx="395" cy="192" r="5.5" stroke="#196f77" stroke-width="1.7" fill="white"/><line x1="471" y1="181" x2="471" y2="203" stroke="#202a37" stroke-width="1.55" stroke-linecap="round"/><circle cx="471" cy="192" r="5.5" stroke="#196f77" stroke-width="1.7" fill="white"/><line x1="547" y1="181" x2="547" y2="203" stroke="#202a37" stroke-width="1.55" stroke-linecap="round"/><circle cx="547" cy="192" r="5.5" stroke="#196f77" stroke-width="1.7" fill="white"/><line x1="623" y1="181" x2="623" y2="203" stroke="#202a37" stroke-width="1.55" stroke-linecap="round"/><circle cx="623" cy="192" r="5.5" stroke="#196f77" stroke-width="1.7" fill="white"/><line x1="699" y1="181" x2="699" y2="203" stroke="#202a37" stroke-width="1.55" stroke-linecap="round"/><circle cx="699" cy="192" r="5.5" stroke="#196f77" stroke-width="1.7" fill="white"/><line x1="775" y1="181" x2="775" y2="203" stroke="#202a37" stroke-width
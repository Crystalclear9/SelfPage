<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="923.8768" viewBox="0 0 1440 923.8768" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">浮点中点上的精确乘积：先乘后加丢失低位，融合乘加保留结果</title><rect width="1440" height="923.8768" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">浮点中点上的精确乘积：先乘后加丢失低位，融合乘加保留结果</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="781.8768" viewBox="36.6667 67.3333 1125.3333 654.6667" role="img" x="48" y="106" overflow="hidden"><title>精确乘积在浮点中点时先乘后加与FMA的差异</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="27" fill="#638199" text-anchor="start" font-weight="normal">binary64 · 最近舍入，平局取偶数 · 输入均可精确表示</text><text x="60" y="165" font-size="30" fill="#20364c" text-anchor="start" font-weight="normal">a = 1 + h，b = 1 − h，c = −1</text><text x="60" y="207" font-size="27" fill="#20364c" text-anchor="start" font-weight="normal">h = 2 的 −27 次方；δ = h² = 2 的 −54 次方</text><text x="60" y="268" font-size="29" fill="#20364c" text-anchor="start" font-weight="bold">精确乘积 ab = 1 − δ，恰在相邻浮点数中间</text><line x1="200" y1="350" x2="1000" y2="350" stroke="#20364c" stroke-width="3"/><line x1="250" y1="336" x2="250" y2="364" stroke="#2273b6" stroke-width="4"/><circle cx="250" cy="350" r="8" fill="#2273b6"/><text x="250" y="402" font-size="30" fill="#2273b6" text-anchor="middle" font-weight="normal">1 − 2δ</text><line x1="600" y1="336" x2="600" y2="364" stroke="#c46e35" stroke-width="4"/><circle cx="600" cy="350" r="8" fill="#c46e35"/><text x="600" y="402" font-size="30" fill="#c46e35" text-anchor="middle" font-weight="normal">1 − δ</text><line x1="950" y1="336" x2="950" y2="364" stroke="#2273b6" stroke-width="4"/><circle cx="950" cy="350" r="8" fill="#2273b6"/><text x="950" y="402" font-size="30" fill="#2273b6" text-anchor="middle" font-weight="normal">1</text><text x="250" y="441" font-size="25" fill="#20364c" text-anchor="middle" font-weight="normal">可表示的前一个数</text><text x="600" y="441" font-size="25" fill="#c46e35" text-anchor="middle" font-weight="normal">不可表示的中点</text><text x="950" y="441" font-size="25" fill="#2273b6" text-anchor="middle" font-weight="normal">偶数尾数，取此值</text><line x1="610" y1="310" x2="930" y2="310" stroke="#c46e35" stroke-width="4"/><path d="M 917.000,300.000 L 933.000,310.000 L 917.000,320.000" stroke="#c46e35" stroke-width="3" fill="none"/><text x="770" y="296" font-size="26" fill="#c46e35" text-anchor="middle" font-weight="normal">乘法先舍入</text><rect x="60" y="491" width="1080" height="94" fill="#f0f5fa"/><rect x="60" y="606" width="1080" height="94" fill="#fff3e9"/><text x="85" y="530" font-size="29" fill="#2273b6" text-anchor="start" font-weight="bold">分开运算</text><text x="325" y="530" font-size="29" fill="#20364c" text-anchor="start" font-weight="normal">round(ab) = 1</text><text x="325" y="568" font-size="28" fill="#2273b6" text-anchor="start" font-weight="normal">再减 1，结果为 0</text><text x="85" y="646" font-size="29" fill="#c46e35" text-anchor="start" font-weight="bold">融合乘加</text><text x="325" y="646" font-size="29" fill="#20364c" text-anchor="start" font-weight="normal">先算精确 ab − 1 = −δ</text><text x="325" y="684" font-size="28" fill="#c46e35" text-anchor="start" font-weight="normal">只舍入一次，结果仍为 −δ</text></g><desc> 融合乘加保留了哪一位？ δ ≈ 5.551115 × 10 的 −17 次方 对已经舍入的 [1, −1] 再做精确求和，也无法恢复丢失的乘积低位。</desc></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">精确乘积在 binary64 的两个相邻数中间</title>
<desc id="fig-desc">分开计算先把乘积舍入为一，融合乘加只舍入最终结果并保留负的低位。</desc>
<rect x="0" y="0" width="1200" height="660" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="73" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">只舍入一次，低位可以留下</text>
<text x="74" y="110" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">a = 1 + h，b = 1 − h，c = −1；h = 2⁻²⁷，δ = h² = 2⁻⁵⁴。</text>
<path d="M207 223 L1003 223" fill="none" stroke="#233b4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1003 223 L992 228 L992 218 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="270" cy="223" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="270" y="266" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">1 − 2δ</text>
<circle cx="600" cy="223" r="8" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="600" y="266" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">1 − δ</text>
<circle cx="930" cy="223" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="930" y="266" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">1</text>
<text x="600" y="179" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">精确乘积 ab</text>
<text x="930" y="179" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">偶数尾数</text>
<path d="M75 308 L1125 308" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="73" y="392" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">分开运算</text>
<path d="M315 410 L342 356 L613 356 L586 410 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="391.4" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">乘法舍入为 1</text>
<path d="M621 384 L733 384" fill="none" stroke="#a74d3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M733 384 L722 389 L722 379 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M743 410 L770 356 L1086 356 L1059 410 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="914.5" y="391.4" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">再减 1 → 0</text>
<text x="73" y="500" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">融合乘加</text>
<path d="M315 518 L342 464 L613 464 L586 518 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="499.4" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">先求精确 ab − 1</text>
<path d="M621 492 L733 492" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M733 492 L722 497 L722 487 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M743 518 L770 464 L1086 464 L1059 518 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="914.5" y="499.4" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">舍入一次 → −δ</text>
<text x="73" y="605" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">binary64 最近舍入，平局取偶数；此处输入均可精确表示。</text>
</svg>

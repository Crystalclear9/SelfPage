<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>精确乘积在浮点中点时先乘后加与FMA的差异</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="62" font-size="38" fill="#22364a" text-anchor="start" font-weight="bold">融合乘加保留了哪一位？</text><text x="60" y="112" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">binary64 · 最近舍入，平局取偶数 · 输入均可精确表示</text><text x="60" y="165" font-size="30" fill="#22364a" text-anchor="start" font-weight="normal">a = 1 + h，b = 1 − h，c = −1</text><text x="60" y="207" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">h = 2 的 −27 次方；δ = h² = 2 的 −54 次方</text><text x="60" y="268" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">精确乘积 ab = 1 − δ，恰在相邻浮点数中间</text><line x1="200" y1="350" x2="1000" y2="350" stroke="#22364a" stroke-width="3"/><line x1="250" y1="336" x2="250" y2="364" stroke="#2666a4" stroke-width="4"/><circle cx="250" cy="350" r="8" fill="#2666a4"/><text x="250" y="402" font-size="30" fill="#2666a4" text-anchor="middle" font-weight="normal">1 − 2δ</text><line x1="600" y1="336" x2="600" y2="364" stroke="#c86d31" stroke-width="4"/><circle cx="600" cy="350" r="8" fill="#c86d31"/><text x="600" y="402" font-size="30" fill="#c86d31" text-anchor="middle" font-weight="normal">1 − δ</text><line x1="950" y1="336" x2="950" y2="364" stroke="#2666a4" stroke-width="4"/><circle cx="950" cy="350" r="8" fill="#2666a4"/><text x="950" y="402" font-size="30" fill="#2666a4" text-anchor="middle" font-weight="normal">1</text><text x="250" y="441" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">可表示的前一个数</text><text x="600" y="441" font-size="25" fill="#c86d31" text-anchor="middle" font-weight="normal">不可表示的中点</text><text x="950" y="441" font-size="25" fill="#2666a4" text-anchor="middle" font-weight="normal">偶数尾数，取此值</text><line x1="610" y1="310" x2="930" y2="310" stroke="#c86d31" stroke-width="4"/><path d="M 917.000,300.000 L 933.000,310.000 L 917.000,320.000" stroke="#c86d31" stroke-width="3" fill="none"/><text x="770" y="296" font-size="26" fill="#c86d31" text-anchor="middle" font-weight="normal">乘法先舍入</text><rect x="60" y="491" width="1080" height="94" fill="#f0f5fa"/><rect x="60" y="606" width="1080" height="94" fill="#fff3e9"/><text x="85" y="530" font-size="29" fill="#2666a4" text-anchor="start" font-weight="bold">分开运算</text><text x="325" y="530" font-size="29" fill="#22364a" text-anchor="start" font-weight="normal">round(ab) = 1</text><text x="325" y="568" font-size="28" fill="#2666a4" text-anchor="start" font-weight="normal">再减 1，结果为 0</text><text x="85" y="646" font-size="29" fill="#c86d31" text-anchor="start" font-weight="bold">融合乘加</text><text x="325" y="646" font-size="29" fill="#22364a" text-anchor="start" font-weight="normal">先算精确 ab − 1 = −δ</text><text x="325" y="684" font-size="28" fill="#c86d31" text-anchor="start" font-weight="normal">只舍入一次，结果仍为 −δ</text><text x="60" y="751" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">δ ≈ 5.551115 × 10 的 −17 次方</text><text x="60" y="793" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">对已经舍入的 [1, −1] 再做精确求和，也无法恢复丢失的乘积低位。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="630" viewBox="0 0 1380 630" role="img" aria-labelledby="label detail"><title id="label">被压缩的方向为何难以反演</title><desc id="detail">前向将单位圆竖直压扁。另一个观测单位圆经逆映射竖直拉长，表示该方向的误差放大。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1380" height="630" fill="white" stroke="none" stroke-width="1.6"/><text x="156" y="193" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">前向映射</text><ellipse cx="475" cy="184" rx="72" ry="72" fill="url(#wash-gray)" stroke="#657682" stroke-width="1.8"/><line x1="475" y1="184" x2="475" y2="119" stroke="#657682" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="475" y1="184" x2="540" y2="184" stroke="#657682" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-gray)"/><circle cx="475" cy="184" r="4" stroke="#202a37" fill="#202a37" stroke-width="1.75"/><ellipse cx="1072" cy="184" rx="72" ry="36" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.8"/><line x1="1072" y1="184" x2="1072" y2="155" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="1072" y1="184" x2="1137" y2="184" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="1072" cy="184" r="4" stroke="#202a37" fill="#202a37" stroke-width="1.75"/><line x1="625" y1="184" x2="918" y2="184" stroke="#196f77" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="764" y="158" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Micr
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>反变量配对如何在同成本下降方差</title><desc>估计均匀变量U在[0,1]上的均值时，独立抽两个样本的平均仍有随机波动。反变量法配对U与1−U，每一对平均都恰好为0.5，因此这个特定线性积分的配对方差为零；图中连接线表示同一随机数产生的配对。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">反变量配对如何在同成本下降方差</text><text x="70" y="160" font-size="22" fill="#16344c" text-anchor="start">互补输入的配对：每条连线两端平均都等于0.5</text><line x1="200" y1="650" x2="1000" y2="650" stroke="#277eac" stroke-width="2.5" /><text x="200" y="695" font-size="22" fill="#16344c" text-anchor="start">0</text><text x="600" y="695" font-size="22" fill="#16344c" text-anchor="start">0.5</text><text x="1000" y="695" font-size="22" fill="#16344c" text-anchor="start">1</text><line x1="280.0" y1="260" x2="920.0" y2="260" stroke="#277eac" stroke-width="2.5" /><circle cx="280.0" cy="260" r="32" fill="#daedf8" stroke="#5597b5" /><text x="280.0" y="268" font-size="22" fill="#16344c" text-anchor="middle">0.1</text><circle cx="920.0" cy="260" r="32" fill="#daedf8" stroke="#5597b5" /><text x="920.0" y="268" font-size="22" fill="#16344c" text-anchor="middle">0.9</text><text x="575" y="300" font-size="19" fill="#16344c" text-anchor="start">均值0.5</text><line x1="400.0" y1="370" x2="800.0" y2="370" stroke="#277eac" stroke-width="2.5" /><circle cx="400.0" cy="370" r="32" fill="#daedf8" stroke="#5597b5" /><text x="400.0" y="378" font-size="22" fill="#16344c" text-anchor="middle">0.25</text><circle cx="800.0" cy="370" r="32" fill="#daedf8" stroke="#5597b5" /><text x="800.0" y="378" font-size="22" fill="#16344c" text-anchor="middle">0.75</text><text x="575" y="410" font-size="19" fill="#16344c" text-anchor="start">均值0.5</text><line x1="520.0" y1="480" x2="680.0" y2="480" stroke="#277eac" stroke-width="2.5" /><circle cx="520.0" cy="480" r="32" fill="#daedf8" stroke="#5597b5" /><text x="520.0" y="488" font-size="22" fill="#16344c" text-anchor="middle">0.4</text><circle cx="680.0" cy="480" r="32" fill="#daedf8" stroke="#5597b5" /><text x="680.0" y="488" font-size="22" fill="#16344c" text-anchor="middle">0.6</text><text x="575" y="520" font-size="19" fill="#16344c" text-anchor="start">均值0.5</text></g></svg>

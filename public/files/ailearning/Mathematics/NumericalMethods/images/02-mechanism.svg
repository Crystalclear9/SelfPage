<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title id="extra-title">反变量配对如何在同成本下降方差</title><desc id="extra-desc">为了看清“降方差”而不依赖线性函数的零方差特例，这里估计 \int_0^1u^2\,du=\frac{1}{3}。蓝、橙曲线分别为 U^2 与 (1-U)^2；一个升高时另一个降低。灰线是反变量估计量 A=\frac{U^2+(1-U)^2}{2}=U^2-U+\frac{1}{2}，它仍有随机起伏，其期望却仍等于 \frac{1}{3}。

单次函数值方差为 \operatorname{Var}(U^2)=\frac{4}{45}，两项协方差为 \operatorname{Cov}(U^2,(1-U)^2)=\frac{1}{30}-\frac{1}{9}=-\frac{7}{90}。因此，独立均匀变量 U,V 的估计量 \frac{U^2+V^2}{2} 方差为 \frac{2}{45}，反变量 A 方差为 \frac{1}{180}，恰好是前者的 \frac{1}{8}。右图对比的是**每对两次函数求值**的方差；实际运行成本还包含生成随机数等开销。一般函数仍要检查输出协方差，输入互补本身不保证改进。

反变量与等计算成本比较见 [Owen《Monte Carlo Theory, Methods and Examples》第 8 章](https://artowen.su.domains/mc/Ch-var-basic.pdf)。</desc><rect width="1200" height="700" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">反变量配对如何在同成本下降方差</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">同一个 U 产生相反起伏</text><text x="690" y="105" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">每对都用两次函数求值</text><line x1="85" y1="535.0" x2="515" y2="535.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="543.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="360.0" x2="515" y2="360.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="368.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="85" y1="185.0" x2="515" y2="185.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="193.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="85" y1="185" x2="85" y2="535" stroke="#627689" stroke-width="2" /><line x1="85" y1="535" x2="515" y2="535" stroke="#627689" stroke-width="2" /><line x1="85.0" y1="535.0" x2="85.0" y2="541.0" stroke="#627689" stroke-width="2" /><text x="85.0" y="567.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="300.0" y1="535.0" x2="300.0" y2="541.0" stroke="#627689" stroke-width="2" /><text x="300.0" y="567.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0.5</text><line x1="515.0" y1="535.0" x2="515.0" y2="541.0" stroke="#627689" stroke-width=
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>减去最大值能防溢出，不能恢复输入中已丢失的差</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">减去最大值能防溢出，不能恢复输入中已丢失的差</text><text x="60" y="120" font-size="28" fill="#71858b" text-anchor="start">理想 logits = (c, c + 1)；第一类概率恒为 0.268941…</text><text x="60" y="185" font-size="28" fill="#19333c" text-anchor="start">先观察计算范围：改变共同偏移 c</text><rect x="458.95099999999996" y="260" width="131.04900000000004" height="350" fill="#fbf0e8"/><line x1="140" y1="610" x2="590" y2="610" stroke="#dbe5e8" stroke-width="2"/><text x="125" y="618" font-size="23" fill="#71858b" text-anchor="end">0</text><line x1="140" y1="522.5" x2="590" y2="522.5" stroke="#dbe5e8" stroke-width="2"/><text x="125" y="530.5" font-size="23" fill="#71858b" text-anchor="end">0.25</text><line x1="140" y1="435.0" x2="590" y2="435.0" stroke="#dbe5e8" stroke-width="2"/><text x="125" y="443.0" font-size="23" fill="#71858b" text-anchor="end">0.5</text><line x1="140" y1="347.5" x2="590" y2="347.5" stroke="#dbe5e8" stroke-width="2"/><text x="125" y="355.5" font-size="23" fill="#71858b" text-anchor="end">0.75</text><line x1="140" y1="260" x2="590" y2="260" stroke="#dbe5e8" stroke-width="2"/><text x="125" y="268" font-size="23" fill="#71858b" text-anchor="end">1</text><line x1="140.0" y1="515.8705025205018" x2="590.0" y2="515.8705025205018" stroke="#256b82" stroke-width="5"/><circle cx="140.0" cy="515.8705025205018" r="7" fill="white" stroke="#c0643c" stroke-width="3"/><circle cx="185.0" cy="515.8705025205018" r="7" fill="white" stroke="#c0643c" stroke-width="3"/><circle cx="275.0" cy="515.8705025205018" r="7" fill="white" stroke="#c0643c" stroke-width="3"/><circle cx="365.0" cy="515.8705025205018" r="7" fill="white" stroke="#c0643c" stroke-width="3"/><circle cx="455.0" cy="515.8705025205018" r="7" fill="white" stroke="#c0643c" stroke-width="3"/><text x="140.0" y="655" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="365.0" y="655" font-size="24" fill="#71858b" text-anchor="middle">500</text><text x="590.0" y="655" font-size="24" fill="#71858b" text-anchor="middle">1000</text><text x="490" y="700" font-size="27" fill="#19333c" text-anchor="start">共同偏移 c</text><text x="455" y="310" font-size="25" fill="#c0643c" text-anchor="middle">原始指数</text><text x="455" y="350" font-size="25" fill="#c0643c" text-anchor="middle">开始溢出</text><text x="650" y="185" font-size="28" fill="#19333c" text-anchor="start">再观察输入精度：一的差能否保存</text><text x="650" y="290" font-size="29" fill="#19333c" text-anchor="start">c = 1000</text><text x="650" y="342" font-size="27" fill="#71858b" text-anchor="start">存入 binary64 后的差：1</text><text x="650" y="392" font-size="26" fill="#256b82" text-anchor="start">稳定 softmax：(0.268941, 0.731059)</text><text x="650" y="465" font-size="29" fill="#19333c" text-anchor="start">c = 10 的 16 次方</text><text x="650" y="517" font-size="27" fill="#71858b" text-anchor="start">存入 binary64 后的差：0</text><text x="650" y="567" font-size="26" fill="#256b82" text-anchor="start">稳定 softmax：(0.5, 0.5)</text><text x="60" y="758" font-size="26" fill="#19333c" text-anchor="start">蓝线：稳定实现；橙色空心点：朴素公式尚未发生范围问题的结果。</text><text x="60" y="796" font-size="26" fill="#71858b" text-anchor="start">c 很大时 c + 1 先被舍入为 c；此时两个相同输入只能产生相同概率。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>减去最大值保持概率又控制指数尺度</title><desc>原始logits为1000和999，直接指数化可能溢出。统一减去最大值后变为0和−1，softmax仍得到约0.731与0.269，因为分子分母同时乘了相同尺度。图比较的是指数前的数值范围，而非改变分类概率。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">减去最大值保持概率又控制指数尺度</text><text x="85" y="190" font-size="22" fill="#16344c" text-anchor="start">数值</text><line x1="100" y1="609.7085761865112" x2="1100" y2="609.7085761865112" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="318.3" width="145.0" height="291.4" fill="#118779" /><text x="207.5" y="302.2847626977519" font-size="24" fill="#16344c" text-anchor="middle">1000</text><text x="207.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">原logit1</text><rect x="370.0" y="318.6" width="145.0" height="291.1" fill="#d26724" /><text x="442.5" y="302.5761865112407" font-size="24" fill="#16344c" text-anchor="middle">999</text><text x="442.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">原logit2</text><rect x="605.0" y="609.7" width="145.0" height="0.0" fill="#148671" /><text x="677.5" y="593.7085761865112" font-size="24" fill="#16344c" text-anchor="middle">0</text><text x="677.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">平移后1</text><rect x="840.0" y="609.7" width="145.0" height="0.3" fill="#118779" /><text x="912.5" y="640.0" font-size="24" fill="#16344c" text-anchor="middle">-1</text><text x="912.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">平移后2</text><text x="100" y="135" font-size="21" fill="#416478">平移前后概率均约(0.731,0.269)</text></g></svg>

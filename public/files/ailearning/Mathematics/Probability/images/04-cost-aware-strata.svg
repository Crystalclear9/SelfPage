<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>固定预算下三种分层采样分配的精确方差</title><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="62" font-size="38" fill="#22364a" text-anchor="start" font-weight="bold">同样预算，样本最多未必最准</text><text x="60" y="112" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">两层（概率，标准差，成本）：(0.9，1，1) 与 (0.1，9，9)</text><text x="60" y="166" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">每种方案总成本均为 180；蓝色为第一层，橙色为第二层</text><text x="60" y="235" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">按层概率</text><text x="60" y="277" font-size="25" fill="#64788b" text-anchor="start" font-weight="normal">样本数：90 + 10 = 100</text><rect x="485" y="206" width="185.0" height="48" fill="#2666a4"/><rect x="670.0" y="206" width="185.0" height="48" fill="#c86d31"/><text x="577.5" y="240" font-size="26" fill="white" text-anchor="middle" font-weight="normal">90</text><text x="762.5" y="240" font-size="26" fill="white" text-anchor="middle" font-weight="normal">90</text><text x="485" y="293" font-size="24" fill="#64788b" text-anchor="start" font-weight="normal">成本分配</text><text x="925" y="239" font-size="34" fill="#22364a" text-anchor="start" font-weight="bold">0.090</text><text x="60" y="395" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">只按概率×标准差</text><text x="60" y="437" font-size="25" fill="#64788b" text-anchor="start" font-weight="normal">样本数：18 + 18 = 36</text><rect x="485" y="366" width="37.0" height="48" fill="#2666a4"/><rect x="522.0" y="366" width="333.0" height="48" fill="#c86d31"/><text x="503.5" y="400" font-size="26" fill="white" text-anchor="middle" font-weight="normal">18</text><text x="688.5" y="400" font-size="26" fill="white" text-anchor="middle" font-weight="normal">162</text><text x="485" y="453" font-size="24" fill="#64788b" text-anchor="start" font-weight="normal">成本分配</text><text x="925" y="399" font-size="34" fill="#22364a" text-anchor="start" font-weight="bold">0.090</text><text x="60" y="555" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">考虑成本的最优分配</text><text x="60" y="597" font-size="25" fill="#64788b" text-anchor="start" font-weight="normal">样本数：45 + 15 = 60</text><rect x="485" y="526" width="92.5" height="48" fill="#2666a4"/><rect x="577.5" y="526" width="277.5" height="48" fill="#c86d31"/><text x="531.25" y="560" font-size="26" fill="white" text-anchor="middle" font-weight="normal">45</text><text x="716.25" y="560" font-size="26" fill="white" text-anchor="middle" font-weight="normal">135</text><text x="485" y="613" font-size="24" fill="#64788b" text-anchor="start" font-weight="normal">成本分配</text><text x="925" y="559" font-size="34" fill="#2666a4" text-anchor="start" font-weight="bold">0.072</text><text x="920" y="192" font-size="26" fill="#22364a" text-anchor="start" font-weight="bold">估计方差</text><line x1="60" y1="680" x2="1140" y2="680" stroke="#dce5ee" stroke-width="2"/><text x="60" y="729" font-size="28" fill="#22364a" text-anchor="start" font-weight="normal">相对按概率方案：减少廉价层抽样，增加高波动且昂贵层的预算。</text><text x="60" y="778" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">按真实层概率加权汇总；抽得多的层不会因此得到更大的总体权重。</text></g></svg>
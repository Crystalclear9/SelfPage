<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>联合概率如何汇成边缘概率</title><desc>A完整给出一个合法二元联合表。B把A行两格0.2与0.3相加得边缘概率0.5。C在A内重新归一化得到P(B给定A)=0.4，在非A内则为0.6，说明边缘化的加法与条件化的分母是不同步骤。 下方依次展示 B 的边缘分布、A 内的 B 分布与非 A 内的 B 分布。两行按各自概率 0.5 重新归一化，得到不同的条件比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">联合概率如何汇成边缘概率</text><g transform="translate(10,15) scale(.95)"><text x="93.60" y="213.20" font-size="24" fill="#15364c" text-anchor="start">单位面积代表总概率；每格面积等于联合概率</text><rect x="186.00" y="312.00" width="235.20" height="220.40" rx="5" fill="#d6ebe3" stroke="#a5bdc8" /><text x="303.60" y="430.20" font-size="32" fill="#15364c" text-anchor="middle">0.2</text><rect x="421.20" y="312.00" width="352.80" height="220.40" rx="5" fill="#e7eff5" stroke="#a5bdc8" /><text x="597.60" y="430.20" font-size="32" fill="#15364c" text-anchor="middle">0.3</text><rect x="186.00" y="532.40" width="352.80" height="220.40" rx="5" fill="#e7eff5" stroke="#a5bdc8" /><text x="362.40" y="650.60" font-size="32" fill="#15364c" text-anchor="middle">0.3</text><rect x="538.80" y="532.40" width="235.20" height="220.40" rx="5" fill="#d6ebe3" stroke="#a5bdc8" /><text x="656.40" y="650.60" font-size="32" fill="#15364c" text-anchor="middle">0.2</text><text x="93.60" y="448.80" font-size="26" fill="#15364c" text-anchor="start">A</text><text x="93.60" y="669.20" font-size="26" fill="#15364c" text-anchor="start">非A</text><text x="270.00" y="813.60" font-size="24" fill="#15364c" text-anchor="start">每行左侧为B，右侧为非B</text><text x="186.00" y="889.60" font-size="24" fill="#15364c" text-anchor="start">A行总面积0.5；非A行总面积0.5</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="24" fill="#15364c" text-anchor="start">固定同一联合分布</text><rect x="1066.95" y="341.67" width="74.43" height="63.33" fill="#2563eb" /><text x="1104.17" y="332.67" font-size="24" fill="#15364c" text-anchor="middle">0.2</text><text x="1104.17" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">P(A且B)</text><rect x="1195.28" y="310.00" width="74.43" height="95.00" fill="#cb702a" /><text x="1232.50" y="301.00" font-size="24" fill="#15364c" text-anchor="middle">0.3</text><text x="1232.50" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">P(A且非B)</text><rect x="1323.62" y="246.67" width="74.43" height="158.33" fill="#497da4" /><text x="1360.83" y="237.67" font-size="24" fill="#15364c" text-anchor="middle">0.5</text><text x="1360.83" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">P(A)</text><text x="1032" y="411" text-anchor="end" font-size="24" fill="#15364c">0</text><text x="1032" y="347.667" text-anchor="end" font-size="24" fill="#15364c">0.2</text><text x="1032" y="284.333" text-anchor="end" font-size="24" fill="#15364c">0.4</text><text x="1032" y="221" text-anchor="end" font-size="24" fill="#15364c">0.6</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><text x="1007.60" y="633.00" font-size="24" fill="#15364c" text-anchor="start">每行分别归一化</text><text x="1015.60" y="696.36" font-size="24" fill="#15364c" text-anchor="start" /><text x="1150.53" y="696.36" font-size="24" fill="#15364c" text-anchor="start">B</text><text x="1285.47" y="696.36" font-size="24" fill="#15364c" text-anchor="start">非B</text><rect x="1007.60" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1075.07" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">给定A</text><rect x="1142.53" y="712.20" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1210.00" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">0.4</text><rect x="1277.47" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1344.93" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">0.6</text><rect x="1007.60" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1075.07" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">给定非A</text><rect x="1142.53" y="751.80" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1210.00" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">0.6</text><rect x="1277.47" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1344.93" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">0.4</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>同一张联合表：边缘是质量相加，条件是组内重新归一</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一张联合表：边缘是质量相加，条件是组内重新归一</text><text x="65" y="145" font-size="29" fill="#19333c" text-anchor="start">总体：面积代表联合概率</text><text x="690" y="145" font-size="29" fill="#19333c" text-anchor="start">给定访问状态：每组总量变成 1</text><rect x="110" y="235" width="258.0" height="266.6666666666667" fill="#e7c7b5"/><rect x="110" y="501.6666666666667" width="258.0" height="133.33333333333331" fill="#256b82"/><text x="239.0" y="378.33333333333337" font-size="30" fill="#19333c" text-anchor="middle">.4</text><text x="239.0" y="578.3333333333334" font-size="30" fill="white" text-anchor="middle">.2</text><line x1="110" y1="235" x2="110" y2="635" stroke="white" stroke-width="3"/><rect x="368.0" y="235" width="172.0" height="100.0" fill="#e7c7b5"/><rect x="368.0" y="335.0" width="172.0" height="300.0" fill="#256b82"/><text x="454.0" y="295.0" font-size="30" fill="#19333c" text-anchor="middle">.1</text><text x="454.0" y="495.0" font-size="30" fill="white" text-anchor="middle">.3</text><line x1="368.0" y1="235" x2="368.0" y2="635" stroke="white" stroke-width="3"/><text x="239.0" y="688" font-size="27" fill="#19333c" text-anchor="middle">未访问：0.6</text><text x="454.0" y="688" font-size="27" fill="#19333c" text-anchor="middle">已访问：0.4</text><rect x="745" y="235" width="120" height="266.6666666666667" fill="#e7c7b5"/><rect x="745" y="501.6666666666667" width="120" height="133.33333333333331" fill="#256b82"/><text x="805" y="578.3333333333334" font-size="28" fill="white" text-anchor="middle">33.3%</text><text x="805" y="688" font-size="27" fill="#19333c" text-anchor="middle">未访问</text><rect x="1005" y="235" width="120" height="100.0" fill="#e7c7b5"/><rect x="1005" y="335.0" width="120" height="300.0" fill="#256b82"/><text x="1065" y="495.0" font-size="28" fill="white" text-anchor="middle">75%</text><text x="1065" y="688" font-size="27" fill="#19333c" text-anchor="middle">已访问</text><rect x="90" y="745" width="25" height="25" fill="#256b82"/><text x="130" y="768" font-size="27" fill="#256b82" text-anchor="start">购买 X = 1</text><rect x="420" y="745" width="25" height="25" fill="#e7c7b5"/><text x="460" y="768" font-size="27" fill="#19333c" text-anchor="start">未购买 X = 0</text><text x="80" y="820" font-size="29" fill="#19333c" text-anchor="start">右侧两组同样高，不代表它们在总体中同样常见。</text></g></svg>

<text x="75" y="641" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">蓝绿表示购买，橙色表示未购买。联合图的整块面积为一。</text>
<text x="75" y="697" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">回到总体购买率时，必须乘回访问组和未访问组原本的概率。</text>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="710" viewBox="0 0 1360 710" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">条件均值同时让两组残差抵消</title>
  <desc id="plate-desc">每组有两个等概率取值。左图显示两个条件均值和各组残差，右图在同一分布上比较三个候选的平方风险。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="710" fill="white" stroke="none" stroke-width="0"/>
  <text x="358" y="58" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">按 X 分组，对 Y 取平均</text>
  <polyline points="121,475 664,475" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <polyline points="124,478 124,135" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="123" y="118" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="start">观测值 Y</text>
  <text x="394" y="540" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">条件 X</text>
  <polyline points="118,475 124,475" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="112" y="482" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">0</text>
  <polyline points="118,377 124,377" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="112" y="384" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">2</text>
  <polyline points="118,279 124,279" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="112" y="286" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">4</text>
  <polyline points="118,181 124,181" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="112" y="188" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">6</text>
  <polyline points="285,475 285,481" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="285" y="508" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <polyline points="285,426 285,475" fill="none" stroke="#196f77" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <circle cx="285" cy="475" r="6" fill="#196f77" stroke="#196f77" stroke-width="1.6"/>
  <polyline points="285,426 285,377" fill="none" stroke="#196f77" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <circle cx="285" cy="377" r="6" fill="#196f77" stroke="#196f77" stroke-width="1.6"/>
  <circle cx="285" cy="426" r="8" fill="white" stroke="#196f77" stroke-width="1.6"/>
  <text x="322" y="434" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">1</text>
  <polyline points="507,475 507,481" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="507" y="508" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <polyline points="507,230 507,279" fill="none" stroke="#655184" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <circle cx="507" cy="279" r="6" fill="#655184" stroke="#655184" stroke-width="1.6"/>
  <polyline points="507,230 507,181" fill="none" stroke="#655184" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <circle cx="507" cy="181" r="6" fill="#655184" stroke="#655184" stroke-width="1.6"/>
  <circle cx="507" cy="230" r="8" fill="white" stroke="#655184" stroke-width="1.6"/>
  <text x="544" y="238" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">5</text>
  <text x="1011" y="58" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">三个候选共享同一风险刻度</text>
  <text x="814" y="145" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="start">用条件均值</text>
  <rect x="811" y="157" width="78" height="46" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.4"/>
  <text x="922" y="186" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">1</text>
  <text x="814" y="284" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="start">用总体均值</text>
  <rect x="811" y="296" width="390" height="46" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.4"/>
  <text x="1234" y="325" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">5</text>
  <text x="814" y="423" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#655184" text-anchor="start">用两个端点</text>
  <rect x="811" y="435" width="156" height="46" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.4"/>
  <text x="1000" y="464" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">2</text>
  <text x="680" y="650" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">空心点是条件均值；同一组内，一正一负的残差相加为零。</text>
</svg>

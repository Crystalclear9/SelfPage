<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="580.6913" viewBox="23.3333 64.6667 1118.6667 541.3333" role="img"><title id="extra-title">条件均值：先消除组内残差，再比较可避免的误差</title><desc id="extra-desc">令四种 (X,Y) 取值 (0,0),(0,2),(1,4),(1,6) 各以 \frac14 概率发生。于是 m(0)=1、m(1)=5；每组两个观测相对组均值的残差分别为 -1,+1，与只由该组决定的函数正交，最小均方风险为 1。若始终预测总体均值 3，四个平方误差为 9,1,1,9，均方风险为 5。若改成 g(0)=0,g(1)=6，平方误差为 0,4,4,0，风险为 2。

最后一个候选的风险可独立拆成 1+E[(m(X)-g(X))^2]=1+1=2。左图中的竖直残差箭头解释了交叉项为什么在每组内抵消；右图把同一分布下的三个候选放在共同分母上比较。该算例使用平方损失和有限二阶矩，换成绝对损失时最优动作的定义也会变化。 条件均值：先消除组内残差，再比较可避免的误差</desc><rect width="1200" height="635" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="45" y="112" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">每组观测与条件均值</text><text x="685" y="112" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">全体样本的均方风险</text><line x1="80" y1="495.0" x2="490" y2="495.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="503.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="80" y1="440.0" x2="490" y2="440.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="448.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="80" y1="385.0" x2="490" y2="385.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="393.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">2</text><line x1="80" y1="330.0" x2="490" y2="330.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="338.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">3</text><line x1="80" y1="275.0" x2="490" y2="275.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="283.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">4</text><line x1="80" y1="220.0" x2="490" y2="220.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="228.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">5</text><line x1="80" y1="165.0" x2="490" y2="165.0" stroke="#dce5ed" stroke-width="2" /><text x="68" y="173.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">6</text><line x1="80" y1="165" x2="80" y2="495" stroke="#627689" stroke-width="2" /><line x1="80" y1="495" x2="490" y2="495" stroke="#627689" stroke-width="2" /><line x1="156.875" y1="495.0" x2="156.875" y2="501.0" stroke="#627689" stroke-width="2" /><text x="156.875" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="413.125" y1="495.0" x2="413.125" y2="501.0" stroke="#627689" stroke-width="2" /><text x="413.125" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><circle cx="156.875" cy="495.0" r="9" fill="#2865a0" /><path d="M156.875,495.0 L156.875,440.0" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><circle cx="156.875" cy="385.0" r="9" fill="#2865a0" /><path d="M156.875,385.0 L156.875,440.0" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><line x1="128.875" y1="440.0" x2="184.875" y2="440.0" stroke="#cf7432" stroke-width="5" /><text x="196.875" y="448.0" font-size="25" fill="#cf7432" text-anchor="start" font-weight="400">均值 1</text><circle cx="413.125" cy="275.0" r="9" fill="#2865a0" /><path d="M413.125,275.0 L413.125,220.0" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><circle cx="413.125" cy="165.0" r="9" fill="#2865a0" /><path d="M413.125,165.0 L413.125,220.0" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><line x1="385.125" y1="220.0" x2="441.125" y2="220.0" stroke="#cf7432" stroke-width="5" /><text x="453.125" y="228.0" font-size="25" fill="#cf7432" text-anchor="start" font-weight="400">均值 5</text><text x="230" y="562" font-size="27" fill="#213447" text-anchor="start" font-weight="400">输入 X</text><line x1="705" y1="495.0" x2="1120" y2="495.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="503.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="705" y1="440.0" x2="1120" y2="440.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="448.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="705" y1="385.0" x2="1120" y2="385.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="393.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">2</text><line x1="705" y1="330.0" x2="1120" y2="330.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="338.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">3</text><line x1="705" y1="275.0" x2="1120" y2="275.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="283.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">4</text><line x1="705" y1="220.0" x2="1120" y2="220.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="228.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">5</text><line x1="705" y1="165.0" x2="1120" y2="165.0" stroke="#dce5ed" stroke-width="2" /><text x="693" y="173.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">6</text><line x1="705" y1="165" x2="705" y2="495" stroke="#627689" stroke-width="2" /><line x1="705" y1="495" x2="1120" y2="495" stroke="#627689" stroke-width="2" /><rect x="739.1666666666666" y="220.0" width="70" height="275.0" fill="#2865a0" /><text x="774.1666666666666" y="205.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">5</text><rect x="877.5" y="440.0" width="70" height="55.0" fill="#cf7432" /><text x="912.5" y="425.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="1015.8333333333335" y="385.0" width="70" height="110.0" fill="#2865a0" /><text x="1050.8333333333335" y="370.0" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">2</text><text x="774.1666666666666" y="540" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">常数预测</text><text x="774.1666666666666" y="578" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">3</text><text x="912.5" y="540" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">条件均值</text><text x="912.5" y="578" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">(1,5)</text><text x="1050.8333333333335" y="540" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">另一预测</text><text x="1050.8333333333335" y="578" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">(0,6)</text></g></svg>

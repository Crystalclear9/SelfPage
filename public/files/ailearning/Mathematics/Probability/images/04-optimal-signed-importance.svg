<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="693" viewBox="0 0 1200 693" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">相同的最优采样概率可以产生不同方差</title>
<desc id="fig-desc">同号时两种状态都返回四；异号时分别返回四与负四。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="583" viewBox="0 0 1310 583" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">条件化重新限定观察范围</title><desc id="plate-desc">条件化后将 B 的概率作为分母，交集区域作为分子。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient><clipPath id="b-0"><circle cx="397" cy="277" r="131"/></clipPath><clipPath id="b-1"><circle cx="1063" cy="277" r="131"/></clipPath></defs><rect x="0" y="0" width="1310" height="583" fill="white" stroke="none" stroke-width="1.6"/><text x="319" y="69" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">原观察范围</text><rect x="69" y="113" width="510" height="338" fill="white" stroke="#c9d7dc" stroke-width="1.6"/><circle cx="397" cy="277" r="131" stroke="#655184" stroke-width="1.9" fill="url(#wash-violet)"/><circle cx="247" cy="277" r="131" stroke="#196f77" stroke-width="1.7" fill="url(#wash-teal)"/><circle cx="247" cy="277" r="131" stroke="#196f77" stroke-width="0" fill="url(#wash-coral)" clip-path="url(#b-0)"/><text x="205" y="285" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><text x="439" y="285" fill="#655184" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><text x="319" y="503" fill="#202a37" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">分母是整个样本空间</text><text x="985" y="69" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">已知 B 发生</text><circle cx="1063" cy="277" r="131" stroke="#655184" stroke-width="1.9" fill="url(#wash-violet)"/><circle cx="913" cy="277" r="131" stroke="#657682" stroke-width="1.7" fill="none" stroke-dasharray="6 7"/><circle cx="913" cy="277" r="131" stroke="#196f77" stroke-width="0" fill="url(#wash-coral)" clip-path="url(#b-1)"/><text x="871" y="285" fill="#196f77" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><text x="1105" y="285" fill="#655184" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><text x="985" y="503" fill="#202a37" font-size="30" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">分母是 B，分子是交集</text><line x1="593" y1="276" x2="706" y2="276" stroke="#202a37" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/></svg>
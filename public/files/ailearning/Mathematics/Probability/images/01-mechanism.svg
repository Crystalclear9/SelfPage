<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>共同原因如何产生边际相关</title><desc>设Z取0或1各一半，在给定Z后A和B独立；Z=0时两事件概率均为0.1，Z=1时均为0.9。边际概率P(A)=P(B)=0.5，但共同发生概率为0.41，大于0.25。条件独立因此不等于边际独立。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">共同原因如何产生边际相关</text><circle cx="200" cy="400" r="32" fill="#daedf8" stroke="#5597b5" /><text x="200" y="408" font-size="22" fill="#16344c" text-anchor="middle">Z</text><rect x="430" y="180" width="350" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="445" y="217" font-size="25" fill="#16344c" text-anchor="start">Z=0，权重0.5</text><text x="445" y="255" font-size="21" fill="#16344c" text-anchor="start">A、B条件概率均0.1</text><rect x="430" y="500" width="350" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="445" y="537" font-size="25" fill="#16344c" text-anchor="start">Z=1，权重0.5</text><text x="445" y="575" font-size="21" fill="#16344c" text-anchor="start">A、B条件概率均0.9</text><path d="M235,380 L415,225" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M235,420 L415,545" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="840" y="235" font-size="22" fill="#16344c" text-anchor="start">联合项0.01</text><text x="840" y="555" font-size="22" fill="#16344c" text-anchor="start">联合项0.81</text><text x="230" y="720" font-size="22" fill="#16344c" text-anchor="start">混合后共同发生概率：0.5×0.01 + 0.5×0.81 = 0.41</text><text x="180" y="130" font-size="20" fill="#15364c">模型条件：给定 Z 后 A 与 B 独立，联合项才能相乘。</text></g></svg>

"556.0" stroke="#62808f" stroke-width="2"/><text x="416.0" y="587.0" font-size="24" fill="#516b7b" text-anchor="middle">2</text><line x1="620.0" y1="550.0" x2="620.0" y2="556.0" stroke="#62808f" stroke-width="2"/><text x="620.0" y="587.0" font-size="24" fill="#516b7b" text-anchor="middle">3</text><line x1="824.0" y1="550.0" x2="824.0" y2="556.0" stroke="#62808f" stroke-width="2"/><text x="824.0" y="587.0" font-size="24" fill="#516b7b" text-anchor="middle">4</text><line x1="1028.0" y1="550.0" x2="1028.0" y2="556.0" stroke="#62808f" stroke-width="2"/><text x="1028.0" y="587.0" font-size="24" fill="#516b7b" text-anchor="middle">5</text><line x1="110" y1="550" x2="1130" y2="550" stroke="#62808f" stroke-width="2"/><line x1="110" y1="250" x2="110" y2="550" stroke="#62808f" stroke-width="2"/><text x="620.0" y="626" font-size="26" fill="#1c2f42" text-anchor="middle">状态</text><text x="110" y="230" font-size="26" fill="#1c2f42" text-anchor="start">目标概率</text><rect x="926.0" y="250" width="204.0" height="300" fill="#f4e5dd"/><rect x="170.48" y="287.5" width="30" height="262.5" fill="#1e7093"/><rect x="223.51999999999998" y="418.75" width="30" height="131.25" fill="#b96235"/><rect x="374.48" y="512.5" width="30" height="37.5" fill="#1e7093"/><rect x="427.52" y="531.25" width="30" height="18.75" fill="#b96235"/><rect x="578.48" y="512.5" width="30" height="37.5" fill="#1e7093"/><rect x="631.52" y="531.25" width="30" height="18.75" fill="#b96235"/><rect x="782.48" y="512.5" width="30" height="37.5" fill="#1e7093"/><rect x="835.52" y="531.25" width="30" height="18.75" fill="#b96235"/><rect x="986.4800000000001" y="550.0" width="30" height="0.0" fill="#1e7093"/><rect x="1039.52" y="362.5" width="30" height="187.5" fill="#b96235"/><text x="110" y="175" font-size="28" fill="#1c2f42" text-anchor="start">蓝：目标 A；橙：目标 B</text><text x="930" y="175" font-size="25" fill="#b96235" text-anchor="start">状态 5：从未被采到</text><text x="75" y="690" font-size="26" fill="#1c2f42" text-anchor="start">相同的四
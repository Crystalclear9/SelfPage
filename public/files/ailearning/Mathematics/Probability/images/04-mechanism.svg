<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="797.2208" viewBox="29.1556 59.0222 1146.3111 713.9556" role="img"><title>权重看起来一样，也可能完全漏掉一半目标概率</title><rect width="1280" height="850" fill="white" /><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="105" font-size="25" fill="#50636e" text-anchor="start">五状态模型；提议分布只覆盖前四个状态，未覆盖状态 5</text><line x1="110.0" y1="550.0" x2="1130.0" y2="550.0" stroke="#dee7eb" stroke-width="2" /><text x="98.0" y="558.0" font-size="24" fill="#50636e" text-anchor="end">0</text><line x1="110.0" y1="475.0" x2="1130.0" y2="475.0" stroke="#dee7eb" stroke-width="2" /><text x="98.0" y="483.0" font-size="24" fill="#50636e" text-anchor="end">0.2</text><line x1="110.0" y1="400.0" x2="1130.0" y2="400.0" stroke="#dee7eb" stroke-width="2" /><text x="98.0" y="408.0" font-size="24" fill="#50636e" text-anchor="end">0.4</text><line x1="110.0" y1="325.0" x2="1130.0" y2="325.0" stroke="#dee7eb" stroke-width="2" /><text x="98.0" y="333.0" font-size="24" fill="#50636e" text-anchor="end">0.6</text><line x1="110.0" y1="250.0" x2="1130.0" y2="250.0" stroke="#dee7eb" stroke-width="2" /><text x="98.0" y="258.0" font-size="24" fill="#50636e" text-anchor="end">0.8</text><line x1="212.0" y1="550.0" x2="212.0" y2="556.0" stroke="#627882" stroke-width="2" /><text x="212.0" y="587.0" font-size="24" fill="#50636e" text-anchor="middle">1</text><line x1="416.0" y1="550.0" x2="416.0" y2="556.0" stroke="#627882" stroke-width="2" /><text x="416.0" y="587.0" font-size="24" fill="#50636e" text-anchor="middle">2</text><line x1="620.0" y1="550.0" x2="620.0" y2="556.0" stroke="#627882" stroke-width="2" /><text x="620.0" y="587.0" font-size="24" fill="#50636e" text-anchor="middle">3</text><line x1="824.0" y1="550.0" x2="824.0" y2="556.0" stroke="#627882" stroke-width="2" /><text x="824.0" y="587.0" font-size="24" fill="#50636e" text-anchor="middle">4</text><line x1="1028.0" y1="550.0" x2="1028.0" y2="556.0" stroke="#627882" stroke-width="2" /><text x="1028.0" y="587.0" font-size="24" fill="#50636e" text-anchor="middle">5</text><line x1="110" y1="550" x2="1130" y2="550" stroke="#627882" stroke-width="2" /><line x1="110" y1="250" x2="110" y2="550" stroke="#627882" stroke-width="2" /><text x="620.0" y="626" font-size="26" fill="#20343e" text-anchor="middle">状态</text><text x="110" y="230" font-size="26" fill="#20343e" text-anchor="start">目标概率</text><rect x="926.0" y="250" width="204.0" height="300" fill="#f5e5dc" /><rect x="170.48" y="287.5" width="30" height="262.5" fill="#216983" /><rect x="223.51999999999998" y="418.75" width="30" height="131.25" fill="#bc5b32" /><rect x="374.48" y="512.5" width="30" height="37.5" fill="#216983" /><rect x="427.52" y="531.25" width="30" height="18.75" fill="#bc5b32" /><rect x="578.48" y="512.5" width="30" height="37.5" fill="#216983" /><rect x="631.52" y="531.25" width="30" height="18.75" fill="#bc5b32" /><rect x="782.48" y="512.5" width="30" height="37.5" fill="#216983" /><rect x="835.52" y="531.25" width="30" height="18.75" fill="#bc5b32" /><rect x="986.4800000000001" y="550.0" width="30" height="0.0" fill="#216983" /><rect x="1039.52" y="362.5" width="30" height="187.5" fill="#bc5b32" /><text x="110" y="175" font-size="28" fill="#20343e" text-anchor="start">蓝：目标 A；橙：目标 B</text><text x="930" y="175" font-size="25" fill="#bc5b32" text-anchor="start">状态 5：从未被采到</text><text x="75" y="690" font-size="26" fill="#20343e" text-anchor="start">相同的四个观测，归一化权重都是 (0.7, 0.1, 0.1, 0.1)，ESS ≈ 1.923。</text><text x="75" y="745" font-size="28" fill="#20343e" text-anchor="start">估计“是否为状态 5”：样本估计都为 0，目标真值却分别为 0 与 0.5。</text></g><desc> 权重看起来一样，也可能完全漏掉一半目标概率 B 违反支持覆盖条件；权重诊断不能替代对目标与提议分布的核对。</desc></svg>

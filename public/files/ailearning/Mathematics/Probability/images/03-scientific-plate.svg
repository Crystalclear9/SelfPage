<line x1="1253.000" y1="430.000" x2="1253.000" y2="437.000" stroke="#182737" stroke-width="2"/>
<text x="1253" y="465" font-size="21" text-anchor="middle" fill="#ba5935">0.75</text>
<line x1="1333.000" y1="430.000" x2="1333.000" y2="437.000" stroke="#182737" stroke-width="2"/>

<line x1="86.000" y1="110.000" x2="406.000" y2="110.000" stroke="#dce7ed" stroke-width="2"/>
<line x1="406.000" y1="430.000" x2="406.000" y2="110.000" stroke="#dce7ed" stroke-width="2"/>
<line x1="86.000" y1="430.000" x2="406.000" y2="110.000" stroke="#1e7abd" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="326.000" y1="430.000" x2="326.000" y2="190.000" stroke="#ba5935" stroke-width="2" stroke-dasharray="5 6"/>

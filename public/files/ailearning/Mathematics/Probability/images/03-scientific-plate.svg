<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="641.3333" viewBox="0 0 1440 641.3333" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">固定 x = 0.75 时，切片和条件密度的 y 区间均从 0.75 到 1，高度由 2 变为 4</title><rect width="1440" height="641.3333" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="35" font-weight="700" fill="#142b45">固定 x = 0.75 时，切片和条件密度的 y 区间均从 0.75 到 1，高度由 2 变为 4</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="499.3333" viewBox="0 0 1440 535" role="img" aria-labelledby="title description" x="48" y="106" overflow="hidden">
<title id="title">联合支持、固定坐标的切片与条件密度</title><desc id="description">支持为 0&lt;x&lt;y&lt;1；固定 x=0.75 后，y 从 0.75 到 1，宽 0.25；密度高度由 2 变为 4。</desc>
<rect width="1440" height="535" fill="#fff"/>
<defs><linearGradient id="bluefill" x2="0" y2="1"><stop stop-color="#b4ddf5"/><stop offset="1" stop-color="#e7f4f9"/></linearGradient><linearGradient id="orangefill" x2="0" y2="1"><stop stop-color="#f2bba3"/><stop offset="1" stop-color="#ffebe3"/></linearGradient><linearGradient id="simplexfill" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#dcf3e7"/><stop offset=".55" stop-color="#d9e9fa"/><stop offset="1" stop-color="#e8ddf9"/></linearGradient><marker id="axis" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5"><path d="M0 0 11 5 0 10Z" fill="#182737"/></marker><marker id="bluearrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="13" refY="7"><path d="M0 0 15 7 0 14Z" fill="#1e7abd"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182737">

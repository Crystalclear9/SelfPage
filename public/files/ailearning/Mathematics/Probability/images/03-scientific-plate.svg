<line x1="86.000" y1="430.000" x2="432.000" y2="430.000" stroke="#182737" stroke-width="2" marker-end="url(#axis)"/>
<line x1="86.000" y1="430.000" x2="86.000" y2="89.000" stroke="#182737" stroke-width="2" marker-end="url(#axis)"/>

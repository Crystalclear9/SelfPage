<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="535" viewBox="0 0 1440 535" role="img" aria-labelledby="title description">
<title id="title">联合支持、固定坐标的切片与条件密度</title><desc id="description">支持为 0&lt;x&lt;y&lt;1；固定 x=0.75 后，y 从 0.75 到 1，宽 0.25；密度高度由 2 变为 4。</desc>
<rect width="1440" height="535" fill="#fff"/>
<defs><linearGradient id="bluefill" x2="0" y2="1"><stop stop-color="#b4ddf5"/><stop offset="1" stop-color="#e6f4fa"/></linearGradient><linearGradient id="orangefill" x2="0" y2="1"><stop stop-color="#f8b49d"/><stop offset="1" stop-color="#ffebe3"/></linearGradient><linearGradient id="simplexfill" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#dbf4e7"/><stop offset=".55" stop-color="#d8e9fb"/><stop offset="1" stop-color="#e8dcfa"/></linearGradient><marker id="axis" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5"><path d="M0 0 11 5 0 10Z" fill="#14293b"/></marker><marker id="bluearrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="13" refY="7"><path d="M0 0 15 7 0 14Z" fill="#236eab"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#14293b">
<text x="247" y="69" font-size="34" text-anchor="middle" fill="#14293b" font-weight="700">联合支持</text>
<text x="711" y="69" font-size="34" text-anchor="middle" fill="#14293b" font-weight="700">固定 x = 0.75</text>
<text x="1175" y="69" font-size="34" text-anchor="middle" fill="#14293b" font-weight="700">条件密度</text>
<polygon points="86.000,430.000 86.000,110.000 406.000,110.000" fill="url(#bluefill)" stroke="none" stroke-width="1"/>
<line x1="86.000" y1="110.000" x2="406.000" y2="110.000" stroke="#dce7ed" stroke-width="2"/>
<line x1="406.000" y1="430.000" x2="406.000" y2="110.000" stroke="#dce7ed" stroke-width="2"/>
<line x1="86.000" y1="430.000" x2="406.000" y2="110.000" stroke="#236eab" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="326.000" y1="430.000" x2="326.000" y2="190.000" stroke="#bd4c32" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="326.000" y1="190.000" x2="326.000" y2="110.000" stroke="#bd4c32" stroke-width="7"/>
<circle cx="326.000" cy="190.000" r="6" fill="#bd4c32" stroke="white" stroke-width="2"/>
<circle cx="326.000" cy="110.000" r="6" fill="#bd4c32" stroke="white" stroke-width="2"/>
<text x="246" y="308.4" font-size="23" text-anchor="middle" fill="#236eab">y = x</text>
<line x1="86.000" y1="430.000" x2="432.000" y2="430.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="86.000" y1="430.000" x2="86.000" y2="89.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<text x="86" y="465" font-size="21" text-anchor="middle" fill="#14293b">0</text>
<text x="326" y="465" font-size="21" text-anchor="middle" fill="#bd4c32">0.75</text>
<text x="406" y="465" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<text x="58" y="118" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<text x="443" y="439" font-size="23" text-anchor="middle" fill="#14293b">x</text>
<text x="86" y="76" font-size="23" text-anchor="middle" fill="#14293b">y</text>
<text x="246" y="512" font-size="23" text-anchor="middle" fill="#bd4c32">截线从 y = 0.75 到 y = 1</text>
<polygon points="789.000,430.000 789.000,292.000 869.000,292.000 869.000,430.000" fill="url(#orangefill)" stroke="none" stroke-width="1"/>
<line x1="549.000" y1="292.000" x2="869.000" y2="292.000" stroke="#dce7ed" stroke-width="2" stroke-dasharray="7 6"/>
<text x="525" y="300" font-size="22" text-anchor="middle" fill="#14293b">2</text>
<line x1="549.000" y1="154.000" x2="869.000" y2="154.000" stroke="#dce7ed" stroke-width="2" stroke-dasharray="7 6"/>
<text x="525" y="162" font-size="22" text-anchor="middle" fill="#14293b">4</text>
<polyline points="549.000,430.000 789.000,430.000 789.000,292.000 869.000,292.000 869.000,430.000 885.000,430.000" fill="none" stroke="#bd4c32" stroke-width="4" stroke-linejoin="round"/>
<line x1="549.000" y1="430.000" x2="894.000" y2="430.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="549.000" y1="430.000" x2="549.000" y2="125.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="549.000" y1="430.000" x2="549.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="549" y="465" font-size="21" text-anchor="middle" fill="#14293b">0</text>
<line x1="789.000" y1="430.000" x2="789.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="789" y="465" font-size="21" text-anchor="middle" fill="#bd4c32">0.75</text>
<line x1="869.000" y1="430.000" x2="869.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="869" y="465" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<text x="911" y="438" font-size="23" text-anchor="middle" fill="#14293b">y</text>
<text x="549" y="113" font-size="22" text-anchor="middle" fill="#14293b">密度</text>
<text x="709" y="512" font-size="23" text-anchor="middle" fill="#bd4c32">切片面积 0.25 × 2 = 0.5</text>
<polygon points="1253.000,430.000 1253.000,154.000 1333.000,154.000 1333.000,430.000" fill="url(#orangefill)" stroke="none" stroke-width="1"/>
<line x1="1013.000" y1="292.000" x2="1333.000" y2="292.000" stroke="#dce7ed" stroke-width="2" stroke-dasharray="7 6"/>
<text x="989" y="300" font-size="22" text-anchor="middle" fill="#14293b">2</text>
<line x1="1013.000" y1="154.000" x2="1333.000" y2="154.000" stroke="#dce7ed" stroke-width="2" stroke-dasharray="7 6"/>
<text x="989" y="162" font-size="22" text-anchor="middle" fill="#14293b">4</text>
<polyline points="1013.000,430.000 1253.000,430.000 1253.000,154.000 1333.000,154.000 1333.000,430.000 1349.000,430.000" fill="none" stroke="#bd4c32" stroke-width="4" stroke-linejoin="round"/>
<line x1="1013.000" y1="430.000" x2="1358.000" y2="430.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="1013.000" y1="430.000" x2="1013.000" y2="125.000" stroke="#14293b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="1013.000" y1="430.000" x2="1013.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="1013" y="465" font-size="21" text-anchor="middle" fill="#14293b">0</text>
<line x1="1253.000" y1="430.000" x2="1253.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="1253" y="465" font-size="21" text-anchor="middle" fill="#bd4c32">0.75</text>
<line x1="1333.000" y1="430.000" x2="1333.000" y2="437.000" stroke="#14293b" stroke-width="2"/>
<text x="1333" y="465" font-size="21" text-anchor="middle" fill="#14293b">1</text>
<text x="1375" y="438" font-size="23" text-anchor="middle" fill="#14293b">y</text>
<text x="1013" y="113" font-size="22" text-anchor="middle" fill="#14293b">密度</text>
<text x="1173" y="512" font-size="23" text-anchor="middle" fill="#bd4c32">归一化后面积 0.25 × 4 = 1</text>
</g>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="678" viewBox="0 0 1360 678" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">混合分布的跳跃，与广义逆的平段</title>
  <desc id="plate-desc">零等待的概率为五分之一。其余质量在 0 与 1 之间均匀分布。左图显示跳跃，右图把一段均匀输入映到同一个零等待。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="678" fill="white" stroke="none" stroke-width="0"/>
  <text x="335" y="61" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">A  分布函数在零处跳跃</text>
  <text x="1018" y="61" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">B  广义逆有一段平区间</text>
  <polyline points="115,480 628,480" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <polyline points="118,483 118,108" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="117" y="91" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="start">累计概率</text>
  <text x="373" y="545" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">等待时间</text>
  <polyline points="124.06,480 193,480" fill="none" stroke="#196f77" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="193,480 193,414" fill="none" stroke="#657682" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polyline points="193,414 576,150" fill="none" stroke="#196f77" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="576,150 625.79,150" fill="none" stroke="#196f77" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="193" cy="480" r="6" fill="white" stroke="#196f77" stroke-width="1.6"/>
  <circle cx="193" cy="414" r="7" fill="#a84b3b" stroke="#a84b3b" stroke-width="1.6"/>
  <polyline points="193,480 193,486" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="193" y="513" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <polyline points="576,480 576,486" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="576" y="513" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <polyline points="112,150 118,150" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="106" y="157" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">1</text>
  <text x="82" y="403" font-size="19" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">1</text>
  <polyline points="66.5,410 97.5,410" fill="none" stroke="#a84b3b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="82" y="434" font-size="19" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">5</text>
  <text x="383" y="424" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">跳跃等于点质量</text>
  <polyline points="814,480 1302,480" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <polyline points="817,483 817,108" fill="none" stroke="#202a37" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="816" y="91" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="start">采样值</text>
  <text x="1059.5" y="545" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">均匀输入</text>
  <polyline points="817,480 907.8,480" fill="none" stroke="#a84b3b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="907.8,480 1271,150" fill="none" stroke="#196f77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="817" cy="480" r="6" fill="white" stroke="#a84b3b" stroke-width="1.6"/>
  <circle cx="907.8" cy="480" r="6" fill="#a84b3b" stroke="#a84b3b" stroke-width="1.6"/>
  <circle cx="1271" cy="150" r="5" fill="white" stroke="#196f77" stroke-width="1.6"/>
  <polyline points="1271,480 1271,486" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1271" y="513" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <polyline points="811,150 817,150" fill="none" stroke="#657682" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="805" y="157" font-size="23" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="end">1</text>
  <text x="907.8" y="511" font-size="19" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">1</text>
  <polyline points="891.8,518 923.8,518" fill="none" stroke="#a84b3b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="907.8" y="542" font-size="19" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">5</text>
  <text x="1162" y="435" font-size="25" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">超过阈值才进入连续部分</text>
  <text x="681" y="630" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">实心点是函数取值，空心点表示左极限或未纳入的端点。</text>
</svg>

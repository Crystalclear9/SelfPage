<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title id="extra-title">相关性改变均值中的有效信息</title><desc id="extra-desc">三条曲线都从单变量方差一出发，比较样本均值的标准差。蓝线使用等相关模型 X_i=\sqrt{0.2}\,U+\sqrt{0.8}\,\epsilon_i，其中公共因子 U 与各 \epsilon_i 独立、均服从标准正态。任意两个不同位置的相关系数都是 0.2，公共随机分量无法通过增加样本平均掉，因此 \operatorname{Var}(\overline X_n)=0.2+\frac{0.8}{n}，标准差趋向 \sqrt{0.2}。

橙线则为**平稳初始化**的 AR(1)：X_i=0.2X_{i-1}+\sqrt{0.96}\,\epsilon_i。它同样有单位方差和相邻相关 0.2，但间隔 k 的相关为 0.2^k。有限样本均值方差应保留三角权重：
\operatorname{Var}(\overline X_n)=\frac{1}{n^2}\left[n+2\sum_{k=1}^{n-1}(n-k)0.2^k\right]。
长链近似才是 \frac{1+0.2}{1-0.2}\frac{1}{n}=\frac{1.5}{n}，不能把所有不同位置都按相邻相关处理。

在 n=100 时，独立、AR(1)、等相关三者的均值标准差分别约为 0.1000、0.1222、0.4561。右侧依赖结构解释了差异：共同因子影响所有观测，而 AR(1) 的远距离依赖会衰减。只知道一个“相关系数”或只数观测行数，并不足以决定均值精度；有效样本量还依赖统计量、完整相关结构和平稳/求和条件。按自相关求和解释均值方差的依据见 [Stan 官方手册的有效样本量说明](https://mc-stan.org/docs/reference-manual/analysis.html#effective-sample-size)。</desc><rect width="1200" height="740" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">相关性改变均值中的有效信息</text><text x="85" y="105" font-size="27" fill="#213447" text-anchor="start" font-weight="400">相邻相关相同，不代表均值精度相同</text><line x1="85" y1="142" x2="115" y2="142" stroke="#627689" stroke-width="3" /><text x="127" y="150" font-size="25" fill="#627689" text-anchor="start" font-weight="400">独立</text><line x1="240" y1="142" x2="270" y2="142" stroke="#cf7432" stroke-width="3" /><text x="282" y="150" font-size="25" fill="#cf7432" text-anchor="start" font-weight="400">AR(1)：相邻相关 0.2</text><line x1="85" y1="182" x2="115" y2="182" stroke="#2865a0" stroke-width="3" /><text x="127" y="190" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">等相关：所有不同位置都相关 0.2</text><line x1="85" y1="600.0" x2="645" y2="600.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="608.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="425.0" x2="645" y2="425.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="433.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="85" y1="250.0" x2="645" y2="250.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="258.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><lin
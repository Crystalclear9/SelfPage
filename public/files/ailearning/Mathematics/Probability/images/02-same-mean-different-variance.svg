<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="617" viewBox="0 0 1320 617" role="img" aria-labelledby="label detail"><title id="label">均值相同分布仍然不同</title><desc id="detail">两个离散对称分布同均值。距离为 1 的点方差贡献按 1² 计算，距离为 2 的点按 2² 计算。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="617" fill="white" stroke="none" stroke-width="1.6"/><line x1="138" y1="181" x2="773" y2="181" stroke="#202a37" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="214" y1="172" x2="214" y2="190" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="214" y="229" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">-2</text><line x1="329" y1="172" x2="329" y2="190" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="329" y="229" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">-1</text><line x1="444" y1="172" x2="444" y2="190" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="444" y="229" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">0</text><line x1="559" y1="172" x2="559" y2="190" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="559" y="229" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">1</text><line x1="674" y1="172" x2="674" y2="190" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="674" y="229" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">2</text><line x1="329" y1="181" x2="329" y2="105" stroke="#196f77" stroke-width="2.5" stroke-linecap="round"/><circle cx="329" cy="105" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><line x1="559" y1="181" x2="559" y2="105" stroke="#196f77" stroke-width="2.5" stroke-linecap="round"/><circle cx="559" cy="105" r="7" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><line x1="444" y1="85" x2="444" y2="191" stroke="#657682" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/><text x="442" y="68" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">相同的均值</text><rect x="904" y="129" width="52" height="52" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7"/><text x="1062" y="172" fill="#196f77" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">1² = 1</text><line x1="138" y1="427" x2="773" y2="427" stroke="#202a37" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="214" y1="418" x2="214" y2="436" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="214" y="475" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">-2</text><line x1="329" y1="418" x2="329" y2="436" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="329" y="475" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">-1</text><line x1="444" y1="418" x2="444" y2="436" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="444" y="475" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">0</text><line x1="559" y1="418" x2="559" y2="436" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="559" y="475" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">1</text><line x1="674" y1="418" x2="674" y2="436" stroke="#657682" stroke-width="1.4" stroke-linecap="round"/><text x="674" y="475" fill="#202a37" font-size="25" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">2</text><line x1="214" y1="427" x2="214" y2="351" stroke="#655184" stroke-width="2.5" stroke-linecap="round"/><circle cx="214" cy="351" r="7" stroke="#655184" fill="#655184" stroke-width="1.75"/><line x1="674" y1="427" x2="674" y2="351" stroke="#655184" stroke-width="2.5" stroke-linecap="round"/><circle cx="674" cy="351" r="7" stroke="#655184" fill="#655184" stroke-width="1.75"/><line x1="444" y1="331" x2="444" y2="437" stroke="#657682" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/><text x="442" y="314" fill="#202a37" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">相同的均值</text><rect x="904" y="323" width="104" height="104" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7"/><text x="1062" y="418" fill="#655184" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">2² = 4</text><text x="670" y="576" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">同一尺度下，远处的概率质量贡献更大的方差</text></svg>
<text x="664" y="367" font-size="27" fill="#172a40" font-weight="700" text-anchor="start">估计 = 3</text>
<text x="480" y="436" font-size="28" fill="#172a40" font-weight="700" text-anchor="middle">估计均值 1.7 − 真值 1.4 = 偏差 0.3</text>

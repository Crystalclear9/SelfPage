<svg xmlns="http://www.w3.org/2000/svg" width="960" height="951" viewBox="0 0 960 951" role="img" aria-labelledby="title desc">
<title id="title">自归一化偏差从哪几个结果来</title><desc id="desc">两次采样有三个结果，估计均值为一点七，真值一点四。图 B 比较精确有限样本偏差和零点三八四除以样本数。</desc>

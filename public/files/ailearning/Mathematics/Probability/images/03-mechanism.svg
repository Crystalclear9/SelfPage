<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>全方差把组内与组间变化分开</title><desc>设Z取两组且权重相等，条件均值分别为0与4，两组内方差都为1。总均值为2，条件均值自身的方差为4，平均条件方差为1，因此总体方差为5。分组解释的是总波动的来源，而不只是比较两组平均值。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">全方差把组内与组间变化分开</text><text x="85" y="190" font-size="24" fill="#16344c" text-anchor="start">条件均值（两组权重各0.5）</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="610.0" width="145.0" height="0.0" fill="#2865a0" /><text x="207.5" y="594.0" font-size="24" fill="#16344c" text-anchor="middle">0</text><text x="207.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">组内均值0</text><rect x="605.0" y="330.0" width="145.0" height="280.0" fill="#cf7432" /><text x="677.5" y="314.0" font-size="24" fill="#16344c" text-anchor="middle">4</text><text x="677.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">组内均值4</text><text x="80" y="130" font-size="24" fill="#16344c" text-anchor="start">每组内方差1；总体均值2；全方差=组内1+组间4=5。</text></g></svg>

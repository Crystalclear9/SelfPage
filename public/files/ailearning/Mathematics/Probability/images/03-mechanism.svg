<text x="128" y="1023" font-size="24" fill="#465d72" font-weight="400" text-anchor="end">5</text>
<line x1="143" y1="970" x2="723" y2="970" stroke="#cedae4" stroke-width="2"/>
<text x="128" y="978" font-size="24" fill="#465d72" font-weight="400" text-anchor="end">10</text>
<line x1="143" y1="925" x2="723" y2="925" stroke="#cedae4" stroke-width="2"/>
<text x="128" y="933" font-size="24" fill="#465d72" font-weight="400" text-anchor="end">15</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1195" viewBox="0 0 960 1195" role="img" aria-labelledby="title desc">
<title id="title">总方差来自组内与组间两处</title><desc id="desc">A 组样本是负一和一，B 组样本是三和五。组内距离均为一，组均值与总均值相距二。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536f86"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="960" height="1195" rx="0" fill="#fff" stroke="none" stroke-width="1.8"/>
<text x="44" y="61" font-size="39" fill="#172a40" font-weight="700" text-anchor="start">总方差来自组内与组间两处</text>
<text x="46" y="106" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">每组等权，每组内两个观测值也等权</text>
<rect x="44" y="141" width="42" height="41" rx="10" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="171" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">A</text>
<text x="101" y="171" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">在同一数轴上找到三处均值</text>
<rect x="152.5" y="200" width="290.0" height="190" rx="12" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="297.5" y="237" font-size="28" fill="#136d84" font-weight="700" text-anchor="middle">组 A</text>
<line x1="297.5" y1="289" x2="178.5" y2="289" stroke="#136d84" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="178.5" cy="289" r="9" fill="#136d84" stroke="#fff" stroke-width="3"/>
<text x="178.5" y="330" font-size="27" fill="#136d84" font-weight="700" text-anchor="middle">-1</text>
<line x1="297.5" y1="289" x2="416.5" y2="289" stroke="#136d84" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="416.5" cy="289" r="9" fill="#136d84" stroke="#fff" stroke-width="3"/>
<text x="416.5" y="330" font-size="27" fill="#136d84" font-weight="700" text-anchor="middle">1</text>
<circle cx="297.5" cy="289" r="8" fill="#fff" stroke="#136d84" stroke-width="3"/>
<text x="297.5" y="366" font-size="24" fill="#465d72" font-weight="650" text-anchor="middle">组均值 0</text>
<rect x="628.5" y="200" width="290.0" height="190" rx="12" fill="#fff2e8" stroke="#cedae4" stroke-width="1.8"/>
<text x="773.5" y="237" font-size="28" fill="#a85127" font-weight="700" text-anchor="middle">组 B</text>
<line x1="773.5" y1="289" x2="654.5" y2="289" stroke="#a85127" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="654.5" cy="289" r="9" fill="#a85127" stroke="#fff" stroke-width="3"/>
<text x="654.5" y="330" font-size="27" fill="#a85127" font-weight="700" text-anchor="middle">3</text>
<line x1="773.5" y1="289" x2="892.5" y2="289" stroke="#a85127" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="892.5" cy="289" r="9" fill="#a85127" stroke="#fff" stroke-width="3"/>
<text x="892.5" y="330" font-size="27" fill="#a85127" font-weight="700" text-anchor="middle">5</text>
<circle cx="773.5" cy="289" r="8" fill="#fff" stroke="#a85127" stroke-width="3"/>
<text x="773.5" y="366" font-size="24" fill="#465d72" font-weight="650" text-anchor="middle">组均值 4</text>
<line x1="119.0" y1="421" x2="934.15" y2="421" stroke="#465d72" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="178.5" y1="421" x2="178.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="297.5" y1="421" x2="297.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="416.5" y1="421" x2="416.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="535.5" y1="421" x2="535.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="654.5" y1="421" x2="654.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="773.5" y1="421" x2="773.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="892.5" y1="421" x2="892.5" y2="432" stroke="#465d72" stroke-width="2"/>
<line x1="535.5" y1="252" x2="535.5" y2="447" stroke="#465d72" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="535.5" cy="421" r="7" fill="#172a40" stroke="#fff" stroke-width="3"/>
<text x="535.5" y="479" font-size="26" fill="#172a40" font-weight="700" text-anchor="middle">总均值 2</text>
<rect x="44" y="518" width="42" height="41" rx="10" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="548" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">B</text>
<text x="101" y="548" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">把两种平方距离分别平均</text>
<rect x="44" y="578" width="258" height="121" rx="12" fill="#e9f5f7" stroke="#cedae4" stroke-width="1.8"/>
<text x="173" y="622" font-size="24" fill="#465d72" font-weight="650" text-anchor="middle">到各自组均值</text>
<text x="173" y="672" font-size="32" fill="#136d84" font-weight="700" text-anchor="middle">1² = 1</text>
<rect x="351" y="578" width="258" height="121" rx="12" fill="#fff2e8" stroke="#cedae4" stroke-width="1.8"/>
<text x="480" y="622" font-size="24" fill="#465d72" font-weight="650" text-anchor="middle">组均值到总均值</text>
<text x="480" y="672" font-size="32" fill="#a85127" font-weight="700" text-anchor="middle">2² = 4</text>
<rect x="658" y="578" width="258" height="121" rx="12" fill="#f7fafc" stroke="#cedae4" stroke-width="1.8"/>
<text x="787" y="622" font-size="24" fill="#465d72" font-weight="650" text-anchor="middle">合计</text>
<text x="787" y="672" font-size="32" fill="#172a40" font-weight="700" text-anchor="middle">5</text>
<text x="328" y="657" font-size="27" fill="#172a40" font-weight="650" text-anchor="middle">+</text>
<text x="635" y="657" font-size="27" fill="#172a40" font-weight="650" text-anchor="middle">=</text>
<rect x="44" y="742" width="42" height="41" rx="10" fill="#e9f5f7" stroke="none" stroke-width="1.8"/>
<text x="65" y="772" font-size="25" fill="#136d84" font-weight="700" text-anchor="middle">C</text>
<text x="101" y="772" font-size="31" fill="#172a40" font-weight="700" text-anchor="start">知道组别后，预测风险少了四</text>
<line x1="143" y1="1060" x2="723" y2="1060" stroke="#cedae4" stroke-width="2"/>
<text x="128" y="1068" font-size="24" fill="#465d72" font-weight="400" text-anchor="end">0</text>

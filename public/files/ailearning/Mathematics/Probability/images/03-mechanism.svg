<line x1="143" y1="1060" x2="723" y2="1060" stroke="#465d72" stroke-width="2"/>
<line x1="143" y1="1060" x2="143" y2="880" stroke="#465d72" stroke-width="2"/>
<line x1="143" y1="1060" x2="143" y2="1068" stroke="#465d72" stroke-width="2"/>
<text x="143" y="1096" font-size="24" fill="#465d72" font-weight="400" text-anchor="middle">0</text>
<line x1="288" y1="1060" x2="288" y2="1068" stroke="#465d72" stroke-width="2"/>
<text x="288" y="1096" font-size="24" fill="#465d72" font-weight="400" text-anchor="middle">1</text>
<line x1="433" y1="1060" x2="433" y2="1068" stroke="#465d72" stroke-width="2"/>
<text x="433" y="1096" font-size="24" fill="#465d72" font-weight="400" text-anchor="middle">2</text>
<line x1="578" y1="1060" x2="578" y2="1068" stroke="#465d72" stroke-width="2"/>
<text x="578" y="1096" font-size="24" fill="#465d72" font-weight="400" text-anchor="middle">3</text>
<line x1="723" y1="1060" x2="723" y2="1068" stroke="#465d72" stroke-width="2"/>
<text x="723" y="1096" font-size="24" fill="#465d72" font-weight="400" text-anchor="middle">4</text>

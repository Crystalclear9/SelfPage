<title id="title">共同的成功率怎样改变两次预测</title><desc id="desc">均匀先验在三次成功、一次失败的数据下更新为 Beta(4,2)。后验均值为三分之二，众数为四分之三。共享后验参数时，两端结果比固定均值更常见。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>贝叶斯更新中的基率</title><desc>A用概率树分开疾病基率与条件检测结果。B在一万人中计算期望真阳性90、假阳性495，因此阳性后患病概率为90乘以585的倒数，约15.4%。C保持检测性能不变，只改基率，后验便显著变化。 下方用概率质量条逐步切换参照总体。先看患病基率，再看阳性者的来源，最后在阳性者内部归一化；橙色部分说明假阳性为何可能占多数。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">贝叶斯更新中的基率</text><g transform="translate(10,15) scale(.95)"><circle cx="144.00" cy="540.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="144.00" y="549.12" font-size="24" fill="#15364c" text-anchor="middle">人群</text><circle cx="446.40" cy="350.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="446.40" y="359.12" font-size="24" fill="#15364c" text-anchor="middle">患病</text><circle cx="446.40" cy="737.60" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="446.40" y="746.72" font-size="24" fill="#15364c" text-anchor="middle">未病</text><circle cx="782.40" cy="296.80" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="782.40" y="305.92" font-size="24" fill="#15364c" text-anchor="middle">阳性</text><circle cx="782.40" cy="486.80" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="782.40" y="495.92" font-size="24" fill="#15364c" text-anchor="middle">阴性</text><circle cx="782.40" cy="676.80" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="782.40" y="685.92" font-size="24" fill="#15364c" text-anchor="middle">阳性</text><
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>贝叶斯更新先筛选对象，再更换分母</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">贝叶斯更新先筛选对象，再更换分母</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">同一批 10 000 件产品；每条边注明条件比例，圆内是期望计数</text><line x1="157.80133036018012" y1="371.50404393260123" x2="367.1986696398199" y2="258.49595606739877" stroke="#216983" stroke-width="3"/><path d="M359.58,269.03 L367.20,258.50 L354.21,259.08" fill="none" stroke="#216983" stroke-width="3"/><text x="262.5" y="300.0" font-size="27" fill="#216983" text-anchor="middle">1%</text><line x1="157.09458852746755" y1="429.76833630141005" x2="367.9054114725325" y2="550.23166369859" stroke="#bc5b32" stroke-width="3"/><path d="M354.94,549.33 L367.91,550.23 L360.55,539.51" fill="none" stroke="#bc5b32" stroke-width="3"/><text x="262.5" y="475.0" font-size="27" fill="#bc5b32" text-anchor="middle">99%</text><line x1="479.26577791974415" y1="220.64224559161934" x2="740.7342220802559" y2="179.35775440838066" stroke="#216983" stroke-width="3"/><path d="M730.05,186.77 L740.73,179.36 L728.29,175.60" fill="none" stroke="#216983" stroke-width="3"/><text x="610.0" y="185.0" font-size="27" fill="#216983" text-anchor="middle">90%</text><line x1="478.02447223575876" y1="245.26959795677863" x2="741.9755277642412" y2="314.7304020432214" stroke="#627882" stroke-width="3"/><path d="M729.22,317.22 L741.98,314.73 L732.09,306.28" fill="none" stroke="#627882" stroke-width="3"/><text x="610.0" y="265.0" font-size="27" fill="#627882" text-anchor="middle">10%</text><line x1="479.26577791974415" y1="570.6422455916194" x2="740.7342220802559" y2="529.3577544083806" stroke="#bc5b32" stroke-width="3"/><path d="M730.05,536.77 L740.73,529.36 L728.29,525.60" fill="none" stroke="#bc5b32" stroke-width="3"/><text x="610.0" y="535.0" font-size="27" fill="#bc5b32" text-anchor="middle">5%</text><line x1="478.02447223575876" y1="595.2695979567786" x2="741.9755277642412" y2="664.7304020432214" stroke="#627882" stroke-width="3"/><path d="M729.22,667.22 L741.98,664.73 L732.09,656.28" fill="none" stroke="#627882" stroke-width="3"/><text x="610.0" y="615.0" font-size="27" fill="#627882" text-anchor="middle">95%</text><line x1="852.6737343748631" y1="198.7311278408344" x2="1077.326265625137" y2="321.2688721591656" stroke="#216983" stroke-width="3"/><path d="M1064.34,320.63 L1077.33,321.27 L1069.76,310.70" fill="none" stroke="#216983" stroke-width="3"/><line x1="853.3384733855962" y1="492.52260461954137" x2="1076.6615266144038" y2="377.47739538045863" stroke="#bc5b32" stroke-width="3"/><path d="M1068.84,387.86 L1076.66,377.48 L1063.67,377.81" fill="none" stroke="#bc5b32" stroke-width="3"/><circle cx="105" cy="400" r="55" fill="white" stroke="#20343e" stroke-width="2"/><text x="105" y="409" font-size="28" fill="#20343e" text-anchor="middle">10 000</text><text x="105" y="324" font-size="25" fill="#20343e" text-anchor="middle">全部产品</text><circle cx="420" cy="230" r="55" fill="white" stroke="#216983" stroke-width="2"/><text x="420" y="239" font-size="28" fill="#216983" text-anchor="middle">100</text><text x="420" y="154" font-size="25" fill="#216983" text-anchor="middle">有缺陷</text><circle cx="420" cy="580" r="55" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="420" y="589" font-size="28" fill="#bc5b32" text-anchor="middle">9 900</text><text x="420" y="504" font-size="25" fill="#bc5b32" text-anchor="middle">无缺陷</text><circle cx="800" cy="170" r="55" fill="white" stroke="#216983" stroke-width="2"/><text x="800" y="179" font-size="28" fill="#216983" text-anchor="middle">90</text><text x="800" y="94" font-size="25" fill="#216983" text-anchor="middle">真阳性</text><circle cx="800" cy="330" r="55" fill="white" stroke="#627882" stroke-width="2"/><text x="800" y="339" font-size="28" fill="#627882" text-anchor="middle">10</text><text x="800" y="254" font-size="25" fill="#627882" text-anchor="middle">假阴性</text><circle cx="800" cy="520" r="55" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="800" y="529" font-size="28" fill="#bc5b32" text-anchor="middle">495</text><text x="800" y="444" font-size="25" fill="#bc5b32" text-anchor="middle">假阳性</text><circle cx="800" cy="680" r="55" fill="white" stroke="#627882" stroke-width="2"/><text x="800" y="689" font-size="28" fill="#627882" text-anchor="middle">9 405</text><text x="800" y="604" font-size="25" fill="#627882" text-anchor="middle">真阴性</text><circle cx="1130" cy="350" r="55" fill="white" stroke="#20343e" stroke-width="2"/><text x="1130" y="359" font-size="28" fill="#20343e" text-anchor="middle">585</text><text x="1130" y="274" font-size="25" fill="#20343e" text-anchor="middle">筛选后的阳性</text><text x="1120" y="510" font-size="30" fill="#216983" text-anchor="middle">90</text><line x1="1087.0" y1="520" x2="1153.0" y2="520" stroke="#216983" stroke-width="2"/><text x="1120" y="550" font-size="30" fill="#216983" text-anchor="middle">585</text><text x="1120" y="600" font-size="32" fill="#216983" text-anchor="middle">≈ 15.4%</text><text x="60" y="795" font-size="27" fill="#20343e" text-anchor="start">90 件真阳性与 495 件假阳性进入同一个分母；灵敏度 90% 不是阳性后缺陷概率。</text></g></svg>

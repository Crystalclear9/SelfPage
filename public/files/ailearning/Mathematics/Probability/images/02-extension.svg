<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>零相关，仍然可以完全预测</title><desc>X在负一至一均匀分布，Y=X²。左图突出事件Y&lt;=.25对应X在负.5至.5，右图比较无条件和该事件下的X密度，分别为.5和1。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">零相关，仍然可以完全预测</text><text x="40" y="101" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">X 在 [−1, 1] 上均匀；Y = X²     ·     对称抵消的是协方差，不是依赖</text><rect x="185.0" y="425.0" width="210" height="65" fill="#dbecef" stroke="none" stroke-width="2"/><line x1="58.99999999999997" y1="490" x2="521.0" y2="490" stroke="#78878b" stroke-width="2"/><line x1="290" y1="490" x2="290" y2="204.0" stroke="#78878b" stroke-width="2"/><path d="M80.00,230.00 L82.80,236.89 L85.60,243.68 L88.40,250.38 L91.20,256.99 L94.00,263.51 L96.80,269.94 L99.60,276.27 L102.40,282.51 L105.20,288.66 L108.00,294.71 L110.80,300.67 L113.60,306.54 L116.40,312.32 L119.20,318.01 L122.00,323.60 L124.80,329.10 L127.60,334.51 L130.40,339.82 L133.20,345.05 L136.00,350.18 L138.80,355.22 L141.60,360.16 L144.40,365.02 L147.20,369.78 L150.00,374.44 L152.80,379.02 L155.60,383.50 L158.40,387.90 L161.20,392.19 L164.00,396.40 L166.80,400.51 L169.60,404.54 L172.40,408.46 L175.20,412.30 L178.00,416.04 L180.80,419.70 L183.60,423.26 L186.40,426.72 L189.20,430.10 L192.00,433.38 L194.80,436.57 L197.60,439.66 L200.40,442.67 L203.20,445.58 L206.00,448.40 L208.80,451.13 L211.60,453.76 L214.40,456.30 L217.20,458.75 L220.00,461.11 L222.80,463.38 L225.60,465.55 L228.40,467.63 L231.20,469.62 L234.00,471.51 L236.80,473.31 L239.60,475.02 L242.40,476.64 L245.20,478.17 L248.00,479.60 L250.80,480.94 L253.60,482.19 L256.40,483.34 L259.20,484.41 L262.00,485.38 L264.80,486.26 L267.60,487.04 L270.40,487.74 L273.20,488.34 L276.00,488.84 L278.80,489.26 L281.60,489.58 L284.40,489.82 L287.20,489.95 L290.00,490.00 L292.80,489.95 L295.60,489.82 L298.40,489.
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>蒙特卡洛误差的平方根规律</title><desc>A把独立样本的平方根规律与等相关样本放在同一坐标下。B量化独立时样本增至四倍，标准误差才减半。C用相同4行数据的不同权重说明，原始行数既不等于独立信息，也不等于权重有效样本量。 下方取等相关系数 ρ=0.2，样本均值方差为 0.2+0.8/n。两根柱分别表示不会随 n 消失的共同项，以及可随样本数缩小的独立项。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">蒙特卡洛误差的平方根规律</text><g transform="translate(10,15) scale(.95)"><line x1="75.00" y1="179.00" x2="102.00" y2="179.00" stroke="#2563eb" stroke-width="3" /><text x="110.00" y="185.00" font-size="24" fill="#2563eb" text-anchor="start">独立：标准误差</text><line x1="75.00" y1="202.00" x2="102.00" y2="202.00" stroke="#cb702a" stroke-width="3" /><text x="110.00" y="208.00" font-size="24" fill="#cb702a" text-anchor="start">等相关ρ=0.2</text><text x="125.00" y="251.00" font-size="24" fill="#15364c" text-anchor="start">单项方差1</text><text x="882.00" y="918.00" font-size="24" fill="#15364c" text-anchor="end">样本数</text><line x1="125.00" y1="263.00" x2="125.00" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="125.00" y="895.00" font-size="24" fill="#15364c" text-anchor="middle">1</text><line x1="314.25" y1="263.00" x2="314.25" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="314.25" y="895.00" font-size="24" fill="#15364c" text-anchor="middle">101</text><line x1="503.50" y1="263.00" x2="503.50" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="503.50" y="895.00" font-size="24" fill="#15364c" text-anchor="middle"
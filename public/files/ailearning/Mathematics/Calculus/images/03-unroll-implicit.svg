<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title id="extra-title">有限展开与隐式求导：先确认求的是哪一个映射</title><desc id="extra-desc">令 z_0=0、z_{k+1}=\theta z_k+1，在 \theta=0.5 处求导。有限程序的导数必须沿全部参数出现位置回传：D_0=0、D_{k+1}=z_k+\theta D_k。前四步状态为 1,1.5,1.75,1.875，相应导数为 0,1,2,2.75。求解精确不动点则得到 z_*=\frac{1}{1-\theta}=2，隐式导数为 \frac{1}{(1-\theta)^2}=4。右图虚线分别标出这两个极限；第八步状态约为 1.99219，导数约为 3.85938。

两种导数针对不同映射：有限展开针对实际执行的有限计算图，隐式求导针对满足平衡方程的解。此例在 |\theta|&lt;1 的邻域内收缩，因而可以讨论随步数增加的收敛；只有前向状态看上去接近，并不足以单独证明任何求解器的反向结果已经稳定。</desc><rect width="1200" height="660" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">有限展开与隐式求导：先确认求的是哪一个映射</text><text x="45" y="110" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">有限程序：z(k+1)=θz(k)+1</text><rect x="135" y="155" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="257.5" y="197.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">z0 = 0</text><path d="M257,227 L257,251" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><text x="400" y="239" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">θ=0.5</text><rect x="135" y="258" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="257.5" y="300.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">z1 = 1</text><path d="M257,330 L257,354" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><text x="400" y="342" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">θ=0.5</text><rect x="135" y="361" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="257.5" y="403.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">z2 = 1.5</text><path d="M257,433 L257,457" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" /><text x="400" y="445" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">θ=0.5</text><rect x="135" y="464" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="257.5" y="506.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">z3 = 1.75</text><text x="35" y="610" font-size="27" fill="#213447" text-anchor="start" font-weight="400">回传：D(k+1)=z(k)+0.5D(k)</text><text x="660" y="110" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">同一参数处，状态与导数收敛速度不同</text><line x1="685" y1="515.0" x2="1130" y2="515.0" stroke="#dce5ed" stroke-width="2" /><text x="673" y="523.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="685" y1="432.6470588235294" x2="1130" y2="432.6470588235294" stroke="#dce5ed" stroke-width="2" /><text x="673" y="440.6470588235294" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="685" y1="350.2941176470588" x2="1130" y2="350.2941176470588" stroke="#dce5ed" stroke-width="2" /><text x="673" y="358.2941176470588" font-size="24" fill="#627689" text-anchor="end" font-weight="400">2</text><line x1="685" y1="267.94117647058823" x2="1130" y2="267.94117647058823" stroke="#dce5ed" stroke-width="2" /><text x="673" y="275.94117647058823" font-size="24" fill="#627689" text-anchor="end" font-weight="400">3</text><line x1="685" y1="185.58823529411762" x2="1130" y2="185.58823529411762" stroke="#dce5ed" stroke-width="2" /><text x="673" y="193.58823529411762" font-size="24" fill="#627689" text-anchor="end" font-weight="400">4</text><line x1="685" y1="165" x2="685" y2="515" stroke="#627689" stroke-width="2" /><line x1="685" y1="515" x2="1130" y2="515" stroke="#627689" stroke-width="2" /><line x1="685.0" y1="515.0" x2="685.0" y2="521.0" stroke="#627689" stroke-width="2" /><text x="685.0" y="547.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="796.25" y1="515.0" x2="796.25" y2="521.0" stroke="#627689" stroke-width="2" /><text x="796.25" y="547.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="907.5" y1="515.0" x2="907.5" y2="521.0" stroke="#627689" stroke-width="2" /><text x="907.5" y="547.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="1018.75" y1="515.0" x2="1018.75" y2="521.0" stroke="#627689" stroke-width="2" /><text x="1018.75" y="547.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">6</text><line x1="1130.0" y1="515.0" x2="1130.0" y2="521.0" stroke="#627689" stroke-width="2" /><text x="1130.0" y="547.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">8</text><polyline points="685.000,515.000 740.625,432.647 796.250,391.471 851.875,370.882 907.500,360.588 963.125,355.441 1018.750,352.868 1074.375,351.581 1130.000,350.938" fill="none" stroke="#2865a0" stroke-width="3" stroke-linejoin="round" /><polyline points="685.000,515.000 740.625,515.000 796.250,432.647 851.875,350.294 907.500,288.529 963.125,247.353 1018.750,221.618 1074.375,206.176 1130.000,197.169" fill="none" stroke="#cf7432" stroke-width="3" stroke-linejoin="round" /><line x1="685.0" y1="350.2941176470588" x2="1130.0" y2="350.2941176470588" stroke="#2865a0" stroke-width="2" stroke-dasharray="6 5" /><line x1="685.0" y1="185.58823529411762" x2="1130.0" y2="185.58823529411762" stroke="#cf7432" stroke-width="2" stroke-dasharray="6 5" /><text x="690" y="580" font-size="25" fill="#213447" text-anchor="start" font-weight="400">蓝：状态 z；橙：对 θ 的导数 D</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>密度是高度，概率是面积</title><desc>上图为零到一的密度2x，左半区间面积四分之一、右半区间四分之三。下图为零到二的均匀密度二分之一。两图使用完全相同的横纵单位长度，面积都为一。</desc><rect width="1200" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="44" y="58" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">密度是高度，概率是面积</text><text x="44" y="104" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">同一套坐标单位，两个总面积都为 1 的分布</text><text x="65" y="140" font-size="29" fill="#256b82" text-anchor="start" font-weight="400">p(x) = 2x</text><text x="650" y="184" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">左半与右半，长度相同</text><text x="650" y="228" font-size="30" fill="#19333c" text-anchor="start" font-weight="400">概率却相差 3 倍</text><path d="M135.00,438.00 L350.00,303.00 L350.00,438.00 Z" stroke="none" stroke-width="0" fill="#dbecef" stroke-linejoin="round" stroke-linecap="round"/><path d="M350.00,438.00 L350.00,303.00 L565.00,168.00 L565.00,438.00 Z" stroke="none" stroke-width="0" fill="#f3ddd0" stroke-linejoin="round" stroke-linecap="round"/><path d="M135.00,438.00 L565.00,168.00" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="350.0" y1="303" x2="350.0" y2="438" stroke="#78878b" stroke-width="2" stroke-dasharray="5 5"/><circle cx="350.0" cy="303" r="6" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="326.0" y="285" font-size="26" fill="#256b82" text-anchor="end" font-weight="400">高度 1</text><text x="281.20000000000005" y="372" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">1</text><line x1="260.20000000000005" y1="381" x2="302.20000000000005" y2="381" stroke="#256b82" stroke-width="2"/><text x="281.20000000000005" y="412" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">4</text><text x="479.0" y="332" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><line x1="458.0" y1="341" x2="500.0" y2="341" stroke="#c0643c" stroke-width="2"/><text x="479.0" y="372" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">4</text><line x1="125" y1="303" x2="135" y2="303" stroke="#78878b" stroke-width="2"/><text x="111" y="311" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">1</text><line x1="125" y1="168" x2="135" y2="168" stroke="#78878b" stroke-width="2"/><text x="111" y="176" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">2</text><line x1="135" y1="438" x2="1050" y2="438" stroke="#78878b" stroke-width="2"/><line x1="135" y1="438" x2="135" y2="446" stroke="#78878b" stroke-width="2"/><text x="135" y="478" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><line x1="350.0" y1="438" x2="350.0" y2="446" stroke="#78878b" stroke-width="2"/><text x="350.0" y="478" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0.5</text><line x1="565" y1="438" x2="565" y2="446" stroke="#78878b" stroke-width="2"/><text x="565" y="478" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><line x1="995" y1="438" x2="995" y2="446" stroke="#78878b" stroke-width="2"/><text x="995" y="478" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><text x="1065" y="478" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">x</text><text x="650" y="319" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">单个点没有宽度</text><text x="650" y="361" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">P(X = 0.5) = 0</text><text x="65" y="544" font-size="29" fill="#256b82" text-anchor="start" font-weight="400">均匀分布</text><rect x="135" y="632.5" width="860" height="67.5" fill="#dbecef" stroke="none" stroke-width="2"/><path d="M135.00,632.50 L995.00,632.50" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="135" y1="632.5" x2="135" y2="700" stroke="#78878b" stroke-width="2" stroke-dasharray="5 5"/><line x1="995" y1="632.5" x2="995" y2="700" stroke="#78878b" stroke-width="2" stroke-dasharray="5 5"/><text x="110" y="640.5" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">0.5</text><text x="565" y="680" font-size="29" fill="#256b82" text-anchor="middle" font-weight="400">宽度 2 × 高度 0.5 = 面积 1</text><line x1="135" y1="700" x2="1050" y2="700" stroke="#78878b" stroke-width="2"/><line x1="135" y1="700" x2="135" y2="708" stroke="#78878b" stroke-width="2"/><text x="135" y="744" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0</text><line x1="350.0" y1="700" x2="350.0" y2="708" stroke="#78878b" stroke-width="2"/><text x="350.0" y="744" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0.5</text><line x1="565" y1="700" x2="565" y2="708" stroke="#78878b" stroke-width="2"/><text x="565" y="744" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><line x1="995" y1="700" x2="995" y2="708" stroke="#78878b" stroke-width="2"/><text x="995" y="744" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><text x="1065" y="744" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">x</text><text x="44" y="798" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">比较的是曲线下的面积，不是某一点的高度。</text></g></svg>

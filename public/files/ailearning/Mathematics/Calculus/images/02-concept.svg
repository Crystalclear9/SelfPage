<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="715" viewBox="0 0 1360 715" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">密度高度、区域概率与累计概率</title>
  <desc id="plate-desc">A：p(x)=2x 在 0 到 1 上的左右面积分别为 1/4、3/4。B：累计 F(x)=x² 在 x=1/2 处的斜率为 1。C：独立的均匀分布高为 1/2。</desc>

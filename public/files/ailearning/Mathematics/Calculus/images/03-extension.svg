<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>切空间是约束的一阶允许方向</title><desc>在单位圆点(0.6,0.8)处，法向量可取(0.6,0.8)，切向量可取(−0.8,0.6)。两者内积为零，切向微扰不改变约束的一阶项；但沿直切线走有限距离仍会离开圆，偏离量是二阶的。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">切空间是约束的一阶允许方向</text><circle cx="500" cy="420" r="210" fill="none" stroke="#148671" stroke-width="4" /><line x1="230" y1="420" x2="770" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="500" y1="150" x2="500" y2="690" stroke="#277eac" stroke-width="2.5" /><path d="M500,420 L626.0,252.0" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><line x1="450.0" y1="120.0" x2="802.0" y2="384.0" stroke="#dc752b" stroke-width="2.5" /><circle cx="626.0" cy="252.0" r="32" fill="#daedf8" stroke="#5597b5" /><text x="626.0" y="260.0" font-size="22" fill="#193e54" text-anchor="middle">P</text><text x="750" y="230" font-size="24" fill="#193e54" text-anchor="start">P=(0.6,0.8)</text><text x="750" y="285" font-size="23" fill="#193e54" text-anchor="start">法向 n=(0.6,0.8)</text><text x="750" y="340" font-size="23" fill="#193e54" text-anchor="start">切向 t=(-0.8,0.6)</text><text x="750" y="395" font-size="25" fill="#193e54" text-anchor="start">n·t=0</text><text x="130" y="735" font-size="22" fill="#193e54" text-anchor="start">半径与切线垂直；沿直线的有限步长不会继续留在圆上。</text></g></svg>

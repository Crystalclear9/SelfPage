<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>固定约束与移动约束，允许的响应不同</title><rect width="1280" height="800" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">固定约束与移动约束，允许的响应不同</text><text x="60" y="115" font-size="27" fill="#71858b" text-anchor="start">c(w, a) = w1 + w2 − a；最小范数解 w*(a) = (a 的一半, a 的一半)</text><line x1="130" y1="545" x2="130" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="130" y1="545" x2="460" y2="545" stroke="#dbe5e8" stroke-width="2"/><text x="130" y="580" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="115" y="553" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="212.5" y1="545" x2="212.5" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="130" y1="462.5" x2="460" y2="462.5" stroke="#dbe5e8" stroke-width="2"/><line x1="295" y1="545" x2="295" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="130" y1="380" x2="460" y2="380" stroke="#dbe5e8" stroke-width="2"/><text x="295" y="580" font-size="24" fill="#71858b" text-anchor="middle">1</text><text x="115" y="388" font-size="24" fill="#71858b" text-anchor="end">1</text><line x1="377.5" y1="545" x2="377.5" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="130" y1="297.5" x2="460" y2="297.5" stroke="#dbe5e8" stroke-width="2"/><line x1="460" y1="545" x2="460" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="130" y1="215" x2="460" y2="215" stroke="#dbe5e8" stroke-width="2"/><text x="460" y="580" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="115" y="223" font-size="24" fill="#71858b" text-anchor="end">2</text><path d="M130.00,380.00 L295.00,545.00" fill="none" stroke="#256b82" stroke-width="4"/><circle cx="212.5" cy="462.5" r="7" fill="#256b82"/><text x="130" y="185" font-size="28" fill="#19333c" text-anchor="start">固定 a = 1：沿切线移动</text><path d="M212.50,462.50 L262.00,512.00" fill="none" stroke="#c0643c" stroke-width="4"/><circle cx="262.0" cy="512.0" r="7" fill="#c0643c"/><text x="130" y="635" font-size="28" fill="#256b82" text-anchor="start">Δw1 + Δw2 = 0</text><line x1="750" y1="545" x2="750" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="750" y1="545" x2="1080" y2="545" stroke="#dbe5e8" stroke-width="2"/><text x="750" y="580" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="735" y="553" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="832.5" y1="545" x2="832.5" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="750" y1="462.5" x2="1080" y2="462.5" stroke="#dbe5e8" stroke-width="2"/><line x1="915" y1="545" x2="915" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="750" y1="380" x2="1080" y2="380" stroke="#dbe5e8" stroke-width="2"/><text x="915" y="580" font-size="24" fill="#71858b" text-anchor="middle">1</text><text x="735" y="388" font-size="24" fill="#71858b" text-anchor="end">1</text><line x1="997.5" y1="545" x2="997.5" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="750" y1="297.5" x2="1080" y2="297.5" stroke="#dbe5e8" stroke-width="2"/><line x1="1080" y1="545" x2="1080" y2="215" stroke="#dbe5e8" stroke-width="2"/><line x1="750" y1="215" x2="1080" y2="215" stroke="#dbe5e8" stroke-width="2"/><text x="1080" y="580" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="735" y="223" font-size="24" fill="#71858b" text-anchor="end">2</text><path d="M750.00,380.00 L915.00,545.00" fill="none" stroke="#256b82" stroke-width="4"/><circle cx="832.5" cy="462.5" r="7" fill="#256b82"/><text x="750" y="185" font-size="28" fill="#19333c" text-anchor="start">a：1 → 2，最优解跟着移动</text><path d="M750.00,215.00 L1080.00,545.00" fill="none" stroke="#c0643c" stroke-width="4"/><circle cx="915" cy="380" r="7" fill="#c0643c"/><path d="M832.50,462.50 L915.00,380.00" fill="none" stroke="#19333c" stroke-width="4"/><text x="750" y="635" font-size="28" fill="#c0643c" text-anchor="start">Δw1 + Δw2 = Δa = 1</text><line x1="60" y1="680" x2="1220" y2="680" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="730" font-size="27" fill="#19333c" text-anchor="start">固定 a 时，切向 (1, −1) 合法；改变 a 时，解响应不必落在旧约束的切空间。</text><text x="60" y="780" font-size="26" fill="#71858b" text-anchor="start">统一线性化：C Δw + c_a Δa = 0；不能在移动约束下仍要求 C Δw = 0。</text></g></svg>

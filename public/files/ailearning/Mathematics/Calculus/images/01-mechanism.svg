<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>同一输入的两条求导路径</title><desc>输入同时进入平方支路与恒等支路，两条路径最后相加。在 x=2 处，前一条路径贡献4，后一条贡献1，因此总导数为5。图把“沿路径相乘、汇合处相加”分开呈现；如果只沿平方支路回传，就会漏掉共享输入的一次贡献。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">同一输入的两条求导路径</text><rect x="50" y="350" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="65" y="387" font-size="25" fill="#16344c" text-anchor="start">输入 x=2</text><text x="65" y="425" font-size="24" fill="#16344c" text-anchor="start" /><rect x="460" y="170" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="475" y="207" font-size="25" fill="#16344c" text-anchor="start">平方 u=x²</text><text x="475" y="245" font-size="24" fill="#16344c" text-anchor="start">局部导数4</text><rect x="460" y="490" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="475" y="527" font-size="25" fill="#16344c" text-anchor="start">恒等 v=x</text><text x="475" y="565" font-size="24" fill="#16344c" text-anchor="start">局部导数1</text><rect x="870" y="350" width="270" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="885" y="387" font-size="25" fill="#16344c" text-anchor="start">L=u+v</text><text x="885" y="425" font-size="24" fill="#16344c" text-anchor="start">总导数5</text><path d="M325,380 L445,230" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M325,410 L445,530" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,230 L860,380" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,530 L860,410" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="705" font-size="24" fill="#16344c" text-anchor="start">输入被使用两次，梯度贡献应相加。</text></g></svg>

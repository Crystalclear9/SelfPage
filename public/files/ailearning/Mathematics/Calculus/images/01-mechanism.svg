<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>链式法则：一条共享输入，要沿两条路径累加</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">链式法则：一条共享输入，要沿两条路径累加</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">同一基点 x = 1，y = 2；u = x²，v = x + y，L = u × v</text><line x1="175.0" y1="270.0" x2="545.0" y2="270.0" stroke="#216983" stroke-width="4"/><path d="M533.29,275.65 L545.00,270.00 L533.29,264.35" fill="none" stroke="#216983" stroke-width="4"/><text x="360.0" y="245.0" font-size="25" fill="#216983" text-anchor="middle">局部导数 2x = 2</text><line x1="168.78027462918388" y1="295.40639303603325" x2="551.2197253708161" y2="494.59360696396675" stroke="#bc5b32" stroke-width="4"/><path d="M538.23,494.20 L551.22,494.59 L543.45,484.17" fill="none" stroke="#bc5b32" stroke-width="4"/><text x="285" y="410" font-size="25" fill="#bc5b32" text-anchor="middle">局部导数 1</text><line x1="175.0" y1="520.0" x2="545.0" y2="520.0" stroke="#bc5b32" stroke-width="4"/><path d="M533.29,525.65 L545.00,520.00 L533.29,514.35" fill="none" stroke="#bc5b32" stroke-width="4"/><text x="360.0" y="495.0" font-size="25" fill="#bc5b32" text-anchor="middle">局部导数 1</text><line x1="653.5915157632041" y1="282.3672728684317" x2="1066.4084842367959" y2="377.6327271315683" stroke="#216983" stroke-width="4"/><path d="M1053.73,380.51 L1066.41,377.63 L1056.27,369.49" fill="none" stroke="#216983" stroke-width="4"/><text x="860.0" y="305.0" font-size="25" fill="#216983" text-anchor="middle">局部导数 v = 3</text><line x1="653.3578375079933" y1="506.6605406230017" x2="1066.6421624920067" y2="403.3394593769983" stroke="#bc5b32" stroke-width="4"/><path d="M1056.66,411.66 L1066.64,403.34 L1053.91,400.69" fill="none" stroke="#bc5b32" stroke-width="4"/><text x="860.0" y="430.0" font-size="25" fill="#bc5b32" text-anchor="middle">局部导数 u = 1</text><circle cx="120" cy="270" r="48" fill="white" stroke="#20343e" stroke-width="2"/><text x="120" y="280" font-size="32" fill="#20343e" text-anchor="middle">1</text><text x="120" y="200" font-size="30" fill="#20343e" text-anchor="middle">x</text><circle cx="120" cy="520" r="48" fill="white" stroke="#20343e" stroke-width="2"/><text x="120" y="530" font-size="32" fill="#20343e" text-anchor="middle">2</text><text x="120" y="450" font-size="30" fill="#20343e" text-anchor="middle">y</text><circle cx="600" cy="270" r="48" fill="white" stroke="#20343e" stroke-width="2"/><text x="600" y="280" font-size="32" fill="#20343e" text-anchor="middle">1</text><text x="600" y="200" font-size="30" fill="#20343e" text-anchor="middle">u</text><circle cx="600" cy="520" r="48" fill="white" stroke="#20343e" stroke-width="2"/><text x="600" y="530" font-size="32" fill="#20343e" text-anchor="middle">3</text><text x="600" y="450" font-size="30" fill="#20343e" text-anchor="middle">v</text><circle cx="1120" cy="390" r="48" fill="white" stroke="#20343e" stroke-width="2"/><text x="1120" y="400" font-size="32" fill="#20343e" text-anchor="middle">3</text><text x="1120" y="320" font-size="30" fill="#20343e" text-anchor="middle">L</text><line x1="54" y1="620" x2="1226" y2="620" stroke="#dee7eb" stroke-width="2"/><text x="65" y="670" font-size="29" fill="#20343e" text-anchor="start">反向：共享 x 的贡献</text><text x="65" y="722" font-size="28" fill="#216983" text-anchor="start">经 u：3 × 2 = 6</text><text x="65" y="772" font-size="28" fill="#bc5b32" text-anchor="start">经 v：1 × 1 = 1</text><rect x="420" y="698" width="240" height="35" fill="#216983"/><rect x="660" y="698" width="40" height="35" fill="#bc5b32"/><text x="560" y="783" font-size="29" fill="#20343e" text-anchor="middle">总敏感性 7</text><text x="820" y="670" font-size="29" fill="#20343e" text-anchor="start">前向：指定方向 (1, −1)</text><text x="820" y="722" font-size="25" fill="#20343e" text-anchor="start">u 的变化率 2；v 的变化率 0</text><text x="820" y="772" font-size="25" fill="#20343e" text-anchor="start">L 的变化率：3 × 2 + 1 × 0 = 6</text></g></svg>

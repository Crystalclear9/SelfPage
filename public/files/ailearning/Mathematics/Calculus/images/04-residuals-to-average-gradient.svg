<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="624" viewBox="0 0 1360 624" role="img" aria-labelledby="title desc"><title id="title">从残差到参数更新</title><desc id="desc">两条样本在相同旧参数处得到残差与梯度，平均梯度为 (0.5,0)，沿负方向更新。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1360" height="624" fill="white" stroke="none" stroke-width="1.55"/><text x="174" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">样本</text><text x="507" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">残差</text><text x="846" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">参数梯度</text><text x="1161" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">平均后更新</text><polygon points="60.5,214.5 234.5,214.5 267.5,145.5 93.5,145.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="164" y="190.2" fill="#196f77" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">样本 A</text><polygon points="428.5,214.5 553.5,214.5 583.5,145.5 458.5,145.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="506" y="190.88" fill="#196f77" font-size="32" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">−1</text><polygon points="737.5,215 923.5,215 956.5,145 770.5,145" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="847" y="190.54" fill="#196f77" font-size="31" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">(−1, −1)</text><line x1="278" y1="180" x2="414" y2="180" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="596" y1="180" x2="722" y2="180" stroke="#196f77" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="967" y1="180" x2="1085" y2="260" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="60.5,412.5 234.5,412.5 267.5,343.5 93.5,343.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="164" y="388.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">样本 B</text><polygon points="428.5,412.5 553.5,412.5 583.5,343.5 458.5,343.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="506" y="388.88" fill="#a84b3b" font-size="32" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">1</text><polygon points="737.5,413 923.5,413 956.5,343 770.5,343" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="847" y="388.54" fill="#a84b3b" font-size="31" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">(2, 1)</text><line x1="278" y1="378" x2="414" y2="378" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/><line x1="596" y1="378" x2="722" y2="378" stroke="#a84b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)"/><line x1="967" y1="378" x2="1085" y2="296" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-coral)"/><polygon points="1103.5,313 1249.5,313 1276.5,243 1130.5,243" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="1190" y="288.2" fill="#655184" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">(0.5, 0)</text><text x="675" y="513" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">先在旧参数处收集所有贡献，再沿负梯度移动</text><text x="675" y="570" fill="#202a37" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">旧权重为 1、偏置为 0，样本分别为 (1,2) 与 (2,1)</text></svg>
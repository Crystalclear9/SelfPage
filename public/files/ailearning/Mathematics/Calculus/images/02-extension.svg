<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>交叉项如何旋转局部二次几何</title><desc>取二次型q(x,y)=x²+2ρxy+y²，比较ρ=0与0.8。两者在坐标轴上的二次系数相同，但交叉项改变了沿对角方向的曲率；特征方向的系数变为1.8与0.2，因此等值线被拉长并旋转。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">交叉项如何旋转局部二次几何</text><text x="130" y="160" font-size="22" fill="#193e54" text-anchor="start">ρ=0：各方向等曲率</text><text x="690" y="160" font-size="22" fill="#193e54" text-anchor="start">ρ=0.8：对角方向不同</text><line x1="90" y1="420" x2="510" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="300" y1="210" x2="300" y2="630" stroke="#277eac" stroke-width="2.5" /><line x1="640" y1="420" x2="1060" y2="420" stroke="#277eac" stroke-width="2.5" /><line x1="850" y1="210" x2="850" y2="630" stroke="#277eac" stroke-width="2.5" /><circle cx="300" cy="420" r="40" fill="none" stroke="#148671" stroke-width="3" /><ellipse cx="850" cy="420" rx="29.8" ry="89.4" transform="rotate(-45 850 420)" fill="none" stroke="#1977b4" stroke-width="3" /><circle cx="300" cy="420" r="65" fill="none" stroke="#148671" stroke-width="3" /><ellipse cx="850" cy="420" rx="48.4" ry="145.3" transform="rotate(-45 850 420)" fill="none" stroke="#1977b4" stroke-width="3" /><circle cx="300" cy="420" r="90" fill="none" stroke="#148671" stroke-width="3" /><ellipse cx="850" cy="420" rx="67.1" ry="201.2" transform="rotate(-45 850 420)" fill="none" stroke="#1977b4" stroke-width="3" /><line x1="680" y1="250" x2="1020" y2="590" stroke="#dc752b" stroke-width="2.5" stroke-dasharray="6 5" /><text x="600" y="720" font-size="21" fill="#193e54" text-anchor="start">同一等值水平；虚线为高曲率的 (1,1) 特征方向。</text></g></svg>

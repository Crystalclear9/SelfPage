<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>曲率不同，稳定步长范围也不同</title><desc>取目标 f(w)=a·w² 并固定初值为1。上图比较 a=1 与 a=4、同用步长0.2时的离散参数轨迹：前者每步乘0.6，后者每步乘−0.6，二者均收敛但后者交替跨过最优点。再把高曲率情形步长增到0.3，每步乘−1.4，振幅便会增大。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">曲率不同，稳定步长范围也不同</text><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">0</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">1.6</text><line x1="496.0" y1="235" x2="496.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="496.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">3.2</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">4.8</text><line x1="872.0" y1="235" x2="872.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="872.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">6.4</text><line x1="1060.0" y1="235" x2="1060.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">8</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="20" fill="#16344c" text-anchor="end">-15</text><line x1="120" y1="535.0" x2="1060" y2="535.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="542.0" font-size="20" fill="#16344c" text-anchor="end">-7.5</text><line x1="120" y1="435.0" x2="1060" y2="435.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="442.0" font-size="20" fill="#16344c" text-anchor="end">0</text><line x1="120" y1="335.0" x2="1060" y2="335.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="342.0" font-size="20" fill="#16344c" text-anchor="end">7.5</text><line x1="120" y1="235.0" x2="1060" y2="235.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="242.0" font-size="20" fill="#16344c" text-anchor="end">15</text><line x1="120" y1="635" x2="1060" y2="635" stroke="#277eac" stroke-width="2.5" /><line x1="120" y1="235" x2="120" y2="635" stroke="#277eac" stroke-width="2.5" /><text x="1060" y="205" font-size="20" fill="#456679" text-anchor="end">横轴：步数</text><text x="120" y="223" font-size="18" fill="#16344c" text-anchor="start">参数（初值1）</text><line x1="90" y1="130" x2="140" y2="130" stroke="#118779" stroke-width="2.5" /><text x="155" y="138" font-size="21" fill="#118779" text-anchor="start">a=1，步长0.2</text><polyline points="120.00,421.67 237.50,427.00 355.00,430.20 472.50,432.12 590.00,433.27 707.50,433.96 825.00,434.38 942.50,434.63 1060.00,434.78" fill="none" stroke="#118779" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="120.00" cy="421.67" r="4" fill="#118779" /><circle cx="237.50" cy="427.00" r="4" fill="#118779" /><circle cx="355.00" cy="430.20" r="4" fill="#118779" /><circle cx="472.50" cy="432.12" r="4" fill="#118779" /><circle cx="590.00" cy="433.27" r="4" fill="#118779" /><circle cx="707.50" cy="433.96" r="4" fill="#118779" /><circle cx="825.00" cy="434.38" r="4" fill="#118779" /><circle cx="942.50" cy="434.63" r="4" fill="#118779" /><circle cx="1060.00" cy="434.78" r="4" fill="#118779" /><line x1="90" y1="161" x2="140" y2="161" stroke="#d26724" stroke-width="2.5" /><text x="155" y="169" font-size="21" fill="#d26724" text-anchor="start">a=4，步长0.2</text><polyline points="120.00,421.67 237.50
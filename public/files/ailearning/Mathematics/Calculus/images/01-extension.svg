<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>没有普通导数，为什么仍有支持线？</title><desc>绝对值在零点的左右差商为负一和一；普通导数不存在。原点的支持线y=gx当且仅当-1&lt;=g&lt;=1。图比较有效斜率0.5与无效斜率1.5。</desc><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">没有普通导数，为什么仍有支持线？</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">f(x) = |x|     ·     导数要求两侧吻合；次梯度要求整条线不越过函数</text><line x1="102.0" y1="515" x2="518.0" y2="515" stroke="#78878b" stroke-width="2"/><line x1="310" y1="606.0" x2="310" y2="255" stroke="#78878b" stroke-width="2"/><path d="M115.00,320.00 L310.00,515.00 L505.00,320.00" stroke="#256b82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="165" font-size="29" fill="#19333c" text-anchor="middle" font-weight="700">左右差商</text><circle cx="206.0" cy="411.0" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><line x1="206.0" y1="515" x2="206.0" y2="411.0" stroke="#c0643c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="414.0" cy="411.0" r="7" fill="#256b82" stroke="#256b82" stroke-width="2"/><line x1="414.0" y1="515" x2="414.0" y2="411.0" stroke="#256b82" stroke-width="2" stroke-dasharray="6 5"/><text x="85" y="291" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">左：−1</text><text x="405" y="291" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">右：+1</text><circle cx="310" cy="515" r="6" fill="#19333c" stroke="#19333c" stroke-width="2"/><text x="310" y="634" font-size="27" fill="#19333c" text-anchor="middle" font-weight="400">两侧不同：普通导数不存在</text><line x1="692.0" y1="515" x2="1108.0" y2="515" stroke="#78878b" stroke-width="2"/><line x1="900" y1="606.0" x2="900" y2="255" stroke="#78878b" stroke-width="2"/><path d="M705.00,320.00 L900.00,515.00 L1095.00,320.00" stroke="#256b82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="900" y="165" font-size="29" fill="#19333c" text-anchor="middle" font-weight="700">支持线的全局条件</text><line x1="705.0" y1="417.5" x2="1095.0" y2="612.5" stroke="#78878b" stroke-width="2" stroke-dasharray="5 6"/><line x1="705.0" y1="515.0" x2="1095.0" y2="515.0" stroke="#78878b" stroke-width="2" stroke-dasharray="5 6"/><line x1="705.0" y1="612.5" x2="1095.0" y2="417.5" stroke="#78878b" stroke-width="2" stroke-dasharray="5 6"/><line x1="731.0" y1="599.5" x2="1069.0" y2="430.5" stroke="#c0643c" stroke-width="4"/><line x1="900" y1="515" x2="1056.0" y2="281.0" stroke="#c0643c" stroke-width="2" stroke-dasharray="4 5"/><line x1="1030" y1="385" x2="1030" y2="320.0" stroke="#c0643c" stroke-width="4"/><text x="1070" y="270" font-size="24" fill="#c0643c" text-anchor="middle" font-weight="400">1.5x 越界</text><text x="1050" y="469" font-size="25" fill="#c0643c" text-anchor="middle" font-weight="400">0.5x 合法</text><text x="900" y="634" font-size="27" fill="#19333c" text-anchor="middle" font-weight="400">合法斜率组成区间 [−1, 1]</text><text x="40" y="687" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">次梯度是一条下支撑线的斜率，不是多个普通导数同时存在。</text></g></svg>

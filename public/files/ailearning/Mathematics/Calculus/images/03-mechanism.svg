<title id="title">约束什么时候会改变最优点</title><desc id="desc">同一个非负约束。在 a=-1 时，无约束解在可行域外，约束解是零。在 a=1 时，原解可行。连续扫描 a 时，最优解与乘子在零点交换斜率。</desc>

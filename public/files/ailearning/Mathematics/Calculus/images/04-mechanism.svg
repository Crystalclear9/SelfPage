<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>不等长微批次必须按有效计数加权</title><desc>微批次A包含1个有效样本，梯度均值为2；B包含3个有效样本，梯度均值为6。直接平均两个均值得到4，实际全体4个样本的均值却是5。正确合并先还原各批梯度和，再除以总有效计数。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">不等长微批次必须按有效计数加权</text><text x="85" y="190" font-size="24" fill="#16344c" text-anchor="start">数值</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="512.8" width="145.0" height="97.2" fill="#2865a0" /><text x="207.5" y="496.7777777777778" font-size="24" fill="#16344c" text-anchor="middle">2</text><text x="207.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">微批次均值 gA</text><rect x="370.0" y="318.3" width="145.0" height="291.7" fill="#cf7432" /><text x="442.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">6</text><text x="442.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">微批次均值 gB</text><rect x="605.0" y="415.6" width="145.0" height="194.4" fill="#627689" /><text x="677.5" y="399.55555555555554" font-size="24" fill="#16344c" text-anchor="middle">4</text><text x="677.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">直接平均</text><rect x="840.0" y="366.9" width="145.0" height="243.1" fill="#2865a0" /><text x="912.5" y="350.9444444444444" font-size="24" fill="#16344c" text-anchor="middle">5</text><text x="912.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">按计数合并</text><text x="100" y="135" font-size="24" fill="#416478">有效计数：nA=1，nB=3；同一参数点</text></g></svg>

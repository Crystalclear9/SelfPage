<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>平均两个批均值，悄悄改变了样本权重</title><desc>同一参数处四个标量梯度2,4,6,8，分组A含2，B含4,6,8。平均批均值使A样本权重1/2而B各1/6；正确平均每个权重1/4。结果分别4与5。</desc><rect width="1200" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="35" fill="#19333c" text-anchor="start" font-weight="700">平均两个批均值，悄悄改变了样本权重</text><text x="40" y="103" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">同一参数位置：A 只有一个有效样本，B 有三个</text><circle cx="180" cy="205" r="28" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="180" y="214" font-size="27" fill="white" text-anchor="middle" font-weight="400">2</text><text x="180" y="266" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">A</text><circle cx="430" cy="205" r="28" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="430" y="214" font-size="27" fill="white" text-anchor="middle" font-weight="400">4</text><text x="430" y="266" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">B</text><circle cx="680" cy="205" r="28" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="680" y="214" font-size="27" fill="white" text-anchor="middle" font-weight="400">6</text><text x="680" y="266" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">B</text><circle cx="930" cy="205" r="28" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="930" y="214" font-size="27" fill="white" text-anchor="middle" font-weight="400">8</text><text x="930" y="266" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">B</text><text x="40" y="334" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">直接平均批均值</text><text x="40" y="520" font-size="28" fill="#19333c" text-anchor="start" font-weight="700">正确平均样本</text><rect x="110" y="370" width="140.0" height="32" fill="#dbecef" stroke="none" stroke-width="2"/><text x="180" y="441" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">1</text><line x1="159" y1="450" x2="201" y2="450" stroke="#256b82" stroke-width="2"/><text x="180" y="481" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">2</text><rect x="360" y="370" width="46.666666666666664" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="430" y="441" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="409" y1="450" x2="451" y2="450" stroke="#c0643c" stroke-width="2"/><text x="430" y="481" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">6</text><rect x="610" y="370" width="46.666666666666664" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="680" y="441" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="659" y1="450" x2="701" y2="450" stroke="#c0643c" stroke-width="2"/><text x="680" y="481" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">6</text><rect x="860" y="370" width="46.666666666666664" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="930" y="441" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="909" y1="450" x2="951" y2="450" stroke="#c0643c" stroke-width="2"/><text x="930" y="481" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">6</text><text x="1110" y="390" font-size="32" fill="#19333c" text-anchor="end" font-weight="700">= 4</text><rect x="110" y="560" width="70.0" height="32" fill="#dbecef" stroke="none" stroke-width="2"/><text x="180" y="631" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">1</text><line x1="159" y1="640" x2="201" y2="640" stroke="#256b82" stroke-width="2"/><text x="180" y="671" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">4</text><rect x="360" y="560" width="70.0" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="430" y="631" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="409" y1="640" x2="451" y2="640" stroke="#c0643c" stroke-width="2"/><text x="430" y="671" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">4</text><rect x="610" y="560" width="70.0" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="680" y="631" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="659" y1="640" x2="701" y2="640" stroke="#c0643c" stroke-width="2"/><text x="680" y="671" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">4</text><rect x="860" y="560" width="70.0" height="32" fill="#f3ddd0" stroke="none" stroke-width="2"/><text x="930" y="631" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">1</text><line x1="909" y1="640" x2="951" y2="640" stroke="#c0643c" stroke-width="2"/><text x="930" y="671" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">4</text><text x="1110" y="580" font-size="32" fill="#19333c" text-anchor="end" font-weight="700">= 5</text><text x="40" y="747" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">矩形宽度表示每个样本的权重；批次数相同，不代表样本贡献应该相同。</text></g></svg>

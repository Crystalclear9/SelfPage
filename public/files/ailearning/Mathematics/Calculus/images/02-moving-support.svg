<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img"><title>支持向右移动：旧区间变矮，新区间贡献正面积</title><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">支持向右移动：旧区间变矮，新区间贡献正面积</text><text x="60" y="115" font-size="28" fill="#71858b" text-anchor="start">F(θ) = E[Z]，Z 均匀分布于 [0, θ]；被积函数是 z / θ</text><line x1="100" y1="510" x2="650" y2="510" stroke="#19333c" stroke-width="2"/><text x="100" y="552" font-size="24" fill="#71858b" text-anchor="middle">0</text><text x="310" y="552" font-size="24" fill="#71858b" text-anchor="middle">1</text><text x="520" y="552" font-size="24" fill="#71858b" text-anchor="middle">2</text><text x="604.0" y="552" font-size="24" fill="#71858b" text-anchor="middle">2.4</text><line x1="100" y1="510" x2="650" y2="510" stroke="#dbe5e8" stroke-width="2"/><text x="85" y="518" font-size="24" fill="#71858b" text-anchor="end">0</text><line x1="100" y1="365.0" x2="650" y2="365.0" stroke="#dbe5e8" stroke-width="2"/><text x="85" y="373.0" font-size="24" fill="#71858b" text-anchor="end">0.5</text><line x1="100" y1="220" x2="650" y2="220" stroke="#dbe5e8" stroke-width="2"/><text x="85" y="228" font-size="24" fill="#71858b" text-anchor="end">1</text><polygon points="100,510 520,220 520,268.3333333333333" fill="#dbecef"/><polygon points="520,510 520,268.3333333333333 604.0,220 604.0,510" fill="#f3ddd0"/><path d="M100.00,510.00 L520.00,220.00" fill="none" stroke="#256b82" stroke-width="4"/><path d="M100.00,510.00 L604.00,220.00" fill="none" stroke="#c0643c" stroke-width="4"/><text x="100" y="185" font-size="29" fill="#19333c" text-anchor="start">θ：2 → 2.4</text><text x="170" y="610" font-size="26" fill="#256b82" text-anchor="start">蓝色阴影：旧区间减少</text><text x="170" y="652" font-size="26" fill="#c0643c" text-anchor="start">橙色阴影：新增支持</text><text x="750" y="230" font-size="29" fill="#256b82" text-anchor="start">固定旧区间 [0, 2]</text><text x="750" y="290" font-size="28" fill="#256b82" text-anchor="start">积分变化 = −0.166667</text><text x="750" y="380" font-size="29" fill="#c0643c" text-anchor="start">新增区间 (2, 2.4]</text><text x="750" y="440" font-size="28" fill="#c0643c" text-anchor="start">积分贡献 = +0.366667</text><text x="750" y="540" font-size="32" fill="#19333c" text-anchor="start">相加：+0.2</text><line x1="60" y1="690" x2="1220" y2="690" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="740" font-size="27" fill="#19333c" text-anchor="start">除以 Δθ = 0.4，总变化率为 0.5；只对旧区间求导会遗漏边界贡献。</text><text x="60" y="793" font-size="26" fill="#71858b" text-anchor="start">图中纵轴是 z × 密度，不是概率密度；阴影表示期望积分的变化。</text></g></svg>

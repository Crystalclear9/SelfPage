<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">割线随邻域缩小接近同一点的切线</title>
<desc id="fig-desc">在同一坐标范围内，用平方函数比较两条割线；切线仍只是一阶近似。</desc>

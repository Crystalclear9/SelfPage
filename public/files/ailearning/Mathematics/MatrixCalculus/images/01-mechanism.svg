<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>同一个 W：前向传扰动，反向把每条路径贡献相加</title><rect width="1280" height="840" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">同一个 W：前向传扰动，反向把每条路径贡献相加</text><text x="75" y="145" font-size="30" fill="#256b82" text-anchor="start">前向：Δy = WΔx</text><text x="690" y="145" font-size="30" fill="#c0643c" text-anchor="start">反向：输入敏感性 = W^Tg</text><line x1="165" y1="300" x2="495" y2="300" stroke="#256b82" stroke-width="3"/><path d="M495,300 L480.0,293.0 L480.0,307.0Z" fill="#256b82"/><text x="330.0" y="282.0" font-size="28" fill="#19333c" text-anchor="middle">1</text><line x1="165" y1="560" x2="495" y2="300" stroke="#256b82" stroke-width="3"/><path d="M495,300 L478.88551933036234,303.78464169345995 L487.54973050281154,314.7815251046455Z" fill="#256b82"/><text x="409.2" y="349.6" font-size="28" fill="#19333c" text-anchor="middle">2</text><line x1="165" y1="300" x2="495" y2="560" stroke="#256b82" stroke-width="3"/><path d="M495,560 L487.54973050281154,545.2184748953546 L478.88551933036234,556.2153583065401Z" fill="#256b82"/><text x="250.8" y="349.6" font-size="28" fill="#19333c" text-anchor="middle">3</text><line x1="165" y1="560" x2="495" y2="560" stroke="#256b82" stroke-width="3"/><path d="M495,560 L480.0,553.0 L480.0,567.0Z" fill="#256b82"/><text x="330.0" y="542.0" font-size="28" fill="#19333c" text-anchor="middle">4</text><circle cx="150" cy="300" r="9" fill="#256b82"/><circle cx="510" cy="300" r="9" fill="#256b82"/><text x="126" y="310" font-size="31" fill="#19333c" text-anchor="end">1</text><text x="532" y="310" font-size="31" fill="#19333c" text-anchor="start">1</text><circle cx="150" cy="560" r="9" fill="#256b82"/><circle cx="510" cy="560" r="9" fill="#256b82"/><text x="126" y="570" font-size="31" fill="#19333c" text-anchor="end">0</text><text x="532" y="570" font-size="31" fill="#19333c" text-anchor="start">3</text><text x="115" y="230" font-size="27" fill="#19333c" text-anchor="start">输入端</text><text x="475" y="230" font-size="27" fill="#19333c" text-anchor="start">输出端</text><line x1="1115" y1="300" x2="785" y2="300" stroke="#c0643c" stroke-width="3"/><path d="M785,300 L800.0,307.0 L800.0,293.0Z" fill="#c0643c"/><text x="950.0" y="282.0" font-size="28" fill="#19333c" text-anchor="middle">1</text><line x1="1115" y1="300" x2="785" y2="560" stroke="#c0643c" stroke-width="3"/><path d="M785,560 L801.1144806696376,556.2153583065401 L792.4502694971885,545.2184748953546Z" fill="#c0643c"/><text x="1029.2" y="349.6" font-size="28" fill="#19333c" text-anchor="middle">2</text><line x1="1115" y1="560" x2="785" y2="300" stroke="#c0643c" stroke-width="3"/><path d="M785,300 L792.4502694971885,314.7815251046455 L801.1144806696376,303.78464169345995Z" fill="#c0643c"/><text x="870.8" y="349.6" font-size="28" fill="#19333c" text-anchor="middle">3</text><line x1="1115" y1="560" x2="785" y2="560" stroke="#c0643c" stroke-width="3"/><path d="M785,560 L800.0,567.0 L800.0,553.0Z" fill="#c0643c"/><text x="950.0" y="542.0" font-size="28" fill="#19333c" text-anchor="middle">4</text><circle cx="770" cy="300" r="9" fill="#c0643c"/><circle cx="1130" cy="300" r="9" fill="#c0643c"/><text x="746" y="310" font-size="31" fill="#19333c" text-anchor="end">−2</text><text x="1152" y="310" font-size="31" fill="#19333c" text-anchor="start">1</text><circle cx="770" cy="560" r="9" fill="#c0643c"/><circle cx="1130" cy="560" r="9" fill="#c0643c"/><text x="746" y="570" font-size="31" fill="#19333c" text-anchor="end">−2</text><text x="1152" y="570" font-size="31" fill="#19333c" text-anchor="start">−1</text><text x="735" y="230" font-size="27" fill="#19333c" text-anchor="start">输入端</text><text x="1095" y="230" font-size="27" fill="#19333c" text-anchor="start">输出端</text><text x="80" y="685" font-size="29" fill="#256b82" text-anchor="start">1 × 1 + 2 × 0 = 1</text><text x="80" y="740" font-size="29" fill="#256b82" text-anchor="start">3 × 1 + 4 × 0 = 3</text><text x="700" y="685" font-size="28" fill="#c0643c" text-anchor="start">1 × 1 + 3 × (−1) = −2</text><text x="700" y="740" font-size="28" fill="#c0643c" text-anchor="start">2 × 1 + 4 × (−1) = −2</text><text x="80" y="810" font-size="29" fill="#19333c" text-anchor="start">配对核验：g · Δy = 1 − 3 = −2 = (W^Tg) · Δx。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 718" width="1360" height="718"><title id="plate-caption">L2 归一化的径向与切向扰动</title><desc id="plate-alt">取 x=(3,4)，原长度为 5，归一化输出为 u=(0.6,0.8)。径向扰动 (0.3,0.4)=0.1x 只把输入变成 1.1x，归一化后仍严格等于 u。切向扰动 \delta=(0.4,-0.3) 与 x 正交，雅可比给出 J_2\delta=(0.08,-0.06)；有限扰动后的精确输出为 \frac{(3.4,3.7)}{\sqrt{25.25}}\approx(0.67663,0.73633)。右图只放大单位圆的一段圆弧，便于看清方向变化；输入与输出面板使用不同坐标范围，不能比较箭头的屏幕长度。 这里没有加入稳定项，且输入保持非零。切向雅可比描述一阶响应，u+J_2\delta=(0.68,0.74) 与精确输出仍有二阶差异；不能把有限步的直线近似误写成严格落在球面上的结果。 L2 归一化：径向变化被消除，切向变化被保留</desc><defs><clipPath id="plate-view-0"><rect x="-18.24" y="90.17618" width="996.48" height="445.66539"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="467.784193"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="554.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="518" viewBox="0 47 960 518" overflow="hidden"><rect width="960" height="565" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(-8.122605 20.795687) scale(0.871648)"><g><title id="extra-title">L2 归一化：径向变化被消除，切向变化被保留</title><desc id="extra-desc">取 x=(3,4)，原长度为 5，归一化输出为 u=(0.6,0.8)。径向扰动 (0.3,0.4)=0.1x 只把输入变成 1.1x，归一化后仍严格等于 u。切向扰动 \delta=(0.4,-0.3) 与 x 正交，雅可比给出 J_2\delta=(0.08,-0.06)；有限扰动后的精确输出为 \frac{(3.4,3.7)}{\sqrt{25.25}}\approx(0.67663,0.73633)。右图只放大单位圆的一段圆弧，便于看清方向变化；输入与输出面板使用不同坐标范围，不能比较箭头的屏幕长度。

这里没有加入稳定项，且输入保持非零。切向雅可比描述一阶响应，u+J_2\delta=(0.68,0.74) 与精确输出仍有二阶差异；不能把有限步的直线近似误写成严格落在球面上的结果。 L2 归一化：径向变化被消除，切向变化被保留</desc><rect width="1200" height="600" fill="#ffffff"/><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e77a6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#be6f3e"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="60" y="110" font-size="30.402198px" fill="#2e77a6" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">输入：长度与方向的两种改变</text><text x="650" y="110" font-size="30.402198px" fill="#a25e34" text-anchor="start" font-weight="400" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">归一化后：只保留方向</text><line x1="100" y1="490.0" x2="430" y2="490.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="498.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">0</text><line x1="100" y1="424.0" x2="430" y2="424.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="432.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">1</text><line x1="100" y1="358.0" x2="430" y2="358.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="366.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">2</text><line x1="100" y1="292.0" x2="430" y2="292.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="300.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">3</text><line x1="100" y1="226.0" x2="430" y2="226.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="234.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400">4</text><line x1="100" y1="160.0" x2="430" y2="160.0" stroke="#dbe8eb" stroke-width="2"/><text x="88" y="168.0" font-size="28.56px" fill="#4f7791" text-anchor="end" font-weight="400"
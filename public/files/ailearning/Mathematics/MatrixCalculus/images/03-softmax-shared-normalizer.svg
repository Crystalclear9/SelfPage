een" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="621" fill="white" stroke="none" stroke-width="1.6"/><text x="324" y="61" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">相同分数</text><line x1="127" y1="469" x2="566" y2="469" stroke="#202a37" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="127" y1="469" x2="127" y2="210" stroke="#202a37" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="125" y="194" fill="#202a37" font-size="25" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">概率</text><rect x="173" y="315" width="64" height="154" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.6"/><text x="205" y="250" fill="#a84b3b" font-size="24" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">1</text><line x1="183" y1="258" x2="227" y2="258" stroke="#a84b3b" stroke-width="1.6" stroke-linecap="round"/><text x="205" y="289" fill="#a84b3b" font-size="24" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">3</text><text x="205" y="519" fill="#a84b3b" font-size="29" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">0</text><rect x="320" y="315" width="64" height="154" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="352" y="250" fill="#196f77" font-size="24" text-anchor="middle" font-fa
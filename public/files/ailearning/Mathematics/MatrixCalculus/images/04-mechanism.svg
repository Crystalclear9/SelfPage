<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>梯度检查的步长扫描如何暴露错误</title><desc>用 f(w)=w³ 在w=1处检查导数，解析值应为3。中心差分在精确算术下等于3+h²，因此正确实现的绝对误差为h²；若故意把梯度写成3.1，误差会在小步长区域停留在约0.1，形成明显平台。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">梯度检查的步长扫描如何暴露错误</text><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-5</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-4.2</text><line x1="496.0" y1="235" x2="496.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="496.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-3.4</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-2.6</text><line x1="872.0" y1="235" x2="872.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="872.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-1.8</text><line x1="1060.0" y1="235" x2="1060.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0" y="671" font-size="20" fill="#16344c" text-anchor="middle">-1</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="20" fill="#16344c" text-anchor="end">-10</text><line x1="120" y1="535.0" x2="1060" y2="535.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="542.0" font-size="20
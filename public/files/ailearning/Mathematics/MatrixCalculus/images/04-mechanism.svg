#19333c" text-anchor="middle">0</text><text x="60" y="467" font-size="29" fill="#19333c" text-anchor="start">漏掉 tanh 斜率</text><rect x="388" y="414" width="174" height="82" fill="#ebaf92" /><text x="475" y="467" font-size="33" fill="#19333c" text-anchor="middle">0.443</text><rect x="583" y="414" width="174" height="82" fill="#efbea5" /><text x="670" y="467" font-size="33" fill="#19333c" text-anchor="middle">0.333</text><rect x="778" y="414" width="174" height="82" fill="#f1f5f6" /><text x="865" y="467" font-size="33" fill="#19333c" text-anchor="middle">0</text><rect x="973" y="414" width="174" height="82" fill="#f1f5f6" /><text x="1060" y="467" font-size="33" fill="#19333c" text-anchor="middle">0</text><text x="60" y="567" font-size="29" fill="#19333c" text-anchor="start">偏置只取首行</text><rect x="388" y="514" width="174" height="82" fill="#f1f5f6" /><text x="475" y="567" font-size="33" fill="#19333c" text-anchor="middle">0</text><rect x="583" y="514" width="174" height="82" fill="#e69d7d" /><text x="670" y="567" font-size="33" fill="#19333c" text-anchor="middle">0.569</text><rect x="778" y="514" width="174" height="82" fill="#f1f5f6" /><text x="865" y="567" font-size="33" fill="#19333c" text-anchor="middle">0</text><rect x="973" y="514" width="174" height="82" fill="#ecb398" /><text x="1060" y="567" font-size="33" fill="#19333c" text-anchor="middle">0.409</text><text x="60" y="674" font-size="27" fill="#50636e" text-anchor="start">零格：该故障没有改动此块；不代表检查了全部输入。</text></g><desc> 同一个两层网络，四种错误留下不同的参数块图样 颜色只编码本次误差大小；样本平均与权重正则必须分开计算。</desc></svg>

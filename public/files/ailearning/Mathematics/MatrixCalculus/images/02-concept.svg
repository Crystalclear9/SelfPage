<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>广播反向：每一列汇回一个共享偏置坐标</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">广播反向：每一列汇回一个共享偏置坐标</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">同一残差 R；两个目标只改变上游缩放，局部规则都沿样本轴求和</text><rect x="75" y="320" width="82" height="74" fill="#e7f0f4"/><text x="116" y="367" font-size="30" fill="#216983" text-anchor="middle">1</text><rect x="175" y="320" width="82" height="74" fill="#f5e5dc"/><text x="216" y="367" font-size="30" fill="#bc5b32" text-anchor="middle">2</text><rect x="75" y="420" width="82" height="74" fill="#e7f0f4"/><text x="116" y="467" font-size="30" fill="#216983" text-anchor="middle">3</text><rect x="175" y="420" width="82" height="74" fill="#f5e5dc"/><text x="216" y="467" font-size="30" fill="#bc5b32" text-anchor="middle">4</text><text x="75" y="245" font-size="29" fill="#20343e" text-anchor="start">残差 R</text><rect x="480" y="270" width="82" height="74" fill="#e7f0f4"/><text x="521" y="317" font-size="30" fill="#216983" text-anchor="middle">0.5</text><rect x="580" y="270" width="82" height="74" fill="#f5e5dc"/><text x="621" y="317" font-size="30" fill="#bc5b32" text-anchor="middle">1</text><rect x="480" y="370" width="82" height="74" fill="#e7f0f4"/><text x="521" y="417" font-size="30" fill="#216983" text-anchor="middle">1.5</text><rect x="580" y="370" width="82" height="74" fill="#f5e5dc"/><text x="621" y="417" font-size="30" fill="#bc5b32" text-anchor="middle">2</text><text x="480" y="190" font-size="29" fill="#20343e" text-anchor="start">按样本平均</text><text x="480" y="235" font-size="26" fill="#20343e" text-anchor="start">损失 L = 7.5</text><line x1="475" y1="263" x2="475" y2="452" stroke="#216983" stroke-width="2"/><line x1="475" y1="452" x2="567" y2="452" stroke="#216983" stroke-width="2"/><line x1="567" y1="452" x2="567" y2="263" stroke="#216983" stroke-width="2"/><line x1="521" y1="465" x2="521" y2="550" stroke="#216983" stroke-width="3"/><path d="M515.35,538.29 L521.00,550.00 L526.65,538.29" fill="none" stroke="#216983" stroke-width="3"/><circle cx="521" cy="600" r="42" fill="white" stroke="#216983" stroke-width="2"/><text x="521" y="610" font-size="30" fill="#216983" text-anchor="middle">2</text><text x="521" y="690" font-size="25" fill="#216983" text-anchor="middle">偏置 b1</text><line x1="575" y1="263" x2="575" y2="452" stroke="#bc5b32" stroke-width="2"/><line x1="575" y1="452" x2="667" y2="452" stroke="#bc5b32" stroke-width="2"/><line x1="667" y1="452" x2="667" y2="263" stroke="#bc5b32" stroke-width="2"/><line x1="621" y1="465" x2="621" y2="550" stroke="#bc5b32" stroke-width="3"/><path d="M615.35,538.29 L621.00,550.00 L626.65,538.29" fill="none" stroke="#bc5b32" stroke-width="3"/><circle cx="621" cy="600" r="42" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="621" y="610" font-size="30" fill="#bc5b32" text-anchor="middle">3</text><text x="621" y="690" font-size="25" fill="#bc5b32" text-anchor="middle">偏置 b2</text><rect x="900" y="270" width="82" height="74" fill="#e7f0f4"/><text x="941" y="317" font-size="30" fill="#216983" text-anchor="middle">0.25</text><rect x="1000" y="270" width="82" height="74" fill="#f5e5dc"/><text x="1041" y="317" font-size="30" fill="#bc5b32" text-anchor="middle">0.5</text><rect x="900" y="370" width="82" height="74" fill="#e7f0f4"/><text x="941" y="417" font-size="30" fill="#216983" text-anchor="middle">0.75</text><rect x="1000" y="370" width="82" height="74" fill="#f5e5dc"/><text x="1041" y="417" font-size="30" fill="#bc5b32" text-anchor="middle">1</text><text x="900" y="190" font-size="29" fill="#20343e" text-anchor="start">按元素平均</text><text x="900" y="235" font-size="26" fill="#20343e" text-anchor="start">损失 L = 3.75</text><line x1="895" y1="263" x2="895" y2="452" stroke="#216983" stroke-width="2"/><line x1="895" y1="452" x2="987" y2="452" stroke="#216983" stroke-width="2"/><line x1="987" y1="452" x2="987" y2="263" stroke="#216983" stroke-width="2"/><line x1="941" y1="465" x2="941" y2="550" stroke="#216983" stroke-width="3"/><path d="M935.35,538.29 L941.00,550.00 L946.65,538.29" fill="none" stroke="#216983" stroke-width="3"/><circle cx="941" cy="600" r="42" fill="white" stroke="#216983" stroke-width="2"/><text x="941" y="610" font-size="30" fill="#216983" text-anchor="middle">1</text><text x="941" y="690" font-size="25" fill="#216983" text-anchor="middle">偏置 b1</text><line x1="995" y1="263" x2="995" y2="452" stroke="#bc5b32" stroke-width="2"/><line x1="995" y1="452" x2="1087" y2="452" stroke="#bc5b32" stroke-width="2"/><line x1="1087" y1="452" x2="1087" y2="263" stroke="#bc5b32" stroke-width="2"/><line x1="1041" y1="465" x2="1041" y2="550" stroke="#bc5b32" stroke-width="3"/><path d="M1035.35,538.29 L1041.00,550.00 L1046.65,538.29" fill="none" stroke="#bc5b32" stroke-width="3"/><circle cx="1041" cy="600" r="42" fill="white" stroke="#bc5b32" stroke-width="2"/><text x="1041" y="610" font-size="30" fill="#bc5b32" text-anchor="middle">1.5</text><text x="1041" y="690" font-size="25" fill="#bc5b32" text-anchor="middle">偏置 b2</text><text x="300" y="320" font-size="25" fill="#627882" text-anchor="start">先在损失端缩放</text><text x="300" y="370" font-size="25" fill="#627882" text-anchor="start">再按列汇总</text><text x="60" y="790" font-size="29" fill="#20343e" text-anchor="start">损失的平均系数已包含在上游；偏置处的列求和不会额外再取一次平均。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>平均损失中的批量系数</title><desc>A把两个样本的计算路径接到同一个参数，回传贡献在共享参数处相加。B用2和6复算求和梯度8、均值梯度4。C把第二个微批扩大为3个有效样本，合并均值应为5，说明微批平均不能无条件再等权平均。 下方比较一个样本梯度 2 与三个样本梯度 6。每个柱对应真实样本贡献；四个样本求和为 20，整体均值为 5，不能把两个微批均值直接平均成 4。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">平均损失中的批量系数</text><g transform="translate(10,15) scale(.95)"><circle cx="186.00" cy="388.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="186.00" y="397.12" font-size="21" fill="#15364c" text-anchor="middle">样本1</text><circle cx="186.00" cy="707.20" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="186.00" y="716.32" font-size="21" fill="#15364c" text-anchor="middle">样本2</text><circle cx="732.00" cy="547.60" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="732.00" y="556.72" font-size="21" fill="#15364c" text-anchor="middle">参数</text><path d="M236.40,388.00 L673.20,532.40" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M236.40,707.20 L673.20,570.40" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="354.00" y="372.80" font-size="25" fill="#15364c" text-anchor="start">回传2</text><text x="354.00" y="752.80" font-size="25" fill="#15364c" text-anchor="start">回传6</text><text x="606.00" y="692.00" font-size="26" fill="#15364c" text-anchor="start">总和8</text><text x="160.80" y="220.80" font-size="25" fill="#15364c" text-anchor="start">共享参数处汇流</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="310.0000" y2="310.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="20" fill="#15364c" text-anchor="start">相同参数点的样本梯度</text><rect x="1060.21" y="367.00" width="55.82" height="38.00" fill="#2563eb" /><text x="1088.12" y="358.00" font-size="21" fill="#15364c" text-anchor="middle">2</text><text x="1088.12" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">g1</text><rect x="1156.46" y="291.00" width="55.82" height="114.00" fill="#cb702a" /><text x="1184.38" y="282.00" font-size="21" fill="#15364c" text-anchor="middle">6</text><text x="1184.38" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">g2</text><rect x="1252.71" y="253.00" width="55.82" height="152.00" fill="#497da4" /><text x="1280.62" y="244.00" font-size="21" fill="#15364c" text-anchor="middle">8</text><text x="1280.62" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">求和</text><rect x="1348.96" y="329.00" width="55.82" height="76.00" fill="#2563eb" /><text x="1376.88" y="320.00" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1376.88" y="437.00" font-size="20" fill="#15364c" text-anchor="middle">均值</text><text x="1032" y="411" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="1032" y="316" text-anchor="end" font-size="20" fill="#15364c">5</text><text x="1032" y="221" text-anchor="end" font-size="20" fill="#15364c">10</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="781.6667" y2="781.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="718.3333" y2="718.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="655.0000" y2="655.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="625.00" font-size="20" fill="#15364c" text-anchor="start">微批大小1、3</text><rect x="1080.42" y="718.33" width="111.65" height="126.67" fill="#2563eb" /><text x="1136.25" y="709.33" font-size="21" fill="#15364c" text-anchor="middle">4</text><text x="1136.25" y="877.00" font-size="20" fill="#15364c" text-anchor="middle">微批等权</text><rect x="1272.92" y="686.67" width="111.65" height="158.33" fill="#cb702a" /><text x="1328.75" y="677.67" font-size="21" fill="#15364c" text-anchor="middle">5</text><text x="1328.75" y="877.00" font-size="20" fill="#15364c" text-anchor="middle">按有效计数加权</text><text x="1032" y="851" text-anchor="end" font-size="20" fill="#15364c">0</text><text x="1032" y="787.667" text-anchor="end" font-size="20" fill="#15364c">2</text><text x="1032" y="724.333" text-anchor="end" font-size="20" fill="#15364c">4</text><text x="1032" y="661" text-anchor="end" font-size="20" fill="#15364c">6</text><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#95adba" stroke-width="2" /></g><line x1="40" y1="1040" x2="1460" y2="1040" stroke="#dbe4ed" stroke-width="2" /><text x="45" y="1080" font-size="26" fill="#15364c">逐样本梯度贡献</text><g transform="translate(55,1135)"><text x="0" y="0" font-size="20" fill="#15364c">微批 1：一个样本</text><line x1="15" y1="135" x2="405" y2="135" stroke="#dbe4ed" stroke-width="2" /><rect x="30.0" y="110.0" width="260.0" height="25.0" fill="#2563eb" rx="2" /><text x="30.0" y="102.0" font-size="20" fill="#15364c">2</text><text x="30.0" y="159" font-size="20" fill="#15364c">g1</text></g><g transform="translate(545,1135)"><text x="0" y="0" font-size="20" fill="#15364c">微批 2：三个样本</text><line x1="15" y1="135" x2="405" y2="135" stroke="#dbe4ed" stroke-width="2" /><rect x="30.0" y="60.0" width="86.66666666666667" height="75.0" fill="#2563eb" rx="2" /><text x="30.0" y="52.0" font-size="20" fill="#15364c">6</text><text x="30.0" y="159" font-size="20" fill="#15364c">g2</text><rect x="153.33333333333331" y="60.0" width="86.66666666666667" height="75.0" fill="#df7326" rx="2" /><text x="153.33333333333331" y="52.0" font-size="20" fill="#15364c">6</text><text x="153.33333333333331" y="159" font-size="20" fill="#15364c">g3</text><rect x="276.66666666666663" y="60.0" width="86.66666666666667" height="75.0" fill="#2563eb" rx="2" /><text x="276.66666666666663" y="52.0" font-size="20" fill="#15364c">6</text><text x="276.66666666666663" y="159" font-size="20" fill="#15364c">g4</text></g><g transform="translate(1035,1135)"><text x="0" y="0" font-size="20" fill="#15364c">合并全部样本，再取均值</text><line x1="15" y1="135" x2="405" y2="135" stroke="#dbe4ed" stroke-width="2" /><rect x="30.0" y="110.0" width="65.0" height="25.0" fill="#2563eb" rx="2" /><text x="30.0" y="102.0" font-size="20" fill="#15364c">2</text><text x="30.0" y="159" font-size="20" fill="#15364c">g1</text><rect x="122.5" y="60.0" width="65.0" height="75.0" fill="#df7326" rx="2" /><text x="122.5" y="52.0" font-size="20" fill="#15364c">6</text><text x="122.5" y="159" font-size="20" fill="#15364c">g2</text><rect x="215.0" y="60.0" width="65.0" height="75.0" fill="#2563eb" rx="2" /><text x="215.0" y="52.0" font-size="20" fill="#15364c">6</text><text x="215.0" y="159" font-size="20" fill="#15364c">g3</text><rect x="307.5" y="60.0" width="65.0" height="75.0" fill="#df7326" rx="2" /><text x="307.5" y="52.0" font-size="20" fill="#15364c">6</text><text x="307.5" y="159" font-size="20" fill="#15364c">g4</text></g></g></svg>

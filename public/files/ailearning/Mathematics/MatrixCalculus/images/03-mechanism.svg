<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title id="extra-title">Softmax 的公共平移方向是零曲率方向</title><desc id="extra-desc">图从 logits 原点 z=(0,0) 出发，分别沿公共方向 (1,1) 和对比方向 (1,-1) 移动。左图第一类概率始终为 \frac{1}{2}；右图则为 p_1(t)=\frac{1}{1+e^{-2t}}，原点切线斜率为 \frac{1}{2}。两条曲线直接显示 Softmax 只看相对分数，同加常数不会改变任何类别概率。

在原点，Softmax 的 Jacobian 为 J=\left[\begin{smallmatrix}\frac{1}{4}&amp;-\frac{1}{4}\\-\frac{1}{4}&amp;\frac{1}{4}\end{smallmatrix}\right]；它把公共方向映到零，把对比方向缩放为原来的 \frac{1}{2}。同一个矩阵也是硬标签或固定软标签交叉熵关于 **logits** 的 Hessian，因此公共方向具有零曲率。右图概率变化率等于 J(1,-1)^T 的第一分量，不能把概率曲线自身当成交叉熵曲线；网络参数化还可能给完整参数 Hessian 引入其他二阶项。

Softmax 的平移不变性与数值稳定性见 [《Dive into Deep Learning》数值稳定与条件数](https://d2l.smola.org/chapter_mdl-optimization/mdl-numerical-stability-conditioning.html)。</desc><rect width="1200" height="720" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">Softmax 的公共平移方向是零曲率方向</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">同加常数：概率不变</text><text x="690" y="105" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">改变相对分数：概率改变</text><line x1="85" y1="525.0" x2="515" y2="525.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="533.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="350.0" x2="515" y2="350.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="358.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="85" y1="175.0" x2="515" y2="175.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="183.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="85" y1="175" x2="85" y2="525" stroke="#627689" stroke-width="2" /><line x1="85" y1="525" x2="515" y2="525" stroke="#627689" stroke-width="2" /><line x1="85.0" y1="525.0" x2="85.0" y2="531.0" stroke="#627689" stroke-width="2" /><text x="85.0" y="557.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">-2</text><line x1="300.0" y1="525.0" x2="300.0" y2="531.0" stroke="#627689" stroke-width="2" /><text x="300.0" y="557.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="515.0" y1="525.0" x2="515.0" y2="5
<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="618" viewBox="0 0 1350 618" role="img" aria-labelledby="title desc"><title id="title">共享参数处梯度必须相加</title><desc id="desc">两条样本的前向计算复用同一个 w，反向贡献必须先相加，再按总损失的归约规则缩放。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="618" fill="white" stroke="none" stroke-width="1.55"/><circle cx="200" cy="299" r="38" stroke="#202a37" stroke-width="1.7" fill="url(#wash-ink)"/><text x="200" y="309.2" fill="#202a37" font-size="30" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">w</text><line x1="245.703" y1="288.0348" x2="676.2694" y2="184.7319" stroke="#657682" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-gray)"/><polygon points="598,210.5 811,210.5 844,137.5 631,137.5" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.7" stroke-linejoin="round"/><text x="721" y="183.86" fill="#196f77" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">样本 1 的损失</text><path d="M 587 210 Q 448 258 246 282" stroke="#196f77" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-teal)"/><line x1="245.6629" y1="310.1309" x2="676.3086" y2="415.1059" stroke="#657682" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-gray)"/><polygon points="598,462.5 811,462.5 844,389.5 631,389.5" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.7" stroke-linejoin="round"/><text x="721" y="435.86" fill="#655184" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">样本 2 的损失</text><path d="M 587 390 Q 448 342 246 316" stroke="#655184" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-violet)"/><line x1="872" y1="300" x2="993" y2="300" stroke="#202a37" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><polygon points="1029.5,337.5 1215.5,337.5 1248.5,262.5 1062.5,262.5" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/><text x="1139" y="310.2" fill="#a84b3b" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">贡献相加</text><text x="675" y="560" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">均值损失还须按样本数缩放</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>广播的反向传播沿复制轴求和</title><desc>一个可训练标量b被广播到三个样本，分别参与L1、L2、L3。若三条分支对b的局部贡献为1、2、4，总损失为三者之和时，b的梯度是7；若目标另取平均，才再除以3。复制前向值不会创建三个独立参数。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">广播的反向传播沿复制轴求和</text><rect x="50" y="350" width="270" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="65" y="387" font-size="25" fill="#16344c" text-anchor="start">共享标量 b</text><text x="65" y="425" font-size="21" fill="#16344c" text-anchor="start">只有一个参数</text><rect x="455" y="160" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="470" y="197" font-size="25" fill="#16344c" text-anchor="start">L1</text><text x="470" y="235" font-size="21" fill="#16344c" text-anchor="start">贡献1</text><rect x="455" y="350" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="470" y="387" font-size="25" fill="#16344c" text-anchor="start">L2</text><text x="470" y="425" font-size="21" fill="#16344c" text-anchor="start">贡献2</text><rect x="455" y="540" width="260" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="470" y="577" font-size="25" fill="#16344c" text-anchor="start">L3</text><text x="470" y="615" font-size="21" fill="#16344c" text-anchor="start">贡献4</text><rect x="870" y="350" width="250" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="885" y="387" font-size="25" fill="#16344c" text-anchor="start">总梯度7</text><text x="885" y="425" font-size="21" fill="#16344c" text-anchor="start">三路贡献相加</text><path d="M335,395 L440,205" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M730,205 L860,395" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,395 L440,395" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M730,395 L860,395" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,395 L440,585" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M730,585 L860,395" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="730" font-size="22" fill="#16344c" text-anchor="start">这里画的是求和目标；若定义为三样本均值，最终再除以3。</text></g></svg>

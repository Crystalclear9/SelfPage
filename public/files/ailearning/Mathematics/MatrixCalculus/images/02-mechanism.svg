<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-title fig-desc" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title id="fig-title">广播复用同一参数；回传沿复用轴求和</title><desc id="fig-desc">广播复用同一参数；回传沿复用轴求和</desc><rect width="1200" height="580" fill="white" /><defs><marker id="m-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="m-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">广播复用同一参数；回传沿复用轴求和</text><text x="35" y="115" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">前向广播</text><rect x="230" y="155" width="170" height="70" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="315.0" y="200.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">b = 2</text><path d="M430,190 L635,190" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#m-b)" /><rect x="680" y="155" width="117" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="738.5" y="197.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="805" y="155" width="117" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="863.5" y="197.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="930" y="155" width="117" height="65" rx="7" fill="#eaf2fa" stroke="#aac2d9" stroke-width="1.5" /><text x="988.5" y="197.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><text x="35" y="350" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">反向归约</text><rect x="230" y="390" width="170" height="70" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="315.0" y="435.0" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">b 的梯度 = 7</text><path d="M650,425 L430,425" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#m-o)" /><rect x="680" y="390" width="117" height="65" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="738.5" y="432.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">1</text><rect x="805" y="390" width="117" height="65" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="863.5" y="432.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">2</text><rect x="930" y="390" width="117" height="65" rx="7" fill="#fff0e3" stroke="#cf7432" stroke-width="1.5" /><text x="988.5" y="432.5" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">4</text><text x="680" y="520" font-size="29" fill="#cf7432" text-anchor="start" font-weight="400">1 + 2 + 4 = 7</text></g></svg>

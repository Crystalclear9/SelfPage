<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img"><title>中心化投影消除公共方向</title><desc>二维中心化把(1,3)投影为(-1,1)，扰动(1,0)投影为(0.5,-0.5)，平移方向(1,1)归零。</desc><rect width="1280" height="770" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start" font-weight="600">中心化：沿公共方向移动，投影落在零和直线上</text><text x="60" y="112" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">Cx = x − mean(x) · (1, 1)；正交投影</text><line x1="120" y1="225" x2="120" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="225" x2="480" y2="225" stroke="#dce4e5" stroke-width="2"/><line x1="180" y1="225" x2="180" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="285" x2="480" y2="285" stroke="#dce4e5" stroke-width="2"/><line x1="240" y1="225" x2="240" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="345" x2="480" y2="345" stroke="#dce4e5" stroke-width="2"/><line x1="300" y1="225" x2="300" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="405" x2="480" y2="405" stroke="#dce4e5" stroke-width="2"/><line x1="360" y1="225" x2="360" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="465" x2="480" y2="465" stroke="#dce4e5" stroke-width="2"/><line x1="420" y1="225" x2="420" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="525" x2="480" y2="525" stroke="#dce4e5" stroke-width="2"/><line x1="480" y1="225" x2="480" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="585" x2="480" y2="585" stroke="#dce4e5" stroke-width="2"/><line x1="120" y1="405" x2="480" y2="405" stroke="#19333c" stroke-width="2"/><line x1="300" y1="225" x2="300" y2="585" stroke="#19333c" stroke-width="2"/><path d="M120.00,225.00 L480.00,585.00" stroke="#256b82" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="405" x2="360" y2="225" stroke="#c0643c" stroke-width="4"/><path d="M362.13,236.81 L360.00,225.00 L351.21,233.17" stroke="#c0643c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="405" x2="240" y2="345" stroke="#256b82" stroke-width="4"/><path d="M251.51,348.38 L240.00,345.00 L243.38,356.51" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="360" y1="225" x2="240" y2="345" stroke="#78878b" stroke-width="3" stroke-dasharray="8 6"/><text x="385" y="220" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">x = (1, 3)</text><text x="90" y="320" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">Cx = (−1, 1)</text><text x="90" y="635" font-size="28" fill="#19333c" text-anchor="start" font-weight="400">减去均值向量 (2, 2)</text><line x1="780" y1="255" x2="780" y2="555" stroke="#dce4e5" stroke-width="2"/><line x1="780" y1="255" x2="1080" y2="255" stroke="#dce4e5" stroke-width="2"/><line x1="930" y1="255" x2="930" y2="555" stroke="#dce4e5" stroke-width="2"/><line x1="780" y1="405" x2="1080" y2="405" stroke="#dce4e5" stroke-width="2"/><line x1="1080" y1="255" x2="1080" y2="555" stroke="#dce4e5" stroke-width="2"/><line x1="780" y1="555" x2="1080" y2="555" stroke="#dce4e5" stroke-width="2"/><line x1="780" y1="405" x2="1080" y2="405" stroke="#19333c" stroke-width="2"/><line x1="930" y1="255" x2="930" y2="555" stroke="#19333c" stroke-width="2"/><path d="M780.00,255.00 L1080.00,555.00" stroke="#256b82" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="930" y1="405" x2="1080" y2="405" stroke="#c0643c" stroke-width="4"/><path d="M1069.47,410.75 L1080.00,405.00 L1069.47,399.25" stroke="#c0643c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="930" y1="405" x2="1005.0" y2="480.0" stroke="#256b82" stroke-width="4"/><path d="M993.49,476.62 L1005.00,480.00 L1001.62,468.49" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="1080" y1="405" x2="1005.0" y2="480.0" stroke="#78878b" stroke-width="3" stroke-dasharray="8 6"/><text x="735" y="220" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">扰动 δ = (1, 0)</text><text x="835" y="605" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">Cδ = (0.5, −0.5)</text><line x1="60" y1="675" x2="1220" y2="675" stroke="#dce4e5" stroke-width="2"/><text x="60" y="721" font-size="27" fill="#19333c" text-anchor="start" font-weight="400">蓝线：两个坐标之和为零。右图只改第一个输入，两个输出都会改变。</text><text x="60" y="760" font-size="25" fill="#78878b" text-anchor="start" font-weight="400">这里只减均值；完整归一化还需要除以标准差并处理稳定项。</text></g></svg>

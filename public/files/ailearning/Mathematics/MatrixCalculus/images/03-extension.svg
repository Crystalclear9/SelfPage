<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>中心化让不同样本的梯度发生耦合</title><desc>两元素中心化映射为y=x−mean(x)，雅可比是[[0.5,−0.5],[−0.5,0.5]]。改变第一个输入不仅改变第一个输出，也通过均值影响第二个输出；所有输入同加常数则全部抵消。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">中心化让不同样本的梯度发生耦合</text><text x="100" y="160" font-size="25" fill="#193e54" text-anchor="start">雅可比：行是输出，列是输入</text><rect x="340" y="230" width="230" height="150" rx="8" fill="#d6ede3" stroke="#9cb8c8" /><text x="455" y="322" font-size="40" fill="#193e54" text-anchor="middle">0.5</text><rect x="590" y="230" width="230" height="150" rx="8" fill="#f6ddc9" stroke="#9cb8c8" /><text x="705" y="322" font-size="40" fill="#193e54" text-anchor="middle">-0.5</text><rect x="340" y="410" width="230" height="150" rx="8" fill="#f6ddc9" stroke="#9cb8c8" /><text x="455" y="502" font-size="40" fill="#193e54" text-anchor="middle">-0.5</text><rect x="590" y="410" width="230" height="150" rx="8" fill="#d6ede3" stroke="#9cb8c8" /><text x="705" y="502" font-size="40" fill="#193e54" text-anchor="middle">0.5</text><text x="180" y="710" font-size="21" fill="#193e54" text-anchor="start">对角项：本样本直接贡献；非对角项：通过共享均值产生的反向耦合。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>检查器需要两种分辨力：合适的步长，能揭穿错误的方向</title><rect width="1280" height="900" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">检查器需要两种分辨力：合适的步长，能揭穿错误的方向</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">左：三次函数的实际 binary64 差分；右：另一个二维二次函数的方向盲点</text><line x1="100.0" y1="635.0" x2="550.0" y2="635.0" stroke="#dee7eb" stroke-width="2"/><text x="88.0" y="643.0" font-size="24" fill="#627882" text-anchor="end">-16</text><line x1="100.0" y1="545.5882352941177" x2="550.0" y2="545.5882352941177" stroke="#dee7eb" stroke-width="2"/><text x="88.0" y="553.5882352941177" font-size="24" fill="#627882" text-anchor="end">-12</text><line x1="100.0" y1="456.1764705882353" x2="550.0" y2="456.1764705882353" stroke="#dee7eb" stroke-width="2"/><text x="88.0" y="464.1764705882353" font-size="24" fill="#627882" text-anchor="end">-8</text><line x1="100.0" y1="366.7647058823529" x2="550.0" y2="366.7647058823529" stroke="#dee7eb" stroke-width="2"/><text x="88.0" y="374.7647058823529" font-size="24" fill="#627882" text-anchor="end">-4</text><line x1="100.0" y1="277.3529411764706" x2="550.0" y2="277.3529411764706" stroke="#dee7eb" stroke-width="2"/><text x="88.0" y="285.3529411764706" font-size="24" fill="#627882" text-anchor="end">0</text><line x1="100.0" y1="635.0" x2="100.0" y2="641.0" stroke="#627882" stroke-width="2"/><text x="100.0" y="672.0" font-size="24" fill="#627882" text-anchor="middle">-16</text><line x1="212.5" y1="635.0" x2="212.5" y2="641.0" stroke="#627882" stroke-width="2"/><text x="212.5" y="672.0" font-size="24" fill="#627882" text-anchor="middle">-12</text><line x1="325.0" y1="635.0" x2="325.0" y2="641.0" stroke="#627882" stroke-width="2"/><text x="325.0" y="672.0" font-size="24" fill="#627882" text-anchor="middle">-8</text><line x1="437.5" y1="635.0" x2="437.5" y2="641.0"
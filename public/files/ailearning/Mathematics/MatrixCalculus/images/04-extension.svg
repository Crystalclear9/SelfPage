<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>完整 Hessian 与 Gauss–Newton 可能不同号</title><desc>取残差r(w)=w²−1、损失为残差平方的一半。完整Hessian是6w²−2，在零点附近为负；Gauss–Newton近似为4w²，始终非负。差异来自被近似舍去的“残差乘残差二阶导数”项。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="120" y1="263.571" x2="1060" y2="263.571" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="377.857" x2="1060" y2="377.857" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="492.143" x2="1060" y2="492.143" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="606.429" x2="1060" y2="606.429" stroke="#e1eaf0" stroke-width="2.5" /><line x1="1060.000" y1="235" x2="1060.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="825.000" y1="235" x2="825.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="590.000" y1="235" x2="590.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="355.000" y1="235" x2="355.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120.000" y1="235" x2="120.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">完整 Hessian 与 Gauss–Newton 可能不同号</text><line x1="120" y1="635" x2="1060" y2="635" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="235" x2="120" y2="635" stroke="#2865a0" stroke-width="3" /><text x="1060" y="205" font-size="24" fill="#456679" text-anchor="end">横轴：w</text><text x="120" y="223" font-size="24" fill="#193e54" text-anchor="start">二阶曲率</text><line x1="90" y1="130" x2="140" y2="130" stroke="#1977b4" stroke-width="2.5" /><text x="155" y="138" font-size="24" fill="#1977b4" text-anchor="start">完整Hessian
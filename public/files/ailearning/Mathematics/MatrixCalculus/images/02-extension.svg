<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>重复索引的反向操作必须累加而非覆盖</title><desc>原始向量的三个位置被索引为[0,1,0]，输出敏感性为[1,2,3]。位置0被读取两次，因此回传为1+3=4，位置1为2，位置2未被读取而为0；这正是scatter-add的语义。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">重复索引的反向操作必须累加而非覆盖</text><rect x="65" y="160" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="80" y="197" font-size="25" fill="#193e54" text-anchor="start">源位置 0</text><text x="80" y="235" font-size="21" fill="#193e54" text-anchor="start">共享原数组</text><rect x="800" y="160" width="290" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="815" y="197" font-size="25" fill="#193e54" text-anchor="start">输出位置 0</text><text x="815" y="235" font-size="21" fill="#193e54" text-anchor="start">回传贡献 1</text><rect x="65" y="340" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="80" y="377" font-size="25" fill="#193e54" text-anchor="start">源位置 1</text><text x="80" y="415" font-size="21" fill="#193e54" text-anchor="start">共享原数组</text><rect x="800" y="340" width="290" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="815" y="377" font-size="25" fill="#193e54" text-anchor="start">输出位置 1</text><text x="815" y="415" font-size="21" fill="#193e54" text-anchor="start">回传贡献 2</text><rect x="65" y="520" width="230" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="80" y="557" font-size="25" fill="#193e54" text-anchor="start">源位置 2</text><text x="80" y="595" font-size="21" fill="#193e54" text-anchor="start">共享原数组</text><rect x="800" y="520" width="290" height="96" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="815" y="557" font-size="25" fill="#193e54" text-anchor="start">输出位置 2</text><text x="815" y="595" font-size="21" fill="#193e54" text-anchor="start">回传贡献 3</text><path d="M785,205 L310,205" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M785,385 L310,385" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M785,565 L310,205" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="390" y="360" font-size="26" fill="#193e54" text-anchor="start">索引 [0,1,0]</text><text x="370" y="415" font-size="26" fill="#193e54" text-anchor="start">输入梯度 [4,2,0]</text><text x="150" y="750" font-size="22" fill="#193e54" text-anchor="start">反向箭头在源位置0汇流：1+3=4；不是后一次覆盖前一次。</text></g></svg>

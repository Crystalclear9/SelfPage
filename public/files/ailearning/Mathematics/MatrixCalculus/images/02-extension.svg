<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>重复读取同一位置，反向必须把贡献累加</title><rect width="1280" height="840" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">重复读取同一位置，反向必须把贡献累加</text><text x="70" y="145" font-size="29" fill="#256b82" text-anchor="start">前向：x → gather [0, 0, 2]</text><text x="685" y="145" font-size="29" fill="#c0643c" text-anchor="start">反向：g → scatter-add</text><line x1="160" y1="290" x2="485" y2="290" stroke="#256b82" stroke-width="3"/><path d="M485,290 L470.0,283.0 L470.0,297.0Z" fill="#256b82"/><line x1="160" y1="290" x2="485" y2="440" stroke="#256b82" stroke-width="3"/><path d="M485,440 L474.31401647472546,427.35841164657063 L468.44720199026096,440.069843029577Z" fill="#256b82"/><line x1="160" y1="590" x2="485" y2="590" stroke="#256b82" stroke-width="3"/><path d="M485,590 L470.0,583.0 L470.0,597.0Z" fill="#256b82"/><circle cx="145" cy="290" r="8" fill="#256b82"/><circle cx="500" cy="290" r="8" fill="#256b82"/><text x="123" y="299" font-size="31" fill="#19333c" text-anchor="end">10</text><text x="523" y="299" font-size="31" fill="#19333c" text-anchor="start">10</text><text x="80" y="262" font-size="24" fill="#71858b" text-anchor="start">x[0]</text><text x="480" y="262" font-size="24" fill="#71858b" text-anchor="start">y[0]</text><circle cx="145" cy="440" r="8" fill="#256b82"/><circle cx="500" cy="440" r="8" fill="#256b82"/><text x="123" y="449" font-size="31" fill="#19333c" text-anchor="end">20</text><text x="523" y="449" font-size="31" fill="#19333c" text-anchor="start">10</text><text x="80" y="412" font-size="24" fill="#71858b" text-anchor="start">x[1]</text><text x="480" y="412" font-size="24" fill="#71858b" text-anchor="start">y[1]</text><circle cx="145" cy="590" r="8" fill="#256b82"/><circle cx="500" cy="590" r="8" fill="#256b82"/><text x="123" y="599" font-size="31" fill="#19333c" text-anchor="end">30</text><text x="523" y="599" font-size="31" fill="#19333c" text-anchor="start">30</text><text x="80" y="562" font-size="24" fill="#71858b" text-anchor="start">x[2]</text><text x="480" y="562" font-size="24" fill="#71858b" text-anchor="start">y[2]</text><line x1="1105" y1="290" x2="780" y2="290" stroke="#c0643c" stroke-width="3"/><path d="M780,290 L795.0,297.0 L795.0,283.0Z" fill="#c0643c"/><line x1="1105" y1="440" x2="780" y2="290" stroke="#c0643c" stroke-width="3"/><path d="M780,290 L790.6859835252745,302.64158835342937 L796.5527980097389,289.930156970423Z" fill="#c0643c"/><line x1="1105" y1="590" x2="780" y2="590" stroke="#c0643c" stroke-width="3"/><path d="M780,590 L795.0,597.0 L795.0,583.0Z" fill="#c0643c"/><circle cx="765" cy="290" r="8" fill="#c0643c"/><circle cx="1120" cy="290" r="8" fill="#c0643c"/><text x="743" y="299" font-size="31" fill="#19333c" text-anchor="end">5</text><text x="1143" y="299" font-size="31" fill="#19333c" text-anchor="start">1</text><text x="700" y="262" font-size="24" fill="#71858b" text-anchor="start">gx[0]</text><text x="1100" y="262" font-size="24" fill="#71858b" text-anchor="start">gy[0]</text><circle cx="765" cy="440" r="8" fill="#c0643c"/><circle cx="1120" cy="440" r="8" fill="#c0643c"/><text x="743" y="449" font-size="31" fill="#19333c" text-anchor="end">0</text><text x="1143" y="449" font-size="31" fill="#19333c" text-anchor="start">4</text><text x="700" y="412" font-size="24" fill="#71858b" text-anchor="start">gx[1]</text><text x="1100" y="412" font-size="24" fill="#71858b" text-anchor="start">gy[1]</text><circle cx="765" cy="590" r="8" fill="#c0643c"/><circle cx="1120" cy="590" r="8" fill="#c0643c"/><text x="743" y="599" font-size="31" fill="#19333c" text-anchor="end">−2</text><text x="1143" y="599" font-size="31" fill="#19333c" text-anchor="start">−2</text><text x="700" y="562" font-size="24" fill="#71858b" text-anchor="start">gx[2]</text><text x="1100" y="562" font-size="24" fill="#71858b" text-anchor="start">gy[2]</text><text x="80" y="710" font-size="28" fill="#256b82" text-anchor="start">输入位置 1 没有被读取。</text><text x="700" y="710" font-size="29" fill="#c0643c" text-anchor="start">位置 0：1 + 4 = 5</text><text x="80" y="800" font-size="28" fill="#19333c" text-anchor="start">输入数值相同不代表参数共享；索引指向同一个位置才需要合并。</text></g></svg>

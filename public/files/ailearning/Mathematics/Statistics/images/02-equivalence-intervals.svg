<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="711.9617" viewBox="36.2667 73.2444 1188.9778 661.3333" role="img"><title>拒绝零差异与建立等效，是两套不同的区间门槛</title><rect width="1280" height="800" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="120" font-size="28" fill="#50636e" text-anchor="start">正态、已知标准误；等效界 ±1；两种检验都用 α = 0.05</text><text x="60" y="172" font-size="27" fill="#19333c" text-anchor="start">灰细线：95% 区间     蓝粗线：90% 区间</text><rect x="443.695652173913" y="210" width="282.608695652174" height="410" fill="#edf4f6" /><line x1="443.695652173913" y1="210" x2="443.695652173913" y2="620" stroke="#71858b" stroke-width="2" /><line x1="585.0" y1="210" x2="585.0" y2="620" stroke="#dbe5e8" stroke-width="2" /><line x1="726.304347826087" y1="210" x2="726.304347826087" y2="620" stroke="#71858b" stroke-width="2" /><text x="1035" y="205" font-size="25" fill="#19333c" text-anchor="start">差异</text><text x="1150" y="205" font-size="25" fill="#19333c" text-anchor="start">等效</text><text x="60" y="279" font-size="26" fill="#19333c" text-anchor="start">A 精度不足</text><line x1="308.04856740194884" y1="258" x2="861.9514325980512" y2="258" stroke="#71858b" stroke-width="3" /><line x1="308.04856740194884" y1="250" x2="308.04856740194884" y2="266" stroke="#71858b" stroke-width="2" /><line x1="861.9514325980512" y1="250" x2="861.9514325980512" y2="266" stroke="#71858b" stroke-width="2" /><circle cx="585.0" cy="258" r="4" fill="#71858b" /><line x1="352.5750309742485" y1="282" x2="817.4249690257515" y2="282" stroke="#256b82" stroke-width="7" /><line x1="352.5750309742485" y1="274" x2="352.5750309742485" y2="290" stroke="#256b82" stroke-width="2" /><line x1="817.4249690257515" y1="274" x2="817.4249690257515" y2="290" stroke="#256b82" stroke-width="2" /><circle cx="585.0" cy="282" r="4" fill="#256b82" /><text x="1062" y="279" font-size="29" fill="#19333c" text-anchor="middle">否</text><text x="1176" y="279" font-size="29" fill="#19333c" text-anchor="middle">否</text>
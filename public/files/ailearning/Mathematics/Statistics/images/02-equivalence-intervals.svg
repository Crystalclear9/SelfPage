<text x="44" y="61" font-size="39" fill="#172a40" font-weight="700" text-anchor="start">显著差异与等效可以同时成立</text>
<text x="46" y="106" font-size="26" fill="#465d72" font-weight="400" text-anchor="start">同一个效应估计，用两条区间回答两个问题</text>
<text x="49" y="167" font-size="27" fill="#465d72" font-weight="650" text-anchor="start">95%：排除 0 才建立差异</text>
<text x="500" y="167" font-size="26" fill="#136d84" font-weight="650" text-anchor="start">90%：全部落入 ±1 才建立等效</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="890" viewBox="0 0 960 890" role="img" aria-labelledby="title desc">
<title id="title">显著差异与等效可以同时成立</title><desc id="desc">灰色 95% 区间用于检出非零差异，蓝色 90% 区间用于检验落在 -1 到 1 的等效范围。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536f86"/></marker></defs>

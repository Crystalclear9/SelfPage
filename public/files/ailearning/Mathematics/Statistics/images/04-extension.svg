<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>置换应重排标签而不是破坏观测值</title><desc>四名受试者的固定结果为1、2、4、5，从中选择两人作为处理组共有6种分配。每一种分配都保留原始结果，仅重新计算两组均值差；图枚举的差值为−3、−1、0、0、1、3。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">置换应重排标签而不是破坏观测值</text><text x="85" y="190" font-size="22" fill="#193e54" text-anchor="start">组均值差：左为处理组编号，右为对照组编号</text><line x1="100" y1="460.0" x2="1100" y2="460.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="460.0" width="108.3" height="150.0" fill="#1977b4" /><text x="189.16666666666666" y="640.0" font-size="24" fill="#193e54" text-anchor="middle">-3</text><text x="189.16666666666666" y="680" font-size="19" fill="#193e54" text-anchor="middle">12|34</text><rect x="291.7" y="460.0" width="108.3" height="50.0" fill="#d26724" /><text x="345.8333333333333" y="540.0" font-size="24" fill="#193e54" text-anchor="middle">-1</text><text x="345.8333333333333" y="680" font-size="19" fill="#193e54" text-anchor="middle">13|24</text><rect x="448.3" y="460.0" width="108.3" height="0.0" fill="#148671" /><text x="502.5" y="444.0" font-size="24" fill="#193e54" text-anchor="middle">0</text><text x="502.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">14|23</text><rect x="605.0" y="460.0" width="108.3" height="0.0" fill="#1977b4" /><text x="659.1666666666666" y="444.0" font-size="24" fill="#193e54" text-anchor="middle">0</text><text x="659.1666666666666" y="680" font-size="19" fill="#193e54" text-anchor="middle">23|14</text><rect x="761.7" y="410.0" width="108.3" height="50.0" fill="#d26724" /><text x="815.8333333333333" y="394.0" font-size="24" fill="#193e54" text-anchor="middle">1</text><text x="815.8333333333333" y="680" font-size="19" fill="#193e54" text-anchor="middle">24|13</text><rect x="918.3" y="310.0" width="108.3" height="150.0" fill="#148671" /><text x="972.5" y="294.0" font-size="24" fill="#193e54" text-anchor="middle">3</text><text x="972.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">34|12</text><text x="90" y="145" font-size="23" fill="#193e54" text-anchor="start">编号1、2、3、4的结果依次为1、2、4、5；从4人中选2人为处理组。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>置信区间的重复抽样含义</title><desc>A固定真实参数，只让反复抽样的区间变化，其中一条故意不覆盖，以区分程序覆盖率与单个已观察区间的解释。B明确这10条只是示意，不能从9条覆盖反推名义95%的精确实测结果。C在10次零成功时对照退化Wald与非退化Wilson区间。 下方在已知 σ=1 的正态均值模型中，对比样本均值恰为零时的 95% 区间。n 增加四倍才使区间宽度减半；图中三次样本均值相同只是为了隔离宽度机制。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">置信区间的重复抽样含义</text><g transform="translate(10,15) scale(.95)"><line x1="538.80" y1="236.00" x2="538.80" y2="844.00" stroke="#cb702a" stroke-width="2" /><text x="538.80" y="213.20" font-size="22" fill="#15364c" text-anchor="middle">固定参数θ</text><line x1="312.00" y1="281.60" x2="648.00" y2="281.60" stroke="#2563eb" stroke-width="2" /><text x="102.00" y="290.72" font-size="20" fill="#15364c" text-anchor="start">样本1</text><line x1="438.00" y1="338.60" x2="732.00" y2="338.60" stroke="#2563eb" stroke-width="2" /><text x="102.00" y="347.72" font-size="20" fill="#15364c" text-anchor="start">样本2</text><line x1="228.00" y1="395.60" x2="606.00" y2="395.60" stroke="#2563eb" stroke-width="2" /><text x="102.00" y="404.72" font-size="20" fill="#15364c" text-anchor="start">样本3</text><line x1="589.20" y1="452.60" x2="816.00" y2="452.60" stroke="#cb702a" stroke-width="2" /><text x="102.00" y="461.72" font-size="20" fill="#15364c" text-anchor="start">样本4</text><line x1="354.00" y1="509.60" x2="631.20" y2="509.60" stroke="#2563eb" stroke-width="2" /><text x="102.00" y="518.72" font-size="2
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>极端比例下 Wald 与 Wilson 区间不同</title><desc>在10次试验中观察到0次成功，普通Wald区间把估计标准误差也算成零，得到退化的[0,0]。95% Wilson得分区间却约为[0,0.278]，体现有限观测仍允许非零的总体成功概率。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">极端比例下 Wald 与 Wilson 区间不同</text><text x="70" y="160" font-size="22" fill="#16344c" text-anchor="start">10次试验中0次成功；名义95%</text><line x1="200" y1="590" x2="1020" y2="590" stroke="#277eac" stroke-width="2.5" /><line x1="200.0" y1="580" x2="200.0" y2="600" stroke="#277eac" stroke-width="2.5" /><text x="200.0" y="640" font-size="20" fill="#16344c" text-anchor="middle">0</text><line x1="473.33333333333337" y1="580" x2="473.33333333333337" y2="600" stroke="#277eac" stroke-width="2.5" /><text x="473.33333333333337" y="640" font-size="20" fill="#16344c" text-anchor="middle">0.1</text><line x1="746.6666666666667" y1="580" x2="746.6666666666667" y2="600" stroke="#277eac" stroke-width="2.5" /><text x="746.6666666666667" y="640" font-size="20" fill="#16344c" text-anchor="middle">0.2</text><line x1="1020.0" y1="580" x2="1020.0" y2="600" stroke="#277eac" stroke-width="2.5" /><text x="1020.0" y="640" font-size="20" fill="#16344c" text-anchor="middle">0.3</text><text x="70" y="300" font-size="22" fill="#16344c" text-anchor="start">Wald</text><circle cx="200" cy="300" r="32" fill="#daedf8" stroke="#5597b5" /><text x="200" y="308" font-size="22" fill="#16344c" text-anchor="middle">0</text><text x="70" y="460" font-size="22" fill="#16344c" text-anchor="start">Wilson</text><line x1="200" y1="460" x2="958.582" y2="460" stroke="#277eac" stroke-width="2.5" /><circle cx="200" cy="460" r="32" fill="#daedf8" stroke="#5597b5" /><text x="200" y="468" font-size="22" fill="#16344c" text-anchor="middle">0</text><text x="958.582" y="500" font-size="22" fill="#16344c" text-anchor="middle">约0.278</text><text x="270" y="310" font-size="22" fill="#16344c" text-anchor="start">退化区间 [0,0]</text><text x="120" y="720" font-size="22" fill="#16344c" text-anchor="start">横轴为总体成功概率；非退化区间保留了有限样本的不确定性。</text></g></svg>

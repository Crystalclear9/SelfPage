<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title id="extra-title">极端比例下 Wald 与 Wilson 区间不同</title><desc id="extra-desc">在 n=10 次独立 Bernoulli 试验中观察到零次成功，样本比例为零。普通 Wald 区间把估计标准误差也算成零，得到退化的 [0,0]；这显然不意味着总体成功概率已经被确定为零。图中所有区间都采用**双侧、名义 95%**，避免把一侧上限与双侧区间混在一起比较。

Wilson 得分区间的上端点为 \frac{z^2}{n+z^2}\approx0.2775，其中 z=\Phi^{-1}(0.975)\approx1.959964。第三行是等尾精确二项区间：下端点为零，上端点解 (1-p_U)^{10}=0.025，所以 p_U=1-0.025^{\frac{1}{10}}\approx0.3085。它通过反演二项尾概率构造；“精确”指不依靠正态近似且覆盖率至少达到名义水平，不意味着每个 p 的覆盖率都恰好为 95%，离散性可能使其保守。Wilson 通常很有用，但没有这种逐参数保底的精确覆盖性质。

作为直观检查，真实 p=0.1 时观察到零次成功的概率仍为 0.9^{10}\approx0.3487，因此零次观测并非零风险的证据。这里讨论的是重复抽样区间程序，不是给固定区间内的参数赋予后验概率。公式与精确二项反演见 [NIST 统计手册：比例的置信区间](https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm)。</desc><rect width="1200" height="750" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">极端比例下 Wald 与 Wilson 区间不同</text><text x="85" y="110" font-size="27" fill="#213447" text-anchor="start" font-weight="400">10 次独立 Bernoulli 试验，观察到 0 次成功；均为双侧名义 95%</text><text x="85" y="239" font-size="29" fill="#627689" text-anchor="start" font-weight="400">Wald</text><line x1="310" y1="230" x2="310" y2="230" stroke="#627689" stroke-width="5" /><circle cx="310" cy="230" r="6" fill="#627689" /><text x="335" y="239" font-size="28" fill="#627689" text-anchor="start" font-weight="400">[0,0]</text><text x="85" y="369" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">Wilson</text><line x1="310" y1="360" x2="934.4487996915005" y2="360" stroke="#2865a0" stroke-width="5" /><circle cx="310" cy="360" r="6" fill="#2865a0" /><line x1="934.4487996915005" y1="348" x2="934.4487996915005" y2="372" stroke="#2865a0" stroke-width="3" /><text x="934.4487996915005" y="336" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0.2775</text><text x="85" y="499" font-size="29" fill="#cf7432" text-anchor="start" font-weight="400">精确二项</text><line x1="310" y1="490" x2="1004.1184925922119" y2="490" stroke="#cf7432" stroke-width="5" /><circle cx="310" cy="490" r="6" fill="#cf7432" /><line x1="1004.1184925922119" y1="478" x2="1004.1184925922119" y2="502" stroke="#cf7432" stroke-width="3" /><text x="1004.1184925922119" y="466" font-size="27" fill="#cf7432" text-anchor="middle" font-weight="400">0.3085</text><line x1="310" y1="580" x2="1097.5" y2="580" stroke="#627689" stroke-width="2" /><line x1="310" y1="574" x2="310" y2="586" stroke="#627689" stroke-width="2" /><text x="310" y="620" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="535.0" y1="574" x2="535.0" y2="586" stroke="#627689" stroke-width="2" /><text x="535.0" y="620" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.1</text><line x1="760.0" y1="574" x2="760.0" y2="586" stroke="#627689" stroke-width="2" /><text x="760.0" y="620" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.2</text><line x1="985.0" y1="574" x2="985.0" y2="586" stroke="#627689" stroke-width="2" /><text x="985.0" y="620" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.3</text><text x="630" y="660" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">总体成功概率 p</text><text x="85" y="715" font-size="27" fill="#213447" text-anchor="start" font-weight="400">即使真实 p=0.1，也有约 34.9% 的概率观察到 0 次成功。</text></g></svg>

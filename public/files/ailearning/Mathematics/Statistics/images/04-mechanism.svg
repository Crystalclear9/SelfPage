<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>配对重采样与独立重采样保留的信息不同</title><desc>图中每位受试者都有方法A与B两个观测，比较对象是同一受试者内的差。配对bootstrap应抽取受试者编号并同时带走两列，重复抽到同一编号时也重复保留整对。把两列分别抽样会破坏配对协方差，改变目标统计量的抽样波动。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">配对重采样与独立重采样保留的信息不同</text><text x="90" y="180" font-size="25" fill="#16344c" text-anchor="start">原配对数据</text><rect x="90" y="220" width="430" height="320" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="115" y="260" font-size="22" fill="#16344c" text-anchor="start">编号       方法A       方法B</text><text x="120" y="325" font-size="24" fill="#16344c" text-anchor="start">s1            2             3</text><text x="120" y="405" font-size="24" fill="#16344c" text-anchor="start">s2            5             4</text><text x="120" y="485" font-size="24" fill="#16344c" text-anchor="start">s3            1             2</text><text x="680" y="180" font-size="25" fill="#16344c" text-anchor="start">一次按编号重采样</text><rect x="680" y="220" width="430" height="320" rx="8" fill="#edf5fb" stroke="#9cb8c8" /><text x="705" y="260" font-size="22" fill="#16344c" text-anchor="start">编号       方法A       方法B</text><text x="710" y="325" font-size="24" fill="#16344c" text-anchor="start">s2            5             4</text><text x="710" y="405" font-size="24" fill="#16344c" text-anchor="start">s2            5             4</text><text x="710" y="485" font-size="24" fill="#16344c" text-anchor="start">s1            2             3</text><path d="M535,390 L660,390" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="690" font-size="23" fill="#16344c" text-anchor="start">抽中同一受试者时，成对取走两列；重复编号也保留整对。</text></g></svg>

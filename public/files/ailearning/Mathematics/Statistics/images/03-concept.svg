<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>回归系数如何受混杂影响</title><desc>A画出共同原因同时影响输入与结果的分叉，回归关联因此未必是干预效应。B在两个层内都设处理成功率高0.1。C改变两组层构成后，粗率发生反转；按共同各半总体标准化才恢复可比的层加权差。 下方先画处理组与对照组的低、高风险比例，再画共同的各半标准总体。比较层内成功率之前，必须先看清每组的构成权重。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">回归系数如何受混杂影响</text><g transform="translate(10,15) scale(.95)"><circle cx="480.00" cy="327.20" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="480.00" y="336.32" font-size="24" fill="#15364c" text-anchor="middle">Z</text><circle cx="228.00" cy="692.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="228.00" y="701.12" font-size="24" fill="#15364c" text-anchor="middle">T</text><circle cx="732.00" cy="692.00" r="26" fill="#e4f1ef" stroke="#2563eb" stroke-width="2" /><text x="732.00" y="701.12" font-size="24" fill="#15364c" text-anchor="middle">Y</text><path d="M446.40,365.20 L261.60,646.40" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M513.60,365.20 L698.40,646.40" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M278.40,692.00 L681.60,692.00" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="127.20" y="258.80" font-size="26" fill="#15364c" 
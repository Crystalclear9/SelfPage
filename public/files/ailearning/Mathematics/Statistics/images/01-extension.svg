<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>有偏收缩估计可能具有更小均方误差</title><desc>设无偏估计量X方差1，目标参数θ。比较X与0.5X：后者方差降到0.25，但平方偏差为0.25θ²，因此均方误差为0.25+0.25θ²。在θ较接近零时收缩更好，离零很远时则可能更差。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">有偏收缩估计可能具有更小均方误差</text><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="20" fill="#193e54" text-anchor="middle">-3</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="20" fill="#193e54" text-anchor="middle">-1.8</text><line x1="495.99999999999994" y1="235" x2="495.99999999999994" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="495.99999999999994" y="671" font-size="20" fill="#193e54" text-anchor="middle">-0.6</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="20" fill="#193e54" text-anchor="middle">0.6</text><line x1="871.9999999999999" y1="235" x2="871.9999999999999" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="871.9999999999999" y="671" font-size="20" fill="#193e54" text-anchor="middle">1.8</text><line x1="1060.0" y1="235" x2="1060.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0" y="671" font-size="20" fill="#193e54" text-anchor="middle">3</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="20" fill="#193e54" text-anchor="end">0</text><line x1="120" y1="535.0" x2="1060" y2="535.0" stroke
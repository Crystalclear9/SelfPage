<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>重采样必须尊重独立单位</title><desc>A把每位患者的5次记录画在同一簇内，真正近似独立的是患者而非行。B用配对A/B观测说明抽取编号时应整对带走，重复编号也保留配对。C区分15行与3个独立簇，防止把重采样次数或记录数误作独立信息量。 下方每行蓝点与橙点是一位患者的配对观测。原样本为编号 1、2、3；两次示意重采样分别抽到 [2,2,1] 与 [3,1,3]，连线始终保留配对关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">重采样必须尊重独立单位</text><g transform="translate(10,15) scale(.95)"><rect x="110.40" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="122.40" y="365.20" font-size="24" fill="#15364c" text-anchor="start">患者1</text><circle cx="156.60" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="223.80" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="291.00" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="156.60" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="223.80" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><rect x="370.80" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="382.80" y="365.20" font-size="24" fill="#15364c" text-anchor="start">患者2</text><circle cx="417.00" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="484.20" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="551.40" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="417.00" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="484.20" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><rect x="631.20" y="312.00" width="226.80" height="418.00" rx="5" fill="#edf5f8" stroke="#a5bdc8" /><text x="643.20" y="365.20" font-size="24" fill="#15364c" text-anchor="start">患者3</text><circle cx="677.40" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="744.60" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="811.80" cy="479.20" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="677.40" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /><circle cx="744.60" cy="578.00" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" /></g><g transform="translate(-145,-10) scale(1.05)"><text x="1003.00" y="199.60" font-size="24" fill="#15364c" text-anchor="start">按受试者编号抽取整对</text><text x="1003.00" y="275.50" font-size="24" fill="#15364c" text-anchor="start">编号1：A=2，B=3</text><text x="1003.00" y="325.00" font-size="24" fill="#15364c" text-anchor="start">编号2：A=5，B=4</text><path d="M1210.00,348.10 L1210.00,391.00" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1003.00" y="440.50" font-size="24" fill="#15364c" text-anchor="start">抽[2,2,1]：重复保留整对</text></g><g transform="translate(-145,-15) scale(1.05)"><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="797.5000" y2="797.5000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="750.0000" y2="750.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="702.5000" y2="702.5000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="655.0000" y2="655.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="625.00" font-size="24" fill="#15364c" text-anchor="start">3位患者，各5次观测</text><rect x="1080.42" y="702.50" width="111.65" height="142.50" fill="#2563eb" /><text x="1136.25" y="693.50" font-size="24" fill="#15364c" text-anchor="middle">15</text><text x="1136.25" y="877.00" font-size="24" fill="#15364c" text-anchor="middle">逐行假独立信息</text><rect x="1272.92" y="816.50" width="111.65" height="28.50" fill="#cb702a" /><text x="1328.75" y="807.50" font-size="24" fill="#15364c" text-anchor="middle">3</text><text x="1328.75" y="877.00" font-size="24" fill="#15364c" text-anchor="middle">患者独立单位数</text><text x="1032" y="851" text-anchor="end" font-size="24" fill="#15364c">0</text><text x="1032" y="803.5" text-anchor="end" font-size="24" fill="#15364c">5</text><text x="1032" y="756" text-anchor="end" font-size="24" fill="#15364c">10</text><text x="1032" y="708.5" text-anchor="end" font-size="24" fill="#15364c">15</text><text x="1032" y="661" text-anchor="end" font-size="24" fill="#15364c">20</text><line x1="1040" x2="1425" y1="845.0000" y2="845.0000" stroke="#95adba" stroke-width="2" /></g></g></svg>

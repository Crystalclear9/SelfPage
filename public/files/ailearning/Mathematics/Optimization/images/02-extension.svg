<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>自适应归一化的尺度抵消受稳定项限制</title><desc>比较单步归一化量g乘以(abs(g)+ε)的倒数，固定g=1。若ε=0，把梯度整体缩放为任意正倍数c，结果仍为1；若ε=0.1，小尺度c时稳定项占主导，输出变为c乘以(c+0.1)的倒数，不能保持尺度不变。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="120" y1="271.364" x2="1060" y2="271.364" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="453.182" x2="1060" y2="453.182" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="635.000" x2="1060" y2="635.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="1060.000" y1="235" x2="1060.000" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="824.882" y1="235" x2="824.882" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="589.765" y1="235" x2="589.765" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="354.647" y1="235" x2="354.647" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">自适应归一化的尺度抵消受稳定项限制</text><line x1="120" y1="635" x2="1060" y2="635" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="235" x2="120" y2="635" stroke="#2865a0" stroke-width="3" /><text x="1060" y="205" font-size="24" fill="#456679" text-anchor="end">横轴：c</text><text x="120" y="223" font-size="24" fill="#193e54" text-anchor="start">归一化后单步量</text><line x1="90" y1="130" x2="140" y2="130" stroke="#1977b4" stroke-width="2.5" /><text x="155" y="138" font-size="24" fill="#1977b4" text-anchor="start">ε=0：完全尺度抵消</text><polyline points="120.00,271.36 122.35,271.36 124.70,271.36 127.05,271.36 129.40,271.36 131.75,271.36 134.10,271.36 136.45,271.36 138.80,271.36 141.15,271.36 143.50,271.36 145.85,271.36 
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>耦合正则与解耦衰减在预条件下不同</title><desc>设w=(1,1)、学习率0.1、衰减系数0.1，当前数据梯度为零，预条件尺度为(1,0.1)。把二次正则梯度送进该预条件器，两个坐标收缩量分别为0.01与0.001；直接执行解耦衰减时，两者均为0.01。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">耦合正则与解耦衰减在预条件下不同</text><text x="85" y="190" font-size="22" fill="#16344c" text-anchor="start">数值</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="318.3" width="145.0" height="291.7" fill="#118779" /><text x="207.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">0.01</text><text x="207.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">耦合：坐标1</text><rect x="370.0" y="580.8" width="145.0" height="29.2" fill="#d26724" /><text x="442.5" y="564.8333333333334" font-size="24" fill="#16344c" text-anchor="middle">0.001</text><text x="442.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">耦合：坐标2</text><rect x="605.0" y="318.3" width="145.0" height="291.7" fill="#148671" /><text x="677.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">0.01</text><text x="677.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">解耦：坐标1</text><rect x="840.0" y="318.3" width="145.0" height="291.7" fill="#118779" /><text x="912.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">0.01</text><text x="912.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">解耦：坐标2</text></g></svg>

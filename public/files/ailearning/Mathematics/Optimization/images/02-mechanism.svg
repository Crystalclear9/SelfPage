  <line x1="841" y1="417.5" x2="926.5" y2="417.5" stroke="#d4e0e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 6"/>
  <line x1="1069" y1="503" x2="1069" y2="510" stroke="#202a37" stroke-width="1.2" stroke-linecap="round"/>
  <text x="1069" y="533" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="23" fill="#202a37" text-anchor="middle">0.995</text>
  <line x1="834" y1="275" x2="841" y2="275" stroke="#202a37" stroke-width="1.2" stroke-linecap="round"/>
  <text x="829" y="283" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="23" fill="#202a37" text-anchor="end">0.995</text>
  <line x1="1211.5" y1="503" x2="1211.5" y2="510" stroke="#202a37" stroke-width="1.2" stroke-linecap="round"/>
  <text x="1211.5" y="533" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="23" fill="#202a37" text-anchor="middle">1</text>
  <line x1="834" y1="132.5" x2="841" y2="132.5" stroke="#202a37" stroke-width="1.2" stroke-linecap="round"/>
  <text x="829" y="140.5" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="23" fill="#202a37" text-anchor="end">1</text>
  <line x1="1211.5" y1="503" x2="1211.5" y2="132.5" stroke="#d4e0e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 6"/>
  <line x1="841" y1="132.5" x2="1211.5" y2="132.5" stroke="#d4e0e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 6"/>
  <polyline points="841,503 1240,104" stroke="#657682" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 6"/>
  <line x1="1211.5" y1="132.5" x2="926.5" y2="161" stroke="#a84b3b" stroke-width="2.45" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <circle cx="926.5" cy="161" r="6" stroke="#a84b3b" stroke-width="1.8" fill="#a84b3b"/>
  <text x="988" y="130" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" fill="#a84b3b" text-anchor="middle">耦合</text>
  <line x1="1211.5" y1="132.5" x2="926.5" y2="417.5" stroke="#196f77" stroke-width="2.45" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <circle cx="926.5" cy="417.5" r="6" stroke="#196f77" stroke-width="1.8" fill="#196f77"/>
  <text x="995" y="452" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" fill="#196f77" text-anchor="middle">解耦</text>
  <circle cx="1211.5" cy="132.5" r="6" stroke="#202a37" stroke-width="1.8" fill="#202a37"/>
  <text x="1247" y="114" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="26" fill="#202a37" text-anchor="middle">起点</text>
  <text x="682" y="611" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="30" fill="#202a37" text-anchor="middle">虚线是原方向。直接缩放仍沿该方向。</text>

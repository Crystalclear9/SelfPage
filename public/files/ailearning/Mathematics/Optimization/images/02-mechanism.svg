<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>同一个起点，正则化项会被不同地缩放</title><desc>w=(1,1),eta=.1,lambda=.1,数据梯度零。P=diag(1,.1)固定。耦合终点(.99,.999)，解耦终点(.99,.99)；图等比例放大局部。</desc><rect width="1200" height="730" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">同一个起点，正则化项会被不同地缩放</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">数据梯度 = 0；η = 0.1；λ = 0.1；固定 P = diag(1, 0.1)</text><line x1="258.0000000000001" y1="575.0" x2="258.0000000000001" y2="222.99999999999966" stroke="#dce4e5" stroke-width="2"/><line x1="170.0" y1="486.9999999999999" x2="522.0000000000003" y2="486.9999999999999" stroke="#dce4e5" stroke-width="2"/><text x="258.0000000000001" y="615" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">0.99</text><text x="150.0" y="494.9999999999999" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">0.99</text><line x1="478.0000000000003" y1="575.0" x2="478.0000000000003" y2="222.99999999999966" stroke="#dce4e5" stroke-width="2"/><line x1="170.0" y1="266.9999999999997" x2="522.0000000000003" y2="266.9999999999997" stroke="#dce4e5" stroke-width="2"/><text x="478.0000000000003" y="615" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><text x="150.0" y="274.9999999999997" font-size="24" fill="#78878b" text-anchor="end" font-weight="400">1</text><line x1="170.0" y1="575.0" x2="543.999999999998" y2="575.0" stroke="#78878b" stroke-width="2"/><line x1="170.0" y1="575.0" x2="170.0" y2="201.0000000000021" stroke="#78878b" stroke-width="2"/><path d="M214.00,531.00 L500.00,245.00" stroke="#78878b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="478.0000000000003" y1="266.9999999999997" x2="258.0000000000001" y2="288.9999999999998" stroke="#256b82" stroke-width="4"/><path d="M267.91,282.23 L258.00,289.00 L269.05,293.68" stroke="#256b82" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="478.0000000000003" y1="266.9999999999997" x2="258.0000000000001" y2="486.9999999999999" stroke="#c0643c" stroke-width="4"/><path d="M261.38,475.49 L258.00,487.00 L269.51,483.62" stroke="#c0643c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="478.0000000000003" cy="266.9999999999997" r="8" fill="#19333c" stroke="#19333c" stroke-width="2"/><circle cx="258.0000000000001" cy="288.9999999999998" r="7" fill="#256b82" stroke="#256b82" stroke-width="2"/><circle cx="258.0000000000001" cy="486.9999999999999" r="7" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="468.0000000000003" y="242.99999999999972" font-size="26" fill="#19333c" text-anchor="end" font-weight="400">w = (1, 1)</text><text x="690" y="220" font-size="30" fill="#256b82" text-anchor="start" font-weight="700">耦合：w − ηλPw</text><text x="690" y="271" font-size="28" fill="#256b82" text-anchor="start" font-weight="400">到达 (0.99, 0.999)</text><text x="690" y="385" font-size="30" fill="#c0643c" text-anchor="start" font-weight="700">解耦：w − ηλw</text><text x="690" y="436" font-size="28" fill="#c0643c" text-anchor="start" font-weight="400">到达 (0.99, 0.99)</text><text x="690" y="540" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">虚线：与原向量同方向</text><text x="40" y="683" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">局部坐标等比例放大；耦合收缩受 P 影响，解耦在本步保持两个坐标的比例。</text></g></svg>

  <polygon points="402,459 641,459 679,392 440,392" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="540.5" y="435.07" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#196f77" text-anchor="middle">两个坐标同倍收缩</text>
  <text x="223" y="302" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#a84b3b" text-anchor="middle">位移</text>
  <text x="411" y="302" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#a84b3b" text-anchor="middle">(−0.01, −0.001)</text>
  <text x="223" y="504" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#196f77" text-anchor="middle">位移</text>
  <text x="411" y="504" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#196f77" text-anchor="middle">(−0.01, −0.01)</text>
  <text x="1019" y="65" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">在同一坐标比例下读终点</text>
  <line x1="837" y1="503" x2="1294" y2="503" stroke="#202a37" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <line x1="841" y1="507" x2="841" y2="113" stroke="#202a37" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/>

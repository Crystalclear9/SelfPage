<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="537" viewBox="0 0 1310 537" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">可行半轴上的边界解与内部解</title><desc id="plate-desc">最小化 (x−θ)²，约束 x≥0。θ 为负时最优点在边界，乘子为正；θ 为正时为内部解。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1310" height="537" fill="white" stroke="none" stroke-width="1.6"/><text x="345" y="69" fill="#a84b3b" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">边界解</text><line x1="105" y1="254" x2="613" y2="254" stroke="#657682" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow-gray)"/><line x1="338" y1="254" x2="575" y2="254" stroke="#196f77" stroke-width="3" stroke-linecap="round"/><line x1="338" y1="239" x2="338" y2="269" stroke="#202a37" stroke-width="2.2" stroke-linecap="round"/><line x1="220" y1="254" x2="220" y2="267" stroke="#657682" stroke-width="1.7"/><text x="220" y="309" fill="#526976" font-size="25" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">−1</text><line x1="456" y1="254" x2="456" y2="267" stroke="#657682" stroke-width="1.7"/><text x="456" y="309" fill="#526976" font-size="25" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">1</text><text x="338" y="309" fill="#202a37" font-size="25" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">0</text><text x="631" y="263" fill="#202a37" font-size="25" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">x</text><circle cx="220" cy="254" r="10" stroke="#a84b3b" stroke-width="1.7" fill="white"/><path d="M 220 239 Q 279.0 129 338 238" fi
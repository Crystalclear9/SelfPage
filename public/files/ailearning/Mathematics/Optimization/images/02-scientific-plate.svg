<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="685" viewBox="0 0 1360 685" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">动量将历史位移和当前负梯度相加</title>

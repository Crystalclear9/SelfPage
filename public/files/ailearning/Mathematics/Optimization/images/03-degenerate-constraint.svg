  <title id="plate-title">可行区间缩小时，最优乘子为何发散</title>
  <desc id="plate-desc">平方约束 x²≤a。a 从 1 经 1/4 减至 0 时，可行区间缩为原点。最优值 −√a 连续，最优乘子 1/(2√a) 无界。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="943.6385" viewBox="29.3333 57.7778 1495.1111 881.7778" role="img"><title>训练目标与均值估计风险：同一噪声模型的精确曲线</title><desc>theta=1，噪声方差4，步长0.1。左为收缩因子的偏差方差分解，右为离散更新轨迹。 训练下降以后，风险为什么还会上升？ 曲线由给定模型精确计算；若用独立含噪标签验证，还须计入噪声与有限样本波动。</desc><rect width="1600" height="980" fill="white" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182b43"><text x="60.00" y="108.00" font-size="29" fill="#607287" text-anchor="start" font-weight="normal">Y = 1 + ε，Eε = 0，Var ε = 4      w(t) = a(t)Y，a(t) = 1 − 0.9^t</text><text x="100.00" y="179.00" font-size="30" fill="#182b43" text-anchor="start" font-weight="bold">A  先看估计规则：a 如何分配偏差与方差</text><line x1="110.00" y1="250.00" x2="110.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="110.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">0</text><line x1="228.00" y1="250.00" x2="228.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="228.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">0.2</text><line x1="346.00" y1="250.00" x2="346.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="346.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">0.4</text><line x1="464.00" y1="250.00" x2="464.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="464.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">0.6</text><line x1="582.00" y1="250.00" x2="582.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="582.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">0.8</text><line x1="700.00" y1="250.00" x2="700.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="700.00" y="776.00" font-size="24" fill="#607287" text-anchor="middle" font-weight="normal">1</text><line x1="110.00" y1="740.00" x2="700.00" y2="740.00" stroke="#e4ebf1" stroke-width="2" /><text x="95.00" y="74
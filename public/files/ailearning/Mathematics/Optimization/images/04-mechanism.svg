<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>用不同横轴比较优化器会改变结论</title><desc>假设方法A每步耗时1单位、误差乘0.8，方法B每步耗时4单位、误差乘0.5。按迭代次数看B下降更快；在相同时间预算8下，A可执行8步、B只能执行2步，误差分别约0.168与0.25。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">用不同横轴比较优化器会改变结论</text><text x="85" y="190" font-size="22" fill="#16344c" text-anchor="start">剩余误差（初值1）</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="414.3" width="145.0" height="195.7" fill="#118779" /><text x="207.5" y="398.2658133333332" font-size="24" fill="#16344c" text-anchor="middle">0.167772</text><text x="207.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">A：8步</text><rect x="370.0" y="605.4" width="145.0" height="4.6" fill="#d26724" /><text x="442.5" y="589.4427083333334" font-size="24" fill="#16344c" text-anchor="middle">0.00390625</text><text x="442.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">B：8步</text><rect x="605.0" y="414.3" width="145.0" height="195.7" fill="#148671" /><text x="677.5" y="398.2658133333332" font-size="24" fill="#16344c" text-anchor="middle">0.167772</text><text x="677.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">A：耗时8</text><rect x="840.0" y="318.3" width="145.0" height="291.7" fill="#118779" /><text x="912.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">0.25</text><text x="912.5" y="680" font-size="19" fill="#16344c" text-anchor="middle">B：耗时8</text><text x="120" y="130" font-size="24" fill="#16344c" text-anchor="start">同迭代：B更低；同时间：A更低。</text><text x="100" y="745" font-size="22" fill="#16344c" text-anchor="start">示意成本：A每步1单位，B每步4单位。</text></g></svg>

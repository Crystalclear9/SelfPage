<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="577.2806" viewBox="0.0000 66.0000 1162.0000 559.0000" role="img"><title id="extra-title">Adam 偏差修正改变启动阶段的更新尺度</title><desc id="extra-desc">为隔离启动阶段的代数，固定每步梯度 g_t=1、\beta_1=0.9、\beta_2=0.999、初始矩均为零，并在这个算例中取稳定项 \epsilon=0。于是 m_t=1-\beta_1^t、v_t=1-\beta_2^t；修正后 \widehat m_t=\widehat v_t=1。左图比较原始一阶矩与修正值，右图比较 \frac{m_t}{\sqrt{v_t}} 和 \frac{\widehat m_t}{\sqrt{\widehat v_t}}=1。第一步未经修正的比值约为 3.1623，并不等于一。

学习率乘以右图的比值后才得到对应的参数更新尺度，图中没有计入权重衰减。恒定梯度让两个修正矩都能精确复算，但一般随机梯度下，分别修正矩不代表非线性比值本身是无偏估计。\epsilon=0 仅用于本例的清楚分解，不能据此省略实际算法对零平方矩的处理。 Adam 偏差修正改变启动阶段的更新尺度</desc><rect width="1200" height="625" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="45" y="112" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">一阶矩：恒定梯度 g=1</text><text x="675" y="112" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">归一化更新比值</text><line x1="75" y1="495.0" x2="505" y2="495.0" stroke="#dce5ed" stroke-width="2" /><text x="63" y="503.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="75" y1="420.0" x2="505" y2="420.0" stroke="#dce5ed" stroke-width="2" /><text x="63" y="428.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.25</text><line x1="75" y1="345.0" x2="505" y2="345.0" stroke="#dce5ed" stroke-width="2" /><text x="63" y="353.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><line x1="75" y1="270.0" x2="505" y2="270.0" stroke="#dce5ed" stroke-width="2" /><text x="63" y="278.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.75</text><line x1="75" y1="195.0" x2="505" y2="195.0" stroke="#dce5ed" stroke-width="2" /><text x="63" y="203.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="75" y1="165" x2="75" y2="495" stroke="#627689" stroke-width="2" /><line x1="75" y1="495" x2="505" y2="495" stroke="#627689" stroke-width="2" /><line x1="75.0" y1="495.0" x2="75.0" y2="501.0" stroke="#627689" stroke-width="2" /><text x="75.0" y="527.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1
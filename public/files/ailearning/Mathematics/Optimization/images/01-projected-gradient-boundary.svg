<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="675" viewBox="0 0 1360 675" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">越界试探与可行更新是两条路径</title>
  <desc id="plate-desc">第一步从 (0.6,1) 试探到 (−0.4,0)，投影回原点。第二步从原点试探到 (−1,0)，投影又回原点。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="675" fill="white" stroke="none" stroke-width="1.6"/>
  <text x="321" y="64" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">A  从内部走到边界</text>
  <rect x="321" y="160.52" width="256.28" height="297.56" fill="url(#wash-teal)" stroke="none" stroke-width="1.6"/>
  <line x1="106" y1="391" x2="589.32" y2="391" stroke="#202a37" stroke-width="1.55" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <line x1="321" y1="466.68" x2="321" y2="141.6" stroke="#202a37" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="606.52" y="384.98" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#202a37" text-anchor="middle">x</text>
  <text x="336.48" y="143.32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#202a37" text-anchor="middle">y</text>
  <text x="482.68" y="189.76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">可行侧</text>
  <line x1="149" y1="391" x2="149" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="149" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">−1</text>
  <line x1="407" y1="391" x2="407" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="407" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">0.5</text>
  <line x1="493" y1="391" x2="493" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="493" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">1</text>
  <line x1="424.2" y1="219" x2="252.2" y2="391" stroke="#657682" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="6 6"/>
  <line x1="424.2" y1="219" x2="321" y2="391" stroke="#196f77" stroke-width="2.35" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <line x1="252.2" y1="391" x2="321" y2="391" stroke="#a84b3b" stroke-width="2.15" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <circle cx="424.2" cy="219" r="6.5" stroke="#202a37" stroke-width="1.8" fill="#202a37"/>
  <text x="441.2" y="205" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#202a37" text-anchor="middle">u</text>
  <circle cx="252.2" cy="391" r="6.5" stroke="#657682" stroke-width="1.8" fill="#657682"/>
  <text x="248.2" y="375" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#657682" text-anchor="middle">z</text>
  <circle cx="321" cy="391" r="6.5" stroke="#a84b3b" stroke-width="1.8" fill="#a84b3b"/>
  <text x="312" y="434" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#a84b3b" text-anchor="middle">p</text>
  <text x="321" y="544" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">实际更新沿青箭头到达边界</text>
  <text x="1007" y="64" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">B  边界最优点保持不动</text>
  <rect x="1007" y="160.52" width="256.28" height="297.56" fill="url(#wash-teal)" stroke="none" stroke-width="1.6"/>
  <line x1="792" y1="391" x2="1275.32" y2="391" stroke="#202a37" stroke-width="1.55" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <line x1="1007" y1="466.68" x2="1007" y2="141.6" stroke="#202a37" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
  <text x="1292.52" y="384.98" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#202a37" text-anchor="middle">x</text>
  <text x="1022.48" y="143.32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#202a37" text-anchor="middle">y</text>
  <text x="1168.68" y="189.76" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">可行侧</text>
  <line x1="835" y1="391" x2="835" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="835" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">−1</text>
  <line x1="1093" y1="391" x2="1093" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="1093" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">0.5</text>
  <line x1="1179" y1="391" x2="1179" y2="398" stroke="#657682" stroke-width="1.1" stroke-linecap="round"/>
  <text x="1179" y="427" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="22" fill="#657682" text-anchor="middle">1</text>
  <polyline points="1007,391 986.36,365.2 860.8,365.2 835,391" stroke="#657682" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="6 6"/>
  <polyline points="835,391 855.64,406.48 984.64,406.48 1007,391" stroke="#a84b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-coral)"/>
  <circle cx="1007" cy="391" r="6.5" stroke="#a84b3b" stroke-width="1.8" fill="#a84b3b"/>
  <text x="1043" y="439" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#a84b3b" text-anchor="middle">u = p</text>
  <circle cx="835" cy="391" r="6.5" stroke="#657682" stroke-width="1.8" fill="#657682"/>
  <text x="832" y="374" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="26" fill="#657682" text-anchor="middle">z</text>
  <text x="1007" y="544" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="27" fill="#202a37" text-anchor="middle">两条弯箭头区分重合的试探与投影</text>
  <text x="682" y="626" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#202a37" text-anchor="middle">可行性由投影恢复。最优点上的梯度映射为零。</text>
</svg>

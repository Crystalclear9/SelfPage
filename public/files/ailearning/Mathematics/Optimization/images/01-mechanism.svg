<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>椭圆等高线与坐标缩放</title><desc>取目标f(x,y)=x²+25y²。图中的椭圆表示相同损失：y方向曲率更大，固定步长需要受该方向限制。令u=x、v=5y后，目标变为u²+v²，等高线成为圆，说明坐标缩放会改变优化器看到的几何。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">椭圆等高线与坐标缩放</text><text x="70" y="160" font-size="22" fill="#16344c" text-anchor="start">原坐标：x²+25y²</text><text x="680" y="160" font-size="22" fill="#16344c" text-anchor="start">缩放后：u²+v²</text><ellipse cx="300" cy="430" rx="60" ry="12.0" fill="none" stroke="#118779" stroke-width="3" /><circle cx="850" cy="430" r="60" fill="none" stroke="#148671" stroke-width="3" /><ellipse cx="300" cy="430" rx="110" ry="22.0" fill="none" stroke="#118779" stroke-width="3" /><circle cx="850" cy="430" r="110" fill="none" stroke="#148671" stroke-width="3" /><ellipse cx="300" cy="430" rx="160" ry="32.0" fill="none" stroke="#118779" stroke-width="3" /><circle cx="850" cy="430" r="160" fill="none" stroke="#148671" stroke-width="3" /><line x1="95" y1="430" x2="505" y2="430" stroke="#277eac" stroke-width="2.5" /><line x1="300" y1="220" x2="300" y2="640" stroke="#277eac" stroke-width="2.5" /><line x1="640" y1="430" x2="1060" y2="430" stroke="#277eac" stroke-width="2.5" /><line x1="850" y1="220" x2="850" y2="640" stroke="#277eac" stroke-width="2.5" /><path d="M535,430 L615,430" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="495" y="680" font-size="22" fill="#16344c" text-anchor="start">u=x，v=5y</text></g></svg>

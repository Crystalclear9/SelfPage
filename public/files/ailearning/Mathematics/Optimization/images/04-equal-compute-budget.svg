<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="625" viewBox="0 0 1350 625" role="img" aria-labelledby="title desc"><title id="title">计算预算对齐以后再比较</title><desc id="desc">同一预算六个成本单位。单步成本一的方法可走六步，单步成本二的方法只能走三步。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="625" fill="white" stroke="none" stroke-width="1.55"/><text x="662" y="66" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">在共同预算处读取终点</text><text x="135" y="206" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">方法 A</text><rect x="302" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="364.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">1</text><rect x="435" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="497.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">2</text><rect x="568" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="630.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">3</text><rect x="701" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="763.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">4</text><rect x="834" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="896.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">5</text><rect x="967" y="166" width="125" height="62" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.55"/><text x="1029.5" y="206" fill="#196f77" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">6</text><text x="665" y="279" fill="#196f77" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">每步成本 1</text><text x="135" y="438" fill="#655184" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">方法 B</text><rect x="302" y="398" width="258" height="62" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="431" y="438" fill="#655184" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">1</text><rect x="568" y="398" width="258" height="62" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="697" y="438" fill="#655184" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">2</text><rect x="834" y="398" width="258" height="62" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.55"/><text x="963" y="438" fill="#655184" font-size="26" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif">3</text><text x="665" y="511" fill="#655184" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">每步成本 2</text><line x1="1100" y1="106" x2="1100" y2="508" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 6"/><text x="1100" y="103" fill="#a84b3b" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">共同预算 6</text><text x="676" y="575" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, seri
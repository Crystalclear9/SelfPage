<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>对偶下界来自把约束移进目标后的全域最小值</title><desc>最小化x²，约束x&gt;=1。L=x²+lambda(1-x)，lambda非负。lambda为0,1,2时全实数最小点分别0,.5,1，值0,.75,1。</desc><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="36" fill="#19333c" text-anchor="start" font-weight="700">对偶下界来自一个新的最小化问题</text><text x="40" y="103" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">原问题：min x²，x ≥ 1；L(x, λ) = x² + λ(1 − x)，λ ≥ 0</text><text x="65" y="163" font-size="27" fill="#19333c" text-anchor="start" font-weight="700">固定 λ，在所有实数 x 上取最小</text><rect x="332.5" y="218.0" width="232.5" height="357.0" fill="#dbecef" stroke="none" stroke-width="2"/><path d="M100.00,553.75 L103.88,555.82 L107.75,557.79 L111.62,559.65 L115.50,561.40 L119.38,563.05 L123.25,564.59 L127.12,566.02 L131.00,567.35 L134.88,568.57 L138.75,569.69 L142.62,570.70 L146.50,571.60 L150.38,572.40 L154.25,573.09 L158.12,573.67 L162.00,574.15 L165.88,574.52 L169.75,574.79 L173.62,574.95 L177.50,575.00 L181.38,574.95 L185.25,574.79 L189.12,574.52 L193.00,574.15 L196.88,573.67 L200.75,573.09 L204.62,572.40 L208.50,571.60 L212.38,570.70 L216.25,569.69 L220.12,568.57 L224.00,567.35 L227.88,566.02 L231.75,564.59 L235.62,563.05 L239.50,561.40 L243.38,559.65 L247.25,557.79 L251.12,555.82 L255.00,553.75 L258.88,551.57 L262.75,549.29 L266.62,546.90 L270.50,544.40 L274.38,541.80 L278.25,539.09 L282.12,536.27 L286.00,533.35 L289.88,530.32 L293.75,527.19 L297.62,523.95 L301.50,520.60 L305.38,517.15 L309.25,513.59 L313.12,509.92 L317.00,506.15 L320.88,502.27 L324.75,498.29 L328.62,494.20 L332.50,490.00 L336.38,485.70 L340.25,481.29 L344.12,476.77 L348.00,472.15 L351.88,467.42 L355.75,462.59 L359.62,457.65 L363.50,452.60 L367.38,447.45 L371.25,442.19 L375.12,436.82 L379.00,431.35 L382.88,425.77 L386.75,420.09 L390.62,414.30 L394.50,408.40 L398.38,402.40 L402.25,396.29 L406.12,390.07 L410.0
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="681" viewBox="0 0 1360 681" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">三种更新方法从同一个误差点出发</title>
  <desc id="plate-desc">左图轴对齐时，对角法与精确法都到原点。右图旋转后，普通法与对角法重合，精确法仍到原点。</desc>

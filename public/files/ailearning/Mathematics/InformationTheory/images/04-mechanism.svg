<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>有限样本的独立性会被随机起伏打破</title><desc>总体设为两个独立公平二元变量，但一次8个样本的列联表可能出现图示计数。两行与两列边缘计数均为4，联合频率却并非边缘频率乘积；插件互信息约为0.189 bit，而真实总体互信息为0。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">有限样本的独立性会被随机起伏打破</text><text x="110" y="170" font-size="25" fill="#16344c" text-anchor="start">行列对应正文变量约定；格内保留原始数值</text><rect x="350" y="240" width="230" height="150" rx="8" fill="#cce7dc" stroke="#9cb8c8" /><text x="465" y="330" font-size="36" fill="#16344c" text-anchor="middle">3</text><rect x="600" y="240" width="230" height="150" rx="8" fill="#cce7dc" stroke="#9cb8c8" /><text x="715" y="330" font-size="36" fill="#16344c" text-anchor="middle">1</text><rect x="350" y="410" width="230" height="150" rx="8" fill="#cce7dc" stroke="#9cb8c8" /><text x="465" y="500" font-size="36" fill="#16344c" text-anchor="middle">1</text><rect x="600" y="410" width="230" height="150" rx="8" fill="#cce7dc" stroke="#9cb8c8" /><text x="715" y="500" font-size="36" fill="#16344c" text-anchor="middle">3</text><text x="140" y="690" font-size="24" fill="#16344c" text-anchor="start">颜色用于区分符号或类别；数值本身由格内标签给出，颜色深浅不代表线性比例。</text><text x="465" y="225" font-size="24" text-anchor="middle" fill="#16344c">Y=0</text><text x="330" y="330" font-size="24" text-anchor="end" fill="#16344c">X=0</text><text x="715" y="225" font-size="24" text-anchor="middle" fill="#16344c">Y=1</text><text x="330" y="500" font-size="24" text-anchor="end" fill="#16344c">X=1</text></g></svg>

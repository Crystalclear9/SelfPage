<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>两个模型都校准，仍可以有完全不同的分辨能力</title><rect width="1280" height="740" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start">两个模型都校准，仍可以有完全不同的分辨能力</text><text x="80" y="130" font-size="28" fill="#19333c" text-anchor="start">A  校准：同一预测值的实际正类率</text><line x1="110" y1="210" x2="110" y2="585" stroke="#dbe5e8" stroke-width="2"/><line x1="110" y1="585" x2="640" y2="585" stroke="#dbe5e8" stroke-width="2"/><text x="110" y="623" font-size="23" fill="#19333c" text-anchor="middle">0</text><text x="95" y="593" font-size="23" fill="#19333c" text-anchor="end">0</text><line x1="242.5" y1="210" x2="242.5" y2="585" stroke="#dbe5e8" stroke-width="2"/><line x1="110" y1="491.25" x2="640" y2="491.25" stroke="#dbe5e8" stroke-width="2"/><text x="242.5" y="623" font-size="23" fill="#19333c" text-anchor="middle">0.25</text><text x="95" y="499.25" font-size="23" fill="#19333c" text-anchor="end">0.25</text><line x1="375.0" y1="210" x2="375.0" y2="585" stroke="#dbe5e8" stroke-width="2"/><line x1="110" y1="397.5" x2="640" y2="397.5" stroke="#dbe5e8" stroke-width="2"/><text x="375.0" y="623" font-size="23" fill="#19333c" text-anchor="middle">0.5</text><text x="95" y="405.5" font-size="23" fill="#19333c" text-anchor="end">0.5</text><line x1="507.5" y1="210" x2="507.5" y2="585" stroke="#dbe5e8" stroke-width="2"/><line x1="110" y1="303.75" x2="640" y2="303.75" stroke="#dbe5e8" stroke-width="2"/><text x="507.5" y="623" font-size="23" fill="#19333c" text-anchor="middle">0.75</text><text x="95" y="311.75" font-size="23" fill="#19333c" text-anchor="end">0.75</text><line x1="640" y1="210" x2="640" y2="585" stroke="#dbe5e8" stroke-width="2"/><line x1="110" y1="210" x2="640" y2="210" stroke="#dbe5e8" stroke-width="2"/><text x="640" y="623" font-size="23" fill="#19333c" text-anchor="middle">1</text><text x="95" y="218" font-size="23" fill="#19333c" text-anchor="end">1</text><line x1="110" y1="585" x2="640" y2="210" stroke="#71858b" stroke-width="2"/><circle cx="375.0" cy="397.5" r="11" fill="#c0643c"/><circle cx="163.0" cy="547.5" r="9" fill="#256b82"/><circle cx="587.0" cy="247.5" r="9" fill="#256b82"/><text x="110" y="180" font-size="25" fill="#19333c" text-anchor="start">实际正类率</text><text x="400" y="674" font-size="25" fill="#19333c" text-anchor="start">预测正类概率</text><text x="765" y="130" font-size="28" fill="#19333c" text-anchor="start">B  按同一总体计算预测质量</text><text x="765" y="205" font-size="25" fill="#19333c" text-anchor="start">两组各占一半：真实正类率 0.1 / 0.9</text><text x="765" y="285" font-size="27" fill="#c0643c" text-anchor="start">常数模型</text><text x="1040" y="285" font-size="27" fill="#256b82" text-anchor="start">分组模型</text><text x="765" y="348" font-size="28" fill="#c0643c" text-anchor="start">0.5 / 0.5</text><text x="1040" y="348" font-size="28" fill="#256b82" text-anchor="start">0.1 / 0.9</text><line x1="750" y1="390" x2="1220" y2="390" stroke="#dbe5e8" stroke-width="2"/><text x="765" y="450" font-size="26" fill="#19333c" text-anchor="start">交叉熵</text><text x="965" y="450" font-size="27" fill="#c0643c" text-anchor="start">0.6931</text><text x="1125" y="450" font-size="27" fill="#256b82" text-anchor="start">0.3251</text><text x="765" y="520" font-size="26" fill="#19333c" text-anchor="start">准确率</text><text x="965" y="520" font-size="27" fill="#c0643c" text-anchor="start">0.5</text><text x="1125" y="520" font-size="27" fill="#256b82" text-anchor="start">0.9</text><text x="765" y="610" font-size="25" fill="#19333c" text-anchor="start">校准图上的点均在对角线</text><line x1="60" y1="700" x2="1220" y2="700" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="735" font-size="24" fill="#19333c" text-anchor="start">常数模型掩盖两组差异；校准只约束相同预测值的人群，并不保证利用全部输入信息。</text></g></svg>

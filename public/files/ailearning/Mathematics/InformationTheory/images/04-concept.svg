<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>异或说明边际相关不足以选特征</title><desc>A枚举两个独立公平位的异或结果，任意单个位都不能确定Y，两个位联合却能确定。B因此得到边际互信息0、联合互信息1 bit。C把X2改成X1的复制，第二个特征变为冗余信息，不能把各自互信息相加当成联合收益。 下方用输出的两种颜色表示异或结果；单独观察任意一位时两种输出仍各半，固定两个位后输出才确定。图中长度为条件概率。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">异或说明边际相关不足以选特征</text><g transform="translate(10,15) scale(.95)"><text x="110.40" y="236.00" font-size="24" fill="#15364c" text-anchor="start">四个结果等概率</text><text x="118.40" y="378.20" font-size="24" fill="#15364c" text-anchor="start">X1</text><text x="364.80" y="378.20" font-size="24" fill="#15364c" text-anchor="start">X2</text><text x="611.20" y="378.20" font-size="24" fill="#15364c" text-anchor="start">Y</text><rect x="110.40" y="412.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="233.60" y="467.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="356.80" y="412.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="480.00" y="467.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="603.20" y="412.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="726.40" y="467.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="110.40" y="497.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="233.60" y="552.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="356.80" y="497.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="480.00" y="552.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="603.20" y="497.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="726.40" y="552.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="110.40" y="582.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="233.60" y="637.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="356.80" y="582.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="480.00" y="637.45" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="603.20" y="582.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="726.40" y="637.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="110.40" y="667.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="233.60" y="722.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="356.80" y="667.20" width="243.40" height="82.00" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="480.00" y="722.45" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="603.20" y="667.20" width="243.40" height="82.00" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="726.40" y="722.45" font-size="24" fill="#15364c" text-anchor="middle">0</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="24" fill="#15364c" text-anchor="start">与Y的互信息bit</text><rect x="1066.95" y="405.00" width="74.43" height="0.00" fill="#2563eb" /><text x="1104.17" y="396.00" font-size="24" fill="#15364c" text-anchor="middle">0</text><text x="1104.17" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">仅X1</text><rect x="1195.28" y="405.00" width="74.43" height="0.00" fill="#cb702a" /><text x="1232.50" y="396.00" font-size="24" fill="#15364c" text-anchor="middle">0</text><text x="1232.50" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">仅X2</text><rect x="1323.62" y="278.33" width="74.43" height="126.67" fill="#497da4" /><text x="1360.83" y="269.33" font-size="24" fill="#15364c" text-anchor="middle">1</text><text x="1360.83" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">联合(X1,X2)</text><text x="1032" y="411" text-anchor="end" font-size="24" fill="#15364c">0</text><text x="1032" y="347.667" text-anchor="end" font-size="24" fill="#15364c">0.5</text><text x="1032" y="284.333" text-anchor="end" font-size="24" fill="#15364c">1</text><text x="1032" y="221" text-anchor="end" font-size="24" fill="#15364c">1.5</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><text x="1007.60" y="633.00" font-size="24" fill="#15364c" text-anchor="start">X2=X1=Y；联合仍仅1 bit</text><text x="1015.60" y="696.36" font-size="24" fill="#15364c" text-anchor="start">X1</text><text x="1150.53" y="696.36" font-size="24" fill="#15364c" text-anchor="start">X2</text><text x="1285.47" y="696.36" font-size="24" fill="#15364c" text-anchor="start">Y</text><rect x="1007.60" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1075.07" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="1142.53" y="712.20" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1210.00" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="1277.47" y="712.20" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1344.93" y="737.94" font-size="24" fill="#15364c" text-anchor="middle">0</text><rect x="1007.60" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1075.07" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="1142.53" y="751.80" width="131.93" height="36.60" rx="5" fill="#e8f2ee" stroke="#a5bdc8" /><text x="1210.00" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">1</text><rect x="1277.47" y="751.80" width="131.93" height="36.60" rx="5" fill="#f4f7f9" stroke="#a5bdc8" /><text x="1344.93" y="777.54" font-size="24" fill="#15364c" text-anchor="middle">1</text></g></g></svg>

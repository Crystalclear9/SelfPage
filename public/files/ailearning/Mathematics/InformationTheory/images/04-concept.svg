<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>协同与冗余是两个明确不同的生成模型</title><desc>左侧独立公平比特的异或，右侧同一公平目标的两个复制特征。图中只在有质量的点标出目标标签。</desc><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c" text-anchor="start" font-weight="600">同看两个特征：新增信息可能是 1 bit，也可能是 0</text><text x="60" y="112" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">蓝点 Y = 0；橙点 Y = 1；空心点在该模型中概率为零</text><text x="280" y="170" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">模型一：Y = X1 XOR X2</text><line x1="130" y1="475" x2="475" y2="475" stroke="#19333c" stroke-width="2"/><line x1="160" y1="500" x2="160" y2="185" stroke="#19333c" stroke-width="2"/><text x="440" y="515" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">X1</text><text x="130" y="225" font-size="26" fill="#19333c" text-anchor="end" font-weight="400">X2</text><text x="160" y="517" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">0</text><circle cx="160" cy="475" r="18" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="190" y="458" font-size="27" fill="#256b82" text-anchor="start" font-weight="400">Y = 0</text><circle cx="160" cy="230" r="18" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="190" y="213" font-size="27" fill="#c0643c" text-anchor="start" font-weight="400">Y = 1</text><text x="405" y="517" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">1</text><circle cx="405" cy="475" r="18" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="435" y="458" font-size="27" fill="#c0643c" text-anchor="start" font-weight="400">Y = 1</text><circle cx="405" cy="230" r="18" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="435" y="213" font-size="27" fill="#256b82" text-anchor="start" font-weight="400">Y = 0</text><text x="135" y="239" font-size="26" fill="#78878b" text-anchor="end" font-weight="400">1</text><text x="275" y="565" font-size="27" fill="#78878b" text-anchor="middle" font-weight="400">四个点各概率 0.25</text><text x="275" y="625" font-size="27" fill="#19333c" text-anchor="middle" font-weight="400">只知 X1：Y 仍有两种可能</text><text x="275" y="687" font-size="30" fill="#256b82" text-anchor="middle" font-weight="600">再知 X2：增加 1 bit</text><text x="900" y="170" font-size="29" fill="#19333c" text-anchor="middle" font-weight="400">模型二：X1 = X2 = Y</text><line x1="750" y1="475" x2="1095" y2="475" stroke="#19333c" stroke-width="2"/><line x1="780" y1="500" x2="780" y2="185" stroke="#19333c" stroke-width="2"/><text x="1060" y="515" font-size="26" fill="#19333c" text-anchor="start" font-weight="400">X1</text><text x="750" y="225" font-size="26" fill="#19333c" text-anchor="end" font-weight="400">X2</text><text x="780" y="517" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">0</text><circle cx="780" cy="475" r="18" fill="#256b82" stroke="#256b82" stroke-width="2"/><text x="810" y="458" font-size="27" fill="#256b82" text-anchor="start" font-weight="400">Y = 0</text><circle cx="780" cy="230" r="11" fill="white" stroke="#256b82" stroke-width="2"/><text x="1025" y="517" font-size="26" fill="#78878b" text-anchor="middle" font-weight="400">1</text><circle cx="1025" cy="475" r="11" fill="white" stroke="#c0643c" stroke-width="2"/><circle cx="1025" cy="230" r="18" fill="#c0643c" stroke="#c0643c" stroke-width="2"/><text x="1055" y="213" font-size="27" fill="#c0643c" text-anchor="start" font-weight="400">Y = 1</text><text x="755" y="239" font-size="26" fill="#78878b" text-anchor="end" font-weight="400">1</text><text x="895" y="565" font-size="27" fill="#78878b" text-anchor="middle" font-weight="400">两个实心点各概率 0.5</text><text x="895" y="625" font-size="27" fill="#19333c" text-anchor="middle" font-weight="400">只知 X1：Y 已被确定</text><text x="895" y="687" font-size="30" fill="#c0643c" text-anchor="middle" font-weight="600">再知 X2：增加 0 bit</text><text x="60" y="752" font-size="26" fill="#78878b" text-anchor="start" font-weight="400">右图重新定义了生成模型；若仍使用 XOR 并令 X2 = X1，则 Y 恒为 0。</text></g></svg>

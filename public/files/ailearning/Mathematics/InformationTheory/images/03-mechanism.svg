<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>按 token 归约与按序列归约的区别</title><desc>短序列有2个有效token，平均负对数损失为1；长序列有8个有效token，均值为3。序列等权得到2，token等权得到2.6。两种目标都可被明确定义，但它们回答不同问题，训练与报告时必须保持口径一致。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">按 token 归约与按序列归约的区别</text><text x="85" y="190" font-size="24" fill="#16344c" text-anchor="start">数值</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="512.8" width="145.0" height="97.2" fill="#2865a0" /><text x="207.5" y="496.7777777777778" font-size="24" fill="#16344c" text-anchor="middle">1</text><text x="207.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">短序列均值</text><rect x="370.0" y="318.3" width="145.0" height="291.7" fill="#cf7432" /><text x="442.5" y="302.3333333333333" font-size="24" fill="#16344c" text-anchor="middle">3</text><text x="442.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">长序列均值</text><rect x="605.0" y="415.6" width="145.0" height="194.4" fill="#627689" /><text x="677.5" y="399.55555555555554" font-size="24" fill="#16344c" text-anchor="middle">2</text><text x="677.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">序列等权均值</text><rect x="840.0" y="357.2" width="145.0" height="252.8" fill="#2865a0" /><text x="912.5" y="341.2222222222222" font-size="24" fill="#16344c" text-anchor="middle">2.6</text><text x="912.5" y="680" font-size="24" fill="#16344c" text-anchor="middle">token等权均值</text><text x="100" y="135" font-size="24" fill="#416478">长度2与8，单序列均值1与3</text></g></svg>

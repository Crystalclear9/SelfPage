<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img"><title>按词和按序列平均对应不同权重</title><desc>序列A有2个词每词损失1，序列B有8个词每词损失3；按词均值2.6，按序列均值2。</desc><rect width="1280" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="36" fill="#19333c" text-anchor="start" font-weight="600">一份日志，两种平均：先看每个词的权重</text><text x="60" y="112" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">块的高度是该词的负对数损失，单位 nat；宽度相同</text><text x="60" y="185" font-size="29" fill="#256b82" text-anchor="start" font-weight="400">A：2 个词</text><text x="570" y="185" font-size="29" fill="#c0643c" text-anchor="start" font-weight="400">B：8 个词</text><rect x="110" y="365" width="52" height="65" fill="#256b82" stroke="none" stroke-width="2"/><text x="136" y="350" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="136" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><rect x="180" y="365" width="52" height="65" fill="#256b82" stroke="none" stroke-width="2"/><text x="206" y="350" font-size="26" fill="#256b82" text-anchor="middle" font-weight="400">1</text><text x="206" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><line x1="95" y1="430" x2="250" y2="430" stroke="#19333c" stroke-width="2"/><rect x="570" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="596" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="596" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">1</text><rect x="640" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="666" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="666" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">2</text><rect x="710" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="736" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="736" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">3</text><rect x="780" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="806" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="806" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">4</text><rect x="850" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="876" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="876" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">5</text><rect x="920" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="946" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="946" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">6</text><rect x="990" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="1016" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="1016" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">7</text><rect x="1060" y="235" width="52" height="195" fill="#c0643c" stroke="none" stroke-width="2"/><text x="1086" y="220" font-size="26" fill="#c0643c" text-anchor="middle" font-weight="400">3</text><text x="1086" y="465" font-size="24" fill="#78878b" text-anchor="middle" font-weight="400">8</text><line x1="555" y1="430" x2="1130" y2="430" stroke="#19333c" stroke-width="2"/><text x="110" y="510" font-size="29" fill="#256b82" text-anchor="start" font-weight="400">总损失 2</text><text x="570" y="510" font-size="29" fill="#c0643c" text-anchor="start" font-weight="400">总损失 24</text><line x1="60" y1="548" x2="1220" y2="548" stroke="#dce4e5" stroke-width="2"/><text x="60" y="605" font-size="30" fill="#19333c" text-anchor="start" font-weight="400">按词平均</text><text x="340" y="585" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">2 + 24</text><line x1="286" y1="594" x2="394" y2="594" stroke="#19333c" stroke-width="2"/><text x="340" y="625" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">2 + 8</text><text x="425" y="605" font-size="30" fill="#256b82" text-anchor="start" font-weight="400">= 2.6 nat</text><text x="720" y="605" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">每个词权重相同</text><text x="60" y="695" font-size="30" fill="#19333c" text-anchor="start" font-weight="400">按序列平均</text><text x="340" y="675" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">1 + 3</text><line x1="295" y1="684" x2="385" y2="684" stroke="#19333c" stroke-width="2"/><text x="340" y="715" font-size="26" fill="#19333c" text-anchor="middle" font-weight="400">2</text><text x="425" y="695" font-size="30" fill="#c0643c" text-anchor="start" font-weight="400">= 2 nat</text><text x="720" y="695" font-size="27" fill="#78878b" text-anchor="start" font-weight="400">短序列中单词权重更大</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="621" viewBox="0 0 1200 621" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">两条合法路径可以产生同一字符串</title>
<desc id="fig-desc">词表中 AB 解码为 ab；逐路径相乘，再对同一解码结果求和。</desc>
<rect x="0" y="0" width="1200" height="621" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">先乘路径概率，再合并同文结果</text>
<text x="74" y="126" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">完整路径</text>
<text x="597" y="126" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">路径概率</text>
<text x="831" y="126" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">解码文本</text>
<path d="M75 202 L90 159 L196 159 L181 202 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135.5" y="188.2" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">AB</text>
<path d="M198 180 L220 180" fill="none" stroke="#166d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M220 180 L209 185 L209 175 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M226 202 L241 159 L347 159 L332 202 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286.5" y="188.2" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">EOS</text>
<text x="538" y="191" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">0.4 × 1 = 0.4</text>
<path d="M758 181 L826 236" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M826 236 L814.303 232.97 L820.592 225.195 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 311 L90 268 L196 268 L181 311 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135.5" y="297.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">A</text>
<path d="M198 289 L220 289" fill="none" stroke="#6e618e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M220 289 L209 294 L209 284 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M226 311 L241 268 L347 268 L332 311 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286.5" y="297.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">B</text>
<path d="M349 289 L371 289" fill="none" stroke="#6e618e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M371 289 L360 294 L360 284 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M377 311 L392 268 L498 268 L483 311 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="437.5" y="297.2" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">EOS</text>
<text x="538" y="300" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">0.6 × 0.5 × 1 = 0.3</text>
<path d="M758 290 L826 236" fill="none" stroke="#6e618e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M826 236 L820.495 246.756 L814.276 238.925 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 420 L90 377 L196 377 L181 420 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135.5" y="406.2" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">A</text>
<path d="M198 398 L220 398" fill="none" stroke="#a74d3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M220 398 L209 403 L209 393 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M226 420 L241 377 L347 377 L332 420 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286.5" y="406.2" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">EOS</text>
<text x="538" y="409" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">0.6 × 0.5 = 0.3</text>
<path d="M758 399 L826 399" fill="none" stroke="#a74d3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M826 399 L815 404 L815 394 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M833 264 L860 209 L1080 209 L1053 264 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="956.5" y="245.25" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">ab · 0.7</text>
<path d="M833 432 L860 377 L1080 377 L1053 432 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="956.5" y="413.25" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">a · 0.3</text>
<path d="M75 476 L1125 476" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="523" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">把 [AB, EOS] 单独计分只得到 0.4。</text>
<text x="74" y="574" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">完整文本事件 ab 包含两条路径，质量为 0.4 + 0.3。</text>
</svg>

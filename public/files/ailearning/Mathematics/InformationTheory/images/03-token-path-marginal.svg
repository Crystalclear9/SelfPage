<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="606.0777" viewBox="36.2667 83.2000 1207.4667 571.7333" role="img"><title>同一字符串可以由不同 token 路径生成</title><rect width="1280" height="730" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="70" y="130" font-size="29" fill="#19333c" text-anchor="start">合法生成树：所有分支最终终止</text><rect x="95" y="327" width="110" height="56" fill="#f0f5f6" /><text x="150" y="365" font-size="28" fill="#19333c" text-anchor="middle">BOS</text><rect x="385" y="197" width="110" height="56" fill="#f0f5f6" /><text x="440" y="235" font-size="28" fill="#256b82" text-anchor="middle">AB</text><rect x="385" y="442" width="110" height="56" fill="#f0f5f6" /><text x="440" y="480" font-size="28" fill="#256b82" text-anchor="middle">A</text><rect x="680" y="197" width="110" height="56" fill="#f0f5f6" /><text x="735" y="235" font-size="28" fill="#256b82" text-anchor="middle">EOS</text><rect x="680" y="377" width="110" height="56" fill="#f0f5f6" /><text x="735" y="415" font-size="28" fill="#256b82" text-anchor="middle">B</text><rect x="680" y="532" width="110" height="56" fill="#f0f5f6" /><text x="735" y="570" font-size="28" fill="#256b82" text-anchor="middle">EOS</text><rect x="970" y="377" width="110" height="56" fill="#f0f5f6" /><text x="1025" y="415" font-size="28" fill="#256b82" text-anchor="middle">EOS</text><line x1="205" y1="330" x2="385" y2="245" stroke="#256b82" stroke-width="3" /><text x="285" y="260" font-size="26" fill="#256b82" text-anchor="start">0.4</text><line x1="205" y1="380" x2="385" y2="450" stroke="#c0643c" stroke-width="3" /><text x="285" y="450" font-size="26" fill="#c0643c" text-anchor="start">0.6</text><line x1="495" y1="225" x2="680" y2="225" stroke="#256b82" stroke-width="3" /><text x="585" y="202" font-size="26" fill="#256b82" text-anchor="start">1</text><line x1="495" y1="458" x2="680" y2="415" stroke="#c0643c" stroke-width="3" /><text x="580" y="405" font-size="26" fill="#c0643c" text-anchor="start">0.5</text><line x1="495" y1="490" x2="680" y2="548" stroke="#71858b" stroke-width="3" /><text x="580" y="555" font-size="26" fill="#50636e" text-anchor="start">0.5</text><line x1="790" y1="405" x2="970" y2="405" stroke="#c0643c" stroke-width="3" /><text x="870" y="382" font-size="26" fill="#c0643c" text-anchor="start">1</text><text x="1025" y="225" font-size="28" fill="#256b82" text-anchor="middle">“ab”  概率 0.4</text><text x="1025" y="475" font-size="28" fill="#c0643c" text-anchor="middle">“ab”  概率 0.3</text><text x="960" y="580" font-size="28" fill="#50636e" text-anchor="middle">“a”  概率 0.3</text><line x1="60" y1="630" x2="1220" y2="630" stroke="#dbe5e8" stroke-width="2" /></g><desc> 同一字符串可以由不同 token 路径生成 规范路径 [AB, EOS]：0.4；完整字符串“ab”：0.4 + 0.6 × 0.5 = 0.7。</desc></svg>

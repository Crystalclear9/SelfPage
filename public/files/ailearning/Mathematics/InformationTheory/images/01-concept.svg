<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">从前缀路径到平均信息</title><desc id="desc">三种符号的概率分别为二分之一、四分之一、四分之一。码字0、10、11的长度为1、2、2比特。矩形高度表示概率，宽度表示码长，三块面积各为半比特，总平均长度为1.5比特。</desc><rect width="1400" height="820" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20343d">
<text x="56" y="62" font-size="38" fill="#20343d" text-anchor="start" font-weight="600">常见符号走短路，平均码长看面积</text>
<text x="56" y="111" font-size="27" fill="#667e89" text-anchor="start" font-weight="400">A、B、C 的概率固定；每次走一条二元分支，写下一位。</text>
<text x="56" y="178" font-size="29" fill="#20343d" text-anchor="start" font-weight="600">前缀路径</text>
<text x="715" y="178" font-size="29" fill="#20343d" text-anchor="start" font-weight="600">概率 × 码长</text>
<line x1="100" y1="352" x2="290" y2="252" stroke="#147d92" stroke-width="4"/>
<line x1="100" y1="352" x2="290" y2="452" stroke="#667e89" stroke-width="4"/>
<line x1="290" y1="452" x2="500" y2="402" stroke="#bf7b2e" stroke-width="4"/>
<line x1="290" y1="452" x2="500" y2="512" stroke="#78689b" stroke-width="4"/>
<circle cx="290" cy="252" r="29" fill="white" stroke="#147d92" stroke-width="3"/>
<text x="290" y="262" font-size="30" fill="#147d92" text-anchor="middle" font-weight="600">A</text>
<circle cx="500" cy="402" r="29" fill="white" stroke="#bf7b2e" stroke-width="3"/>
<text x="500" y="412" font-size="30" fill="#bf7b2e" text-anchor="middle" font-weight="600">B</text>
<circle cx="500" cy="512" r="29" fill="white" stroke="#78689b" stroke-width="3"/>
<text x="500" y="522" font-size="30" fill="#78689b" text-anchor="middle" font-weight="600">C</text>
<circle cx="100" cy="352" r="8" fill="#667e89" stroke="none" stroke-width="3"/>
<circle cx="290" cy="452" r="7" fill="#667e89" stroke="none" stroke-width="3"/>
<text x="185" y="285" font-size="29" fill="#667e89" text-anchor="start" font-weight="400">0</text>
<text x="185" y="435" font-size="29" fill="#667e89" text-anchor="start" font-weight="400">1</text>
<text x="390" y="405" font-size="29" fill="#667e89" text-anchor="start" font-weight="400">0</text>
<text x="390" y="505" font-size="29" fill="#667e89" text-anchor="start" font-weight="400">1</text>
<text x="340" y="262" font-size="28" fill="#147d92" text-anchor="start" font-weight="400">码字 0</text>
<text x="546" y="412" font-size="28" fill="#bf7b2e" text-anchor="start" font-weight="400">10</text>
<text x="546" y="522" font-size="28" fill="#78689b" text-anchor="start" font-weight="400">11</text>
<text x="56" y="582" font-size="26" fill="#667e89" text-anchor="start" font-weight="400">到达叶子就结束一个符号</text>
<text x="725" y="320.0" font-size="29" fill="#147d92" text-anchor="start" font-weight="600">A</text>
<text x="775" y="300.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="762" y1="307.0" x2="788" y2="307.0" stroke="#20343d" stroke-width="1.5"/>
<text x="775" y="335.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">2</text>
<rect x="810" y="230" width="170" height="160" fill="#147d92" stroke="none" stroke-width="2"/>
<text x="895.0" y="322.0" font-size="36" fill="white" text-anchor="middle" font-weight="600">0</text>
<text x="1190" y="320.0" font-size="27" fill="#147d92" text-anchor="start" font-weight="400">0.5 bit</text>
<text x="725" y="440.0" font-size="29" fill="#bf7b2e" text-anchor="start" font-weight="600">B</text>
<text x="775" y="420.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="762" y1="427.0" x2="788" y2="427.0" stroke="#20343d" stroke-width="1.5"/>
<text x="775" y="455.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">4</text>
<rect x="810" y="390" width="340" height="80" fill="#bf7b2e" stroke="none" stroke-width="2"/>
<text x="895.0" y="442.0" font-size="36" fill="white" text-anchor="middle" font-weight="600">1</text>
<line x1="980" y1="390" x2="980" y2="470" stroke="white" stroke-width="2"/>
<text x="1065.0" y="442.0" font-size="36" fill="white" text-anchor="middle" font-weight="600">0</text>
<text x="1190" y="440.0" font-size="27" fill="#bf7b2e" text-anchor="start" font-weight="400">0.5 bit</text>
<text x="725" y="520.0" font-size="29" fill="#78689b" text-anchor="start" font-weight="600">C</text>
<text x="775" y="500.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">1</text>
<line x1="762" y1="507.0" x2="788" y2="507.0" stroke="#20343d" stroke-width="1.5"/>
<text x="775" y="535.0" font-size="26" fill="#20343d" text-anchor="middle" font-weight="400">4</text>
<rect x="810" y="470" width="340" height="80" fill="#78689b" stroke="none" stroke-width="2"/>
<text x="895.0" y="522.0" font-size="36" fill="white" text-anchor="middle" font-weight="600">1</text>
<line x1="980" y1="470" x2="980" y2="550" stroke="white" stroke-width="2"/>
<text x="1065.0" y="522.0" font-size="36" fill="white" text-anchor="middle" font-weight="600">1</text>
<text x="1190" y="520.0" font-size="27" fill="#78689b" text-anchor="start" font-weight="400">0.5 bit</text>
<line x1="810" y1="567" x2="1150" y2="567" stroke="#667e89" stroke-width="2"/>
<line x1="810" y1="561" x2="810" y2="574" stroke="#667e89" stroke-width="2"/>
<text x="810" y="608" font-size="25" fill="#667e89" text-anchor="middle" font-weight="400">0</text>
<line x1="980" y1="561" x2="980" y2="574" stroke="#667e89" stroke-width="2"/>
<text x="980" y="608" font-size="25" fill="#667e89" text-anchor="middle" font-weight="400">1</text>
<line x1="1150" y1="561" x2="1150" y2="574" stroke="#667e89" stroke-width="2"/>
<text x="1150" y="608" font-size="25" fill="#667e89" text-anchor="middle" font-weight="400">2</text>
<text x="1168" y="608" font-size="25" fill="#667e89" text-anchor="start" font-weight="400">码长 / bit</text>
<text x="815" y="657" font-size="30" fill="#20343d" text-anchor="start" font-weight="600">总面积 = 平均码长 = 1.5 bit</text>
<line x1="56" y1="695" x2="1344" y2="695" stroke="#dce4e7" stroke-width="2"/>
<text x="56" y="749" font-size="27" fill="#20343d" text-anchor="start" font-weight="600">一次具体编码</text>
<text x="300" y="749" font-size="32" fill="#147d92" text-anchor="start" font-weight="400">A A B C</text>
<text x="485" y="749" font-size="32" fill="#667e89" text-anchor="start" font-weight="400">→</text>
<text x="550" y="749" font-size="32" fill="#20343d" text-anchor="start" font-weight="400">0 | 0 | 10 | 11</text>
<text x="870" y="749" font-size="32" fill="#667e89" text-anchor="start" font-weight="400">→</text>
<text x="945" y="749" font-size="32" fill="#20343d" text-anchor="start" font-weight="600">001011</text>
<text x="1130" y="749" font-size="28" fill="#667e89" text-anchor="start" font-weight="400">共 6 bit</text></g></svg>

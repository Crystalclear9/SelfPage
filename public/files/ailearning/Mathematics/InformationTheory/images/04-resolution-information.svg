<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727.4021" viewBox="38.0000 63.3333 1124.0000 681.3333" role="img"><title>均匀边缘下分箱精度与连续互信息</title><rect width="1200" height="820" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="108" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">X 与 Y 都在 [0, 1) 均匀分布；Y 保留 X 的分箱编号</text><text x="305.0" y="156" font-size="30" fill="#22364a" text-anchor="middle" font-weight="bold">2 个等宽分箱</text><rect x="140.0" y="355.0" width="165.0" height="165.0" fill="#b8d5ec" /><rect x="305.0" y="190.0" width="165.0" height="165.0" fill="#b8d5ec" /><line x1="140.0" y1="190" x2="140.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="140" y1="190.0" x2="470" y2="190.0" stroke="#dce5ee" stroke-width="2" /><line x1="305.0" y1="190" x2="305.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="140" y1="355.0" x2="470" y2="355.0" stroke="#dce5ee" stroke-width="2" /><line x1="470.0" y1="190" x2="470.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="140" y1="520.0" x2="470" y2="520.0" stroke="#dce5ee" stroke-width="2" /><line x1="140" y1="520" x2="490" y2="520" stroke="#22364a" stroke-width="2" /><line x1="140" y1="520" x2="140" y2="178" stroke="#22364a" stroke-width="2" /><text x="140" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="305.0" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0.5</text><text x="126" y="364.0" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">0.5</text><text x="470" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="126" y="199" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">1</text><text x="500" y="529" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">X</text><text x="136" y="168" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">Y</text><text x="305.0" y="588" font-size="26" fill="#22364a" text-anchor="middle" font-weight="normal">蓝色区域密度 = 2；其余为 0</text><text x="305.0" y="641" font-size="30" fill="#2666a4" text-anchor="middle" font-weight="bold">真实互信息 = 1 bit</text><text x="305.0" y="688" font-size="25" fill="#c86d31" text-anchor="middle" font-weight="normal">套用高斯相关公式：0.5963 bit</text><text x="895.0" y="156" font-size="30" fill="#22364a" text-anchor="middle" font-weight="bold">8 个等宽分箱</text><rect x="730.0" y="478.75" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="771.25" y="437.5" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="812.5" y="396.25" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="853.75" y="355.0" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="895.0" y="313.75" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="936.25" y="272.5" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="977.5" y="231.25" width="41.25" height="41.25" fill="#b8d5ec" /><rect x="1018.75" y="190.0" width="41.25" height="41.25" fill="#b8d5ec" /><line x1="730.0" y1="190" x2="730.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="190.0" x2="1060" y2="190.0" stroke="#dce5ee" stroke-width="2" /><line x1="771.25" y1="190" x2="771.25" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="231.25" x2="1060" y2="231.25" stroke="#dce5ee" stroke-width="2" /><line x1="812.5" y1="190" x2="812.5" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="272.5" x2="1060" y2="272.5" stroke="#dce5ee" stroke-width="2" /><line x1="853.75" y1="190" x2="853.75" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="313.75" x2="1060" y2="313.75" stroke="#dce5ee" stroke-width="2" /><line x1="895.0" y1="190" x2="895.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="355.0" x2="1060" y2="355.0" stroke="#dce5ee" stroke-width="2" /><line x1="936.25" y1="190" x2="936.25" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="396.25" x2="1060" y2="396.25" stroke="#dce5ee" stroke-width="2" /><line x1="977.5" y1="190" x2="977.5" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="437.5" x2="1060" y2="437.5" stroke="#dce5ee" stroke-width="2" /><line x1="1018.75" y1="190" x2="1018.75" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="478.75" x2="1060" y2="478.75" stroke="#dce5ee" stroke-width="2" /><line x1="1060.0" y1="190" x2="1060.0" y2="520" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="520.0" x2="1060" y2="520.0" stroke="#dce5ee" stroke-width="2" /><line x1="730" y1="520" x2="1080" y2="520" stroke="#22364a" stroke-width="2" /><line x1="730" y1="520" x2="730" y2="178" stroke="#22364a" stroke-width="2" /><text x="730" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="895.0" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0.5</text><text x="716" y="364.0" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">0.5</text><text x="1060" y="554" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="716" y="199" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">1</text><text x="1090" y="529" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">X</text><text x="726" y="168" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">Y</text><text x="895.0" y="588" font-size="26" fill="#22364a" text-anchor="middle" font-weight="normal">蓝色区域密度 = 8；其余为 0</text><text x="895.0" y="641" font-size="30" fill="#2666a4" text-anchor="middle" font-weight="bold">真实互信息 = 3 bit</text><text x="895.0" y="688" font-size="25" fill="#c86d31" text-anchor="middle" font-weight="normal">套用高斯相关公式：2.5057 bit</text><line x1="60" y1="721" x2="1140" y2="721" stroke="#dce5ee" stroke-width="2" /></g><desc> 连续互信息：边缘不变，分辨率增加 分箱越细，联合质量越贴近对角线；无噪连续复制的互信息为无穷大。</desc></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>困惑度把不同的逐词难度，改写成相同的每步难度</title><rect width="1280" height="850" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">困惑度把不同的逐词难度，改写成相同的每步难度</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">三个真实目标的条件概率依次为二分之一、四分之一、二分之一；对数使用自然底</text><text x="65" y="190" font-size="28" fill="#20343e" text-anchor="start">原始三个条件概率：每一步的损失不同</text><rect x="120" y="255" width="257.0" height="100" fill="#216983"/><text x="250.0" y="318" font-size="28" fill="white" text-anchor="middle">0.693147</text><text x="250.0" y="405" font-size="27" fill="#216983" text-anchor="middle">目标 1</text><rect x="380.0" y="255" width="517.0" height="100" fill="#bc5b32"/><text x="640.0" y="318" font-size="28" fill="white" text-anchor="middle">1.386294</text><text x="640.0" y="405" font-size="27" fill="#bc5b32" text-anchor="middle">目标 2</text><rect x="900.0" y="255" width="257.0" height="100" fill="#458a7e"/><text x="1030.0" y="318" font-size="28" fill="white" text-anchor="middle">0.693147</text><text x="1030.0" y="405" font-size="27" fill="#458a7e" text-anchor="middle">目标 3</text><text x="65" y="480" font-size="28" fill="#20343e" text-anchor="start">改成相同概率：每步损失都为平均值</text><rect x="120.0" y="545" width="343.6666666666667" height="100" fill="#216983"/><text x="293.33333333333337" y="608" font-size="28" fill="white" text-anchor="middle">0.924196</text><rect x="466.6666666666667" y="545" width="343.6666666666667" height="100" fill="#bc5b32"/><text x="640.0" y="608" font-size="28" fill="white" text-anchor="middle">0.924196</text><rect x="813.3333333333334" y="545" width="343.6666666666667" height="100" fill="#458a7e"/><text x="986.6666666666667" y="608" font-size="28" fill="white" text-anchor="middle">0.924196</text><text x="65" y="725" font-size="27" fill="#20343e" text-anchor="start">两排总损失都为 ln 16 ≈ 2.772589；下排每步真实词概率约 0.396850。</text><text x="65" y="795" font-size="27" fill="#20343e" text-anchor="start">其倒数即 PPL ≈ 2.519842；它没有改变实际模型，也不把候选词变成等概率。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>标签平滑改变概率目标而非只改梯度大小</title><desc>二分类硬标签为(1,0)，与均匀分布按ε=0.2混合后变成(0.9,0.1)。在能自由选择概率的单样本模型里，交叉熵最小点从第一类概率1移到0.9，因此平滑确实改变最优预测目标。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="120" y1="235.000" x2="1060" y2="235.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="335.000" x2="1060" y2="335.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="435.000" x2="1060" y2="435.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="535.000" x2="1060" y2="535.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="120" y1="635.000" x2="1060" y2="635.000" stroke="#e1eaf0" stroke-width="2.5" /><line x1="820.919" y1="235" x2="820.919" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="580.878" y1="235" x2="580.878" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><line x1="340.838" y1="235" x2="340.838" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">标签平滑改变概率目标而非只改梯度大小</text><line x1="120" y1="635" x2="1060" y2="635" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="235" x2="120" y2="635" stroke="#2865a0" stroke-width="3" /><text x="1060" y="205" font-size="24" fill="#456679" text-anchor="end">横轴：p1</text><text x="120" y="223" font-size="24" fill="#193e54" text-anchor="start">交叉熵（nat）</text><line x1="90" y1="130" x2="140" y2="130" stroke="#1977b4" stroke-width="2.5" /><text x="155" y="138" font-size="24" fill="#1977b4" text-anchor="start">硬标签交叉熵</text><polyline points="120.00,243.80 122.35,255.34 124.70,265.69 127.05,275.07 129.40,283.64 131.75,291.54 134.10,298
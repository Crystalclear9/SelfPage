<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="extra-title">置换参照区分偶然关联与真实证据</title><desc id="extra-desc">图使用本章另一个图中已列出的八条二元观测，其列联表为 \left[\begin{smallmatrix}3&amp;1\\1&amp;3\end{smallmatrix}\right]；行列边际都为四。经验互信息为 I_{\rm obs}=1-H_2(\frac{1}{4})\approx0.1887219 bit，确实大于零。但“经验互信息大于零”不等于已获得拒绝独立性的证据：有限样本在独立零假设下也常出现不均匀的表格。

固定 X 和四个零、四个一的 Y 边际，合法重排共有 \binom84=70 种等可能的不同标签分配。若左上格为 k，表格必为 \left[\begin{smallmatrix}k&amp;4-k\\4-k&amp;k\end{smallmatrix}\right]，对应分配数是 \binom4k^2。于是 k=2 给出 36 种、互信息为零；k=1,3 合计 32 种、互信息等于观测值；k=0,4 合计两种、互信息为 1 bit。柱高为分配频率，**不是连续概率密度**，不能拿平滑正态曲线替代这个小样本零分布。

以“互信息至少同样大”为预先指定的极端方向，精确置换 p 值为 \frac{32+2}{70}=\frac{17}{35}\approx0.4857；需要计入与观测值相等的统计量。这里全部合法分配已经枚举，不再给分子分母额外加一。较大的 p 值不证明独立；它只是说明本例的观测关联在该参照下并不罕见。合法置换还依赖样本身份和零假设：时间或分组数据不应任意打散，筛选多个特征后也要处理选择。关联检验的配对重排与精确枚举约定见 [SciPy 官方 permutation_test 文档](https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.permutation_test.html)。</desc><rect width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">置换参照区分偶然关联与真实证据</text><text x="85" y="105" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">固定边际后，零分布是离散的</text><line x1="85" y1="555.0" x2="705" y2="555.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="563.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="431.66666666666663" x2="705" y2="431.66666666666663" stroke="#dce5ed" stroke-width="2" /><text x="73" y="439.66666666666663" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.2</text><line x1="85" y1="308.3333333333333" x2="705" y2="308.3333333333333" stroke="#dce5ed" stroke-width="2" /><text x="73" y="316.3333333333333" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.4</text><line x1="85" y1="185.0" x2="705" y2="185.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="193.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.6</text><line x1="85" y1="185" x2="85" y2="555" stroke="#627689" stroke-width="2" /><line x1="85" y1="555" x2="705" y2="555" stroke="#627689" stroke-width="2" /><line x1="136.66666666666666" y1="555.0" x2="136.66666666666666" y2="561.0" stroke="#627689" stroke-width="2" /><text x="136.66666666666666" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="653.3333333333333" y1="555.0" x2="653.3333333333333" y2="561.0" stroke="#627689" stroke-width="2" /><text x="653.3333333333333" y="587.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><rect x="114.66666666666666" y="237.8571428571429" width="44" height="317.1428571428571" fill="#2865a0" /><text x="136.66666666666666" y="219.8571428571429" font-size="25" fill="#2865a0" text-anchor="middle" font-weight="400">36 种</text><rect x="212.17296902944798" y="273.09523809523813" width="44" height="281.90476190476187" fill="#cf7432" /><text x="234.17296902944798" y="255.09523809523813" font-size="25" fill="#cf7432" text-anchor="middle" font-weight="400">32 种</text><rect x="631.3333333333333" y="537.3809523809524" width="44" height="17.619047619047592" fill="#cf7432" /><text x="653.3333333333333" y="519.3809523809524" font-size="25" fill="#cf7432" text-anchor="middle" font-weight="400">2 种</text><line x1="234.17296902944798" y1="555.0" x2="234.17296902944798" y2="563.0" stroke="#cf7432" stroke-width="2" /><text x="245" y="605" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">观测值 0.1887 bit</text><text x="85" y="165" font-size="25" fill="#627689" text-anchor="start" font-weight="400">置换频率（共 70 种分配）</text><text x="85" y="670" font-size="27" fill="#213447" text-anchor="start" font-weight="400">互信息 I（bit）；橙色表示 ≥ 观测值</text><text x="820" y="105" font-size="27" fill="#213447" text-anchor="start" font-weight="400">原始列联表：8 条观测</text><text x="920" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">Y=0</text><text x="1040" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">Y=1</text><text x="820" y="230" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">X=0</text><rect x="870" y="190" width="100" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="920.0" y="235.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><rect x="990" y="190" width="100" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1040.0" y="235.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="820" y="320" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">X=1</text><rect x="870" y="280" width="100" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="920.0" y="325.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="990" y="280" width="100" height="70" rx="6" fill="#eaf2fa" stroke="#dce5ed" stroke-width="1.5" /><text x="1040.0" y="325.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><text x="820" y="440" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">尾部：32 + 2 = 34 种</text><text x="820" y="505" font-size="27" fill="#213447" text-anchor="start" font-weight="400">精确置换 p 值</text><text x="900.0" y="548" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">34</text><line x1="855" y1="560" x2="945" y2="560" stroke="#cf7432" stroke-width="1.7" /><text x="900.0" y="594" font-size="28" fill="#cf7432" text-anchor="middle" font-weight="400">70</text><text x="970" y="575" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">≈ 0.486</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688.5751" viewBox="67.3333 96.6667 1038.6667 596.0000" role="img"><title>交换 KL 的两个分布会改变代价</title><desc>固定二元分布 p=(0.1,0.9)，让 q 的第一类概率在零到一之间变化。两条曲线在 q=p 时都为零，但偏离后形状并不对称：真实概率与用于比较的概率在 KL 中承担不同角色，因此交换位置会改变对低估事件的惩罚。 交换 KL 的两个分布会改变代价</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.01</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.206</text><line x1="496.0" y1="235" x2="496.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="496.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.402</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.598</text><line x1="872.0" y1="235" x2="872.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="872.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.794</text><line x1="1060.0000000000002" y1="235" x2="1060.0000000000002" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0000000000002" y="671" font-size="24" fill="#16344c" text-anchor="middle">0.99</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="24" fill="#16344c" text-anchor="end">0</text><line x1="120" y1="535.0" x2="1060" y2="535.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="542.0" font-size="24" fill="#16344c
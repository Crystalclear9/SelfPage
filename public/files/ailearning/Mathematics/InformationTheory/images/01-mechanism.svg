<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>一棵可以即时译码的二元前缀树</title><desc>三种符号的概率依次为0.5、0.25和0.25，分配码字0、10、11。没有一个码字是另一个码字的前缀，所以沿树遇到叶节点即可输出符号，再回到根继续读比特。平均码长为1.5 bit，恰好等于这组分布的熵。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">一棵可以即时译码的二元前缀树</text><circle cx="600" cy="190" r="32" fill="#daedf8" stroke="#5597b5" /><text x="600" y="198" font-size="24" fill="#16344c" text-anchor="middle">根</text><circle cx="350" cy="390" r="32" fill="#daedf8" stroke="#5597b5" /><text x="350" y="398" font-size="24" fill="#16344c" text-anchor="middle">A</text><circle cx="850" cy="390" r="32" fill="#daedf8" stroke="#5597b5" /><text x="850" y="398" font-size="24" fill="#16344c" text-anchor="middle" /><circle cx="700" cy="600" r="32" fill="#daedf8" stroke="#5597b5" /><text x="700" y="608" font-size="24" fill="#16344c" text-anchor="middle">B</text><circle cx="1010" cy="600" r="32" fill="#daedf8" stroke="#5597b5" /><text x="1010" y="608" font-size="24" fill="#16344c" text-anchor="middle">C</text><path d="M570,215 L370,360" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M630,215 L830,360" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M830,420 L720,565" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M870,420 L990,565" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="410" y="280" font-size="24" fill="#16344c" text-anchor="start">0</text><text x="760" y="280" font-size="24" fill="#16344c" text-anchor="start">1</text><text x="735" y="490" font-size="24" fill="#16344c" text-anchor="start">0</text><text x="950" y="490" font-size="24" fill="#16344c" text-anchor="start">1</text><text x="250" y="460" font-size="24" fill="#16344c" text-anchor="start">A：码字0；概率0.5</text><text x="580" y="680" font-size="24" fill="#16344c" text-anchor="start">B：10；概率0.25</text><text x="900" y="680" font-size="24" fill="#16344c" text-anchor="start">C：11；概率0.25</text></g></svg>

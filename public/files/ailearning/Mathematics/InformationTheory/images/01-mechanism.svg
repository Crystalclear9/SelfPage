<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img"><title>Huffman 的合并队列，怎样变成一棵可译码的树？</title><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei, Arial, sans-serif"><text x="54" y="60" font-size="34" fill="#20343e" text-anchor="start">Huffman 的合并队列，怎样变成一棵可译码的树？</text><text x="54" y="105" font-size="25" fill="#627882" text-anchor="start">同一概率 (0.4, 0.3, 0.2, 0.1)；左边从小到大合并，右边从根到叶读码</text><text x="60" y="165" font-size="26" fill="#20343e" text-anchor="start">初始队列</text><rect x="60" y="200" width="47.0" height="45" fill="#f5e5dc"/><text x="85.0" y="231" font-size="25" fill="#bc5b32" text-anchor="middle">0.1</text><text x="85.0" y="277" font-size="25" fill="#bc5b32" text-anchor="middle">D</text><rect x="110.0" y="200" width="97.0" height="45" fill="#f5e5dc"/><text x="160.0" y="231" font-size="25" fill="#bc5b32" text-anchor="middle">0.2</text><text x="160.0" y="277" font-size="25" fill="#bc5b32" text-anchor="middle">C</text><rect x="210.0" y="200" width="147.0" height="45" fill="#e7f0f4"/><text x="285.0" y="231" font-size="25" fill="#216983" text-anchor="middle">0.3</text><text x="285.0" y="277" font-size="25" fill="#216983" text-anchor="middle">B</text><rect x="360.0" y="200" width="197.0" height="45" fill="#e7f0f4"/><text x="460.0" y="231" font-size="25" fill="#216983" text-anchor="middle">0.4</text><text x="460.0" y="277" font-size="25" fill="#216983" text-anchor="middle">A</text><text x="60" y="320" font-size="26" fill="#20343e" text-anchor="start">合并 D、C</text><rect x="60" y="355" width="147.0" height="45" fill="#f5e5dc"/><text x="135.0" y="386" font-size="25" fill="#bc5b32" text-anchor="middle">0.3</text><text x="135.0" y="432" font-size="25" fill="#bc5b32" text-anchor="middle">CD</text><rect x="210.0" y="355" width="147.0" height="45" fill="#f5e5dc"/><text x="285.0" y="386" font-size="25" fill="#bc5b32" text-anchor="middle">0.3</text><text x="285.0" y="432" font-size="25" fill="#bc5b32" text-anchor="middle">B</text><rect x="360.0" y="355" width="197.0" height="45" fill="#e7f0f4"/><text x="460.0" y="386" font-size="25" fill="#216983" text-anchor="middle">0.4</text><text x="460.0" y="432" font-size="25" fill="#216983" text-anchor="middle">A</text><text x="60" y="475" font-size="26" fill="#20343e" text-anchor="start">合并 CD、B</text><rect x="60" y="510" width="197.0" height="45" fill="#f5e5dc"/><text x="160.0" y="541" font-size="25" fill="#bc5b32" text-anchor="middle">0.4</text><text x="160.0" y="587" font-size="25" fill="#bc5b32" text-anchor="middle">A</text><rect x="260.0" y="510" width="297.0" height="45" fill="#f5e5dc"/><text x="410.0" y="541" font-size="25" fill="#bc5b32" text-anchor="middle">0.6</text><text x="410.0" y="587" font-size="25" fill="#bc5b32" text-anchor="middle">BCD</text><text x="60" y="630" font-size="26" fill="#20343e" text-anchor="start">最后合并</text><rect x="60" y="665" width="497" height="45" fill="#e7f0f4"/><text x="310.0" y="696" font-size="25" fill="#216983" text-anchor="middle">1</text><text x="310.0" y="742" font-size="25" fill="#216983" text-anchor="middle">ABCD</text><line x1="820" y1="210" x2="690" y2="640" stroke="#216983" stroke-width="3"/><text x="763.0" y="425.0" font-size="25" fill="#bc5b32" text-anchor="start">0</text><line x1="820" y1="210" x2="1030" y2="320" stroke="#216983" stroke-width="3"/><text x="933.0" y="265.0" font-size="25" fill="#bc5b32" text-anchor="start">1</text><line x1="1030" y1="320" x2="930" y2="640" stroke="#216983" stroke-width="3"/><text x="988.0" y="480.0" font-size="25" fill="#bc5b32" text-anchor="start">0</text><line x1="1030" y1="320" x2="1150" y2="450" stroke="#216983" stroke-width="3"/><text x="1098.0" y="385.0" font-size="25" fill="#bc5b32" text-anchor="start">1</text><line x1="1150" y1="450" x2="1090" y2="640" stroke="#216983" stroke-width="3"/><text x="1128.0" y="545.0" font-size="25" fill="#bc5b32" text-anchor="start">0</text><line x1="1150" y1="450" x2="1220" y2="640" stroke="#216983" stroke-width="3"/><text x="1193.0" y="545.0" font-size="25" fill="#bc5b32" text-anchor="start">1</text><circle cx="820" cy="210" r="24" fill="white" stroke="#216983" stroke-width="2"/><text x="820" y="218" font-size="24" fill="#216983" text-anchor="middle">1.0</text><circle cx="1030" cy="320" r="24" fill="white" stroke="#216983" stroke-width="2"/><text x="1030" y="328" font-size="24" fill="#216983" text-anchor="middle">0.6</text><circle cx="1150" cy="450" r="24" fill="white" stroke="#216983" stroke-width="2"/><text x="1150" y="458" font-size="24" fill="#216983" text-anchor="middle">0.3</text><circle cx="690" cy="640" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="690" y="688" font-size="25" fill="#20343e" text-anchor="middle">A 0.4</text><text x="690" y="733" font-size="30" fill="#216983" text-anchor="middle">0</text><circle cx="930" cy="640" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="930" y="688" font-size="25" fill="#20343e" text-anchor="middle">B 0.3</text><text x="930" y="733" font-size="30" fill="#216983" text-anchor="middle">10</text><circle cx="1090" cy="640" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="1090" y="688" font-size="25" fill="#20343e" text-anchor="middle">C 0.2</text><text x="1090" y="733" font-size="30" fill="#216983" text-anchor="middle">110</text><circle cx="1220" cy="640" r="7" fill="#216983" stroke="#216983" stroke-width="2"/><text x="1220" y="688" font-size="25" fill="#20343e" text-anchor="middle">D 0.1</text><text x="1220" y="733" font-size="30" fill="#216983" text-anchor="middle">111</text><text x="60" y="835" font-size="27" fill="#20343e" text-anchor="start">平均码长 1.9 比特；概率队列决定合并顺序，树上边数决定每个码字的长度。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>零计数让未平滑语言模型付出无限代价</title><desc>词表仅含A、B，训练计数分别为3与0。极大似然赋予B零概率，只要测试遇到B，负对数损失便发散；加一平滑得到(0.8,0.2)，避免零概率但也降低了A的预测概率。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">零计数让未平滑语言模型付出无限代价</text><text x="85" y="190" font-size="24" fill="#193e54" text-anchor="start">词概率</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#2865a0" stroke-width="3" /><rect x="135.0" y="291.8" width="145.0" height="318.2" fill="#1977b4" /><text x="207.5" y="275.8181818181818" font-size="24" fill="#193e54" text-anchor="middle">1</text><text x="207.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">MLE：A</text><rect x="370.0" y="610.0" width="145.0" height="0.0" fill="#cf7432" /><text x="442.5" y="594.0" font-size="24" fill="#193e54" text-anchor="middle">0</text><text x="442.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">MLE：B</text><rect x="605.0" y="355.5" width="145.0" height="254.5" fill="#627689" /><text x="677.5" y="339.45454545454544" font-size="24" fill="#193e54" text-anchor="middle">0.8</text><text x="677.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">加一：A</text><rect x="840.0" y="546.4" width="145.0" height="63.6" fill="#1977b4" /><text x="912.5" y="530.3636363636364" font-size="24" fill="#193e54" text-anchor="middle">0.2</text><text x="912.5" y="680" font-size="24" fill="#193e54" text-anchor="middle">加一：B</text><text x="80" y="140" font-size="24" fill="#193e54" text-anchor="start">计数 A=3，B=0；B在测试出现时，MLE对数损失发散。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>PCA 的方差保留与重构损失</title><desc>A以协方差diag(9,1)的椭圆呈现两个正交主方向，第一方向捕获最大方差。B说明保留第一方向解释90%总方差，丢弃方向的期望平方重构误差为1。C进一步白化得到单位圆，说明PCA旋转与方差重新缩放不是同一步。 下方沿同一组角度追踪点云的缩放过程；蓝点来自 (3cosθ,sinθ)，橙点逐渐缩短第一坐标，最终变成圆。该几何过程对应消除不同方向的方差尺度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">PCA 的方差保留与重构损失</text><g transform="translate(10,15) scale(.95)"><line x1="113.76" y1="570.40" x2="779.04" y2="570.40" stroke="#95adba" stroke-width="2" /><line x1="446.40" y1="431.80" x2="446.40" y2="709.00" stroke="#95adba" stroke-width="2" /><ellipse cx="446.40000000000003" cy="570.4000000000001" rx="277.20000000000005" ry="92.4" fill="#eaf4f1" stroke="#2563eb" stroke-width="3" /><text x="723.60" y="598.40" font-size="24" fill="#15364c" text-anchor="middle">3</text><text x="431.40" y="478.00" font-size="24" fill="#15364c" text-anchor="end">1</text><text x="93.60" y="251.20" font-size="24" fill="#15364c" text-anchor="start">总体协方差diag(9,1)</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="341.6667" y2="341.6667" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="278.3333" y2="278.3333" stroke="#e5edf0" stroke-width="1.4" /><line x1="1040" x2="1425" y1="215.0000" y2="215.0000" stroke="#e5edf0" stroke-width="1.4" /><text x="1040.00" y="185.00" font-size="24" fill="#15364c" text-anchor="start">总体方向方差</text><rect x="1080.42" y="291.00" width="111.65" height="114.00" fill="#2563eb" /><text x="1136.25" y="282.00" font-size="24" fill="#15364c" text-anchor="middle">9</text><text x="1136.25" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">第一主方向</text><rect x="1272.92" y="392.33" width="111.65" height="12.67" fill="#cb702a" /><text x="1328.75" y="383.33" font-size="24" fill="#15364c" text-anchor="middle">1</text><text x="1328.75" y="437.00" font-size="24" fill="#15364c" text-anchor="middle">第二主方向</text><text x="1032" y="411" text-anchor="end" font-size="24" fill="#15364c">0</text><text x="1032" y="347.667" text-anchor="end" font-size="24" fill="#15364c">5</text><text x="1032" y="284.333" text-anchor="end" font-size="24" fill="#15364c">10</text><text x="1032" y="221" text-anchor="end" font-size="24" fill="#15364c">15</text><line x1="1040" x2="1425" y1="405.0000" y2="405.0000" stroke="#95adba" stroke-width="2" /></g><g transform="translate(-145,-15) scale(1.05)"><line x1="1094.45" y1="778.20" x2="1288.75" y2="778.20" stroke="#95adba" stroke-width="2" /><line x1="1191.60" y1="672.95" x2="1191.60" y2="883.45" stroke="#95adba" stroke-width="2" /><ellipse cx="1191.6" cy="778.2" rx="80.96000000000001" ry="80.96000000000001" fill="#eaf4f1" stroke="#2563eb" stroke-width="3" /><text x="1272.56" y="806.20" font-size="24" fill="#15364c" text-anchor="middle">1</text><text x="1176.60" y="697.24" font-size="24" fill="#15364c" text-anchor="end">1</text><text x="998.40" y="639.60" font-size="24" fill="#15364c" text-anchor="start">白化：单位协方差；显示范围更窄</text></g></g></svg>

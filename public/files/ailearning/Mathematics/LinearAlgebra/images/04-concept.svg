xt x="650" y="690" font-size="28" fill="white" text-anchor="middle">18</text><text x="1050" y="690" font-size="26" fill="white" text-anchor="middle">2</text></g><desc> PCA 保留的是同一批点：先平移，再换坐标 保留第一轴：能量保留 90%；丢掉第二得分，是投影，不是一次可逆旋转。</desc></svg>

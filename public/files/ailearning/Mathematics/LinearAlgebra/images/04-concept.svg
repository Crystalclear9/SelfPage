<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>PCA四点主算例的中心化、Gram矩阵、得分和方差全流程</title><rect width="1200" height="900" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="55" y="59" font-size="36" fill="#22364a" text-anchor="start" font-weight="bold">同一批四点：中心化 → 旋转 → 方差分配</text><text x="55" y="105" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">每行是一条样本；所有计算都沿用 A、B、C、D 的顺序</text><text x="80" y="169" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">① 原始数据 X</text><text x="161.0" y="234.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">12</text><text x="233.0" y="234.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">21</text><text x="161.0" y="282.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">11</text><text x="233.0" y="282.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">22</text><text x="161.0" y="330.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">9</text><text x="233.0" y="330.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">18</text><text x="161.0" y="378.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">8</text><text x="233.0" y="378.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">19</text><path d="M 128.000,198.000 L 118.000,198.000 L 118.000,399.000 L 128.000,399.000" stroke="#22364a" stroke-width="2.5" fill="none" /><path d="M 266.000,198.000 L 276.000,198.000 L 276.000,399.000 L 266.000,399.000" stroke="#22364a" stroke-width="2.5" fill="none" /><text x="80" y="234" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">A</text><text x="80" y="282" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">B</text><text x="80" y="330" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">C</text><text x="80" y="378" font-size="27" fill="#64788b" text-anchor="start" font-weight="normal">D</text><text x="60" y="441" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">列均值：(10, 20)</text><line x1="318" y1="291" x2="429" y2="291" stroke="#64788b" stroke-width="3" /><path d="M 419.096,297.776 L 429.000,291.000 L 419.096,284.224" stroke="#64788b" stroke-width="3" fill="none" /><text x="373" y="253" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">减均值</text><text x="465" y="169" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">② 中心化 Xc</text><text x="521.0" y="234.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">2</text><text x="593.0" y="234.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="521.0" y="282.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="593.0" y="282.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">2</text><text x="521.0" y="330.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-1</text><text x="593.0" y="330.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-2</text><text x="521.0" y="378.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-2</text><text x="593.0" y="378.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-1</text><path d="M 488.000,198.000 L 478.000,198.000 L 478.000,399.000 L 488.000,399.000" stroke="#22364a" stroke-width="2.5" fill="none" /><path d="M 626.000,198.000 L 636.000,198.000 L 636.000,399.000 L 626.000,399.000" stroke="#22364a" stroke-width="2.5" fill="none" /><text x="458" y="441" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">两列和都为 0</text><line x1="674" y1="291" x2="774" y2="291" stroke="#64788b" stroke-width="3" /><path d="M 764.096,297.776 L 774.000,291.000 L 764.096,284.224" stroke="#64788b" stroke-width="3" fill="none" /><text x="724" y="253" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">列内积</text><text x="830" y="169" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">③ 特征列的内积</text><text x="900.0" y="278.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">10</text><text x="972.0" y="278.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">8</text><text x="900.0" y="326.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">8</text><text x="972.0" y="326.2" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">10</text><path d="M 867.000,242.000 L 857.000,242.000 L 857.000,347.000 L 867.000,347.000" stroke="#22364a" stroke-width="2.5" fill="none" /><path d="M 1005.000,242.000 L 1015.000,242.000 L 1015.000,347.000 L 1005.000,347.000" stroke="#22364a" stroke-width="2.5" fill="none" /><text x="802" y="405" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">10 = 4 + 1 + 1 + 4</text><text x="802" y="445" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">8 = 2 + 2 + 2 + 2</text><line x1="55" y1="490" x2="1145" y2="490" stroke="#dce5ee" stroke-width="2" /><text x="70" y="543" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">④ 沿 v1、v2 旋转</text><text x="70" y="585" font-size="28" fill="#22364a" text-anchor="start" font-weight="normal">√2 Z =</text><text x="251.5" y="611.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">3</text><text x="316.5" y="611.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="251.5" y="655.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">3</text><text x="316.5" y="655.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-1</text><text x="251.5" y="699.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-3</text><text x="316.5" y="699.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">1</text><text x="251.5" y="743.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-3</text><text x="316.5" y="743.6" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">-1</text><path d="M 222.000,578.000 L 212.000,578.000 L 212.000,763.000 L 222.000,763.000" stroke="#22364a" stroke-width="2.5" fill="none" /><path d="M 346.000,578.000 L 356.000,578.000 L 356.000,763.000 L 346.000,763.000" stroke="#22364a" stroke-width="2.5" fill="none" /><text x="70" y="826" font-size="25" fill="#22364a" text-anchor="start" font-weight="normal">v1 沿 (1,1)，v2 沿 (1,−1)</text><line x1="405" y1="682" x2="500" y2="682" stroke="#64788b" stroke-width="3" /><path d="M 490.096,688.776 L 500.000,682.000 L 490.096,675.224" stroke="#64788b" stroke-width="3" fill="none" /><text x="540" y="543" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">⑤ 得分列平方和</text><text x="626.5" y="636.75" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">18</text><text x="701.5" y="636.75" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="626.5" y="691.75" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="701.5" y="691.75" font-size="29" fill="#22364a" text-anchor="middle" font-weight="normal">2</text><path d="M 592.000,596.000 L 582.000,596.000 L 582.000,715.000 L 592.000,715.000" stroke="#22364a" stroke-width="2.5" fill="none" /><path d="M 736.000,596.000 L 746.000,596.000 L 746.000,715.000 L 736.000,715.000" stroke="#22364a" stroke-width="2.5" fill="none" /><text x="548" y="759" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">得分列内积：交叉项 0</text><text x="548" y="807" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">总能量：18 + 2 = 20</text><line x1="788" y1="660" x2="858" y2="660" stroke="#64788b" stroke-width="3" /><path d="M 848.096,666.776 L 858.000,660.000 L 848.096,653.224" stroke="#64788b" stroke-width="3" fill="none" /><text x="822" y="619" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">除以 3</text><text x="890" y="543" font-size="29" fill="#22364a" text-anchor="start" font-weight="bold">⑥ 样本方差</text><text x="906" y="625" font-size="32" fill="#2666a4" text-anchor="start" font-weight="bold">λ1 = 6</text><text x="906" y="682" font-size="29" fill="#c86d31" text-anchor="start" font-weight="normal">λ2 =</text><line x1="991" y1="690" x2="1020" y2="690" stroke="#c86d31" stroke-width="2" /><text x="1006" y="721" font-size="27" fill="#c86d31" text-anchor="middle" font-weight="normal">3</text><text x="889" y="783" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">第一方向保留 90%</text><text x="1006" y="676" font-size="29" fill="#c86d31" text-anchor="middle">2</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><title>矩阵怎样移动标准基向量</title><desc>A用矩阵[[2,1],[0,1]]展示标准基与一个小方格的映射：两列就是两个基向量的像。B复算e1+e2映到(3,1)，体现线性组合被保留。C改为秩一矩阵[[1,1],[0,0]]，平面压到横轴，非零方向(1,−1)落入零空间。 下方的蓝点是输入，橙点是变换后的对应点，细线连接同一个点。依次比较恒等、剪切与主图矩阵，避免把矩阵只理解成四个数字。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1030" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">矩阵怎样移动标准基向量</text><g transform="translate(10,15) scale(.95)"><line x1="154.08" y1="585.60" x2="831.12" y2="585.60" stroke="#95adba" stroke-width="2" /><line x1="438.00" y1="847.68" x2="438.00" y2="258.00" stroke="#95adba" stroke-width="2" /><text x="831.12" y="613.99" font-size="24" fill="#15364c" text-anchor="start">x</text><text x="409.61" y="268.92" font-size="24" fill="#15364c" text-anchor="start">y</text><path d="M438.00,585.60 L678.24,585.60" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="673.24" y="610.60" font-size="24" fill="#2563eb" text-anchor="end">Ae1=(2,0)</text><path d="M438.00,585.60 L558.12,465.48" stroke="#cb702a" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="553.12" y="516.48" font-size="24" fill="#cb702a" text-anchor="end">Ae2=(1,1)</text><path d="M438.00,585.60 L798.36,465.48" stroke="#497da4" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="793.36" y="542.48" font-size="24" fill="#497da4" text-anchor="end">A(1,1)=(3,1)</text><text x="127.20" y="281.60" font-size="24" fill="#15364c" text-anchor="start">A=[[2,1],[0,1]]</text><polygon points="438,585.6 678.24,585.6 798.36,465.48 558.12,465.48" fill="#2563eb" opacity="0.13" stroke="#2563eb" stroke-width="2" /><rect x="125" y="660" width="120.12" height="120.12" fill="#e4edf5" stroke="#497da4" stroke-width="2" /><text x="125" y="827" font-size="24" fill="#15364c">输入单位方格</text><path d="M270 710 L385 630" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="575" y="430" font-size="24" fill="#15364c">输出平行四边形</text></g><g transform="translate(-145,-10) scale(1.05)"><line x1="1045.43" y1="344.80" x2="1383.02" y2="344.80" stroke="#95adba" stroke-width="2" /><line x1="1187.00" y1="475.48" x2="1187.00" y2="181.45" stroke="#95adba" stroke-width="2" /><text x="1383.02" y="358.96" font-size="24" fill="#15364c" text-anchor="start">x</text><text x="1172.84" y="186.90" font-size="24" fill="#15364c" text-anchor="start">y</text><path d="M1187.00,344.80 L1306.79,344.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1015" y="405" font-size="24" fill="#2563eb" text-anchor="start">Ae1=(2,0)</text><path d="M1187.00,344.80 L1246.89,284.90" stroke="#cb702a" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1015" y="435" font-size="24" fill="#cb702a" text-anchor="start">Ae2=(1,1)</text><path d="M1187.00,344.80 L1366.68,284.90" stroke="#497da4" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1015" y="465" font-size="24" fill="#497da4" text-anchor="start">A(1,1)=(3,1)</text><text x="1016.80" y="212.80" font-size="24" fill="#15364c" text-anchor="start">A=[[2,1],[0,1]]</text><line x1="1306.79" y1="344.8" x2="1366.685" y2="284.905" stroke="#789caa" stroke-width="2" stroke-dasharray="5 4" /><line x1="1246.895" y1="284.905" x2="1366.685" y2="284.905" stroke="#789caa" stroke-width="2" stroke-dasharray="5 4" /></g><g transform="translate(-145,-15) scale(1.05)"><line x1="1045.43" y1="784.80" x2="1383.02" y2="784.80" stroke="#95adba" stroke-width="2" /><line x1="1187.00" y1="915.48" x2="1187.00" y2="621.45" stroke="#95adba" stroke-width="2" /><text x="1383.02" y="798.96" font-size="24" fill="#15364c" text-anchor="start">x</text><text x="1172.84" y="626.89" font-size="24" fill="#15364c" text-anchor="start">y</text><path d="M1187.00,784.80 L1295.90,784.80" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1290.90" y="809.80" font-size="24" fill="#2563eb" text-anchor="end">Ae1</text><path d="M1187.00,784.80 L1295.90,784.80" stroke="#cb702a" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1290.90" y="835.80" font-size="24" fill="#cb702a" text-anchor="end">Ae2</text><path d="M1187.00,784.80 L1404.80,784.80" stroke="#497da4" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="1399.80" y="861.80" font-size="24" fill="#497da4" text-anchor="end">A(e1+e2)</text><text x="1016.80" y="652.80" font-size="24" fill="#15364c" text-anchor="start">A=[[1,1],[0,0]]</text></g></g></svg>

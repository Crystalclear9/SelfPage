<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>小残差与大解误差的区别</title><desc>A逐渐减小最弱奇异值，逆映射的弱方向增益显著放大，而强方向保持1。B固定A=diag(1,0.001)，右端在弱方向变化0.001便使解变化1。C用相同范数的右端扰动对比方向，沿强方向几乎不放大，最坏条件数不是每次都会达到。 下方固定 A=diag(1,0.001)，蓝色表示输入扰动大小，橙色表示解扰动大小；分别沿强方向、弱方向及二者混合扰动，展示逆算子对方向的选择性放大。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">小残差与大解误差的区别</text><g transform="translate(10,15) scale(.95)"><line x1="75.00" y1="179.00" x2="102.00" y2="179.00" stroke="#2563eb" stroke-width="3" /><text x="110.00" y="185.00" font-size="20" fill="#2563eb" text-anchor="start">强方向逆增益1</text><line x1="75.00" y1="202.00" x2="102.00" y2="202.00" stroke="#cb702a" stroke-width="3" /><text x="110.00" y="208.00" font-size="20" fill="#cb702a" text-anchor="start">弱方向逆增益</text><text x="125.00" y="251.00" font-size="20" fill="#15364c" text-anchor="start">逆增益</text><text x="882.00" y="918.00" font-size="20" fill="#15364c" text-anchor="end">弱奇异值</text><line x1="125.00" y1="263.00" x2="125.00" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="125.00" y="895.00" font-size="20" fill="#15364c" text-anchor="middle">0.001</text><line x1="314.25" y1="263.00" x2="314.25" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="314.25" y="895.00" font-size="20" fill="#15364c" text-anchor="middle">0.00575</text><line x1="503.50" y1="263.00" x2="503.50" y2="870.00" stroke="#e3ecef" stroke-width="2" /><text x="503.50" y="895.00" font-s
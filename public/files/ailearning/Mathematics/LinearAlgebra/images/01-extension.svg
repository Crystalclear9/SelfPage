<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>对偶范数决定最坏方向的扰动</title><desc>对线性预测w·x，取w=(2,1)。在欧氏单位球内，最大输出扰动为√5，发生在与w平行的方向；在逐坐标绝对值不超过1的方形区域内，最大扰动为3，发生在角点(1,1)。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">对偶范数决定最坏方向的扰动</text><text x="100" y="160" font-size="24" fill="#193e54" text-anchor="start">欧氏单位球：最大值√5</text><text x="670" y="160" font-size="24" fill="#193e54" text-anchor="start">逐坐标界：最大值3</text><circle cx="300" cy="420" r="160" fill="#eaf6f1" stroke="#627689" stroke-width="3" /><rect x="690" y="260" width="320" height="320" fill="#edf5fb" stroke="#1977b4" stroke-width="3" /><line x1="90" y1="420" x2="510" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="300" y1="210" x2="300" y2="630" stroke="#2865a0" stroke-width="3" /><line x1="640" y1="420" x2="1060" y2="420" stroke="#2865a0" stroke-width="3" /><line x1="850" y1="210" x2="850" y2="630" stroke="#2865a0" stroke-width="3" /><path d="M300,420 L443.10835055998655,348.4458247200067" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><path d="M850,420 L1010,260" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><text x="650" y="700" font-size="24" fill="#193e54" text-anchor="start">w=(2,1)；箭头对应使 w·Δx 最大的方向</text></g></svg>

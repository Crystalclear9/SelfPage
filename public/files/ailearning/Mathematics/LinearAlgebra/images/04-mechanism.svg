<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title id="extra-title">相同扰动遇到小谱间隙会产生大旋转</title><desc id="extra-desc">左图保留两个可精确求解的二维协方差：\left[\begin{smallmatrix}2&amp;\varepsilon\\\varepsilon&amp;1\end{smallmatrix}\right] 与 \left[\begin{smallmatrix}1.01&amp;\varepsilon\\\varepsilon&amp;1\end{smallmatrix}\right]。相对于 \varepsilon=0 时的第一坐标轴，主方向转角满足 \theta=\frac{1}{2}\arctan(\frac{2\varepsilon}{\Delta})，这里 \Delta 指**扰动前**的两个特征值之差。相同 \varepsilon=0.05 分别造成约 2.855° 与 42.145° 的旋转，不能将扰动的绝对大小直接当成方向误差。

右图补足“方向”和“保留子空间”的区别。取三维矩阵 A_0=\operatorname{diag}(1.01,1,0.1)，只增加 E_{12}=E_{21}=0.05。前两个特征值变为约 1.055249 和 0.954751；两个特征向量在 (e_1,e_2) 平面内旋转，而第三个方向仍为 e_3，特征值仍为 0.1。因此前两主方向张成的子空间**完全不变**，其正交投影矩阵前后都为 \operatorname{diag}(1,1,0)。图中的圆表示这个保留平面中的单位圆，不是数据点云或置信区域。

本例恰好没有跨平面耦合，故子空间不变是精确结果，不应推广为任意扰动。一般子空间误差应结合保留特征值簇与外部特征值之间的分离条件；内部两个特征值很接近时，单个基向量可以剧烈改变而整个簇仍稳定。相关定理见 [Yu、Wang 与 Samworth 的 Davis–Kahan 统计版本](https://arxiv.org/abs/1405.0680)。</desc><rect width="1200" height="740" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">相同扰动遇到小谱间隙会产生大旋转</text><text x="85" y="105" font-size="27" fill="#213447" text-anchor="start" font-weight="400">单一主方向：扰动前的谱间隙很重要</text><line x1="85" y1="137" x2="115" y2="137" stroke="#2865a0" stroke-width="3" /><text x="127" y="145" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">原间隙 0.01</text><line x1="360" y1="137" x2="390" y2="137" stroke="#cf7432" stroke-width="3" /><text x="402" y="145" font-size="25" fill="#cf7432" text-anchor="start" font-weight="400">原间隙 1</text><line x1="85" y1="555.0" x2="625" y2="555.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="563.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="438.33333333333337" x2="625" y2="438.33333333333337" stroke="#dce5ed" stroke-width="2" /><text x="73" y="446.33333333333337" font-size="24" fill="#627689" text-anchor="end" font-weight="400">15</text><line x1="85" y1="321.6666666666667" x2="625" y2="321.6666666666667" stroke="#dce5ed" stroke-width="2" /><text x="73" y="329.6666666666667" font-size="24" fill="#627689" text-anchor="end" font-weight="400">30</text><line x1="85" y1="205.0" x2="625" y2="205.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="213.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">45</text><line x1="85" y1="205" x2="85" y2="55
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="933" viewBox="0 0 960 933" role="img" aria-labelledby="title desc">
<title id="title">两个新点沿不同方向偏离训练数据</title><desc id="desc">训练点的 D 为 0.75、Q 为 0.5。新点 (13,20) 主要偏离训练直线；(110,120) 的残差为零但沿主轴很远。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536f86"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">

<title id="title">两个新点沿不同方向偏离训练数据</title>
<desc id="description">训练点重合在 D 为 0.75、Q 为 0.5；偏离直线的点 Q 为 4.5，沿主轴走远的点 Q 为零但 D 约为 3333。右图横向位置按 log10(1+D) 排列。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>伪逆从无穷多拟合解中选择最小范数</title><desc>方程x+y=1有无穷多个精确解。原点到解直线的垂足为(0.5,0.5)，其欧氏范数最小；沿解直线添加零空间向量(t,−t)，不改变拟合，却增加距离原点的平方。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">伪逆从无穷多拟合解中选择最小范数</text><line x1="170" y1="610" x2="1060" y2="610" stroke="#277eac" stroke-width="2.5" /><line x1="300" y1="180" x2="300" y2="660" stroke="#277eac" stroke-width="2.5" /><line x1="230" y1="120" x2="790" y2="680" stroke="#1977b4" stroke-width="2.5" /><line x1="300" y1="610" x2="510" y2="400" stroke="#dc752b" stroke-width="2.5" stroke-dasharray="6 5" /><circle cx="510" cy="400" r="32" fill="#daedf8" stroke="#5597b5" /><text x="510" y="408" font-size="22" fill="#193e54" text-anchor="middle">P</text><text x="600" y="285" font-size="25" fill="#193e54" text-anchor="start">x+y=1</text><text x="560" y="420" font-size="24" fill="#193e54" text-anchor="start">P=(0.5,0.5)</text><text x="600" y="465" font-size="22" fill="#193e54" text-anchor="start">原点到解集的垂足</text><text x="120" y="725" font-size="22" fill="#193e54" text-anchor="start">两个坐标使用相同刻度；直线方向 (1,-1) 属于零空间。</text></g></svg>

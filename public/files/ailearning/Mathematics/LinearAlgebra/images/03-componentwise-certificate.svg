<text x="74" y="535" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">分量尺度为 |A|·|x̂| + |b|，第二行的残差等于它自己的尺度。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>迭代是否收敛取决于误差传播算子</title><desc>设误差迭代为 e(k+1)=c·e(k)，初始误差为1。c=0.5时每轮误差减半，c=1.2时却持续扩大。在线性定常迭代中，这种一维倍率对应误差传播矩阵的特征方向，说明残差变小与否需要结构性收敛条件。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2865a0" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="0" fill="white" stroke="none" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">迭代是否收敛取决于误差传播算子</text><line x1="120.0" y1="235" x2="120.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="120.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">0</text><line x1="308.0" y1="235" x2="308.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="308.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">1.6</text><line x1="496.0" y1="235" x2="496.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="496.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">3.2</text><line x1="684.0" y1="235" x2="684.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="684.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">4.8</text><line x1="872.0" y1="235" x2="872.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="872.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">6.4</text><line x1="1060.0" y1="235" x2="1060.0" y2="635" stroke="#e1eaf0" stroke-width="2.5" /><text x="1060.0" y="671" font-size="24" fill="#16344c" text-anchor="middle">8</text><line x1="120" y1="635.0" x2="1060" y2="635.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="642.0" font-size="24" fill="#16344c" text-anchor="end">0</text><line x1="120" y1="535.0" x2="1060" y2="535.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="542.0" font-size="24" fill="#16344c" text-anchor="end">1.12</text><line x1="120" y1="435.0" x2="1060" y2="435.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="442.0" font-size="24" fill="#16344c" text-anchor="end">2.25</text><line x1="120" y1="335.0" x2="1060" y2="335.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="342.0" font-size="24" fill="#16344c" text-anchor="end">3.38</text><line x1="120" y1="235.0" x2="1060" y2="235.0" stroke="#e1eaf0" stroke-width="2.5" /><text x="105" y="242.0" font-size="24" fill="#16344c" text-anchor="end">4.5</text><line x1="120" y1="635" x2="1060" y2="635" stroke="#2865a0" stroke-width="3" /><line x1="120" y1="235" x2="120" y2="635" stroke="#2865a0" stroke-width="3" /><text x="1060" y="205" font-size="24" fill="#456679" text-anchor="end">横轴：轮次</text><text x="120" y="223" font-size="24" fill="#16344c" text-anchor="start">误差幅度</text><line x1="90" y1="130" x2="140" y2="130" stroke="#2865a0" stroke-width="3" /><text x="155" y="138" font-size="24" fill="#2865a0" text-anchor="start">c=0.5：误差收缩</text><polyline points="120.00,546.11 237.50,590.56 355.00,612.78 472.50,623.89 590.00,629.44 707.50,632.22 825.00,633.61 942.50,634.31 1060.00,634.65" fill="none" stroke="#2865a0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="120.00" cy="546.11" r="4" fill="#2865a0" /><circle cx="237.50" cy="590.56" r="4" fill="#2865a0" /><circle cx="355.00" cy="612.78" r="4" fill="#2865a0" /><circle cx="472.50" cy="623.89" r="4" fill="#2865a0" /><circle cx="590.00" cy="629.44" r="4" fill="#2865a0" /><circle cx="707.50" cy="632.22" r="4" fill="#2865a0" /><circle cx="825.00" cy="633.61" r="4" fill="#2865a0" /><circle cx="942.50" cy="634.31" r="4" fill="#2865a0" /><circle cx="1060.00" cy="634.65" r="4" fill="#2865a0" /><line x1="90" y1="161" x2="140" y2="161" stroke="#cf7432" stroke-width="3" /><text x="155" y="169" font-size="24" fill="#cf7432" text-anchor="start">c=1.2：误差扩大</text><polyline points="120.00,546.11 237.50,528.33 355.00,507.00 472.50,481.40 590.00,450.68 707.50,413.82 825.00,369.58 942.50,316.50 1060.00,252.79" fill="none" stroke="#cf7432" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="120.00" cy="546.11" r="4" fill="#cf7432" /><circle cx="237.50" cy="528.33" r="4" fill="#cf7432" /><circle cx="355.00" cy="507.00" r="4" fill="#cf7432" /><circle cx="472.50" cy="481.40" r="4" fill="#cf7432" /><circle cx="590.00" cy="450.68" r="4" fill="#cf7432" /><circle cx="707.50" cy="413.82" r="4" fill="#cf7432" /><circle cx="825.00" cy="369.58" r="4" fill="#cf7432" /><circle cx="942.50" cy="316.50" r="4" fill="#cf7432" /><circle cx="1060.00" cy="252.79" r="4" fill="#cf7432" /></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>秩一变换把整个平面压到一条线</title><desc>取 A=[[1,1],[0,0]]，输入向量(x,y)变为(x+y,0)。图中原本不共线的几个输入全部映射到横轴；沿(1,−1)方向移动不会改变输出，这个方向正是零空间中的非零方向。输出维数减少与信息丢失因而是同一结构的两种描述。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="31" fill="#15364c" text-anchor="start" font-weight="700">秩一变换把整个平面压到一条线</text><text x="65" y="160" font-size="22" fill="#16344c" text-anchor="start">输入平面</text><line x1="90" y1="410" x2="480" y2="410" stroke="#277eac" stroke-width="2.5" /><line x1="270" y1="200" x2="270" y2="650" stroke="#277eac" stroke-width="2.5" /><text x="650" y="160" font-size="22" fill="#16344c" text-anchor="start">输出横轴：y=0</text><line x1="620" y1="410" x2="1110" y2="410" stroke="#277eac" stroke-width="2.5" /><circle cx="370" cy="410" r="32" fill="#daedf8" stroke="#5597b5" /><text x="370" y="418" font-size="22" fill="#16344c" text-anchor="middle">(1,0)</text><path d="M500,330 L610,330" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><circle cx="860" cy="410" r="10" fill="#118779" /><text x="860" y="465" font-size="20" fill="#16344c" text-anchor="middle">(1,0)</text><circle cx="270" cy="310" r="32" fill="#daedf8" stroke="#5597b5" /><text x="270" y="318" font-size="22" fill="#16344c" text-anchor="middle">(0,1)</text><path d="M500,330 L610,330" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><circle cx="860" cy="410" r="10" fill="#118779" /><text x="860" y="465" font-size="20" fill="#16344c" text-anchor="middle">(1,0)</text><circle cx="370" cy="310" r="32" fill="#daedf8" stroke="#5597b5" /><text x="370" y="318" font-size="22" fill="#16344c" text-anchor="middle">(1,1)</text><path d="M500,410 L610,410" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><circle cx="990" cy="410" r="10" fill="#118779" /><text x="990" y="465" font-size="20" fill="#16344c" text-anchor="middle">(2,0)</text><circle cx="370" cy="510" r="32" fill="#daedf8" stroke="#5597b5" /><text x="370" y="518" font-size="22" fill="#16344c" text-anchor="middle">(1,-1)</text><path d="M500,250 L610,250" stroke="#277eac" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" /><circle cx="730" cy="410" r="10" fill="#118779" /><text x="730" y="490" font-size="20" fill="#16344c" text-anchor="middle">(0,0)</text><text x="80" y="730" font-size="22" fill="#16344c" text-anchor="start">e1 与 e2 映射相同；(1,-1) 映射为零。零空间非平凡，秩为1。</text></g></svg>

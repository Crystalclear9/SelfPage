<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>小后向误差不排除病态问题的大前向误差</title><desc>取A=diag(1,0.001)，真实解(0,1)，候选解(0,2)。对应右端b=(0,0.001)与候选计算右端(0,0.002)只差0.001，但解的绝对误差为1。图对齐输入误差与输出误差的尺度，区分算法求解附近问题与原问题解是否接近。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#277eac" /></marker></defs><rect width="1200" height="800" fill="white" /><rect x="20" y="98" width="1160.0" height="678.0" rx="16" fill="white" stroke="#dbe4e9" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50" y="65" font-size="30" fill="#15364c" text-anchor="start" font-weight="700">小后向误差不排除病态问题的大前向误差</text><text x="85" y="190" font-size="22" fill="#193e54" text-anchor="start">不同空间的绝对误差；不是相对误差</text><line x1="100" y1="610.0" x2="1100" y2="610.0" stroke="#277eac" stroke-width="2.5" /><rect x="135.0" y="609.7" width="145.0" height="0.3" fill="#1977b4" /><text x="207.5" y="593.6818181818181" font-size="24" fill="#193e54" text-anchor="middle">0.001</text><text x="207.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">右端绝对变化</text><rect x="605.0" y="291.8" width="145.0" height="318.2" fill="#d26724" /><text x="677.5" y="275.8181818181818" font-size="24" fill="#193e54" text-anchor="middle">1</text><text x="677.5" y="680" font-size="19" fill="#193e54" text-anchor="middle">解的绝对变化</text><text x="90" y="150" font-size="24" fill="#193e54" text-anchor="start">弱方向：矩阵把解空间的变化压缩1000倍。</text><text x="95" y="735" font-size="20" fill="#193e54" text-anchor="start">请分别结合各自量纲与尺度解释大小，不能直接当成相对稳定性证书。</text></g></svg>

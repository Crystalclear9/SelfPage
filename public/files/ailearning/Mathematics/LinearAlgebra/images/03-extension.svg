<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="extra-title extra-desc" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title id="extra-title">小后向误差不排除病态问题的大前向误差</title><desc id="extra-desc">这里用一个**确实具有小相对右端扰动**的例子。固定 A=\operatorname{diag}(1,0.001)、b=(1,0)^T，真实解为 x=(1,0)^T，候选解为 \widehat x=(1,1)^T。候选恰好解出附近方程 A\widehat x=b+\Delta b，其中 \Delta b=(0,0.001)^T。因此只允许改变右端时，相对后向误差为 \eta_b=\frac{\|\Delta b\|_2}{\|b\|_2}=0.001，相对前向误差却为 \frac{\|\widehat x-x\|_2}{\|x\|_2}=1。

左图为了看清微小的第二坐标，纵轴画的是 \frac{b_2}{0.001}；右图纵轴直接画 x_2。两幅图中等长的竖向箭头并不表示原数值改变量相同。由于逆矩阵沿第二方向放大 1000 倍，(0,0.001)^T 的输入改动变成 (0,1)^T 的解改动。条件数界在本例恰好取等：1=\kappa_2(A)\eta_b=1000\times0.001。

\eta_b 是本图**固定矩阵、只扰动右端**的定义，不应与前文允许矩阵和右端同时变化的联合后向误差混为一谈。后者在此例为 \frac{0.001}{\sqrt{2}+1}\approx0.0004142，也很小，但需要使用与该扰动模型匹配的误差界。线性系统条件数与右端相对扰动的推导见 [Driscoll 与 Braun《Fundamentals of Numerical Computation》](https://fncbook.com/condition-number/)。</desc><rect width="1200" height="710" fill="white" /><defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cf7432" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="46" font-size="32" fill="#213447" text-anchor="start" font-weight="600">小后向误差不排除病态问题的大前向误差</text><text x="85" y="105" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">右端空间：第二坐标按 0.001 为单位</text><text x="690" y="105" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">解空间：第二坐标按 1 为单位</text><line x1="85" y1="500.0" x2="515" y2="500.0" stroke="#dce5ed" stroke-width="2" /><text x="73" y="508.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="85" y1="233.33333333333331" x2="515" y2="233.33333333333331" stroke="#dce5ed" stroke-width="2" /><text x="73" y="241.33333333333331" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="85" y1="180" x2="85" y2="500" stroke="#627689" stroke-width="2" /><line x1="85" y1="500" x2="515" y2="500" stroke="#627689" stroke-width="2" /><line x1="85.0" y1="500.0" x2="85.0" y2="506.0" stroke="#627689" stroke-width="2" /><text x="85.0" y="532.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="443.33333333333337" y1="500.0" x2="443.33333333333337" y2="506.0" stroke="#627689" stroke-width="2" /><text x="443.33333333333337" y="532.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="85" y="155" font-size="25" fill="#627689" text-anchor="start" font-weight="400">b2（单位 0.001）</text><text x="255" y="555" font-size="25" fill="#627689" text-anchor="start" font-weight="400">b1</text><circle cx="443.33333333333337" cy="500.0" r="8" fill="#2865a0" /><circle cx="443.33333333333337" cy="233.33333333333331" r="8" fill="#cf7432" /><path d="M443.33333333333337,484.0 L443.33333333333337,249.33333333333334" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><text x="120" y="240" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">扰动后 (1,0.001)</text><text x="120" y="470" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">原始 b=(1,0)</text><line x1="690" y1="500.0" x2="1120" y2="500.0" stroke="#dce5ed" stroke-width="2" /><text x="678" y="508.0" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="690" y1="233.33333333333331" x2="1120" y2="233.33333333333331" stroke="#dce5ed" stroke-width="2" /><text x="678" y="241.33333333333331" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="690" y1="180" x2="690" y2="500" stroke="#627689" stroke-width="2" /><line x1="690" y1="500" x2="1120" y2="500" stroke="#627689" stroke-width="2" /><line x1="690.0" y1="500.0" x2="690.0" y2="506.0" stroke="#627689" stroke-width="2" /><text x="690.0" y="532.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="1048.3333333333335" y1="500.0" x2="1048.3333333333335" y2="506.0" stroke="#627689" stroke-width="2" /><text x="1048.3333333333335" y="532.0" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="690" y="155" font-size="25" fill="#627689" text-anchor="start" font-weight="400">x2</text><text x="860" y="555" font-size="25" fill="#627689" text-anchor="start" font-weight="400">x1</text><circle cx="1048.3333333333335" cy="500.0" r="8" fill="#2865a0" /><circle cx="1048.3333333333335" cy="233.33333333333331" r="8" fill="#cf7432" /><path d="M1048.3333333333335,484.0 L1048.3333333333335,249.33333333333334" stroke="#cf7432" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" /><text x="725" y="240" font-size="26" fill="#cf7432" text-anchor="start" font-weight="400">候选解 (1,1)</text><text x="725" y="470" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">真实解 x=(1,0)</text><text x="85" y="610" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">相对右端扰动 = 0.001</text><text x="690" y="610" font-size="28" fill="#cf7432" text-anchor="start" font-weight="400">相对解误差 = 1</text><text x="85" y="675" font-size="27" fill="#213447" text-anchor="start" font-weight="400">A=diag(1,0.001)，κ(A)=1000（2范数）；两幅图纵轴的数值尺度不同。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">投影留下哪个方向的误差</title><desc id="plate-desc">观测向量分解为投影与垂直残差。投影落在子空间内，残差正交于整个子空间。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="590" fill="white" stroke="none" stroke-width="1.6"/><polygon points="112,484 807,484 1195,243 500,243" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><line x1="237" y1="449" x2="688.6020114" y2="136.1254039" stroke="#202a37" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="237" y1="449" x2="686.2426521" y2="348.1895574" stroke="#196f77" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="696" y1="341" x2="696" y2="140" stroke="#a84b3b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-coral)"/><path d="M 664 354 L 664 324 L 696 316" fill="none" stroke="#202a37" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="237" cy="449" r="6" stroke="#202a37" stroke-width="1.7" fill="#202a37"/><circle cx="696" cy="346" r="6" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><circle cx="696" cy="131" r="6" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><text x="758" y="124" fill="#202a37" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">观测</text><text x="812" y="224" fill="#a84b3b" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">残差</text><line x1="773" y1="218" x2="706" y2="226"
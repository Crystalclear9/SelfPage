<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img"><title>正交投影把向量拆成两部分</title><desc>A把b=(2,1)分解为正交投影p=(2,0)与残差r=(0,1)，直角记号对应p·r=0。B验证长度平方5=4+1。C选同一子空间中的另一点q=(1,0)，残差变成(1,1)，平方误差升为2，说明最小二乘选解依赖正交条件。 下方让候选投影点 q 从横轴上的 1 移到 2 再移到 3。蓝色向量始终为 b=(2,1)，橙色向量为 q；只有中间位置的残差垂直于子空间，误差平方最小。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="#2563eb" /></marker></defs><rect width="1500" height="1400" fill="white" /><rect x="24" y="88" width="850" height="920" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="88" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><rect x="894" y="558" width="580" height="450" rx="0" fill="#ffffff" stroke="#e0e7ef" /><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#15364c">正交投影把向量拆成两部分</text><g transform="translate(10,15) scale(.95)"><line x1="154.08" y1="585.60" x2="831.12" y2="585.60" stroke="#95adba" stroke-width="2" /><line x1="438.00" y1="847.68" x2="438.00" y2="258.00" stroke="#95adba" stroke-width="2" /><text x="831.12" y="613.99" font-size="20" fill="#15364c" text-anchor="start">x</text><text x="409.61" y="268.92" font-size="20" fill="#15364c" text-anchor="start">y</text><path d="M438.00,585.60 L743.76,432.72" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M438.00,585.60 L743.76,585.60" stroke="#497da4" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><path d="M743.76,585.60 L743.76,432.72" stroke="#cb702a" stroke-width="2.8" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><line x1="726.76" y1="585.60" x2="726.76" y2="568.60" stroke="#cb702a" stroke-width="2" /><line x1="726.76" y1="568.60" x2="743.76" y2="568.60" stroke="#cb702a" stroke-width="2" /><t
oke="#df7326" stroke-width="3" stroke-linejoin="round" /><text x="129" y="120" font-size="20" fill="#15364c">q</text></g><g transform="translate(545,1135)"><text x="0" y="0" font-size="20" fill="#15364c">q=(2,0)；残差平方=1</text><line x1="35" y1="125" x2="385" y2="125" stroke="#dbe4ed" stroke-width="2" /><line x1="90" y1="25" x2="90" y2="160" stroke="#dbe4ed" stroke-width="2" /><line x1="90" y1="125" x2="154" y2="93" stroke="#2563eb" stroke-width="3" /><polyline points="147.891,100.917 154.000,93.000 144.001,93.136" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" /><text x="161" y="88" font-size="20" fill="#15364c">b</text><line x1="90" y1="125" x2="154" y2="125" stroke="#df7326" stroke-width="3" /><polyline points="144.996,129.350 154.000,125.000 144.996,120.650" fill="none" stroke="#df7326" stroke-width="3" stroke-linejoin="round" /><text x="161" y="120" font-size="20" fill="#15364c">q</text></g><g transform="translate(1035,1135)"><text x="0" y="0" font-size="20" fill="#15364c">q=(3,0)；残差平方=2</text><line x1="35" y1="125" x2="385" y2="125" stroke="#dbe4ed" stroke-width="2" /><line x1="90" y1="25" x2="90" y2="160" stroke="#dbe4ed" stroke-width="2" /><line x1="90" y1="125" x2="154" y2="93" stroke="#2563eb" stroke-width="3" /><polyline points="147.891,100.917 154.000,93.000 144.001,93.136" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" /><text x="161" y="88" font-size="20" fill="#15364c">b</text><line x1="90" y1="125" x2="186" y2="125" stroke="#df7326" stroke-width="3" /><polyline points="176.996,129.350 186.000,125.000 176.996,120.650" fill="none" stroke="#df7326" stroke-width="3" stroke-linejoin="round" /><text x="193" y="120" font-size="20" fill="#15364c">q</text></g></g></svg>

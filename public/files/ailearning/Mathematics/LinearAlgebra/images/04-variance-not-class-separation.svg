<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="624" viewBox="0 0 1350 624" role="img" aria-labelledby="title desc"><title id="title">降维保留方差也可能丢掉区分</title><desc id="desc">横坐标方差更大，标签只由纵坐标决定。投影到首主轴后，成对样本重合。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1350" height="624" fill="white" stroke="none" stroke-width="1.55"/><text x="314" y="63" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">原空间可用纵向区分</text><text x="1048" y="63" fill="#202a37" font-size="38" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">首主轴上的投影</text><line x1="113" y1="345" x2="613" y2="345" stroke="#202a37" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-ink)"/><circle cx="186" cy="272" r="7" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><line x1="186" y1="282" x2="186" y2="345" stroke="#196f77" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="186" cy="418" r="7" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><line x1="186" y1="408" x2="186" y2="345" stroke="#a84b3b" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="296" cy="272" r="7" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><line x1="296" y1="282" x2="296" y2="345" stroke="#196f77" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="296" cy="418" r="7" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><line x1="296" y1="408" x2="296" y2="345" stroke="#a84b3b" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="406" cy="272" r="7" strok
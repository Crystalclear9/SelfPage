Microsoft YaHei, serif">相同横坐标的两类叠在一起</text><line x1="637" y1="345" x2="754" y2="345" stroke="#655184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="674" y="574" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">保留的方差很多，分类需要的信息仍可能丢失</text></svg>
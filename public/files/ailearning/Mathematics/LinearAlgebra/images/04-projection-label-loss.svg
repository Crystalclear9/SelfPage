e-dasharray="6 5"/><circle cx="1074" cy="285" r="8" fill="#2c78aa"/><text x="1089" y="271" font-size="27" fill="#2c78aa" text-anchor="start" font-weight="bold">A</text><line x1="1074" y1="515" x2="1074" y2="400" stroke="#b76a3d" stroke-width="3" stroke-dasharray="6 5"/><circle cx="1074" cy="515" r="8" fill="#b76a3d"/><text x="1089" y="501" font-size="27" fill="#b76a3d" text-anchor="start" font-weight="bold">B</text><line x1="726" y1="285" x2="726" y2="400" stroke="#2c78aa" stroke-width="3" stroke-dasharray="6 5"/><circle cx="726" cy="285" r="8" fill="#2c78aa"/><text x="741" y="271" font-size="27" fill="#2c78aa" text-anchor="start" font-weight="bold">C</text><line x1="726" y1="515" x2="726" y2="400" stroke="#b76a3d" stroke-width="3" stroke-dasharray="6 5"/><circle cx="726" cy="515" r="8" fill="#b76a3d"/><text x="741" y="501" font-size="27" fill="#b76a3d" text-anchor="start" font-weight="bold">D</text><circle cx="721" cy="400" r="7" fill="#2c78aa"/><circle cx="731" cy="400" r="7" fill="#b76a3d"/><text x="726" y="572.5" font-size="25" fill="#243c4e" text-anchor="middle" font-weight="normal">C、D 合并</text><circle cx="1069" cy="400" r="7" fill="#2c78aa"/><circle cx="1079" cy="400" r="7" fill="#b76a3d"/><text x="1074" y="572.5" font-size="25" fill="#243c4e" text-anchor="middle" font-weight="normal">A、B 合并</text><text x="900" y="660" font-size="25" fill="#243c4e" text-anchor="middle" font-weight="normal">横轴 √2 z1；纵轴 √2 z2</text><line x1="55" y1="702" x2="1145" y2="702" stroke="#e1e9f0" stroke-width="2"/><text x="60" y="752" font-size="28" fill="#243c4e" text-anchor="start" font-weight="normal">每条残差平方 = 0.5；四条总误差 = 2；输入能量仍保留 90%。</text><text x="60" y="804" font-size="26" fill="#243c4e" text-anchor="start" font-weight="normal">但每个一维得分同时对应两种标签：只看 z1，四点等权分类最好也只有 50%。</text></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="918" fill="white"/><g transform="translate(5.8984705 -39.683765) scale(1.1235063)"><use xmlns:ns0="http://www.w3.org/1999/
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>四点PCA投影残差与低方差标签信息被合并的精确几何</title><rect width="1200" height="900" fill="white" /><g font-family="Microsoft YaHei, sans-serif"><text x="55" y="59" font-size="35" fill="#22364a" text-anchor="start" font-weight="bold">同一批四点：丢弃的 10% 可以包含全部标签</text><text x="55" y="105" font-size="26" fill="#64788b" text-anchor="start" font-weight="normal">蓝色 A、C 属于类 1；橙色 B、D 属于类 0；颜色不参与 PCA 拟合</text><text x="295" y="163" font-size="29" fill="#22364a" text-anchor="middle" font-weight="bold">原空间：投影到主直线</text><text x="900" y="163" font-size="29" fill="#22364a" text-anchor="middle" font-weight="bold">得分空间：清除第二坐标</text><line x1="108" y1="592" x2="108" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="592" x2="492" y2="592" stroke="#dce5ee" stroke-width="2" /><line x1="172" y1="592" x2="172" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="528" x2="492" y2="528" stroke="#dce5ee" stroke-width="2" /><text x="172" y="626" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">-2</text><text x="94" y="536" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">-2</text><line x1="236" y1="592" x2="236" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="464" x2="492" y2="464" stroke="#dce5ee" stroke-width="2" /><line x1="300" y1="592" x2="300" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="400" x2="492" y2="400" stroke="#dce5ee" stroke-width="2" /><text x="300" y="626" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="94" y="408" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">0</text><line x1="364" y1="592" x2="364" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="336" x2="492" y2="336" stroke="#dce5ee" stroke-width="2" /><line x1="428" y1="592" x2="428" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="272" x2="492" y2="272" stroke="#dce5ee" stroke-width="2" /><text x="428" y="626" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">2</text><text x="94" y="280" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">2</text><line x1="492" y1="592" x2="492" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="208" x2="492" y2="208" stroke="#dce5ee" stroke-width="2" /><line x1="108" y1="400" x2="492" y2="400" stroke="#64788b" stroke-width="2" /><line x1="300" y1="592" x2="300" y2="208" stroke="#64788b" stroke-width="2" /><line x1="120.80000000000001" y1="579.2" x2="479.2" y2="220.8" stroke="#2666a4" stroke-width="3" /><line x1="428" y1="336" x2="396.0" y2="304.0" stroke="#2666a4" stroke-width="3" stroke-dasharray="6 5" /><circle cx="428" cy="336" r="8" fill="#2666a4" /><text x="443" y="361" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">A</text><circle cx="396.0" cy="304.0" r="5" fill="#64788b" /><line x1="364" y1="272" x2="396.0" y2="304.0" stroke="#c86d31" stroke-width="3" stroke-dasharray="6 5" /><circle cx="364" cy="272" r="8" fill="#c86d31" /><text x="379" y="257" font-size="27" fill="#c86d31" text-anchor="start" font-weight="bold">B</text><circle cx="396.0" cy="304.0" r="5" fill="#64788b" /><line x1="236" y1="528" x2="204.0" y2="496.0" stroke="#2666a4" stroke-width="3" stroke-dasharray="6 5" /><circle cx="236" cy="528" r="8" fill="#2666a4" /><text x="251" y="513" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">C</text><circle cx="204.0" cy="496.0" r="5" fill="#64788b" /><line x1="172" y1="464" x2="204.0" y2="496.0" stroke="#c86d31" stroke-width="3" stroke-dasharray="6 5" /><circle cx="172" cy="464" r="8" fill="#c86d31" /><text x="144" y="450" font-size="27" fill="#c86d31" text-anchor="start" font-weight="bold">D</text><circle cx="204.0" cy="496.0" r="5" fill="#64788b" /><text x="300" y="660" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">横轴 x1 − 10；纵轴 x2 − 20</text><line x1="685.4" y1="400" x2="1114.6" y2="400" stroke="#64788b" stroke-width="3" /><line x1="900" y1="584.0" x2="900" y2="216.0" stroke="#64788b" stroke-width="2" /><text x="726" y="436" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">-3</text><text x="900" y="436" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">0</text><text x="1074" y="436" font-size="24" fill="#22364a" text-anchor="middle" font-weight="normal">3</text><text x="887" y="523" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">-1</text><text x="887" y="293" font-size="24" fill="#22364a" text-anchor="end" font-weight="normal">1</text><line x1="1074" y1="285" x2="1074" y2="400" stroke="#2666a4" stroke-width="3" stroke-dasharray="6 5" /><circle cx="1074" cy="285" r="8" fill="#2666a4" /><text x="1089" y="271" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">A</text><line x1="1074" y1="515" x2="1074" y2="400" stroke="#c86d31" stroke-width="3" stroke-dasharray="6 5" /><circle cx="1074" cy="515" r="8" fill="#c86d31" /><text x="1089" y="501" font-size="27" fill="#c86d31" text-anchor="start" font-weight="bold">B</text><line x1="726" y1="285" x2="726" y2="400" stroke="#2666a4" stroke-width="3" stroke-dasharray="6 5" /><circle cx="726" cy="285" r="8" fill="#2666a4" /><text x="741" y="271" font-size="27" fill="#2666a4" text-anchor="start" font-weight="bold">C</text><line x1="726" y1="515" x2="726" y2="400" stroke="#c86d31" stroke-width="3" stroke-dasharray="6 5" /><circle cx="726" cy="515" r="8" fill="#c86d31" /><text x="741" y="501" font-size="27" fill="#c86d31" text-anchor="start" font-weight="bold">D</text><circle cx="721" cy="400" r="7" fill="#2666a4" /><circle cx="731" cy="400" r="7" fill="#c86d31" /><text x="726" y="572.5" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">C、D 合并</text><circle cx="1069" cy="400" r="7" fill="#2666a4" /><circle cx="1079" cy="400" r="7" fill="#c86d31" /><text x="1074" y="572.5" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">A、B 合并</text><text x="900" y="660" font-size="25" fill="#22364a" text-anchor="middle" font-weight="normal">横轴 √2 z1；纵轴 √2 z2</text><line x1="55" y1="702" x2="1145" y2="702" stroke="#dce5ee" stroke-width="2" /><text x="60" y="752" font-size="28" fill="#22364a" text-anchor="start" font-weight="normal">每条残差平方 = 0.5；四条总误差 = 2；输入能量仍保留 90%。</text><text x="60" y="804" font-size="26" fill="#22364a" text-anchor="start" font-weight="normal">但每个一维得分同时对应两种标签：只看 z1，四点等权分类最好也只有 50%。</text><text x="60" y="854" font-size="27" fill="#22364a" text-anchor="start" font-weight="normal">保留 z2 的符号即可全部分对；重构最优与预测最优是两个不同目标。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plate-caption" aria-describedby="plate-alt" viewBox="0 0 1360 918" width="1360" height="918"><title id="plate-caption">同一四点数据的正交投影、逐点残差以及类别标签在一维得分上合并</title><desc id="plate-alt"> 同一批四点：丢弃的 10% 可以包含全部标签 保留 z2 的符号即可全部分对；重构最优与预测最优是两个不同目标。</desc><defs><clipPath id="plate-view-0"><rect x="11.108" y="81.165313" width="1177.78" height="105.32609"/></clipPath><clipPath id="plate-view-1"><rect x="11.108" y="186.4914" width="1177.78" height="626.69487"/></clipPath><g id="plate-scene"><rect id="edition-paper" x="11.108" y="39.108" width="1177.78" height="812.451" fill="#ffffff"/><svg id="scientific-layout" x="32.6667" y="60.6667" width="1134.67" height="769.333" viewBox="32.6667 60.6667 1134.6667 769.3333" overflow="hidden"><rect width="1200" height="900" fill="#ffffff"/><g font-family="Microsoft YaHei, sans-serif"><text x="55" y="105" font-size="26" fill="#618296" text-anchor="start" font-weight="normal">蓝色 A、C 属于类 1；橙色 B、D 属于类 0；颜色不参与 PCA 拟合</text><text x="295" y="163" font-size="29" fill="#243c4e" text-anchor="middle" font-weight="bold" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">原空间：投影到主直线</text><text x="900" y="163" font-size="29" fill="#243c4e" text-anchor="middle" font-weight="bold" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">得分空间：清除第二坐标</text><line x1="108" y1="592" x2="492" y2="592" stroke="#657682" stroke-width="1.25" stroke-linecap="round"/><line x1="172" y1="592" x2="172" y2="208" stroke="#d6e2e6" stroke-width="1.3"/><line x1="172" y1="592" x2="172" y2="597" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="300" y1="592" x2="300" y2="597" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="428" y1="592" x2="428" y2="597" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="103" y1="528" x2="108" y2="528" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="103" y
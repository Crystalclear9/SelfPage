<g id="round-20261105c-teaching" transform="translate(0 512.727) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">最近的历史版本仍可能太旧：方向、等号、容忍时长分别检查</text><text x="65" y="125" font-size="30" fill="#1d3145" text-anchor="start">可用记录：(t=2,v=10)、(t=4,v=40)、(t=8,v=80)</text><text x="65" y="180" font-size="29" fill="#c66d3a" text-anchor="start">t=7；向后；容忍 2</text><line x1="540" y1="170" x2="690" y2="170" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/><path d="M678.947,174.673 L690.000,170.000 L678.947,165.327" stroke="#c66d3a" stroke-width="2" fill="none"/><text x="740" y="180" font-size="30" fill="#c66d3a" text-anchor="start">t=4，年龄3 → 不匹配</text><text x="65" y="270" font-size="29" fill="#1e7499" text-anchor="start">t=6；向后；容忍 2</text><line x1="540" y1="260" x2="690" y2="260" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/><path d="M678.947,264.673 L690.000,260.000 L678.947,255.327" stroke="#1e7499" stroke-width="2" fill="none"/><text x="740" y="270" font-size="30" fill="#1e7499" text-anchor="start">t=4，年龄2 → 40</text><text x="65" y="393" font-size="28" fill="#1d3145" text-anchor="start">容忍条件是 预测时刻−匹配时刻 ≤ 2；向后方向只保证不晚于预测时刻。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">同时间戳不能自动建立因果顺序</title><desc id="desc">预测时刻为 10，严格历史窗口只允许时间小于 10 的事件。若同一时间戳恰好有两条记录，排序后在文件中排得更前并不证明它先被观察到，更不证明可用作另一条记录的历史。 图只检查事件时间，还需额外限制数据到达时间。若业务确实存在同刻内顺序，应使用可靠序号或更细时间，而不是依赖不稳定的物理行序。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">同时间戳不能自动建立因果顺序</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">无额外先后规则时，同时间戳不能证明预测前已可用。</text><path d="M250,195 L1090,195" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">8</text><path d="M530,188 L530,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">9</text><path d="M810,188 L810,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="810" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">10</text><path d="M1090,188 L1090,202" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">11</text><text x="60" y="260" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">更早事件：可纳入</text><rect x="250.0" y="255" width="280.0" height="48" fill="#d4ebe6" stroke="#83b4ae" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="390" y="337" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">时间严格早于预测</text><text x="60" y="375" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">两条同刻记录</text><circle cx="810" cy="395" r="11" fill="#d67c47" /><text x="810" y="452" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">t=10：不能凭存储顺序纳入</text><text x="60" y="490" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">未来事件：排除</text><rect x="810.0" y="485" width="280.0" height="48" fill="#f5dfcb" stroke="#83b4ae" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="950" y="567" font-size="20" fill="#20384f" text-anchor="middle" font-weight="400">时间晚于预测</text><text x="1090" y="650" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1252.267" height="680.312" viewBox="13.867 63.979 1252.267 680.312"><rect width="1252.267" height="680.312" fill="white" x="13.867" y="63.979" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="112" font-size="27" fill="#52677a">同一实体、整批在 t=10 评分；严格历史只允许事件时间小于 10</text><path d="M80 225 H610" stroke="#748895" stroke-width="2" /><path d="M140 216 V234" stroke="#748895" stroke-width="2" /><text x="130" y="200" font-size="27" fill="#17334b">9</text><path d="M350 216 V234" stroke="#748895" stroke-width="2" /><text x="340" y="200" font-size="27" fill="#17334b">10</text><path d="M560 216 V234" stroke="#748895" stroke-width="2" /><text x="550" y="200" font-size="27" fill="#17334b">11</text><path d="M350 240 V545" stroke="#d5752e" stroke-width="3" stroke-dasharray="8 7" /><circle cx="140" cy="295" r="12" fill="#2474b5" /><text x="162" y="304" font-size="28" fill="#2474b5">A：金额 5</text><circle cx="350" cy="380" r="12" fill="#d5752e" /><text x="372" y="389" font-size="28" fill="#d5752e">B：金额 10</text><circle cx="350" cy="465" r="12" fill="#d5752e" /><text x="372" y="474" font-size="28" fill="#d5752e">C：金额 20</text><text x="90" y="582" font-size="28" fill="#d5752e">B 与 C 位于同一时间边界</text><text x="710" y="195" font-size="31" fill="#17334b">历史金额和</text><text x="730" y="273" font-size="29" fill="#17334b">评分记录</text><text x="920" y="273" font-size="29" fill="#17334b">B</text><text x="1110" y="273" font-size="29" fill="#17334b">C</text><path d="M700 300 H1235" stroke="#d8e1e8" stroke-width="2" /><text x="710" y="363" font-size="28" fill="#168578">整批严格过去</text><text x="925" y="363" font-size="31" fill="#168578">5</text><text x="1110" y="363" font-size="31" fill="#168578">5</text><text x="710" y="448" font-size="28" fill="#d5752e">按行累计后移</text><text x="925" y="448" font-size="31" fill="#d5752e">5</text><text x="1110" y="448" font-size="31" fill="#d5752e">15</text><text x="710" y="532" font-size="29" fill="#d5752e">15 = A 的 5 + B 的 10</text><text x="710" y="582" font-size="28" fill="#d5752e">C 错误看到同刻 B</text><path d="M40 650 H1240" stroke="#d8e1e8" stroke-width="2" /><text x="40" y="715" font-size="28" fill="#17334b">交换 B、C 的物理行序，严格历史仍都是 5；按行结果会随顺序改变。</text></g><desc> 两条记录同刻评分，文件先后不能赋予额外历史 若服务确实逐条提交，必须另有可靠序号或更细时钟证明可见顺序。</desc></svg>

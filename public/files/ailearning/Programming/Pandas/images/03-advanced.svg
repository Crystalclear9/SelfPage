<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="697" viewBox="0 0 1200 697" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">同一个时间戳不能确定先后</title>
<desc id="fig-desc">较早事件 A 为两条同刻评分共享。把文件行序当作时间顺序会让 C 看到 B。</desc>
<rect x="0" y="0" width="1200" height="697" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">同刻评分，读取同一份严格历史</text>
<path d="M123.8 242 L909.5 242" fill="none" stroke="#233b4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M909.5 242 L898.5 247 L898.5 237 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="182" y="282" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">9</text>
<text x="473" y="282" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">10</text>
<text x="764" y="282" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">11</text>
<circle cx="182" cy="242" r="7" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="182" y="209" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">A · 5</text>
<circle cx="473" cy="169" r="7" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="494" y="175" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">B · 10</text>
<circle cx="473" cy="318" r="7" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="494" y="324" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">C · 20</text>
<path d="M473 140 L473 346" fill="none" stroke="#a74d3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="747" y="191" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">B 和 C 都在时间 10。</text>
<text x="747" y="318" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">不能用文件行序推断可见性。</text>
<path d="M75 371 L1125 371" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="444" y="454" width="144" height="65" fill="#ecf6f6" opacity="1"/>
<text x="516" y="494.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">5</text>
<rect x="592" y="454" width="144" height="65" fill="#ecf6f6" opacity="1"/>
<text x="664" y="494.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">5</text>
<text x="428" y="494.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">严格过去</text>
<rect x="444" y="523" width="144" height="65" fill="#ecf6f6" opacity="1"/>
<text x="516" y="563.5" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">5</text>
<rect x="592" y="523" width="144" height="65" fill="#fbede8" opacity="1"/>
<text x="664" y="563.5" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">15</text>
<text x="428" y="563.5" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="end" font-weight="400">逐行累计再后移</text>
<text x="516" y="440" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">评分 B</text>
<text x="664" y="440" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">评分 C</text>
<text x="800" y="553" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">15 里混入同刻 B 的 10。</text>
<text x="74" y="635" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">交换 B、C 的文件行序，严格历史仍都等于 5。</text>
</svg>

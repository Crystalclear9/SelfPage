<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="597" viewBox="0 0 1330 597" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">标签成熟后才能进入历史训练</title><desc id="plate-desc">A 已成熟，B 已决策但标签仍待成熟，C 的决策在快照之后。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1330" height="597" fill="white" stroke="none" stroke-width="1.6"/><text x="698" y="72" fill="#655184" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">数据快照</text><line x1="698" y1="107" x2="698" y2="504" stroke="#655184" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="109" cy="186" r="27" stroke="#196f77" stroke-width="2" fill="url(#wash-teal)"/><text x="109" y="196.85" fill="#196f77" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">A</text><line x1="185" y1="186" x2="301" y2="186" stroke="#657682" stroke-width="2.2" stroke-linecap="round"/><line x1="301" y1="186" x2="592" y2="186" stroke="#196f77" stroke-width="3" stroke-linecap="round"/><circle cx="301" cy="186" r="6" stroke="#196f77" stroke-width="1.7" fill="#196f77"/><circle cx="592" cy="186" r="6" stroke="#196f77" stroke-width="1.7" fill="white"/><text x="301" y="162" fill="#196f77" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">决策</text><text x="592" y="235" fill="#196f77" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">标签完整</text><text x="1208" y="194" fill="#196f77" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">已成熟</text><circle cx="109" cy="324" r="27" stroke="#a84b3b" stroke-width="2" fill="url(#wash-coral)"/><text x="109" y="334.85" fill="#a84b3b" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">B</text><line x1="185" y1="324" x2="501" y2="324" stroke="#657682" stroke-width="2.2" stroke-linecap="round"/><line x1="501" y1="324" x2="876" y2="324" stroke="#a84b3b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="501" cy="324" r="6" stroke="#a84b3b" stroke-width="1.7" fill="#a84b3b"/><circle cx="876" cy="324" r="6" stroke="#a84b3b" stroke-width="1.7" fill="white"/><text x="501" y="300" fill="#a84b3b" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">决策</text><text x="876" y="373" fill="#a84b3b" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">标签完整</text><text x="1208" y="332" fill="#a84b3b" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">待成熟</text><circle cx="109" cy="462" r="27" stroke="#657682" stroke-width="2" fill="url(#wash-gray)"/><text x="109" y="472.85" fill="#657682" font-size="31" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">C</text><line x1="185" y1="462" x2="819" y2="462" stroke="#657682" stroke-width="2.2" stroke-linecap="round"/><line x1="819" y1="462" x2="1065" y2="462" stroke="#657682" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="819" cy="462" r="6" stroke="#657682" stroke-width="1.7" fill="#657682"/><circle cx="1065" cy="462" r="6" stroke="#657682" stroke-width="1.7" fill="white"/><text x="819" y="438" fill="#657682" font-size="27" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">决策</text><text x="1065" y="511" fill="#657682" font-size="26" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">标签完整</text><text x="1208" y="470" fill="#657682" font-size="31" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">未来</text><text x="639" y="561" fill="#202a37" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">只有快照前能观察到的完整标签进入历史训练</text></svg>
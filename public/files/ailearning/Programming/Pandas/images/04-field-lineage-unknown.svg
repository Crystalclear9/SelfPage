<svg xmlns="http://www.w3.org/2000/svg" width="1168.000" height="942.000" viewBox="16.000 57.000 1168.000 942.000" role="img" aria-labelledby="title desc"><title id="title">“没有事件”与“事件金额未知”，为何必须得到不同结果？</title><desc id="desc">字段级隔离保留支付事实。B有两笔支付但一笔金额未知，完整金额和未知而非已知部分20；C的历史窗为空，次数及空和为0但最近间隔未知。下方四用户特征与程序一致。 “没有事件”与“事件金额未知”，为何必须得到不同结果？</desc><rect width="1168.0" height="942.0" fill="white" x="16.0" y="57.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="103" font-size="26" fill="#627689" text-anchor="start">仍使用 1/10 的四个锚点；坏金额只隔离字段，支付身份与时间保留。</text><text x="40" y="170" font-size="28" fill="#c87536" text-anchor="start">B：两笔事实，一笔金额未知</text><rect x="45" y="205" width="230" height="66" fill="#2865a0" opacity="0.12" rx="3" /><text x="160.0" y="247.0" font-size="26" fill="#2865a0" text-anchor="middle">p2：20 分</text><rect x="330" y="205" width="230" height="66" fill="#c87536" opacity="0.12" rx="3" /><text x="445.0" y="247.0" font-size="26" fill="#c87536" text-anchor="middle">bad：未知</text><text x="285" y="249" font-size="32" fill="#213447" text-anchor="middle">+</text><line x1="580" y1="238" x2="685" y2="238" stroke="#c87536" stroke-width="3" /><polyline points="675.3465918192059,243.27368092464624 685,238 675.3465918192059,232.72631907535376" fill="none" stroke="#c87536" stroke-width="3" /><rect x="710" y="205" width="430" height="66" fill="#c87536" opacity="0.12" rx="3" /><text x="925.0" y="247.0" font-size="26" fill="#c87536" text-anchor="middle">完整总额未知</text><text x="45" y="318" font-size="26" fill="#213447" text-anchor="start">支付次数 2；有效金额数 1；已知部分合计 20 分。</text><text x="45" y="365" font-size="25" fill="#c87536" text-anchor="start">已知部分不是完整总额：不能把未知支付金额当成 0。</text><line x1="40" y1="410" x2="1160" y2="410" stroke="#dce5ed" stroke-width="2" /><text x="40" y="472" font-size="28" fill="#2865a0" text-anchor="start">C：历史窗内确实没有支付</text><rect x="45" y="507" width="510" height="67" fill="white" stroke="#627689" stroke-width="2" stroke-dasharray="8 6" /><text x="300" y="551" font-size="27" fill="#627689" text-anchor="middle">空的事实集合</text><line x1="580" y1="540" x2="685" y2="540" stroke="#2865a0" stroke-width="3" /><polyline points="675.3465918192059,545.2736809246462 685,540 675.3465918192059,534.7263190753538" fill="none" stroke="#2865a0" stroke-width="3" /><rect x="710" y="507" width="430" height="67" fill="#2865a0" opacity="0.12" rx="3" /><text x="925.0" y="549.5" font-size="26" fill="#2865a0" text-anchor="middle">次数 0，金额和 0</text><text x="45" y="623" font-size="25" fill="#213447" text-anchor="start">没有最近事件，recency 仍未知；这与完整金额和为 0 并不冲突。</text><line x1="40" y1="663" x2="1160" y2="663" stroke="#dce5ed" stroke-width="2" /><text x="40" y="719" font-size="27" fill="#213447" text-anchor="start">四条模型输入的逐项对照</text><text x="80" y="775" font-size="24" fill="#213447" text-anchor="middle">用户</text><text x="300" y="775" font-size="24" fill="#213447" text-anchor="middle">支付数</text><text x="540" y="775" font-size="24" fill="#213447" text-anchor="middle">金额有效数</text><text x="800" y="775" font-size="24" fill="#213447" text-anchor="middle">完整金额和</text><text x="1070" y="775" font-size="24" fill="#213447" text-anchor="middle">最近间隔 / 天</text><text x="80" y="827" font-size="26" fill="#2865a0" text-anchor="middle">A</text><text x="300" y="827" font-size="26" fill="#2865a0" text-anchor="middle">1</text><text x="540" y="827" font-size="26" fill="#2865a0" text-anchor="middle">1</text><text x="800" y="827" font-size="26" fill="#2865a0" text-anchor="middle">10</text><text x="1070" y="827" font-size="26" fill="#2865a0" text-anchor="middle">6</text><text x="80" y="876" font-size="26" fill="#2865a0" text-anchor="middle">B</text><text x="300" y="876" font-size="26" fill="#2865a0" text-anchor="middle">2</text><text x="540" y="876" font-size="26" fill="#2865a0" text-anchor="middle">1</text><text x="800" y="876" font-size="26" fill="#c87536" text-anchor="middle">未知</text><text x="1070" y="876" font-size="26" fill="#2865a0" text-anchor="middle">2</text><text x="80" y="925" font-size="26" fill="#2865a0" text-anchor="middle">C</text><text x="300" y="925" font-size="26" fill="#2865a0" text-anchor="middle">0</text><text x="540" y="925" font-size="26" fill="#2865a0" text-anchor="middle">0</text><text x="800" y="925" font-size="26" fill="#2865a0" text-anchor="middle">0</text><text x="1070" y="925" font-size="26" fill="#c87536" text-anchor="middle">未知</text><text x="80" y="974" font-size="26" fill="#2865a0" text-anchor="middle">D</text><text x="300" y="974" font-size="26" fill="#2865a0" text-anchor="middle">1</text><text x="540" y="974" font-size="26" fill="#2865a0" text-anchor="middle">1</text><text x="800" y="974" font-size="26" fill="#2865a0" text-anchor="middle">30</text><text x="1070" y="974" font-size="26" fill="#2865a0" text-anchor="middle">1</text></g></svg>

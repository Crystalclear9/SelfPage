<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><rect width="1400" height="680" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b8c" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#17324b"><text x="45" y="49" font-size="34" fill="#17324b" text-anchor="start">同一批四条记录：保留计数，才能合并总体均值</text><text x="45" y="105" font-size="27" fill="#17324b" text-anchor="start">原始记录</text><text x="485" y="105" font-size="27" fill="#17324b" text-anchor="start">可合并状态 (计数, 总和)</text><text x="1010" y="105" font-size="27" fill="#17324b" text-anchor="start">合并后的总体</text><text x="45" y="193" font-size="32" fill="#24679b" text-anchor="start">A</text><rect x="95" y="145" width="80" height="75" rx="8" fill="white" stroke="#24679b" stroke-width="2"/><text x="135" y="193" font-size="31" fill="#24679b" text-anchor="middle">10</text><path d="M400 182 L475 182" stroke="#647b8c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="495" y="145" width="340" height="75" rx="8" fill="white" stroke="#24679b" stroke-width="2"/><text x="665" y="193" font-size="32" fill="#24679b" text-anchor="middle">(1, 10)</text><text x="45" y="328" font-size="32" fill="#c96822" text-anchor="start">B</text><rect x="95" y="280" width="80" height="75" rx="8" fill="white" stroke="#c96822" stroke-width="2"/><text x="135" y="328" font-size="31" fill="#c96822" text-anchor="middle">20</text><rect x="195" y="280" width="80" height="75" rx="8" fill="white" stroke="#c96822" stroke-width="2"/><text x="235" y="328" font-size="31" fill="#c96822" text-anchor="middle">20</text><rect x="295" y="280" width="80" height="75" rx="8" fill="white" stroke="#c96822" stroke-width="2"/><text x="335" y="328" font-size="31" fill="#c96822" text-anchor="middle">20</text><path d="M400 317 L475 317" stroke="#647b8c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="495" y="280" width="340" height="75" rx="8" fill="white" stroke="#c96822" stroke-width="2"/><text x="665" y="328" font-size="32" fill="#c96822" text-anchor="middle">(3, 60)</text><path d="M855 183 L950 245" stroke="#647b8c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M855 318 L950 265" stroke="#647b8c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="975" y="205" width="365" height="115" rx="8" fill="white" stroke="#24679b" stroke-width="2"/><text x="1158" y="250" font-size="29" fill="#24679b" text-anchor="middle">(1 + 3, 10 + 60)</text><text x="1158" y="295" font-size="31" fill="#24679b" text-anchor="middle">= (4, 70)</text><path d="M45 400 H1350" stroke="#d4dfe6"/><text x="65" y="455" font-size="29" fill="#c96822" text-anchor="start">只保留两个组均值</text><text x="250" y="518" font-size="30" fill="#c96822" text-anchor="middle">10 + 20</text><path d="M170 530 H330" stroke="#c96822" stroke-width="2"/><text x="250" y="569" font-size="30" fill="#c96822" text-anchor="middle">2</text><text x="355" y="540" font-size="33" fill="#c96822" text-anchor="start">= 15</text><text x="765" y="455" font-size="29" fill="#24679b" text-anchor="start">先合并总和与有效计数</text><text x="965" y="518" font-size="30" fill="#24679b" text-anchor="middle">10 + 60</text><path d="M885 530 H1045" stroke="#24679b" stroke-width="2"/><text x="965" y="569" font-size="30" fill="#24679b" text-anchor="middle">1 + 3</text><text x="1075" y="540" font-size="33" fill="#24679b" text-anchor="start">= 17.5</text><text x="65" y="635" font-size="26" fill="#c96822" text-anchor="start">每组等权：回答组平均的问题</text><text x="765" y="635" font-size="26" fill="#24679b" text-anchor="start">每条原记录等权：回答总体均值的问题</text></g></svg>

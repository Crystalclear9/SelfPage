<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title id="figure-title">训练与服务一致性：用同一锚点做数值回放</title><desc id="figure-desc">固定预测锚点和当时可用事件，离线与在线逻辑都应输出次数二、金额三百分；单边把分改为元会造成失配。</desc><rect width="1200" height="690" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">训练与服务一致性：用同一锚点做数值回放</text><text x="40" y="112" font-size="27" fill="#213447" text-anchor="start" font-weight="400">固定用户与预测时刻 t=10，回放同一份当时已知的记录</text><rect x="40" y="165" width="1100" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="590.0" y="212.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">t=4：100 分，可用 t=5；t=8：200 分，可用 t=9</text><text x="40" y="290" font-size="28" fill="#213447" text-anchor="start" font-weight="400">契约：事件在 [3,10)，可用时间 ≤10，金额单位为分</text><rect x="50" y="350" width="390" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="245.0" y="397.65" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">离线历史回放</text><rect x="760" y="350" width="390" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="955.0" y="396.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">在线逻辑的同锚点回放</text><path d="M245 440 L245 480" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M955 440 L955 480" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="50" y="495" width="390" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="245.0" y="541.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">[次数, 金额和] = [2,300]</text><rect x="760" y="495" width="390" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="955.0" y="541.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">[次数, 金额和] = [2,300]</text><text x="600" y="540" font-size="29" fill="#213447" text-anchor="middle" font-weight="400">核对</text><text x="40" y="640" font-size="27" fill="#213447" text-anchor="start" font-weight="400">若一侧把分换成元，第二列就变为 3：版本号相同也会失配。</text></g></svg>

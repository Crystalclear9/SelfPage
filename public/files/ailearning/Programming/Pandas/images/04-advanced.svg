<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">训练与服务要执行同一份特征契约</title><desc id="desc">离线和在线面对的原始记录不同，但特征列顺序、单位、缺失处理和时间约束应遵循同一份定义。图中两路汇合的是语义契约，而不是要求不同时间的具体特征值逐项相等。 还需通过固定样本与记录回放核对实际实现。只记录一个版本字符串不能证明代码一致；依赖的字典、外部表和预处理参数也必须被固定。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">训练与服务要执行同一份特征契约</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">离线与在线共享列定义、单位、缺失规则及可用时间条件。</text><path d="M350,313.734 L450,281.266" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M350,413.669 L450,451.331" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,280.673 L840,314.327" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,452.019 L840,412.981" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="65" y="305" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="207.5" y="368" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">固定特征定义与版本</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">离线：历史回放</text><rect x="450" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">在线：当前可用记录</text><rect x="840" y="305" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="982.5" y="352.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">一致的列、单位与缺失规</text><text x="982.5" y="383.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">则</text></g></svg>

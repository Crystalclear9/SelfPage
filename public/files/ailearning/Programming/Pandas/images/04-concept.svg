<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：在同一时间轴上区分特征窗口和标签窗口</title><desc id="detail-desc">在同一时间轴上区分特征窗口和标签窗口。预测发生在 10，标签需观察到 17；14 时提取只能看到 12 的事件，尚未看到 16 的事件，因此计数标签仍未成熟。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="67" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">特征窗口 [3, 10)</text><line x1="80" y1="115" x2="1020" y2="115" stroke="#627689" stroke-width="3" /><text x="30" y="252" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">标签窗口 (10, 17]</text><line x1="80" y1="300" x2="1020" y2="300" stroke="#627689" stroke-width="3" /><line x1="80.0" y1="100" x2="80.0" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="80.0" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">3</text><line x1="147.14285714285714" y1="100" x2="147.14285714285714" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="147.14285714285714" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">4</text><line x1="415.7142857142857" y1="100" x2="415.7142857142857" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="415.7142857142857" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">8</text><line x1="550.0" y1="100" x2="550.0" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="550.0" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">10</text><line x1="684.2857142857143" y1="100" x2="684.2857142857143" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="684.2857142857143" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">12</text><line x1="818.5714285714286" y1="100" x2="818.5714285714286" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="818.5714285714286" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">14</text><line x1="952.8571428571429" y1="100" x2="952.8571428571429" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="952.8571428571429" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">16</text><line x1="1020.0" y1="100" x2="1020.0" y2="318" stroke="#cbd9e4" stroke-width="1" stroke-dasharray="3 6" /><text x="1020.0" y="353" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">17</text><circle cx="147.14285714285714" cy="115" r="10" fill="#2865a0" stroke="white" stroke-width="2" /><circle cx="415.7142857142857" cy="115" r="10" fill="#2865a0" stroke="white" stroke-width="2" /><circle cx="684.2857142857143" cy="300" r="10" fill="#cf7432" stroke="white" stroke-width="2" /><circle cx="952.8571428571429" cy="300" r="10" fill="#cf7432" stroke="white" stroke-width="2" /><line x1="818.5714285714286" y1="65" x2="818.5714285714286" y2="375" stroke="#158476" stroke-width="3" /><text x="748.5714285714286" y="30" font-size="23" fill="#158476" font-weight="600" text-anchor="start">提取时刻 14</text><text x="120" y="200" font-size="23" fill="#213447" font-weight="400" text-anchor="start">特征只使用预测时刻前已可用的事件</text><text x="650" y="405" font-size="22" fill="#cf7432" font-weight="400" text-anchor="start">14 时仅见 1 次；
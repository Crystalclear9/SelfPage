<svg xmlns="http://www.w3.org/2000/svg" width="1175.000" height="786.000" viewBox="16.000 54.000 1175.000 786.000" role="img" aria-labelledby="title desc"><title id="title">同一份样本，有“何时决策”和“何时才能训练”两道边界</title><desc id="desc">复用完整实验的16个锚点。1月10、20、30日及2月8日各四人，标签成熟分别1月19、29日、2月8、17日。1月20拟合只可用第一组，2月12抽取看到前三组成熟。 同一份样本，有“何时决策”和“何时才能训练”两道边界 成熟标签不倒流进过去模型；2/8 的未成熟标签保留未知，不能填成 0。</desc><rect width="1175.0" height="786.0" fill="white" x="16.0" y="54.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="100" font-size="26" fill="#627689" text-anchor="start">四位用户 × 四个评分日；每次观察未来 7 日，再等待来源回流 2 日。</text><rect x="45" y="132" width="38" height="24" fill="#627689" opacity="0.2" rx="3" /><text x="97" y="155" font-size="25" fill="#627689" text-anchor="start">历史特征 7 日</text><rect x="345" y="132" width="38" height="24" fill="#2865a0" opacity="0.8" rx="3" /><text x="397" y="155" font-size="25" fill="#2865a0" text-anchor="start">未来标签 7 日</text><rect x="665" y="132" width="38" height="24" fill="#c87536" opacity="0.8" rx="3" /><text x="717" y="155" font-size="25" fill="#c87536" text-anchor="start">回流等待 2 日</text><line x1="270" y1="205" x2="270" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="270" y="188" font-size="24" fill="#627689" text-anchor="middle">1/3</text><line x1="396" y1="205" x2="396" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="396" y="188" font-size="24" fill="#627689" text-anchor="middle">1/10</text><line x1="576" y1="205" x2="576" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="576" y="188" font-size="24" fill="#627689" text-anchor="middle">1/20</text><line x1="756" y1="205" x2="756" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="756" y="188" font-size="24" fill="#627689" text-anchor="middle">1/30</text><line x1="918" y1="205" x2="918" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="918" y="188" font-size="24" fill="#627689" text-anchor="middle">2/8</text><line x1="990" y1="205" x2="990" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="990" y="188" font-size="24" fill="#627689" text-anchor="middle">2/12</text><line x1="1080" y1="205" x2="1080" y2="720" stroke="#dce5ed" stroke-width="2" /><text x="1080" y="188" font-size="24" fill="#627689" text-anchor="middle">2/17</text><line x1="576" y1="200" x2="576" y2="720" stroke="#2865a0" stroke-width="2" stroke-dasharray="7 6" /><text x="564" y="230" font-size="24" fill="#2865a0" text-anchor="end">拟合日</text><line x1="990" y1="200" x2="990" y2="720" stroke="#c87536" stroke-width="2" stroke-dasharray="7 6" /><text x="1002" y="230" font-size="24" fill="#c87536" text-anchor="start">抽取日</text><text x="40" y="331" font-size="26" fill="#213447" text-anchor="start">1/10 × 4</text><rect x="270" y="300" width="126" height="46" fill="#627689" opacity="0.15" rx="3" /><rect x="396" y="300" width="126" height="46" fill="#2865a0" opacity="0.85" rx="3" /><text x="459.0" y="332.0" font-size="25" fill="#ffffff" text-anchor="middle">7 日</text><rect x="522" y="300" width="36" height="46" fill="#c87536" opacity="0.8" rx="3" /><circle cx="396" cy="323" r="5" fill="#213447" /><circle cx="558" cy="323" r="6" fill="#c87536" /><text x="550.0" y="382" font-size="24" fill="#627689" text-anchor="end">1/19</text><text x="1140" y="331" font-size="27" fill="#2865a0" text-anchor="middle">训练</text><text x="40" y="441" font-size="26" fill="#213447" text-anchor="start">1/20 × 4</text><rect x="450" y="410" width="126" height="46" fill="#627689" opacity="0.15" rx="3" /><rect x="576" y="410" width="126" height="46" fill="#2865a0" opacity="0.85" rx="3" /><text x="639.0" y="442.0" font-size="25" fill="#ffffff" text-anchor="middle">7 日</text><rect x="702" y="410" width="36" height="46" fill="#c87536" opacity="0.8" rx="3" /><circle cx="576" cy="433" r="5" fill="#213447" /><circle cx="738" cy="433" r="6" fill="#c87536" /><text x="730.0" y="492" font-size="24" fill="#627689" text-anchor="end">1/29</text><text x="1140" y="441" font-size="27" fill="#2865a0" text-anchor="middle">验证</text><text x=
<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1346" viewBox="0 0 1440 1346" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">构造未来标签时，样本是否成熟取决于观察窗是否完整</title><rect width="1440" height="1346" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">构造未来标签时，样本是否成熟取决于观察窗是否完整</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1204" viewBox="0 0 1440 1290" role="img" x="48" y="106" overflow="hidden"><title>标签窗口的成熟与右端未知区间</title><svg width="1440" height="840" viewBox="0 0 1320 770" role="img"><title>标签窗口的成熟与右端未知区间</title><rect width="1320" height="770" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1672a0" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1e9195" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="180" y1="650" x2="1155" y2="650" stroke="#818fa4" stroke-width="2" marker-end="url(#g)"/><line x1="180" y1="642" x2="180" y2="659" stroke="#818fa4" stroke-width="2"/><text x="180" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">0</text><line x1="330" y1="642" x2="330" y2="659" stroke="#818fa4" stroke-width="2"/><text x="330" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">2</text><line x1="480" y1="642" x2="480" y2="659" stroke="#818fa4" stroke-width="2"/><text x="480" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">4</text><line x1="630" y1="642" x2="630" y2="659" stroke="#818fa4" stroke-width="2"/><text x="630" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">6</text><line x1="780" y1="642" x2="780" y2="659" stroke="#818fa4" stroke-width="2"/><text x="780" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">8</text><line x1="930" y1="642" x2="930" y2="659" stroke="#818fa4" stroke-width="2"/><text x="930" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">10</text><line x1="1080" y1="642" x2="1080" y2="659" stroke="#818fa4" stroke-width="2"/><text x="1080" y="700" font-size="28" fill="#818fa4" text-anchor="middle" font-weight="400">12</text><text x="1130" y="742" font-size="28" fill="#818fa4" text-anchor="start" font-weight="400">时间</text><line x1="930" y1="80" x2="930" y2="655" stroke="#d37537" stroke-width="2" stroke-dasharray="7 7"/><text x="930" y="48" font-size="30" fill="#d37537" text-anchor="middle" font-weight="400">抽取截点 10</text><text x="40" y="180" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">预测 2</text><line x1="330" y1="160" x2="630" y2="160" stroke="#1672a0" stroke-width="38"/><circle cx="330" cy="160" r="8" fill="#20354a" stroke="#20354a" stroke-width="2"/><line x1="630" y1="125" x2="630" y2="195" stroke="#1672a0" stroke-width="3"/><text x="330" y="240" font-size="30" fill="#1672a0" text-anchor="start" font-weight="400">2 + 4 = 6</text><text x="1120" y="175" font-size="30" fill="#1672a0" text-anchor="start" font-weight="400">已成熟</text><text x="40" y="360" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">预测 5</text><line x1="555" y1="340" x2="855" y2="340" stroke="#1672a0" stroke-width="38"/><circle cx="555" cy="340" r="8" fill="#20354a" stroke="#20354a" stroke-width="2"/><line x1="855" y1="305" x2="855" y2="375" stroke="#1672a0" stroke-width="3"/><text x="555" y="420" font-size="30" fill="#1672a0" text-anchor="start" font-weight="400">5 + 4 = 9</text><text x="1120" y="355" font-size="30" fill="#1672a0" text-anchor="start" font-weight="400">已成熟</text><text x="40" y="540" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">预测 8</text><line x1="780" y1="520" x2="1080" y2="520" stroke="#d37537" stroke-width="38"/><circle cx="780" cy="520" r="8" fill="#20354a" stroke="#20354a" stroke-width="2"/><line x1="1080" y1="485" x2="1080" y2="555" stroke="#d37537" stroke-width="3"/><line x1="930" y1="520" x2="1080" y2="520" stroke="#f3dbc8" stroke-width="38"/><line x1="930" y1="520" x2="1080" y2="520" stroke="#d37537" stroke-width="2" stroke-dasharray="6 7"/><text x="780" y="600" font-size="30" fill="#d37537" text-anchor="start" font-weight="400">8 + 4 = 12</text><text x="1120" y="535" font-size="30" fill="#d37537" text-anchor="start" font-weight="400">后段未知</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 840) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">观察窗未结束：已见正例和未见事件具有不同的信息状态</text><text x="65" y="120" font-size="30" fill="#1d3145" text-anchor="start">预测 t=8；标签窗 (8,12]；当前抽取 t=10</text><line x1="160" y1="220" x2="1210" y2="220" stroke="#818fa4" stroke-width="2" stroke-dasharray=""/><line x1="685" y1="155" x2="685" y2="320" stroke="#c66d3a" stroke-width="3" stroke-dasharray="8 6"/><circle cx="160" cy="220" r="7" fill="#1e7499" stroke="#1e7499" stroke-width="2"/><text x="160" y="265" font-size="28" fill="#1d3145" text-anchor="middle">8</text><circle cx="685" cy="220" r="7" fill="#1e7499" stroke="#1e7499" stroke-width="2"/><text x="685" y="265" font-size="28" fill="#1d3145" text-anchor="middle">10：抽取</text><circle cx="1210" cy="220" r="7" fill="#1e7499" stroke="#1e7499" stroke-width="2"/><text x="1210" y="265" font-size="28" fill="#1d3145" text-anchor="middle">12：窗末</text><circle cx="422" cy="220" r="10" fill="#c66d3a" stroke="#c66d3a" stroke-width="2"/><text x="422" y="175" font-size="29" fill="#c66d3a" text-anchor="middle">已见一次购买</text><text x="65" y="350" font-size="27" fill="#1d3145" text-anchor="start">若目标是“窗内至少一次购买”，该正例已确定为 1；未见购买仍不能定为 0。</text><text x="65" y="408" font-size="27" fill="#1d3145" text-anchor="start">统一等待完整窗可保持一致入样政策；不能只提前收正例而把其余对象当负例。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：横轴是事件发生时间，纵轴是记录实际可用时间</title><desc id="detail-desc">横轴是事件发生时间，纵轴是记录实际可用时间。预测时刻为 9 时，两项时间条件必须同时满足；点 (8,10) 位于可用区域上方，即使事件已经发生也不能用于当时的预测。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="100" y1="370.0" x2="660" y2="370.0" stroke="#cbd9e4" stroke-width="1" /><text x="88" y="376.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">0</text><line x1="100" y1="295.0" x2="660" y2="295.0" stroke="#cbd9e4" stroke-width="1" /><text x="88" y="301.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">3</text><line x1="100" y1="220.0" x2="660" y2="220.0" stroke="#cbd9e4" stroke-width="1" /><text x="88" y="226.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">6</text><line x1="100" y1="145.0" x2="660" y2="145.0" stroke="#cbd9e4" stroke-width="1" /><text x="88" y="151.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">9</text><line x1="100" y1="70.0" x2="660" y2="70.0" stroke="#cbd9e4" stroke-width="1" /><text x="88" y="76.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">12</text><line x1="100" y1="370" x2="660" y2="370" stroke="#627689" stroke-width="1.6" /><line x1="100" y1="70" x2="100" y2="370" stroke="#
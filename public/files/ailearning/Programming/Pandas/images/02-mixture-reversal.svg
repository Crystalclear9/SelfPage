<svg xmlns="http://www.w3.org/2000/svg" width="1252.267" height="831.754" viewBox="13.867 62.915 1252.267 831.754"><rect width="1252.267" height="831.754" fill="white" x="13.867" y="62.915" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="110" font-size="26" fill="#52677a">矩形总面积都代表 110 人；分区宽度表示人数，绿色高度表示组内通过率</text><text x="80" y="185" font-size="29" fill="#17334b">甲：容易 10 人，困难 100 人</text><rect x="80" y="245" width="40.0" height="275" fill="#f2f5f7" /><rect x="80" y="245" width="40.0" height="275" fill="#168578" opacity=".65" /><rect x="80" y="245" width="40.0" height="275" fill="none" stroke="#2474b5" stroke-width="4" /><rect x="120.0" y="245" width="400.0" height="275" fill="#f2f5f7" /><rect x="120.0" y="434.75" width="400.0" height="85.25" fill="#168578" opacity=".65" /><rect x="120.0" y="245" width="400.0" height="275" fill="none" stroke="#d5752e" stroke-width="4" /><text x="80" y="575" font-size="28" fill="#17334b">容易组：100%  ·  困难组：31%</text><text x="80" y="635" font-size="31" fill="#168578">总体：</text><text x="730" y="185" font-size="29" fill="#17334b">乙：容易 100 人，困难 10 人</text><rect x="730" y="245" width="400.0" height="275" fill="#f2f5f7" /><rect x="730" y="272.5" width="400.0" height="247.5" fill="#168578" opacity=".65" /><rect x="730" y="245" width="400.0" height="275" fill="none" stroke="#2474b5" stroke-width="4" /><rect x="1130.0" y="245" width="40.0" height="275" fill="#f2f5f7" /><rect x="1130.0" y="437.5" width="40.0" height="82.5" fill="#168578" opacity=".65" /><rect x="1130.0" y="245" width="40.0" height="275" fill="none" stroke="#d5752e" stroke-width="4" /><text x="730" y="575" font-size="28" fill="#17334b">容易组：90%  ·  困难组：30%</text><text x="730" y="635" font-size="31" fill="#168578">总体：</text><path d="M40 690 H1240" stroke="#d8e1e8" stroke-width="2" /><text x="40" y="748" font-size="30" fill="#17334b">共同改为容易、困难各占一半：</text><text x="60" y="809" font-size="31" fill="#2474b5">甲：65.5%      乙：60.0%</text><text x="60" y="865" font-size="28" fill="#17334b">相同非负权重下，组内全面占优不会反转；分组仍不自动证明因果。</text><text x="205" y="612" font-size="28">41</text><path d="M191 624 H260" stroke="#17334b" stroke-width="2" /><text x="195" y="657" font-size="28">110</text><text x="282" y="640" font-size="31" fill="#168578">≈ 37.27%</text><text x="855" y="612" font-size="28">93</text><path d="M841 624 H910" stroke="#17334b" stroke-width="2" /><text x="845" y="657" font-size="28">110</text><text x="932" y="640" font-size="31" fill="#168578">≈ 84.55%</text></g><desc> 每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc></svg>

<text x="74" y="629" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">甲 65.5%，乙 60.0%，比较回到组内方向。</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1034.6829" viewBox="0 0 1440 1034.6829" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两方案组内甲均占优，但甲以困难组为主导致总体通过率较低；统一权重后甲重新占优</title><rect width="1440" height="1034.6829" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="33" font-weight="700" fill="#142b45">两方案组内甲均占优，但甲以困难组为主导致总体通过率较低；统一权重后甲重新占优</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="892.6829" viewBox="13.867 62.915 1252.267 831.754" x="48" y="106" overflow="hidden"><rect width="1252.267" height="831.754" fill="white" x="13.867" y="62.915"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="110" font-size="26" fill="#527087">矩形总面积都代表 110 人；分区宽度表示人数，绿色高度表示组内通过率</text><text x="80" y="185" font-size="29" fill="#173c58">甲：容易 10 人，困难 100 人</text><rect x="80" y="245" width="40.0" height="275" fill="#f2f5f7"/><rect x="80" y="245" width="40.0" height="275" fill="#148f94" opacity=".65"/><rect x="80" y="245" width="40.0" height="275" fill="none" stroke="#1f81c7" stroke-width="4"/><rect x="120.0" y="245" width="400.0" height="275" fill="#f2f5f7"/><rect x="120.0" y="434.75" width="400.0" height="85.25" fill="#148f94" opacity=".65"/><rect x="120.0" y="245" width="400.0" height="275" fill="none" stroke="#d07533" stroke-width="4"/><text x="80" y="575" font-size="28" fill="#173c58">容易组：100%  ·  困难组：31%</text><text x="80" y="635" font-size="31" fill="#148f94">总体：</text><text x="730" y="185" font-size="29" fill="#173c58">乙：容易 100 人，困难 10 人</text><rect x="730" y="245" width="400.0" height="275" fill="#f2f5f7"/><rect x="730" y="272.5" width="400.0" height="247.5" fill="#148f94" opacity=".65"/><rect x="730" y="245" width="400.0" height="275" fill="none" stroke="#1f81c7" stroke-width="4"/><rect x="1130.0" y="245" width="40.0" height="275" fill="#f2f5f7"/><rect x="1130.0" y="437.5" width="40.0" height="82.5" fill="#148f94" opacity=".65"/><rect x="1130.0" y="245" width="40.0" height="275" fill="none" stroke="#d07533" stroke-width="4"/><text x="730" y="575" font-size="28" fill="#173c58">容易组：90%  ·  困难组：30%</text><text x="730" y="635" font-size="31" fill="#148f94">总体：</text><path d="M40 690 H1240" stroke="#dce2eb" stroke-width="2"/><text x="40" y="748" font-size="30" fill="#173c58">共同改为容易、困难各占一半：</text><text x="60" y="809" font-size="31" fill="#1f81c7">甲：65.5%      乙：60.0%</text><text x="60" y="865" font-size="28" fill="#173c58">相同非负权重下，组内全面占优不会反转；分组仍不自动证明因果。</text><text x="205" y="612" font-size="28">41</text><path d="M191 624 H260" stroke="#173c58" stroke-width="2"/><text x="195" y="657" font-size="28">110</text><text x="282" y="640" font-size="31" fill="#148f94">≈ 37.27%</text><text x="855" y="612" font-size="28">93</text><path d="M841 624 H910" stroke="#173c58" stroke-width="2"/><text x="845" y="657" font-size="28">110</text><text x="932" y="640" font-size="31" fill="#148f94">≈ 84.55%</text></g><desc> 每组都更高，总体却更低：变化的是群体权重 ≈ 84.55%</desc></svg></svg>

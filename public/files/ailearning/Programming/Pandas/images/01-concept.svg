<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="467.69" viewBox="-13.81 -14.27 974.48 379.80" role="img"><title id="detail-title">机制展开：沿两条分支比较分母：原始列是 10、缺失、20，跳过缺失得到 15，填零后得到 10</title><desc id="detail-desc">沿两条分支比较分母：原始列是 10、缺失、20，跳过缺失得到 15，填零后得到 10。图中缺失格特意与数值格区分，因为填零引入了额外假设。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><circle cx="30" cy="25" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="30" y="32" font-size="24" fill="white" font-weight="700" text-anchor="middle">1</text><text x="55" y="32" font-size="24" fill="#213447" font-weight="600" text-anchor="start">同一列：已观测值与缺失位置</text><rect x="35" y="110" width="130" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="100.0" y="152.25" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">10</text><rect x="170" y="110" width="130" height="65" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="235.0" y="152.25" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">缺失</text><rect x="305" y="110" width="130" height="65" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="370.0" y="152.25" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">20</text><line x1="35" y1="220" x2="430" y2="220" stroke="#2865a0" stroke-width="4" /><text x="40" y="265" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">已观测和 = 30</text><path d="M470,145 L610,100" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M470,170 L610,285" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="640" y="40" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">跳过缺失：观测均值</text><text x="735.0" y="86" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">10 + 20</text><line x1="650" y1="100" x2="820" y2="100" stroke="#213447" stroke-width="1.6" /><text x="735.0" y="130" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text><text x="835" y="108" font-size="25" fill="#158476" font-weight="600" text-anchor="start">= 15</text><text x="640" y="230" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">填 0：改变了统计问题</text><text x="755.0" y="286" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">10 + 0 + 20</text><line x1="650" y1="300" x2="860" y2="300" stroke="#213447" stroke-width="1.6" /><text x="755.0" y="330" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">3</text><text x="875" y="308" font-size="25" fill="#158476" font-weight="600" text-anchor="start">= 10</text></g></svg>

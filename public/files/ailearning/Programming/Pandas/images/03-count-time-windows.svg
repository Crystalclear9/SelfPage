<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1122.000" height="537.000" viewBox="16.000 62.000 1122.000 537.000" role="img"><title id="figure-title">按记录数取窗口与按时间长度取窗口</title><desc id="figure-desc">上方四个点的时间为 1、9、10、11，金额依次为 1、2、3、4，预测发生在 12。历史五个时间单位取 [7,12)，纳入三条记录，均值为 3；最近两条记录只取时间 10、11，均值为 3.5。图中所有事件都已可用，也没有落在争议端点上，因此差异纯粹来自窗口定义。记录数窗口不保证固定时间跨度，时间窗口也不保证固定记录数；实际实现还要明确端点、排序及可用时间条件。 按记录数取窗口与按时间长度取窗口</desc><rect width="1122.0" height="537.0" fill="white" x="16.0" y="62.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="110" font-size="28" fill="#213447" text-anchor="start" font-weight="400">预测 t=12；点上为事件时间，点下为金额</text><line x1="200" y1="235" x2="1100" y2="235" stroke="#627689" stroke-width="2" /><circle cx="275" cy="235" r="9" fill="#2865a0" /><text x="275" y="195" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="275" y="285" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">1</text><circle cx="875" cy="235" r="9" fill="#2865a0" /><text x="875" y="195" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">9</text><text x="875" y="285" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">2</text><circle cx="950" cy="235" r="9" fill="#2865a0" /><text x="950" y="195" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><text x="950" y="285" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">3</text><circle cx="1025" cy="235" r="9" fill="#2865a0" /><text x="1025" y="195" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">11</text><text x="1025" y="285" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">4</text><text x="40" y="365" font-size="27" fill="#2865a0" text-anchor="start" font-weight="600">最近 5 个时间单位</text><line x1="725" y1="380" x2="1100" y2="380" stroke="#2865a0" stroke-width="8" /><text x="40" y="470" font-size="27" fill="#c87536" text-anchor="start" font-weight="600">最近 2 条记录</text><circle cx="950" cy="470" r="12" fill="#c87536" /><circle cx="1025" cy="470" r="12" fill="#c87536" /><text x="450.0" y="526" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2 + 3 + 4</text><line x1="355" y1="540" x2="545" y2="540" stroke="#2865a0" stroke-width="1.6" /><text x="450.0" y="574" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><text x="563" y="549" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">= 3</text><text x="900.0" y="526" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">3 + 4</text><line x1="835" y1="540" x2="965" y2="540" stroke="#c87536" stroke-width="1.6" /><text x="900.0" y="574" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">2</text><text x="983" y="549" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">= 3.5</text><text x="725" y="420" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">7</text><text x="1100" y="420" font-size="26" fill="#2865a0" text-anchor="middle" font-weight="400">12</text></g></svg>

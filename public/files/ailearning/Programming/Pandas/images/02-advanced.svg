<svg xmlns="http://www.w3.org/2000/svg" width="1117.749" height="518.232" viewBox="41.514 131.606 1117.749 518.232" role="img" aria-labelledby="title desc"><rect width="1117.749" height="518.232" fill="white" data-white-background="true" x="41.514" y="131.606" /><title id="title">先聚合再连接需要唯一性条件</title><desc id="desc">先把三个订单按用户聚合，得到 u 的 30 和 v 的 5，再连接每用户唯一的属性表，可以保持用户粒度的两条结果。图先突出哪些原始行共同贡献一个汇总。 这里成立的条件是属性连接在用户键上唯一、聚合量可按所用算子组合，且过滤语义没有被移动。属性一对多、跨表过滤或非可加统计量，都可能使改写不再等价。 属性表按用户唯一；否则即使先聚合仍会复制汇总金额。 先聚合再连接需要唯一性条件 连接保证为一对一时，汇总结果才不会因属性匹配而复制。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2865a0" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="65" y="210" width="235" height="86" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="182" y="262" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">u：10</text><rect x="65" y="360" width="235" height="86" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="182" y="412" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">u：20</text><rect x="65" y="540" width="235" height="86" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="182" y="592" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">v：5</text><path d="M300,253 L460,325" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,403 L460,325" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,583 L460,565" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="470" y="280" width="260" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="335" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">u 的汇总：30</text><rect x="470" y="520" width="260" height="90" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="575" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">v 的汇总：5</text><path d="M735,325 L830,325" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,565 L830,565" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="845" y="280" width="290" height="90" fill="#e7edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="990" y="335" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">u，30，属性 A</text><rect x="845" y="520" width="290" height="90" fill="#e7edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="990" y="575" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">v，5，属性 B</text><text x="65" y="175" font-size="24" fill="#627689" text-anchor="start" font-weight="400">订单粒度：三行</text><text x="470" y="175" font-size="24" fill="#627689" text-anchor="start" font-weight="400">用户粒度：两行</text><text x="845" y="175" font-size="24" fill="#627689" text-anchor="start" font-weight="400">唯一属性连接后：两行</text></g></svg>

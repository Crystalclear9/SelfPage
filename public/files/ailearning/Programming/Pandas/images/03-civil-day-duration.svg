<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1076.3048" viewBox="0 0 1440 1076.3048" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">夏令时切换时自然日与固定24小时窗口的实际时长</title><rect width="1440" height="1076.3048" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">夏令时切换时自然日与固定24小时窗口的实际时长</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="934.3048" viewBox="16 50 1076 748" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">自然日窗口与 24 小时窗口，成员为什么不同？</title><desc id="desc">夏令时春季当地日为23小时，秋季当地日为25小时。固定24小时窗口分别多算前日一小时和漏算当日一小时。 自然日窗口与 24 小时窗口，成员为什么不同？ 横向长度按实际小时绘制；先定业务日历边界，再转换到 UTC 比较。</desc><rect width="1076.0" height="748.0" fill="white" x="16.0" y="50.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="25" fill="#617f97" text-anchor="start">纽约时区 · 蓝色为前一自然日，橙色为截止同一时刻的固定 24 小时</text><text x="40" y="170" font-size="29" fill="#1f3449" text-anchor="start">春季锚点 2024-03-11 00:00：前一自然日 23 小时</text><text x="40" y="240" font-size="26" fill="#2472b1" text-anchor="start">自然日</text><rect x="320" y="208" width="621" height="40" fill="#2472b1" opacity="0.85" rx="3"/><text x="959" y="238" font-size="27" fill="#2472b1" text-anchor="start">23 h</text><text x="40" y="303" font-size="26" fill="#c57439" text-anchor="start">固定时长</text><rect x="293" y="271" width="648" height="40" fill="#c57439" opacity="0.8" rx="3"/><text x="959" y="301" font-size="27" fill="#c57439" text-anchor="start">24 h</text><line x1="320" y1="194" x2="320" y2="321" stroke="#dce5ed" stroke-width="2"/><line x1="941" y1="194" x2="941" y2="321" stroke="#dce5ed" stroke-width="2"/><text x="320" y="352" font-size="24" fill="#617f97" text-anchor="start">03-10 05:00 UTC</text><text x="941" y="352" font-size="24" fill="#617f97" text-anchor="end">03-11 04:00 UTC</text><text x="40" y="400" font-size="27" fill="#c57439" text-anchor="start">固定 24h 多纳入当地 03-09 的 23:00–24:00</text><text x="40" y="465" font-size="29" fill="#1f3449" text-anchor="start">秋季锚点 2024-11-04 00:00：前一自然日 25 小时</text><text x="40" y="535" font-size="26" fill="#2472b1" text-anchor="start">自然日</text><rect x="320" y="503" width="675" height="40" fill="#2472b1" opacity="0.85" rx="3"/><text x="1013" y="533" font-size="27" fill="#2472b1" text-anchor="start">25 h</text><text x="40" y="598" font-size="26" fill="#c57439" text-anchor="start">固定时长</text><rect x="347" y="566" width="648" height="40" fill="#c57439" opacity="0.8" rx="3"/><text x="1013" y="596" font-size="27" fill="#c57439" text-anchor="start">24 h</text><line x1="320" y1="489" x2="320" y2="616" stroke="#dce5ed" stroke-width="2"/><line x1="995" y1="489" x2="995" y2="616" stroke="#dce5ed" stroke-width="2"/><text x="320" y="647" font-size="24" fill="#617f97" text-anchor="start">11-03 04:00 UTC</text><text x="995" y="647" font-size="24" fill="#617f97" text-anchor="end">11-04 05:00 UTC</text><text x="40" y="695" font-size="27" fill="#c57439" text-anchor="start">固定 24h 漏掉当地 11-03 的 00:00–01:00</text><text x="40" y="770" font-size="26" fill="#1f3449" text-anchor="start">秋季同一钟面 01:30：第一次为 05:30 UTC，第二次为 06:30 UTC。</text></g></svg></svg>

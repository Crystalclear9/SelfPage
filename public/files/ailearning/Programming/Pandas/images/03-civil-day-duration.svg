<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="781" viewBox="0 0 1200 781" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">春季自然日二十三小时，秋季二十五小时</title>
<desc id="fig-desc">上图以纽约零点为右端。两类左端点通过 UTC 绝对时间对齐。</desc>
<rect x="0" y="0" width="1200" height="781" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">日历上的一天，实际时长可以不是 24 小时</text>
<text x="74" y="153" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">春季：纽约 03-11 00:00 为右端</text>
<text x="74" y="225" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">前一自然日</text>
<path d="M462 234 L475 193 L1037 193 L1024 234 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="749.5" y="221.2" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">23 小时</text>
<text x="450" y="220" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">03-10 05:00</text>
<text x="74" y="286" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">固定 24 小时</text>
<path d="M437 295 L450 254 L1037 254 L1024 295 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="737" y="282.2" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">24 小时</text>
<text x="425" y="281" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">03-10 04:00</text>
<path d="M1037 181 L1037 306" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="1037" y="338" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">03-11 04:00 UTC</text>
<text x="74" y="379" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">固定窗多包含当地前一天最后一小时。</text>
<path d="M75 396 L1125 396" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="421" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">秋季：纽约 11-04 00:00 为右端</text>
<text x="74" y="493" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">前一自然日</text>
<path d="M412 502 L425 461 L1037 461 L1024 502 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="724.5" y="489.2" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">25 小时</text>
<text x="400" y="488" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">11-03 04:00</text>
<text x="74" y="554" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">固定 24 小时</text>
<path d="M437 563 L450 522 L1037 522 L1024 563 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="737" y="550.2" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">24 小时</text>
<text x="425" y="549" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">11-03 05:00</text>
<path d="M1037 449 L1037 574" fill="none" stroke="#6e618e" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="1037" y="606" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">11-04 05:00 UTC</text>
<text x="74" y="647" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">固定窗少包含自然日开头一小时。</text>
<text x="74" y="723" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">秋季重复的 01:30 分别是 UTC 05:30 和 06:30。</text>
</svg>

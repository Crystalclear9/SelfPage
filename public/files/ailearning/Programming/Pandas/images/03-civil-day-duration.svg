<svg xmlns="http://www.w3.org/2000/svg" width="1076.000" height="748.000" viewBox="16.000 50.000 1076.000 748.000" role="img" aria-labelledby="title desc"><title id="title">自然日窗口与 24 小时窗口，成员为什么不同？</title><desc id="desc">夏令时春季当地日为23小时，秋季当地日为25小时。固定24小时窗口分别多算前日一小时和漏算当日一小时。 自然日窗口与 24 小时窗口，成员为什么不同？ 横向长度按实际小时绘制；先定业务日历边界，再转换到 UTC 比较。</desc><rect width="1076.0" height="748.0" fill="white" x="16.0" y="50.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="25" fill="#627689" text-anchor="start">纽约时区 · 蓝色为前一自然日，橙色为截止同一时刻的固定 24 小时</text><text x="40" y="170" font-size="29" fill="#213447" text-anchor="start">春季锚点 2024-03-11 00:00：前一自然日 23 小时</text><text x="40" y="240" font-size="26" fill="#2865a0" text-anchor="start">自然日</text><rect x="320" y="208" width="621" height="40" fill="#2865a0" opacity="0.85" rx="3" /><text x="959" y="238" font-size="27" fill="#2865a0" text-anchor="start">23 h</text><text x="40" y="303" font-size="26" fill="#c87536" text-anchor="start">固定时长</text><rect x="293" y="271" width="648" height="40" fill="#c87536" opacity="0.8" rx="3" /><text x="959" y="301" font-size="27" fill="#c87536" text-anchor="start">24 h</text><line x1="320" y1="194" x2="320" y2="321" stroke="#dce5ed" stroke-width="2" /><line x1="941" y1="194" x2="941" y2="321" stroke="#dce5ed" stroke-width="2" /><text x="320" y="352" font-size="24" fill="#627689" text-anchor="start">03-10 05:00 UTC</text><text x="941" y="352" font-size="24" fill="#627689" text-anchor="end">03-11 04:00 UTC</text><text x="40" y="400" font-size="27" fill="#c87536" text-anchor="start">固定 24h 多纳入当地 03-09 的 23:00–24:00</text><text x="40" y="465" font-size="29" fill="#213447" text-anchor="start">秋季锚点 2024-11-04 00:00：前一自然日 25 小时</text><text x="40" y="535" font-size="26" fill="#2865a0" text-anchor="start">自然日</text><rect x="320" y="503" width="675" height="40" fill="#2865a0" opacity="0.85" rx="3" /><text x="1013" y="533" font-size="27" fill="#2865a0" text-anchor="start">25 h</text><text x="40" y="598" font-size="26" fill="#c87536" text-anchor="start">固定时长</text><rect x="347" y="566" width="648" height="40" fill="#c87536" opacity="0.8" rx="3" /><text x="1013" y="596" font-size="27" fill="#c87536" text-anchor="start">24 h</text><line x1="320" y1="489" x2="320" y2="616" stroke="#dce5ed" stroke-width="2" /><line x1="995" y1="489" x2="995" y2="616" stroke="#dce5ed" stroke-width="2" /><text x="320" y="647" font-size="24" fill="#627689" text-anchor="start">11-03 04:00 UTC</text><text x="995" y="647" font-size="24" fill="#627689" text-anchor="end">11-04 05:00 UTC</text><text x="40" y="695" font-size="27" fill="#c87536" text-anchor="start">固定 24h 漏掉当地 11-03 的 00:00–01:00</text><text x="40" y="770" font-size="26" fill="#213447" text-anchor="start">秋季同一钟面 01:30：第一次为 05:30 UTC，第二次为 06:30 UTC。</text></g></svg>

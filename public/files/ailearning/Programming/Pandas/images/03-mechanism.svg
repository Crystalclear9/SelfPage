<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="731.77" viewBox="11.64 10.06 1113.37 678.93" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">历史窗口端点：排除当前时刻</title><desc id="desc">图固定预测时刻为 4，历史特征取区间 [1,4)，即包含左端点而排除当前时刻。未来结果采用 (4,5]，因此 t=4 的记录既不能误计为历史，也不会自动成为未来结果。 这是明确声明的一种端点约定，不是所有任务的默认值；同时间多条记录还需业务顺序，可用时间条件也必须额外满足。 本例约定历史左闭右开、结果左开右闭；端点由业务定义。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">历史窗口端点：排除当前时刻</text><path d="M250,195 L1090,195" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><path d="M418,188 L418,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="418" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><path d="M586,188 L586,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="586" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><path d="M754,188 L754,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="754" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">3</text><path d="M922,188 L922,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="922" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><path d="M1090,188 L1090,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">5</text><text x="60" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">历史特征窗口</text><rect x="418.0" y="255" width="504.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="670" y="337" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">[1,4)</text><text x="60" y="375" font-size="24" fill="#213447" text-anchor="start" font-weight="400">当前记录</text><circle cx="922" cy="395" r="11" fill="#c87536" /><text x="922" y="452" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">t=4</text><text x="60" y="490" font-size="24" fill="#213447" text-anchor="start" font-weight="400">未来结果窗口</text><rect x="922.0" y="485" width="168.0" height="48" fill="#f5dfcb" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="1006" y="567" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">(4,5]</text><text x="1090" y="650" font-size="24" fill="#627689" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

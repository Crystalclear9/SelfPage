<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="517" viewBox="0 0 1200 517" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">历史与未来窗口的开闭端点</title>
<desc id="fig-desc">同一时间轴上用两个不同窗口。预测时刻四两边都排除，该时刻的九十九不进入任一汇总。</desc>
<rect x="0" y="0" width="1200" height="517" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="77" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">同一条时间轴，两个不同窗口</text>
<path d="M338 142 L860 142" fill="none" stroke="#166d75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="338" cy="142" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="860" cy="142" r="8" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<text x="599" y="119" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">历史 [1, 4)</text>
<path d="M860 376 L1034 376" fill="none" stroke="#a74d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="860" cy="376" r="8" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<circle cx="1034" cy="376" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="947" y="353" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">未来 (4, 5]</text>
<path d="M145 255 L1063 255" fill="none" stroke="#233b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

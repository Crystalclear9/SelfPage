<text x="860" y="293" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">4</text>
<circle cx="947" cy="255" r="7" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>

<text x="1034" y="225" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" font-weight="400">50</text>
<text x="1034" y="293" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" font-weight="400">5</text>
<path d="M1034 262 L1034 367" fill="none" stroke="#a74d3a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>

29" fill="#17334b">None</text><circle cx="727" cy="775" r="13" fill="#d5752e"/><text x="40" y="865" font-size="29" fill="#168578">接受：源行 {0,1}，金额合计 1050 分；合法零金额仍被保留。</text><text x="40" y="925" font-size="29" fill="#d5752e">隔离：其余 6 行，原因标记共 7 个；源行 6 同时有两个问题。</text><text x="40" y="980" font-size="28" fill="#17334b">数量 8 = 2 + 6；身份集合还需核对无重复、无遗漏、无重叠。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">清洗应把接受与隔离两条路径对账</title><desc id="desc">三条原始字符串中有一项不能按数值规则解析。接受路径保留 10 和 20，隔离路径保留原值及原因；行数满足三等于二加一，有效金额合计为 30。 不能把解析失败直接填零后宣称原数据金额守恒，因为原值的业务金额尚未知。应分别核对行级完整性、有效金额和隔离原因，必要时回源修正。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">清洗应把接受与隔离两条路径对账</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">输入三条应对账为接受两条、隔离一条，而非静默丢弃。</text><path d="M345,311.154 L450,278.846" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,409.808 L450,450.192" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,235 L850,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,505 L850,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M673.981,290 L911.019,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="300" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="347.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">三条原始金额：10、</text><text x="202.5" y="378.5" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">oops、20</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">接受：10 与 20</text><rect x="450" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">隔离：oops 与失败原因</text><rect x="850" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="243" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">有效合计 30；接受数 2</text><rect x="850" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">输入 3 = 接受 2 + 隔离 1</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1505.62" height="1339.09" viewBox="0 0 1505.62 1339.09" role="img"><title>02-分组连接与防止数据泄漏</title><svg xmlns="http://www.w3.org/2000/svg" width="1505.62" height="868.586" viewBox="33.000 89.332 1505.625 868.586"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1505.625" height="868.586" fill="white" x="33.0" y="89.332" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="70" y="150" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">订单：3 条</text><text xml:space="preserve" x="610" y="150" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">agg：2 位用户</text><text xml:space="preserve" x="1150" y="150" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">transform：仍为 3 条</text><text xml:space="preserve" x="65" y="275" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">O1 · u</text><rect x="190" y="245" width="100" height="60" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="300" y="285" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">10</text><line x1="450" y1="275" x2="585" y2="375" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="65" y="430" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">O2 · u</text><rect x="190" y="400" width="200" height="60" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="400" y="440" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">20</text><line x1="450" y1="430" x2="585" y2="375" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="65" y="695" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">O3 · v</text><rect x="190" y="665" width="50" height="60" rx="0" fill="#fff0e4" stroke="#d17a30" stroke-width="2" /><text xml:space="preserve" x="250" y="705" font-size="30" fill="#d17a30" text-anchor="start" font-weight="400">5</text><line x1="450" y1="695" x2="585" y2="695" stroke="#d17a30" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="610" y="310" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">u：10 + 20 = 30</text><rect x="610" y="345" width="100" height="70" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><rect x="710" y="345" width="200" height="70" rx="0" fill="#b9d9ef" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="391" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">10</text><text xml:space="preserve" x="810" y="391" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">20</text><text xml:space="preserve" x="610" y="630" font-size="30" fill="#b26122" text-anchor="start" font-weight="400">v：5</text><rect x="610" y="665" width="50" height="70" rx="0" fill="#fff0e4" stroke="#d17a30" stroke-width="2" /><path d="M 930,380 C 1020,380 1060,275 1130,275" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1150" y="220" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">O1 · u</text><rect x="1150" y="245" width="300" height="60" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="1470" y="285" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">30</text><path d="M 930,380 C 1020,380 1060,430 1130,430" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1150" y="375" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">O2 · u</text><rect x="1150" y="400" width="300" height="60" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="1470" y="440" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">30</text><path d="M 685,700 C 1020,700 1060,695 1130,695" stroke="#d17a30" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1150" y="640" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">O3 · v</text><rect x="1150" y="665" width="50" height="60" rx="0" fill="#fff0e4" stroke="#d17a30" stroke-width="2" /><text xml:space="preserve" x="1220" y="705" font-size="30" fill="#d17a30" text-anchor="start" font-weight="400">5</text><text xml:space="preserve" x="70" y="920" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">订单金额合计 35</text><text xml:space="preserve" x="610" y="920" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">用户总额合计 35</text><text xml:space="preserve" x="1150" y="920" font-size="31" fill="#b26122" text-anchor="start" font-weight="400">回填列合计 65</text></g><desc> agg 汇成一条，transform 将同一总额送回原行 所有金额条使用相同比例；两条 30 是同一用户总额的广播，不能再次作为新收入相加。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 868.586) scale(1.04557)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">聚合后回填，不是再聚合一次：同一组总量被每条原记录引用</text><rect x="75" y="135" width="172" height="58" fill="#edf5f8" stroke="#216c89"/><text x="161.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">u:10</text><rect x="255" y="135" width="172" height="58" fill="#edf5f8" stroke="#216c89"/><text x="341.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">u:20</text><rect x="435" y="135" width="172" height="58" fill="#edf5f8" stroke="#216c89"/><text x="521.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">v:5</text><line x1="630" y1="165" x2="820" y2="165" stroke="#216c89" stroke-width="2" stroke-dasharray=""/><path d="M808.947,169.673 L820.000,165.000 L808.947,160.327" stroke="#216c89" stroke-width="2" fill="none"/><rect x="880" y="135" width="202" height="58" fill="#edf5f8" stroke="#216c89"/><text x="981.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">u:30</text><rect x="1090" y="135" width="202" height="58" fill="#edf5f8" stroke="#216c89"/><text x="1191.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">v:5</text><rect x="75" y="295" width="172" height="58" fill="#fff1e7" stroke="#c96937"/><text x="161.0" y="334" font-size="28" fill="#c96937" text-anchor="middle">u:30</text><rect x="255" y="295" width="172" height="58" fill="#fff1e7" stroke="#c96937"/><text x="341.0" y="334" font-size="28" fill="#c96937" text-anchor="middle">u:30</text><rect x="435" y="295" width="172" height="58" fill="#fff1e7" stroke="#c96937"/><text x="521.0" y="334" font-size="28" fill="#c96937" text-anchor="middle">v:5</text><text x="740" y="333" font-size="31" fill="#c96937" text-anchor="start">原金额和 35 → 回填值之和 65</text><text x="65" y="405" font-size="27" fill="#203742" text-anchor="start">u 组有两条记录，所以它的总量 30 被引用两次；输出行数保持，不代表列和保持。</text></g></g></svg>

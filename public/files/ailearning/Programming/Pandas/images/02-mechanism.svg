<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">agg 与 transform 的输出粒度不同</title><desc id="desc">三条订单经分组聚合得到两个用户的总额，输出粒度从订单变成用户。transform 则把同一用户总额广播回各原始订单，因此仍有三行。 transform 列若再跨订单直接求和，会把 u 的 30 计算两次，得到 65 而非原始金额 35。图中的重复是按契约广播，不代表重复订单。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="595" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="420.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">agg 与 transform 的输出粒度不同</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">transform 保留订单粒度；重复的用户总额不可再次直接相加。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">订单</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">用户</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">金额</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">transform 用户总额</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">o1</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">u</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">10</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">30</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">o2</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">u</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">20</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">30</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">o3</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">v</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">5</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">5</text><rect x="60.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">agg 结果</text><rect x="330.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">u:30，v:5</text><rect x="600.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">两行</text><rect x="870.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">不能按订单再次求和</text></g></svg>

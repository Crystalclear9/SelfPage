<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="944.4304" viewBox="0 0 1440 944.4304" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两条互补缺失记录的按列first输出并不对应任一原始整行</title><rect width="1440" height="944.4304" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">两条互补缺失记录的按列first输出并不对应任一原始整行</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="802.4304" viewBox="26.25 63.75 1185 707.5" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf4f9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf4f9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>每列的首个已知值，未必来自同一条观测</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#79919f"/></marker></defs><rect width="1185.0" height="707.5" fill="white" x="26.25" y="63.75"/><g font-family="Microsoft YaHei, sans-serif" fill="#1f3348"><text x="55" y="117" font-size="28" fill="#79919f" text-anchor="start">同一用户按时间排序两行；first 默认按列跳过缺失</text><text x="80" y="220" font-size="33" fill="#1f3348" text-anchor="start">原始整行</text><text x="750" y="220" font-size="33" fill="#1f3348" text-anchor="start">按列 first</text><rect x="80" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="160" y="327" font-size="32" fill="#1f3348" text-anchor="middle">t=1</text><rect x="260" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="340" y="327" font-size="32" fill="#1f3348" text-anchor="middle">未知</text><rect x="440" y="270" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="520" y="327" font-size="32" fill="#1f3348" text-anchor="middle">3</text><rect x="80" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="160" y="467" font-size="32" fill="#1f3348" text-anchor="middle">t=2</text><rect x="260" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="340" y="467" font-size="32" fill="#1f3348" text-anchor="middle">1</text><rect x="440" y="410" width="160" height="90" fill="url(#book-wash-edf4f9)" stroke="none" stroke-width="2"/><text x="520" y="467" font-size="32" fill="#1f3348" text-anchor="middle">未知</text><text x="260" y="250" font-size="28" fill="#1f3348" text-anchor="start">a</text><text x="440" y="250" font-size="28" fill="#1f3348" text-anchor="start">b</text><rect x="800" y="330" width="180" height="100" fill="#eaf3f0" stroke="#429395" stroke-width="2"/><rect x="1000" y="330" width="180" height="100" fill="url(#book-wash-fff1e7)" stroke="#c16d35" stroke-width="2"/><text x="890" y="393" font-size="34" fill="#429395" text-anchor="middle">a=1</text><text x="1090" y="393" font-size="34" fill="#c16d35" text-anchor="middle">b=3</text><path d="M340 500L340 560L890 560L890 430" fill="none" stroke="#429395" stroke-width="3" marker-end="url(#a)"/><path d="M600 315L650 250L1090 250L1090 330" fill="none" stroke="#c16d35" stroke-width="3" marker-end="url(#a)"/><text x="70" y="650" font-size="31" fill="#1f3348" text-anchor="start">输出 (1,3) 的两个字段来自不同时间；原输入里没有这条完整记录。</text><text x="70" y="735" font-size="30" fill="#1f3348" text-anchor="start">若要“最早观测整行”，应选择 t=1 的 (未知,3)，并保留它的身份。</text></g><desc> 每列的首个已知值，未必来自同一条观测 按列补齐可以是合法需求；它与按时间选一条真实观测具有不同契约。</desc></svg></svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1103.016" viewBox="0 0 1440 1103.016" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">按索引对齐与按位置相加产生不同结果</title><rect width="1440" height="1103.016" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">按索引对齐与按位置相加产生不同结果</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="961.016" viewBox="0 0 1440 1029.66" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>标签对齐：保留匹配来源再相加</title><svg width="1440" height="579.661" viewBox="25 20 1180 475" role="img" aria-labelledby="title desc"><title id="title">标签对齐：保留匹配来源再相加</title><desc id="desc">A按u,v存10,20；B按v,u存1,2。按标签对齐后u得到10+2=12，v得到20+1=21；按位置则11,22。 </desc><rect width="1180.0" height="475.0" fill="white" x="25.0" y="20.0"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#2073ad"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c26e34"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b899d"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#21374d"><text x="55" y="65" fill="#21374d" font-size="30" text-anchor="start" font-weight="600">A</text><text x="440" y="65" fill="#21374d" font-size="30" text-anchor="start" font-weight="600">B：存储次序</text><text x="860" y="65" fill="#21374d" font-size="30" text-anchor="start" font-weight="600">按标签相加</text><rect x="55" y="140" width="200" height="75" fill="#eef5fa" stroke="#2073ad" stroke-width="1.5" rx="3"/><text x="85" y="185" fill="#2073ad" font-size="31" text-anchor="start" font-weight="400">u : 10</text><rect x="860" y="140" width="325" height="75" fill="#eef5fa" stroke="#2073ad" stroke-width="1.5" rx="3"/><text x="1022" y="185" fill="#21374d" font-size="28" text-anchor="middle" font-weight="400">u : 10 + 2 = 12</text><rect x="55" y="310" width="200" height="75" fill="#eef5fa" stroke="#2073ad" stroke-width="1.5" rx="3"/><text x="85" y="355" fill="#2073ad" font-size="31" text-anchor="start" font-weight="400">v : 20</text><rect x="860" y="310" width="325" height="75" fill="#eef5fa" stroke="#2073ad" stroke-width="1.5" rx="3"/><text x="1022" y="355" fill="#21374d" font-size="28" text-anchor="middle" font-weight="400">v : 20 + 1 = 21</text><rect x="440" y="140" width="200" height="75" fill="white" stroke="#c26e34" stroke-width="1.5" rx="3"/><text x="470" y="185" fill="#c26e34" font-size="31" text-anchor="start" font-weight="400">v : 1</text><rect x="440" y="310" width="200" height="75" fill="white" stroke="#2073ad" stroke-width="1.5" rx="3"/><text x="470" y="355" fill="#2073ad" font-size="31" text-anchor="start" font-weight="400">u : 2</text><line x1="645" y1="345" x2="850" y2="185" stroke="#2073ad" stroke-width="3" marker-end="url(#b)"/><line x1="645" y1="175" x2="850" y2="345" stroke="#c26e34" stroke-width="3" marker-end="url(#o)"/><text x="350" y="460" fill="#21374d" font-size="29" text-anchor="start" font-weight="400">匹配键 u → u，v → v；位置相加则变成 11、22。</text><text x="55" y="520" fill="#21374d" font-size="28" text-anchor="start" font-weight="400"/></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 579.661) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">再加入一个只在右侧出现的标签：并集对齐会显式产生缺失</text><rect x="65" y="135" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="181.0" y="174" font-size="28" fill="#1e7499" text-anchor="middle">A:u=10</text><rect x="305" y="135" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="421.0" y="174" font-size="28" fill="#1e7499" text-anchor="middle">A:v=20</text><rect x="790" y="135" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="906.0" y="174" font-size="28" fill="#c66d3a" text-anchor="middle">B:v=1</text><rect x="1030" y="135" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1146.0" y="174" font-size="28" fill="#c66d3a" text-anchor="middle">B:w=2</text><rect x="250" y="295" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="376.0" y="334" font-size="28" fill="#1e7499" text-anchor="middle">u: NA</text><rect x="510" y="295" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="636.0" y="334" font-size="28" fill="#1e7499" text-anchor="middle">v: 21</text><rect x="770" y="295" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="896.0" y="334" font-size="28" fill="#1e7499" text-anchor="middle">w: NA</text><line x1="300" y1="215" x2="380" y2="280" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/><path d="M368.475,276.657 L380.000,280.000 L374.369,269.403" stroke="#1e7499" stroke-width="2" fill="none"/><line x1="1030" y1="215" x2="900" y2="280" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/><path d="M907.796,270.877 L900.000,280.000 L911.976,279.237" stroke="#c66d3a" stroke-width="2" fill="none"/><text x="65" y="399" font-size="28" fill="#1d3145" text-anchor="start">缺失键 ≠ 已知零；只有约定缺项为零，fill_value=0 才对应 [10,21,2]。</text></g></g></svg></svg>

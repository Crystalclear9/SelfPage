<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="475" viewBox="25 20 1180 475" role="img" aria-labelledby="title desc"><title id="title">标签对齐：保留匹配来源再相加</title><desc id="desc">A按u,v存10,20；B按v,u存1,2。按标签对齐后u得到10+2=12，v得到20+1=21；按位置则11,22。 </desc><rect width="1180.0" height="475.0" fill="white" x="25.0" y="20.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="55" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">A</text><text x="440" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">B：存储次序</text><text x="860" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">按标签相加</text><rect x="55" y="140" width="200" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="85" y="185" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">u : 10</text><rect x="860" y="140" width="325" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="1022" y="185" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">u : 10 + 2 = 12</text><rect x="55" y="310" width="200" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="85" y="355" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">v : 20</text><rect x="860" y="310" width="325" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="1022" y="355" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">v : 20 + 1 = 21</text><rect x="440" y="140" width="200" height="75" fill="white" stroke="#c66e30" stroke-width="1.5" rx="3" /><text x="470" y="185" fill="#c66e30" font-size="31" text-anchor="start" font-weight="400">v : 1</text><rect x="440" y="310" width="200" height="75" fill="white" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="470" y="355" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">u : 2</text><line x1="645" y1="345" x2="850" y2="185" stroke="#24679c" stroke-width="3" marker-end="url(#b)" /><line x1="645" y1="175" x2="850" y2="345" stroke="#c66e30" stroke-width="3" marker-end="url(#o)" /><text x="350" y="460" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">匹配键 u → u，v → v；位置相加则变成 11、22。</text><text x="55" y="520" fill="#23384b" font-size="28" text-anchor="start" font-weight="400" /></g></svg>

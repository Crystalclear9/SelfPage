<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">按索引对齐与按位置相加产生不同结果</title><desc id="desc">左列索引顺序为 u、v，右列为 v、u。Pandas 按标签匹配，先把 u 与 u 配对、v 与 v 配对，而不是直接把两个底层数组逐位置相加。 表将右列按结果索引重排展示。若确实希望按位置操作，应先明确位置对应的业务语义；重复索引和缺失标签还会带来额外边界。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="530" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="355.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">按索引对齐与按位置相加产生不同结果</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">右列存储次序为 v、u；标签对齐先匹配名字再相加。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">索引</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">左列 A</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">右列 B</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">按标签 A+B</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">u</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">10</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">12</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">v</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">20</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">21</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">底层右列顺序</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">—</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">v:1，u:2</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">按位置则为 11、22</text></g></svg>

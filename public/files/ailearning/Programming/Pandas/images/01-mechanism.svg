<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1029.66" viewBox="0 0 1440 1029.66" role="img"><title>标签对齐：保留匹配来源再相加</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="579.661" viewBox="25 20 1180 475" role="img" aria-labelledby="title desc"><title id="title">标签对齐：保留匹配来源再相加</title><desc id="desc">A按u,v存10,20；B按v,u存1,2。按标签对齐后u得到10+2=12，v得到20+1=21；按位置则11,22。 </desc><rect width="1180.0" height="475.0" fill="white" x="25.0" y="20.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="55" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">A</text><text x="440" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">B：存储次序</text><text x="860" y="65" fill="#23384b" font-size="30" text-anchor="start" font-weight="600">按标签相加</text><rect x="55" y="140" width="200" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="85" y="185" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">u : 10</text><rect x="860" y="140" width="325" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="1022" y="185" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">u : 10 + 2 = 12</text><rect x="55" y="310" width="200" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="85" y="355" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">v : 20</text><rect x="860" y="310" width="325" height="75" fill="#eef5fa" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="1022" y="355" fill="#23384b" font-size="28" text-anchor="middle" font-weight="400">v : 20 + 1 = 21</text><rect x="440" y="140" width="200" height="75" fill="white" stroke="#c66e30" stroke-width="1.5" rx="3" /><text x="470" y="185" fill="#c66e30" font-size="31" text-anchor="start" font-weight="400">v : 1</text><rect x="440" y="310" width="200" height="75" fill="white" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="470" y="355" fill="#24679c" font-size="31" text-anchor="start" font-weight="400">u : 2</text><line x1="645" y1="345" x2="850" y2="185" stroke="#24679c" stroke-width="3" marker-end="url(#b)" /><line x1="645" y1="175" x2="850" y2="345" stroke="#c66e30" stroke-width="3" marker-end="url(#o)" /><text x="350" y="460" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">匹配键 u → u，v → v；位置相加则变成 11、22。</text><text x="55" y="520" fill="#23384b" font-size="28" text-anchor="start" font-weight="400" /></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 579.661) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">再加入一个只在右侧出现的标签：并集对齐会显式产生缺失</text><rect x="65" y="135" width="232" height="58" fill="#edf5f8" stroke="#216c89"/><text x="181.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">A:u=10</text><rect x="305" y="135" width="232" height="58" fill="#edf5f8" stroke="#216c89"/><text x="421.0" y="174" font-size="28" fill="#216c89" text-anchor="middle">A:v=20</text><rect x="790" y="135" width="232" height="58" fill="#fff1e7" stroke="#c96937"/><text x="906.0" y="174" font-size="28" fill="#c96937" text-anchor="middle">B:v=1</text><rect x="1030" y="135" width="232" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1146.0" y="174" font-size="28" fill="#c96937" text-anchor="middle">B:w=2</text><rect x="250" y="295" width="252" height="58" fill="#edf5f8" stroke="#216c89"/><text x="376.0" y="334" font-size="28" fill="#216c89" text-anchor="middle">u: NA</text><rect x="510" y="295" width="252" height="58" fill="#edf5f8" stroke="#216c89"/><text x="636.0" y="334" font-size="28" fill="#216c89" text-anchor="middle">v: 21</text><rect x="770" y="295" width="252" height="58" fill="#edf5f8" stroke="#216c89"/><text x="896.0" y="334" font-size="28" fill="#216c89" text-anchor="middle">w: NA</text><line x1="300" y1="215" x2="380" y2="280" stroke="#216c89" stroke-width="2" stroke-dasharray=""/><path d="M368.475,276.657 L380.000,280.000 L374.369,269.403" stroke="#216c89" stroke-width="2" fill="none"/><line x1="1030" y1="215" x2="900" y2="280" stroke="#c96937" stroke-width="2" stroke-dasharray=""/><path d="M907.796,270.877 L900.000,280.000 L911.976,279.237" stroke="#c96937" stroke-width="2" fill="none"/><text x="65" y="399" font-size="28" fill="#203742" text-anchor="start">缺失键 ≠ 已知零；只有约定缺项为零，fill_value=0 才对应 [10,21,2]。</text></g></g></svg>

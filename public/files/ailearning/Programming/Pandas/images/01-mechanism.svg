<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="568.58" viewBox="5.15 0.00 1063.71 504.00" role="img"><title id="figure-title">索引对齐先匹配标签，再执行运算</title><desc id="figure-desc">A 的顺序是 u、v，B 的物理顺序却是 v、u。交叉线追踪 B 的标签身份：u 对应 2，v 对应 1。Pandas 按索引相加得到 u=12、v=21；丢掉标签后按位置相加则是 11、22，两个结果实现的契约不同。</desc><rect x="0" y="0" width="1200" height="550" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">索引对齐先匹配标签，再执行运算</text><text x="40" y="115" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">A：原索引</text><text x="40" y="220" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">u</text><rect x="105" y="173" width="150" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="180.0" y="218.0" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">10</text><text x="40" y="325" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">v</text><rect x="105" y="278" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="180.0" y="323.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><text x="375" y="115" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">B：存储顺序</text><text x="375" y="220" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">v</text><rect x="440" y="173" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="515.0" y="218.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><text x="375" y="325" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">u</text><rect x="440" y="278" width="150" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="515.0" y="323.0" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">2</text><text x="775" y="115" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">按 A 的标签对齐 B</text><text x="775" y="220" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">u</text><rect x="840" y="173" width="150" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="915.0" y="218.0" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">2</text><text x="775" y="325" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">v</text><rect x="840" y="278" width="150" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="915.0" y="323.0" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><path d="M610 210 L760 315" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M610 315 L760 210" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="465" font-size="27" fill="#213447" text-anchor="start" font-weight="400">按位置：10+1=11，20+2=22</text><text x="660" y="465" font-size="27" fill="#c87536" text-anchor="start" font-weight="600">按标签：10+2=12，20+1=21</text></g></svg>

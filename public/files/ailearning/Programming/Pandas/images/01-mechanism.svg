<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" viewBox="0 0 1360 933" width="1360" height="933"><title id="plate-caption">按索引对齐与按位置相加产生不同结果</title><defs><linearGradient id="scientific-plane-1c6583" x1="7%" y1="0%" x2="87%" y2="100%"><stop offset="0%" stop-color="#1c6583" stop-opacity=".08"/><stop offset="100%" stop-color="#1c6583" stop-opacity=".24"/></linearGradient><clipPath id="plate-view-0"><rect x="-18.24" y="86.994599" width="996.48" height="53.787679"/></clipPath><clipPath id="plate-view-1"><rect x="-18.24" y="140.78228" width="996.48" height="237.26941"/></clipPath><clipPath id="plate-view-2"><rect x="-18.24" y="378.05169" width="996.48" height="126.803"/></clipPath><clipPath id="plate-view-3"><rect x="-18.24" y="504.85468" width="996.48" height="200.03899"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="650.687917"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="737.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="701" viewBox="0 47 960 701" overflow="hidden"><rect width="960" height="748" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>标签对齐：保留匹配来源再相加</title><svg width="1440" height="579.661" viewBox="25 20 1180 475" role="img" aria-labelledby="title desc"><title id="title">标签对齐：保留匹配来源再相加</title><desc id="desc">A按u,v存10,20；B按v,u存1,2。按标签对齐后u得到10+2=12，v得到20+1=21；按位置则11,22。 </desc><rect width="1180.0" height="475.0" fill="#ffffff" x="25.0" y="20.0"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#2a76a2"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#b66a3d"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#76899c"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#253d4f"><text x="55" y="65" fill="#253d4f" font-size="30" text-anchor="start" font-weight="600">A</text><text x="440" y="65" fill="#253d4f" font-size="30" text-anchor="start" font-weight="600">B：存储次序</text><text x="860" y="65" fill="#253d4f" font-size="30" text-anchor="start" font-weight="600" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">按标签相加</text><rect x="55" y="140" width="200" height="75" fill="#f1f7fa" stroke="#1f6e95" stroke-width="1.5" rx="3"/><text x="85" y="185" fill="#2a76a2" font-size="31" text-anchor="start" font-weight="400">u : 10</text><rect x="860" y="140" width="325" height="75" fill="#f1f7fa" stroke="#1f6e95" stroke-width="1.5" rx="3"/><text x="1022" y="185" fill="#253d4f" font-size="28" text-anchor="middle" font-weight="400">u : 10 + 2 = 12</text><rect x="55" y="310" width="200" height="75" fill="#f1f7fa" stroke="#1f6e95" stroke-width="1.5" rx="3"/><text x="85" y="355" fill="#2a76a2" font-size="31" text-anchor="start" font-weight="400">v : 20</text><rect x="860" y="310" width="325" height="75" fill="#f1f7fa" stroke="#1f6e95" stroke-width="1.5" rx="3"/><text x="1022" y="355" fill="#253d4f" font-size="28" text-anchor="middle" font-weight="400">v : 20 + 1 = 21</text><rect x="440" y="140" width="200" height="75" fill="#ffffff" stroke="#a95c30" stroke-width="1.5" rx="3"/><text x="470" y="185" fill="#a15e36" font-size="31" text-anchor="start" font-weight="400">v : 1</text><rect x="440" y="310" width="200" height="75" fill="#ffffff" stroke="#1f6e95" stroke-width="1.5" rx="3"/><text x="470" y="355" fill="#2a76a2" font-size="31" text-anchor="start" font-weight="400">u : 2</text><line x1="645" y1="345" x2="850" y2="185" stroke="#1f6e95" stroke-width="3" marker-end="url(#b)"/><line x1="645" y1="175" x2="850" y2="345" stroke="#a95c30" stroke-width="3" marker-end="url(#o)"/><text x="350" y="460" fill="#253d4f" font-size="29" text-anchor="start" font-weight="400">匹配键 u → u，v → v；位置相加则变成 11、22。</text><text x="55" y="520" fill="#253d4f" font-size="28" text-anchor="start" font-weight="400"/></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 579.661) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dbe8eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">再加入一个只在右侧出现的标签：并集对齐会显式产生缺失</text><rect x="65" y="135" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="181.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">A:u=10</text><rect x="305" y="135" width="232" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="421.0" y="174" font-size="36.12px" fill="#277290" text-anchor="middle">A:v=20</text><rect x="790" y="135" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#a74d3a"/><text x="906.0" y="174" font-size="36.12px" fill="#a55f3a" text-anchor="middle">B:v=1</text><rect x="1030" y="135" width="232" height="58" fill="url(#book-wash-fff1e7)" stroke="#a74d3a"/><text x="1146.0" y="174" font-size="36.12px" fill="#a55f3a" text-anchor="middle">B:w=2</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="266.82,295 502,295 502,325.16 485.18,353 250,353 250,322.84" stroke-linejoin="round"/><text x="376.0" y="334" font-size="36.12px" fill="#277290" text-anchor="middle">u: NA</text><rect x="510" y="295" width="252" height="58" fill="url(#book-wash-edf5f8)" stroke="#1c6583"/><text x="636.0" y="334" font-size="36.12px" fill="#277290" text-anchor="middle">v: 21</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="786.82,295 1022,295 1022,325.16 1005.18,353 770,353 770,322.84" stroke-linejoin="round"/><text x="896.0" y="334" font-size="36.12px" fill="#277290" text-anchor="middle">w: NA</text><line x1="300" y1="215" x2="380" y2="280" stroke="#1c6583" stroke-width="2.46" stroke-dasharray=""/><polyline stroke="#1c6583" stroke-width="2.46" fill="none" points="368.475,276.657 380,280 374.369,269.403"/><line x1="1030" y1="215" x2="900" y2="280" stroke="#a74d3a" stroke-width="2.46" stroke-dasharray=""/><polyline stroke="#a74d3a" stroke-width="2.46" fill="none" points="907.796,270.877 900,280 911.976,279.237"/><text x="65" y="399" font-size="36.12px" fill="#213747" text-anchor="start">缺失键 ≠ 已知零；只有约定缺项为零，fill_value=0 才对应 [10,21,2]。</text></g></g></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="933" fill="white"/><g transform="translate(1.923279 -71.510386) scale(1.4012962)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g><g transform="translate(1.923279 -84.853379) scale(1.4012962)"><use href="#plate-scene" clip-path="url(#plate-view-1)" xlink:href="#plate-scene"/></g><g transform="translate(1.923279 -94.664404) scale(1.4012962)"><use href="#plate-scene" clip-path="url(#plate-view-2)" xlink:href="#plate-scene"/></g><g transform="translate(1.923279 -105.65275) scale(1.4012962)"><use href="#plate-scene" clip-path="url(#plate-view-3)" xlink:href="#plate-scene"/></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1040.2916" viewBox="0 0 1440 1040.2916" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">用户B的两条支付在事件时间和可用时间平面中的位置与边界对照</title><rect width="1440" height="1040.2916" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">用户B的两条支付在事件时间和可用时间平面中的位置与边界对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="898.2916" viewBox="11 55 1173 784" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">一条事件是否可用，必须同时看两只时钟</title><desc id="desc">用户B的bad支付在1月6发生7日可用，p2在8日发生9日可用。评分1月10两条均可见；将p2可用日改为10日，严格可用截止排除它，次数从2到1，最近间隔从2到4。 一条事件是否可用，必须同时看两只时钟 点坐标、窗口和结果都可从完整程序复算；对照并未改变支付发生的日期。</desc><rect width="1173.0" height="784.0" fill="white" x="11.0" y="55.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="100" font-size="25" fill="#617f97" text-anchor="start">固定用户 B、评分 1/10 00:00 UTC；历史事件窗 [1/3, 1/10)，可用时刻 &lt; 1/10。</text><rect x="100" y="274" width="336" height="336" fill="#2472b1" opacity="0.07" rx="3"/><line x1="100" y1="610" x2="484" y2="610" stroke="#617f97" stroke-width="2"/><line x1="100" y1="610" x2="100" y2="226" stroke="#617f97" stroke-width="2"/><line x1="436" y1="610" x2="436" y2="226" stroke="#c57439" stroke-width="2" stroke-dasharray="7 6"/><line x1="100" y1="274" x2="484" y2="274" stroke="#c57439" stroke-width="2" stroke-dasharray="7 6"/><text x="100" y="650" font-size="24" fill="#617f97" text-anchor="middle">1/3</text><text x="86" y="619" font-size="24" fill="#617f97" text-anchor="end">1/3</text><text x="244" y="650" font-size="24" fill="#617f97" text-anchor="middle">1/6</text><text x="86" y="475" font-size="24" fill="#617f97" text-anchor="end">1/6</text><text x="340" y="650" font-size="24" fill="#617f97" text-anchor="middle">1/8</text><text x="86" y="379" font-size="24" fill="#617f97" text-anchor="end">1/8</text><text x="436" y="650" font-size="24" fill="#617f97" text-anchor="middle">1/10</text><text x="86" y="283" font-size="24" fill="#617f97" text-anchor="end">1/10</text><text x="300" y="704" font-size="26" fill="#1f3449" text-anchor="middle">事件时刻</text><text x="45" y="190" font-size="26" fill="#1f3449" text-anchor="start">可用时刻</text><line x1="100" y1="610" x2="484" y2="226" stroke="#dce5ed" stroke-width="2"/><circle cx="244" cy="418" r="8" fill="#2472b1"/><text x="226" y="456" font-size="25" fill="#2472b1" text-anchor="end">bad</text><circle cx="340" cy="322" r="8" fill="#2472b1"/><text x="322" y="357" font-size="25" fill="#2472b1" text-anchor="end">p2</text><line x1="340" y1="309" x2="340" y2="287" stroke="#c57439" stroke-width="3"/><polyline points="345.2736809246462,296.6534081807941 340,287 334.7263190753538,296.6534081807941" fill="none" stroke="#c57439" stroke-width="3"/><circle cx="340" cy="274" r="8" fill="#c57439"/><text x="358" y="260" font-size="25" fill="#c57439" text-anchor="start">边界对照</text><text x="640" y="190" font-size="28" fill="#1f3449" text-anchor="start">同一两条记录</text><text x="640" y="243" font-size="26" fill="#2472b1" text-anchor="start">bad：1/6 → 1/7，金额未知</text><text x="640" y="291" font-size="26" fill="#2472b1" text-anchor="start">p2：1/8 → 1/9，金额 20 分</text><text x="640" y="351" font-size="25" fill="#c57439" text-anchor="start">对照仅把 p2 可用时刻推至 1/10</text><text x="640" y="408" font-size="25" fill="#1f3449" text-anchor="start">特征</text><text x="930" y="408" font-size="25" fill="#2472b1" text-anchor="middle">原记录</text><text x="1100" y="408" font-size="25" fill="#c57439" text-anchor="middle">边界对照</text><text x="640" y="465" font-size="25" fill="#1f3449" text-anchor="start">支付次数</text><text x="930" y="465" font-size="27" fill="#2472b1" text-anchor="middle">2</text><text x="1100" y="465" font-size="27" fill="#c57439" text-anchor="middle">1</text><text x="640" y="525" font-size="25" fill="#1f3449" text-anchor="start">金额有效数</text><text x="930" y="525" font-size="27" fill="#2472b1" text-anchor="middle">1</text><text x="1100" y="525" font-size="27" fill="#c57439" text-anchor="middle">0</text><text x="640" y="585" font-size="25" fill="#1f3449" text-anchor="start">完整金额和</text><text x="930" y="585" font-size="27" fill="#2472b1" text-anchor="middle">未知</text><text x="1100" y="585" font-size="27" fill="#c57439" text-anchor="middle">未知</text><text x="640" y="645" font-size="25" fill="#1f3449" text-anchor="start">最近间隔 / 天</text><text x="930" y="645" font-size="27" fill="#2472b1" text-anchor="middle">2</text><text x="1100" y="645" font-size="27" fill="#c57439" text-anchor="middle">4</text><line x1="40" y1="755" x2="1160" y2="755" stroke="#dce5ed" stroke-width="2"/><text x="40" y="811" font-size="25" fill="#1f3449" text-anchor="start">蓝点同时通过两道时间条件；橙点事件仍在窗内，但恰在截止时可用，仍不纳入。</text></g></svg></svg>

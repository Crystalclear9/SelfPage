<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1138.000" height="656.000" viewBox="31.000 97.000 1138.000 656.000" role="img"><title id="figure-title">多对多连接：重复来自匹配重数，不是加法出错</title><desc id="figure-desc">同键的两订单金额10和20分别匹配属性A及B。四行金额10,10,20,20总计60。只聚合订单为30仍会与两属性匹配两次。 多对多连接：重复来自匹配重数，不是加法出错 先明确唯一键或版本；不能靠连接成功证明金额守恒</desc><rect width="1138.0" height="656.0" fill="white" x="31.0" y="97.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">两笔订单：同一用户 u</text><text x="405" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">用户属性：同键两行</text><text x="805" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">每条匹配携带金额</text><rect x="60" y="230" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="182.5" y="273.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">O1：10</text><rect x="60" y="410" width="245" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="182.5" y="453.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">O2：20</text><rect x="420" y="230" width="205" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="522.5" y="273.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">u / A</text><rect x="420" y="410" width="205" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="522.5" y="453.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">u / B</text><path d="M310 262 L405 262" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M310 262 L405 442" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M310 442 L405 262" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M310 442 L405 442" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="855" y="215" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">A</text><text x="1010" y="215" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">B</text><text x="700" y="287" font-size="27" fill="#213447" text-anchor="start" font-weight="400">O1</text><rect x="785" y="245" width="140" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="855.0" y="288.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">10</text><rect x="940" y="245" width="140" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="288.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">10</text><text x="700" y="447" font-size="27" fill="#213447" text-anchor="start" font-weight="400">O2</text><rect x="785" y="405" width="140" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="855.0" y="448.0" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">20</text><rect x="940" y="405" width="140" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="448.0" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">20</text><text x="845" y="550" font-size="30" fill="#213447" text-anchor="middle" font-weight="400">2 × 2 = 4 行</text><line x1="55" y1="585" x2="1145" y2="585" stroke="#cbd9e4" stroke-width="2" /><text x="55" y="650" font-size="32" fill="#c87536" text-anchor="start" font-weight="400">订单总额 30 → 连接后求和 60</text><text x="55" y="725" font-size="28" fill="#213447" text-anchor="start" font-weight="400">即使先把订单聚成 30，右侧两行仍会产生 30 + 30</text></g></svg>

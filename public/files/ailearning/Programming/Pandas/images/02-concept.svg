<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：按连线逐条枚举匹配：两笔订单分别匹配用户表的 A、B 两行，得到四条输出记录，金额由 30 重复累计成 60</title><desc id="detail-desc">按连线逐条枚举匹配：两笔订单分别匹配用户表的 A、B 两行，得到四条输出记录，金额由 30 重复累计成 60。连接成功并不意味着聚合口径正确。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="28" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">订单：金额合计 30</text><text x="425" y="28" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">同一用户的两个匹配行</text><text x="825" y="28" font-size="25" fill="#158476" font-weight="600" text-anchor="start">连接输出</text><rect x="30" y="80" width="190" height="120" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="30" y="80" width="190" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="42" y="105" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">甲</text><text x="44" y="147" font-size="22" fill="#213447" font-weight="400" text-anchor="start">用户 u</text><text x="44" y="178" font-size="22" fill="#213447" font-weight="400" text-anchor="start">金额 10</text><rect x="30" y="230" width="190" height="120" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="30" y="230" width="190" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="42" y="255" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">乙</text><text x="44" y="297" font-size="22" fill="#213447" font-weight="400" text-anchor="start">用户 u</text><text x="44" y="328" font-size="22" fill="#213447" font-weight="400" text-anchor="start">金额 20</text><rect x="420" y="80" width="190" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="420" y="80" width="190" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="432" y="105" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">A</text><text x="434" y="147" font-size="22" fill="#213447" font-weight="400" text-anchor="start">用户 u</text><rect x="420" y="230" width="190" height="110" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="420" y="230" width="190" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="432" y="255" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">B</text><text x="434" y="297" font-size="22" fill="#213447" font-weight="400" text-anchor="start">用户 u</text><rect x="810" y="80" width="240" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="930.0" y="108" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">甲 · A · 10</text><rect x="810" y="155" width="240" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="930.0" y="183" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">甲 · B · 10</text><rect x="810" y="230" width="240" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="930.0" y="258" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">乙 · A · 20</text><rect x="810" y="305" width="240" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="930.0" y="333" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">乙 · B · 20</te
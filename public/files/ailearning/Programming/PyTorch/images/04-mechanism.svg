<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect width="1280" height="820" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="55" font-size="34" fill="#203449" text-anchor="start">微批中途恢复：参数尚未改变，梯度却已经累积</text><text x="50" y="103" font-size="26" fill="#203449" text-anchor="start">w = 2；x = [1, 2, 3]，目标均为 0；三个微批合成一次 SGD，学习率 0.1</text><text x="135" y="177" font-size="28" fill="#203449" text-anchor="middle">微批 1</text><text x="135" y="232" font-size="30" fill="#203449" text-anchor="middle">2</text><path d="M100 244L170 244" stroke="#203449" stroke-width="2"/><text x="135" y="279" font-size="30" fill="#203449" text-anchor="middle">3</text><path d="M210 235L305 235" stroke="#247bb5" stroke-width="4"/><text x="390" y="177" font-size="28" fill="#203449" text-anchor="middle">微批 2</text><text x="390" y="232" font-size="30" fill="#203449" text-anchor="middle">8</text><path d="M355 244L425 244" stroke="#203449" stroke-width="2"/><text x="390" y="279" font-size="30" fill="#203449" text-anchor="middle">3</text><path d="M465 235L560 235" stroke="#247bb5" stroke-width="4"/><text x="645" y="177" font-size="28" fill="#203449" text-anchor="middle">微批 3</text><text x="645" y="232" font-size="30" fill="#203449" text-anchor="middle">6</text><path d="M610 244L680 244" stroke="#203449" stroke-width="2"/><text x="645" y="279" font-size="30" fill="#203449" text-anchor="middle">1</text><path d="M720 235L815 235" stroke="#247bb5" stroke-width="4"/><text x="1040" y="198" font-size="30" fill="#087e7c" text-anchor="start">组末更新</text><text x="995" y="265" font-size="30" fill="#087e7c" text-anchor="start">w → 1.066667</text><path d="M50 315L1230 315" stroke="#c8d6e0" stroke-width="2"/><text x="50" y="365" font-size="29" fill="#203449" text-anchor="start">中断位置：微批 2 已反向，微批 3 尚未开始</text><text x="50" y="422" font-size="29" fill="#203449" text-anchor="start">参数仍为 2</text><text x="390" y="422" font-size="29" fill="#203449" text-anchor="start">已累积梯度</text><text x="685" y="396" font-size="30" fill="#203449" text-anchor="middle">10</text><path d="M650 408L720 408" stroke="#203449" stroke-width="2"/><text x="685" y="443" font-size="30" fill="#203449" text-anchor="middle">3</text><text x="790" y="422" font-size="28" fill="#203449" text-anchor="start">下一数据为 x = 3</text><path d="M50 470L1230 470" stroke="#c8d6e0" stroke-width="2"/><text x="50" y="525" font-size="30" fill="#087e7c" text-anchor="start">恢复梯度与进度</text><text x="50" y="571" font-size="27" fill="#203449" text-anchor="start">保留前两批贡献，再加第三批梯度 6</text><text x="680" y="550" font-size="28" fill="#087e7c" text-anchor="start">完整梯度 9.333333 → w = 1.066667</text><text x="50" y="655" font-size="30" fill="#b95a17" text-anchor="start">只恢复参数与游标</text><text x="50" y="701" font-size="27" fill="#203449" text-anchor="start">前两批贡献丢失，只剩第三批梯度 6</text><text x="680" y="680" font-size="28" fill="#b95a17" text-anchor="start">不完整梯度 6 → w = 1.4</text><path d="M50 748L1230 748" stroke="#c8d6e0" stroke-width="2"/><text x="50" y="795" font-size="25" fill="#203449" text-anchor="start">若只在更新、调度和清梯度完成后保存，可免去半组梯度；中途恢复则需要保存它们。</text></g></svg>
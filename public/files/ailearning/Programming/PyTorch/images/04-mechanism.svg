<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="729.99" viewBox="11.00 10.11 1116.00 678.89" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">恢复位置必须落在约定的更新边界</title><desc id="desc">图把三个微批的梯度累积看作一次优化器更新。若只在 step 完成且梯度按约定清理之后保存，恢复状态的边界更容易定义；若在区间内部保存，就必须连同未提交的累积梯度与微步位置一起恢复。 图中横轴是逻辑微步，不代表各步耗时相同。AMP 缩放器、调度器、随机源及数据游标也必须属于同一约定状态，边界整齐不能代替状态完整。 在 step 后保存且从下一更新开始；跨累积区间恢复须另存梯度。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">恢复位置必须落在约定的更新边界</text><path d="M250,195 L1090,195" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,188 L250,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">0</text><path d="M460,188 L460,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><path d="M670,188 L670,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="670" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><path d="M880,188 L880,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="880" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">3</text><path d="M1090,188 L1090,202" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1090" y="177" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><text x="60" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">微批累积区间</text><rect x="250.0" y="255" width="630.0" height="48" fill="#d4ebe6" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="565" y="337" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">累计三个微批</text><text x="60" y="375" font-size="24" fill="#213447" text-anchor="start" font-weight="400">优化器更新边界</text><circle cx="880" cy="395" r="11" fill="#c87536" /><text x="880" y="452" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">step 后保存</text><text x="60" y="490" font-size="24" fill="#213447" text-anchor="start" font-weight="400">下一次更新</text><rect x="880.0" y="485" width="210.0" height="48" fill="#f5dfcb" stroke="#8eabc8" rx="5" stroke-linecap="round" stroke-linejoin="round" /><text x="985" y="567" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">重新开始累积</text><text x="1090" y="650" font-size="24" fill="#627689" text-anchor="end" font-weight="400">时间 / 逻辑步（见正文约定）</text></g></svg>

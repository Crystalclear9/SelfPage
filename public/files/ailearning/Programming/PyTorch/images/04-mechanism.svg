<svg xmlns="http://www.w3.org/2000/svg" width="1362.500" height="936.250" viewBox="20.000 63.750 1362.500 936.250"><title>中断前的参数没动，累计梯度已经走了两步</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#778994" /></marker></defs><rect width="1362.5" height="936.25" fill="white" x="20.0" y="63.75" /><g font-family="Microsoft YaHei, sans-serif" fill="#203747"><text x="55" y="117" font-size="28" fill="#778994" text-anchor="start">w=2，三个单样本微批 x=1、2、3，目标为零；损失统一除以 6</text><path d="M160 700.0L1220 700.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="710.0" font-size="26" fill="#778994" text-anchor="end">0</text><path d="M160 612.0L1220 612.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="622.0" font-size="26" fill="#778994" text-anchor="end">2</text><path d="M160 524.0L1220 524.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="534.0" font-size="26" fill="#778994" text-anchor="end">4</text><path d="M160 436.0L1220 436.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="446.0" font-size="26" fill="#778994" text-anchor="end">6</text><path d="M160 348.0L1220 348.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="358.0" font-size="26" fill="#778994" text-anchor="end">8</text><path d="M160 260.0L1220 260.0" fill="none" stroke="#e4ecf1" stroke-width="2" /><text x="135" y="270.0" font-size="26" fill="#778994" text-anchor="end">10</text><text x="160.0" y="748" font-size="28" fill="#778994" text-anchor="middle">0</text><text x="513.3333333333333" y="748" font-size="28" fill="#778994" text-anchor="middle">1</text><text x="866.6666666666666" y="748" font-size="28" fill="#778994" text-anchor="middle">2</text><text x="1220.0" y="748" font-size="28" fill="#778994" text-anchor="middle">3</text><polyline points="160.000,700.000 513.333,670.667 866.667,553.333 1220.000,289.333" fill="none" stroke="#24689a" stroke-width="5" /><circle cx="160.0" cy="700.0" r="10" fill="#24689a" /><circle cx="513.3333333333333" cy="670.6666666666666" r="10" fill="#24689a" /><circle cx="866.6666666666666" cy="553.3333333333333" r="10" fill="#24689a" /><circle cx="1220.0" cy="289.3333333333333" r="10" fill="#24689a" /><path d="M866.6666666666666 230L866.6666666666666 760" fill="none" stroke="#c56b31" stroke-width="2" stroke-dasharray="6 6" /><text x="706.6666666666666" y="205" font-size="30" fill="#c56b31" text-anchor="start">此处保存，再恢复</text><polyline points="866.667,700.000 1220.000,436.000" fill="none" stroke="#c56b31" stroke-width="5" /><circle cx="866.6666666666666" cy="700" r="10" fill="#c56b31" /><circle cx="1220" cy="436.0" r="10" fill="#c56b31" /><text x="1190" y="259.3333333333333" font-size="30" fill="#24689a" text-anchor="end">完整 28÷3</text><text x="1240" y="450" font-size="29" fill="#c56b31">仅梯度 6</text><text x="50" y="190" font-size="31" fill="#203747" text-anchor="start">累计梯度</text><text x="980" y="805" font-size="30" fill="#203747" text-anchor="start">已完成的微批数</text><text x="65" y="900" font-size="31" fill="#24689a" text-anchor="start">完整：w ← 2−0.1×(28÷3) = 16÷15 ≈ 1.066667</text><text x="65" y="965" font-size="31" fill="#c56b31" text-anchor="start">错误：游标接第三批、梯度从零开始 → w=1.4</text></g><desc> 中断前的参数没动，累计梯度已经走了两步</desc></svg>

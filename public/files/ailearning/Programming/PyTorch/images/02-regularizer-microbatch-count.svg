<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="851.3333" viewBox="0 0 1440 851.3333" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">微批等价不仅涉及数据损失的分母，还涉及独立目标项被加几次</title><rect width="1440" height="851.3333" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">微批等价不仅涉及数据损失的分母，还涉及独立目标项被加几次</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="709.3333" viewBox="0 0 1440 760" x="48" y="106" overflow="hidden"><rect width="1440" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#173c58"><text x="40" y="48" font-size="34" fill="#173c58" text-anchor="start">四个微批只做一次更新：数据梯度与正则梯度分开累计</text><text x="40" y="99" font-size="28" fill="#173c58" text-anchor="start">固定 w = 2；每批数据梯度 0.25；正则项 0.05w² 的梯度为 0.2</text><text x="40" y="155" font-size="30" fill="#c46827" text-anchor="start">每批都加完整正则：重复四次</text><rect x="45" y="185" width="215" height="108" rx="7" fill="white" stroke="#c46827" stroke-width="2"/><text x="152" y="222" font-size="25" fill="#c46827" text-anchor="middle">微批 1</text><text x="152" y="267" font-size="29" fill="#c46827" text-anchor="middle">0.25 + 0.2</text><text x="277" y="249" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="295" y="185" width="215" height="108" rx="7" fill="white" stroke="#c46827" stroke-width="2"/><text x="402" y="222" font-size="25" fill="#c46827" text-anchor="middle">微批 2</text><text x="402" y="267" font-size="29" fill="#c46827" text-anchor="middle">0.25 + 0.2</text><text x="527" y="249" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="545" y="185" width="215" height="108" rx="7" fill="white" stroke="#c46827" stroke-width="2"/><text x="652" y="222" font-size="25" fill="#c46827" text-anchor="middle">微批 3</text><text x="652" y="267" font-size="29" fill="#c46827" text-anchor="middle">0.25 + 0.2</text><text x="777" y="249" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="795" y="185" width="215" height="108" rx="7" fill="white" stroke="#c46827" stroke-width="2"/><text x="902" y="222" font-size="25" fill="#c46827" text-anchor="middle">微批 4</text><text x="902" y="267" font-size="29" fill="#c46827" text-anchor="middle">0.25 + 0.2</text><text x="45" y="350" font-size="32" fill="#c46827" text-anchor="start">数据 1 + 正则 0.8 = 1.8</text><text x="850" y="350" font-size="32" fill="#c46827" text-anchor="start">一步 SGD：w → 1.82</text><text x="40" y="430" font-size="30" fill="#2073ac" text-anchor="start">数据逐批累加，正则只加一次</text><rect x="45" y="460" width="215" height="108" rx="7" fill="white" stroke="#2073ac" stroke-width="2"/><text x="152" y="497" font-size="25" fill="#2073ac" text-anchor="middle">微批 1</text><text x="152" y="542" font-size="29" fill="#2073ac" text-anchor="middle">0.25</text><text x="277" y="524" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="295" y="460" width="215" height="108" rx="7" fill="white" stroke="#2073ac" stroke-width="2"/><text x="402" y="497" font-size="25" fill="#2073ac" text-anchor="middle">微批 2</text><text x="402" y="542" font-size="29" fill="#2073ac" text-anchor="middle">0.25</text><text x="527" y="524" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="545" y="460" width="215" height="108" rx="7" fill="white" stroke="#2073ac" stroke-width="2"/><text x="652" y="497" font-size="25" fill="#2073ac" text-anchor="middle">微批 3</text><text x="652" y="542" font-size="29" fill="#2073ac" text-anchor="middle">0.25</text><text x="777" y="524" font-size="28" fill="#173c58" text-anchor="middle">+</text><rect x="795" y="460" width="215" height="108" rx="7" fill="white" stroke="#2073ac" stroke-width="2"/><text x="902" y="497" font-size="25" fill="#2073ac" text-anchor="middle">微批 4</text><text x="902" y="542" font-size="29" fill="#2073ac" text-anchor="middle">0.25</text><text x="1060" y="541" font-size="31" fill="#2073ac" text-anchor="start">+ 0.2</text><text x="45" y="625" font-size="32" fill="#2073ac" text-anchor="start">数据 1 + 正则 0.2 = 1.2</text><text x="850" y="625" font-size="32" fill="#2073ac" text-anchor="start">一步 SGD：w → 1.88</text><path d="M40 385 H1390" stroke="#d2e0e8"/><text x="40" y="725" font-size="27" fill="#173c58" text-anchor="start">学习率 0.1；组内 w 不变；普通 SGD，无动量、无额外 weight decay</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1200" height="1040" viewBox="0 0 1200 1040" role="img"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">共享参数：两条导数路径汇入同一个自由变量</title><desc id="desc">标量 w=2，损失 L=w²+3w；前向 L=10，反向梯度是两条路径贡献之和。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386f9c" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="1040" fill="white" stroke="none" rx="0" /><text x="48" y="60" font-size="32" fill="#19354a" font-weight="700" text-anchor="start">共享参数：两条导数路径汇入同一个自由变量</text><text x="48" y="104" font-size="21" fill="#597080" font-weight="400" text-anchor="start">标量 w=2，损失 L=w²+3w；前向 L=10，反向梯度是两条路径贡献之和。</text><rect x="32" y="138" width="1136" height="455" fill="white" stroke="#d9e4eb" rx="10" /><text x="56" y="184" font-size="27" fill="#19354a" font-weight="700" text-anchor="start">A  同一个参数对象，使用两次</text><rect x="80" y="300" width="190" height="90" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><text x="175.0" y="354" font-size="25" fill="#19354a" font-weight="400" text-anchor="middle">w = 2</text><rect x="442" y="220" width="220" height="90" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="552.0" y="274" font-size="25" fill="#19354a" font-weight="400" text-anchor="middle">a = w² = 4</text><rect x="442" y="408" width="220" height="90" fill="#edf3f8" stroke="#d9e4eb" rx="10" /><text x="552.0" y="462" font-size="25" fill="#19354a" font-weight="400" text-anchor="middle">b = 3w = 6</text><rect x="900" y="300" width="220" height="90" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><text x="1010.0" y="354" font-size="25" fill="#19354a" font-weight="400" text-anchor="middle">L = a+b = 10</text><path d="M270,327 L434,265" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><path d="M270,365 L434,453" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><path d="M662,265 L892,327" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><path d="M662,453 L892,365" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#arr)" /><text x="290" y="246" font-size="21" fill="#137f78" font-weight="400" text-anchor="start">局部导数 2w=4</text><text x="294" y="482" font-size="21" fill="#bd632e" font-weight="400" text-anchor="start">局部导数 3</text><text x="725" y="250" font-size="21" fill="#597080" font-weight="400" text-anchor="start">种子 1</text><text x="725" y="481" font-size="21" fill="#597080" font-weight="400" text-anchor="start">种子 1</text><text x="56" y="554" font-size="27" fill="#137f78" font-weight="700" text-anchor="start">反向读图：从 L 向左追踪 → 1×4 + 1×3 = 7</text><rect x="32" y="621" width="1136" height="367" fill="white" stroke="#d9e4eb" rx="10" /><text x="56" y="669" font-size="27" fill="#19354a" font-weight="700" text-anchor="start">B  相同初值不等于共享：一次 SGD 更新的对照</text><text x="56" y="719" font-size="22" fill="#597080" font-weight="400" text-anchor="start">学习率 η=0.1；不加动量、权重衰减等其他项。</text><rect x="56" y="749" width="516" height="143" fill="#e3f1ed" stroke="#d9e4eb" rx="10" /><rect x="596" y="749" width="548" height="143" fill="#f9e9de" stroke="#d9e4eb" rx="10" /><text x="80" y="791" font-size="24" fill="#137f78" font-weight="700" text-anchor="start">共享一个 w</text><text x="80" y="843" font-size="27" fill="#19354a" font-weight="400" text-anchor="start">w ← 2 − 0.1×7 = 1.3</text><text x="620" y="791" font-size="24" fill="#bd632e" font-weight="700" text-anchor="start">独立 w1、w2（初值都为 2）</text><text x="620" y="833" font-size="27" fill="#19354a" font-weight="400" text-anchor="start">w1 ← 1.6；w2 ← 1.7</text><text x="620" y="870" font-size="21" fill="#19354a" font-weight="400" text-anchor="start">梯度分别是 4、3，更新后不再相等。</text><text x="56" y="947" font-size="23" fill="#597080" font-weight="400" text-anchor="start">一次反向中的分支求和，与跨多次 backward 的缓冲累加，需要分别理解。</text></g></svg>

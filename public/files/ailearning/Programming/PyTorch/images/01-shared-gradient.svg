<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1185.672" viewBox="0 0 1440 1185.672" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">一个共享参数的两条导数路径与独立参数更新对照</title><rect width="1440" height="1185.672" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">一个共享参数的两条导数路径与独立参数更新对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1043.672" viewBox="0 0 1440 1118.22" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>共享参数：两条导数路径汇入同一个变量</title><svg aria-labelledby="figure-title figure-desc" width="1440" height="668.223" viewBox="41.623 94.775 1081.850 502.026" role="img"><title id="figure-title">共享参数：两条导数路径汇入同一个变量</title><desc id="figure-desc">同一参数 w=2 同时进入平方与三倍两条分支，损失为 w²+3w=10，两条导数贡献相加得到梯度 7。取学习率 0.1 的普通 SGD，共享 w 更新到 1.3；若改为两个初始均为 2 的独立参数，梯度分别是 4 与 3，更新到 1.6、1.7。初始前向相同不代表参数所有权或后续轨迹相同；一次链式求导的分支求和与多次 backward 的缓冲累积也需区分。 共享参数：两条导数路径汇入同一个变量</desc><rect x="41.623" y="94.775" width="1081.85" height="502.026" fill="white"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="65" y="240" width="140" height="80" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="135.0" y="290.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">w=2</text><rect x="430" y="120" width="220" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="540.0" y="167.5" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">a=w²=4</text><rect x="430" y="345" width="220" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="540.0" y="392.5" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">b=3w=6</text><rect x="940" y="240" width="160" height="80" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="1020.0" y="290.0" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">L=10</text><path d="M220 260 L410 165" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M220 300 L410 380" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M665 160 L920 260" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M665 380 L920 300" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><text x="250" y="140" font-size="27" fill="#2472b1" text-anchor="start" font-weight="400">局部导数 4</text><text x="250" y="420" font-size="27" fill="#c57439" text-anchor="start" font-weight="400">局部导数 3</text><text x="825" y="170" font-size="27" fill="#2472b1" text-anchor="start" font-weight="400">种子 1</text><text x="825" y="395" font-size="27" fill="#c57439" text-anchor="start" font-weight="400">种子 1</text><text x="75" y="510" font-size="29" fill="#2472b1" text-anchor="start" font-weight="600">共享 w：梯度 4+3=7 → 一次 SGD 更新为 1.3</text><text x="75" y="570" font-size="28" fill="#c57439" text-anchor="start" font-weight="400">独立参数：梯度分别为 4、3 → 更新为 1.6、1.7</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 668.223) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">同一叶子的 .grad 是累加器：图的复用与梯度清零分开处理</text><rect x="70" y="135" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="281.0" y="174" font-size="28" fill="#1e7499" text-anchor="middle">初值 None</text><rect x="500" y="135" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="711.0" y="174" font-size="28" fill="#1e7499" text-anchor="middle">第一次反传 7</text><rect x="930" y="135" width="422" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1141.0" y="174" font-size="28" fill="#1e7499" text-anchor="middle">第二次反传 14</text><text x="65" y="260" font-size="28" fill="#1d3145" text-anchor="start">第二次保留或重新建立合法计算图；没有清零，新增贡献仍加到旧梯度。</text><rect x="70" y="310" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="281.0" y="349" font-size="28" fill="#c66d3a" text-anchor="middle">zero_grad</text><rect x="500" y="310" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="711.0" y="349" font-size="28" fill="#c66d3a" text-anchor="middle">重新前向</text><rect x="930" y="310" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1141.0" y="349" font-size="28" fill="#c66d3a" text-anchor="middle">反传后 7</text><text x="65" y="414" font-size="27" fill="#1d3145" text-anchor="start">retain_graph 控制图中间量；zero_grad 控制叶子累积值，两个开关不能互相代替。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">共享参数的两条梯度路径</title>
<desc id="fig-desc">共享叶子的两条分支贡献相加。同一次反传分支相加和不同反传累积是两件事。</desc>
<rect x="0" y="0" width="1200" height="688" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">一个参数进入两条计算路径</text>
<path d="M76 237 L103 189 L248 189 L221 237 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="162" y="221.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">w = 2</text>
<path d="M466 169 L493 121 L715 121 L688 169 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="590.5" y="153.75" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">a = w² = 4</text>
<path d="M466 300 L493 252 L715 252 L688 300 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="590.5" y="284.75" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">b = 3w = 6</text>
<path d="M941 237 L968 189 L1106 189 L1079 237 Z" fill="url(#v)" stroke="#6e618e" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1023.5" y="221.75" fill="#6e618e" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">L = 10</text>
<path d="M451 149 L260 209" fill="none" stroke="#166d75" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260 209 L268.996 200.933 L271.993 210.474 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="355.5" y="164" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="20" text-anchor="middle" font-weight="400">局部导数 4</text>
<path d="M451 279 L260 217" fill="none" stroke="#a74d3a" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260 217 L272.006 215.641 L268.919 225.152 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="355.5" y="233" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="20" text-anchor="middle" font-weight="400">局部导数 3</text>
<path d="M928 209 L729 149" fill="none" stroke="#166d75" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M729 149 L740.975 147.388 L738.088 156.963 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="828.5" y="164" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="20" text-anchor="middle" font-weight="400">种子 1</text>
<path d="M928 217 L729 279" fill="none" stroke="#a74d3a" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M729 279 L738.015 270.954 L740.989 280.502 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="828.5" y="233" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="20" text-anchor="middle" font-weight="400">种子 1</text>
<text x="76" y="315" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">箭头表示反传方向。</text>
<text x="76" y="355" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">共享： 4 + 3 = 7，SGD 更新到 1.3。</text>
<text x="657" y="355" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">独立： 分别更新到 1.6 与 1.7。</text>
<path d="M75 393 L1125 393" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="445" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="27" text-anchor="start" font-weight="600">同一个叶子的梯度缓冲</text>
<text x="78" y="496" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">初值</text>
<path d="M78 572 L105 519 L291 519 L264 572 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="184.5" y="554.6" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">None</text>
<path d="M302 545 L328 545" fill="none" stroke="#6e618e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M328 545 L317 550 L317 540 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="341" y="496" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">第一次反传</text>
<path d="M341 572 L368 519 L554 519 L527 572 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="447.5" y="554.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">7</text>
<path d="M565 545 L591 545" fill="none" stroke="#6e618e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M591 545 L580 550 L580 540 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="607" y="496" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">再反传一次</text>
<path d="M607 572 L634 519 L820 519 L793 572 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="713.5" y="554.6" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">14</text>
<path d="M831 545 L857 545" fill="none" stroke="#6e618e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M857 545 L846 550 L846 540 Z" fill="#6e618e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="873" y="496" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">清零，再反传</text>
<path d="M873 572 L900 519 L1086 519 L1059 572 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="979.5" y="554.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">7</text>
<text x="76" y="630" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">再次反传要重新前向，或在上一次反传时保留计算图。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">训练模式与梯度记录是两个独立开关</title><desc id="desc">先沿模式列判断模块采用训练还是评价行为，再沿梯度列判断是否建立自动微分图。eval 不等于关闭梯度，no_grad 也不等于切换评价模式；这解释了为什么验证循环通常需要分别设置两者。 表针对常规 Dropout 和带运行统计的 BatchNorm。自定义模块可能有自己的模式逻辑；即使不记录梯度，训练模式的 BatchNorm 仍可能更新缓冲区。 开启记录还要求该运算涉及可求导参与量；仅打开全局开关并不足以让常量运算建图。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="595" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="420.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">训练模式与梯度记录是两个独立开关</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">需有可求导参与量；BatchNorm 假设启用运行统计。</text><rect x="60.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">模式组合</text><rect x="420.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">Dropout / BatchNorm</text><rect x="780.0" y="165" width="360.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">是否记录反向图</text><rect x="60.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">train + 开启梯度</text><rect x="420.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">训练行为</text><rect x="780.0" y="230" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">是（需可求导参与量）</text><rect x="60.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">eval + 开启梯度</text><rect x="420.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">评价行为</text><rect x="780.0" y="295" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">是（需可求导参与量）</text><rect x="60.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">train + no_grad</text><rect x="420.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">训练行为</text><rect x="780.0" y="360" width="360.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">否</text><rect x="60.0" y="425" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">eval + no_grad</text><rect x="420.0" y="425" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">评价行为</text><rect x="780.0" y="425" width="360.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">否</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="529.25" viewBox="5.29 0.00 1135.41 500.76" role="img"><title id="figure-title">模块模式与梯度记录：两个独立开关</title><desc id="figure-desc">左右列只改变是否记录反向图，上下行只改变模块采用训练还是评估行为。train 与关闭梯度组合时，BatchNorm 仍可能更新运行统计；eval 与开启梯度组合时，仍可对需要梯度的输入求导。图示常见配置，具体行为还取决于模块定义和参数设置。</desc><rect x="0" y="0" width="1200" height="535" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">模块模式与梯度记录：两个独立开关</text><text x="260" y="115" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="600">记录梯度</text><text x="800" y="115" font-size="29" fill="#c87536" text-anchor="middle" font-weight="600">关闭记录</text><rect x="90" y="155" width="470" height="135" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="90" y="330" width="470" height="135" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><rect x="640" y="155" width="470" height="135" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><rect x="640" y="330" width="470" height="135" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="120" y="205" font-size="28" fill="#213447" text-anchor="start" font-weight="400">train：训练行为</text><text x="120" y="380" font-size="28" fill="#213447" text-anchor="start" font-weight="400">eval：评估行为</text><text x="670" y="205" font-size="28" fill="#213447" text-anchor="start" font-weight="400">train：训练行为</text><text x="670" y="380" font-size="28" fill="#213447" text-anchor="start" font-weight="400">eval：评估行为</text><text x="120" y="255" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">为需梯度的运算建立图</text><text x="670" y="255" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">仍可更新 BN 运行统计</text><text x="120" y="430" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">可用于输入敏感度等求导</text><text x="670" y="430" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">常规推理与验证的组合</text></g></svg>

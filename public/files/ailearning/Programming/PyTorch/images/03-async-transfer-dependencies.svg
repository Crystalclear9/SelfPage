<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="621" viewBox="0 0 1380 621" role="img" aria-labelledby="label detail"><title id="label">异步传输靠依赖与缓冲复用协调</title><desc id="detail">复制 A 完成后计算 A 才就绪。计算 A 可与复制 B 重叠，主机缓冲需等复制结束。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1380" height="621" fill="white" stroke="none" stroke-width="1.6"/><text x="741" y="66" fill="#202a37" font-size="37" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">复制完成事件连接两个流</text><text x="149" y="202" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">传输流</text><line x1="247" y1="189" x2="1259" y2="189" stroke="#657682" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-gray)"/><text x="149" y="415" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">计算流</text><line x1="247" y1="402" x2="1259" y2="402" stroke="#657682" stroke-width="1.65" stroke-linecap="round" marker-end="url(#arrow-gray)"/><rect x="271" y="140" width="311" height="98" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="426.5" y="199" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">复制 A</text><rect x="627" y="140" width="383" height="98" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.6"/><text x="818.5" y="199" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">复制 B</text><rect x="601" y="353" width="338" height="98" fill="url(#wash-teal)" stroke="#196f77" stroke-width="1.6"/><text x="770" y="412" fill="#196f77" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">计算 A</text><rect x="1023" y="353" width="219" height="98" fill="url(#wash-violet)" stroke="#655184" stroke-width="1.6"/><text x="1132.5" y="412" fill="#655184" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">计算 B</text><circle cx="582" cy="244" r="5" stroke="#196f77" fill="#196f77" stroke-width="1.75"/><line x1="582" y1="255" x2="582" y2="349" stroke="#196f77" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-teal)" stroke-dasharray="6 6"/><circle cx="1010" cy="244" r="5" stroke="#655184" fill="#655184" stroke-width="1.75"/><line x1="1010" y1="255" x2="1010" y2="349" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-violet)" stroke-dasharray="6 6"/><text x="634" y="299" fill="#196f77" font-size="28" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">A 已复制</text><text x="737" y="543" fill="#202a37" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">固定主机缓冲须等对应复制完成后再复用</text></svg>
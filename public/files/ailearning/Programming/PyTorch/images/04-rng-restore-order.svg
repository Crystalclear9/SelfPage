<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1129.000" height="414.000" viewBox="11.000 66.000 1129.000 414.000" role="img"><title id="figure-title">对象重建可能消费随机流，恢复顺序会改变轨迹</title><desc id="figure-desc">R 表示已保存的随机生成器状态，a、b、c 只是该状态之后的三个输出标记。为看清顺序，假设模型构造恰好消费同一个随机流中的两个值：先恢复再构造，下一动作将看到 c；先完成对象重建再恢复，下一动作才重新看到 a，与连续执行对应。真实模型消费次数由实现决定，若构造使用其他独立流，则应按实际依赖分别分析；所有可能消费待恢复随机流的准备工作都应纳入恢复协议。 对象重建可能消费随机流，恢复顺序会改变轨迹 连续运行在 R 之后的下一动作原本应取 a。</desc><rect width="1129.0" height="414.0" fill="white" x="11.0" y="66.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">同一检查点 R；下三个随机值为 a、b、c</text><text x="35" y="205" font-size="28" fill="#c87536" text-anchor="start" font-weight="600">过早恢复</text><rect x="235" y="175" width="240" height="80" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="355.0" y="224.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">恢复 R</text><rect x="515" y="175" width="295" height="80" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="662.5" y="224.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">构造：消费 a、b</text><rect x="875" y="175" width="240" height="80" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="995.0" y="224.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">下一动作取 c</text><path d="M485 215 L500 215" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M825 215 L860 215" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="35" y="405" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">重建后恢复</text><rect x="235" y="375" width="240" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="355.0" y="424.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">重建对象</text><rect x="515" y="375" width="295" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="662.5" y="424.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">恢复 R</text><rect x="875" y="375" width="240" height="80" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="995.0" y="424.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">下一动作取 a</text><path d="M485 415 L500 415" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M825 415 L860 415" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /></g></svg>

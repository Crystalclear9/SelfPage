<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="920" viewBox="0 0 1320 920" role="img"><title>恢复随机流会把读取位置移回保存的状态</title><rect width="1320" height="920" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="32" fill="#176b91" text-anchor="start" font-weight="400">保存状态 R 后的输出带</text><text x="60" y="190" font-size="32" fill="#d87332" text-anchor="start" font-weight="400">过早恢复</text><text x="60" y="245" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">恢复 R → 构造消耗 a、b</text><rect x="570" y="140" width="135" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="637" y="193" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">a</text><rect x="725" y="140" width="135" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="792" y="193" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">b</text><rect x="880" y="140" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="947" y="193" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">c</text><rect x="1035" y="140" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1102" y="193" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">d</text><line x1="947" y1="275" x2="947" y2="226" stroke="#218579" stroke-width="4" marker-end="url(#t)"/><text x="60" y="335" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">下一动作从 c 开始</text><line x1="60" y1="395" x2="1240" y2="395" stroke="#d9e4ea" stroke-width="2"/><text x="60" y="465" font-size="32" fill="#176b91" text-anchor="start" font-weight="400">先重建对象</text><text x="60" y="520" font-size="27" fill="#203b4a" text-anchor="start" font-weight="400">构造已消费该流的若干值</text><rect x="570" y="430" width="135" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="637" y="483" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">a</text><rect x="725" y="430" width="135" height="80" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="792" y="483" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">b</text><rect x="880" y="430" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="947" y="483" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">c</text><rect x="1035" y="430" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1102" y="483" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">d</text><line x1="947" y1="565" x2="947" y2="516" stroke="#218579" stroke-width="4" marker-end="url(#t)"/><text x="60" y="655" font-size="32" fill="#218579" text-anchor="start" font-weight="400">再恢复 R</text><text x="60" y="710" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">读取位置回到 a 之前</text><rect x="570" y="620" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="637" y="673" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">a</text><rect x="725" y="620" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="792" y="673" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">b</text><rect x="880" y="620" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="947" y="673" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">c</text><rect x="1035" y="620" width="135" height="80" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1102" y="673" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">d</text><line x1="637" y1="755" x2="637" y2="706" stroke="#218579" stroke-width="4" marker-end="url(#t)"/><path d="M947 560 L947 585 L637 585 L637 610" fill="none" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><text x="60" y="850" font-size="30" fill="#203b4a" text-anchor="start" font-weight="400">状态恢复的是生成器位置，不是仅把种子名称再记一次。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="691" viewBox="0 0 1200 691" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">先构建再恢复随机状态</title>
<desc id="fig-desc">R 指向 a 之前。若恢复后再构建，构建先消耗 a、b，训练从 c 开始。</desc>
<rect x="0" y="0" width="1200" height="691" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">对象构建也可能推进随机流的位置</text>
<text x="74" y="140" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">过早恢复</text>

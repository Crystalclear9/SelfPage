<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618.62" viewBox="11.24 10.52 1133.76 584.48" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">训练、模型选择与最终检验各用一组数据</title><desc id="desc">训练集驱动梯度更新，验证集用于比较候选和确定停止时刻，最后在冻结的模型与规则上进行独立测试。图中的箭头说明选择过程为何会使用验证信息，也说明测试应放在选择之后。 反复根据测试结果修改模型会把测试集变成选择集。图不规定必须只有一次物理执行，而是要求最终报告对应独立、事先固定的评价协议。 测试集不参与挑选检查点；多次择优会改变评价含义。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">训练、模型选择与最终检验各用一组数据</text><path d="M345,235 L450,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,235 L830,235" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M972.5,290 L972.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M830,505 L735,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">训练集：更新参数</text><rect x="450" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">候选检查点</text><rect x="830" y="180" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="243" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">验证集：选择检查点</text><rect x="830" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">冻结选定模型</text><rect x="450" y="450" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="513" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">测试集：最终评价</text></g></svg>

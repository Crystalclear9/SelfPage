<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770"><rect width="1280" height="770" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="55" y="55" font-size="34" fill="#203449" text-anchor="start">早停的选择过程：停止于第 5 轮，恢复第 3 轮</text><text x="55" y="103" font-size="26" fill="#203449" text-anchor="start">独立示意例：验证损失越小越好；最小改善 0.005；耐心 2 次检查</text><path d="M95 465.0L735 465.0" stroke="#e2e9ee" stroke-width="2" /><text x="75" y="474.0" font-size="25" fill="#203449" text-anchor="end">0.2</text><path d="M95 375.0L735 375.0" stroke="#e2e9ee" stroke-width="2" /><text x="75" y="384.0" font-size="25" fill="#203449" text-anchor="end">0.4</text><path d="M95 285.0L735 285.0" stroke="#e2e9ee" stroke-width="2" /><text x="75" y="294.0" font-size="25" fill="#203449" text-anchor="end">0.6</text><path d="M95 194.99999999999994L735 194.99999999999994" stroke="#e2e9ee" stroke-width="2" /><text x="75" y="203.99999999999994" font-size="25" fill="#203449" text-anchor="end">0.8</text><path d="M95 150L95 530" stroke="#c8d6e0" stroke-width="2" /><path d="M95 530L735 530" stroke="#c8d6e0" stroke-width="2" /><polyline points="125,217.5 265,330.0 405,402.0 545,433.5 685,456.0" stroke="#247bb5" stroke-width="4" fill="none"/><circle cx="125" cy="217.5" r="6" fill="#247bb5"/><circle cx="265" cy="330.0" r="6" fill="#247bb5"/><circle cx="405" cy="402.0" r="6" fill="#247bb5"/><circle cx="545" cy="433.5" r="6" fill="#247bb5"/><circle cx="685" cy="456.0" r="6" fill="#247bb5"/><polyline points="125,194.99999999999994 265,307.5 405,375.0 545,366.0 685,357.0" stroke="#c77832" stroke-width="4" fill="none"/><circle cx="125" cy="194.99999999999994" r="6" fill="#c77832"/><circle cx="265" cy="307.5" r="6" fill="#c77832"/><circle cx="405" cy="375.0" r="6" fill="#c77832"/><circle cx="545" cy="366.0" r="6" fill="#c77832"/><circle cx="685" cy="357.0" r="6" fill="#c77832"/><text x="125" y="569" font-size="27" fill="#203449" text-anchor="middle">1</text><text x="265" y="569" font-size="27" fill="#203449" text-anchor="middle">2</text><text x="405" y="569" font-size="27" fill="#203449" text-anchor="middle">3</text><text x="545" y="569" font-size="27" fill="#203449" text-anchor="middle">4</text><text x="685" y="569" font-size="27" fill="#203449" text-anchor="middle">5</text><text x="670" y="609" font-size="26" fill="#203449" text-anchor="start">轮次</text><text x="150" y="175" font-size="28" fill="#c77832" text-anchor="start">验证</text><text x="500" y="465" font-size="28" fill="#247bb5" text-anchor="start">训练</text><circle cx="405" cy="375.0" r="13" fill="none" stroke="#087e7c" stroke-width="3"/><text x="260" y="270" font-size="26" fill="#087e7c" text-anchor="start">最佳验证 0.40</text><path d="M370 280L405 358.0" stroke="#087e7c" stroke-width="2" /><text x="545" y="637" font-size="25" fill="#c77832" text-anchor="middle">未改善 1</text><text x="685" y="637" font-size="25" fill="#c77832" text-anchor="middle">未改善 2</text><path d="M790 145L790 650" stroke="#c8d6e0" stroke-width="2" /><text x="835" y="203" font-size="27" fill="#087e7c" text-anchor="start">第 3 轮：捕获独立快照</text><text x="835" y="260" font-size="27" fill="#203449" text-anchor="start">第 4、5 轮：连续未改善</text><text x="835" y="317" font-size="27" fill="#203449" text-anchor="start">达到耐心后停止训练</text><text x="835" y="396" font-size="30" fill="#087e7c" text-anchor="start">恢复第 3 轮状态</text><text x="835" y="454" font-size="27" fill="#203449" text-anchor="start">冻结预处理与决策规则</text><text x="835" y="525" font-size="30" fill="#1d6393" text-anchor="start">此后才独立测试</text><text x="835" y="584" font-size="27" fill="#203449" text-anchor="start">测试结果不回流选轮次</text><path d="M55 690L1225 690" stroke="#c8d6e0" stroke-width="2" /><text x="55" y="738" font-size="26" fill="#203449" text-anchor="start">训练损失还在下降，不构成保留第 5 轮的理由；选择依据是事先指定的验证指标。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">零梯度与缺失梯度，会留下不同的优化器轨迹</title><desc id="desc">同一SGD热身状态经过缺失梯度与零梯度更新后，再使用相同梯度1，分别得到参数0.52与0.358。旧梯度不会因requires_grad关闭而被自动删除。</desc><rect width="1200" height="860" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">零梯度与缺失梯度，会留下不同的优化器轨迹</text><text x="40" y="103" font-size="26" fill="#627689" text-anchor="start">SGD：学习率 0.1，动量 0.9；无衰减、无 Nesterov。状态记为 (w, b)。</text><rect x="40" y="145" width="1120" height="92" fill="#2865a0" opacity="0.1" rx="3"/><text x="600.0" y="181" font-size="26" fill="#2865a0" text-anchor="middle">共同热身：w = 1，梯度 g = 2  →  参数 w = 0.8，动量 b = 2</text><text x="42" y="306" font-size="29" fill="#2865a0" text-anchor="start">缺失梯度</text><text x="42" y="344" font-size="26" fill="#2865a0" text-anchor="start">grad = None</text><rect x="280" y="270" width="345" height="110" fill="#2865a0" opacity="0.1" rx="3"/><text x="452.5" y="306" font-size="26" fill="#2865a0" text-anchor="middle">该步被跳过</text><text x="452.5" y="344" font-size="26" fill="#2865a0" text-anchor="middle">(0.8, 2)</text><line x1="647" y1="325" x2="755" y2="325" stroke="#2865a0" stroke-width="3"/><polyline points="744.4690092573155,330.75310646325045 755,325 744.4690092573155,319.24689353674955" fill="none" stroke="#2865a0" stroke-width="3"/><rect x="780" y="270" width="365" height="110" fill="#2865a0" opacity="0.1" rx="3"/><text x="962.5" y="306" font-size="26" fill="#2865a0" text-anchor="middle">再次得到梯度 g = 1</text><text x="962.5" y="344" font-size="26" fill="#2865a0" text-anchor="middle">b = 2.8，w = 0.52</text><text x="280" y="428" font-size="26" fill="#2865a0" text-anchor="start">b 不衰减；参数也不移动。</text><line x1="40" y1="465" x2="1160" y2="465" stroke="#dce5ed" stroke-width="2"/><text x="42" y="540" font-size="29" fill="#c87536" text-anchor="start">零梯度</text><text x="42" y="578" font-size="26" fill="#c87536" text-anchor="start">grad = 0</text><rect x="280" y="504" width="345" height="110" fill="#c87536" opacity="0.1" rx="3"/><text x="452.5" y="540" font-size="26" fill="#c87536" text-anchor="middle">执行零输入的动量更新</text><text x="452.5" y="578" font-size="26" fill="#c87536" text-anchor="middle">(0.62, 1.8)</text><line x1="647" y1="559" x2="755" y2="559" stroke="#c87536" stroke-width="3"/><polyline points="744.4690092573155,564.7531064632504 755,559 744.4690092573155,553.2468935367496" fill="none" stroke="#c87536" stroke-width="3"/><rect x="780" y="504" width="365" height="110" fill="#c87536" opacity="0.1" rx="3"/><text x="962.5" y="540" font-size="26" fill="#c87536" text-anchor="middle">再次得到梯度 g = 1</text><text x="962.5" y="578" font-size="26" fill="#c87536" text-anchor="middle">b = 2.62，w = 0.358</text><text x="280" y="662" font-size="26" fill="#c87536" text-anchor="start">当前数据梯度为零，历史动量仍推动参数移动。</text><line x1="40" y1="705" x2="1160" y2="705" stroke="#dce5ed" stroke-width="2"/><text x="40" y="756" font-size="26" fill="#213447" text-anchor="start">只设 requires_grad=False：旧 grad=2 仍在时，下一步可走到 (0.42, 3.8)。</text><text x="40" y="813" font-size="26" fill="#627689" text-anchor="start">冻结需明确清梯度与状态策略；暂停优化器状态与重置状态也不相同。</text></g></svg>
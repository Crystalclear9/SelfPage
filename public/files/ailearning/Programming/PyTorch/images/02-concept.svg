<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：把微批次还原成三个有效元素，就能看出应有的权重</title><desc id="detail-desc">把微批次还原成三个有效元素，就能看出应有的权重。两批均值是 1 和 10，直接平均得到 5.5；按元素数 2:1 加权才是全体元素平均值 4。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="35" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">微批次 A：两个元素</text><rect x="40" y="90" width="115" height="70" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="97.5" y="135.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="160" y="90" width="115" height="70" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="217.5" y="135.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">1</text><text x="460" y="35" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">微批次 B：一个元素</text><rect x="480" y="90" width="115" height="70" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="537.5" y="135.5" font-size="23" fill="#213447" font-weight="500" text-anchor="middle">10</text><path d="M260,185 L330,270" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M530,185 L470,270" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="320.0" y="316" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">1 + 1 + 10</text><line x1="210" y1="330" x2="430" y2="330" stroke="#213447" stroke-width="1.6" /><text x="320.0" y="360" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">3</text><text x="445" y="338" font-size="25" fill="#158476" font-weight="600" text-anchor="start">= 4</text><text x="835.0" y="156" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">1 + 10</text><line x1="750" y1="170" x2="920" y2="170" stroke="#213447" stroke-width="1.6" /><text x="835.0" y="200" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text><text x="935" y="178" font-size="25" fill="#158476" font-weight="600" text-anchor="start">= 5.5</text><text x="740" y="70" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">错误：两个批均值等权</text><text x="740" y="280" font-size="23" fill="#213447" font-weight="400" text-anchor="start">使 B 中元素权重变为</text><text x="825.0" y="336" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">1</text><line x1="800" y1="350" x2="850" y2="350" stroke="#213447" stroke-width="1.6" /><text x="825.0" y="380" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text><text x="865" y="358" font-size="25" fill="#158476" font-weight="600" text-anchor="start">（应为三分之一）</text></g></svg>

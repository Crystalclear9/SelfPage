.0" height="70" rx="0" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><rect x="320.0" y="910" width="70.0" height="70" rx="0" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><rect x="390.0" y="910" width="700.0" height="70" rx="0" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="1120.0" y="960" font-size="39" fill="#218579" text-anchor="start" font-weight="400">= 4</text><text x="60" y="955" font-size="29" fill="#80929d" text-anchor="start" font-weight="400">贡献和</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1100) scale(1.18056)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">共同分母还决定每条样本的梯度权重，不只是日志平均值</text><rect x="65" y="140" width="482" height="58" fill="#edf5f8" stroke="#216c89"/><text x="306.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">微批 A：1、1</text><rect x="555" y="140" width="482" height="58" fill="#edf5f8" stroke="#216c89"/><text x="796.0" y="179" font-size="28" fill="#216c89" text-anchor="middle">微批 B：10</text><g><text x="65.000" y="260" font-size="30" fill="#c96937">先均批：A 内每项权重 </text><text x="390.070" y="243" font-size="28" fill="#c96937" text-anchor="middle">1</text><line x1="377.859" x2="402.281" y1="251" y2="251" stroke="#c96937" stroke-width="1.5"/><text x="390.070" y="279" font-size="28" fill="#c96937" text-anchor="middle">4</text><text x="406.281" y="260" font-size="30" fill="#c96937">；B 唯一项权重 </text><text x="639.070" y="243" font-size="28" fill="#c96937" text-anchor="middle">1</text><line x1="626.859" x2="651.281" y1="251" y2="251" stroke="#c96937" stroke-width="1.5"/><text x="639.070" y="279" font-size="28" fill="#c96937" text-anchor="middle">2</text></g><text x="65" y="330" font-size="30" fill="#216c89" text-anchor="start">统一样本目标：三条记录的权重全部相同，均为三分之一</text><text x="65" y="410" font-size="28" fill="#203742" text-anchor="start">拆分批次只改变执行方式；若权重改变，优化的经验风险也随之改变。</text></g></g></svg>

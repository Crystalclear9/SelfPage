<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">微批归约改变每个元素的权重</title><desc id="desc">A的两个元素损失均为1，在相同横坐标竖直叠放；B损失10。圆面积表示权重；批均值等权对应每项1/4,1/4,1/2，均值5.5；共同分母对应各1/3，均值4。</desc><rect width="1200.0" height="760.0" fill="white" x="0.0" y="0.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="40" y="45" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">微批 A：损失 [1, 1]；微批 B：损失 [10]</text><text x="40" y="110" fill="#c66e30" font-size="29" text-anchor="start" font-weight="600">先平均两个批均值</text><line x1="140" y1="210" x2="1090" y2="210" stroke="#7b8a96" stroke-width="2" marker-end="url(#g)" /><circle cx="228" cy="172" r="29.444863728670914" fill="white" stroke="#c66e30" stroke-width="2" /><text x="228" y="180" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">1</text><circle cx="228" cy="248" r="29.444863728670914" fill="white" stroke="#c66e30" stroke-width="2" /><text x="228" y="256" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">1</text><circle cx="1020" cy="210" r="41.641325627314025" fill="white" stroke="#c66e30" stroke-width="2" /><text x="1020" y="218" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">10</text><path d="M624.0 237 l-12 22 h24 z" stroke="#c66e30" fill="white" stroke-width="2" /><text x="624.0" y="298" fill="#c66e30" font-size="29" text-anchor="middle" font-weight="400">加权均值 5.5</text><text x="130" y="365" fill="#c66e30" font-size="27" text-anchor="start" font-weight="400">A 每项权重</text><text x="340" y="352" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">1</text><line x1="323" y1="360" x2="357" y2="360" stroke="#c66e30" stroke-width="1.5" /><text x="340" y="389" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">4</text><text x="650" y="365" fill="#c66e30" font-size="27" text-anchor="start" font-weight="400">B 每项权重</text><text x="865" y="352" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">1</text><line x1="848" y1="360" x2="882" y2="360" stroke="#c66e30" stroke-width="1.5" /><text x="865" y="389" fill="#c66e30" font-size="25" text-anchor="middle" font-weight="400">2</text><text x="40" y="435" fill="#24679c" font-size="29" text-anchor="start" font-weight="600">共同分母：3 个有效元素</text><line x1="140" y1="535" x2="1090" y2="535" stroke="#7b8a96" stroke-width="2" marker-end="url(#g)" /><circle cx="228" cy="497" r="34.0" fill="white" stroke="#24679c" stroke-width="2" /><text x="228" y="505" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">1</text><circle cx="228" cy="573" r="34.0" fill="white" stroke="#24679c" stroke-width="2" /><text x="228" y="581" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">1</text><circle cx="1020" cy="535" r="34.0" fill="white" stroke="#24679c" stroke-width="2" /><text x="1020" y="543" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">10</text><path d="M492 562 l-12 22 h24 z" stroke="#24679c" fill="white" stroke-width="2" /><text x="492" y="623" fill="#24679c" font-size="29" text-anchor="middle" font-weight="400">加权均值 4</text><text x="130" y="690" fill="#24679c" font-size="27" text-anchor="start" font-weight="400">所有元素权重</text><text x="370" y="677" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">1</text><line x1="353" y1="685" x2="387" y2="685" stroke="#24679c" stroke-width="1.5" /><text x="370" y="714" fill="#24679c" font-size="25" text-anchor="middle" font-weight="400">3</text></g></svg>

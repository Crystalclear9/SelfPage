<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="749" viewBox="0 0 1200 749" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 426.930000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 426.930000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 322.070000 684.000000 426.930000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 322.070000 684.000000 426.930000"/>
<title id="fig-title">掩码的放置决定求导图包含什么</title>
<desc id="fig-desc">相同的最终输出，只有先过滤的路径没有零分母除法。</desc>
<rect x="0" y="0" width="1200" height="749" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">把掩码放在除法前，才能隔离零分母</text>
<text x="74" y="108" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">x = [1, 1]，分母 d = [0, 2]，只保留 d 非零的位置。</text>
<text x="74" y="169" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">先除法再选择</text>
<path d="M74 253 L101 198 L518 198 L491 253 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="296" y="233.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">第一项：1 ÷ 0 → ∞</text>
<path d="M74 330 L101 275 L518 275 L491 330 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="296" y="310.55" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">第二项：1 ÷ 2 → 0.5</text>
<path d="M74 407 L101 352 L518 352 L491 407 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="296" y="387.55" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">选择后 [0, 0.5]</text>
<text x="74" y="483" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">反向仍进入零分母节点。</text>
<text x="74" y="543" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="start" font-weight="400">x.grad = [NaN, 0.5]</text>
<text x="654" y="169" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">先选择有效位置再除</text>
<path d="M654 253 L681 198 L1098 198 L1071 253 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="876" y="233.55" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">第一项：跳过除法</text>
<path d="M654 330 L681 275 L1098 275 L1071 330 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="876" y="310.55" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">第二项：1 ÷ 2 → 0.5</text>
<path d="M654 407 L681 352 L1098 352 L1071 407 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="876" y="387.55" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="middle" font-weight="400">写回后 [0, 0.5]</text>
<text x="654" y="483" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">无效位置没有除法依赖。</text>
<text x="654" y="543" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="start" font-weight="400">x.grad = [0, 0.5]</text>
<path d="M75 594 L1125 594" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="646" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">输出相同不能证明反向相同。先在索引层去掉无效位置。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1160.1818" viewBox="0 0 1440 1160.1818" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">除法之前与之后应用掩码的计算路径对照</title><rect width="1440" height="1160.1818" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">除法之前与之后应用掩码的计算路径对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1018.1818" viewBox="0 0 1320 1000" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>掩码应在无效除法进入计算图之前生效</title><rect width="1320" height="1000" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1672a0" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1e9195" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="55" font-size="30" fill="#20354a" text-anchor="start" font-weight="400">x = [1, 1]；固定分母 d = [0, 2]；仅保留 d ≠ 0</text><text x="60" y="125" font-size="32" fill="#d37537" text-anchor="start" font-weight="400">先除法，再选择</text><text x="735" y="125" font-size="32" fill="#1672a0" text-anchor="start" font-weight="400">先选有效位置，再除法</text><rect x="60" y="205" width="100" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="110" y="255" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">1</text><rect x="240" y="205" width="100" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="290" y="255" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">0</text><text x="190" y="255" font-size="32" fill="#d37537" text-anchor="middle" font-weight="400">÷</text><line x1="355" y1="243" x2="410" y2="243" stroke="#d37537" stroke-width="3" marker-end="url(#o)"/><rect x="430" y="205" width="130" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="495" y="255" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">inf</text><rect x="745" y="205" width="100" height="75" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="795" y="255" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">1</text><rect x="925" y="205" width="100" height="75" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="975" y="255" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">0</text><line x1="755" y1="270" x2="1015" y2="215" stroke="#818fa4" stroke-width="3"/><text x="1090" y="250" font-size="30" fill="#818fa4" text-anchor="start" font-weight="400">跳过</text><rect x="60" y="395" width="100" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="110" y="445" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">1</text><rect x="240" y="395" width="100" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="290" y="445" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">2</text><text x="190" y="445" font-size="32" fill="#d37537" text-anchor="middle" font-weight="400">÷</text><line x1="355" y1="433" x2="410" y2="433" stroke="#d37537" stroke-width="3" marker-end="url(#o)"/><rect x="430" y="395" width="130" height="75" rx="4" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2"/><text x="495" y="445" font-size="34" fill="#d37537" text-anchor="middle" font-weight="400">0.5</text><rect x="745" y="395" width="100" height="75" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="795" y="445" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">1</text><rect x="925" y="395" width="100" height="75" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="975" y="445" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">2</text><text x="875" y="445" font-size="32" fill="#1672a0" text-anchor="middle" font-weight="400">÷</text><line x1="1035" y1="433" x2="1090" y2="433" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><text x="1180" y="445" font-size="32" fill="#1672a0" text-anchor="middle" font-weight="400">0.5</text><text x="60" y="630" font-size="31" fill="#d37537" text-anchor="start" font-weight="400">选择结果 [0, 0.5]</text><text x="745" y="630" font-size="31" fill="#1672a0" text-anchor="start" font-weight="400">零初始化后写回 [0, 0.5]</text><text x="60" y="715" font-size="31" fill="#d37537" text-anchor="start" font-weight="400">反向仍穿过零分母节点</text><text x="745" y="715" font-size="31" fill="#1672a0" text-anchor="start" font-weight="400">无效项没有除法依赖</text><text x="270" y="815" font-size="31" fill="#d37537" text-anchor="middle" font-weight="400">0</text><line x1="235" y1="827" x2="305" y2="827" stroke="#d37537" stroke-width="2"/><text x="270" y="8
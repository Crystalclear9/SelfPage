<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810"><rect width="1280" height="810" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="55" font-size="34" fill="#203449">掩码放在除法之前：相同有限输出，不同反向结果</text><text x="50" y="104" font-size="27" fill="#203449">x = [1, 1]，分母 d = [0, 2]，仅保留 d ≠ 0 的项</text><text x="50" y="170" font-size="30" fill="#b95a17">先除法，后选择</text><text x="685" y="170" font-size="30" fill="#087e7c">先选择，再除法</text><rect x="50" y="210" width="545" height="305" fill="#fff1e6"/><rect x="685" y="210" width="545" height="305" fill="#e8f4f2"/><text x="75" y="260" font-size="28" fill="#203449">第 0 项：1 ÷ 0 → inf</text><text x="710" y="260" font-size="28" fill="#203449">第 0 项：不执行除法 → 0</text><text x="75" y="325" font-size="28" fill="#203449">第 1 项：1 ÷ 2 → 0.5</text><text x="710" y="325" font-size="28" fill="#203449">第 1 项：1 ÷ 2 → 0.5</text><text x="75" y="390" font-size="28" fill="#203449">选择后输出：[0, 0.5]</text><text x="710" y="390" font-size="28" fill="#203449">填回原位置：[0, 0.5]</text><text x="75" y="455" font-size="28" fill="#203449">求和损失：0.5</text><text x="710" y="455" font-size="28" fill="#203449">求和损失：0.5</text><text x="50" y="573" font-size="29" fill="#b95a17">反向仍进入已记录的除法</text><text x="685" y="573" font-size="29" fill="#087e7c">图中只记录有效项的除法</text><text x="50" y="627" font-size="27" fill="#b95a17">第 0 项收到 0，但 0 ÷ 0 → NaN</text><text x="685" y="627" font-size="27" fill="#087e7c">第 0 项没有该路径，贡献为 0</text><text x="50" y="685" font-size="32" fill="#b95a17">x.grad = [NaN, 0.5]</text><text x="685" y="685" font-size="32" fill="#087e7c">x.grad = [0, 0.5]</text><path d="M640 150L640 710" stroke="#c8d6e0" stroke-width="3" /><path d="M50 738L1230 738" stroke="#c8d6e0" stroke-width="3" /><text x="50" y="785" font-size="25" fill="#203449">torch.where 会先求出候选表达式；仅在结果端遮住无效项，不能消除已记录的危险运算。</text></g></svg>
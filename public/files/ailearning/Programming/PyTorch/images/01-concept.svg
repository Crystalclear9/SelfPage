<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="976.130" height="399.716" viewBox="4.765 -6.624 976.130 399.716" role="img"><title id="detail-title">机制展开：按蓝色方向计算 z=2×3=6、L=18，再按橙色方向从标量损失的梯度种子 1 回传</title><desc id="detail-desc">按蓝色方向计算 z=2×3=6、L=18，再按橙色方向从标量损失的梯度种子 1 回传。两次局部导数相乘得到 w 的梯度 18；梯度的计算、累积和优化器更新是不同动作。 </desc><rect x="4.765" y="-6.624" width="976.13" height="399.716" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">前向：用数值构造计算图</text><rect x="35" y="100" width="220" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="145.0" y="128" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">w = 2</text><rect x="310" y="100" width="220" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="420.0" y="128" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">z = 6</text><rect x="650" y="100" width="220" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="760.0" y="128" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">L = 18</text><path d="M265,121 L295,121" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M540,121 L635,121" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="280" y="190" font-size="24" fill="#213447" font-weight="400" text-anchor="start">乘以 x=3</text><text x="600" y="190" font-size="24" fill="#213447" font-weight="400" text-anchor="start">平方后除以 2</text><text x="25" y="280" font-size="26" fill="#cf7432" font-weight="600" text-anchor="start">反向：上游梯度 × 局部导数</text><rect x="35" y="330" width="250" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="160.0" y="358" font-size="24" fill="#cf7432" font-weight="600" text-anchor="middle">18 = 6 × 3</text><rect x="390" y="330" width="250" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="515.0" y="358" font-size="24" fill="#cf7432" font-weight="600" text-anchor="middle">6 = 1 × 6</text><rect x="780" y="330" width="180" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="870.0" y="358" font-size="24" fill="#cf7432" font-weight="600" text-anchor="middle">种子 1</text><path d="M770,350 L650,350" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><path d="M380,350 L300,350" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /></g></svg>

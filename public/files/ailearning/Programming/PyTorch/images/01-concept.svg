<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="970" viewBox="0 0 1700 970" role="img"><title>前向变量与反向局部导数在同一依赖图中对应</title><rect width="1700" height="970" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="55" y="255" width="230" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="170" y="313" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">w = 2</text><rect x="55" y="525" width="230" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="170" y="583" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">x = 3</text><rect x="745" y="255" width="230" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="860" y="313" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">z = 6</text><rect x="1375" y="255" width="230" height="90" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1490" y="313" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">L = 18</text><circle cx="520" cy="300" r="62" fill="white" stroke="#176b91" stroke-width="2"/><text x="520" y="312" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">×</text><circle cx="1170" cy="300" r="62" fill="white" stroke="#176b91" stroke-width="2"/><text x="1170" y="280" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">z²</text><line x1="1145" y1="295" x2="1195" y2="295" stroke="#176b91" stroke-width="2"/><text x="1170" y="332" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">2</text><line x1="295" y1="300" x2="450" y2="300" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><path d="M 295 570 L 520 570 L 520 370" fill="none" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><line x1="590" y1="300" x2="735" y2="300" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><line x1="985" y1="300" x2="1100" y2="300" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><line x1="1240" y1="300" x2="1365" y2="300" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="1250" y="100" font-size="34" fill="#176b91" text-anchor="middle" font-weight="700">前向数值</text><path d="M 1480 390 L 1480 725 L 880 725 L 880 395" fill="none" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><text x="1220" y="665" font-size="35" fill="#d87332" text-anchor="middle" font-weight="400">1 × z = 6</text><text x="1490" y="815" font-size="32" fill="#d87332" text-anchor="middle" font-weight="400">种子 1</text><path d="M 845 230 L 845 150 L 170 150 L 170 230" fill="none" stroke="#d87332" stroke-width="4" marker-end="url(#o)"/><text x="505" y="110" font-size="35" fill="#d87332" text-anchor="middle" font-weight="400">6 × x = 18 → w.grad</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">detach 切断梯度历史，不保证复制存储</title><desc id="desc">detach 得到的张量不再沿原来的历史参与梯度传播，但仍可能与原张量共享存储。图中两行逻辑对象都指回同一组数值，强调自动微分关系和内存别名是两种不同关系。 需要独立数据副本时应明确使用复制操作；需要断开历史并独立存储时则同时处理这两个要求。对共享值的原地修改还可能影响后续求导的版本检查。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">detach 切断梯度历史，不保证复制存储</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">detach 仍共享存储；需要独立副本时显式 clone。</text><rect x="285.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="298" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="785.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="798" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">2</text><text x="65" y="640" font-size="25" fill="#268d8c" text-anchor="start" font-weight="400">原张量 x</text><path d="M137.5,455 L350,291" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="65.0" y="465" width="138" height="90" fill="#e0f0eb" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="134.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">1</text><path d="M282.5,455 L850,291" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="210.0" y="465" width="138" height="90" fill="#e0f0eb" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="279.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">2</text><text x="600" y="640" font-size="25" fill="#507db3" text-anchor="start" font-weight="400">x.detach()</text><path d="M672.5,455 L350,291" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="600.0" y="465" width="138" height="90" fill="#e4ecf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="669.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">1</text><path d="M817.5,455 L850,291" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="745.0" y="465" width="138" height="90" fill="#e4ecf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="814.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">2</text><text x="65" y="165" font-size="22" fill="#5c7185" text-anchor="start" font-weight="400">底层项 / 原始记录</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title id="figure-title">detach 与 clone：分别检查存储和梯度</title><desc id="figure-desc">相同需梯度张量的 detach 共享存储并断开历史；clone 独立存储并保留历史；两者组合同时独立存储和断开历史。</desc><rect width="1200" height="640" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">detach 与 clone：分别检查存储和梯度</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">设 x=[1,2]，且 x 需要梯度</text><text x="40" y="175" font-size="28" fill="#213447" text-anchor="start" font-weight="600">对象</text><text x="570" y="175" font-size="28" fill="#213447" text-anchor="start" font-weight="600">存储关系</text><text x="940" y="175" font-size="28" fill="#213447" text-anchor="start" font-weight="600">梯度关系</text><rect x="40" y="205" width="450" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="265.0" y="249.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">x.detach()</text><text x="570" y="250" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">与 x 共享</text><text x="940" y="250" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">切断历史</text><rect x="40" y="305" width="450" height="70" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="265.0" y="349.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">x.clone()</text><text x="570" y="350" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">独立副本</text><text x="940" y="350" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">保留历史</text><rect x="40" y="405" width="450" height="70" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="265.0" y="449.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">x.detach().clone()</text><text x="570" y="450" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">独立副本</text><text x="940" y="450" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">切断历史</text><line x1="40" y1="535" x2="1160" y2="535" stroke="#cbd9e4" stroke-width="2" /><text x="40" y="590" font-size="28" fill="#213447" text-anchor="start" font-weight="400">修改共享数据会同时可见；复制存储与切断求导是两个选择。</text></g></svg>

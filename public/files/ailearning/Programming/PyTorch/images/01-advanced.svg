<svg xmlns="http://www.w3.org/2000/svg" width="1571.625" height="1135" viewBox="31.625 75.601 1571.625 1135"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1571.625" height="1135" fill="white" x="31.625" y="75.601" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="70" y="135" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">同一输入 x = [1, 2]，requires_grad=True；每行独立比较</text><text xml:space="preserve" x="70" y="220" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">r = x.detach()</text><circle cx="250" cy="280" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="250" y="291" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">x</text><circle cx="650" cy="375" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="650" y="386" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">r</text><rect x="1050" y="250" width="180" height="60" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3" /><line x1="1140" y1="250" x2="1140" y2="310" stroke="#2676ad" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="1095" y="290" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1185" y="290" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="300" y1="280" x2="1030" y2="280" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M690,375 C850,375 900,295 1030,285" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1300" y="290" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">同一缓冲</text><text xml:space="preserve" x="300" y="470" font-size="29" fill="#b26122" text-anchor="start" font-weight="400">没有从 r 返回 x 的求导路径</text><line x1="65" y1="500" x2="1570" y2="500" stroke="#d6e0e6" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="70" y="540" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">r = x.clone()</text><circle cx="250" cy="600" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="250" y="611" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">x</text><circle cx="650" cy="695" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="650" y="706" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">r</text><rect x="1050" y="570" width="180" height="60" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3" /><line x1="1140" y1="570" x2="1140" y2="630" stroke="#2676ad" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="1095" y="610" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1185" y="610" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="300" y1="600" x2="1030" y2="600" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><rect x="1050" y="665" width="180" height="60" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3" /><line x1="1140" y1="665" x2="1140" y2="725" stroke="#2676ad" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="1095" y="705" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1185" y="705" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="690" y1="695" x2="1030" y2="695" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1300" y="705" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">独立缓冲</text><path d="M615,725 C480,820 265,800 250,645" stroke="#d17a30" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="700" y="805" font-size="28" fill="#b26122" text-anchor="start" font-weight="400">梯度沿历史回到 x</text><line x1="65" y1="820" x2="1570" y2="820" stroke="#d6e0e6" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="70" y="860" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">r = x.detach().clone()</text><circle cx="250" cy="920" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="250" y="931" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">x</text><circle cx="650" cy="1015" r="35" fill="white" stroke="#193a4e" stroke-width="3" /><text xml:space="preserve" x="650" y="1026" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">r</text><rect x="1050" y="890" width="180" height="60" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3" /><line x1="1140" y1="890" x2="1140" y2="950" stroke="#2676ad" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="1095" y="930" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1185" y="930" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="300" y1="920" x2="1030" y2="920" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><rect x="1050" y="985" width="180" height="60" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3" /><line x1="1140" y1="985" x2="1140" y2="1045" stroke="#2676ad" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="1095" y="1025" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="1185" y="1025" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><line x1="690" y1="1015" x2="1030" y2="1015" stroke="#2676ad" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1300" y="1025" font-size="29" fill="#2676ad" text-anchor="start" font-weight="400">独立缓冲</text><text xml:space="preserve" x="300" y="1110" font-size="29" fill="#b26122" text-anchor="start" font-weight="400">没有从 r 返回 x 的求导路径</text><text x="55" y="1180" fill="#23384b" font-size="29">蓝箭头：存储引用       橙箭头：反向依赖</text></g><desc> 张量对象、数据缓冲、求导历史是三种关系 蓝箭头指向数值存储；橙箭头表示反向依赖。新对象不等于新缓冲，独立缓冲也不等于断图。</desc></svg>

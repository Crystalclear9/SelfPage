<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716.68" viewBox="17.64 14.06 1113.37 664.93" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">只恢复参数，随机轨迹仍可能改变</title><desc id="desc">即使恢复的参数相同，随机数据增强、打乱顺序或 Dropout 的随机状态不同，也可能让之后的更新轨迹分叉。图以随机增强顺序说明为什么随机源状态属于恢复协议的一部分。 随机序列只是示意，不代表某个随机数发生器的实际输出。恢复随机状态仍不足以保证跨设备、跨版本或非确定性算子逐位一致，需声明所追求的一致性层级。 随机状态仅是恢复条件之一；还需数据位置、优化器与确定性条件。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">只恢复参数，随机轨迹仍可能改变</text><text x="65" y="169" font-size="24" fill="#627689" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="1036.0" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">同一检查点参数</text><text x="65" y="340" font-size="24" fill="#213447" text-anchor="start" font-weight="400">连续运行</text><rect x="285" y="310" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 A</text><rect x="525" y="310" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 C</text><rect x="765" y="310" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 B</text><text x="65" y="465" font-size="24" fill="#213447" text-anchor="start" font-weight="400">未恢复随机状态</text><rect x="285" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 C</text><rect x="525" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 B</text><rect x="765" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 A</text><text x="65" y="590" font-size="24" fill="#213447" text-anchor="start" font-weight="400">恢复同一随机状态</text><rect x="285" y="560" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="594" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 A</text><rect x="525" y="560" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="594" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 C</text><rect x="765" y="560" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="594" font-size="24" fill="#213447" text-anchor="start" font-weight="400">随机增强 B</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：从同一权重 w=1 出发，比对恢复动量和清空动量的下一次更新</title><desc id="detail-desc">从同一权重 w=1 出发，比对恢复动量和清空动量的下一次更新。采用 v←0.9v+g、w←w−0.1v，且下一梯度同为 1，得到 0.855 和 0.9 两个不同结果。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="25" y="70" width="300" height="220" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="25" y="70" width="300" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="37" y="95" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">一致检查点</text><text x="39" y="137" font-size="22" fill="#213447" font-weight="400" text-anchor="start">w = 1</text><text x="39" y="168" font-size="22" fill="#213447" font-weight="400" text-anchor="start">动量 v = 0.5</text><text x="39" y="199" font-size="22" fill="#213447" font-weight="400" text-anchor="start">步数 / RNG / 数据位置</text><path d="M345,140 L500,105" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M345,230 L500,300" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="530" y="60" font-size="26" fill="#2865a0" font-weight="600" text-anchor="start">恢复动量：v ← 0.9v + g</text><text x="530" y="125" font-size="25" fill="#213447" font-weight="400" text-anchor="start">g=1 → v=1.45 → w=0.855</text><text x="530" y="255" font-size="26" fill="#cf7432" font-weight="600" text-anchor="start">只恢复权重：v 被重置为 0</text><text x="530" y="320" font-size="25" fill="#213447" font-weight="400" text-anchor="start">g=1 → v=1 → w=0.9</text></g></svg>

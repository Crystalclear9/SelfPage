<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1095.000" height="651.000" viewBox="31.000 95.000 1095.000 651.000" role="img"><title id="figure-title">交付顺序：性能开关也会改变训练前缀</title><desc id="figure-desc">两工作进程先后处理AC和BD。A用8单位，BCD各1单位。完成顺序BDAC，有序交付顺序ABCD。本图为构造时间表，不是硬件性能实测。 交付顺序：性能开关也会改变训练前缀 同样的样本集合，不保证逐批梯度更新的轨迹相同</desc><rect width="1095.0" height="651.0" fill="white" x="31.0" y="95.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="142" font-size="27" fill="#213447" text-anchor="start" font-weight="400">分配次序 A → B → C → D；A 耗时 8，其余各耗时 1</text><line x1="210" y1="182" x2="210" y2="392" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 7" /><text x="210" y="177" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="304" y1="182" x2="304" y2="392" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 7" /><text x="304" y="177" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><line x1="398" y1="182" x2="398" y2="392" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 7" /><text x="398" y="177" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="586" y1="182" x2="586" y2="392" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 7" /><text x="586" y="177" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="774" y1="182" x2="774" y2="392" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 7" /><text x="774" y="177" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">6</text><line x1="962" y1="182" x2="962" y2="392" stroke="#cbd9e4" stroke-width="
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1138.000" height="674.000" viewBox="31.000 96.000 1138.000 674.000" role="img"><title id="figure-title">解除缩放与裁剪：两个操作不能交换</title><desc id="figure-desc">缩放梯度24,32范数40。先除8再裁剪得到0.6,0.8；先裁剪再除8得到0.075,0.1。二维圆显示两种最终梯度长度之差。 解除缩放与裁剪：两个操作不能交换 错误次序把有效裁剪半径从 1 缩成了八分之一</desc><rect width="1138.0" height="674.0" fill="white" x="31.0" y="96.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="145" font-size="29" fill="#213447" text-anchor="start" font-weight="400">g = (3,4)，缩放 8，裁剪阈值 1</text><circle cx="285" cy="430" r="155" fill="none" stroke="#cbd9e4" stroke-width="2" /><path d="M95 430 L490 430" fill="none" stroke="#627689" stroke-width="2.8" /><path d="M285 620 L285 225" fill="none" stroke="#627689" stroke-width="2.8" /><text x="495" y="463" font-size="28" fill="#213447" text-anchor="start" font-weight="400">g1</text><text x="305" y="225" font-size="28" fill="#213447" text-anchor="start" font-weight="400">g2</text><path d="M285 430 L378.0 306.0" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><circle cx="378.0" cy="306.0" r="7" fill="#2865a0" /><path d="M285 430 L296.625 414.5" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><circle cx="296.625" cy="414.5" r="7" fill="#c87536" /><text x="380" y="280" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">(0.6, 0.8)</text><line x1="303" y1="412" x2="460" y2="535" stroke="#c87536" stroke-width="2" /><text x="410" y="570" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">(0.075, 0.1)</text><text x="70" y="680" font-size="27" fill="#213447" text-anchor="start" font-weight="400">圆：最终梯度范数 1</text><text x="650" y="235" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">先解除缩放</text><text x="650" y="297" font-size="28" fill="#213447" text-anchor="start" font-weight="400">(24,32) → (3,4)</text><text x="650" y="345" font-size="27" fill="#213447" text-anchor="start" font-weight="400">再裁剪到范数 1</text><text x="650" y="398" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">最终 (0.6, 0.8)</text><text x="650" y="480" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">先裁剪缩放梯度</text><text x="650" y="542" font-size="28" fill="#213447" text-anchor="start" font-weight="400">(24,32) → (0.6,0.8)</text><text x="650" y="590" font-size="27" fill="#213447" text-anchor="start" font-weight="400">再除以缩放值 8</text><text x="650" y="643" font-size="29" fill="#c87536" text-anchor="start" font-weight="400">最终 (0.075, 0.1)</text><line x1="55" y1="745" x2="1145" y2="745" stroke="#cbd9e4" stroke-width="2" /></g></svg>

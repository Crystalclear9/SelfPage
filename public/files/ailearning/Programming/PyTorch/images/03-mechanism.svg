<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">不等分片的全局目标需要按样本数加权</title><desc id="desc">进程 A 只有一个有效样本，进程 B 有三个。全局目标的分母是 4，损失和为 14；平均两个本地均值却给两个进程相同权重，得到 3，改变了目标。 图是目标算术，不直接规定某个通信库的缩放实现。若通信操作平均梯度，还需按进程数及全局有效分母推导本地损失缩放，不能只复制单机 mean。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="595" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="420.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">不等分片的全局目标需要按样本数加权</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">每样本同权时按总有效样本数归一；还须匹配通信归约规则。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">进程</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">有效样本数</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">本地损失和</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">本地均值</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">A</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">B</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">12</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">4</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">全局</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">4</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">14</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3.5</text><rect x="60.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">直接均值平均</text><rect x="330.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">—</text><rect x="600.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">—</text><rect x="870.0" y="425" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="455" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3：权重错误</text></g></svg>

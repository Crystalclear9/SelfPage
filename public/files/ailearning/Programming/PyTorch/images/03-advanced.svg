<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716.68" viewBox="17.64 14.06 1113.37 664.93" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">有放回采样会出现重复与未覆盖样本</title><desc id="desc">从四个样本有放回地抽取四次，可能出现图中的 0、0、2、3。批次长度为四不等于看过四个不同样本，样本 1 本次没有出现；采样方案改变的是训练实际见到的数据分布。 这只是一个可能结果，不是所有抽样结果的频率保证。若希望每轮恰好遍历一次全部样本，应使用相应的无放回排列与覆盖规则；分布式填充还可能引入额外重复。 独立采样次数不等于不同样本身份数；图中身份 0 被抽中两次。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">有放回采样会出现重复与未覆盖样本</text><text x="65" y="169" font-size="24" fill="#627689" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="248.5" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">样本 0</text><rect x="327.5" y="190" width="248.5" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="340.5" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">样本 1</text><rect x="590.0" y="190" width="248.5" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="603" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">样本 2</text><rect x="852.5" y="190" width="248.5" height="74" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="865.5" y="221" font-size="24" fill="#213447" text-anchor="start" font-weight="400">样本 3</text><text x="65" y="340" font-size="24" fill="#213447" text-anchor="start" font-weight="400">一次抽样</text><rect x="285.0" y="310" width="193.5" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="492.5" y="310" width="193.5" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="507.5" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="700.0" y="310" width="193.5" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="715" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">2</text><rect x="907.5" y="310" width="193.5" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="922.5" y="344" font-size="24" fill="#213447" text-anchor="start" font-weight="400">3</text><text x="65" y="465" font-size="24" fill="#213447" text-anchor="start" font-weight="400">独立样本身份</text><rect x="285" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="525" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">2</text><rect x="765" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="469" font-size="24" fill="#213447" text-anchor="start" font-weight="400">3</text><text x="65" y="590" font-size="24" fill="#213447" text-anchor="start" font-weight="400">未出现</text><rect x="285" y="560" width="226" height="84" fill="#eaf2fa" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="594" font-size="24" fill="#213447" text-anchor="start" font-weight="400">1</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1233.067" height="690.014" viewBox="23.467 55.457 1233.067 690.014"><rect width="1233.067" height="690.014" fill="white" x="23.467" y="55.457" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203449"><text x="50" y="104" font-size="27" fill="#203449" text-anchor="start">4 个等概率样本，独立有放回抽样；K 表示不同身份数</text><text x="50" y="175" font-size="29" fill="#203449" text-anchor="start">一次可能的结果</text><circle cx="90" cy="245" r="34" fill="#247bb5" /><text x="90" y="256" font-size="32" fill="white" text-anchor="middle">0</text><circle cx="195" cy="245" r="34" fill="#247bb5" /><text x="195" y="256" font-size="32" fill="white" text-anchor="middle">0</text><circle cx="300" cy="245" r="34" fill="#087e7c" /><text x="300" y="256" font-size="32" fill="white" text-anchor="middle">2</text><circle cx="405" cy="245" r="34" fill="#8062a3" /><text x="405" y="256" font-size="32" fill="white" text-anchor="middle">3</text><text x="50" y="335" font-size="27" fill="#203449" text-anchor="start">样本 0 重复；样本 1 未出现</text><text x="50" y="400" font-size="27" fill="#203449" text-anchor="start">本次 K = 3，但并非总为 3</text><text x="50" y="475" font-size="26" fill="#203449" text-anchor="start">指定样本未出现的概率：</text><text x="100" y="532" font-size="30" fill="#1d6393" text-anchor="start">0.31640625</text><text x="50" y="615" font-size="27" fill="#203449" text-anchor="start">期望覆盖数：4 × (1 − 0.31640625)</text><text x="50" y="666" font-size="33" fill="#087e7c" text-anchor="start">= 2.734375</text><path d="M605 150L605 690" stroke="#c8d6e0" stroke-width="2" /><text x="675" y="175" font-size="28" fill="#203449" text-anchor="start">所有 256 种等概率序列的分布</text><path d="M680 610L1225 610" stroke="#e2e9ee" stroke-width="2" /><text x="665" y="619" font-size="25" fill="#203449" text-anchor="end">0%</text><path d="M680 490.0L1225 490.0" stroke="#e2e9ee" stroke-width="2" /><text x="665" y="499.0" font-size="25" fill="#203449" text-anchor="end">20%</text><path d="M680 370.0L1225 370.0" stroke="#e2e9ee" stroke-width="2" /><text x="665" y="379.0" font-size="25" fill="#203449" text-anchor="end">40%</text><path d="M680 250.0L1225 250.0" stroke="#e2e9ee" stroke-width="2" /><text x="665" y="259.0" font-size="25" fill="#203449" text-anchor="end">60%</text><rect x="705" y="600.625" width="85" height="9.375" fill="#247bb5" /><text x="747.5" y="582.625" font-size="26" fill="#1d6393" text-anchor="middle">1.56%</text><text x="747.5" y="652" font-size="28" fill="#203449" text-anchor="middle">1</text><rect x="835" y="413.125" width="85" height="196.875" fill="#247bb5" /><text x="877.5" y="395.125" font-size="26" fill="#1d6393" text-anchor="middle">32.81%</text><text x="877.5" y="652" font-size="28" fill="#203449" text-anchor="middle">2</text><rect x="965" y="272.5" width="85" height="337.5" fill="#247bb5" /><text x="1007.5" y="254.5" font-size="26" fill="#1d6393" text-anchor="middle">56.25%</text><text x="1007.5" y="652" font-size="28" fill="#203449" text-anchor="middle">3</text><rect x="1095" y="553.75" width="85" height="56.25" fill="#247bb5" /><text x="1137.5" y="535.75" font-size="26" fill="#1d6393" text-anchor="middle">9.38%</text><text x="1137.5" y="652" font-size="28" fill="#203449" text-anchor="middle">4</text><text x="845" y="697" font-size="27" fill="#203449" text-anchor="start">不同样本数 K</text><path d="M50 718L1230 718" stroke="#c8d6e0" stroke-width="2" /></g><desc> 抽取 4 次，平均只覆盖约 2.73 个不同样本 一轮长度等于数据集大小，只规定抽样次数；恰好全覆盖的概率仅为 9.375%。</desc></svg>

<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1314.0893" viewBox="0 0 1440 1314.0893" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">有放回采样会出现重复与未覆盖样本</title><rect width="1440" height="1314.0893" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">有放回采样会出现重复与未覆盖样本</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1172.0893" viewBox="0 0 1440 1255.81" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>03-数据集设备与高效训练</title><svg width="1440" height="805.812" viewBox="23.467 55.457 1233.067 690.014"><rect width="1233.067" height="690.014" fill="white" x="23.467" y="55.457"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#20344a"><text x="50" y="104" font-size="27" fill="#20344a" text-anchor="start">4 个等概率样本，独立有放回抽样；K 表示不同身份数</text><text x="50" y="175" font-size="29" fill="#20344a" text-anchor="start">一次可能的结果</text><circle cx="90" cy="245" r="34" fill="#1f86c7"/><text x="90" y="256" font-size="32" fill="white" text-anchor="middle">0</text><circle cx="195" cy="245" r="34" fill="#1f86c7"/><text x="195" y="256" font-size="32" fill="white" text-anchor="middle">0</text><circle cx="300" cy="245" r="34" fill="#127682"/><text x="300" y="256" font-size="32" fill="white" text-anchor="middle">2</text><circle cx="405" cy="245" r="34" fill="#7f61a4"/><text x="405" y="256" font-size="32" fill="white" text-anchor="middle">3</text><text x="50" y="335" font-size="27" fill="#20344a" text-anchor="start">样本 0 重复；样本 1 未出现</text><text x="50" y="400" font-size="27" fill="#20344a" text-anchor="start">本次 K = 3，但并非总为 3</text><text x="50" y="475" font-size="26" fill="#20344a" text-anchor="start">指定样本未出现的概率：</text><text x="100" y="532" font-size="30" fill="#196ea4" text-anchor="start">0.31640625</text><text x="50" y="615" font-size="27" fill="#20344a" text-anchor="start">期望覆盖数：4 × (1 − 0.31640625)</text><text x="50" y="666" font-size="33" fill="#127682" text-anchor="start">= 2.734375</text><path d="M605 150L605 690" stroke="#c6d7e2" stroke-width="2"/><text x="675" y="175" font-size="28" fill="#20344a" text-anchor="start">所有 256 种等概率序列的分布</text><path d="M680 610L1225 610" stroke="#e2e9ee" stroke-width="2"/><text x="665" y="619" font-size="25" fill="#20344a" text-anchor="end">0%</text><path d="M680 490.0L1225 490.0" stroke="#e2e9ee" stroke-width="2"/><text x="665" y="499.0" font-size="25" fill="#20344a" text-anchor="end">20%</text><path d="M680 370.0L1225 370.0" stroke="#e2e9ee" stroke-width="2"/><text x="665" y="379.0" font-size="25" fill="#20344a" text-anchor="end">40%</text><path d="M680 250.0L1225 250.0" stroke="#e2e9ee" stroke-width="2"/><text x="665" y="259.0" font-size="25" fill="#20344a" text-anchor="end">60%</text><rect x="705" y="600.625" width="85" height="9.375" fill="#1f86c7"/><text x="747.5" y="582.625" font-size="26" fill="#196ea4" text-anchor="middle">1.56%</text><text x="747.5" y="652" font-size="28" fill="#20344a" text-anchor="middle">1</text><rect x="835" y="413.125" width="85" height="196.875" fill="#1f86c7"/><text x="877.5" y="395.125" font-size="26" fill="#196ea4" text-anchor="middle">32.81%</text><text x="877.5" y="652" font-size="28" fill="#20344a" text-anchor="middle">2</text><rect x="965" y="272.5" width="85" height="337.5" fill="#1f86c7"/><text x="1007.5" y="254.5" font-size="26" fill="#196ea4" text-anchor="middle">56.25%</text><text x="1007.5" y="652" font-size="28" fill="#20344a" text-anchor="middle">3</text><rect x="1095" y="553.75" width="85" height="56.25" fill="#1f86c7"/><text x="1137.5" y="535.75" font-size="26" fill="#196ea4" text-anchor="middle">9.38%</text><text x="1137.5" y="652" font-size="28" fill="#20344a" text-anchor="middle">4</text><text x="845" y="697" font-size="27" fill="#20344a" text-anchor="start">不同样本数 K</text><path d="M50 718L1230 718" stroke="#c6d7e2" stroke-width="2"/></g><desc> 抽取 4 次，平均只覆盖约 2.73 个不同样本 一轮长度等于数据集大小，只规定抽样次数；恰好全覆盖的概率仅为 9.375%。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 805.812) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">有放回的四次读取：没有出现的身份数也能直接核算</text><g><text x="65.000" y="125" font-size="31" fill="#1d3145">每个身份未出现的概率 = (</text><text x="443.203" y="108" font-size="29" fill="#1d3145" text-anchor="middle">3</text><line x1="430.703" x2="455.703" y1="116" y2="116" stroke="#1d3145" stroke-width="1.5"/><text x="443.203" y="144" font-size="29" fill="#1d3145" text-anchor="middle">4</text><text x="459.703" y="125" font-size="31" fill="#1d3145">)⁴ = </text><text x="556.922" y="108" font-size="29" fill="#1d3145" text-anchor="middle">81</text><line x1="527.422" x2="586.422" y1="116" y2="116" stroke="#1d3145" stroke-width="1.5"/><text x="556.922" y="144" font-size="29" fill="#1d3145" text-anchor="middle">256</text></g><rect x="65" y="195" width="317" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="223.5" y="234" font-size="28" fill="#1e7499" text-anchor="middle">身份0缺席</text><rect x="390" y="195" width="317" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="548.5" y="234" font-size="28" fill="#1e7499" text-anchor="middle">身份1缺席</text><rect x="715" y="195" width="317" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="873.5" y="234" font-size="28" fill="#1e7499" text-anchor="middle">身份2缺席</text><rect x="1040" y="195" width="317" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1198.5" y="234" font-size="28" fill="#1e7499" text-anchor="middle">身份3缺席</text><g><text x="65.000" y="320" font-size="32" fill="#c66d3a">E[缺席数] = 4×</text><text x="319.531" y="303" font-size="30" fill="#c66d3a" text-anchor="middle">81</text><line x1="289.141" x2="349.922" y1="311" y2="311" stroke="#c66d3a" stroke-width="1.5"/><text x="319.531" y="339" font-size="30" fill="#c66d3a" text-anchor="middle">256</text><text x="353.922" y="320" font-size="32" fill="#c66d3a"> = 1.265625</text></g><text x="65" y="408" font-size="28" fill="#1d3145" text-anchor="start">E[不同身份数] = 4−1.265625 = 2.734375；线性期望不要求缺席事件独立。</text></g></g></svg></svg>

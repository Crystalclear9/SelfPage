<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="plate-caption" viewBox="0 0 1360 1163" width="1360" height="1163"><title id="plate-caption">有放回采样会出现重复与未覆盖样本</title><defs><linearGradient id="scientific-plane-1c6583" x1="7%" y1="0%" x2="87%" y2="100%"><stop offset="0%" stop-color="#1c6583" stop-opacity=".08"/><stop offset="100%" stop-color="#1c6583" stop-opacity=".24"/></linearGradient><clipPath id="plate-view-0"><rect x="-18.24" y="90.211611" width="996.48" height="39.063363"/></clipPath><clipPath id="plate-view-1"><rect x="-18.24" y="129.27497" width="996.48" height="723.18853"/></clipPath><g id="plate-scene"><defs><clipPath id="artwork-view"><rect x="25" y="76" width="910" height="793.602153"/></clipPath></defs><rect id="edition-paper" x="-18.24" y="28.76" width="996.48" height="880.48" fill="#ffffff"/><svg id="scientific-layout" x="0" y="47" width="960" height="844" viewBox="0 47 960 844" overflow="hidden"><rect width="960" height="891" fill="#ffffff"/><g clip-path="url(#artwork-view)"><g transform="translate(25 76) scale(0.631944)"><g><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f6f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>03-数据集设备与高效训练</title><svg width="1440" height="805.812" viewBox="23.467 55.457 1233.067 690.014"><rect width="1233.067" height="690.014" fill="#ffffff" x="23.467" y="55.457"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#233b4a"><text x="50" y="104" font-size="27" fill="#233b4a" text-anchor="start">4 个等概率样本，独立有放回抽样；K 表示不同身份数</text><text x="50" y="175" font-size="29" fill="#233b4a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">一次可能的结果</text><circle cx="90" cy="245" r="34" fill="#1f7fac"/><text x="90" y="256" font-size="32" fill="#ffffff" text-anchor="middle">0</text><circle cx="195" cy="245" r="34" fill="#1f7fac"/><text x="195" y="256" font-size="32" fill="#ffffff" text-anchor="middle">0</text><circle cx="300" cy="245" r="34" fill="#14586c"/><text x="300" y="256" font-size="32" fill="#ffffff" text-anchor="middle">2</text><circle cx="405" cy="245" r="34" fill="#715395"/><text x="405" y="256" font-size="32" fill="#ffffff" text-anchor="middle">3</text><text x="50" y="335" font-size="27" fill="#233b4a" text-anchor="start">样本 0 重复；样本 1 未出现</text><text x="50" y="400" font-size="27" fill="#233b4a" text-anchor="start">本次 K = 3，但并非总为 3</text><text x="50" y="475" font-size="26" fill="#233b4a" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">指定样本未出现的概率：</text><text x="100" y="532" font-size="30" fill="#23709a" text-anchor="start">0.31640625</text><text x="50" y="615" font-size="27" fill="#233b4a" text-anchor="start">期望覆盖数：4 × (1 − 0.31640625)</text><text x="50" y="666" font-size="33" fill="#1b6d7c" text-anchor="start">= 2.734375</text><line stroke="#dbe8eb" stroke-width="2" x1="605" y1="150" x2="605" y2="690"/><text x="675" y="175" font-size="28" fill="#233b4a" text-anchor="start">所有 256 种等概率序列的分布</text><line x1="680" y1="610" x2="1225" y2="610" stroke="#657682" stroke-width="1.55" stroke-linecap="round"/><text x="665" y="619" font-size="25" fill="#233b4a" text-anchor="end">0%</text><line x1="747.5" y1="610" x2="747.5" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="877.5" y1="610" x2="877.5" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="1007.5" y1="610" x2="1007.5" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="1137.5" y1="610" x2="1137.5" y2="615" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="675" y1="610" x2="680" y2="610" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="675" y1="490" x2="680" y2="490" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="675" y1="370" x2="680" y2="370" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line x1="675" y1="250" x2="680" y2="250" stroke="#657682" stroke-width="1.15" stroke-linecap="round"/><line stroke="#d6e2e6" stroke-width="1.3" x1="680" y1="490" x2="1225" y2="490"/><text x="665" y="499.0" font-size="25" fill="#233b4a" text-anchor="end">20%</text><line stroke="#d6e2e6" stroke-width="1.3" x1="680" y1="370" x2="1225" y2="370"/><text x="665" y="379.0" font-size="25" fill="#233b4a" text-anchor="end">40%</text><line stroke="#d6e2e6" stroke-width="1.3" x1="680" y1="250" x2="1225" y2="250"/><text x="665" y="259.0" font-size="25" fill="#233b4a" text-anchor="end">60%</text><rect x="705" y="600.625" width="85" height="9.375" fill="#2b87b8"/><text x="747.5" y="582.625" font-size="26" fill="#23709a" text-anchor="middle">1.56%</text><text x="747.5" y="652" font-size="28" fill="#233b4a" text-anchor="middle">1</text><rect x="835" y="413.125" width="85" height="196.875" fill="#2b87b8"/><text x="877.5" y="395.125" font-size="26" fill="#23709a" text-anchor="middle">32.81%</text><text x="877.5" y="652" font-size="28" fill="#233b4a" text-anchor="middle">2</text><rect x="965" y="272.5" width="85" height="337.5" fill="#2b87b8"/><text x="1007.5" y="254.5" font-size="26" fill="#23709a" text-anchor="middle">56.25%</text><text x="1007.5" y="652" font-size="28" fill="#233b4a" text-anchor="middle">3</text><rect x="1095" y="553.75" width="85" height="56.25" fill="#2b87b8"/><text x="1137.5" y="535.75" font-size="26" fill="#23709a" text-anchor="middle">9.38%</text><text x="1137.5" y="652" font-size="28" fill="#233b4a" text-anchor="middle">4</text><text x="845" y="697" font-size="27" fill="#233b4a" text-anchor="start">不同样本数 K</text><line stroke="#dbe8eb" stroke-width="2" x1="50" y1="718" x2="1230" y2="718"/></g><desc> 抽取 4 次，平均只覆盖约 2.73 个不同样本 一轮长度等于数据集大小，只规定抽样次数；恰好全覆盖的概率仅为 9.375%。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 805.812) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="#ffffff"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dbe8eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="41.28px" fill="#213747" text-anchor="start" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif">有放回的四次读取：没有出现的身份数也能直接核算</text><g><text x="65.000" y="125" font-size="31" fill="#213747">每个身份未出现的概率 = (</text><text x="443.203" y="108" font-size="34.51px" fill="#213747" text-anchor="middle">3</text><line x1="430.703" x2="455.703" y1="116" y2="116" stroke="#213747" stroke-width="1.845"/><text x="443.203" y="144" font-size="34.51px" fill="#213747" text-anchor="middle">4</text><text x="459.703" y="125" font-size="39.99px" fill="#213747">)⁴ = </text><text x="556.922" y="108" font-size="34.51px" fill="#213747" text-anchor="middle">81</text><line x1="527.422" x2="586.422" y1="116" y2="116" stroke="#213747" stroke-width="1.845"/><text x="556.922" y="144" font-size="29" fill="#213747" text-anchor="middle">256</text></g><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="81.82,195 382,195 382,225.16 365.18,253 65,253 65,222.84" stroke-linejoin="round"/><text x="223.5" y="234" font-size="36.12px" fill="#277290" text-anchor="middle">身份0缺席</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="406.82,195 707,195 707,225.16 690.18,253 390,253 390,222.84" stroke-linejoin="round"/><text x="548.5" y="234" font-size="36.12px" fill="#277290" text-anchor="middle">身份1缺席</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="731.82,195 1032,195 1032,225.16 1015.18,253 715,253 715,222.84" stroke-linejoin="round"/><text x="873.5" y="234" font-size="36.12px" fill="#277290" text-anchor="middle">身份2缺席</text><polygon fill="url(#scientific-plane-1c6583)" stroke="#1c6583" points="1056.82,195 1357,195 1357,225.16 1340.18,253 1040,253 1040,222.84" stroke-linejoin="round"/><text x="1198.5" y="234" font-size="36.12px" fill="#277290" text-anchor="middle">身份3缺席</text><g><text x="65.000" y="320" font-size="32" fill="#a55f3a">E[缺席数] = 4×</text><text x="319.531" y="303" font-size="35.7px" fill="#a55f3a" text-anchor="middle">81</text><line x1="289.141" x2="349.922" y1="311" y2="311" stroke="#a74d3a" stroke-width="1.845"/><text x="319.531" y="339" font-size="35.7px" fill="#a55f3a" text-anchor="middle">256</text><text x="353.922" y="320" font-size="41.28px" fill="#a55f3a"> = 1.265625</text></g><text x="65" y="408" font-size="36.12px" fill="#213747" text-anchor="start">E[不同身份数] = 4−1.265625 = 2.734375；线性期望不要求缺席事件独立。</text></g></g></g></g></g></svg></g></defs><g id="paper-and-content"><rect x="0" y="0" width="1360" height="1163" fill="white"/><g transform="translate(6.1767135 -76.254119) scale(1.4037985)"><use href="#plate-scene" clip-path="url(#plate-view-0)" xlink:href="#plate-scene"/></g><g transform="translate(6.1767135 -84.523398) scale(1.4037985)"><use href="#plate-scene" clip-path="url(#plate-view-1)" xlink:href="#plate-scene"/></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="441.67" viewBox="5.12 -12.55 1086.19 399.78" role="img"><title id="detail-title">机制展开：A 高亮同一特征列，把 X[1,2]=6 与 b[0,2]=30 对应到 Y[1,2]=36</title><desc id="detail-desc">A 高亮同一特征列，把 X[1,2]=6 与 b[0,2]=30 对应到 Y[1,2]=36。向下箭头表示偏置沿样本轴逻辑复用，不表示实际建立一份完整的重复数组。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="32" font-size="24" fill="#213447" font-weight="700" text-anchor="start">X：样本 × 特征 = 2 × 3</text><rect x="35" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="78.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">1</text><rect x="125" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="168.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">2</text><rect x="215" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="258.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">3</text><rect x="35" y="146" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="78.0" y="175" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">4</text><rect x="125" y="146" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="168.0" y="175" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">5</text><rect x="215" y="146" width="86" height="60" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="258.0" y="175" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">6</text><text x="400" y="32" font-size="24" fill="#213447" font-weight="700" text-anchor="start">b：1 × 3</text><rect x="400" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="443.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">10</text><rect x="490" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="533.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">20</text><rect x="580" y="82" width="86" height="60" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="623.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">30</text><text x="795" y="32" font-size="24" fill="#213447" font-weight="700" text-anchor="start">Y：2 × 3</text><rect x="795" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="838.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">11</text><rect x="885" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="928.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">22</text><rect x="975" y="82" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="1018.0" y="111" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">33</text><rect x="795" y="146" width="86" height="60" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="838.0" y="175" font-size="24" fill="#213447" font-weight="400" text-anchor="middle">14</text><rect x="885" y="146" width="86" height="60" rx="4" fill="
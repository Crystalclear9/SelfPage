<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="819.4194" viewBox="0 0 1440 819.4194" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">数学等价的距离公式，浮点结果可能不同</title><rect width="1440" height="819.4194" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">数学等价的距离公式，浮点结果可能不同</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg aria-labelledby="figure-title figure-desc" width="1344" height="677.4194" viewBox="15 64 992 500" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">数学等价的距离公式，浮点结果可能不同</title><desc id="figure-desc">图中坐标均能在 float64 中精确表示，先求差得到 (−1,1)，平方距离是 2。改用范数展开时，真实的第二个平方范数为 20000000000000002，在本例浮点计算中舍入为 2e16；于是三个大项按图示顺序运算得到 0。e16 表示乘以十的十六次方。这个例子展示的是大数相减丢掉小差异，既不是输出只需裁成非负数就能修好的问题，也不说明直接差法在所有极端尺度下都不会失效。 数学等价的距离公式，浮点结果可能不同 2</desc><rect width="992.0" height="500.0" fill="white" x="15.0" y="64.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="110" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">x=(100000000,100000000)</text><text x="40" y="155" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">y=(100000001, 99999999)</text><text x="40" y="235" font-size="29" fill="#2472b1" text-anchor="start" font-weight="600">先求差，再平方求和</text><rect x="55" y="285" width="130" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="120.0" y="332.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">−1</text><rect x="193" y="285" width="130" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="258.0" y="332.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><path d="M345 325 L430 325" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><text x="70" y="430" font-size="32" fill="#2472b1" text-anchor="start" font-weight="600">(−1)² + 1² = 2</text><text x="650" y="235" font-size="28" fill="#c57439" text-anchor="start" font-weight="600">float64 展开式的三个大项</text><text x="680" y="315" font-size="31" fill="#c57439" text-anchor="start" font-weight="400">2e16 + 2e16 − 4e16</text><text x="680" y="405" font-size="32" fill="#c57439" text-anchor="start" font-weight="600">本例计算结果：0</text><text x="40" y="535" font-size="29" fill="#1f3449" text-anchor="start" font-weight="400">把 0 裁为非负数，无法恢复丢失的距离 2。</text><rect x="455" y="285" width="100" height="75" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="505.0" y="332.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">2</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="982.0366" viewBox="0 0 1440 982.0366" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">带缺失掩码的按列中心化</title><rect width="1440" height="982.0366" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">带缺失掩码的按列中心化</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="840.0366" viewBox="13.867 63.981 1252.267 782.701" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect width="1252.267" height="782.701" fill="white" x="13.867" y="63.981"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="112" font-size="27" fill="#527087">与本节完整代码使用同一个 3×3 输入；缺失先填训练均值，再中心化</text><text x="65" y="192" font-size="31" fill="#173c58">训练输入</text><rect x="65" y="222" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="85" y="271" font-size="30" fill="#1f81c7">1</text><rect x="175" y="222" width="110" height="78" fill="url(#book-wash-fff1e5)" stroke="#d0d8e4" stroke-width="2"/><text x="195" y="271" font-size="30" fill="#d07533">NaN</text><rect x="285" y="222" width="110" height="78" fill="url(#book-wash-fff1e5)" stroke="#d0d8e4" stroke-width="2"/><text x="305" y="271" font-size="30" fill="#d07533">NaN</text><rect x="65" y="300" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="85" y="349" font-size="30" fill="#1f81c7">3</text><rect x="175" y="300" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="195" y="349" font-size="30" fill="#1f81c7">10</text><rect x="285" y="300" width="110" height="78" fill="url(#book-wash-fff1e5)" stroke="#d0d8e4" stroke-width="2"/><text x="305" y="349" font-size="30" fill="#d07533">NaN</text><rect x="65" y="378" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="85" y="427" font-size="30" fill="#1f81c7">5</text><rect x="175" y="378" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="195" y="427" font-size="30" fill="#1f81c7">20</text><rect x="285" y="378" width="110" height="78" fill="url(#book-wash-fff1e5)" stroke="#d0d8e4" stroke-width="2"/><text x="305" y="427" font-size="30" fill="#d07533">NaN</text><text x="475" y="192" font-size="31" fill="#173c58">每列只统计观测值</text><text x="475" y="263" font-size="29" fill="#173c58">计数   3       2       0</text><text x="475" y="330" font-size="29" fill="#173c58">均值   3      15       0</text><text x="475" y="399" font-size="27" fill="#d07533">空列按约定回退 0</text><text x="890" y="192" font-size="31" fill="#173c58">中心化结果</text><rect x="890" y="222" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="910" y="271" font-size="30" fill="#1f81c7">-2</text><rect x="990" y="222" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1010" y="271" font-size="30" fill="#1f81c7">0</text><rect x="1090" y="222" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1110" y="271" font-size="30" fill="#1f81c7">0</text><rect x="890" y="300" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="910" y="349" font-size="30" fill="#1f81c7">0</text><rect x="990" y="300" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1010" y="349" font-size="30" fill="#1f81c7">-5</text><rect x="1090" y="300" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1110" y="349" font-size="30" fill="#1f81c7">0</text><rect x="890" y="378" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="910" y="427" font-size="30" fill="#1f81c7">2</text><rect x="990" y="378" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1010" y="427" font-size="30" fill="#1f81c7">5</text><rect x="1090" y="378" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1110" y="427" font-size="30" fill="#1f81c7">0</text><path d="M40 495 H1240" stroke="#dce2eb" stroke-width="2"/><text x="65" y="553" font-size="31" fill="#173c58">验证输入</text><rect x="65" y="585" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="85" y="634" font-size="30" fill="#1f81c7">7</text><rect x="175" y="585" width="110" height="78" fill="url(#book-wash-fff1e5)" stroke="#d0d8e4" stroke-width="2"/><text x="195" y="634" font-size="30" fill="#d07533">NaN</text><rect x="285" y="585" width="110" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="305" y="634" font-size="30" fill="#1f81c7">2</text><text x="475" y="616" font-size="29" fill="#173c58">沿用均值 [3, 15, 0]</text><path d="M510 660 H805 M790 648 L805 660 L790 672" stroke="#527087" stroke-width="3" fill="none"/><text x="890" y="553" font-size="31" fill="#173c58">验证输出</text><rect x="890" y="585" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="910" y="634" font-size="30" fill="#1f81c7">4</text><rect x="990" y="585" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1010" y="634" font-size="30" fill="#1f81c7">0</text><rect x="1090" y="585" width="100" height="78" fill="#f1f7fb" stroke="#d0d8e4" stroke-width="2"/><text x="1110" y="634" font-size="30" fill="#1f81c7">2</text><text x="65" y="752" font-size="29" fill="#148f94">第二特征：NaN → 填 15 → 减 15 → 0</text><text x="65" y="817" font-size="29" fill="#173c58">第三特征：训练计数为 0；验证出现 2，输出仍为 2。</text></g><desc> 缺失中心化：计数决定均值，训练统计决定变换 输出为 0 不能区分“原本等于均值”与“缺失后填充”；需要另存掩码。</desc></svg></svg>

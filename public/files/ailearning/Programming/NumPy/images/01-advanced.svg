<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="60" font-size="36" fill="#17334b">缺失中心化：计数决定均值，训练统计决定变换</text><text x="40" y="112" font-size="27" fill="#52677a">与本节完整代码使用同一个 3×3 输入；缺失先填训练均值，再中心化</text><text x="65" y="192" font-size="31" fill="#17334b">训练输入</text><rect x="65" y="222" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="85" y="271" font-size="30" fill="#2474b5">1</text><rect x="175" y="222" width="110" height="78" fill="#fff1e5" stroke="#ccd8e1" stroke-width="2"/><text x="195" y="271" font-size="30" fill="#d5752e">NaN</text><rect x="285" y="222" width="110" height="78" fill="#fff1e5" stroke="#ccd8e1" stroke-width="2"/><text x="305" y="271" font-size="30" fill="#d5752e">NaN</text><rect x="65" y="300" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="85" y="349" font-size="30" fill="#2474b5">3</text><rect x="175" y="300" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="195" y="349" font-size="30" fill="#2474b5">10</text><rect x="285" y="300" width="110" height="78" fill="#fff1e5" stroke="#ccd8e1" stroke-width="2"/><text x="305" y="349" font-size="30" fill="#d5752e">NaN</text><rect x="65" y="378" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="85" y="427" font-size="30" fill="#2474b5">5</text><rect x="175" y="378" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="195" y="427" font-size="30" fill="#2474b5">20</text><rect x="285" y="378" width="110" height="78" fill="#fff1e5" stroke="#ccd8e1" stroke-width="2"/><text x="305" y="427" font-size="30" fill="#d5752e">NaN</text><text x="475" y="192" font-size="31" fill="#17334b">每列只统计观测值</text><text x="475" y="263" font-size="29" fill="#17334b">计数   3       2       0</text><text x="475" y="330" font-size="29" fill="#17334b">均值   3      15       0</text><text x="475" y="399" font-size="27" fill="#d5752e">空列按约定回退 0</text><text x="890" y="192" font-size="31" fill="#17334b">中心化结果</text><rect x="890" y="222" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="910" y="271" font-size="30" fill="#2474b5">-2</text><rect x="990" y="222" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1010" y="271" font-size="30" fill="#2474b5">0</text><rect x="1090" y="222" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1110" y="271" font-size="30" fill="#2474b5">0</text><rect x="890" y="300" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="910" y="349" font-size="30" fill="#2474b5">0</text><rect x="990" y="300" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1010" y="349" font-size="30" fill="#2474b5">-5</text><rect x="1090" y="300" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1110" y="349" font-size="30" fill="#2474b5">0</text><rect x="890" y="378" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="910" y="427" font-size="30" fill="#2474b5">2</text><rect x="990" y="378" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1010" y="427" font-size="30" fill="#2474b5">5</text><rect x="1090" y="378" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1110" y="427" font-size="30" fill="#2474b5">0</text><path d="M40 495 H1240" stroke="#d8e1e8" stroke-width="2"/><text x="65" y="553" font-size="31" fill="#17334b">验证输入</text><rect x="65" y="585" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="85" y="634" font-size="30" fill="#2474b5">7</text><rect x="175" y="585" width="110" height="78" fill="#fff1e5" stroke="#ccd8e1" stroke-width="2"/><text x="195" y="634" font-size="30" fill="#d5752e">NaN</text><rect x="285" y="585" width="110" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="305" y="634" font-size="30" fill="#2474b5">2</text><text x="475" y="616" font-size="29" fill="#17334b">沿用均值 [3, 15, 0]</text><path d="M510 660 H805 M790 648 L805 660 L790 672" stroke="#52677a" stroke-width="3" fill="none"/><text x="890" y="553" font-size="31" fill="#17334b">验证输出</text><rect x="890" y="585" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="910" y="634" font-size="30" fill="#2474b5">4</text><rect x="990" y="585" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1010" y="634" font-size="30" fill="#2474b5">0</text><rect x="1090" y="585" width="100" height="78" fill="#f1f7fb" stroke="#ccd8e1" stroke-width="2"/><text x="1110" y="634" font-size="30" fill="#2474b5">2</text><text x="65" y="752" font-size="29" fill="#168578">第二特征：NaN → 填 15 → 减 15 → 0</text><text x="65" y="817" font-size="29" fill="#17334b">第三特征：训练计数为 0；验证出现 2，输出仍为 2。</text><text x="65" y="864" font-size="27" fill="#17334b">输出为 0 不能区分“原本等于均值”与“缺失后填充”；需要另存掩码。</text></g></svg>
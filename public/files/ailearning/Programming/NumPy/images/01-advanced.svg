<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="686.38" viewBox="17.22 14.64 1098.56 628.36" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">带缺失掩码的按列中心化</title><desc id="desc">第一列有两个有效数 1、3，均值为 2；第二列只有一个有效数 3，均值为 3。中心化时只对有效项减去对应列均值，缺失位置保留缺失，因而结果为图示两列。 不能把缺失项简单当成零再以总行数为分母。若整列没有有效项，需要明确报错、保留缺失或使用预先约定的回退规则；广播只负责形状匹配，不会替你选择统计语义。 每列只对有效值求均值，缺失位置仍保留为缺失。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2865a0" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">带缺失掩码的按列中心化</text><rect x="95.0" y="260" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="317" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="290.0" y="260" width="190.0" height="95" fill="#fff1e4" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="387.5" y="317" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">缺失</text><rect x="95.0" y="360" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="417" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">3</text><rect x="290.0" y="360" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="387.5" y="417" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">3</text><rect x="715.0" y="260" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="812.5" y="317" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">−1</text><rect x="910.0" y="260" width="190.0" height="95" fill="#fff1e4" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="1007.5" y="317" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">缺失</text><rect x="715.0" y="360" width="190.0" height="95" fill="#e1f0ed" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="812.5" y="417" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">1</text><rect x="910.0" y="360" width="190.0" height="95" fill="#e5edf8" stroke="white" rx="8" stroke-linecap="round" stroke-linejoin="round" /><text x="1007.5" y="417" font-size="25" fill="#213447" text-anchor="middle" font-weight="400">0</text><text x="95" y="190" font-size="24" fill="#213447" text-anchor="start" font-weight="400">原数组：有效掩码决定分母</text><text x="715" y="190" font-size="24" fill="#213447" text-anchor="start" font-weight="400">按列均值为 2、3；缺失仍保持缺失</text><path d="M515,390 L680,390" stroke="#2865a0" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="605" font-size="24" fill="#2865a0" text-anchor="start" font-weight="400">减去有效列均值</text></g></svg>

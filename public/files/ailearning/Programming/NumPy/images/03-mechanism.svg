<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1138.000" height="665.000" viewBox="31.000 108.000 1138.000 665.000" role="img"><title id="figure-title">批量矩阵乘：广播批轴，不省略内轴求和</title><desc id="figure-desc">两个2乘2批矩阵乘同一个2乘2矩阵。输出为4,6,10,12及16,18,22,24。高亮第一批第一行第二列，矩阵乘得到6而逐元素乘得到0。 批量矩阵乘：广播批轴，不省略内轴求和 批轴复用 B；矩阵内轴必须逐项相乘并求和</desc><rect width="1138.0" height="665.0" fill="white" x="31.0" y="108.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="65" y="155" font-size="27" fill="#213447" text-anchor="start" font-weight="400">A：2 批 × 2 行 × 2 列</text><text x="435" y="155" font-size="27" fill="#213447" text-anchor="start" font-weight="400">B：1 批 × 2 × 2</text><text x="825" y="155" font-size="27" fill="#213447" text-anchor="start" font-weight="400">C：2 批 × 2 × 2</text><text x="55" y="295" font-size="27" fill="#213447" text-anchor="start" font-weight="400">批 0</text><rect x="155" y="215" width="64" height="64" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="187.0" y="256" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><rect x="223" y="215" width="64" height="64" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="255.0" y="256" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="155" y="283" width="64" height="64" rx="6" fill="#fff0e3" stroke="#cbd9e4" stroke-width="1.5" /><text x="187.0" y="324" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">3</text><rect x="223" y="283" width="64" height="64" rx="6" fill="#fff0e3" stroke="#cbd9e4" stroke-width="1.5" /><text x="255.0" y="324" font-size="28" fil
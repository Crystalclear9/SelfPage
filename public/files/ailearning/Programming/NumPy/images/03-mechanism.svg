<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="927.3779" viewBox="0 0 1440 927.3779" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">批量矩阵乘法：先广播批轴，再收缩内轴</title><rect width="1440" height="927.3779" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">批量矩阵乘法：先广播批轴，再收缩内轴</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg aria-labelledby="figure-title figure-desc" width="1344" height="785.3779" viewBox="31 108 1138 665" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf2fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff0e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title id="figure-title">批量矩阵乘：广播批轴，不省略内轴求和</title><desc id="figure-desc">两个2乘2批矩阵乘同一个2乘2矩阵。输出为4,6,10,12及16,18,22,24。高亮第一批第一行第二列，矩阵乘得到6而逐元素乘得到0。 批量矩阵乘：广播批轴，不省略内轴求和 批轴复用 B；矩阵内轴必须逐项相乘并求和</desc><rect width="1138.0" height="665.0" fill="white" x="31.0" y="108.0"/><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2472b1"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="65" y="155" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">A：2 批 × 2 行 × 2 列</text><text x="435" y="155" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">B：1 批 × 2 × 2</text><text x="825" y="155" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">C：2 批 × 2 × 2</text><text x="55" y="295" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">批 0</text><rect x="155" y="215" width="64" height="64" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="187.0" y="256" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">1</text><rect x="223" y="215" width="64" height="64" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="255.0" y="256" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">2</text><rect x="155" y="283" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="187.0" y="324" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">3</text><rect x="223" y="283" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="255.0" y="324" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">4</text><rect x="895" y="215" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="927.0" y="256" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">4</text><rect x="963" y="215" width="64" height="64" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="995.0" y="256" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">6</text><rect x="895" y="283" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="927.0" y="324" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">10</text><rect x="963" y="283" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="995.0" y="324" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">12</text><text x="55" y="520" font-size="27" fill="#1f3449" text-anchor="start" font-weight="400">批 1</text><rect x="155" y="440" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="187.0" y="481" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">5</text><rect x="223" y="440" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="255.0" y="481" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">6</text><rect x="155" y="508" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="187.0" y="549" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">7</text><rect x="223" y="508" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="255.0" y="549" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">8</text><rect x="895" y="440" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="927.0" y="481" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">16</text><rect x="963" y="440" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="995.0" y="481" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">18</text><rect x="895" y="508" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="927.0" y="549" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">22</text><rect x="963" y="508" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="995.0" y="549" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">24</text><rect x="500" y="325" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="532.0" y="366" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">2</text><rect x="568" y="325" width="64" height="64" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="600.0" y="366" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><rect x="500" y="393" width="64" height="64" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c9dae6" stroke-width="1.5"/><text x="532.0" y="434" font-size="28" fill="#1f3449" text-anchor="middle" font-weight="400">1</text><rect x="568" y="393" width="64" height="64" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="600.0" y="434" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">3</text><path d="M650 375 L870 282" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><path d="M650 405 L870 495" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><text x="682" y="415" font-size="26" fill="#1f3449" text-anchor="start" font-weight="400">同一 B</text><line x1="55" y1="620" x2="1145" y2="620" stroke="#c9dae6" stroke-width="2"/><text x="55" y="680" font-size="30" fill="#2472b1" text-anchor="start" font-weight="400">一个输出：C[0,0,1] = 1 × 0 + 2 × 3 = 6</text><text x="55" y="745" font-size="29" fill="#c57439" text-anchor="start" font-weight="400">逐元素乘：同一位置却是 2 × 0 = 0</text></g></svg></svg>

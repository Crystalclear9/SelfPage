<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">批量矩阵乘法：先广播批轴，再收缩内轴</title><desc id="desc">A 的首轴表示两个批次；B 的单例批轴可广播到这两个批次。每一批都执行 3×4 与 4×5 的矩阵乘法，长度为 4 的内轴被求和，留下 3×5。 箭头表示形状推导，不表示必须物理复制 B。批轴能够广播不能弥补矩阵内轴不相等；这些条件需要分别检查。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">批量矩阵乘法：先广播批轴，再收缩内轴</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">只广播前面的批轴，末两轴按矩阵乘法规则收缩。</text><path d="M365,312.5 L460,337.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M365,437.5 L460,412.5" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M745,335.417 L820,314.583" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M962.5,330 L962.5,420" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="80" y="220" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="222.5" y="283" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">A：2×3×4</text><rect x="80" y="420" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="222.5" y="483" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">B：1×4×5</text><rect x="460" y="320" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="602.5" y="383" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">广播批轴到 2</text><rect x="820" y="220" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="962.5" y="283" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">逐批 3×4 乘 4×5</text><rect x="820" y="420" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="962.5" y="483" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">输出：2×3×5</text></g></svg>

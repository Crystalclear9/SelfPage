<text x="74" y="590" fill="#6e618e" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">第一批第一行 × B 的第二列：1 × 0 + 2 × 3 = 6。</text>
<text x="74" y="640" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">逐元素乘在该坐标上是 2 × 0 = 0，即使输出形状相同。</text>
<text x="74" y="700" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">箭头表示逻辑复用，不表示实际复制出两份 B。</text>

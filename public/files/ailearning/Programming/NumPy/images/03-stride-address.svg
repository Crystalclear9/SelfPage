<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="933.0598" viewBox="0 0 1440 933.0598" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">原矩阵和转置矩阵以不同坐标访问同一字节偏移四十八处的元素六</title><rect width="1440" height="933.0598" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">原矩阵和转置矩阵以不同坐标访问同一字节偏移四十八处的元素六</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="791.0598" viewBox="13.867 61.867 1252.267 737.067" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff1e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e5"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><rect width="1252.267" height="737.067" fill="white" x="13.867" y="61.867"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="110" font-size="27" fill="#527087">A = arange(12, dtype=int64).reshape(3,4)；一个元素占 8 字节</text><text x="40" y="176" font-size="29" fill="#173c58">唯一数值缓冲：相对 A[0,0] 的字节偏移</text><rect x="50" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="85" y="260" font-size="29" fill="#1f81c7">0</text><text x="73" y="321" font-size="25" fill="#527087">0</text><rect x="149" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="184" y="260" font-size="29" fill="#1f81c7">1</text><text x="172" y="321" font-size="25" fill="#527087">8</text><rect x="248" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="283" y="260" font-size="29" fill="#1f81c7">2</text><text x="271" y="321" font-size="25" fill="#527087">16</text><rect x="347" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="382" y="260" font-size="29" fill="#1f81c7">3</text><text x="370" y="321" font-size="25" fill="#527087">24</text><rect x="446" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="481" y="260" font-size="29" fill="#1f81c7">4</text><text x="469" y="321" font-size="25" fill="#527087">32</text><rect x="545" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="580" y="260" font-size="29" fill="#1f81c7">5</text><text x="568" y="321" font-size="25" fill="#527087">40</text><rect x="644" y="215" width="99" height="68" fill="url(#book-wash-fff1e5)" stroke="#c8d8e2" stroke-width="2"/><text x="679" y="260" font-size="29" fill="#d07533">6</text><text x="667" y="321" font-size="25" fill="#527087">48</text><rect x="743" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="778" y="260" font-size="29" fill="#1f81c7">7</text><text x="766" y="321" font-size="25" fill="#527087">56</text><rect x="842" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="877" y="260" font-size="29" fill="#1f81c7">8</text><text x="865" y="321" font-size="25" fill="#527087">64</text><rect x="941" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="976" y="260" font-size="29" fill="#1f81c7">9</text><text x="964" y="321" font-size="25" fill="#527087">72</text><rect x="1040" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="1075" y="260" font-size="29" fill="#1f81c7">10</text><text x="1063" y="321" font-size="25" fill="#527087">80</text><rect x="1139" y="215" width="99" height="68" fill="#f4f8fb" stroke="#c8d8e2" stroke-width="2"/><text x="1174" y="260" font-size="29" fill="#1f81c7">11</text><text x="1162" y="321" font-size="25" fill="#527087">88</text><path d="M40 355 H1240" stroke="#dce2eb" stroke-width="2"/><text x="50" y="417" font-size="30" fill="#1f81c7">原矩阵 A：shape (3,4)</text><text x="50" y="476" font-size="30" fill="#173c58">strides = (32, 8)</text><text x="50" y="541" font-size="29" fill="#173c58">A[1,2]  →  1×32 + 2×8 = 48</text><text x="50" y="606" font-size="27" fill="#527087">向下走一行：跳过 4 个元素</text><text x="690" y="417" font-size="30" fill="#d07533">转置 T：shape (4,3)</text><text x="690" y="476" font-size="30" fill="#173c58">strides = (8, 32)</text><text x="690" y="541" font-size="29" fill="#173c58">T[2,1]  →  2×8 + 1×32 = 48</text><text x="690" y="606" font-size="27" fill="#527087">向右走一列：跳过 4 个元素</text><path d="M645 390 V635" stroke="#dce2eb" stroke-width="2"/><text x="50" y="709" font-size="31" fill="#148f94">两种坐标都读取值 6；它们不是两份存储。</text><text x="50" y="768" font-size="29" fill="#173c58">若只令 T[2,1] = 99，A[1,2] 也会成为 99。</text></g><desc> 同一段缓冲，转置只改变从坐标到字节的路径 间隔切片改变步幅；翻转还会改变起点，并可能使用负步幅。</desc></svg></svg>

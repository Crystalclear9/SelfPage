<svg xmlns="http://www.w3.org/2000/svg" width="1252.267" height="737.067" viewBox="13.867 61.867 1252.267 737.067"><rect width="1252.267" height="737.067" fill="white" x="13.867" y="61.867" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="110" font-size="27" fill="#52677a">A = arange(12, dtype=int64).reshape(3,4)；一个元素占 8 字节</text><text x="40" y="176" font-size="29" fill="#17334b">唯一数值缓冲：相对 A[0,0] 的字节偏移</text><rect x="50" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="85" y="260" font-size="29" fill="#2474b5">0</text><text x="73" y="321" font-size="25" fill="#52677a">0</text><rect x="149" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="184" y="260" font-size="29" fill="#2474b5">1</text><text x="172" y="321" font-size="25" fill="#52677a">8</text><rect x="248" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="283" y="260" font-size="29" fill="#2474b5">2</text><text x="271" y="321" font-size="25" fill="#52677a">16</text><rect x="347" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="382" y="260" font-size="29" fill="#2474b5">3</text><text x="370" y="321" font-size="25" fill="#52677a">24</text><rect x="446" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="481" y="260" font-size="29" fill="#2474b5">4</text><text x="469" y="321" font-size="25" fill="#52677a">32</text><rect x="545" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="580" y="260" font-size="29" fill="#2474b5">5</text><text x="568" y="321" font-size="25" fill="#52677a">40</text><rect x="644" y="215" width="99" height="68" fill="#fff1e5" stroke="#cad7e0" stroke-width="2" /><text x="679" y="260" font-size="29" fill="#d5752e">6</text><text x="667" y="321" font-size="25" fill="#52677a">48</text><rect x="743" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="778" y="260" font-size="29" fill="#2474b5">7</text><text x="766" y="321" font-size="25" fill="#52677a">56</text><rect x="842" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="877" y="260" font-size="29" fill="#2474b5">8</text><text x="865" y="321" font-size="25" fill="#52677a">64</text><rect x="941" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="976" y="260" font-size="29" fill="#2474b5">9</text><text x="964" y="321" font-size="25" fill="#52677a">72</text><rect x="1040" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="1075" y="260" font-size="29" fill="#2474b5">10</text><text x="1063" y="321" font-size="25" fill="#52677a">80</text><rect x="1139" y="215" width="99" height="68" fill="#f4f8fb" stroke="#cad7e0" stroke-width="2" /><text x="1174" y="260" font-size="29" fill="#2474b5">11</text><text x="1162" y="321" font-size="25" fill="#52677a">88</text><path d="M40 355 H1240" stroke="#d8e1e8" stroke-width="2" /><text x="50" y="417" font-size="30" fill="#2474b5">原矩阵 A：shape (3,4)</text><text x="50" y="476" font-size="30" fill="#17334b">strides = (32, 8)</text><text x="50" y="541" font-size="29" fill="#17334b">A[1,2]  →  1×32 + 2×8 = 48</text><text x="50" y="606" font-size="27" fill="#52677a">向下走一行：跳过 4 个元素</text><text x="690" y="417" font-size="30" fill="#d5752e">转置 T：shape (4,3)</text><text x="690" y="476" font-size="30" fill="#17334b">strides = (8, 32)</text><text x="690" y="541" font-size="29" fill="#17334b">T[2,1]  →  2×8 + 1×32 = 48</text><text x="690" y="606" font-size="27" fill="#52677a">向右走一列：跳过 4 个元素</text><path d="M645 390 V635" stroke="#d8e1e8" stroke-width="2" /><text x="50" y="709" font-size="31" fill="#168578">两种坐标都读取值 6；它们不是两份存储。</text><text x="50" y="768" font-size="29" fill="#17334b">若只令 T[2,1] = 99，A[1,2] 也会成为 99。</text></g><desc> 同一段缓冲，转置只改变从坐标到字节的路径 间隔切片改变步幅；翻转还会改变起点，并可能使用负步幅。</desc></svg>

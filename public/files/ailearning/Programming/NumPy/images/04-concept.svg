<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="462.68" viewBox="1.33 -10.65 1073.88 414.05" role="img"><title id="detail-title">机制展开：A 用两行完整计算链比较同一样本的更新前后：参数从零变为 w=(0.3,0.6)、b=0.3，预测从零变为 1.8，误差平方的一半从 4.5 降到 0.72</title><desc id="detail-desc">A 用两行完整计算链比较同一样本的更新前后：参数从零变为 w=(0.3,0.6)、b=0.3，预测从零变为 1.8，误差平方的一半从 4.5 降到 0.72。它展示一次具体更新，并不宣称任何学习率都会使损失下降。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="35" font-size="25" fill="#213447" font-weight="700" text-anchor="start">同一样本 x=(1,2)，目标 y=3；损失为误差平方的一半</text><text x="30" y="137" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">更新前</text><rect x="175" y="95" width="59" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="204.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="239" y="95" width="59" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="268.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><text x="331" y="135" font-size="30" fill="#213447" font-weight="400" text-anchor="start">×</text><rect x="375" y="95" width="75" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="412.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">0</text><rect x="455" y="95" width="75" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="492.5" y="134.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">0</text><text x="550" y="135" font-size="30" fill="#213447" font-weight="400" text-anchor="start">+</text><rect x="595" y="104" width="130" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="660.0" y="132" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">b=0</text><path d="M735,124 L800,124" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><rect x="815" y="104" width="230" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="930.0" y="132" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">预测 0</text><text x="817" y="196" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">损失 4.5</text><text x="30" y="307" font-size="25" fill="#cf7432" font-weight="600" text-anchor="start">更新后</text><rect x="175" y="265" width="59" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="204.5" y="304.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="239" y="265" width="59" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="268.5" y="304.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><text x="331" y="305" font-size="30" fill="#213447" font-weight="400" text-anchor="start">×</text><rect x="375" y="265" width="75" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="412.5" y="304.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">0.3</text><rect x="455" y="265" width="75" height="60" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="492.5" y="304.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">0.6</text><text x="550" y="305" font-size="30" fill="#213447" font-weight="400" text-ancho
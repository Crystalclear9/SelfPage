<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">相同掩码，不同的求值边界</title><desc id="desc">选择函数接收之前已求值的数组；通用函数的where掩码只对指定位置求值并写回。显式out为跳过位置定义结果。</desc><rect width="1200" height="750" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="49" font-size="32" fill="#213447" text-anchor="start">相同掩码，不同的求值边界</text><text x="40" y="96" font-size="26" fill="#627689" text-anchor="start">固定实数输入；非法位置用 NaN 表示，严格模式会抛浮点异常</text><text x="40" y="170" font-size="28" fill="#213447" text-anchor="start">输入 x</text><text x="40" y="255" font-size="28" fill="#213447" text-anchor="start">有效掩码 x&gt;0</text><text x="40" y="380" font-size="28" fill="#213447" text-anchor="start">先完整求 log(x)</text><text x="40" y="540" font-size="28" fill="#213447" text-anchor="start">ufunc 掩码求 log</text><rect x="325" y="134" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="410" y="174" font-size="27" fill="#c87536" text-anchor="middle">−1</text><rect x="525" y="134" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="610" y="174" font-size="27" fill="#c87536" text-anchor="middle">0</text><rect x="725" y="134" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="810" y="174" font-size="27" fill="#2865a0" text-anchor="middle">1</text><rect x="925" y="134" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="1010" y="174" font-size="27" fill="#2865a0" text-anchor="middle">4</text><rect x="325" y="219" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="410" y="259" font-size="27" fill="#c87536" text-anchor="middle">False</text><rect x="525" y="219" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="610" y="259" font-size="27" fill="#c87536" text-anchor="middle">False</text><rect x="725" y="219" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="810" y="259" font-size="27" fill="#2865a0" text-anchor="middle">True</text><rect x="925" y="219" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="1010" y="259" font-size="27" fill="#2865a0" text-anchor="middle">True</text><rect x="325" y="344" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="410" y="384" font-size="27" fill="#c87536" text-anchor="middle">NaN</text><rect x="525" y="344" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="610" y="384" font-size="27" fill="#c87536" text-anchor="middle">−∞</text><rect x="725" y="344" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="810" y="384" font-size="27" fill="#2865a0" text-anchor="middle">0</text><rect x="925" y="344" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="1010" y="384" font-size="27" fill="#2865a0" text-anchor="middle">1.38629</text><rect x="325" y="504" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="410" y="544" font-size="27" fill="#c87536" text-anchor="middle">保留 NaN</text><rect x="525" y="504" width="170" height="61" fill="#c87536" opacity="0.09" rx="3"/><text x="610" y="544" font-size="27" fill="#c87536" text-anchor="middle">保留 NaN</text><rect x="725" y="504" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="810" y="544" font-size="27" fill="#2865a0" text-anchor="middle">0</text><rect x="925" y="504" width="170" height="61" fill="#2865a0" opacity="0.09" rx="3"/><text x="1010" y="544" font-size="27" fill="#2865a0" text-anchor="middle">1.38629</text><text x="40" y="440" font-size="25" fill="#c87536" text-anchor="start">上行若在默认警告模式下运行，非法算术已先发生；随后选择无法撤销。</text><text x="40" y="600" font-size="26" fill="#2865a0" text-anchor="start">下行预先把 out 全部填成 NaN，只在有效位置计算并写回。</text><text x="40" y="665" font-size="25" fill="#213447" text-anchor="start">where=False 的位置保留 out 原值；省略 out 时不能假定这些位置自动填零。</text><text x="40" y="715" font-size="24" fill="#627689" text-anchor="start">两种接口：np.where 选择已求值的分支；ufunc 的 where 控制运算与写出位置。</text></g></svg>
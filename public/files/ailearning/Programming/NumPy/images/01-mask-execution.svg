<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">先运算再选择，与带掩码的运算不同</title>
  <desc id="plate-desc">输入 −1、0、1、4。普通 where 的对数参数会先计算，带 where 的 ufunc 则只在两个有效位置写入。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="720" fill="white" stroke="none" stroke-width="0"/>
  <text x="333" y="68" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">整个对数参数先求值</text>
  <rect x="106" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="162" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">−1</text>
  <rect x="218" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="274" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="330" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="386" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <rect x="442" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="498" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">4</text>
  <polyline points="330,270 330,335" fill="none" stroke="#a84b3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <rect x="106" y="357" width="112" height="112" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="162" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">NaN</text>
  <rect x="218" y="357" width="112" height="112" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="274" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">−∞</text>
  <rect x="330" y="357" width="112" height="112" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="386" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="442" y="357" width="112" height="112" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="498" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1.386…</text>
  <text x="333" y="552" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">无效运算或除零已经发生</text>
  <text x="333" y="604" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">np.where(valid, np.log(x), np.nan)</text>
  <text x="1013" y="68" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">只计算掩码允许的位置</text>
  <rect x="786" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="842" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">−1</text>
  <rect x="898" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="954" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="1010" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="1066" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <rect x="1122" y="136" width="112" height="112" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="1178" y="209.92" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">4</text>
  <polyline points="1010,270 1010,335" fill="none" stroke="#196f77" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <rect x="786" y="357" width="112" height="112" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="842" y="430.92" font-size="24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">不计算</text>
  <rect x="898" y="357" width="112" height="112" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="954" y="430.92" font-size="24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">不计算</text>
  <rect x="1010" y="357" width="112" height="112" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="1066" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="1122" y="357" width="112" height="112" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="1178" y="430.92" font-size="24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1.386…</text>
  <text x="1013" y="552" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">前两格沿用初始化的 NaN</text>
  <text x="1013" y="604" font-size="25" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">np.log(x, out=out, where=valid)</text>
  <text x="680" y="678" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">最终输出可以相同，但触发的运算和浮点错误不同。</text>
</svg>

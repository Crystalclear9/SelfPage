<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">预处理只能从训练数据估计</title><desc id="desc">仅按训练集拟合中心化参数时，均值为 1，验证样本 100 变成 99。若把验证样本也放进拟合，均值变为 34，验证结果就被改成 66；预处理已经使用了本应留作评价的数据。 本图只演示减均值，没有执行标准差缩放。验证输入可以用于应用已拟合变换，却不能反向改变训练阶段的估计；测试集还应保持独立。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">预处理只能从训练数据估计</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">验证集只应用训练均值；参与拟合会把验证信息带入变换。</text><path d="M345,255 L440,255" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M670.5,310 L894.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,505 L840,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M265.833,310 L519.167,530" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M345,535 L440,555" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="200" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="263" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">训练输入：0、2</text><rect x="440" y="200" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="263" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">只拟合训练均值：1</text><rect x="60" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">验证输入：100</text><rect x="840" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="982.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">验证中心化：99</text><rect x="440" y="530" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="593" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">泄漏均值：34 → 得到 66</text></g></svg>

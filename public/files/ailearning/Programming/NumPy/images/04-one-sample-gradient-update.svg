<path d="M548 455L662.0 455.0" fill="none" stroke="#625481" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M674 455L659.0 449.0L659.0 461.0Z" fill="#625481" stroke="#625481" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M864 155L864.0 215.0" fill="none" stroke="#a54938" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M864 227L870.0 212.0L858.0 212.0Z" fill="#a54938" stroke="#a54938" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M839 155L441.80828229812977 226.86353816610853" fill="none" stroke="#a54938" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M430 229L445.82858378960793 232.23356385670056L443.6921219557165 220.4252815585708Z" fill="#a54938" stroke="#a54938" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M365 325L365.0 388.0" fill="none" stroke="#625481" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M365 400L371.0 385.0L359.0 385.0Z" fill="#625481" stroke="#625481" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M829 325L449.7851509685727 397.73942116971114" fill="none" stroke="#625481" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M438 400L453.8617281258603 403.06685194642523L451.6011492955714 391.28170097785255Z" fill="#625481" stroke="#625481" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="600" y="539" text-anchor="middle" fill="#546677" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="27">学习率 0.1，两项梯度使用同一个旧状态</text>

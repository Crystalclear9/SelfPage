<title id="title">一次训练更新的状态依赖</title>
<desc id="description">前向预测为 2，目标为 5，所以残差为负三。梯度是负六和负三，同时更新后预测变为 3.5。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#eef8f8"/><stop offset="1" stop-color="#c9e6e7"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#fdf2ef"/><stop offset="1" stop-color="#f3d5cd"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f7f4fb"/><stop offset="1" stop-color="#e4dbee"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#f8fafb"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="558" rx="0" fill="white" stroke="none" stroke-width="1.6"/>
<text x="78" y="94" text-anchor="start" fill="#232b37" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="32">前向</text>
<text x="78" y="274" text-anchor="start" fill="#232b37" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="32">反向</text>
<text x="78" y="455" text-anchor="start" fill="#232b37" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="32">更新</text>
<path d="M207 153l37 -87h285l-37 87Z" fill="url(#wash-t)" stroke="#176f76" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="365" y="96" text-anchor="middle" fill="#176f76" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">旧预测</text>
<text x="365" y="132" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">1 × 2 + 0 = 2</text>
<path d="M706 153l37 -87h285l-37 87Z" fill="url(#wash-t)" stroke="#176f76" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="864" y="96" text-anchor="middle" fill="#176f76" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">残差</text>
<text x="864" y="132" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">e = 2 − 5 = −3</text>
<path d="M207 322l37 -87h285l-37 87Z" fill="url(#wash-c)" stroke="#a54938" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="365" y="265" text-anchor="middle" fill="#a54938" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">权重梯度</text>
<text x="365" y="301" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">e × 2 = −6</text>
<path d="M706 322l37 -87h285l-37 87Z" fill="url(#wash-c)" stroke="#a54938" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="864" y="265" text-anchor="middle" fill="#a54938" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">偏置梯度</text>
<text x="864" y="301" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">e × 1 = −3</text>
<path d="M207 495l37 -87h285l-37 87Z" fill="url(#wash-v)" stroke="#625481" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="365" y="438" text-anchor="middle" fill="#625481" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">同时更新</text>
<text x="365" y="474" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">w = 1.6, b = 0.3</text>
<path d="M706 495l37 -87h285l-37 87Z" fill="url(#wash-v)" stroke="#625481" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="864" y="438" text-anchor="middle" fill="#625481" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif" font-size="28">新预测</text>
<text x="864" y="474" text-anchor="middle" fill="#232b37" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="31">1.6 × 2 + 0.3 = 3.5</text>

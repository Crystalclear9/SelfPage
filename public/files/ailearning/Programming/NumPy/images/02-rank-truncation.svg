<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="842.8275" viewBox="0 0 1440 842.8275" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">保留与截断小奇异方向时的参数和残差对照</title><rect width="1440" height="842.8275" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">保留与截断小奇异方向时的参数和残差对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="700.8275" viewBox="33.75 115 1311.25 683.75" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1311.25" height="683.75" fill="white" x="33.75" y="115.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><line x1="220" y1="720" x2="870" y2="720" stroke="#8e9fb9" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="220" y2="180" stroke="#8e9fb9" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="850" y="765" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">第一响应</text><text xml:space="preserve" x="65" y="170" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">第二响应</text><text xml:space="preserve" x="195" y="760" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">0</text><text xml:space="preserve" x="630" y="760" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="185" y="310" font-size="29" fill="#1f3348" text-anchor="end" font-weight="400">1</text><line x1="630" y1="720" x2="630" y2="310" stroke="#cd7834" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="630" y2="310" stroke="#2181bf" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="630" y2="720" stroke="#cd7834" stroke-width="8" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="630" cy="310" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><circle cx="630" cy="720" r="9" fill="#cd7834" stroke="none" stroke-width="2"/><text xml:space="preserve" x="652" y="292" font-size="31" fill="#2181bf" text-anchor="start" font-weight="400">b = (1, 1)</text><text xml:space="preserve" x="652" y="698" font-size="30" fill="#ae6026" text-anchor="start" font-weight="400">截断拟合 (1, 0)</text><text xml:space="preserve" x="653" y="527.0" font-size="29" fill="#ae6026" text-anchor="start" font-weight="400">残差 (0, 1)</text><path d="M600,720 V690 H630" stroke="#cd7834" stroke-width="3" fill="none" stroke-dasharray=""/><text xml:space="preserve" x="1030" y="220" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">A = diag(1, 10^(-8))</text><text xml:space="preserve" x="1030" y="315" font-size="31" fill="#2181bf" text-anchor="start" font-weight="700">保留两个方向</text><text xml:space="preserve" x="1030" y="370" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">参数 = (1, 10^8)</text><text xml:space="preserve" x="1030" y="420" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">拟合 = b，残差 = 0</text><text xml:space="preserve" x="1030" y="530" font-size="31" fill="#ae6026" text-anchor="start" font-weight="700">截断第二个方向</text><text xml:space="preserve" x="1030" y="585" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">参数 = (1, 0)</text><text xml:space="preserve" x="1030" y="635" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">保留水平方向的投影</text></g><desc> 截断小奇异方向：响应空间中的投影 阈值改变求解子空间；原矩阵的数学秩仍为 2。</desc></svg></svg>

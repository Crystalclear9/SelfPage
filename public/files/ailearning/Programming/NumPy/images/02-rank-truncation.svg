<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">截断小奇异方向：响应空间中的投影</text><line x1="220" y1="720" x2="870" y2="720" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="220" y2="180" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="850" y="765" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">第一响应</text><text xml:space="preserve" x="65" y="170" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">第二响应</text><text xml:space="preserve" x="195" y="760" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">0</text><text xml:space="preserve" x="630" y="760" font-size="29" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><text xml:space="preserve" x="185" y="310" font-size="29" fill="#193a4e" text-anchor="end" font-weight="400">1</text><line x1="630" y1="720" x2="630" y2="310" stroke="#d17a30" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="630" y2="310" stroke="#2676ad" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="220" y1="720" x2="630" y2="720" stroke="#d17a30" stroke-width="8" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="630" cy="310" r="9" fill="#2676ad" stroke="none" stroke-width="2"/><circle cx="630" cy="720" r="9" fill="#d17a30" stroke="none" stroke-width="2"/><text xml:space="preserve" x="652" y="292" font-size="31" fill="#2676ad" text-anchor="start" font-weight="400">b = (1, 1)</text><text xml:space="preserve" x="652" y="698" font-size="30" fill="#b26122" text-anchor="start" font-weight="400">截断拟合 (1, 0)</text><text xml:space="preserve" x="653" y="527.0" font-size="29" fill="#b26122" text-anchor="start" font-weight="400">残差 (0, 1)</text><path d="M600,720 V690 H630" stroke="#d17a30" stroke-width="3" fill="none" stroke-dasharray=""/><text xml:space="preserve" x="1030" y="220" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">A = diag(1, 10^(-8))</text><text xml:space="preserve" x="1030" y="315" font-size="31" fill="#2676ad" text-anchor="start" font-weight="700">保留两个方向</text><text xml:space="preserve" x="1030" y="370" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">参数 = (1, 10^8)</text><text xml:space="preserve" x="1030" y="420" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">拟合 = b，残差 = 0</text><text xml:space="preserve" x="1030" y="530" font-size="31" fill="#b26122" text-anchor="start" font-weight="700">截断第二个方向</text><text xml:space="preserve" x="1030" y="585" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">参数 = (1, 0)</text><text xml:space="preserve" x="1030" y="635" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">保留水平方向的投影</text><text xml:space="preserve" x="220" y="855" font-size="31" fill="#193a4e" text-anchor="start" font-weight="400">阈值改变求解子空间；原矩阵的数学秩仍为 2。</text></g></svg>
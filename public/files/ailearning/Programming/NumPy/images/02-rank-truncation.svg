<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title id="figure-title">数值秩截断：改变的是允许拟合的方向</title><desc id="figure-desc">对角矩阵奇异值为1与10的负8次方。小阈值保留两方向；大阈值截去第二方向。两种解的参数和残差不同，原矩阵数学秩仍为2。</desc><rect width="1200" height="735" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">数值秩截断：改变的是允许拟合的方向</text><text x="55" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一矩阵 A = diag(1, 0.00000001)，响应 b = (1, 1)</text><line x1="600" y1="185" x2="600" y2="555" stroke="#cbd9e4" stroke-width="2" /><rect x="55" y="190" width="500" height="66" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="305.0" y="232.8" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">保留两个非零方向</text><text x="305" y="301" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">rcond = 1e-10</text><text x="55" y="365" font-size="26" fill="#213447" text-anchor="start" font-weight="400">数值秩</text><text x="545" y="365" font-size="29" fill="#2865a0" text-anchor="end" font-weight="600">2</text><text x="55" y="440" font-size="26" fill="#213447" text-anchor="start" font-weight="400">参数 x</text><text x="545" y="440" font-size="29" fill="#2865a0" text-anchor="end" font-weight="600">(1, 100000000)</text><text x="55" y="515" font-size="26" fill="#213447" text-anchor="start" font-weight="400">残差 b − Ax</text><text x="545" y="515" font-size="29" fill="#2865a0" text-anchor="end" font-weight="600">(0, 0)</text><rect x="645" y="190" width="500" height="66" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="895.0" y="232.8" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">截去较小的非零方向</text><text x="895" y="301" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">rcond = 1e-6</text><text x="645" y="365" font-size="26" fill="#213447" text-anchor="start" font-weight="400">数值秩</text><text x="1135" y="365" font-size="29" fill="#c87536" text-anchor="end" font-weight="600">1</text><text x="645" y="440" font-size="26" fill="#213447" text-anchor="start" font-weight="400">参数 x</text><text x="1135" y="440" font-size="29" fill="#c87536" text-anchor="end" font-weight="600">(1, 0)</text><text x="645" y="515" font-size="26" fill="#213447" text-anchor="start" font-weight="400">残差 b − Ax</text><text x="1135" y="515" font-size="29" fill="#c87536" text-anchor="end" font-weight="600">(0, 1)</text><line x1="55" y1="565" x2="1145" y2="565" stroke="#cbd9e4" stroke-width="2" /><text x="55" y="620" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">完整解：拟合无误差，但小方向会放大扰动</text><text x="55" y="675" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">截断解：只保证残差与保留的左奇异方向正交</text></g></svg>

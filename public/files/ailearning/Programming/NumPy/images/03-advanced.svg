<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">滑动窗口共享底层存储</title><desc id="desc">对四个连续数建立长度为 3 的滑动窗口，得到两个逻辑窗口。底层元素 1 和 2 同时出现在两个窗口中，图中的多条连线因此汇入同一个存储位置，而不是指向两个独立副本。 逻辑视图元素数不等于独立存储数。重叠视图的写入可能相互影响，常见滑动窗口接口默认限制写入；是否复制必须检查具体接口和步幅，不能从二维外观判断。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">滑动窗口共享底层存储</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">窗口是重叠视图；默认只读，不能把窗口当成独立副本。</text><rect x="160.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="173" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">0</text><rect x="410.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="423" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">1</text><rect x="660.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="673" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">2</text><rect x="910.0" y="195" width="130" height="86" fill="#dfeaf6" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="923" y="244" font-size="25" fill="#20384f" text-anchor="start" font-weight="400">3</text><text x="65" y="640" font-size="25" fill="#268d8c" text-anchor="start" font-weight="400">窗口 0</text><path d="M137.5,455 L225,291" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="65.0" y="465" width="138" height="90" fill="#e0f0eb" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="134.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">0</text><path d="M282.5,455 L475,291" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="210.0" y="465" width="138" height="90" fill="#e0f0eb" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="279.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">1</text><path d="M427.5,455 L725,291" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><rect x="355.0" y="465" width="138" height="90" fill="#e0f0eb" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="424.5" y="520" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">2</text><text x="600" y="640" font-size="25" fill="#507db3" text-anchor="start" font-weight="400">窗口 1</text><path d="M672.5,455 L475,291" stroke="#507db3" stroke-width="3" fill="
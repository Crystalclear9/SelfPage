nt-size="28" fill="#213447" text-anchor="start" font-weight="600">窗口 0</text><rect x="60" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="115.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><path d="M115 355 L405 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="200" y="360" width="110" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="255.0" y="402.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1</text><path d="M255 355 L550 240" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="340" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="395.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><path d="M395 355 L695 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="640" y="325" font-size="28" fill="#213447" text-anchor="start" font-weight="600">窗口 1</text><rect x="640" y="360" width="110" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="695.0" y="402.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1</text><path d="M695 355 L550 240" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="780" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="835.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><path d="M835 355 L695 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="920" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="975.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><path d="M975 355 L840 24
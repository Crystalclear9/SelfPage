<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1039.000" height="530.000" viewBox="16.000 64.000 1039.000 530.000" role="img"><title id="figure-title">重叠窗口：不同坐标可指向同一个源元素</title><desc id="figure-desc">两个长度为三的滑动窗口共享源数组。修改源位置一后，两个窗口相应位置都变成九十九；默认窗口只读不冻结源。 重叠窗口：不同坐标可指向同一个源元素 窗口默认只读，源数组的变化仍会被视图观察到。</desc><rect width="1039.0" height="530.0" fill="white" x="16.0" y="64.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#213447" text-anchor="start" font-weight="400">源数组 x=[0,1,2,3]；窗口长度为 3</text><rect x="350" y="160" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="405.0" y="202.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="495" y="160" width="110" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="550.0" y="202.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1</text><rect x="640" y="160" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="695.0" y="202.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="785" y="160" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="840.0" y="202.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><text x="40" y="200" font-size="28" fill="#213447" text-anchor="start" font-weight="400">唯一源缓冲</text><text x="60" y="325" font-size="28" fill="#213447" text-anchor="start" font-weight="600">窗口 0</text><rect x="60" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="115.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><path d="M115 355 L405 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="200" y="360" width="110" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="255.0" y="402.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1</text><path d="M255 355 L550 240" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="340" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="395.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><path d="M395 355 L695 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="640" y="325" font-size="28" fill="#213447" text-anchor="start" font-weight="600">窗口 1</text><rect x="640" y="360" width="110" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="695.0" y="402.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1</text><path d="M695 355 L550 240" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="780" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="835.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><path d="M835 355 L695 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="920" y="360" width="110" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="975.0" y="402.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><path d="M975 355 L840 240" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="40" y="505" font-size="30" fill="#c87536" tex
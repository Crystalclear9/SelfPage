Width="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">源数组 x=[0,1,2,3]；窗口长度为 3</text><rect x="350" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="405.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><rect x="495" y="160" width="110" height="65" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="550.0" y="202.3" font-size="28" fill="#c57439" text-anchor="middle" font-weight="400">1</text><rect x="640" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="695.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">2</text><rect x="785" y="160" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="840.0" y="202.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">3</text><text x="40" y="200" font-size="28" fill="#1f3449" text-anchor="start" font-weight="400">唯一源缓冲</text><text x="60" y="325" font-size="28" fill="#1f3449" text-anchor="start" font-weight="600">窗口 0</text><rect x="60" y="360" width="110" height="65" rx="6" fill="url(#book-wash-eaf2fa)" stroke="#2472b1" stroke-width="1.5"/><text x="115.0" y="402.3" font-size="28" fill="#2472b1" text-anchor="middle" font-weight="400">0</text><path d="M115 355 L405 240" fill="none" stroke="#2472b1" stroke-width="2.8" marker-end="url(#arrow-blue)"/><rect x="200" y="360" width="110" height="65" rx="6" fill="url(#book-wash-fff0e3)" stroke="#c57439" stroke-width="1.5"/><text x="255.0" y="402.3" font-size="28" fill="#c57439" text-anchor="middle" font-weight="400">1</text><path d="M255 355 L550 240" fill="none" stroke="#c5
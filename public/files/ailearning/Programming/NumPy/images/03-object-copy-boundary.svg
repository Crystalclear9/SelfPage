  <text x="1116" y="476.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">L′ : [1]</text>
  <text x="448" y="585" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#196f77" text-anchor="middle">通过 b 追加 9，a 也读到 [1, 9]</text>
  <text x="1118" y="585" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#a84b3b" text-anchor="middle">c 仍读到 [1]</text>

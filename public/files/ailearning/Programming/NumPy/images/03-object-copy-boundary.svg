  <title id="plate-title">独立数组缓冲与独立 Python 对象是两层问题</title>
  <desc id="plate-desc">a 与 b 各有独立的 ndarray 缓冲，但浅复制保留同一列表引用。c 深复制出的列表在本例中有独立身份。</desc>

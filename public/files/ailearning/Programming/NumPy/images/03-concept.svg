<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">重复索引：两条贡献究竟写到哪里？</text><text xml:space="preserve" x="65" y="135" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">相同起点：a = [0, 0, 0]；目标索引 [1, 1]；每次 +2</text><text xml:space="preserve" x="70" y="225" font-size="32" fill="#2676ad" text-anchor="start" font-weight="700">缓冲增量   a[[1, 1]] += 2</text><circle cx="160" cy="340" r="48" fill="#ecf4fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="160" y="351" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="160" y="430" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">原位置 a[1]</text><circle cx="690" cy="340" r="48" fill="#ecf4fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="690" y="351" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="690" y="430" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">临时记录 0</text><circle cx="1030" cy="340" r="48" fill="#ecf4fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="1030" y="351" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1030" y="430" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">临时记录 1</text><path d="M210,330 C350,255 520,255 640,330" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M210,350 C400,510 820,510 980,350" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="420" y="490" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">读同一旧值，再各自 +2</text><path d="M730,315 C920,180 1210,215 1280,325" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M1080,340 H1250" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="1260" y="300" width="110" height="80" rx="0" fill="#ecf4fa" stroke="#2676ad" stroke-width="3"/><text xml:space="preserve" x="1315" y="352" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="1315" y="430" font-size="27" fill="#193a4e" text-anchor="middle" font-weight="400">同一目标</text><text xml:space="preserve" x="1090" y="510" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">覆盖写回，不能合并为 4</text><line x1="65" y1="555" x2="1430" y2="555" stroke="#d6e0e6" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="70" y="635" font-size="32" fill="#b26122" text-anchor="start" font-weight="700">逐次累加   np.add.at(a, [1, 1], 2)</text><rect x="190" y="735" width="120" height="90" rx="0" fill="#fff2e8" stroke="#d17a30" stroke-width="3"/><text xml:space="preserve" x="250" y="795" font-size="38" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="250" y="880" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">a[1]</text><rect x="670" y="735" width="120" height="90" rx="0" fill="#fff2e8" stroke="#d17a30" stroke-width="3"/><text xml:space="preserve" x="730" y="795" font-size="38" fill="#193a4e" text-anchor="middle" font-weight="400">2</text><text xml:space="preserve" x="730" y="880" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">a[1]</text><rect x="1150" y="735" width="120" height="90" rx="0" fill="#fff2e8" stroke="#d17a30" stroke-width="3"/><text xml:space="preserve" x="1210" y="795" font-size="38" fill="#193a4e" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="1210" y="880" font-size="28" fill="#193a4e" text-anchor="middle" font-weight="400">a[1]</text><line x1="315" y1="780" x2="665" y2="780" stroke="#d17a30" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="795" y1="780" x2="1145" y2="780" stroke="#d17a30" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="490" y="735" font-size="30" fill="#b26122" text-anchor="middle" font-weight="400">第 1 次：+2</text><text xml:space="preserve" x="970" y="735" font-size="30" fill="#b26122" text-anchor="middle" font-weight="400">第 2 次：+2</text><text xml:space="preserve" x="250" y="960" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">下排是同一存储位置随时间的状态；不是三份独立数组。</text></g></svg>
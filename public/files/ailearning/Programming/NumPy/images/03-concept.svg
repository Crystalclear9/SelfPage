<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：A 追踪两个输入记录到同一个缓冲行，再把初始值零、第一次累计二、第二次累计五并排展示</title><desc id="detail-desc">A 追踪两个输入记录到同一个缓冲行，再把初始值零、第一次累计二、第二次累计五并排展示。这里每个贡献必须进入同一存储位置；把临时副本写回同一行并不自动实现这个累计过程。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><circle cx="35" cy="27" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="35" y="34" font-size="22" fill="white" font-weight="700" text-anchor="middle">1</text><text x="60" y="34" font-size="23" fill="#213447" font-weight="600" text-anchor="start">两次贡献指向同一行</text><circle cx="620" cy="27" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="620" y="34" font-size="22" fill="white" font-weight="700" text-anchor="middle">2</text><text x="645" y="34" font-size="23" fill="#213447" font-weight="600" text-anchor="start">逐次写入累计结果</text><rect x="35" y="75" width="220" height="135" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="35" y="75" width="220" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="47" y="100" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">记录 A</text><text x="49" y="142" font-size="22" fill="#213447" font-weight="400" text-anchor="start">index=1</text><text x="49" y="173" font-size="22" fill="#213447" font-weight="400" text-anchor="start">贡献 +2</text><rect x="35" y="265" width="220" height="135" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="35" y="265" width="220" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="47" y="290" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">记录 B</text><text x="49" y="332" font-size="22" fill="#213447" font-weight="400" text-anchor="start">index=1</text><text x="49" y="363" font-size="22" fill="#213447" font-weight="400" text-anchor="start">贡献 +3</text><rect x="410" y="95" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="453.0" y="124" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><rect x="410" y="165" width="86" height="66" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="453.0" y="194" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><rect x="410" y="235" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="453.0" y="264" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><text x="400" y="72" font-size="22" fill="#213447" font-weight="400" text-anchor="start">初始缓冲</text><path d="M262,143 L401,195" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M262,323 L401,208" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="650" y="72" font-size="23" fill="#213447" font-weight="700" text-anchor="start">加 2 后</text><rect x="650" y="95" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="693.0" y="124" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><rect x="650" y="165" width="86" height="66" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="693.0" y="194" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">2</text><rect x="650" y="235" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="693.0" y="264" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><text x="910" y="72" font-size="23" fill="#213447" font-weight="700" text-anchor="start">再加 3 后</text><rect x="910" y="95" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="953.0" y="124" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><rect x="910" y="165" width="86" height="66" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="953.0" y="194" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">5</text><rect x="910" y="235" width="86" height="66" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="953.0" y="264" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">0</text><path d="M506,200 L641,200" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M749,200 L901,200" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="620" y="369" font-size="30" fill="#158476" font-weight="600" text-anchor="start">行 1：0 → 2 → 5</text></g></svg>

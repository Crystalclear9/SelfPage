<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title id="figure-title">重复索引：缓冲写回与逐次累加的结果不同</title><desc id="figure-desc">两个重复索引初始都读零。缓冲增量将两个临时值都改为二，写回同一位置后为二；add.at按两次贡献累加得到四。</desc><rect width="1200" height="660" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">重复索引：缓冲写回与逐次累加的结果不同</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">初始 a=[0,0,0]；索引 [1,1]；每次贡献均为 +2</text><text x="40" y="180" font-size="29" fill="#213447" text-anchor="start" font-weight="600">缓冲增量：a[[1,1]] += 2</text><rect x="40" y="220" width="220" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="150.0" y="266.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">先取值 [0,0]</text><rect x="355" y="220" width="220" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="465.0" y="266.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">临时值 [2,2]</text><rect x="740" y="220" width="420" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="950.0" y="266.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">写回 a[1]：结果为 2</text><path d="M280 258 L330 258" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M595 258 L715 258" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="40" y="385" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">逐次累加：np.add.at(a,[1,1],2)</text><rect x="40" y="425" width="300" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="190.0" y="472.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">a[1]=0</text><rect x="450" y="425" width="300" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="600.0" y="472.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">a[1]=2</text><rect x="860" y="425" width="300" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1010.0" y="472.65" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">a[1]=4</text><path d="M360 463 L425 463" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><path d="M770 463 L835 463" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="40" y="595" font-size="28" fill="#213447" text-anchor="start" font-weight="400">临时副本上的两次 +2，不等于对原存储连续执行两次 +2。</text></g></svg>

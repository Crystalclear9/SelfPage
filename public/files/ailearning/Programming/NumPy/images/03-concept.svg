<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">重复高级索引的写回与散射累加</title>
<desc id="fig-desc">两个实验各从三个零开始。普通高级索引使用临时数组，add.at 对同一位置逐项更新。</desc>
<rect x="0" y="0" width="1200" height="704" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">同一位置收到两条贡献，能否合成四？</text>
<text x="74" y="131" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="start" font-weight="400">a[[1, 1]] += 2</text>
<path d="M75 232 L102 171 L367 171 L340 232 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="221" y="210.25" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[0, 0]</text>
<text x="75" y="275" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">读取同一旧值</text>
<path d="M372 202 L426 202" fill="none" stroke="#a74d3a" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M426 202 L415 207 L415 197 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 232 L467 171 L732 171 L705 232 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="586" y="210.25" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[2, 2]</text>
<text x="440" y="275" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">临时数组加 2</text>
<path d="M737 202 L791 202" fill="none" stroke="#a74d3a" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M791 202 L780 207 L780 197 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M805 232 L832 171 L1097 171 L1070 232 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="951" y="210.25" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[0, 2, 0]</text>
<text x="805" y="275" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">写回同一槽</text>
<path d="M75 331 L1125 331" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="381" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="start" font-weight="400">np.add.at(a, [1, 1], 2)</text>
<path d="M75 482 L102 421 L367 421 L340 482 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="221" y="460.25" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[0, 0, 0]</text>
<text x="75" y="525" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">各自从零开始</text>
<path d="M372 452 L426 452" fill="none" stroke="#166d75" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M426 452 L415 457 L415 447 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 482 L467 421 L732 421 L705 482 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="586" y="460.25" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[0, 2, 0]</text>
<text x="440" y="525" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">第一条 +2</text>
<path d="M737 452 L791 452" fill="none" stroke="#166d75" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M791 452 L780 457 L780 447 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M805 482 L832 421 L1097 421 L1070 482 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="951" y="460.25" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" font-weight="400">[0, 4, 0]</text>
<text x="805" y="525" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">第二条 +2</text>
<text x="74" y="651" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">写回重复目标不执行求和。散射累加把两项都归到原槽。</text>
</svg>

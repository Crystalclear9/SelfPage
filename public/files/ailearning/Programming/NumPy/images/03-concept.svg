ill="#203b4a" text-anchor="middle" font-weight="400">0</text><text x="1320" y="747" font-size="29" fill="#d87332" text-anchor="middle" font-weight="400">第 2 次贡献后</text><text x="805" y="860" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">两条记录都实际更新 a[1]：0 → 2 → 4</text></g></svg>
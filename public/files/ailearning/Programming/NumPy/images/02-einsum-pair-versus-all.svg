<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="815" viewBox="0 0 1360 815" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">收缩一个轴以后，保留哪些行索引</title>
  <desc id="plate-desc">同一对输入，左边保留独立 i、k 得到四种配对，右边共享 i 只取两次同行点积。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="815" fill="white" stroke="none" stroke-width="0"/>
  <text x="445" y="58" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">输入 X</text>
  <rect x="379" y="87" width="66" height="66" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="412" y="130.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <rect x="445" y="87" width="66" height="66" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="478" y="130.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">2</text>
  <rect x="379" y="153" width="66" height="66" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="412" y="196.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">3</text>
  <rect x="445" y="153" width="66" height="66" fill="#cce8e8" stroke="white" stroke-width="1.6"/>
  <text x="478" y="196.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">4</text>
  <text x="919" y="58" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">输入 Y</text>
  <rect x="853" y="87" width="66" height="66" fill="#e7e0f1" stroke="white" stroke-width="1.6"/>
  <text x="886" y="130.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <rect x="919" y="87" width="66" height="66" fill="#e7e0f1" stroke="white" stroke-width="1.6"/>
  <text x="952" y="130.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="853" y="153" width="66" height="66" fill="#e7e0f1" stroke="white" stroke-width="1.6"/>
  <text x="886" y="196.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">0</text>
  <rect x="919" y="153" width="66" height="66" fill="#e7e0f1" stroke="white" stroke-width="1.6"/>
  <text x="952" y="196.56" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <polyline points="82,260 1279,260" fill="none" stroke="#d4e0e4" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="350" y="326" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">保留独立的行索引</text>
  <text x="1017" y="326" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">共用同一个行索引</text>
  <text x="350" y="389" font-size="30" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#196f77" text-anchor="middle">ij,kj → ik</text>
  <text x="1017" y="389" font-size="30" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#655184" text-anchor="middle">ij,ij → i</text>
  <rect x="248" y="437" width="96" height="96" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="296" y="500.36" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">1</text>
  <rect x="344" y="437" width="96" height="96" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="392" y="500.36" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">2</text>
  <rect x="248" y="533" width="96" height="96" fill="#f1f6f7" stroke="white" stroke-width="1.6"/>
  <text x="296" y="596.36" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">3</text>
  <rect x="344" y="533" width="96" height="96" fill="#f4ded6" stroke="white" stroke-width="1.6"/>
  <text x="392" y="596.36" font-size="32" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#202a37" text-anchor="middle">4</text>
  <polygon points="822,511 1186,511 1222,441 858,441" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="1022" y="485.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">1 × 1 + 2 × 0 = 1</text>
  <polygon points="822,623 1186,623 1222,553 858,553" fill="url(#wash-coral)" stroke="#a84b3b" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="1022" y="597.24" font-size="28" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" fill="#a84b3b" text-anchor="middle">3 × 0 + 4 × 1 = 4</text>
  <text x="346" y="705" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">非对角格来自不同编号的两行</text>
  <text x="1019" y="705" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">与左侧珊瑚色对角格一一对应</text>
  <text x="681" y="773" font-size="29" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" fill="#202a37" text-anchor="middle">两种写法都沿特征轴求和，但输出形状不同。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1158.000" height="754.000" viewBox="16.000 49.000 1158.000 754.000" role="img" aria-labelledby="title desc"><title id="title">随机流应绑定任务身份，而不是偶然执行顺序</title><desc id="desc">相加种子跨运行碰撞；结构化种子地址让固定任务在重排和重试后得到相同的伪随机输入。 随机流应绑定任务身份，而不是偶然执行顺序 同一任务重排或重试可保持输入；新独立重复需要另一个有记录的地址。</desc><rect width="1158.0" height="754.0" fill="white" x="16.0" y="49.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="26" fill="#627689" text-anchor="start">把字段相加会丢掉身份；相同整数种子会重建相同的随机流</text><text x="50" y="160" font-size="29" fill="#2865a0" text-anchor="start">运行根种子 100</text><text x="50" y="230" font-size="27" fill="#213447" text-anchor="start">任务 0</text><text x="210" y="230" font-size="27" fill="#2865a0" text-anchor="start">100 + 0</text><text x="390" y="230" font-size="29" fill="#2865a0" text-anchor="start">→ 100</text><text x="50" y="320" font-size="27" fill="#213447" text-anchor="start">任务 1</text><text x="210" y="320" font-size="27" fill="#2865a0" text-anchor="start">100 + 1</text><text x="390" y="320" font-size="29" fill="#c87536" text-anchor="start">→ 101</text><text x="640" y="160" font-size="29" fill="#c87536" text-anchor="start">运行根种子 101</text><text x="640" y="230" font-size="27" fill="#213447" text-anchor="start">任务 0</text><text x="800" y="230" font-size="27" fill="#c87536" text-anchor="start">101 + 0</text><text x="980" y="230" font-size="29" fill="#c87536" text-anchor="start">→ 101</text><text x="640" y="320" font-size="27" fill="#213447" text-anchor="start">任务 1</text><text x="800" y="320" font-size="27" fill="#c87536" text-anchor="start">101 + 1</text><text x="980" y="320" font-size="29" fill="#2865a0" text-anchor="start">→ 102</text><text x="40" y="395" font-size="27" fill="#c87536" text-anchor="start">两次运行中的“100+1”和“101+0”都变成 101，整条流重复。</text><line x1="40" y1="435" x2="1150" y2="435" stroke="#dce5ed" stroke-width="2" /><text x="40" y="490" font-size="29" fill="#2865a0" text-anchor="start">固定地址：[角色编号，任务编号，根种子]</text><text x="45" y="550" font-size="27" fill="#213447" text-anchor="start">提交顺序：10 → 20</text><text x="45" y="615" font-size="26" fill="#2865a0" text-anchor="start">任务 10</text><text x="200" y="615" font-size="27" fill="#213447" text-anchor="start">563, 270, 548</text><text x="45" y="690" font-size="26" fill="#2865a0" text-anchor="start">任务 20</text><text x="200" y="690" font-size="27" fill="#213447" text-anchor="start">492, 280, 960</text><text x="640" y="550" font-size="27" fill="#213447" text-anchor="start">提交顺序：20 → 10</text><text x="640" y="615" font-size="26" fill="#2865a0" text-anchor="start">任务 20</text><text x="795" y="615" font-size="27" fill="#213447" text-anchor="start">492, 280, 960</text><text x="640" y="690" font-size="26" fill="#2865a0" text-anchor="start">任务 10</text><text x="795" y="690" font-size="27" fill="#213447" text-anchor="start">563, 270, 548</text><text x="40" y="775" font-size="24" fill="#627689" text-anchor="start">下方数值：PCG64，根种子 2026，角色 0；每个任务重建后取前三个整数。</text></g></svg>

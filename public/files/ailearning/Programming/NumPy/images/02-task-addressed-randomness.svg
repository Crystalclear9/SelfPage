<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 653" role="img" aria-labelledby="title description">
<title id="title">简单相加种子的身份碰撞与任务地址在重排后的稳定输出</title>
<desc id="description">简单相加把不同的根和任务折叠成相同种子。结构化地址按角色、任务、根种子区分，改变执行顺序时同一任务仍取得相同序列。</desc>
<defs>
<linearGradient id="wash-t" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cae6e8"/></linearGradient>
<linearGradient id="wash-c" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#fff5f2"/><stop offset="1" stop-color="#f1d2ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f9f6fc"/><stop offset="1" stop-color="#e9deef"/></linearGradient>
<linearGradient id="wash-g" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f3f9f4"/><stop offset="1" stop-color="#d5e9da"/></linearGradient>
<linearGradient id="wash-n" x1="0" x2="0.92" y1="0" y2="1"><stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#e8edf1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="653" fill="white" stroke="none" stroke-width="1.7" rx="0"/>
<text x="597" y="62" fill="#202a36" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">相加会把两个地址压成一个整数</text>
<path d="M79 170l25 -56h184l-25 56Z" stroke="#526577" stroke-width="1.7" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="184" y="151" fill="#202a36" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">100 + 1</text>
<path d="M285 143L483.226 183.783" stroke="#526577" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M494 186L481.496 177.302L479.078 189.056Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M79 264l25 -56h184l-25 56Z" stroke="#526577" stroke-width="1.7" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="184" y="245" fill="#202a36" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">101 + 0</text>
<path d="M285 237L483.314 188.608" stroke="#526577" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M494 186L478.977 183.49L481.821 195.148Z" stroke="#526577" stroke-width="1" fill="#526577" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M511 218l25 -66h174l-25 66Z" stroke="#a64635" stroke-width="1.7" fill="url(#wash-c)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="609" y="195" fill="#a64635" font-size="31" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">seed 101</text>
<path d="M717 186L851 186" stroke="#a64635" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M862 186L848 180L848 192Z" stroke="#a64635" stroke-width="1" fill="#a64635" stroke-linecap="round" stroke-linejoin="round"/>
<text x="975" y="195" fill="#a64635" font-size="31" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">相同随机流</text>
<path d="M69 304L1124 304" stroke="#dce7e9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="601" y="359" fill="#202a36" font-size="34" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">把三个字段保留在固定位置</text>
<rect x="107" y="405" width="101" height="53" fill="url(#wash-t)" stroke="#176b74" stroke-width="1.6" rx="4"/>
<text x="157" y="441" fill="#176b74" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<rect x="222" y="405" width="101" height="53" fill="url(#wash-t)" stroke="#176b74" stroke-width="1.6" rx="4"/>
<text x="272" y="441" fill="#176b74" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">10</text>
<rect x="337" y="405" width="101" height="53" fill="url(#wash-t)" stroke="#176b74" stroke-width="1.6" rx="4"/>
<text x="387" y="441" fill="#176b74" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2026</text>
<path d="M451 432L575 432" stroke="#176b74" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M586 432L572 426L572 438Z" stroke="#176b74" stroke-width="1" fill="#176b74" stroke-linecap="round" stroke-linejoin="round"/>
<text x="701" y="441" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">SeedSequence</text>
<path d="M813 432L884 432" stroke="#176b74" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M895 432L881 426L881 438Z" stroke="#176b74" stroke-width="1" fill="#176b74" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1027" y="441" fill="#176b74" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">563, 270, 548</text>
<rect x="107" y="490" width="101" height="53" fill="url(#wash-v)" stroke="#67517d" stroke-width="1.6" rx="4"/>
<text x="157" y="526" fill="#67517d" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">0</text>
<rect x="222" y="490" width="101" height="53" fill="url(#wash-v)" stroke="#67517d" stroke-width="1.6" rx="4"/>
<text x="272" y="526" fill="#67517d" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">20</text>
<rect x="337" y="490" width="101" height="53" fill="url(#wash-v)" stroke="#67517d" stroke-width="1.6" rx="4"/>
<text x="387" y="526" fill="#67517d" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">2026</text>
<path d="M451 517L575 517" stroke="#67517d" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M586 517L572 511L572 523Z" stroke="#67517d" stroke-width="1" fill="#67517d" stroke-linecap="round" stroke-linejoin="round"/>
<text x="701" y="526" fill="#526577" font-size="25" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">SeedSequence</text>
<path d="M813 517L884 517" stroke="#67517d" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M895 517L881 511L881 523Z" stroke="#67517d" stroke-width="1" fill="#67517d" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1027" y="526" fill="#67517d" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">492, 280, 960</text>
<text x="155" y="393" fill="#526577" font-size="25" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">角色</text>
<text x="272" y="393" fill="#526577" font-size="25" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">任务</text>
<text x="387" y="393" fill="#526577" font-size="25" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">根种子</text>
<text x="330" y="614" fill="#67517d" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">10 → 20   或   20 → 10</text>
<text x="847" y="614" fill="#526577" font-size="27" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">执行顺序改变，同一任务的输出保持</text>
</svg>

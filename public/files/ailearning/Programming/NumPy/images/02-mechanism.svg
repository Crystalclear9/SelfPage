<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"><rect width="1280" height="880" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="58" font-size="36" fill="#17334b">先保留得分差，再计算概率与对数概率</text><text x="40" y="110" font-size="27" fill="#52677a">同一行得分 [1000, 1001, 999]；共同减去最大值 1001</text><text x="60" y="185" font-size="30" fill="#17334b">类别</text><text x="220" y="185" font-size="30" fill="#17334b">原得分</text><text x="450" y="185" font-size="30" fill="#17334b">平移后</text><text x="670" y="185" font-size="30" fill="#17334b">指数</text><text x="950" y="185" font-size="30" fill="#17334b">概率</text><text x="60" y="272" font-size="30" fill="#2474b5">0</text><text x="220" y="272" font-size="30" fill="#2474b5">1000</text><text x="450" y="272" font-size="30" fill="#2474b5">-1</text><text x="670" y="272" font-size="30" fill="#2474b5">0.367879</text><rect x="950" y="240" width="85.655" height="45" fill="#2474b5" opacity=".18"/><text x="960" y="272" font-size="30" fill="#2474b5">0.244728</text><text x="60" y="365" font-size="30" fill="#168578">1</text><text x="220" y="365" font-size="30" fill="#168578">1001</text><text x="450" y="365" font-size="30" fill="#168578">0</text><text x="670" y="365" font-size="30" fill="#168578">1.000000</text><rect x="950" y="333" width="232.834" height="45" fill="#168578" opacity=".18"/><text x="960" y="365" font-size="30" fill="#168578">0.665241</text><text x="60" y="458" font-size="30" fill="#d5752e">2</text><text x="220" y="458" font-size="30" fill="#d5752e">999</text><text x="450" y="458" font-size="30" fill="#d5752e">-2</text><text x="670" y="458" font-size="30" fill="#d5752e">0.135335</text><rect x="950" y="426" width="31.511" height="45" fill="#d5752e" opacity=".18"/><text x="960" y="458" font-size="30" fill="#d5752e">0.090031</text><text x="60" y="530" font-size="29" fill="#17334b">归一化分母 ≈ 1.503215；三类概率之和为 1。</text><path d="M40 565 H1240" stroke="#d8e1e8" stroke-width="2"/><text x="60" y="620" font-size="31" fill="#17334b">另一个极端例子：[0, −1000]</text><text x="60" y="680" font-size="28" fill="#17334b">float64 概率</text><text x="500" y="680" font-size="31" fill="#d5752e">[1, 0]</text><text x="60" y="740" font-size="28" fill="#17334b">先概率再取 log</text><text x="500" y="740" font-size="31" fill="#d5752e">[0, −∞]</text><text x="60" y="800" font-size="28" fill="#17334b">直接算 log-softmax</text><text x="500" y="800" font-size="31" fill="#168578">[0, −1000]</text><text x="880" y="738" font-size="27" fill="#52677a">0 是指数下溢</text><text x="880" y="798" font-size="27" fill="#168578">对数值仍可表示</text></g></svg>
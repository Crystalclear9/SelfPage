<svg xmlns="http://www.w3.org/2000/svg" width="1066.000" height="610.000" viewBox="16.000 0.000 1066.000 610.000" role="img" aria-labelledby="title desc"><title id="title">softmax 的平移与归一化</title><desc id="desc">得分1000,1001,999减去1001，得到-1,0,-2。指数0.367879,1,0.135335归一化后0.244728,0.665241,0.090031。 </desc><rect width="1066.0" height="610.0" fill="white" x="16.0" y="0.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="40" y="45" fill="#23384b" font-size="28" text-anchor="start" font-weight="400">同一得分行：[1000, 1001, 999]；统一减去 1001</text><text x="40" y="110" fill="#23384b" font-size="28" text-anchor="start" font-weight="600">平移后的相对位置</text><line x1="135" y1="205" x2="1050" y2="205" stroke="#7b8a96" stroke-width="2" marker-end="url(#g)" /><circle cx="560" cy="205" r="10" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="560" y="170" fill="#23384b" font-size="26" text-anchor="middle" font-weight="400">类别 0</text><text x="560" y="247" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">-1</text><circle cx="940" cy="205" r="10" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="940" y="170" fill="#23384b" font-size="26" text-anchor="middle" font-weight="400">类别 1</text><text x="940" y="247" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">0</text><circle cx="180" cy="205" r="10" fill="#c66e30" stroke="#c66e30" stroke-width="2" /><text x="180" y="170" fill="#23384b" font-size="26" text-anchor="middle" font-weight="400">类别 2</text><text x="180" y="247" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">-2</text><text x="40" y="315" fill="#23384b" font-size="28" text-anchor="start" font-weight="600">指数后按总量归一化</text><rect x="145" y="365" width="220.25562394931788" height="75" fill="#24679c" stroke="#24679c" stroke-width="1.5" rx="3" /><text x="255.12781197465893" y="410" fill="white" font-size="30" text-anchor="middle" font-weight="400">0</text><text x="255.12781197465893" y="485" fill="#24679c" font-size="26" text-anchor="middle" font-weight="400">0.244728</text><rect x="365.25562394931785" y="365" width="598.7168601973397" height="75" fill="#42908e" stroke="#42908e" stroke-width="1.5" rx="3" /><text x="664.6140540479877" y="410" fill="white" font-size="30" text-anchor="middle" font-weight="400">1</text><text x="664.6140540479877" y="485" fill="#42908e" font-size="26" text-anchor="middle" font-weight="400">0.665241</text><rect x="963.9724841466575" y="365" width="81.02751585334242" height="75" fill="#c66e30" stroke="#c66e30" stroke-width="1.5" rx="3" /><text x="1004.4862420733288" y="410" fill="white" font-size="30" text-anchor="middle" font-weight="400">2</text><text x="1004.4862420733288" y="485" fill="#c66e30" font-size="26" text-anchor="middle" font-weight="400">0.090031</text><text x="145" y="535" fill="#23384b" font-size="28" text-anchor="start" font-weight="400">指数总量 1.503215；条形总宽表示概率 1</text><text x="40" y="590" fill="#23384b" font-size="28" text-anchor="start" font-weight="400">平移保留相对得分；每个指数除以同一个分母，概率之和才为 1。</text></g></svg>

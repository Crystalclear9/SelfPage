<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="528.16" viewBox="4.02 0.00 1161.96 511.42" role="img"><title id="figure-title">稳定 softmax：整体平移，再归一化</title><desc id="figure-desc">两项 logits 同减最大值 1001，变为 −1 与 0；指数约为 0.367879 与 1，除以总和后得到约 0.268941 与 0.731059。图中小数为显示近似。共同平移消去同一个比例因子，因此在有限实数定义下保持 softmax 概率；全为负无穷等退化输入仍需单独处理。</desc><rect x="0" y="0" width="1200" height="545" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">稳定 softmax：整体平移，再归一化</text><text x="35" y="130" font-size="25" fill="#2865a0" text-anchor="start" font-weight="600">原 logits</text><rect x="35" y="190" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="142.5" y="237.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1000</text><rect x="35" y="290" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="142.5" y="337.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1001</text><path d="M262 275 L317 275" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="330" y="130" font-size="25" fill="#2865a0" text-anchor="start" font-weight="600">减去最大值 1001</text><rect x="330" y="190" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="437.5" y="237.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">−1</text><rect x="330" y="290" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="437.5" y="337.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><path d="M557 275 L612 275" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="625" y="130" font-size="25" fill="#2865a0" text-anchor="start" font-weight="600">逐项取指数</text><rect x="625" y="190" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="732.5" y="237.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.368</text><rect x="625" y="290" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="732.5" y="337.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">1</text><path d="M852 275 L907 275" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="920" y="130" font-size="25" fill="#2865a0" text-anchor="start" font-weight="600">除以指数总和</text><rect x="920" y="190" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1027.5" y="237.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.269</text><rect x="920" y="290" width="215" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1027.5" y="337.5" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">0.731</text><text x="35" y="470" font-size="27" fill="#213447" text-anchor="start" font-weight="400">概率相同；中间指数从 exp(1000) 变成 exp(−1)，避免直接上溢。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">最小二乘的残差与列空间正交</title><desc id="desc">令设计矩阵只有一列 (1,1)，响应为 (1,2)。最小二乘系数为 1.5，拟合向量为 (1.5,1.5)，残差为 (−0.5,0.5)。残差与设计列的内积为零，说明拟合是在列空间上作正交投影。 图使用欧氏平方损失且列向量非零。正规方程表达最优条件，但直接构造逆矩阵不一定数值稳定；秩亏或加权最小二乘时还需相应修改几何与求解方法。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#268d8c" /></marker><marker id="tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#d67c47" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">最小二乘的残差与列空间正交</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">欧氏最小二乘且无额外约束时，残差正交于设计矩阵列空间。</text><text x="150" y="625" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="120" y="607" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><text x="270" y="625" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="120" y="487" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><text x="390" y="625" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="120" y="367" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">2</text><text x="510" y="625" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="120" y="247" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">3</text><path d="M150,600 L550,600" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,600 L150,200" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,600 L500,250" stroke="#9bcac1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,600 L270,360" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,600 L330,420" stroke="#268d8c" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round" /><path d="M330,420 L270,360" stroke="#d67c47" stroke-width="3" fill="none" marker-end="url(#tip-d67c47)" stroke-linecap="round" stroke-linejoin="round" /><text x="265" y="332" font-size="24" fill="#507db3" text-anchor="end" font-weight="400">y=(1,2)</text><text x="350" y="460" font-size="24" fill="#268d8c" text-anchor="start" font-weight="400">拟合=(1.5,1.5)</text><text x="760" y="245" font-size="26" fill="#20384f" text-anchor="start" font-weight="400">列空间：沿 (1,1) 的直线</text><text x="760" y="335" font-size="26" fill="#d67c47" text-anchor="start" font-weight="400">残差：(−0.5,0.5)</text><text x="760" y="425" font-size="26" fill="#20384f" text-anchor="start" font-weight="400">与 (1,1) 的内积 = 0</text><text x="160" y="685" font-size="23" fill="#5c7185" text-anchor="start" font-weight="400">垂直的是残差与列空间，不是原响应 y 与拟合向量。</text><path d="M341.31 408.69 L330 397.37 L318.69 408.69" stroke="#658d98" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1209.2293" viewBox="0 0 1440 1209.2293" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">最小二乘的残差与列空间正交</title><rect width="1440" height="1209.2293" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">最小二乘的残差与列空间正交</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1067.2293" viewBox="0 0 1440 1143.46" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>最小二乘的残差与列空间正交</title><svg width="1440" height="693.465" viewBox="85.047 177.201 974.200 469.148" role="img" aria-labelledby="title desc"><rect width="974.2" height="469.148" fill="white" data-white-background="true" x="85.047" y="177.201"/><title id="title">最小二乘的残差与列空间正交</title><desc id="desc">令设计矩阵只有一列 (1,1)，响应为 (1,2)。最小二乘系数为 1.5，拟合向量为 (1.5,1.5)，残差为 (−0.5,0.5)。残差与设计列的内积为零，说明拟合是在列空间上作正交投影。 图使用欧氏平方损失且列向量非零。正规方程表达最优条件，但直接构造逆矩阵不一定数值稳定；秩亏或加权最小二乘时还需相应修改几何与求解方法。 欧氏最小二乘且无额外约束时，残差正交于设计矩阵列空间。 最小二乘的残差与列空间正交 垂直的是残差与列空间，不是原响应 y 与拟合向量。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#538abe"/></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#538abe"/></marker><marker id="tip-268d8c" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#2472b1"/></marker><marker id="tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c57439"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="625" font-size="24" fill="#617f97" text-anchor="middle" font-weight="400">0</text><text x="120" y="607" font-size="24" fill="#617f97" text-anchor="end" font-weight="400">0</text><text x="270" y="625" font-size="24" fill="#617f97" text-anchor="middle" font-weight="400">1</text><text x="120" y="487" font-size="24" fill="#617f97" text-anchor="end" font-weight="400">1</text><text x="390" y="625" font-size="24" fill="#617f97" text-anchor="middle" font-weight="400">2</text><text x="120" y="367" font-size="24" fill="#617f97" text-anchor="end" font-weight="400">2</text><text x="510" y="625" font-size="24" fill="#617f97" text-anchor="middle" font-weight="400">3</text><text x="120" y="247" font-size="24" fill="#617f97" text-anchor="end" font-weight="400">3</text><path d="M150,600 L550,600" stroke="#538abe" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,600 L150,200" stroke="#538abe" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,600 L500,250" stroke="#97cece" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,600 L270,360" stroke="#538abe" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,600 L330,420" stroke="#2472b1" stroke-width="3" fill="none" marker-end="url(#tip-268d8c)" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,420 L270,360" stroke="#c57439" stroke-width="3" fill="none" marker-end="url(#tip-d67c47)" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="332" font-size="24" fill="#538abe" text-anchor="end" font-weight="400">y=(1,2)</text><text x="350" y="460" font-size="24" fill="#2472b1" text-anchor="start" font-weight="400">拟合=(1.5,1.5)</text><text x="760" y="245" font-size="26" fill="#1f3449" text-anchor="start" font-weight="400">列空间：沿 (1,1) 的直线</text><text x="760" y="335" font-size="26" fill="#c57439" text-anchor="start" font-weight="400">残差：(−0.5,0.5)</text><text x="760" y="425" font-size="26" fill="#1f3449" text-anchor="start" font-weight="400">与 (1,1) 的内积 = 0</text><path d="M341.31 408.69 L330 397.37 L318.69 408.69" stroke="#6694a4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 693.465) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">把正交关系算成一个标量：沿列方向再动也不会一阶改善</text><text x="65" y="130" font-size="30" fill="#1d3145" text-anchor="start">X = (1,1)^T； y = (1,2)^T；拟合参数 θ = 1.5</text><rect x="80" y="185" width="142" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="151.0" y="224" font-size="28" fill="#c66d3a" text-anchor="middle">-0.5</text><rect x="230" y="185" width="142" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="301.0" y="224" font-size="28" fill="#c66d3a" text-anchor="middle">0.5</text><text x="80" y="165" font-size="28" fill="#c66d3a" text-anchor="start">残差 r = y−Xθ</text><text x="490" y="230" font-size="32" fill="#1e7499" text-anchor="start">X^Tr = −0.5 + 0.5 = 0</text><text x="65" y="325" font-size="31" fill="#1d3145" text-anchor="start">J(θ) = ½[(1−θ)²+(2−θ)²] = (θ−1.5)² + 0.25</text><text x="65" y="397" font-size="29" fill="#1d3145" text-anchor="start">θ = 1.5 + δ：目标只增加 δ²；残差非零，并不意味着梯度非零。</text></g></g></svg></svg>

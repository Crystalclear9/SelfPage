<svg xmlns="http://www.w3.org/2000/svg" width="1086.000" height="534.000" viewBox="16.000 49.000 1086.000 534.000" role="img" aria-labelledby="title desc"><title id="title">把索引反向传播写成一张线性映射</title><desc id="desc">同一索引0被读取两次。平方损失的残差为1、负2和3，转置映射将前两条贡献相加得到参数梯度负1、0、3。 把索引反向传播写成一张线性映射 方向检验：输入扰动 [1, 2, −1]，两边内积都等于 −4。</desc><rect width="1086.0" height="534.0" fill="white" x="16.0" y="49.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="95" font-size="26" fill="#627689" text-anchor="start">索引 [0,0,2]；平方损失 L = ½‖Gx − t‖²</text><text x="70" y="155" font-size="28" fill="#2865a0" text-anchor="start">读取矩阵 G</text><rect x="70" y="185" width="65" height="60" fill="#2865a0" opacity="0.15" rx="3" /><text x="102" y="225" font-size="29" fill="#213447" text-anchor="middle">1</text><rect x="145" y="185" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="177" y="225" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="220" y="185" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="252" y="225" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="70" y="255" width="65" height="60" fill="#2865a0" opacity="0.15" rx="3" /><text x="102" y="295" font-size="29" fill="#213447" text-anchor="middle">1</text><rect x="145" y="255" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="177" y="295" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="220" y="255" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="252" y="295" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="70" y="325" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="102" y="365" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="145" y="325" width="65" height="60" fill="#2865a0" opacity="0.035" rx="3" /><text x="177" y="365" font-size="29" fill="#213447" text-anchor="middle">0</text><rect x="220" y="325" width="65" height="60" fill="#2865a0" opacity="0.15" rx="3" /><text x="252" y="365" font-size="29" fill="#213447" text-anchor="middle">1</text><text x="345" y="220" font-size="28" fill="#213447" text-anchor="start">x = [2, 3, 5]</text><text x="345" y="280" font-size="28" fill="#2865a0" text-anchor="start">Gx = [2, 2, 5]</text><text x="345" y="340" font-size="27" fill="#213447" text-anchor="start">目标 t = [1, 4, 2]</text><text x="770" y="155" font-size="28" fill="#c87536" text-anchor="start">反向：每条残差送回来源</text><text x="770" y="215" font-size="29" fill="#c87536" text-anchor="start">+1</text><line x1="825" y1="207" x2="1010" y2="245" stroke="#c87536" stroke-width="3" /><text x="770" y="285" font-size="29" fill="#c87536" text-anchor="start">-2</text><line x1="825" y1="277" x2="1010" y2="245" stroke="#c87536" stroke-width="3" /><text x="770" y="355" font-size="29" fill="#c87536" text-anchor="start">+3</text><line x1="825" y1="347" x2="1010" y2="350" stroke="#c87536" stroke-width="3" /><text x="1030" y="253" font-size="29" fill="#c87536" text-anchor="start">−1</text><text x="1030" y="306" font-size="29" fill="#627689" text-anchor="start">0</text><text x="1030" y="358" font-size="29" fill="#c87536" text-anchor="start">3</text><text x="70" y="445" font-size="30" fill="#c87536" text-anchor="start">梯度 = G 的转置 × 残差 = [−1, 0, 3]</text><text x="70" y="500" font-size="27" fill="#213447" text-anchor="start">第二个参数未被读取，因此梯度为 0。</text><text x="70" y="555" font-size="27" fill="#213447" text-anchor="start">两次读取同一参数：+1 与 −2 相加；不能覆盖或去重。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1486.36" viewBox="0 0 1440 1486.36" role="img"><title>转置和重塑通过不同索引访问同一连续缓冲区</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1036.36" viewBox="0 0 1320 950" role="img"><title>转置和重塑通过不同索引访问同一连续缓冲区</title><rect width="1320" height="950" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="60" font-size="34" fill="#176b91" text-anchor="start" font-weight="400">X = arange(6).reshape(2, 3)</text><text x="60" y="120" font-size="28" fill="#203b4a" text-anchor="start" font-weight="400">连续缓冲区：元素偏移</text><text x="340" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">0</text><rect x="280" y="180" width="120" height="78" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="340" y="230" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">0</text><text x="485" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">1</text><rect x="425" y="180" width="120" height="78" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="485" y="230" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">1</text><text x="630" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">2</text><rect x="570" y="180" width="120" height="78" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="630" y="230" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">2</text><text x="775" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">3</text><rect x="715" y="180" width="120" height="78" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="775" y="230" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">3</text><text x="920" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">4</text><rect x="860" y="180" width="120" height="78" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="920" y="230" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">4</text><text x="1065" y="158" font-size="26" fill="#80929d" text-anchor="middle" font-weight="400">5</text><rect x="1005" y="180" width="120" height="78" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="1065" y="230" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">5</text><text x="60" y="315" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">同一个元素 1</text><text x="120" y="390" font-size="34" fill="#176b91" text-anchor="start" font-weight="400">T = X.T</text><text x="120" y="438" font-size="27" fill="#80929d" text-anchor="start" font-weight="400">元素步长 (1, 3)</text><rect x="120" y="475" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="176" y="525" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">0</text><rect x="240" y="475" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="296" y="525" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">3</text><rect x="120" y="560" width="112" height="76" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="176" y="610" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">1</text><rect x="240" y="560" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="296" y="610" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">4</text><rect x="120" y="645" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="176" y="695" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">2</text><rect x="240" y="645" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="296" y="695" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">5</text><text x="820" y="390" font-size="34" fill="#176b91" text-anchor="start" font-weight="400">R = X.reshape(3, 2)</text><text x="820" y="438" font-size="27" fill="#80929d" text-anchor="start" font-weight="400">元素步长 (2, 1)</text><rect x="820" y="475" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="876" y="525" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">0</text><rect x="940" y="475" width="112" height="76" rx="4" fill="#fff1e5" stroke="#d87332" stroke-width="2"/><text x="996" y="525" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">1</text><rect x="820" y="560" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="876" y="610" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">2</text><rect x="940" y="560" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="996" y="610" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">3</text><rect x="820" y="645" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="876" y="695" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">4</text><rect x="940" y="645" width="112" height="76" rx="4" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><text x="996" y="695" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">5</text><path d="M115 598 L80 598 L80 345 L485 345 L485 265" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><path d="M1058 513 L1240 513 L1240 345 L485 345" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="120" y="815" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">T[1, 0] → 偏移 1</text><text x="820" y="815" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">R[0, 1] → 偏移 1</text><text x="660" y="895" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">X[0, 1] = 9  →  T[1, 0] = R[0, 1] = 9</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1036.36) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">相同形状并不能给出相同坐标：直接读取两个反例</text><text x="65" y="125" font-size="30" fill="#203742" text-anchor="start">T = X.T；R = X.reshape(3,2)</text><rect x="80" y="180" width="192" height="58" fill="#edf5f8" stroke="#216c89"/><text x="176.0" y="219" font-size="28" fill="#216c89" text-anchor="middle">T[1,0]</text><rect x="280" y="180" width="192" height="58" fill="#edf5f8" stroke="#216c89"/><text x="376.0" y="219" font-size="28" fill="#216c89" text-anchor="middle">1</text><rect x="790" y="180" width="192" height="58" fill="#fff1e7" stroke="#c96937"/><text x="886.0" y="219" font-size="28" fill="#c96937" text-anchor="middle">R[1,0]</text><rect x="990" y="180" width="192" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1086.0" y="219" font-size="28" fill="#c96937" text-anchor="middle">2</text><text x="70" y="305" font-size="30" fill="#216c89" text-anchor="start">T：偏移 = 1×1 + 0×3 = 1</text><text x="760" y="305" font-size="30" fill="#c96937" text-anchor="start">R：偏移 = 1×2 + 0×1 = 2</text><text x="65" y="395" font-size="28" fill="#203742" text-anchor="start">两者同为 (3,2)，同一坐标却读取不同元素；不能用形状相同证明结果等价。</text></g></g></svg>

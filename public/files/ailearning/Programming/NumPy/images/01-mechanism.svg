<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1168.000" height="632.000" viewBox="16.000 62.000 1168.000 632.000" role="img"><title id="figure-title">转置与重塑：索引映射和存储共享分别核对</title><desc id="figure-desc">在连续二乘三数组中，转置和C顺序重塑得到不同索引映射；本例都共享源存储，源位置零一修改会映射到不同输出位置。 转置与重塑：索引映射和存储共享分别核对 两者在本例都共享源存储；一般 reshape 是否复制须另查。</desc><rect width="1168.0" height="632.0" fill="white" x="16.0" y="62.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="110" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一 C 连续数组：X=arange(6).reshape(2,3)</text><rect x="470" y="145" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="510.0" y="185.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="558" y="145" width="80" height="62" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="598.0" y="185.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">1</text><rect x="646" y="145" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="686.0" y="185.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="470" y="215" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="510.0" y="255.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><rect x="558" y="215" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="598.0" y="255.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">4</text><rect x="646" y="215" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="686.0" y="255.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">5</text><text x="85" y="335" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">T = X.T</text><text x="735" y="335" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">R = X.reshape(3,2)</text><path d="M440 260 L290 350" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M755 260 L855 300" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="85" y="370" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="125.0" y="410.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="173" y="370" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="213.0" y="410.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><rect x="85" y="440" width="80" height="62" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="125.0" y="480.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">1</text><rect x="173" y="440" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="213.0" y="480.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">4</text><rect x="85" y="510" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="125.0" y="550.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="173" y="510" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="213.0" y="550.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">5</text><rect x="735" y="370" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="775.0" y="410.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">0</text><rect x="823" y="370" width="80" height="62" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="863.0" y="410.45" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">1</text><rect x="735" y="440" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="775.0" y="480.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><rect x="823" y="440" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="863.0" y="480.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">3</text><rect x="735" y="510" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="775.0" y="550.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">4</text><rect x="823" y="510" width="80" height="62" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="863.0" y="550.45" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">5</text><text x="285" y="440" font-size="26" fill="#213447" text-anchor="start" font-weight="400">索引 1</text><text x="285" y="485" font-size="27" fill="#2865a0" text-anchor="start" font-weight="400">到 (1,0)</text><text x="950" y="440" font-size="26" fill="#213447" text-anchor="start" font-weight="400">索引 1</text><text x="950" y="485" font-size="27" fill="#c87536" text-anchor="start" font-weight="400">仍在 (0,1)</text><line x1="40" y1="620" x2="1160" y2="620" stroke="#cbd9e4" stroke-width="2" /><text x="40" y="665" font-size="28" fill="#213447" text-anchor="start" font-weight="400">本例只改 X[0,1]=9：T[1,0] 与 R[0,1] 都变成 9</text></g></svg>

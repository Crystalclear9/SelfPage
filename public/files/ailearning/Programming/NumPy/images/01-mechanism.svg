<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">转置改变索引映射，重塑遵循遍历顺序</title><desc id="desc">从按行排列的六个数开始，转置把新索引 (i,j) 映射回旧索引 (j,i)，而按 C 顺序重塑先沿原数组的逻辑遍历顺序读取，再填入新形状。两者虽然都得到 3×2，但数值位置不同。 表展示数值语义；是否共享存储还取决于步幅和连续性，不能仅凭形状相同判断是否发生复制。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="530" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="355.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">转置改变索引映射，重塑遵循遍历顺序</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">按 C 顺序读出元素再重塑；转置则交换坐标轴。</text><rect x="60.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">操作</text><rect x="330.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">第 0 行</text><rect x="600.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">第 1 行</text><rect x="870.0" y="165" width="270.0" height="65" fill="#e2edf5" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="20" fill="#20384f" text-anchor="start" font-weight="400">第 2 行</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">原数组 2×3</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">0, 1, 2</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">3, 4, 5</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">—</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">转置 3×2</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">0, 3</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">1, 4</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2, 5</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">C 顺序 reshape(3,2)</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">0, 1</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">2, 3</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">4, 5</text></g></svg>

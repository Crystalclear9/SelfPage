<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：A 左侧把 x=(0,2) 与 y=(2,0) 放到同一坐标系，用直角边 −2 与 2 复算距离平方八；右侧把这个结果定位到完整距离表 D[1,2]</title><desc id="detail-desc">A 左侧把 x=(0,2) 与 y=(2,0) 放到同一坐标系，用直角边 −2 与 2 复算距离平方八；右侧把这个结果定位到完整距离表 D[1,2]。因此几何距离、矩阵元素和范数内积公式之间可以逐项对应。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="60" y1="350.0" x2="460" y2="350.0" stroke="#cbd9e4" stroke-width="1" /><text x="48" y="356.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">0</text><line x1="60" y1="238.0" x2="460" y2="238.0" stroke="#cbd9e4" stroke-width="1" /><text x="48" y="244.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">1</text><line x1="60" y1="126.0" x2="460" y2="126.0" stroke="#cbd9e4" stroke-width="1" /><text x="48" y="132.0" font-size="22" fill="#627689" font-weight="400" text-anchor="end">2</text><line x1="60" y1="350" x2="460" y2="350" stroke="#627689" stroke-width="1.6" /><line x1="60" y1="70" x2="60" y2="350" stroke="#627689" stroke-width="1.6" /><line x1="60.0" y1="350.0" x2="60.0" y2="355.0" stroke="#627689" stroke-width="2" /><text x="60.0" y="376.0" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">0</text><line x1="220.0" y1="350.0" x2="220.0" y2="355.0" stroke="#627689" stroke-width="2" /><text x="220.0" y="376.0" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">1</text><line x1="380.0" y1="350.0" x2="380.0" y2="355.0" stroke="#627689" stroke-width="2" /><text x="380.0" y="376.0" font-size="22" fill="#627689" font-weight="400" text-anchor="middle">2</text><circle cx="60.0" cy="126.0" r="7" fill="#2865a0" stroke="white" stroke-width="2" /><text x="76.0" y="114.0" font-size="23" fill="#2865a0" font-weight="400" text-anchor="start">x=(0,2)</text><circle cx="380.0" cy="350.0" r="7" fill="#cf7432" stroke="white" stroke-width="2" /><text x="396.0" y="338.0" font-size="23" fill="#cf7432" font-weight="400" text-anchor="start">y=(2,0)</text><line x1="60.0" y1="126.0" x2="380.0" y2="350.0" stroke="#2865a0" stroke-width="3" /><line x1="60.0" y1="126.0" x2="380.0" y2="126.0" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 5" /><line x1="380.0" y1="126.0" x2="380.0" y2="350.0" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="5 5" /><text x="170" y="165" font-size="22" fill="#2865a0" font-weight="400" text-anchor="start">Δx = −2，Δy = 2</text><text x="592" y="33" font-size="25" fill="#213447" font-weight="700" text-anchor="start">全体距离平方 D：2 × 3</text><rect x="590" y="72" width="136" height="72" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="658.0" y="101" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">1</text><rect x="730" y="72" width="136" height="72" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="798.0" y="101" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">1</text><rect x="870" y="72" width="136" height="72" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="938.0" y="101" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">1</text><rect x="590" y="148" width="136" height="72" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="658.0" y="177" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">4</text><rect x="730" y="148" width="136" height="72" rx="4" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="798.0" y="177" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">2</text><rect x="870" y="148" width="136" height="72" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="938.0" y="177" font-size="23" fill="#213447" font-weight="400" text-anchor="middle">8</text><text x="590" y="285" font-size="24" fill="#213447" font-weight="700" text-anchor="start">一个输出格的两种复算</text><text x="590" y="332" font-size="27" fill="#cf7432" font-weight="600" text-anchor="start">(−2)² + 2² = 8</text><text x="590" y="377" font-size="22" fill="#213447" font-weight="400" text-anchor="start">‖x‖² + ‖y‖² − 2〈x,y〉 = 4+4−0</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="857.6096" viewBox="0 0 1440 857.6096" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">矩阵乘法避免三维距离临时量</title><rect width="1440" height="857.6096" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">矩阵乘法避免三维距离临时量</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="715.6096" viewBox="13.867 57.61 1088 579.303" role="img" x="48" y="106" overflow="hidden"><title>两两距离表的每一格，都对应平面上的一对点</title><rect width="1088.0" height="579.303" fill="white" x="13.867" y="57.61"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="104" font-size="25" fill="#698695" text-anchor="start">查询 X 有 2 行，中心 Y 有 3 行；右表行对应 X，列对应 Y。</text><line x1="130" y1="570" x2="526.0" y2="570" stroke="#e0e4eb" stroke-width="2" stroke-dasharray=""/><text x="130" y="610" font-size="24" fill="#698695" text-anchor="middle">0</text><text x="100" y="578" font-size="24" fill="#698695" text-anchor="end">0</text><line x1="130" y1="405" x2="526.0" y2="405" stroke="#e0e4eb" stroke-width="2" stroke-dasharray=""/><text x="295" y="610" font-size="24" fill="#698695" text-anchor="middle">1</text><text x="100" y="413" font-size="24" fill="#698695" text-anchor="end">1</text><line x1="130" y1="240" x2="526.0" y2="240" stroke="#e0e4eb" stroke-width="2" stroke-dasharray=""/><text x="460" y="610" font-size="24" fill="#698695" text-anchor="middle">2</text><text x="100" y="248" font-size="24" fill="#698695" text-anchor="end">2</text><line x1="130" y1="570" x2="526.0" y2="570" stroke="#698695" stroke-width="2" stroke-dasharray=""/><line x1="130" y1="570" x2="130" y2="174.0" stroke="#698695" stroke-width="2" stroke-dasharray=""/><circle cx="295" cy="570" r="8" fill="#247094"/><text x="295" y="550" font-size="29" fill="#247094" text-anchor="start">X[0]</text><circle cx="130" cy="240" r="8" fill="#247094"/><text x="155" y="230" font-size="29" fill="#247094" text-anchor="start">X[1]</text><circle cx="130" cy="570" r="8" fill="#af602e"/><text x="155" y="550" font-size="29" fill="#af602e" text-anchor="start">Y[0]</text><circle cx="295" cy="405" r="8" fill="#af602e"/><text x="315" y="390" font-size="29" fill="#af602e" text-anchor="start">Y[1]</text><circle cx="460" cy="570" r="8" fill="#af602e"/><text x="480" y="555" font-size="29" fill="#af602e" text-anchor="start">Y[2]</text><line x1="130" y1="240" x2="460" y2="570" stroke="#247094" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="240" x2="460" y2="240" stroke="#698695" stroke-width="2" stroke-dasharray="6 6"/><line x1="460" y1="240" x2="460" y2="570" stroke="#698695" stroke-width="2" stroke-dasharray="6 6"/><text x="265" y="204" font-size="25" fill="#698695" text-anchor="start">Δx = −2</text><text x="477" y="400" font-size="25" fill="#698695" text-anchor="start">Δy = 2</text><text x="730" y="185" font-size="30" fill="#1f3347" text-anchor="start">D[i,j] = ‖X[i] − Y[j]‖²</text><text x="838" y="247" font-size="27" fill="#af602e" text-anchor="middle">Y0</text><text x="933" y="247" font-size="27" fill="#af602e" text-anchor="middle">Y1</text><text x="1028" y="247" font-size="27" fill="#af602e" text-anchor="middle">Y2</text><text x="727" y="315" font-size="27" fill="#247094" text-anchor="start">X0</text><text x="727" y="410" font-size="27" fill="#247094" text-anchor="start">X1</text><rect x="790" y="260" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><text x="837.5" y="321.75" font-size="28" fill="#247094" text-anchor="middle">1</text><rect x="885" y="260" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><text x="932.5" y="321.75" font-size="28" fill="#247094" text-anchor="middle">1</text><rect x="980" y="260" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><text x="1027.5" y="321.75" font-size="28" fill="#247094" text-anchor="middle">1</text><rect x="790" y="355" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><text x="837.5" y="416.75" font-size="28" fill="#247094" text-anchor="middle">4</text><rect x="885" y="355" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><text x="932.5" y="416.75" font-size="28" fill="#247094" text-anchor="middle">2</text><rect x="980" y="355" width="95" height="95" fill="white" stroke="#e0e4eb" stroke-width="2"/><rect x="980" y="355" width="95" height="95" fill="#fff0df" stroke="#af602e" stroke-width="2"/><text x="1027.5" y="416.75" font-size="32" fill="#af602e" text-anchor="middle">8</text><text x="700" y="512" font-size="28" fill="#af602e" text-anchor="start">D[1,2] = (−2)² + 2² = 8</text><text x="700" y="565" font-size="26" fill="#1f3347" text-anchor="start">‖X[1]‖² + ‖Y[2]‖² − 2 X[1]·Y[2]</text><text x="700" y="610" font-size="28" fill="#1f3347" text-anchor="start">= 4 + 4 − 0 = 8</text></g><desc> 两两距离表的每一格，都对应平面上的一对点 用范数与内积构造距离表，避免存储所有逐特征差值；浮点消去另行核对。</desc></svg></svg>

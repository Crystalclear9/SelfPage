<svg xmlns="http://www.w3.org/2000/svg" width="1088.000" height="579.303" viewBox="13.867 57.610 1088.000 579.303" role="img"><title>两两距离表的每一格，都对应平面上的一对点</title><rect width="1088.0" height="579.303" fill="white" x="13.867" y="57.61" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="104" font-size="25" fill="#697d87" text-anchor="start">查询 X 有 2 行，中心 Y 有 3 行；右表行对应 X，列对应 Y。</text><line x1="130" y1="570" x2="526.0" y2="570" stroke="#dce5e8" stroke-width="2" stroke-dasharray="" /><text x="130" y="610" font-size="24" fill="#697d87" text-anchor="middle">0</text><text x="100" y="578" font-size="24" fill="#697d87" text-anchor="end">0</text><line x1="130" y1="405" x2="526.0" y2="405" stroke="#dce5e8" stroke-width="2" stroke-dasharray="" /><text x="295" y="610" font-size="24" fill="#697d87" text-anchor="middle">1</text><text x="100" y="413" font-size="24" fill="#697d87" text-anchor="end">1</text><line x1="130" y1="240" x2="526.0" y2="240" stroke="#dce5e8" stroke-width="2" stroke-dasharray="" /><text x="460" y="610" font-size="24" fill="#697d87" text-anchor="middle">2</text><text x="100" y="248" font-size="24" fill="#697d87" text-anchor="end">2</text><line x1="130" y1="570" x2="526.0" y2="570" stroke="#697d87" stroke-width="2" stroke-dasharray="" /><line x1="130" y1="570" x2="130" y2="174.0" stroke="#697d87" stroke-width="2" stroke-dasharray="" /><circle cx="295" cy="570" r="8" fill="#276884" /><text x="295" y="550" font-size="29" fill="#276884" text-anchor="start">X[0]</text><circle cx="130" cy="240" r="8" fill="#276884" /><text x="155" y="230" font-size="29" fill="#276884" text-anchor="start">X[1]</text><circle cx="130" cy="570" r="8" fill="#b25d2b" /><text x="155" y="550" font-size="29" fill="#b25d2b" text-anchor="start">Y[0]</text><circle cx="295" cy="405" r="8" fill="#b25d2b" /><text x="315" y="390" font-size="29" fill="#b25d2b" text-anchor="start">Y[1]</text><circle cx="460" cy="570" r="8" fill="#b25d2b" /><text x="480" y="555" font-size="29" fill="#b25d2b" text-anchor="start">Y[2]</text><line x1="130" y1="240" x2="460" y2="570" stroke="#276884" stroke-width="4" stroke-dasharray="" /><line x1="130" y1="240" x2="460" y2="240" stroke="#697d87" stroke-width="2" stroke-dasharray="6 6" /><line x1="460" y1="240" x2="460" y2="570" stroke="#697d87" stroke-width="2" stroke-dasharray="6 6" /><text x="265" y="204" font-size="25" fill="#697d87" text-anchor="start">Δx = −2</text><text x="477" y="400" font-size="25" fill="#697d87" text-anchor="start">Δy = 2</text><text x="730" y="185" font-size="30" fill="#233943" text-anchor="start">D[i,j] = ‖X[i] − Y[j]‖²</text><text x="838" y="247" font-size="27" fill="#b25d2b" text-anchor="middle">Y0</text><text x="933" y="247" font-size="27" fill="#b25d2b" text-anchor="middle">Y1</text><text x="1028" y="247" font-size="27" fill="#b25d2b" text-anchor="middle">Y2</text><text x="727" y="315" font-size="27" fill="#276884" text-anchor="start">X0</text><text x="727" y="410" font-size="27" fill="#276884" text-anchor="start">X1</text><rect x="790" y="260" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="837.5" y="321.75" font-size="28" fill="#276884" text-anchor="middle">1</text><rect x="885" y="260" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="932.5" y="321.75" font-size="28" fill="#276884" text-anchor="middle">1</text><rect x="980" y="260" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="1027.5" y="321.75" font-size="28" fill="#276884" text-anchor="middle">1</text><rect x="790" y="355" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="837.5" y="416.75" font-size="28" fill="#276884" text-anchor="middle">4</text><rect x="885" y="355" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="932.5" y="416.75" font-size="28" fill="#276884" text-anchor="middle">2</text><rect x="980" y="355" width="95" height="95" fill="white" stroke="#dce5e8" stroke-width="2" /><text x="1027.5" y="416.75" font-size="28" fill="#276884" text-anchor="middle">8</text><rect x="980" y="355" width="95" height="95" fill="#fff0df" stroke="#b25d2b" stroke-width="2" /><text x="1027" y="417" font-size="32" fill="#b25d2b" text-anchor="middle">8</text><text x="700" y="512" font-size="28" fill="#b25d2b" text-anchor="start">D[1,2] = (−2)² + 2² = 8</text><text x="700" y="565" font-size="26" fill="#233943" text-anchor="start">‖X[1]‖² + ‖Y[2]‖² − 2 X[1]·Y[2]</text><text x="700" y="610" font-size="28" fill="#233943" text-anchor="start">= 4 + 4 − 0 = 8</text></g><desc> 两两距离表的每一格，都对应平面上的一对点 用范数与内积构造距离表，避免存储所有逐特征差值；浮点消去另行核对。</desc></svg>

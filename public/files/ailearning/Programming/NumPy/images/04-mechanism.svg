="1231.0" y="199" font-size="28" fill="#c66d3a" text-anchor="middle">0.0467</text><text x="780" y="275" font-size="28" fill="#c66d3a" text-anchor="start">步数 0 → 1 → 3 → 6</text><text x="65" y="350" font-size="30" fill="#1d3145" text-anchor="start">t=6：e1² ≈ 0.28243；4e2² ≈ 0.00871；J ≈ 0.14557。</text><text x="65" y="412" font-size="28" fill="#1d3145" text-anchor="start">快方向的目标贡献已很小，慢方向仍保留超过一半的初始参数误差。</text></g></g></svg></svg>

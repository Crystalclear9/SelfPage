<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">谱方向决定梯度下降收敛速度</title><desc id="desc">考虑 Hessian 特征值分别为 1 和 4 的正定二次目标，并取学习率 0.1。两个特征方向上的误差每步分别乘 0.9 和 0.6，因此初始误差同为 1 时，第二个方向下降更快。 这是无噪声全批量、固定步长的二次模型，误差按谱坐标度量。图不代表任意非线性模型的损失曲线；步长增大还可能引入振荡或发散。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">谱方向决定梯度下降收敛速度</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">固定步长 0.1：两个谱坐标误差每步分别乘 0.9、0.6。</text><path d="M130,545 L1090,545" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,455 L1090,455" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="462" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.25</text><path d="M130,365 L1090,365" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="372" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.5</text><path d="M130,275 L1090,275" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="282" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.75</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><text x="157.17" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="308.113" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="459.057" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="610" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="760.943" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><text x="911.887" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">5</text><text x="1062.83" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">6</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">该方向误差</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">更新次数</text><polyline points="157.17,185.00 308.11,221.00 459.06,253.40 610.00,282.56 760.94,308.80 911.89,332.42 1062.83,353.68" fill="none" stroke="#268d8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="185.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="308.11" cy="221.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="459.06" cy="253.40" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610.00" cy="282.56" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="760.94" cy="308.80" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="911.89" cy="332.42" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="353.68" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">特征值 1</text><polyline points="157.17,185.00 308.11,329.00 459.06,415.40 610.00,467.24 760.94,498.34 911.89,517.01 1062.83,528.20" fill="none" stroke="#d67c47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="308.11" cy="329.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="459.06" cy="415.40" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610.00" cy="467.24" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="760.94" cy="498.34" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="911.89" cy="517.01" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="528.20" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M550,653 L585,653" stroke="#d67c47" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="598" y="660" font-size="21" fill="#20384f" 
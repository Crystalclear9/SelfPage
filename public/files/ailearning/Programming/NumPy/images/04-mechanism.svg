<g id="round-20261105c-teaching" transform="translate(0 823.275) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#d8e3e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#203742" text-anchor="start">每个谱方向单独计账：为什么总损失不能替代参数误差</text><text x="80" y="120" font-size="30" fill="#216c89" text-anchor="start">慢方向 e1</text><rect x="80" y="160" width="122" height="58" fill="#edf5f8" stroke="#216c89"/><text x="141.0" y="199" font-size="28" fill="#216c89" text-anchor="middle">1.0000</text><rect x="210" y="160" width="122" height="58" fill="#edf5f8" stroke="#216c89"/><text x="271.0" y="199" font-size="28" fill="#216c89" text-anchor="middle">0.9000</text><rect x="340" y="160" width="122" height="58" fill="#edf5f8" stroke="#216c89"/><text x="401.0" y="199" font-size="28" fill="#216c89" text-anchor="middle">0.7290</text><rect x="470" y="160" width="122" height="58" fill="#edf5f8" stroke="#216c89"/><text x="531.0" y="199" font-size="28" fill="#216c89" text-anchor="middle">0.5314</text><text x="80" y="275" font-size="28" fill="#216c89" text-anchor="start">步数 0 → 1 → 3 → 6</text><text x="780" y="120" font-size="30" fill="#c96937" text-anchor="start">快方向 e2</text><rect x="780" y="160" width="122" height="58" fill="#fff1e7" stroke="#c96937"/><text x="841.0" y="199" font-size="28" fill="#c96937" text-anchor="middle">1.0000</text><rect x="910" y="160" width="122" height="58" fill="#fff1e7" stroke="#c96937"/><text x="971.0" y="199" font-size="28" fill="#c96937" text-anchor="middle">0.6000</text><rect x="1040" y="160" width="122" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1101.0" y="199" font-size="28" fill="#c96937" text-anchor="middle">0.2160</text><rect x="1170" y="160" width="122" height="58" fill="#fff1e7" stroke="#c96937"/><text x="1231.0" y="199" font-size="28" fill="#c96937" text-anchor="middle">0.0467</text><text x="780" y="275" font-size="28" fill="#c96937" text-anchor="start">步数 0 → 1 → 3 → 6</text><text x="65" y="350" font-size="30" fill="#203742" text-anchor="start">t=6：e1² ≈ 0.28243；4e2² ≈ 0.00871；J ≈ 0.14557。</text><text x="65" y="412" font-size="28" fill="#203742" text-anchor="start">快方向的目标贡献已很小，慢方向仍保留超过一半的初始参数误差。</text></g></g></svg>

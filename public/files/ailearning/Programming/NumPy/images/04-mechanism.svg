<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1273.28" viewBox="0 0 1440 1273.28" role="img"><title>04-用NumPy实现线性回归训练</title><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="823.275" viewBox="0.000 60.767 1266.133 723.872"><rect width="1266.133" height="723.872" fill="white" x="0.0" y="60.767" /><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="109" font-size="27" fill="#52677a">J(e) = ½(e1² + 4e2²)，初始 e = (1,1)，固定学习率 0.1</text><text x="65" y="180" font-size="30" fill="#17334b">参数误差平面与等高线</text><text x="715" y="180" font-size="30" fill="#17334b">两条谱坐标的实际误差</text><ellipse cx="295" cy="485" rx="76.0" ry="38.0" fill="none" stroke="#d4e0e8" stroke-width="2" /><ellipse cx="295" cy="485" rx="120.16655108639841" ry="60.08327554319921" fill="none" stroke="#d4e0e8" stroke-width="2" /><ellipse cx="295" cy="485" rx="190.0" ry="95.0" fill="none" stroke="#d4e0e8" stroke-width="2" /><ellipse cx="295" cy="485" rx="268.70057685088807" ry="134.35028842544403" fill="none" stroke="#d4e0e8" stroke-width="2" /><polyline points="65.00,485.00 590.00,485.00" fill="none" stroke="#748895" stroke-width="2" /><polyline points="295.00,650.00 295.00,220.00" fill="none" stroke="#748895" stroke-width="2" /><text x="570" y="525" font-size="28" fill="#17334b">e1</text><text x="320" y="238" font-size="28" fill="#17334b">e2</text><polyline points="485.00,295.00 466.00,371.00 448.90,416.60 433.51,443.96 419.66,460.38 407.19,470.23 395.97,476.14 385.88,479.68 376.79,481.81 368.61,483.09 361.25,483.85 354.62,484.31 348.66,484.59" fill="none" stroke="#168578" stroke-width="4" /><circle cx="485.0" cy="295.0" r="9" fill="#168578" stroke="white" stroke-width="2" /><circle cx="466.0" cy="371.0" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="448.9" cy="416.6" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="433.51" cy="443.96000000000004" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="419.659" cy="460.376" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="407.1931" cy="470.2256" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="395.97379" cy="476.13536" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="385.876411" cy="479.681216" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="376.78876990000003" cy="481.8087296" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="368.60989291" cy="483.08523776" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="361.24890361900003" cy="483.851142656" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="354.6240132571" cy="484.3106855936" r="6" fill="#168578" stroke="white" stroke-width="2" /><circle cx="348.66161193139004" cy="484.58641135616" r="6" fill="#168578" stroke="white" stroke-width="2" /><text x="467.0" y="270.0" font-size="25" fill="#168578">t=0</text><text x="400" y="414" font-size="25" fill="#168578">t=3</text><text x="310" y="577" font-size="26" fill="#52677a">目标最优点 (0,0)</text><polyline points="735.00,650.00 1215.00,650.00" fill="none" stroke="#e2e8ed" stroke-width="1.5" /><text x="675" y="660" font-size="24" fill="#52677a">0</text><polyline points="735.00,550.00 1215.00,550.00" fill="none" stroke="#e2e8ed" stroke-width="1.5" /><text x="675" y="560.0" font-size="24" fill="#52677a">0.25</text><polyline points="735.00,450.00 1215.00,450.00" fill="none" stroke="#e2e8ed" stroke-width="1.5" /><text x="675" y="460.0" font-size="24" fill="#52677a">0.5</text><polyline points="735.00,350.00 1215.00,350.00" fill="none" stroke="#e2e8ed" stroke-width="1.5" /><text x="675" y="360.0" font-size="24" fill="#52677a">0.75</text><polyline points="735.00,250.00 1215.00,250.00" fill="none" stroke="#e2e8ed" stroke-width="1.5" /><text x="675" y="260" font-size="24" fill="#52677a">1</text><text x="728" y="692" font-size="24" fill="#52677a">0</text><text x="808" y="692" font-size="24" fill="#52677a">1</text><text x="888"
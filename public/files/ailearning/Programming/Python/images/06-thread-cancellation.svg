<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="573" viewBox="0 0 1200 573" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">取消异步等待与线程完成是两个状态</title>
<desc id="fig-desc">底层线程已经启动并等待事件。取消 asyncio 包装任务后，线程仍可在事件放行后产生副作用。</desc>
<rect x="0" y="0" width="1200" height="573" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">包装任务已取消，线程仍能提交</text>
<text x="229" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">线程已开始</text>
<path d="M229 123 L229 407" fill="none" stroke="#dbe8eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="500" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">取消包装任务</text>
<path d="M500 123 L500 407" fill="none" stroke="#dbe8eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="768" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">放行线程</text>
<path d="M768 123 L768 407" fill="none" stroke="#dbe8eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="1036" y="109" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">工作提交</text>
<path d="M1036 123 L1036 407" fill="none" stroke="#dbe8eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="78" y="181" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">任务</text>
<text x="78" y="370" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">线程</text>
<path d="M229 174 L500 174" fill="none" stroke="#166d75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="500" cy="174" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="516" y="218" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" font-weight="400">CancelledError</text>
<text x="516" y="254" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" font-weight="400">done=True · cancelled=True</text>
<path d="M229 363 L768 363" fill="none" stroke="#526976" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M768 363 L1036 363" fill="none" stroke="#166d75" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1036 363 L1025 368 L1025 358 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="229" cy="363" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="768" cy="363" r="8" fill="#6e618e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="1036" cy="363" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="374" y="338" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">仍在等待释放事件</text>
<text x="862" y="338" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">继续工作</text>
<text x="1017" y="411" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">产生副作用</text>
<path d="M75 448 L1125 448" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="503" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">取消等待不会强制终止已经运行的工作线程。</text>
</svg>

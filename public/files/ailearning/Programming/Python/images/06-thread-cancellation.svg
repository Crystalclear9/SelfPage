<svg xmlns="http://www.w3.org/2000/svg" width="1098.000" height="631.000" viewBox="16.000 52.000 1098.000 631.000" role="img" aria-labelledby="title desc"><title id="title">异步包装任务结束，底层工作仍可继续</title><desc id="desc">已经运行的to_thread函数不会因其asyncio包装任务取消而自动终止。释放事件后工作依然产生副作用。 异步包装任务结束，底层工作仍可继续 图表示事件先后，不按真实耗时比例绘制；完整示例通过事件同步验证。</desc><rect width="1098.0" height="631.0" fill="white" x="16.0" y="52.0" /><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="98" font-size="26" fill="#627689" text-anchor="start">先确认工作线程已经开始，再取消等待它的 asyncio 任务</text><line x1="240" y1="155" x2="240" y2="585" stroke="#dce5ed" stroke-width="2" /><text x="240" y="145" font-size="24" fill="#627689" text-anchor="middle">已开始</text><line x1="470" y1="155" x2="470" y2="585" stroke="#dce5ed" stroke-width="2" /><text x="470" y="145" font-size="24" fill="#627689" text-anchor="middle">取消包装任务</text><line x1="750" y1="155" x2="750" y2="585" stroke="#dce5ed" stroke-width="2" /><text x="750" y="145" font-size="24" fill="#627689" text-anchor="middle">放行工作</text><line x1="1040" y1="155" x2="1040" y2="585" stroke="#dce5ed" stroke-width="2" /><text x="1040" y="145" font-size="24" fill="#627689" text-anchor="middle">工作提交</text><text x="40" y="250" font-size="27" fill="#2865a0" text-anchor="start">asyncio</text><text x="40" y="285" font-size="27" fill="#2865a0" text-anchor="start">任务</text><rect x="240" y="220" width="230" height="55" fill="#2865a0" opacity="0.16" rx="3" /><circle cx="470" cy="247" r="8" fill="#2865a0" /><text x="510" y="240" font-size="27" fill="#2865a0" text-anchor="start">CancelledError</text><text x="510" y="283" font-size="25" fill="#2865a0" text-anchor="start">done=True · cancelled=True</text><text x="40" y="440" font-size="27" fill="#c87536" text-anchor="start">底层线程</text><rect x="240" y="410" width="510" height="55" fill="#c87536" opacity="0.14" rx="3" /><rect x="750" y="410" width="290" height="55" fill="#c87536" opacity="0.8" rx="3" /><text x="490" y="447" font-size="27" fill="#213447" text-anchor="middle">等待释放事件</text><text x="895" y="447" font-size="27" fill="#fff" text-anchor="middle">执行副作用</text><text x="580" y="550" font-size="26" fill="#c87536" text-anchor="middle">此时包装任务已取消，线程仍未完成</text><text x="1040" y="515" font-size="25" fill="#c87536" text-anchor="middle">完成通知</text><text x="40" y="655" font-size="29" fill="#213447" text-anchor="start">取消等待者 ≠ 终止已运行的线程 ≠ 撤回外部副作用</text></g></svg>

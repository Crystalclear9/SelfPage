<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="459.81" viewBox="0.39 -4.03 1055.89 404.59" role="img"><title id="detail-title">机制展开：A 用真实的 property 返回值 42 与实例字典值 99 展示查找优先级</title><desc id="detail-desc">A 用真实的 property 返回值 42 与实例字典值 99 展示查找优先级。读取可读数据描述符后就停止查找，划线的 99 不参与本次返回；右侧普通方法的对照说明非数据描述符为何可能被实例值遮蔽。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="30" y="55" width="280" height="155" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="30" y="55" width="280" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="42" y="80" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">类中的 property a</text><text x="44" y="122" font-size="24" fill="#213447" font-weight="400" text-anchor="start">__get__ → 42</text><text x="44" y="153" font-size="24" fill="#213447" font-weight="400" text-anchor="start">数据描述符</text><rect x="30" y="245" width="280" height="120" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="30" y="245" width="280" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="42" y="270" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">实例字典</text><text x="44" y="312" font-size="24" fill="#213447" font-weight="400" text-anchor="start">a: 99</text><circle cx="390" cy="35" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="390" y="42" font-size="24" fill="white" font-weight="700" text-anchor="middle">1</text><text x="415" y="42" font-size="24" fill="#213447" font-weight="600" text-anchor="start">读取 obj.a</text><rect x="390" y="89" width="300" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="540.0" y="117" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">可读数据描述符？是</text><path d="M694,110 L765,110" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><rect x="778" y="89" width="240" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="898.0" y="117" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">返回 42</text><line x1="540" y1="136" x2="540" y2="276" stroke="#cbd9e4" stroke-width="2" stroke-dasharray="6 5" /><text x="392" y="238" font-size="24" fill="#627689" font-weight="400" text-anchor="start">本例已命中，后续层不再读取</text><rect x="390" y="286" width="300" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="540.0" y="314" font-size="24" fill="#cf7432" font-weight="600" text-anchor="middle">实例字典中的 99</text><line x1="410" y1="319" x2="667" y2="293" stroke="#cf7432" stroke-width="2" /><path d="M315,129 L381,110" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M315,302 L382,307" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="778" y="278" font-size="24" fill="#213447" font-weight="700" text-anchor="start">对照：普通方法 m</text><text x="778" y="321" font-size="24" fill="#213447" font-weight="400" text-anchor="start">是非数据描述符</text><text x="778" y="363" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">实例 m=99 可以遮蔽它</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img"><title>同名属性有两份候选值；描述符种类决定优先级</title><rect width="1280" height="690" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">同名属性有两份候选值；描述符种类决定优先级</text><text x="40" y="104" font-size="25" fill="#697d87" text-anchor="start">使用默认属性查找；类中定义 property a 与普通实例方法 m。</text><text x="70" y="175" font-size="29" fill="#276884" text-anchor="start">类命名空间</text><text x="700" y="175" font-size="29" fill="#b25d2b" text-anchor="start">实例 obj.__dict__</text><rect x="70" y="202" width="425" height="154" fill="white" stroke="#dce5e8" stroke-width="2"/><line x1="70" y1="279" x2="495" y2="279" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><rect x="700" y="202" width="425" height="154" fill="white" stroke="#dce5e8" stroke-width="2"/><line x1="700" y1="279" x2="1125" y2="279" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="90" y="252" font-size="27" fill="#276884" text-anchor="start">a   property → 返回 42</text><text x="90" y="330" font-size="27" fill="#276884" text-anchor="start">m   普通函数</text><text x="720" y="252" font-size="27" fill="#b25d2b" text-anchor="start">&#x27;a&#x27; : 99</text><text x="720" y="330" font-size="27" fill="#b25d2b" text-anchor="start">&#x27;m&#x27; : 99</text><text x="70" y="422" font-size="29" fill="#233943" text-anchor="start">读取 obj.a</text><line x1="280" y1="414" x2="475" y2="414" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="475,414 463.94726807196537,418.6730201077038 463.94726807196537,409.3269798922962" fill="#276884"/><text x="495" y="424" font-size="34" fill="#276884" text-anchor="start">42</text><line x1="495" y1="252" x2="535" y2="390" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="535,390 527.4346844685926,380.68517306063893 536.4112417515657,378.0832723989076" fill="#276884"/><text x="700" y="426" font-size="25" fill="#697d87" text-anchor="start">实例中的 a=99 未被选用</text><text x="70" y="525" font-size="29" fill="#233943" text-anchor="start">读取 obj.m</text><line x1="280" y1="517" x2="475" y2="517" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="475,517 463.94726807196537,521.6730201077038 463.94726807196537,512.3269798922962" fill="#b25d2b"/><text x="495" y="527" font-size="34" fill="#b25d2b" text-anchor="start">99</text><line x1="700" y1="343" x2="557" y2="498" stroke="#b25d2b" stroke-width="3" stroke-dasharray=""/><text x="700" y="529" font-size="25" fill="#697d87" text-anchor="start">函数被同名实例字段遮蔽</text><text x="40" y="615" font-size="26" fill="#233943" text-anchor="start">可读数据描述符 → 实例字典 → 非数据描述符／普通类属性</text><text x="40" y="658" font-size="25" fill="#697d87" text-anchor="start">只读 property 仍是数据描述符；“只读”不等于没有描述符写入入口。</text></g></svg>

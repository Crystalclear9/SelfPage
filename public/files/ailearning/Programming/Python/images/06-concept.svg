<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1284.4" viewBox="0 0 1440 1284.4" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">描述符、实例字典与查找优先级</title><rect width="1440" height="1284.4" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">描述符、实例字典与查找优先级</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1142.4" viewBox="0 0 1600 1360" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-eaf4fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>默认属性查找中，两个名称在不同优先级命中</title><svg width="1600" height="860" viewBox="0 0 1600 860" role="img"><title>默认属性查找中，两个名称在不同优先级命中</title><rect width="1600" height="860" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1672a0" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1e9195" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="345" y="67" font-size="32" fill="#20354a" text-anchor="middle" font-weight="700">① 可读数据描述符</text><text x="815" y="67" font-size="32" fill="#20354a" text-anchor="middle" font-weight="700">② 实例字典</text><text x="1285" y="67" font-size="32" fill="#20354a" text-anchor="middle" font-weight="700">③ 非数据描述符</text><text x="20" y="253" font-size="30" fill="#1672a0" text-anchor="start" font-weight="700">obj.a</text><rect x="160" y="155" width="370" height="160" rx="6" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="345" y="246" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="700">property → 42</text><line x1="535" y1="235" x2="620" y2="235" stroke="#818fa4" stroke-width="2" stroke-dasharray="6 5"/><rect x="630" y="155" width="370" height="160" rx="6" fill="white" stroke="#818fa4" stroke-width="2"/><text x="815" y="246" font-size="34" fill="#818fa4" text-anchor="middle" font-weight="400">'a': 99</text><line x1="1005" y1="235" x2="1090" y2="235" stroke="#818fa4" stroke-width="2" stroke-dasharray="6 5"/><rect x="1100" y="155" width="370" height="160" rx="6" fill="white" stroke="#818fa4" stroke-width="2" stroke-dasharray="8 6"/><text x="1285" y="246" font-size="34" fill="#818fa4" text-anchor="middle" font-weight="400">—</text><line x1="120" y1="235" x2="155" y2="235" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><line x1="345" y1="320" x2="345" y2="366" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><text x="345" y="414" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="700">返回 42</text><text x="815" y="370" font-size="27" fill="#818fa4" text-anchor="middle" font-weight="400">有同名值，仍不读取</text><text x="20" y="578" font-size="30" fill="#1672a0" text-anchor="start" font-weight="700">obj.m</text><rect x="160" y="480" width="370" height="160" rx="6" fill="white" stroke="#818fa4" stroke-width="2" stroke-dasharray="8 6"/><text x="345" y="571" font-size="34" fill="#818fa4" text-anchor="middle" font-weight="400">—</text><line x1="535" y1="560" x2="620" y2="560" stroke="#818fa4" stroke-width="2" marker-end="url(#g)"/><rect x="630" y="480" width="370" height="160" rx="6" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="815" y="571" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="700">'m': 99</text><line x1="1005" y1="560" x2="1090" y2="560" stroke="#818fa4" stroke-width="2" stroke-dasharray="6 5"/><rect x="1100" y="480" width="370" height="160" rx="6" fill="white" stroke="#818fa4" stroke-width="2"/><text x="1285" y="571" font-size="34" fill="#818fa4" text-anchor="middle" font-weight="400">函数 m</text><line x1="120" y1="560" x2="155" y2="560" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><line x1="815" y1="645" x2="815" y2="691" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><text x="815" y="739" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="700">返回 99</text><text x="1285" y="695" font-size="27" fill="#818fa4" text-anchor="middle" font-weight="400">不会绑定为方法</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 860) scale(1.11111)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">属性错误可能是 getter 的运行结果：hasattr 也会执行读取</text><text x="65" y="125" font-size="28" fill="#1d3145" text-anchor="start">property a 的 getter 抛出 AttributeError；实例字典已有 a=99</text><rect x="65" y="195" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="276.0" y="234" font-size="28" fill="#c66d3a" text-anchor="middle">obj.a</text><rect x="495" y="195" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="706.0" y="234" font-size="28" fill="#c66d3a" text-anchor="middle">执行 property getter</text><rect x="925" y="195" width="422" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1136.0" y="234" font-size="28" fill="#c66d3a" text-anchor="middle">AttributeError</text><text x="65" y="315" font-size="28" fill="#1d3145" text-anchor="start">不会改读实例字典的 99；若定义 __getattr__，外层才可能进入后备路径。</text><text x="65" y="408" font-size="27" fill="#1d3145" text-anchor="start">hasattr(obj,"a") 也走读取；本例没有后备方法时返回 False，并不证明类上没有 a。</text></g></g></svg></svg>

-anchor="middle" font-weight="400">d[1] → 'B'</text><rect x="1360" y="880" width="320" height="100" rx="4" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2"/><text x="1520" y="945" font-size="34" fill="#1672a0" text-anchor="middle" font-weight="400">d[1.0] → 'B'</text><text x="900" y="780" font-size="34" fill="#20354a" text-anchor="middle" font-weight="400">相等且哈希相容 → 三种读取都命中同一项</text></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img"><title>数值相等的键在逐次赋值后更新同一个字典项</title><rect width="1800" height="1100" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="240" font-size="38" fill="#176b91" text-anchor="start" font-weight="400">d[True] = &#x27;A&#x27;</text><line x1="500" y1="225" x2="650" y2="225" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="700" y="160" width="570" height="150" rx="4" fill="white" stroke="#176b91" stroke-width="2"/><line x1="960" y1="160" x2="960" y2="310" stroke="#d9e4ea" stroke-width="2"/><text x="830" y="250" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">True</text><text x="1115" y="250" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">A</text><text x="1430" y="250" font-size="36" fill="#203b4a" text-anchor="middle" font-weight="400">len(d) = 1</text><text x="830" y="115" font-size="30" fill="#80929d" text-anchor="middle" font-weight="400">键</text><text x="1115" y="115" font-size="30" fill="#80929d" text-anchor="middle" font-weight="400">值</text><text x="70" y="590" font-size="38" fill="#d87332" text-anchor="start" font-weight="400">d[1] = &#x27;B&#x27;</text><line x1="500" y1="575" x2="650" y2="575" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><rect x="700" y="510" width="570" height="150" rx="4" fill="white" stroke="#176b91" stroke-width="2"/><line x1="960" y1="510" x2="960" y2="660" stroke="#d9e4ea" stroke-width="2"/><text x="830" y="600" font-size="42" fill="#176b91" text-anchor="middle" font-weight="400">True</text><text x="1115" y="600" font-size="42" fill="#d87332" text-anchor="middle" font-weight="400">B</text><text x="1430" y="600" font-size="36" fill="#203b4a" text-anchor="middle" font-weight="400">len(d) = 1</text><line x1="985" y1="350" x2="985" y2="450" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><text x="1060" y="410" font-size="30" fill="#d87332" text-anchor="start" font-weight="400">更新原项的值</text><rect x="220" y="880" width="320" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="380" y="945" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">d[True] → &#x27;B&#x27;</text><rect x="790" y="880" width="320" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="950" y="945" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">d[1] → &#x27;B&#x27;</text><rect x="1360" y="880" width="320" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1520" y="945" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">d[1.0] → &#x27;B&#x27;</text><text x="900" y="780" font-size="34" fill="#203b4a" text-anchor="middle" font-weight="400">相等且哈希相容 → 三种读取都命中同一项</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="65" font-size="36" fill="#193a4e" text-anchor="start" font-weight="700">重放同一批次：复用已提交结果，不再多加一次</text><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">同一输入版本 v1；每批 2 条记录。批次身份 =（输入版本，批次号）。</text><text xml:space="preserve" x="840" y="205" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">已提交的批结果</text><rect x="830" y="245" width="580" height="360" rx="0" fill="#fafcfd" stroke="#9db1be" stroke-width="2"/><text xml:space="preserve" x="875" y="290" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">身份</text><text xml:space="preserve" x="1110" y="290" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">计数</text><text xml:space="preserve" x="1260" y="290" font-size="28" fill="#193a4e" text-anchor="start" font-weight="400">总和</text><line x1="830" y1="310" x2="1410" y2="310" stroke="#9db1be" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="875" y="365" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">v1, 1</text><text xml:space="preserve" x="1140" y="365" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="365" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">3</text><rect x="835" y="415" width="570" height="75" rx="0" fill="#e5f1f8" stroke="none" stroke-width="2"/><text xml:space="preserve" x="875" y="455" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">v1, 2</text><text xml:space="preserve" x="1140" y="455" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="455" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">7</text><text xml:space="preserve" x="875" y="545" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">v1, 3</text><text xml:space="preserve" x="1140" y="545" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">2</text><text xml:space="preserve" x="1290" y="545" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">11</text><text xml:space="preserve" x="50" y="245" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">恢复时又收到批次 2</text><circle cx="95" cy="345" r="35" fill="#fff0df" stroke="#d76a22" stroke-width="2"/><text xml:space="preserve" x="95" y="356" font-size="34" fill="#d76a22" text-anchor="middle" font-weight="400">3</text><circle cx="205" cy="345" r="35" fill="#fff0df" stroke="#d76a22" stroke-width="2"/><text xml:space="preserve" x="205" y="356" font-size="34" fill="#d76a22" text-anchor="middle" font-weight="400">4</text><text xml:space="preserve" x="50" y="440" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">同一键：(v1, 2)</text><path d="M 310,345 H 610 V 455 H 815" stroke="#2676ad" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="510" y="320" font-size="30" fill="#2676ad" text-anchor="middle" font-weight="400">查到相同结果</text><text xml:space="preserve" x="50" y="555" font-size="31" fill="#2676ad" text-anchor="start" font-weight="400">正确：已有键保持一份结果</text><text xml:space="preserve" x="50" y="610" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">重放前后均为 6 条，总和 21</text><text xml:space="preserve" x="50" y="730" font-size="31" fill="#d76a22" text-anchor="start" font-weight="400">错误：直接把重放结果再累加</text><text xml:space="preserve" x="50" y="785" font-size="30" fill="#d76a22" text-anchor="start" font-weight="400">变成 8 条，总和 28</text><path d="M 1120,610 V 680" stroke="#2676ad" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1110" y="740" font-size="32" fill="#2676ad" text-anchor="middle" font-weight="400">2 + 2 + 2 = 6</text><text xml:space="preserve" x="1110" y="795" font-size="32" fill="#2676ad" text-anchor="middle" font-weight="400">3 + 7 + 11 = 21</text><text xml:space="preserve" x="50" y="900" font-size="28" fill="#557080" text-anchor="start" font-weight="400">示例是单进程已提交结果表；并发去重、事务提交和外部副作用仍需对应协议。</text></g></svg>
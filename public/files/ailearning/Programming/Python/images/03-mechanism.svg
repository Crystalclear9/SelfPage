<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616.43" viewBox="11.00 10.18 1119.00 574.82" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">幂等恢复：重放已提交批次不再重复计数</title><desc id="desc">恢复后再次收到批次 k，程序先核对该批次的提交身份。已经提交的结果直接复用；尚未提交的批次才进入计算与发布。这样重复执行输入不会必然造成重复累加。 这是一项协议设计：提交记录与结果发布若不一致仍可能重复或遗漏。非事务外部副作用还需要幂等键、原子机制或补偿，单靠异常捕获无法获得保证。 查重与提交须原子协调；先查后写本身不能保证并发幂等。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">幂等恢复：重放已提交批次不再重复计数</text><path d="M350,365 L420,365" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M705,316.297 L815,278.703" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M705,411.899 L815,448.101" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="65" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="207.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">输入批次 k</text><rect x="420" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="562.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">查询已提交身份</text><rect x="815" y="175" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="957.5" y="238" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">已有：跳过副作用</text><rect x="815" y="440" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="957.5" y="503" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">未有：计算并提交</text></g></svg>

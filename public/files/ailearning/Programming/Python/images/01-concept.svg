<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="456.66" viewBox="-8.13 -11.60 1107.96 421.63" role="img"><title id="detail-title">机制展开：A 把容器槽位、引用箭头和堆对象分开画</title><desc id="detail-desc">A 把容器槽位、引用箭头和堆对象分开画。两条引用最终汇入同一个 L，因此通过 b 追加元素也能从 a 观察到；变的是共享对象的内容，不是把 a 与 b 合并成同一外层列表。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><circle cx="35" cy="28" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="35" y="35" font-size="24" fill="white" font-weight="700" text-anchor="middle">1</text><text x="60" y="35" font-size="24" fill="#213447" font-weight="600" text-anchor="start">两个外层列表，各有一个槽位</text><circle cx="630" cy="28" r="15" fill="#2865a0" stroke="white" stroke-width="2" /><text x="630" y="35" font-size="24" fill="white" font-weight="700" text-anchor="middle">2</text><text x="655" y="35" font-size="24" fill="#213447" font-weight="600" text-anchor="start">写入同一个内部对象</text><rect x="32" y="78" width="260" height="130" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="32" y="78" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="44" y="103" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">a：外层列表 A</text><text x="46" y="145" font-size="24" fill="#213447" font-weight="400" text-anchor="start">槽 0 → L</text><rect x="32" y="245" width="260" height="130" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="32" y="245" width="260" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="44" y="270" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">b：外层列表 B</text><text x="46" y="312" font-size="24" fill="#213447" font-weight="400" text-anchor="start">槽 0 → L</text><rect x="470" y="96" width="240" height="100" rx="8" fill="white" stroke="#2865a0" stroke-width="1.3" /><text x="490" y="128" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">堆对象 L：追加前</text><rect x="498" y="144" width="65" height="40" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="530.5" y="170.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><path d="M292,146 L462,163" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M292,312 L462,177" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><rect x="830" y="96" width="240" height="100" rx="8" fill="white" stroke="#cf7432" stroke-width="1.3" /><text x="850" y="128" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">同一个 L：追加后</text><rect x="858" y="144" width="65" height="40" rx="5" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="890.5" y="170.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">1</text><rect x="928" y="144" width="65" height="40" rx="5" fill="#fcf0e4" stroke="#cbd9e4" stroke-width="1.3" /><text x="960.5" y="170.0" font-size="24" fill="#213447" font-weight="500" text-anchor="middle">2</text><path d="M714,156 L822,156" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="745" y="220" font-size="24" fill="#cf7432" font-weight="400" text-anchor="middle">append(2)</text><line x1="590" y1="196" x2="590" y2="285" stroke="#2865a0" stroke-width="2" stroke-dasharray="5 4" /><line x1="950" y1="196" x2="950" y2="285" stroke="#cf7432" stroke-width="2" stroke-dasharray="5 4" /><text x="478" y="322" font-size="26" fill="#158476" font-weight="600" text-anchor="start">a[0] is b[0] → True</text><text x="478" y="366" font-size="24" fill="#213447" font-weight="400" text-anchor="start">a is b → False：新建的只是外层</text></g></svg>

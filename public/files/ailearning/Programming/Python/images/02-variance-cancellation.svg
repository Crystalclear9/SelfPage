<svg xmlns="http://www.w3.org/2000/svg" width="1215.000" height="746.250" viewBox="25.000 63.750 1215.000 746.250"><title>同样的三个数：大数相减会吞掉真实波动</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#778994" /></marker></defs><rect width="1215.0" height="746.25" fill="white" x="25.0" y="63.75" /><g font-family="Microsoft YaHei, sans-serif" fill="#203747"><text x="55" y="117" font-size="28" fill="#778994" text-anchor="start">float64 输入 1000000000、1000000001、1000000002；总体方差按 n=3 归约</text><text x="60" y="240" font-size="34" fill="#c56b31" text-anchor="start">先算两个大项</text><text x="60" y="330" font-size="33" fill="#203747" text-anchor="start">E[x²] 与 E[x]² 约为 10^18</text><path d="M580 315L740 315" fill="none" stroke="#c56b31" stroke-width="3" marker-end="url(#a)" /><text x="790" y="330" font-size="36" fill="#c56b31" text-anchor="start">相减结果：0</text><text x="60" y="500" font-size="34" fill="#24689a" text-anchor="start">先对均值求偏差</text><rect x="470" y="450" width="180" height="90" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="560" y="510" font-size="36" fill="#24689a" text-anchor="middle">-1</text><rect x="750" y="450" width="180" height="90" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="840" y="510" font-size="36" fill="#24689a" text-anchor="middle">0</text><rect x="1030" y="450" width="180" height="90" fill="#edf4f9" stroke="none" stroke-width="2" /><text x="1120" y="510" font-size="36" fill="#24689a" text-anchor="middle">1</text><text x="60" y="680" font-size="34" fill="#24689a" text-anchor="start">精确数学方差：(1+0+1)÷3 = 2÷3</text><text x="60" y="775" font-size="29" fill="#203747" text-anchor="start">Welford 维护中心离差，避免用两个巨大且接近的二阶矩作最终相减。</text></g><desc> 同样的三个数：大数相减会吞掉真实波动 这是指定数据与计算次序的反例；稳定算法也仍受表示误差与溢出边界约束。</desc></svg>

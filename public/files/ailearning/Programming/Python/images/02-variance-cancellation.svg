<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img"><title>大基数下两个精确二阶量舍入到同一浮点网格</title><rect width="1800" height="1300" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="900" y="75" font-size="34" fill="#203b4a" text-anchor="middle" font-weight="400">K = 1000000002000000000；本例 float64 网格间隔 = 128</text><line x1="160" y1="260" x2="1640" y2="260" stroke="#80929d" stroke-width="2"/><line x1="160" y1="245" x2="160" y2="275" stroke="#80929d" stroke-width="3"/><text x="160" y="325" font-size="30" fill="#80929d" text-anchor="middle" font-weight="400">K − 128</text><line x1="900" y1="245" x2="900" y2="275" stroke="#80929d" stroke-width="3"/><text x="900" y="325" font-size="30" fill="#80929d" text-anchor="middle" font-weight="400">K</text><line x1="1640" y1="245" x2="1640" y2="275" stroke="#80929d" stroke-width="3"/><text x="1640" y="325" font-size="30" fill="#80929d" text-anchor="middle" font-weight="400">K + 128</text><circle cx="900" cy="260" r="15" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="900" y="190" font-size="35" fill="#d87332" text-anchor="middle" font-weight="400">两个浮点计算结果都落在 K</text><text x="130" y="490" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">精确 E[x²]：K +</text><text x="570" y="465" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">5</text><line x1="532" y1="478" x2="608" y2="478" stroke="#203b4a" stroke-width="2"/><text x="570" y="519" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="400">3</text><path d="M 430 540 C 430 600 900 600 900 650" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="1030" y="490" font-size="32" fill="#203b4a" text-anchor="start" font-weight="400">精确 E[x]²：K + 1</text><path d="M 1330 540 C 1330 600 900 600 900 650" fill="none" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="900" y="735" font-size="37" fill="#d87332" text-anchor="middle" font-weight="400">二阶矩相减：K − K = 0</text><line x1="100" y1="800" x2="1700" y2="800" stroke="#d9e4ea" stroke-width="2"/><text x="160" y="900" font-size="35" fill="#176b91" text-anchor="start" font-weight="400">先中心化</text><rect x="530" y="840" width="220" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="640" y="905" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">-1</text><line x1="640" y1="965" x2="640" y2="1020" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="640" y="1080" font-size="38" fill="#218579" text-anchor="middle" font-weight="400">1</text><rect x="870" y="840" width="220" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="980" y="905" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">0</text><line x1="980" y1="965" x2="980" y2="1020" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="980" y="1080" font-size="38" fill="#218579" text-anchor="middle" font-weight="400">0</text><rect x="1210" y="840" width="220" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1320" y="905" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">1</text><line x1="1320" y1="965" x2="1320" y2="1020" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="1320" y="1080" font-size="38" fill="#218579" text-anchor="middle" font-weight="400">1</text><text x="160" y="1080" font-size="32" fill="#218579" text-anchor="start" font-weight="400">偏差平方</text><text x="900" y="1180" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">1 + 0 + 1</text><line x1="720" y1="1193" x2="1080" y2="1193" stroke="#218579" stroke-width="2"/><text x="900" y="1234" font-size="34" fill="#218579" text-anchor="middle" font-weight="400">3</text><text x="1220" y="1210" font-size="34" fill="#218579" text-anchor="start" font-weight="400">= 三分之二</text></g></svg>
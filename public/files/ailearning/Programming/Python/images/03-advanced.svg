<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="459.87" viewBox="11.24 10.52 1133.76 434.49" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">异常链保留底层原因与上层语义</title><desc id="desc">底层解析失败只说明某个局部转换无法完成，上层还知道这是哪条记录、哪个阶段或哪个输入文件。封装领域异常时保留原始原因，可以同时说明业务失败和技术原因，减少只有“处理失败”四个字的信息损失。 图表示异常原因链，不是要求所有异常都转换成同一种类型。只捕获能够解释或恢复的范围；记录敏感输入时也应按项目的数据规范处理。 异常链保留原因；新增上下文不应泄漏敏感原始输入。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">异常链保留底层原因与上层语义</text><path d="M355,355 L450,355" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,355 L830,355" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="300" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="212.5" y="363" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">底层解析 ValueError</text><rect x="450" y="300" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="363" font-size="24" fill="#213447" text-anchor="middle" font-weight="400"><tspan x="592.5" y="347.0">附加行号</tspan><tspan x="592.5" y="379.0">记录输入身份</tspan></text><rect x="830" y="300" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="972.5" y="347.5" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">抛出领域异常并保留 </text><text x="972.5" y="378.5" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">cause</text></g></svg>

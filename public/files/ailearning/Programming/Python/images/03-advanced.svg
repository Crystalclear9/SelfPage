<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>异常链中的两个对象各保留一层事实</title><rect width="1280" height="740" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="65" font-size="34" fill="#19333c">保留底层原因，再附上“哪条记录、哪个字段”</text><text x="60" y="112" font-size="27" fill="#71858b">同一次失败：第 5 条记录，score 字段原值为 bad</text><text x="60" y="195" font-size="29" fill="#256b82">执行 float(&quot;bad&quot;)</text><text x="700" y="195" font-size="29" fill="#c0643c">转换成领域错误</text><line x1="60" y1="225" x2="590" y2="225" stroke="#dbe5e8" stroke-width="2"/><line x1="700" y1="225" x2="1220" y2="225" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="280" font-size="31" fill="#256b82">ValueError 对象 e</text><text x="60" y="335" font-size="27" fill="#19333c">原因：字符串不能转换成浮点数</text><text x="60" y="390" font-size="27" fill="#19333c">保留转换失败位置的 traceback</text><text x="700" y="280" font-size="30" fill="#c0643c">ScoreParseError 对象 outer</text><text x="700" y="335" font-size="27" fill="#19333c">消息：record 5: score invalid</text><text x="700" y="390" font-size="27" fill="#19333c">保留上层记录与字段上下文</text><line x1="765" y1="455" x2="250" y2="455" stroke="#c0643c" stroke-width="3"/><polyline points="265,448 250,455 265,462" stroke="#c0643c" stroke-width="3" fill="none"/><text x="380" y="495" font-size="29" fill="#c0643c">outer.__cause__ is e</text><text x="60" y="575" font-size="27" fill="#19333c">抛出方式：raise ScoreParseError(&quot;record 5: score invalid&quot;) from e</text><line x1="60" y1="615" x2="1220" y2="615" stroke="#dbe5e8" stroke-width="2"/><text x="60" y="665" font-size="28" fill="#19333c">两个异常仍是两个对象；上层错误没有抹掉原来的原因和调用位置。</text><text x="60" y="715" font-size="26" fill="#71858b">只拼接一段错误文本，不等于保留结构化异常链。</text></g></svg>

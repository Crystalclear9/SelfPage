<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="852.515" viewBox="0 0 1440 852.515" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">取消交付：先确认 await 是否真的挂起</title><rect width="1440" height="852.515" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">取消交付：先确认 await 是否真的挂起</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="710.515" viewBox="18.75 70 1461.25 772.5" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1461.25" height="772.5" fill="white" x="18.75" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">同一个事件循环：任务先 call_soon 排入取消自身的回调，再执行 await。</text><text xml:space="preserve" x="50" y="205" font-size="32" fill="#2181bf" text-anchor="start" font-weight="700">A  已完成的 Future：await 直接返回</text><line x1="100" y1="320" x2="1400" y2="320" stroke="#bac5d5" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="100" y1="320" x2="990" y2="320" stroke="#2181bf" stroke-width="15" stroke-dasharray=""/><circle cx="340" cy="320" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><line x1="340" y1="310" x2="340" y2="265" stroke="#8e9fb9" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="340" y="245" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">排入回调</text><circle cx="630" cy="320" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><line x1="630" y1="310" x2="630" y2="265" stroke="#8e9fb9" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="630" y="245" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">await ready</text><circle cx="990" cy="320" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><line x1="990" y1="310" x2="990" y2="265" stroke="#8e9fb9" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="990" y="245" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">Task 正常完成</text><circle cx="1210" cy="320" r="13" fill="#d26c27" stroke="none" stroke-width="2"/><line x1="1210" y1="335" x2="1210" y2="390" stroke="#d26c27" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1210" y="435" font-size="29" fill="#d26c27" text-anchor="middle" font-weight="400">回调才运行</text><text xml:space="preserve" x="1210" y="480" font-size="28" fill="#d26c27" text-anchor="middle" font-weight="400">cancel() → False</text><text xml:space="preserve" x="50" y="435" font-size="30" fill="#2181bf" text-anchor="start" font-weight="400">连续同步执行，没有挂起</text><text xml:space="preserve" x="50" y="480" font-size="28" fill="#55798e" text-anchor="start" font-weight="400">完成任务不再受这次取消影响</text><line x1="50" y1="530" x2="1450" y2="530" stroke="#e0e8ee" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="50" y="600" font-size="32" fill="#2181bf" text-anchor="start" font-weight="700">B  尚未完成的 Future：await 挂起，回调获得执行机会</text><line x1="100" y1="720" x2="1400" y2="720" stroke="#bac5d5" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="100" y1="720" x2="590" y2="720" stroke="#2181bf" stroke-width="15" stroke-dasharray=""/><line x1="590" y1="720" x2="1040" y2="720" stroke="#a0adc0" stroke-width="3" stroke-dasharray="9 8"/><line x1="1040" y1="720" x2="1360" y2="720" stroke="#d26c27" stroke-width="15" stroke-dasharray=""/><circle cx="340" cy="720" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="340" y="675" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">排入回调</text><circle cx="590" cy="720" r="9" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="590" y="675" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">await pending</text><circle cx="820" cy="720" r="13" fill="#d26c27" stroke="none" stroke-width="2"/><text xml:space="preserve" x="820" y="805" font-size="28" fill="#d26c27" text-anchor="middle" font-weight="400">回调：cancel() → True</text><text xml:space="preserve" x="1210" y="665" font-size="27" fill="#d26c27" text-anchor="middle" font-weight="400">恢复并交付取消异常</text><text xml:space="preserve" x="1210" y="805" font-size="28" fill="#d26c27" text-anchor="middle" font-weight="400">finally → 继续传播</text></g><desc> await 的语法相同，是否让出控制权决定取消如何交付 横向只表示事件先后，不代表实测耗时；受理取消请求与任务已经结束是两件事。</desc></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title id="figure-title">取消交付：先确认 await 是否真的挂起</title><desc id="figure-desc">同一事件循环中预先排入取消回调：await已完成Future可不挂起并正常完成；await待完成Future让出控制权，回调才可运行并请求取消。</desc><rect width="1200" height="760" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">取消交付：先确认 await 是否真的挂起</text><text x="40" y="112" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一事件循环：先排入取消回调，再执行以下 await</text><text x="40" y="175" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">A：Future 已完成，不需要挂起</text><rect x="40" y="205" width="340" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="210.0" y="251.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">await ready</text><path d="M390 243 L420 243" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="435" y="205" width="340" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="605.0" y="251.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">继续同步执行</text><path d="M785 243 L815 243" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="830" y="205" width="340" height="75" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="1000.0" y="251.95" font-size="27" fill="#2865a0" text-anchor="middle" font-weight="400">Task 正常完成</text><text x="40" y="340" font-size="26" fill="#2865a0" text-anchor="start" font-weight="400">回调随后才运行：对已完成 Task，cancel() 返回 False</text><text x="40" y="425" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">B：Future 未完成，确实让出控制权</text><rect x="40" y="455" width="340" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="210.0" y="501.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">await pending</text><path d="M390 493 L420 493" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="435" y="455" width="340" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="605.0" y="501.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">取消回调运行</text><path d="M785 493 L815 493" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="830" y="455" width="340" height="75" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="1000.0" y="501.95" font-size="27" fill="#c87536" text-anchor="middle" font-weight="400">异常传播与 finally</text><text x="40" y="590" font-size="26" fill="#c87536" text-anchor="start" font-weight="400">cancel() 返回 True 仅表示请求；本例继续传播 CancelledError</text><text x="40" y="705" font-size="28" fill="#213447" text-anchor="start" font-weight="400">await 的语法存在，不代表本次执行一定发生调度切换。</text></g></svg>

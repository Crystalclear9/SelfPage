<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="602" viewBox="0 0 1200 602" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 343.140000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 343.140000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 258.860000 684.000000 343.140000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 258.860000 684.000000 343.140000"/>
<title id="fig-title">await 何时把执行交还给事件循环</title>
<desc id="fig-desc">已完成的 Future 不挂起；等待未完成的 Future 才让取消回调在任务挂起时执行。</desc>
<rect x="0" y="0" width="1200" height="602" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="76" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">任务先排入取消回调，再执行 await</text>
<text x="77" y="128" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="600">已完成的 Future</text>
<path d="M144 200 L405 200" fill="none" stroke="#166d75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405 200 L705 200" fill="none" stroke="#166d75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M705 200 L1025 200" fill="none" stroke="#526976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<circle cx="144" cy="200" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="144" y="240" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">排入回调</text>
<circle cx="405" cy="200" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="405" y="240" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">await 直接返回</text>
<circle cx="705" cy="200" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="705" y="240" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">任务正常结束</text>
<circle cx="1025" cy="200" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="1025" y="240" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">回调才运行</text>
<text x="1025" y="277" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">cancel() → False</text>
<text x="77" y="333" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="600">尚未完成的 Future</text>
<path d="M144 405 L405 405" fill="none" stroke="#166d75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405 405 L705 405" fill="none" stroke="#526976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<path d="M705 405 L1025 405" fill="none" stroke="#526976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<circle cx="144" cy="405" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="144" y="445" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">排入回调</text>
<circle cx="405" cy="405" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="405" y="445" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">await 挂起</text>
<circle cx="705" cy="405" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="705" y="445" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">回调请求取消</text>
<circle cx="1025" cy="405" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="1025" y="445" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="middle" font-weight="400">交付取消异常</text>
<text x="705" y="482" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">cancel() → True</text>
<text x="1025" y="482" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="middle" font-weight="400">finally 后继续传播</text>
<path d="M75 523 L1125 523" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="567" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">横向只表示执行顺序；虚线表示任务没有正在执行。</text>
</svg>

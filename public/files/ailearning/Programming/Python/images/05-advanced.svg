<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">变形测试利用输入变化后的可预测关系</title><desc id="desc">若规格是对整数金额求和，重排输入不应改变结果。图把原始顺序和重排顺序映射到同一合计 60，构成一个不依赖被测实现内部步骤的变形关系。 这种性质只覆盖一类错误，并不能替代已知答案与边界用例。对于浮点数，求和顺序可能影响舍入；若要求近似关系，需提前声明容差及所用归约方法。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">变形测试利用输入变化后的可预测关系</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">这里只检验整数求和；顺序敏感任务不能套用排列不变性。</text><text x="65" y="169" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">10</text><rect x="415.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="428" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">20</text><rect x="765.0" y="190" width="336.0" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="778" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">30</text><text x="65" y="340" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">重排</text><rect x="285" y="310" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="344" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">30</text><rect x="525" y="310" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="344" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">10</text><rect x="765" y="310" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="344" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">20</text><text x="65" y="465" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">合计</text><rect x="285" y="435" width="226" height="84" fill="#f9e8d7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="469" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">60</text><text x="65" y="590" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">原合计</text><rect x="285" y="560" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="594" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">60</text></g></svg>

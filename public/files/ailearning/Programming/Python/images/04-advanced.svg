<svg xmlns="http://www.w3.org/2000/svg" width="1463.750" height="765.000" viewBox="18.750 70.000 1463.750 765.000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1463.75" height="765.0" fill="white" x="18.75" y="70.0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">从全新进程执行 import a；图定格在 b.py 读取 a.x 的瞬间。</text><text xml:space="preserve" x="50" y="215" font-size="34" fill="#193a4e" text-anchor="start" font-weight="700">a.py</text><text xml:space="preserve" x="70" y="280" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">1   import b</text><text xml:space="preserve" x="70" y="340" font-size="32" fill="#a0aeb7" text-anchor="start" font-weight="400">2   x = 1</text><text xml:space="preserve" x="50" y="400" font-size="27" fill="#193a4e" text-anchor="start" font-weight="400">第 1 行尚未返回，第 2 行未执行</text><text xml:space="preserve" x="50" y="535" font-size="34" fill="#193a4e" text-anchor="start" font-weight="700">b.py</text><text xml:space="preserve" x="70" y="600" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">1   import a</text><text xml:space="preserve" x="70" y="660" font-size="32" fill="#d76a22" text-anchor="start" font-weight="400">2   y = a.x</text><path d="M 345,275 H 445 V 595 H 345" stroke="#2676ad" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="445" y="455" font-size="27" fill="#2676ad" text-anchor="middle" font-weight="400">加载 b</text><text xml:space="preserve" x="620" y="215" font-size="34" fill="#193a4e" text-anchor="start" font-weight="700">sys.modules</text><rect x="610" y="255" width="220" height="170" rx="0" fill="#f3f8fb" stroke="#8ca5b4" stroke-width="2" /><line x1="610" y1="340" x2="830" y2="340" stroke="#a7bac6" stroke-width="2" stroke-dasharray="" /><text xml:space="preserve" x="650" y="310" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">"a"</text><text xml:space="preserve" x="650" y="395" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">"b"</text><line x1="725" y1="300" x2="985" y2="300" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><line x1="725" y1="385" x2="985" y2="565" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1030" y="220" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">模块对象 A</text><rect x="1000" y="255" width="400" height="180" rx="0" fill="#f3f8fb" stroke="#2676ad" stroke-width="3" /><text xml:space="preserve" x="1040" y="310" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">__name__ = "a"</text><text xml:space="preserve" x="1040" y="385" font-size="32" fill="#d76a22" text-anchor="start" font-weight="400">x：尚不存在</text><text xml:space="preserve" x="1030" y="505" font-size="32" fill="#193a4e" text-anchor="start" font-weight="700">模块对象 B</text><rect x="1000" y="540" width="400" height="170" rx="0" fill="#f3f8fb" stroke="#2676ad" stroke-width="3" /><text xml:space="preserve" x="1040" y="600" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">a</text><text xml:space="preserve" x="1040" y="665" font-size="30" fill="#a0aeb7" text-anchor="start" font-weight="400">y：尚未赋值</text><path d="M 1120,590 H 1450 V 340 H 1405" stroke="#2676ad" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M 360,650 H 890 V 380 H 995" stroke="#d76a22" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="680" y="700" font-size="30" fill="#d76a22" text-anchor="middle" font-weight="400">读取 a.x</text><text xml:space="preserve" x="50" y="800" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">缓存复用同一个 A，避免无限重建；它不保证 A 的顶层语句已全部执行。</text></g><desc> 循环导入的具体失败点：缓存里有 a，但 a.x 还没有绑定 此时查找 x → AttributeError；把定义提前可改变本例时序，仍需审查依赖方向。</desc></svg>

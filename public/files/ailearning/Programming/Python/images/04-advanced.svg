<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="982" viewBox="0 0 1440 982" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">循环导入会访问尚未初始化的模块</title><rect width="1440" height="982" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">循环导入会访问尚未初始化的模块</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="840" viewBox="0 0 1440 900" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>循环导入：模块已在缓存里，属性却还没有执行出来</title><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="38" fill="#1d3145" text-anchor="start">循环导入：模块已在缓存里，属性却还没有执行出来</text>
<text x="65" y="132" font-size="31" fill="#1e7499" text-anchor="start">a.py</text>
<text x="770" y="132" font-size="31" fill="#c66d3a" text-anchor="start">b.py</text>
<rect x="65" y="158" width="530" height="130" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1e7499" stroke-dasharray=""/>
<text x="95" y="207" font-size="30" fill="#1e7499" text-anchor="start">1  import b</text>
<text x="95" y="255" font-size="30" fill="#1e7499" text-anchor="start">2  x = 1</text>
<rect x="770" y="158" width="530" height="130" rx="3" fill="url(#book-wash-fff1e7)" stroke="#c66d3a" stroke-dasharray=""/>
<text x="800" y="207" font-size="30" fill="#c66d3a" text-anchor="start">1  import a</text>
<text x="800" y="255" font-size="30" fill="#c66d3a" text-anchor="start">2  y = a.x</text>
<text x="65" y="355" font-size="29" fill="#1d3145" text-anchor="start">新进程执行 import a；时间向下</text>
<line x1="250" y1="400" x2="250" y2="750" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/>
<line x1="700" y1="400" x2="700" y2="750" stroke="#7b889c" stroke-width="2" stroke-dasharray=""/>
<line x1="1140" y1="400" x2="1140" y2="750" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/>
<text x="250" y="390" font-size="27" fill="#1e7499" text-anchor="middle">A 的顶层执行</text>
<text x="700" y="390" font-size="27" fill="#1d3145" text-anchor="middle">sys.modules</text>
<text x="1140" y="390" font-size="27" fill="#c66d3a" text-anchor="middle">B 的顶层执行</text>
<rect x="580" y="420" width="240" height="60" rx="3" fill="url(#book-wash-edf5f8)" stroke="#1e7499" stroke-dasharray=""/>
<text x="700" y="460" font-size="27" fill="#1e7499" text-anchor="middle">"a" → 对象 A</text>
<line x1="260" y1="450" x2="575" y2="450" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/>
<path d="M563.95,454.67 L575.00,450.00 L563.95,445.33" fill="none" stroke="#1e7499" stroke-width="2"/>
<text x="70" y="525" font-size="27" fill="#1e7499" text-anchor="start">停在第 1 行</text>
<line x1="265" y1="520" x2="1135" y2="520" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/>
<path d="M1123.95,524.67 L1135.00,520.00 L1123.95,515.33" fill="none" stroke="#1e7499" stroke-width="2"/>
<text x="720" y="510" font-size="27" fill="#1e7499" text-anchor="middle">import b</text>
<rect x="580" y="550" width="240" height="60" rx="3" fill="url(#book-wash-fff1e7)" stroke="#c66d3a" stroke-dasharray=""/>
<text x="700" y="590" font-size="27" fill="#c66d3a" text-anchor="middle">"b" → 对象 B</text>
<line x1="1135" y1="580" x2="825" y2="580" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/>
<path d="M836.05,575.33 L825.00,580.00 L836.05,584.67" fill="none" stroke="#c66d3a" stroke-width="2"/>
<line x1="1135" y1="645" x2="825" y2="645" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/>
<path d="M836.05,640.33 L825.00,645.00 L836.05,649.67" fill="none" stroke="#c66d3a" stroke-width="2"/>
<text x="1060" y="630" font-size="27" fill="#c66d3a" text-anchor="end">import a</text>
<line x1="825" y1="665" x2="1135" y2="665" stroke="#1e7499" stroke-width="2" stroke-dasharray=""/>
<path d="M1123.95,669.67 L1135.00,665.00 L1123.95,660.33" fill="none" stroke="#1e7499" stroke-width="2"/>
<text x="735" y="700" font-size="27" fill="#1e7499" text-anchor="middle">取回同一个 A</text>
<text x="70" y="760" font-size="27" fill="#c66d3a" text-anchor="start">第 2 行尚未运行</text>
<text x="1030" y="750" font-size="29" fill="#c66d3a" text-anchor="start">读取 a.x</text>
<line x1="1065" y1="770" x2="850" y2="800" stroke="#c66d3a" stroke-width="2" stroke-dasharray=""/>
<path d="M860.30,793.84 L850.00,800.00 L861.59,803.10" fill="none" stroke="#c66d3a" stroke-width="2"/>
<rect x="580" y="785" width="270" height="62" rx="3" fill="url(#book-wash-fff1e7)" stroke="#c66d3a" stroke-dasharray=""/>
<text x="715" y="825" font-size="28" fill="#c66d3a" text-anchor="middle">A 中尚无属性 x</text>
<text x="900" y="830" font-size="30" fill="#c66d3a" text-anchor="start">AttributeError</text>
</g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="823.69" viewBox="17.12 14.00 1062.76 729.49" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">循环导入会访问尚未初始化的模块</title><desc id="desc">A 初始化过程中导入 B，B 再从 A 读取一个尚未执行到的定义，就可能遇到部分初始化状态。问题不在于文件找不到，而在于对象何时准备好；图沿导入依赖追踪这一时序。 循环导入不一定每次都失败，是否失败取决于具体读取发生在何时。抽取公共定义、调整依赖方向或延迟确有必要的导入，应基于职责设计，而不是随意交换语句掩盖问题。 循环导入不必然失败；此例失败在读取尚未定义的名字。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker><marker id="tip-d67c47" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">循环导入会访问尚未初始化的模块</text><path d="M410,260 L730,260" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M823.714,318 L636.286,482" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M503.714,482 L316.286,318" stroke="#c87536" stroke-width="3" fill="none" marker-end="url(#tip-d67c47)" stroke-linecap="round" stroke-linejoin="round" /><rect x="90" y="202" width="320" height="116" fill="#e1edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="110" y="248" font-size="24" fill="#213447" text-anchor="start" font-weight="400">模块 A：开始初始化</text><rect x="730" y="202" width="320" height="116" fill="#e1edf7" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="750" y="248" font-size="24" fill="#213447" text-anchor="start" font-weight="400">模块 B：被 A 导入</text><rect x="410" y="482" width="320" height="116" fill="#fae9d9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="430" y="528" font-size="24" fill="#213447" text-anchor="start" font-weight="400">B 读取 A 尚未定义的名字</text><text x="140" y="705" font-size="24" fill="#627689" text-anchor="start" font-weight="400">沿有向路径返回尚未完成的对象；先确认边所表达的关系。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>循环导入：模块已在缓存里，属性却还没有执行出来</title><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="55" y="65" font-size="38" fill="#203742" text-anchor="start">循环导入：模块已在缓存里，属性却还没有执行出来</text>
<text x="65" y="132" font-size="31" fill="#216c89" text-anchor="start">a.py</text>
<text x="770" y="132" font-size="31" fill="#c96937" text-anchor="start">b.py</text>
<rect x="65" y="158" width="530" height="130" rx="3" fill="#edf5f8" stroke="#216c89" stroke-dasharray=""/>
<text x="95" y="207" font-size="30" fill="#216c89" text-anchor="start">1  import b</text>
<text x="95" y="255" font-size="30" fill="#216c89" text-anchor="start">2  x = 1</text>
<rect x="770" y="158" width="530" height="130" rx="3" fill="#fff1e7" stroke="#c96937" stroke-dasharray=""/>
<text x="800" y="207" font-size="30" fill="#c96937" text-anchor="start">1  import a</text>
<text x="800" y="255" font-size="30" fill="#c96937" text-anchor="start">2  y = a.x</text>
<text x="65" y="355" font-size="29" fill="#203742" text-anchor="start">新进程执行 import a；时间向下</text>
<line x1="250" y1="400" x2="250" y2="750" stroke="#216c89" stroke-width="2" stroke-dasharray=""/>
<line x1="700" y1="400" x2="700" y2="750" stroke="#7b8c95" stroke-width="2" stroke-dasharray=""/>
<line x1="1140" y1="400" x2="1140" y2="750" stroke="#c96937" stroke-width="2" stroke-dasharray=""/>
<text x="250" y="390" font-size="27" fill="#216c89" text-anchor="middle">A 的顶层执行</text>
<text x="700" y="390" font-size="27" fill="#203742" text-anchor="middle">sys.modules</text>
<text x="1140" y="390" font-size="27" fill="#c96937" text-anchor="middle">B 的顶层执行</text>
<rect x="580" y="420" width="240" height="60" rx="3" fill="#edf5f8" stroke="#216c89" stroke-dasharray=""/>
<text x="700" y="460" font-size="27" fill="#216c89" text-anchor="middle">&quot;a&quot; → 对象 A</text>
<line x1="260" y1="450" x2="575" y2="450" stroke="#216c89" stroke-width="2" stroke-dasharray=""/>
<path d="M563.95,454.67 L575.00,450.00 L563.95,445.33" fill="none" stroke="#216c89" stroke-width="2"/>
<text x="70" y="525" font-size="27" fill="#216c89" text-anchor="start">停在第 1 行</text>
<line x1="265" y1="520" x2="1135" y2="520" stroke="#216c89" stroke-width="2" stroke-dasharray=""/>
<path d="M1123.95,524.67 L1135.00,520.00 L1123.95,515.33" fill="none" stroke="#216c89" stroke-width="2"/>
<text x="720" y="510" font-size="27" fill="#216c89" text-anchor="middle">import b</text>
<rect x="580" y="550" width="240" height="60" rx="3" fill="#fff1e7" stroke="#c96937" stroke-dasharray=""/>
<text x="700" y="590" font-size="27" fill="#c96937" text-anchor="middle">&quot;b&quot; → 对象 B</text>
<line x1="1135" y1="580" x2="825" y2="580" stroke="#c96937" stroke-width="2" stroke-dasharray=""/>
<path d="M836.05,575.33 L825.00,580.00 L836.05,584.67" fill="none" stroke="#c96937" stroke-width="2"/>
<line x1="1135" y1="645" x2="825" y2="645" stroke="#c96937" stroke-width="2" stroke-dasharray=""/>
<path d="M836.05,640.33 L825.00,645.00 L836.05,649.67" fill="none" stroke="#c96937" stroke-width="2"/>
<text x="1060" y="630" font-size="27" fill="#c96937" text-anchor="end">import a</text>
<line x1="825" y1="665" x2="1135" y2="665" stroke="#216c89" stroke-width="2" stroke-dasharray=""/>
<path d="M1123.95,669.67 L1135.00,665.00 L1123.95,660.33" fill="none" stroke="#216c89" stroke-width="2"/>
<text x="735" y="700" font-size="27" fill="#216c89" text-anchor="middle">取回同一个 A</text>
<text x="70" y="760" font-size="27" fill="#c96937" text-anchor="start">第 2 行尚未运行</text>
<text x="1030" y="750" font-size="29" fill="#c96937" text-anchor="start">读取 a.x</text>
<line x1="1065" y1="770" x2="850" y2="800" stroke="#c96937" stroke-width="2" stroke-dasharray=""/>
<path d="M860.30,793.84 L850.00,800.00 L861.59,803.10" fill="none" stroke="#c96937" stroke-width="2"/>
<rect x="580" y="785" width="270" height="62" rx="3" fill="#fff1e7" stroke="#c96937" stroke-dasharray=""/>
<text x="715" y="825" font-size="28" fill="#c96937" text-anchor="middle">A 中尚无属性 x</text>
<text x="900" y="830" font-size="30" fill="#c96937" text-anchor="start">AttributeError</text>
</g></svg>

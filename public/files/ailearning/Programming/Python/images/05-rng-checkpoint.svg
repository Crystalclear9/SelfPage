<svg xmlns="http://www.w3.org/2000/svg" width="1252.267" height="632.213" viewBox="13.867 59.703 1252.267 632.213"><rect width="1252.267" height="632.213" fill="white" x="13.867" y="59.703" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#52677a" stroke-width="1.5" /></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="108" font-size="27" fill="#52677a">同一个 random.Random(2026)，每个圆点代表一次 random() 调用</text><path d="M75 222 L1200 222" fill="none" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" /><circle cx="110" cy="222" r="10" fill="#2474b5" /><text x="70" y="193" font-size="25" fill="#17334b">1 次</text><text x="61" y="268" font-size="27" fill="#17334b">0.119</text><circle cx="260" cy="222" r="10" fill="#2474b5" /><text x="220" y="193" font-size="25" fill="#17334b">2 次</text><text x="211" y="268" font-size="27" fill="#17334b">0.503</text><circle cx="410" cy="222" r="10" fill="#2474b5" /><text x="370" y="193" font-size="25" fill="#17334b">3 次</text><text x="361" y="268" font-size="27" fill="#17334b">0.512</text><circle cx="560" cy="222" r="10" fill="#168578" /><text x="520" y="193" font-size="25" fill="#17334b">4 次</text><text x="511" y="268" font-size="27" fill="#17334b">0.860</text><circle cx="710" cy="222" r="10" fill="#168578" /><text x="670" y="193" font-size="25" fill="#17334b">5 次</text><text x="661" y="268" font-size="27" fill="#17334b">0.103</text><circle cx="860" cy="222" r="10" fill="#168578" /><text x="820" y="193" font-size="25" fill="#17334b">6 次</text><text x="811" y="268" font-size="27" fill="#17334b">0.223</text><circle cx="1010" cy="222" r="10" fill="#168578" /><text x="970" y="193" font-size="25" fill="#17334b">7 次</text><text x="961" y="268" font-size="27" fill="#17334b">0.601</text><circle cx="1160" cy="222" r="10" fill="#168578" /><text x="1120" y="193" font-size="25" fill="#17334b">8 次</text><text x="1111" y="268" font-size="27" fill="#17334b">0.557</text><path d="M485 150 V300" stroke="#d5752e" stroke-width="3" stroke-dasharray="8 6" /><text x="350" y="335" font-size="28" fill="#d5752e">保存 state：已消费前 3 次</text><text x="40" y="405" font-size="30" fill="#168578">恢复检查点</text><path d="M280 396 L570 396" fill="none" stroke="#168578" stroke-width="3" marker-end="url(#arrow)" /><text x="600" y="405" font-size="31" fill="#168578">0.860 → 0.103 → 0.223 → …</text><text x="40" y="460" font-size="27" fill="#17334b">setstate(state)</text><text x="600" y="459" font-size="27" fill="#17334b">从第 4 次接着走，匹配 continuation</text><text x="40" y="560" font-size="30" fill="#d5752e">仅重新设种子</text><path d="M280 551 L570 551" fill="none" stroke="#d5752e" stroke-width="3" marker-end="url(#arrow)" /><text x="600" y="560" font-size="31" fill="#d5752e">0.119 → 0.503 → 0.512 → …</text><text x="40" y="615" font-size="27" fill="#17334b">Random(2026)</text><text x="600" y="614" font-size="27" fill="#17334b">回到第 1 次，重复已经消费的前缀</text><path d="M40 665 H1240" stroke="#d8e1e8" stroke-width="2" /></g><desc> 种子决定起点，检查点状态决定从哪里续写 状态恢复验证“后续序列相同”；它不证明采样分布正确。</desc></svg>

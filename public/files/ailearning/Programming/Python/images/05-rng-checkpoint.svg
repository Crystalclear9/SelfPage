<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="820.5248" viewBox="0 0 1440 820.5248" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">随机流前三次已消费，保存状态后恢复从第四次继续，仅重新设种子则返回第一次</title><rect width="1440" height="820.5248" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="35" font-weight="700" fill="#142b45">随机流前三次已消费，保存状态后恢复从第四次继续，仅重新设种子则返回第一次</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="678.5248" viewBox="13.867 59.703 1252.267 632.213" x="48" y="106" overflow="hidden"><rect width="1252.267" height="632.213" fill="white" x="13.867" y="59.703"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#527087" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="108" font-size="27" fill="#527087">同一个 random.Random(2026)，每个圆点代表一次 random() 调用</text><path d="M75 222 L1200 222" fill="none" stroke="#527087" stroke-width="3" marker-end="url(#arrow)"/><circle cx="110" cy="222" r="10" fill="#1f81c7"/><text x="70" y="193" font-size="25" fill="#173c58">1 次</text><text x="61" y="268" font-size="27" fill="#173c58">0.119</text><circle cx="260" cy="222" r="10" fill="#1f81c7"/><text x="220" y="193" font-size="25" fill="#173c58">2 次</text><text x="211" y="268" font-size="27" fill="#173c58">0.503</text><circle cx="410" cy="222" r="10" fill="#1f81c7"/><text x="370" y="193" font-size="25" fill="#173c58">3 次</text><text x="361" y="268" font-size="27" fill="#173c58">0.512</text><circle cx="560" cy="222" r="10" fill="#148f94"/><text x="520" y="193" font-size="25" fill="#173c58">4 次</text><text x="511" y="268" font-size="27" fill="#173c58">0.860</text><circle cx="710" cy="222" r="10" fill="#148f94"/><text x="670" y="193" font-size="25" fill="#173c58">5 次</text><text x="661" y="268" font-size="27" fill="#173c58">0.103</text><circle cx="860" cy="222" r="10" fill="#148f94"/><text x="820" y="193" font-size="25" fill="#173c58">6 次</text><text x="811" y="268" font-size="27" fill="#173c58">0.223</text><circle cx="1010" cy="222" r="10" fill="#148f94"/><text x="970" y="193" font-size="25" fill="#173c58">7 次</text><text x="961" y="268" font-size="27" fill="#173c58">0.601</text><circle cx="1160" cy="222" r="10" fill="#148f94"/><text x="1120" y="193" font-size="25" fill="#173c58">8 次</text><text x="1111" y="268" font-size="27" fill="#173c58">0.557</text><path d="M485 150 V300" stroke="#d07533" stroke-width="3" stroke-dasharray="8 6"/><text x="350" y="335" font-size="28" fill="#d07533">保存 state：已消费前 3 次</text><text x="40" y="405" font-size="30" fill="#148f94">恢复检查点</text><path d="M280 396 L570 396" fill="none" stroke="#148f94" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="405" font-size="31" fill="#148f94">0.860 → 0.103 → 0.223 → …</text><text x="40" y="460" font-size="27" fill="#173c58">setstate(state)</text><text x="600" y="459" font-size="27" fill="#173c58">从第 4 次接着走，匹配 continuation</text><text x="40" y="560" font-size="30" fill="#d07533">仅重新设种子</text><path d="M280 551 L570 551" fill="none" stroke="#d07533" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="560" font-size="31" fill="#d07533">0.119 → 0.503 → 0.512 → …</text><text x="40" y="615" font-size="27" fill="#173c58">Random(2026)</text><text x="600" y="614" font-size="27" fill="#173c58">回到第 1 次，重复已经消费的前缀</text><path d="M40 665 H1240" stroke="#dce2eb" stroke-width="2"/></g><desc> 种子决定起点，检查点状态决定从哪里续写 状态恢复验证“后续序列相同”；它不证明采样分布正确。</desc></svg></svg>

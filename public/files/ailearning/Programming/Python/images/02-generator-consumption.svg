<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="fig-title fig-desc">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 228.000000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 228.000000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 172.000000 684.000000 228.000000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 172.000000 684.000000 228.000000"/>
<title id="fig-title">生成器的同一个消费位置</title>
<desc id="fig-desc">函数调用创建生成器，next 返回第一个元素后暂停，list 从该暂停点继续收集。</desc>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="75" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">同一个生成器向前推进</text>
<path d="M99 240 L1119 240" fill="none" stroke="#233b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1119 240 L1108 245 L1108 235 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="144" cy="240" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="144" y="284" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">刚创建</text>
<circle cx="376" cy="240" r="8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="376" y="284" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">yield 0</text>
<circle cx="608" cy="240" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="608" y="284" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">yield 1</text>
<circle cx="840" cy="240" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="840" y="284" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">yield 2</text>
<circle cx="1061" cy="240" r="8" fill="#a74d3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="1061" y="284" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="middle" font-weight="400">耗尽</text>
<path d="M66 168 L93 113 L239 113 L212 168 Z" fill="url(#n)" stroke="#526976" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="152.5" y="149.6" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">values()</text>
<path d="M299 168 L326 113 L457 113 L430 168 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="378" y="149.6" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" font-weight="400">next(g)</text>
<path d="M565 168 L592 113 L1104 113 L1077 168 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="834.5" y="149.6" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="26" text-anchor="middle" font-weight="400">list(g) 从暂停处接着收集</text>

<path d="M608 228 L603 217 L613 217 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1061 178 L1061 228" fill="none" stroke="#a74d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1061 228 L1056 217 L1066 217 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="375" y="352" fill="#166d75" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="middle" font-weight="400">返回 0</text>
<text x="832" y="352" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="middle" font-weight="400">返回 [1, 2]</text>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="845" viewBox="0 0 1200 845" role="img"><title id="figure-title">Welford 更新：均值移动，旧样本的离差也改变</title><desc id="figure-desc">样本2与4的均值3、M2=2。加入8后均值14/3，三项平方离差64/9、4/9、100/9合计56/3；在线更新2+5×10/3得到相同结果。</desc><rect width="1200" height="845" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">Welford 更新：均值移动，旧样本的离差也改变</text><text x="55" y="155" font-size="29" fill="#213447" text-anchor="start" font-weight="400">旧样本：均值 3</text><line x1="120" y1="220" x2="850" y2="220" stroke="#cbd9e4" stroke-width="2" /><line x1="284" y1="214" x2="284" y2="226" stroke="#cbd9e4" stroke-width="2" /><text x="284" y="260" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="366" y1="214" x2="366" y2="226" stroke="#cbd9e4" stroke-width="2" /><text x="366" y="260" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><line x1="448" y1="214" x2="448" y2="226" stroke="#cbd9e4" stroke-width="2" /><text x="448" y="260" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="612" y1="214" x2="612" y2="226" stroke="#cbd9e4" stroke-width="2" /><text x="612" y="260" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">6</text><line x1="776" y1="214" x2="776" y2="226" stroke="#cbd9e4" stroke-width="2" /><text x="776" y="260" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">8</text><circle cx="284" cy="220" r="8" fill="#2865a0" /><circle cx="448" cy="220" r="8" fill="#2865a0" /><line x1="366" y1="178" x2="366" y2="265" stroke="#c87536" stroke-width="3" stroke-dasharray="5 6" /><line x1="284" y1="198" x2="366" y2="198" stroke="#2865a0" stroke-width="3" /><line x1="366" y1="184" x2="448" y2="184" stroke="#2865a0" stroke-width="3" /><text x="55" y="355" font-size="29" fill="#213447" text-anchor="start" font-weight="400">加入 8：所有离差都需重新居中</text><line x1="120" y1="420" x2="850" y2="420" stroke="#cbd9e4" stroke-width="2" /><line x1="284" y1="414" x2="284" y2="426" stroke="#cbd9e4" stroke-width="2" /><text x="284" y="460" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">2</text><line x1="366" y1="414" x2="366" y2="426" stroke="#cbd9e4" stroke-width="2" /><text x="366" y="460" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">3</text><line x1="448" y1="414" x2="448" y2="426" stroke="#cbd9e4" stroke-width="2" /><text x="448" y="460" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">4</text><line x1="612" y1="414" x2="612" y2="426" stroke="#cbd9e4" stroke-width="2" /><text x="612" y="460" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">6</text><line x1="776" y1="414" x2="776" y2="426" stroke="#cbd9e4" stroke-width="2" /><text x="776" y="460" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">8</text><circle cx="284" cy="420" r="8" fill="#2865a0" /><circle cx="448" cy="420" r="8" fill="#2865a0" /><circle cx="776" cy="420" r="8" fill="#2865a0" /><line x1="502.6666666666667" y1="378" x2="502.6666666666667" y2="465" stroke="#c87536" stroke-width="3" stroke-dasharray="5 6" /><line x1="284" y1="398" x2="502.6666666666667" y2="398" stroke="#2865a0" stroke-width="3" /><line x1="448" y1="384" x2="502.6666666666667" y2="384" stroke="#2865a0" stroke-width="3" /><line x1="502.6666666666667" y1="370" x2="776" y2="370" stroke="#2865a0" stroke-width="3" /><text x="915" y="180" font-size="28" fill="#213447" text-anchor="start" font-weight="400">n：2 → 3</text><text 
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img"><title>分块求值会重复引入错误函数的额外常数</title><rect width="1800" height="1300" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="900" y="75" font-size="37" fill="#203b4a" text-anchor="middle" font-weight="400">错误函数 F(xs) = sum(xs) + 1</text><text x="80" y="270" font-size="34" fill="#203b4a" text-anchor="start" font-weight="400">一次调用</text><rect x="450" y="210" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="500" y="275" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">1</text><rect x="565" y="210" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="615" y="275" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">2</text><rect x="680" y="210" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="730" y="275" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">3</text><text x="580" y="400" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">求和 6</text><text x="580" y="480" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">再加 1</text><line x1="580" y1="510" x2="580" y2="560" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><text x="580" y="630" font-size="43" fill="#d87332" text-anchor="middle" font-weight="400">7</text><text x="1560" y="395" font-size="42" fill="#d87332" text-anchor="middle" font-weight="400">7</text><text x="80" y="770" font-size="34" fill="#203b4a" text-anchor="start" font-weight="400">分成两次调用</text><rect x="450" y="710" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="500" y="775" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">1</text><rect x="565" y="710" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="615" y="775" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">2</text><text x="580" y="900" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">求和 3</text><text x="580" y="980" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">再加 1</text><line x1="580" y1="1010" x2="580" y2="1060" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><text x="580" y="1130" font-size="43" fill="#d87332" text-anchor="middle" font-weight="400">4</text><rect x="1100" y="710" width="100" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="1150" y="775" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">3</text><text x="1230" y="900" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">求和 3</text><text x="1230" y="980" font-size="34" fill="#d87332" text-anchor="middle" font-weight="400">再加 1</text><line x1="1230" y1="1010" x2="1230" y2="1060" stroke="#80929d" stroke-width="3" marker-end="url(#g)"/><text x="1230" y="1130" font-size="43" fill="#d87332" text-anchor="middle" font-weight="400">4</text><text x="1560" y="895" font-size="42" fill="#d87332" text-anchor="middle" font-weight="400">4 + 4 = 8</text><text x="900" y="1250" font-size="35" fill="#203b4a" text-anchor="middle" font-weight="400">分块可加性失败：额外常数从 1 份变成 2 份</text></g></svg>
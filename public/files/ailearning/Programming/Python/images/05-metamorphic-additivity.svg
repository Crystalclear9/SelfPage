<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 637" role="img" aria-labelledby="title description" width="900" height="477.750000">
<view id="textbook-detail-1-1" viewBox="0.000000 0.000000 684.000000 363.090000"/>
<view id="textbook-detail-1-2" viewBox="516.000000 0.000000 684.000000 363.090000"/>
<view id="textbook-detail-2-1" viewBox="0.000000 273.910000 684.000000 363.090000"/>
<view id="textbook-detail-2-2" viewBox="516.000000 273.910000 684.000000 363.090000"/>
<title id="title">规格性质必须能够区分实现错误</title>
<desc id="description">错误函数 F 加一，分成两块调用时会加两次，故违反分块可加性。错误函数 G 把总和乘二，可加性通过，单个输入的独立锚点仍能揭示错误。</desc>
<defs>
<linearGradient id="wash-t" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f1faf9"/><stop offset="1" stop-color="#cbe7e8"/></linearGradient>
<linearGradient id="wash-r" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#fef5f1"/><stop offset="1" stop-color="#f1d3ca"/></linearGradient>
<linearGradient id="wash-v" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9f5fc"/><stop offset="1" stop-color="#e6dced"/></linearGradient>
<linearGradient id="wash-g" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f5faf6"/><stop offset="1" stop-color="#d7ebdd"/></linearGradient>
<linearGradient id="wash-n" x1="0" y1="0" x2=".93" y2="1"><stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#e8eef1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="637" fill="white" stroke="none" stroke-width="1.6"/>
<text x="302" y="58" fill="#212c39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">多加常数，分块会暴露错误</text>
<text x="908" y="58" fill="#212c39" font-size="35" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">整体翻倍，分块仍然通过</text>
<text x="274" y="128" fill="#536777" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">一次调用</text>
<path d="M77 199l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="184" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1, 2, 3</text>
<path d="M255 176L345 176" stroke="#a44736" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M356 176 L342 170.5L342 181.5Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M370 199l18 -48h111l-18 48Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="437" y="184" fill="#a44736" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">7</text>
<text x="274" y="310" fill="#536777" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">拆成两次</text>
<path d="M77 381l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="366" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1, 2</text>
<path d="M255 358L345 358" stroke="#a44736" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M356 358 L342 352.5L342 363.5Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M370 381l18 -48h111l-18 48Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="437" y="366" fill="#a44736" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">4</text>
<path d="M77 447l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="432" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<path d="M255 424L345 424" stroke="#a44736" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M356 424 L342 418.5L342 429.5Z" stroke="#a44736" stroke-width="1" fill="#a44736" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M370 447l18 -48h111l-18 48Z" stroke="#a44736" stroke-width="1.9" fill="url(#wash-r)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="437" y="432" fill="#a44736" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">4</text>
<text x="283" y="500" fill="#a44736" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">7 ≠ 4 + 4</text>
<text x="283" y="556" fill="#536777" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">分块改变了额外常数的份数</text>
<text x="878" y="128" fill="#536777" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">一次调用</text>
<path d="M681 199l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="762" y="184" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1, 2, 3</text>
<path d="M859 176L949 176" stroke="#176b73" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M960 176 L946 170.5L946 181.5Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M974 199l18 -48h111l-18 48Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1041" y="184" fill="#176b73" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">12</text>
<text x="878" y="310" fill="#536777" font-size="29" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">拆成两次</text>
<path d="M681 381l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="762" y="366" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">1, 2</text>
<path d="M859 358L949 358" stroke="#176b73" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M960 358 L946 352.5L946 363.5Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M974 381l18 -48h111l-18 48Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1041" y="366" fill="#176b73" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">6</text>
<path d="M681 447l18 -48h151l-18 48Z" stroke="#536777" stroke-width="1.9" fill="url(#wash-n)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="762" y="432" fill="#212c39" font-size="28" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">3</text>
<path d="M859 424L949 424" stroke="#176b73" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M960 424 L946 418.5L946 429.5Z" stroke="#176b73" stroke-width="1" fill="#176b73" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M974 447l18 -48h111l-18 48Z" stroke="#176b73" stroke-width="1.9" fill="url(#wash-t)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1041" y="432" fill="#176b73" font-size="29" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">6</text>
<text x="887" y="500" fill="#176b73" font-size="35" text-anchor="middle" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif">12 = 6 + 6</text>
<text x="887" y="556" fill="#536777" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">锚点输入 [1] 的正确和为 1</text>
<text x="887" y="600" fill="#a44736" font-size="28" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, STSong, Microsoft YaHei, serif">翻倍函数却给出 2</text>
</svg>

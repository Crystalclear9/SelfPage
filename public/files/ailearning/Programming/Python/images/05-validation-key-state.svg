<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img"><title>先验证，再登记：两条记录足以暴露漏单</title><rect width="1400" height="940" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="34" fill="#21384a" text-anchor="start" font-weight="bold">先验证，再登记：两条记录足以暴露漏单</text><text x="48" y="105" font-size="26" fill="#6b7a86" text-anchor="start" font-weight="normal">节点表示 seen 中登记的编号；输入抽自主例原位置 3、4，订单编号均为 three</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e3ea" stroke-width="2"/><text x="380" y="187" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">原位置 3</text><circle cx="380" cy="252" r="45" stroke="#c86b2c" stroke-width="2" fill="white"/><text x="380" y="264" font-size="33" fill="#c86b2c" text-anchor="middle" font-weight="normal">-1</text><text x="380" y="338" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">order_id = three</text><text x="820" y="187" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">原位置 4</text><circle cx="820" cy="252" r="45" stroke="#286ca5" stroke-width="2" fill="white"/><text x="820" y="264" font-size="33" fill="#286ca5" text-anchor="middle" font-weight="normal">250</text><text x="820" y="338" font-size="27" fill="#286ca5" text-anchor="middle" font-weight="normal">order_id = three</text><text x="65" y="397" font-size="29" fill="#207e71" text-anchor="start" font-weight="bold">正确：验证通过后登记</text><circle cx="160" cy="500" r="42" stroke="#207e71" stroke-width="2" fill="white"/><text x="160" y="511" font-size="27" fill="#207e71" text-anchor="middle" font-weight="normal">空</text><line x1="209" y1="500" x2="550" y2="500" stroke="#207e71" stroke-width="3"/><path d="M539.4690092573155,505.75310646325045 L550,500 L539.4690092573155,494.24689353674955" stroke="#207e71" stroke-width="3" fill="none" stroke-linecap="round"/><text x="380" y="472" font-size="27" fill="#207e71" text-anchor="middle" font-weight="normal">拒绝，不登记</text><circle cx="600" cy="500" r="42" stroke="#207e71" stroke-width="2" fill="white"/><text x="600" y="511" font-size="27" fill="#207e71" text-anchor="middle" font-weight="normal">空</text><line x1="649" y1="500" x2="990" y2="500" stroke="#207e71" stroke-width="3"/><path d="M979.4690092573155,505.75310646325045 L990,500 L979.4690092573155,494.24689353674955" stroke="#207e71" stroke-width="3" fill="none" stroke-linecap="round"/><text x="820" y="472" font-size="27" fill="#207e71" text-anchor="middle" font-weight="normal">接收，再登记</text><circle cx="1040" cy="500" r="42" stroke="#207e71" stroke-width="2" fill="white"/><text x="1040" y="511" font-size="27" fill="#207e71" text-anchor="middle" font-weight="normal">three</text><text x="1210" y="512" font-size="30" fill="#207e71" text-anchor="middle" font-weight="normal">B = 250</text><text x="160" y="587" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 0 条</text><text x="600" y="587" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 1 条</text><text x="1040" y="587" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 2 条</text><text x="65" y="662" font-size="29" fill="#c86b2c" text-anchor="start" font-weight="bold">错误：验证前提前登记</text><circle cx="160" cy="765" r="42" stroke="#c86b2c" stroke-width="2" fill="white"/><text x="160" y="776" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">空</text><line x1="209" y1="765" x2="550" y2="765" stroke="#c86b2c" stroke-width="3"/><path d="M539.4690092573155,770.7531064632504 L550,765 L539.4690092573155,759.2468935367496" stroke="#c86b2c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="380" y="737" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">登记后才拒绝</text><circle cx="600" cy="765" r="42" stroke="#c86b2c" stroke-width="2" fill="white"/><text x="600" y="776" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">three</text><line x1="649" y1="765" x2="990" y2="765" stroke="#c86b2c" stroke-width="3"/><path d="M979.4690092573155,770.7531064632504 L990,765 L979.4690092573155,759.2468935367496" stroke="#c86b2c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="820" y="737" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">误判为重复</text><circle cx="1040" cy="765" r="42" stroke="#c86b2c" stroke-width="2" fill="white"/><text x="1040" y="776" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">three</text><text x="1210" y="777" font-size="30" fill="#c86b2c" text-anchor="middle" font-weight="normal">B = 0</text><text x="160" y="852" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 0 条</text><text x="600" y="852" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 1 条</text><text x="1040" y="852" font-size="26" fill="#6b7a86" text-anchor="middle" font-weight="normal">处理 2 条</text><text x="65" y="924" font-size="28" fill="#21384a" text-anchor="start" font-weight="bold">金额 −1 不合法；它不能抢先占用编号，从而阻断后面的合法 250。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="961.25" viewBox="0 0 1440 961.25" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">从主例抽取非法负金额与同编号合法金额，对照验证后登记和错误提前登记的seen状态及漏单结果</title><rect width="1440" height="961.25" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="29" font-weight="700" fill="#142b45">从主例抽取非法负金额与同编号合法金额，对照验证后登记和错误提前登记的seen状态及漏单结果</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="819.25" viewBox="19.833 54.814 1360.333 829.206" role="img" x="48" y="106" overflow="hidden"><title>先验证，再登记：两条记录足以暴露漏单</title><rect width="1360.333" height="829.206" fill="white" x="19.833" y="54.814"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="105" font-size="26" fill="#6b8393" text-anchor="start" font-weight="normal">节点表示 seen 中登记的编号；输入抽自主例原位置 3、4，订单编号均为 three</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e3ea" stroke-width="2"/><text x="380" y="187" font-size="27" fill="#6b8393" text-anchor="middle" font-weight="normal">原位置 3</text><circle cx="380" cy="252" r="45" stroke="#c46c30" stroke-width="2" fill="white"/><text x="380" y="264" font-size="33" fill="#c46c30" text-anchor="middle" font-weight="normal">-1</text><text x="380" y="338" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">order_id = three</text><text x="820" y="187" font-size="27" fill="#6b8393" text-anchor="middle" font-weight="normal">原位置 4</text><circle cx="820" cy="252" r="45" stroke="#2478b6" stroke-width="2" fill="white"/><text x="820" y="264" font-size="33" fill="#2478b6" text-anchor="middle" font-weight="normal">250</text><text x="820" y="338" font-size="27" fill="#2478b6" text-anchor="middle" font-weight="normal">order_id = three</text><text x="65" y="397" font-size="29" fill="#1d8b8e" text-anchor="start" font-weight="bold">正确：验证通过后登记</text><circle cx="160" cy="500" r="42" stroke="#1d8b8e" stroke-width="2" fill="white"/><text x="160" y="511" font-size="27" fill="#1d8b8e" text-anchor="middle" font-weight="normal">空</text><line x1="209" y1="500" x2="550" y2="500" stroke="#1d8b8e" stroke-width="3"/><path d="M539.4690092573155,505.75310646325045 L550,500 L539.4690092573155,494.24689353674955" stroke="#1d8b8e" stroke-width="3" fill="none" stroke-linecap="round"/><text x="380" y="472" font-size="27" fill="#1d8b8e" text-anchor="middle" font-weight="normal">拒绝，不登记</text><circle cx="600" cy="500" r="42" stroke="#1d8b8e" stroke-width="2" fill="white"/><text x="600" y="511" font-size="27" fill="#1d8b8e" text-anchor="middle" font-weight="normal">空</text><line x1="649" y1="500" x2="990" y2="500" stroke="#1d8b8e" stroke-width="3"/><path d="M979.4690092573155,505.75310646325045 L990,500 L979.4690092573155,494.24689353674955" stroke="#1d8b8e" stroke-width="3" fill="none" stroke-linecap="round"/><text x="820" y="472" font-size="27" fill="#1d8b8e" text-anchor="middle" font-weight="normal">接收，再登记</text><circle cx="1040" cy="500" r="42" stroke="#1d8b8e" stroke-width="2" fill="white"/><text x="1040" y="511" font-size="27" fill="#1d8b8e" text-anchor="middle" font-weight="normal">three</text><text x="1210" y="512" font-size="30" fill="#1d8b8e" text-anchor="middle" font-weight="normal">B = 250</text><text x="160" y="587" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 0 条</text><text x="600" y="587" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 1 条</text><text x="1040" y="587" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 2 条</text><text x="65" y="662" font-size="29" fill="#c46c30" text-anchor="start" font-weight="bold">错误：验证前提前登记</text><circle cx="160" cy="765" r="42" stroke="#c46c30" stroke-width="2" fill="white"/><text x="160" y="776" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">空</text><line x1="209" y1="765" x2="550" y2="765" stroke="#c46c30" stroke-width="3"/><path d="M539.4690092573155,770.7531064632504 L550,765 L539.4690092573155,759.2468935367496" stroke="#c46c30" stroke-width="3" fill="none" stroke-linecap="round"/><text x="380" y="737" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">登记后才拒绝</text><circle cx="600" cy="765" r="42" stroke="#c46c30" stroke-width="2" fill="white"/><text x="600" y="776" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">three</text><line x1="649" y1="765" x2="990" y2="765" stroke="#c46c30" stroke-width="3"/><path d="M979.4690092573155,770.7531064632504 L990,765 L979.4690092573155,759.2468935367496" stroke="#c46c30" stroke-width="3" fill="none" stroke-linecap="round"/><text x="820" y="737" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">误判为重复</text><circle cx="1040" cy="765" r="42" stroke="#c46c30" stroke-width="2" fill="white"/><text x="1040" y="776" font-size="27" fill="#c46c30" text-anchor="middle" font-weight="normal">three</text><text x="1210" y="777" font-size="30" fill="#c46c30" text-anchor="middle" font-weight="normal">B = 0</text><text x="160" y="852" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 0 条</text><text x="600" y="852" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 1 条</text><text x="1040" y="852" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">处理 2 条</text></g><desc> 先验证，再登记：两条记录足以暴露漏单 金额 −1 不合法；它不能抢先占用编号，从而阻断后面的合法 250。</desc></svg></svg>

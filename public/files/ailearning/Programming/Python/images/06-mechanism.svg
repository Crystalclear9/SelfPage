<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="807.4601" viewBox="0 0 1440 807.4601" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">可变容器的不变型来自写入风险</title><rect width="1440" height="807.4601" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">可变容器的不变型来自写入风险</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="665.4601" viewBox="13.867 59.763 1252.267 620.04" x="48" y="106" overflow="hidden"><rect width="1252.267" height="620.04" fill="white" x="13.867" y="59.763"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#527087" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="108" font-size="27" fill="#527087">反证假设：允许把 list[Cat] 传给接收 list[Animal] 的可写接口</text><text x="40" y="188" font-size="31" fill="#173c58">调用前</text><text x="65" y="262" font-size="29" fill="#1f81c7">cats: list[Cat]</text><text x="65" y="350" font-size="29" fill="#d07533">animals: list[Animal]</text><path d="M360 254 L640 280" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M425 340 L640 300" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M655 216 H1170 V355 H655 Z" fill="#f6f9fb" stroke="#8d9bb0" stroke-width="2"/><path d="M770 264 L775 233 L793 250 Q800 246 807 250 L825 233 L830 264 Q835 305 800 308 Q765 305 770 264 Z" fill="white" stroke="#1f81c7" stroke-width="3"/><circle cx="789" cy="275" r="3" fill="#1f81c7"/><circle cx="811" cy="275" r="3" fill="#1f81c7"/><text x="774" y="349" font-size="27" fill="#1f81c7">Cat</text><path d="M1000 264 L1005 233 L1023 250 Q1030 246 1037 250 L1055 233 L1060 264 Q1065 305 1030 308 Q995 305 1000 264 Z" fill="white" stroke="#1f81c7" stroke-width="3"/><circle cx="1019" cy="275" r="3" fill="#1f81c7"/><circle cx="1041" cy="275" r="3" fill="#1f81c7"/><text x="1004" y="349" font-size="27" fill="#1f81c7">Cat</text><text x="660" y="395" font-size="28" fill="#173c58">两个名字指向同一个实际列表</text><path d="M40 433 H1240" stroke="#dce2eb" stroke-width="2"/><text x="40" y="488" font-size="31" fill="#173c58">调用后</text><text x="65" y="563" font-size="29" fill="#d07533">animals.append(Dog())</text><path d="M452 555 L640 590" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M655 510 H1170 V652 H655 Z" fill="#f6f9fb" stroke="#8d9bb0" stroke-width="2"/><path d="M730 559 L735 528 L753 545 Q760 541 767 545 L785 528 L790 559 Q795 600 760 603 Q725 600 730 559 Z" fill="white" stroke="#1f81c7" stroke-width="3"/><circle cx="749" cy="570" r="3" fill="#1f81c7"/><circle cx="771" cy="570" r="3" fill="#1f81c7"/><text x="734" y="644" font-size="27" fill="#1f81c7">Cat</text><path d="M900 559 L905 528 L923 545 Q930 541 937 545 L955 528 L960 559 Q965 600 930 603 Q895 600 900 559 Z" fill="white" stroke="#1f81c7" stroke-width="3"/><circle cx="919" cy="570" r="3" fill="#1f81c7"/><circle cx="941" cy="570" r="3" fill="#1f81c7"/><text x="904" y="644" font-size="27" fill="#1f81c7">Cat</text><path d="M1070 542 Q1045 528 1040 555 L1055 589 Q1057 611 1083 613 Q1110 611 1112 589 L1127 555 Q1122 528 1097 542 Z" fill="white" stroke="#d07533" stroke-width="3"/><text x="1055" y="644" font-size="27" fill="#d07533">Dog</text><text x="65" y="624" font-size="29" fill="#d07533">cats[2] 实际也是 Dog</text></g><desc> 同一个列表，两份承诺：写入会破坏哪一份？ 静态 Sequence 接口不暴露 append；运行时对象仍可能是列表。</desc></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">可变容器的不变型来自写入风险</title><desc id="desc">假设 Cat、Dog 都是 Animal。若允许把可变的 list[Cat] 当作可写入任意 Animal 的列表，另一方就能追加 Dog，破坏原来的元素类型保证；这说明可读与可写接口的变型约束不同。 这是一条用于反证的假设路径，不是推荐写法。Python 运行时不会因类型提示自动禁止追加；静态检查器依据声明约束接口，仍需区分运行时事实。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">可变容器的不变型来自写入风险</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">这里是不变型 invariant：可变 list 的元素类型不能任意扩大。</text><path d="M345,255 L440,255" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M725,255 L820,255" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M962.5,310 L962.5,450" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M820,505 L725,505" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="200" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="202.5" y="263" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">原对象：list[Cat]</text><rect x="440" y="200" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="263" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">若当作 list[Animal]</text><rect x="820" y="200" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="962.5" y="263" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">调用方 append(Dog)</text><rect x="820" y="450" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="962.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">原对象含非 Cat 元素</text><rect x="440" y="450" width="285" height="110" fill="#edf7f5" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="582.5" y="513" font-size="22" fill="#20384f" text-anchor="middle" font-weight="400">破坏 list[Cat] 契约</text></g></svg>

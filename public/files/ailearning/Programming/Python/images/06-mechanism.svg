<svg xmlns="http://www.w3.org/2000/svg" width="1252.267" height="620.040" viewBox="13.867 59.763 1252.267 620.040"><rect width="1252.267" height="620.04" fill="white" x="13.867" y="59.763" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#52677a" stroke-width="1.5" /></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="108" font-size="27" fill="#52677a">反证假设：允许把 list[Cat] 传给接收 list[Animal] 的可写接口</text><text x="40" y="188" font-size="31" fill="#17334b">调用前</text><text x="65" y="262" font-size="29" fill="#2474b5">cats: list[Cat]</text><text x="65" y="350" font-size="29" fill="#d5752e">animals: list[Animal]</text><path d="M360 254 L640 280" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none" /><path d="M425 340 L640 300" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none" /><path d="M655 216 H1170 V355 H655 Z" fill="#f6f9fb" stroke="#8c9daa" stroke-width="2" /><path d="M770 264 L775 233 L793 250 Q800 246 807 250 L825 233 L830 264 Q835 305 800 308 Q765 305 770 264 Z" fill="white" stroke="#2474b5" stroke-width="3" /><circle cx="789" cy="275" r="3" fill="#2474b5" /><circle cx="811" cy="275" r="3" fill="#2474b5" /><text x="774" y="349" font-size="27" fill="#2474b5">Cat</text><path d="M1000 264 L1005 233 L1023 250 Q1030 246 1037 250 L1055 233 L1060 264 Q1065 305 1030 308 Q995 305 1000 264 Z" fill="white" stroke="#2474b5" stroke-width="3" /><circle cx="1019" cy="275" r="3" fill="#2474b5" /><circle cx="1041" cy="275" r="3" fill="#2474b5" /><text x="1004" y="349" font-size="27" fill="#2474b5">Cat</text><text x="660" y="395" font-size="28" fill="#17334b">两个名字指向同一个实际列表</text><path d="M40 433 H1240" stroke="#d8e1e8" stroke-width="2" /><text x="40" y="488" font-size="31" fill="#17334b">调用后</text><text x="65" y="563" font-size="29" fill="#d5752e">animals.append(Dog())</text><path d="M452 555 L640 590" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none" /><path d="M655 510 H1170 V652 H655 Z" fill="#f6f9fb" stroke="#8c9daa" stroke-width="2" /><path d="M730 559 L735 528 L753 545 Q760 541 767 545 L785 528 L790 559 Q795 600 760 603 Q725 600 730 559 Z" fill="white" stroke="#2474b5" stroke-width="3" /><circle cx="749" cy="570" r="3" fill="#2474b5" /><circle cx="771" cy="570" r="3" fill="#2474b5" /><text x="734" y="644" font-size="27" fill="#2474b5">Cat</text><path d="M900 559 L905 528 L923 545 Q930 541 937 545 L955 528 L960 559 Q965 600 930 603 Q895 600 900 559 Z" fill="white" stroke="#2474b5" stroke-width="3" /><circle cx="919" cy="570" r="3" fill="#2474b5" /><circle cx="941" cy="570" r="3" fill="#2474b5" /><text x="904" y="644" font-size="27" fill="#2474b5">Cat</text><path d="M1070 542 Q1045 528 1040 555 L1055 589 Q1057 611 1083 613 Q1110 611 1112 589 L1127 555 Q1122 528 1097 542 Z" fill="white" stroke="#d5752e" stroke-width="3" /><text x="1055" y="644" font-size="27" fill="#d5752e">Dog</text><text x="65" y="624" font-size="29" fill="#d5752e">cats[2] 实际也是 Dog</text></g><desc> 同一个列表，两份承诺：写入会破坏哪一份？ 静态 Sequence 接口不暴露 append；运行时对象仍可能是列表。</desc></svg>

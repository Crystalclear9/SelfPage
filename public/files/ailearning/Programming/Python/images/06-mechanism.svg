<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">可写列表的型变反例</title>
<desc id="fig-desc">若把猫列表当作可写的动物列表，允许追加狗。同一对象的原名字也会读到这只狗。</desc>
<rect x="0" y="0" width="1200" height="500" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="78" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">两个名字共享一个可写列表</text>
<text x="78" y="118" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="24" text-anchor="start" font-weight="400">反证假设：允许把 list[Cat] 当作可写的 list[Animal]。</text>
<text x="78" y="202" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">调用前</text>
<path d="M282 213 L301 167 L567 167 L548 213 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424.5" y="197.7" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">cats: list[Cat]</text>
<path d="M581 191 L679 220" fill="none" stroke="#166d75" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M679 220 L667.033 221.673 L669.871 212.084 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M282 272 L301 226 L567 226 L548 272 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424.5" y="256.7" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">animals: list[Animal]</text>
<path d="M581 250 L679 220" fill="none" stroke="#a74d3a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M679 220 L669.945 228.001 L667.018 218.439 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718" y="179" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">共享列表</text>
<path d="M708 240 L727 197 L822 197 L803 240 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="765" y="226.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">Cat</text>
<path d="M832 240 L851 197 L946 197 L927 240 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="889" y="226.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">Cat</text>
<text x="78" y="371" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="25" text-anchor="start" font-weight="400">追加 Dog 后</text>
<path d="M282 382 L301 336 L567 336 L548 382 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424.5" y="366.7" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">cats: list[Cat]</text>
<path d="M581 360 L679 389" fill="none" stroke="#166d75" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M679 389 L667.033 390.673 L669.871 381.084 Z" fill="#166d75" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M282 441 L301 395 L567 395 L548 441 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424.5" y="425.7" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">animals: list[Animal]</text>
<path d="M581 419 L679 389" fill="none" stroke="#a74d3a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M679 389 L669.945 397.001 L667.018 387.439 Z" fill="#a74d3a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718" y="348" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="21" text-anchor="start" font-weight="400">仍是同一列表</text>
<path d="M708 409 L727 366 L822 366 L803 409 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="765" y="395.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">Cat</text>
<path d="M832 409 L851 366 L946 366 L927 409 Z" fill="url(#t)" stroke="#166d75" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="889" y="395.9" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">Cat</text>
<path d="M956 409 L975 366 L1070 366 L1051 409 Z" fill="url(#r)" stroke="#a74d3a" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1013" y="395.9" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" font-weight="400">Dog</text>
<text x="714" y="453" fill="#a74d3a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">cats[2] 也会读到 Dog。</text>
<path d="M76 297 L1122 297" fill="none" stroke="#dbe8eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

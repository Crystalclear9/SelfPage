<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">容器选择决定会丢掉哪些信息</title><desc id="desc">同一串 b、a、b、c 放入不同容器，会保留不同信息。列表保留位置与重复，集合只保留成员关系，计数字典则记录每个键的出现次数；图把同一输入的三种摘要并排展示。 集合这一路的显示顺序只是为了阅读，不构成遍历顺序承诺。计数字典也没有保存每次出现的位置；选择容器前应先明确哪些信息是后续算法必需的。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">容器选择决定会丢掉哪些信息</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">集合的排列仅为展示成员，不提供按此顺序迭代的保证。</text><text x="65" y="169" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">输入</text><rect x="65.0" y="190" width="248.5" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">b</text><rect x="327.5" y="190" width="248.5" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="340.5" y="221" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">a</text><rect x="590.0" y="190" width="248.5" height="74" fill="#e4edf8" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="603" y="221" font-size="23" fil
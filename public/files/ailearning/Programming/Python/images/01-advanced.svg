oke-linecap="round" stroke-linejoin="round" /><text x="780" y="469" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">c</text><text x="65" y="590" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">计数字典</text><rect x="285" y="560" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="594" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">b:2</text><rect x="525" y="560" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="540" y="594" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">a:1</text><rect x="765" y="560" width="226" height="84" fill="#dcefe9" stroke="#cbd9e5" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="780" y="594" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">c:1</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="976.3802" viewBox="0 0 1440 976.3802" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两个次序不同的输入序列映射到相同计数字典与集合，显示摘要无法还原原始位置</title><rect width="1440" height="976.3802" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="35" font-weight="700" fill="#142b45">两个次序不同的输入序列映射到相同计数字典与集合，显示摘要无法还原原始位置</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="834.3802" viewBox="19.833 54.824 1360.333 844.52" role="img" x="48" y="106" overflow="hidden"><title>成员和次数相同，原始位置仍然可以不同</title><rect width="1360.333" height="844.52" fill="white" x="19.833" y="54.824"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="105" font-size="26" fill="#6b8393" text-anchor="start" font-weight="normal">列表保留出现次序；集合和计数摘要分别舍弃更多信息</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e3ea" stroke-width="2"/><text x="65" y="195" font-size="29" fill="#20354b" text-anchor="start" font-weight="bold">两个不同的输入列表</text><rect x="65" y="260" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="122.5" y="313" font-size="35" fill="#c46c30" text-anchor="middle" font-weight="normal">b</text><text x="122.5" y="243" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">0</text><rect x="180" y="260" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="237.5" y="313" font-size="35" fill="#20354b" text-anchor="middle" font-weight="normal">a</text><text x="237.5" y="243" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">1</text><rect x="295" y="260" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="352.5" y="313" font-size="35" fill="#c46c30" text-anchor="middle" font-weight="normal">b</text><text x="352.5" y="243" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">2</text><rect x="410" y="260" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="467.5" y="313" font-size="35" fill="#20354b" text-anchor="middle" font-weight="normal">c</text><text x="467.5" y="243" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">3</text><rect x="65" y="490" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="122.5" y="543" font-size="35" fill="#c46c30" text-anchor="middle" font-weight="normal">b</text><text x="122.5" y="473" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">0</text><rect x="180" y="490" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="237.5" y="543" font-size="35" fill="#c46c30" text-anchor="middle" font-weight="normal">b</text><text x="237.5" y="473" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">1</text><rect x="295" y="490" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="352.5" y="543" font-size="35" fill="#20354b" text-anchor="middle" font-weight="normal">a</text><text x="352.5" y="473" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">2</text><rect x="410" y="490" width="115" height="82" rx="4" stroke="#d9e3ea" stroke-width="2" fill="white"/><text x="467.5" y="543" font-size="35" fill="#20354b" text-anchor="middle" font-weight="normal">c</text><text x="467.5" y="473" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">3</text><text x="65" y="384" font-size="27" fill="#6b8393" text-anchor="start" font-weight="normal">位置 1 是 a</text><text x="65" y="615" font-size="27" fill="#6b8393" text-anchor="start" font-weight="normal">位置 1 是 b</text><path d="M530,300 C650,300 650,410 760,410" stroke="#2478b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M749.4690092573155,415.75310646325045 L760,410 L749.4690092573155,404.24689353674955" stroke="#2478b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M530,530 C650,530 650,410 760,410" stroke="#2478b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M749.4690092573155,415.75310646325045 L760,410 L749.4690092573155,404.24689353674955" stroke="#2478b6" stroke-width="3" fill="none" stroke-linecap="round"/><text x="790" y="201" font-size="29" fill="#20354b" text-anchor="start" font-weight="bold">相同的计数摘要</text><text x="865" y="326" font-size="34" fill="#c46c30" text-anchor="middle" font-weight="normal">b</text><line x1="935" y1="315" x2="1225" y2="315" stroke="#c46c30" stroke-width="12"/><circle cx="1225" cy="315" r="12" stroke="#c46c30" stroke-width="2" fill="white"/><text x="1255" y="325" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">2</text><text x="865" y="441" font-size="34" fill="#2478b6" text-anchor="middle" font-weight="normal">a</text><line x1="935" y1="430" x2="1080" y2="430" stroke="#2478b6" stroke-width="12"/><circle cx="1080" cy="430" r="12" stroke="#2478b6" stroke-width="2" fill="white"/><text x="1110" y="440" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">1</text><text x="865" y="556" font-size="34" fill="#2478b6" text-anchor="middle" font-weight="normal">c</text><line x1="935" y1="545" x2="1080" y2="545" stroke="#2478b6" stroke-width="12"/><circle cx="1080" cy="545" r="12" stroke="#2478b6" stroke-width="2" fill="white"/><text x="1110" y="555" font-size="29" fill="#20354b" text-anchor="start" font-weight="normal">1</text><line x1="935" y1="590" x2="935" y2="604" stroke="#20354b" stroke-width="2"/><text x="935" y="645" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">0</text><line x1="1080" y1="590" x2="1080" y2="604" stroke="#20354b" stroke-width="2"/><text x="1080" y="645" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">1</text><line x1="1225" y1="590" x2="1225" y2="604" stroke="#20354b" stroke-width="2"/><text x="1225" y="645" font-size="26" fill="#6b8393" text-anchor="middle" font-weight="normal">2</text><line x1="935" y1="596" x2="1225" y2="596" stroke="#d9e3ea" stroke-width="2"/><text x="1090" y="695" font-size="27" fill="#6b8393" text-anchor="middle" font-weight="normal">出现次数</text><line x1="50" y1="730" x2="1350" y2="730" stroke="#d9e3ea" stroke-width="2"/><text x="65" y="797" font-size="29" fill="#20354b" text-anchor="start" font-weight="bold">再只保留成员</text><line x1="330" y1="790" x2="440" y2="790" stroke="#6b8393" stroke-width="3"/><path d="M429.4690092573155,795.7531064632504 L440,790 L429.4690092573155,784.2468935367496" stroke="#6b8393" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="535" cy="790" r="35" stroke="#2478b6" stroke-width="2" fill="white"/><text x="535" y="802" font-size="34" fill="#20354b" text-anchor="middle" font-weight="normal">a</text><circle cx="745" cy="835" r="35" stroke="#2478b6" stroke-width="2" fill="white"/><text x="745" y="847" font-size="34" fill="#20354b" text-anchor="middle" font-weight="normal">b</text><circle cx="950" cy="785" r="35" stroke="#2478b6" stroke-width="2" fill="white"/><text x="950" y="797" font-size="34" fill="#20354b" text-anchor="middle" font-weight="normal">c</text><text x="1055" y="800" font-size="28" fill="#20354b" text-anchor="start" font-weight="normal">集合 {a, b, c}</text></g><desc> 成员和次数相同，原始位置仍然可以不同 下方位置仅为排版；集合不承诺按这些位置或字母顺序遍历。</desc></svg></svg>

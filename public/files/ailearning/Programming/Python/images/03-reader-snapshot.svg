<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1140.000" height="591.2" viewBox="30.0 120.0 1140.0 591.2" role="img"><title id="figure-title">发布快照：文件各自完整，组合仍可能错误</title><desc id="figure-desc">同一读者先读v1分数，发布者将当前入口切到v2。逐片重查入口会取v2类别表，错误预测狗；固定v1清单则继续取v1类别表，正确预测猫。两份完整版本都预测猫。 发布快照：文件各自完整，组合仍可能错误 固定的版本必须保持内容不变，并在需要时仍可读取</desc><rect width="1140.0" height="591.2" fill="white" x="30.0" y="120.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="55" y="145" width="500" height="68" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="305.0" y="189.15" font-size="29" fill="#c87536" text-anchor="middle" font-weight="400">逐片重查当前入口</text><rect x="75" y="245" width="460" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="305.0" y="287.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">v1 分数：(0.9, 0.1)</text><path d="M305 318 L305 406" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="75" y="416" width="460" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="305.0" y="458.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">v2 类别表：狗、猫</text><path d="M305 490 L305 540" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="305" y="582" font-size="28" fill="#c87536" text-anchor="middle" font-weight="600">预测：狗（版本混用）</text><rect x="645" y="145" width="500" height="68" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="895.0" y="189.15" font-size="29" fill="#2865a0" text-anchor="middle" font-weight="400">先固定 v1 清单</text><rect x="665" y="245" width="460" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="895.0" y="287.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">v1 分数：(0.9, 0.1)</text><path d="M895 318 L895 406" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect x="665" y="416" width="460" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="895.0" y="458.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">v1 类别表：猫、狗</text><path d="M895 490 L895 540" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="895" y="582" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="600">预测：猫（同一版本）</text><rect x="80" y="333" width="1040" height="56" rx="6" fill="#fff0e3" stroke="#cbd9e4" stroke-width="1.5" /><text x="600" y="371" font-size="26" fill="#213447" text-anchor="middle" font-weight="400">两次读取之间，发布者把 current 从 v1 切换到 v2</text><line x1="55" y1="619" x2="1145" y2="619" stroke="#cbd9e4" stroke-width="2" /><text x="600" y="675" font-size="28" fill="#213447" text-anchor="middle" font-weight="400">固定的版本必须保持内容不变，并在需要时仍可读取</text></g></svg>

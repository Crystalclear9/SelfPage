<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1430" viewBox="0 0 1800 1430" role="img"><title>版本束中的实际索引与两条读取链</title><rect width="1800" height="1430" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="90" y="100" width="720" height="440" rx="4" fill="white" stroke="#176b91" stroke-width="2"/><text x="450" y="165" font-size="34" fill="#176b91" text-anchor="middle" font-weight="400">v1 · 保持不变的版本束</text><text x="455" y="235" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">索引 0</text><rect x="390" y="270" width="130" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="455" y="335" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">0.9</text><rect x="390" y="400" width="130" height="100" rx="4" fill="white" stroke="#176b91" stroke-width="2"/><text x="455" y="465" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">猫</text><text x="630" y="235" font-size="28" fill="#80929d" text-anchor="middle" font-weight="400">索引 1</text><rect x="565" y="270" width="130" height="100" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="630" y="335" font-size="38" fill="#176b91" text-an
<svg xmlns="http://www.w3.org/2000/svg" width="1360.333" height="744.615" viewBox="19.833 54.854 1360.333 744.615" role="img"><title>稳定去重，是保留首次出现的索引映射</title><rect width="1360.333" height="744.615" fill="white" x="19.833" y="54.854" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="105" font-size="26" fill="#6b7a86" text-anchor="start" font-weight="normal">实际程序输入 [3, 1, 3, 2, 1]；圈号为值，槽位编号标在上方</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e3ea" stroke-width="2" /><text x="65" y="198" font-size="29" fill="#21384a" text-anchor="start" font-weight="bold">输入位置</text><text x="160" y="250" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">0</text><circle cx="160" cy="305" r="42" stroke="#286ca5" stroke-width="2" fill="white" /><text x="160" y="317" font-size="35" fill="#286ca5" text-anchor="middle" font-weight="normal">3</text><text x="420" y="250" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">1</text><circle cx="420" cy="305" r="42" stroke="#286ca5" stroke-width="2" fill="white" /><text x="420" y="317" font-size="35" fill="#286ca5" text-anchor="middle" font-weight="normal">1</text><text x="680" y="250" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">2</text><circle cx="680" cy="305" r="42" stroke="#c86b2c" stroke-width="2" fill="white" /><text x="680" y="317" font-size="35" fill="#c86b2c" text-anchor="middle" font-weight="normal">3</text><text x="680" y="418" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">此前已见，跳过</text><text x="940" y="250" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">3</text><circle cx="940" cy="305" r="42" stroke="#286ca5" stroke-width="2" fill="white" /><text x="940" y="317" font-size="35" fill="#286ca5" text-anchor="middle" font-weight="normal">2</text><text x="1200" y="250" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">4</text><circle cx="1200" cy="305" r="42" stroke="#c86b2c" stroke-width="2" fill="white" /><text x="1200" y="317" font-size="35" fill="#c86b2c" text-anchor="middle" font-weight="normal">1</text><text x="1200" y="418" font-size="27" fill="#c86b2c" text-anchor="middle" font-weight="normal">此前已见，跳过</text><line x1="160" y1="353" x2="300" y2="595" stroke="#286ca5" stroke-width="3" /><path d="M289.7467330556625,588.7653775600959 L300,595 L299.7063901117044,583.0035924863527" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round" /><line x1="420" y1="353" x2="660" y2="595" stroke="#286ca5" stroke-width="3" /><path d="M648.4995220094102,591.5737767165641 L660,595 L656.669332703583,583.4714851190373" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round" /><line x1="940" y1="353" x2="1020" y2="595" stroke="#286ca5" stroke-width="3" /><path d="M1011.2322354392547,586.8069355789584 L1020,595 L1022.1569825774889,583.1954489216909" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round" /><text x="65" y="566" font-size="29" fill="#21384a" text-anchor="start" font-weight="bold">输出位置</text><circle cx="300" cy="645" r="43" stroke="#286ca5" stroke-width="2" fill="white" /><text x="300" y="657" font-size="36" fill="#286ca5" text-anchor="middle" font-weight="normal">3</text><text x="300" y="729" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">0</text><circle cx="660" cy="645" r="43" stroke="#286ca5" stroke-width="2" fill="white" /><text x="660" y="657" font-size="36" fill="#286ca5" text-anchor="middle" font-weight="normal">1</text><text x="660" y="729" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">1</text><circle cx="1020" cy="645" r="43" stroke="#286ca5" stroke-width="2" fill="white" /><text x="1020" y="657" font-size="36" fill="#286ca5" text-anchor="middle" font-weight="normal">2</text><text x="1020" y="729" font-size="27" fill="#6b7a86" text-anchor="middle" font-weight="normal">2</text><line x1="185" y1="770" x2="1135" y2="770" stroke="#d9e3ea" stroke-width="2" /></g><desc> 稳定去重，是保留首次出现的索引映射 seen 只回答“是否出现过”；unique 按箭头保留原位置 0、1、3 的顺序。</desc></svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="659" viewBox="0 0 1360 659" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">三个闭包可以读同一个单元</title>
  <desc id="plate-desc">左边三个函数对象各自独立，都读取最终为 2 的闭包单元。右边在定义时分别记下三个默认参数值。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="659" fill="white" stroke="none" stroke-width="1.6"/>
  <text x="334" y="60" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">调用时读取共享单元</text>
  <polygon points="49.5,204 169.85,204 194.5,144 74.15,144" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="122" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#a84b3b" text-anchor="middle">f0</text>
  <line x1="122" y1="214" x2="334" y2="281" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <polygon points="260.5,204 380.85,204 405.5,144 285.15,144" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="333" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#a84b3b" text-anchor="middle">f1</text>
  <line x1="333" y1="214" x2="334" y2="281" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <polygon points="471.5,204 591.85,204 616.5,144 496.15,144" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="544" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#a84b3b" text-anchor="middle">f2</text>
  <line x1="544" y1="214" x2="334" y2="281" stroke="#a84b3b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <polygon points="200,353 436,353 468,287 232,287" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="334" y="329.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#a84b3b" text-anchor="middle">共享单元，值为 2</text>
  <text x="334" y="498" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" fill="#a84b3b" text-anchor="middle">依次调用：2、2、2</text>
  <text x="1014" y="60" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">定义时保存默认值</text>
  <polygon points="729.5,204 849.85,204 874.5,144 754.15,144" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="802" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#196f77" text-anchor="middle">f0</text>
  <line x1="802" y1="214" x2="802" y2="281" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="714,349.5 860.08,349.5 890,290.5 743.92,290.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="802" y="329.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">默认值 0</text>
  <polygon points="940.5,204 1060.85,204 1085.5,144 965.15,144" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="1013" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#196f77" text-anchor="middle">f1</text>
  <line x1="1013" y1="214" x2="1013" y2="281" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="925,349.5 1071.08,349.5 1101,290.5 954.92,290.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="1013" y="329.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">默认值 1</text>
  <polygon points="1151.5,204 1271.85,204 1296.5,144 1176.15,144" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="1224" y="183.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#196f77" text-anchor="middle">f2</text>
  <line x1="1224" y1="214" x2="1224" y2="281" stroke="#196f77" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="1136,349.5 1282.08,349.5 1312,290.5 1165.92,290.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="1224" y="329.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">默认值 2</text>
  <text x="1014" y="498" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="32" fill="#196f77" text-anchor="middle">依次调用：0、1、2</text>
  <line x1="680" y1="91" x2="680" y2="553" stroke="#d4e0e4" stroke-width="1.35" stroke-linecap="round"/>
  <text x="680" y="615" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#202a37" text-anchor="middle">函数对象数量相同，保存的名字绑定却不同。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect width="1280" height="820" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#52677a" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="58" font-size="36">三个函数对象，不一定拥有三份被引用的状态</text><text x="40" y="108" font-size="27" fill="#52677a">左：外层局部变量由单元共享；右：默认参数在每轮定义时分别求值</text><text x="55" y="185" font-size="30" fill="#2474b5">闭包：调用时读取同一绑定</text><text x="690" y="185" font-size="30" fill="#168578">默认参数：本次调用未传值</text><text x="55" y="285" font-size="29" fill="#2474b5">delayed[0]</text><path d="M235 275 L435 425" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="285" font-size="29" fill="#168578">captured[0]</text><path d="M895 275 L1060 275" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="275" r="40" fill="#eef8f5" stroke="#168578" stroke-width="3"/><text x="1100" y="285" font-size="32" fill="#168578">0</text><text x="55" y="435" font-size="29" fill="#2474b5">delayed[1]</text><path d="M235 425 L435 425" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="435" font-size="29" fill="#168578">captured[1]</text><path d="M895 425 L1060 425" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="425" r="40" fill="#eef8f5" stroke="#168578" stroke-width="3"/><text x="1100" y="435" font-size="32" fill="#168578">1</text><text x="55" y="585" font-size="29" fill="#2474b5">delayed[2]</text><path d="M235 575 L435 425" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="585" font-size="29" fill="#168578">captured[2]</text><path d="M895 575 L1060 575" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="575" r="40" fill="#eef8f5" stroke="#168578" stroke-width="3"/><text x="1100" y="585" font-size="32" fill="#168578">2</text><rect x="450" y="380" width="175" height="100" rx="6" fill="#f2f7fb" stroke="#2474b5" stroke-width="3"/><text x="470" y="418" font-size="28" fill="#2474b5">共享 cell</text><text x="518" y="458" font-size="32" fill="#2474b5">2</text><text x="55" y="685" font-size="28" fill="#17334b">返回后仍保留外层单元</text><text x="690" y="685" font-size="28" fill="#17334b">各自的 __defaults__ 元组</text><path d="M40 724 H1240" stroke="#d8e1e8" stroke-width="2"/><text x="40" y="780" font-size="29" fill="#17334b">模块顶层的 index 是全局绑定；不要把它误称为捕获的局部单元。</text></g></svg>
<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="883.5914" viewBox="0 0 1440 883.5914" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三个闭包共享最终为二的单元，三个默认参数函数则各自保存零一二</title><rect width="1440" height="883.5914" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">三个闭包共享最终为二的单元，三个默认参数函数则各自保存零一二</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="741.5914" viewBox="13.867 59.714 1252.267 690.975" x="48" y="106" overflow="hidden"><rect width="1252.267" height="690.975" fill="white" x="13.867" y="59.714"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#527087" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="108" font-size="27" fill="#527087">左：外层局部变量由单元共享；右：默认参数在每轮定义时分别求值</text><text x="55" y="185" font-size="30" fill="#1f81c7">闭包：调用时读取同一绑定</text><text x="690" y="185" font-size="30" fill="#148f94">默认参数：本次调用未传值</text><text x="55" y="285" font-size="29" fill="#1f81c7">delayed[0]</text><path d="M235 275 L435 425" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="285" font-size="29" fill="#148f94">captured[0]</text><path d="M895 275 L1060 275" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="275" r="40" fill="#eef8f5" stroke="#148f94" stroke-width="3"/><text x="1100" y="285" font-size="32" fill="#148f94">0</text><text x="55" y="435" font-size="29" fill="#1f81c7">delayed[1]</text><path d="M235 425 L435 425" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="435" font-size="29" fill="#148f94">captured[1]</text><path d="M895 425 L1060 425" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="425" r="40" fill="#eef8f5" stroke="#148f94" stroke-width="3"/><text x="1100" y="435" font-size="32" fill="#148f94">1</text><text x="55" y="585" font-size="29" fill="#1f81c7">delayed[2]</text><path d="M235 575 L435 425" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="690" y="585" font-size="29" fill="#148f94">captured[2]</text><path d="M895 575 L1060 575" stroke="#527087" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="1110" cy="575" r="40" fill="#eef8f5" stroke="#148f94" stroke-width="3"/><text x="1100" y="585" font-size="32" fill="#148f94">2</text><rect x="450" y="380" width="175" height="100" rx="6" fill="#f2f7fb" stroke="#1f81c7" stroke-width="3"/><text x="470" y="418" font-size="28" fill="#1f81c7">共享 cell</text><text x="518" y="458" font-size="32" fill="#1f81c7">2</text><text x="55" y="685" font-size="28" fill="#173c58">返回后仍保留外层单元</text><text x="690" y="685" font-size="28" fill="#173c58">各自的 __defaults__ 元组</text><path d="M40 724 H1240" stroke="#dce2eb" stroke-width="2"/></g><desc> 三个函数对象，不一定拥有三份被引用的状态 模块顶层的 index 是全局绑定；不要把它误称为捕获的局部单元。</desc></svg></svg>

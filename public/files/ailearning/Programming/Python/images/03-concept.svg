<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="464.25" viewBox="5.12 -5.92 1094.71 423.52" role="img"><title id="detail-title">机制展开：A 把正式旧对象、正在写入的临时对象与完整新版分开</title><desc id="detail-desc">A 把正式旧对象、正在写入的临时对象与完整新版分开。竖虚线标出发布入口的切换边界；校验前读者仍使用旧正式路径，校验失败的临时对象不应被发布。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="90" width="225" height="180" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="35" y="90" width="225" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="47" y="115" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">正式对象：旧版</text><text x="49" y="157" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 1</text><text x="49" y="188" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 2</text><text x="49" y="219" font-size="24" fill="#213447" font-weight="400" text-anchor="start">checksum A</text><rect x="440" y="90" width="225" height="180" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="440" y="90" width="225" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="452" y="115" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">临时对象：写入中</text><text x="454" y="157" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 1</text><text x="454" y="188" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 2</text><text x="454" y="219" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 3 …</text><rect x="845" y="90" width="225" height="180" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="845" y="90" width="225" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="857" y="115" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">完整新版</text><text x="859" y="157" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 1</text><text x="859" y="188" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 2</text><text x="859" y="219" font-size="24" fill="#213447" font-weight="400" text-anchor="start">row 3</text><rect x="35" y="20" width="225" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="147.5" y="48" font-size="24" fill="#2865a0" font-weight="600" text-anchor="middle">读者查找正式路径</text><path d="M147,65 L147,82" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M270,175 L432,175" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="300" y="141" font-size="24" fill="#2865a0" font-weight="400" text-anchor="start">另写临时路径</text><path d="M675,175 L837,175" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="700" y="135" font-size="24" fill="#cf7432" font-weight="400" text-anchor="start">校验通过</text><text x="700" y="219" font-size="24" fill="#213447" font-weight="400" text-anchor="start">原子替换入口</text><line x1="760" y1="38" x2="760" y2="385" stroke="#cf7432" stroke-width="2" stroke-dasharray="7 6" /><text x="779" y="335" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">发布边界</text><text x="36" y="335" font-size="24" fill="#213447" font-weight="400" text-anchor="start">切换前：新读者仍读旧版</text><text x="36" y="374" font-size="24" fill="#213447" font-weight="400" text-anchor="start">失败：临时结果不进入正式路径</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>发布切换的是路径指向；临时内容从未成为正式入口</title><rect width="1280" height="680" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">发布切换的是路径指向；临时内容从未成为正式入口</text><text x="40" y="104" font-size="25" fill="#697d87" text-anchor="start">同一文件系统上的单文件替换；写入与校验发生在切换之前。</text><text x="95" y="166" font-size="25" fill="#276884" text-anchor="start">① 准备</text><text x="400" y="166" font-size="25" fill="#276884" text-anchor="start">② 写临时文件</text><text x="720" y="166" font-size="25" fill="#276884" text-anchor="start">③ 关闭并校验</text><text x="1050" y="166" font-size="25" fill="#276884" text-anchor="start">④ replace 成功</text><text x="40" y="238" font-size="25" fill="#233943" text-anchor="start">正式入口</text><text x="40" y="420" font-size="25" fill="#233943" text-anchor="start">临时文件</text><rect x="130" y="265" width="150" height="105" fill="white" stroke="#276884" stroke-width="2"/><text x="205" y="324" font-size="30" fill="#276884" text-anchor="middle">旧版</text><line x1="285" y1="315" x2="385" y2="315" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="385,315 373.94726807196537,319.6730201077038 373.94726807196537,310.3269798922962" fill="#697d87"/><rect x="435" y="265" width="150" height="105" fill="white" stroke="#276884" stroke-width="2"/><text x="510" y="324" font-size="30" fill="#276884" text-anchor="middle">旧版</text><line x1="590" y1="315" x2="690" y2="315" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="690,315 678.9472680719654,319.6730201077038 678.9472680719654,310.3269798922962" fill="#697d87"/><rect x="435" y="447" width="150" height="105" fill="#fff8f1" stroke="#b25d2b" stroke-width="2"/><text x="510" y="504" font-size="27" fill="#b25d2b" text-anchor="middle">写入中</text><rect x="755" y="265" width="150" height="105" fill="white" stroke="#276884" stroke-width="2"/><text x="830" y="324" font-size="30" fill="#276884" text-anchor="middle">旧版</text><line x1="910" y1="315" x2="1010" y2="315" stroke="#697d87" stroke-width="2.5" stroke-dasharray=""/><polygon points="1010,315 998.9472680719654,319.6730201077038 998.9472680719654,310.3269798922962" fill="#697d87"/><rect x="755" y="447" width="150" height="105" fill="#fff8f1" stroke="#b25d2b" stroke-width="2"/><text x="830" y="504" font-size="27" fill="#b25d2b" text-anchor="middle">已完整</text><rect x="1085" y="265" width="150" height="105" fill="white" stroke="#b25d2b" stroke-width="2"/><text x="1160" y="324" font-size="30" fill="#b25d2b" text-anchor="middle">新版</text><line x1="850" y1="447" x2="1120" y2="370" stroke="#b25d2b" stroke-width="2.5" stroke-dasharray=""/><polygon points="1120,370 1110.6526282609025,377.5250675459506 1108.0894703560907,368.53737099661066" fill="#b25d2b"/><line x1="1018" y1="187" x2="1018" y2="565" stroke="#b25d2b" stroke-width="2" stroke-dasharray="7 7"/><text x="1045" y="594" font-size="26" fill="#b25d2b" text-anchor="start">发布边界</text><text x="40" y="627" font-size="27" fill="#233943" text-anchor="start">边界前打开正式路径 → 旧版；边界后重新打开 → 新版。</text></g></svg>

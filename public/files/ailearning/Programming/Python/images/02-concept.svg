<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>同一个生成器帧在创建、两次暂停和结束时的状态</title><rect width="1600" height="1000" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="110" y="60" font-size="32" fill="#203b4a" text-anchor="start" font-weight="700">函数体</text><text x="96" y="140" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">def squares():</text><text x="96" y="206" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">    i = 1</text><rect x="75" y="229" width="465" height="59" rx="4" fill="#eaf4fa" stroke="none" stroke-width="2"/><text x="96" y="272" font-size="29" fill="#176b91" text-anchor="start" font-weight="400">    yield i * i</text><text x="96" y="338" font-size="29" fill="#203b4a" text-anchor="start" font-weight="400">    i = 2</text><rect x="75" y="361" width="465" height="59" rx="4" fill="#eaf4fa" stroke="none" stroke-width="2"/><text x="96" y="404" font-size="29" fill="#176b91" text-anchor="start" font-weight="400">    yield i * i</text><text x="690" y="60" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="700">生成器 g · 同一个执行帧</text><text x="1375" y="60" font-size="32" fill="#203b4a" text-anchor="middle" font-weight="700">调用方</text><line x1="810" y1="104" x2="810" y2="920" stroke="#80929d" stroke-width="2" stroke-dasharray="8 8"/><line x1="1375" y1="104" x2="1375" y2="920" stroke="#80929d" stroke-width="2" stroke-dasharray="8 8"/><text x="1110" y="132" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">squares()</text><line x1="1375" y1="150" x2="820" y2="150" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="165" width="460" height="73" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="810" y="212" font-size="27" fill="#203b4a" text-anchor="middle" font-weight="400">未执行函数体</text><line x1="1040" y1="245" x2="1375" y2="245" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="287" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">g</text><text x="1110" y="342" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="360" x2="820" y2="360" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="375" width="460" height="73" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="810" y="422" font-size="27" fill="#203b4a" text-anchor="middle" font-weight="400">i = 1；暂停在第一个 yield</text><line x1="1040" y1="455" x2="1375" y2="455" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="497" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">1</text><text x="1110" y="552" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="570" x2="820" y2="570" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="585" width="460" height="73" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="810" y="632" font-size="27" fill="#203b4a" text-anchor="middle" font-weight="400">i = 2；暂停在第二个 yield</text><line x1="1040" y1="665" x2="1375" y2="665" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="707" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">4</text><text x="1110" y="762" font-size="31" fill="#176b91" text-anchor="middle" font-weight="400">next(g)</text><line x1="1375" y1="780" x2="820" y2="780" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="580" y="795" width="460" height="73" rx="4" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="810" y="842" font-size="27" fill="#203b4a" text-anchor="middle" font-weight="400">函数已结束</text><line x1="1040" y1="875" x2="1375" y2="875" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="1200" y="917" font-size="31" fill="#d87332" text-anchor="middle" font-weight="400">StopIteration</text></g></svg>
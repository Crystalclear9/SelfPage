<svg xmlns="http://www.w3.org/2000/svg" width="1335.000" height="870.000" viewBox="20.000 70.000 1335.000 870.000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1335.0" height="870.0" fill="white" x="20.0" y="70.0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">g = squares() 先创建对象；函数体只有在 next(g) 时才执行。</text><text xml:space="preserve" x="50" y="200" font-size="30" fill="#193a4e" text-anchor="start" font-weight="700">函数体</text><text xml:space="preserve" x="60" y="255" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">def squares():</text><text xml:space="preserve" x="60" y="310" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">    i = 1</text><text xml:space="preserve" x="60" y="365" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">    yield i * i</text><text xml:space="preserve" x="60" y="420" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">    i = 2</text><text xml:space="preserve" x="60" y="475" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">    yield i * i</text><text xml:space="preserve" x="705" y="200" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="700">生成器 g 的同一帧</text><text xml:space="preserve" x="1280" y="200" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="700">调用方</text><line x1="705" y1="225" x2="705" y2="855" stroke="#9db0bd" stroke-width="3" stroke-dasharray="7 7" /><line x1="1280" y1="225" x2="1280" y2="855" stroke="#9db0bd" stroke-width="3" stroke-dasharray="7 7" /><line x1="1280" y1="285" x2="705" y2="285" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="263" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">next(g)</text><rect x="687" y="285" width="36" height="85" rx="0" fill="#dcecf5" stroke="#2676ad" stroke-width="2" /><line x1="723" y1="370" x2="1280" y2="370" stroke="#d76a22" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="352" font-size="32" fill="#d76a22" text-anchor="middle" font-weight="400">1</text><circle cx="705" cy="370" r="9" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="412" font-size="28" fill="#193a4e" text-anchor="end" font-weight="400">i = 1；停在第 3 行</text><line x1="1280" y1="485" x2="705" y2="485" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="463" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">next(g)</text><rect x="687" y="485" width="36" height="85" rx="0" fill="#dcecf5" stroke="#2676ad" stroke-width="2" /><line x1="723" y1="570" x2="1280" y2="570" stroke="#d76a22" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="552" font-size="32" fill="#d76a22" text-anchor="middle" font-weight="400">4</text><circle cx="705" cy="570" r="9" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="612" font-size="28" fill="#193a4e" text-anchor="end" font-weight="400">i = 2；停在第 5 行</text><line x1="1280" y1="685" x2="705" y2="685" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="663" font-size="29" fill="#2676ad" text-anchor="middle" font-weight="400">next(g)</text><rect x="687" y="685" width="36" height="85" rx="0" fill="#dcecf5" stroke="#2676ad" stroke-width="2" /><line x1="723" y1="770" x2="1280" y2="770" stroke="#d76a22" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="1000" y="752" font-size="32" fill="#d76a22" text-anchor="middle" font-weight="400">StopIteration</text><circle cx="705" cy="770" r="9" fill="white" stroke="#2676ad" stroke-width="2" /><text xml:space="preserve" x="660" y="812" font-size="28" fill="#193a4e" text-anchor="end" font-weight="400">走到函数末尾</text><text xml:space="preserve" x="50" y="905" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">前两次 next 返回的是数据；第三次才观察到耗尽，已交付的 4 不会再返回。</text></g><desc> next 往返推进同一个帧：交付一个值，然后暂停 暂停保留局部 i 和执行位置；恢复不是从 def 后第一行重新开始。</desc></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：A 用执行位置和局部变量追踪两次 next：先在 i=1 的 yield 暂停并返回 1，继续后在 i=2 的 yield 返回 4</title><desc id="detail-desc">A 用执行位置和局部变量追踪两次 next：先在 i=1 的 yield 暂停并返回 1，继续后在 i=2 的 yield 返回 4。创建、暂停与耗尽是不同状态，暂停后会从当前位置继续而不是重启函数。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="30" y="45" width="270" height="230" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="30" y="45" width="270" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="42" y="70" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">生成器函数</text><text x="44" y="112" font-size="22" fill="#213447" font-weight="400" text-anchor="start">i = 1</text><text x="44" y="143" font-size="22" fill="#213447" font-weight="400" text-anchor="start">yield i*i</text><text x="44" y="174" font-size="22" fill="#213447" font-weight="400" text-anchor="start">i = 2</text><text x="44" y="205" font-size="22" fill="#213447" font-weight="400" text-anchor="start">yield i*i</text><rect x="40" y="125" width="245" height="36" rx="4" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="52" y="151" font-size="22" fill="#cf7432" font-weight="600" text-anchor="start">→ yield i*i（暂停点）</text><rect x="380" y="45" width="300" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="380" y="45" width="300" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="392" y="70" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">第一次 next</text><text x="394" y="112" font-size="22" fill="#213447" font-weight="400" text-anchor="start">保存 i = 1</text><text x="394" y="143" font-size="22" fill="#213447" font-weight="400" text-anchor="start">返回 1</text><rect x="745" y="45" width="300" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="745" y="45" width="300" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="757" y="70" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">第二次 next</text><text x="759" y="112" font-size="22" fill="#213447" font-weight="400" text-anchor="start">保存 i = 2</text><text x="759" y="143" font-size="22" fill="#213447" font-weight="400" text-anchor="start">返回 4</text><path d="M305,143 L372,143" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M684,143 L737,143" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="394" y="247" font-size="22" fill="#2865a0" font-weight="400" text-anchor="start">暂停：保留局部状态与执行位置</text><text x="748" y="292" font-size="22" fill="#cf7432" font-weight="400" text-anchor="start">继续：从暂停点之后执行</text><path d="M530,199 L530,286" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><rect x="380" y="308" width="300" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="530.0" y="336" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">调用者得到 1</text><path d="M895,199 L895,331" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><rect x="745" y="353" width="300" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="895.0" y="381" font-size="22" fill="#cf7432" font-weight="600" text-anchor="middle">调用者得到 4</text></g></svg>

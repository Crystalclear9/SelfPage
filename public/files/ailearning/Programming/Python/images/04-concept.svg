kerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d37537" stroke-width="2"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#818fa4" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="420" y="80" font-size="30" fill="#20354a" text-anchor="middle">learning_rate</text><text x="690" y="80" font-size="30" fill="#20354a" text-anchor="middle">batch_size</text><text x="960" y="80" font-size="30" fill="#20354a" text-anchor="middle">seed</text><text x="1230" y="80" font-size="30" fill="#20354a" text-anchor="middle">shuffle</text><text x="65" y="195" font-size="31" fill="#20354a" text-anchor="start">默认</text><rect x="315" y="145" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4"/><text x="420" y="194" font-size="30" fill="#818fa4" text-anchor="middle">0.01</text><rect x="585" y="145" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4"/><text x="690" y="194" font-size="30" fill="#818fa4" text-anchor="middle">32</text><rect x="855" y="145" width="210" height="78" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2" rx="4"/><text x="960" y="194" font-size="30" fill="#1672a0" text-anchor="middle">42</text><rect x="1125" y="145" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4"/><text x="1230" y="194" font-size="30" fill="#818fa4" text-anchor="middle">True</text><text x="65" y="330" font-size="31" fill="#20354a" text-anchor="start">文件</text><rect x="315" y="280" width="210" height="78" fill="url(#book-wash-eaf4fa)" stroke="#1672a0" stroke-width="2" rx="4"/><text x="420" y="329" font-size="30" fill="#1672a0" text-anchor="middle">0.003</text><rect x="585" y="280" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4" stroke-dasharray="7 6"/><text x="690" y="329" font-size="30" fill="#818fa4" text-anchor="middle">未提供</text><rect x="855" y="280" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4" stroke-dasharray="7 6"/><text x="960" y="329" font-size="30" fill="#818fa4" text-anchor="middle">未提供</text><rect x="1125" y="280" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4"/><text x="1230" y="329" font-size="30" fill="#818fa4" text-anchor="middle">True</text><text x="65" y="465" font-size="31" fill="#20354a" text-anchor="start">显式 CLI</text><rect x="315" y="415" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4" stroke-dasharray="7 6"/><text x="420" y="464" font-size="30" fill="#818fa4" text-anchor="middle">未提供</text><rect x="585" y="415" width="210" height="78" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2" rx="4"/><text x="690" y="464" font-size="30" fill="#d37537" text-anchor="middle">16</text><rect x="855" y="415" width="210" height="78" fill="white" stroke="#d9e4ea" stroke-width="2" rx="4" stroke-dasharray="7 6"/><text x="960" y="464" font-size="30" fill="#818fa4" text-anchor="middle">未提供</text><rect x="1125" y="415" width="210" height="78" fill="url(#book-wash-fff1e5)" stroke="#d37537" stroke-width="2" rx="4"/><text x="1230" y="464" font-size="30" fill="#d37537" text-anchor="middle">False</text><text x="65" y="578" font-size="30" fill="#1e9195" text-anchor="start">只应用已提供值</text><rect x="315" y="610" width="210" height="80" fill="white" stroke="#1e9195" stroke-width="2" rx="4"/><text x="420" y="661" font-size="32" fill="#1e9195" text-anchor="middle">0.003</text><rect x="585" y="610" width="210" height="80" fill="white" stroke="#1e9195" stroke-width="2" rx="4"/><text x="690" y="661" font-size="32" fill="#1e9195" text-anchor="middle">16</text><rect x="855" y="610" width="210" height="80" fill="white" stroke="#1e9195" stroke-width="2" rx="4"/><text x="960" y="661" font-size="32" fill="#1e9195" text-anchor="middle">42</text><rect x="1125" y="610" width="210" height="80" fill="white" stroke="#1e9195" stroke-width="2" rx="4"/><text x="1230" y="661" font-size="32" fill="#1e9195" text-anchor="middle">False</text><text x="65" y="793" font-size="30" fill="#d37537" text-anchor="start">误把 CLI 默认当覆盖</text><rect x="315" y="825" width="210" height="80" fill="white" stroke="#d37537" stroke-width="2" rx="4"/><text x="420" y="876" font-size="32" fill="#d37537" text-anchor="middle">0.01</text><rect x="585" y="825" width="210" height="80" fill="white" stroke="#d37537" stroke-width="2" rx="4"/><text x="690" y="876" font-size="32" fill="#d37537" text-anchor="middle">16</text><rect x="855" y="825" width="210" height="80" fill="white" stroke="#d37537" stroke-width="2" rx="4"/><text x="960" y="876" font-size="32" fill="#d37537" text-anchor="middle">42</text><rect x="1125" y="825" width="210" height="80" fill="white" stroke="#d37537" stroke-width="2" rx="4"/><text x="1230" y="876" font-size="32" fill="#d37537" text-anchor="middle">False</text><path d="M525 320 L555 320 L555 550 L420 550 L420 600" fill="none" stroke="#1672a0" stroke-width="3" marker-end="url(#b)"/><text x="65" y="750" font-size="29" fill="#d37537" text-anchor="start">未传 --learning-rate，却由解析器补入 0.01</text><text x="65" y="990" font-size="30" fill="#20354a" text-anchor="start">False 是明确提供的值；“未提供”才表示本层不覆盖。</text></g></svg><g id="round-20261105c-teaching" transform="translate(0 1030) scale(1.04167)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">覆盖判断问“是否提供”，而不是问“值是否为真”</text><text x="65" y="130" font-size="30" fill="#1d3145" text-anchor="start">下层 shuffle=True；命令行显式提供 False</text><rect x="70" y="190" width="362" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="251.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">值 False</text><rect x="440" y="190" width="362" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="621.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">is not None</text><rect x="810" y="190" width="362" height="58" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="991.0" y="229" font-size="28" fill="#1e7499" text-anchor="middle">覆盖成 False</text><rect x="70" y="290" width="362" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="251.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">值 False</text><rect x="440" y="290" width="362" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="621.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">if value</text><rect x="810" y="290" width="362" height="58" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="991.0" y="329" font-size="28" fill="#c66d3a" text-anchor="middle">跳过，误留 True</text><text x="65" y="412" font-size="28" fill="#1d3145" text-anchor="start">0、空字符串、False 都可能是明确输入；缺席应使用独立哨兵或缺省字段表示。</text></g></g></svg></svg>

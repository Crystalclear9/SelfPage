<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img"><title>配置逐字段选择来源：未传参数与显式 False 不相同</title><rect width="1280" height="690" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">配置逐字段选择来源：未传参数与显式 False 不相同</text><text x="40" y="104" font-size="25" fill="#697d87" text-anchor="start">对应本章 resolve_config 的实际输入；优先级：命令行 &gt; 文件 &gt; 默认。</text><text x="55" y="178" font-size="27" fill="#697d87" text-anchor="start">字段</text><text x="385" y="178" font-size="27" fill="#697d87" text-anchor="start">默认</text><text x="595" y="178" font-size="27" fill="#697d87" text-anchor="start">文件</text><text x="815" y="178" font-size="27" fill="#697d87" text-anchor="start">命令行</text><text x="1030" y="178" font-size="27" fill="#697d87" text-anchor="start">有效值</text><line x1="45" y1="284" x2="1235" y2="284" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="252" font-size="29" fill="#233943" text-anchor="start">learning_rate</text><text x="385" y="252" font-size="29" fill="#233943" text-anchor="start">0.01</text><text x="595" y="252" font-size="29" fill="#276884" text-anchor="start">0.003</text><text x="815" y="252" font-size="29" fill="#233943" text-anchor="start">—</text><text x="1030" y="252" font-size="29" fill="#b25d2b" text-anchor="start">0.003</text><line x1="595" y1="261" x2="691" y2="261" stroke="#276884" stroke-width="4" stroke-dasharray=""/><line x1="701" y1="265" x2="1004" y2="265" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="1004,265 992.9472680719654,269.6730201077038 992.9472680719654,260.3269798922962" fill="#276884"/><line x1="45" y1="368" x2="1235" y2="368" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="336" font-size="29" fill="#233943" text-anchor="start">batch_size</text><text x="385" y="336" font-size="29" fill="#233943" text-anchor="start">32</text><text x="595" y="336" font-size="29" fill="#233943" text-anchor="start">—</text><text x="815" y="336" font-size="29" fill="#276884" text-anchor="start">16</text><text x="1030" y="336" font-size="29" fill="#b25d2b" text-anchor="start">16</text><line x1="815" y1="345" x2="911" y2="345" stroke="#276884" stroke-width="4" stroke-dasharray=""/><line x1="921" y1="349" x2="1004" y2="349" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="1004,349 992.9472680719654,353.6730201077038 992.9472680719654,344.3269798922962" fill="#276884"/><line x1="45" y1="452" x2="1235" y2="452" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="420" font-size="29" fill="#233943" text-anchor="start">seed</text><text x="385" y="420" font-size="29" fill="#276884" text-anchor="start">42</text><text x="595" y="420" font-size="29" fill="#233943" text-anchor="start">—</text><text x="815" y="420" font-size="29" fill="#233943" text-anchor="start">—</text><text x="1030" y="420" font-size="29" fill="#b25d2b" text-anchor="start">42</text><line x1="385" y1="429" x2="481" y2="429" stroke="#276884" stroke-width="4" stroke-dasharray=""/><line x1="491" y1="433" x2="1004" y2="433" stroke="#276884" stroke-width="2.5" stroke-dasharray=""/><polygon points="1004,433 992.9472680719654,437.6730201077038 992.9472680719654,428.3269798922962" fill="#276884"/><line x1="45" y1="536" x2="1235" y2="536" stroke="#dce5e8" stroke-width="2" stroke-dasharray=""/><text x="55" y="504" font-size="29" fill="#233943" text-anchor="start">shuffle</text><text x="385" y="504" font-size="29" fill="#233943" text-anchor="start">True</text><text x="595" y="504" font-size="29" fill="#233943" text-anchor="start">True</text><text x="815" y="504" font-size="29" fill="#276884" text-anchor="start">False</text><text x="1030" y="504" font-size="29" fill="#b25d2b" text-anchor="start">False</text><line x1="815" y1="513" x2="911" y2="513" stroke="#276884" stroke-width="4" stroke-dasharray=""/><line x1="921" y1="517" x2="1004" y2="517" strok
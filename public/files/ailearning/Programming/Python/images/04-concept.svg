<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：A 的四列分别是默认、文件、命令行和合并结果，下面的两条追踪线明确每个有效字段来自哪里</title><desc id="detail-desc">A 的四列分别是默认、文件、命令行和合并结果，下面的两条追踪线明确每个有效字段来自哪里。学习率使用文件值 0.01，批量大小使用命令行值 64；横向流程之后仍需要约束检查。</desc><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="35" y="72" width="235" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="35" y="72" width="235" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="47" y="97" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">默认值</text><text x="49" y="139" font-size="22" fill="#213447" font-weight="400" text-anchor="start">lr  0.1</text><text x="49" y="170" font-size="22" fill="#213447" font-weight="400" text-anchor="start">batch  32</text><rect x="300" y="72" width="235" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="300" y="72" width="235" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="312" y="97" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">配置文件</text><text x="314" y="139" font-size="22" fill="#213447" font-weight="400" text-anchor="start">lr  0.01</text><text x="314" y="170" font-size="22" fill="#213447" font-weight="400" text-anchor="start">batch  —</text><rect x="565" y="72" width="235" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="565" y="72" width="235" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="577" y="97" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">命令行</text><text x="579" y="139" font-size="22" fill="#213447" font-weight="400" text-anchor="start">lr  —</text><text x="579" y="170" font-size="22" fill="#213447" font-weight="400" text-anchor="start">batch  64</text><rect x="830" y="72" width="235" height="150" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="830" y="72" width="235" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="842" y="97" font-size="22" fill="#2865a0" font-weight="600" text-anchor="start">有效配置</text><text x="844" y="139" font-size="22" fill="#213447" font-weight="400" text-anchor="start">lr  0.01</text><text x="844" y="170" font-size="22" fill="#213447" font-weight="400" text-anchor="start">batch  64</text><path d="M274,145 L294,145" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M539,145 L559,145" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M804,145 L824,145" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><path d="M417,225 Q672.5,310.5 928,312" fill="none" stroke="#2865a0" stroke-width="2.5" marker-end="url(#detail-blue)" /><text x="348" y="307" font-size="23" fill="#2865a0" font-weight="400" text-anchor="start">lr 取文件值</text><path d="M680,225 Q827.5,329.0 975,353" fill="none" stroke="#cf7432" stroke-width="2.5" marker-end="url(#detail-orange)" /><text x="430" y="390" font-size="23" fill="#cf7432" font-weight="400" text-anchor="start">batch 取命令行值</text><rect x="830" y="301" width="235" height="42" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><text x="947.5" y="329" font-size="22" fill="#2865a0" font-weight="600" text-anchor="middle">lr = 0.01</text><rect x="830" y="356" width="235" height="42" rx="6" fill="#fcf0e4" stroke="#cf7432" stroke-width="1.3" /><text x="947.5" y="384" font-size="22" fill="#cf7432" font-weight="600" text-anchor="middle">batch = 64</text></g></svg>

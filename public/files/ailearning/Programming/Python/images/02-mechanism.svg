<svg xmlns="http://www.w3.org/2000/svg" width="1125.333" height="702.213" viewBox="34.133 64.032 1125.333 702.213" role="img"><title>合并均值方差时，不得丢掉两组中心的距离</title><rect width="1125.333" height="702.213" fill="white" x="34.133" y="64.032" /><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="112" font-size="27" fill="#71858b" text-anchor="start">同一组数据 [1, 3, 5, 7]；上排分组居中，下排统一居中</text><line x1="205.0" y1="275" x2="1115.0" y2="275" stroke="#19333c" stroke-width="2" stroke-dasharray="" /><line x1="270" y1="270" x2="270" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="270" y="312" font-size="24" fill="#71858b" text-anchor="middle">1</text><line x1="400" y1="270" x2="400" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="400" y="312" font-size="24" fill="#71858b" text-anchor="middle">2</text><line x1="530" y1="270" x2="530" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="530" y="312" font-size="24" fill="#71858b" text-anchor="middle">3</text><line x1="660" y1="270" x2="660" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="660" y="312" font-size="24" fill="#71858b" text-anchor="middle">4</text><line x1="790" y1="270" x2="790" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="790" y="312" font-size="24" fill="#71858b" text-anchor="middle">5</text><line x1="920" y1="270" x2="920" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="920" y="312" font-size="24" fill="#71858b" text-anchor="middle">6</text><line x1="1050" y1="270" x2="1050" y2="280" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="1050" y="312" font-size="24" fill="#71858b" text-anchor="middle">7</text><line x1="205.0" y1="485" x2="1115.0" y2="485" stroke="#19333c" stroke-width="2" stroke-dasharray="" /><line x1="270" y1="480" x2="270" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="270" y="522" font-size="24" fill="#71858b" text-anchor="middle">1</text><line x1="400" y1="480" x2="400" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="400" y="522" font-size="24" fill="#71858b" text-anchor="middle">2</text><line x1="530" y1="480" x2="530" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="530" y="522" font-size="24" fill="#71858b" text-anchor="middle">3</text><line x1="660" y1="480" x2="660" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="660" y="522" font-size="24" fill="#71858b" text-anchor="middle">4</text><line x1="790" y1="480" x2="790" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="790" y="522" font-size="24" fill="#71858b" text-anchor="middle">5</text><line x1="920" y1="480" x2="920" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="920" y="522" font-size="24" fill="#71858b" text-anchor="middle">6</text><line x1="1050" y1="480" x2="1050" y2="490" stroke="#71858b" stroke-width="2" stroke-dasharray="" /><text x="1050" y="522" font-size="24" fill="#71858b" text-anchor="middle">7</text><circle cx="270" cy="275" r="8" fill="#256b82" /><line x1="270" y1="240" x2="400" y2="240" stroke="#256b82" stroke-width="4" stroke-dasharray="" /><line x1="400" y1="220" x2="400" y2="300" stroke="#256b82" stroke-width="2" stroke-dasharray="7 5" /><circle cx="270" cy="485" r="8" fill="#256b82" /><line x1="270" y1="448" x2="660" y2="448" stroke="#256b82" stroke-width="4" stroke-dasharray="" /><circle cx="530" cy="275" r="8" fill="#256b82" /><line x1="530" y1="240" x2="400" y2="240" stroke="#256b82" stroke-width="4" stroke-dasharray="" /><line x1="400" y1="220" x2="400" y2="300" stroke="#256b82" stroke-width="2" stroke-dasharray="7 5" /><circle cx="530" cy="485" r="8" fill="#256b82" /><line x1="530" y1="424" x2="660" y2="424" stroke="#256b82" stroke-width="4" stroke-dasharray="" /><circle cx="790" cy="275" r="8" fill="#c0643c" /><line x1="790" y1="240" x2="920" y2="240" stroke="#c0643c" stroke-width="4" stroke-dasharray="" /><line x1="920" y1="220" x2="920" y2="300" stroke="#c0643c" stroke-width="2" stroke-dasharray="7 5" /><circle cx="790" cy="485" r="8" fill="#c0643c" /><line x1="790" y1="424" x2="660" y2="424" stroke="#c0643c" stroke-width="4" stroke-dasharray="" /><circle cx="1050" cy="275" r="8" fill="#c0643c" /><line x1="1050" y1="240" x2="920" y2="240" stroke="#c0643c" stroke-width="4" stroke-dasharray="" /><line x1="920" y1="220" x2="920" y2="300" stroke="#c0643c" stroke-width="2" stroke-dasharray="7 5" /><circle cx="1050" cy="485" r="8" fill="#c0643c" /><line x1="1050" y1="448" x2="660" y2="448" stroke="#c0643c" stroke-width="4" stroke-dasharray="" /><line x1="660" y1="390" x2="660" y2="500" stroke="#71858b" stroke-width="2" stroke-dasharray="7 5" /><text x="400" y="190" font-size="29" fill="#256b82" text-anchor="middle">A：均值 2</text><text x="920" y="190" font-size="29" fill="#c0643c" text-anchor="middle">B：均值 6</text><text x="400" y="352" font-size="28" fill="#256b82" text-anchor="middle">组内平方和 2</text><text x="920" y="352" font-size="28" fill="#c0643c" text-anchor="middle">组内平方和 2</text><text x="660" y="400" font-size="29" fill="#19333c" text-anchor="middle">合并均值 4</text><text x="60" y="580" font-size="28" fill="#19333c" text-anchor="start">每组有 2 个点，组均值各移动 2；组间贡献 = 2 × 2² + 2 × 2² = 16</text><rect x="90" y="625" width="90" height="48" fill="#256b82" /><text x="135.0" y="659" font-size="28" fill="white" text-anchor="middle">2</text><rect x="180" y="625" width="90" height="48" fill="#c0643c" /><text x="225.0" y="659" font-size="28" fill="white" text-anchor="middle">2</text><rect x="270" y="625" width="720" height="48" fill="#71858b" /><text x="630.0" y="659" font-size="28" fill="white" text-anchor="middle">16</text><text x="1030" y="660" font-size="30" fill="#19333c" text-anchor="start">总和 20</text><text x="60" y="735" font-size="29" fill="#19333c" text-anchor="start">直接核对：(1−4)² + (3−4)² + (5−4)² + (7−4)² = 20</text></g><desc> 合并统计：组内波动相加，还要补上组间距离 只有 2 + 2 会丢掉组间差异；条形宽度与平方和成比例。</desc></svg>

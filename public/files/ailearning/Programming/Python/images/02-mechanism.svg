<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">在线均值：只保留计数和累计状态</title><desc id="desc">依次读入 2、4、8、6，前缀均值分别为 2、3、约 4.667 和 5。更新时只需旧均值、旧计数和新观测，无需保存全部历史；第三个点对应累计和 14、计数 3。 连线仅辅助跟踪离散状态，不表示观测之间存在连续时间插值。浮点在线更新仍会有舍入误差；需要方差时还必须维护额外状态。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">在线均值：只保留计数和累计状态</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">每消费一个值更新状态；这不是把所有样本缓存在列表里。</text><path d="M130,545 L1090,545" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,425 L1090,425" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="432" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">2</text><path d="M130,305 L1090,305" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="312" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">4</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">6</text><text x="157.17" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="459.057" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="760.943" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="1062.83" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">前缀均值</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">已消费样本数</text><polyline points="157.17,425.00 459.06,365.00 760.94,265.00 1062.83,245.00" fill="none" stroke="#268d8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="425.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="459.06" cy="365.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="760.94" cy="265.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="245.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">前缀均值</text></g></svg>

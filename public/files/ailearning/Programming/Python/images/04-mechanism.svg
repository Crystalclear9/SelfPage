<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="597.92" viewBox="11.00 10.00 1154.00 575.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">有效配置身份：等价表示需要同一规范形式</title><desc id="desc">两个配置的字段和值相同，只是书写顺序不同。若实验身份应忽略这一顺序，就先按约定生成同一规范表示，再计算摘要；否则原始文本的不同会被误当成实验配置不同。 规范规则必须处理数值类型、缺省字段和路径含义。哈希只固定被编码的内容，不会自动固定路径指向的数据、依赖环境或程序版本。 先定义数值、字段与默认值的等价关系，再规范化并求摘要。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker><marker id="tip-507db3" markerWidth="6.5" markerHeight="6.5" refX="6.2" refY="3.25" orient="auto" viewBox="0 0 6.5 6.5"><path d="M0 0 L6.5 3.25 L0 6.5 Z" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">有效配置身份：等价表示需要同一规范形式</text><path d="M335,274.875 L450,315.125" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M335,448.688 L450,411.312" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M735,332.938 L850,307.062" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><path d="M992.5,330 L992.5,440" stroke="#507db3" stroke-width="3" fill="none" marker-end="url(#tip-507db3)" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="170" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="233" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">配置一：lr=.1，seed=7</text><rect x="50" y="440" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="192.5" y="503" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">配置二：seed=7，lr=.1</text><rect x="450" y="310" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="592.5" y="373" font-size="24" fill="#213447" text-anchor="middle" font-weight="400"><tspan x="592.5" y="373.0">固定字段与数值规则</tspan></text><rect x="850" y="220" width="285" height="110" fill="#eef4fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="283" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">同一规范字节串</text><rect x="850" y="440" width="285" height="110" fill="#eaf2fa" stroke="#bcd1df" rx="10" stroke-linecap="round" stroke-linejoin="round" /><text x="992.5" y="503" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">同一配置摘要</text></g></svg>

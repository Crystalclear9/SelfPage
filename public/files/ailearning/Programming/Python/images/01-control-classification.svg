<svg xmlns="http://www.w3.org/2000/svg" width="1432.500" height="780.000" viewBox="0.000 70.000 1432.500 780.000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1432.5" height="780.0" fill="white" x="0.0" y="70.0" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#193a4e" text-anchor="start" font-weight="400">输入位置保持不变：0 → 0 分，1 → 60 分，2 → None，3 → 80 分。</text><rect x="65" y="215" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="130" y="260" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="40" y="260" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">0</text><rect x="65" y="315" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="130" y="360" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">60</text><text xml:space="preserve" x="40" y="360" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">1</text><rect x="65" y="415" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="130" y="460" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">None</text><text xml:space="preserve" x="40" y="460" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">2</text><rect x="65" y="515" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8ca5b4" stroke-width="2" /><text xml:space="preserve" x="130" y="560" font-size="34" fill="#193a4e" text-anchor="middle" font-weight="400">80</text><text xml:space="preserve" x="40" y="560" font-size="25" fill="#193a4e" text-anchor="end" font-weight="400">3</text><path d="M 195,250 H 250 V 400 H 330" stroke="#587b92" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)" /><path d="M 195,350 H 250 V 400" stroke="#587b92" stroke-width="3" fill="none" stroke-dasharray="" /><path d="M 195,450 H 250 V 400" stroke="#587b92" stroke-width="3" fill="none" stroke-dasharray="" /><path d="M 195,550 H 250 V 400" stroke="#587b92" stroke-width="3" fill="none" stroke-dasharray="" /><path d="M 330,400 L 475,305 L 620,400 L 475,495 Z" stroke="#587b92" stroke-width="3" fill="#f5f9fc" stroke-dasharray="" /><text xml:space="preserve" x="475" y="392" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">score</text><text xml:space="preserve" x="475" y="435" font-size="31" fill="#193a4e" text-anchor="middle" font-weight="400">is None ?</text><line x1="620" y1="400" x2="780" y2="400" stroke="#2676ad" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="700" y="348" font-size="31" fill="#2676ad" text-anchor="middle" font-weight="400">否</text><text xml:space="preserve" x="700" y="385" font-size="27" fill="#2676ad" text-anchor="middle" font-weight="400">0、60、80</text><line x1="475" y1="495" x2="475" y2="715" stroke="#d76a22" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)" /><text xml:space="preserve" x="500" y="565" font-size="29" fill="#d76a22" text-anchor="start" font-weight="400">是：位置 2</text><text xml:space="preserve" x="475" y="770" font-size="34" fill="#d76a22" text-anchor="middle" font-weight="400">缺失 1 条</text><text xml:space="preserve" x="475" y="815" font-size="30" fill="#d76a22" text-anchor="middle" font-weight="400">continue</text><path d="M 780,400 L 930,305 L 1080,400 L 930,495 Z" stroke="#2676ad" stroke-width="3" fill="#f5f9fc" stroke-dasharray="" /><text xml:space="preserve" x="930" y="392" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">score</text><text xml:space="preserve" x="930" y="435" 
<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="873.8115" viewBox="0 0 1440 873.8115" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">四条输入逐条经过缺失守卫与六十分比较，并进入互斥的三个结果出口</title><rect width="1440" height="873.8115" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">四条输入逐条经过缺失守卫与六十分比较，并进入互斥的三个结果出口</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="731.8115" viewBox="0 70 1432.5 780" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1432.5" height="780.0" fill="white" x="0.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">输入位置保持不变：0 → 0 分，1 → 60 分，2 → None，3 → 80 分。</text><rect x="65" y="215" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="130" y="260" font-size="34" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><text xml:space="preserve" x="40" y="260" font-size="25" fill="#1f3348" text-anchor="end" font-weight="400">0</text><rect x="65" y="315" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="130" y="360" font-size="34" fill="#1f3348" text-anchor="middle" font-weight="400">60</text><text xml:space="preserve" x="40" y="360" font-size="25" fill="#1f3348" text-anchor="end" font-weight="400">1</text><rect x="65" y="415" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="130" y="460" font-size="34" fill="#1f3348" text-anchor="middle" font-weight="400">None</text><text xml:space="preserve" x="40" y="460" font-size="25" fill="#1f3348" text-anchor="end" font-weight="400">2</text><rect x="65" y="515" width="130" height="70" rx="0" fill="#f4f8fb" stroke="#8e9fb9" stroke-width="2"/><text xml:space="preserve" x="130" y="560" font-size="34" fill="#1f3348" text-anchor="middle" font-weight="400">80</text><text xml:space="preserve" x="40" y="560" font-size="25" fill="#1f3348" text-anchor="end" font-weight="400">3</text><path d="M 195,250 H 250 V 400 H 330" stroke="#5784a1" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 195,350 H 250 V 400" stroke="#5784a1" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M 195,450 H 250 V 400" stroke="#5784a1" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M 195,550 H 250 V 400" stroke="#5784a1" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M 330,400 L 475,305 L 620,400 L 475,495 Z" stroke="#5784a1" stroke-width="3" fill="#f5f9fc" stroke-dasharray=""/><text xml:space="preserve" x="475" y="392" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">score</text><text xml:space="preserve" x="475" y="435" font-size="31" fill="#1f3348" text-anchor="middle" font-weight="400">is None ?</text><line x1="620" y1="400" x2="780" y2="400" stroke="#2181bf" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="700" y="348" font-size="31" fill="#2181bf" text-anchor="middle" font-weight="400">否</text><text xml:space="preserve" x="700" y="385" font-size="27" fill="#2181bf" text-anchor="middle" font-weight="400">0、60、80</text><line x1="475" y1="495" x2="475" y2="715" stroke="#d26c27" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="500" y="565" font-size="29" fill="#d26c27" text-anchor="start" font-weight="400">是：位置 2</text><text xml:space="preserve" x="475" y="770" font-size="34" fill="#d26c27" text-anchor="middle" font-weight="400">缺失 1 条</text><text xml:space="preserve" x="475" y="815" font-size="30" fill="#d26c27" text-anchor="middle" font-weight="400">continue</text><path d="M 780,400 L 930,305 L 1080,400 L 930,495 Z" stroke="#2181bf" stroke-width="3" fill="#f5f9fc" stroke-dasharray=""/><text xml:space="preserve" x="930" y="392" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">score</text><text xml:space="preserve" x="930" y="435" font-size="33" fill="#1f3348" text-anchor="middle" font-weight="400">≥ 60 ?</text><path d="M 1080,400 H 1210 V 270 H 1400" stroke="#2181bf" stroke-width="4" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1200" y="235" font-size="29" fill="#2181bf" text-anchor="start" font-weight="400">是：位置 1、3</text><text xml:space="preserve" x="1320" y="325" font-size="34" fill="#2181bf" text-anchor="middle" font-weight="400">通过 2 条</text><text xml:space="preserve" x="1320" y="375" font-size="33" fill="#2181bf" text-anchor="middle" font-weight="400">[60, 80]</text><line x1="930" y1="495" x2="930" y2="715" stroke="#67879a" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="955" y="565" font-size="29" fill="#1f3348" text-anchor="start" font-weight="400">否：位置 0</text><text xml:space="preserve" x="930" y="770" font-size="34" fill="#1f3348" text-anchor="middle" font-weight="400">未通过 1 条</text><text xml:space="preserve" x="930" y="815" font-size="29" fill="#1f3348" text-anchor="middle" font-weight="400">0 是已知分数</text></g><desc> 先排除未知，再判断分数：一条输入只到达一个出口 None 的路径没有经过“≥ 60”；四条输入对应 1 + 1 + 2 条互斥结果。</desc></svg></svg>

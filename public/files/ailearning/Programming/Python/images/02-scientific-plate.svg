<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img" aria-labelledby="title description">
  <title id="title">生成器如何交付一个值，再交付余下的值</title>
  <desc id="description">调用 values 创建生成器 g。第一次 next 返回 0 并暂停。list 从当前暂停点继续取得 1 和 2，收到正常结束信号后返回列表。再次消费时生成器已耗尽。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#537289"/>
    </marker>
  </defs>
  <rect width="960" height="536" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#172e46">
    <rect x="36" y="25" width="5" height="32" rx="2" fill="#526bab"/>
    <text x="56" y="53" font-size="33" font-weight="700">生成器如何交付一个值，再交付余下的值</text>
    <path d="M36 74H924" stroke="#d7e1ee" stroke-width="1.4"/>

    <text x="48" y="124" font-size="27" font-weight="700">生成器函数</text>
    <rect x="48" y="148" width="320" height="225" rx="15" fill="#f2f6fb" stroke="#c7d9e8"/>
    <rect x="64" y="210" width="286" height="38" rx="5" fill="#dcecf9"/>
    <rect x="64" y="257" width="286" height="91" rx="5" fill="#def1ec"/>
    <g font-family="Consolas, monospace" font-size="26">
      <text x="72" y="193">def values():</text>
      <text x="121" y="238">yield 0</text>
      <text x="121" y="286">yield 1</text>
      <text x="121" y="334">yield 2</text>
    </g>

    <text x="422" y="124" font-size="27" font-weight="700">同一个 g 的状态</text>
    <rect x="422" y="148" width="490" height="66" rx="12" fill="#f2f5fa" stroke="#d2dbe6"/>
    <rect x="422" y="236" width="490" height="72" rx="12" fill="#dcecf9" stroke="#a9c9e2"/>
    <rect x="422" y="330" width="490" height="79" rx="12" fill="#def1ec" stroke="#abd4c7"/>
    <rect x="422" y="431" width="490" height="64" rx="12" fill="#f2f5fa" stroke="#d2dbe6"/>
    <path d="M667 216V234M667 310V328M667 411V429" stroke="#537289" stroke-width="2.4" marker-end="url(#arrow)"/>
    <g font-family="Consolas, monospace" font-size="25">
      <text x="445" y="188">g = values()</text>
      <text x="445" y="279">next(g)</text>
      <text x="445" y="376">list(g)</text>
    </g>
    <text x="636" y="188" font-size="25">创建，函数体尚未执行</text>
    <text x="636" y="279" font-size="25" fill="#286391">返回 0 后暂停</text>
    <text x="636" y="365" font-size="25" fill="#176f63">依次得到 1、2</text>
    <text x="636" y="394" font-size="23" fill="#176f63">迭代结束，返回 [1, 2]</text>
    <text x="445" y="470" font-size="25" font-weight="700">同一对象已经耗尽</text>
  </g>
</svg>

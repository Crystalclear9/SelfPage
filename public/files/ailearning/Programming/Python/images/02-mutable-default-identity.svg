  <title id="plate-title">两次省略参数，返回值可能共享同一对象</title>
  <desc id="plate-desc">左侧默认列表在定义时创建，调用两次后 r1 和 r2 共享 [1,2]。右侧 None 分支在每次调用时创建新列表。</desc>

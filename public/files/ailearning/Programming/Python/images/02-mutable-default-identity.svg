<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img"><title>默认参数对象与返回引用在第二次调用后仍共享</title><rect width="1800" height="1440" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="460" y="80" font-size="34" fill="#203b4a" text-anchor="middle" font-weight="400">out = []：定义时创建一次</text><text x="70" y="180" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">第一次返回后</text><text x="70" y="300" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">collect.__defaults__[0]</text><line x1="420" y1="290" x2="610" y2="390" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="70" y="405" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">第一次返回 r1</text><line x1="420" y1="395" x2="610" y2="390" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="630" y="330" width="250" height="130" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="755" y="300" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">同一个 L</text><text x="755" y="410" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">[1]</text><text x="70" y="730" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">第二次返回后</text><text x="70" y="850" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">collect.__defaults__[0]</text><line x1="420" y1="840" x2="610" y2="940" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="70" y="955" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">第一次返回 r1</text><line x1="420" y1="945" x2="610" y2="940" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="70" y="1060" font-size="28" fill="#176b91" text-anchor="start" font-weight="400">第二次返回 r2</text><line x1="420" y1="1050" x2="610" y2="940" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><rect x="630" y="880" width="250" height="130" rx="4" fill="#eaf4fa" stroke="#176b91" stroke-width="2"/><text x="755" y="850" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">同一个 L</text><text x="755" y="960" font-size="38" fill="#176b91" text-anchor="middle" font-weight="400">[1, 2]</text><text x="1360" y="80" font-size="34" fill="#203b4a" text-anchor="middle" font-weight="400">out = None：每次创建新列表</text><text x="970" y="180" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">第一次返回后</text><text x="970" y="395" font-size="30" fill="#218579" text-anchor="start" font-weight="400">第一次返回 r1</text><line x1="1250" y1="385" x2="1470" y2="385" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><rect x="1490" y="330" width="270" height="110" rx="4" fill="#eaf6f2" stroke="#218579" stroke-width="2"/><text x="1625" y="400" font-size="38" fill="#218579" text-anchor="middle" font-weight="400">[1]</text><text x="970" y="730" font-size="31" fill="#203b4a" text-anchor="start" font-weight="400">第二次返回后</text><text x="970" y="945" font-size="30" fill="#218579" text-anchor="start" font-weight="400">第一次返回 r1</text><line x1="1250" y1="935" x2="1470" y2="935" stroke="#218579" stroke-width="3" marker-end="url(#t)"/><rect x="1490" y="880" width="270" height="110" rx="4" fill="#
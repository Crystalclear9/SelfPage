<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title id="figure-title">super 沿最终对象的 MRO 继续查找</title><desc id="figure-desc">左图仅表示继承关系，箭头从子类指向基类；右图追踪正文中 Combined().trace() 的实际调用。Combined 的完整 MRO 是 Combined、Left、Right、Root、object，但 Root.trace() 返回后没有继续调用 super，所以图中的方法链在 Root 停止。Left 的直接基类虽然是 Root，协作调用的下一站仍为 Right；这正是继承关系与运行时查找次序需要分别理解的地方。</desc><rect width="1200" height="660" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">super 沿最终对象的 MRO 继续查找</text><text x="40" y="110" font-size="28" fill="#2865a0" text-anchor="start" font-weight="600">继承关系：子类指向基类</text><rect x="240" y="150" width="190" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="335.0" y="192.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">Root</text><rect x="75" y="310" width="190" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="170.0" y="352.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">Left</text><rect x="420" y="310" width="190" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="515.0" y="352.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">Right</text><rect x="240" y="470" width="190" height="65" rx="6" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="335.0" y="512.3" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">Combined</text><path d="M275 460 L185 385" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M400 460 L515 385" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M170 300 L280 225" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><path d="M515 300 L390 225" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="760" y="110" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">实际调用次序</text><rect x="770" y="150" width="290" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="915.0" y="192.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">Combined</text><path d="M915 225 L915 253" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="770" y="265" width="290" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="915.0" y="307.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">Left</text><path d="M915 340 L915 368" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="770" y="380" width="290" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="915.0" y="422.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">Right</text><path d="M915 455 L915 483" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><rect x="770" y="495" width="290" height="65" rx="6" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="915.0" y="537.3" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">Root</text></g></svg>

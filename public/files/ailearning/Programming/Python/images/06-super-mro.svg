<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>super调用沿MRO前进，返回沿调用栈退回</title><desc>Combined调用Left，Left调用Right，Right调用Root；Root返回后每层将自己的名称加到列表前端。方法名与同章可运行trace代码一致。</desc><rect width="1280" height="680" fill="white"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#246b93"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc6b35"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#243b4a"><text x="140" y="60" text-anchor="middle" font-size="29" fill="#243b4a">Combined</text><line x1="140" y1="90" x2="140" y2="600" stroke="#d9e3e9" stroke-width="2" stroke-dasharray="5 6"/><text x="470" y="60" text-anchor="middle" font-size="29" fill="#243b4a">Left</text><line x1="470" y1="90" x2="470" y2="600" stroke="#d9e3e9" stroke-width="2" stroke-dasharray="5 6"/><text x="800" y="60" text-anchor="middle" font-size="29" fill="#243b4a">Right</text><line x1="800" y1="90" x2="800" y2="600" stroke="#d9e3e9" stroke-width="2" stroke-dasharray="5 6"/><text x="1130" y="60" text-anchor="middle" font-size="29" fill="#243b4a">Root</text><line x1="1130" y1="90" x2="1130" y2="600" stroke="#d9e3e9" stroke-width="2" stroke-dasharray="5 6"/><line x1="140" y1="150" x2="470" y2="150" stroke="#246b93" stroke-width="3" marker-end="url(#b)"/><text x="305.0" y="136" text-anchor="middle" font-size="24" fill="#246b93">super().trace()</text><line x1="470" y1="225" x2="800" y2="225" stroke="#246b93" stroke-width="3" marker-end="url(#b)"/><text x="635.0" y="211" text-anchor="middle" font-size="24" fill="#246b93">super().trace()</text><line x1="800" y1="300" x2="1130" y2="300" stroke="#246b93" stroke-width="3" marker-end="url(#b)"/><text x="965.0" y="286" text-anchor="middle" font-size="24" fill="#246b93">super().trace()</text><line x1="1130" y1="380" x2="800" y2="380" stroke="#cc6b35" stroke-width="3" marker-end="url(#o)"/><text x="965.0" y="366" text-anchor="middle" font-size="24" fill="#cc6b35">[&#x27;Root&#x27;]</text><line x1="800" y1="460" x2="470" y2="460" stroke="#cc6b35" stroke-width="3" marker-end="url(#o)"/><text x="635.0" y="446" text-anchor="middle" font-size="24" fill="#cc6b35">[&#x27;Right&#x27;, &#x27;Root&#x27;]</text><line x1="470" y1="540" x2="140" y2="540" stroke="#cc6b35" stroke-width="3" marker-end="url(#o)"/><text x="305.0" y="526" text-anchor="middle" font-size="24" fill="#cc6b35">[&#x27;Left&#x27;, &#x27;Right&#x27;, &#x27;Root&#x27;]</text><text x="640" y="640" text-anchor="middle" font-size="26" fill="#243b4a">self 始终是 Combined；按 MRO 调用，按调用栈返回。</text></g></svg>

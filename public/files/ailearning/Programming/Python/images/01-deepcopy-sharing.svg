<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>深复制隔离原图，同时保留复制图内的共享</title><rect width="1400" height="920" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="34" fill="#21384a" text-anchor="start" font-weight="bold">深复制隔离原图，同时保留复制图内的共享</text><text x="48" y="105" font-size="26" fill="#6b7a86" text-anchor="start" font-weight="normal">执行 c[&quot;left&quot;].append(&quot;new&quot;) 之后；a、b 是两个字典，c 是第三个字典</text><line x1="48" y1="130" x2="1352" y2="130" stroke="#d9e3ea" stroke-width="2"/><line x1="725" y1="185" x2="725" y2="815" stroke="#d9e3ea" stroke-width="2" stroke-dasharray="7 8"/><text x="250" y="222" font-size="29" fill="#286ca5" text-anchor="middle" font-weight="normal">字典 A</text><rect x="140" y="245" width="220" height="160" rx="4" stroke="#286ca5" stroke-width="2" fill="white"/><line x1="140" y1="325" x2="360" y2="325" stroke="#d9e3ea" stroke-width="2"/><text x="160" y="295" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">left</text><line x1="270" y1="245" x2="270" y2="325" stroke="#d9e3ea" stroke-width="2"/><circle cx="315" cy="285" r="7" stroke="#286ca5" stroke-width="2" fill="#286ca5"/><text x="160" y="375" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">right</text><line x1="270" y1="325" x2="270" y2="405" stroke="#d9e3ea" stroke-width="2"/><circle cx="315" cy="365" r="7" stroke="#286ca5" stroke-width="2" fill="#286ca5"/><text x="55" y="336" font-size="33" fill="#286ca5" text-anchor="middle" font-weight="normal">a</text><line x1="80" y1="325" x2="137" y2="325" stroke="#286ca5" stroke-width="3"/><path d="M126.46900925731552,330.75310646325045 L137,325 L126.46900925731552,319.24689353674955" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><text x="250" y="542" font-size="29" fill="#286ca5" text-anchor="middle" font-weight="normal">字典 B</text><rect x="140" y="565" width="220" height="160" rx="4" stroke="#286ca5" stroke-width="2" fill="white"/><line x1="140" y1="645" x2="360" y2="645" stroke="#d9e3ea" stroke-width="2"/><text x="160" y="615" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">left</text><line x1="270" y1="565" x2="270" y2="645" stroke="#d9e3ea" stroke-width="2"/><circle cx="315" cy="605" r="7" stroke="#286ca5" stroke-width="2" fill="#286ca5"/><text x="160" y="695" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">right</text><line x1="270" y1="645" x2="270" y2="725" stroke="#d9e3ea" stroke-width="2"/><circle cx="315" cy="685" r="7" stroke="#286ca5" stroke-width="2" fill="#286ca5"/><text x="55" y="656" font-size="33" fill="#286ca5" text-anchor="middle" font-weight="normal">b</text><line x1="80" y1="645" x2="137" y2="645" stroke="#286ca5" stroke-width="3"/><path d="M126.46900925731552,650.7531064632504 L137,645 L126.46900925731552,639.2468935367496" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><text x="605" y="388" font-size="28" fill="#286ca5" text-anchor="middle" font-weight="normal">列表 L</text><rect x="535" y="425" width="140" height="82" rx="4" stroke="#286ca5" stroke-width="2" fill="white"/><text x="605" y="477" font-size="31" fill="#21384a" text-anchor="middle" font-weight="normal">seed</text><path d="M315,285 C440,285 440,440 530,440" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M519.4690092573155,445.75310646325045 L530,440 L519.4690092573155,434.24689353674955" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M315,365 C440,365 440,452 530,452" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M519.4690092573155,457.75310646325045 L530,452 L519.4690092573155,446.24689353674955" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M315,605 C440,605 440,480 530,480" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M519.4690092573155,485.75310646325045 L530,480 L519.4690092573155,474.24689353674955" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M315,685 C440,685 440,493 530,493" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M519.4690092573155,498.75310646325045 L530,493 L519.4690092573155,487.24689353674955" stroke="#286ca5" stroke-width="3" fill="none" stroke-linecap="round"/><text x="75" y="800" font-size="30" fill="#286ca5" text-anchor="start" font-weight="normal">b = a.copy()</text><text x="75" y="848" font-size="27" fill="#6b7a86" text-anchor="start" font-weight="normal">两个外层字典，共享原来的 L</text><text x="980" y="267" font-size="29" fill="#207e71" text-anchor="middle" font-weight="normal">字典 C</text><rect x="870" y="290" width="220" height="160" rx="4" stroke="#207e71" stroke-width="2" fill="white"/><line x1="870" y1="370" x2="1090" y2="370" stroke="#d9e3ea" stroke-width="2"/><text x="890" y="340" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">left</text><line x1="1000" y1="290" x2="1000" y2="370" stroke="#d9e3ea" stroke-width="2"/><circle cx="1045" cy="330" r="7" stroke="#207e71" stroke-width="2" fill="#207e71"/><text x="890" y="420" font-size="29" fill="#21384a" text-anchor="start" font-weight="normal">right</text><line x1="1000" y1="370" x2="1000" y2="450" stroke="#d9e3ea" stroke-width="2"/><circle cx="1045" cy="410" r="7" stroke="#207e71" stroke-width="2" fill="#207e71"/><text x="785" y="381" font-size="33" fill="#207e71" text-anchor="middle" font-weight="normal">c</text><line x1="810" y1="370" x2="867" y2="370" stroke="#207e71" stroke-width="3"/><path d="M856.4690092573155,375.75310646325045 L867,370 L856.4690092573155,364.24689353674955" stroke="#207e71" stroke-width="3" fill="none" stroke-linecap="round"/><text x="1210" y="720" font-size="29" fill="#207e71" text-anchor="middle" font-weight="normal">列表 L′</text><rect x="1100" y="590" width="240" height="82" rx="4" stroke="#207e71" stroke-width="2" fill="white"/><line x1="1220" y1="590" x2="1220" y2="672" stroke="#d9e3ea" stroke-width="2"/><text x="1160" y="644" font-size="30" fill="#21384a" text-anchor="middle" font-weight="normal">seed</text><text x="1280" y="644" font-size="30" fill="#c86b2c" text-anchor="middle" font-weight="normal">new</text><text x="800" y="800" font-size="30" fill="#207e71" text-anchor="start" font-weight="normal">c = deepcopy(a)</text><text x="800" y="848" font-size="27" fill="#6b7a86" text-anchor="start" font-weight="normal">两条路径，汇入同一个新 L′</text><text x="48" y="904" font-size="27" fill="#6b7a86" text-anchor="start" font-weight="normal">复制记忆 memo 对同一个源列表只建立一份对应副本；它不是“每条路径都复制一遍”。</text><circle cx="1210" cy="550" r="4" fill="#207e71"/><path d="M1210,558 L1210,586 M1204,575 L1210,586 L1216,575" stroke="#207e71" stroke-width="3" fill="none"/><path d="M1045,330 C1150,330 1210,420 1210,550" stroke="#207e71" stroke-width="3" fill="none"/><path d="M1204.7263190753538,540.3465918192059 L1210,550 L1215.2736809246462,540.3465918192059" stroke="#207e71" stroke-width="3" fill="none"/><path d="M1045,410 C1120,410 1150,520 1210,550" stroke="#207e71" stroke-width="3" fill="none"/><path d="M1199.007267429446,550.3997882342995 L1210,550 L1203.7241910451073,540.9659410029772" stroke="#207e71" stroke-width="3" fill="none"/></g></svg>

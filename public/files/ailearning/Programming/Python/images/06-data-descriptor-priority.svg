<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="598" viewBox="0 0 1340 598" role="img" aria-labelledby="label detail"><title id="label">属性查找中描述符的优先级</title><desc id="detail">obj.x 优先读取类上的数据描述符，返回 3。直接读取实例字典，仍会见到 9。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/></marker><linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/><stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/></linearGradient><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/></marker><linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/><stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/></linearGradient><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/></marker><linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/><stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/></linearGradient><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/></marker><linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/><stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/></linearGradient><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/></marker><linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1340" height="598" fill="white" stroke="none" stroke-width="1.6"/><polygon points="112,222 358,222 398,138 152,138" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><text x="255" y="191.16" fill="#196f77" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">obj.x</text><line x1="417" y1="180" x2="526" y2="180" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polygon points="549,222 830,222 869,138 588,138" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.65" stroke-linejoin="round"/><text x="709" y="191.52" fill="#196f77" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">数据描述符</text><line x1="890" y1="180" x2="1039" y2="180" stroke="#196f77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="1104" cy="180" r="38" stroke="#196f77" fill="url(#wash-teal)" stroke-width="2"/><text x="1104" y="191.9" fill="#196f77" font-size="35" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">3</text><polygon points="112,445 358,445 398,361 152,361" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.65" stroke-linejoin="round"/><text x="255" y="414.16" fill="#655184" font-size="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">obj.__dict__['x']</text><line x1="417" y1="403" x2="526" y2="403" stroke="#655184" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-violet)"/><polygon points="549,445 830,445 869,361 588,361" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.65" stroke-linejoin="round"/><text x="709" y="414.52" fill="#655184" font-size="32" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">直接查字典</text><line x1="890" y1="403" x2="1039" y2="403" stroke="#655184" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-violet)"/><circle cx="1104" cy="403" r="38" stroke="#655184" fill="url(#wash-violet)" stroke-width="2"/><text x="1104" y="414.9" fill="#655184" font-size="35" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif">9</text><text x="656" y="550" fill="#202a37" font-size="30" text-anchor="middle" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif">默认属性读取和直接查字典走不同路径</text></svg>
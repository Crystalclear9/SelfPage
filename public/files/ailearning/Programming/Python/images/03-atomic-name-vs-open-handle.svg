reen" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="603" fill="white" stroke="none" stroke-width="1.6"/><text x="312" y="68" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">名称指向切换</text><text x="984" y="68" fill="#202a37" font-size="38" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">打开引用各自保留</text><polygon points="109,201 310,201 355,127 154,127" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="232" y="175.9" fill="#655184" font-size="34" font-family="Segoe UI, Noto Sans, sans-serif" text-anchor="middle">result</text><polygon points="111,434 293,434 338,359 156,359" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="224.5" y="407.7" fill="#196f77" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">旧对象</text><polygon points="472,434 655,434 700,359 517,359" stroke="#a84b3b" fill="url(#wash-coral)" stroke-width="1.8" stroke-linejoin="round"/><text x="586" y="407.7" fill="#a84b3b" font-size="32" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">新对象</text><line x1="226" y1="222" x2="226" y2="336" stroke="#657682" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="214" y1="275" x2="238" y2="297" stroke="#a84b3b" stroke-w
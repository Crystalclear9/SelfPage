<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="960.137" viewBox="0 0 1440 960.137" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">直接退出、普通包装和委托包装的关闭链对照</title><rect width="1440" height="960.137" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">直接退出、普通包装和委托包装的关闭链对照</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="818.137" viewBox="16 56 1168 711" role="img" aria-labelledby="title desc" x="48" y="106" overflow="hidden"><title id="title">提前退出后，谁负责沿迭代链关闭资源？</title><desc id="desc">同一资源生成器在break、普通for包装关闭和yield from委托关闭三条路径中的状态区别。普通包装关闭不关闭保留引用的上游，yield from在已开始委托时转发关闭。 提前退出后，谁负责沿迭代链关闭资源？ 未启动就 close()：函数体未进入，本例既不 acquire，也不 release。</desc><rect width="1168.0" height="711.0" fill="white" x="16.0" y="56.0"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="102" font-size="26" fill="#617f97" text-anchor="start">先消费到 yield，再提前退出；显式保留内外层引用，排除回收时机干扰。</text><text x="45" y="164" font-size="26" fill="#1f3449" text-anchor="start">消费者动作</text><text x="455" y="164" font-size="26" fill="#1f3449" text-anchor="start">外层包装</text><text x="940" y="164" font-size="26" fill="#1f3449" text-anchor="start">上游生成器</text><text x="45" y="239" font-size="28" fill="#c57439" text-anchor="start">直接 break</text><line x1="245" y1="235" x2="780" y2="235" stroke="#c57439" stroke-width="3"/><polyline points="769.4690092573155,240.75310646325045 780,235 769.4690092573155,229.24689353674955" fill="none" stroke="#c57439" stroke-width="3"/><text x="490" y="216" font-size="26" fill="#c57439" text-anchor="middle">循环退出不调用 close()</text><rect x="815" y="185" width="330" height="108" fill="#c57439" opacity="0.1" rx="3"/><text x="980.0" y="221" font-size="26" fill="#c57439" text-anchor="middle">暂停在 yield</text><text x="980.0" y="259" font-size="26" fill="#c57439" text-anchor="middle">已 acquire · 未 release</text><line x1="40" y1="335" x2="1160" y2="335" stroke="#dce5ed" stroke-width="2"/><text x="45" y="414" font-size="27" fill="#c57439" text-anchor="start">closing(外层)</text><line x1="255" y1="412" x2="365" y2="412" stroke="#c57439" stroke-width="3"/><polyline points="354.4690092573155,417.75310646325045 365,412 354.4690092573155,406.24689353674955" fill="none" stroke="#c57439" stroke-width="3"/><rect x="390" y="362" width="330" height="108" fill="#c57439" opacity="0.1" rx="3"/><text x="555.0" y="398" font-size="26" fill="#c57439" text-anchor="middle">for / yield 包装</text><text x="555.0" y="436" font-size="26" fill="#c57439" text-anchor="middle">关闭外层</text><line x1="735" y1="412" x2="795" y2="412" stroke="#c57439" stroke-width="3"/><line x1="767" y1="392" x2="767" y2="432" stroke="#c57439" stroke-width="6"/><rect x="815" y="362" width="330" height="108" fill="#c57439" opacity="0.1" rx="3"/><text x="980.0" y="398" font-size="26" fill="#c57439" text-anchor="middle">仍暂停在 yield</text><text x="980.0" y="436" font-size="26" fill="#c57439" text-anchor="middle">上游由调用者关闭</text><text x="390" y="512" font-size="26" fill="#c57439" text-anchor="start">普通 for 只转发值，不自动转发关闭。</text><line x1="40" y1="557" x2="1160" y2="557" stroke="#dce5ed" stroke-width="2"/><text x="45" y="640" font-size="27" fill="#2472b1" text-anchor="start">closing(外层)</text><line x1="255" y1="638" x2="365" y2="638" stroke="#2472b1" stroke-width="3"/><polyline points="354.4690092573155,643.7531064632504 365,638 354.4690092573155,632.2468935367496" fill="none" stroke="#2472b1" stroke-width="3"/><rect x="390" y="588" width="330" height="108" fill="#2472b1" opacity="0.1" rx="3"/><text x="555.0" y="624" font-size="26" fill="#2472b1" text-anchor="middle">yield from 委托</text><text x="555.0" y="662" font-size="26" fill="#2472b1" text-anchor="middle">关闭外层</text><line x1="735" y1="638" x2="795" y2="638" stroke="#2472b1" stroke-width="3"/><polyline points="784.4690092573155,643.7531064632504 795,638 784.4690092573155,632.2468935367496" fill="none" stroke="#2472b1" stroke-width="3"/><rect x="815" y="588" width="330" height="108" fill="#2472b1" opacity="0.1" rx="3"/><text x="980.0" y="624" font-size="26" fill="#2472b1" text-anchor="middle">调用上游 close()</text><text x="980.0" y="662" font-size="26" fill="#2472b1" text-anchor="middle">finally 执行 release</text><text x="390" y="739" font-size="26" fill="#2472b1" text-anchor="start">关闭可沿委托链传播；共享上游时先约定所有权。</text></g></svg></svg>

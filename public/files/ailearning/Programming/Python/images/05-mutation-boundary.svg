<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="837.2568" viewBox="0 0 1440 837.2568" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">两条数轴用实心和空心端点表示非负与严格正数规则，零用例区分变异而普通正数不能</title><rect width="1440" height="837.2568" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="33" font-weight="700" fill="#142b45">两条数轴用实心和空心端点表示非负与严格正数规则，零用例区分变异而普通正数不能</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="695.2568" viewBox="20 70 1372.5 710" x="48" y="106" overflow="hidden"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1372.5" height="710.0" fill="white" x="20.0" y="70.0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="50" y="125" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">规格：接受所有非负数。普通正数通过，仍不足以验证边界。</text><text xml:space="preserve" x="50" y="240" font-size="32" fill="#2181bf" text-anchor="start" font-weight="700">正确：x ≥ 0</text><line x1="230.0" y1="310" x2="1264.0" y2="310" stroke="#c0cad8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="560" y1="310" x2="1220" y2="310" stroke="#2181bf" stroke-width="9" stroke-dasharray=""/><line x1="340" y1="298" x2="340" y2="322" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="340" y="365" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">-1</text><line x1="560" y1="298" x2="560" y2="322" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="560" y="365" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><line x1="780" y1="298" x2="780" y2="322" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="780" y="365" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><line x1="1000" y1="298" x2="1000" y2="322" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1000" y="365" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><line x1="1220" y1="298" x2="1220" y2="322" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1220" y="365" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">3</text><circle cx="560" cy="310" r="16" fill="#2181bf" stroke="#2181bf" stroke-width="4"/><circle cx="1000" cy="310" r="12" fill="#2181bf" stroke="none" stroke-width="2"/><text xml:space="preserve" x="50" y="520" font-size="32" fill="#d26c27" text-anchor="start" font-weight="700">变异：x &gt; 0</text><line x1="230.0" y1="590" x2="1264.0" y2="590" stroke="#c0cad8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="560" y1="590" x2="1220" y2="590" stroke="#d26c27" stroke-width="9" stroke-dasharray=""/><line x1="340" y1="578" x2="340" y2="602" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="340" y="645" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">-1</text><line x1="560" y1="578" x2="560" y2="602" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="560" y="645" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><line x1="780" y1="578" x2="780" y2="602" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="780" y="645" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><line x1="1000" y1="578" x2="1000" y2="602" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1000" y="645" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">2</text><line x1="1220" y1="578" x2="1220" y2="602" stroke="#8b9ab1" stroke-width="2" stroke-dasharray=""/><text xml:space="preserve" x="1220" y="645" font-size="28" fill="#1f3348" text-anchor="middle" font-weight="400">3</text><circle cx="560" cy="590" r="16" fill="white" stroke="#d26c27" stroke-width="4"/><circle cx="1000" cy="590" r="12" fill="#d26c27" stroke="none" stroke-width="2"/><path d="M 1000,245 V 190 H 1360 V 515 H 1000" stroke="#5b7d92" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="375" font-size="32" fill="#1f3348" text-anchor="middle" font-weight="400">x = 2</text><text xml:space="preserve" x="1150" y="425" font-size="30" fill="#1f3348" text-anchor="middle" font-weight="400">两版都接受</text><line x1="560" y1="360" x2="560" y2="535" stroke="#a0adc1" stroke-width="2" stroke-dasharray="6 6"/><text xml:space="preserve" x="50" y="745" font-size="32" fill="#1f3348" text-anchor="start" font-weight="400">x = 0：规格期望接受，严格大于的变异却拒绝。</text></g><desc> 边界用例发现哪一种错误：只有零能区分 ≥ 与 &gt; 实心端点包含边界；空心端点不包含。用例必须检查结果，不只执行代码。</desc></svg></svg>

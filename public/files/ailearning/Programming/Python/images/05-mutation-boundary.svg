 515 H 1000" stroke="#5b7484" stroke-width="3" fill="none" stroke-dasharray="" marker-end="url(#arrow)"/><text xml:space="preserve" x="1150" y="375" font-size="32" fill="#193a4e" text-anchor="middle" font-weight="400">x = 2</text><text xml:space="preserve" x="1150" y="425" font-size="30" fill="#193a4e" text-anchor="middle" font-weight="400">两版都接受</text><line x1="560" y1="360" x2="560" y2="535" stroke="#9eb0bc" stroke-width="2" stroke-dasharray="6 6"/><text xml:space="preserve" x="50" y="745" font-size="32" fill="#193a4e" text-anchor="start" font-weight="400">x = 0：规格期望接受，严格大于的变异却拒绝。</text><text xml:space="preserve" x="50" y="815" font-size="29" fill="#557080" text-anchor="start" font-weight="400">实心端点包含边界；空心端点不包含。用例必须检查结果，不只执行代码。</text></g></svg>
<title id="title">两条数轴用实心和空心端点表示非负与严格正数规则，零用例区分变异而普通正数不能</title>
<desc id="description">非负规则在零用实心点，严格正数规则在零用空心点。正数二都通过，零用例区分两种实现。</desc>

" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/><stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/></linearGradient><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/></marker><linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/><stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/></linearGradient></defs><rect x="0" y="0" width="1320" height="583" fill="white" stroke="none" stroke-width="1.6"/><polygon points="85,212 333,212 378,136 130,136" stroke="#196f77" fill="url(#wash-teal)" stroke-width="1.8" stroke-linejoin="round"/><text x="231.5" y="186.25" fill="#196f77" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">调用方甲</text><line x1="395" y1="174" x2="645" y2="253" stroke="#196f77" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="484" y="153" fill="#196f77" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">导入</text><polygon points="85,426 333,426 378,350 130,350" stroke="#655184" fill="url(#wash-violet)" stroke-width="1.8" stroke-linejoin="round"/><text x="231.5" y="400.25" fill="#655184" font-size="35" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">调用方乙</text><line x1="395" y1="388" x2="645" y2="303" stroke="#655184" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="484" y="413" fill="#655184" font-size="28" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" text-anchor="middle">导入</text><polygon points="671,335 905,335 950,229 716,229" stroke="#202a37" fill="url(#wash-ink)" stroke-width="1.8" stroke-linejoin="round"/><text x="810.5" y="292.85" fill="#202a37" font-size="31" font-family="
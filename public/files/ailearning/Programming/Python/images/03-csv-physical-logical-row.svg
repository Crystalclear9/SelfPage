<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="664" viewBox="0 0 1360 664" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">引号状态决定何时交付 CSV 记录</title>
  <desc id="plate-desc">三个物理行形成两条逻辑记录。第二行在引号内，换行进入字段；第三行闭合引号，数据记录才完整。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#202a37"/>
    </marker>
    <linearGradient id="wash-ink" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#afb9c7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#afb9c7" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#196f77"/>
    </marker>
    <linearGradient id="wash-teal" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8dccd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8dccd2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#a84b3b"/>
    </marker>
    <linearGradient id="wash-coral" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#efaa9d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#efaa9d" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#655184"/>
    </marker>
    <linearGradient id="wash-violet" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b4a6d2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#b4a6d2" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#3c7459"/>
    </marker>
    <linearGradient id="wash-green" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a4cfb3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a4cfb3" stop-opacity=".58"/>
    </linearGradient>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#657682"/>
    </marker>
    <linearGradient id="wash-gray" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#becbd2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#becbd2" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1360" height="664" fill="white" stroke="none" stroke-width="1.6"/>
  <text x="271" y="65" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">物理行</text>
  <text x="683" y="65" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">读到行末时的状态</text>
  <text x="1120" y="65" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="36" fill="#202a37" text-anchor="middle">逻辑记录</text>
  <text x="110" y="168" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#196f77" text-anchor="middle">1</text>
  <polygon points="135,191.5 361,191.5 393,122.5 167,122.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="264" y="166.24" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="28" fill="#196f77" text-anchor="middle">id,note</text>
  <line x1="410" y1="157" x2="529" y2="157" stroke="#196f77" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="547.5,191.5 782.5,191.5 814.5,122.5 579.5,122.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="681" y="166.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">引号外</text>
  <line x1="830" y1="157" x2="975" y2="157" stroke="#196f77" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <polygon points="999.5,191.5 1208.5,191.5 1240.5,122.5 1031.5,122.5" stroke="#196f77" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-teal)"/>
  <text x="1120" y="166.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#196f77" text-anchor="middle">表头</text>
  <text x="110" y="305" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#655184" text-anchor="middle">2</text>
  <polygon points="135,328.5 361,328.5 393,259.5 167,259.5" stroke="#655184" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-violet)"/>
  <text x="264" y="303.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#655184" text-anchor="middle">1,"第一段</text>
  <line x1="410" y1="294" x2="529" y2="294" stroke="#655184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <polygon points="547.5,328.5 782.5,328.5 814.5,259.5 579.5,259.5" stroke="#655184" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-violet)"/>
  <text x="681" y="303.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#655184" text-anchor="middle">引号内</text>
  <line x1="830" y1="294" x2="975" y2="294" stroke="#655184" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="6 5"/>
  <polygon points="999.5,328.5 1208.5,328.5 1240.5,259.5 1031.5,259.5" stroke="#655184" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-violet)"/>
  <text x="1120" y="303.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#655184" text-anchor="middle">暂未交付</text>
  <polyline points="692,339 692,378" stroke="#655184" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-violet)"/>
  <text x="110" y="442" font-family="Cambria Math, DejaVu Sans, Microsoft YaHei, sans-serif" font-size="29" fill="#a84b3b" text-anchor="middle">3</text>
  <polygon points="135,465.5 361,465.5 393,396.5 167,396.5" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="264" y="440.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#a84b3b" text-anchor="middle">第二段"</text>
  <line x1="410" y1="431" x2="529" y2="431" stroke="#a84b3b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <polygon points="547.5,465.5 782.5,465.5 814.5,396.5 579.5,396.5" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="681" y="440.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#a84b3b" text-anchor="middle">回到引号外</text>
  <line x1="830" y1="431" x2="975" y2="431" stroke="#a84b3b" stroke-width="1.85" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <polygon points="999.5,465.5 1208.5,465.5 1240.5,396.5 1031.5,396.5" stroke="#a84b3b" stroke-width="1.8" stroke-linejoin="round" fill="url(#wash-coral)"/>
  <text x="1120" y="440.24" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="28" fill="#a84b3b" text-anchor="middle">数据记录</text>
  <text x="680" y="604" font-family="SimSun, Noto Serif CJK SC, Microsoft YaHei, serif" font-size="29" fill="#202a37" text-anchor="middle">第二行的换行保留在 note 字段内。</text>
</svg>

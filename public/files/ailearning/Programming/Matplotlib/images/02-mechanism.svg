<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1142.560" height="559.849" viewBox="16.685 67.568 1142.560 559.849" role="img"><title id="figure-title">DPI 翻倍：宽高像素翻倍，像素总数变四倍</title><desc id="figure-desc">两次导出的物理尺寸都设为 6×4 英寸。100 DPI 对应 600×400，即二十四万像素；200 DPI 对应 1200×800，即九十六万像素。矩形按像素边长用相同比例绘制，展示的是像素预算，不表示打印时的英寸尺寸变大。 DPI 翻倍：宽高像素翻倍，像素总数变四倍</desc><rect x="16.685" y="67.568" width="1142.56" height="559.849" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="115" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">相同物理尺寸：6 × 4 英寸</text><rect x="55" y="225" width="300" height="200" rx="0" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.5" /><text x="205" y="307" font-size="30" fill="#2865a0" text-anchor="middle" font-weight="400">100 DPI</text><text x="205" y="355" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">600 × 400 px</text><rect x="535" y="145" width="600" height="400" rx="0" fill="#fff0e3" stroke="#c87536" stroke-width="1.5" /><text x="835" y="307" font-size="30" fill="#c87536" text-anchor="middle" font-weight="400">200 DPI</text><text x="835" y="355" font-size="28" fill="#c87536" text-anchor="middle" font-weight="400">1200 × 800 px</text><text x="55" y="490" font-size="30" fill="#2865a0" text-anchor="start" font-weight="400">24 万像素</text><text x="700" y="600" font-size="30" fill="#c87536" text-anchor="start" font-weight="600">96 万像素 = 4 倍</text></g></svg>

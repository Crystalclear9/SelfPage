<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>同一组损失观测，按轮次与按时间会得到不同排名</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="52" y="64" font-size="36" fill="#19333c" text-anchor="start">同一组损失观测，按轮次与按时间会得到不同排名</text>
<text x="70" y="135" font-size="29" fill="#19333c" text-anchor="start">同轮次：B 的损失更低</text>

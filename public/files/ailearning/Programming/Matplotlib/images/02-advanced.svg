<text x="717" y="425.0" font-size="24" fill="#70838c" text-anchor="end">0.5</text>
<line x1="735" y1="240" x2="1175" y2="240" stroke="#dae4e9" stroke-width="2" stroke-dasharray=""/>
<text x="717" y="250" font-size="24" fill="#70838c" text-anchor="end">1</text>

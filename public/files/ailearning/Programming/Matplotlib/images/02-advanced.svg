<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">相同轮数不代表相同计算预算</title><desc id="desc">假设两个训练方案每轮分别耗时 2 和 5 分钟，那么同为四轮时，计算时间已相差 2.5 倍。若研究问题是固定等待时间内能得到什么模型，按轮数对齐就不能替代按墙钟时间对齐。 这是恒定轮时的教学模型，现实中验证、编译、数据读取和预热也占预算。比较前必须声明时间边界；图没有据此断言某个方案精度更高。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">相同轮数不代表相同计算预算</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">固定每轮耗时；比较速度还须控制数据量与目标质量。</text><path d="M130,545 L1090,545" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M130,455 L1090,455" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="462" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">5</text><path d="M130,365 L1090,365" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="372" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">10</text><path d="M130,275 L1090,275" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="282" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">15</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">20</text><text x="157.17" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="383.585" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="610" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><text x="836.415" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><text x="1062.83" y="577" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M130,545 L1090,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">累计墙钟时间 / 分钟</text><text x="1090" y="615" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">训练轮数</text><polyline points="157.17,545.00 383.58,509.00 610.00,473.00 836.42,437.00 1062.83,401.00" fill="none" stroke="#268d8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="545.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="383.58" cy="509.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610.00" cy="473.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="836.42" cy="437.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="401.00" r="6" fill="#268d8c" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#268d8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">方案 A：每轮 2 分钟</text><polyline points="157.17,545.00 383.58,455.00 610.00,365.00 836.42,275.00 1062.83,185.00" fill="none" stroke="#d67c47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="545.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="383.58" cy="455.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610.00" cy="365.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="836.42" cy="275.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="185.00" r="6" fill="#d67c47" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M550,653 L585,653" stroke="#d67c47" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="598" y="660" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">方案 B：每轮 5 分钟</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>辛普森反转：把各自人群改成同一目标人群再比较</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="52" y="64" font-size="36" fill="#19333c" text-anchor="start">辛普森反转：把各自人群改成同一目标人群再比较</text>
<text x="60" y="135" font-size="29" fill="#19333c" text-anchor="start">分组正确率</text>
<text x="420" y="135" font-size="29" fill="#206f91" text-anchor="start">A</text>
<text x="650" y="135" font-size="29" fill="#ce713e" text-anchor="start">B</text>
<text x="60" y="205" font-size="29" fill="#19333c" text-anchor="start">容易</text>
<text x="420" y="205" font-size="29" fill="#206f91" text-anchor="start">0.9</text>
<text x="650" y="205" font-size="29" fill="#ce713e" text-anchor="start">0.8</text>
<text x="900" y="205" font-size="29" fill="#206f91" text-anchor="start">A 高 0.10</text>
<text x="60" y="275" font-size="29" fill="#19333c" text-anchor="start">困难</text>
<text x="420" y="275" font-size="29" fill="#206f91" text-anchor="start">0.4</text>
<text x="650" y="275" font-size="29" fill="#ce713e" text-anchor="start">0.3</text>
<text x="900" y="275" font-size="29" fill="#206f91" text-anchor="start">A 高 0.10</text>
<line x1="60" y1="320" x2="1220" y2="320" stroke="#dae4e9" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="390" font-size="29" fill="#19333c" text-anchor="start">各自人群</text>
<text x="60" y="436" font-size="25" fill="#70838c" text-anchor="start">易组权重</text>
<text x="240" y="436" font-size="25" fill="#70838c" text-anchor="start">A 10% · B 90%</text>
<rect x="560" y="370" width="261.0" height="34" rx="3" fill="#edf5fa" stroke="#206f91"/>
<text x="831.0" y="397" font-size="28" fill="#206f91" text-anchor="start">45%</text>
<rect x="560" y="435" width="435.0" height="34" rx="3" fill="#fff2e8" stroke="#ce713e"/>
<text x="1005.0" y="462" font-size="28" fill="#ce713e" text-anchor="start">75%</text>
<text x="60" y="570" font-size="29" fill="#19333c" text-anchor="start">共同人群</text>
<text x="60" y="616" font-size="25" fill="#70838c" text-anchor="start">易组权重</text>
<text x="240" y="616" font-size="25" fill="#70838c" text-anchor="start">A 50% · B 50%</text>
<rect x="560" y="550" width="377.0" height="34" rx="3" fill="#edf5fa" stroke="#206f91"/>
<text x="947.0" y="577" font-size="28" fill="#206f91" text-anchor="start">65%</text>
<rect x="560" y="615" width="319.0" height="34" rx="3" fill="#fff2e8" stroke="#ce713e"/>
<text x="889.0" y="642" font-size="28" fill="#ce713e" text-anchor="start">55%</text>
<text x="60" y="715" font-size="27" fill="#206f91" text-anchor="start">共同易组权重 q：A − B = q × 0.10 + (1 − q) × 0.10 = 0.10</text>
</g></svg>

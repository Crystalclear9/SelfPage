<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="961" viewBox="0 0 1440 961" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">分组优势与总体优势可以方向相反</title><rect width="1440" height="961" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">分组优势与总体优势可以方向相反</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="819" viewBox="0 0 1280 780" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-edf5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5fa"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>辛普森反转：把各自人群改成同一目标人群再比较</title><rect width="1280" height="780" fill="white"/><g font-family="Microsoft YaHei, sans-serif">
<text x="52" y="64" font-size="36" fill="#1a2a3b" text-anchor="start">辛普森反转：把各自人群改成同一目标人群再比较</text>
<text x="60" y="135" font-size="29" fill="#1a2a3b" text-anchor="start">分组正确率</text>
<text x="420" y="135" font-size="29" fill="#1c77a2" text-anchor="start">A</text>
<text x="650" y="135" font-size="29" fill="#ca7542" text-anchor="start">B</text>
<text x="60" y="205" font-size="29" fill="#1a2a3b" text-anchor="start">容易</text>
<text x="420" y="205" font-size="29" fill="#1c77a2" text-anchor="start">0.9</text>
<text x="650" y="205" font-size="29" fill="#ca7542" text-anchor="start">0.8</text>
<text x="900" y="205" font-size="29" fill="#1c77a2" text-anchor="start">A 高 0.10</text>
<text x="60" y="275" font-size="29" fill="#1a2a3b" text-anchor="start">困难</text>
<text x="420" y="275" font-size="29" fill="#1c77a2" text-anchor="start">0.4</text>
<text x="650" y="275" font-size="29" fill="#ca7542" text-anchor="start">0.3</text>
<text x="900" y="275" font-size="29" fill="#1c77a2" text-anchor="start">A 高 0.10</text>
<line x1="60" y1="320" x2="1220" y2="320" stroke="#dee4ec" stroke-width="2" stroke-dasharray=""/>
<text x="60" y="390" font-size="29" fill="#1a2a3b" text-anchor="start">各自人群</text>
<text x="60" y="436" font-size="25" fill="#718b98" text-anchor="start">易组权重</text>
<text x="240" y="436" font-size="25" fill="#718b98" text-anchor="start">A 10% · B 90%</text>
<rect x="560" y="370" width="261.0" height="34" rx="3" fill="url(#book-wash-edf5fa)" stroke="#1c77a2"/>
<text x="831.0" y="397" font-size="28" fill="#1c77a2" text-anchor="start">45%</text>
<rect x="560" y="435" width="435.0" height="34" rx="3" fill="#fff2e8" stroke="#ca7542"/>
<text x="1005.0" y="462" font-size="28" fill="#ca7542" text-anchor="start">75%</text>
<text x="60" y="570" font-size="29" fill="#1a2a3b" text-anchor="start">共同人群</text>
<text x="60" y="616" font-size="25" fill="#718b98" text-anchor="start">易组权重</text>
<text x="240" y="616" font-size="25" fill="#718b98" text-anchor="start">A 50% · B 50%</text>
<rect x="560" y="550" width="377.0" height="34" rx="3" fill="url(#book-wash-edf5fa)" stroke="#1c77a2"/>
<text x="947.0" y="577" font-size="28" fill="#1c77a2" text-anchor="start">65%</text>
<rect x="560" y="615" width="319.0" height="34" rx="3" fill="#fff2e8" stroke="#ca7542"/>
<text x="889.0" y="642" font-size="28" fill="#ca7542" text-anchor="start">55%</text>
<text x="60" y="715" font-size="27" fill="#1c77a2" text-anchor="start">共同易组权重 q：A − B = q × 0.10 + (1 − q) × 0.10 = 0.10</text>
</g></svg></svg>

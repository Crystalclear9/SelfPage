<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="801.20" viewBox="17.64 14.06 1112.73 742.93" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">分组优势与总体优势可以方向相反</title><desc id="desc">A 在易组和难组的正确率分别为 0.9、0.4，B 为 0.8、0.3，但 A 的两组人数是 10、90，B 则是 90、10。加权后总体正确率分别为 0.45 与 0.75，因此逐组比较方向与总体方向相反。 总体量使用的是各方案自己的群体权重，不能仅凭总体柱宣称方法有因果优势。若要固定同一目标人群比较，应使用共同的分组权重，并说明样本选择机制。 各组内 A 更好，总体反转来自两模型的组别权重不同。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#213447" text-anchor="start" font-weight="700">分组优势与总体优势可以方向相反</text><path d="M140,540 L1100,540" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="547" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><path d="M140,462.5 L1100,462.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="469.5" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.25</text><path d="M140,385 L1100,385" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="392" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.5</text><path d="M140,307.5 L1100,307.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="314.5" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0.75</text><path d="M140,230 L1100,230" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="237" font-size="24" fill="#627689" text-anchor="end" font-weight="400">1</text><text x="80" y="190" font-size="24" fill="#213447" text-anchor="start" font-weight="400">正确率</text><text x="180" y="590" font-size="24" fill="#213447" text-anchor="start" font-weight="400">易组</text><rect x="230.0" y="261.0" width="91" height="279.0" fill="#2865a0" stroke="#2865a0" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="275.5" y="247" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.9</text><rect x="330.0" y="292.0" width="91" height="248.0" fill="#c87536" stroke="#c87536" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="375.5" y="278" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.8</text><text x="480" y="590" font-size="24" fill="#213447" text-anchor="start" font-weight="400">难组</text><rect x="530.0" y="416.0" width="91" height="124.0" fill="#2865a0" stroke="#2865a0" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="575.5" y="402" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.4</text><rect x="630.0" y="447.0" width="91" height="93.0" fill="#c87536" stroke="#c87536" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="675.5" y="433" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.3</text><text x="780" y="590" font-size="24" fill="#213447" text-anchor="start" font-weight="400">总体</text><rect x="830.0" y="400.5" width="91" height="139.5" fill="#2865a0" stroke="#2865a0" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="875.5" y="386.5" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.45</text><rect x="930.0" y="307.5" width="91" height="232.5" fill="#c87536" stroke="#c87536" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="975.5" y="293.5" font-size="24" fill="#213447" text-anchor="middle" font-weight="400">0.75</text><rect x="180" y="635" width="23" height="13" fill="#2865a0" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="651" font-size="24" fill="#213447" text-anchor="start" font-weight="400">A</text><rect x="570" y="635" width="23" height="13" fill="#c87536" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="605" y="651" font-size="24" fill="#213447" text-anchor="start" font-weight="400">B</text><text x="140" y="690" font-size="24" fill="#627689" text-anchor="start" font-weight="400">A：10 人 / 90 人</text><text x="140" y="719" font-size="24" fill="#627689" text-anchor="start" font-weight="400">B：90 人 / 10 人</text></g></svg>

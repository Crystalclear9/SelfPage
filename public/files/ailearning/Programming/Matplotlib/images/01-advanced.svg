<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">箱线图：围栏不是须端点</title><desc id="desc">对样本 0、1、2、3、4、5、6、7、20，按线性插值分位数得到 Q1=2、中位数=4、Q3=6。IQR 为 4，上围栏为 12；图中上须却停在实际观测 7，20 作为离群点单独显示。 围栏用于判别哪些观测可进入须，通常不是直接画须的位置。不同软件的分位数约定可能改变边界，本例明确采用 NumPy 默认线性分位数；离群标记也不等于数据错误。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">箱线图：围栏不是须端点</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">上围栏 12 是判别阈值；上须止于实际观测 7。</text><path d="M130,540 L1070,540" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,535 L130,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="130" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><path d="M222,535 L222,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="222" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">2</text><path d="M314,535 L314,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="314" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">4</text><path d="M406,535 L406,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="406" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">6</text><path d="M498,535 L498,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="498" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">8</text><path d="M682,535 L682,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="682" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">12</text><path d="M1050,535 L1050,548" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1050" y="582" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">20</text><path d="M130,360 L452,360" stroke="#507db3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,325 L130,395" stroke="#507db3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M452,325 L452,395" stroke="#507db3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="222" y="290" width="184" height="140" fill="#cee9e2" stroke="#268d8c" rx="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M314,290 L314,430" stroke="#268d8c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M682,220 L682,500" stroke="#d67c47" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="682" y="205" font-size="23" fill="#d67c47" text-anchor="middle" font-weight="400">上围栏 12</text><circle cx="1050" cy="360" r="11" fill="#d67c47" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1050" y="300" font-size="23" fill="#d67c47" text-anchor="end" font-weight="400">离群观测 20</text><text x="452" y="455" font-size="22" fill="#507db3" text-anchor="middle" font-weight="400">须到 7</text><text x="314" y="470" font-size="22" fill="#268d8c" text-anchor="middle" font-weight="400">中位数 4</text><text x="140" y="655" font-size="24" fill="#20384f" text-anchor="start" font-weight="400">箱体：[Q1,Q3]=[2,6]；上须取围栏以内最远的实际观测。</text></g></svg>

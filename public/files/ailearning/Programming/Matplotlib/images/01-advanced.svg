<text x="167" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0</text>
<circle cx="211" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="211" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">1</text>
<circle cx="255" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="255" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">2</text>
<circle cx="299" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="299" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">3</text>
<circle cx="343" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="343" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">4</text>
<circle cx="387" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="387" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">5</text>
<circle cx="431" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="431" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">6</text>
<circle cx="475" cy="181" r="6.8" fill="#166d75" stroke="#ffffff" stroke-width="1.5"/>
<text x="475" y="218" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">7</text>
<circle cx="1047" cy="181" r="6.8" fill="#ffffff" stroke="#a74d3a" stroke-width="3"/>
<text x="1047" y="218" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">20</text>
<text x="74" y="286" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">箱线图</text>
<rect x="255" y="322" width="176" height="66" fill="#ecf6f6" opacity="1"/>
<path d="M255 322 L431 322 L431 388 L255 388 Z" fill="none" stroke="#166d75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M343 322 L343 388" fill="none" stroke="#166d75" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M167 355 L255 355" fill="none" stroke="#166d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

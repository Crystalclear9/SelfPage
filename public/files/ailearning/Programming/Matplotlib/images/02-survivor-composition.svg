<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930"><rect width="1280" height="930" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334b"><text x="40" y="58" font-size="36" fill="#17334b">没有一条运行改善，“可用运行均值”却在下降</text><text x="40" y="110" font-size="27" fill="#52677a">三个恒定损失为 0.2、0.6、1.0；只改变哪些运行还有后续记录</text><polyline points="150,518.0 1040,518.0" stroke="#e2e8ed" stroke-width="1.5" fill="none" /><text x="85" y="528.0" font-size="25" fill="#52677a">0.2</text><polyline points="150,446.0 1040,446.0" stroke="#e2e8ed" stroke-width="1.5" fill="none" /><text x="85" y="456.0" font-size="25" fill="#52677a">0.4</text><polyline points="150,374.0 1040,374.0" stroke="#e2e8ed" stroke-width="1.5" fill="none" /><text x="85" y="384.0" font-size="25" fill="#52677a">0.6</text><polyline points="150,302.0 1040,302.0" stroke="#e2e8ed" stroke-width="1.5" fill="none" /><text x="85" y="312.0" font-size="25" fill="#52677a">0.8</text><polyline points="150,230.0 1040,230.0" stroke="#e2e8ed" stroke-width="1.5" fill="none" /><text x="85" y="240.0" font-size="25" fill="#52677a">1.0</text><polyline points="150,190 150,590 1050,590" stroke="#748895" stroke-width="2" fill="none" /><polyline points="150,518.0 1020,518.0" stroke="#168578" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="518.0" r="6" fill="#168578"/><circle cx="295" cy="518.0" r="6" fill="#168578"/><circle cx="440" cy="518.0" r="6" fill="#168578"/><circle cx="585" cy="518.0" r="6" fill="#168578"/><circle cx="730" cy="518.0" r="6" fill="#168578"/><circle cx="875" cy="518.0" r="6" fill="#168578"/><circle cx="1020" cy="518.0" r="6" fill="#168578"/><text x="1040" y="528.0" font-size="26" fill="#168578">持续运行</text><polyline points="150,374.0 730,374.0" stroke="#d5752e" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="374.0" r="6" fill="#d5752e"/><circle cx="295" cy="374.0" r="6" fill="#d5752e"/><circle cx="440" cy="374.0" r="6" fill
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000.4794" viewBox="0 0 1440 1000.4794" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">三条单次运行均不改善，差运行依次停止后可用均值由零点六降到零点四再降到零点二</title><rect width="1440" height="1000.4794" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="33" font-weight="700" fill="#142b45">三条单次运行均不改善，差运行依次停止后可用均值由零点六降到零点四再降到零点二</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="858.4794" viewBox="13.867 61.858 1252.267 799.885" x="48" y="106" overflow="hidden"><rect width="1252.267" height="799.885" fill="white" x="13.867" y="61.858"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#173c58"><text x="40" y="110" font-size="27" fill="#527087">三个恒定损失为 0.2、0.6、1.0；只改变哪些运行还有后续记录</text><polyline points="150,518.0 1040,518.0" stroke="#e6eaf0" stroke-width="1.5" fill="none"/><text x="85" y="528.0" font-size="25" fill="#527087">0.2</text><polyline points="150,446.0 1040,446.0" stroke="#e6eaf0" stroke-width="1.5" fill="none"/><text x="85" y="456.0" font-size="25" fill="#527087">0.4</text><polyline points="150,374.0 1040,374.0" stroke="#e6eaf0" stroke-width="1.5" fill="none"/><text x="85" y="384.0" font-size="25" fill="#527087">0.6</text><polyline points="150,302.0 1040,302.0" stroke="#e6eaf0" stroke-width="1.5" fill="none"/><text x="85" y="312.0" font-size="25" fill="#527087">0.8</text><polyline points="150,230.0 1040,230.0" stroke="#e6eaf0" stroke-width="1.5" fill="none"/><text x="85" y="240.0" font-size="25" fill="#527087">1.0</text><polyline points="150,190 150,590 1050,590" stroke="#7690a0" stroke-width="2" fill="none"/><polyline points="150,518.0 1020,518.0" stroke="#148f94" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="518.0" r="6" fill="#148f94"/><circle cx="295" cy="518.0" r="6" fill="#148f94"/><circle cx="440" cy="518.0" r="6" fill="#148f94"/><circle cx="585" cy="518.0" r="6" fill="#148f94"/><circle cx="730" cy="518.0" r="6" fill="#148f94"/><circle cx="875" cy="518.0" r="6" fill="#148f94"/><circle cx="1020" cy="518.0" r="6" fill="#148f94"/><text x="1040" y="528.0" font-size="26" fill="#148f94">持续运行</text><polyline points="150,374.0 730,374.0" stroke="#d07533" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="374.0" r="6" fill="#d07533"/><circle cx="295" cy="374.0" r="6" fill="#d07533"/><circle cx="440" cy="374.0" r="6" fill="#d07533"/><circle cx="585" cy="374.0" r="6" fill="#d07533"/><circle cx="730" cy="374.0" r="6" fill="#d07533"/><text x="750" y="384.0" font-size="26" fill="#d07533">此后停止</text><polyline points="150,230.0 440,230.0" stroke="#7e8898" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="150" cy="230.0" r="6" fill="#7e8898"/><circle cx="295" cy="230.0" r="6" fill="#7e8898"/><circle cx="440" cy="230.0" r="6" fill="#7e8898"/><text x="460" y="240.0" font-size="26" fill="#7e8898">此后停止</text><polyline points="150,374.0 585,374.0 585,446.0 875,446.0 875,518.0 1020,518.0" stroke="#1f81c7" stroke-width="6" fill="none"/><text x="710" y="480" font-size="29" fill="#1f81c7">可用运行均值</text><text x="142" y="635" font-size="25" fill="#173c58">0</text><text x="287" y="635" font-size="25" fill="#173c58">1</text><text x="432" y="635" font-size="25" fill="#173c58">2</text><text x="577" y="635" font-size="25" fill="#173c58">3</text><text x="722" y="635" font-size="25" fill="#173c58">4</text><text x="867" y="635" font-size="25" fill="#173c58">5</text><text x="1012" y="635" font-size="25" fill="#173c58">6</text><text x="1070" y="635" font-size="28" fill="#173c58">预算</text><text x="70" y="719" font-size="29" fill="#173c58">可用运行数</text><text x="143" y="790" font-size="30" fill="#1f81c7">3</text><text x="288" y="790" font-size="30" fill="#1f81c7">3</text><text x="433" y="790" font-size="30" fill="#1f81c7">3</text><text x="578" y="790" font-size="30" fill="#1f81c7">2</text><text x="723" y="790" font-size="30" fill="#1f81c7">2</text><text x="868" y="790" font-size="30" fill="#1f81c7">1</text><text x="1013" y="790" font-size="30" fill="#1f81c7">1</text><path d="M40 835 H1240" stroke="#dce2eb" stroke-width="2"/></g><desc> 没有一条运行改善，“可用运行均值”却在下降 均值变化来自成员退出；停止原因、失败比例与条件性能需要一起解释。</desc></svg></svg>

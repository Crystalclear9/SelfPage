<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1143.000" height="545.000" viewBox="15.000 63.000 1143.000 545.000" role="img"><title id="figure-title">总体指标变化：把权重和组内表现拆开</title><desc id="figure-desc">组内正确率固定在零点九和零点五，组权重交换后总体正确率从零点八二降至零点五八；条段显示加权贡献。 总体指标变化：把权重和组内表现拆开 下降来自评价人群组成；不能只看总体分数就判定模型退化。</desc><rect width="1143.0" height="545.0" fill="white" x="15.0" y="63.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="112" font-size="29" fill="#213447" text-anchor="start" font-weight="400">组内正确率固定：甲 0.9，乙 0.5</text><line x1="350" y1="180" x2="350" y2="510" stroke="#cbd9e4" stroke-width="1" /><text x="350" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0</text><line x1="540.0" y1="180" x2="540.0" y2="510" stroke="#cbd9e4" stroke-width="1" /><text x="540.0" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.25</text><line x1="730.0" y1="180" x2="730.0" y2="510" stroke="#cbd9e4" stroke-width="1" /><text x="730.0" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.5</text><line x1="920.0" y1="180" x2="920.0" y2="510" stroke="#cbd9e4" stroke-width="1" /><text x="920.0" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">0.75</text><line x1="1110" y1="180" x2="1110" y2="510" stroke="#cbd9e4" stroke-width="1" /><text x="1110" y="165" font-size="25" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="900" y="125" font-size="26" fill="#213447" text-anchor="start" font-weight="400">对总体正确率的贡献</text><text x="40" y="255" font-size="29" fill="#213447" text-anchor="start" font-weight="600">旧组成</text><text x="40" y="305" font-size="27" fill="#213447" text-anchor="start" font-weight="400">甲 0.8，乙 0.2</text><rect x="350" y="220" width="547.1999999999999" height="65" fill="#2865a0" /><rect x="897.1999999999999" y="220" width="76.0" height="65" fill="#c87536" /><text x="623.5999999999999" y="263" font-size="27" fill="white" text-anchor="middle" font-weight="400">0.72</text><text x="935.1999999999999" y="263" font-size="26" fill="white" text-anchor="middle" font-weight="400">0.10</text><text x="993.1999999999999" y="262" font-size="29" fill="#213447" text-anchor="start" font-weight="400">= 0.82</text><text x="40" y="435" font-size="29" fill="#213447" text-anchor="start" font-weight="600">新组成</text><text x="40" y="485" font-size="27" fill="#213447" text-anchor="start" font-weight="400">甲 0.2，乙 0.8</text><rect x="350" y="400" width="136.79999999999998" height="65" fill="#2865a0" /><rect x="486.79999999999995" y="400" width="304.0" height="65" fill="#c87536" /><text x="418.4" y="443" font-size="27" fill="white" text-anchor="middle" font-weight="400">0.18</text><text x="638.8" y="443" font-size="26" fill="white" text-anchor="middle" font-weight="400">0.40</text><text x="810.8000000000001" y="442" font-size="29" fill="#213447" text-anchor="start" font-weight="400">= 0.58</text><text x="350" y="580" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">甲：权重 × 0.9</text><text x="750" y="580" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">乙：权重 × 0.5</text></g></svg>

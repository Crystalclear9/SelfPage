<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">组别占比改变总体指标</title><desc id="desc">假设模型在两个群体内的正确率始终为 0.9 与 0.5，仅群体占比从 0.8/0.2 交换成 0.2/0.8，总体正确率就从 0.82 降至 0.58。 图使用小数表示权重比例，并没有把权重写成分数。它展示组成变化造成的统计变化；要区分模型退化与群体变化，应同时报告组内指标及评价人群的组成。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="605" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="40" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="75" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">组别占比改变总体指标</text><text x="75" y="112" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">群体内准确率固定；这里只改变评价人群的混合比例。</text><path d="M140,540 L1100,540" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="547" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M140,462.5 L1100,462.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="469.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.25</text><path d="M140,385 L1100,385" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="392" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.5</text><path d="M140,307.5 L1100,307.5" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="314.5" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.75</text><path d="M140,230 L1100,230" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="237" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">1</text><text x="80" y="190" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">正确率</text><text x="180" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">群体甲</text><rect x="230.0" y="261.0" width="91" height="279.0" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="275.5" y="247" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.9</text><rect x="330.0" y="261.0" width="91" height="279.0" fill="#d67c47" stroke="#d67c47" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="375.5" y="247" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.9</text><text x="480" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">群体乙</text><rect x="530.0" y="385.0" width="91" height="155.0" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="575.5" y="371" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.5</text><rect x="630.0" y="385.0" width="91" height="155.0" fill="#d67c47" stroke="#d67c47" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="675.5" y="371" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.5</text><text x="780" y="590" font-size="21" fill="#20384f" text-anchor="start" font-weight="400">总体</text><rect x="830.0" y="285.8" width="91" height="254.2" fill="#268d8c" stroke="#268d8c" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="875.5" y="271.8" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.82</text><rect x="930.0" y="360.20000000000005" width="91" height="179.79999999999995" fill="#d67c47" stroke="#d67c47" rx="6" stroke-linecap="round" stroke-linejoin="round" /><text x="975.5" y="346.2" font-size="23" fill="#20384f" text-anchor="middle" font-weight="400">0.58</text><rect x="180" y="635" width="23" height="13" fill="#268d8c" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="651" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">旧分布</text><rect x="570" y="635" width="23" height="13" fill="#d67c47" stroke="#cbd9e5" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="605" y="651" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">新分布</text><text x="140" y="690" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">旧权重：0.8 与 0.2</text><text x="140" y="719" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">新权重：0.2 与 0.8</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1129.000" height="594.000" viewBox="16.000 0.000 1129.000 594.000" role="img" aria-labelledby="title desc"><title id="title">不等宽直方图：从四个观测推导柱面积</title><desc id="desc">四个教学观测0.2,0.7,1.5,2.5，箱边界0,1,3。每箱2个，密度为0.5与0.25，面积都0.5。 </desc><rect width="1129.0" height="594.0" fill="white" x="16.0" y="0.0" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#24679c" /></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c66e30" /></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8a96" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#23384b"><text x="40" y="45" fill="#23384b" font-size="29" text-anchor="start" font-weight="400">四个观测；箱边界为 0、1、3</text><circle cx="211.0" cy="105" r="8" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="211.0" y="88" fill="#23384b" font-size="25" text-anchor="middle" font-weight="400">0.2</text><circle cx="351.0" cy="105" r="8" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="351.0" y="88" fill="#23384b" font-size="25" text-anchor="middle" font-weight="400">0.7</text><circle cx="575.0" cy="105" r="8" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="575.0" y="88" fill="#23384b" font-size="25" text-anchor="middle" font-weight="400">1.5</text><circle cx="855.0" cy="105" r="8" fill="#24679c" stroke="#24679c" stroke-width="2" /><text x="855.0" y="88" fill="#23384b" font-size="25" text-anchor="middle" font-weight="400">2.5</text><line x1="155" y1="120" x2="155" y2="475" stroke="#d9e3eb" stroke-width="1" stroke-dasharray="4 5" /><text x="155" y="505" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">0</text><line x1="435" y1="120" x2="435" y2="475" stroke="#d9e3eb" stroke-width="1" stroke-dasharray="4 5" /><text x="435" y="505" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">1</text><line x1="995" y1="120" x2="995" y2="475" stroke="#d9e3eb" stroke-width="1" stroke-dasharray="4 5" /><text x="995" y="505" fill="#23384b" font-size="27" text-anchor="middle" font-weight="400">3</text><rect x="155" y="215.0" width="280" height="250" fill="#dcecf7" stroke="#24679c" stroke-width="1.5" rx="3" /><rect x="435" y="340.0" width="560" height="125" fill="#fae7d7" stroke="#c66e30" stroke-width="1.5" rx="3" /><line x1="155" y1="465" x2="1040" y2="465" stroke="#7b8a96" stroke-width="2" marker-end="url(#g)" /><line x1="155" y1="465" x2="155" y2="150" stroke="#7b8a96" stroke-width="2" marker-end="url(#g)" /><text x="132" y="473" fill="#23384b" font-size="25" text-anchor="end" font-weight="400">0</text><text x="132" y="348.0" fill="#23384b" font-size="25" text-anchor="end" font-weight="400">0.25</text><text x="132" y="223.0" fill="#23384b" font-size="25" text-anchor="end" font-weight="400">0.5</text><text x="40" y="165" fill="#23384b" font-size="27" text-anchor="start" font-weight="400">概率密度</text><text x="295.0" y="300" fill="#24679c" font-size="30" text-anchor="middle" font-weight="400">面积 0.5</text><text x="715" y="400" fill="#c66e30" font-size="30" text-anchor="middle" font-weight="400">面积 0.5</text><text x="295.0" y="195" fill="#24679c" font-size="27" text-anchor="middle" font-weight="400">高 0.5</text><text x="715" y="320" fill="#c66e30" font-size="27" text-anchor="middle" font-weight="400">高 0.25</text><text x="200" y="565" fill="#24679c" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 1) = 0.5</text><text x="650" y="565" fill="#c66e30" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 2) = 0.25</text><text x="1040" y="505" fill="#23384b" font-size="27" text-anchor="start" font-weight="400">观测值</text></g></svg>

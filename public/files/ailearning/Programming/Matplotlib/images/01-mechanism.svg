<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">不等宽直方图：面积才对应概率</title><desc id="desc">这个算例有两个箱：[0,1) 与 [1,3]，每箱各有两个观测。柱高若都画成计数 2，宽箱的面积会变成窄箱的两倍，不能再把面积解释为概率。密度直方图将计数除以样本总数和箱宽，因此两箱高度分别是 0.5 与 0.25，面积都为 0.5。 横轴按真实箱宽绘制；柱高是概率密度而非概率，所有柱的面积之和为 1。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="140" width="1130" height="545.0" fill="#ffffff" stroke="#dce6ee" rx="18" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="36" width="7" height="48" fill="#268d8c" stroke="#268d8c" rx="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#20384f" text-anchor="start" font-weight="700">不等宽直方图：面积才对应概率</text><text x="67" y="111" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">每箱概率为 0.5；密度高度须再除以箱宽。</text><path d="M170,550 L1050,550" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="558" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0</text><path d="M170,400 L1050,400" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="408" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.25</text><path d="M170,250 L1050,250" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="258" font-size="20" fill="#5c7185" text-anchor="end" font-weight="400">0.5</text><rect x="170" y="250.0" width="280" height="300.0" fill="#bdded7" stroke="#507db3" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="310" y="232" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">高度 0.5</text><text x="310" y="625" font-size="24" fill="#268d8c" text-anchor="middle" font-weight="400">面积 0.5</text><rect x="450" y="400.0" width="560" height="150.0" fill="#ccdaed" stroke="#507db3" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="730" y="382" font-size="24" fill="#20384f" text-anchor="middle" font-weight="400">高度 0.25</text><text x="730" y="625" font-size="24" fill="#268d8c" text-anchor="middle" font-weight="400">面积 0.5</text><text x="170" y="587" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">0</text><text x="450" y="587" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">1</text><text x="1010" y="587" font-size="22" fill="#5c7185" text-anchor="middle" font-weight="400">3</text><path d="M170,550 L1050,550" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M170,190 L170,550" stroke="#20384f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="170" font-size="23" fill="#20384f" text-anchor="start" font-weight="400">概率密度</text><text x="1070" y="587" font-size="22" fill="#20384f" text-anchor="start" font-weight="400">数值</text></g></svg>

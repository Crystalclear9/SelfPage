 fill="#c26e34" font-size="30" text-anchor="middle" font-weight="400">面积 0.5</text><text x="295.0" y="195" fill="#2073ad" font-size="27" text-anchor="middle" font-weight="400">高 0.5</text><text x="715" y="320" fill="#c26e34" font-size="27" text-anchor="middle" font-weight="400">高 0.25</text><text x="200" y="565" fill="#2073ad" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 1) = 0.5</text><text x="650" y="565" fill="#c26e34" font-size="29" text-anchor="start" font-weight="400">2 ÷ (4 × 2) = 0.25</text><text x="1040" y="505" fill="#21374d" font-size="27" text-anchor="start" font-weight="400">观测值</text></g></svg>
<g id="round-20261105c-teaching" transform="translate(0 757.626) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">把同一柱形积分一次：直方图密度 → 区间概率</text><text x="60" y="120" font-size="28" fill="#1d3145" text-anchor="start">同一横轴：箱内均匀密度对应分段线性累计量</text><line x1="120" y1="325" x2="1250" y2="325" stroke="#818fa4" stroke-width="2" stroke-dasharray=""/><line x1="120" y1="325" x2="120" y2="145" stroke="#818fa4" stroke-width="2" stroke-dasharray=""/><path d="M120.000,325.000 L450.000,245.000" stroke="#1e7499" stroke-width="3" fill="none"/><path d="M450.000,245.000 L1110.000,165.000" stroke="#c66d3a" stroke-width="3" fill="none"/><circle cx="120" cy="325" r="6" fill="#1e7499" stroke="#1e7499" stroke-width="2"/><text x="120" y="370" font-size="27" fill="#1e7499" text-anchor="middle">0</text><circle cx="450" cy="245" r="6" fill="#1e7499" stroke="#1e7499" stroke-width="2"/><text x="450" y="290" font-size="27" fill="#1e7499" text-anchor="middle">1：F=0.5</text><circle cx="1110" cy="165" r="6" fill="#c66d3a" stroke="#c66d3a" stroke-width="2"/><text x="1110" y="210" font-size="27" fill="#c66d3a" text-anchor="middle">3：F=1</text><text x="220" y="190" font-size="29" fill="#1e7499" text-anchor="start">斜率 0.5</text><text x="690" y="150" font-size="29" fill="#c66d3a" text-anchor="start">斜率 0.25</text><text x="60" y="412" font-size="28" fill="#1d3145" text-anchor="start">在右箱只走一半宽度：P(1≤X&lt;2) = 0.25 × (2−1) = 0.25。</text></g></g></svg></svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="685" viewBox="0 0 1200 685" role="img"><title id="figure-title">因果平滑：每个均值仍属于一个明确时刻</title><desc id="figure-desc">四个原始损失四二三一；完整两点因果均值在时刻二三四分别为三二点五二。实线与虚线加直接名称共同区分序列。</desc><rect width="1200" height="685" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">因果平滑：每个均值仍属于一个明确时刻</text><text x="40" y="115" font-size="28" fill="#213447" text-anchor="start" font-weight="400">完整两点窗口才输出；平均值放在窗口右端</text><line x1="110" y1="485" x2="830" y2="485" stroke="#cbd9e4" stroke-width="2" /><text x="90" y="493" font-size="25" fill="#627689" text-anchor="end" font-weight="400">0</text><line x1="110" y1="405" x2="830" y2="405" stroke="#cbd9e4" stroke-width="2" /><text x="90" y="413" font-size="25" fill="#627689" text-anchor="end" font-weight="400">1</text><line x1="110" y1="325" x2="830" y2="325" stroke="#cbd9e4" stroke-width="2" /><text x="90" y="333" font-size="25" fill="#627689" text-anchor="end" font-weight="400">2</text><line x1="110" y1="245" x2="830" y2="245" stroke="#cbd9e4" stroke-width="2" /><text x="90" y="253" font-size="25" fill="#627689" text-anchor="end" font-weight="400">3</text><line x1="110" y1="165" x2="830" y2="165" stroke="#cbd9e4" stroke-width="2" /><text x="90" y="173" font-size="25" fill="#627689" text-anchor="end" font-weight="400">4</text><line x1="110" y1="165" x2="110" y2="485" stroke="#627689" stroke-width="2" /><line x1="110" y1="485" x2="830" y2="485" stroke="#627689" stroke-width="2" /><text x="110" y="525" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="350" y="525" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">2</text><text x="590" y="525" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">3</text><text x="830" y="525" font-size="26" fill="#627689" text-anchor="middle" font-weight="400">4</text><text x="40" y="150" font-size="27" fill="#213447" text-anchor="start" font-weight="400">损失</text><text x="610" y="570" font-size="27" fill="#213447" text-anchor="start" font-weight="400">训练时刻（示意）</text><polyline points="110,165 350,325 590,245 830,405" fill="none" stroke="#2865a0" stroke-width="3" /><circle cx="110" cy="165" r="7" fill="#2865a0" /><circle cx="350" cy="325" r="7" fill="#2865a0" /><circle cx="590" cy="245" r="7" fill="#2865a0" /><circle cx="830" cy="405" r="7" fill="#2865a0" /><polyline points="350,245 590,285.0 830,325" fill="none" stroke="#c87536" stroke-width="3" stroke-dasharray="8 6" /><circle cx="350" cy="245" r="7" fill="#c87536" /><circle cx="590" cy="285.0" r="7" fill="#c87536" /><circle cx="830" cy="325" r="7" fill="#c87536" /><text x="875" y="415" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">原始损失</text><text x="875" y="335" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">两点均值</text><text x="40" y="640" font-size="28" fill="#213447" text-anchor="start" font-weight="400">t=3：</text><text x="255.0" y="616" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2 + 3</text><line x1="180" y1="630" x2="330" y2="630" stroke="#2865a0" stroke-width="1.6" /><text x="255.0" y="664" font-size="28" fill="#2865a0" text-anchor="middle" font-weight="400">2</text><text x="348" y="639" font-size="29" fill="#2865a0" text-anchor="start" font-weight="400">= 2.5</text><text x="530" y="640" font-size="27" fill="#213447" text-anchor="start" font-weight="400">只读时刻 2、3，不读未来日志。</text></g></svg>

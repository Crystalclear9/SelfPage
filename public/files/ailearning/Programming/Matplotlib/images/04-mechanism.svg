<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="846" viewBox="0 0 1200 846" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">同样预测正确仍可分出概率质量</title>
<desc id="fig-desc">两次预测全部正确，P 离真实标签更近。用正方形面积和负对数两种方式比较。</desc>
<rect x="0" y="0" width="1200" height="846" fill="#ffffff" opacity="1"/>
<defs>
<linearGradient id="t" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf6f6"/></linearGradient>
<linearGradient id="r" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbede8"/></linearGradient>
<linearGradient id="v" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e6f2"/></linearGradient>
<linearGradient id="n" x2="0.85" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
</defs>
<text x="74" y="58" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="31" text-anchor="start" font-weight="600">分类都正确，概率质量还可以不同</text>
<text x="74" y="173" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">真实 y = 1</text>
<path d="M264 166 L853 166" fill="none" stroke="#233b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M853 166 L842 171 L842 161 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="203" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0</text>
<text x="552" y="203" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0.5</text>
<text x="840" y="203" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">1</text>
<circle cx="782.4" cy="166" r="6.4" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<text x="782.4" y="145" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">P 0.9</text>
<path d="M782.4 228 L840 228" fill="none" stroke="#166d75" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="604.6" y="161" width="10" height="10" fill="#a74d3a" opacity="1"/>
<text x="609.6" y="145" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">Q 0.6</text>
<path d="M609.6 238 L840 238" fill="none" stroke="#a74d3a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="309" fill="#233b4a" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="23" text-anchor="start" font-weight="400">真实 y = 0</text>
<path d="M264 302 L853 302" fill="none" stroke="#233b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M853 302 L842 307 L842 297 Z" fill="#233b4a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="339" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0</text>
<text x="552" y="339" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">0.5</text>
<text x="840" y="339" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" font-weight="400">1</text>
<circle cx="321.6" cy="302" r="6.4" fill="#ffffff" stroke="#166d75" stroke-width="3"/>
<text x="321.6" y="281" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">P 0.1</text>
<path d="M321.6 364 L264 364" fill="none" stroke="#166d75" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

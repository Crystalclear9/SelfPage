<rect x="805" y="523" width="137" height="62" fill="#ecf6f6" opacity="1"/>
<text x="873.5" y="562" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.01</text>
<rect x="946" y="523" width="137" height="62" fill="#ecf6f6" opacity="1"/>
<text x="1014.5" y="562" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.105361</text>
<text x="789" y="562" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">P</text>
<rect x="805" y="589" width="137" height="62" fill="#fbede8" opacity="1"/>
<text x="873.5" y="628" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.16</text>
<rect x="946" y="589" width="137" height="62" fill="#fbede8" opacity="1"/>
<text x="1014.5" y="628" fill="#a74d3a" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" font-weight="400">0.510826</text>
<text x="789" y="628" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="end" font-weight="400">Q</text>
<text x="873.5" y="509" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">Brier</text>
<text x="1014.5" y="509" fill="#526976" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" font-weight="400">NLL</text>
<text x="74" y="760" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">边长比 1:4，平方对应的面积比为 1:16。</text>
<text x="74" y="806" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">Brier 取平方距离；NLL 取真实类别概率的负对数。</text>
</svg>

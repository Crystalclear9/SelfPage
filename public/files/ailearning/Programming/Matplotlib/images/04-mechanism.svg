<svg xmlns="http://www.w3.org/2000/svg" width="1347.208" height="949.200" viewBox="38.750 78.777 1347.208 949.200"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5668" stroke-width="1.5" /></marker></defs><rect width="1347.208" height="949.2" fill="white" x="38.75" y="78.777" /><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#193a4e"><text xml:space="preserve" x="70" y="135" font-size="30" fill="#193a4e" text-anchor="start" font-weight="400">同一批两条记录；P 为蓝圆，Q 为橙方；阈值固定 0.5</text><text xml:space="preserve" x="70" y="225" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">真实标签 y = 1</text><line x1="150" y1="320" x2="1350" y2="320" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><line x1="150" y1="311" x2="150" y2="329" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="150" y="370" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><line x1="750.0" y1="311" x2="750.0" y2="329" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="750.0" y="370" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0.5</text><line x1="1350" y1="311" x2="1350" y2="329" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="1350" y="370" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><line x1="750.0" y1="250" x2="750.0" y2="345" stroke="#8ca5b4" stroke-width="2" stroke-dasharray="8 6" /><circle cx="1230.0" cy="320" r="11" fill="#2676ad" stroke="none" stroke-width="2" /><rect x="860.0" y="310" width="20" height="20" rx="0" fill="#d17a30" stroke="#d17a30" stroke-width="2" /><text xml:space="preserve" x="1230.0" y="290" font-size="28" fill="#2676ad" text-anchor="middle" font-weight="400">P 0.9</text><text xml:space="preserve" x="870.0" y="290" font-size="28" fill="#b26122" text-anchor="middle" font-weight="400">Q 0.6</text><line x1="1230.0" y1="415" x2="1350" y2="415" stroke="#2676ad" stroke-width="5" stroke-dasharray="" /><line x1="870.0" y1="460" x2="1350" y2="460" stroke="#d17a30" stroke-width="5" stroke-dasharray="" /><text xml:space="preserve" x="1290.0" y="405" font-size="26" fill="#2676ad" text-anchor="middle" font-weight="400">距离 0.1</text><text xml:space="preserve" x="1110.0" y="505" font-size="26" fill="#b26122" text-anchor="middle" font-weight="400">距离 0.4</text><text xml:space="preserve" x="70" y="505" font-size="31" fill="#193a4e" text-anchor="start" font-weight="700">真实标签 y = 0</text><line x1="150" y1="600" x2="1350" y2="600" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><line x1="150" y1="591" x2="150" y2="609" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="150" y="650" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0</text><line x1="750.0" y1="591" x2="750.0" y2="609" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="750.0" y="650" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">0.5</text><line x1="1350" y1="591" x2="1350" y2="609" stroke="#8ca5b4" stroke-width="3" stroke-dasharray="" /><text xml:space="preserve" x="1350" y="650" font-size="26" fill="#193a4e" text-anchor="middle" font-weight="400">1</text><line x1="750.0" y1="530" x2="750.0" y2="625" stroke="#8ca5b4" stroke-width="2" stroke-dasharray="8 6" /><circle cx="270.0" cy="600" r="11" fill="#2676ad" stroke="none" stroke-width="2" /><rect x="620.0" y="590" width="20" height="20" rx="0" fill="#d17a30" stroke="#d17a30" stroke-width="2" /><text xml:space="preserve" x="270.0" y="570" font-size="28" fill="#2676ad" text-anchor="middle" font-weight="400">P 0.1</text><text xml:space="preserve" x="630.0" y="570" font-size="28" fill="#b26122" text-anchor="middle" font-weight="400">Q 0.4</text><line x1="270.0" y1="695" x2="150" y2="695" stroke="#2676ad" stroke-width="5" stroke-dasharray="" /><line x1="630.0" y1="740" x2="150" y2="740" stroke="#d17a30" stroke-width="5" stroke-dasharray="" /><text xml:space="preserve" x="210.0" y="685" font-size="26" fill="#2676ad" text-anchor="middle" font-weight="400">距离 0.1</text><text xml:space="preserve" x="390.0" y="785" font-size="26" fill="#b26122" text-anchor="middle" font-weight="400">距离 0.4</text><text xml:space="preserve" x="70" y="885" font-size="30" fill="#193a4e" text-anchor="start" font-weight="700">距离平方 → 单条损失</text><rect x="610" y="925" width="40" height="40" rx="0" fill="#dcebf6" stroke="#2676ad" stroke-width="2" /><rect x="930" y="835" width="160" height="160" rx="0" fill="#fff0e4" stroke="#d17a30" stroke-width="2" /><text xml:space="preserve" x="670" y="955" font-size="30" fill="#2676ad" text-anchor="start" font-weight="400">0.1² = 0.01</text><text xml:space="preserve" x="1120" y="925" font-size="30" fill="#b26122" text-anchor="start" font-weight="400">0.4² = 0.16</text></g><desc> 阈值把两者都判对，平方距离仍相差十六倍 两条记录的平方距离相同，因此平均 Brier 仍分别为 0.01 与 0.16；小样本不能证明总体校准。</desc></svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1508.9413" viewBox="0 0 1440 1508.9413" role="img" aria-labelledby="book-plate-title"><title id="book-plate-title">同样分类正确，概率质量仍可不同</title><rect width="1440" height="1508.9413" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="48" y="36" width="5" height="37" rx="2.5" fill="#526bab"/><text x="71" y="66" font-size="38" font-weight="700" fill="#142b45">同样分类正确，概率质量仍可不同</text><path d="M48 89 H1392" stroke="#d7e1ee" stroke-width="1.4"/></g><svg width="1344" height="1366.9413" viewBox="0 0 1440 1464.58" role="img" x="48" y="106" overflow="hidden"><defs><linearGradient id="book-wash-fff0e4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0e4"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-edf5f8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf5f8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient><linearGradient id="book-wash-fff1e7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/></linearGradient></defs><title>04-构建模型诊断图与图表交付</title><svg width="1440" height="1014.58" viewBox="38.750 78.777 1347.208 949.200"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3b5f75" stroke-width="1.5"/></marker></defs><rect width="1347.208" height="949.2" fill="white" x="38.75" y="78.777"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#1f3348"><text xml:space="preserve" x="70" y="135" font-size="30" fill="#1f3348" text-anchor="start" font-weight="400">同一批两条记录；P 为蓝圆，Q 为橙方；阈值固定 0.5</text><text xml:space="preserve" x="70" y="225" font-size="31" fill="#1f3348" text-anchor="start" font-weight="700">真实标签 y = 1</text><line x1="150" y1="320" x2="1350" y2="320" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="311" x2="150" y2="329" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="150" y="370" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><line x1="750.0" y1="311" x2="750.0" y2="329" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="750.0" y="370" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">0.5</text><line x1="1350" y1="311" x2="1350" y2="329" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="1350" y="370" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><line x1="750.0" y1="250" x2="750.0" y2="345" stroke="#8e9fb9" stroke-width="2" stroke-dasharray="8 6"/><circle cx="1230.0" cy="320" r="11" fill="#2181bf" stroke="none" stroke-width="2"/><rect x="860.0" y="310" width="20" height="20" rx="0" fill="#cd7834" stroke="#cd7834" stroke-width="2"/><text xml:space="preserve" x="1230.0" y="290" font-size="28" fill="#2181bf" text-anchor="middle" font-weight="400">P 0.9</text><text xml:space="preserve" x="870.0" y="290" font-size="28" fill="#ae6026" text-anchor="middle" font-weight="400">Q 0.6</text><line x1="1230.0" y1="415" x2="1350" y2="415" stroke="#2181bf" stroke-width="5" stroke-dasharray=""/><line x1="870.0" y1="460" x2="1350" y2="460" stroke="#cd7834" stroke-width="5" stroke-dasharray=""/><text xml:space="preserve" x="1290.0" y="405" font-size="26" fill="#2181bf" text-anchor="middle" font-weight="400">距离 0.1</text><text xml:space="preserve" x="1110.0" y="505" font-size="26" fill="#ae6026" text-anchor="middle" font-weight="400">距离 0.4</text><text xml:space="preserve" x="70" y="505" font-size="31" fill="#1f3348" text-anchor="start" font-weight="700">真实标签 y = 0</text><line x1="150" y1="600" x2="1350" y2="600" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="591" x2="150" y2="609" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="150" y="650" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">0</text><line x1="750.0" y1="591" x2="750.0" y2="609" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="750.0" y="650" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">0.5</text><line x1="1350" y1="591" x2="1350" y2="609" stroke="#8e9fb9" stroke-width="3" stroke-dasharray=""/><text xml:space="preserve" x="1350" y="650" font-size="26" fill="#1f3348" text-anchor="middle" font-weight="400">1</text><line x1="750.0" y1="530" x2="750.0" y2="625" stroke="#8e9fb9" stroke-width="2" stroke-dasharray="8 6"/><circle cx="270.0" cy="600" r="11" fill="#2181bf" stroke="none" stroke-width="2"/><rect x="620.0" y="590" width="20" height="20" rx="0" fill="#cd7834" stroke="#cd7834" stroke-width="2"/><text xml:space="preserve" x="270.0" y="570" font-size="28" fill="#2181bf" text-anchor="middle" font-weight="400">P 0.1</text><text xml:space="preserve" x="630.0" y="570" font-size="28" fill="#ae6026" text-anchor="middle" font-weight="400">Q 0.4</text><line x1="270.0" y1="695" x2="150" y2="695" stroke="#2181bf" stroke-width="5" stroke-dasharray=""/><line x1="630.0" y1="740" x2="150" y2="740" stroke="#cd7834" stroke-width="5" stroke-dasharray=""/><text xml:space="preserve" x="210.0" y="685" font-size="26" fill="#2181bf" text-anchor="middle" font-weight="400">距离 0.1</text><text xml:space="preserve" x="390.0" y="785" font-size="26" fill="#ae6026" text-anchor="middle" font-weight="400">距离 0.4</text><text xml:space="preserve" x="70" y="885" font-size="30" fill="#1f3348" text-anchor="start" font-weight="700">距离平方 → 单条损失</text><rect x="610" y="925" width="40" height="40" rx="0" fill="#ddebf5" stroke="#2181bf" stroke-width="2"/><rect x="930" y="835" width="160" height="160" rx="0" fill="url(#book-wash-fff0e4)" stroke="#cd7834" stroke-width="2"/><text xml:space="preserve" x="670" y="955" font-size="30" fill="#2181bf" text-anchor="start" font-weight="400">0.1² = 0.01</text><text xml:space="preserve" x="1120" y="925" font-size="30" fill="#ae6026" text-anchor="start" font-weight="400">0.4² = 0.16</text></g><desc> 阈值把两者都判对，平方距离仍相差十六倍 两条记录的平方距离相同，因此平均 Brier 仍分别为 0.01 与 0.16；小样本不能证明总体校准。</desc></svg>
<g id="round-20261105c-teaching" transform="translate(0 1014.58) scale(1)"><g font-family="Microsoft YaHei, sans-serif"><rect width="1440" height="450" fill="white"/><line x1="55" y1="5" x2="1385" y2="5" stroke="#dce2eb" stroke-width="2" stroke-dasharray=""/><text x="55" y="62" font-size="32" fill="#1d3145" text-anchor="start">同一正确类别的概率：Brier 与对数损失都能继续区分</text><text x="60" y="174" font-size="28" fill="#1d3145" text-anchor="start">P：Brier</text><rect x="310" y="140" width="22.0" height="44" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="347.0" y="174" font-size="28" fill="#1d3145" text-anchor="start">0.01</text><text x="60" y="244" font-size="28" fill="#1d3145" text-anchor="start">Q：Brier</text><rect x="310" y="210" width="352.0" height="44" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="677.0" y="244" font-size="28" fill="#1d3145" text-anchor="start">0.16</text><text x="750" y="174" font-size="28" fill="#1d3145" text-anchor="start">P：NLL</text><rect x="1000" y="140" width="52.68025782891314" height="44" fill="url(#book-wash-edf5f8)" stroke="#1e7499"/><text x="1067.6802578289132" y="174" font-size="28" fill="#1d3145" text-anchor="start">0.105361</text><text x="750" y="244" font-size="28" fill="#1d3145" text-anchor="start">Q：NLL</text><rect x="1000" y="210" width="255.41281188299536" height="44" fill="url(#book-wash-fff1e7)" stroke="#c66d3a"/><text x="1270.4128118829954" y="244" font-size="28" fill="#1d3145" text-anchor="start">0.510826</text><text x="60" y="390" font-size="28" fill="#1d3145" text-anchor="start">两条记录均正确；P 给真类 0.9，Q 给真类 0.6；均值仍分别为上述数值。</text></g></g></svg></svg>

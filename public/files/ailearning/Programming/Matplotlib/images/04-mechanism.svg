<path d="M494.4 374 L264 374" fill="none" stroke="#a74d3a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="909" y="201" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">点到真实端点的距离</text>
<text x="909" y="251" fill="#526976" font-family="SimSun, Noto Serif CJK SC, Songti SC, Microsoft YaHei, serif" font-size="22" text-anchor="start" font-weight="400">P 为 0.1，Q 为 0.4。</text>
<path d="M75 411 L1125 411" fill="none" stroke="#dbe8eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

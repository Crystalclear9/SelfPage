<rect x="155" y="607" width="31" height="31" fill="#ecf6f6" opacity="1"/>
<path d="M155 607 L186 607 L186 638 L155 638 Z" fill="none" stroke="#166d75" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
<text x="155" y="674" fill="#166d75" font-family="Cambria Math, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" font-weight="400">P：0.01</text>
<rect x="394" y="514" width="124" height="124" fill="#fbede8" opacity="1"/>

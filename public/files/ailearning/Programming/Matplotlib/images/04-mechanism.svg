<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448.34" viewBox="11.00 10.18 1119.00 418.08" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">同样分类正确，概率质量仍可不同</title><desc id="desc">在两个样本上，两模型都给正类更高分，并且在 0.5 阈值下全部判对，但 Q 的概率更靠近 0.5。逐行计算预测概率与真实标签之差的平方，再平均，得到两个不同的 Brier 分数。 这两个点足以区分分类准确率和概率损失，不能据此估计总体校准曲线；Brier 同时受校准与分辨能力影响。 二分类 Brier 取正类概率平方误差，按样本求均值。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="530" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">同样分类正确，概率质量仍可不同</text><rect x="60.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">真实 y</text><rect x="330.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">模型 P 的 p</text><rect x="600.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">模型 Q 的 p</text><rect x="870.0" y="165" width="270.0" height="65" fill="#eaf2fa" stroke="white" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="193" font-size="24" fill="#213447" text-anchor="start" font-weight="400">平方误差 P / Q</text><rect x="60.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">1</text><rect x="330.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.9</text><rect x="600.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.6</text><rect x="870.0" y="230" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="260" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.01 与 0.16</text><rect x="60.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0</text><rect x="330.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.1</text><rect x="600.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.4</text><rect x="870.0" y="295" width="270.0" height="65" fill="#ffffff" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="325" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.01 与 0.16</text><rect x="60.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">平均 Brier</text><rect x="330.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.01</text><rect x="600.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">0.16</text><rect x="870.0" y="360" width="270.0" height="65" fill="#f0f6fa" stroke="#d9e4ec" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="885" y="390" font-size="24" fill="#213447" text-anchor="start" font-weight="400">阈值 0.5 均分类正确</text></g></svg>

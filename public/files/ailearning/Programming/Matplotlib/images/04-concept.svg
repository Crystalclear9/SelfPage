<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="486.32" viewBox="-10.03 -15.00 1081.45 438.28" role="img"><title id="detail-title">机制展开：四条预测记录既能形成校准点，也能用于阈值代价比较</title><desc id="detail-desc">四条预测记录既能形成校准点，也能用于阈值代价比较。两箱的实际正例率都是 0.5，平均预测分别为 0.3 和 0.7；在误报代价 4、漏报代价 1 的设定下，阈值 0.7 的总成本最低。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="20" y="55" width="245" height="210" rx="7" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><rect x="20" y="55" width="245" height="36" rx="6" fill="#eaf2fa" stroke="#cbd9e4" stroke-width="1.3" /><text x="32" y="80" font-size="24" fill="#2865a0" font-weight="600" text-anchor="start">逐样本预测</text><text x="34" y="122" font-size="24" fill="#213447" font-weight="400" text-anchor="start">a: y=1, p=0.8</text><text x="34" y="153" font-size="24" fill="#213447" font-weight="400" text-anchor="start">b: y=0, p=0.6</text><text x="34" y="184" font-size="24" fill="#213447" font-weight="400" text-anchor="start">c: y=1, p=0.4</text><text x="34" y="215" font-size="24" fill="#213447" font-weight="400" text-anchor="start">d: y=0, p=0.2</text><line x1="375" y1="335.0" x2="645" y2="335.0" stroke="#cbd9e4" stroke-width="1" /><text x="363" y="341.0" font-size="24" fill="#627689" font-weight="400" text-anchor="end">0</text><line x1="375" y1="205.0" x2="645" y2="205.0" stroke="#cbd9e4" stroke-wi
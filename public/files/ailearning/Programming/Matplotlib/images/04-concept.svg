<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img"><title>同一组预测：移动阈值，追踪每一个错误</title><rect width="1280" height="820" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#233943" text-anchor="start">同一组预测：移动阈值，追踪每一个错误</text><text x="45" y="110" font-size="26" fill="#276884" text-anchor="start">● 正类 y=1</text><text x="280" y="110" font-size="26" fill="#b25d2b" text-anchor="start">■ 负类 y=0</text><text x="665" y="110" font-size="26" fill="#233943" text-anchor="start">误报 1 分；漏报 4 分</text><rect x="377.0" y="153" width="483.0" height="88" fill="#edf4f7" stroke="#edf4f7" stroke-width="2"/><line x1="170" y1="205" x2="860" y2="205" stroke="#697d87" stroke-width="2" stroke-dasharray=""/><line x1="377.0" y1="145" x2="377.0" y2="235" stroke="#276884" stroke-width="2" stroke-dasharray="6 5"/><text x="40" y="210" font-size="28" fill="#276884" text-anchor="start">t=0.3</text><rect x="300.0" y="197" width="16" height="16" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="308.0" y="180" font-size="24" fill="#233943" text-anchor="middle">d · 0.2</text><circle cx="446.0" cy="205" r="9" fill="#276884"/><text x="446.0" y="180" font-size="24" fill="#233943" text-anchor="middle">c · 0.4</text><rect x="576.0" y="197" width="16" height="16" fill="#b25d2b" stroke="#b25d2b" stroke-width="2"/><text x="584.0" y="180" font-size="24" fill="#233943" text-anchor="middle">b · 0.6</text><text x="584.0" y="245" font-size="24" fill="#b25d2b" text-anchor="middle">误报</text><circle cx="722.0" cy="205" r="9" fill="#276884"/><text x="722.0" y="180" font-size="24" fill="#233943" text-anchor="middle">a · 0.8</text><text x="940" y="190" font-size="28" fill="#233943" text-anchor="start">FP=1   FN=0</text><text x="940" y="230" font-size="30" fill="#276884" text-anchor="start">成本 = 1</text><rect x="515.0" y="303" width="345.0" height="88" fill="#edf4f7" stroke="#edf4f7" stroke-width="2"/><line x1="170" y1="355" 
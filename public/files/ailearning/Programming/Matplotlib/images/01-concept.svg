<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>同一个点在两种显示原点下的坐标</title><rect width="1800" height="1000" fill="white"/><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176b91" stroke-width="2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d87332" stroke-width="2"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#80929d" stroke-width="2"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#218579" stroke-width="2"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="420.0" y="90" font-size="36" fill="#176b91" text-anchor="middle" font-weight="700">从左下计量</text><rect x="80" y="200" width="680.0" height="340.0" rx="0" fill="white" stroke="#176b91" stroke-width="2"/><rect x="165.0" y="268.0" width="510.0" height="204.0" rx="0" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><circle cx="292.5" cy="319.0" r="11" fill="#176b91" stroke="#176b91" stroke-width="2"/><text x="317.5" y="299.0" font-size="31" fill="#176b91" text-anchor="start" font-weight="400">(0.25, 0.75)</text><line x1="80" y1="319.0" x2="292.5" y2="319.0" stroke="#176b91" stroke-width="2" stroke-dasharray="6 6"/><line x1="292.5" y1="319.0" x2="292.5" y2="540.0" stroke="#176b91" stroke-width="2" stroke-dasharray="6 6"/><line x1="80" y1="540.0" x2="80" y2="200" stroke="#176b91" stroke-width="3" marker-end="url(#b)"/><text x="70" y="580.0" font-size="27" fill="#176b91" text-anchor="start" font-weight="400">(0, 0)</text><text x="292.5" y="620.0" font-size="30" fill="#176b91" text-anchor="middle" font-weight="400">X = 250</text><text x="420.0" y="665" font-size="36" fill="#176b91" text-anchor="middle" font-weight="400">Y = 260</text><text x="420.0" y="750" font-size="31" fill="#203b4a" text-anchor="middle" font-weight="400">100 + 600 × 0.25 = 250</text><text x="420.0" y="815" font-size="31" fill="#203b4a" text-anchor="middle" font-weight="400">80 + 240 × 0.75 = 260</text><text x="1340.0" y="90" font-size="36" fill="#d87332" text-anchor="middle" font-weight="700">从左上计量</text><rect x="1000" y="200" width="680.0" height="340.0" rx="0" fill="white" stroke="#d87332" stroke-width="2"/><rect x="1085.0" y="268.0" width="510.0" height="204.0" rx="0" fill="#eaf4fa" stroke="#d9e4ea" stroke-width="2"/><circle cx="1212.5" cy="319.0" r="11" fill="#d87332" stroke="#d87332" stroke-width="2"/><text x="1237.5" y="299.0" font-size="31" fill="#d87332" text-anchor="start" font-weight="400">(0.25, 0.75)</text><line x1="1000" y1="319.0" x2="1212.5" y2="319.0" stroke="#d87332" stroke-width="2" stroke-dasharray="6 6"/><line x1="1212.5" y1="319.0" x2="1212.5" y2="200" stroke="#d87332" stroke-width="2" stroke-dasharray="6 6"/><line x1="1000" y1="200" x2="1000" y2="540.0" stroke="#d87332" stroke-width="3" marker-end="url(#o)"/><text x="990" y="175" font-size="27" fill="#d87332" text-anchor="start" font-weight="400">(0, 0)</text><text x="1212.5" y="620.0" font-size="30" fill="#d87332" text-anchor="middle" font-weight="400">X = 250</text><text x="1340.0" y="665" font-size="36" fill="#d87332" text-anchor="middle" font-weight="400">Y = 140</text><text x="1340.0" y="750" font-size="31" fill="#203b4a" text-anchor="middle" font-weight="400">100 + 600 × 0.25 = 250</text><text x="1340.0" y="815" font-size="31" fill="#203b4a" text-anchor="middle" font-weight="400">400 − 260 = 140</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="detail-title detail-desc" width="1200" height="500" viewBox="-16 -15 1136 474" role="img"><title id="detail-title">机制展开：先定位 Figure 内的 Axes，再把数据坐标转换为像素坐标</title><desc id="detail-desc">先定位 Figure 内的 Axes，再把数据坐标转换为像素坐标。示例 Axes 的左下角为 (100,80)，大小为 600×240，故数据中心 (0.5,0.5) 映射到 (400,200)；坐标系与边距会影响标注位置。</desc><rect x="-16" y="-15" width="1136" height="474" fill="white" /><defs><marker id="detail-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="detail-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#cf7432" /></marker><marker id="detail-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#158476" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="40" y="45" width="720" height="360" rx="8" fill="white" stroke="#cbd9e4" stroke-width="1.3" /><text x="60" y="77" font-size="25" fill="#2865a0" font-weight="600" text-anchor="start">Figure：800 × 400 像素（示意）</text><rect x="130" y="120" width="540" height="216" rx="0" fill="#eaf2fa" stroke="#2865a0" stroke-width="1.3" /><line x1="265" y1="120" x2="265" y2="336" stroke="#cbd9e4" stroke-width="2" /><line x1="130" y1="174" x2="670" y2="174" stroke="#cbd9e4" stroke-width="2" /><line x1="400" y1="120" x2="400" y2="336" stroke="#cbd9e4" stroke-width="2" /><line x1="130" y1="228" x2="670" y2="228" stroke="#cbd9e4" stroke-width="2" /><line x1="535" y1="120" x2="535" y2="336" stroke="#cbd9e4" stroke-width="2" /><line x1="130" y1="282" x2="670" y2="282" stroke="#cbd9e4" stroke-width="2" /><circle cx="400" cy="228" r="10" fill="#cf7432" stroke="white" stroke-width="2" /><line x1="400" y1="120" x2="400" y2="336" stroke="#cf7432" stroke-width="2" stroke-dasharray="4 4" /><line x1="130" y1="228" x2="670" y2="228" stroke="#cf7432" stroke-width="2" stroke-dasharray="4 4" /><text x="140" y="365" font-size="22" fill="#213447" font-weight="400" text-anchor="start">Axes：左下 (100,80)，宽 600，高 240</text><text x="795" y="125" font-size="24" fill="#213447" font-weight="400" text-anchor="start">数据范围 [0,1]²</text><text x="795" y="185" font-size="24" fill="#cf7432" font-weight="600" text-anchor="start">数据点 (0.5,0.5)</text><text x="795" y="260" font-size="24" fill="#213447" font-weight="400" text-anchor="start">映射到像素</text><text x="795" y="305" font-size="29" fill="#2865a0" font-weight="600" text-anchor="start">(400,200)</text></g></svg>

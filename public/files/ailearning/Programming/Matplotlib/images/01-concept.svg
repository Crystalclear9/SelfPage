<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title id="figure-title">坐标原点改变，数据点的位置并没有改变</title><desc id="figure-desc">数据点零点二五、零点七五在Agg显示坐标中是二百五十、二百六十；从图像上边缘向下计量时写成二百五十、一百四十。原点约定改变而物理位置不变。</desc><rect width="1200" height="700" fill="white" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="48" font-size="32" fill="#213447" text-anchor="start" font-weight="600">坐标原点改变，数据点的位置并没有改变</text><text x="40" y="112" font-size="27" fill="#213447" text-anchor="start" font-weight="400">Agg：画布 800×400，Axes 左下 (100,80)，大小 600×240</text><text x="45" y="175" font-size="29" fill="#2865a0" text-anchor="start" font-weight="600">显示坐标：从左下计量</text><rect x="75" y="220" width="440.00000000000006" height="220.00000000000003" rx="6" fill="white" stroke="#2865a0" stroke-width="1.5" /><rect x="130.0" y="264.0" width="330.0" height="132.0" fill="#eaf2fa" stroke="#cbd9e4" /><circle cx="212.5" cy="297.0" r="7" fill="#2865a0" /><path d="M75 440.0 L75 232" fill="none" stroke="#2865a0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text x="83" y="475.0" font-size="25" fill="#2865a0" text-anchor="start" font-weight="400">(0,0)</text><text x="45" y="505" font-size="28" fill="#2865a0" text-anchor="start" font-weight="400">显示位置：(250,260)</text><text x="650" y="175" font-size="29" fill="#c87536" text-anchor="start" font-weight="600">图像平面：从左上计量</text><rect x="680" y="220" width="440.00000000000006" height="220.00000000000003" rx="6" fill="white" stroke="#c87536" stroke-width="1.5" /><rect x="735.0" y="264.0" width="330.0" height="132.0" fill="#eaf2fa" stroke="#cbd9e4" /><circle cx="817.5" cy="297.0" r="7" fill="#c87536" /><path d="M680 220 L680 428.0" fill="none" stroke="#c87536" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="688" y="206" font-size="25" fill="#c87536" text-anchor="start" font-weight="400">(0,0)</text><text x="650" y="505" font-size="28" fill="#c87536" text-anchor="start" font-weight="400">上边缘起算：(250,140)</text><text x="40" y="580" font-size="28" fill="#213447" text-anchor="start" font-weight="400">同一数据点：(0.25,0.75)；左右两图中的位置没有改变。</text><text x="40" y="645" font-size="27" fill="#213447" text-anchor="start" font-weight="400">250=100+600×0.25；260=80+240×0.75；140=400−260</text></g></svg>

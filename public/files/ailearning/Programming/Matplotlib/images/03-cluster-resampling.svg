<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-desc" width="1153.000" height="681.000" viewBox="31.000 97.000 1153.000 681.000" role="img"><title id="figure-title">相关结构：误差条必须先认清独立单位</title><desc id="figure-desc">9个观测有三块相关矩阵，每块对角1、非对角0.8，块间0。设单次观测方差5，实际总体均值方差13/9，而误当独立时为5/9。 相关结构：误差条必须先认清独立单位 患者数仍是 3；9 行记录并未变成 9 个独立重复</desc><rect width="1153.0" height="681.0" fill="white" x="31.0" y="97.0" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2865a0" /></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#c87536" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="55" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">9 次观测：3 位患者，每位 3 次</text><text x="665" y="145" font-size="28" fill="#213447" text-anchor="start" font-weight="400">单次方差 5；同患者相关 0.8</text><rect x="160" y="235" width="38" height="38" fill="#2865a0" /><rect x="200" y="235" width="38" height="38" fill="#8cb3d4" /><rect x="240" y="235" width="38" height="38" fill="#8cb3d4" /><rect x="280" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="320" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="360" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="400" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="440" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="480" y="235" width="38" height="38" fill="#f2f5f8" /><rect x="160" y="275" width="38" height="38" fill="#8cb3d4" /><rect x="200" y="275" width="38" height="38" fill="#2865a0" /><rect x="240" y="275" width="38" height="38" fill="#8cb3d4" /><rect x="280" y="275" width="38" height="38" fill="#f2f5f8" /><rect x="320" y="275" width="38" height="38" fill="#f2f5f8" /><rect x="360" y="275" width="38" height="38" fill="#f2f5f8" /><rect x="400" y="275" width="38" height="38" fi
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744.14" viewBox="11.52 10.00 1109.47 688.00" role="img" aria-labelledby="title desc"><rect width="100%" height="100%" fill="white" data-white-background="true" /><title id="title">异方差：零均值不代表误差尺度恒定</title><desc id="desc">每个横坐标都有一对正负对称残差，局部均值均为零，但残差绝对值随横坐标扩大。只看均值线会漏掉这种扇形结构；应同时检查离散程度、分箱残差或适合的方差模型。 这是一组人为构造的诊断反例，不是显著性检验；横轴代表预测值，纵轴为真实值减预测值。 散点仅示意条件尺度变化，不能从样本外观证明条件均值为零。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#507db3" /></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="720" fill="white" stroke="none" rx="0" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="70" font-size="30" fill="#213447" text-anchor="start" font-weight="700">异方差：零均值不代表误差尺度恒定</text><path d="M130,545 L1090,545" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="552" font-size="24" fill="#627689" text-anchor="end" font-weight="400">-4</text><path d="M130,455 L1090,455" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="462" font-size="24" fill="#627689" text-anchor="end" font-weight="400">-2</text><path d="M130,365 L1090,365" stroke="#8ba6b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="372" font-size="24" fill="#627689" text-anchor="end" font-weight="400">0</text><path d="M130,275 L1090,275" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="282" font-size="24" fill="#627689" text-anchor="end" font-weight="400">2</text><path d="M130,185 L1090,185" stroke="#ccd9e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="113" y="192" font-size="24" fill="#627689" text-anchor="end" font-weight="400">4</text><text x="157.17" y="577" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">1</text><text x="459.057" y="577" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">2</text><text x="760.943" y="577" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">3</text><text x="1062.83" y="577" font-size="24" fill="#627689" text-anchor="middle" font-weight="400">4</text><path d="M130,545 L1090,545" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,185 L130,545" stroke="#213447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="160" font-size="24" fill="#627689" text-anchor="start" font-weight="400">残差 y−预测值</text><text x="1090" y="615" font-size="24" fill="#627689" text-anchor="end" font-weight="400">预测值</text><circle cx="157.17" cy="410.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="157.17" cy="320.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="459.06" cy="455.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="459.06" cy="275.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="760.94" cy="500.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="760.94" cy="230.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="545.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1062.83" cy="185.00" r="6" fill="#2865a0" stroke="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,653 L195,653" stroke="#2865a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="660" font-size="24" fill="#213447" text-anchor="start" font-weight="400">残差观测</text></g></svg>
